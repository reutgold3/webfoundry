 изменил её взгляд на пожилых людей.","ar":"يتطوّع كثير من المراهقين في إسرائيل في مجتمعهم بعد المدرسة. اختارت غال، وهي طالبة في الصف التاسع، مساعدة كبار السن في مركز في كفار سابا. في البداية كانت متوتّرة لأنها لم تكن تعرف عمّ تتحدّث. لكن بعد بضعة أسابيع أصبحت قريبة من امرأة اسمها رفكا. وُلدت رفكا في المغرب وجاءت إلى إسرائيل وهي فتاة صغيرة. روت لغال قصصًا كثيرة عن طفولتها. تقول غال إن هذه التجربة غيّرت نظرتها إلى كبار السن.","questions":[["Why was Gal nervous at first?","she didn't know what to talk about","she was afraid of old people","she was always late"],["Where was Rivka born?","in morocco","in kfar saba","in france"],["What has the experience changed?","the way gal sees older people","the way gal studies","the place where rivka lives"]]}},{"en":"careers","he":"קריירה ומקצועות","ru":"профессии","ar":"المهن","e":"💼","items":[{"en":"I'd like to become an engineer one day.","he":"הייתי רוצה להיות מהנדס/ת יום אחד.","ru":"Когда-нибудь я хотел бы стать инженером.","ar":"أودّ أن أصبح مهندسًا يومًا ما.","e":"","alt":[]},{"en":"If I were a doctor, I would help people in need.","he":"אם הייתי רופא/ה, הייתי עוזר/ת לאנשים נזקקים.","ru":"Если бы я был врачом, я бы помогал нуждающимся.","ar":"لو كنت طبيبًا، لساعدت المحتاجين.","e":"","alt":[]},{"en":"My dream job is designing video games.","he":"עבודת החלומות שלי היא עיצוב משחקי וידאו.","ru":"Работа моей мечты — создавать видеоигры.","ar":"وظيفة أحلامي هي تصميم ألعاب الفيديو.","e":"","alt":[]},{"en":"You need good communication skills for this job.","he":"צריך כישורי תקשורת טובים בשביל העבודה הזאת.","ru":"Для этой работы нужны хорошие коммуникативные навыки.","ar":"تحتاج إلى مهارات تواصل جيدة لهذه الوظيفة.","e":"","alt":[]},{"en":"My aunt used to teach, but now she's a lawyer.","he":"דודה שלי הייתה פעם מורה, אבל עכשיו היא עורכת דין.","ru":"Моя тётя раньше была учительницей, а теперь она юрист.","ar":"كانت عمّتي تعمل معلّمة في السابق، أما الآن فهي محامية.","e":"","alt":[]},{"en":"Choose a career that you are passionate about.","he":"בחר מקצוע שאתה באמת אוהב.","ru":"Выбирай профессию, которая тебя по-настоящему увлекает.","ar":"اختر مهنة تحبّها بشغف.","e":"","alt":[]}],"reading":{"en":"Last week, Yonatan's class visited a high-tech company in Herzliya. The employees explained how apps are developed and tested. Yonatan was surprised that many workers there used to do completely different jobs. One programmer, Dana, used to be a professional dancer. She said that if she could give students one piece of advice, it would be to never stop learning. Yonatan is not sure what he wants to do yet, but the visit made him think.","he":"בשבוע שעבר הכיתה של יונתן ביקרה בחברת הייטק בהרצליה. העובדים הסבירו איך מפתחים ובודקים אפליקציות. יונתן הופתע שעובדים רבים שם עסקו בעבר בעבודות שונות לגמרי. מתכנתת אחת, דנה, הייתה בעבר רקדנית מקצועית. היא אמרה שאם הייתה יכולה לתת לתלמידים עצה אחת, זו הייתה לעולם לא להפסיק ללמוד. יונתן עדיין לא בטוח מה הוא רוצה לעשות, אבל הביקור גרם לו לחשוב.","ru":"На прошлой неделе класс Йонатана посетил хай-тек компанию в Герцлии. Сотрудники объяснили, как разрабатывают и тестируют приложения. Йонатан удивился, что многие работники раньше занимались совсем другим. Одна программистка, Дана, раньше была профессиональной танцовщицей. Она сказала, что если бы могла дать ученикам один совет, то это был бы совет никогда не переставать учиться. Йонатан пока не знает, чем хочет заниматься, но визит заставил его задуматься.","ar":"في الأسبوع الماضي زار صفّ يوناتان شركة هايتك في هرتسليا. شرح الموظفون كيف يتم تطوير التطبيقات واختبارها. تفاجأ يوناتان بأن كثيرًا من العاملين هناك كانوا يعملون سابقًا في وظائف مختلفة تمامًا. إحدى المبرمجات، دانا، كانت راقصة محترفة في السابق. قالت إنها لو استطاعت أن تعطي الطلاب نصيحة واحدة، لكانت ألّا يتوقّفوا أبدًا عن التعلّم. لا يعرف يوناتان بعد ماذا يريد أن يعمل، لكن الزيارة جعلته يفكّر.","questions":[["Where is the company?","in herzliya","in haifa","in beer sheva"],["What did Dana use to be?","a professional dancer","a teacher","a doctor"],["What was Dana's advice to students?","never stop learning","work very hard","study computers"]]}},{"en":"israel","he":"ישראל","ru":"Израиль","ar":"إسرائيل","e":"🇮🇱","items":[{"en":"Israel is a small country with many different landscapes.","he":"ישראל היא מדינה קטנה עם נופים רבים ושונים.","ru":"Израиль — маленькая страна с множеством разных пейзажей.","ar":"إسرائيل بلد صغير فيه مناظر طبيعية كثيرة ومتنوّعة.","e":"","alt":[]},{"en":"The Dead Sea is the lowest place on Earth.","he":"ים המלח הוא המקום הנמוך ביותר על פני כדור הארץ.","ru":"Мёртвое море — самое низкое место на Земле.","ar":"البحر الميت هو أخفض مكان على وجه الأرض.","e":"","alt":[]},{"en":"Jerusalem is visited by millions of tourists every year.","he":"מיליוני תיירים מבקרים בירושלים בכל שנה.","ru":"Иерусалим ежегодно посещают миллионы туристов.","ar":"يزور القدسَ ملايينُ السيّاح كل عام.","e":"","alt":[]},{"en":"Many Israeli inventions are used all over the world.","he":"המצאות ישראליות רבות נמצאות בשימוש בכל העולם.","ru":"Многие израильские изобретения используются во всём мире.","ar":"تُستخدم اختراعات إسرائيلية كثيرة في جميع أنحاء العالم.","e":"","alt":[]},{"en":"If I could live anywhere in Israel, I'd choose the Galilee.","he":"אם הייתי יכול/ה לגור בכל מקום בישראל, הייתי בוחר/ת בגליל.","ru":"Если бы я мог жить где угодно в Израиле, я бы выбрал Галилею.","ar":"لو استطعت أن أعيش في أي مكان في إسرائيل، لاخترت الجليل.","e":"","alt":[]},{"en":"People from all over the world live here.","he":"אנשים מכל העולם גרים כאן.","ru":"Здесь живут люди со всего мира.","ar":"يعيش هنا أناس من جميع أنحاء العالم.","e":"","alt":[]}],"reading":{"en":"Masada is one of the most famous historical sites in Israel. It was built by King Herod on top of a high mountain near the Dead Sea. Today it is visited by thousands of people every week. Many hikers climb the Snake Path early in the morning to watch the sunrise. Last spring, Adi and her class did exactly that. Although the climb was hard, she says the view from the top was worth it. In 2001, Masada was added to the UNESCO World Heritage List.","he":"מצדה היא אחד האתרים ההיסטוריים המפורסמים ביותר בישראל. היא נבנתה על ידי המלך הורדוס על פסגת הר גבוה ליד ים המלח. כיום מבקרים בה אלפי אנשים בכל שבוע. מטיילים רבים מטפסים בשביל הנחש מוקדם בבוקר כדי לצפות בזריחה. באביב שעבר עדי והכיתה שלה עשו בדיוק את זה. למרות שהטיפוס היה קשה, היא אומרת שהנוף מהפסגה היה שווה את זה. בשנת 2001 מצדה נוספה לרשימת אתרי המורשת העולמית של אונסק״ו.","ru":"Масада — один из самых известных исторических объектов Израиля. Её построил царь Ирод на вершине высокой горы возле Мёртвого моря. Сегодня её каждую неделю посещают тысячи людей. Многие туристы рано утром поднимаются по Змеиной тропе, чтобы встретить рассвет. Прошлой весной Ади и её класс сделали именно это. Хотя подъём был тяжёлым, она говорит, что вид с вершины того стоил. В 2001 году Масада была включена в список Всемирного наследия ЮНЕСКО.","ar":"مسادا من أشهر المواقع التاريخية في إسرائيل. بناها الملك هيرودس على قمّة جبل عالٍ قرب البحر الميت. يزورها اليوم آلاف الناس كل أسبوع. يتسلّق كثير من المتنزّهين درب الأفعى في الصباح الباكر لمشاهدة شروق الشمس. في الربيع الماضي فعلت عدي وصفّها ذلك بالضبط. رغم أن التسلّق كان صعبًا، تقول إن المنظر من القمّة كان يستحق العناء. في عام 2001 أُضيفت مسادا إلى قائمة اليونسكو للتراث العالمي.","questions":[["Who built Masada?","king herod","king david","the romans"],["Why do hikers climb early in the morning?","to watch the sunrise","to avoid the tourists","to catch the first bus"],["When was Masada added to the UNESCO list?","in 2001","in 1948","last spring"]]}},{"en":"the future","he":"העתיד","ru":"будущее","ar":"المستقبل","e":"🔮","items":[{"en":"In twenty years, cars will be driven by computers.","he":"בעוד עשרים שנה, מכוניות ינוהגו על ידי מחשבים.","ru":"Через двадцать лет машинами будут управлять компьютеры.","ar":"بعد عشرين عامًا ستقود الحواسيب السيارات.","e":"","alt":[]},{"en":"If I could travel in time, I'd visit the future.","he":"אם הייתי יכול/ה לנסוע בזמן, הייתי מבקר/ת בעתיד.","ru":"Если бы я мог путешествовать во времени, я бы отправился в будущее.","ar":"لو استطعت السفر عبر الزمن، لزرت المستقبل.","e":"","alt":[]},{"en":"I think people will live on Mars one day.","he":"אני חושב/ת שיום אחד אנשים יגורו על מאדים.","ru":"Думаю, однажды люди будут жить на Марсе.","ar":"أعتقد أن الناس سيعيشون على المريخ يومًا ما.","e":"","alt":[]},{"en":"Artificial intelligence is changing the way we learn.","he":"הבינה המלאכותית משנה את הדרך שבה אנחנו לומדים.","ru":"Искусственный интеллект меняет то, как мы учимся.","ar":"الذكاء الاصطناعي يغيّر طريقة تعلّمنا.","e":"","alt":[]},{"en":"I hope I'll have my own business by thirty.","he":"אני מקווה שיהיה לי עסק משלי עד גיל שלושים.","ru":"Надеюсь, к тридцати годам у меня будет свой бизнес.","ar":"آمل أن يكون لديّ عملي الخاص قبل سن الثلاثين.","e":"","alt":[]},{"en":"Technology is useful; however, it can also be dangerous.","he":"הטכנולוגיה שימושית; עם זאת, היא יכולה להיות גם מסוכנת.","ru":"Технологии полезны, однако они могут быть и опасными.","ar":"التكنولوجيا مفيدة، لكنها قد تكون خطيرة أيضًا.","e":"","alt":[]}],"reading":{"en":"Noam's grandfather often talks about life fifty years ago. He used to write letters by hand and wait weeks for an answer. Today, messages are sent around the world in seconds. Noam sometimes wonders what life will be like when he is a grandfather. He thinks that most cars will be electric and that robots will help people at home. However, he hopes that people will still meet face to face. In his opinion, no machine can replace a real conversation.","he":"סבא של נועם מרבה לדבר על החיים לפני חמישים שנה. הוא נהג לכתוב מכתבים בכתב יד ולחכות שבועות לתשובה. כיום הודעות נשלחות לכל העולם בתוך שניות. נועם תוהה לפעמים איך ייראו החיים כשהוא יהיה סבא. הוא חושב שרוב המכוניות יהיו חשמליות ושרובוטים יעזרו לאנשים בבית. עם זאת, הוא מקווה שאנשים עדיין ייפגשו פנים אל פנים. לדעתו, שום מכונה לא יכולה להחליף שיחה אמיתית.","ru":"Дедушка Ноама часто рассказывает о жизни пятьдесят лет назад. Раньше он писал письма от руки и неделями ждал ответа. Сегодня сообщения отправляются по всему миру за секунды. Ноам иногда задумывается, какой будет жизнь, когда он сам станет дедушкой. Он думает, что большинство машин будут электрическими, а роботы будут помогать людям дома. Однако он надеется, что люди всё ещё будут встречаться лицом к лицу. По его мнению, никакая машина не заменит настоящий разговор.","ar":"يتحدّث جدّ نوعام كثيرًا عن الحياة قبل خمسين عامًا. كان يكتب الرسائل بخطّ يده وينتظر أسابيع للحصول على ردّ. اليوم تُرسل الرسائل إلى جميع أنحاء العالم في ثوانٍ. يتساءل نوعام أحيانًا كيف ستكون الحياة عندما يصبح هو جدًّا. يعتقد أن معظم السيارات ستكون كهربائية وأن الروبوتات ستساعد الناس في البيوت. لكنه يأمل أن يظل الناس يلتقون وجهًا لوجه. في رأيه، لا يمكن لأي آلة أن تحلّ محلّ محادثة حقيقية.","questions":[["How did Noam's grandfather use to communicate?","by writing letters","by phone","by email"],["What does Noam think most cars will be?","electric","flying","very cheap"],["In Noam's opinion, what can't a machine replace?","a real conversation","a good teacher","a family car"]]}},{"en":"news and media","he":"חדשות ותקשורת","ru":"СМИ и новости","ar":"الأخبار والإعلام","e":"📰","items":[{"en":"The story was reported on every channel last night.","he":"על הסיפור דווח בכל הערוצים אתמול בלילה.","ru":"Вчера вечером об этой истории сообщили на всех каналах.","ar":"أُذيع الخبر على جميع القنوات الليلة الماضية.","e":"","alt":[]},{"en":"Always check the source before you share a story.","he":"תמיד תבדוק את המקור לפני שאתה משתף ידיעה.","ru":"Всегда проверяй источник, прежде чем делиться новостью.","ar":"تحقّق دائمًا من المصدر قبل أن تشارك أي خبر.","e":"","alt":[]},{"en":"Fake news spreads faster than the truth.","he":"חדשות כזב מתפשטות מהר יותר מהאמת.","ru":"Фейковые новости распространяются быстрее правды.","ar":"تنتشر الأخبار الكاذبة أسرع من الحقيقة.","e":"","alt":[]},{"en":"If I were a journalist, I'd write about young people.","he":"אם הייתי עיתונאי/ת, הייתי כותב/ת על צעירים.","ru":"Если бы я был журналистом, я бы писал о молодёжи.","ar":"لو كنت صحفيًا، لكتبت عن الشباب.","e":"","alt":[]},{"en":"I don't agree with this article at all.","he":"אני בכלל לא מסכים/ה עם הכתבה הזאת.","ru":"Я совсем не согласен с этой статьёй.","ar":"لا أتّفق مع هذا المقال على الإطلاق.","e":"","alt":[]},{"en":"People used to read newspapers every morning.","he":"פעם אנשים קראו עיתונים כל בוקר.","ru":"Раньше люди читали газеты каждое утро.","ar":"كان الناس يقرؤون الصحف كل صباح.","e":"","alt":[]}],"reading":{"en":"Last month, a photo of a shark on a highway was shared thousands of times in Israel. Many people believed it, and some were even afraid to drive. However, Michal, a ninth grader from Modiin, was suspicious. She searched for the photo online and discovered that it had been edited. She posted the real facts in her class group. Her teacher was so impressed that Michal was asked to give a talk about fake news. Now her classmates always check a story before they share it.","he":"בחודש שעבר תמונה של כריש על כביש מהיר שותפה אלפי פעמים בישראל. אנשים רבים האמינו לה, וחלקם אפילו פחדו לנהוג. אולם מיכל, תלמידת כיתה ט׳ ממודיעין, חשדה. היא חיפשה את התמונה ברשת וגילתה שהיא עברה עריכה. היא פרסמה את העובדות האמיתיות בקבוצה של הכיתה. המורה שלה התרשמה כל כך, שמיכל התבקשה להעביר הרצאה על חדשות כזב. עכשיו חבריה לכיתה תמיד בודקים ידיעה לפני שהם משתפים אותה.","ru":"В прошлом месяце фото акулы на шоссе разошлось в Израиле тысячи раз. Многие поверили, а некоторые даже боялись садиться за руль. Однако Михаль, девятиклассница из Модиина, засомневалась. Она поискала фото в интернете и выяснила, что его отредактировали. Она опубликовала настоящие факты в группе класса. Учительница была так впечатлена, что Михаль попросили выступить с докладом о фейковых новостях. Теперь её одноклассники всегда проверяют новость, прежде чем ею поделиться.","ar":"في الشهر الماضي شوركت صورة لسمكة قرش على طريق سريع آلاف المرات في إسرائيل. صدّقها كثير من الناس، بل إن بعضهم خافوا من القيادة. لكن ميخال، وهي طالبة في الصف التاسع من موديعين، شكّت في الأمر. بحثت عن الصورة على الإنترنت واكتشفت أنها معدّلة. نشرت الحقائق الصحيحة في مجموعة الصف. أُعجبت معلّمتها كثيرًا لدرجة أنه طُلب من ميخال أن تلقي محاضرة عن الأخبار الكاذبة. الآن يتحقّق زملاؤها دائمًا من أي خبر قبل أن يشاركوه.","questions":[["What was in the photo?","a shark on a highway","a snake in a school","a lion in a park"],["What did Michal discover?","the photo had been edited","the photo was real","the shark was dangerous"],["What was Michal asked to do?","give a talk about fake news","delete the photo","write a newspaper article"]]}},{"en":"job interview","he":"ראיון עבודה","ru":"собеседование","ar":"مقابلة عمل","e":"🗣️","dialog":true,"items":[{"q":"Why do you want to work at our summer camp?","en":"I love working with kids, and I'd like to gain experience.","he":"אני אוהב/ת לעבוד עם ילדים, והייתי רוצה לצבור ניסיון.","ru":"Я люблю работать с детьми и хотел бы получить опыт.","ar":"أحبّ العمل مع الأطفال وأودّ أن أكتسب خبرة."},{"q":"Have you ever worked before?","en":"Yes, I've worked as a babysitter for two years.","he":"כן, אני עובד/ת כבייביסיטר כבר שנתיים.","ru":"Да, я уже два года работаю няней.","ar":"نعم، أعمل في مجالسة الأطفال منذ سنتين."},{"q":"What are your strengths?","en":"I'm responsible, patient, and good at solving problems.","he":"אני אחראי/ת, סבלני/ת וטוב/ה בפתרון בעיות.","ru":"Я ответственный, терпеливый и умею решать проблемы.","ar":"أنا مسؤول وصبور وماهر في حلّ المشكلات."},{"q":"What would you do if a child got hurt?","en":"I would stay calm and call an adult right away.","he":"הייתי נשאר/ת רגוע/ה וקורא/ת מיד למבוגר.","ru":"Я бы сохранял спокойствие и сразу позвал взрослого.","ar":"لبقيت هادئًا ولاستدعيت شخصًا بالغًا فورًا."},{"q":"How will you get to work every day?","en":"I usually ride my bike, so I'm never late.","he":"בדרך כלל אני רוכב/ת על אופניים, אז אני אף פעם לא מאחר/ת.","ru":"Обычно я езжу на велосипеде, поэтому никогда не опаздываю.","ar":"عادةً أركب دراجتي، لذلك لا أتأخّر أبدًا."},{"q":"Do you have any questions for us?","en":"Yes, when will I be told if I got the job?","he":"כן, מתי יודיעו לי אם התקבלתי לעבודה?","ru":"Да, когда мне сообщат, взяли ли меня на работу?","ar":"نعم، متى سيتم إبلاغي إن كنت قد حصلت على الوظيفة؟"}]}]},{"id":"pro","group":"adults","he":"מבוגרים · רמה גבוהה מאוד","sub":"ניבים, ביטויים, טיעון ושפה עשירה ברמת C1","e":"🚀","units":[{"en":"everyday idioms","he":"ניבים יומיומיים","ru":"повседневные идиомы","ar":"تعابير اصطلاحية يومية","e":"💬","items":[{"en":"I was on the fence about the job offer, but I finally made up my mind.","he":"התלבטתי לגבי הצעת העבודה, אבל בסוף קיבלתי החלטה.","ru":"Я долго сомневался насчёт предложения о работе, но в итоге принял решение.","ar":"كنت مترددًا بشأن عرض العمل، لكنني حسمت أمري أخيرًا.","e":"","alt":[]},{"en":"Let's not beat around the bush; the project is behind schedule and over budget.","he":"בואו לא נסתובב סביב העניין: הפרויקט מפגר בלוח הזמנים וחורג מהתקציב.","ru":"Давайте не будем ходить вокруг да около: проект отстаёт от графика и выходит за рамки бюджета.","ar":"دعونا لا نلفّ وندور؛ المشروع متأخر عن الجدول الزمني ويتجاوز الميزانية.","e":"","alt":[]},{"en":"Moving to Haifa was a blessing in disguise, even though it felt awful at first.","he":"המעבר לחיפה היה ברכה במסווה, למרות שבהתחלה זה הרגיש נורא.","ru":"Переезд в Хайфу оказался скрытым благом, хотя поначалу казался ужасным.","ar":"كان الانتقال إلى حيفا نعمة متخفّية، رغم أنه بدا فظيعًا في البداية.","e":"","alt":[]},{"en":"She's been under the weather all week, so let's give her some breathing room.","he":"היא לא מרגישה טוב כל השבוע, אז בואו ניתן לה קצת מרחב לנשום.","ru":"Она всю неделю неважно себя чувствует, так что давайте дадим ей передышку.","ar":"إنها متوعّكة طوال الأسبوع، فلنمنحها بعض المساحة.","e":"","alt":[]},{"en":"Don't jump to conclusions until you've heard the whole story from both sides.","he":"אל תקפוץ/י למסקנות לפני ששמעת את כל הסיפור משני הצדדים.","ru":"Не делай поспешных выводов, пока не выслушаешь всю историю с обеих сторон.","ar":"لا تتسرّع في الاستنتاج قبل أن تسمع القصة كاملة من الطرفين.","e":"","alt":[]},{"en":"After months of arguing, we finally agreed to bury the hatchet and move on.","he":"אחרי חודשים של ויכוחים, סוף סוף הסכמנו לקבור את הגרזן ולהמשיך הלאה.","ru":"После нескольких месяцев споров мы наконец согласились зарыть топор войны и двигаться дальше.","ar":"بعد أشهر من الجدال، اتفقنا أخيرًا على دفن الأحقاد والمضيّ قدمًا.","e":"","alt":[]}],"reading":{"en":"Why I Stopped Dismissing Idioms\n\nFor years, I treated idioms as the decorative trim of English: charming, perhaps, but hardly essential. Language teachers, I reasoned, should stick to the load-bearing walls of grammar, vocabulary and pronunciation, and leave the frills for later. I have since changed my tune.\n\nThe turning point came at a dinner in Tel Aviv, where a British colleague remarked that our new manager was 'all bark and no bite.' Half the table nodded knowingly; the other half, all fluent speakers on paper, looked utterly lost. Their grammar was flawless, yet they had missed the point entirely. It struck me then that idioms are not ornaments at all. They are shortcuts to shared understanding, and without them, even a polished speaker is left on the outside looking in.\n\nThat said, I am not suggesting learners memorise long lists of colourful expressions. Few things sound more awkward than someone forcing 'it's raining cats and dogs' into every conversation about the weather. Native speakers use idioms sparingly and almost unconsciously, and the trick is to absorb them the same way: in context, through reading and listening, one phrase at a time.\n\nSo, to anyone who still regards idioms as optional extras, I would gently suggest a rethink. You can certainly get by without them. But if you want to be part of the conversation rather than a polite observer of it, idioms are no longer a luxury. They are the price of admission.","he":"למה הפסקתי לזלזל בניבים\n\nבמשך שנים התייחסתי לניבים כאל הקישוט של השפה האנגלית: מקסימים אולי, אבל בקושי הכרחיים. מורים לשפה, כך חשבתי, צריכים להתמקד בקירות התומכים של דקדוק, אוצר מילים והגייה, ולהשאיר את הקישוטים להמשך. מאז שיניתי את דעתי.\n\nנקודת המפנה הגיעה בארוחת ערב בתל אביב, כשעמית בריטי העיר שהמנהל החדש שלנו הוא 'כל נביחה ובלי נשיכה' (כלומר, מאיים אבל לא מסוכן). חצי מהשולחן הנהן בהבנה; החצי השני, כולם דוברים שוטפים על הנייר, נראו אבודים לגמרי. הדקדוק שלהם היה מושלם, ובכל זאת הם פספסו את העיקר לחלוטין. אז הבנתי שניבים אינם קישוטים בכלל. הם קיצורי דרך להבנה משותפת, ובלעדיהם אפילו דובר מלוטש נשאר בחוץ ומסתכל פנימה.\n\nעם זאת, אני לא מציע/ה שלומדים ישננו רשימות ארוכות של ביטויים ציוריים. מעט דברים נשמעים מביכים יותר ממישהו שדוחף את 'יורד גשם של חתולים וכלבים' לכל שיחה על מזג האוויר. דוברי שפת אם משתמשים בניבים במשורה וכמעט באופן לא מודע, והסוד הוא לספוג אותם באותה דרך: בהקשר, דרך קריאה והאזנה, ביטוי אחד בכל פעם.\n\nלכן, לכל מי שעדיין רואה בניבים תוספת אופציונלית, הייתי מציע/ה בעדינות לחשוב שוב. בהחלט אפשר להסתדר בלעדיהם. אבל אם רוצים להיות חלק מהשיחה ולא צופים מנומסים מהצד, ניבים כבר אינם מותרות. הם מחיר הכניסה.","ru":"Почему я перестал недооценивать идиомы\n\nГодами я относился к идиомам как к декоративной отделке английского языка: очаровательно, пожалуй, но вряд ли необходимо. Преподаватели, рассуждал я, должны заниматься несущими стенами — грамматикой, лексикой и произношением, — а украшения оставить на потом. С тех пор я запел по-другому.\n\nПереломный момент наступил на ужине в Тель-Авиве, когда британский коллега заметил, что наш новый начальник «много лает, да не кусает». Половина стола понимающе кивнула; другая половина, свободно владеющая языком на бумаге, выглядела совершенно растерянной. Их грамматика была безупречной, и всё же они полностью упустили суть. Тогда меня осенило, что идиомы вовсе не украшения. Это короткий путь к взаимопониманию, и без них даже отточенная речь оставляет говорящего за бортом.\n\nПри этом я не предлагаю учащимся зубрить длинные списки красочных выражений. Мало что звучит так неуклюже, как человек, вставляющий «льёт как из ведра» в каждый разговор о погоде. Носители языка используют идиомы умеренно и почти неосознанно, и секрет в том, чтобы усваивать их так же: в контексте, через чтение и слушание, по одной фразе за раз.\n\nПоэтому всем, кто до сих пор считает идиомы необязательным дополнением, я мягко предложил бы пересмотреть взгляды. Без них, конечно, можно обойтись. Но если вы хотите участвовать в разговоре, а не вежливо наблюдать за ним со стороны, идиомы — уже не роскошь. Это плата за вход.","ar":"لماذا توقفت عن الاستخفاف بالتعابير الاصطلاحية\n\nلسنوات، تعاملت مع التعابير الاصطلاحية على أنها زخرفة اللغة الإنجليزية: ساحرة ربما، لكنها بالكاد ضرورية. كنت أرى أن على معلمي اللغة التركيز على الجدران الحاملة، أي القواعد والمفردات والنطق، وترك الزخارف لوقت لاحق. لكنني غيّرت رأيي منذ ذلك الحين.\n\nجاءت نقطة التحول في عشاء في تل أبيب، حين علّق زميل بريطاني بأن مديرنا الجديد «ينبح ولا يعضّ». أومأ نصف الحاضرين متفهمين، أما النصف الآخر، وكلهم يتحدثون بطلاقة على الورق، فبدوا تائهين تمامًا. كانت قواعدهم خالية من الأخطاء، ومع ذلك فاتهم المقصود كليًا. أدركت حينها أن التعابير الاصطلاحية ليست زينة على الإطلاق، بل هي طرق مختصرة إلى الفهم المشترك، ومن دونها يبقى حتى المتحدث البارع خارج الدائرة ينظر إليها من بعيد.\n\nومع ذلك، لا أقترح أن يحفظ المتعلمون قوائم طويلة من العبارات الملوّنة. فقليلة هي الأشياء التي تبدو أكثر إحراجًا من شخص يُقحم عبارة «إنها تمطر قططًا وكلابًا» في كل حديث عن الطقس. يستخدم الناطقون الأصليون هذه التعابير باعتدال وبشكل شبه لا واعٍ، والسرّ هو استيعابها بالطريقة نفسها: في سياقها، عبر القراءة والاستماع، عبارة تلو الأخرى.\n\nلذا، لكل من لا يزال يرى في التعابير الاصطلاحية إضافات اختيارية، أقترح بلطف إعادة التفكير. يمكنك بالتأكيد أن تتدبّر أمرك من دونها، لكن إن أردت أن تكون جزءًا من الحديث لا مراقبًا مهذبًا له، فالتعابير الاصطلاحية لم تعد ترفًا، بل هي ثمن الدخول.","questions":[["What can we infer about the colleagues who looked lost at the dinner?","Their textbook English was strong, but they lacked idiomatic knowledge.","They could not understand the British accent.","They disagreed with the remark about the manager.","They were not fluent in English at all."],["How does the writer's attitude toward idioms change?","From seeing them as optional to seeing them as essential.","From enthusiasm to complete boredom.","From seeing them as essential to seeing them as outdated.","It does not change at all during the column."],["What does 'I have since changed my tune' mean in the text?","I now hold a different opinion.","I started singing in a different style.","I became more stubborn about my view.","I stopped teaching English altogether."]]}},{"en":"phrasal verbs at work","he":"פעלים מורכבים בעבודה","ru":"фразовые глаголы на работе","ar":"الأفعال المركّبة في العمل","e":"💼","items":[{"en":"Could you look into the billing issue and get back to me by Thursday?","he":"תוכל/י לבדוק את בעיית החיוב ולחזור אליי עד יום חמישי?","ru":"Не могли бы вы разобраться с проблемой выставления счетов и ответить мне до четверга?","ar":"هل يمكنك النظر في مشكلة الفواتير والرد عليّ بحلول يوم الخميس؟","e":"","alt":[]},{"en":"We need to iron out a few details before we sign the contract.","he":"אנחנו צריכים ליישר כמה פרטים לפני שנחתום על החוזה.","ru":"Нам нужно утрясти несколько деталей, прежде чем подписывать контракт.","ar":"علينا تسوية بعض التفاصيل قبل أن نوقّع العقد.","e":"","alt":[]},{"en":"The meeting was called off at the last minute because the client fell ill.","he":"הפגישה בוטלה ברגע האחרון כי הלקוח חלה.","ru":"Встречу отменили в последний момент, потому что клиент заболел.","ar":"أُلغي الاجتماع في اللحظة الأخيرة لأن العميل مرض.","e":"","alt":[]},{"en":"I'll fill in for Dana while she's on maternity leave next month.","he":"אני אחליף/תחליף את דנה בזמן שהיא בחופשת לידה בחודש הבא.","ru":"Я буду замещать Дану, пока она в декретном отпуске в следующем месяце.","ar":"سأحلّ محلّ دانا أثناء إجازة الأمومة الخاصة بها الشهر المقبل.","e":"","alt":[]},{"en":"Management has decided to phase out the old software by the end of the year.","he":"ההנהלה החליטה להוציא משימוש בהדרגה את התוכנה הישנה עד סוף השנה.","ru":"Руководство решило постепенно отказаться от старого программного обеспечения к концу года.","ar":"قررت الإدارة التخلّص تدريجيًا من البرنامج القديم بحلول نهاية العام.","e":"","alt":[]},{"en":"If we cut back on travel expenses, we can avoid laying off any staff.","he":"אם נצמצם את הוצאות הנסיעה, נוכל להימנע מפיטורי עובדים.","ru":"Если мы сократим командировочные расходы, то сможем избежать увольнения сотрудников.","ar":"إذا قلّصنا نفقات السفر، يمكننا تجنّب تسريح أي موظف.","e":"","alt":[]}],"reading":{"en":"The Quiet Art of Following Up\n\nAsk any experienced manager what separates a reliable employee from a merely competent one, and you are likely to hear the same answer: follow-through. Plenty of people can come up with good ideas in a meeting. Far fewer actually carry them out once the meeting breaks up.\n\nConsider Noa, a project coordinator at a mid-sized tech firm in Herzliya. When she joined the company, she noticed that tasks routinely fell through the cracks. Someone would promise to look into a problem, and then nothing would happen. Clients were left hanging, deadlines slipped, and colleagues began to point fingers at one another.\n\nRather than complain, Noa set up a simple system. After every meeting, she sent out a brief summary listing who had signed up for which task and by when. If a deadline was approaching, she checked in with a friendly reminder. At first, some colleagues brushed her off as overly bureaucratic. Within three months, however, missed deadlines had dropped by almost half, and the same sceptics were asking her to sit in on their planning sessions.\n\nNoa is quick to play down her role. 'I didn't invent anything,' she says. 'I just made sure nobody could pretend they'd forgotten.' Yet her story points to something many workplaces overlook. Talent and creativity matter, but they rarely pay off unless someone is willing to do the unglamorous work of keeping everyone on track. In the end, ideas are cheap; it is following up that turns them into results.","he":"האמנות השקטה של המעקב\n\nשאלו כל מנהל מנוסה מה מבדיל בין עובד אמין לעובד שהוא רק מוכשר, וסביר שתשמעו את אותה תשובה: יכולת להביא דברים לסיום. הרבה אנשים מסוגלים להעלות רעיונות טובים בישיבה. הרבה פחות מהם באמת מבצעים אותם אחרי שהישיבה מתפזרת.\n\nקחו לדוגמה את נועה, רכזת פרויקטים בחברת הייטק בינונית בהרצליה. כשהצטרפה לחברה, היא שמה לב שמשימות נופלות בין הכיסאות באופן קבוע. מישהו היה מבטיח לבדוק בעיה, ואז שום דבר לא קרה. לקוחות נשארו תלויים באוויר, מועדים נדחו, ועמיתים התחילו להפנות אצבע מאשימה זה כלפי זה.\n\nבמקום להתלונן, נועה הקימה מערכת פשוטה. אחרי כל ישיבה היא שלחה סיכום קצר שפירט מי לקח על עצמו איזו משימה ועד מתי. כשמועד התקרב, היא בדקה מה המצב עם תזכורת ידידותית. בהתחלה, כמה עמיתים ביטלו אותה כבירוקרטית מדי. אבל בתוך שלושה חודשים, מספר המועדים שהוחמצו ירד כמעט בחצי, ואותם ספקנים ביקשו ממנה להצטרף לישיבות התכנון שלהם.\n\nנועה ממהרת להמעיט בתפקידה. 'לא המצאתי שום דבר,' היא אומרת. 'רק דאגתי שאף אחד לא יוכל להעמיד פנים שהוא שכח.' ובכל זאת, הסיפור שלה מצביע על משהו שמקומות עבודה רבים מתעלמים ממנו. כישרון ויצירתיות חשובים, אבל הם כמעט אף פעם לא משתלמים אלא אם מישהו מוכן לעשות את העבודה הלא זוהרת של לשמור על כולם במסלול. בסופו של דבר, רעיונות הם זולים; המעקב הוא שהופך אותם לתוצאות.","ru":"Тихое искусство доводить дело до конца\n\nСпросите любого опытного руководителя, что отличает надёжного сотрудника от просто компетентного, и вы, скорее всего, услышите один и тот же ответ: умение доводить дело до конца. Многие способны предложить хорошие идеи на совещании. Гораздо меньше тех, кто действительно воплощает их, когда совещание заканчивается.\n\nВозьмём Ноа, координатора проектов в технологической компании среднего размера в Герцлии. Придя в компанию, она заметила, что задачи постоянно теряются. Кто-то обещал разобраться с проблемой, а потом ничего не происходило. Клиенты оставались без ответа, сроки срывались, а коллеги начали обвинять друг друга.\n\nВместо того чтобы жаловаться, Ноа создала простую систему. После каждого совещания она рассылала краткое резюме: кто за какую задачу взялся и к какому сроку. Если срок приближался, она дружелюбно напоминала об этом. Поначалу некоторые коллеги отмахивались от неё как от излишне бюрократичной. Однако уже через три месяца количество сорванных сроков сократилось почти вдвое, и те же скептики стали просить её присутствовать на их совещаниях по планированию.\n\nНоа не спешит преувеличивать свою роль. «Я ничего не изобретала, — говорит она. — Я просто сделала так, чтобы никто не мог притвориться, что забыл». И всё же её история указывает на то, что многие организации упускают из виду. Талант и креативность важны, но они редко окупаются, если никто не готов выполнять неблагодарную работу — следить, чтобы все придерживались плана. В конечном счёте идеи стоят дёшево; именно контроль исполнения превращает их в результаты.","ar":"الفن الهادئ للمتابعة\n\nاسأل أي مدير متمرّس عمّا يميّز الموظف الموثوق عن الموظف الكفء فحسب، وعلى الأرجح ستسمع الإجابة نفسها: القدرة على إتمام الأمور. كثيرون يستطيعون طرح أفكار جيدة في الاجتماع، لكن قلّة قليلة تنفّذها فعلًا بعد انفضاض الاجتماع.\n\nخذ مثلًا نوعا، منسّقة مشاريع في شركة تكنولوجيا متوسطة الحجم في هرتسليا. عندما انضمت إلى الشركة، لاحظت أن المهام تضيع بشكل متكرر. كان أحدهم يَعِد بالنظر في مشكلة ما، ثم لا يحدث شيء. بقي العملاء معلّقين، وتأخرت المواعيد النهائية، وبدأ الزملاء يتبادلون الاتهامات.\n\nبدلًا من التذمّر، أنشأت نوعا نظامًا بسيطًا. بعد كل اجتماع، كانت ترسل ملخصًا قصيرًا يحدد من تولّى أي مهمة وموعد إنجازها. وإذا اقترب موعد نهائي، كانت تتواصل بتذكير ودّي. في البداية، تجاهلها بعض الزملاء معتبرين إياها بيروقراطية أكثر من اللازم. لكن خلال ثلاثة أشهر، انخفضت المواعيد الفائتة إلى النصف تقريبًا، وصار المشكّكون أنفسهم يطلبون منها حضور جلسات التخطيط الخاصة بهم.\n\nتسارع نوعا إلى التقليل من دورها قائلة: «لم أخترع شيئًا، كل ما فعلته أنني تأكدت ألّا يتمكن أحد من التظاهر بالنسيان». ومع ذلك، تشير قصتها إلى أمر تغفل عنه أماكن عمل كثيرة. الموهبة والإبداع مهمّان، لكنهما نادرًا ما يؤتيان ثمارهما ما لم يكن هناك من يستعد للقيام بالعمل غير اللامع المتمثل في إبقاء الجميع على المسار الصحيح. في النهاية، الأفكار رخيصة، والمتابعة هي ما يحوّلها إلى نتائج.","questions":[["Why did the sceptical colleagues later invite Noa to their planning sessions?","Her system had clearly reduced missed deadlines.","She had been promoted to manage their team.","They wanted a chance to criticise her methods.","Company rules required her to attend every meeting."],["What is the writer's attitude toward Noa's approach?","Admiring; it is valuable work that is often overlooked.","Critical; it is far too bureaucratic.","Neutral; the writer gives no opinion at all.","Amused; the writer treats it as a joke."],["What does 'tasks routinely fell through the cracks' mean?","Tasks were often forgotten and never completed.","Tasks were usually finished far too early.","Tasks were shared among too many people.","Tasks were deliberately cancelled by managers."]]}},{"en":"expressing and defending opinions","he":"הבעת דעה והגנה עליה","ru":"выражение и защита мнения","ar":"التعبير عن الرأي والدفاع عنه","e":"🗣️","items":[{"en":"As far as I'm concerned, the proposal raises more questions than it answers.","he":"מבחינתי, ההצעה מעלה יותר שאלות משהיא עונה עליהן.","ru":"Что касается меня, это предложение вызывает больше вопросов, чем даёт ответов.","ar":"بالنسبة إليّ، يثير هذا الاقتراح أسئلة أكثر مما يجيب عنها.","e":"","alt":[]},{"en":"I take your point, but I'm not entirely convinced the numbers add up.","he":"אני מבין/ה את הטענה שלך, אבל אני לא לגמרי משוכנע/ת שהמספרים מסתדרים.","ru":"Я понимаю вашу мысль, но не совсем уверен, что цифры сходятся.","ar":"أفهم وجهة نظرك، لكنني لست مقتنعًا تمامًا بأن الأرقام منطقية.","e":"","alt":[]},{"en":"With all due respect, I think you're overlooking the long-term costs of this plan.","he":"עם כל הכבוד, אני חושב/ת שאת/ה מתעלם/ת מהעלויות ארוכות הטווח של התוכנית הזו.","ru":"При всём уважении, мне кажется, вы упускаете из виду долгосрочные издержки этого плана.","ar":"مع كامل الاحترام، أعتقد أنك تغفل التكاليف طويلة الأمد لهذه الخطة.","e":"","alt":[]},{"en":"I'd go so far as to say that this decision could backfire on us.","he":"הייתי אפילו אומר/ת שההחלטה הזו עלולה להתהפך עלינו.","ru":"Я бы даже сказал, что это решение может обернуться против нас.","ar":"بل أذهب إلى حدّ القول إن هذا القرار قد ينقلب علينا.","e":"","alt":[]},{"en":"That's a fair argument, although I'd see things slightly differently myself.","he":"זה טיעון הוגן, אם כי אני עצמי רואה/ה את הדברים קצת אחרת.","ru":"Это справедливый аргумент, хотя сам я смотрю на вещи немного иначе.","ar":"هذه حجة منصفة، وإن كنت أرى الأمور بشكل مختلف قليلًا.","e":"","alt":[]},{"en":"Not only is the plan expensive, but it's also unlikely to work in practice.","he":"התוכנית לא רק יקרה, אלא גם לא סביר שתעבוד בפועל.","ru":"Этот план не только дорогой, но и вряд ли сработает на практике.","ar":"ليست الخطة مكلفة فحسب، بل من غير المرجّح أيضًا أن تنجح عمليًا.","e":"","alt":[]}],"reading":{"en":"In Defence of Changing Your Mind\n\nWe tend to admire people who stick to their guns. Politicians who reverse a position are branded flip-floppers; friends who abandon a long-held view are teased for having gone soft. Consistency, it seems, is treated as a virtue in its own right. I would argue that this instinct, however understandable, does us more harm than good.\n\nConsider what it actually means to hold an opinion. Ideally, an opinion is a conclusion drawn from the best evidence available at the time. When new evidence emerges, a thoughtful person should be willing to revise that conclusion. Refusing to do so is not strength of character; it is closer to intellectual stubbornness dressed up as principle.\n\nOf course, there is a difference between updating a view and blowing with the wind. Someone who changes their mind every time a louder voice enters the room is hardly a model of rational thinking. The point is not to abandon convictions lightly, but to hold them with a degree of humility, accepting that we might, on reflection, have got things wrong.\n\nRarely do we hear anyone in public life say, 'I've looked at the evidence again, and I was mistaken.' Yet those words are arguably among the most courageous anyone can utter. They signal that the speaker values truth over ego, and they give others permission to do the same.\n\nSo the next time someone admits they have changed their mind, perhaps we should resist the urge to pounce. Instead of asking why they were wrong before, we might ask what persuaded them. The answer could well be worth hearing.","he":"להגנת שינוי הדעה\n\nאנחנו נוטים להעריץ אנשים שדבקים בעמדתם. פוליטיקאים שמשנים עמדה מכונים הפכפכים; חברים שנוטשים השקפה ותיקה סופגים הקנטות על כך ש'התרככו'. נראה שעקביות נחשבת למעלה בפני עצמה. אני הייתי טוען/ת שהאינסטינקט הזה, מובן ככל שיהיה, גורם לנו יותר נזק מתועלת.\n\nחשבו מה זה בעצם אומר להחזיק בדעה. באופן אידיאלי, דעה היא מסקנה שנגזרת מהראיות הטובות ביותר שזמינות באותו רגע. כשמופיעות ראיות חדשות, אדם שקול צריך להיות מוכן לעדכן את המסקנה. סירוב לעשות זאת אינו חוזק אופי; הוא קרוב יותר לעקשנות אינטלקטואלית שמתחפשת לעיקרון.\n\nכמובן, יש הבדל בין עדכון השקפה לבין נטייה עם כל רוח. מי שמשנה את דעתו בכל פעם שקול רם יותר נכנס לחדר אינו בדיוק מופת לחשיבה רציונלית. המטרה איננה לוותר על אמונות בקלות, אלא להחזיק בהן במידה של ענווה, מתוך הכרה בכך שאולי, במחשבה שנייה, טעינו.\n\nרק לעיתים רחוקות אנחנו שומעים מישהו בחיים הציבוריים אומר: 'בחנתי שוב את הראיות, וטעיתי.' ובכל זאת, אלה אולי מהמילים האמיצות ביותר שאדם יכול לומר. הן מאותתות שהדובר מעריך את האמת יותר מהאגו שלו, והן נותנות לאחרים רשות לעשות אותו דבר.\n\nאז בפעם הבאה שמישהו מודה ששינה את דעתו, אולי כדאי שנתאפק ולא נתנפל עליו. במקום לשאול למה טעה קודם, נוכל לשאול מה שכנע אותו. ייתכן מאוד שהתשובה שווה הקשבה.","ru":"В защиту права передумать\n\nМы склонны восхищаться людьми, которые стоят на своём. Политиков, меняющих позицию, клеймят флюгерами; друзей, отказавшихся от давних убеждений, дразнят за то, что они «размякли». Похоже, последовательность считается добродетелью сама по себе. Я бы сказал, что этот инстинкт, каким бы понятным он ни был, приносит нам больше вреда, чем пользы.\n\nЗадумайтесь, что на самом деле значит иметь мнение. В идеале мнение — это вывод, сделанный на основе лучших доступных на тот момент данных. Когда появляются новые данные, вдумчивый человек должен быть готов пересмотреть свой вывод. Отказ от этого — не сила характера; это скорее интеллектуальное упрямство, выдаваемое за принципиальность.\n\nКонечно, есть разница между тем, чтобы обновить взгляды, и тем, чтобы держать нос по ветру. Тот, кто меняет мнение всякий раз, когда в комнату входит кто-то погромче, вряд ли образец рационального мышления. Суть не в том, чтобы легко отказываться от убеждений, а в том, чтобы придерживаться их с определённой долей скромности, допуская, что, поразмыслив, мы можем оказаться неправы.\n\nРедко мы слышим, чтобы публичный человек сказал: «Я снова изучил факты и понял, что ошибался». Между тем эти слова, пожалуй, одни из самых смелых, какие только можно произнести. Они показывают, что говорящий ценит истину выше собственного самолюбия, и дают другим разрешение поступать так же.\n\nПоэтому в следующий раз, когда кто-то признается, что передумал, возможно, стоит удержаться от желания наброситься на него. Вместо того чтобы спрашивать, почему он ошибался раньше, можно спросить, что его убедило. Ответ вполне может оказаться стоящим.","ar":"دفاعًا عن تغيير الرأي\n\nنميل إلى الإعجاب بالأشخاص الذين يتمسّكون بمواقفهم. يُوصَف السياسيون الذين يتراجعون عن موقف ما بالمتقلّبين، ويُسخَر من الأصدقاء الذين يتخلّون عن رأي قديم بأنهم «لانوا». يبدو أن الثبات يُعامَل كفضيلة قائمة بذاتها. وأنا أرى أن هذه الغريزة، مهما كانت مفهومة، تضرّنا أكثر مما تنفعنا.\n\nفكّر في ما يعنيه فعلًا أن تتبنّى رأيًا. في الوضع المثالي، الرأي هو استنتاج مبني على أفضل الأدلة المتاحة في وقتها. وعندما تظهر أدلة جديدة، ينبغي للشخص المتبصّر أن يكون مستعدًا لمراجعة استنتاجه. أما رفض ذلك فليس قوة شخصية، بل هو أقرب إلى عناد فكري متنكّر في زيّ المبدأ.\n\nبالطبع، هناك فرق بين تحديث الرأي والميل مع كل ريح. فمن يغيّر رأيه كلما دخل الغرفة صوت أعلى ليس نموذجًا للتفكير العقلاني. المقصود ليس التخلّي عن القناعات بسهولة، بل التمسك بها بقدر من التواضع، مع تقبّل احتمال أننا ربما أخطأنا عند التأمل.\n\nنادرًا ما نسمع أحدًا في الحياة العامة يقول: «راجعت الأدلة مجددًا، وكنت مخطئًا». ومع ذلك، قد تكون هذه الكلمات من أشجع ما يمكن أن يقوله المرء، فهي تدل على أن المتحدث يقدّر الحقيقة أكثر من غروره، وتمنح الآخرين الإذن بأن يفعلوا الشيء نفسه.\n\nلذا، في المرة القادمة التي يعترف فيها أحدهم بأنه غيّر رأيه، ربما علينا أن نقاوم الرغبة في الانقضاض عليه. وبدلًا من أن نسأله لماذا كان مخطئًا من قبل، يمكننا أن نسأله ما الذي أقنعه. فقد تكون الإجابة جديرة بالاستماع.","questions":[["Which kind of person would the writer most likely criticise?","Someone who changes opinions just to follow the loudest voice.","Someone who revises a view after studying new evidence.","Someone who admits a past mistake in public.","Someone who asks others what persuaded them."],["What is the writer's overall attitude toward consistency of opinion?","Sceptical of valuing it above openness to evidence.","Strongly in favour of it in every situation.","Indifferent; the writer barely mentions it.","Convinced it is the most important virtue of all."],["What does 'stick to their guns' mean in the first paragraph?","Refuse to change their position.","Become aggressive during arguments.","Support stricter weapons laws.","Change their opinions very often."]]}},{"en":"technology and society","he":"טכנולוגיה וחברה","ru":"технологии и общество","ar":"التكنولوجيا والمجتمع","e":"📱","items":[{"en":"Had I known how addictive the app was, I'd never have downloaded it.","he":"אילו ידעתי כמה האפליקציה ממכרת, לעולם לא הייתי מוריד/ה אותה.","ru":"Знай я, насколько затягивает это приложение, я бы никогда его не скачал.","ar":"لو كنت أعلم كم هو التطبيق مُسبّب للإدمان، لما قمت بتنزيله أبدًا.","e":"","alt":[]},{"en":"Smartphones have blurred the line between work time and personal time for many people.","he":"הסמארטפונים טשטשו אצל אנשים רבים את הגבול בין זמן העבודה לזמן הפרטי.","ru":"Смартфоны стёрли для многих людей границу между рабочим и личным временем.","ar":"طمست الهواتف الذكية لدى كثيرين الحدّ الفاصل بين وقت العمل والوقت الشخصي.","e":"","alt":[]},{"en":"It is widely believed that algorithms shape our opinions more than we realise.","he":"מקובל להאמין שאלגוריתמים מעצבים את הדעות שלנו יותר ממה שאנחנו מבינים.","ru":"Широко распространено мнение, что алгоритмы влияют на наши взгляды сильнее, чем мы осознаём.","ar":"يُعتقد على نطاق واسع أن الخوارزميات تشكّل آراءنا أكثر مما ندرك.","e":"","alt":[]},{"en":"Critics argue that constant connectivity is eroding our ability to concentrate deeply.","he":"המבקרים טוענים שהחיבור הקבוע לרשת שוחק את היכולת שלנו להתרכז לעומק.","ru":"Критики утверждают, что постоянное подключение к сети подрывает нашу способность глубоко сосредотачиваться.","ar":"يرى المنتقدون أن الاتصال الدائم بالإنترنت يُضعف قدرتنا على التركيز العميق.","e":"","alt":[]},{"en":"Online privacy is something most people take for granted until it's too late.","he":"פרטיות ברשת היא משהו שרוב האנשים לוקחים כמובן מאליו עד שכבר מאוחר מדי.","ru":"Большинство людей воспринимают конфиденциальность в интернете как должное, пока не становится слишком поздно.","ar":"الخصوصية على الإنترنت أمر يعتبره معظم الناس مسلّمًا به حتى فوات الأوان.","e":"","alt":[]},{"en":"The new regulations are a step in the right direction, but they don't go far enough.","he":"התקנות החדשות הן צעד בכיוון הנכון, אבל הן לא מרחיקות לכת מספיק.","ru":"Новые правила — шаг в правильном направлении, но их недостаточно.","ar":"اللوائح الجديدة خطوة في الاتجاه الصحيح، لكنها لا تذهب بعيدًا بما يكفي.","e":"","alt":[]}],"reading":{"en":"The Myth of the Neutral Screen\n\nEvery few months, another study claims that social media is either destroying a generation or, alternatively, doing no harm whatsoever. The headlines swing back and forth like a pendulum, and the public, understandably, is left scratching its head. I suspect the truth lies somewhere less dramatic and more uncomfortable.\n\nTechnology is often described as a neutral tool, like a hammer that can build a house or break a window. It is a comforting metaphor, but it does not hold water. A hammer does not send you notifications at midnight. It has not been designed by teams of engineers whose bonuses depend on how many hours you spend holding it. The platforms on our phones are not passive objects waiting to be used; they are carefully engineered to keep us coming back.\n\nThis is not to say we should smash our devices and retreat to the countryside. The same tools that fuel endless scrolling also connect isolated people, spread vital information in emergencies, and allow small businesses in Be'er Sheva to reach customers in Berlin. Dismissing all of that would be throwing the baby out with the bathwater.\n\nWhat we need instead is a more grown-up conversation. Rather than asking whether technology is good or bad, we should be asking who designs it, whose interests it serves, and what rules should govern it. Only when we stop pretending the screen is neutral will we be able to make genuinely informed choices about the role it plays in our lives.\n\nUntil then, the pendulum will keep swinging, and we will keep scratching our heads.","he":"המיתוס של המסך הנייטרלי\n\nכל כמה חודשים מתפרסם מחקר נוסף שטוען שהרשתות החברתיות הורסות דור שלם, או לחלופין, לא גורמות שום נזק. הכותרות נעות הלוך ושוב כמו מטוטלת, והציבור, באופן מובן, נשאר מגרד בראשו. אני חושד/ת שהאמת נמצאת במקום פחות דרמטי ויותר לא נוח.\n\nטכנולוגיה מתוארת לעיתים קרובות ככלי נייטרלי, כמו פטיש שיכול לבנות בית או לשבור חלון. זו מטאפורה מנחמת, אבל היא לא מחזיקה מים. פטיש לא שולח לך התראות בחצות. הוא לא תוכנן על ידי צוותי מהנדסים שהבונוסים שלהם תלויים במספר השעות שאת/ה מחזיק/ה אותו. הפלטפורמות בטלפונים שלנו אינן חפצים פסיביים שמחכים שישתמשו בהם; הן מהונדסות בקפידה כדי שנמשיך לחזור אליהן.\n\nאין זה אומר שעלינו לנפץ את המכשירים ולברוח לכפר. אותם כלים שמזינים את הגלילה האינסופית גם מחברים אנשים בודדים, מפיצים מידע חיוני בשעת חירום, ומאפשרים לעסקים קטנים בבאר שבע להגיע ללקוחות בברלין. לפסול את כל זה יהיה כמו לשפוך את התינוק עם מי האמבט.\n\nמה שאנחנו צריכים במקום זה הוא שיחה בוגרת יותר. במקום לשאול אם טכנולוגיה טובה או רעה, עלינו לשאול מי מעצב אותה, את האינטרסים של מי היא משרתת, ואילו כללים צריכים להסדיר אותה. רק כשנפסיק להעמיד פנים שהמסך נייטרלי, נוכל לקבל החלטות מושכלות באמת לגבי התפקיד שהוא ממלא בחיינו.\n\nעד אז, המטוטלת תמשיך לנוע, ואנחנו נמשיך לגרד בראש.","ru":"Миф о нейтральном экране\n\nКаждые несколько месяцев выходит очередное исследование, утверждающее, что социальные сети либо губят целое поколение, либо, наоборот, не причиняют никакого вреда. Заголовки раскачиваются туда-сюда, как маятник, и публика, что вполне понятно, остаётся в недоумении. Подозреваю, что истина находится где-то в менее драматичном и более неудобном месте.\n\nТехнологию часто описывают как нейтральный инструмент — вроде молотка, которым можно построить дом или разбить окно. Это утешительная метафора, но она не выдерживает критики. Молоток не присылает вам уведомлений в полночь. Его не разрабатывали команды инженеров, чьи премии зависят от того, сколько часов вы держите его в руках. Платформы в наших телефонах — не пассивные предметы, ожидающие, когда ими воспользуются; они тщательно спроектированы так, чтобы мы возвращались к ним снова и снова.\n\nЭто не значит, что нужно разбить свои устройства и уехать в деревню. Те же инструменты, что подпитывают бесконечную прокрутку ленты, также объединяют одиноких людей, распространяют жизненно важную информацию в чрезвычайных ситуациях и позволяют малому бизнесу из Беэр-Шевы находить клиентов в Берлине. Отвергнуть всё это означало бы выплеснуть ребёнка вместе с водой.\n\nВместо этого нам нужен более зрелый разговор. Вместо того чтобы спрашивать, хороша технология или плоха, нам следует спрашивать, кто её создаёт, чьим интересам она служит и какие правила должны её регулировать. Лишь когда мы перестанем притворяться, что экран нейтрален, мы сможем делать по-настоящему осознанный выбор относительно той роли, которую он играет в нашей жизни.\n\nА до тех пор маятник будет раскачиваться, а мы будем продолжать недоумевать.","ar":"أسطورة الشاشة المحايدة\n\nكل بضعة أشهر، تصدر دراسة جديدة تزعم أن وسائل التواصل الاجتماعي إمّا تدمّر جيلًا كاملًا، وإمّا لا تُحدث أي ضرر على الإطلاق. تتأرجح العناوين ذهابًا وإيابًا كالبندول، ويبقى الجمهور، وهذا مفهوم، في حيرة من أمره. أظن أن الحقيقة تكمن في مكان أقل دراماتيكية وأكثر إزعاجًا.\n\nكثيرًا ما توصف التكنولوجيا بأنها أداة محايدة، كالمطرقة التي يمكن أن تبني بيتًا أو تكسر نافذة. إنه تشبيه مريح، لكنه لا يصمد أمام التمحيص. فالمطرقة لا ترسل إليك إشعارات في منتصف الليل، ولم يصمّمها فريق من المهندسين تعتمد مكافآتهم على عدد الساعات التي تقضيها ممسكًا بها. المنصات على هواتفنا ليست أدوات سلبية تنتظر أن نستخدمها، بل هي مصمّمة بعناية لتجعلنا نعود إليها مرارًا.\n\nهذا لا يعني أن علينا تحطيم أجهزتنا واللجوء إلى الريف. فالأدوات نفسها التي تغذّي التصفح اللامتناهي تربط أيضًا بين الأشخاص المعزولين، وتنشر معلومات حيوية في حالات الطوارئ، وتتيح للشركات الصغيرة في بئر السبع الوصول إلى زبائن في برلين. ورفض كل ذلك سيكون بمثابة رمي الطفل مع ماء الاستحمام.\n\nما نحتاجه بدلًا من ذلك هو حوار أكثر نضجًا. فبدلًا من أن نسأل هل التكنولوجيا جيدة أم سيئة، علينا أن نسأل من يصمّمها، ومصالح من تخدم، وما القواعد التي يجب أن تحكمها. ولن نتمكن من اتخاذ قرارات مستنيرة حقًا بشأن الدور الذي تؤديه في حياتنا إلا عندما نكفّ عن التظاهر بأن الشاشة محايدة.\n\nوحتى ذلك الحين، سيواصل البندول تأرجحه، وسنواصل نحن حيرتنا.","questions":[["Why does the writer point out that a hammer does not send notifications?","To show that apps are designed to influence our behaviour.","To argue that hammers are more useful than phones.","To suggest apps should send fewer notifications at night.","To prove that technology is completely neutral."],["Which best describes the writer's position on technology?","Balanced, but critical of the idea that it is neutral.","Completely opposed to all modern technology.","Entirely optimistic about social media.","Uninterested in how technology is regulated."],["What does 'it does not hold water' mean in the text?","It is not convincing or logical.","It is not waterproof.","It is too complicated to understand.","It is not widely known."]]}},{"en":"psychology and behaviour","he":"פסיכולוגיה והתנהגות","ru":"психология и поведение","ar":"علم النفس والسلوك","e":"🧠","items":[{"en":"People tend to overestimate how much others notice their mistakes in public.","he":"אנשים נוטים להעריך יתר על המידה עד כמה אחרים שמים לב לטעויות שלהם בציבור.","ru":"Люди склонны переоценивать, насколько окружающие замечают их ошибки на публике.","ar":"يميل الناس إلى المبالغة في تقدير مدى ملاحظة الآخرين لأخطائهم أمام العلن.","e":"","alt":[]},{"en":"He's quick to criticise others, yet he can't take criticism himself.","he":"הוא ממהר לבקר אחרים, אבל הוא עצמו לא מסוגל לקבל ביקורת.","ru":"Он быстро критикует других, но сам критику воспринимать не умеет.","ar":"إنه سريع في انتقاد الآخرين، لكنه لا يتقبّل النقد بنفسه.","e":"","alt":[]},{"en":"Procrastination is often less about laziness and more about fear of failure.","he":"דחיינות קשורה לעיתים קרובות פחות לעצלות ויותר לפחד מכישלון.","ru":"Прокрастинация часто связана не столько с ленью, сколько со страхом неудачи.","ar":"غالبًا ما يرتبط التسويف بالخوف من الفشل أكثر من ارتباطه بالكسل.","e":"","alt":[]},{"en":"If I'd slept better last night, I wouldn't be so irritable right now.","he":"אילו ישנתי טוב יותר אתמול בלילה, לא הייתי עצבני/ת כל כך עכשיו.","ru":"Если бы я лучше выспался прошлой ночью, я бы сейчас не был таким раздражительным.","ar":"لو نمت جيدًا الليلة الماضية، لما كنت سريع الانفعال هكذا الآن.","e":"","alt":[]},{"en":"She tends to bottle up her feelings until she eventually snaps over something small.","he":"היא נוטה להדחיק את הרגשות שלה עד שבסוף היא מתפוצצת בגלל משהו קטן.","ru":"Она склонна держать чувства в себе, пока в конце концов не сорвётся из-за мелочи.","ar":"تميل إلى كبت مشاعرها إلى أن تنفجر في النهاية بسبب أمر بسيط.","e":"","alt":[]},{"en":"We're far more likely to stick to a habit when we track our progress.","he":"יש סיכוי גבוה בהרבה שנתמיד בהרגל כשאנחנו עוקבים אחרי ההתקדמות שלנו.","ru":"Мы с гораздо большей вероятностью сохраним привычку, если будем отслеживать свой прогресс.","ar":"نكون أكثر قابلية بكثير للالتزام بعادة ما عندما نتابع تقدّمنا.","e":"","alt":[]}],"reading":{"en":"The Spotlight We Imagine\n\nPicture this: you walk into a crowded café in Jerusalem, trip over a chair leg, and spill coffee down your shirt. Your cheeks burn. For the rest of the afternoon, you replay the moment, convinced that everyone in the room witnessed your humiliation. According to psychologists, you have just fallen victim to what is known as the spotlight effect.\n\nThe term describes our tendency to overestimate how much other people notice our appearance and behaviour. In one well-known experiment, students were asked to wear a T-shirt with an embarrassing image and walk into a room full of peers. Afterwards, the wearers guessed that roughly half the room had noticed. In reality, fewer than a quarter had.\n\nWhy are we so prone to this illusion? Part of the answer is simple: we are the centre of our own experience. We are acutely aware of every stumble and stray hair, and we find it hard to imagine that others are not equally focused on them. What we forget is that everyone else is busy starring in their own film, preoccupied with their own worries.\n\nRecognising the spotlight effect can be surprisingly liberating. Many people hold back from speaking up in meetings, trying a new hobby, or dancing at a wedding because they fear being judged. Yet the audience they dread is, for the most part, a figment of their imagination.\n\nNone of this means that nobody ever notices anything. But the next time you feel all eyes are on you, it is worth remembering that most of those eyes are, in fact, looking elsewhere.","he":"הזרקור שאנחנו מדמיינים\n\nתארו לעצמכם: אתם נכנסים לבית קפה הומה בירושלים, נתקלים ברגל של כיסא ושופכים קפה על החולצה. הלחיים שלכם בוערות. בשארית אחר הצהריים אתם משחזרים את הרגע שוב ושוב, משוכנעים שכל מי שהיה בחדר ראה את ההשפלה שלכם. לפי פסיכולוגים, נפלתם זה עתה קורבן למה שמכונה 'אפקט הזרקור'.\n\nהמונח מתאר את הנטייה שלנו להעריך יתר על המידה עד כמה אנשים אחרים שמים לב למראה ולהתנהגות שלנו. בניסוי מוכר אחד, סטודנטים התבקשו ללבוש חולצת טי עם תמונה מביכה ולהיכנס לחדר מלא בעמיתים. לאחר מכן, הלובשים העריכו שבערך חצי מהחדר שם לב. במציאות, פחות מרבע שמו לב.\n\nלמה אנחנו כל כך מועדים לאשליה הזו? חלק מהתשובה פשוט: אנחנו במרכז החוויה של עצמנו. אנחנו מודעים מאוד לכל מעידה ולכל שערה סוררת, וקשה לנו לדמיין שאחרים אינם ממוקדים בהן באותה מידה. מה שאנחנו שוכחים הוא שכל האחרים עסוקים בכיכוב בסרט שלהם, טרודים בדאגות שלהם.\n\nההכרה באפקט הזרקור יכולה להיות משחררת באופן מפתיע. אנשים רבים נמנעים מלהתבטא בישיבות, לנסות תחביב חדש או לרקוד בחתונה כי הם חוששים שישפטו אותם. ובכל זאת, הקהל שממנו הם חוששים הוא, ברובו, פרי דמיונם.\n\nאין זה אומר שאף אחד אף פעם לא שם לב לשום דבר. אבל בפעם הבאה שתרגישו שכל העיניים נשואות אליכם, כדאי לזכור שרוב העיניים האלה, למעשה, מסתכלות למקום אחר.","ru":"Прожектор, который мы себе воображаем\n\nПредставьте: вы входите в переполненное кафе в Иерусалиме, спотыкаетесь о ножку стула и проливаете кофе на рубашку. Щёки горят. Весь остаток дня вы прокручиваете этот момент в голове, уверенные, что все в зале стали свидетелями вашего позора. По словам психологов, вы только что стали жертвой так называемого эффекта прожектора.\n\nЭтот термин описывает нашу склонность переоценивать, насколько другие люди замечают нашу внешность и поведение. В одном известном эксперименте студентов попросили надеть футболку с неловким изображением и войти в комнату, полную сверстников. Потом те, кто был в футболке, предположили, что это заметила примерно половина присутствующих. На самом деле заметили меньше четверти.\n\nПочему мы так подвержены этой иллюзии? Отчасти ответ прост: мы — центр собственного опыта. Мы остро осознаём каждую оплошность и каждый выбившийся волосок, и нам трудно представить, что другие не сосредоточены на них так же. Мы забываем, что все остальные заняты главной ролью в своём собственном фильме и поглощены своими заботами.\n\nОсознание эффекта прожектора может удивительным образом освобождать. Многие люди не решаются высказаться на совещании, попробовать новое хобби или потанцевать на свадьбе, потому что боятся осуждения. Однако публика, которой они так страшатся, по большей части существует лишь в их воображении.\n\nЭто не значит, что никто никогда ничего не замечает. Но в следующий раз, когда вам покажется, что все взгляды прикованы к вам, стоит вспомнить, что большинство этих взглядов на самом деле устремлены в другую сторону.","ar":"الضوء الذي نتخيّله\n\nتخيّل هذا: تدخل مقهى مزدحمًا في القدس، فتتعثّر بساق كرسي وتسكب القهوة على قميصك. تحمرّ وجنتاك خجلًا. وطوال ما تبقّى من فترة بعد الظهر، تعيد استرجاع اللحظة مقتنعًا بأن كل من في المكان شهد إحراجك. وفقًا لعلماء النفس، لقد وقعت للتوّ ضحية لما يُعرف بـ«تأثير الضوء المسلّط».\n\nيصف هذا المصطلح ميلنا إلى المبالغة في تقدير مدى ملاحظة الآخرين لمظهرنا وسلوكنا. في تجربة معروفة، طُلب من طلاب ارتداء قميص عليه صورة محرجة ودخول غرفة مليئة بزملائهم. بعد ذلك، قدّر من ارتدوا القميص أن نحو نصف الحاضرين لاحظوه، بينما في الواقع لاحظه أقل من الربع.\n\nلماذا نحن عرضة لهذا الوهم إلى هذا الحد؟ جزء من الإجابة بسيط: نحن مركز تجربتنا الخاصة. ندرك بحدّة كل تعثّر وكل شعرة شاردة، ويصعب علينا أن نتخيّل أن الآخرين لا يركّزون عليها بالقدر نفسه. وما ننساه هو أن كل شخص آخر منشغل بأداء دور البطولة في فيلمه الخاص، غارق في همومه.\n\nإن إدراك تأثير الضوء المسلّط قد يكون محرّرًا بشكل مفاجئ. فكثير من الناس يمتنعون عن التحدث في الاجتماعات، أو تجربة هواية جديدة، أو الرقص في حفل زفاف خوفًا من أن يُحكم عليهم. غير أن الجمهور الذي يخشونه هو، في معظمه، من نسج خيالهم.\n\nلا يعني هذا أن أحدًا لا يلاحظ شيئًا أبدًا. لكن في المرة القادمة التي تشعر فيها بأن كل العيون مسلّطة عليك، تذكّر أن معظم تلك العيون تنظر في الحقيقة إلى مكان آخر.","questions":[["What can be inferred about the students who noticed the T-shirt?","They were far fewer than the wearers expected.","They laughed openly at the wearers.","They made up more than half of the room.","They had been told about the experiment beforehand."],["What is the writer's attitude toward the spotlight effect?","Reassuring; understanding it can free people from fear.","Alarmed; it is a serious mental disorder.","Dismissive; it is not a real phenomenon.","Mocking toward people who get embarrassed."],["What does 'a figment of their imagination' mean?","Something that exists only in their minds.","A small part of a real audience.","A creative idea worth developing.","A clear memory of a past event."]]}},{"en":"environment and the future","he":"סביבה ועתיד","ru":"экология и будущее","ar":"البيئة والمستقبل","e":"🌍","items":[{"en":"Unless we act now, rising temperatures will hit the poorest communities the hardest.","he":"אם לא נפעל עכשיו, עליית הטמפרטורות תפגע הכי קשה בקהילות העניות ביותר.","ru":"Если мы не начнём действовать сейчас, рост температур сильнее всего ударит по беднейшим сообществам.","ar":"ما لم نتحرّك الآن، فإن ارتفاع درجات الحرارة سيضرب المجتمعات الأشد فقرًا بقسوة أكبر.","e":"","alt":[]},{"en":"Recycling alone won't solve the problem; we need to consume far less overall.","he":"מיחזור לבדו לא יפתור את הבעיה; אנחנו צריכים לצרוך הרבה פחות באופן כללי.","ru":"Одна лишь переработка не решит проблему: нам нужно в целом потреблять гораздо меньше.","ar":"إعادة التدوير وحدها لن تحلّ المشكلة؛ علينا أن نستهلك أقل بكثير بشكل عام.","e":"","alt":[]},{"en":"The company was accused of greenwashing after exaggerating its environmental achievements.","he":"החברה הואשמה בגרינוושינג (הסוואה ירוקה) אחרי שהגזימה בהישגיה הסביבתיים.","ru":"Компанию обвинили в гринвошинге после того, как она преувеличила свои экологические достижения.","ar":"اتُّهمت الشركة بالغسل الأخضر بعد أن بالغت في إنجازاتها البيئية.","e":"","alt":[]},{"en":"Solar energy makes perfect sense in a country with as much sunshine as Israel.","he":"אנרגיה סולארית הגיונית לגמרי במדינה שיש בה כל כך הרבה שמש כמו בישראל.","ru":"Солнечная энергия вполне логична в стране, где столько солнца, как в Израиле.","ar":"الطاقة الشمسية منطقية تمامًا في بلد مشمس بقدر إسرائيل.","e":"","alt":[]},{"en":"It's estimated that the city will face severe water shortages within two decades.","he":"מעריכים שהעיר תתמודד עם מחסור חמור במים בתוך שני עשורים.","ru":"По оценкам, в течение двух десятилетий город столкнётся с острой нехваткой воды.","ar":"تشير التقديرات إلى أن المدينة ستواجه نقصًا حادًا في المياه خلال عقدين.","e":"","alt":[]},{"en":"Little did we realise how quickly the coastline would change in our lifetime.","he":"לא העלינו בדעתנו כמה מהר קו החוף ישתנה עוד בימי חיינו.","ru":"Мы и не подозревали, как быстро изменится береговая линия ещё при нашей жизни.","ar":"لم نكن ندرك مدى السرعة التي سيتغيّر بها الساحل في حياتنا.","e":"","alt":[]}],"reading":{"en":"Hope Is Not a Strategy, But Neither Is Despair\n\nConversations about the climate tend to fall into two camps. In one, people insist that technology will save the day: electric cars, clean energy and clever engineering will see us through, so there is no need to panic. In the other, people are convinced the game is already lost, and that nothing we do now can make a meaningful difference. Both positions, I would argue, are equally unhelpful.\n\nBlind optimism encourages complacency. If we are certain that some future invention will fix everything, there is little reason to change our habits, vote differently or demand action from governments. It lets us off the hook. Yet despair produces the very same outcome by a different route. If catastrophe is inevitable, why bother cutting back on flights or campaigning for cleaner public transport?\n\nThe reality is messier and, in a sense, more encouraging. Climate change is not an on-off switch; every fraction of a degree matters. The difference between a world that warms by one and a half degrees and one that warms by two is measured in millions of lives, lost harvests and vanished species. That means our choices still carry enormous weight.\n\nIsrael offers a telling example. A country once defined by water scarcity now recycles the vast majority of its wastewater for agriculture and produces much of its drinking water through desalination. These achievements did not come from wishful thinking or from giving up. They came from sustained investment, political will and a refusal to accept that the situation was hopeless.\n\nHope, in other words, is not a strategy. But neither is despair.","he":"תקווה היא לא אסטרטגיה, אבל גם ייאוש לא\n\nשיחות על האקלים נוטות להתחלק לשני מחנות. באחד, אנשים מתעקשים שהטכנולוגיה תציל את המצב: מכוניות חשמליות, אנרגיה נקייה והנדסה מתוחכמת יעבירו אותנו את זה, ולכן אין סיבה להיבהל. בשני, אנשים משוכנעים שהמשחק כבר אבוד, ושום דבר שנעשה עכשיו לא יוכל לחולל שינוי משמעותי. שתי העמדות, לטענתי, מועילות באותה מידה מעט.\n\nאופטימיות עיוורת מעודדת שאננות. אם אנחנו בטוחים שהמצאה עתידית כלשהי תתקן הכול, אין סיבה של ממש לשנות הרגלים, להצביע אחרת או לדרוש מממשלות לפעול. זה משחרר אותנו מאחריות. אבל הייאוש מוביל בדיוק לאותה תוצאה בדרך אחרת. אם האסון בלתי נמנע, למה לטרוח לצמצם טיסות או לפעול למען תחבורה ציבורית נקייה יותר?\n\nהמציאות מורכבת יותר, ובמובן מסוים, גם מעודדת יותר. שינוי האקלים אינו מתג של הפעלה וכיבוי; כל שבריר מעלה חשוב. ההבדל בין עולם שמתחמם במעלה וחצי לעולם שמתחמם בשתי מעלות נמדד במיליוני חיים, ביבולים שאבדו ובמינים שנכחדו. משמעות הדבר היא שלבחירות שלנו עדיין יש משקל עצום.\n\nישראל מספקת דוגמה מאלפת. מדינה שבעבר הוגדרה על ידי מחסור במים ממחזרת כיום את הרוב המכריע של מי השפכים שלה לחקלאות ומפיקה חלק גדול ממי השתייה שלה בהתפלה. ההישגים האלה לא נבעו ממשאלות לב או מהרמת ידיים. הם נבעו מהשקעה מתמשכת, מרצון פוליטי ומסירוב לקבל שהמצב חסר תקווה.\n\nבמילים אחרות, תקווה היא לא אסטרטגיה. אבל גם ייאוש לא.","ru":"Надежда — не стратегия, но и отчаяние тоже\n\nРазговоры о климате, как правило, делятся на два лагеря. В одном люди настаивают, что технологии всех спасут: электромобили, чистая энергия и изобретательная инженерия помогут нам выкарабкаться, так что паниковать незачем. В другом люди убеждены, что игра уже проиграна и ничто из того, что мы делаем сейчас, не изменит ситуацию к лучшему. Обе позиции, на мой взгляд, одинаково бесполезны.\n\nСлепой оптимизм порождает самоуспокоенность. Если мы уверены, что какое-нибудь будущее изобретение всё исправит, нет особых причин менять привычки, голосовать иначе или требовать действий от правительств. Это снимает с нас ответственность. Но отчаяние приводит к тому же результату, только другим путём. Если катастрофа неизбежна, зачем летать меньше или добиваться более чистого общественного транспорта?\n\nРеальность сложнее и в каком-то смысле обнадёживает больше. Изменение климата — это не выключатель с двумя положениями; важна каждая доля градуса. Разница между миром, потеплевшим на полтора градуса, и миром, потеплевшим на два, измеряется миллионами жизней, погибшими урожаями и исчезнувшими видами. Это значит, что наш выбор по-прежнему имеет огромный вес.\n\nИзраиль служит показательным примером. Страна, которую когда-то определяла нехватка воды, сегодня перерабатывает подавляющую часть сточных вод для сельского хозяйства и получает значительную долю питьевой воды за счёт опреснения. Эти достижения появились не благодаря несбыточным мечтам и не из-за опущенных рук. Они стали результатом долгосрочных инвестиций, политической воли и отказа признать ситуацию безнадёжной.\n\nИными словами, надежда — не стратегия. Но и отчаяние тоже.","ar":"الأمل ليس استراتيجية، ولا اليأس كذلك\n\nتميل النقاشات حول المناخ إلى الانقسام إلى معسكرين. في الأول، يصرّ الناس على أن التكنولوجيا ستنقذ الموقف: السيارات الكهربائية والطاقة النظيفة والهندسة الذكية ستعبر بنا الأزمة، فلا داعي للذعر. وفي الثاني، يقتنع الناس بأن المعركة خاسرة أصلًا، وأن لا شيء نفعله الآن يمكن أن يُحدث فرقًا حقيقيًا. وأرى أن كلا الموقفين غير مفيد بالقدر نفسه.\n\nالتفاؤل الأعمى يشجّع على التراخي. فإذا كنا واثقين من أن اختراعًا مستقبليًا ما سيصلح كل شيء، فلا يبقى سبب يُذكر لتغيير عاداتنا أو التصويت بشكل مختلف أو مطالبة الحكومات بالتحرك. إنه يعفينا من المسؤولية. لكن اليأس يؤدي إلى النتيجة نفسها عبر طريق مختلف. فإذا كانت الكارثة حتمية، فلماذا نتكلّف عناء تقليل رحلات الطيران أو المطالبة بمواصلات عامة أنظف؟\n\nالواقع أكثر تعقيدًا، وهو بمعنى ما أكثر تشجيعًا. فتغيّر المناخ ليس مفتاح تشغيل وإطفاء؛ بل كل جزء من الدرجة مهم. والفرق بين عالم ترتفع حرارته درجة ونصفًا وعالم ترتفع حرارته درجتين يُقاس بملايين الأرواح والمحاصيل الضائعة والأنواع المنقرضة. وهذا يعني أن خياراتنا لا تزال تحمل وزنًا هائلًا.\n\nتقدّم إسرائيل مثالًا معبّرًا. فبلد كان يُعرَّف يومًا بشحّ المياه بات اليوم يعيد تدوير الغالبية العظمى من مياه الصرف لأغراض الزراعة، وينتج جزءًا كبيرًا من مياه الشرب عبر التحلية. لم تأتِ هذه الإنجازات من التمنّي ولا من الاستسلام، بل من الاستثمار المتواصل والإرادة السياسية ورفض القبول بأن الوضع ميؤوس منه.\n\nبعبارة أخرى، الأمل ليس استراتيجية، ولا اليأس كذلك.","questions":[["Why does the writer mention Israel's water achievements?","To show that determined action can solve serious problems.","To argue that Israel has already solved climate change.","To prove that technology alone will save the planet.","To criticise Israel's reliance on desalination."],["How does the writer view the optimistic and pessimistic camps?","As equally unhelpful, since both discourage action.","The optimists are right and the pessimists are wrong.","The pessimists are right and the optimists are naive.","Both are correct, but in different ways."],["What does 'it lets us off the hook' mean in the text?","It frees us from feeling responsible.","It helps us catch more fish.","It makes us feel extremely guilty.","It forces us to make difficult choices."]]}},{"en":"culture and the arts","he":"תרבות ואמנות","ru":"культура и искусство","ar":"الثقافة والفنون","e":"🎭","items":[{"en":"The film received rave reviews, but I found the plot rather predictable and slow.","he":"הסרט קיבל ביקורות נלהבות, אבל העלילה נראתה לי די צפויה ואיטית.","ru":"Фильм получил восторженные отзывы, но сюжет показался мне довольно предсказуемым и затянутым.","ar":"حصل الفيلم على مراجعات حماسية، لكنني وجدت الحبكة متوقّعة وبطيئة إلى حدّ ما.","e":"","alt":[]},{"en":"Public funding for the arts is often the first thing to go in a crisis.","he":"מימון ציבורי לאמנויות הוא לעיתים קרובות הדבר הראשון שנחתך בזמן משבר.","ru":"Государственное финансирование искусства часто первым попадает под сокращение во время кризиса.","ar":"غالبًا ما يكون التمويل العام للفنون أول ما يُقتطع في أوقات الأزمات.","e":"","alt":[]},{"en":"Her latest exhibition really struck a chord with younger visitors at the museum.","he":"התערוכה האחרונה שלה ממש נגעה בלבם של המבקרים הצעירים במוזיאון.","ru":"Её последняя выставка по-настоящему нашла отклик у молодых посетителей музея.","ar":"لامس معرضها الأخير وترًا حساسًا لدى الزوار الأصغر سنًا في المتحف.","e":"","alt":[]},{"en":"I'm not much of a theatre buff, but that play completely blew me away.","he":"אני לא ממש חובב/ת תיאטרון, אבל ההצגה הזו פשוט הדהימה אותי.","ru":"Я не большой любитель театра, но этот спектакль меня просто потряс.","ar":"لست من عشّاق المسرح كثيرًا، لكن تلك المسرحية أذهلتني تمامًا.","e":"","alt":[]},{"en":"Some critics claim that streaming has lowered the quality of television, but I disagree.","he":"יש מבקרים שטוענים שהסטרימינג הוריד את איכות הטלוויזיה, אבל אני לא מסכים/ה.","ru":"Некоторые критики утверждают, что стриминг снизил качество телевидения, но я с этим не согласен.","ar":"يزعم بعض النقاد أن خدمات البث خفّضت جودة التلفزيون، لكنني لا أوافق.","e":"","alt":[]},{"en":"The novel is said to have been inspired by the author's childhood in Jaffa.","he":"אומרים שהרומן נכתב בהשראת ילדותו של הסופר ביפו.","ru":"Говорят, что роман был вдохновлён детством автора в Яффо.","ar":"يُقال إن الرواية مستوحاة من طفولة الكاتب في يافا.","e":"","alt":[]}],"reading":{"en":"Who Gets to Decide What Counts as Art?\n\nA few years ago, a friend dragged me to a contemporary art gallery in Tel Aviv. In one room, a single folding chair stood in the middle of an otherwise empty floor. A small card beside it gave the title and a price that made my eyes water. My friend stood in reverent silence. I, I confess, struggled to keep a straight face.\n\nFor a long time, I regarded moments like that as proof that the art world had lost the plot. Surely, I thought, art should demand skill, beauty, or at the very least effort. A chair anyone could buy in a hardware shop hardly seemed to qualify.\n\nI have since softened my stance, though not entirely. What changed my mind was not the chair itself but the conversations it provoked. That evening, over dinner, my friend and I argued for two hours about what makes something valuable, who decides, and why. It occurred to me later that very few 'beautiful' paintings had ever made me think so hard.\n\nThat said, I remain wary of the idea that anything goes. When any object can be declared art simply because someone with influence says so, the word risks losing its meaning altogether. There is a real danger that audiences, feeling patronised, will simply stop showing up.\n\nPerhaps the healthiest position lies somewhere in between: open-minded enough to let unconventional work challenge us, but sceptical enough to ask whether the emperor is, in fact, wearing any clothes. Art, after all, should be able to survive a few hard questions.","he":"מי מחליט מה נחשב לאמנות?\n\nלפני כמה שנים, חבר/ה גרר/ה אותי לגלריה לאמנות עכשווית בתל אביב. באחד החדרים עמד כיסא מתקפל יחיד באמצע רצפה ריקה לגמרי. כרטיס קטן לידו ציין את שם היצירה ומחיר שגרם לעיניים שלי לדמוע. החבר/ה שלי עמד/ה בשתיקה מלאת יראה. אני, אני מודה, התקשיתי לשמור על פנים רציניות.\n\nבמשך זמן רב, ראיתי ברגעים כאלה הוכחה לכך שעולם האמנות איבד את הצפון. אמנות, כך חשבתי, אמורה לדרוש מיומנות, יופי, או לכל הפחות מאמץ. כיסא שכל אחד יכול לקנות בחנות לכלי בית בקושי נראה עומד בתנאים.\n\nמאז ריככתי את עמדתי, אם כי לא לגמרי. מה ששינה את דעתי לא היה הכיסא עצמו, אלא השיחות שהוא עורר. באותו ערב, בארוחת הערב, התווכחנו שעתיים על מה הופך דבר לבעל ערך, מי מחליט, ולמה. מאוחר יותר עלה בדעתי שמעט מאוד ציורים 'יפים' גרמו לי אי פעם לחשוב כל כך הרבה.\n\nעם זאת, אני עדיין נזהר/ת מהרעיון שהכול הולך. כשכל חפץ יכול להיות מוכרז כאמנות רק כי מישהו בעל השפעה אמר זאת, המילה מסתכנת באובדן משמעותה לחלוטין. קיימת סכנה ממשית שהקהל, שירגיש שמתנשאים עליו, פשוט יפסיק להגיע.\n\nאולי העמדה הבריאה ביותר נמצאת איפשהו באמצע: פתוחה מספיק כדי לאפשר ליצירות לא שגרתיות לאתגר אותנו, אבל ספקנית מספיק כדי לשאול אם המלך, למעשה, לבוש בכלל. אחרי הכול, אמנות אמורה להיות מסוגלת לשרוד כמה שאלות קשות.","ru":"Кто решает, что считать искусством?\n\nНесколько лет назад друг затащил меня в галерею современного искусства в Тель-Авиве. В одном из залов посреди совершенно пустого пола стоял единственный складной стул. Рядом висела маленькая табличка с названием и ценой, от которой у меня глаза полезли на лоб. Мой друг стоял в благоговейном молчании. А я, признаюсь, с трудом сдерживал смех.\n\nДолгое время я считал подобные моменты доказательством того, что мир искусства совсем потерял связь с реальностью. Искусство, думал я, должно требовать мастерства, красоты или хотя бы усилий. Стул, который любой может купить в хозяйственном магазине, вряд ли подходил под это определение.\n\nС тех пор я смягчил свою позицию, хотя и не полностью. Моё мнение изменил не сам стул, а разговоры, которые он вызвал. В тот вечер за ужином мы с другом два часа спорили о том, что делает вещь ценной, кто это решает и почему. Позже мне пришло в голову, что очень немногие «красивые» картины когда-либо заставляли меня так напряжённо думать.\n\nТем не менее я по-прежнему насторожённо отношусь к идее, что дозволено всё. Когда любой предмет можно объявить искусством только потому, что так сказал кто-то влиятельный, само слово рискует полностью утратить смысл. Есть реальная опасность, что зрители, почувствовав снисходительное отношение, просто перестанут приходить.\n\nВозможно, самая здоровая позиция находится где-то посередине: достаточно открытая, чтобы позволить нестандартным работам бросать нам вызов, но достаточно скептичная, чтобы спросить, а одет ли король на самом деле. В конце концов, искусство должно выдерживать несколько трудных вопросов.","ar":"من يقرّر ما يُعدّ فنًا؟\n\nقبل بضع سنوات، جرّني صديق إلى معرض للفن المعاصر في تل أبيب. في إحدى القاعات، كان هناك كرسي قابل للطيّ وحيد يقف في وسط أرضية فارغة تمامًا. وبجانبه بطاقة صغيرة تحمل العنوان وسعرًا جعل عينيّ تدمعان. وقف صديقي في صمت مهيب، أما أنا، وأعترف بذلك، فقد كافحت كي لا أضحك.\n\nلفترة طويلة، اعتبرت لحظات كهذه دليلًا على أن عالم الفن قد فقد صوابه. فالفن، كما كنت أظن، يجب أن يتطلّب مهارة أو جمالًا أو على الأقل جهدًا. وكرسي يمكن لأي شخص شراؤه من متجر أدوات منزلية لم يبدُ مؤهلًا لذلك.\n\nمنذ ذلك الحين، خفّفت من موقفي، وإن لم يكن كليًا. فما غيّر رأيي لم يكن الكرسي نفسه، بل النقاشات التي أثارها. في ذلك المساء، على العشاء، تجادلت أنا وصديقي لساعتين حول ما يجعل الشيء ذا قيمة، ومن يقرّر ذلك، ولماذا. وخطر لي لاحقًا أن قلّة قليلة جدًا من اللوحات «الجميلة» جعلتني أفكّر بهذا العمق.\n\nومع ذلك، ما زلت حذرًا من فكرة أن كل شيء مقبول. فعندما يمكن إعلان أي غرض عملًا فنيًا لمجرد أن شخصًا ذا نفوذ قال ذلك، تتعرّض الكلمة لخطر فقدان معناها كليًا. وهناك خطر حقيقي أن يتوقف الجمهور ببساطة عن الحضور حين يشعر بالاستعلاء عليه.\n\nربما يكمن الموقف الأكثر صحة في مكان ما بين الاثنين: منفتح بما يكفي ليسمح للأعمال غير التقليدية بأن تتحدّانا، ومتشكّك بما يكفي ليسأل إن كان الإمبراطور يرتدي ملابس فعلًا. ففي النهاية، ينبغي للفن أن يصمد أمام بعض الأسئلة الصعبة.","questions":[["What eventually made the writer view the chair more positively?","It sparked a long and meaningful discussion.","The writer learned how expensive it really was.","The friend explained the artist's technique in detail.","The writer later saw it in a famous museum."],["Which best describes the writer's current view of contemporary art?","Cautiously open, but still somewhat sceptical.","Completely dismissive of all modern art.","Enthusiastic about everything shown in galleries.","Uninterested in questions about art."],["What does 'struggled to keep a straight face' mean?","Found it hard not to laugh.","Found it hard to stay awake.","Found it hard to see clearly.","Found it hard to stand still."]]}},{"en":"debate and discussion","he":"ויכוח ודיון","ru":"дебаты и дискуссия","ar":"المناظرة والنقاش","e":"⚖️","dialog":true,"items":[{"q":"Working from home has made people lazy. Companies should bring everyone back to the office.","en":"I'd argue productivity depends more on management than location; many remote teams actually outperform office-based ones.","he":"הייתי טוען/ת שהפרודוקטיביות תלויה יותר בניהול מאשר במיקום; צוותים רבים שעובדים מרחוק דווקא מצליחים יותר מצוותים במשרד.","ru":"Я бы сказал, что продуктивность зависит скорее от управления, чем от места; многие удалённые команды работают даже лучше офисных.","ar":"أرى أن الإنتاجية تعتمد على الإدارة أكثر من المكان؛ فكثير من الفرق التي تعمل عن بُعد تتفوّق فعلًا على فرق المكاتب."},{"q":"Social media has done more harm than good. We'd all be better off without it.","en":"That's a bit sweeping; it certainly has downsides, but it also connects people and spreads vital information.","he":"זו הכללה גורפת מדי; יש לה בהחלט חסרונות, אבל היא גם מחברת בין אנשים ומפיצה מידע חיוני.","ru":"Это слишком огульно: у них, безусловно, есть недостатки, но они также объединяют людей и распространяют важную информацию.","ar":"هذا تعميم مبالغ فيه؛ لها سلبيات بالتأكيد، لكنها أيضًا تربط بين الناس وتنشر معلومات حيوية."},{"q":"University degrees are a waste of time and money. Experience is all that matters.","en":"Experience is invaluable, but for some professions, like medicine or engineering, a degree is genuinely essential.","he":"ניסיון הוא דבר שלא יסולא בפז, אבל במקצועות מסוימים, כמו רפואה או הנדסה, תואר הוא באמת הכרחי.","ru":"Опыт бесценен, но для некоторых профессий, например медицины или инженерии, диплом действительно необходим.","ar":"الخبرة لا تقدّر بثمن، لكن في بعض المهن، كالطب أو الهندسة، تكون الشهادة الجامعية ضرورية حقًا."},{"q":"Tourism ruins every place it touches. Cities should simply ban mass tourism.","en":"Banning it outright seems extreme; smarter regulation could protect residents while still supporting local businesses.","he":"איסור מוחלט נראה לי קיצוני; רגולציה חכמה יותר יכולה להגן על התושבים ועדיין לתמוך בעסקים המקומיים.","ru":"Полный запрет кажется крайностью; более разумное регулирование могло бы защитить жителей и при этом поддержать местный бизнес.","ar":"يبدو حظرها كليًا أمرًا متطرفًا؛ فتنظيم أذكى يمكن أن يحمي السكان مع الاستمرار في دعم الأعمال المحلية."},{"q":"Artificial intelligence will replace most jobs within ten years, so there's no point learning new skills.","en":"I'm not so sure; history suggests technology transforms jobs rather than eliminating them, so adaptable skills matter more than ever.","he":"אני לא כל כך בטוח/ה; ההיסטוריה מראה שטכנולוגיה משנה עבודות ולא מבטלת אותן, ולכן כישורים גמישים חשובים יותר מאי פעם.","ru":"Я не уверен: история показывает, что технологии меняют профессии, а не уничтожают их, поэтому гибкие навыки важны как никогда.","ar":"لست متأكدًا من ذلك؛ فالتاريخ يشير إلى أن التكنولوجيا تُحوّل الوظائف بدلًا من إلغائها، لذا فالمهارات القابلة للتكيّف أهم من أي وقت مضى."},{"q":"Children today are spoiled. Things were much better when we were young.","en":"Every generation says that, though; kids today face different pressures, and in many ways they're remarkably resilient.","he":"אבל כל דור אומר את זה; ילדים היום מתמודדים עם לחצים אחרים, ובמובנים רבים הם חסינים באופן מרשים.","ru":"Но ведь каждое поколение так говорит; сегодняшние дети сталкиваются с другими трудностями и во многом удивительно стойкие.","ar":"لكن كل جيل يقول ذلك؛ فأطفال اليوم يواجهون ضغوطًا مختلفة، وهم في نواحٍ كثيرة يتمتعون بمرونة لافتة."}]}]},{"id":"talk","group":"adults","he":"תרגול דיבור","sub":"שיחות אמיתיות: הדמות שואלת, ואתם עונים במשפטים מלאים","e":"🗣️","units":[{"en":"getting to know someone","he":"היכרות","ru":"знакомство","ar":"التعارف","e":"🤝","dialog":true,"items":[{"q":"So, what do you do for a living?","en":"I work as a nurse at a hospital in Haifa, mostly on night shifts.","he":"אני עובד/
