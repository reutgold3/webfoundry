 או מעדיפים להחזיק בסחורות ממשיות כמו מזון ומתכות.\n\nמכאן שהכסף אינו רק כלי טכני להחלפת סחורות, אלא גם מוסד חברתי. הוא פועל כל עוד רוב האנשים נוהגים כאילו הוא פועל. תובנה זו מסבירה מדוע בנקים מרכזיים מקדישים מאמץ כה רב לא רק לקביעת שיעורי ריבית, אלא גם לתקשורת עם הציבור: הצהרה אמינה על כוונותיהם יכולה לפעמים להשפיע על הכלכלה לא פחות מן הצעדים עצמם. במובן זה, אמינותו של הבנק המרכזי היא נכס כלכלי לכל דבר, וקל הרבה יותר לאבד אותה מאשר לבנות אותה מחדש.","items":[{"id":"rh-6-1","lvl":1,"q":"מהו הרעיון המרכזי של הקטע?","o":["כסף צריך להיות מגובה בזהב כדי שיהיה לו ערך","הדפסת כסף היא דרך טובה לממן הוצאות ממשלה","בנקים מרכזיים קובעים את מחירי הסחורות","ערכו של הכסף המודרני נשען בעיקר על אמון הציבור"],"a":3,"ex":"הקטע פותח בשאלה מה מעניק לשטר את ערכו, ומשיב לאורכו כולו: האמון וההסכמה הרחבה."},{"id":"rh-6-2","lvl":2,"q":"לפי הפסקה השנייה, איזו טענה נכונה?","o":["כיום רוב המטבעות מגובים במתכת יקרה","בעבר היה אפשר, לפחות להלכה, להמיר שטרות במתכת יקרה","למטבעות זהב מעולם לא היה ערך עצמי","השיטה הישנה עדיין נהוגה ברוב המדינות"],"a":1,"ex":"נאמר שבתקופות מאוחרות ניתן היה, לפחות להלכה, להמיר שטרות בכמות קבועה של מתכת יקרה, ושרוב המדינות נטשו שיטה זו."},{"id":"rh-6-3","lvl":3,"q":"הביטוי ״הציפייה להתרחשות היא שמביאה להתרחשותה״ מתאר:","o":["נבואה המגשימה את עצמה","תחזית שהתבדתה","החלטה רציונלית של הממשלה","מצב שבו אין קשר בין ציפיות למציאות"],"a":0,"ex":"החשש מירידת ערך המטבע גורם לאנשים להיפטר ממנו, וכך הוא עצמו מוריד את ערכו – זוהי נבואה המגשימה את עצמה."},{"id":"rh-6-4","lvl":2,"q":"מה תפקידה של הפסקה השלישית?","o":["להסביר כיצד מייצרים שטרות","לתאר את היתרונות של מטבע זר","להראות מה קורה כאשר אמון הציבור בכסף מתערער","להוכיח שמחירים אינם עולים לעולם"],"a":2,"ex":"הפסקה מתארת את התרחיש ההפוך – איבוד האמון – ובכך ממחישה עד כמה ערך הכסף תלוי בו."},{"id":"rh-6-5","lvl":4,"q":"לפי הקטע, מדוע בנקים מרכזיים מקפידים על תקשורת עם הציבור?","o":["משום שהחוק מחייב אותם לכך","משום שהם מבקשים להסתיר את מדיניותם","משום ששיעורי הריבית אינם משפיעים על הכלכלה","משום שהצהרות אמינות משפיעות על ציפיות הציבור, ובכך על הכלכלה עצמה"],"a":3,"ex":"מאחר שהכסף פועל כל עוד אנשים מאמינים בו, הצהרה אמינה משפיעה על התנהגות הציבור – לעיתים לא פחות מן הצעדים עצמם."}]},{"id":"rh-7","lvl":3,"title":"כיצד מילים נודדות","text":"אין שפה החיה בבידוד מוחלט. כל עוד דוברים של שפות שונות נפגשים – במסחר, במלחמה, בהגירה או בתרבות – מילים עוברות משפה לשפה. בלשנים מכנים מילים אלה מילים שאולות, וקשה למצוא שפה שאין בה רבות כאלה. העברית, לדוגמה, קלטה במהלך ההיסטוריה מילים מן הארמית, מן היוונית, מן הפרסית, מן הערבית, מן היידיש ומן האנגלית, ורבות מהן נתפסות כיום כעבריות לכל דבר. חלקן חדרו לשפה לפני אלפי שנים, ואחרות נכנסו אליה רק בדור האחרון, עם התפתחות המחשבים והתקשורת.\n\nהמילים השאולות אינן עוברות במקרה. לרוב הן מגיעות יחד עם הדבר שהן מציינות: כאשר מוצר, מנהג או טכנולוגיה חדשים מגיעים מתרבות אחרת, נוח לאמץ גם את שמם. משום כך אפשר ללמוד מן המילים השאולות שבשפה על מגעים היסטוריים בין עמים. אוצר מילים שאול בתחום הספנות, למשל, עשוי להעיד על קשרים ימיים, ומילים בתחום הממשל עשויות לרמז על תקופה של שלטון זר. גם התחום שבו מרוכזות המילים השאולות מאותה שפה מלמד על אופי הקשר: מילים בתחומי המזון והבישול מעידות לרוב על מגע יומיומי וקרוב, ואילו מונחים מדעיים מעידים על השפעה של מוסדות לימוד ומחקר.\n\nעם הגעתן לשפה החדשה, המילים אינן נשארות כפי שהיו. הן מותאמות לצלילים של השפה הקולטת, מקבלות צורות דקדוקיות חדשות, ולעיתים אף משנות את משמעותן. מילה שציינה בשפת המקור דבר כללי עשויה לציין בשפה הקולטת דבר מסוים מאוד, או להפך. יש מילים שאולות שהשתלבו כל כך עד שהן משמשות בסיס ליצירת מילים חדשות, בדיוק כמו מילים מקוריות, ודוברים רבים אינם מודעים כלל למוצאן הזר. לעיתים מילה שאולה אף חוזרת, בצורה שונה, אל שפת המקור, ונקלטת בה כאילו הייתה מילה זרה.\n\nלא תמיד מתקבלת תופעה זו בברכה. בקהילות רבות נשמעים קולות המזהירים מפני הצפת השפה במילים זרות, ומוסדות לשון מציעים חלופות מקומיות למונחים חדשים. חלק מן החלופות האלה מתקבלות ונעשות שגורות, ואחרות נותרות על הנייר. ההכרעה, בסופו של דבר, נעשית בידי ציבור הדוברים, הבוחר – לרוב באופן לא מודע – במילה הנוחה לו. ההיסטוריה של השפות מלמדת שההשאלה אינה סימן לחולשה, אלא לחיוניות: שפה שקולטת מילים היא שפה הנמצאת במגע עם העולם.","items":[{"id":"rh-7-1","lvl":2,"q":"מהו הרעיון המרכזי של הקטע?","o":["העברית היא שפה שכמעט אין בה מילים שאולות","מילים שאולות הן תופעה טבעית המשקפת מגע בין תרבויות ומעידה על חיוניות השפה","מוסדות לשון מצליחים תמיד להחליף מילים זרות","מילים שאולות שומרות תמיד על משמעותן המקורית"],"a":1,"ex":"הקטע מתאר כיצד ומדוע מילים עוברות בין שפות, כיצד הן משתנות, ומסכם שההשאלה היא סימן לחיוניות."},{"id":"rh-7-2","lvl":1,"q":"לפי הפסקה השנייה, על מה עשוי להעיד אוצר מילים שאול בתחום הספנות?","o":["על קשרים ימיים בין עמים","על תקופה של שלטון זר","על השפעה של שירה זרה","על חוסר עניין בים"],"a":0,"ex":"נאמר במפורש שאוצר מילים בתחום הספנות עשוי להעיד על קשרים ימיים."},{"id":"rh-7-3","lvl":2,"q":"איזו מן הטענות הבאות נכונה לפי הפסקה השלישית?","o":["מילה שאולה אינה יכולה לשמש בסיס למילים חדשות","משמעותה של מילה שאולה הופכת תמיד לכללית יותר","מילים שאולות נשמרות תמיד בצורתן המקורית","מילים שאולות מותאמות לצלילי השפה הקולטת"],"a":3,"ex":"הפסקה פותחת בכך שהמילים מותאמות לצלילים של השפה הקולטת; שאר הטענות סותרות אותה."},{"id":"rh-7-4","lvl":3,"q":"המילה ״שגורות״ בפסקה הרביעית פירושה:","o":["נדירות ומיושנות","רשמיות בלבד","נפוצות ורגילות בשימוש","שגויות"],"a":2,"ex":"החלופות שנעשות שגורות מוצגות בניגוד לאלה שנותרות על הנייר – כלומר הן נכנסות לשימוש יומיומי."},{"id":"rh-7-5","lvl":3,"q":"מהי עמדת הכותב כלפי תופעת המילים השאולות?","o":["חשש מפני הצפת השפה במילים זרות","תמיכה בהחלפת כל המילים הזרות בחלופות מקומיות","עמדה חיובית הרואה בהשאלה סימן לחיוניות השפה","ניטרליות מוחלטת, ללא הבעת עמדה"],"a":2,"ex":"החשש מוצג כעמדה של אחרים, ואילו הכותב מסכם שההשאלה אינה סימן לחולשה אלא לחיוניות."}]},{"id":"rh-8","lvl":1,"title":"שוניות האלמוגים בסכנה","text":"שוניות האלמוגים תופסות חלק זעיר משטח קרקעית הים, ובכל זאת הן מהוות בית לחלק ניכר מכל מיני הדגים והיצורים הימיים. מבחוץ הן נראות כמו סלעים צבעוניים, אך למעשה הן מבנים חיים שנבנו במשך אלפי שנים בידי יצורים זעירים. כל אלמוג מורכב ממושבה של פוליפים, בעלי חיים קטנים המפרישים שלד גירני. השלדים מצטברים זה על גבי זה, ויוצרים בהדרגה את השונית. שוניות מסוימות כה גדולות עד שניתן לראותן מן החלל, והן נחשבות למבנים הגדולים ביותר שנבנו בידי יצורים חיים. הן משמשות מקום רבייה ומסתור לדגים צעירים, ומקור מזון ליצורים רבים.\n\nסוד צבעיהם ושגשוגם של האלמוגים טמון בשותפות. בתוך רקמות הפוליפים חיות אצות מיקרוסקופיות, המייצרות מזון באמצעות אור השמש ומעבירות חלק ממנו לאלמוג. בתמורה, האלמוג מספק לאצות מחסה ואת החומרים שהן זקוקות להם. האצות גם מעניקות לאלמוגים את צבעיהם העזים. זוהי דוגמה מובהקת להדדיות בטבע: שני יצורים שונים לחלוטין, שכל אחד מהם מתקשה לשרוד בלי השני.\n\nאולם שותפות זו רגישה מאוד לשינויים בסביבה. כאשר טמפרטורת המים עולה אפילו במעלה או שתיים מעל הרגיל לאורך זמן, האלמוגים נכנסים למצב של עקה ומגרשים את האצות מתוכם. בלי האצות הם מאבדים את צבעם ומלבינים, ואם המצב נמשך, הם עלולים למות מרעב. תופעת ההלבנה, שהייתה נדירה בעבר, נעשתה בעשורים האחרונים תכופה ונרחבת, בעיקר בשל התחממות האוקיינוסים. גם זיהום, דיג יתר ושינויים בחומציות המים מוסיפים לפגיעה. אלמוגים שעברו הלבנה קלה יכולים להתאושש אם הטמפרטורה חוזרת לקדמותה בזמן, אך התאוששות כזאת נמשכת שנים, וגלי חום תכופים אינם מותירים לשונית די זמן לכך.\n\nלאובדן השוניות יש מחיר החורג מעולם הטבע. מיליוני בני אדם תלויים בהן לפרנסתם, בדיג ובתיירות, והן מגינות על חופים רבים מפני גלים וסערות. מדענים מנסים כיום לפתח אלמוגים עמידים יותר לחום ולשקם שוניות שנפגעו, למשל באמצעות גידול אלמוגים במשתלות תת־ימיות והעברתם לשונית. ואולם רובם מסכימים שבלי צמצום ההתחממות עצמה, מאמצים אלה יוכלו רק להאט את התהליך ולא לעצור אותו. אובדן השונית פוגע גם במחקר: מן היצורים החיים בה הופקו חומרים הנבדקים לשימוש רפואי.","items":[{"id":"rh-8-1","lvl":1,"q":"מהו הרעיון המרכזי של הקטע?","o":["שוניות האלמוגים הן מערכות חיות ורגישות, הנמצאות כיום בסכנה","אלמוגים הם סלעים צבעוניים שאינם חיים","האצות מזיקות לאלמוגים","דיג הוא הגורם היחיד לפגיעה בשוניות"],"a":0,"ex":"הקטע מסביר מהי שונית, על איזו שותפות היא נשענת, וכיצד שינויי סביבה מאיימים עליה."},{"id":"rh-8-2","lvl":1,"q":"לפי הקטע, מה מעניק לאלמוגים את צבעם?","o":["השלד הגירני","מי הים החמים","האצות החיות ברקמותיהם","הדגים החיים בשונית"],"a":2,"ex":"בפסקה השנייה נאמר שהאצות מעניקות לאלמוגים את צבעיהם העזים."},{"id":"rh-8-3","lvl":1,"q":"המילה ״הדדיות״ בפסקה השנייה פירושה:","o":["תחרות על משאבים","יחסים שבהם כל צד מועיל לצד השני","פגיעה של צד אחד בצד השני","בידוד מן הסביבה"],"a":1,"ex":"האצות מספקות מזון והאלמוג מספק מחסה – כל צד נותן ומקבל."},{"id":"rh-8-4","lvl":2,"q":"לפי הפסקה השלישית, כיצד נגרמת הלבנת האלמוגים?","o":["האצות מתרבות יותר מדי","השלד הגירני מתמוסס בחורף","הדגים אוכלים את האצות","האלמוגים מגרשים את האצות בעקבות עלייה ממושכת בטמפרטורת המים"],"a":3,"ex":"עלייה של מעלה או שתיים לאורך זמן גורמת לעקה, האלמוגים מגרשים את האצות ומאבדים את צבעם."},{"id":"rh-8-5","lvl":2,"q":"מהי עמדת רוב המדענים, לפי הפסקה האחרונה?","o":["פיתוח אלמוגים עמידים יפתור את הבעיה לחלוטין","אין טעם לנסות לשקם שוניות","מאמצי השיקום חשובים, אך אינם מספיקים בלי צמצום ההתחממות","השוניות אינן חשובות לבני אדם"],"a":2,"ex":"נאמר שבלי צמצום ההתחממות המאמצים יוכלו רק להאט את התהליך, לא לעצור אותו."}]},{"id":"rh-9","lvl":4,"title":"מרוץ החימוש של החיידקים","text":"גילוי האנטיביוטיקה באמצע המאה העשרים נחשב לאחד ההישגים הגדולים של הרפואה. זיהומים שהיו בעבר קטלניים, כמו דלקות ריאה וזיהומי פצעים, הפכו בתוך שנים ספורות לבעיות שניתן לטפל בהן בקלות יחסית. היו שהאמינו שהמאבק במחלות זיהומיות הוכרע. אולם כמעט מיד עם הכנסתן של התרופות החדשות לשימוש, החלו להופיע זנים של חיידקים שאינם מושפעים מהן. התרופות אפשרו גם את התפתחותם של תחומים רפואיים אחרים: ניתוחים מורכבים, השתלות איברים וטיפולים בחולי סרטן, המחלישים את מערכת החיסון, נשענים כולם על היכולת למנוע זיהומים או לטפל בהם.\n\nעמידות לאנטיביוטיקה היא דוגמה חיה לברירה טבעית. באוכלוסייה גדולה של חיידקים יש תמיד שונות: בשל מוטציות אקראיות, חלק מן החיידקים נושאים תכונות המאפשרות להם לשרוד את התרופה. כאשר החולה נוטל אנטיביוטיקה, החיידקים הרגישים מתים, ואילו העמידים שורדים ומתרבים. מאחר שחיידקים מתרבים בקצב מהיר מאוד, די בזמן קצר כדי שהעמידים יהפכו לרוב. יתרה מזו, חיידקים מסוגלים להעביר זה לזה קטעי חומר תורשתי, כך שתכונת עמידות שהופיעה בזן אחד עשויה לעבור לזנים אחרים.\n\nהתנהגות האדם מאיצה את התהליך. שימוש באנטיביוטיקה לטיפול במחלות שאינן נגרמות מחיידקים, כמו הצטננות נגיפית, אינו מועיל לחולה, אך מעניק לחיידקים שבגופו הזדמנות נוספת לפתח עמידות. גם הפסקת הטיפול לפני תום הזמן שנקבע עלולה להשאיר בחיים דווקא את החיידקים החסינים ביותר. ובחקלאות, שבה ניתנת אנטיביוטיקה לבעלי חיים בכמויות גדולות, נוצרת סביבה אידיאלית לברירה של זנים עמידים. גם שימוש נרחב בחומרי ניקוי אנטיבקטריאליים בבתים נבדק כגורם אפשרי לעמידות, אף שהשפעתו עדיין שנויה במחלוקת.\n\nהתוצאה עלולה להיות חזרה לעולם שבו זיהום פשוט יהיה שוב מסוכן, וניתוחים שגרתיים יהיו כרוכים בסיכון ממשי. לנוכח הסכנה, גופי בריאות קוראים לשימוש מושכל באנטיביוטיקה ולהשקעה בפיתוח תרופות חדשות. ואולם פיתוח תרופות כאלה יקר ואיטי, ואינו כדאי תמיד מבחינה מסחרית, שכן תרופה חדשה ויעילה צפויה להישמר לשימוש במקרים קיצוניים בלבד, כדי לעכב את התפתחות העמידות גם אליה. נראה אפוא שהפתרון אינו טכנולוגי בלבד, אלא תלוי גם בשינוי הרגלים ובמדיניות. יש מדענים הבוחנים גם חלופות, כגון נגיפים התוקפים חיידקים בלבד.","items":[{"id":"rh-9-1","lvl":2,"q":"מהו הרעיון המרכזי של הקטע?","o":["אנטיביוטיקה אינה יעילה כלל נגד זיהומים","פיתוח תרופות חדשות יפתור את הבעיה במהירות","עמידות חיידקים לאנטיביוטיקה נובעת מברירה טבעית, והתנהגות האדם מאיצה אותה","הצטננות נגרמת מחיידקים עמידים"],"a":2,"ex":"הקטע מסביר את מנגנון הברירה הטבעית, מראה כיצד התנהגות אנושית מאיצה אותו, ודן בהשלכות."},{"id":"rh-9-2","lvl":3,"q":"מה תפקידה של הפסקה השנייה?","o":["להסביר את המנגנון שבאמצעותו מתפתחת עמידות","לתאר את ההיסטוריה של גילוי האנטיביוטיקה","להמליץ על מדיניות ציבורית","להראות שחיידקים אינם משתנים לאורך זמן"],"a":0,"ex":"הפסקה מפרטת כיצד שונות, ברירה והעברת חומר תורשתי מובילות להתפשטות העמידות."},{"id":"rh-9-3","lvl":3,"q":"לפי הקטע, מדוע הפסקת הטיפול לפני הזמן מסוכנת?","o":["משום שהחיידקים הרגישים מתחזקים","משום שהיא עלולה להשאיר בחיים דווקא את החיידקים העמידים ביותר","משום שהתרופה הופכת לנגיף","משום שהיא מאטה את קצב ההתרבות של החיידקים"],"a":1,"ex":"החיידקים הרגישים מתים ראשונים; הפסקה מוקדמת משאירה את החסינים ביותר, שיכולים להתרבות."},{"id":"rh-9-4","lvl":4,"q":"לפי הפסקה האחרונה, מדוע פיתוח תרופות חדשות אינו תמיד כדאי מבחינה מסחרית?","o":["משום שהתרופות החדשות אינן יעילות","משום שהחוק אוסר על מכירתן","משום שהחיידקים אינם מגיבים לתרופות חדשות","משום שתרופה כזאת צפויה לשמש רק במקרים קיצוניים, ולכן תימכר בהיקף קטן"],"a":3,"ex":"כדי לעכב עמידות, תרופה חדשה תישמר למקרים קיצוניים, ולכן הרווח ממנה מוגבל."},{"id":"rh-9-5","lvl":3,"q":"המילה ״מושכל״ בפסקה האחרונה פירושה:","o":["נרחב ותכוף","שקול ומבוסס על הבנה","מוגבל לחקלאות בלבד","ניסיוני"],"a":1,"ex":"הקריאה לשימוש מושכל היא קריאה להשתמש באנטיביוטיקה בתבונה ורק כשיש בה צורך."}]},{"id":"rh-10","lvl":5,"title":"מה מסתירות המפות","text":"נהוג לחשוב על מפה כעל ייצוג אובייקטיבי של העולם: שרטוט מדויק, המבוסס על מדידות, המראה היכן נמצא כל דבר. אולם היסטוריונים של הקרטוגרפיה מזכירים שכל מפה היא תוצר של בחירות. יש להחליט מה לכלול ומה להשמיט, באיזה קנה מידה לשרטט, אילו שמות להעניק למקומות, ומה למקם במרכז. בחירות אלה אינן נעשות בחלל ריק; הן משקפות את צורכיהם, את ידיעותיהם ואת השקפותיהם של מי שמזמינים את המפות ושל מי ששרטטו אותן.\n\nמפות עתיקות רבות לא נועדו כלל לשמש לניווט. חלקן היו בראש ובראשונה תמונות של עולם שלם ומסודר לפי אמונות דתיות, ובמרכזן הוצבה העיר הקדושה למשרטטים. אחרות שירתו את השלטון: הן תיעדו אדמות לצורך גביית מסים או סימנו גבולות שנויים במחלוקת. גם כאשר התקדמו שיטות המדידה, לא נעלמו הבחירות; הן רק נעשו סמויות יותר, משום שהמפה זכתה למעמד של מסמך מדעי. יש מפות שבהן הוגדלו ארצו ועירו של המשרטט, ואחרות שבהן מולאו אזורים לא ידועים ביצורים דמיוניים, כמעט כאילו פחדו המשרטטים מפני החלל הריק.\n\nדוגמה בולטת לכך היא בעיית ההטלה. כדור הארץ עגול והמפה שטוחה, ולכן כל העברה של פני הכדור אל הדף כרוכה בעיוות. יש הטלות השומרות על צורות היבשות אך מעוותות את גודלן, ויש השומרות על הגודל אך מעוותות את הצורה. אחת ההטלות הנפוצות ביותר, שפותחה לצורכי ניווט ימי, מגדילה מאוד את האזורים הקרובים לקטבים. כתוצאה מכך, אזורים בצפון נראים בה גדולים בהרבה מאזורים הסמוכים לקו המשווה, אף שבמציאות המצב הפוך לא אחת. דורות של תלמידים שגדלו מול מפות כאלה ספגו, בלי משים, תמונה מעוותת של משקלן היחסי של היבשות.\n\nאין פירוש הדבר שמפות הן שקר, או שאין להן ערך. כל ייצוג מחייב צמצום, ומפה שתכלול הכול תהיה גדולה כשטח עצמו, ולכן חסרת תועלת. אך דווקא משום שהמפה נתפסת כאמינה כל כך, ראוי לקרוא אותה בעין ביקורתית ולשאול מי שרטט אותה, לשם מה, ומה נשאר מחוץ לגבולותיה. שאלות אלה אינן מבטלות את המפה; הן הופכות אותה ממסמך שיש לקבל כמות שהוא לטקסט שיש לפרש.","items":[{"id":"rh-10-1","lvl":3,"q":"מהו הרעיון המרכזי של הקטע?","o":["מפות עתיקות היו מדויקות יותר ממפות מודרניות","כל המפות שקריות ואין להן ערך","הטלות מודרניות אינן מעוותות את פני כדור הארץ","מפות הן תוצר של בחירות, ולכן ראוי לקרוא אותן באופן ביקורתי"],"a":3,"ex":"הקטע פותח בטענה שכל מפה היא תוצר של בחירות, מדגים זאת, ומסיים בקריאה לקריאה ביקורתית."},{"id":"rh-10-2","lvl":4,"q":"לפי הפסקה השנייה, מדוע נעשו הבחירות סמויות יותר עם התקדמות שיטות המדידה?","o":["משום שהמשרטטים הסתירו אותן במכוון","משום שהמפה קיבלה מעמד של מסמך מדעי ונתפסה כאובייקטיבית","משום שהשלטון אסר על שרטוט מפות דתיות","משום שהבחירות נעלמו לגמרי"],"a":1,"ex":"המעמד המדעי של המפה גרם לקוראים להניח שהיא אובייקטיבית, ולכן הבחירות שבה פחות נראות לעין."},{"id":"rh-10-3","lvl":4,"q":"מה תפקידה של הפסקה השלישית?","o":["להביא דוגמה מוחשית לטענה שגם מפות מדעיות כרוכות בבחירות ובעיוותים","להמליץ על שימוש בהטלה מסוימת","לתאר את ההיסטוריה של הניווט הימי","להוכיח שהאזורים שליד הקטבים גדולים מאלה שליד קו המשווה"],"a":0,"ex":"בעיית ההטלה ממחישה שגם מפה המבוססת על מדידות מדויקות כרוכה בבחירה ובעיוות."},{"id":"rh-10-4","lvl":5,"q":"לפי הפסקה האחרונה, מדוע מפה שתכלול הכול תהיה חסרת תועלת?","o":["משום שתהיה יקרה מדי לייצור","משום שאי אפשר למדוד את כל השטח","משום שערכה של מפה נובע דווקא מן הצמצום וההשמטה","משום שתלמידים לא יבינו אותה"],"a":2,"ex":"כל ייצוג מחייב צמצום; מפה בגודל השטח עצמו לא תוסיף דבר על השטח, ולכן הצמצום הוא שנותן לה ערך."},{"id":"rh-10-5","lvl":5,"q":"מהי עמדת הכותב כלפי מפות?","o":["דחייה מוחלטת של מפות כמקור מידע","הכרה בערכן לצד קריאה להתייחס אליהן בביקורתיות","קבלה תמימה של מפות כמשקפות את המציאות","ייאוש מן האפשרות לייצג את העולם"],"a":1,"ex":"הכותב מדגיש שאין פירוש הדבר שמפות הן שקר או חסרות ערך, אך קורא לשאול מי שרטט אותן ולשם מה."}]},{"id":"rh-11","lvl":4,"title":"הזיכרון כבנייה מחדש","text":"רבים מאיתנו מדמים את הזיכרון לסרט מצולם: אירוע נקלט, נשמר במקום כלשהו במוח, וכאשר אנו נזכרים בו, אנו פשוט מקרינים אותו מחדש. לפי תפיסה זו, זיכרון יכול להיות שלם או חסר, אך מה שנשמר בו הוא העתק נאמן של מה שהתרחש. מחקרים בפסיכולוגיה קוגניטיבית מציעים תמונה שונה בתכלית: הזיכרון אינו שחזור, אלא בנייה מחדש.\n\nבכל פעם שאנו נזכרים באירוע, המוח מרכיב אותו מחדש מתוך פיסות מידע, ומשלים את הפערים בעזרת ידע כללי, ציפיות ומידע שנרכש מאוחר יותר. התהליך יעיל בדרך כלל, ומאפשר לנו לזכור את עיקר הדברים בלי להעמיס על המוח פרטים לאין ספור. אך יש לו מחיר: פרטים שלא התרחשו כלל עלולים להשתלב בזיכרון, ואנו נחווה אותם בביטחון מלא כחלק ממה שראינו. ניתן להשוות זאת לשחזור של כלי חרס שבור: הארכאולוג מצרף את השברים שנמצאו, ואת החלקים החסרים הוא משלים לפי מה שהוא יודע על כלים דומים. התוצאה עשויה להיראות שלמה ומשכנעת, אך חלק ממנה אינו מקורי.\n\nבניסויים רבים הוצגו לנבדקים סרטונים של אירוע, ולאחר מכן נשאלו עליו שאלות. כאשר נוסחו השאלות באופן מכוון – למשל, כשנעשה בהן שימוש במילה חריפה יותר לתיאור התנגשות בין מכוניות – נטו הנבדקים לזכור את האירוע כחמור יותר, ואף דיווחו על פרטים שלא הופיעו בסרטון. במחקרים אחרים הצליחו חוקרים לגרום לחלק מן הנבדקים להאמין שחוו בילדותם אירוע שמעולם לא קרה, באמצעות שיחות חוזרות ומכוונות בלבד. והחשוב מכול: רבים מן הנבדקים היו משוכנעים בזיכרונם השגוי, ותיארו אותו בפרטים חיים.\n\nלממצאים אלה השלכות כבדות משקל, בייחוד במערכת המשפט. עדות ראייה נחשבה זמן רב לראיה משכנעת במיוחד, ושופטים נוטים לסמוך על עדים הנשמעים בטוחים בעצמם. אולם ביטחונו של העד אינו ערובה לדיוקו. בעקבות המחקר שינו מדינות אחדות את נוהלי החקירה, כדי להימנע משאלות מדריכות ומהשפעה לא מכוונת על העדים. ועם זאת, אין להסיק שכל זיכרון אינו אמין; המסקנה היא שהזיכרון הוא תהליך חי וגמיש, ויש להתייחס אליו בהתאם. יש אף שיטות חקירה המעודדות את העד לספר בחופשיות לפני שהוא נשאל שאלות ממוקדות.","items":[{"id":"rh-11-1","lvl":2,"q":"מהו הרעיון המרכזי של הקטע?","o":["הזיכרון אינו העתק נאמן של העבר, אלא בנייה מחדש הנתונה להשפעות","הזיכרון פועל כמו סרט מצולם","אין לסמוך על שום זיכרון","עדויות ראייה הן הראיה המשכנעת ביותר בבית המשפט"],"a":0,"ex":"הקטע מציג את תפיסת הזיכרון כבנייה מחדש, מביא ראיות ניסוייות, ודן בהשלכותיה."},{"id":"rh-11-2","lvl":3,"q":"לפי הפסקה השנייה, מהו היתרון של בניית הזיכרון מחדש?","o":["היא מבטיחה דיוק מלא בכל הפרטים","היא מאפשרת לזכור את עיקר הדברים בלי להעמיס על המוח פרטים רבים","היא מונעת השתלבות של פרטים שגויים","היא פועלת רק בילדות"],"a":1,"ex":"נאמר שהתהליך יעיל ומאפשר לזכור את העיקר בלי להעמיס פרטים לאין ספור."},{"id":"rh-11-3","lvl":3,"q":"מה אפשר להסיק מן הניסויים המתוארים בפסקה השלישית?","o":["הנבדקים שיקרו במכוון לחוקרים","סרטונים אינם מתאימים למחקר בזיכרון","אופן ניסוח השאלה עשוי להשפיע על תוכן הזיכרון","זיכרונות ילדות אינם ניתנים לשינוי"],"a":2,"ex":"שינוי מילה אחת בשאלה גרם לנבדקים לזכור את האירוע אחרת – כלומר הניסוח משפיע על הזיכרון עצמו."},{"id":"rh-11-4","lvl":4,"q":"המילה ״ערובה״ בפסקה הרביעית פירושה:","o":["סיבה","סתירה","תוצאה","הבטחה או ביטחון לכך שדבר מתקיים"],"a":3,"ex":"המשפט אומר שביטחונו של העד אינו מבטיח שעדותו מדויקת."},{"id":"rh-11-5","lvl":5,"q":"מה תפקידו של המשפט האחרון בקטע?","o":["להסתייג מהסקת מסקנה קיצונית מן הממצאים","להציג ממצא מחקרי חדש","לחזור על התפיסה שהוצגה בפסקה הראשונה","להמליץ לבטל את השימוש בעדויות ראייה"],"a":0,"ex":"אחרי הצגת חולשות הזיכרון, הכותב מבהיר שאין להסיק שכל זיכרון אינו אמין – זוהי הסתייגות ממסקנה גורפת."}]},{"id":"rh-12","lvl":5,"title":"הצילום ושחרור הציור","text":"כאשר הופיע הצילום במאה התשע־עשרה, היו שראו בו איום ממשי על אמנות הציור. אם מכונה מסוגלת לתעד פנים, נוף או מבנה בדיוק שאף צייר מיומן אינו יכול להתחרות בו, ובזמן קצר לאין ערוך, מה נותר לצייר לעשות? ואכן, תחומים שלמים שבהם התפרנסו ציירים, ובראשם ציורי הדיוקן הקטנים, הצטמקו במהירות כאשר בני המעמד הבינוני גילו שאפשר להשיג תמונה נאמנה במחיר נמוך. היו מבקרים שטענו כי מעתה ייאלצו הציירים לפנות לעיסוקים אחרים, וכי האמנות עצמה תהפוך לתחום מכני.\n\nואולם בדיעבד נראה שהצילום לא חיסל את הציור, אלא הוביל אותו לבחון מחדש את ייעודו. משעה שהדיוק התיעודי כבר לא היה יתרונו הבלעדי, החלו ציירים לחפש את מה שהמצלמה אינה יכולה לעשות. חלקם התמקדו באור המשתנה ובתחושה החולפת של רגע, ולא בקווי המתאר המדויקים של העצמים. אחרים הדגישו את משיכת המכחול הגלויה, את הצבע כחומר ואת עולמו הפנימי של האמן. ההיסטוריה של האמנות המודרנית היא, במידה רבה, היסטוריה של התרחקות מן הייצוג המדויק. תנועות אמנותיות שלמות קמו בעשורים שלאחר מכן, וכל אחת מהן הציעה תשובה אחרת לשאלה מה יכול הציור לעשות שהמצלמה אינה יכולה.\n\nהיחסים בין שני התחומים לא היו חד־כיווניים. ציירים לא מעטים השתמשו בתצלומים ככלי עזר, והקומפוזיציות של התצלומים – עם החיתוך הפתאומי של דמויות בשולי התמונה ונקודות המבט הבלתי שגרתיות – השפיעו על הציור עצמו. מנגד, צלמים מוקדמים רבים ניסו לחקות את הציור: הם טשטשו את תמונותיהם ובימו סצנות אלגוריות, כדי להוכיח שגם הצילום ראוי להיחשב אמנות. בהמשך פיתח הצילום שפה אמנותית משלו, ולא נזקק עוד להוכיח את ערכו באמצעות חיקוי.\n\nסיפור זה מלמד לקח רחב יותר על השפעתן של טכנולוגיות חדשות על תחומי יצירה. החשש שהכלי החדש ייתר את הישן נשמע כמעט בכל דור. לעיתים החשש מוצדק, וצורות עבודה מסוימות אכן נעלמות. אך לא אחת, דווקא הלחץ שיוצרת הטכנולוגיה מאלץ את התחום הוותיק להגדיר מחדש את מהותו, ולגלות יכולות שלא נדרשו לו קודם לכן. השאלה המעניינת אפוא אינה רק מה תחליף הטכנולוגיה החדשה, אלא מה היא תאפשר לישנה להפוך להיות.","items":[{"id":"rh-12-1","lvl":2,"q":"מהי הטענה המרכזית של הקטע?","o":["הצילום חיסל את אמנות הציור","הצילום אילץ את הציור להגדיר מחדש את ייעודו, ובכך תרם להתפתחותו","ציירים מודרניים העתיקו תצלומים","הצילום אינו יכול להיחשב אמנות"],"a":1,"ex":"הקטע מראה שהצילום, במקום לחסל את הציור, דחף אותו לחפש את מה שהמצלמה אינה יכולה לעשות."},{"id":"rh-12-2","lvl":1,"q":"לפי הפסקה הראשונה, איזה תחום של ציור נפגע במיוחד עם הופעת הצילום?","o":["ציורי נוף גדולים","ציורים אלגוריים","ציורי דיוקן קטנים","ציורי קיר"],"a":2,"ex":"נאמר במפורש שציורי הדיוקן הקטנים הצטמקו במהירות."},{"id":"rh-12-3","lvl":4,"q":"מה תפקידה של הפסקה השלישית?","o":["להוכיח שהצילום נחות מן הציור","לתאר טכניקות צילום מודרניות","להסביר מדוע ציירים הפסיקו להשתמש בתצלומים","להראות שההשפעה בין הצילום לציור הייתה הדדית"],"a":3,"ex":"הפסקה פותחת ביחסים לא היו חד־כיווניים ומתארת השפעה של הצילום על הציור וגם של הציור על הצילום."},{"id":"rh-12-4","lvl":4,"q":"לפי הקטע, מדוע טשטשו צלמים מוקדמים את תמונותיהם?","o":["כדי לקרב את הצילום לציור ולזכות בהכרה כאמנות","בשל מגבלות טכניות בלבד","כדי לחסוך בחומרים יקרים","כדי להוזיל את מחיר הדיוקנאות"],"a":0,"ex":"הטשטוש והבימוי נועדו לחקות את הציור, כדי להוכיח שגם הצילום ראוי להיחשב אמנות."},{"id":"rh-12-5","lvl":5,"q":"מהי עמדת הכותב כלפי השפעתן של טכנולוגיות חדשות על תחומי יצירה?","o":["טכנולוגיה חדשה מחסלת תמיד את הישנה","יש להתנגד לטכנולוגיות חדשות","השאלה אינה מעניינת","יש לה לעיתים מחיר, אך היא עשויה גם לעורר התחדשות בתחום הוותיק"],"a":3,"ex":"הכותב מודה שלעיתים החשש מוצדק, אך מדגיש שהלחץ הטכנולוגי מאלץ לעיתים קרובות את התחום הוותיק להתחדש."}]},{"id":"rh-13","lvl":2,"title":"איי החום העירוניים","text":"ביום קיץ חם, מי שעובר מאזור כפרי אל מרכזה של עיר גדולה עשוי להרגיש בהבדל ניכר בטמפרטורה. התופעה, המכונה אי חום עירוני, מוכרת זה זמן רב: הערים חמות מסביבתן, ולעיתים ההפרש מגיע לכמה מעלות. ההבדל בולט במיוחד בשעות הלילה, כאשר האזורים הפתוחים מתקררים במהירות, ואילו העיר ממשיכה לשחרר חום שנאגר בה במשך היום.\n\nלתופעה כמה גורמים. אספלט, בטון ואבן סופגים את קרינת השמש ואוגרים את החום, ובכך הם שונים מאדמה ומצמחייה. בערים יש מעט צמחים, ולכן חסר בהן הקירור הטבעי הנוצר כאשר מים מתאדים מן העלים. בנוסף, מכוניות, מפעלים ומזגנים פולטים חום ישירות לסביבה. גם צורתה של העיר משפיעה: רחובות צרים בין בניינים גבוהים לוכדים את החום ומונעים מן הרוח לפזר אותו. גם צבעם של המשטחים חשוב: משטחים כהים סופגים יותר קרינה מבהירים, ולכן כביש אספלט שחור עלול להתחמם בצהרי היום הרבה מעבר לטמפרטורת האוויר.\n\nאי החום אינו רק עניין של נוחות. בגלי חום הוא מגביר את הסכנה לבריאותם של קשישים, של חולים ושל מי שאין ביכולתם לקרר את בתיהם. הוא מגדיל את צריכת החשמל לצורכי מיזוג, וזו, בתורה, פולטת עוד חום ומגבירה את זיהום האוויר. כך נוצר מעגל שבו הפתרון האישי – הפעלת מזגן – מחמיר את הבעיה הכללית. ככל שהעיר מתחממת, גדל הצורך במיזוג, וחוזר חלילה. מחקרים מראים כי בשכונות עניות, שבהן מעט עצים ושטחים ירוקים, הטמפרטורות גבוהות לעיתים מאשר בשכונות אמידות באותה עיר, כך שאי החום פוגע במיוחד במי שמשאביהם מועטים.\n\nלשמחתנו, ניתן לצמצם את התופעה באמצעים פשוטים יחסית. נטיעת עצים לאורך רחובות מספקת צל ומקררת את האוויר. גגות הצבועים בצבע בהיר מחזירים חלק ניכר מקרינת השמש במקום לספוג אותה, וגגות ירוקים, המכוסים בצמחייה, מבודדים את הבניינים. ערים אחדות החלו לשלב שיקולים אלה בתכנון, ומתברר שהשקעה צנועה יחסית יכולה להוביל לשיפור ניכר באיכות החיים. אין בכך כדי לפתור את בעיית ההתחממות בכללה, אך יש בכך כדי להקל על תושבי הערים כבר עכשיו. גם מקורות מים פתוחים, כמו מזרקות ובריכות, תורמים לקירור הסביבה הקרובה.","items":[{"id":"rh-13-1","lvl":1,"q":"מהו הרעיון המרכזי של הקטע?","o":["מזגנים הם הגורם היחיד לחום בערים","ערים חמות מסביבתן מסיבות שונות, ואפשר לצמצם את התופעה","אזורים כפריים חמים יותר מערים","אין דרך להתמודד עם אי החום העירוני"],"a":1,"ex":"הקטע מגדיר את התופעה, מפרט את גורמיה ואת השלכותיה, ומציע דרכים לצמצמה."},{"id":"rh-13-2","lvl":1,"q":"לפי הפסקה הראשונה, מתי בולט במיוחד ההבדל בטמפרטורה בין העיר לסביבתה?","o":["בשעות הצהריים","בחורף","בשעות הבוקר המוקדמות","בשעות הלילה"],"a":3,"ex":"בלילה האזורים הפתוחים מתקררים מהר, ואילו העיר ממשיכה לשחרר חום שנאגר בה."},{"id":"rh-13-3","lvl":2,"q":"איזו מן הטענות הבאות נכונה לפי הפסקה השנייה?","o":["צמחייה סופגת יותר חום מבטון","רחובות צרים בין בניינים גבוהים לוכדים את החום","הרוח מגבירה את החום בעיר","אדמה אוגרת חום יותר מאספלט"],"a":1,"ex":"נאמר שרחובות צרים בין בניינים גבוהים לוכדים חום ומונעים מן הרוח לפזר אותו."},{"id":"rh-13-4","lvl":3,"q":"מה ממחיש תיאור המעגל בפסקה השלישית?","o":["פתרון אישי לחום עלול להחמיר את הבעיה הכוללת","מזגנים אינם מקררים בתים","זיהום אוויר מקרר את העיר","צריכת החשמל אינה קשורה לחום"],"a":0,"ex":"המזגן מקרר את הבית אך פולט חום ומגדיל צריכת חשמל, ובכך מחמם את העיר ומגביר את הצורך במיזוג."},{"id":"rh-13-5","lvl":2,"q":"מהי עמדת הכותב בפסקה האחרונה?","o":["פסימיות לגבי עתיד הערים","אדישות לבעיה","אופטימיות זהירה לגבי האפשרות להקל על התופעה","התנגדות לתכנון עירוני"],"a":2,"ex":"הכותב מציין שאפשר לצמצם את התופעה בהשקעה צנועה, אך מסתייג ומבהיר שאין בכך פתרון לבעיית ההתחממות כולה."}]},{"id":"rh-14","lvl":5,"title":"טרגדיית נחלת הכלל ומה שמעבר לה","text":"דמיינו כר מרעה פתוח, שכל רועי הכפר רשאים להוליך אליו את עדריהם. כל רועה מרוויח מכל כבשה נוספת שהוא מוסיף לעדרו, ואילו הנזק שהכבשה גורמת למרעה מתחלק בין כולם. ההיגיון האישי מורה אפוא להוסיף עוד ועוד כבשים. אך כאשר כל הרועים פועלים לפי היגיון זה, המרעה נהרס, וכולם יוצאים נפסדים. התרחיש הזה, המכונה טרגדיית נחלת הכלל, משמש כלכלנים זה עשרות שנים להסברת הידלדלותם של משאבים משותפים – דגה באוקיינוסים, מי תהום ואוויר נקי. המסקנה שעלתה מן התרחיש נראתה עגומה: אנשים רציונליים, הפועלים כל אחד לטובתו, ימיטו אסון על כולם.\n\nמן הניתוח הזה נגזרו בדרך כלל שני פתרונות. האחד: להפריט את המשאב, כלומר לחלק את המרעה בין הרועים, כך שכל אחד מהם יישא בעצמו בתוצאות מעשיו. השני: להעביר את הפיקוח לרשות מרכזית, שתקבע מכסות ותאכוף אותן. שני הפתרונות שונים מאוד זה מזה, אך הם חולקים הנחה משותפת – שהמשתמשים עצמם אינם מסוגלים לנהל את המשאב בכוחות עצמם. ואכן, במקרים רבים יושמו פתרונות כאלה, לעיתים בהצלחה ולעיתים בכישלון.\n\nמחקרי שדה רבים ערערו על הנחה זו. חוקרים שבחנו קהילות ברחבי העולם – כפרי דייגים, מערכות השקיה משותפות ושטחי מרעה בהרים – מצאו שרבות מהן ניהלו משאבים משותפים בהצלחה במשך מאות שנים, בלי הפרטה ובלי שלטון חיצוני. הקהילות פיתחו כללים משלהן: מי רשאי להשתמש במשאב, מתי ובאיזו מידה; כיצד מפקחים על ההתנהגות; ואילו סנקציות מוטלות על מי שחורג מן הכללים, בדרך כלל באופן מדורג, כך שהעבירה הראשונה זוכה לתגובה מתונה. חשוב לא פחות, המשתמשים עצמם השתתפו בקביעת הכללים, ולכן נטו לראות בהם כללים הוגנים ולציית להם.\n\nהמסקנה אינה שהטרגדיה דמיונית. היא מתרחשת בפועל, בייחוד כאשר המשתמשים רבים, אינם מכירים זה את זה, ואין ביניהם אמון או מנגנון לתקשורת. אולם הטרגדיה אינה גזירת גורל. ההבדל בין קהילה המדלדלת את משאביה לבין קהילה המשמרת אותם טמון פחות בטבע האנושי ויותר במוסדות שהיא מפתחת. לשאלה זו נודעת חשיבות מיוחדת כיום, כאשר אחד המשאבים המשותפים החשובים ביותר – האקלים – משותף לאנושות כולה, וקשה במיוחד לבנות סביבו את האמון ואת הכללים הדרושים.","items":[{"id":"rh-14-1","lvl":3,"q":"מהי הטענה המרכזית של הקטע?","o":["טרגדיית נחלת הכלל היא בלתי נמנעת","הפרטה היא הפתרון היחיד לדלדול משאבים","קהילות מסוגלות לנהל משאבים משותפים בהצלחה כשיש להן מוסדות מתאימים, אף שהטרגדיה אפשרית","רועים פועלים תמיד באופן לא רציונלי"],"a":2,"ex":"הקטע מציג את המודל, מערער על ההנחה שבבסיס הפתרונות המקובלים, ומסכם שההבדל טמון במוסדות."},{"id":"rh-14-2","lvl":4,"q":"לפי הפסקה השנייה, מהי ההנחה המשותפת לשני הפתרונות המקובלים?","o":["שהמשאב אינו מוגבל","שרשות מרכזית היא תמיד מושחתת","שהפרטה יקרה מדי","שהמשתמשים עצמם אינם מסוגלים לנהל את המשאב"],"a":3,"ex":"נאמר במפורש ששני הפתרונות מניחים שהמשתמשים אינם מסוגלים לנהל את המשאב בכוחות עצמם."},{"id":"rh-14-3","lvl":3,"q":"הביטוי ״גזירת גורל״ בפסקה האחרונה פירושו:","o":["דבר שאין דרך למנוע אותו","החלטה של הממשלה","אירוע נדיר","עונש על מעשה רע"],"a":0,"ex":"הכותב טוען שהטרגדיה אינה בלתי נמנעת – אפשר למנוע אותה באמצעות מוסדות מתאימים."},{"id":"rh-14-4","lvl":4,"q":"מה תפקידה של הפסקה השלישית?","o":["לחזק את ההנחה שהוצגה בפסקה השנייה","להציג ממצאים המערערים על ההנחה שבבסיס הפתרונות המקובלים","לתאר את ההיסטוריה של כפרי הדייגים","להמליץ על הפרטה של משאבים"],"a":1,"ex":"הפסקה נפתחת במילים ערערו על הנחה זו, ומביאה דוגמאות לקהילות שניהלו משאבים בעצמן."},{"id":"rh-14-5","lvl":5,"q":"לפי הקטע, מדוע קשה במיוחד לנהל את האקלים כמשאב משותף?","o":["משום שהאקלים אינו משאב משותף","משום שאין באקלים שימוש מסחרי","משום שהוא משותף לאנושות כולה, וקשה לבנות בה אמון וכללים משותפים","משום שקהילות מקומיות אינן מושפעות ממנו"],"a":2,"ex":"התנאים להצלחה – אמון, היכרות ותקשורת – קשים להשגה כשהמשתמשים הם האנושות כולה."}]}]},"e":{"items":[{"id":"esc-1","type":"sc","lvl":1,"q":"The museum is closed on Mondays, so we will _____ it on Tuesday instead.","o":["visit","forget","close","lose"],"a":0,"ex":"visit = לבקר. המוזיאון סגור ביום שני, ולכן נבקר בו ביום שלישי."},{"id":"esc-2","type":"sc","lvl":1,"q":"After running for an hour, Dana was very _____ and drank two bottles of water.","o":["thirsty","angry","early","quiet"],"a":0,"ex":"thirsty = צמא/ה. שתיית שני בקבוקי מים מעידה על צמא."},{"id":"esc-3","type":"sc","lvl":1,"q":"The soup is too _____ to eat right now; let it cool down first.","o":["cold","sweet","hot","small"],"a":2,"ex":"hot = חם. צריך לחכות שיתקרר – כלומר המרק חם מדי."},{"id":"esc-4","type":"sc","lvl":1,"q":"He could not find his keys, so he _____ everywhere in the house.","o":["slept","searched","sang","paid"],"a":1,"ex":"searched = חיפש. מי שלא מוצא מפתחות מחפש אותם בכל הבית."},{"id":"esc-5","type":"sc","lvl":1,"q":"The library asks visitors to speak _____ so that others can read.","o":["loudly","quickly","angrily","quietly"],"a":3,"ex":"quietly = בשקט. כדי שאחרים יוכלו לקרוא, מבקשים לדבר בשקט."},{"id":"esc-6","type":"sc","lvl":1,"q":"The bridge was _____ after the storm, so cars had to take another road.","o":["damaged","painted","crowded","opened"],"a":0,"ex":"damaged = ניזוק. הגשר נפגע בסערה ולכן היה צריך לנסוע בדרך אחרת."},{"id":"esc-7","type":"sc","lvl":1,"q":"My grandmother is very _____; she has lived for ninety-five years.","o":["old","young","tall","busy"],"a":0,"ex":"old = זקן/מבוגר. מי שחי 95 שנים הוא מבוגר מאוד."},{"id":"esc-8","type":"sc","lvl":1,"q":"We _____ the train by two minutes and had to wait an hour for the next one.","o":["caught","missed","built","drove"],"a":1,"ex":"missed = פספס. איחרנו ברכבת בשתי דקות ולכן חיכינו לבאה."},{"id":"esc-9","type":"sc","lvl":1,"q":"The teacher asked the students to _____ their answers before handing in the test.","o":["hide","check","break","borrow"],"a":1,"ex":"check = לבדוק. לפני הגשת מבחן בודקים את התשובות."},{"id":"esc-10","type":"sc","lvl":1,"q":"This shirt is too _____ for me; I need a bigger size.","o":["large","cheap","small","clean"],"a":2,"ex":"small = קטן. מי שצריך מידה גדולה יותר – החולצה קטנה עליו."},{"id":"esc-11","type":"sc","lvl":1,"q":"The baby fell _____ as soon as her mother began to sing.","o":["awake","asleep","alone","afraid"],"a":1,"ex":"fall asleep = להירדם. התינוקת נרדמה כשאמה התחילה לשיר."},{"id":"esc-12","type":"sc","lvl":1,"q":"Because the store was having a sale, everything was _____ than usual.","o":["cheaper","heavier","slower","older"],"a":0,"ex":"cheaper = זול יותר. במבצע המחירים נמוכים מהרגיל."},{"id":"esc-13","type":"sc","lvl":1,"q":"Please _____ the door when you leave, because the cat may run out.","o":["open","push","close","paint"],"a":2,"ex":"close = לסגור. כדי שהחתול לא יברח, יש לסגור את הדלת."},{"id":"esc-14","type":"sc","lvl":1,"q":"The road was very _____, so the trip took much longer than we expected.","o":["short","wide","clean","long"],"a":3,"ex":"long = ארוך. דרך ארוכה מסבירה מדוע הנסיעה נמשכה זמן רב."},{"id":"esc-15","type":"sc","lvl":1,"q":"Water _____ at 100 degrees Celsius.","o":["freezes","boils","melts","grows"],"a":1,"ex":"boils = רותח. מים רותחים ב-100 מעלות צלזיוס."},{"id":"esc-16","type":"sc","lvl":1,"q":"Tom was _____ when he heard that he had won the competition.","o":["delighted","bored","tired","sorry"],"a":0,"ex":"delighted = שמח מאוד. זכייה בתחרות גורמת לשמחה."},{"id":"esc-17","type":"sc","lvl":1,"q":"The doctor told him to _____ smoking to improve his health.","o":["start","enjoy","continue","stop"],"a":3,"ex":"stop = להפסיק. כדי לשפר את הבריאות יש להפסיק לעשן."},{"id":"esc-18","type":"sc","lvl":1,"q":"She _____ a letter to her friend who lives abroad.","o":["cooked","swam","slept","wrote"],"a":3,"ex":"wrote = כתבה. את מכתב כותבים; שאר הפעלים אינם מתאימים למכתב."},{"id":"esc-19","type":"sc","lvl":1,"q":"The city is famous for its _____ beaches, where tourists come every summer.","o":["angry","honest","beautiful","hungry"],"a":2,"ex":"beautiful = יפה. תיירים מגיעים לחופים יפים; שאר התארים מתארים אנשים."},{"id":"esc-20","type":"sc","lvl":1,"q":"I cannot hear you; could you speak a little _____?","o":["softer","louder","lower","earlier"],"a":1,"ex":"louder = בקול רם יותר. מי שלא שומע מבקש לדבר חזק יותר."},{"id":"esc-21","type":"sc","lvl":1,"q":"The plants died because nobody _____ them during the summer.","o":["sold","watered","heard","called"],"a":1,"ex":"watered = השקה. צמחים מתים כשלא משקים אותם."},{"id":"esc-22","type":"sc","lvl":1,"q":"Lunch is _____; please come to the table.","o":["ready","closed","broken","asleep"],"a":0,"ex":"ready = מוכן. מזמינים לשולחן כשהאוכל מוכן."},{"id":"esc-23","type":"sc","lvl":1,"q":"He is a very _____ driver and has never had an accident.","o":["careless","careful","fast","nervous"],"a":1,"ex":"careful = זהיר. נהג שמעולם לא עשה תאונה הוא נהג זהיר."},{"id":"esc-24","type":"sc","lvl":1,"q":"The film was so _____ that we laughed from beginning to end.","o":["funny","sad","boring","long"],"a":0,"ex":"funny = מצחיק. צחקנו לאורך כל הסרט כי היה מצחיק."},{"id":"esc-25","type":"sc","lvl":1,"q":"They _____ a new house near the sea last year.","o":["bought","ate","taught","forgot"],"a":0,"ex":"bought = קנו. את הבית קונים; שאר הפעלים אינם מתאימים."},{"id":"esc-26","type":"sc","lvl":1,"q":"The shop _____ at nine in the morning and closes at six in the evening.","o":["opens","sleeps","ends","leaves"],"a":0,"ex":"opens = נפתחת. החנות נפתחת בבוקר ונסגרת בערב – ניגוד ל-closes."},{"id":"esc-27","type":"sc","lvl":1,"q":"It started to rain, so we took our _____.","o":["sunglasses","keys","tickets","umbrellas"],"a":3,"ex":"umbrellas = מטריות. כשמתחיל לרדת גשם לוקחים מטרייה."},{"id":"esc-28","type":"sc","lvl":1,"q":"Ruth is _____ at math; she always gets the highest grade in her class.","o":["terrible","slow","excellent","absent"],"a":2,"ex":"excellent = מצוינת. מי שמקבלת תמיד את הציון הגבוה ביותר מצוינת במתמטיקה."},{"id":"esc-29","type":"sc","lvl":2,"q":"The new law will _____ next month, and everyone must follow it from then on.","o":["take part","take off","take effect","take care"],"a":2,"ex":"take effect = להיכנס לתוקף. חוק נכנס לתוקף ומאז יש לציית לו."},{"id":"esc-30","type":"sc","lvl":2,"q":"The company had to _____ fifty workers because it was losing money.","o":["hire","promote","fire","train"],"a":2,"ex":"fire = לפטר. חברה שמפסידה כסף מפטרת עובדים, לא מגייסת או מקדמת."},{"id":"esc-31","type":"sc","lvl":2,"q":"The scientist made an important _____ about how the virus spreads.","o":["discovery","decoration","disaster","departure"],"a":0,"ex":"discovery = תגלית. מדען מגלה תגלית לגבי אופן התפשטות הנגיף."},{"id":"esc-32","type":"sc","lvl":2,"q":"Even though he was tired, he _____ working until midnight.","o":["continued","refused","failed","avoided"],"a":0,"ex":"continued = המשיך. 'even though' מציין ניגוד: למרות העייפות הוא המשיך לעבוד."},{"id":"esc-33","type":"sc","lvl":2,"q":"The instructions were so _____ that nobody understood what to do.","o":["clear","simple","confusing","helpful"],"a":2,"ex":"confusing = מבלבל. אף אחד לא הבין – לכן ההוראות היו מבלבלות."},{"id":"esc-34","type":"sc","lvl":2,"q":"The museum's collection includes rare objects from _____ Egypt.","o":["modern","future","ancient","recent"],"a":2,"ex":"ancient = עתיק. חפצים נדירים במוזיאון מתאימים למצרים העתיקה."},{"id":"esc-35","type":"sc","lvl":2,"q":"She _____ her old car for a newer model.","o":["exchanged","explained","expected","expressed"],"a":0,"ex":"exchanged ... for = החליפה ... ב-. היא החליפה את הרכב הישן בדגם חדש."},{"id":"esc-36","type":"sc","lvl":2,"q":"The town's population has _____ greatly since the factory opened, with thousands of new residents arriving.","o":["decreased","disappeared","delayed","increased"],"a":3,"ex":"increased = גדלה. הגעת אלפי תושבים חדשים פירושה שהאוכלוסייה גדלה."},{"id":"esc-37","type":"sc","lvl":2,"q":"You must _____ your passport at the border.","o":["hide","show","throw","wear"],"a":1,"ex":"show = להציג. בגבול מציגים דרכון."},{"id":"esc-38","type":"sc","lvl":2,"q":"The athlete's _____ to training every day made her a champion.","o":["invitation","objection","dedication","hesitation"],"a":2,"ex":"dedication = מסירות. מסירות לאימונים יומיומיים הפכה אותה לאלופה."},{"id":"esc-39","type":"sc","lvl":2,"q":"Because the hotel was fully _____, we had to find another place to stay.","o":["empty","cleaned","booked","built"],"a":2,"ex":"fully booked = מלא/תפוס לגמרי. לכן נאלצנו לחפש מקום אחר."},{"id":"esc-40","type":"sc","lvl":2,"q":"The meeting was _____ because the manager was sick.","o":["postponed","celebrated","attended","prepared"],"a":0,"ex":"postponed = נדחתה. בגלל מחלת המנהל הפגישה נדחתה."},{"id":"esc-41","type":"sc","lvl":2,"q":"He gave a _____ answer, so I still don't know what he really thinks.","o":["precise","honest","direct","vague"],"a":3,"ex":"vague = מעורפל. תשובה מעורפלת לא מבהירה מה הוא חושב."},{"id":"esc-42","type":"sc","lvl":2,"q":"Smoking is _____ in all public buildings.","o":["required","encouraged","prohibited","preferred"],"a":2,"ex":"prohibited = אסור. העישון אסור במבני ציבור."},{"id":"esc-43","type":"sc","lvl":2,"q":"The two brothers look so _____ that people often confuse them.","o":["different","strange","similar","distant"],"a":2,"ex":"similar = דומה. מבלבלים ביניהם כי הם דומים מאוד."},{"id":"esc-44","type":"sc","lvl":2,"q":"Doctors _____ that people drink at least eight glasses of water a day.","o":["refuse","recommend","forbid","regret"],"a":1,"ex":"recommend = ממליצים. רופאים ממליצים לשתות מים."},{"id":"esc-45","type":"sc","lvl":2,"q":"The farmer's crops were destroyed by a long _____; it had not rained for months.","o":["drought","flood","festival","harvest"],"a":0,"ex":"drought = בצורת. חודשים ללא גשם הם בצורת."},{"id":"esc-46","type":"sc","lvl":2,"q":"Our neighbor is very _____; he always helps anyone who asks.","o":["selfish","generous","rude","lazy"],"a":1,"ex":"generous = נדיב. מי שעוזר לכל מי שמבקש הוא נדיב."},{"id":"esc-47","type":"sc","lvl":2,"q":"The price of fuel _____ from day to day, so it is hard to plan a budget.","o":["remains","varies","freezes","stays"],"a":1,"ex":"varies = משתנה. קשה לתכנן תקציב כשהמחיר משתנה מיום ליום."},{"id":"esc-48","type":"sc","lvl":2,"q":"The children were _____ about the trip and could not sleep the night before.","o":["bored","ashamed","excited","guilty"],"a":2,"ex":"excited = נרגשים. ההתרגשות מהטיול מנעה מהם לישון."},{"id":"esc-49","type":"sc","lvl":2,"q":"The volunteers worked to _____ money for the local hospital.","o":["raise","rise","grow","lose"],"a":0,"ex":"raise money = לגייס כסף. rise הוא פועל עומד (לעלות) ואינו מקבל מושא."},{"id":"esc-50","type":"sc","lvl":2,"q":"The witness _____ the thief to the police.","o":["described","decided","delivered","denied"],"a":0,"ex":"described = תיאר. העד תיאר את הגנב למשטרה."},{"id":"esc-51","type":"sc","lvl":2,"q":"Please _____ from using your phone during the performance.","o":["remind","remove","remain","refrain"],"a":3,"ex":"refrain from = להימנע מ-. מבקשים להימנע משימוש בטלפון בהופעה."},{"id":"esc-52","type":"sc","lvl":2,"q":"The novel takes place in a _____ village, far from any city or main road.","o":["crowded","central","urban","remote"],"a":3,"ex":"remote = מרוחק/נידח. כפר רחוק מכל עיר וכביש ראשי הוא מרוחק."},{"id":"esc-53","type":"sc","lvl":2,"q":"The bank _____ him a loan to start his business.","o":["borrowed","owed","granted","earned"],"a":2,"ex":"granted = העניק. הבנק מעניק הלוואה; הלקוח הוא זה שלווה (borrow)."},{"id":"esc-54","type":"sc","lvl":2,"q":"The patient's condition has _____, and she can go home tomorrow.","o":["worsened","improved","collapsed","failed"],"a":1,"ex":"improved = השתפר. היא משתחררת הביתה – כלומר מצבה השתפר."},{"id":"esc-55","type":"sc","lvl":2,"q":"Scientists are trying to _____ the causes of the disease.","o":["identify","ignore","invent","imitate"],"a":0,"ex":"identify = לזהות. מדענים מנסים לזהות את גורמי המחלה."},{"id":"esc-56","type":"sc","lvl":2,"q":"The plane had to make an emergency _____ because of engine trouble.","o":["flight","departure","landing","journey"],"a":2,"ex":"emergency landing = נחיתת חירום, בעקבות תקלה במנוע."},{"id":"esc-57","type":"sc","lvl":3,"q":"The report was _____ by several errors, which made readers doubt its conclusions.","o":["undermined","supported","strengthened","confirmed"],"a":0,"ex":"undermined = נפגע/נחלש. טעויות שגרמו לקוראים לפקפק החלישו את הדוח."},{"id":"esc-58","type":"sc","lvl":3,"q":"Despite the team's efforts, the project's results were _____, far below expectations.","o":["impressive","disappointing","remarkable","outstanding"],"a":1,"ex":"disappointing = מאכזב. תוצאות 'הרבה מתחת לציפיות' הן מאכזבות."},{"id":"esc-59","type":"sc","lvl":3,"q":"The professor's lectures are known for being _____; she explains complex ideas in simple terms.","o":["obscure","tedious","hostile","accessible"],"a":3,"ex":"accessible = נגיש, קל להבנה. הסבר רעיונות מורכבים במילים פשוטות הופך את ההרצאות לנגישות."},{"id":"esc-60","type":"sc","lvl":3,"q":"The government launched a campaign to _____ public awareness of the dangers of drunk driving.","o":["diminish","conceal","abandon","heighten"],"a":3,"ex":"heighten = להגביר. קמפיין נועד להגביר מודעות לסכנות."},{"id":"esc-61","type":"sc","lvl":3,"q":"His _____ behavior at the meeting surprised everyone, since he is usually calm and polite.","o":["gentle","aggressive","modest","patient"],"a":1,"ex":"aggressive = תוקפני. ההפתעה נובעת מהניגוד להתנהגותו הרגילה – רגועה ומנומסת."},{"id":"esc-62","type":"sc","lvl":3,"q":"The museum relies on private _____ because it receives little government funding.","o":["regulations","donations","accusations","reductions"],"a":1,"ex":"donations = תרומות. מוזיאון שמקבל מעט מימון ממשלתי נשען על תרומות פרטיות."},{"id":"esc-63","type":"sc","lvl":3,"q":"The researcher's findings were _____ with earlier studies, which had reached the same conclusions.","o":["incompatible","unfamiliar","consistent","irrelevant"],"a":2,"ex":"consistent with = עולה בקנה אחד עם. המחקרים הקודמים הגיעו לאותן מסקנות."},{"id":"esc-64","type":"sc","lvl":3,"q":"The ancient manuscript was so _____ that the librarians handled it only with gloves.","o":["durable","fragile","sturdy","common"],"a":1,"ex":"fragile = שביר. כתב יד שביר מטופלים בו בזהירות רבה."},{"id":"esc-65","type":"sc","lvl":3,"q":"Many species are _____ to extinction because their habitats are being destroyed.","o":["immune","resistant","vulnerable","indifferent"],"a":2,"ex":"vulnerable to = חשוף/פגיע ל-. הרס בתי הגידול מסכן את המינים."},{"id":"esc-66","type":"sc","lvl":3,"q":"The negotiations reached a _____ when neither side was willing to compromise.","o":["breakthrough","celebration","agreement","deadlock"],"a":3,"ex":"deadlock = מבוי סתום. כשאף צד לא מתפשר, המשא ומתן נתקע."},{"id":"esc-67","type":"sc","lvl":3,"q":"The author's latest book has received _____ praise from critics, who agree it is her best work.","o":["limited","reluctant","hostile","widespread"],"a":3,"ex":"widespread = נרחב. המבקרים מסכימים שזה ספרה הטוב ביותר – השבחים נרחבים."},{"id":"esc-68","type":"sc","lvl":3,"q":"The company's success can be _____ to its innovative marketing strategy.","o":["contributed","distributed","attributed","opposed"],"a":2,"ex":"attributed to = מיוחס ל-. ההצלחה מיוחסת לאסטרטגיה; contributed to פירושו 'תרם ל-' ואינו מתאים למבנה."},{"id":"esc-69","type":"sc","lvl":3,"q":"Without regular maintenance, the old building will gradually _____.","o":["flourish","expand","deteriorate","improve"],"a":2,"ex":"deteriorate = להידרדר. בניין ללא תחזוקה מתבלה בהדרגה."},{"id":"esc-70","type":"sc","lvl":3,"q":"The judge ruled that the evidence was _____ and could not be used in court.","o":["convincing","decisive","relevant","inadmissible"],"a":3,"ex":"inadmissible = פסול, שאינו קביל. ראיה שאי אפשר להשתמש בה בבית משפט אינה קבילה."},{"id":"esc-71","type":"sc","lvl":3,"q":"The new policy is intended to _____ the gap between rich and poor neighborhoods.","o":["widen","ignore","narrow","celebrate"],"a":2,"ex":"narrow = לצמצם. מדיניות חברתית נועדה לצמצם פערים."},{"id":"esc-72","type":"sc","lvl":3,"q":"Although the two theories seem _____ at first, they actually share many assumptions.","o":["identical","similar","related","contradictory"],"a":3,"ex":"contradictory = סותרות. 'although' מציין ניגוד: הן נראות סותרות, אך בפועל יש ביניהן הנחות משותפות."},{"id":"esc-73","type":"sc","lvl":3,"q":"The athlete was _____ from the competition after testing positive for a banned substance.","o":["promoted","disqualified","rewarded","invited"],"a":1,"ex":"disqualified = נפסל. ספורטאי שנמצא בבדיקת סמים נפסל מהתחרות."},{"id":"esc-74","type":"sc","lvl":3,"q":"The drug has several side effects, but they are usually mild and _____.","o":["permanent","temporary","fatal","severe"],"a":1,"ex":"temporary = זמני. 'but' מצמצם את חומרת תופעות הלוואי: הן קלות וזמניות."},{"id":"esc-75","type":"sc","lvl":3,"q":"The documentary offers a _____ view of life in the Arctic, showing both its beauty and its hardships.","o":["biased","narrow","distorted","balanced"],"a":3,"ex":"balanced = מאוזן. הצגת היופי והקשיים גם יחד היא תמונה מאוזנת."},{"id":"esc-76","type":"sc","lvl":3,"q":"The mayor's decision to close the park was met with strong _____ from local residents, who organized protests.","o":["approval","enthusiasm","opposition","gratitude"],"a":2,"ex":"opposition = התנגדות. התושבים ארגנו הפגנות – כלומר התנגדו."},{"id":"esc-77","type":"sc","lvl":3,"q":"She is _____ in three languages and often works as a translator.","o":["ignorant","hesitant","fluent","absent"],"a":2,"ex":"fluent = שולטת היטב (שוטפת). מתרגמת שולטת היטב בשפות."},{"id":"esc-78","type":"sc","lvl":3,"q":"The ruins provide _____ evidence that the city was once a major trading center.","o":["doubtful","trivial","compelling","misleading"],"a":2,"ex":"compelling = משכנע. ההריסות מספקות ראיה משכנעת לחשיבות העיר."},{"id":"esc-79","type":"sc","lvl":3,"q":"The two countries signed a treaty to _____ trade between them.","o":["facilitate","prohibit","complicate","suspend"],"a":0,"ex":"facilitate = להקל, לקדם. הסכם סחר נועד להקל על הסחר."},{"id":"esc-80","type":"sc","lvl":3,"q":"The candidate _____ the accusations, insisting that they were completely false.","o":["admitted","dismissed","confirmed","accepted"],"a":1,"ex":"dismissed = דחה/ביטל. מי שטוען שההאשמות שקריות דוחה אותן."},{"id":"esc-81","type":"sc","lvl":3,"q":"Recent studies have _____ serious doubts about the treatment, which had long been considered effective.","o":["removed","resolved","raised","dismissed"],"a":2,"ex":"raise doubts = לעורר ספקות. הניגוד לכך שהטיפול נחשב יעיל מלמד שהמחקרים עוררו ספק."},{"id":"esc-82","type":"sc","lvl":3,"q":"The village is _____ during the winter, when snow blocks the only road.","o":["connected","crowded","accessible","isolated"],"a":3,"ex":"isolated = מבודד. כשהשלג חוסם את הדרך היחידה, הכפר מנותק."},{"id":"esc-83","type":"sc","lvl":3,"q":"The manager praised the employee for her _____ approach to solving problems.","o":["creative","rigid","careless","passive"],"a":0,"ex":"creative = יצירתי. משבחים גישה יצירתית, לא נוקשה, רשלנית או פסיבית."},{"id":"esc-84","type":"sc","lvl":3,"q":"The ice on the lake was too _____ to walk on safely.","o":["thick","thin","solid","firm"],"a":1,"ex":"thin = דק. קרח דק מדי אינו בטוח להליכה."},{"id":"esc-85","type":"sc","lvl":4,"q":"The professor's argument, though _____, failed to convince the committee, which found it too abstract.","o":["incoherent","ingenious","careless","absurd"],"a":1,"ex":"ingenious = מבריק, מחוכם. 'though' יוצר ניגוד: הטיעון מבריק, ובכל זאת לא שכנע."},{"id":"esc-86","type":"sc","lvl":4,"q":"The country's economy, once _____, has slowed dramatically in recent years.","o":["stagnant","declining","thriving","fragile"],"a":2,"ex":"thriving = משגשג. 'once' מציג ניגוד למצב הנוכחי של האטה."},{"id":"esc-87","type":"sc","lvl":4,"q":"The diplomat's _____ remarks managed to calm the tense atmosphere.","o":["conciliatory","provocative","inflammatory","hostile"],"a":0,"ex":"conciliatory = מפייס. דברים מפייסים מרגיעים אווירה מתוחה."},{"id":"esc-88","type":"sc","lvl":4,"q":"The new evidence _____ the defendant, proving that he was elsewhere at the time of the crime.","o":["incriminated","convicted","implicated","exonerated"],"a":3,"ex":"exonerated = טיהר/זיכה. ראיה שמוכיחה שהיה במקום אחר מטהרת את הנאשם."},{"id":"esc-89","type":"sc","lvl":4,"q":"The scientist's theory, initially dismissed as _____, is now widely accepted.","o":["far-fetched","plausible","obvious","conventional"],"a":0,"ex":"far-fetched = מופרך, דמיוני. התאוריה נדחתה בתחילה כמופרכת ורק כעת התקבלה."},{"id":"esc-90","type":"sc","lvl":4,"q":"Her _____ attention to detail made her an ideal editor; she never missed a single mistake.","o":["negligent","casual","meticulous","superficial"],"a":2,"ex":"meticulous = קפדני. עורכת שאינה מחמיצה אף טעות היא קפדנית."},{"id":"esc-91","type":"sc","lvl":4,"q":"The ruler's power was _____ by a constitution that limited his authority.","o":["augmented","curtailed","consolidated","glorified"],"a":1,"ex":"curtailed = הוגבל, צומצם. חוקה שמגבילה סמכות מצמצמת את הכוח."},{"id":"esc-92","type":"sc","lvl":4,"q":"The novel's plot is so _____ that readers often need to reread chapters to follow it.","o":["straightforward","convoluted","predictable","shallow"],"a":1,"ex":"convoluted = מסובך, מפותל. עלילה שצריך לקרוא שוב כדי להבין היא מסובכת."},{"id":"esc-93","type":"sc","lvl":4,"q":"The committee's decision was _____; all twelve members voted in favor.","o":["unanimous","controversial","divided","tentative"],"a":0,"ex":"unanimous = פה אחד. כל החברים הצביעו בעד."},{"id":"esc-94","type":"sc","lvl":4,"q":"The town's _____ water supply could not meet the needs of the growing population.","o":["meager","abundant","plentiful","excessive"],"a":0,"ex":"meager = דל, זעום. אספקה שאינה מספיקה היא דלה."},{"id":"esc-95","type":"sc","lvl":4,"q":"Critics argue that the reforms are merely _____ and do not address the deeper problems.","o":["fundamental","cosmetic","radical","comprehensive"],"a":1,"ex":"cosmetic = שטחי, קוסמטי. רפורמה שאינה נוגעת בבעיות העמוקות היא קוסמטית."},{"id":"esc-96","type":"sc","lvl":4,"q":"The witness's testimony was so _____ that the jury could not decide which version to believe.","o":["ambiguous","coherent","explicit","unequivocal"],"a":0,"ex":"ambiguous = דו-משמעי. עדות שאפשר להבין בכמה אופנים מ xhaustive"],"a":3,"ex":"exhaustive = ממצה, מקיף. הסבר שמכסה כל היבט הוא ממצה."},{"id":"esc-113","type":"sc","lvl":5,"q":"The philosopher's prose is notoriously _____, filled with obscure references and convoluted sentences.","o":["lucid","transparent","abstruse","pellucid"],"a":2,"ex":"abstruse = סתום, קשה להבנה. הפניות עמומות ומשפטים מפותלים הופכים את הכתיבה לסתומה."},{"id":"esc-114","type":"sc","lvl":5,"q":"Far from being _____, the minister's resignation had been planned for months.","o":["premeditated","deliberate","calculated","impulsive"],"a":3,"ex":"impulsive = אימפולסיבי. 'far from' = רחוק מ-: ההתפטרות לא הייתה אימפולסיבית אלא מתוכננת."},{"id":"esc-115","type":"sc","lvl":5,"q":"The critic's review was so _____ that the director publicly demanded an apology.","o":["laudatory","effusive","tepid","scathing"],"a":3,"ex":"scathing = קטלני, חריף. ביקורת חריפה עד כדי דרישת התנצלות."},{"id":"esc-116","type":"sc","lvl":5,"q":"The archaeologists' claims were _____, based on only a single pottery fragment, and were therefore regarded with skepticism.","o":["irrefutable","substantiated","corroborated","tenuous"],"a":3,"ex":"tenuous = קלוש, רופף. טענה שמבוססת על שבר אחד בלבד היא רופפת."},{"id":"esc-117","type":"sc","lvl":5,"q":"Despite her _____ public image, the actress was known among friends for her warmth and humor.","o":["affable","aloof","genial","gregarious"],"a":1,"ex":"aloof = מרוחק, צונן. 'despite' מנגיד את התדמית הצוננת לחום שחבריה מכירים."},{"id":"esc-118","type":"sc","lvl":5,"q":"The senator's speech was a masterpiece of _____, appearing to promise everything while committing to nothing.","o":["candor","equivocation","conviction","forthrightness"],"a":1,"ex":"equivocation = התחמקות, דו-משמעות מכוונת. להבטיח הכול בלי להתחייב לדבר."},{"id":"esc-119","type":"sc","lvl":5,"q":"The economist warned that the government's _____ spending would eventually lead to a fiscal crisis.","o":["frugal","profligate","prudent","austere"],"a":1,"ex":"profligate = בזבזני. הוצאה ב c, so I left early.","I did not leave early because I did not know about the traffic.","I left early, but the traffic was still bad.","I will leave earlier next time because of the traffic."],"a":1,"ex":"תנאי בלתי ממשי בעבר: לא ידעתי על הפקקים, ולכן לא יצאתי מוקדם."},{"id":"ers-23","type":"rs","lvl":2,"q":"The new manager is not as strict as the old one.","o":["The new manager is stricter than the old one.","Both managers are equally strict.","The old manager was stricter than the new one.","The old manager was not strict at all."],"a":2,"ex":"not as ... as = פחות מ-. המנהל הקודם היה קפדן יותר."},{"id":"ers-24","type":"rs","lvl":2,"q":"It was not until midnight that the guests left.","o":["The guests left before midnight.","The guests did not leave before midnight.","The guests stayed all night.","The guests arrived at midnight."],"a":1,"ex":"not until = רק ב-. האורחים עזבו רק בחצות, לא לפני כן."},{"id":"ers-25","type":"rs","lvl":2,"q":"Despite his illness, Ron finished the race.","o":["Ron completed the race even though he was sick.","Ron could not finish the race because he was sick.","Ron became ill after the race.","Ron's illness helped him win the race."],"a":0,"ex":"despite = למרות. רון סיים למרות מחלתו."},{"id":"ers-26","type":"rs","lvl":2,"q":"The more you practice, the better you will play.","o":["Playing well requires little practice.","If you play better, you will practice more.","Practice does not affect how you play.","Practicing more will improve your playing."],"a":3,"ex":"the more ... the better = ככל ש... כך: יותר תרגול – נגינה טובה יותר. אפשרות ההיפוך מחליפה סיבה ותוצאה."},{"id":"ers-27","type":"rs","lvl":2,"q":"This is the first time I have ever seen snow.","o":["I have seen snow many times.","I saw snow for the last time today.","I do not like snow.","I had never seen snow before now."],"a":3,"ex":"'הפעם הראשונה' = מעולם לא ראיתי לפני כן."},{"id":"ers-28","type":"rs","lvl":2,"q":"The project would have failed without her help.","o":["The project
