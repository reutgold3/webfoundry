te to climate change. Therefore, researchers are now looking for ways to power these plants with renewable energy.","he":"ישראל מתוארת לעיתים קרובות כמובילה עולמית בטכנולוגיות מים. לפני עשרות שנים סבלה המדינה ממחסור חמור במים, שאיים הן על החקלאות והן על חיי היומיום. בתגובה, מהנדסים ישראלים פיתחו את ההשקיה בטפטוף, שיטה שמובילה מים ישירות אל שורשי הצמחים. מאוחר יותר נבנו כמה מתקני התפלה גדולים לאורך חוף הים התיכון. כיום רוב מי השתייה של המדינה מגיעים מהים. עם זאת, מומחים מזהירים שהתפלה דורשת כמות גדולה של אנרגיה, דבר שעלול לתרום לשינוי האקלים. לכן חוקרים מחפשים כעת דרכים להפעיל את המתקנים האלה באמצעות אנרגיה מתחדשת.","ru":"Израиль часто называют мировым лидером в области водных технологий. Несколько десятилетий назад страна страдала от серьёзной нехватки воды, которая угрожала как сельскому хозяйству, так и повседневной жизни. В ответ израильские инженеры разработали капельное орошение — метод, при котором вода подаётся прямо к корням растений. Позже вдоль побережья Средиземного моря было построено несколько крупных опреснительных заводов. Сегодня большая часть питьевой воды в стране поступает из моря. Тем не менее эксперты предупреждают, что опреснение требует огромного количества энергии, что может способствовать изменению климата. Поэтому исследователи сейчас ищут способы обеспечивать эти заводы возобновляемой энергией.","ar":"كثيرًا ما توصف إسرائيل بأنها رائدة عالميًا في تكنولوجيا المياه. فقبل عقود، عانت البلاد من نقص حاد في المياه هدّد الزراعة والحياة اليومية على حد سواء. وردًّا على ذلك، طوّر مهندسون إسرائيليون الري بالتنقيط، وهو أسلوب يوصل المياه مباشرة إلى جذور النباتات. ولاحقًا، بُنيت عدة محطات تحلية كبيرة على طول ساحل البحر الأبيض المتوسط. واليوم، تأتي معظم مياه الشرب في البلاد من البحر. ومع ذلك، يحذّر الخبراء من أن التحلية تتطلب كميات كبيرة من الطاقة، مما قد يسهم في تغيّر المناخ. لذلك يبحث الباحثون حاليًا عن طرق لتشغيل هذه المحطات بالطاقة المتجددة.","questions":[["Why did Israel develop new water technologies?","Because water was scarce.","Because the sea was polluted.","Because farmers wanted more rain.","Because other countries asked it to."],["Where does most of Israel's drinking water come from today?","Desalinated sea water.","The Sea of Galilee.","Underground rivers.","Rain collected in winter."],["What problem with desalination does the text mention?","It uses a lot of energy.","It makes water taste salty.","It damages plant roots.","It is illegal in Europe."]]}},{"en":"science","he":"מדע","ru":"наука","ar":"العلوم","e":"🔬","items":[{"en":"The vaccine, which was developed in record time, saved millions.","he":"החיסון, שפותח בזמן שיא, הציל מיליונים.","ru":"Вакцина, разработанная в рекордные сроки, спасла миллионы жизней.","ar":"أنقذ اللقاح، الذي طُوِّر في وقت قياسي، ملايين الأرواح.","e":"","alt":[]},{"en":"Scientists must test a theory many times before accepting it.","he":"מדענים חייבים לבדוק תיאוריה פעמים רבות לפני שהם מקבלים אותה.","ru":"Учёные должны много раз проверить теорию, прежде чем принять её.","ar":"يجب على العلماء اختبار النظرية مرات عديدة قبل قبولها.","e":"","alt":[]},{"en":"The experiment was repeated, but the results were the same.","he":"הניסוי נערך שוב, אך התוצאות היו זהות.","ru":"Эксперимент повторили, но результаты оказались теми же.","ar":"أُعيدت التجربة، لكن النتائج كانت نفسها.","e":"","alt":[]},{"en":"If water is heated to 100 degrees, it boils.","he":"אם מחממים מים ל-100 מעלות, הם רותחים.","ru":"Если нагреть воду до 100 градусов, она закипает.","ar":"إذا سُخّن الماء إلى 100 درجة، فإنه يغلي.","e":"","alt":[]},{"en":"Israel launched its first satellite into space in 1988.","he":"ישראל שיגרה את הלוויין הראשון שלה לחלל ב-1988.","ru":"Израиль запустил свой первый спутник в космос в 1988 году.","ar":"أطلقت إسرائيل أول قمر صناعي لها إلى الفضاء عام 1988.","e":"","alt":[]},{"en":"The researcher explained that the discovery had happened by accident.","he":"החוקרת הסבירה שהתגלית קרתה במקרה.","ru":"Исследовательница объяснила, что открытие произошло случайно.","ar":"أوضحت الباحثة أن الاكتشاف حدث بالصدفة.","e":"","alt":[]}],"reading":{"en":"In 2019, a small Israeli spacecraft called Beresheet attempted to land on the Moon. It had been built by a non-profit organization rather than by a government, which made the project unique. The spacecraft travelled for about seven weeks before reaching the Moon. Unfortunately, during the final stage of landing, one of its engines failed, and Beresheet crashed onto the surface. Although the mission did not succeed, many people considered it a great achievement. Israel became only the seventh country to orbit the Moon, and millions of children were inspired to study science. The team soon announced that they would try again.","he":"ב-2019 ניסתה חללית ישראלית קטנה בשם 'בראשית' לנחות על הירח. היא נבנתה על ידי עמותה ולא על ידי ממשלה, מה שהפך את הפרויקט לייחודי. החללית נסעה כשבעה שבועות עד שהגיעה לירח. לרוע המזל, בשלב האחרון של הנחיתה אחד המנועים שלה כשל, ו'בראשית' התרסקה על פני הירח. אף על פי שהמשימה לא הצליחה, אנשים רבים ראו בה הישג גדול. ישראל הפכה למדינה השביעית בלבד שהקיפה את הירח, ומיליוני ילדים קיבלו השראה ללמוד מדעים. זמן קצר לאחר מכן הודיע הצוות שינסה שוב.","ru":"В 2019 году небольшой израильский космический аппарат «Берешит» попытался совершить посадку на Луну. Его построила некоммерческая организация, а не государство, что сделало проект уникальным. Аппарат летел около семи недель, прежде чем достиг Луны. К сожалению, на последнем этапе посадки отказал один из двигателей, и «Берешит» разбился о поверхность. Хотя миссия не увенчалась успехом, многие сочли её большим достижением. Израиль стал лишь седьмой страной, вышедшей на орбиту Луны, а миллионы детей вдохновились изучать науку. Вскоре команда объявила, что попробует снова.","ar":"في عام 2019، حاولت مركبة فضائية إسرائيلية صغيرة تُدعى «بريشيت» الهبوط على القمر. وقد بنتها منظمة غير ربحية لا حكومة، وهو ما جعل المشروع فريدًا. سافرت المركبة نحو سبعة أسابيع قبل أن تصل إلى القمر. ولسوء الحظ، تعطّل أحد محركاتها في المرحلة الأخيرة من الهبوط، فتحطمت «بريشيت» على سطحه. ورغم أن المهمة لم تنجح، فقد عدّها كثيرون إنجازًا عظيمًا. فقد أصبحت إسرائيل الدولة السابعة فقط التي تدور حول القمر، وأُلهم ملايين الأطفال لدراسة العلوم. وسرعان ما أعلن الفريق أنه سيحاول مجددًا.","questions":[["What made the Beresheet project unique?","It was not built by a government.","It was the first Moon landing ever.","It carried astronauts to the Moon.","It was built in seven weeks."],["Why did Beresheet crash?","An engine failed while landing.","It ran out of fuel early.","It hit a satellite in space.","The team lost all contact."],["Why was the mission seen as an achievement?","It inspired people despite failing.","It found water on the Moon.","It landed safely on the Moon.","It made a large profit."]]}},{"en":"history","he":"היסטוריה","ru":"история","ar":"التاريخ","e":"🏛️","items":[{"en":"The Dead Sea Scrolls were discovered by a shepherd in 1947.","he":"מגילות ים המלח התגלו על ידי רועה ב-1947.","ru":"Свитки Мёртвого моря были обнаружены пастухом в 1947 году.","ar":"اكتُشفت مخطوطات البحر الميت على يد راعٍ عام 1947.","e":"","alt":[]},{"en":"If the printing press hadn't been invented, books would have remained rare.","he":"אילולא הומצא הדפוס, ספרים היו נשארים נדירים.","ru":"Если бы не изобрели книгопечатание, книги так и остались бы редкостью.","ar":"لو لم تُخترع المطبعة، لظلّت الكتب نادرة.","e":"","alt":[]},{"en":"Historians argue that we must learn from the mistakes of the past.","he":"היסטוריונים טוענים שעלינו ללמוד מטעויות העבר.","ru":"Историки утверждают, что мы должны учиться на ошибках прошлого.","ar":"يرى المؤرخون أن علينا التعلّم من أخطاء الماضي.","e":"","alt":[]},{"en":"The city, which was built by the Romans, is now in ruins.","he":"העיר, שנבנתה על ידי הרומאים, נמצאת היום בחורבות.","ru":"Город, построенный римлянами, теперь лежит в руинах.","ar":"المدينة التي بناها الرومان أصبحت اليوم أطلالًا.","e":"","alt":[]},{"en":"The war ended after both sides signed a peace agreement.","he":"המלחמה הסתיימה לאחר ששני הצדדים חתמו על הסכם שלום.","ru":"Война закончилась после того, как обе стороны подписали мирный договор.","ar":"انتهت الحرب بعد أن وقّع الطرفان اتفاقية سلام.","e":"","alt":[]},{"en":"Many immigrants arrived in Israel with nothing but hope.","he":"עולים רבים הגיעו לישראל בלי כלום מלבד תקווה.","ru":"Многие иммигранты приехали в Израиль, не имея ничего, кроме надежды.","ar":"وصل كثير من المهاجرين إلى إسرائيل لا يملكون سوى الأمل.","e":"","alt":[]}],"reading":{"en":"Masada is an ancient fortress which stands on top of a high rock near the Dead Sea. It was built by King Herod in the first century BCE as a palace and a place of safety. According to the historian Josephus, a group of Jewish rebels escaped there after the Romans destroyed Jerusalem. The Romans surrounded the fortress and built a huge ramp in order to reach the top. Josephus wrote that the rebels chose to die rather than become slaves. However, some modern historians question whether every detail of his story is accurate. Today, Masada is a UNESCO World Heritage Site and is visited by hundreds of thousands of tourists each year.","he":"מצדה היא מבצר עתיק העומד על ראש צוק גבוה ליד ים המלח. הוא נבנה על ידי המלך הורדוס במאה הראשונה לפני הספירה כארמון וכמקום מבטחים. לפי ההיסטוריון יוסף בן מתתיהו, קבוצה של מורדים יהודים נמלטה לשם לאחר שהרומאים החריבו את ירושלים. הרומאים כיתרו את המבצר ובנו סוללה ענקית כדי להגיע לראשו. יוסף בן מתתיהו כתב שהמורדים בחרו למות ולא להפוך לעבדים. עם זאת, יש היסטוריונים בני זמננו המטילים ספק בכך שכל פרט בסיפורו מדויק. כיום מצדה היא אתר מורשת עולמית של אונסק״ו, ומאות אלפי תיירים מבקרים בה מדי שנה.","ru":"Масада — древняя крепость, расположенная на вершине высокой скалы у Мёртвого моря. Её построил царь Ирод в I веке до н. э. как дворец и убежище. По словам историка Иосифа Флавия, группа еврейских повстанцев бежала туда после того, как римляне разрушили Иерусалим. Римляне окружили крепость и построили огромную насыпь, чтобы добраться до вершины. Иосиф Флавий писал, что повстанцы предпочли смерть рабству. Однако некоторые современные историки сомневаются, что каждая деталь его рассказа достоверна. Сегодня Масада — объект Всемирного наследия ЮНЕСКО, и ежегодно её посещают сотни тысяч туристов.","ar":"مسعدة قلعة قديمة تقع على قمة صخرة عالية قرب البحر الميت. بناها الملك هيرودس في القرن الأول قبل الميلاد لتكون قصرًا وملاذًا آمنًا. ووفقًا للمؤرخ يوسيفوس، فرّت مجموعة من المتمردين اليهود إليها بعد أن دمّر الرومان القدس. حاصر الرومان القلعة وبنوا منحدرًا ضخمًا للوصول إلى قمتها. وكتب يوسيفوس أن المتمردين اختاروا الموت على أن يصبحوا عبيدًا. ومع ذلك، يشكّك بعض المؤرخين المعاصرين في دقة كل تفاصيل روايته. واليوم، تُعدّ مسعدة موقعًا من مواقع التراث العالمي لليونسكو، ويزورها مئات الآلاف من السياح كل عام.","questions":[["Who originally built Masada?","King Herod.","The Roman army.","The Jewish rebels.","The historian Josephus."],["Why did the Romans build a ramp?","To reach the top of the fortress.","To bring water from the Dead Sea.","To make a road to Jerusalem.","To help tourists visit the site."],["What do some modern historians doubt?","That Josephus's story is fully accurate.","That Masada really exists.","That the Romans came to Masada.","That tourists enjoy visiting Masada."]]}},{"en":"careers","he":"קריירה ועבודה","ru":"карьера","ar":"المهن","e":"💼","items":[{"en":"Employers are looking for people who can work in a team.","he":"מעסיקים מחפשים אנשים שיודעים לעבוד בצוות.","ru":"Работодатели ищут людей, которые умеют работать в команде.","ar":"يبحث أصحاب العمل عن أشخاص يجيدون العمل ضمن فريق.","e":"","alt":[]},{"en":"She was offered the job because of her excellent references.","he":"הציעו לה את המשרה בזכות ההמלצות המצוינות שלה.","ru":"Ей предложили эту работу благодаря отличным рекомендациям.","ar":"عُرضت عليها الوظيفة بفضل توصياتها الممتازة.","e":"","alt":[]},{"en":"The interviewer asked me why I wanted to work there.","he":"המראיין שאל אותי למה אני רוצה לעבוד שם.","ru":"Интервьюер спросил меня, почему я хочу там работать.","ar":"سألني المُحاوِر لماذا أريد العمل هناك.","e":"","alt":[]},{"en":"If I had known about the course, I would have applied.","he":"אילו ידעתי על הקורס, הייתי נרשם אליו.","ru":"Если бы я знал об этом курсе, я бы подал заявку.","ar":"لو كنتُ أعرف بشأن الدورة، لتقدّمتُ إليها.","e":"","alt":[]},{"en":"Many young Israelis dream of working in high-tech.","he":"צעירים ישראלים רבים חולמים לעבוד בהייטק.","ru":"Многие молодые израильтяне мечтают работать в хайтеке.","ar":"يحلم كثير من الشباب الإسرائيليين بالعمل في مجال الهايتك.","e":"","alt":[]},{"en":"Job satisfaction is often more important than a high salary.","he":"סיפוק בעבודה חשוב לעיתים קרובות יותר ממשכורת גבוהה.","ru":"Удовлетворённость работой часто важнее высокой зарплаты.","ar":"غالبًا ما يكون الرضا الوظيفي أهم من الراتب المرتفع.","e":"","alt":[]}],"reading":{"en":"A recent survey asked two thousand Israeli teenagers what they considered most important in a future job. Surprisingly, a high salary came only third on the list. The most popular answer was 'meaningful work', followed closely by 'a good work-life balance'. Researchers believe that this reflects a wider change among young people around the world. Unlike their parents, many teenagers say that they would rather earn less than do a job which makes them unhappy. Some employers have already responded by offering flexible hours and the option to work from home. Nevertheless, experts point out that young people's priorities may change once they have to pay rent.","he":"סקר שנערך לאחרונה שאל אלפיים בני נוער ישראלים מה הם רואים כחשוב ביותר בעבודה עתידית. באופן מפתיע, משכורת גבוהה הגיעה רק למקום השלישי ברשימה. התשובה הפופולרית ביותר הייתה 'עבודה משמעותית', ומיד אחריה 'איזון טוב בין עבודה לחיים'. החוקרים מאמינים שהדבר משקף שינוי רחב יותר בקרב צעירים ברחבי העולם. בניגוד להוריהם, בני נוער רבים אומרים שהם מעדיפים להרוויח פחות מאשר לעבוד בעבודה שגורמת להם להיות אומללים. חלק מהמעסיקים כבר הגיבו והם מציעים שעות גמישות ואפשרות לעבוד מהבית. עם זאת, מומחים מציינים שסדרי העדיפויות של צעירים עשויים להשתנות ברגע שיצטרכו לשלם שכר דירה.","ru":"В ходе недавнего опроса две тысячи израильских подростков спросили, что для них важнее всего в будущей работе. Удивительно, но высокая зарплата оказалась лишь на третьем месте. Самым популярным ответом была «значимая работа», а сразу за ней — «хороший баланс между работой и личной жизнью». Исследователи считают, что это отражает более широкие перемены среди молодёжи во всём мире. В отличие от своих родителей, многие подростки говорят, что предпочли бы зарабатывать меньше, чем заниматься работой, которая делает их несчастными. Некоторые работодатели уже отреагировали, предложив гибкий график и возможность работать из дома. Тем не менее эксперты отмечают, что приоритеты молодых людей могут измениться, как только им придётся платить за аренду.","ar":"سأل استطلاع حديث ألفي مراهق إسرائيلي عمّا يعدّونه الأهم في وظيفة المستقبل. والمفاجئ أن الراتب المرتفع جاء في المرتبة الثالثة فقط. وكانت الإجابة الأكثر شيوعًا «عمل ذو معنى»، تلتها مباشرة «توازن جيد بين العمل والحياة». ويرى الباحثون أن ذلك يعكس تغيّرًا أوسع لدى الشباب حول العالم. فعلى عكس آبائهم، يقول كثير من المراهقين إنهم يفضّلون أن يكسبوا أقل على أن يعملوا في وظيفة تجعلهم تعساء. وقد استجاب بعض أصحاب العمل بالفعل بتقديم ساعات عمل مرنة وإمكانية العمل من المنزل. ومع ذلك، يشير الخبراء إلى أن أولويات الشباب قد تتغير حين يضطرون إلى دفع الإيجار.","questions":[["Which answer was most popular in the survey?","Meaningful work.","A high salary.","Working from home.","A famous company."],["How have some employers reacted?","By offering flexible working conditions.","By raising salaries for teenagers.","By refusing to hire young people.","By cancelling remote work."],["What do experts suggest in the last sentence?","Priorities might change with real expenses.","Teenagers will never pay rent.","Salaries will soon become higher.","The survey results were false."]]}},{"en":"national service","he":"צבא ושירות לאומי","ru":"армия и национальная служба","ar":"الخدمة العسكرية والوطنية","e":"🎖️","dialog":true,"items":[{"q":"What are your plans after you finish school?","en":"I'm planning to do a gap year before joining the army.","he":"אני מתכנן לעשות שנת שירות לפני הגיוס לצבא.","ru":"Я планирую взять год перерыва перед призывом в армию.","ar":"أخطط لأخذ سنة تطوعية قبل الالتحاق بالجيش."},{"q":"Why do you think national service is valuable?","en":"It teaches young people responsibility and helps the whole community.","he":"הוא מלמד צעירים אחריות ועוזר לכל הקהילה.","ru":"Она учит молодых людей ответственности и помогает всему обществу.","ar":"إنها تعلّم الشباب المسؤولية وتساعد المجتمع بأسره."},{"q":"What kind of role would you like to have?","en":"I'd like a role where I can use my technology skills.","he":"הייתי רוצה תפקיד שבו אוכל להשתמש בכישורי הטכנולוגיה שלי.","ru":"Я бы хотел такую должность, где смогу использовать свои технические навыки.","ar":"أودّ دورًا أستطيع فيه استخدام مهاراتي التكنولوجية."},{"q":"Are you worried about leaving home?","en":"A little, but I believe it will make me more independent.","he":"קצת, אבל אני מאמין שזה יהפוך אותי לעצמאי יותר.","ru":"Немного, но я верю, что это сделает меня более самостоятельным.","ar":"قليلًا، لكنني أعتقد أن ذلك سيجعلني أكثر استقلالية."},{"q":"What did your older friends tell you about their service?","en":"They told me it was hard but the best experience of their lives.","he":"הם סיפרו לי שזה היה קשה, אבל החוויה הכי טובה בחייהם.","ru":"Они сказали мне, что было тяжело, но это был лучший опыт в их жизни.","ar":"أخبروني أنها كانت صعبة لكنها أفضل تجربة في حياتهم."},{"q":"If you could choose anything, what would you do?","en":"If I could choose, I would work with youth at risk.","he":"אילו יכולתי לבחור, הייתי עובד עם נוער בסיכון.","ru":"Если бы я мог выбирать, я бы работал с трудными подростками.","ar":"لو كان بإمكاني الاختيار، لعملتُ مع الشباب المعرّضين للخطر."}]}]},{"id":"h12","group":"high","he":"5 יחידות לימוד","sub":"בגרות 5 יח״ל: רמה אקדמית","e":"🎓","units":[{"en":"ethics","he":"אתיקה ומוסר","ru":"этика","ar":"الأخلاقيات","e":"⚖️","items":[{"en":"Had scientists considered the consequences, they might have acted differently.","he":"אילו המדענים היו שוקלים את ההשלכות, ייתכן שהיו פועלים אחרת.","ru":"Если бы учёные задумались о последствиях, они, возможно, поступили бы иначе.","ar":"لو أن العلماء أخذوا العواقب في الحسبان، لربما تصرّفوا بشكل مختلف.","e":"","alt":[]},{"en":"Is it ever justified to break the law for a moral cause?","he":"האם אי פעם מוצדק להפר את החוק למען מטרה מוסרית?","ru":"Оправдано ли когда-либо нарушать закон ради моральной цели?","ar":"هل يكون خرق القانون مبرَّرًا يومًا من أجل قضية أخلاقية؟","e":"","alt":[]},{"en":"Genetic engineering raises difficult questions about what it means to be human.","he":"הנדסה גנטית מעוררת שאלות קשות לגבי המשמעות של להיות אדם.","ru":"Генная инженерия поднимает трудные вопросы о том, что значит быть человеком.","ar":"تثير الهندسة الوراثية أسئلة صعبة حول معنى أن تكون إنسانًا.","e":"","alt":[]},{"en":"Critics claim that animal testing is both cruel and unnecessary.","he":"המבקרים טוענים שניסויים בבעלי חיים הם אכזריים ומיותרים כאחד.","ru":"Критики утверждают, что опыты на животных жестоки и к тому же не нужны.","ar":"يزعم المنتقدون أن التجارب على الحيوانات قاسية وغير ضرورية في آن واحد.","e":"","alt":[]},{"en":"Not only is cheating dishonest, but it also harms the cheater.","he":"העתקה היא לא רק חוסר יושר, אלא היא גם פוגעת במעתיק עצמו.","ru":"Списывание не только нечестно, но и вредит самому списывающему.","ar":"الغش ليس عملًا غير نزيه فحسب، بل يضرّ بالغشّاش نفسه أيضًا.","e":"","alt":[]},{"en":"Personal data should not be sold without the user's consent.","he":"אין למכור מידע אישי ללא הסכמת המשתמש.","ru":"Персональные данные не должны продаваться без согласия пользователя.","ar":"لا ينبغي بيع البيانات الشخصية دون موافقة المستخدم.","e":"","alt":[]}],"reading":{"en":"Imagine a self-driving car that must choose between two terrible outcomes: hitting a group of pedestrians or swerving and endangering its own passenger. This dilemma, a modern version of the famous 'trolley problem', is no longer merely a philosophical exercise. Engineers must now decide in advance how their vehicles should behave in such situations. A large international study found that people's answers varied considerably depending on their culture and age. Some respondents insisted that the car should always protect the greatest number of lives, while others argued that a passenger who buys a car is entitled to be protected. Critics of the entire debate maintain that such extreme scenarios are extremely rare and distract from more pressing safety issues. Nonetheless, the question of who should program morality into machines remains unresolved.","he":"דמיינו מכונית אוטונומית שחייבת לבחור בין שתי תוצאות נוראיות: לפגוע בקבוצת הולכי רגל או לסטות ולסכן את הנוסע שלה. הדילמה הזו, גרסה מודרנית של 'בעיית הקרונית' המפורסמת, כבר אינה רק תרגיל פילוסופי. מהנדסים צריכים כיום להחליט מראש כיצד כלי הרכב שלהם יתנהגו במצבים כאלה. מחקר בינלאומי גדול מצא שתשובותיהם של אנשים השתנו במידה ניכרת בהתאם לתרבותם ולגילם. חלק מהנשאלים התעקשו שהמכונית צריכה תמיד להגן על המספר הגדול ביותר של חיים, בעוד שאחרים טענו שנוסע שקונה מכונית זכאי להגנה. מבקרי הוויכוח כולו טוענים שתרחישים קיצוניים כאלה נדירים ביותר ומסיטים את תשומת הלב מבעיות בטיחות דחופות יותר. אף על פי כן, השאלה מי צריך לתכנת מוסר לתוך מכונות נותרה פתוחה.","ru":"Представьте себе беспилотный автомобиль, который должен выбрать между двумя ужасными исходами: сбить группу пешеходов или свернуть и подвергнуть опасности собственного пассажира. Эта дилемма, современная версия знаменитой «проблемы вагонетки», больше не является лишь философским упражнением. Сегодня инженеры должны заранее решать, как их автомобили будут вести себя в подобных ситуациях. Крупное международное исследование показало, что ответы людей значительно различались в зависимости от их культуры и возраста. Одни респонденты настаивали, что машина всегда должна спасать как можно больше жизней, тогда как другие утверждали, что пассажир, купивший автомобиль, имеет право на защиту. Критики всей этой дискуссии считают, что такие крайние сценарии чрезвычайно редки и отвлекают от более насущных проблем безопасности. Тем не менее вопрос о том, кто должен закладывать мораль в машины, остаётся нерешённым.","ar":"تخيّل سيارة ذاتية القيادة مضطرة إلى الاختيار بين نتيجتين مروّعتين: أن تصدم مجموعة من المشاة أو أن تنحرف فتعرّض راكبها للخطر. لم تعد هذه المعضلة، وهي نسخة حديثة من «مشكلة العربة» الشهيرة، مجرد تمرين فلسفي. فعلى المهندسين اليوم أن يقرروا مسبقًا كيف ستتصرف مركباتهم في مثل هذه المواقف. وقد وجدت دراسة دولية كبيرة أن إجابات الناس تفاوتت تفاوتًا كبيرًا بحسب ثقافتهم وأعمارهم. فقد أصرّ بعض المشاركين على أن السيارة يجب أن تحمي دائمًا أكبر عدد من الأرواح، في حين رأى آخرون أن الراكب الذي يشتري سيارة يحق له أن يحظى بالحماية. أما منتقدو هذا الجدل برمّته فيؤكدون أن مثل هذه السيناريوهات المتطرفة نادرة للغاية وتصرف الانتباه عن قضايا سلامة أكثر إلحاحًا. ومع ذلك، تظل مسألة من ينبغي أن يبرمج الأخلاق في الآلات دون حل.","questions":[["Why is the trolley problem now a practical issue?","Engineers must program cars' decisions.","Trolleys have returned to big cities.","Philosophers now design cars.","Passengers vote on car behavior."],["What did the international study reveal?","Answers differed across cultures and ages.","Everyone agreed on the same answer.","Most people refuse to buy such cars.","Older people prefer trolleys."],["What is the critics' main argument?","The scenarios are rare and distracting.","Cars should always protect passengers.","Self-driving cars should be banned.","Morality cannot be studied."]]}},{"en":"global issues","he":"סוגיות גלובליות","ru":"глобальные проблемы","ar":"القضايا العالمية","e":"🌐","items":[{"en":"Were poverty to be eliminated, many conflicts would disappear.","he":"אילו העוני היה מבוטל, סכסוכים רבים היו נעלמים.","ru":"Если бы бедность была искоренена, многие конфликты исчезли бы.","ar":"لو قُضي على الفقر، لاختفت صراعات كثيرة.","e":"","alt":[]},{"en":"Millions of refugees have been forced to leave their homes.","he":"מיליוני פליטים נאלצו לעזוב את בתיהם.","ru":"Миллионы беженцев были вынуждены покинуть свои дома.","ar":"اضطُرّ ملايين اللاجئين إلى مغادرة منازلهم.","e":"","alt":[]},{"en":"Access to clean water is a basic human right.","he":"גישה למים נקיים היא זכות אדם בסיסית.","ru":"Доступ к чистой воде — одно из основных прав человека.","ar":"الحصول على المياه النظيفة حق أساسي من حقوق الإنسان.","e":"","alt":[]},{"en":"Wealthy nations have a responsibility to support developing countries.","he":"למדינות עשירות יש אחריות לתמוך במדינות מתפתחות.","ru":"Богатые страны обязаны поддерживать развивающиеся страны.","ar":"تقع على عاتق الدول الغنية مسؤولية دعم الدول النامية.","e":"","alt":[]},{"en":"Globalization has brought both economic growth and growing inequality.","he":"הגלובליזציה הביאה גם צמיחה כלכלית וגם אי-שוויון גובר.","ru":"Глобализация принесла как экономический рост, так и растущее неравенство.","ar":"جلبت العولمة النمو الاقتصادي وتزايد عدم المساواة معًا.","e":"","alt":[]},{"en":"The pandemic demonstrated how interconnected the world has become.","he":"המגפה הדגימה עד כמה העולם הפך מקושר.","ru":"Пандемия показала, насколько взаимосвязанным стал мир.","ar":"أظهرت الجائحة مدى الترابط الذي بات عليه العالم.","e":"","alt":[]}],"reading":{"en":"Food waste is one of the most overlooked global problems. According to the United Nations, roughly one third of all food produced worldwide is never eaten, while hundreds of millions of people suffer from hunger. Wasted food not only represents a loss of money and resources but also releases methane, a powerful greenhouse gas, as it rots in landfills. In Israel, organizations such as Leket Israel collect surplus food from farms, hotels and army bases and distribute it to families in need. Had such initiatives existed decades ago, enormous quantities of food could have been saved. Experts argue, however, that charity alone cannot solve the problem; rather, changes are required in the way food is produced, sold and consumed. Consumers, for instance, often throw away products that are perfectly safe simply because they look imperfect.","he":"בזבוז מזון הוא אחת הבעיות הגלובליות המוזנחות ביותר. לפי האו״ם, כשליש מכל המזון המיוצר בעולם לעולם אינו נאכל, בעוד מאות מיליוני אנשים סובלים מרעב. מזון מבוזבז אינו מייצג רק אובדן של כסף ומשאבים, אלא גם משחרר מתאן, גז חממה רב עוצמה, כשהוא נרקב במטמנות. בישראל, ארגונים כמו לקט ישראל אוספים עודפי מזון מחוות חקלאיות, ממלונות ומבסיסי צבא ומחלקים אותם למשפחות נזקקות. אילו יוזמות כאלה היו קיימות לפני עשרות שנים, ניתן היה להציל כמויות עצומות של מזון. עם זאת, מומחים טוענים שצדקה לבדה אינה יכולה לפתור את הבעיה; נדרשים שינויים באופן שבו מזון מיוצר, נמכר ונצרך. צרכנים, למשל, זורקים לעיתים קרובות מוצרים בטוחים לחלוטין רק משום שהם נראים לא מושלמים.","ru":"Пищевые отходы — одна из самых недооценённых глобальных проблем. По данным ООН, примерно треть всей производимой в мире еды так и не съедается, в то время как сотни миллионов людей страдают от голода. Выброшенная еда означает не только потерю денег и ресурсов: гниющая на свалках, она выделяет метан — мощный парниковый газ. В Израиле такие организации, как «Лекет Исраэль», собирают излишки продуктов на фермах, в гостиницах и на военных базах и раздают их нуждающимся семьям. Если бы подобные инициативы существовали десятилетия назад, можно было бы спасти огромное количество еды. Однако эксперты утверждают, что одна лишь благотворительность не может решить проблему; необходимы изменения в том, как еда производится, продаётся и потребляется. Например, потребители часто выбрасывают совершенно безопасные продукты только потому, что они выглядят неидеально.","ar":"يُعدّ هدر الطعام من أكثر المشكلات العالمية التي يُغفل عنها. فبحسب الأمم المتحدة، لا يُؤكل نحو ثلث الطعام المنتَج في العالم أبدًا، بينما يعاني مئات الملايين من الجوع. ولا يمثّل الطعام المهدَر خسارة للمال والموارد فحسب، بل يطلق أيضًا غاز الميثان، وهو من غازات الدفيئة القوية، عندما يتعفّن في مكبّات النفايات. وفي إسرائيل، تجمع منظمات مثل «ليكيت يسرائيل» فائض الطعام من المزارع والفنادق والقواعد العسكرية وتوزّعه على الأسر المحتاجة. ولو وُجدت مثل هذه المبادرات قبل عقود، لأمكن إنقاذ كميات هائلة من الطعام. ومع ذلك، يرى الخبراء أن العمل الخيري وحده لا يستطيع حل المشكلة؛ بل لا بد من تغييرات في طريقة إنتاج الطعام وبيعه واستهلاكه. فالمستهلكون مثلًا كثيرًا ما يرمون منتجات آمنة تمامًا لمجرد أن مظهرها غير مثالي.","questions":[["What paradox does the text describe?","Food is wasted while people go hungry.","Farms produce too little food.","Hungry people waste the most food.","Charities refuse to collect food."],["Why is rotting food harmful to the environment?","It releases a greenhouse gas.","It attracts dangerous animals.","It pollutes drinking water.","It uses up land for farming."],["What do experts believe is necessary?","Systemic change, not only charity.","More landfills around the world.","Banning imperfect-looking products.","Closing hotels and army bases."]]}},{"en":"university","he":"אוניברסיטה","ru":"университет","ar":"الجامعة","e":"🏫","items":[{"en":"Applicants are required to submit their psychometric scores by March.","he":"על המועמדים להגיש את ציוני הפסיכומטרי עד מרץ.","ru":"Абитуриенты должны предоставить результаты психометрического экзамена до марта.","ar":"يُطلب من المتقدمين تقديم نتائج امتحان البسيخومتري بحلول شهر مارس.","e":"","alt":[]},{"en":"Had I studied harder in high school, I'd have more options now.","he":"אילו הייתי לומד קשה יותר בתיכון, היו לי עכשיו יותר אפשרויות.","ru":"Если бы я усерднее учился в школе, сейчас у меня было бы больше вариантов.","ar":"لو أنني درستُ بجدّ أكبر في الثانوية، لكانت لديّ خيارات أكثر الآن.","e":"","alt":[]},{"en":"Tuition fees in Israel are relatively low compared to the United States.","he":"שכר הלימוד בישראל נמוך יחסית לעומת ארצות הברית.","ru":"Плата за обучение в Израиле относительно низкая по сравнению с США.","ar":"الرسوم الدراسية في إسرائيل منخفضة نسبيًا مقارنةً بالولايات المتحدة.","e":"","alt":[]},{"en":"The lecturer emphasized that plagiarism would not be tolerated.","he":"המרצה הדגיש שלא תהיה שום סובלנות כלפי גניבה ספרותית.","ru":"Лектор подчеркнул, что плагиат не будет допускаться.","ar":"شدّد المحاضر على أن الانتحال لن يُتهاون معه.","e":"","alt":[]},{"en":"Many students combine their studies with a part-time job.","he":"סטודנטים רבים משלבים את הלימודים עם עבודה במשרה חלקית.","ru":"Многие студенты совмещают учёбу с работой на неполный день.","ar":"يجمع كثير من الطلاب بين دراستهم وعمل بدوام جزئي.","e":"","alt":[]},{"en":"Choosing a degree should be based on passion as well as prospects.","he":"הבחירה בתואר צריכה להתבסס על תשוקה וגם על סיכויי תעסוקה.","ru":"Выбор специальности должен основываться как на увлечении, так и на перспективах.","ar":"ينبغي أن يقوم اختيار التخصص على الشغف وعلى آفاق العمل أيضًا.","e":"","alt":[]}],"reading":{"en":"For many Israelis, the path to university is longer than it is in most Western countries. After completing their military or national service, a large number of young people travel abroad for several months before beginning their studies. Consequently, the average Israeli student starts a first degree at around the age of twenty-three or twenty-four. Some educators view this delay as a disadvantage, since graduates enter the job market later than their peers overseas. Others, however, argue that older students tend to be more mature, more focused and more certain about what they wish to study. Indeed, lecturers frequently report that Israeli students participate actively in class and are not afraid to challenge their professors. Whether the delay is a benefit or a burden, it is clearly a defining feature of Israeli higher education.","he":"עבור ישראלים רבים, הדרך לאוניברסיטה ארוכה יותר מאשר ברוב המדינות המערביות. לאחר סיום השירות הצבאי או הלאומי, צעירים רבים נוסעים לחו״ל לכמה חודשים לפני תחילת הלימודים. כתוצאה מכך, הסטודנט הישראלי הממוצע מתחיל תואר ראשון בגיל עשרים ושלוש או עשרים וארבע בערך. יש אנשי חינוך הרואים בעיכוב הזה חיסרון, שכן הבוגרים נכנסים לשוק העבודה מאוחר יותר מבני גילם בחו״ל. אחרים, לעומת זאת, טוענים שסטודנטים מבוגרים יותר נוטים להיות בשלים, ממוקדים ובטוחים יותר במה שהם רוצים ללמוד. ואכן, מרצים מדווחים לעיתים קרובות שסטודנטים ישראלים משתתפים באופן פעיל בשיעורים ואינם חוששים לערער על דברי המרצים שלהם. בין אם העיכוב הוא יתרון ובין אם הוא נטל, ברור שזהו מאפיין מובהק של ההשכלה הגבוהה בישראל.","ru":"Для многих израильтян путь в университет длиннее, чем в большинстве западных стран. После окончания военной или национальной службы многие молодые люди на несколько месяцев уезжают за границу, прежде чем начать учёбу. В результате средний израильский студент начинает получать первую степень примерно в двадцать три или двадцать четыре года. Некоторые педагоги считают эту задержку недостатком, поскольку выпускники выходят на рынок труда позже, чем их сверстники за рубежом. Другие, однако, утверждают, что более взрослые студенты, как правило, более зрелые, сосредоточенные и лучше понимают, что хотят изучать. И действительно, преподаватели часто отмечают, что израильские студенты активно участвуют в занятиях и не боятся спорить со своими профессорами. Преимущество это или бремя, но такая задержка явно является отличительной чертой израильского высшего образования.","ar":"بالنسبة إلى كثير من الإسرائيليين، يكون الطريق إلى الجامعة أطول منه في معظم الدول الغربية. فبعد إنهاء الخدمة العسكرية أو الوطنية، يسافر عدد كبير من الشباب إلى الخارج لعدة أشهر قبل بدء دراستهم. ونتيجة لذلك، يبدأ الطالب الإسرائيلي العادي دراسة اللقب الأول في سن الثالثة والعشرين أو الرابعة والعشرين تقريبًا. ويرى بعض التربويين في هذا التأخير عيبًا، إذ يدخل الخريجون سوق العمل في وقت متأخر عن أقرانهم في الخارج. في المقابل، يرى آخرون أن الطلاب الأكبر سنًّا يميلون إلى أن يكونوا أكثر نضجًا وتركيزًا ويقينًا بشأن ما يرغبون في دراسته. وبالفعل، كثيرًا ما يذكر المحاضرون أن الطلاب الإسرائيليين يشاركون بنشاط في المحاضرات ولا يخشون مجادلة أساتذتهم. وسواء أكان هذا التأخير ميزة أم عبئًا، فمن الواضح أنه سمة مميزة للتعليم العالي في إسرائيل.","questions":[["Why do Israeli students begin university later?","Service and travel come first.","Universities accept only older students.","High school lasts longer in Israel.","Tuition is too expensive for teens."],["What disadvantage of the delay is mentioned?","Graduates start working later.","Students forget what they learned.","Lecturers dislike older students.","Degrees take longer to finish."],["What does 'challenge their professors' suggest?","Students are confident and question ideas.","Students are rude and lazy.","Students rarely attend lectures.","Students prefer to study alone."]]}},{"en":"culture","he":"תרבות","ru":"культура","ar":"الثقافة","e":"🎭","items":[{"en":"Israeli society has been shaped by immigrants from over a hundred countries.","he":"החברה הישראלית עוצבה על ידי עולים מיותר ממאה מדינות.","ru":"Израильское общество сформировали иммигранты из более чем ста стран.","ar":"تشكّل المجتمعُ الإسرائيلي على يد مهاجرين من أكثر من مئة دولة.","e":"","alt":[]},{"en":"Traditions are passed down from one generation to the next.","he":"מסורות מועברות מדור לדור.","ru":"Традиции передаются из поколения в поколение.","ar":"تنتقل التقاليد من جيل إلى جيل.","e":"","alt":[]},{"en":"Some fear that global culture threatens local languages and customs.","he":"יש החוששים שהתרבות הגלובלית מאיימת על שפות ומנהגים מקומיים.","ru":"Некоторые опасаются, что глобальная культура угрожает местным языкам и обычаям.","ar":"يخشى البعض أن تهدد الثقافة العالمية اللغات والعادات المحلية.","e":"","alt":[]},{"en":"The film, which was shot entirely in Jaffa, won an international award.","he":"הסרט, שצולם כולו ביפו, זכה בפרס בינלאומי.","ru":"Фильм, полностью снятый в Яффо, получил международную премию.","ar":"فاز الفيلم، الذي صُوّر بالكامل في يافا، بجائزة دولية.","e":"","alt":[]},{"en":"Art allows people to express what words cannot.","he":"האמנות מאפשרת לאנשים לבטא את מה שמילים אינן יכולות.","ru":"Искусство позволяет людям выразить то, что невозможно выразить словами.","ar":"يتيح الفن للناس التعبير عمّا تعجز عنه الكلمات.","e":"","alt":[]},{"en":"Rarely have so many cultures lived side by side in one place.","he":"רק לעיתים נדירות חיו כל כך הרבה תרבויות זו לצד זו במקום אחד.","ru":"Редко когда столько культур жили бок о бок в одном месте.","ar":"نادرًا ما عاشت ثقافات كثيرة إلى هذا الحد جنبًا إلى جنب في مكان واحد.","e":"","alt":[]}],"reading":{"en":"Eurovision, the international song contest, is watched by more than 150 million viewers every year. Although Israel is not located in Europe, it has participated since 1973 and has won the competition four times. For many Israelis, the contest is far more than entertainment; it represents a sense of belonging to the wider international community. Critics, however, claim that the voting is influenced less by musical quality than by politics and neighbourly relations between countries. Supporters reject this view, pointing out that unexpected winners frequently emerge. What is undeniable is that the contest has introduced Hebrew songs to audiences who might otherwise never have heard the language. In this respect, Eurovision serves as a cultural bridge, whatever one thinks of the music.","he":"האירוויזיון, תחרות השירים הבינלאומית, נצפה מדי שנה על ידי יותר מ-150 מיליון צופים. אף על פי שישראל אינה נמצאת באירופה, היא משתתפת בתחרות מאז 1973 וזכתה בה ארבע פעמים. עבור ישראלים רבים, התחרות היא הרבה יותר מבידור; היא מייצגת תחושת שייכות לקהילה הבינלאומית הרחבה. המבקרים, לעומת זאת, טוענים שההצבעה מושפעת פחות מאיכות מוזיקלית ויותר מפוליטיקה ומיחסי שכנות בין מדינות. התומכים דוחים טענה זו ומציינים שלעיתים קרובות צצים זוכים בלתי צפויים. מה שאין עליו עוררין הוא שהתחרות חשפה שירים בעברית לקהלים שאחרת אולי לא היו שומעים את השפה לעולם. במובן זה, האירוויזיון משמש גשר תרבותי, בלי קשר למה שחושבים על המוזיקה.","ru":"«Евровидение», международный песенный конкурс, ежегодно смотрят более 150 миллионов зрителей. Хотя Израиль не находится в Европе, он участвует в конкурсе с 1973 года и побеждал в нём четыре раза. Для многих израильтян конкурс — это гораздо больше, чем развлечение; он олицетворяет чувство принадлежности к широкому международному сообществу. Критики, однако, утверждают, что на голосование влияет не столько качество музыки, сколько политика и добрососедские отношения между странами. Сторонники отвергают эту точку зрения, указывая, что победителями часто становятся неожиданные участники. Бесспорно одно: конкурс познакомил с песнями на иврите аудиторию, которая иначе, возможно, никогда бы не услышала этот язык. В этом смысле «Евровидение» служит культурным мостом, что бы ни думать о самой музыке.","ar":"تحظى مسابقة «يوروفيجن» الدولية للأغاني بأكثر من 150 مليون مشاهد كل عام. ورغم أن إسرائيل لا تقع في أوروبا، فإنها تشارك في المسابقة منذ عام 1973 وفازت بها أربع مرات. وبالنسبة إلى كثير من الإسرائيليين، فإن المسابقة أكثر بكثير من مجرد ترفيه؛ إذ تمثّل شعورًا بالانتماء إلى المجتمع الدولي الأوسع. غير أن المنتقدين يزعمون أن التصويت يتأثر بالسياسة وعلاقات الجوار بين الدول أكثر مما يتأثر بالجودة الموسيقية. ويرفض المؤيدون هذا الرأي، مشيرين إلى أن فائزين غير متوقعين يبرزون كثيرًا. وما لا يمكن إنكاره هو أن المسابقة عرّفت جماهير بأغانٍ عبرية ربما لم تكن لتسمع هذه اللغة أبدًا لولاها. ومن هذا المنطلق، تؤدي «يوروفيجن» دور الجسر الثقافي، أيًّا كان رأي المرء في الموسيقى.","questions":[["Why is Eurovision important to many Israelis?","It gives a sense of international belonging.","It is the only show on TV.","Israel always wins the contest.","It takes place in Israel every year."],["What do critics say about the voting?","Politics affects it more than music.","It is completely fair.","Only Israelis are allowed to vote.","Viewers cannot vote at all."],["Why does the writer call Eurovision a 'cultural bridge'?","It exposes audiences to other languages.","It is broadcast from a bridge.","It unites all critics and supporters.","It ends political conflicts."]]}},{"en":"society","he":"חברה","ru":"общество","ar":"المجتمع","e":"👥","items":[{"en":"The gap between rich and poor has widened in recent decades.","he":"הפער בין עשירים לעניים התרחב בעשורים האחרונים.","ru":"Разрыв между богатыми и бедными в последние десятилетия увеличился.","ar":"اتّسعت الفجوة بين الأغنياء والفقراء في العقود الأخيرة.","e":"","alt":[]},{"en":"Equal opportunities in education are essential for a fair society.","he":"שוויון הזדמנויות בחינוך הכרחי לחברה הוגנת.","ru":"Равные возможности в образовании необходимы для справедливого общества.","ar":"تكافؤ الفرص في التعليم أمر ضروري لمجتمع عادل.","e":"","alt":[]},{"en":"It is often argued that social media deepens political divisions.","he":"נטען לעיתים קרובות שהרשתות החברתיות מעמיקות את הקיטוב הפוליטי.","ru":"Часто утверждают, что социальные сети углубляют политический раскол.","ar":"كثيرًا ما يُقال إن وسائل التواصل الاجتماعي تعمّق الانقسامات السياسية.","e":"","alt":[]},{"en":"Unless housing prices drop, young couples will struggle to buy homes.","he":"אם מחירי הדיור לא יירדו, לזוגות צעירים יהיה קשה לקנות דירה.","ru":"Если цены на жильё не снизятся, молодым парам будет трудно купить жильё.","ar":"ما لم تنخفض أسعار المساكن، سيجد الأزواج الشباب صعوبة في شراء منزل.","e":"","alt":[]},{"en":"Volunteers play a crucial role in strengthening local communities.","he":"מתנדבים ממלאים תפקיד מכריע בחיזוק קהילות מקומיות.","ru":"Волонтёры играют решающую роль в укреплении местных сообществ.","ar":"يؤدي المتطوعون دورًا حاسمًا في تعزيز المجتمعات المحلية.","e":"","alt":[]},{"en":"Tolerance means respecting people whose opinions differ from ours.","he":"סובלנות פירושה לכבד אנשים שדעותיהם שונות משלנו.","ru":"Терпимость означает уважение к людям, чьи взгляды отличаются от наших.","ar":"التسامح يعني احترام الأشخاص الذين تختلف آراؤهم عن آرائنا.","e":"","alt":[]}],"reading":{"en":"Loneliness has been described by some health experts as a modern epidemic. Studies suggest that chronic loneliness can be as harmful to health as smoking fifteen cigarettes a day. Paradoxically, this problem has grown at a time when people are more digitally connected than ever before. Researchers explain that online interactions, while convenient, rarely provide the deep emotional support that face-to-face relationships offer. The issue affects not only the elderly but increasingly young adults, many of whom move to big cities far from family and childhood friends. In response, several countries have introduced national strategies to tackle loneliness, and in Israel, a number of municipalities now run programmes that connect students with elderly residents. Such initiatives demonstrate that the solution may lie not in new technology but in rebuilding genuine communities.","he":"יש מומחי בריאות שתיארו את הבדידות כמגפה מודרנית. מחקרים מראים שבדידות כרונית עלולה להזיק לבריאות כמו עישון של חמש עשרה סיגריות ביום. באופן פרדוקסלי, הבעיה הזו התעצמה דווקא בתקופה שבה אנשים מחוברים דיגיטלית יותר מאי פעם. חוקרים מסבירים שאינטראקציות ברשת, אף שהן נוחות, מספקות רק לעיתים רחוקות את התמיכה הרגשית העמוקה שמעניקים קשרים פנים אל פנים. הבעיה פוגעת לא רק בקשישים אלא יותר ויותר גם בצעירים, שרבים מהם עוברים לערים גדולות הרחק ממשפחתם ומחברי ילדותם. בתגובה, כמה מדינות גיבשו אסטרטגיות לאומיות להתמודדות עם בדידות, ובישראל מספר רשויות מקומיות מפעילות כיום תוכניות המחברות בין סטודנטים לתושבים ותיקים. יוזמות כאלה מראות שהפתרון אולי טמון לא בטכנולוגיה חדשה אלא בבנייה מחדש של קהילות אמיתיות.","ru":"Некоторые специалисты в области здравоохранения называют одиночество современной эпидемией. Исследования показывают, что хроническое одиночество может быть так же вредно для здоровья, как выкуривание пятнадцати сигарет в день. Парадоксально, но эта проблема обострилась именно тогда, когда люди связаны в цифровом мире как никогда раньше. Исследователи объясняют, что общение в интернете, хотя и удобно, редко даёт ту глубокую эмоциональную поддержку, которую обеспечивают личные отношения. Проблема затрагивает не только пожилых людей, но всё чаще и молодёжь, многие представители которой переезжают в большие города далеко от семьи и друзей детства. В ответ ряд стран принял национальные стратегии борьбы с одиночеством, а в Израиле несколько муниципалитетов реализуют программы, которые знакомят студентов с пожилыми жителями. Такие инициативы показывают, что решение, возможно, кроется не в новых технологиях, а в восстановлении настоящих сообществ.","ar":"وصف بعض خبراء الصحة الوحدة بأنها وباء العصر الحديث. وتشير الدراسات إلى أن الوحدة المزمنة قد تكون ضارة بالصحة بقدر تدخين خمس عشرة سيجارة يوميًا. والمفارقة أن هذه المشكلة تفاقمت في وقت أصبح فيه الناس متصلين رقميًا أكثر من أي وقت مضى. ويوضح الباحثون أن التفاعلات عبر الإنترنت، رغم سهولتها، نادرًا ما توفر الدعم العاطفي العميق الذي تقدمه العلاقات المباشرة وجهًا لوجه. ولا تقتصر المشكلة على كبار السن، بل تطال بشكل متزايد الشباب، الذين ينتقل كثير منهم إلى المدن الكبرى بعيدًا عن عائلاتهم وأصدقاء طفولتهم. وردًّا على ذلك، وضعت عدة دول استراتيجيات وطنية لمواجهة الوحدة، وفي إسرائيل تدير عدة بلديات اليوم برامج تربط الطلاب بالسكان المسنّين. وتُظهر هذه المبادرات أن الحل قد لا يكمن في تكنولوجيا جديدة، بل في إعادة بناء مجتمعات حقيقية.","questions":[["Why does the writer call the situation a paradox?","People are lonely despite being connected.","Smoking causes loneliness.","Old people use technology more.","Cities are less crowded than before."],["Who is increasingly affected by loneliness?","Young adults living far from home.","Children in primary school.","Families living in villages.","Doctors and health experts."],["What solution does the writer favour?","Rebuilding real, personal communities.","Developing new social apps.","Moving young adults back home.","Banning smartphones for students."]]}},{"en":"debate","he":"דיון וטיעון","ru":"дебаты","ar":"المناظرة","e":"🗣️","dialog":true,"items":[{"q":"Should school uniforms be compulsory? What's your view?","en":"In my view, uniforms reduce social pressure, although they limit self-expression.","he":"לדעתי, תלבושת אחידה מפחיתה לחץ חברתי, אף על פי שהיא מגבילה את הביטוי העצמי.","ru":"На мой взгляд, школьная форма снижает социальное давление, хотя и ограничивает самовыражение.","ar":"في رأيي، يقلّل الزي المدرسي الضغط الاجتماعي، مع أنه يحدّ من التعبير عن الذات."},{"q":"Do you think AI will create more jobs than it destroys?","en":"I believe it will, provided that people are retrained for new roles.","he":"אני מאמין שכן, בתנאי שאנשים יוסבו לתפקידים חדשים.","ru":"Думаю, да, при условии, что людей переобучат для новых профессий.","ar":"أعتقد ذلك، شريطة أن يُعاد تأهيل الناس لأدوار جديدة."},{"q":"What is the most serious problem facing your generation?","en":"Without a doubt, climate change, because its effects will last for centuries.","he":"ללא ספק, שינוי האקלים, כי השפעותיו יימשכו מאות שנים.","ru":"Без сомнения, изменение климата, потому что его последствия будут ощущаться веками.","ar":"بلا شك، تغيّر المناخ، لأن آثاره ستستمر لقرون."},{"q":"Some say social media should be banned for under-sixteens. Do you agree?","en":"I partly agree, but education is more effective than banning things.","he":"אני מסכים חלקית, אבל חינוך יעיל יותר מאיסורים.","ru":"Я частично согласен, но образование эффективнее запретов.","ar":"أوافق جزئيًا، لكن التوعية أكثر فاعلية من الحظر."},{"q":"How would you respond to someone who disagrees with you?","en":"I would listen carefully and then explain my position with evidence.","he":"הייתי מקשיב בתשומת לב ואז מסביר את עמדתי בעזרת ראיות.","ru":"Я бы внимательно выслушал, а затем объяснил свою позицию, опираясь на факты.","ar":"سأستمع بانتباه ثم أشرح موقفي مستندًا إلى الأدلة."},{"q":"If you could change one thing in the education system, what would it be?","en":"I would replace some exams with projects that develop critical thinking.","he":"הייתי מחליף חלק מהמבחנים בפרויקטים שמפתחים חשיבה ביקורתית.","ru":"Я бы заменил часть экзаменов проектами, развивающими критическое мышление.","ar":"كنتُ سأستبدل بعض الامتحانات بمشاريع تنمّي التفكير النقدي."}]}]},{"id":"m7","group":"middle","he":"כיתה ז׳","sub":"צעדים ראשונים בחטיבה","e":"🎒","units":[{"en":"school life","he":"חיי בית הספר","ru":"школьная жизнь","ar":"الحياة المدرسية","e":"🏫","items":[{"en":"I have English three times a week.","he":"יש לי אנגלית שלוש פעמים בשבוע.","ru":"У меня английский три раза в неделю.","ar":"لديّ درس إنجليزية ثلاث مرات في الأسبوع.","e":"","alt":[]},{"en":"Our new teacher is strict but very fair.","he":"המורה החדש שלנו קפדן אבל מאוד הוגן.","ru":"Наш новый учитель строгий, но очень справедливый.","ar":"معلّمنا الجديد صارم لكنه عادل جدًا.","e":"","alt":[]},{"en":"I'm studying for a math test tomorrow.","he":"אני לומד/ת למבחן במתמטיקה של מחר.","ru":"Я готовлюсь к завтрашней контрольной по математике.","ar":"أنا أدرس لامتحان الرياضيات غدًا.","e":"","alt":[]},{"en":"Can I borrow your notes from yesterday?","he":"אפשר לשאול את הסיכומים שלך מאתמול?","ru":"Можно взять твои вчерашние конспекты?","ar":"هل يمكنني استعارة ملاحظاتك من الأمس؟","e":"","alt":[]},{"en":"We forgot to do our homework again.","he":"שוב שכחנו להכין את שיעורי הבית.","ru":"Мы снова забыли сделать домашнее задание.","ar":"نسينا أن نحلّ واجباتنا المنزلية مرة أخرى.","e":"","alt":[]},{"en":"In my opinion, the break is too short.","he":"לדעתי, ההפסקה קצרה מדי.","ru":"По-моему, перемена слишком короткая.","ar":"في رأيي، الاستراحة قصيرة جدًا.","e":"","alt":[]}],"reading":{"en":"Noa is in seventh grade at a new school in Haifa. On the first day, she didn't know anyone. At lunch, a girl named Maya sat next to her and asked about her old school. Now they walk home together every day. Noa's favorite subject is science because the lessons are full of experiments.","he":"נועה בכיתה ז׳ בבית ספר חדש בחיפה. ביום הראשון היא לא הכירה אף אחד. בהפסקת הצהריים ילדה בשם מאיה התיישבה לידה ושאלה על בית הספר הקודם שלה. עכשיו הן הולכות הביתה יחד כל יום. המקצוע האהוב על נועה הוא מדעים, כי השיעורים מלאים בניסויים.","ru":"Ноа учится в седьмом классе в новой школе в Хайфе. В первый день она никого не знала. Во время обеда девочка по имени Майя села рядом с ней и спросила о её старой школе. Теперь они каждый день вместе идут домой. Любимый предмет Ноа — естествознание, потому что на уроках много опытов.","ar":"نوعا في الصف السابع في مدرسة جديدة في حيفا. في اليوم الأول لم تكن تعرف أحدًا. في استراحة الغداء جلست بجانبها فتاة اسمها مايا وسألتها عن مدرستها القديمة. الآن تعودان إلى البيت معًا كل يوم. مادة نوعا المفضّلة هي العلوم لأن الدروس مليئة بالتجارب.","questions":[["Where is Noa's new school?","in haifa","in tel aviv","in jerusalem"],["Who sat next to Noa at lunch?","maya","her teacher","her brother"],["Why does Noa like science?","because of the experiments","because it is easy","because maya teaches it"]]}},{"en":"friendship","he":"חברות","ru":"дружба","ar":"الصداقة","e":"🤝","items":[{"en":"A good friend always listens to you.","he":"חבר טוב תמיד מקשיב לך.","ru":"Хороший друг всегда тебя выслушает.","ar":"الصديق الجيد يستمع إليك دائمًا.","e":"","alt":[]},{"en":"We met in first grade and became best friends.","he":"נפגשנו בכיתה א׳ והפכנו לחברים הכי טובים.","ru":"Мы познакомились в первом классе и стали лучшими друзьями.","ar":"التقينا في الصف الأول وأصبحنا أعزّ الأصدقاء.","e":"","alt":[]},{"en":"I'm sorry, I didn't mean to hurt you.","he":"אני מצטער/ת, לא התכוונתי לפגוע בך.","ru":"Прости, я не хотел тебя обидеть.","ar":"آسف، لم أقصد أن أجرحك.","e":"","alt":[]},{"en":"Do you want to come over after school?","he":"רוצה לבוא אליי אחרי בית הספר?","ru":"Хочешь зайти ко мне после школы?","ar":"هل تريد أن تأتي إليّ بعد المدرسة؟","e":"","alt":[]},{"en":"She is funnier than anyone in our class.","he":"היא מצחיקה יותר מכל אחד בכיתה שלנו.","ru":"Она смешнее всех в нашем классе.","ar":"هي أظرف من أي أحد في صفّنا.","e":"","alt":[]},{"en":"You can always tell me the truth.","he":"אתה תמיד יכול להגיד לי את האמת.","ru":"Ты всегда можешь сказать мне правду.","ar":"يمكنك دائمًا أن تقول لي الحقيقة.","e":"","alt":[]}],"reading":{"en":"Itay and Omer are neighbors and best friends. Last week they had a big fight about a football game. For three days they didn't talk to each other. Then Omer sent Itay a message and said sorry. Now they are friends again, and they are planning a bike trip for the summer.","he":"איתי ועומר שכנים וחברים הכי טובים. בשבוע שעבר הם רבו ריב גדול על משחק כדורגל. במשך שלושה ימים הם לא דיברו זה עם זה. אז עומר שלח לאיתי הודעה וביקש סליחה. עכשיו הם שוב חברים, והם מתכננים טיול אופניים לקיץ.","ru":"Итай и Омер — соседи и лучшие друзья. На прошлой неделе они сильно поссорились из-за футбольного матча. Три дня они не разговаривали друг с другом. Потом Омер написал Итаю сообщение и извинился. Теперь они снова друзья и планируют велопоход на лето.","ar":"إيتاي وعومر جاران وأعزّ صديقين. في الأسبوع الماضي تشاجرا شجارًا كبيرًا بسبب مباراة كرة قدم. لمدة ثلاثة أيام لم يتحدّثا مع بعضهما. ثم أرسل عومر رسالة إلى إيتاي واعتذر. الآن عادا صديقين، وهما يخطّطان لرحلة على الدراجات في الصيف.","questions":[["What did Itay and Omer fight about?","a football game","a video game","a girl in their class"],["How long didn't they talk?","three days","a week","two hours"],["What are they planning for the summer?","a bike trip","a beach party","a football camp"]]}},{"en":"sports","he":"ספורט","ru":"спорт","ar":"الرياضة","e":"⚽","items":[{"en":"I play basketball twice a week after school.","he":"אני משחק/ת כדורסל פעמיים בשבוע אחרי בית הספר.","ru":"Я играю в баскетбол два раза в неделю после школы.","ar":"ألعب كرة السلة مرتين في الأسبوع بعد المدرسة.","e":"","alt":[]},{"en":"Our team won the game by two points.","he":"הקבוצה שלנו ניצחה במשחק בהפרש של שתי נקודות.","ru":"Наша команда выиграла матч с разницей в два очка.","ar":"فاز فريقنا في المباراة بفارق نقطتين.","e":"","alt":[]},{"en":"You should warm up before you run.","he":"כדאי לעשות חימום לפני שרצים.","ru":"Перед бегом нужно сделать разминку.","ar":"يجب أن تقوم بالإحماء قبل أن تركض.","e":"","alt":[]},{"en":"Swimming is better than running for my knees.","he":"שחייה טובה יותר מריצה בשביל הברכיים שלי.","ru":"Для моих коленей плавание лучше, чем бег.","ar":"السباحة أفضل من الركض لركبتيّ.","e":"","alt":[]},{"en":"I'm going to join the school volleyball team.","he":"אני הולך/ת להצטרף לנבחרת הכדורעף של בית הספר.","ru":"Я собираюсь записаться в школьную команду по волейболу.","ar":"سأنضمّ إلى فريق الكرة الطائرة في المدرسة.","e":"","alt":[]},{"en":"Who is your favorite football player?","he":"מי שחקן הכדורגל האהוב עליך?","ru":"Кто твой любимый футболист?","ar":"من هو لاعب كرة القدم المفضّل لديك؟","e":"","alt":[]}],"reading":{"en":"Yael is thirteen and she loves judo. She trains three evenings a week at a club in Netanya. Last month she competed in her first tournament. She lost her first match, but she won the next two. Her coach says that she must practice more, but he is proud of her.","he":"יעל בת שלוש־עשרה והיא אוהבת ג׳ודו. היא מתאמנת שלושה ערבים בשבוע במועדון בנתניה. בחודש שעבר היא התחרתה בטורניר הראשון שלה. היא הפסידה בקרב הראשון, אבל ניצחה בשניים הבאים. המאמן שלה אומר שהיא חייבת להתאמן יותר, אבל הוא גאה בה.","ru":"Яэль тринадцать лет, и она любит дзюдо. Она тренируется три вечера в неделю в клубе в Нетании. В прошлом месяце она участвовала в своём первом турнире. Первую схватку она проиграла, но две следующие выиграла. Тренер говорит, что ей нужно больше тренироваться, но он ею гордится.","ar":"ياعيل في الثالثة عشرة من عمرها وهي تحبّ الجودو. تتدرّب ثلاث أمسيات في الأسبوع في نادٍ في نتانيا. في الشهر الماضي شاركت في أول بطولة لها. خسرت نزالها الأول، لكنها فازت في النزالين التاليين. يقول مدرّبها إن عليها أن تتدرّب أكثر، لكنه فخور بها.","questions":[["Where does Yael train?","in netanya","in eilat","at her school"],["What happened in her first match?","she lost","she won","she got hurt"],["How does her coach feel about her?","proud","angry","worried"]]}},{"en":"social media","he":"רשתות חברתיות","ru":"соцсети","ar":"وسائل التواصل الاجتماعي","e":"📱","items":[{"en":"I post a photo on Instagram almost every day.","he":"אני מעלה תמונה לאינסטגרם כמעט כל יום.","ru":"Я выкладываю фото в Инстаграм почти каждый день.","ar":"أنشر صورة على إنستغرام كل يوم تقريبًا.","e":"","alt":[]},{"en":"Don't share your password with anyone.","he":"אל תשתף את הסיסמה שלך עם אף אחד.","ru":"Никому не говори свой пароль.","ar":"لا تشارك كلمة المرور الخاصة بك مع أي أحد.","e":"","alt":[]},{"en":"How many followers do you have?","he":"כמה עוקבים יש לך?","ru":"Сколько у тебя подписчиков?","ar":"كم متابعًا لديك؟","e":"","alt":[]},{"en":"I spend too much time on my phone.","he":"אני מבלה יותר מדי זמן בטלפון.","ru":"Я провожу слишком много времени в телефоне.","ar":"أقضي وقتًا طويلًا جدًا على هاتفي.","e":"","alt":[]},{"en":"That video is going to go viral!","he":"הסרטון הזה הולך להיות ויראלי!","ru":"Это видео станет вирусным!","ar":"هذا الفيديو سينتشر بسرعة كبيرة!","e":"","alt":[]},{"en":"You shouldn't believe everything you see online.","he":"לא כדאי להאמין לכל מה שרואים ברשת.","ru":"Не стоит верить всему, что видишь в интернете.","ar":"لا يجب أن تصدّق كل ما تراه على الإنترنت.","e":"","alt":[]}],"reading":{"en":"Daniel started a cooking channel on YouTube last year. Every Friday he uploads a short video of a simple recipe. At first only his family watched, but now he has two thousand subscribers. Some people write mean comments, but he doesn't answer them. His parents only let him film on weekends, so school comes first.","he":"דניאל פתח ערוץ בישול ביוטיוב בשנה שעברה. בכל יום שישי הוא מעלה סרטון קצר של מתכון פשוט. בהתחלה רק המשפחה שלו צפתה, אבל עכשיו יש לו אלפיים מנויים. יש אנשים שכותבים תגובות מרושעות, אבל הוא לא עונה להם. ההורים שלו מרשים לו לצלם רק בסופי שבוע, כך שבית הספר בא קודם.","ru":"Даниэль открыл кулинарный канал на YouTube в прошлом году. Каждую пятницу он выкладывает короткое видео с простым рецептом. Сначала его смотрела только семья, а теперь у него две тысячи подписчиков. Некоторые пишут злые комментарии, но он на них не отвечает. Родители разрешают ему снимать только по выходным, так что школа на первом месте.","ar":"أنشأ دانيال قناة طبخ على يوتيوب في السنة الماضية. كل يوم جمعة ينشر فيديو قصيرًا لوصفة بسيطة. في البداية كانت عائلته فقط تشاهد، لكن الآن لديه ألفا مشترك. بعض الناس يكتبون تعليقات لئيمة، لكنه لا يردّ عليهم. يسمح له والداه بالتصوير في عطلة نهاية الأسبوع فقط، لذلك المدرسة أولًا.","questions":[["When does Daniel upload his videos?","every friday","every monday","every day"],["How many subscribers does he have now?","two thousand","two hundred","twenty thousand"],["What does he do about mean comments?","he doesn't answer them","he deletes his channel","he tells his teacher"]]}},{"en":"healthy food","he":"אוכל בריא","ru":"здоровое питание","ar":"الطعام الصحي","e":"🥗","items":[{"en":"I try to eat fruit every morning.","he":"אני משתדל/ת לאכול פרי כל בוקר.","ru":"Я стараюсь есть фрукты каждое утро.","ar":"أحاول أن آكل الفاكهة كل صباح.","e":"","alt":[]},{"en":"You should drink more water when it's hot.","he":"כדאי לשתות יותר מים כשחם.","ru":"Когда жарко, нужно пить больше воды.","ar":"يجب أن تشرب المزيد من الماء عندما يكون الجو حارًا.","e":"","alt":[]},{"en":"I don't eat meat because I'm a vegetarian.","he":"אני לא אוכל/ת בשר כי אני צמחוני/ת.","ru":"Я не ем мясо, потому что я вегетарианец.","ar":"لا آكل اللحم لأنني نباتي.","e":"","alt":[]},{"en":"Fast food is tasty but not very healthy.","he":"אוכל מהיר טעים אבל לא כל כך בריא.","ru":"Фастфуд вкусный, но не очень полезный.","ar":"الوجبات السريعة لذيذة لكنها ليست صحية جدًا.","e":"","alt":[]},{"en":"My mom is cooking shakshuka for dinner tonight.","he":"אמא שלי מבשלת שקשוקה לארוחת הערב הלילה.","ru":"Мама сегодня готовит шакшуку на ужин.","ar":"أمي تطبخ الشكشوكة للعشاء الليلة.","e":"","alt":[]},{"en":"How many hours do you sleep every night?","he":"כמה שעות אתה ישן כל לילה?","ru":"Сколько часов ты спишь каждую ночь?","ar":"كم ساعة تنام كل ليلة؟","e":"","alt":[]}],"reading":{"en":"Tamar often felt tired at school. Her doctor asked her about her habits. Tamar went to bed late and didn't eat breakfast. Now she goes to sleep before ten and eats yogurt with fruit every morning. After two weeks, she feels much better in class.","he":"תמר הרגישה לעיתים קרובות עייפה בבית הספר. הרופאה שלה שאלה אותה על ההרגלים שלה. תמר הלכה לישון מאוחר ולא אכלה ארוחת בוקר. עכשיו היא הולכת לישון לפני עשר ואוכלת יוגורט עם פירות כל בוקר. אחרי שבועיים היא מרגישה הרבה יותר טוב בכיתה.","ru":"Тамар часто чувствовала усталость в школе. Врач спросила её о её привычках. Тамар поздно ложилась спать и не завтракала. Теперь она ложится спать до десяти и каждое утро ест йогурт с фруктами. Через две недели она чувствует себя на уроках гораздо лучше.","ar":"كانت تمار تشعر بالتعب كثيرًا في المدرسة. سألتها طبيبتها عن عاداتها. كانت تمار تنام متأخرة ولا تتناول الفطور. الآن تنام قبل العاشرة وتأكل اللبن مع الفاكهة كل صباح. بعد أسبوعين أصبحت تشعر بتحسّن كبير في الصف.","questions":[["How did Tamar often feel at school?","tired","happy","hungry"],["What does Tamar eat every morning now?","yogurt with fruit","eggs and bread","nothing"],["When does she go to sleep now?","before ten","after midnight","at eleven"]]}},{"en":"meeting someone new","he":"היכרות","ru":"знакомство","ar":"التعارف","e":"👋","dialog":true,"items":[{"q":"Hi! What's your name?","en":"Hi, my name is Noa. Nice to meet you.","he":"היי, קוראים לי נועה. נעים להכיר.","ru":"Привет, меня зовут Ноа. Приятно познакомиться.","ar":"مرحبًا، اسمي نوعا. تشرّفت بمعرفتك."},{"q":"How old are you?","en":"I'm thirteen years old.","he":"אני בן/בת שלוש־עשרה.","ru":"Мне тринадцать лет.","ar":"عمري ثلاث عشرة سنة."},{"q":"Where do you live?","en":"I live in Petah Tikva with my family.","he":"אני גר/ה בפתח תקווה עם המשפחה שלי.","ru":"Я живу в Петах-Тикве со своей семьёй.","ar":"أسكن في بيتح تكفا مع عائلتي."},{"q":"What do you like to do in your free time?","en":"I like playing football and listening to music.","he":"אני אוהב/ת לשחק כדורגל ולהקשיב למוזיקה.","ru":"Я люблю играть в футбол и слушать музыку.","ar":"أحبّ لعب كرة القدم والاستماع إلى الموسيقى."},{"q":"What's your favorite subject at school?","en":"My favorite subject is English because it's fun.","he":"המקצוע האהוב עליי הוא אנגלית כי זה כיף.","ru":"Мой любимый предмет — английский, потому что это интересно.","ar":"مادتي المفضّلة هي الإنجليزية لأنها ممتعة."},{"q":"What are you going to do this weekend?","en":"I'm going to visit my grandparents.","he":"אני הולך/ת לבקר את סבא וסבתא שלי.","ru":"Я собираюсь навестить бабушку и дедушку.","ar":"سأزور جدّي وجدّتي."}]}]},{"id":"m8","group":"middle","he":"כיתה ח׳","sub":"מתקדמים בביטחון","e":"🚀","units":[{"en":"technology","he":"טכנולוגיה","ru":"технологии","ar":"التكنولوجيا","e":"💻","items":[{"en":"I've just downloaded a new app for learning.","he":"הרגע הורדתי אפליקציה חדשה ללמידה.","ru":"Я только что скачал новое приложение для учёбы.","ar":"لقد حمّلت للتو تطبيقًا جديدًا للتعلّم.","e":"","alt":[]},{"en":"My laptop crashed while I was writing my essay.","he":"המחשב הנייד שלי קרס בזמן שכתבתי את החיבור.","ru":"Мой ноутбук завис, пока я писал сочинение.","ar":"تعطّل حاسوبي المحمول بينما كنت أكتب مقالي.","e":"","alt":[]},{"en":"Have you ever tried virtual reality glasses?","he":"ניסית פעם משקפי מציאות מדומה?","ru":"Ты когда-нибудь пробовал очки виртуальной реальности?","ar":"هل جرّبت يومًا نظارات الواقع الافتراضي؟","e":"","alt":[]},{"en":"Robots will do many jobs in the future.","he":"רובוטים יעשו הרבה עבודות בעתיד.","ru":"В будущем роботы будут выполнять много работ.","ar":"ستقوم الروبوتات بالكثير من الوظائف في المستقبل.","e":"","alt":[]},{"en":"If you charge it now, it will work tomorrow.","he":"אם תטעין את זה עכשיו, זה יעבוד מחר.","ru":"Если зарядишь его сейчас, завтра он будет работать.","ar":"إذا شحنته الآن، فسيعمل غدًا.","e":"","alt":[]},{"en":"You must update your phone to stay safe.","he":"אתה חייב לעדכן את הטלפון כדי להישאר מוגן.","ru":"Нужно обновлять телефон, чтобы оставаться в безопасности.","ar":"يجب أن تحدّث هاتفك لتبقى آمنًا.","e":"","alt":[]}],"reading":{"en":"Roni has always loved computers. Last year she joined a robotics club at her school in Rehovot. Her team has built a small robot that can sort plastic and paper. While they were testing it, the robot fell off the table and broke. They fixed it in two days, and next month they will show it at a national competition.","he":"רוני תמיד אהבה מחשבים. בשנה שעברה היא הצטרפה למועדון רובוטיקה בבית הספר שלה ברחובות. הקבוצה שלה בנתה רובוט קטן שיכול למיין פלסטיק ונייר. בזמן שהם בדקו אותו, הרובוט נפל מהשולחן ונשבר. הם תיקנו אותו תוך יומיים, ובחודש הבא הם יציגו אותו בתחרות ארצית.","ru":"Рони всегда любила компьютеры. В прошлом году она записалась в кружок робототехники в своей школе в Реховоте. Её команда построила маленького робота, который умеет сортировать пластик и бумагу. Когда они его испытывали, робот упал со стола и сломался. Они починили его за два дня, а в следующем месяце покажут его на национальном конкурсе.","ar":"لطالما أحبّت روني الحواسيب. في السنة الماضية انضمّت إلى نادي الروبوتات في مدرستها في رحوفوت. بنى فريقها روبوتًا صغيرًا يستطيع فرز البلاستيك والورق. بينما كانوا يختبرونه، سقط الروبوت عن الطاولة وانكسر. أصلحوه خلال يومين، وفي الشهر القادم سيعرضونه في مسابقة وطنية.","questions":[["What can the robot do?","sort plastic and paper","clean the classroom","play football"],["What happened while they were testing it?","it fell and broke","it caught fire","it stopped talking"],["Where will they show the robot?","at a national competition","on television","at a museum"]]}},{"en":"environment","he":"איכות הסביבה","ru":"окружающая среда","ar":"البيئة","e":"🌍","items":[{"en":"We have started recycling bottles at home.","he":"התחלנו למחזר בקבוקים בבית.","ru":"Дома мы начали сдавать бутылки на переработку.","ar":"بدأنا بإعادة تدوير الزجاجات في البيت.","e":"","alt":[]},{"en":"Turn off the lights when you leave the room.","he":"כבה את האור כשאתה יוצא מהחדר.","ru":"Выключай свет, когда выходишь из комнаты.","ar":"أطفئ الأضواء عندما تغادر الغرفة.","e":"","alt":[]},{"en":"If we don't act now, it will be too late.","he":"אם לא נפעל עכשיו, יהיה מאוחר מדי.","ru":"Если мы не начнём действовать сейчас, будет слишком поздно.","ar":"إذا لم نتحرّك الآن، فسيفوت الأوان.","e":"","alt":[]},{"en":"Plastic bags are terrible for sea animals.","he":"שקיות פלסטיק מזיקות מאוד לבעלי חיים בים.","ru":"Пластиковые пакеты ужасно вредны для морских животных.","ar":"الأكياس البلاستيكية مضرّة جدًا بالحيوانات البحرية.","e":"","alt":[]},{"en":"I take the bus because it's better for the planet.","he":"אני נוסע/ת באוטובוס כי זה טוב יותר לכדור הארץ.","ru":"Я езжу на автобусе, потому что это лучше для планеты.","ar":"أركب الحافلة لأن ذلك أفضل لكوكب الأرض.","e":"","alt":[]},{"en":"We have to save water, especially in summer.","he":"אנחנו חייבים לחסוך במים, במיוחד בקיץ.","ru":"Мы должны экономить воду, особенно летом.","ar":"علينا أن نوفّر الماء، خاصة في الصيف.","e":"","alt":[]}],"reading":{"en":"Last Friday, Eitan's class went to clean the beach in Ashdod. When they arrived, the sand was full of bottles and bags. They were working for three hours under the hot sun. In the end they collected forty bags of garbage. Eitan has decided to use a metal bottle from now on, so he won't need plastic ones.","he":"ביום שישי שעבר הכיתה של איתן יצאה לנקות את החוף באשדוד. כשהם הגיעו, החול היה מלא בבקבוקים ושקיות. הם עבדו שלוש שעות תחת השמש החמה. בסוף הם אספו ארבעים שקי זבל. איתן החליט להשתמש מעכשיו בבקבוק מתכת, כדי שלא יצטרך בקבוקי פלסטיק.","ru":"В прошлую пятницу класс Эйтана поехал убирать пляж в Ашдоде. Когда они приехали, песок был полон бутылок и пакетов. Они работали три часа под жарким солнцем. В итоге они собрали сорок мешков мусора. Эйтан решил отныне пользоваться металлической бутылкой, чтобы ему не были нужны пластиковые.","ar":"يوم الجمعة الماضي ذهب صفّ إيتان لتنظيف الشاطئ في أسدود. عندما وصلوا، كان الرمل مليئًا بالزجاجات والأكياس. عملوا لمدة ثلاث ساعات تحت الشمس الحارقة. في النهاية جمعوا أربعين كيسًا من القمامة. قرّر إيتان أن يستخدم زجاجة معدنية من الآن فصاعدًا، حتى لا يحتاج إلى الزجاجات البلاستيكية.","questions":[["Where did the class go last Friday?","to the beach in ashdod","to a park in haifa","to a forest in the north"],["How long did they work?","three hours","one hour","all day"],["What has Eitan decided to do?","use a metal bottle","buy plastic bottles","clean the beach every week"]]}},{"en":"music","he":"מוזיקה","ru":"музыка","ar":"الموسيقى","e":"🎵","items":[{"en":"I've been learning the guitar for two years.","he":"אני לומד/ת גיטרה כבר שנתיים.","ru":"Я учусь играть на гитаре уже два года.","ar":"أتعلّم العزف على الغيتار منذ سنتين.","e":"","alt":[]},{"en":"This song always puts me in a good mood.","he":"השיר הזה תמיד מכניס אותי למצב רוח טוב.","ru":"Эта песня всегда поднимает мне настроение.","ar":"هذه الأغنية تحسّن مزاجي دائمًا.","e":"","alt":[]},{"en":"Have you heard their new album yet?","he":"כבר שמעת את האלבום החדש שלהם?","ru":"Ты уже слышал их новый альбом?","ar":"هل سمعت ألبومهم الجديد بعد؟","e":"","alt":[]},{"en":"I was dancing when the lights suddenly went out.","he":"רקדתי כשהאורות פתאום כבו.","ru":"Я танцевал, когда вдруг погас свет.","ar":"كنت أرقص عندما انطفأت الأضواء فجأة.","e":"","alt":[]},{"en":"If the tickets aren't too expensive, I'll go.","he":"אם הכרטיסים לא יהיו יקרים מדי, אלך.","ru":"Если билеты будут не слишком дорогими, я пойду.","ar":"إذا لم تكن التذاكر غالية جدًا، فسأذهب.","e":"","alt":[]},{"en":"In my opinion, the lyrics are better than the music.","he":"לדעתי, המילים טובות יותר מהלחן.","ru":"По-моему, слова лучше, чем музыка.","ar":"في رأيي، الكلمات أفضل من اللحن.","e":"","alt":[]}],"reading":{"en":"Shira has played the piano since she was six. This year she has started writing her own songs in Hebrew and English. Last month she was performing at a school event when her microphone stopped working. She didn't stop, and she sang even louder. Everyone clapped, and now her friends want her to start a band.","he":"שירה מנגנת בפסנתר מאז שהייתה בת שש. השנה היא התחילה לכתוב שירים משלה בעברית ובאנגלית. בחודש שעבר היא הופיעה באירוע בית ספרי כשהמיקרופון שלה הפסיק לעבוד. היא לא עצרה, ושרה אפילו חזק יותר. כולם מחאו כפיים, ועכשיו החברים שלה רוצים שהיא תקים להקה.","ru":"Шира играет на фортепиано с шести лет. В этом году она начала писать собственные песни на иврите и английском. В прошлом месяце она выступала на школьном мероприятии, когда её микрофон перестал работать. Она не остановилась и запела ещё громче. Все аплодировали, и теперь друзья хотят, чтобы она создала группу.","ar":"تعزف شيرا على البيانو منذ أن كانت في السادسة. هذه السنة بدأت تكتب أغانيها الخاصة بالعبرية والإنجليزية. في الشهر الماضي كانت تغنّي في حفل مدرسي عندما توقّف الميكروفون عن العمل. لم تتوقّف، بل غنّت بصوت أعلى. صفّق الجميع، والآن يريد أصدقاؤها أن تؤسّس فرقة.","questions":[["How old was Shira when she started playing the piano?","six","ten","three"],["What happened during her performance?","her microphone stopped working","she forgot the words","the piano broke"],["What do her friends want her to do?","start a band","stop singing","learn the guitar"]]}},{"en":"travel","he":"טיולים","ru":"путешествия","ar":"السفر","e":"✈️","items":[{"en":"Have you ever been abroad?","he":"היית פעם בחו״ל?","ru":"Ты когда-нибудь был за границей?","ar":"هل سافرت إلى الخارج من قبل؟","e":"","alt":[]},{"en":"We're flying to Greece next summer.","he":"אנחנו טסים ליוון בקיץ הבא.","ru":"Следующим летом мы летим в Грецию.","ar":"سنسافر بالطائرة إلى اليونان في الصيف القادم.","e":"","alt":[]},{"en":"Don't forget to pack your passport!","he":"אל תשכח לארוז את הדרכון!","ru":"Не забудь взять паспорт!","ar":"لا تنسَ أن تحزم جواز سفرك!","e":"","alt":[]},{"en":"We were waiting at the airport for five hours.","he":"חיכינו בשדה התעופה חמש שעות.","ru":"Мы ждали в аэропорту пять часов.","ar":"كنّا ننتظر في المطار خمس ساعات.","e":"","alt":[]},{"en":"If it rains, we'll visit a museum instead.","he":"אם ירד גשם, נבקר במוזיאון במקום.","ru":"Если пойдёт дождь, мы вместо этого сходим в музей.","ar":"إذا أمطرت، فسنزور متحفًا بدلًا من ذلك.","e":"","alt":[]},{"en":"Excuse me, how do I get to the train station?","he":"סליחה, איך מגיעים לתחנת הרכבת?","ru":"Извините, как пройти к вокзалу?","ar":"عفوًا، كيف أصل إلى محطة القطار؟","e":"","alt":[]}],"reading":{"en":"Last summer Lior and his family traveled to London for a week. On the first day they were walking near the river when it started to rain. They ran into a small cafe and tried English tea for the first time. Lior has never seen so many red buses in his life. Next year they will visit Scotland if they can find cheap flights.","he":"בקיץ שעבר ליאור והמשפחה שלו נסעו ללונדון לשבוע. ביום הראשון הם טיילו ליד הנהר כשהתחיל לרדת גשם. הם רצו לבית קפה קטן וטעמו תה אנגלי בפעם הראשונה. ליאור מעולם לא ראה כל כך הרבה אוטובוסים אדומים בחייו. בשנה הבאה הם יבקרו בסקוטלנד אם ימצאו טיסות זולות.","ru":"Прошлым летом Лиор с семьёй поехал в Лондон на неделю. В первый день они гуляли у реки, когда пошёл дождь. Они забежали в маленькое кафе и впервые попробовали английский чай. Лиор никогда в жизни не видел столько красных автобусов. В следующем году они поедут в Шотландию, если найдут дешёвые билеты.","ar":"في الصيف الماضي سافر ليئور وعائلته إلى لندن لمدة أسبوع. في اليوم الأول كانوا يتمشّون قرب النهر عندما بدأ المطر يهطل. ركضوا إلى مقهى صغير وجرّبوا الشاي الإنجليزي لأول مرة. لم يرَ ليئور في حياته هذا العدد الكبير من الحافلات الحمراء. في السنة القادمة سيزورون اسكتلندا إذا وجدوا رحلات رخيصة.","questions":[["How long was the trip to London?","a week","a month","two days"],["What were they doing when it started to rain?","walking near the river","eating lunch","riding a bus"],["What do they need to visit Scotland?","cheap flights","a new car","new passports"]]}},{"en":"health","he":"בריאות","ru":"здоровье","ar":"الصحة","e":"💪","items":[{"en":"I've had a headache since this morning.","he":"יש לי כאב ראש מהבוקר.","ru":"У меня с утра болит голова.","ar":"أعاني من صداع منذ الصباح.","e":"","alt":[]},{"en":"You should see a doctor if it gets worse.","he":"כדאי ללכת לרופא אם זה מחמיר.","ru":"Если станет хуже, тебе стоит сходить к врачу.","ar":"يجب أن تزور الطبيب إذا ساءت حالتك.","e":"","alt":[]},{"en":"I hurt my ankle while I was playing tennis.","he":"נפגעתי בקרסול בזמן ששיחקתי טניס.","ru":"Я повредил лодыжку, когда играл в теннис.","ar":"أصبت كاحلي بينما كنت ألعب التنس.","e":"","alt":[]},{"en":"Getting enough sleep is important for your brain.","he":"שינה מספקת חשובה למוח שלך.","ru":"Достаточный сон важен для мозга.","ar":"النوم الكافي مهمّ لدماغك.","e":"","alt":[]},{"en":"If you exercise every day, you'll feel stronger.","he":"אם תתאמן כל יום, תרגיש חזק יותר.","ru":"Если будешь заниматься спортом каждый день, почувствуешь себя сильнее.","ar":"إذا تمرّنت كل يوم، فستشعر بأنك أقوى.","e":"","alt":[]},{"en":"I have to take this medicine twice a day.","he":"אני צריך/ה לקחת את התרופה הזאת פעמיים ביום.","ru":"Мне нужно принимать это лекарство два раза в день.","ar":"عليّ أن أتناول هذا الدواء مرتين في اليوم.","e":"","alt":[]}],"reading":{"en":"Ariel was running in a race in Tel Aviv when he suddenly felt dizzy. A volunteer gave him water and helped him sit in the shade. He didn't drink enough water before the race. The doctor said that he must drink more and eat a good breakfast before running. Since then, Ariel has run two more races without any problems.","he":"אריאל רץ במרוץ בתל אביב כשפתאום הרגיש סחרחורת. מתנדב נתן לו מים ועזר לו לשבת בצל. הוא לא שתה מספיק מים לפני המרוץ. הרופא אמר שהוא חייב לשתות יותר ולאכול ארוחת בוקר טובה לפני ריצה. מאז, אריאל רץ בעוד שני מרוצים בלי שום בעיה.","ru":"Ариэль бежал в забеге в Тель-Авиве, когда у него вдруг закружилась голова. Волонтёр дал ему воды и помог сесть в тени. Перед забегом он выпил недостаточно воды. Врач сказал, что ему нужно больше пить и хорошо завтракать перед бегом. С тех пор Ариэль пробежал ещё два забега без всяких проблем.","ar":"كان أرئيل يركض في سباق في تل أبيب عندما شعر فجأة بالدوار. أعطاه متطوّع ماءً وساعده على الجلوس في الظل. لم يشرب ما يكفي من الماء قبل السباق. قال الطبيب إن عليه أن يشرب أكثر وأن يتناول فطورًا جيدًا قبل الركض. منذ ذلك الحين، ركض أرئيل في سباقين آخرين دون أي مشاكل.","questions":[["How did Ariel feel during the race?","dizzy","hungry","sleepy"],["Who helped him?","a volunteer","his mother","a police officer"],["How many races has he run since then?","two","five","none"]]}},{"en":"making plans","he":"מתכננים יחד","ru":"строим планы","ar":"وضع الخطط","e":"📅","dialog":true,"items":[{"q":"Are you free this Saturday?","en":"Yes, I'm free in the afternoon.","he":"כן, אני פנוי/ה אחר הצהריים.","ru":"Да, я свободен после обеда.","ar":"نعم، أنا متفرّغ بعد الظهر."},{"q":"What would you like to do?","en":"Let's go to the beach if the weather is nice.","he":"בוא נלך לים אם מזג האוויר יהיה נעים.","ru":"Давай пойдём на пляж, если будет хорошая погода.","ar":"لنذهب إلى الشاطئ إذا كان الطقس جميلًا."},{"q":"Have you ever been to the new mall?","en":"No, I haven't, but I really want to go.","he":"לא, לא הייתי, אבל אני ממש רוצה ללכת.","ru":"Нет, не был, но очень хочу сходить.","ar":"لا، لم أذهب، لكنني أريد الذهاب حقًا."},{"q":"How will we get there?","en":"We can take the bus from the center.","he":"אנחנו יכולים לנסוע באוטובוס מהמרכז.","ru":"Мы можем поехать на автобусе из центра.","ar":"يمكننا أن نركب الحافلة من المركز."},{"q":"What time should we meet?","en":"Let's meet at four next to the station.","he":"בוא ניפגש בארבע ליד התחנה.","ru":"Давай встретимся в четыре у остановки.","ar":"لنلتقِ في الساعة الرابعة بجانب المحطة."},{"q":"What will we do if it rains?","en":"If it rains, we'll watch a movie at my place.","he":"אם ירד גשם, נראה סרט אצלי.","ru":"Если пойдёт дождь, посмотрим фильм у меня.","ar":"إذا أمطرت، فسنشاهد فيلمًا في بيتي."}]}]},{"id":"m9","group":"middle","he":"כיתה ט׳","sub":"לקראת התיכון","e":"🎓","units":[{"en":"volunteering","he":"התנדבות","ru":"волонтёрство","ar":"التطوّع","e":"🤲","items":[{"en":"I volunteer at an animal shelter every Tuesday.","he":"אני מתנדב/ת במקלט לבעלי חיים בכל יום שלישי.","ru":"Каждый вторник я работаю волонтёром в приюте для животных.","ar":"أتطوّع في ملجأ للحيوانات كل يوم ثلاثاء.","e":"","alt":[]},{"en":"Helping others makes me feel useful.","he":"לעזור לאחרים גורם לי להרגיש מועיל/ה.","ru":"Когда я помогаю другим, я чувствую себя полезным.","ar":"مساعدة الآخرين تجعلني أشعر بأنني مفيد.","e":"","alt":[]},{"en":"If I had more time, I would volunteer more often.","he":"אם היה לי יותר זמן, הייתי מתנדב/ת לעיתים קרובות יותר.","ru":"Если бы у меня было больше времени, я бы чаще работал волонтёром.","ar":"لو كان لديّ وقت أكثر، لتطوّعت أكثر.","e":"","alt":[]},{"en":"The food was donated by local families.","he":"האוכל נתרם על ידי משפחות מהאזור.","ru":"Еду пожертвовали местные семьи.","ar":"تمّ التبرّع بالطعام من قِبل عائلات محلية.","e":"","alt":[]},{"en":"Although it's hard work, I really enjoy it.","he":"למרות שזו עבודה קשה, אני ממש נהנה/ית ממנה.","ru":"Хотя это тяжёлая работа, мне она очень нравится.","ar":"رغم أنه عمل شاق، فإنني أستمتع به كثيرًا.","e":"","alt":[]},{"en":"Everyone can make a difference in their community.","he":"כל אחד יכול לחולל שינוי בקהילה שלו.","ru":"Каждый может что-то изменить в своём сообществе.","ar":"يستطيع كل شخص أن يُحدث فرقًا في مجتمعه.","e":"","alt":[]}],"reading":{"en":"Many Israeli teenagers volunteer in their community after school. Gal, a ninth grader, chose to help elderly people at a center in Kfar Saba. At first she was nervous because she didn't know what to talk about. However, after a few weeks she became close to a woman named Rivka. Rivka was born in Morocco and came to Israel as a young girl. She told Gal many stories about her childhood. Gal says that this experience has changed the way she sees older people.","he":"בני נוער רבים בישראל מתנדבים בקהילה שלהם אחרי הלימודים. גל, תלמידת כיתה ט׳, בחרה לעזור לקשישים במרכז בכפר סבא. בהתחלה היא הייתה לחוצה כי לא ידעה על מה לדבר. אולם אחרי כמה שבועות היא התקרבה לאישה בשם רבקה. רבקה נולדה במרוקו ועלתה לישראל כילדה צעירה. היא סיפרה לגל סיפורים רבים על ילדותה. גל אומרת שהחוויה הזאת שינתה את הדרך שבה היא רואה אנשים מבוגרים.","ru":"Многие израильские подростки после школы занимаются волонтёрством. Гал, ученица девятого класса, решила помогать пожилым людям в центре в Кфар-Сабе. Сначала она волновалась, потому что не знала, о чём говорить. Однако через несколько недель она сблизилась с женщиной по имени Ривка. Ривка родилась в Марокко и приехала в Израиль маленькой девочкой. Она рассказала Гал много историй о своём детстве. Гал говорит, что этот опыт
