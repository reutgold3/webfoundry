<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E4F5EC"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Yalla Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a workbook page; a coach bubble on top, the exercise card below, a fraction keypad at the bottom. Single bright theme by choice. */
:root{
  --bg:#E4F5EC;      /* page ground, mint */
  --paper:#FFFFFF;
  --ink:#1F2D3D;
  --soft:#5B6B7A;
  --accent:#FF8A3D;  /* orange: main buttons, shaded parts */
  --accent-deep:#E06A1C;
  --teal:#159A8C;    /* fraction lines, links */
  --good:#2FB57C;
  --bad:#E8506A;
  --line:#BFE3D2;
  --display:"Fredoka","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:30px}h2{font-size:24px;font-weight:600}h3{font-size:19px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:20px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--teal);text-decoration:underline;text-underline-offset:3px;font-weight:500;padding:8px}
.top{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.x{width:44px;height:44px;border-radius:50%;background:var(--paper);border:2px solid var(--line);font-size:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:999px;background:var(--paper);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s}
.label{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--soft)}
.card{background:var(--paper);border-radius:24px;padding:20px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:14px}
/* coach */
.talk{display:flex;align-items:flex-end;gap:12px}
.avatar{flex:none;width:76px;height:76px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:46px;border:3px solid var(--accent);box-shadow:0 4px 0 var(--line)}
.bubble{flex:1;min-width:0;background:var(--paper);border-radius:20px 20px 6px 20px;padding:12px 16px;box-shadow:0 4px 0 var(--line);font-weight:500}
/* math */
.math{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;gap:.35em;font-family:var(--display);font-weight:600;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-variant-numeric:tabular-nums}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .15em}
.fr>span:last-child{padding:0 .15em}
.q{font-size:22px;font-weight:500;line-height:1.6}
.q .math{font-size:1.25em}
.big{font-size:34px}
.vis{display:flex;justify-content:center}
.vis svg{max-width:100%;height:auto}
/* answer input */
.ans{display:flex;justify-content:center;align-items:center;gap:14px;direction:ltr}
.ans .stack{display:flex;flex-direction:column;align-items:center;gap:6px}
.ans .stack .ln{width:84px;height:4px;border-radius:2px;background:var(--ink)}
.box{width:84px;height:62px;border-radius:14px;border:3px solid var(--line);background:#F6FBF8;font-family:var(--display);font-weight:600;font-size:30px;text-align:center;color:var(--ink)}
.box.sel{border-color:var(--teal);background:#fff}
.box.whole{height:72px}
.box.wide{width:170px}
.ans.good .box{border-color:var(--good);background:#E8F8F0}
.ans.bad .box{border-color:var(--bad);background:#FDECEF;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr}
.pad button{min-height:52px;border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:600;font-size:24px}
.pad button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.pad .fn{font-size:16px;font-family:var(--body);font-weight:700;color:var(--teal)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:66px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line);border:3px solid transparent;font-size:22px;padding:8px}
.opt.good{border-color:var(--good);background:#E8F8F0}
.opt.bad{border-color:var(--bad);background:#FDECEF;animation:shake .3s}
.fb{min-height:24px;font-weight:600}
.fb.good{color:#1B8A5A}.fb.bad{color:#C23552}
.steps{background:#FFF6EC;border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;border:2px dashed #F6C79F}
.steps .math{font-size:1.1em}
/* home */
.topics{display:flex;flex-direction:column;gap:12px}
.topic{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--line);text-align:right;width:100%}
.topic .e{flex:none;width:52px;height:52px;border-radius:16px;background:#FFF1E6;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent-deep)}
.topic b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.topic small{color:var(--soft);font-size:14px}
.meter{height:8px;border-radius:999px;background:#EEF6F1;overflow:hidden;margin-top:6px}
.meter>i{display:block;height:100%;background:var(--good)}
.hero{background:#FFF1E6}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.char{background:var(--paper);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent;box-shadow:0 4px 0 var(--line)}
.char .e{font-size:34px}.char .n{font-size:13px;font-weight:600}
.char[aria-pressed=true]{border-color:var(--accent);background:#FFF1E6}
.field input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
/* lesson */
.lesson p{font-size:18px}
.ex{background:#F2FAF6;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.ex .big{font-size:clamp(20px,6.5vw,30px)}
.ex .math,.steps .math,.q .math{flex-wrap:wrap;justify-content:center;white-space:normal;row-gap:8px;max-width:100%}
.card,.ex,.steps{min-width:0;max-width:100%}
.score{font-family:var(--display);font-size:64px;font-weight:700;color:var(--good);text-align:center;line-height:1}
.score.low{color:var(--bad)}
.center{text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.review{display:flex;flex-direction:column;gap:10px}
.review .item{background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" dir="rtl"></div>

<script>
/* ============ math helpers ============ */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const R=(n,d=1)=>{const g=gcd(n,d);return {n:n/g*(d<0?-1:1),d:Math.abs(d)/g}};
const mul=(a,b)=>R(a.n*b.n,a.d*b.d);
const eq=(a,b)=>a.n*b.d===b.n*a.d;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* render */
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const M=(...parts)=>`<span class="math">${parts.join(" ").replace(/([\u0590-\u05FF][\u0590-\u05FF״׳\-]*)/g,"<bdi>$1</bdi>")}</span>`;
function show(r,mixed=true){ // rational -> html
  if(r.d===1)return M(r.n);
  if(mixed&&r.n>r.d){const w=Math.floor(r.n/r.d),k=r.n%r.d;return M(w,F(k,r.d))}
  return M(F(r.n,r.d));
}
const fmt=x=>String(Math.round(x*1e6)/1e6);
function chartSVG(cats,vals,step){
  const W=300,H=200,L=34,B=34,T=10,mx=Math.max(...vals,step)+step,top=Math.ceil(mx/step)*step,cw=(W-L-10)/cats.length;
  const y=v=>T+(H-T-B)*(1-v/top);let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="דיאגרמת עמודות" direction="ltr">`;
  for(let v=0;v<=top;v+=step){s+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#BFE3D2" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5B6B7A">${v}</text>`}
  cats.forEach((c,i)=>{const x=L+i*cw+cw*.18,w=cw*.64;s+=`<rect x="${x}" y="${y(vals[i])}" width="${w}" height="${y(0)-y(vals[i])}" rx="4" fill="#FF8A3D"/><text x="${x+w/2}" y="${H-12}" font-size="13" text-anchor="middle" fill="#1F2D3D">${c}</text>`});
  return s+`<line x1="${L}" x2="${L}" y1="${T}" y2="${y(0)}" stroke="#1F2D3D" stroke-width="1.5"/><line x1="${L}" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" stroke="#1F2D3D" stroke-width="1.5"/></svg>`;
}
const UNITS=[["מ׳","ס״מ",100],["ס״מ","מ״מ",10],["ק״מ","מ׳",1000],["ק״ג","גרם",1000],["ליטר","מ״ל",1000]];
function orderQ(){
  for(let tries=0;tries<200;tries++){
    const a=rnd(2,20),b=rnd(2,12),c=rnd(2,9),d=rnd(2,6);const f=rnd(0,5);let ex,val,steps;
    if(f===0){ex=`${a} + ${b} × ${c}`;val=a+b*c;steps=`${a} + ${b*c} = ${val}`}
    else if(f===1){ex=`(${a} + ${b}) × ${c}`;val=(a+b)*c;steps=`${a+b} × ${c} = ${val}`}
    else if(f===2){const x=b*c;ex=`${a+x} − ${x} : ${c}`;val=a+x-b;steps=`${a+x} − ${b} = ${val}`}
    else if(f===3){const x=c*d;ex=`${x} : ${d} + ${a} × ${2}`;val=c+a*2;steps=`${c} + ${a*2} = ${val}`}
    else if(f===4){if(b<=c)continue;ex=`${a} × (${b} − ${c})`;val=a*(b-c);steps=`${a} × ${b-c} = ${val}`}
    else{const x=b*d;ex=`${a*2+x} − ${x} : ${d} × 2`;val=a*2+x-b*2;steps=`${a*2+x} − ${b} × 2 = ${a*2+x} − ${b*2} = ${val}`}
    if(val<0)continue;
    return {prompt:`${M(ex+" = ?")}`,type:"num",ans:R(val),hint:[`יש סוגריים? פותרים אותם קודם.`,`אחר כך כפל וחילוק, ובסוף חיבור וחיסור.`],sol:M(`${ex} = ${steps}`)};
  }
}
const SV=(w,h,inner,label)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${label}" font-family="Rubik,system-ui,sans-serif">${inner}</svg>`;
const T=(x,y,t,o="")=>`<text x="${x}" y="${y}" font-size="15" font-weight="600" text-anchor="middle" fill="#1F2D3D" ${o}>${t}</text>`;
function triSVG(a,b,c){return SV(260,170,`<polygon points="30,150 230,150 ${a===90?30:110},30" fill="#FFF1E6" stroke="#1F2D3D" stroke-width="2.5"/>${a===90?`<rect x="30" y="134" width="16" height="16" fill="none" stroke="#1F2D3D" stroke-width="1.5"/>`:""}${T(a===90?58:58,140,a===90?"":a+"°")}${T(196,140,b+"°")}${T(a===90?48:110,a===90?62:60,c==="?"?"?":c+"°",'fill="#E06A1C"')}`,"משולש")}
function lineSVG(a){const r=a*Math.PI/180,x=130+90*Math.cos(Math.PI-r),y=110-90*Math.sin(Math.PI-r);return SV(260,130,`<line x1="20" y1="110" x2="240" y2="110" stroke="#1F2D3D" stroke-width="2.5"/><line x1="130" y1="110" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#1F2D3D" stroke-width="2.5"/>${T(80,100,a+"°")}${T(180,100,"?",'fill="#E06A1C"')}`,"זוויות על קו ישר")}
function shapeSVG(k,b,h,c){const W=260,H=150;let pts,lab="";
  if(k==="par"){pts="70,30 230,30 190,120 30,120";lab=T(110,140,b)+`<line x1="70" y1="30" x2="70" y2="120" stroke="#159A8C" stroke-dasharray="5 4" stroke-width="2"/>`+T(88,82,h,'fill="#159A8C"')}
  else if(k==="tri"){pts="30,120 230,120 100,30";lab=T(130,140,b)+`<line x1="100" y1="30" x2="100" y2="120" stroke="#159A8C" stroke-dasharray="5 4" stroke-width="2"/>`+T(116,82,h,'fill="#159A8C"')}
  else{pts="30,120 230,120 175,30 85,30";lab=T(130,140,b)+T(130,22,c)+`<line x1="85" y1="30" x2="85" y2="120" stroke="#159A8C" stroke-dasharray="5 4" stroke-width="2"/>`+T(101,82,h,'fill="#159A8C"')}
  return SV(W,H+4,`<polygon points="${pts}" fill="#FFF1E6" stroke="#1F2D3D" stroke-width="2.5"/>${lab}`,"צורה")}
function circleSVG(r){return SV(180,180,`<circle cx="90" cy="90" r="75" fill="#FFF1E6" stroke="#1F2D3D" stroke-width="2.5"/><circle cx="90" cy="90" r="3.5" fill="#1F2D3D"/><line x1="90" y1="90" x2="165" y2="90" stroke="#E06A1C" stroke-width="2.5"/>${T(128,82,"r = "+r,'fill="#E06A1C"')}`,"מעגל")}
function boxSVG(a,b,c){return SV(240,170,`<polygon points="40,60 160,60 200,30 80,30" fill="#FFE1CC" stroke="#1F2D3D" stroke-width="2"/><polygon points="160,60 200,30 200,120 160,150" fill="#FFD0AD" stroke="#1F2D3D" stroke-width="2"/><rect x="40" y="60" width="120" height="90" fill="#FFF1E6" stroke="#1F2D3D" stroke-width="2"/>${T(100,166,a)}${T(214,78,b)}${T(26,110,c)}`,"תיבה")}
const txt=(r,mixed=true)=>r.d===1?String(r.n):(mixed&&r.n>r.d?`${Math.floor(r.n/r.d)} ${r.n%r.d}/${r.d}`:`${r.n}/${r.d}`);

/* fraction pictures */
function barSVG(n,d,w=300){
  const h=56,cw=w/d;let s=`<svg viewBox="0 0 ${w+4} ${h+4}" width="${w+4}" role="img" aria-label="מלבן מחולק ל-${d} חלקים, ${n} צבועים">`;
  for(let i=0;i<d;i++)s+=`<rect x="${2+i*cw}" y="2" width="${cw}" height="${h}" fill="${i<n?'#FF8A3D':'#FFFFFF'}" stroke="#1F2D3D" stroke-width="2.5"/>`;
  return s+"</svg>";
}
function pieSVG(n,d,r=70){
  const c=r+4;let s=`<svg viewBox="0 0 ${2*c} ${2*c}" width="${2*c}" role="img" aria-label="עיגול מחולק ל-${d} חלקים, ${n} צבועים">`;
  if(d===1)return s+`<circle cx="${c}" cy="${c}" r="${r}" fill="${n?'#FF8A3D':'#fff'}" stroke="#1F2D3D" stroke-width="2.5"/></svg>`;
  for(let i=0;i<d;i++){const a0=-Math.PI/2+i*2*Math.PI/d,a1=a0+2*Math.PI/d;
    const x0=c+r*Math.cos(a0),y0=c+r*Math.sin(a0),x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1);
    s+=`<path d="M${c},${c} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${i<n?'#FF8A3D':'#FFFFFF'}" stroke="#1F2D3D" stroke-width="2.5"/>`}
  return s+"</svg>";
}
function piesSVG(count,d,shade){ // several pies, total shaded parts
  let out="",left=shade;for(let k=0;k<count;k++){const s=Math.min(d,Math.max(0,left));out+=pieSVG(s,d,44);left-=d}
  return `<div class="row">${out}</div>`;
}
function dotsSVG(total,cols,mark){
  const rows=Math.ceil(total/cols),sz=30;let s=`<svg viewBox="0 0 ${cols*sz+4} ${rows*sz+4}" width="${cols*sz+4}" role="img" aria-label="${total} עיגולים">`;
  for(let i=0;i<total;i++){const x=2+(i%cols)*sz+sz/2,y=2+Math.floor(i/cols)*sz+sz/2;s+=`<circle cx="${x}" cy="${y}" r="11" fill="${i<mark?'#FF8A3D':'#fff'}" stroke="#1F2D3D" stroke-width="2"/>`}
  return s+"</svg>";
}

/* ============ topics & generators ============ */
const NAMES=["נועה","דני","מאיה","עומר","ליה","יונתן","תמר","איתי"];
const TOPICS=[
 {id:"meaning",title:"משמעויות של השבר הפשוט",short:"חלק מהשלם וחלק מכמות",icon:"¾",
  lesson:[
   {h:"שבר הוא חלק מהשלם",p:"המכנה (למטה) אומר לכמה חלקים שווים חילקנו את השלם. המונה (למעלה) אומר כמה חלקים לקחנו.",ex:()=>`${barSVG(3,4,240)}<div class="big">${M(F(3,4))}</div><p>חילקנו ל-4 חלקים שווים וצבענו 3.</p>`},
   {h:"שבר הוא חלק מכמות",p:"כדי למצוא חלק מכמות: מחלקים את הכמות במכנה, ואז כופלים במונה.",ex:()=>`${dotsSVG(12,6,9)}<p>${M(F(3,4))} מתוך 12</p><p>${M("12 : 4 = 3")} ואז ${M("3 × 3 = 9")}</p>`},
   {h:"מוצאים את השלם לפי החלק",p:"אם יודעים כמה שווה חלק, מחלקים במונה כדי למצוא חלק אחד, ואז כופלים במכנה.",ex:()=>`<p>${M(F(2,5))} מהכמות הם 8. מהי הכמות?</p><p>${M("8 : 2 = 4")} (זה ${M(F(1,5))}), ואז ${M("4 × 5 = 20")}</p>`},
  ],
  gen:[
   ()=>{const d=pick([2,3,4,5,6,8]),n=rnd(1,d-1),pie=Math.random()<.5;
     return {prompt:"איזה חלק מהצורה צבוע?",vis:pie?pieSVG(n,d):barSVG(n,d),type:"frac",ans:R(n,d),
       hint:[`ספרו לכמה חלקים שווים הצורה מחולקת: זה המכנה.`,`ספרו כמה חלקים צבועים: זה המונה.`],sol:`${n} חלקים צבועים מתוך ${d}: ${M(F(n,d))}`}},
   ()=>{const d=pick([2,3,4,5,6,8,10]),n=rnd(1,d-1),k=rnd(2,9),T=d*k;
     return {prompt:`כמה הם ${M(F(n,d))} מתוך ${T}?`,type:"num",ans:R(n*k),

 {id:"data",title:"חקר נתונים וממוצע",short:"ממוצע וקריאת דיאגרמה",icon:"📊",

   {h:"מהמפה למציאות",p:"כופלים את המרחק במפה במספר של קנה המידה, ואז ממירים למטרים או לקילומטרים.",ex:()=>`<p>קנה מידה 1:500, במפה 6 ס״מ</p><div class="big">${M("6 × 500 = 3000 ס״מ = 30 מ׳")}</div>`},

   ()=>{const S=pick([50000,100000,200000,25000]),m=rnd(2,10);const km=m*S/100000;
     return {prompt:`במפה בקנה מידה ${M(`1 : ${S}`)} המרחק בין שתי ערים הוא ${M(`${m} ס״מ`)}. מה המרחק האמיתי בקילומטרים?`,type:"dec",ans:km,hint:[`${M(`${m} × ${S}`)} סנטימטרים במציאות.`,`ב-1 ק״מ יש 100,000 ס״מ.`],sol:M(`${m} × ${S} = ${m*S} ס״מ = ${fmt(km)} ק״מ`)}},
   ()=>{const S=pick([100,200,500,1000]),map=rnd(2,12),real=map*S/100;
     return {prompt:`קנה המידה ${M(`1 : ${S}`)}. אורך החדר במציאות ${M(`${fmt(real)} מ׳`)}. מה האורך בתוכנית בסנטימטרים?`,type:"dec",ans:map,hint:[`ממירים לסנטימטרים: ${M(`${fmt(real)} × 100 = ${fmt(real*100)}`)}`,`מחלקים ב-${S}.`],sol:M(`${fmt(real*100)} : ${S} = ${map} ס״מ`)}},
   ()=>{const S=pick([100,200,500,1000,2000]),map=rnd(2,9),real=map*S/100;

  ]},

 {id:"words",title:"בעיות מילוליות",short:"כמה שלבים, כסף ומידות",icon:"?",

   {h:"שימו לב לשארית",p:"כשמחלקים אנשים לרכבים או לקבוצות, אם נשארת שארית צריך עוד אחד.",ex:()=>`<p>130 תלמידים, 40 מקומות באוטובוס</p><p>${M("130 : 40 = 3")} ושארית 10, ולכן צריך 4 אוטובוסים</p>`},
  ],
  gen:[
   ()=>{const k=rnd(2,5),pr=rnd(15,65)/10,pay=pick([20,50,100].filter(x=>x>k*pr));const tot=Math.round(k*pr*10)/10;
     return {prompt:`${pick(NAMES)} קנה/תה ${k} מחברות ב-${M(fmt(pr))} ₪ כל אחת ושילם/ה ב-${pay} ₪. כמה עודף קיבל/ה?`,type:"dec",ans:Math.round((pay-tot)*10)/10,hint:[`כמה עלו המחברות? ${M(`${k} × ${fmt(pr)}`)}`,`מחסירים מ-${pay}.`],sol:`${M(`${k} × ${fmt(pr)} = ${fmt(tot)}`)}, ${M(`${pay} − ${fmt(tot)} = ${fmt(pay-tot)}`)} ₪`}},
   ()=>{const cap=pick([30,40,45,50]),n=cap*rnd(2,5)+rnd(1,cap-1);
     return {prompt:`לטיול יוצאים ${n} תלמידים. בכל אוטובוס יש ${cap} מקומות. כמה אוטובוסים צריך להזמין?`,type:"num",ans:R(Math.ceil(n/cap)),hint:[`${M(`${n} : ${cap}`)}`,`אם יש שארית, צריך עוד אוטובוס.`],sol:`${M(`${n} : ${cap} = ${Math.floor(n/cap)}`)} ושארית ${n%cap}, ולכן ${Math.ceil(n/cap)} אוטובוסים`}},
   ()=>{const kg=rnd(2,6),per=rnd(35,99)/10,tot=Math.round(kg*per*10)/10;
     return {prompt:`${kg} ק״ג עגבניות עולים ${M(fmt(tot))} ₪. כמה עולה קילוגרם אחד?`,type:"dec",ans:Math.round(per*10)/10,hint:[`מחלקים את המחיר במספר הקילוגרמים: ${M(`${fmt(tot)} : ${kg}`)}`],sol:M(`${fmt(tot)} : ${kg} = ${fmt(per)}`)+` ₪`}},
   ()=>{const a=rnd(12,60),t=rnd(2,4);
     return {prompt:`ל${pick(NAMES)} יש ${a} ₪. לאחיו יש פי ${t} יותר. כמה כסף יש לשניהם יחד?`,type:"num",ans:R(a+a*t),hint:[`לאח: ${M(`${a} × ${t}`)}`,`מחברים את שני הסכומים.`],sol:`${M(`${a} × ${t} = ${a*t}`)}, ${M(`${a} + ${a*t} = ${a+a*t}`)} ₪`}},
   ()=>{const L=rnd(2,6),cut=pick([25,40,50,20]);const n=Math.floor(L*100/cut);
     return {prompt:`יש חבל באורך ${M(`${L} מ׳`)}. חותכים ממנו חתיכות של ${M(`${cut} ס״מ`)}. כמה חתיכות שלמות אפשר לחתוך?`,type:"num",ans:R(n),hint:[`ממירים את החבל לסנטימטרים: ${M(`${L} × 100 = ${L*100}`)}`,`מחלקים ב-${cut}.`],sol:M(`${L*100} : ${cut} = ${n}`)+` חתיכות`}},
  ]},

 {id:"angles",title:"זוויות במשולש ובמרובע",short:"סכום הזוויות וזווית חסרה",icon:"∠",

   ()=>{const a=rnd(2,10),b=rnd(2,8),c=rnd(2,8);return {prompt:`נפח תיבה הוא ${M(`${a*b*c} סמ״ק`)}. האורך ${M(`${a} ס״מ`)} והרוחב ${M(`${b} ס״מ`)}. מה הגובה?`,type:"num",unit:"ס״מ",ans:R(c),hint:[`שטח הבסיס: ${M(`${a} × ${b} = ${a*b}`)}`,`מחלקים את הנפח בשטח הבסיס.`],sol:M(`${a*b*c} : ${a*b} = ${c} ס״מ`)}},
   ()=>{const a=rnd(2,6);return {prompt:`כמה קוביות של ${M("1 סמ״ק")} נכנסות בקובייה שהמקצוע שלה ${M(`${a} ס״מ`)}?`,vis:boxSVG(a,a,a),type:"num",ans:R(a*a*a),hint:[`זה בדיוק הנפח: ${M(`${a} × ${a} × ${a}`)}`],sol:M(`${a} × ${a} × ${a} = ${a*a*a}`)}},
  ]},
];

/* ============ practice / test engine ============ */
let P=null;
function makeQ(topicId){const t=topicById(topicId);const q=pick(t.gen)();q.topic=topicId;return q}
function startPractice(topics,count,isTest){
  const qs=[];for(let i=0;i<count;i++)qs.push(makeQ(topics[i%topics.length]));
  P={qs:isTest?shuffle(qs):qs,i:0,right:0,isTest,topics,log:[]};question();
}
function startTest(){
  const qs=[];TEST_TOPICS.forEach(id=>{for(let k=0;k<3;k++)qs.push(makeQ(id))});
  P={qs:shuffle(qs),i:0,right:0,isTest:true,log:[]};question();
}

function question(){
  const q=P.qs[P.i];let tries=0,hintN=0,done=false;
  const total=P.qs.length;
  const inputHTML=()=>{
    if(q.type==="choice")return `<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${show(o,false)}</button>`).join("")}</div>`;
    if(q.type==="choicetxt")return `<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="math">${o}</span></button>`).join("")}</div>`;
    if(q.type==="ratio")return `<div class="ans" id="ans"><input class="box" id="b1" readonly inputmode="none" aria-label="מספר ראשון"><span class="big math">:</span><input class="box" id="b2" readonly inputmode="none" aria-label="מספר שני"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="fn" data-f="del">⌫ מחיקה</button><button data-n="0">0</button><button class="fn" data-f="next">הבא ⇣</button></div>`;
    const boxes=(q.type==="num"||q.type==="dec")?`${q.prefix?`<span class="big math">${q.prefix}</span>`:""}<input class="box whole wide" id="b0" readonly inputmode="none" aria-label="תשובה">${q.unit?`<span class="big math">${q.unit}</span>`:""}`:
      `${q.type==="mixed"?`<input class="box whole" id="b0" readonly inputmode="none" aria-label="שלם">`:""}<div class="stack"><input class="box" id="b1" readonly inputmode="none" aria-label="מונה"><span class="ln"></span><input class="box" id="b2" readonly inputmode="none" aria-label="מכנה"></div>`;
    return `<div class="ans" id="ans">${boxes}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button class="fn" data-f="del">⌫ מחיקה</button><button data-n="0">0</button>${q.type==="dec"?`<button data-n=".">.</button>`:`<button class="fn" data-f="next">${q.type==="num"?"":"הבא ⇣"}</button>`}</div>`;
  };
  const prompt=q.type==="mixed"?`${q.prompt}<div class="label" style="margin-top:6px">כתבו כמספר מעורב: שלם, מונה ומכנה</div>`:q.prompt;
  app.innerHTML=`<div class="top"><button class="x" id="quit" aria-label="יציאה">✕</button><div class="grow"><div class="bar"><i style="width:${P.i/total*100}%"></i></div></div><span class="chip">${P.isTest?"מבחן":"תרגול"} ${P.i+1}/${total}</span><button class="x" id="vt" aria-label="הקראה אוטומטית">${S.voice===false?"🔇":"🔊"}</button></div>
  <div class="card"><div class="q">${prompt}</div>${q.vis?`<div class="vis">${q.vis}</div>`:""}<button class="link" id="rd" style="align-self:flex-start">🔊 הקראה</button></div>
  ${inputHTML()}
  <div class="fb" id="fb" aria-live="polite"></div>
  <div id="help"></div>
  <div class="row"><button class="btn ghost" id="hint" ${P.isTest?"hidden":""}>💡 רמז</button><button class="btn" id="check" ${q.type.startsWith("choice")?"hidden":""}>בדיקה</button></div>`;
  $("#quit").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}home()};$("#rd").onclick=()=>speak(q.prompt,true);
  $("#vt").onclick=()=>{S.voice=S.voice===false;save();$("#vt").textContent=S.voice?"🔊":"🔇";if(S.voice)speak(q.prompt);else try{speechSynthesis.cancel()}catch(e){}};
  setTimeout(()=>speak(q.prompt),200);
  const fb=$("#fb"),help=$("#help");
  const finish=(ok)=>{
    done=true;if(ok)P.right++;
    if(!P.isTest||true){const p=S.prog[q.topic]=S.prog[q.topic]||{right:0,total:0};p.total++;if(ok)p.right++}
    if(ok)S.stars+=P.isTest?2:1;save();
    P.log.push({q,ok});
    $("#check").hidden=true;$("#hint").hidden=true;
    const nx=document.createElement("button");nx.className="btn wide";nx.textContent=P.i<total-1?"לשאלה הבאה":"לסיכום";nx.onclick=()=>{P.i++;P.i<total?question():summary()};
    help.after(nx);
  };
  const showSol=()=>{help.innerHTML=`<div class="steps"><b>הפתרון:</b><div>${q.sol}</div></div>`;if(!P.isTest)setTimeout(()=>speak("הפתרון: "+q.sol),1800)};
  const judge=(val)=>{
    if(done)return;
    let ok,note="";
    if(q.type==="choicetxt")ok=val===q.ans;
    else if(val==null){fb.className="fb bad";fb.textContent="השלימו את כל התיבות.";return}
    else if(q.type==="ratio")ok=val.ratioOk;
    else if(q.type==="dec")ok=Math.abs(val.dec-q.ans)<1e-9;
    else{ok=eq(val.r,q.ans);
      if(ok&&val.raw&&!q.noSimplifyNote&&(val.raw.n!==q.ans.n||val.raw.d!==q.ans.d)&&q.type!=="num"){
        if(val.raw.n>val.raw.d&&q.type==="mixed")note=`נכון! במספר מעורב זה ${txtHTML(q.ans)}.`;
        else note=`נכון! אפשר גם לצמצם: ${txtHTML(q.ans)}.`;
      }}
    if(ok){
      P.streak=(P.streak||0)+1;
      const st=P.streak===3?STREAK[0]:P.streak===5?STREAK[1]:P.streak===10?STREAK[2]:"";
      const g=pick(GOOD);fb.className="fb good";fb.innerHTML=(note?note+" ":g+" ")+(st?`🔥 ${st}`:"");speak((note?"נכון! ":g+" ")+st);
      const a=$("#ans");if(a)a.classList.add("good");
      if(P.isTest||tries>0||hintN>0)finish(tries===0&&hintN===0||P.isTest);else finish(true);
    }else{
      tries++;P.streak=0;const a=$("#ans");if(a){a.classList.remove("bad");void a.offsetWidth;a.classList.add("bad")}
      if(P.isTest){fb.className="fb bad";fb.textContent="לא נורא, הנה הפתרון. ממשיכים!";showSol();finish(false);return}
      const t=pick(TRY);fb.className="fb bad";fb.textContent=tries===1?t:"כמעט! בואו נראה יחד את הפתרון:";speak(tries===1?t:"כמעט! בואו נראה יחד את הפתרון.");
      if(tries>=2){showSol();finish(false)}
    }
  };
  // choice
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done)return;const k=+b.dataset.k;
    const ok=q.type==="choice"?eq(q.opts[k],q.ans):q.opts[k]===q.ans;
    if(ok){b.classList.add("good")}else{b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad")}
    if(q.type==="choice")judge({r:q.opts[k]});else judge(q.opts[k]);
  });
  // keypad
  const ids=(q.type==="num"||q.type==="dec")?["b0"]:q.type==="mixed"?["b0","b1","b2"]:["b1","b2"];
  let cur=0;
  const sel=i=>{cur=i;ids.forEach((id,k)=>{const el=$("#"+id);el&&el.classList.toggle("sel",k===i)})};
  if($("#b0")||$("#b1")){ids.forEach((id,k)=>{$("#"+id).onclick=()=>sel(k)});sel(0)}
  app.querySelectorAll(".pad button").forEach(b=>b.onclick=()=>{
    if(done)return;const el=$("#"+ids[cur]);
    if(b.dataset.n!=null){if(b.dataset.n==="."&&el.value.includes("."))return;if(el.value.length<(q.type==="dec"?8:q.prefix?7:5))el.value+=(b.dataset.n==="."&&!el.value?"0.":b.dataset.n);$("#ans").classList.remove("bad")}
    else if(b.dataset.f==="del"){if(el.value)el.value=el.value.slice(0,-1);else if(cur>0){sel(cur-1)}}
    else if(b.dataset.f==="next"){sel((cur+1)%ids.length)}
  });
  $("#check").onclick=()=>{
    if(q.type==="ratio"){const a=$("#b1").value,b=$("#b2").value;if(a===""||b===""){judge(null);return}
      if(+a*q.ans.b===+b*q.ans.a&&gcd(+a,+b)===1){judge({r:R(1),ratioOk:true})}
      else if(+a*q.ans.b===+b*q.ans.a){fb.className="fb bad";fb.textContent="היחס נכון, אבל אפשר לצמצם עוד.";return}
      else judge({r:R(0),ratioOk:false});return}
    if(q.type==="dec"){const v=$("#b0").value;judge(v===""?null:{dec:parseFloat(v)});return}
    if(q.type==="num"){const v=$("#b0").value;judge(v===""?null:{r:R(+v)});return}
    const w=q.type==="mixed"?$("#b0").value:"0",n=$("#b1").value,d=$("#b2").value;
    if(n===""&&q.type==="mixed"&&w!==""&&d===""){judge({r:R(+w),raw:R(+w)});return}
    if(n===""||d===""||+d===0){judge(null);return}
    const raw={n:(+w||0)*(+d)+(+n),d:+d};judge({r:R(raw.n,raw.d),raw});
  };
  $("#hint").onclick=()=>{
    if(done)return;hintN=Math.min(q.hint.length,hintN+1);
    help.innerHTML=`<div class="steps">${q.hint.slice(0,hintN).map((h,i)=>`<div>${i+1}. ${h}</div>`).join("")}</div>`;speak(q.hint[hintN-1]);
  };
}
function txtHTML(r){return show(r,true)}

function summary(){
  const total=P.qs.length,score=Math.round(P.right/total*100);
  if(P.isTest){S.tests.push({d:new Date().toISOString().slice(0,10),s:score});save()}
  const byTopic={};P.log.forEach(l=>{const b=byTopic[l.q.topic]=byTopic[l.q.topic]||{r:0,t:0};b.t++;if(l.ok)b.r++});
  const weak=Object.entries(byTopic).filter(([,b])=>b.r/b.t<.7).map(([id])=>topicById(id).title);
  const msg=score>=90?`מעולה${S.name?" "+S.name:""}! אתם מוכנים למבחן! אני גאה בכם!`:score>=70?"יפה מאוד! עוד קצת תרגול ונגיע למושלם. אתם בדרך הנכונה!":"עבודה טובה שהתאמנתם! כל תרגול מקרב אתכם להצלחה. ננסה שוב?";
  const wrong=P.log.filter(l=>!l.ok);
  app.innerHTML=`${talk(msg)}
  <div class="card center"><div class="label">${P.isTest?"ציון במבחן לדוגמה":"תוצאה בתרגול"}</div><div class="score ${score<70?"low":""}">${score}</div><p>${P.right} נכונות מתוך ${total}</p>
  ${P.isTest?`<div class="review">${TOPICS.map(t=>{const b=byTopic[t.id];return b?`<div class="row" style="justify-content:space-between"><span>${t.title}</span><b>${b.r}/${b.t}</b></div>`:""}).join("")}</div>`:""}
  ${weak.length?`<p><b>כדאי לחזק:</b> ${weak.join(", ")}</p>`:""}</div>
  ${wrong.length?`<h3>השאלות שטעיתם בהן</h3><div class="review">${wrong.map(l=>`<div class="item"><div>${l.q.prompt}</div><div class="steps" style="margin-top:8px">${l.q.sol}</div></div>`).join("")}</div>`:""}
  <button class="btn wide" id="again">${P.isTest?"מבחן חדש":"עוד 10 שאלות"}</button><button class="btn ghost wide" id="home">למסך הבית</button>`;
  $("#again").onclick=()=>P.isTest?startTest():startPractice(P.topics,10,false);$("#home").onclick=home;
  if("speechSynthesis" in window)speak(msg);
}

render();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>
</body></html>
