rts field","A vegetable shop"],["Why did many plants die at first?","Nobody watered them during the holidays","The seeds were too old","The weather was too cold","Animals ate them"],["The word \"responsible\" (paragraph 2) means...","in charge of something","tired of something","afraid of something","paid for something"],["What can we learn from Noa's words?","Good results take time","Gardening is boring","Teachers should do the work","Vegetables grow very quickly"]],"The School Garden"],["At Ramot Middle School, the lunch break used to be very quiet. This was not because students were reading, but because almost everyone was looking at a phone. Teachers noticed that children sat together but hardly talked to each other.\n\nThis year the school tried an experiment. During lunch, phones had to stay in a box in each classroom. Many students were angry at first. \"What will I do for thirty minutes?\" asked Itai, an eighth grader. To help, the school put board games, balls and a small library in the yard.\n\nAfter two months, the school asked the students what they thought. Most of them said they were happier. They played football, talked more and made new friends. Some students still missed their phones, especially those who liked to listen to music. The school decided to continue the experiment, but now students can bring headphones and a simple music player if they want.","בחטיבת הביניים רמות, הפסקת הצהריים הייתה פעם שקטה מאוד. זה לא היה משום שהתלמידים קראו, אלא משום שכמעט כולם הסתכלו בטלפון. המורים שמו לב שהילדים ישבו יחד, אבל כמעט לא דיברו זה עם זה.\n\nהשנה ניסה בית הספר ניסוי. בזמן ארוחת הצהריים, הטלפונים היו צריכים להישאר בקופסה בכל כיתה. בהתחלה תלמידים רבים כעסו. \"מה אני אעשה במשך שלושים דקות?\" שאל איתי, תלמיד כיתה ח'. כדי לעזור, בית הספר הציב בחצר משחקי קופסה, כדורים וספרייה קטנה.\n\nאחרי חודשיים, בית הספר שאל את התלמידים מה דעתם. רובם אמרו שהם מאושרים יותר. הם שיחקו כדורגל, דיברו יותר והכירו חברים חדשים. חלק מהתלמידים עדיין התגעגעו לטלפונים שלהם, במיוחד אלה שאהבו להאזין למוזיקה. בית הספר החליט להמשיך בניסוי, אבל עכשיו התלמידים יכולים להביא אוזניות ונגן מוזיקה פשוט אם הם רוצים.",[["What was the problem at the school?","Students hardly talked during lunch","Students ate too little","The yard was too noisy","Teachers took phones home"],["How did many students feel at the beginning?","Angry","Excited","Proud","Grateful"],["What did the school give students instead of phones?","Games, balls and books","Computers and tablets","Extra lessons","Free food"],["What is the main idea of the text?","A school experiment without phones mostly succeeded","Phones are dangerous for children","Students prefer music to sport","The school closed its library"]],"Phones Off at Lunch"],["Every spring, hundreds of people run through the streets of Haifa in a special race. The runners do not try to win prizes. Instead, each runner asks friends and family to donate money for every kilometer they finish. This year, the money went to a center for children with serious illnesses.\n\nMaya, sixteen, decided to take part after her younger cousin spent a month in hospital. She had never run more than two kilometers before, so she started training three months early. Every morning before school, she ran in the park near her home. Some days it rained and she wanted to stay in bed, but she remembered her cousin and went out anyway.\n\nOn the day of the race, Maya ran ten kilometers. She was slow, and her legs hurt for days afterwards. But she collected over 3,000 shekels. \"It was the hardest thing I have ever done,\" she said, \"and the best.\"","בכל אביב, מאות אנשים רצים ברחובות חיפה במרוץ מיוחד. הרצים לא מנסים לזכות בפרסים. במקום זאת, כל רץ מבקש מחברים ומבני משפחה לתרום כסף על כל קילומטר שהוא מסיים. השנה הכסף הועבר למרכז לילדים עם מחלות קשות.\n\nמאיה, בת שש עשרה, החליטה להשתתף אחרי שבן דודה הצעיר שהה חודש בבית חולים. היא מעולם לא רצה יותר משני קילומטרים, ולכן התחילה להתאמן שלושה חודשים מראש. בכל בוקר לפני בית הספר היא רצה בפארק ליד ביתה. בחלק מהימים ירד גשם והיא רצתה להישאר במיטה, אבל היא נזכרה בבן דודה ויצאה בכל זאת.\n\nביום המרוץ רצה מאיה עשרה קילומטרים. היא הייתה איטית, והרגליים כאבו לה במשך ימים אחר כך. אבל היא אספה יותר מ-3,000 שקלים. \"זה היה הדבר הקשה ביותר שעשיתי אי פעם,\" היא אמרה, \"והטוב ביותר.\"",[["What is special about the race?","Runners collect money for charity","Only children can take part","The winner gets a big prize","It takes place at night"],["Why did Maya decide to run?","Her cousin had been in hospital","Her teacher asked her to","She wanted to win a prize","She was a professional runner"],["The word \"anyway\" (paragraph 2) shows that Maya...","ran even when she didn't want to","stopped training when it rained","ran only on sunny days","trained together with her cousin"],["How did Maya probably feel after the race?","Tired but proud","Disappointed and angry","Sorry she took part","Ready to run again the next day"]],"Running for a Cause"],["Many Israelis think the desert is empty and boring, but the Ben-David family discovered the opposite. Last winter, they spent a weekend near Mitzpe Ramon, a small town on the edge of a huge crater.\n\nOn the first morning, they joined a guided walk into the crater. The guide showed them rocks of different colors: red, yellow and even purple. He explained that the crater was not made by a meteor, as many people believe, but by water and wind over millions of years. In the afternoon, they saw a group of ibex, wild goats with long, curved horns, standing calmly near the road.\n\nAt night, the family went outside to look at the sky. Because there are very few lights in the area, they could see thousands of stars. Thirteen-year-old Omer used an app on his phone to find planets. \"I didn't know the desert could be so beautiful,\" he said. The family is already planning their next trip.","ישראלים רבים חושבים שהמדבר ריק ומשעמם, אבל משפחת בן-דוד גילתה את ההפך. בחורף שעבר הם בילו סוף שבוע ליד מצפה רמון, עיירה קטנה בשולי מכתש ענק.\n\nבבוקר הראשון הם הצטרפו לסיור מודרך לתוך המכתש. המדריך הראה להם סלעים בצבעים שונים: אדום, צהוב ואפילו סגול. הוא הסביר שהמכתש לא נוצר על ידי מטאוריט, כפי שאנשים רבים חושבים, אלא על ידי מים ורוח במשך מיליוני שנים. אחר הצהריים הם ראו להקה של יעלים, עזים בר עם קרניים ארוכות ומעוקלות, שעמדו ברוגע ליד הכביש.\n\nבלילה יצאה המשפחה החוצה להסתכל על השמיים. מכיוון שיש מעט מאוד אורות באזור, הם יכלו לראות אלפי כוכבים. עומר, בן שלוש עשרה, השתמש באפליקציה בטלפון שלו כדי למצוא כוכבי לכת. \"לא ידעתי שהמדבר יכול להיות כל כך יפה,\" הוא אמר. המשפחה כבר מתכננת את הטיול הבא שלה.",[["According to the guide, how was the crater formed?","By water and wind","By a meteor","By an earthquake","By people digging"],["What are ibex?","Wild goats","Colorful rocks","Desert birds","Small planets"],["Why could the family see so many stars?","There are few lights in the area","Omer had a special telescope","It was a summer night","The guide turned off the lamps"],["What did the family think of the trip?","They enjoyed it very much","They found it boring","They thought it was too cold","They never want to return"]],"A Weekend in the Negev"],["Bamba is not an ordinary dog. Every Tuesday, she visits a home for elderly people in Rishon LeZion together with her owner, Dana, who is a volunteer. Bamba is a therapy dog. This means she has been trained to stay calm around strangers, noise and wheelchairs.\n\nWhen Bamba enters the room, the residents' faces change. Some of them, who usually sit alone and say very little, begin to smile and talk. They stroke her soft fur and tell Dana about the dogs they had when they were young. One man, who rarely leaves his room, now waits by the door every Tuesday.\n\nScientists have found that spending time with animals can lower stress and make people feel less lonely. However, not every dog can do this job. Training takes about a year, and the dog must pass a test. Dana says that Bamba enjoys the visits as much as the residents do.","במבה היא לא כלבה רגילה. בכל יום שלישי היא מבקרת בבית אבות בראשון לציון יחד עם הבעלים שלה, דנה, שהיא מתנדבת. במבה היא כלבה טיפולית. המשמעות היא שהיא אולפה להישאר רגועה ליד זרים, רעש וכיסאות גלגלים.\n\nכשבמבה נכנסת לחדר, הפנים של הדיירים משתנות. חלק מהם, שבדרך כלל יושבים לבד ומדברים מעט מאוד, מתחילים לחייך ולדבר. הם מלטפים את הפרווה הרכה שלה ומספרים לדנה על הכלבים שהיו להם כשהיו צעירים. איש אחד, שכמעט אף פעם לא יוצא מהחדר שלו, מחכה עכשיו ליד הדלת בכל יום שלישי.\n\nמדענים גילו שבילוי זמן עם בעלי חיים יכול להפחית מתח ולגרום לאנשים להרגיש פחות בודדים. עם זאת, לא כל כלב יכול לעשות את העבודה הזאת. האילוף נמשך כשנה, והכלב חייב לעבור מבחן. דנה אומרת שבמבה נהנית מהביקורים בדיוק כמו הדיירים.",[["What does Bamba do every Tuesday?","She visits elderly people","She goes to a dog school","She helps at a hospital","She plays in the park"],["The word \"rarely\" (paragraph 2) means...","not often","very quickly","always","quietly"],["Why does the man wait by the door?","He looks forward to seeing Bamba","He is waiting for his family","He wants to go outside","He is afraid of dogs"],["Which statement is TRUE according to the text?","Training a therapy dog takes about a year","Any dog can be a therapy dog","Bamba belongs to the elderly home","Animals make people more stressed"]],"Bamba the Therapy Dog"],["Last summer, seventeen-year-old Yonatan got his first job at an ice cream shop in Netanya. He thought it would be easy: just put ice cream in a cup and take the money. He was wrong.\n\nOn his first day, the shop was full of tourists and families. Yonatan had to remember more than thirty flavors, use the cash register and smile at every customer, even the rude ones. By the evening, his arms hurt from scooping hard ice cream, and he had made several mistakes with the change.\n\nSlowly, things got better. His manager, Rina, taught him how to stay calm when there was a long line. He learned some words in French and Russian to help tourists. By the end of August, he was one of the fastest workers in the shop.\n\nWith the money he earned, Yonatan bought a new bicycle. But he says the most valuable thing he got was confidence.","בקיץ שעבר, יונתן בן השבע עשרה קיבל את העבודה הראשונה שלו בחנות גלידה בנתניה. הוא חשב שזה יהיה קל: רק לשים גלידה בגביע ולקחת את הכסף. הוא טעה.\n\nביום הראשון שלו החנות הייתה מלאה בתיירים ובמשפחות. יונתן היה צריך לזכור יותר משלושים טעמים, להשתמש בקופה הרושמת ולחייך לכל לקוח, אפילו לגסי הרוח. עד הערב כאבו לו הידיים מגריפת גלידה קשה, והוא עשה כמה טעויות בעודף.\n\nלאט לאט המצב השתפר. המנהלת שלו, רינה, לימדה אותו איך להישאר רגוע כשיש תור ארוך. הוא למד כמה מילים בצרפתית וברוסית כדי לעזור לתיירים. עד סוף אוגוסט הוא היה אחד העובדים המהירים ביותר בחנות.\n\nבכסף שהרוויח קנה יונתן אופניים חדשים. אבל הוא אומר שהדבר היקר ביותר שקיבל היה ביטחון עצמי.",[["What did Yonatan expect before he started?","That the job would be easy","That he would hate it","That he would work only with tourists","That he would earn a lot"],["What problem did he have on his first day?","He made mistakes with the change","He arrived late","He broke the cash register","He ate too much ice cream"],["How did Rina help him?","She taught him to stay calm","She bought him a bicycle","She taught him French","She let him go home early"],["According to Yonatan, what was the most valuable thing he gained?","Confidence","A new bicycle","New friends","Free ice cream"]],"My First Summer Job"],["When Tamar's grandmother turned eighty, the family wanted to give her a special present. Tamar, who was fifteen, had an idea. Her grandmother was famous in the family for her cooking, but she had never written her recipes down. \"One day the recipes will be lost,\" Tamar thought.\n\nSo every Saturday for six months, Tamar cooked with her grandmother. She watched carefully and wrote down everything: how much flour to use, how long to bake, and the little secrets, like adding a pinch of cinnamon to the soup. This was not easy, because her grandmother never measured anything. \"Just add enough,\" she always said.\n\nTamar also recorded her grandmother's stories about each dish: where she learned it and who she cooked it for. In the end, Tamar printed a book with forty recipes and old family photos. At the birthday party, her grandmother cried when she opened it. Now every family member has a copy.","כשסבתא של תמר הגיעה לגיל שמונים, המשפחה רצתה לתת לה מתנה מיוחדת. לתמר, שהייתה בת חמש עשרה, היה רעיון. סבתא שלה הייתה מפורסמת במשפחה בבישול שלה, אבל היא מעולם לא כתבה את המתכונים שלה. \"יום אחד המתכונים ילכו לאיבוד,\" חשבה תמר.\n\nאז בכל שבת במשך שישה חודשים, תמר בישלה עם סבתא שלה. היא הסתכלה בתשומת לב ורשמה הכול: כמה קמח להשתמש, כמה זמן לאפות, ואת הסודות הקטנים, כמו להוסיף קורט קינמון למרק. זה לא היה קל, כי סבתא שלה אף פעם לא מדדה שום דבר. \"פשוט תוסיפי מספיק,\" היא תמיד אמרה.\n\nתמר גם הקליטה את הסיפורים של סבתא שלה על כל מאכל: איפה היא למדה אותו ולמי היא בישלה אותו. בסוף, תמר הדפיסה ספר עם ארבעים מתכונים ותמונות משפחתיות ישנות. במסיבת יום ההולדת, סבתא שלה בכתה כשפתחה אותו. היום לכל אחד מבני המשפחה יש עותק.",[["Why did Tamar want to write the recipes down?","So they would not be lost","To sell them in a shop","For a school project","Because her grandmother asked her to"],["Why was writing the recipes difficult?","Her grandmother never measured anything","Her grandmother refused to help","Tamar didn't know how to cook","The recipes were in another language"],["Besides recipes, what else is in the book?","Family stories and photos","Restaurant reviews","Shopping lists","Health advice"],["How did the grandmother react to the present?","She was very moved","She was angry","She didn't understand it","She laughed at the mistakes"]],"Grandma's Recipe Book"],["Ido always wanted to play the guitar, but lessons with a private teacher were too expensive for his family. Then, two years ago, his uncle gave him an old guitar, and Ido decided to teach himself using free videos on the internet.\n\nAt the beginning, it was frustrating. His fingers hurt, and the sounds he made were terrible. The videos were helpful, but there was nobody to tell him what he was doing wrong. So Ido joined an online group of young guitar players. Members upload short recordings, and others give them advice.\n\nIdo practiced for thirty minutes every day, even during exams. After a year, he could play more than twenty songs. Last month he played at his school's end-of-year concert in front of 400 people. He was nervous, but the audience loved it.\n\nIdo believes that anyone can learn an instrument online. \"But you need discipline,\" he says. \"The videos won't practice for you.\"","עידו תמיד רצה לנגן בגיטרה, אבל שיעורים אצל מורה פרטי היו יקרים מדי עבור המשפחה שלו. ואז, לפני שנתיים, הדוד שלו נתן לו גיטרה ישנה, ועידו החליט ללמד את עצמו בעזרת סרטונים חינמיים באינטרנט.\n\nבהתחלה זה היה מתסכל. האצבעות שלו כאבו, והצלילים שהוא הפיק היו נוראיים. הסרטונים עזרו, אבל לא היה אף אחד שיגיד לו מה הוא עושה לא נכון. אז עידו הצטרף לקבוצה מקוונת של נגני גיטרה צעירים. החברים מעלים הקלטות קצרות, ואחרים נותנים להם עצות.\n\nעידו התאמן שלושים דקות בכל יום, אפילו בתקופת המבחנים. אחרי שנה הוא ידע לנגן יותר מעשרים שירים. בחודש שעבר הוא ניגן במופע סוף השנה של בית הספר שלו מול 400 איש. הוא היה לחוץ, אבל הקהל אהב את זה.\n\nעידו מאמין שכל אחד יכול ללמוד לנגן בכלי נגינה דרך האינטרנט. \"אבל צריך משמעת,\" הוא אומר. \"הסרטונים לא יתאמנו במקומך.\"",[["Why didn't Ido take private lessons?","They cost too much","He had no time","His uncle was his teacher","There were no teachers nearby"],["The word \"frustrating\" (paragraph 2) is closest in meaning to...","annoying and difficult","fun and easy","quick and simple","quiet and relaxing"],["Why did Ido join the online group?","To get advice on his playing","To sell his old guitar","To find a private teacher","To watch concerts"],["What does Ido mean by \"The videos won't practice for you\"?","You must work hard yourself","Videos are useless","You should buy better videos","Teachers are better than videos"]],"Teaching Himself Guitar"],["Some of the world's most useful inventions started with a simple walk. In the 1940s, a Swiss engineer named George de Mestral went hiking in the mountains with his dog. When they came home, he noticed small burrs, the seeds of a plant, stuck to his trousers and to the dog's fur.\n\nMost people would just remove them and forget about it. But de Mestral was curious. He looked at the burrs under a microscope and saw hundreds of tiny hooks. These hooks caught on anything with loops, like cloth or hair.\n\nHe wondered if he could copy this idea to make a new kind of fastener. It took him many years of experiments, because at first the material broke too easily. Finally, he succeeded, and he called his invention Velcro.\n\nAt first, fashion companies were not interested. Later, astronauts used Velcro in space, and soon it appeared on shoes, bags and jackets all over the world.","חלק מההמצאות השימושיות ביותר בעולם התחילו בהליכה פשוטה. בשנות הארבעים של המאה העשרים, מהנדס שווייצרי בשם ז'ורז' דה מסטרל יצא לטיול בהרים עם הכלב שלו. כשחזרו הביתה, הוא שם לב לקוצים קטנים, זרעים של צמח, שנדבקו למכנסיים שלו ולפרווה של הכלב.\n\nרוב האנשים פשוט היו מורידים אותם ושוכחים מזה. אבל דה מסטרל היה סקרן. הוא הסתכל על הזרעים במיקרוסקופ וראה מאות ווים זעירים. הווים האלה נתפסו בכל דבר שיש בו לולאות, כמו בד או שיער.\n\nהוא תהה אם הוא יכול להעתיק את הרעיון הזה כדי ליצור סוג חדש של סוגר. זה לקח לו שנים רבות של ניסויים, כי בהתחלה החומר נקרע בקלות רבה מדי. לבסוף הוא הצליח, והוא קרא להמצאה שלו \"ולקרו\" (סקוטש).\n\nבהתחלה חברות אופנה לא התעניינו. מאוחר יותר אסטרונאוטים השתמשו בוולקרו בחלל, ומהר מאוד הוא הופיע על נעליים, תיקים ומעילים בכל העולם.",[["What gave de Mestral his idea?","Seeds stuck to his clothes","A broken zipper","A book about space","His dog's collar"],["What did he see under the microscope?","Tiny hooks","Small insects","Pieces of cloth","Drops of water"],["Why did the invention take many years?","The material broke easily at first","He had no money","He lost his microscope","Nobody wanted to help him"],["What helped Velcro become popular?","Astronauts used it","Fashion companies loved it immediately","It was given away for free","Dogs liked wearing it"]],"A Walk That Led to Velcro"],["Many teenagers go to bed late and find it very hard to wake up in the morning. Parents often think this is just laziness, but scientists say there is a biological reason.\n\nDuring the teenage years, the body produces melatonin, the hormone that makes us feel sleepy, later in the evening than it does in children or adults. As a result, many teens do not feel tired until eleven o'clock or even later. However, school still starts early, so they often sleep only six or seven hours a night. Experts say teenagers need between eight and ten hours.\n\nLack of sleep can cause serious problems. Tired students find it harder to concentrate, remember information and control their mood. They are also more likely to get sick.\n\nThere are some simple ways to sleep better. Doctors recommend turning off screens an hour before bed, avoiding energy drinks in the evening and going to sleep at the same time every night, even on weekends.","בני נוער רבים הולכים לישון מאוחר ומתקשים מאוד להתעורר בבוקר. הורים חושבים לעתים קרובות שזו פשוט עצלנות, אבל מדענים אומרים שיש לכך סיבה ביולוגית.\n\nבגיל ההתבגרות, הגוף מייצר מלטונין, ההורמון שגורם לנו להרגיש ישנוניים, מאוחר יותר בערב מאשר אצל ילדים או מבוגרים. כתוצאה מכך, בני נוער רבים לא מרגישים עייפים עד אחת עשרה בלילה או אפילו מאוחר יותר. עם זאת, הלימודים עדיין מתחילים מוקדם, ולכן לעתים קרובות הם ישנים רק שש או שבע שעות בלילה. מומחים אומרים שבני נוער צריכים בין שמונה לעשר שעות שינה.\n\nחוסר שינה יכול לגרום לבעיות רציניות. תלמידים עייפים מתקשים יותר להתרכז, לזכור מידע ולשלוט במצב הרוח שלהם. הם גם נוטים יותר לחלות.\n\nיש כמה דרכים פשוטות לישון טוב יותר. רופאים ממליצים לכבות מסכים שעה לפני השינה, להימנע ממשקאות אנרגיה בערב וללכת לישון באותה שעה בכל לילה, אפילו בסופי שבוע.",[["According to scientists, why do teens go to bed late?","Their bodies make melatonin later","They are lazy","They drink too much water","They have too much homework"],["How many hours of sleep do teenagers need?","Between eight and ten","Six or seven","About five","More than twelve"],["What is one effect of lack of sleep?","It is harder to concentrate","Memory gets better","Students grow taller","Students get sick less often"],["What is the purpose of the last paragraph?","To give advice for better sleep","To explain what melatonin is","To criticize schools","To describe a scientific experiment"]],"Why Teenagers Need Sleep"]],"C":[["Yesterday we ___ to the beach with our friends.","went","go","goes","going","אתמול הלכנו לחוף הים עם החברים שלנו."],["She has lived in Jerusalem ___ 2015.","since","for","from","at","היא גרה בירושלים מאז 2015."],["I wanted to go out, ___ it was raining heavily.","but","because","so","unless","רציתי לצאת, אבל ירד גשם חזק."],["If it rains tomorrow, we ___ at home.","will stay","stayed","stays","staying","אם יירד גשם מחר, נישאר בבית."],["The museum is open ___ Sunday to Thursday.","from","since","at","during","המוזיאון פתוח מיום ראשון עד יום חמישי."],["My brother is ___ than me, but I am stronger.","taller","tall","tallest","more tall","אחי גבוה ממני, אבל אני חזק יותר."],["Please turn ___ the lights when you leave the room.","off","of","up","away","בבקשה כבה את האורות כשאתה יוצא מהחדר."],["We were watching TV when the phone ___.","rang","rings","was ring","ringing","צפינו בטלוויזיה כשהטלפון צלצל."],["He didn't study for the test, ___ he failed it.","so","because","although","unless","הוא לא למד למבחן, ולכן נכשל בו."],["Recycling helps to ___ the environment.","protect","destroy","pollute","waste","מיחזור עוזר להגן על הסביבה."],["Have you ever ___ a camel?","ridden","rode","ride","riding","רכבת פעם על גמל?"],["The children are very interested ___ animals.","in","on","at","for","הילדים מתעניינים מאוד בבעלי חיים."],["This is the ___ movie I have ever seen.","best","better","good","most good","זה הסרט הטוב ביותר שראיתי אי פעם."],["Dan is good ___ math, but he finds English difficult.","at","on","to","of","דן טוב במתמטיקה, אבל אנגלית קשה לו."],["A volunteer is someone who works ___ getting paid.","without","with","by","because","מתנדב הוא מישהו שעובד בלי לקבל תשלום."],["My sister usually ___ her homework after dinner.","does","do","doing","is do","אחותי בדרך כלל מכינה את שיעורי הבית אחרי ארוחת הערב."],["___ he was tired, he finished the race.","Although","Because","So","Unless","למרות שהיה עייף, הוא סיים את המרוץ."],["The bus was very ___, so there were no free seats.","crowded","empty","quiet","cheap","האוטובוס היה צפוף מאוד, ולכן לא היו מקומות פנויים."],["The new library ___ built last year.","was","is","were","has","הספרייה החדשה נבנתה בשנה שעברה."],["Doctors say that eating vegetables is ___ for your health.","good","bad","boring","angry","רופאים אומרים שאכילת ירקות טובה לבריאות שלך."],["We arrived ___ the airport two hours before the flight.","at","to","on","into","הגענו לשדה התעופה שעתיים לפני הטיסה."],["Look! The baby ___ right now, so please be quiet.","is sleeping","sleeps","slept","sleep","תראה! התינוק ישן עכשיו, אז בבקשה תהיה בשקט."],["I can't find my keys. I think I ___ them.","have lost","lose","am losing","will lose","אני לא מוצא את המפתחות שלי. אני חושב שאיבדתי אותם."],["My parents let me ___ to the party last night.","go","to go","going","goes","ההורים שלי הרשו לי ללכת למסיבה אתמול בלילה."],["There aren't ___ eggs left in the fridge.","any","some","much","a","לא נשארו ביצים במקרר."],["The weather was ___, so we couldn't see the mountains.","foggy","sunny","clear","bright","מזג האוויר היה ערפילי, ולכן לא יכולנו לראות את ההרים."],["He is saving money ___ he can buy a new laptop.","so that","because of","although","unless","הוא חוסך כסף כדי שיוכל לקנות מחשב נייד חדש."],["Who ___ the telephone?","invented","invention","inventing","inventor","מי המציא את הטלפון?"],["Thousands of birds fly ___ Israel every autumn on their way to Africa.","over","under","between","inside","אלפי ציפורים עפות מעל ישראל בכל סתיו בדרכן לאפריקה."],["I'm looking forward to ___ you next week.","seeing","see","saw","be seen","אני מצפה לראות אותך בשבוע הבא."]],"RS":[]},"h11":{"R":[["In many large cities, the roofs of buildings are among the most wasted spaces. They are usually covered with grey concrete, air-conditioning units and old water tanks. Over the past two decades, however, a growing number of city residents have started to see these empty surfaces as an opportunity. They are turning them into gardens and even small farms.\n\nThe benefits are surprising. Plants on a roof absorb heat from the sun, so the floors below stay cooler in summer. As a result, people living in the building use less electricity for air-conditioning. The gardens also collect rainwater, which would otherwise flow into the streets and cause flooding during heavy storms. In addition, fresh vegetables grown on a roof do not need to be transported long distances by truck, which reduces pollution.\n\nRooftop farming is not without problems. Soil and water are heavy, and not every old building can carry the extra weight. Engineers must check the structure carefully before any work begins. Wind can damage young plants, and carrying tools up several floors is tiring.\n\nStill, supporters believe the idea has a bright future. A community gardener in one project explained that the garden had done more than produce tomatoes. \"Neighbours who never said hello now meet every Friday to water the plants together,\" she said. For her, that was the greatest harvest of all.","בערים גדולות רבות, גגות הבניינים הם מהשטחים המבוזבזים ביותר. בדרך כלל הם מכוסים בבטון אפור, במזגנים ובדודי מים ישנים. אולם בשני העשורים האחרונים, מספר הולך וגדל של תושבי ערים החלו לראות במשטחים הריקים האלה הזדמנות. הם הופכים אותם לגינות ואפילו לחוות קטנות.\n\nהיתרונות מפתיעים. צמחים על הגג סופגים את חום השמש, כך שהקומות שמתחת נשארות קרירות יותר בקיץ. כתוצאה מכך, דיירי הבניין צורכים פחות חשמל למיזוג אוויר. הגינות גם אוספות מי גשמים, שאחרת היו זורמים לרחובות וגורמים להצפות בזמן סופות חזקות. בנוסף, ירקות טריים שגדלים על גג אינם צריכים להיות מובלים במשאיות למרחקים ארוכים, מה שמפחית זיהום.\n\nחקלאות על גגות אינה חפה מבעיות. אדמה ומים הם כבדים, ולא כל בניין ישן יכול לשאת את המשקל הנוסף. מהנדסים חייבים לבדוק את המבנה בקפידה לפני שמתחילה עבודה כלשהי. רוח עלולה לפגוע בצמחים צעירים, וסחיבת כלים במעלה כמה קומות מעייפת.\n\nובכל זאת, התומכים מאמינים שלרעיון יש עתיד מזהיר. גננת קהילתית באחד הפרויקטים הסבירה שהגינה עשתה יותר מאשר לגדל עגבניות. \"שכנים שמעולם לא אמרו שלום נפגשים עכשיו בכל יום שישי כדי להשקות יחד את הצמחים,\" אמרה. בעיניה, זה היה היבול הגדול מכולם.",[["What is the passage mainly about?","Using city roofs to grow plants and food","Problems with air-conditioning in cities","How engineers design new buildings","Why vegetables are expensive in cities"],["According to the passage, how do rooftop gardens help during storms?","They collect rainwater that could cause flooding","They protect the roofs from strong winds","They keep the streets warm and dry","They stop the electricity from failing"],["In the sentence 'They are turning them into gardens and even small farms', what does 'them' refer to?","the empty roof surfaces","the city residents","the air-conditioning units","the past two decades"],["What does the gardener mean by 'the greatest harvest of all'?","The garden brought the neighbours closer together","Her tomatoes were the best she had ever grown","The project earned the building a lot of money","Friday is the best day to pick vegetables"]],"Rooftop Farms"],["Parents often complain that their teenage children stay up too late and are impossible to wake in the morning. Many assume that this is simply laziness or too much time spent on phones. Scientific research, however, suggests that biology plays a major role.\n\nDuring adolescence, the body begins to release melatonin, the hormone that makes us feel sleepy, about two hours later than it does in children or adults. This means that a typical sixteen-year-old may not feel tired until eleven at night or even later. Yet most schools start early, so many teenagers get only six or seven hours of sleep instead of the eight to ten hours that experts recommend.\n\nThe effects of this lack of sleep are serious. Tired students find it harder to concentrate, remember new information and control their emotions. Some studies have also linked poor sleep to a higher risk of car accidents among young drivers.\n\nFor this reason, several school districts in different countries have experimented with starting the school day later. In one district, classes were moved from 7:30 to 8:30. Researchers found that attendance improved and students reported feeling less stressed. Their grades rose slightly as well.\n\nOf course, changing school hours is complicated, since it affects bus schedules, parents' working hours and after-school activities. Nevertheless, the evidence is difficult to ignore, and more schools are likely to consider the change in the coming years.","הורים מתלוננים לעיתים קרובות שילדיהם המתבגרים נשארים ערים עד שעה מאוחרת מדי ושאי אפשר להעיר אותם בבוקר. רבים מניחים שמדובר פשוט בעצלות או בזמן רב מדי מול הטלפון. אולם מחקרים מדעיים מראים שלביולוגיה יש תפקיד מרכזי.\n\nבגיל ההתבגרות, הגוף מתחיל להפריש מלטונין, ההורמון שגורם לנו להרגיש ישנוניים, כשעתיים מאוחר יותר מאשר אצל ילדים או מבוגרים. המשמעות היא שבן שש־עשרה טיפוסי עשוי לא להרגיש עייף עד אחת־עשרה בלילה או אפילו מאוחר יותר. ובכל זאת, רוב בתי הספר מתחילים מוקדם, ולכן מתבגרים רבים ישנים רק שש או שבע שעות במקום שמונה עד עשר השעות שהמומחים ממליצים עליהן.\n\nההשפעות של חוסר השינה הזה חמורות. לתלמידים עייפים קשה יותר להתרכז, לזכור מידע חדש ולשלוט ברגשותיהם. כמה מחקרים אף קשרו בין שינה לקויה לבין סיכון גבוה יותר לתאונות דרכים בקרב נהגים צעירים.\n\nמסיבה זו, כמה מחוזות חינוך במדינות שונות ניסו להתחיל את יום הלימודים מאוחר יותר. באחד המחוזות הוזזו השיעורים מ־7:30 ל־8:30. החוקרים מצאו שהנוכחות השתפרה ושהתלמידים דיווחו על פחות לחץ. גם הציונים שלהם עלו מעט.\n\nכמובן, שינוי שעות הלימודים הוא מסובך, משום שהוא משפיע על לוחות הזמנים של האוטובוסים, על שעות העבודה של ההורים ועל פעילויות אחר הצהריים. עם זאת, קשה להתעלם מהראיות, וסביר שבתי ספר נוספים ישקלו את השינוי בשנים הקרובות.",[["According to the passage, why do teenagers feel sleepy later at night?","Their bodies release melatonin later","They drink too much coffee in the evening","They spend too much time on their phones","They usually sleep during the afternoon"],["The word 'adolescence' in the second paragraph means...","the period of being a teenager","a type of sleep disorder","the hours before midnight","a school timetable"],["What happened when one district started classes at 8:30?","Attendance improved and students felt less stressed","Students' grades fell slightly","The school buses stopped running","Parents had to stop working"],["What is the writer's attitude toward later school start times?","Supportive, though aware of the difficulties","Completely against the idea","Uninterested in the research results","Certain that the change is easy to make"]],"Why Teenagers Can't Fall Asleep"],["Every year, thousands of Israeli eighteen-year-olds delay their military service by twelve months in order to volunteer in a \"service year\", known in Hebrew as shnat sherut. Instead of going straight from school to the army, they spend a year working in communities across the country.\n\nThe volunteers live together in small groups, often in apartments in development towns or poorer neighbourhoods. During the day they help in schools, youth clubs, hospitals and centres for people with disabilities. In the evenings they plan activities, cook for each other and discuss what they have learned. They receive no salary, only a small amount of money for basic expenses.\n\nSupporters of the programme say that it benefits both sides. Communities receive enthusiastic young helpers, while the volunteers gain experience that no classroom can provide. Many say that they became more independent, learned to solve problems and discovered what kind of career they would like in the future. Army officers have also noticed that soldiers who completed a service year are often more mature and are more likely to be chosen for leadership roles.\n\nNot everyone can take part, however. Places are limited, and some young people feel pressure to begin earning money as soon as possible. Noa, a former volunteer from Haifa, admits that the year was not always easy. \"There were days I wanted to go home,\" she says. \"But it was the year I grew up.\"","מדי שנה, אלפי צעירים ישראלים בני שמונה־עשרה דוחים את שירותם הצבאי בשנים־עשר חודשים כדי להתנדב ב\"שנת שירות\". במקום לעבור ישר מבית הספר לצבא, הם מבלים שנה בעבודה בקהילות ברחבי הארץ.\n\nהמתנדבים גרים יחד בקבוצות קטנות, לעיתים קרובות בדירות בעיירות פיתוח או בשכונות חלשות. במהלך היום הם עוזרים בבתי ספר, במועדוני נוער, בבתי חולים ובמרכזים לאנשים עם מוגבלויות. בערבים הם מתכננים פעילויות, מבשלים זה לזה ומשוחחים על מה שלמדו. הם אינם מקבלים משכורת, אלא רק סכום כסף קטן להוצאות בסיסיות.\n\nתומכי התוכנית אומרים שהיא מועילה לשני הצדדים. הקהילות מקבלות עוזרים צעירים ונלהבים, והמתנדבים צוברים ניסיון שאף כיתה אינה יכולה לספק. רבים מספרים שהפכו לעצמאיים יותר, למדו לפתור בעיות וגילו באיזו קריירה ירצו לעסוק בעתיד. גם קצינים בצבא הבחינו שחיילים שהשלימו שנת שירות הם לעיתים קרובות בוגרים יותר, ויש סיכוי גבוה יותר שייבחרו לתפקידי פיקוד.\n\nעם זאת, לא כולם יכולים להשתתף. מספר המקומות מוגבל, וחלק מהצעירים מרגישים לחץ להתחיל להרוויח כסף מוקדם ככל האפשר. נועה, מתנדבת לשעבר מחיפה, מודה שהשנה לא תמיד הייתה קלה. \"היו ימים שרציתי לחזור הביתה,\" היא אומרת. \"אבל זו הייתה השנה שבה התבגרתי.\"",[["What is the main purpose of the passage?","To describe the service year and its benefits","To criticize the Israeli army","To explain how to rent an apartment","To compare the salaries of young workers"],["What do the volunteers receive for their work?","A small sum for basic expenses","A full monthly salary","A free university degree","A shorter military service"],["In the sentence 'They receive no salary, only a small amount of money for basic expenses', what does 'They' refer to?","the volunteers","the communities","the army officers","people with disabilities"],["Why might some young people not join a service year?","They feel pressure to start earning money","They are not allowed to live in groups","The army does not permit it","A service year lasts several years"]],"A Year Before the Uniform"],["When the \"like\" button first appeared on social media, it seemed like a small and harmless feature. A single click allowed users to show that they enjoyed a photo or agreed with a comment. Today, billions of likes are given every day, and psychologists are studying how this simple tool affects the way we think and feel.\n\nResearch shows that receiving likes activates the brain's reward system, the same area that responds to tasty food or winning money. Because the reward is unpredictable, users keep checking their phones to see whether new likes have arrived. This pattern helps explain why many people find it so hard to put their phones down.\n\nTeenagers may be especially sensitive. In one experiment, young participants were shown photos that had either many or few likes. They tended to prefer the popular photos, even when the pictures were almost identical. The results suggest that the number of likes can shape our opinions without our noticing.\n\nSome platforms have responded by allowing users to hide the number of likes on their posts. Early reports indicate that this reduces pressure for some users, although others say they miss the feedback.\n\nExperts do not recommend abandoning social media altogether. Instead, they suggest using it more consciously: turning off notifications, setting time limits and remembering that the value of a post, or of a person, is not measured by a number.","כאשר כפתור ה\"לייק\" הופיע לראשונה ברשתות החברתיות, הוא נראה כמו תכונה קטנה ותמימה. לחיצה אחת אפשרה למשתמשים להראות שנהנו מתמונה או שהסכימו עם תגובה. כיום ניתנים מיליארדי לייקים בכל יום, ופסיכולוגים חוקרים כיצד הכלי הפשוט הזה משפיע על הדרך שבה אנחנו חושבים ומרגישים.\n\nמחקרים מראים שקבלת לייקים מפעילה את מערכת התגמול של המוח, אותו אזור שמגיב לאוכל טעים או לזכייה בכסף. מכיוון שהתגמול אינו צפוי, המשתמשים ממשיכים לבדוק את הטלפון כדי לראות אם הגיעו לייקים חדשים. הדפוס הזה עוזר להסביר מדוע לאנשים רבים כל כך קשה להניח את הטלפון.\n\nייתכן שמתבגרים רגישים במיוחד. בניסוי אחד הוצגו למשתתפים צעירים תמונות שקיבלו הרבה לייקים או מעט לייקים. הם נטו להעדיף את התמונות הפופולריות, גם כשהתמונות היו כמעט זהות. התוצאות מרמזות שמספר הלייקים יכול לעצב את דעותינו מבלי שנשים לב.\n\nחלק מהפלטפורמות הגיבו בכך שאפשרו למשתמשים להסתיר את מספר הלייקים בפוסטים שלהם. דיווחים ראשונים מצביעים על כך שהדבר מפחית את הלחץ אצל חלק מהמשתמשים, אם כי אחרים אומרים שהם מתגעגעים למשוב.\n\nהמומחים אינם ממליצים לנטוש את הרשתות החברתיות לגמרי. במקום זאת, הם מציעים להשתמש בהן באופן מודע יותר: לכבות התראות, לקבוע מגבלות זמן ולזכור שהערך של פוסט, או של אדם, אינו נמדד במספר.",[["According to the passage, why do users keep checking their phones?","Because the reward from likes is unpredictable","Because they are paid money for likes","Because notifications cannot be turned off","Because photos disappear very quickly"],["What did the experiment with young participants show?","Likes influenced which photos they preferred","They could not tell any photos apart","They disliked the popular photos","They decided to stop using social media"],["The word 'identical' in the third paragraph is closest in meaning to...","exactly the same","very popular","completely different","badly taken"],["What do the experts recommend?","Using social media in a more aware way","Deleting all social media accounts","Giving more likes to friends","Posting photos only at night"]],"The Power of the Like Button"],["Long before telephones and the internet, people needed fast ways to send important messages. One of the most reliable solutions was surprisingly simple: the homing pigeon.\n\nHoming pigeons have an extraordinary ability to find their way back to their home loft, even when they are released hundreds of kilometres away. Scientists are still not completely sure how they do it. Some believe the birds use the position of the sun, while others think they can sense the Earth's magnetic field. Most likely, they combine several methods.\n\nAncient civilisations were already aware of this talent. Pigeons were used to announce the results of sporting competitions and to carry news between cities. Centuries later, businesses used them to deliver financial information faster than horses could.\n\nPigeons proved most valuable, however, during wartime. When telephone lines were cut and radio signals could be intercepted by the enemy, small messages were tied to the birds' legs. Many pigeons were shot down or lost in storms, but enough of them arrived to save thousands of lives. Several birds were even given medals for bravery.\n\nToday, pigeons are rarely used for communication, but the sport of pigeon racing remains popular in some countries, where owners train their birds for years. Their story is a reminder that sometimes the most effective technology is the one that nature has already invented.","הרבה לפני הטלפונים והאינטרנט, אנשים נזקקו לדרכים מהירות לשלוח הודעות חשובות. אחד הפתרונות האמינים ביותר היה פשוט באופן מפתיע: יונת הדואר.\n\nליונֵי דואר יש יכולת יוצאת דופן למצוא את דרכן חזרה לשובך הביתי, גם כשהן משוחררות במרחק מאות קילומטרים. המדענים עדיין אינם בטוחים לגמרי כיצד הן עושות זאת. יש הסבורים שהציפורים משתמשות במיקום השמש, ואחרים חושבים שהן מסוגלות לחוש את השדה המגנטי של כדור הארץ. ככל הנראה, הן משלבות כמה שיטות.\n\nתרבויות עתיקות כבר היו מודעות לכישרון הזה. יונים שימשו כדי להודיע על תוצאות של תחרויות ספורט וכדי להעביר חדשות בין ערים. מאות שנים מאוחר יותר, עסקים השתמשו בהן כדי להעביר מידע פיננסי מהר יותר ממה שסוסים יכלו.\n\nאולם היונים הוכיחו את ערכן הרב ביותר בזמן מלחמה. כאשר קווי טלפון נותקו ואותות רדיו יכלו להיות מיורטים על ידי האויב, נקשרו הודעות קטנות לרגלי הציפורים. יונים רבות נורו או אבדו בסערות, אבל מספיק מהן הגיעו כדי להציל אלפי חיים. כמה ציפורים אף קיבלו מדליות על אומץ.\n\nכיום, כמעט שאין משתמשים ביונים לתקשורת, אבל ספורט מרוצי היונים נשאר פופולרי בכמה מדינות, שבהן בעלי היונים מאמנים את הציפורים שלהם במשך שנים. סיפורן מזכיר לנו שלפעמים הטכנולוגיה היעילה ביותר היא זו שהטבע כבר המציא.",[["What is the passage mainly about?","How pigeons were used to carry messages","Why pigeons are a problem in cities","The invention of the telephone","How racing horses are trained"],["What does the passage say about how pigeons find their way home?","Scientists are not fully sure how they do it","They follow roads and rivers only","They are guided by their owners","They use only the stars at night"],["In the sentence 'Scientists are still not completely sure how they do it', what does 'they' refer to?","homing pigeons","scientists","ancient civilisations","telephones"],["Why were pigeons especially useful in wartime?","Other ways of communicating could be cut or intercepted","They could fly faster than airplanes","They were never shot down by the enemy","Soldiers did not know how to read"]],"Wings Before Wires"],["Ask a group of teenagers what they want to be when they grow up, and you may hear answers that would have confused people fifty years ago: drone pilot, app developer, data scientist, social media manager. None of these professions existed in their current form when today's grandparents were choosing their careers.\n\nTechnology is the main reason for this change. As new tools are invented, new kinds of work appear around them. At the same time, some older jobs, such as telephone operators and typists, have almost disappeared. Experts predict that this process will speed up in the coming decades, especially as artificial intelligence takes over routine tasks.\n\nThis creates a challenge for schools. How can teachers prepare students for jobs that do not exist yet? Many educators believe the answer is to focus less on memorising facts and more on skills that can be used in any field. These include critical thinking, creativity, teamwork and the ability to keep learning throughout life.\n\nCareer counsellors also advise young people not to worry too much about choosing the \"perfect\" profession at eighteen. Most adults today change careers several times. Daniel, a 34-year-old who studied history and now designs video games, says his first degree was not wasted. \"History taught me how to tell a story,\" he explains. \"That's exactly what a good game needs.\"","שאלו קבוצת בני נוער מה הם רוצים להיות כשיגדלו, ואולי תשמעו תשובות שהיו מבלבלות אנשים לפני חמישים שנה: מטיס רחפנים, מפתח אפליקציות, מדען נתונים, מנהל רשתות חברתיות. אף אחד מהמקצועות האלה לא היה קיים בצורתו הנוכחית כאשר הסבים והסבתות של היום בחרו את הקריירה שלהם.\n\nהטכנולוגיה היא הסיבה העיקרית לשינוי הזה. ככל שמומצאים כלים חדשים, צצים סביבם סוגים חדשים של עבודה. במקביל, כמה מקצועות ותיקים, כמו מרכזניות טלפון וקלדניות, כמעט נעלמו. מומחים צופים שהתהליך הזה יואץ בעשורים הקרובים, במיוחד כאשר הבינה המלאכותית תשתלט על משימות שגרתיות.\n\nהדבר יוצר אתגר לבתי הספר. כיצד יכולים מורים להכין תלמידים למקצועות שעדיין אינם קיימים? מחנכים רבים מאמינים שהתשובה היא להתמקד פחות בשינון עובדות ויותר במיומנויות שאפשר להשתמש בהן בכל תחום. אלה כוללות חשיבה ביקורתית, יצירתיות, עבודת צוות והיכולת להמשיך ללמוד לאורך כל החיים.\n\nגם יועצי קריירה ממליצים לצעירים לא לדאוג יותר מדי לגבי בחירת המקצוע \"המושלם\" בגיל שמונה־עשרה. רוב המבוגרים כיום מחליפים קריירה כמה פעמים. דניאל, בן 34 שלמד היסטוריה וכיום מעצב משחקי וידאו, אומר שהתואר הראשון שלו לא הלך לאיבוד. \"ההיסטוריה לימדה אותי איך לספר סיפור,\" הוא מסביר. \"וזה בדיוק מה שמשחק טוב צריך.\"",[["What is the passage mainly about?","Changes in the world of work and how to prepare for them","The history of the telephone industry","Why grandparents dislike technology","How to become a drone pilot"],["Which skills do many educators want schools to focus on?","Critical thinking, creativity and teamwork","Memorising facts and dates","Typing and operating telephones","Computer programming only"],["In the sentence 'new kinds of work appear around them', what does 'them' refer to?","new tools","older jobs","teenagers","grandparents"],["Why does the writer mention Daniel?","To show that earlier studies can help in a new career","To prove that history degrees are useless","To advertise a video game company","To show that people should never change jobs"]],"Jobs Your Grandparents Never Heard Of"],["In almost every sport, from football to basketball, teams win more often when they play in their own stadium. This phenomenon, known as \"home advantage\", has been recorded for over a century. But what exactly causes it?\n\nFor a long time, many fans believed that the noise of the crowd gave home players extra energy. While this may be part of the explanation, researchers have discovered that the crowd might affect referees even more than players. In one study, experienced referees watched videos of football fouls. Half of them watched with the sound of a loud crowd, and half watched in silence. Those who heard the crowd gave fewer fouls against the home team.\n\nOther factors also seem to matter. Visiting teams often have to travel long distances, which can cause tiredness. Home players are familiar with their own field, the weather and even the local food. They also sleep in their own beds before a game.\n\nAn unusual opportunity to test these ideas came when many matches were played in empty stadiums during the COVID-19 pandemic. Without fans, home advantage became noticeably smaller in several leagues, and referees' decisions became more balanced. This supported the theory that crowds play an important role.\n\nStill, home advantage has not disappeared completely, which suggests that travel and familiarity continue to make a difference.","כמעט בכל ענף ספורט, מכדורגל ועד כדורסל, קבוצות מנצחות לעיתים קרובות יותר כשהן משחקות באצטדיון שלהן. התופעה הזו, המכונה \"יתרון הביתיות\", מתועדת כבר יותר ממאה שנה. אבל מה בדיוק גורם לה?\n\nבמשך זמן רב, אוהדים רבים האמינו שרעש הקהל נותן לשחקני הבית אנרגיה נוספת. אף שייתכן שזה חלק מההסבר, חוקרים גילו שהקהל עשוי להשפיע על השופטים אפילו יותר מאשר על השחקנים. במחקר אחד צפו שופטים מנוסים בסרטונים של עבירות בכדורגל. מחציתם צפו עם קול של קהל רועש, ומחציתם צפו בשקט. אלה ששמעו את הקהל שרקו פחות עבירות נגד הקבוצה המארחת.\n\nנראה שגם גורמים אחרים משפיעים. קבוצות אורחות נאלצות לעיתים קרובות לנסוע מרחקים ארוכים, מה שעלול לגרום לעייפות. שחקני הבית מכירים את המגרש שלהם, את מזג האוויר ואפילו את האוכל המקומי. הם גם ישנים במיטות שלהם לפני משחק.\n\nהזדמנות יוצאת דופן לבדוק את הרעיונות האלה הגיעה כאשר משחקים רבים נערכו באצטדיונים ריקים בזמן מגפת הקורונה. ללא אוהדים, יתרון הביתיות הצטמצם באופן ניכר בכמה ליגות, והחלטות השופטים נעשו מאוזנות יותר. הדבר תמך בתיאוריה שלקהל יש תפקיד חשוב.\n\nובכל זאת, יתרון הביתיות לא נעלם לגמרי, מה שמרמז שהנסיעות וההיכרות עם המקום ממשיכים להשפיע.",[["What did the study with referees find?","Crowd noise led to fewer fouls against the home team","Referees preferred to work in silence","Referees gave more fouls to the home team when it was loud","Videos were not useful for training referees"],["The word 'phenomenon' in the first paragraph means...","something that happens and can be observed","a famous sports team","a kind of stadium","a rule in football"],["Why were the empty stadiums during the pandemic important for research?","They made it possible to test games without crowds","They made travel impossible for visiting teams","They proved that home advantage never existed","They gave referees more time to rest"],["What can we learn from the last paragraph?","Crowds are not the only cause of home advantage","Home advantage disappeared after the pandemic","Travel has no effect on players","Fans are no longer important in sport"]],"Playing at Home"],["Yogurt, cheese, bread, pickles and soy sauce may seem to have little in common. Yet they all depend on the same natural process: fermentation. In fermentation, tiny living organisms such as bacteria and yeast break down sugars in food, changing its taste, texture and smell.\n\nHumans have been fermenting food for thousands of years, long before anyone knew that microorganisms existed. In the past, fermentation was mainly a way to preserve food. Without refrigerators, fresh milk or vegetables would spoil within days. Once fermented, however, they could last for weeks or even months. This allowed communities to survive long winters and periods of poor harvest.\n\nEvery culture developed its own fermented foods, often based on local ingredients. Korean kimchi is made from cabbage and spices, while Eastern European families traditionally pickled cucumbers in salty water. In the Middle East, people have long enjoyed labneh, a thick yogurt cheese.\n\nIn recent years, fermentation has become fashionable again. Some researchers believe that certain fermented foods may support healthy digestion, since they contain helpful bacteria. However, scientists warn that more studies are needed before strong claims can be made, and that not all products sold in supermarkets contain live bacteria.\n\nFor many home cooks, the attraction is simpler. Making your own pickles is cheap, creative and connects you to generations of people who did exactly the same.","יוגורט, גבינה, לחם, חמוצים ורוטב סויה עשויים להיראות כמי שיש להם מעט מן המשותף. ובכל זאת, כולם תלויים באותו תהליך טבעי: תסיסה. בתהליך התסיסה, אורגניזמים חיים זעירים כמו חיידקים ושמרים מפרקים סוכרים במזון, ומשנים את טעמו, את המרקם שלו ואת ריחו.\n\nבני אדם מתסיסים מזון כבר אלפי שנים, הרבה לפני שמישהו ידע שמיקרואורגניזמים קיימים. בעבר, התסיסה הייתה בעיקר דרך לשמר מזון. ללא מקררים, חלב טרי או ירקות היו מתקלקלים תוך ימים ספורים. אולם לאחר שהותססו, הם יכלו להחזיק מעמד שבועות ואפילו חודשים. הדבר אפשר לקהילות לשרוד חורפים ארוכים ותקופות של יבול דל.\n\nכל תרבות פיתחה מזונות מותססים משלה, לעיתים קרובות על בסיס מרכיבים מקומיים. הקימצ'י הקוריאני עשוי מכרוב ותבלינים, ואילו משפחות במזרח אירופה נהגו לכבוש מלפפונים במי מלח. במזרח התיכון, אנשים נהנים מזה זמן רב מלבנה, גבינת יוגורט סמיכה.\n\nבשנים האחרונות, התסיסה חזרה להיות אופנתית. יש חוקרים הסבורים שמזונות מותססים מסוימים עשויים לתמוך בעיכול בריא, משום שהם מכילים חיידקים מועילים. עם זאת, מדענים מזהירים שנדרשים מחקרים נוספים לפני שאפשר יהיה לטעון טענות חד־משמעיות, ושלא כל המוצרים הנמכרים בסופרמרקטים מכילים חיידקים חיים.\n\nעבור טבחים ביתיים רבים, המשיכה פשוטה יותר. הכנת חמוצים בעצמך היא זולה, יצירתית ומחברת אותך לדורות של אנשים שעשו בדיוק את אותו הדבר.",[["According to the passage, what was the main reason for fermenting food in the past?","To keep food from spoiling","To make food more colourful","To sell food to other countries","To grow more vegetables"],["In the sentence 'Once fermented, however, they could last for weeks or even months', what does 'they' refer to?","fresh milk or vegetables","refrigerators","communities","microorganisms"],["What does the writer say about the health benefits of fermented foods?","They are possible but need more research","They have been fully proven","They are completely false","They exist only in supermarket products"],["Why does the writer mention kimchi, pickled cucumbers and labneh?","To show that many cultures have fermented foods","To give a recipe for each food","To show which food is the healthiest","To explain how refrigerators work"]],"The Ancient Art of Fermentation"],["For many tourists, a holiday means visiting as many places as possible in the shortest time. They rush from one famous site to the next, take hundreds of photos and return home more exhausted than when they left. A growing movement known as \"slow travel\" suggests a different approach.\n\nSlow travellers choose to stay longer in fewer places. Rather than seeing five cities in a week, they might spend the entire week in one small town. They rent an apartment instead of staying in a hotel, shop at local markets and try to learn a few words of the local language. The goal is not to collect destinations but to experience daily life in a new place.\n\nSupporters argue that this style of travel has several advantages. It is often cheaper, because long-term rentals cost less per night and travellers spend less on transport. It is also better for the environment, especially when people take trains instead of short flights. Perhaps most importantly, it allows for real connections with local people.\n\nCritics point out that not everyone has the time or freedom to travel slowly. Many workers receive only a few days of vacation each year. Even so, the principles can be applied to shorter trips as well. Choosing one neighbourhood to explore deeply, rather than racing across a city, can turn an ordinary weekend into a memorable experience.","עבור תיירים רבים, חופשה פירושה לבקר בכמה שיותר מקומות בזמן הקצר ביותר. הם ממהרים מאתר מפורסם אחד לאחר, מצלמים מאות תמונות וחוזרים הביתה מותשים יותר מאשר כשיצאו. תנועה הולכת וגדלה המכונה \"תיירות איטית\" מציעה גישה אחרת.\n\nמטיילים איטיים בוחרים לשהות זמן רב יותר בפחות מקומות. במקום לראות חמש ערים בשבוע, הם עשויים לבלות את כל השבוע בעיירה קטנה אחת. הם שוכרים דירה במקום לשהות בבית מלון, קונים בשווקים מקומיים ומנסים ללמוד כמה מילים בשפה המקומית. המטרה אינה לאסוף יעדים אלא לחוות את חיי היומיום במקום חדש.\n\nהתומכים טוענים שלסגנון הטיול הזה יש כמה יתרונות. לעיתים קרובות הוא זול יותר, משום שהשכרה לטווח ארוך עולה פחות ללילה והמטיילים מוציאים פחות על תחבורה. הוא גם טוב יותר לסביבה, במיוחד כאשר אנשים נוסעים ברכבות במקום בטיסות קצרות. ואולי החשוב מכול, הוא מאפשר קשרים אמיתיים עם המקומיים.\n\nהמבקרים מציינים שלא לכולם יש את הזמן או החופש לטייל לאט. עובדים רבים מקבלים רק ימי חופשה ספורים בכל שנה. ובכל זאת, אפשר ליישם את העקרונות גם בטיולים קצרים יותר. בחירה בשכונה אחת לחקור לעומק, במקום לרוץ ממקום למקום ברחבי העיר, יכולה להפוך סוף שבוע רגיל לחוויה בלתי נשכחת.",[["What is the passage mainly about?","A way of travelling that focuses on depth, not speed","The cheapest hotels in Europe","How to take better holiday photos","Why trains are faster than planes"],["According to the passage, why is slow travel often cheaper?","Long rentals cost less and transport costs are lower","Local markets give tourists free food","Hotels offer special discounts to slow travellers","Flights are cheaper for long trips"],["The word 'exhausted' in the first paragraph means...","very tired","very happy","very rich","very bored"],["What does the writer suggest for people with little vacation time?","Explore one area deeply, even on short trips","Stop travelling completely","Visit as many cities as possible","Wait until they retire to travel"]],"The Case for Slow Travel"],["When a honeybee discovers a field full of flowers, it faces a problem: how can it tell the other bees in the hive where to find the food? Bees cannot speak, yet they have developed one of the most remarkable communication systems in the animal world.\n\nBack in the hive, the bee performs a special movement known as the \"waggle dance\". It walks in a straight line while shaking its body from side to side, then circles back and repeats the movement. Researchers discovered in the twentieth century that this dance contains precise information. The direction of the straight line shows the direction of the flowers in relation to the sun. The length of the waggle tells the other bees how far away the food is.\n\nOther bees gather around the dancer, follow its movements and then fly directly to the right place, sometimes several kilometres away. The discovery was so surprising that many scientists did not believe it at first. It took years of careful experiments before the idea was widely accepted.\n\nToday, researchers study the waggle dance for practical reasons as well. By \"reading\" the dances, they can learn which areas provide bees with food. This information helps farmers and environmental groups protect bee populations, which have declined in many parts of the world. Since bees pollinate a large part of the crops we eat, their survival matters to us all.","כאשר דבורת דבש מגלה שדה מלא פרחים, היא ניצבת בפני בעיה: כיצד תוכל לספר לדבורים האחרות בכוורת היכן למצוא את המזון? דבורים אינן יכולות לדבר, ובכל זאת הן פיתחו את אחת ממערכות התקשורת המדהימות ביותר בעולם החי.\n\nכשהיא חוזרת לכוורת, הדבורה מבצעת תנועה מיוחדת הנקראת \"ריקוד הכשכוש\". היא הולכת בקו ישר תוך כדי שהיא מנענעת את גופה מצד לצד, ואז מסתובבת בחזרה וחוזרת על התנועה. חוקרים גילו במאה העשרים שהריקוד הזה מכיל מידע מדויק. כיוון הקו הישר מראה את כיוון הפרחים ביחס לשמש. אורך הכשכוש אומר לדבורים האחרות כמה רחוק נמצא המזון.\n\nדבורים אחרות מתאספות סביב הרקדנית, עוקבות אחר תנועותיה ואז עפות ישירות למקום הנכון, לפעמים במרחק כמה קילומטרים. התגלית הייתה מפתיעה כל כך, שמדענים רבים לא האמינו לה בהתחלה. נדרשו שנים של ניסויים קפדניים עד שהרעיון התקבל באופן רחב.\n\nכיום, חוקרים לומדים את ריקוד הכשכוש גם מסיבות מעשיות. על ידי \"קריאת\" הריקודים, הם יכולים ללמוד אילו אזורים מספקים מזון לדבורים. מידע זה עוזר לחקלאים ולארגוני סביבה להגן על אוכלוסיות הדבורים, שהצטמצמו באזורים רבים בעולם. מכיוון שדבורים מאביקות חלק גדול מהגידולים שאנו אוכלים, הישרדותן חשובה לכולנו.",[["According to the passage, what does the length of the waggle show?","How far away the food is","Where the sun is in the sky","How many flowers there are","How old the dancing bee is"],["In the sentence 'It walks in a straight line while shaking its body from side to side', what does 'It' refer to?","the bee","the hive","the field","the sun"],["What can we understand from 'many scientists did not believe it at first'?","The idea seemed too surprising to be true","The scientists did not like bees","The experiments were never repeated","The dance was invented by researchers"],["According to the writer, why should people care about the survival of bees?","Bees pollinate many of the crops we eat","Bees produce most of our medicines","Bees are needed to train researchers","Bees protect farmers from other insects"]],"The Dance of the Honeybee"]],"C":[["Although it was raining heavily, the match ___ cancelled.","was not","did not","has not","were not","למרות שירד גשם חזק, המשחק לא בוטל."],["If I ___ more free time, I would learn to play the guitar.","had","have","will have","would have","אילו היה לי יותר זמן פנוי, הייתי לומד לנגן בגיטרה."],["___ the bad weather, thousands of fans came to the concert.","Despite","Although","However","Because","למרות מזג האוויר הגרוע, אלפי מעריצים הגיעו להופעה."],["The new bridge ___ by the end of next year.","will be completed","will complete","is completing","completed","הגשר החדש יושלם עד סוף השנה הבאה."],["She has been working at the hospital ___ 2019.","since","for","from","during","היא עובדת בבית החולים מאז 2019."],["The museum was very crowded; ___, we managed to see most of the exhibits.","however","because","although","unless","המוזיאון היה צפוף מאוד; עם זאת, הצלחנו לראות את רוב המוצגים."],["Regular exercise can improve both physical and mental ___.","health","healthy","healthily","heal","פעילות גופנית סדירה יכולה לשפר את הבריאות הגופנית והנפשית כאחד."],["By the time we arrived at the station, the train ___.","had already left","has already left","already leaves","will leave","עד שהגענו לתחנה, הרכבת כבר יצאה."],["Many young people are interested ___ careers in technology.","in","on","at","for","צעירים רבים מתעניינים בקריירות בתחום הטכנולוגיה."],["If you heat ice, it ___.","melts","melted","melting","has melt","אם מחממים קרח, הוא נמס."],["The scientist made an important ___ about the behaviour of whales.","discovery","discover","discovered","discovering","המדענית גילתה תגלית חשובה על התנהגותם של לווייתנים."],["You should wear a helmet ___ you ride a bicycle.","whenever","unless","despite","so that","כדאי לחבוש קסדה בכל פעם שאתה רוכב על אופניים."],["The letter ___ two hundred years ago was found in an old library.","written","writing","wrote","writes","המכתב שנכתב לפני מאתיים שנה נמצא בספרייה ישנה."],["If she had studied harder, she ___ the exam.","would have passed","would pass","will pass","had passed","אילו הייתה לומדת קשה יותר, הייתה עוברת את הבחינה."],["Tom is not used to ___ up so early in the morning.","getting","get","got","be getting","טום אינו רגיל לקום כל כך מוקדם בבוקר."],["The city has become much more ___ over the past decade, with new parks and bike lanes.","attractive","attract","attraction","attractively","העיר הפכה לאטרקטיבית הרבה יותר בעשור האחרון, עם פארקים חדשים ושבילי אופניים."],["Neither the teacher ___ the students knew the answer.","nor","or","and","but","לא המורה ולא התלמידים ידעו את התשובה."],["Plastic bags ___ in many countries in recent years.","have been banned","have banned","are banning","were banning","שקיות פלסטיק נאסרו לשימוש במדינות רבות בשנים האחרונות."],["I'm looking forward ___ you at the conference next month.","to seeing","to see","seeing","for seeing","אני מצפה לראות אותך בכנס בחודש הבא."],["The film was so ___ that half the audience fell asleep.","boring","bored","bore","boredom","הסרט היה כל כך משעמם שחצי מהקהל נרדם."],["She decided to take the job ___ the salary was lower than she had hoped.","even though","despite","in spite of","because of","היא החליטה לקבל את העבודה למרות שהמשכורת הייתה נמוכה ממה שקיוותה."],["Our flight was delayed ___ a technical problem.","because of","because","although","so","הטיסה שלנו התעכבה בגלל תקלה טכנית."],["While I ___ dinner, the phone rang.","was cooking","cooked","am cooking","have cooked","בזמן שבישלתי ארוחת ערב, הטלפון צלצל."],["The volunteers, ___ came from all over the country, cleaned the beach in one day.","who","which","whose","what","המתנדבים, שהגיעו מכל רחבי הארץ, ניקו את החוף ביום אחד."],["Unless we reduce pollution, many species ___ extinct.","will become","became","would have become","becoming","אם לא נפחית את הזיהום, מינים רבים ייכחדו."],["He apologized ___ being late to the meeting.","for","with","of","on","הוא התנצל על כך שאיחר לפגישה."],["The ___ of the new hospital will create hundreds of jobs.","construction","construct","constructive","constructed","בנייתו של בית החולים החדש תיצור מאות מקומות עבודה."],["It's the most interesting book I ___ read.","have ever","ever had","had ever","am ever","זה הספר הכי מעניין שקראתי אי פעם."],["Students are required ___ their phones off during the exam.","to turn","turning","turn","to turning","התלמידים נדרשים לכבות את הטלפונים שלהם במהלך הבחינה."],["The research was carried out ___ a team of international scientists.","by","from","at","of","המחקר נערך על ידי צוות של מדענים בינלאומיים."]],"RS":[]},"h12":{"R":[["For decades, doctors have assumed that a placebo works only when the patient is deceived. A sugar pill, the reasoning goes, can relieve pain or anxiety because the person swallowing it believes it contains real medicine. Remove the belief, and the effect should disappear. In recent years, however, a small but growing body of research has challenged this assumption in a surprising way.\n\nIn several trials, researchers gave patients pills that were openly labelled as placebos. The participants, who suffered from conditions such as chronic back pain and irritable bowel syndrome, were told plainly that the capsules contained no active ingredient. They were also told that placebos had produced improvements in earlier studies, possibly through the body's automatic responses to the ritual of taking medicine. To the surprise of many, a significant number of these patients reported less pain and better daily functioning than a comparison group that received no pills at all.\n\nHow can this be explained? One theory holds that the act of treatment itself, the visit to a caring professional and the routine of swallowing a pill twice a day, triggers expectations that the brain cannot simply switch off. Even when we know a pill is empty, years of experience have taught our bodies to associate medicine with relief.\n\nCritics urge caution. Most of the studies have been small, and the improvements were measured largely through patients' own reports rather than objective tests. Pain is real, they argue, but so is the desire to please researchers who have been kind to you.\n\nNevertheless, the findings raise an intriguing ethical possibility. If placebos can help without deception, doctors may one day prescribe them honestly, avoiding the moral problem that has always surrounded their use. Such a development would not replace conventional treatment, but it might remind medicine that healing involves more than chemistry.","במשך עשרות שנים הניחו רופאים שפלצבו פועל רק כאשר המטופל מרומה. גלולת סוכר, כך נטען, יכולה להקל על כאב או חרדה משום שהאדם שבולע אותה מאמין שהיא מכילה תרופה אמיתית. הסירו את האמונה, והאפקט אמור להיעלם. אולם בשנים האחרונות, גוף מחקר קטן אך הולך וגדל ערער על הנחה זו באופן מפתיע.\n\nבכמה ניסויים נתנו חוקרים למטופלים גלולות שסומנו בגלוי כפלצבו. למשתתפים, שסבלו ממצבים כמו כאבי גב כרוניים ותסמונת המעי הרגיז, נאמר במפורש שהכמוסות אינן מכילות שום חומר פעיל. כמו כן נאמר להם שפלצבו הביא לשיפור במחקרים קודמים, אולי באמצעות התגובות האוטומטיות של הגוף לטקס נטילת התרופה. להפתעת רבים, מספר משמעותי מהמטופלים הללו דיווחו על פחות כאב ועל תפקוד יומיומי טוב יותר בהשוואה לקבוצת ביקורת שלא קיבלה גלולות כלל.\n\nכיצד ניתן להסביר זאת? לפי תיאוריה אחת, פעולת הטיפול עצמה, הביקור אצל איש מקצוע אכפתי והשגרה של בליעת גלולה פעמיים ביום, מעוררת ציפיות שהמוח אינו יכול פשוט לכבות. גם כשאנו יודעים שהגלולה ריקה, שנים של ניסיון לימדו את גופנו לקשר בין תרופה להקלה.\n\nהמבקרים קוראים לזהירות. רוב המחקרים היו קטנים, והשיפור נמדד בעיקר באמצעות דיווחים של המטופלים עצמם ולא בבדיקות אובייקטיביות. הכאב אמיתי, הם טוענים, אבל כך גם הרצון לרַצות חוקרים שהתייחסו אליך בחביבות.\n\nעל אף זאת, הממצאים מעלים אפשרות אתית מסקרנת. אם פלצבו יכול לעזור ללא הטעיה, רופאים עשויים יום אחד לרשום אותו בכנות, ולהימנע מהבעיה המוסרית שתמיד ליוותה את השימוש בו. התפתחות כזו לא תחליף את הטיפול המקובל, אך היא עשויה להזכיר לרפואה שריפוי כרוך ביותר מכימיה בלבד.",[["What is the passage mainly about?","Research suggesting placebos may work even when patients know about them","The dangers of giving patients sugar pills without their consent","Why chronic back pain is so difficult to treat","How new medicines are replacing conventional treatment"],["What were the patients in the trials told about the capsules?","That they contained no active ingredient","That they were a new type of painkiller","That they might contain real medicine","Nothing at all about their contents"],["In the sentence 'Remove the belief, and the effect should disappear', what does 'the belief' refer to?","The patient's belief that the pill contains real medicine","The doctor's belief that placebos are useless","The researchers' belief in open-label trials","The public's belief that sugar is harmful"],["The word 'triggers' in paragraph 3 is closest in meaning to…","sets off","prevents","measures","hides"],["Why do critics mention 'the desire to please researchers'?","Patients may have exaggerated their improvement to satisfy kind researchers","Researchers paid patients to take part in the trials","Patients refused to take pills without a real ingredient","Researchers were unkind to the comparison group"]],"The Honest Placebo"],["Imagine being able to reach almost everything you need, from a grocery store and a school to a doctor and a park, within a fifteen-minute walk or bicycle ride from your home. This is the central idea behind the 'fifteen-minute city', an approach to urban planning that has attracted the attention of mayors and architects around the world.\n\nFor much of the twentieth century, cities were designed around the private car. Planners separated neighbourhoods by function: people lived in one area, worked in another and shopped in a third, connected by wide roads and highways. This model promised freedom and efficiency, but it also produced traffic jams, air pollution and long daily commutes that consumed hours of people's lives.\n\nSupporters of the fifteen-minute city argue that bringing services closer to residents would reverse these problems. Fewer car journeys would mean cleaner air and quieter streets. Local shops would benefit from regular customers, and neighbours who meet on the pavement rather than behind windscreens might develop a stronger sense of community. Some cities have already begun experimenting, turning parking spaces into small gardens and opening school playgrounds to the public after hours.\n\nThe idea, however, has not been universally welcomed. Some critics worry that it could increase inequality: wealthy districts may quickly attract new cafés and clinics, while poorer areas are left behind. Others fear that the concept could be used to justify restrictions on driving, which they see as an attack on personal freedom. Planners respond that the goal is to offer choices, not to impose limits.\n\nWhat is clear is that the debate touches on a deeper question: what is a city for? If the answer is simply moving people and goods quickly, the car-centred model may suffice. If it is about how people live together, the fifteen-minute city deserves serious consideration.","דמיינו שאתם יכולים להגיע כמעט לכל מה שאתם צריכים, ממכולת ובית ספר ועד רופא ופארק, בהליכה או ברכיבה על אופניים של רבע שעה מהבית. זה הרעיון המרכזי שמאחורי \"עיר חמש־עשרה הדקות\", גישה לתכנון עירוני שמשכה את תשומת ליבם של ראשי ערים ואדריכלים ברחבי העולם.\n\nבמשך רוב המאה העשרים תוכננו ערים סביב המכונית הפרטית. המתכננים הפרידו בין שכונות לפי ייעוד: אנשים גרו באזור אחד, עבדו באזור אחר וקנו באזור שלישי, כשכבישים רחבים ודרכים מהירות מחברים ביניהם. המודל הזה הבטיח חופש ויעילות, אך הוא גם יצר פקקי תנועה, זיהום אוויר ונסיעות יומיות ארוכות שגזלו שעות מחייהם של אנשים.\n\nתומכי עיר חמש־עשרה הדקות טוענים שקירוב השירותים לתושבים יהפוך את הבעיות הללו. פחות נסיעות ברכב פירושן אוויר נקי יותר ורחובות שקטים יותר. חנויות שכונתיות ייהנו מלקוחות קבועים, ושכנים שנפגשים על המדרכה ולא מאחורי שמשות של מכוניות עשויים לפתח תחושת קהילה חזקה יותר. כמה ערים כבר החלו להתנסות ברעיון, והפכו מקומות חניה לגינות קטנות ופתחו את חצרות בתי הספר לציבור אחרי שעות הלימודים.\n\nעם זאת, הרעיון לא התקבל בברכה על ידי כולם. חלק מהמבקרים חוששים שהוא עלול להגביר את אי־השוויון: שכונות אמידות עשויות למשוך במהירות בתי קפה ומרפאות חדשים, בעוד שאזורים עניים יותר יישארו מאחור. אחרים חוששים שהרעיון ישמש להצדקת הגבלות על נהיגה, שבהן הם רואים פגיעה בחופש האישי. המתכננים משיבים שהמטרה היא להציע אפשרויות בחירה, לא לכפות מגבלות.\n\nמה שברור הוא שהוויכוח נוגע בשאלה עמוקה יותר: לשם מה קיימת עיר? אם התשובה היא פשוט להעביר אנשים וסחורות במהירות, ייתכן שהמודל שבמרכזו המכונית מספיק. אם מדובר באופן שבו אנשים חיים יחד, עיר חמש־עשרה הדקות ראויה לשיקול רציני.",[["According to the passage, how were many twentieth-century cities organised?","Areas were separated by function and linked by roads","Homes, shops and offices were mixed in every street","Residents were encouraged to walk or cycle everywhere","Each neighbourhood had its own school and clinic"],["Why might neighbours develop a stronger sense of community in a fifteen-minute city?","They would meet face to face more often","They would share cars with each other","They would work in the same offices","They would pay lower taxes together"],["In the sentence '…restrictions on driving, which they see as an attack on personal freedom', what does 'which' refer to?","Restrictions on driving","New cafés and clinics","Inequality between districts","The fifteen-minute city's gardens"],["What is the main purpose of the fourth paragraph?","To present objections to the idea and the planners' response","To describe how cities were planned in the past","To list the environmental benefits of the idea","To explain how parking spaces become gardens"],["What does the writer suggest in the final paragraph?","The value of the idea depends on what we believe a city is for","The car-centred model has completely failed","The fifteen-minute city should be adopted everywhere immediately","Moving goods quickly is a city's most important function"]],"The Fifteen-Minute City"],["Human memory is famously unreliable. We forget names, misplace keys and reshape our recollections each time we recall them. For a long time this was seen purely as a weakness. Yet some psychologists now argue that forgetting is not a failure of memory but one of its essential functions. It allows us to move past embarrassment, to forgive, and to become different people from who we once were.\n\nDigital technology has changed this balance. A comment written carelessly at sixteen may remain searchable for decades. Photographs, messages and location records are stored on distant servers, often long after their owners have forgotten them. In effect, we have built a world that remembers everything and rarely lets us forget.\n\nThis raises difficult ethical questions. Should a person have the right to have old information about them removed from search results? Some legal systems have answered yes, at least in certain cases, allowing individuals to request that outdated or irrelevant links be hidden. Supporters claim that this protects dignity and gives people a genuine second chance.\n\nOpponents, on the other hand, warn of serious risks. If anyone can erase unflattering records, they argue, the powerful might use such laws to bury evidence of wrongdoing. Journalists and historians depend on access to the past; a society that deletes too readily may lose the ability to hold its leaders accountable.\n\nPerhaps the solution lies not in choosing between total memory and total forgetting but in designing systems that age information, much as the human mind does. Data could gradually become less visible over time unless there is a clear public interest in keeping it prominent. Such an approach would not be simple to implement. Still, it would reflect an important insight: a healthy memory, whether human or digital, depends as much on what it lets go as on what it keeps.","הזיכרון האנושי ידוע כבלתי אמין. אנו שוכחים שמות, מאבדים מפתחות ומעצבים מחדש את זיכרונותינו בכל פעם שאנו נזכרים בהם. במשך זמן רב נתפס הדבר כחולשה בלבד. אך כמה פסיכולוגים טוענים כיום שהשכחה אינה כישלון של הזיכרון אלא אחת מפונקציות היסוד שלו. היא מאפשרת לנו להתגבר על מבוכה, לסלוח, ולהפוך לאנשים שונים ממי שהיינו פעם.\n\nהטכנולוגיה הדיגיטלית שינתה את האיזון הזה. תגובה שנכתבה בפזיזות בגיל שש־עשרה עשויה להישאר זמינה בחיפוש במשך עשרות שנים. תמונות, הודעות ונתוני מיקום מאוחסנים בשרתים רחוקים, לעתים קרובות זמן רב אחרי שבעליהם שכחו מהם. למעשה, בנינו עולם שזוכר הכול ורק לעתים רחוקות מאפשר לנו לשכוח.\n\nהדבר מעלה שאלות אתיות קשות. האם צריכה להיות לאדם הזכות להסיר מידע ישן עליו מתוצאות החיפוש? כמה מערכות משפט השיבו בחיוב, לפחות במקרים מסוימים, ואפשרו לאנשים לבקש שקישורים מיושנים או לא רלוונטיים יוסתרו. התומכים טוענים שהדבר מגן על כבוד האדם ומעניק לאנשים הזדמנות שנייה אמיתית.\n\nהמתנגדים, לעומת זאת, מזהירים מפני סיכונים חמורים. אם כל אחד יכול למחוק רשומות לא מחמיאות, הם טוענים, בעלי הכוח עלולים להשתמש בחוקים כאלה כדי לקבור ראיות למעשים פסולים. עיתונאים והיסטוריונים תלויים בגישה לעבר; חברה שמוחקת בקלות רבה מדי עלולה לאבד את היכולת לדרוש ממנהיגיה לתת דין וחשבון.\n\nאולי הפתרון אינו טמון בבחירה בין זיכרון מוחלט לשכחה מוחלטת, אלא בתכנון מערכות שבהן המידע \"מזדקן\", בדומה למה שקורה במוח האנושי. נתונים יכולים להפוך בהדרגה לפחות גלויים עם הזמן, אלא אם יש עניין ציבורי ברור בהשארתם בולטים. גישה כזו לא תהיה פשוטה ליישום. ובכל זאת, היא תשקף תובנה חשובה: זיכרון בריא, בין אם אנושי ובין אם דיגיטלי, תלוי במה שהוא משחרר לא פחות מאשר במה שהוא שומר.",[["What is the passage mainly about?","Whether digital systems should allow information to be forgotten","How to improve human memory with technology","Why journalists should stop writing about the past","How search engines decide which results to show"],["According to some psychologists, what is one benefit of forgetting?","It helps people forgive and change over time","It makes people better at remembering names","It protects people from digital surveillance","It allows people to learn new skills faster"],["The word 'bury' in paragraph 4 is closest in meaning to…","hide","discover","publish","celebrate"],["Why does the writer mention journalists and historians?","To show who would be harmed if deletion were too easy","To show who supports the right to be forgotten","To give examples of people with embarrassing pasts","To explain who designs search engines"],["What solution does the writer propose in the final paragraph?","Systems in which information gradually becomes less visible","Laws that allow all personal data to be erased","Keeping every record permanently visible to everyone","Banning the storage of photographs on servers"]],"Should Machines Forget?"],["If you were asked to describe where a cup is on a table, you would probably say it is 'to the left' of the plate or 'in front of' you. These descriptions depend on the position of your own body. Surprisingly, not all languages work this way. Speakers of a number of languages around the world rarely use words like 'left' and 'right'. Instead, they describe locations using fixed directions such as north, south, east and west, even indoors and even for small objects. In such a language, one might say, 'There is an ant on your southern leg.'\n\nLinguists who have studied these communities report a remarkable consequence. Speakers of these languages tend to know which way they are facing at all times, even in unfamiliar buildings or after travelling in the dark. Children learn this skill early, because without it they simply cannot speak correctly. For them, a constant awareness of direction is not a special talent but an ordinary part of daily life.\n\nFindings like these have revived an old debate. Does the language we speak shape the way we think, or does it merely reflect it? The strong version of the claim, that language determines thought and that we cannot think what we cannot say, has largely been rejected. Speakers of every language can learn new concepts, after all. A weaker version, however, enjoys considerable support: the habits our language demands may train our attention in particular directions.\n\nThis weaker view suggests that learning a foreign language involves more than memorising vocabulary. It may also mean practising a new way of noticing the world. Whether that changes who we are is open to question, but it certainly makes the experience of learning languages richer than a list of words might suggest.","אילו התבקשתם לתאר היכן נמצא ספל על שולחן, סביר שהייתם אומרים שהוא \"משמאל\" לצלחת או \"לפניכם\". תיאורים אלה תלויים במיקום הגוף שלכם. באופן מפתיע, לא כל השפות פועלות כך. דוברי מספר שפות ברחבי העולם כמעט אינם משתמשים במילים כמו \"שמאל\" ו\"ימין\". במקום זאת, הם מתארים מיקומים באמצעות כיוונים קבועים כמו צפון, דרום, מזרח ומערב, אפילו בתוך הבית ואפילו לגבי חפצים קטנים. בשפה כזו אפשר לומר: \"יש נמלה על הרגל הדרומית שלך.\"\n\nבלשנים שחקרו קהילות אלה מדווחים על תוצאה מרשימה. דוברי השפות הללו נוטים לדעת בכל רגע לאיזה כיוון הם פונים, אפילו בבניינים לא מוכרים או אחרי נסיעה בחושך. ילדים לומדים את המיומנות הזו בגיל צעיר, כי בלעדיה הם פשוט אינם יכולים לדבר נכון. מבחינתם, מודעות מתמדת לכיוון אינה כישרון מיוחד אלא חלק רגיל מחיי היומיום.\n\nממצאים כאלה החיו ויכוח ישן. האם השפה שאנו מדברים מעצבת את האופן שבו אנו חושבים, או שהיא רק משקפת אותו? הגרסה החזקה של הטענה, שלפיה השפה קובעת את המחשבה ואיננו יכולים לחשוב את מה שאיננו יכולים לומר, נדחתה ברובה. הרי דוברי כל שפה יכולים ללמוד מושגים חדשים. לעומת זאת, גרסה מתונה יותר זוכה לתמיכה רבה: ההרגלים שהשפה שלנו דורשת עשויים לאמן את תשומת הלב שלנו לכיוונים מסוימים.\n\nהשקפה מתונה זו מרמזת שלימוד שפה זרה כרוך ביותר משינון אוצר מילים. ייתכן שהוא כרוך גם בתרגול של דרך חדשה להבחין בעולם. אם הדבר משנה את מי שאנחנו, זו שאלה פתוחה, אך הוא בהחלט הופך את חוויית לימוד השפות לעשירה יותר ממה שרשימת מילים הייתה מרמזת.",[["How do speakers of the languages described locate objects?","By using fixed directions such as north and east","By using the words 'left' and 'right'","By pointing rather than speaking","By describing the colour of nearby objects"],["In the sentence 'without it they simply cannot speak correctly', what does 'it' refer to?","Knowing which direction they are facing","A good memory for vocabulary","A special musical talent","Travelling in the dark"],["Why has the strong version
