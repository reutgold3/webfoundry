כשזה באמת הכרחי.","ru":"Я расставляю задачи по важности и срочности, заранее сообщаю о рисках и пересматриваю сроки, только когда это действительно необходимо.","ar":"أرتّب المهام حسب الأثر والإلحاح، وأنبّه إلى المخاطر مبكرًا، وأعيد التفاوض على المواعيد عند الضرورة فقط."},{"q":"Why are you thinking of leaving your current position?","en":"I've grown a lot there, but I'm now looking for broader responsibility and a more international environment.","he":"צמחתי שם מאוד, אבל עכשיו אני מחפש/ת אחריות רחבה יותר וסביבה בינלאומית יותר.","ru":"Я многому там научился/научилась, но теперь ищу более широкую ответственность и более международную среду.","ar":"لقد تطوّرت كثيرًا هناك، لكنني أبحث الآن عن مسؤوليات أوسع وبيئة عمل أكثر دولية."},{"q":"What are your salary expectations for this position?","en":"Based on my research and experience, I'm looking for something in the range of twenty-five thousand shekels.","he":"על סמך הבדיקה שעשיתי והניסיון שלי, אני מכוון/ת לטווח של בערך עשרים וחמישה אלף שקלים.","ru":"Исходя из моего анализа рынка и опыта, я рассчитываю на сумму порядка двадцати пяти тысяч шекелей.","ar":"بناءً على بحثي وخبرتي، أتطلّع إلى راتب في حدود خمسة وعشرين ألف شيكل."}]}]},{"id":"g2","group":"kids","he":"כיתה ב׳","sub":"מילים ראשונות עם תמונות","e":"🎈","units":[{"en":"shapes","he":"צורות","ru":"фигуры","ar":"الأشكال","e":"🔺","items":[{"en":"circle","he":"עיגול","ru":"круг","ar":"دائرة","e":"🔵"},{"en":"square","he":"ריבוע","ru":"квадрат","ar":"مربّع","e":"🟥"},{"en":"triangle","he":"משולש","ru":"треугольник","ar":"مثلّث","e":"🔺"},{"en":"star","he":"כוכב","ru":"звезда","ar":"نجمة","e":"⭐"},{"en":"heart","he":"לב","ru":"сердце","ar":"قلب","e":"❤️","alt":["hart"]},{"en":"diamond","he":"מעוין","ru":"ромб","ar":"معيّن","e":"🔷"}],"reading":{"en":"I see a red circle. Dan has a yellow star.","he":"אני רואה עיגול אדום. לדן יש כוכב צהוב.","ru":"Я вижу красный круг. У Дана есть жёлтая звезда.","ar":"أرى دائرةً حمراء. لدى دان نجمةٌ صفراء.","questions":[["What color is the circle?", :"بطاقة تهنئة","e":"💌"}],"reading":{"en":"It is Omer's birthday. He has a big cake and six candles. Maya gives him a gift.","he":"היום יום ההולדת של עומר. יש לו עוגה גדולה ושישה נרות. מאיה נותנת לו מתנה.","ru":"У Омера день рождения. У него большой торт и шесть свечей. Майя дарит ему подарок.","ar":"اليوم عيد ميلاد عومر. لديه كعكةٌ كبيرة وستّ شموع. مايا تعطيه هديّة.","questions":[["How many candles does Omer have?","six","four","two"],["What does Maya give Omer?","a gift","a cake","a balloon"]]}}]},{"id":"g6","group":"kids","he":"כיתה ו׳","sub":"משפטים קצרים מחיי היום-יום","e":"📘","units":[{"en":"at the doctor","he":"אצל הרופא","ru":"у врача","ar":"عند الطبيب","e":"🩺","items":[{"en":"I have a bad headache.","he":"יש לי כאב ראש חזק.","ru":"У меня сильно болит голова.","ar":"عندي صداعٌ شديد.","e":""},{"en":"My throat hurts when I eat.","he":"כואב לי הגרון כשאני אוכל.","ru":"У меня болит горло, когда я ем.","ar":"يؤلمني حلقي عندما آكل.","e":""},{"en":"You must stay in bed today.","he":"אתה חייב להישאר במיטה היום.","ru":"Тебе нужно сегодня лежать в постели.","ar":"يجب أن تبقى في السرير اليوم.","e":""},{"en":"Take this medicine after lunch.","he":"קח את התרופה הזאת אחרי ארוחת הצהריים.","ru":"Принимай это лекарство после обеда.","ar":"خذ هذا الدواء بعد الغداء.","e":""},{"en":"The doctor is checking my ears.","he":"הרופא בודק לי את האוזניים.","ru":"Врач осматривает мои уши.","ar":"الطبيب يفحص أذنيّ.","e":""},{"en":"I feel much better now.","he":"אני מרגיש הרבה יותר טוב עכשיו.","ru":"Сейчас мне намного лучше.","ar":"أشعر بتحسّنٍ كبير الآن.","e":""}],"reading":{"en":"Dan was sick yesterday. He had a fever and a sore throat. His mother took him to the doctor. The doctor said, 'You must drink a lot of water.' Today Dan feels better.","he":"דן היה חולה אתמול. היה לו חום וכאב גרון. אמא שלו לקחה אותו לרופא. הרופא אמר: ״אתה חייב לשתות הרבה מים.״ היום דן מרגיש טוב יותר.","ru":"Вчера Дан болел. У него была температура и болело горло. Мама отвела его к врачу. Врач сказал: «Тебе нужно пить много воды». Сегодня Дану лучше.","ar":"كان دان مريضًا أمس. كانت لديه حمّى والتهابٌ في الحلق. أخذته أمّه إلى الطبيب. قال الطبيب: «يجب أن تشرب الكثير من الماء». اليوم يشعر دان بتحسّن.","questions":[["When was Dan sick?","yesterday","today","last week"],["Who took Dan to the doctor?","his mother","his father","his teacher"],["What must Dan drink?","water","milk","juice"]]}},{"en":"shopping","he":"קניות","ru":"покупки","ar":"التسوّق","e":"🛒","items":[{"en":"How much is this T-shirt?","he":"כמה עולה החולצה הזאת?","ru":"Сколько стоит эта футболка?","ar":"كم ثمن هذا القميص؟","e":""},{"en":"There is a big sale today.","he":"יש היום מבצע גדול.","ru":"Сегодня большая распродажа.","ar":"هناك تخفيضاتٌ كبيرة اليوم.","e":""},{"en":"These shoes are too small for me.","he":"הנעליים האלה קטנות מדי בשבילי.","ru":"Эти ботинки мне слишком малы.","ar":"هذا الحذاء صغيرٌ جدًّا عليّ.","e":""},{"en":"Can I pay with a card?","he":"אפשר לשלם בכרטיס אשראי?","ru":"Можно заплатить картой?","ar":"هل يمكنني الدفع بالبطاقة؟","e":""},{"en":"The blue bag is cheaper than the red one.","he":"התיק הכחול זול יותר מהאדום.","ru":"Синяя сумка дешевле красной.","ar":"الحقيبة الزرقاء أرخص من الحمراء.","e":""},{"en":"We are buying a present for Grandma.","he":"אנחנו קונים מתנה לסבתא.","ru":"Мы покупаем подарок для бабушки.","ar":"نحن نشتري هديّةً للجدّة.","e":""}],"reading":{"en":"Maya and her dad went to the mall on Friday. There were many shops and people. Maya wanted new sneakers. The white sneakers cost 200 shekels, and the black ones cost 150 shekels. She bought the black sneakers because they were cheaper.","he":"מאיה ואבא שלה הלכו לקניון ביום שישי. היו שם הרבה חנויות ואנשים. מאיה רצתה נעלי ספורט חדשות. נעלי הספורט הלבנות עלו 200 שקלים, והשחורות עלו 150 שקלים. היא קנתה את השחורות כי הן היו זולות יותר.","ru":"В пятницу Майя с папой пошли в торговый центр. Там было много магазинов и людей. Майя хотела новые кроссовки. Белые кроссовки стоили 200 шекелей, а чёрные — 150 шекелей. Она купила чёрные кроссовки, потому что они были дешевле.","ar":"ذهبت مايا وأبوها إلى المركز التجاري يوم الجمعة. كان هناك الكثير من المحلّات والناس. أرادت مايا حذاءً رياضيًّا جديدًا. كان ثمن الحذاء الأبيض 200 شيكل، وثمن الأسود 150 شيكل. اشترت الحذاء الأسود لأنّه كان أرخص.","questions":[["When did Maya go to the mall?","on Friday","on Sunday","on Monday"],["How much were the white sneakers?","200 shekels","150 shekels","100 shekels"],["Why did Maya buy the black sneakers?","they were cheaper","they were bigger","they were prettier"]]}},{"en":"the environment","he":"איכות הסביבה","ru":"окружающая среда","ar":"البيئة","e":"🌍","items":[{"en":"We must not throw trash on the ground.","he":"אסור לנו לזרוק זבל על הרצפה.","ru":"Нельзя бросать мусор на землю.","ar":"يجب ألّا نرمي القمامة على الأرض.","e":""},{"en":"Put the paper in the blue bin.","he":"שים את הנייר בפח הכחול.","ru":"Положи бумагу в синий контейнер.","ar":"ضع الورق في الحاوية الزرقاء.","e":""},{"en":"Turn off the light when you leave.","he":"כבה את האור כשאתה יוצא.","ru":"Выключай свет, когда уходишь.","ar":"أطفئ الضوء عندما تخرج.","e":""},{"en":"Plants and trees give us clean air.","he":"צמחים ועצים נותנים לנו אוויר נקי.","ru":"Растения и деревья дают нам чистый воздух.","ar":"النباتات والأشجار تعطينا هواءً نظيفًا.","e":""},{"en":"We can save water at home.","he":"אנחנו יכולים לחסוך מים בבית.","ru":"Мы можем экономить воду дома.","ar":"يمكننا توفير الماء في البيت.","e":""},{"en":"There are many bottles on the beach.","he":"יש הרבה בקבוקים על החוף.","ru":"На пляже много бутылок.","ar":"هناك زجاجاتٌ كثيرة على الشاطئ.","e":""}],"reading":{"en":"Omer's class is cleaning the beach today. There is a lot of trash on the sand. The children are putting bottles and bags in big bins. Omer says, 'We must keep our beach clean.' The beach looks beautiful now.","he":"הכיתה של עומר מנקה היום את החוף. יש הרבה זבל על החול. הילדים שמים בקבוקים ושקיות בפחים גדולים. עומר אומר: ״אנחנו חייבים לשמור על החוף שלנו נקי.״ החוף נראה יפה עכשיו.","ru":"Сегодня класс Омера убирает пляж. На песке много мусора. Дети кладут бутылки и пакеты в большие баки. Омер говорит: «Мы должны держать наш пляж в чистоте». Теперь пляж выглядит красиво.","ar":"صفّ عومر ينظّف الشاطئ اليوم. هناك الكثير من القمامة على الرمل. الأطفال يضعون الزجاجات والأكياس في حاوياتٍ كبيرة. يقول عومر: «يجب أن نحافظ على نظافة شاطئنا». يبدو الشاطئ جميلًا الآن.","questions":[["What is Omer's class doing today?","cleaning the beach","swimming in the sea","planting trees"],["Where is the trash?","on the sand","in the sea","in the park"],["What must they keep clean?","the beach","the school","the park"]]}},{"en":"school trip","he":"טיול שנתי","ru":"школьная экскурсия","ar":"الرحلة المدرسية","e":"🎒","items":[{"en":"We went on a trip to the north.","he":"יצאנו לטיול בצפון.","ru":"Мы поехали на экскурсию на север.","ar":"ذهبنا في رحلةٍ إلى الشمال.","e":""},{"en":"The bus left at seven o'clock.","he":"האוטובוס יצא בשעה שבע.","ru":"Автобус уехал в семь часов.","ar":"انطلقت الحافلة في الساعة السابعة.","e":""},{"en":"We walked in the water for an hour.","he":"הלכנו במים במשך שעה.","ru":"Мы целый час шли по воде.","ar":"مشينا في الماء لمدّة ساعة.","e":""},{"en":"I took a lot of photos.","he":"צילמתי הרבה תמונות.","ru":"Я сделал много фотографий.","ar":"التقطتُ الكثير من الصور.","e":""},{"en":"We slept in tents at night.","he":"ישנו באוהלים בלילה.","ru":"Ночью мы спали в палатках.","ar":"نمنا في الخيام ليلًا.","e":""},{"en":"It was the best day of the year.","he":"זה היה היום הכי טוב בשנה.","ru":"Это был лучший день в году.","ar":"كان أفضل يومٍ في السنة.","e":""}],"reading":{"en":"Last week, Noa's class went on a trip to the Galilee. They traveled by bus for three hours. In the morning, they walked along a river. At night, they sang songs around a campfire. Noa was tired, but very happy.","he":"בשבוע שעבר הכיתה של נועה יצאה לטיול בגליל. הם נסעו באוטובוס שלוש שעות. בבוקר הם הלכו לאורך נהר. בלילה הם שרו שירים סביב מדורה. נועה הייתה עייפה, אבל מאוד שמחה.","ru":"На прошлой неделе класс Ноа ездил на экскурсию в Галилею. Они ехали на автобусе три часа. Утром они гуляли вдоль реки. Ночью они пели песни у костра. Ноа устала, но была очень счастлива.","ar":"في الأسبوع الماضي، ذهب صفّ نوعا في رحلةٍ إلى الجليل. سافروا بالحافلة لمدّة ثلاث ساعات. في الصباح، مشوا على طول نهر. في الليل، غنّوا الأغاني حول نار المخيّم. كانت نوعا متعبة، لكنّها سعيدة جدًّا.","questions":[["Where did the class go?","to the Galilee","to Eilat","to the Dead Sea"],["How did they travel?","by bus","by train","by car"],["What did they do at night?","they sang songs","they swam in a river","they took photos"]]}},{"en":"technology","he":"טכנולוגיה","ru":"технологии","ar":"التكنولوجيا","e":"💻","items":[{"en":"My brother is playing a computer game.","he":"אחי משחק במשחק מחשב.","ru":"Мой брат играет в компьютерную игру.","ar":"أخي يلعب لعبةً على الحاسوب.","e":""},{"en":"Can you send me a message?","he":"אתה יכול לשלוח לי הודעה?","ru":"Можешь прислать мне сообщение?","ar":"هل يمكنك أن ترسل لي رسالة؟","e":""},{"en":"Don't use your phone in class.","he":"אל תשתמש בטלפון בכיתה.","ru":"Не пользуйся телефоном на уроке.","ar":"لا تستخدم هاتفك في الصفّ.","e":""},{"en":"I am watching a video about space.","he":"אני צופה בסרטון על החלל.","ru":"Я смотрю видео о космосе.","ar":"أنا أشاهد فيديو عن الفضاء.","e":""},{"en":"My tablet is newer than my phone.","he":"הטאבלט שלי חדש יותר מהטלפון שלי.","ru":"Мой планшет новее моего телефона.","ar":"جهازي اللوحي أحدث من هاتفي.","e":""},{"en":"You must charge the battery tonight.","he":"אתה חייב להטעין את הסוללה הלילה.","ru":"Тебе нужно зарядить батарею сегодня вечером.","ar":"يجب أن تشحن البطارية الليلة.","e":""}],"reading":{"en":"Lia has a new laptop. She uses it for homework and video calls with her grandma. Her mom says, 'You can use the computer for one hour a day.' After that, Lia reads a book or plays outside.","he":"לליה יש מחשב נייד חדש. היא משתמשת בו לשיעורי בית ולשיחות וידאו עם סבתא שלה. אמא שלה אומרת: ״את יכולה להשתמש במחשב שעה אחת ביום.״ אחרי זה ליה קוראת ספר או משחקת בחוץ.","ru":"У Лии новый ноутбук. Она делает на нём домашние задания и разговаривает по видеосвязи с бабушкой. Мама говорит ей: «Ты можешь пользоваться компьютером один час в день». После этого Лия читает книгу или играет на улице.","ar":"لدى ليا حاسوبٌ محمول جديد. تستخدمه لأداء الواجبات ولمكالمات الفيديو مع جدّتها. تقول أمّها: «يمكنكِ استخدام الحاسوب ساعةً واحدة في اليوم». بعد ذلك، تقرأ ليا كتابًا أو تلعب في الخارج.","questions":[["What does Lia have?","a new laptop","a new phone","a new tablet"],["Who does Lia have video calls with?","her grandma","her teacher","her brother"],["How long can Lia use the computer?","one hour a day","two hours a day","all day"]]}},{"en":"around israel","he":"ברחבי ישראל","ru":"по Израилю","ar":"في أنحاء إسرائيل","e":"🗺️","items":[{"en":"Eilat is hotter than Haifa in summer.","he":"באילת חם יותר מבחיפה בקיץ.","ru":"Летом в Эйлате жарче, чем в Хайфе.","ar":"إيلات أكثر حرارةً من حيفا في الصيف.","e":""},{"en":"Jerusalem is older than Tel Aviv.","he":"ירושלים עתיקה יותר מתל אביב.","ru":"Иерусалим старше Тель-Авива.","ar":"القدس أقدم من تل أبيب.","e":""},{"en":"There are many mountains in the north.","he":"יש הרבה הרים בצפון.","ru":"На севере много гор.","ar":"هناك جبالٌ كثيرة في الشمال.","e":""},{"en":"The Dead Sea is the lowest place on Earth.","he":"ים המלח הוא המקום הנמוך ביותר בעולם.","ru":"Мёртвое море — самое низкое место на Земле.","ar":"البحر الميت هو أخفض مكانٍ على الأرض.","e":""},{"en":"You can swim in the Sea of Galilee.","he":"אפשר לשחות בכנרת.","ru":"В Кинерете можно купаться.","ar":"يمكنك السباحة في بحيرة طبريا.","e":""},{"en":"The Negev is bigger than the Galilee.","he":"הנגב גדול יותר מהגליל.","ru":"Негев больше Галилеи.","ar":"النقب أكبر من الجليل.","e":""}],"reading":{"en":"Dan lives in Haifa, near the sea. His cousin Maya lives in Eilat, in the south. In summer, Eilat is much hotter than Haifa. Maya can see fish in the Red Sea every day. Dan wants to visit her next summer.","he":"דן גר בחיפה, ליד הים. בת הדודה שלו מאיה גרה באילת, בדרום. בקיץ באילת חם הרבה יותר מבחיפה. מאיה יכולה לראות דגים בים סוף כל יום. דן רוצה לבקר אותה בקיץ הבא.","ru":"Дан живёт в Хайфе, у моря. Его двоюродная сестра Майя живёт в Эйлате, на юге. Летом в Эйлате намного жарче, чем в Хайфе. Майя может каждый день видеть рыб в Красном море. Дан хочет навестить её следующим летом.","ar":"يسكن دان في حيفا، قرب البحر. ابنة عمّه مايا تسكن في إيلات، في الجنوب. في الصيف، إيلات أكثر حرارةً بكثير من حيفا. تستطيع مايا أن ترى الأسماك في البحر الأحمر كلّ يوم. يريد دان أن يزورها في الصيف القادم.","questions":[["Where does Maya live?","in Eilat","in Haifa","in Jerusalem"],["Which city is hotter in summer?","Eilat","Haifa","Tel Aviv"],["When does Dan want to visit Maya?","next summer","next week","in winter"]]}}]},{"id":"h10","group":"high","he":"3 יחידות לימוד","sub":"בגרות 3 יח״ל: הבנת הנקרא והבעה","e":"📘","units":[{"en":"technology","he":"טכנולוגיה","ru":"технологии","ar":"التكنولوجيا","e":"💻","items":[{"en":"Smartphones have changed the way we communicate.","he":"הטלפונים החכמים שינו את הדרך שבה אנחנו מתקשרים.","ru":"Смартфоны изменили то, как мы общаемся.","ar":"لقد غيّرت الهواتف الذكية طريقة تواصلنا.","e":"","alt":[]},{"en":"If I had more free time, I would learn to code.","he":"אילו היה לי יותר זמן פנוי, הייתי לומד לתכנת.","ru":"Если бы у меня было больше свободного времени, я бы научился программировать.","ar":"لو كان لديّ وقت فراغ أكثر، لتعلّمتُ البرمجة.","e":"","alt":[]},{"en":"Most apps are designed to keep us online longer.","he":"רוב האפליקציות מתוכננות כדי להשאיר אותנו מחוברים יותר זמן.","ru":"Большинство приложений созданы для того, чтобы мы дольше оставались онлайн.","ar":"صُمّمت معظم التطبيقات لإبقائنا متصلين بالإنترنت لفترة أطول.","e":"","alt":[]},{"en":"Although technology is useful, it can also be addictive.","he":"למרות שהטכנולוגיה שימושית, היא גם עלולה לגרום להתמכרות.","ru":"Хотя технологии полезны, они также могут вызывать зависимость.","ar":"على الرغم من أن التكنولوجيا مفيدة، فإنها قد تسبب الإدمان أيضًا.","e":"","alt":[]},{"en":"You should never share your password with anyone.","he":"אף פעם אל תשתף את הסיסמה שלך עם אף אחד.","ru":"Никогда никому не сообщайте свой пароль.","ar":"يجب ألّا تشارك كلمة مرورك مع أي أحد أبدًا.","e":"","alt":[]},{"en":"Online privacy is becoming a serious concern for teenagers.","he":"פרטיות ברשת הופכת לדאגה רצינית עבור בני נוער.","ru":"Конфиденциальность в интернете становится серьёзной проблемой для подростков.","ar":"أصبحت الخصوصية على الإنترنت مصدر قلق جدي للمراهقين.","e":"","alt":[]}],"reading":{"en":"Noa is sixteen and lives in Haifa. Last year, she noticed that she was spending almost six hours a day on her phone. Her grades were dropping, and she often felt tired in the morning. Therefore, she decided to try a simple experiment: no phone after nine p.m. At first, it was difficult, and she felt that she was missing out. However, after two weeks she was sleeping better and reading more books. Today, Noa still uses her phone, but she feels that she controls it, not the other way around.","he":"נועה בת שש עשרה וגרה בחיפה. בשנה שעברה היא שמה לב שהיא מבלה כמעט שש שעות ביום בטלפון. הציונים שלה ירדו, ולעיתים קרובות היא הרגישה עייפה בבוקר. לכן היא החליטה לנסות ניסוי פשוט: בלי טלפון אחרי תשע בערב. בהתחלה זה היה קשה, והיא הרגישה שהיא מפספסת דברים. עם זאת, אחרי שבועיים היא ישנה טוב יותר וקראה יותר ספרים. היום נועה עדיין משתמשת בטלפון, אבל היא מרגישה שהיא שולטת בו, ולא להפך.","ru":"Ноа шестнадцать лет, она живёт в Хайфе. В прошлом году она заметила, что проводит в телефоне почти шесть часов в день. Её оценки ухудшались, и по утрам она часто чувствовала усталость. Поэтому она решила провести простой эксперимент: никакого телефона после девяти вечера. Сначала было трудно, и ей казалось, что она многое упускает. Однако через две недели она стала лучше спать и больше читать. Сегодня Ноа по-прежнему пользуется телефоном, но чувствует, что это она управляет им, а не наоборот.","ar":"نوعا في السادسة عشرة من عمرها وتعيش في حيفا. في العام الماضي، لاحظت أنها تقضي قرابة ست ساعات يوميًا على هاتفها. كانت علاماتها تتراجع، وكثيرًا ما شعرت بالتعب في الصباح. لذلك قررت أن تجرّب تجربة بسيطة: لا هاتف بعد التاسعة مساءً. في البداية كان الأمر صعبًا، وشعرت بأنها تفوّت أشياء كثيرة. لكن بعد أسبوعين أصبحت تنام بشكل أفضل وتقرأ كتبًا أكثر. اليوم ما زالت نوعا تستخدم هاتفها، لكنها تشعر أنها هي من تتحكم فيه، وليس العكس.","questions":[["Why did Noa start the experiment?","Her phone use was hurting her.","Her parents took her phone.","Her phone was broken.","She wanted a new phone."],["How did Noa feel at the beginning?","She felt she was missing things.","She felt relaxed immediately.","She felt proud and happy.","She felt nothing at all."],["What does the last sentence suggest?","Noa now uses her phone wisely.","Noa stopped using her phone.","Noa's phone controls her life.","Noa bought a better phone."]]}},{"en":"environment","he":"סביבה","ru":"окружающая среда","ar":"البيئة","e":"🌍","items":[{"en":"Plastic bags are banned in many countries today.","he":"שקיות פלסטיק אסורות היום במדינות רבות.","ru":"Сегодня пластиковые пакеты запрещены во многих странах.","ar":"الأكياس البلاستيكية محظورة اليوم في كثير من الدول.","e":"","alt":[]},{"en":"If we recycle more, we will produce less waste.","he":"אם נמחזר יותר, נייצר פחות פסולת.","ru":"Если мы будем больше перерабатывать, у нас будет меньше отходов.","ar":"إذا أعدنا التدوير أكثر، فسننتج نفايات أقل.","e":"","alt":[]},{"en":"Solar energy is widely used in Israel.","he":"אנרגיה סולארית נמצאת בשימוש נרחב בישראל.","ru":"Солнечная энергия широко используется в Израиле.","ar":"تُستخدم الطاقة الشمسية على نطاق واسع في إسرائيل.","e":"","alt":[]},{"en":"We should take public transport instead of driving.","he":"כדאי שניסע בתחבורה ציבורית במקום לנהוג.","ru":"Нам стоит ездить на общественном транспорте, а не на машине.","ar":"ينبغي أن نستخدم وسائل النقل العام بدلًا من القيادة.","e":"","alt":[]},{"en":"Many animals are losing their natural habitats.","he":"בעלי חיים רבים מאבדים את בתי הגידול הטבעיים שלהם.","ru":"Многие животные теряют свою естественную среду обитания.","ar":"تفقد حيوانات كثيرة موائلها الطبيعية.","e":"","alt":[]},{"en":"Saving water is everyone's responsibility, not only the government's.","he":"חיסכון במים הוא אחריות של כולם, לא רק של הממשלה.","ru":"Экономия воды — ответственность каждого, а не только правительства.","ar":"توفير المياه مسؤولية الجميع، وليس الحكومة فقط.","e":"","alt":[]}],"reading":{"en":"Every summer, thousands of Israelis visit the beaches of the Mediterranean. Unfortunately, many of them leave plastic bottles and bags behind. This waste is dangerous for sea turtles, which often mistake plastic bags for jellyfish. In 2022, a group of students from Ashdod started cleaning their local beach every Friday morning. At first, only five students came, but soon more than fifty people joined them. The city was so impressed that it put new recycling bins along the beach. The students believe that small actions can lead to big changes.","he":"בכל קיץ אלפי ישראלים מבקרים בחופי הים התיכון. לצערנו, רבים מהם משאירים מאחור בקבוקים ושקיות פלסטיק. הפסולת הזו מסוכנת לצבי ים, שלעיתים קרובות מתבלבלים בין שקיות פלסטיק למדוזות. ב-2022 קבוצת תלמידים מאשדוד התחילה לנקות את החוף המקומי שלהם בכל יום שישי בבוקר. בהתחלה הגיעו רק חמישה תלמידים, אבל מהר מאוד הצטרפו אליהם יותר מחמישים אנשים. העירייה התרשמה כל כך שהיא הציבה פחי מחזור חדשים לאורך החוף. התלמידים מאמינים שפעולות קטנות יכולות להוביל לשינויים גדולים.","ru":"Каждое лето тысячи израильтян приезжают на пляжи Средиземного моря. К сожалению, многие из них оставляют после себя пластиковые бутылки и пакеты. Этот мусор опасен для морских черепах, которые часто принимают пластиковые пакеты за медуз. В 2022 году группа школьников из Ашдода начала каждую пятницу утром убирать местный пляж. Сначала пришли только пять учеников, но вскоре к ним присоединились более пятидесяти человек. Город был так впечатлён, что установил вдоль пляжа новые контейнеры для переработки. Школьники верят, что маленькие поступки могут привести к большим переменам.","ar":"في كل صيف، يزور آلاف الإسرائيليين شواطئ البحر الأبيض المتوسط. ولسوء الحظ، يترك كثيرون منهم وراءهم زجاجات وأكياسًا بلاستيكية. هذه النفايات خطيرة على السلاحف البحرية التي كثيرًا ما تظن أن الأكياس البلاستيكية قناديل بحر. في عام 2022، بدأت مجموعة من الطلاب من أسدود بتنظيف شاطئهم المحلي صباح كل يوم جمعة. في البداية جاء خمسة طلاب فقط، لكن سرعان ما انضم إليهم أكثر من خمسين شخصًا. أُعجبت البلدية بذلك كثيرًا فوضعت حاويات جديدة لإعادة التدوير على طول الشاطئ. يؤمن الطلاب بأن الأفعال الصغيرة قد تؤدي إلى تغييرات كبيرة.","questions":[["Why is plastic dangerous for sea turtles?","They think it is food.","It makes the water hot.","It blocks their way to the beach.","It scares them away."],["What happened after the students started?","Many more people joined them.","The beach was closed.","The students stopped coming.","The city fined the visitors."],["What is the main message of the text?","Small actions can make a difference.","Israeli beaches are always clean.","Turtles do not live in Israel.","Only cities can solve pollution."]]}},{"en":"media","he":"תקשורת ומדיה","ru":"СМИ","ar":"الإعلام","e":"📰","items":[{"en":"Not everything you read online is true.","he":"לא כל מה שקוראים ברשת נכון.","ru":"Не всё, что вы читаете в интернете, правда.","ar":"ليس كل ما تقرأه على الإنترنت صحيحًا.","e":"","alt":[]},{"en":"Fake news spreads faster than real news.","he":"חדשות כזב מתפשטות מהר יותר מחדשות אמיתיות.","ru":"Фейковые новости распространяются быстрее настоящих.","ar":"تنتشر الأخبار الكاذبة أسرع من الأخبار الحقيقية.","e":"","alt":[]},{"en":"Always check the source before you share a story.","he":"תמיד בדקו את המקור לפני שאתם משתפים ידיעה.","ru":"Всегда проверяйте источник, прежде чем делиться новостью.","ar":"تحقّق دائمًا من المصدر قبل أن تشارك أي خبر.","e":"","alt":[]},{"en":"The interview was watched by millions of people.","he":"הראיון נצפה על ידי מיליוני אנשים.","ru":"Интервью посмотрели миллионы людей.","ar":"شوهدت المقابلة من قِبل ملايين الأشخاص.","e":"","alt":[]},{"en":"In my opinion, influencers have too much power.","he":"לדעתי, למשפיענים יש יותר מדי כוח.","ru":"По-моему, у инфлюенсеров слишком много влияния.","ar":"في رأيي، يملك المؤثرون نفوذًا أكثر من اللازم.","e":"","alt":[]},{"en":"Advertisements often target young people on social media.","he":"פרסומות ברשתות החברתיות מכוונות לעיתים קרובות לצעירים.","ru":"Реклама в соцсетях часто нацелена на молодёжь.","ar":"غالبًا ما تستهدف الإعلانات الشباب على وسائل التواصل الاجتماعي.","e":"","alt":[]}],"reading":{"en":"A few months ago, a video of a 'giant shark' near a Tel Aviv beach went viral. Within hours, it had been shared more than 100,000 times. Some people were so frightened that they refused to go swimming. However, a journalist named Yael decided to investigate. She discovered that the video had been edited and that it had actually been filmed in Australia years earlier. When she published her findings, many people felt embarrassed that they had believed it. Yael says that the best weapon against fake news is a simple question: 'Who made this, and why?'","he":"לפני כמה חודשים, סרטון של 'כריש ענק' ליד חוף בתל אביב הפך לוויראלי. בתוך שעות הוא שותף יותר מ-100,000 פעמים. חלק מהאנשים נבהלו כל כך שסירבו להיכנס למים. עם זאת, עיתונאית בשם יעל החליטה לחקור. היא גילתה שהסרטון נערך ושלמעשה הוא צולם באוסטרליה שנים קודם לכן. כשפרסמה את הממצאים שלה, אנשים רבים הרגישו נבוכים על כך שהאמינו לו. יעל אומרת שהנשק הטוב ביותר נגד חדשות כזב הוא שאלה פשוטה: 'מי יצר את זה, ולמה?'","ru":"Несколько месяцев назад видео с «гигантской акулой» у пляжа в Тель-Авиве стало вирусным. За несколько часов им поделились более 100 000 раз. Некоторые люди так испугались, что отказались купаться. Однако журналистка по имени Яэль решила провести расследование. Она выяснила, что видео было смонтировано и на самом деле снято в Австралии много лет назад. Когда она опубликовала свои выводы, многим стало стыдно, что они в это поверили. Яэль говорит, что лучшее оружие против фейковых новостей — простой вопрос: «Кто это сделал и зачем?»","ar":"قبل بضعة أشهر، انتشر مقطع فيديو لـ«سمكة قرش عملاقة» قرب أحد شواطئ تل أبيب انتشارًا واسعًا. وخلال ساعات، تمت مشاركته أكثر من 100,000 مرة. خاف بعض الناس لدرجة أنهم رفضوا السباحة. لكن صحفية تُدعى ياعيل قررت التحقيق في الأمر. فاكتشفت أن الفيديو كان معدّلًا وأنه صُوّر في الحقيقة في أستراليا قبل سنوات. وعندما نشرت ما توصلت إليه، شعر كثيرون بالحرج لأنهم صدّقوه. تقول ياعيل إن أفضل سلاح ضد الأخبار الكاذبة هو سؤال بسيط: «من صنع هذا، ولماذا؟»","questions":[["Why did some people stop swimming?","They believed the shark video.","The water was too cold.","The police closed the beach.","Yael told them to stay away."],["What did Yael find out?","The video was fake and old.","The shark was very dangerous.","The video was filmed in Tel Aviv.","Nobody had watched the video."],["What does Yael advise people to do?","Ask who created content and why.","Stop using social media.","Avoid swimming in the sea.","Share videos as quickly as possible."]]}},{"en":"health","he":"בריאות","ru":"здоровье","ar":"الصحة","e":"🍎","items":[{"en":"Teenagers need at least eight hours of sleep.","he":"בני נוער צריכים לפחות שמונה שעות שינה.","ru":"Подросткам нужно не менее восьми часов сна.","ar":"يحتاج المراهقون إلى ثماني ساعات من النوم على الأقل.","e":"","alt":[]},{"en":"If you exercise regularly, you will feel more energetic.","he":"אם תתאמן באופן קבוע, תרגיש יותר אנרגטי.","ru":"Если вы будете регулярно заниматься спортом, у вас будет больше энергии.","ar":"إذا مارستَ الرياضة بانتظام، فستشعر بنشاط أكبر.","e":"","alt":[]},{"en":"Too much sugar can lead to serious health problems.","he":"יותר מדי סוכר עלול להוביל לבעיות בריאות רציניות.","ru":"Избыток сахара может привести к серьёзным проблемам со здоровьем.","ar":"قد يؤدي الإفراط في السكر إلى مشاكل صحية خطيرة.","e":"","alt":[]},{"en":"Mental health is just as important as physical health.","he":"בריאות הנפש חשובה בדיוק כמו בריאות הגוף.","ru":"Психическое здоровье так же важно, как и физическое.","ar":"الصحة النفسية لا تقل أهمية عن الصحة الجسدية.","e":"","alt":[]},{"en":"Despite the heat, he goes running every morning.","he":"למרות החום, הוא יוצא לרוץ כל בוקר.","ru":"Несмотря на жару, он бегает каждое утро.","ar":"على الرغم من الحر، يخرج للركض كل صباح.","e":"","alt":[]},{"en":"It's a good idea to talk to someone when you're stressed.","he":"כדאי לדבר עם מישהו כשאתה לחוץ.","ru":"Когда вы в стрессе, полезно с кем-нибудь поговорить.","ar":"من الجيد أن تتحدث إلى أحدٍ ما عندما تكون متوترًا.","e":"","alt":[]}],"reading":{"en":"Omer, a seventeen-year-old from Be'er Sheva, used to drink three energy drinks a day. He believed that they helped him study for his exams. However, he soon began to suffer from headaches and could not fall asleep at night. His doctor explained that energy drinks contain large amounts of caffeine and sugar. She advised him to replace them with water, fruit and short walks. Omer was doubtful at first, but he followed her advice. A month later, he was sleeping well, and to his surprise, his grades had actually improved.","he":"עומר, בן שבע עשרה מבאר שבע, נהג לשתות שלושה משקאות אנרגיה ביום. הוא האמין שהם עוזרים לו ללמוד למבחנים. אולם עד מהרה הוא התחיל לסבול מכאבי ראש ולא הצליח להירדם בלילה. הרופאה שלו הסבירה שמשקאות אנרגיה מכילים כמויות גדולות של קפאין וסוכר. היא המליצה לו להחליף אותם במים, בפירות ובהליכות קצרות. בהתחלה עומר היה ספקן, אבל הוא פעל לפי עצתה. חודש לאחר מכן הוא ישן טוב, ולהפתעתו, הציונים שלו אפילו השתפרו.","ru":"Омер, семнадцатилетний юноша из Беэр-Шевы, раньше выпивал по три энергетических напитка в день. Он считал, что они помогают ему готовиться к экзаменам. Однако вскоре у него начались головные боли, и по ночам он не мог заснуть. Врач объяснила ему, что энергетики содержат большое количество кофеина и сахара. Она посоветовала заменить их водой, фруктами и короткими прогулками. Сначала Омер сомневался, но последовал её совету. Через месяц он уже хорошо спал и, к своему удивлению, даже стал учиться лучше.","ar":"كان عومر، وهو شاب في السابعة عشرة من بئر السبع، يشرب ثلاثة مشروبات طاقة يوميًا. كان يعتقد أنها تساعده على الدراسة لامتحاناته. لكنه سرعان ما بدأ يعاني من الصداع ولم يعد يستطيع النوم ليلًا. أوضحت له طبيبته أن مشروبات الطاقة تحتوي على كميات كبيرة من الكافيين والسكر. ونصحته باستبدالها بالماء والفواكه والمشي لفترات قصيرة. تردّد عومر في البداية، لكنه عمل بنصيحتها. وبعد شهر، أصبح ينام جيدًا، ولدهشته تحسّنت علاماته أيضًا.","questions":[["Why did Omer drink energy drinks?","He thought they helped him study.","His friends forced him to.","He liked the color of the cans.","His doctor recommended them."],["What problems did Omer have?","Headaches and trouble sleeping.","Stomach pain and fever.","Low grades and no friends.","Back pain and tired eyes."],["What surprised Omer?","His grades got better.","His doctor was angry with him.","He liked energy drinks more.","His headaches got worse."]]}},{"en":"volunteering","he":"התנדבות","ru":"волонтёрство","ar":"التطوع","e":"🤝","items":[{"en":"Volunteering helps you develop skills you can't learn at school.","he":"התנדבות עוזרת לפתח כישורים שאי אפשר ללמוד בבית הספר.","ru":"Волонтёрство помогает развить навыки, которым не научишься в школе.","ar":"يساعدك التطوع على تطوير مهارات لا يمكنك تعلّمها في المدرسة.","e":"","alt":[]},{"en":"She has been volunteering at the hospital for two years.","he":"היא מתנדבת בבית החולים כבר שנתיים.","ru":"Она работает волонтёром в больнице уже два года.","ar":"إنها تتطوع في المستشفى منذ عامين.","e":"","alt":[]},{"en":"If you want to make a difference, start in your community.","he":"אם אתה רוצה לחולל שינוי, התחל בקהילה שלך.","ru":"Если хотите что-то изменить, начните со своего окружения.","ar":"إذا أردت أن تُحدث فرقًا، فابدأ بمجتمعك.","e":"","alt":[]},{"en":"Elderly people often suffer from loneliness.","he":"אנשים מבוגרים סובלים לעיתים קרובות מבדידות.","ru":"Пожилые люди часто страдают от одиночества.","ar":"كثيرًا ما يعاني كبار السن من الوحدة.","e":"","alt":[]},{"en":"Giving your time is sometimes more valuable than giving money.","he":"לתת מזמנך שווה לפעמים יותר מלתת כסף.","ru":"Иногда отдать своё время ценнее, чем дать деньги.","ar":"أحيانًا يكون تقديم وقتك أثمن من تقديم المال.","e":"","alt":[]},{"en":"Every student is required to complete a community project.","he":"כל תלמיד נדרש להשלים פרויקט קהילתי.","ru":"Каждый ученик обязан выполнить общественный проект.","ar":"يُطلب من كل طالب إكمال مشروع مجتمعي.","e":"","alt":[]}],"reading":{"en":"In Israel, high school students are required to do sixty hours of community service, known as 'Personal Commitment'. Some students see it as just another task, but for many it becomes a meaningful experience. Tamar, from Jerusalem, chose to volunteer at a centre for children with special needs. At first, she was nervous because she had no experience. Nevertheless, the children welcomed her warmly, and she quickly learned how to help them. She enjoyed it so much that she continued volunteering long after her sixty hours were completed. Now she is thinking about studying special education at university.","he":"בישראל, תלמידי תיכון נדרשים לבצע שישים שעות של שירות לקהילה, המכונה 'מחויבות אישית'. יש תלמידים שרואים בזה עוד משימה, אבל עבור רבים זו הופכת לחוויה משמעותית. תמר מירושלים בחרה להתנדב במרכז לילדים עם צרכים מיוחדים. בהתחלה היא הייתה לחוצה כי לא היה לה ניסיון. למרות זאת, הילדים קיבלו אותה בחום, והיא למדה מהר איך לעזור להם. היא נהנתה כל כך שהמשיכה להתנדב זמן רב אחרי שהשלימה את שישים השעות. עכשיו היא חושבת ללמוד חינוך מיוחד באוניברסיטה.","ru":"В Израиле старшеклассники обязаны выполнить шестьдесят часов общественной работы, известной как «Личное обязательство». Некоторые ученики считают это просто ещё одним заданием, но для многих это становится важным опытом. Тамар из Иерусалима решила стать волонтёром в центре для детей с особыми потребностями. Сначала она нервничала, потому что у неё не было опыта. Тем не менее дети тепло её приняли, и она быстро научилась им помогать. Ей так понравилось, что она продолжала волонтёрить ещё долго после того, как отработала свои шестьдесят часов. Теперь она думает о том, чтобы изучать специальную педагогику в университете.","ar":"في إسرائيل، يُطلب من طلاب المدارس الثانوية أداء ستين ساعة من الخدمة المجتمعية، تُعرف باسم «الالتزام الشخصي». يرى بعض الطلاب في ذلك مجرد مهمة أخرى، لكنه يصبح لكثيرين تجربة ذات معنى. اختارت تمار من القدس أن تتطوع في مركز للأطفال ذوي الاحتياجات الخاصة. في البداية كانت متوترة لأنها لم تكن تملك أي خبرة. ومع ذلك، استقبلها الأطفال بحرارة، وتعلّمت بسرعة كيف تساعدهم. استمتعت بذلك كثيرًا حتى إنها واصلت التطوع بعد إتمام ساعاتها الستين بوقت طويل. وهي تفكر الآن في دراسة التربية الخاصة في الجامعة.","questions":[["How did Tamar feel at the start?","Nervous and inexperienced.","Bored and tired.","Angry with her school.","Confident and relaxed."],["What does 'Nevertheless' show in the text?","A contrast with the previous idea.","A result of the previous idea.","An example of the previous idea.","The order of events in time."],["What can we learn about Tamar's future?","Volunteering may shape her career.","She will stop volunteering soon.","She wants to become a doctor.","She plans to leave Jerusalem."]]}},{"en":"future plans","he":"תוכניות לעתיד","ru":"планы на будущее","ar":"خطط المستقبل","e":"🚀","dialog":true,"items":[{"q":"What do you want to do after high school?","en":"I'm planning to work for a year and save money.","he":"אני מתכנן לעבוד שנה ולחסוך כסף.","ru":"Я планирую поработать год и накопить денег.","ar":"أخطط للعمل لمدة عام وادخار المال."},{"q":"Which subject do you enjoy the most?","en":"I really enjoy biology because I love understanding how things work.","he":"אני מאוד נהנה מביולוגיה כי אני אוהב להבין איך דברים עובדים.","ru":"Мне очень нравится биология, потому что я люблю понимать, как всё устроено.","ar":"أستمتع كثيرًا بالأحياء لأنني أحب أن أفهم كيف تعمل الأشياء."},{"q":"What job would you like to have one day?","en":"I would like to become an engineer and design smart buildings.","he":"הייתי רוצה להיות מהנדס ולתכנן בניינים חכמים.","ru":"Я хотел бы стать инженером и проектировать умные здания.","ar":"أودّ أن أصبح مهندسًا وأصمّم مبانيَ ذكية."},{"q":"Would you prefer to live in a city or a village?","en":"I'd prefer a city because there are more opportunities there.","he":"הייתי מעדיף עיר, כי יש שם יותר הזדמנויות.","ru":"Я бы предпочёл город, потому что там больше возможностей.","ar":"أفضّل المدينة لأن فيها فرصًا أكثر."},{"q":"What will you do if you don't get into your first choice?","en":"If that happens, I will try again or choose another path.","he":"אם זה יקרה, אנסה שוב או אבחר דרך אחרת.","ru":"Если так случится, я попробую снова или выберу другой путь.","ar":"إذا حدث ذلك، فسأحاول مرة أخرى أو أختار طريقًا آخر."},{"q":"Who has influenced your plans the most?","en":"My older sister has influenced me because she followed her dreams.","he":"אחותי הגדולה השפיעה עליי, כי היא הלכה בעקבות החלומות שלה.","ru":"На меня больше всех повлияла старшая сестра, потому что она следовала своей мечте.","ar":"أثّرت فيّ أختي الكبرى لأنها سعت وراء أحلامها."}]}]},{"id":"h11","group":"high","he":"4 יחידות לימוד","sub":"בגרות 4 יח״ל: טקסטים וטיעונים","e":"📗","units":[{"en":"artificial intelligence","he":"בינה מלאכותית","ru":"искусственный интеллект","ar":"الذكاء الاصطناعي","e":"🤖","items":[{"en":"Artificial intelligence is being used in almost every industry.","he":"בינה מלאכותית משמשת כיום כמעט בכל תעשייה.","ru":"Искусственный интеллект используется почти во всех отраслях.","ar":"يُستخدم الذكاء الاصطناعي في كل قطاع تقريبًا.","e":"","alt":[]},{"en":"Many experts warned that AI could replace millions of jobs.","he":"מומחים רבים הזהירו שבינה מלאכותית עלולה להחליף מיליוני משרות.","ru":"Многие эксперты предупреждали, что ИИ может заменить миллионы рабочих мест.","ar":"حذّر كثير من الخبراء من أن الذكاء الاصطناعي قد يحلّ محلّ ملايين الوظائف.","e":"","alt":[]},{"en":"The program that wrote this essay was trained on millions of texts.","he":"התוכנה שכתבה את החיבור הזה אומנה על מיליוני טקסטים.","ru":"Программа, написавшая это сочинение, обучалась на миллионах текстов.","ar":"دُرِّب البرنامج الذي كتب هذا المقال على ملايين النصوص.","e":"","alt":[]},{"en":"My teacher said that we shouldn't rely on chatbots for homework.","he":"המורה שלי אמרה שאסור לנו להסתמך על צ׳טבוטים בשיעורי הבית.","ru":"Учительница сказала, что нам не стоит полагаться на чат-ботов при выполнении домашних заданий.","ar":"قالت معلمتي إنه لا ينبغي لنا الاعتماد على روبوتات الدردشة في الواجبات المنزلية.","e":"","alt":[]},{"en":"AI can analyze data much faster than humans can.","he":"בינה מלאכותית יכולה לנתח נתונים מהר הרבה יותר מבני אדם.","ru":"ИИ может анализировать данные гораздо быстрее, чем люди.","ar":"يستطيع الذكاء الاصطناعي تحليل البيانات أسرع بكثير من البشر.","e":"","alt":[]},{"en":"Who is responsible when a self-driving car causes an accident?","he":"מי אחראי כשמכונית אוטונומית גורמת לתאונה?","ru":"Кто несёт ответственность, если беспилотный автомобиль становится причиной аварии?","ar":"من المسؤول عندما تتسبب سيارة ذاتية القيادة في حادث؟","e":"","alt":[]}],"reading":{"en":"In recent years, AI tools have been introduced into many Israeli schools. Supporters claim that these tools allow each student to learn at his or her own pace. For example, a student who struggles with algebra can receive extra exercises and instant feedback. Critics, however, argue that students who depend on AI may never develop the ability to think independently. They also point out that AI sometimes produces answers which sound convincing but are completely wrong. Most teachers agree that the solution is not to ban AI, but to teach students how to use it critically. As one principal from Netanya put it, 'A calculator did not destroy mathematics, and AI will not destroy learning.'","he":"בשנים האחרונות הוכנסו כלי בינה מלאכותית לבתי ספר רבים בישראל. התומכים טוענים שהכלים האלה מאפשרים לכל תלמיד ללמוד בקצב שלו. לדוגמה, תלמיד שמתקשה באלגברה יכול לקבל תרגילים נוספים ומשוב מיידי. המבקרים, לעומת זאת, טוענים שתלמידים שתלויים בבינה מלאכותית עלולים לעולם לא לפתח את היכולת לחשוב באופן עצמאי. הם גם מציינים שבינה מלאכותית מייצרת לפעמים תשובות שנשמעות משכנעות אבל שגויות לחלוטין. רוב המורים מסכימים שהפתרון אינו לאסור את השימוש בבינה מלאכותית, אלא ללמד את התלמידים להשתמש בה באופן ביקורתי. כפי שניסחה זאת מנהלת בית ספר מנתניה: 'המחשבון לא הרס את המתמטיקה, ובינה מלאכותית לא תהרוס את הלמידה.'","ru":"В последние годы во многих израильских школах начали использовать инструменты искусственного интеллекта. Сторонники утверждают, что эти инструменты позволяют каждому ученику учиться в своём темпе. Например, ученик, которому трудно даётся алгебра, может получать дополнительные упражнения и мгновенную обратную связь. Критики же утверждают, что ученики, зависящие от ИИ, могут так и не научиться мыслить самостоятельно. Они также отмечают, что ИИ иногда даёт ответы, которые звучат убедительно, но совершенно неверны. Большинство учителей согласны, что решение не в том, чтобы запретить ИИ, а в том, чтобы научить учеников пользоваться им критически. Как сказала директор одной школы из Нетании: «Калькулятор не уничтожил математику, и ИИ не уничтожит обучение».","ar":"في السنوات الأخيرة، أُدخلت أدوات الذكاء الاصطناعي إلى كثير من المدارس في إسرائيل. يزعم المؤيدون أن هذه الأدوات تتيح لكل طالب أن يتعلم بالوتيرة التي تناسبه. فعلى سبيل المثال، يمكن للطالب الذي يواجه صعوبة في الجبر أن يحصل على تمارين إضافية وتغذية راجعة فورية. أما المنتقدون فيرون أن الطلاب الذين يعتمدون على الذكاء الاصطناعي قد لا يطوّرون أبدًا القدرة على التفكير المستقل. ويشيرون أيضًا إلى أن الذكاء الاصطناعي ينتج أحيانًا إجابات تبدو مقنعة لكنها خاطئة تمامًا. ويتفق معظم المعلمين على أن الحل ليس في حظر الذكاء الاصطناعي، بل في تعليم الطلاب كيفية استخدامه بشكل نقدي. وكما قالت مديرة مدرسة من نتانيا: «الآلة الحاسبة لم تدمّر الرياضيات، والذكاء الاصطناعي لن يدمّر التعلّم».","questions":[["What advantage of AI do supporters mention?","Students can learn at their own pace.","Teachers can work fewer hours.","Schools can save money on books.","Students no longer need exams."],["What problem do critics point out?","AI answers may be wrong but convincing.","AI is too expensive for schools.","AI tools are too slow.","Students find AI boring."],["Why does the principal mention a calculator?","New tools need not harm learning.","Calculators should be banned in class.","AI is better than calculators.","Algebra is taught with calculators."]]}},{"en":"climate change","he":"שינוי האקלים","ru":"изменение климата","ar":"تغيّر المناخ","e":"🌡️","items":[{"en":"Global temperatures have risen sharply over the past century.","he":"הטמפרטורות בעולם עלו בחדות במהלך המאה האחרונה.","ru":"За последнее столетие глобальная температура резко повысилась.","ar":"ارتفعت درجات الحرارة العالمية بشكل حاد خلال القرن الماضي.","e":"","alt":[]},{"en":"If governments had acted earlier, the damage would have been smaller.","he":"אילו הממשלות היו פועלות מוקדם יותר, הנזק היה קטן יותר.","ru":"Если бы правительства начали действовать раньше, ущерб был бы меньше.","ar":"لو تحرّكت الحكومات في وقت أبكر، لكان الضرر أقل.","e":"","alt":[]},{"en":"Scientists reported that sea levels were rising faster than expected.","he":"מדענים דיווחו שגובה פני הים עולה מהר מהצפוי.","ru":"Учёные сообщили, что уровень моря растёт быстрее, чем ожидалось.","ar":"أفاد العلماء بأن مستوى سطح البحر يرتفع أسرع من المتوقع.","e":"","alt":[]},{"en":"Burning fossil fuels is the main cause of global warming.","he":"שריפת דלקים מאובנים היא הגורם העיקרי להתחממות הגלובלית.","ru":"Сжигание ископаемого топлива — главная причина глобального потепления.","ar":"حرق الوقود الأحفوري هو السبب الرئيسي للاحترار العالمي.","e":"","alt":[]},{"en":"Despite international agreements, emissions continue to increase.","he":"למרות הסכמים בינלאומיים, הפליטות ממשיכות לעלות.","ru":"Несмотря на международные соглашения, выбросы продолжают расти.","ar":"على الرغم من الاتفاقيات الدولية، تستمر الانبعاثات في الازدياد.","e":"","alt":[]},{"en":"Extreme weather events have become more frequent and more severe.","he":"אירועי מזג אוויר קיצוניים הפכו לתכופים וחמורים יותר.","ru":"Экстремальные погодные явления стали более частыми и сильными.","ar":"أصبحت الظواهر الجوية المتطرفة أكثر تكرارًا وشدة.","e":"","alt":[]}],"reading":{"en":"Israel is often described as a world leader in water technology. Decades ago, the country suffered from serious water shortages, which threatened both agriculture and daily life. In response, Israeli engineers developed drip irrigation, a method that delivers water directly to the roots of plants. Later, several large desalination plants were built along the Mediterranean coast. Today, most of the country's drinking water comes from the sea. Nevertheless, experts warn that desalination requires a great deal of energy, which can contribute to climate change. Therefore, researchers are now looking for ways to power these plants with renewable energy.","he":"ישראל מתוארת לעיתים קרובות כמובילה עולמית בטכנולוגיות מים. לפני עשרות שנים סבלה המדינה ממחסור חמור במים, שאיים הן על החקלאות והן על חיי היומיום. בתגובה, מהנדסים ישראלים פיתחו את ההשקיה בטפטוף, שיטה שמובילה מים ישירות אל שורשי הצמחים. מאוחר יותר נבנו כמה מתקני התפלה גדולים לאורך חוף הים התיכון. כיום רוב מי השתייה של המדינה מגיעים מהים. עם זאת, מומחים מזהירים שהתפלה דורשת כמות גדולה של אנרגיה, דבר שעלול לתרום לשינוי האקלים. לכן חוקרים מחפשים כעת דרכים להפעיל את המתקנים האלה באמצעות אנרגיה מתחדשת.","ru":"Израиль часто называют мировым лидером в области водных технологий. Несколько десятилетий назад страна страдала от серьёзной нехватки воды, которая угрожала как сельскому хозяйству, так и повседневной жизни. В ответ израильские инженеры разработали капельное орошение — метод, при котором вода подаётся прямо к корням растений. Позже вдоль побережья Средиземного моря было построено несколько крупных опреснительных заводов. Сегодня большая часть питьевой воды в стране поступает из моря. Тем не менее эксперты предупреждают, что опреснение требует огромного количества энергии, что может способствовать изменению климата. Поэтому исследователи сейчас ищут способы обеспечивать эти заводы возобновляемой энергией.","ar":"كثيرًا ما توصف إسرائيل بأنها رائدة عالميًا في تكنولوجيا المياه. فقبل عقود، عانت البلاد من نقص حاد في المياه هدّد الزراعة والحياة اليومية على حد سواء. وردًّا على ذلك، طوّر مهندسون إسرائيليون الري بالتنقيط، وهو أسلوب يوصل المياه مباشرة إلى جذور النباتات. ولاحقًا، بُنيت عدة محطات تحلية كبيرة على طول ساحل البحر الأبيض المتوسط. واليوم، تأتي معظم مياه الشرب في البلاد من البحر. ومع ذلك، يحذّر الخبراء من أن التحلية تتطلب كميات كبيرة من الطاقة، مما قد يسهم في تغيّر المناخ. لذلك يبحث الباحثون حاليًا عن طرق لتشغيل هذه المحطات بالطاقة المتجددة.","questions":[["Why did Israel develop new water technologies?","Because water was scarce.","Because the sea was polluted.","Because farmers wanted more rain.","Because other countries asked it to."],["Where does most of Israel's drinking water come from today?","Desalinated sea water.","The Sea of Galilee.","Underground rivers.","Rain collected in winter."],["What problem with desalination does the text mention?","It uses a lot of energy.","It makes water taste salty.","It damages plant roots.","It is illegal in Europe."]]}},{"en":"science","he":"מדע","ru":"наука","ar":"العلوم","e":"🔬","items":[{"en":"The vaccine, which was developed in record time, saved millions.","he":"החיסון, שפותח בזמן שיא, הציל מיליונים.","ru":"Вакцина, разработанная в рекордные сроки, спасла миллионы жизней.","ar":"أنقذ اللقاح، الذي طُوِّر في وقت قياسي، ملايين الأرواح.","e":"","alt":[]},{"en":"Scientists must test a theory many times before accepting it.","he":"מדענים חייבים לבדוק תיאוריה פעמים רבות לפני שהם מקבלים אותה.","ru":"Учёные должны много раз проверить теорию, прежде чем принять её.","ar":"يجب على العلماء اختبار النظرية مرات عديدة قبل قبولها.","e":"","alt":[]},{"en":"The experiment was repeated, but the results were the same.","he":"הניסוי נערך שוב, אך התוצאות היו זהות.","ru":"Эксперимент повторили, но результаты оказались теми же.","ar":"أُعيدت التجربة، لكن النتائج كانت نفسها.","e":"","alt":[]},{"en":"If water is heated to 100 degrees, it boils.","he":"אם מחממים מים ל-100 מעלות, הם רותחים.","ru":"Если нагреть воду до 100 градусов, она закипает.","ar":"إذا سُخّن الماء إلى 100 درجة، فإنه يغلي.","e":"","alt":[]},{"en":"Israel launched its first satellite into space in 1988.","he":"ישראל שיגרה את הלוויין הראשון שלה לחלל ב-1988.","ru":"Израиль запустил свой первый спутник в космос в 1988 году.","ar":"أطلقت إسرائيل أول قمر صناعي لها إلى الفضاء عام 1988.","e":"","alt":[]},{"en":"The researcher explained that the discovery had happened by accident.","he":"החוקרת הסבירה שהתגלית קרתה במקרה.","ru":"Исследовательница объяснила, что открытие произошло случайно.","ar":"أوضحت الباحثة أن الاكتشاف حدث بالصدفة.","e":"","alt":[]}],"reading":{"en":"In 2019, a small Israeli spacecraft called Beresheet attempted to land on the Moon. It had been built by a non-profit organization rather than by a government, which made the project unique. The spacecraft travelled for about seven weeks before reaching the Moon. Unfortunately, during the final stage of landing, one of its engines failed, and Beresheet crashed onto the surface. Although the mission did not succeed, many people considered it a great achievement. Israel became only the seventh country to orbit the Moon, and millions of children were inspired to study science. The team soon announced that they would try again.","he":"ב-2019 ניסתה חללית ישראלית קטנה בשם 'בראשית' לנחות על הירח. היא נבנתה על ידי עמותה ולא על ידי ממשלה, מה שהפך את הפרויקט לייחודי. החללית נסעה כשבעה שבועות עד שהגיעה לירח. לרוע המזל, בשלב האחרון של הנחיתה אחד המנועים שלה כשל, ו'בראשית' התרסקה על פני הירח. אף על פי שהמשימה לא הצליחה, אנשים רבים ראו בה הישג גדול. ישראל הפכה למדינה השביעית בלבד שהקיפה את הירח, ומיליוני ילדים קיבלו השראה ללמוד מדעים. זמן קצר לאחר מכן הודיע הצוות שינסה שוב.","ru":"В 2019 году небольшой израильский космический аппарат «Берешит» попытался совершить посадку на Луну. Его построила некоммерческая организация, а не государство, что сделало проект уникальным. Аппарат летел около семи недель, прежде чем достиг Луны. К сожалению, на последнем этапе посадки отказал один из двигателей, и «Берешит» разбился о поверхность. Хотя миссия не увенчалась успехом, многие сочли её большим достижением. Израиль стал лишь седьмой страной, вышедшей на орбиту Луны, а миллионы детей вдохновились изучать науку. Вскоре команда объявила, что попробует снова.","ar":"في عام 2019، حاولت مركبة فضائية إسرائيلية صغيرة تُدعى «بريشيت» الهبوط على القمر. وقد بنتها منظمة غير ربحية لا حكومة، وهو ما جعل المشروع فريدًا. سافرت المركبة نحو سبعة أسابيع قبل أن تصل إلى القمر. ولسوء الحظ، تعطّل أحد محركاتها في المرحلة الأخيرة من الهبوط، فتحطمت «بريشيت» على سطحه. ورغم أن المهمة لم تنجح، فقد عدّها كثيرون إنجازًا عظيمًا. فقد أصبحت إسرائيل الدولة السابعة فقط التي تدور حول القمر، وأُلهم ملايين الأطفال لدراسة العلوم. وسرعان ما أعلن الفريق أنه سيحاول مجددًا.","questions":[["What made the Beresheet project unique?","It was not built by a government.","It was the first Moon landing ever.","It carried astronauts to the Moon.","It was built in seven weeks."],["Why did Beresheet crash?","An engine failed while landing.","It ran out of fuel early.","It hit a satellite in space.","The team lost all contact."],["Why was the mission seen as an achievement?","It inspired people despite failing.","It found water on the Moon.","It landed safely on the Moon.","It made a large profit."]]}},{"en":"history","he":"היסטוריה","ru":"история","ar":"التاريخ","e":"🏛️","items":[{"en":"The Dead Sea Scrolls were discovered by a shepherd in 1947.","he":"מגילות ים המלח התגלו על ידי רועה ב-1947.","ru":"Свитки Мёртвого моря были обнаружены пастухом в 1947 году.","ar":"اكتُشفت مخطوطات البحر الميت على يد راعٍ عام 1947.","e":"","alt":[]},{"en":"If the printing press hadn't been invented, books would have remained rare.","he":"אילולא הומצא הדפוס, ספרים היו נשארים נדירים.","ru":"Если бы не изобрели книгопечатание, книги так и остались бы редкостью.","ar":"لو لم تُخترع المطبعة، لظلّت الكتب نادرة.","e":"","alt":[]},{"en":"Historians argue that we must learn from the mistakes of the past.","he":"היסטוריונים טוענים שעלינו ללמוד מטעויות העבר.","ru":"Историки утверждают, что мы должны учиться на ошибках прошлого.","ar":"يرى المؤرخون أن علينا التعلّم من أخطاء الماضي.","e":"","alt":[]},{"en":"The city, which was built by the Romans, is now in ruins.","he":"העיר, שנבנתה על ידי הרומאים, נמצאת היום בחורבות.","ru":"Город, построенный римлянами, теперь лежит в руинах.","ar":"المدينة التي بناها الرومان أصبحت اليوم أطلالًا.","e":"","alt":[]},{"en":"The war ended after both sides signed a peace agreement.","he":"המלחמה הסתיימה לאחר ששני הצדדים חתמו על הסכם שלום.","ru":"Война закончилась после того, как обе стороны подписали мирный договор.","ar":"انتهت الحرب بعد أن وقّع الطرفان اتفاقية سلام.","e":"","alt":[]},{"en":"Many immigrants arrived in Israel with nothing but hope.","he":"עולים רבים הגיעו לישראל בלי כלום מלבד תקווה.","ru":"Многие иммигранты приехали в Израиль, не имея ничего, кроме надежды.","ar":"وصل كثير من المهاجرين إلى إسرائيل لا يملكون سوى الأمل.","e":"","alt":[]}],"reading":{"en":"Masada is an ancient fortress which stands on top of a high rock near the Dead Sea. It was built by King Herod in the first century BCE as a palace and a place of safety. According to the historian Josephus, a group of Jewish rebels escaped there after the Romans destroyed Jerusalem. The Romans surrounded the fortress and built a huge ramp in order to reach the top. Josephus wrote that the rebels chose to die rather than become slaves. However, some modern historians question whether every detail of his story is accurate. Today, Masada is a UNESCO World Heritage Site and is visited by hundreds of thousands of tourists each year.","he":"מצדה היא מבצר עתיק העומד על ראש צוק גבוה ליד ים המלח. הוא נבנה על ידי המלך הורדוס במאה הראשונה לפני הספירה כארמון וכמקום מבטחים. לפי ההיסטוריון יוסף בן מתתיהו, קבוצה של מורדים יהודים נמלטה לשם לאחר שהרומאים החריבו את ירושלים. הרומאים כיתרו את המבצר ובנו סוללה ענקית כדי להגיע לראשו. יוסף בן מתתיהו כתב שהמורדים בחרו למות ולא להפוך לעבדים. עם זאת, יש היסטוריונים בני זמננו המטילים ספק בכך שכל פרט בסיפורו מדויק. כיום מצדה היא אתר מורשת עולמית של אונסק״ו, ומאות אלפי תיירים מבקרים בה מדי שנה.","ru":"Масада — древняя крепость, расположенная на вершине высокой скалы у Мёртвого моря. Её построил царь Ирод в I веке до н. э. как дворец и убежище. По словам историка Иосифа Флавия, группа еврейских повстанцев бежала туда после того, как римляне разрушили Иерусалим. Римляне окружили крепость и построили огромную насыпь, чтобы добраться до вершины. Иосиф Флавий писал, что повстанцы предпочли смерть рабству. Однако некоторые современные историки сомневаются, что каждая деталь его рассказа достоверна. Сегодня Масада — объект Всемирного наследия ЮНЕСКО, и ежегодно её посещают сотни тысяч туристов.","ar":"مسعدة قلعة قديمة تقع على قمة صخرة عالية قرب البحر الميت. بناها الملك هيرودس في القرن الأول قبل الميلاد لتكون قصرًا وملاذًا آمنًا. ووفقًا للمؤرخ يوسيفوس، فرّت مجموعة من المتمردين اليهود إليها بعد أن دمّر الرومان القدس. حاصر الرومان القلعة وبنوا منحدرًا ضخمًا للوصول إلى قمتها. وكتب يوسيفوس أن المتمردين اختاروا الموت على أن يصبحوا عبيدًا. ومع ذلك، يشكّك بعض المؤرخين المعاصرين في دقة كل تفاصيل روايته. واليوم، تُعدّ مسعدة موقعًا من مواقع التراث العالمي لليونسكو، ويزورها مئات الآلاف من السياح كل عام.","questions":[["Who originally built Masada?","King Herod.","The Roman army.","The Jewish rebels.","The historian Josephus."],["Why did the Romans build a ramp?","To reach the top of the fortress.","To bring water from the Dead Sea.","To make a road to Jerusalem.","To help tourists visit the site."],["What do some modern historians doubt?","That Josephus's story is fully accurate.","That Masada really exists.","That the Romans came to Masada.","That tourists enjoy visiting Masada."]]}},{"en":"careers","he":"קריירה ועבודה","ru":"карьера","ar":"المهن","e":"💼","items":[{"en":"Employers are looking for people who can work in a team.","he":"מעסיקים מחפשים אנשים שיודעים לעבוד בצוות.","ru":"Работодатели ищут людей, которые умеют работать в команде.","ar":"يبحث أصحاب العمل عن أشخاص يجيدون العمل ضمن فريق.","e":"","alt":[]},{"en":"She was offered the job because of her excellent references.","he":"הציעו לה את המשרה בזכות ההמלצות המצוינות שלה.","ru":"Ей предложили эту работу благодаря отличным рекомендациям.","ar":"عُرضت عليها الوظيفة بفضل توصياتها الممتازة.","e":"","alt":[]},{"en":"The interviewer asked me why I wanted to work there.","he":"המראיין שאל אותי למה אני רוצה לעבוד שם.","ru":"Интервьюер спросил меня, почему я хочу там работать.","ar":"سألني المُحاوِر لماذا أريد العمل هناك.","e":"","alt":[]},{"en":"If I had known about the course, I would have applied.","he":"אילו ידעתי על הקורס, הייתי נרשם אליו.","ru":"Если бы я знал об этом курсе, я бы подал заявку.","ar":"لو كنتُ أعرف بشأن الدورة، لتقدّمتُ إليها.","e":"","alt":[]},{"en":"Many young Israelis dream of working in high-tech.","he":"צעירים ישראלים רבים חולמים לעבוד בהייטק.","ru":"Многие молодые израильтяне мечтают работать в хайтеке.","ar":"يحلم كثير من الشباب الإسرائيليين بالعمل في مجال الهايتك.","e":"","alt":[]},{"en":"Job satisfaction is often more important than a high salary.","he":"סיפוק בעבודה חשוב לעיתים קרובות יותר ממשכורת גבוהה.","ru":"Удовлетворённость работой часто важнее высокой зарплаты.","ar":"غالبًا ما يكون الرضا الوظيفي أهم من الراتب المرتفع.","e":"","alt":[]}],"reading":{"en":"A recent survey asked two thousand Israeli teenagers what they considered most important in a future job. Surprisingly, a high salary came only third on the list. The most popular answer was 'meaningful work', followed closely by 'a good work-life balance'. Researchers believe that this reflects a wider change among young people around the world. Unlike their parents, many teenagers say that they would rather earn less than do a job which makes them unhappy. Some employers have already responded by offering flexible hours and the option to work from home. Nevertheless, experts point out that young people's priorities may change once they have to pay rent.","he":"סקר שנערך לאחרונה שאל אלפיים בני נוער ישראלים מה הם רואים כחשוב ביותר בעבודה עתידית. באופן מפתיע, משכורת גבוהה הגיעה רק למקום השלישי ברשימה. התשובה הפופולרית ביותר הייתה 'עבודה משמעותית', ומיד אחריה 'איזון טוב בין עבודה לחיים'. החוקרים מאמינים שהדבר משקף שינוי רחב יותר בקרב צעירים ברחבי העולם. בניגוד להוריהם, בני נוער רבים אומרים שהם מעדיפים להרוויח פחות מאשר לעבוד בעבודה שגורמת להם להיות אומללים. חלק מהמעסיקים כבר הגיבו והם מציעים שעות גמישות ואפשרות לעבוד מהבית. עם זאת, מומחים מציינים שסדרי העדיפויות של צעירים עשויים להשתנות ברגע שיצטרכו לשלם שכר דירה.","ru":"В ходе недавнего опроса две тысячи израильских подростков спросили, что для них важнее всего в будущей работе. Удивительно, но высокая зарплата оказалась лишь на третьем месте. Самым популярным ответом была «значимая работа», а сразу за ней — «хороший баланс между работой и личной жизнью». Исследователи считают, что это отражает более широкие перемены среди молодёжи во всём мире. В отличие от своих родителей, многие подростки говорят, что предпочли бы зарабатывать меньше, чем заниматься работой, которая делает их несчастными. Некоторые работодатели уже отреагировали, предложив гибкий график и возможность работать из дома. Тем не менее эксперты отмечают, что приоритеты молодых людей могут измениться, как только им придётся платить за аренду.","ar":"سأل استطلاع حديث ألفي مراهق إسرائيلي عمّا يعدّونه الأهم في وظيفة المستقبل. والمفاجئ أن الراتب المرتفع جاء في المرتبة الثالثة فقط. وكانت الإجابة الأكثر شيوعًا «عمل ذو معنى»، تلتها مباشرة «توازن جيد بين العمل والحياة». ويرى الباحثون أن ذلك يعكس تغيّرًا أوسع لدى الشباب حول العالم. فعلى عكس آبائهم، يقول كثير من المراهقين إنهم يفضّلون أن يكسبوا أقل على أن يعملوا في وظيفة تجعلهم تعساء. وقد استجاب بعض أصحاب العمل بالفعل بتقديم ساعات عمل مرنة وإمكانية العمل من المنزل. ومع ذلك، يشير الخبراء إلى أن أولويات الشباب قد تتغير حين يضطرون إلى دفع الإيجار.","questions":[["Which answer was most popular in the survey?","Meaningful work.","A high salary.","Working from home.","A famous company."],["How have some employers reacted?","By offering flexible working conditions.","By raising salaries for teenagers.","By refusing to hire young people.","By cancelling remote work."],["What do experts suggest in the last sentence?","Priorities might change with real expenses.","Teenagers will never pay rent.","Salaries will soon become higher.","The survey results were false."]]}},{"en":"national service","he":"צבא ושירות לאומי","ru":"армия и национальная служба","ar":"الخدمة العسكرية والوطنية","e":"🎖️","dialog":true,"items":[{"q":"What are your plans after you finish school?","en":"I'm planning to do a gap year before joining the army.","he":"אני מתכנן לעשות שנת שירות לפני הגיוס לצבא.","ru":"Я планирую взять год перерыва перед призывом в армию.","ar":"أخطط لأخذ سنة تطوعية قبل الالتحاق بالجيش."},{"q":"Why do you think national service is valuable?","en":"It teaches young people responsibility and helps the whole community.","he":"הוא מלמד צעירים אחריות ועוזר לכל הקהילה.","ru":"Она учит молодых людей ответственности и помогает всему обществу.","ar":"إنها تعلّم الشباب المسؤولية وتساعد المجتمع بأسره."},{"q":"What kind of role would you like to have?","en":"I'd like a role where I can use my technology skills.","he":"הייתי רוצה תפקיד שבו אוכל להשתמש בכישורי הטכנולוגיה שלי.","ru":"Я бы хотел такую должность, где смогу использовать свои технические навыки.","ar":"أودّ دورًا أستطيع فيه استخدام مهاراتي التكنولوجية."},{"q":"Are you worried about leaving home?","en":"A little, but I believe it will make me more independent.","he":"קצת, אבל אני מאמין שזה יהפוך אותי לעצמאי יותר.","ru":"Немного, но я верю, что это сделает меня более самостоятельным.","ar":"قليلًا، لكنني أعتقد أن ذلك سيجعلني أكثر استقلالية."},{"q":"What did your older friends tell you about their service?","en":"They told me it was hard but the best experience of their lives.","he":"הם סיפרו לי שזה היה קשה, אבל החוויה הכי טובה בחייהם.","ru":"Они сказали мне, что было тяжело, но это был лучший опыт в их жизни.","ar":"أخبروني أنها كانت صعبة لكنها أفضل تجربة في حياتهم."},{"q":"If you could choose anything, what would you do?","en":"If I could choose, I would work with youth at risk.","he":"אילו יכולתי לבחור, הייתי עובד עם נוער בסיכון.","ru":"Если бы я мог выбирать, я бы работал с трудными подростками.","ar":"لو كان بإمكاني الاختيار، لعملتُ مع الشباب المعرّضين للخطر."}]}]},{"id":"h12","group":"high","he":"5 יחידות לימוד","sub":"בגרות 5 יח״ל: רמה אקדמית","e":"🎓","units":[{"en":"ethics","he":"אתיקה ומוסר","ru":"этика","ar":"الأخلاقيات","e":"⚖️","items":[{"en":"Had scientists considered the consequences, they might have acted differently.","he":"אילו המדענים היו שוקלים את ההשלכות, ייתכן שהיו פועלים אחרת.","ru":"Если бы учёные задумались о последствиях, они, возможно, поступили бы иначе.","ar":"لو أن العلماء أخذوا العواقب في الحسبان، لربما تصرّفوا بشكل مختلف.","e":"","alt":[]},{"en":"Is it ever justified to break the law for a moral cause?","he":"האם אי פעם מוצדק להפר את החוק למען מטרה מוסרית?","ru":"Оправдано ли когда-либо нарушать закон ради моральной цели?","ar":"هل يكون خرق القانون مبرَّرًا يومًا من أجل قضية أخلاقية؟","e":"","alt":[]},{"en":"Genetic engineering raises difficult questions about what it means to be human.","he":"הנדסה גנטית מעוררת שאלות קשות לגבי המשמעות של להיות אדם.","ru":"Генная инженерия поднимает трудные вопросы о том, что значит быть человеком.","ar":"تثير الهندسة الوراثية أسئلة صعبة حول معنى أن تكون إنسانًا.","e":"","alt":[]},{"en":"Critics claim that animal testing is both cruel and unnecessary.","he":"המבקרים טוענים שניסויים בבעלי חיים הם אכזריים ומיותרים כאחד.","ru":"Критики утверждают, что опыты на животных жестоки и к тому же не нужны.","ar":"يزعم المنتقدون أن التجارب على الحيوانات قاسية وغير ضرورية في آن واحد.","e":"","alt":[]},{"en":"Not only is cheating dishonest, but it also harms the cheater.","he":"העתקה היא לא רק חוסר יושר, אלא היא גם פוגעת במעתיק עצמו.","ru":"Списывание не только нечестно, но и вредит самому списывающему.","ar":"الغش ليس عملًا غير نزيه فحسب، بل يضرّ بالغشّاش نفسه أيضًا.","e":"","alt":[]},{"en":"Personal data should not be sold without the user's consent.","he":"אין למכור מידע אישי ללא הסכמת המשתמש.","ru":"Персональные данные не должны продаваться без согласия пользователя.","ar":"لا ينبغي بيع البيانات الشخصية دون موافقة المستخدم.","e":"","alt":[]}],"reading":{"en":"Imagine a self-driving car that must choose between two terrible outcomes: hitting a group of pedestrians or swerving and endangering its own passenger. This dilemma, a modern version of the famous 'trolley problem', is no longer merely a philosophical exercise. Engineers must now decide in advance how their vehicles should behave in such situations. A large international study found that people's answers varied considerably depending on their culture and age. Some respondents insisted that the car should always protect the greatest number of lives, while others argued that a passenger who buys a car is entitled to be protected. Critics of the entire debate maintain that such extreme scenarios are extremely rare and distract from more pressing safety issues. Nonetheless, the question of who should program morality into machines remains unresolved.","he":"דמיינו מכונית אוטונומית שחייבת לבחור בין שתי תוצאות נוראיות: לפגוע בקבוצת הולכי רגל או לסטות ולסכן את הנוסע שלה. הדילמה הזו, גרסה מודרנית של 'בעיית הקרונית' המפורסמת, כבר אינה רק תרגיל פילוסופי. מהנדסים צריכים כיום להחליט מראש כיצד כלי הרכב שלהם יתנהגו במצבים כאלה. מחקר בינלאומי גדול מצא שתשובותיהם של אנשים השתנו במידה ניכרת בהתאם לתרבותם ולגילם. חלק מהנשאלים התעקשו שהמכונית צריכה תמיד להגן על המספר הגדול ביותר של חיים, בעוד שאחרים טענו שנוסע שקונה מכונית זכאי להגנה. מבקרי הוויכוח כולו טוענים שתרחישים קיצוניים כאלה נדירים ביותר ומסיטים את תשומת הלב מבעיות בטיחות דחופות יותר. אף על פי כן, השאלה מי צריך לתכנת מוסר לתוך מכונות נותרה פתוחה.","ru":"Представьте себе беспилотный автомобиль, который должен выбрать между двумя ужасными исходами: сбить группу пешеходов или свернуть и подвергнуть опасности собственного пассажира. Эта дилемма, современная версия знаменитой «проблемы вагонетки», больше не является лишь философским упражнением. Сегодня инженеры должны заранее решать, как их автомобили будут вести себя в подобных ситуациях. Крупное международное исследование показало, что ответы людей значительно различались в зависимости от их культуры и возраста. Одни респонденты настаивали, что машина всегда должна спасать как можно больше жизней, тогда как другие утверждали, что пассажир, купивший автомобиль, имеет право на защиту. Критики всей этой дискуссии считают, что такие крайние сценарии чрезвычайно редки и отвлекают от более насущных проблем безопасности. Тем не менее вопрос о том, кто должен закладывать мораль в машины, остаётся нерешённым.","ar":"تخيّل سيارة ذاتية القيادة مضطرة إلى الاختيار بين نتيجتين مروّعتين: أن تصدم مجموعة من المشاة أو أن تنحرف فتعرّض راكبها للخطر. لم تعد هذه المعضلة، وهي نسخة حديثة من «مشكلة العربة» الشهيرة، مجرد تمرين فلسفي. فعلى المهندسين اليوم أن يقرروا مسبقًا كيف ستتصرف مركباتهم في مثل هذه المواقف. وقد وجدت دراسة دولية كبيرة أن إجابات الناس تفاوتت تفاوتًا كبيرًا بحسب ثقافتهم وأعمارهم. فقد أصرّ بعض المشاركين على أن السيارة يجب أن تحمي دائمًا أكبر عدد من الأرواح، في حين رأى آخرون أن الراكب الذي يشتري سيارة يحق له أن يحظى بالحماية. أما منتقدو هذا الجدل برمّته فيؤكدون أن مثل هذه السيناريوهات المتطرفة نادرة للغاية وتصرف الانتباه عن قضايا سلامة أكثر إلحاحًا. ومع ذلك، تظل مسألة من ينبغي أن يبرمج الأخلاق في الآلات دون حل.","questions":[["Why is the trolley problem now a practical issue?","Engineers must program cars' decisions.","Trolleys have returned to big cities.","Philosophers now design cars.","Passengers vote on car behavior."],["What did the international study reveal?","Answers differed across cultures and ages.","Everyone agreed on the same answer.","Most people refuse to buy such cars.","Older people prefer trolleys."],["What is the critics' main argument?","The scenarios are rare and distracting.","Cars should always protect passengers.","Self-driving cars should be banned.","Morality cannot be studied."]]}},{"en":"global issues","he":"סוגיות גלובליות","ru":"глобальные проблемы","ar":"القضايا العالمية","e":"🌐","items":[{"en":"Were poverty to be eliminated, many conflicts would disappear.","he":"אילו העוני היה מבוטל, סכסוכים רבים היו נעלמים.","ru":"Если бы бедность была искоренена, многие конфликты исчезли бы.","ar":"لو قُضي على الفقر، لاختفت صراعات كثيرة.","e":"","alt":[]},{"en":"Millions of refugees have been forced to leave their homes.","he":"מיליוני פליטים נאלצו לעזוב את בתיהם.","ru":"Миллионы беженцев были вынуждены покинуть свои дома.","ar":"اضطُرّ ملايين اللاجئين إلى مغادرة منازلهم.","e":"","alt":[]},{"en":"Access to clean water is a basic human right.","he":"גישה למים נקיים היא זכות אדם בסיסית.","ru":"Доступ к чистой воде — одно из основных прав человека.","ar":"الحصول على المياه النظيفة حق أساسي من حقوق الإنسان.","e":"","alt":[]},{"en":"Wealthy nations have a responsibility to support developing countries.","he":"למדינות עשירות יש אחריות לתמוך במדינות מתפתחות.","ru":"Богатые страны обязаны поддерживать развивающиеся страны.","ar":"تقع على عاتق الدول الغنية مسؤولية دعم الدول النامية.","e":"","alt":[]},{"en":"Globalization has brought both economic growth and growing inequality.","he":"הגלובליזציה הביאה גם צמיחה כלכלית וגם אי-שוויון גובר.","ru":"Глобализация принесла как экономический рост, так и растущее неравенство.","ar":"جلبت العولمة النمو الاقتصادي وتزايد عدم المساواة معًا.","e":"","alt":[]},{"en":"The pandemic demonstrated how interconnected the world has become.","he":"המגפה הדגימה עד כמה העולם הפך מקושר.","ru":"Пандемия показала, насколько взаимосвязанным стал мир.","ar":"أظهرت الجائحة مدى الترابط الذي بات عليه العالم.","e":"","alt":[]}],"reading":{"en":"Food waste is one of the most overlooked global problems. According to the United Nations, roughly one third of all food produced worldwide is never eaten, while hundreds of millions of people suffer from hunger. Wasted food not only represents a loss of money and resources but also releases methane, a powerful greenhouse gas, as it rots in landfills. In Israel, organizations such as Leket Israel collect surplus food from farms, hotels and army bases and distribute it to families in need. Had such initiatives existed decades ago, enormous quantities of food could have been saved. Experts argue, however, that charity alone cannot solve the problem; rather, changes are required in the way food is produced, sold and consumed. Consumers, for instance, often throw away products that are perfectly safe simply because they look imperfect.","he":"בזבוז מזון הוא אחת הבעיות הגלובליות המוזנחות ביותר. לפי האו״ם, כשליש מכל המזון המיוצר בעולם לעולם אינו נאכל, בעוד מאות מיליוני אנשים סובלים מרעב. מזון מבוזבז אינו מייצג רק אובדן של כסף ומשאבים, אלא גם משחרר מתאן, גז חממה רב עוצמה, כשהוא נרקב במטמנות. בישראל, ארגונים כמו לקט ישראל אוספים עודפי מזון מחוות חקלאיות, ממלונות ומבסיסי צבא ומחלקים אותם למשפחות נזקקות. אילו יוזמות כאלה היו קיימות לפני עשרות שנים, ניתן היה להציל כמויות עצומות של מזון. עם זאת, מומחים טוענים שצדקה לבדה אינה יכולה לפתור את הבעיה; נדרשים שינויים באופן שבו מזון מיוצר, נמכר ונצרך. צרכנים, למשל, זורקים לעיתים קרובות מוצרים בטוחים לחלוטין רק משום שהם נראים לא מושלמים.","ru":"Пищевые отходы — одна из самых недооценённых глобальных проблем. По данным ООН, примерно треть всей производимой в мире еды так и не съедается, в то время как сотни миллионов людей страдают от голода. Выброшенная еда означает не только потерю денег и ресурсов: гниющая на свалках, она выделяет метан — мощный парниковый газ. В Израиле такие организации, как «Лекет Исраэль», собирают излишки продуктов на фермах, в гостиницах и на военных базах и раздают их нуждающимся семьям. Если бы подобные инициативы существовали десятилетия назад, можно было бы спасти огромное количество еды. Однако эксперты утверждают, что одна лишь благотворительность не может решить проблему; необходимы изменения в том, как еда производится, продаётся и потребляется. Например, потребители часто выбрасывают совершенно безопасные продукты только потому, что они выглядят неидеально.","ar":"يُعدّ هدر الطعام من أكثر المشكلات العالمية التي يُغفل عنها. فبحسب الأمم المتحدة، لا يُؤكل نحو ثلث الطعام المنتَج في العالم أبدًا، بينما يعاني مئات الملايين من الجوع. ولا يمثّل الطعام المهدَر خسارة للمال والموارد فحسب، بل يطلق أيضًا غاز الميثان، وهو من غازات الدفيئة القوية، عندما يتعفّن في مكبّات النفايات. وفي إسرائيل، تجمع منظمات مثل «ليكيت يسرائيل» فائض الطعام من المزارع والفنادق والقواعد العسكرية وتوزّعه على الأسر المحتاجة. ولو وُجدت مثل هذه المبادرات قبل عقود، لأمكن إنقاذ كميات هائلة من الطعام. ومع ذلك، يرى الخبراء أن العمل الخيري وحده لا يستطيع حل المشكلة؛ بل لا بد من تغييرات في طريقة إنتاج الطعام وبيعه واستهلاكه. فالمستهلكون مثلًا كثيرًا ما يرمون منتجات آمنة تمامًا لمجرد أن مظهرها غير مثالي.","questions":[["What paradox does the text describe?","Food is wasted while people go hungry.","Farms produce too little food.","Hungry people waste the most food.","Charities refuse to collect food."],["Why is rotting food harmful to the environment?","It releases a greenhouse gas.","It attracts dangerous animals.","It pollutes drinking water.","It uses up land for farming."],["What do experts believe is necessary?","Systemic change, not only charity.","More landfills around the world.","Banning imperfect-looking products.","Closing hotels and army bases."]]}},{"en":"university","he":"אוניברסיטה","ru":"университет","ar":"الجامعة","e":"🏫","items":[{"en":"Applicants are required to submit their psychometric scores by March.","he":"על המועמדים להגיש את ציוני הפסיכומטרי עד מרץ.","ru":"Абитуриенты должны предоставить результаты психометрического экзамена до марта.","ar":"يُطلب من المتقدمين تقديم نتائج امتحان البسيخومتري بحلول شهر مارس.","e":"","alt":[]},{"en":"Had I studied harder in high school, I'd have more options now.","he":"אילו הייתי לומד קשה יותר בתיכון, היו לי עכשיו יותר אפשרויות.","ru":"Если бы я усерднее учился в школе, сейчас у меня было бы больше вариантов.","ar":"لو أنني درستُ بجدّ أكبر في الثانوية، لكانت لديّ خيارات أكثر الآن.","e":"","alt":[]},{"en":"Tuition fees in Israel are relatively low compared to the United States.","he":"שכר הלימוד בישראל נמוך יחסית לעומת ארצות הברית.","ru":"Плата за обучение в Израиле относительно низкая по сравнению с США.","ar":"الرسوم الدراسية في إسرائيل منخفضة نسبيًا مقارنةً بالولايات المتحدة.","e":"","alt":[]},{"en":"The lecturer emphasized that plagiarism would not be tolerated.","he":"המרצה הדגיש שלא תהיה שום סובלנות כלפי גניבה ספרותית.","ru":"Лектор подчеркнул, что плагиат не будет допускаться.","ar":"شدّد المحاضر على أن الانتحال لن يُتهاون معه.","e":"","alt":[]},{"en":"Many students combine their studies with a part-time job.","he":"סטודנטים רבים משלבים את הלימודים עם עבודה במשרה חלקית.","ru":"Многие студенты совмещают учёбу с работой на неполный день.","ar":"يجمع كثير من الطلاب بين دراستهم وعمل بدوام جزئي.","e":"","alt":[]},{"en":"Choosing a degree should be based on passion as well as prospects.","he":"הבחירה בתואר צריכה להתבסס על תשוקה וגם על סיכויי תעסוקה.","ru":"Выбор специальности должен основываться как на увлечении, так и на перспективах.","ar":"ينبغي أن يقوم اختيار التخصص على الشغف وعلى آفاق العمل أيضًا.","e":"","alt":[]}],"reading":{"en":"For many Israelis, the path to university is longer than it is in most Western countries. After completing their military or national service, a large number of young people travel abroad for several months before beginning their studies. Consequently, the average Israeli student starts a first degree at around the age of twenty-three or twenty-four. Some educators view this delay as a disadvantage, since graduates enter the job market later than their peers overseas. Others, however, argue that older students tend to be more mature, more focused and more certain about what they wish to study. Indeed, lecturers frequently report that Israeli students participate actively in class and are not afraid to challenge their professors. Whether the delay is a benefit or a burden, it is clearly a defining feature of Israeli higher education.","he":"עבור ישראלים רבים, הדרך לאוניברסיטה ארוכה יותר מאשר ברוב המדינות המערביות. לאחר סיום השירות הצבאי או הלאומי, צעירים רבים נוסעים לחו״ל לכמה חודשים לפני תחילת הלימודים. כתוצאה מכך, הסטודנט הישראלי הממוצע מתחיל תואר ראשון בגיל עשרים ושלוש או עשרים וארבע בערך. יש אנשי חינוך הרואים בעיכוב הזה חיסרון, שכן הבוגרים נכנסים לשוק העבודה מאוחר יותר מבני גילם בחו״ל. אחרים, לעומת זאת, טוענים שסטודנטים מבוגרים יותר נוטים להיות בשלים, ממוקדים ובטוחים יותר במה שהם רוצים ללמוד. ואכן, מרצים מדווחים לעיתים קרובות שסטודנטים ישראלים משתתפים באופן פעיל בשיעורים ואינם חוששים לערער על דברי המרצים שלהם. בין אם העיכוב הוא יתרון ובין אם הוא נטל, ברור שזהו מאפיין מובהק של ההשכלה הגבוהה בישראל.","ru":"Для многих израильтян путь в университет длиннее, чем в большинстве западных стран. После окончания военной или национальной службы многие молодые люди на несколько месяцев уезжают за границу, прежде чем начать учёбу. В результате средний израильский студент начинает получать первую степень примерно в двадцать три или двадцать четыре года. Некоторые педагоги считают эту задержку недостатком, поскольку выпускники выходят на рынок труда позже, чем их сверстники за рубежом. Другие, однако, утверждают, что более взрослые студенты, как правило, более зрелые, сосредоточенные и лучше понимают, что хотят изучать. И действительно, преподаватели часто отмечают, что израильские студенты активно участвуют в занятиях и не боятся спорить со своими профессорами. Преимущество это или бремя, но такая задержка явно является отличительной чертой израильского высшего образования.","ar":"بالنسبة إلى كثير من الإسرائيليين، يكون الطريق إلى الجامعة أطول منه في معظم الدول الغربية. فبعد إنهاء الخدمة العسكرية أو الوطنية، يسافر عدد كبير من الشباب إلى الخارج لعدة أشهر قبل بدء دراستهم. ونتيجة لذلك، يبدأ الطالب الإسرائيلي العادي دراسة اللقب الأول في سن الثالثة والعشرين أو الرابعة والعشرين تقريبًا. ويرى بعض التربويين في هذا التأخير عيبًا، إذ يدخل الخريجون سوق العمل في وقت متأخر عن أقرانهم في الخارج. في المقابل، يرى آخرون أن الطلاب الأكبر سنًّا يميلون إلى أن يكونوا أكثر نضجًا وتركيزًا ويقينًا بشأن ما يرغبون في دراسته. وبالفعل، كثيرًا ما يذكر المحاضرون أن الطلاب الإسرائيليين يشاركون بنشاط في المحاضرات ولا يخشون مجادلة أساتذتهم. وسواء أكان هذا التأخير ميزة أم عبئًا، فمن الواضح أنه سمة مميزة للتعليم العالي في إسرائيل.","questions":[["Why do Israeli students begin university later?","Service and travel come first.","Universities accept only older students.","High school lasts longer in Israel.","Tuition is too expensive for teens."],["What disadvantage of the delay is mentioned?","Graduates start working later.","Students forget what they learned.","Lecturers dislike older students.","Degrees take longer to finish."],["What does 'challenge their professors' suggest?","Students are confident and question ideas.","Students are rude and lazy.","Students rarely attend lectures.","Students prefer to study alone."]]}},{"en":"culture","he":"תרבות","ru":"культура","ar":"الثقافة","e":"🎭","items":[{"en":"Israeli society has been shaped by immigrants from over a hundred countries.","he":"החברה הישראלית עוצבה על ידי עולים מיותר ממאה מדינות.","ru":"Израильское общество сформировали иммигранты из более чем ста стран.","ar":"تشكّل المجتمعُ الإسرائيلي على يد مهاجرين من أكثر من مئة دولة.","e":"","alt":[]},{"en":"Traditions are passed down from one generation to the next.","he":"מסורות מועברות מדור לדור.","ru":"Традиции передаются из поколения в поколение.","ar":"تنتقل التقاليد من جيل إلى جيل.","e":"","alt":[]},{"en":"Some fear that global culture threatens local languages and customs.","he":"יש החוששים שהתרבות הגלובלית מאיימת על שפות ומנהגים מקומיים.","ru":"Некоторые опасаются, что глобальная культура угрожает местным языкам и об
