in cause of global warming.","Rural areas are becoming as hot as cities.","White roofs have completely solved the problem of urban heat."],["According to the passage, why do cities stay warm at night?","Building materials release the heat they stored slowly.","Air conditioners stop working after sunset.","Trees release heat into the air at night.","There is stronger wind in cities than in villages."],["The phrase 'such measures' in the third paragraph refers to...","white roofs, parks and planting trees","population growth and construction","heat waves and health risks","rising energy consumption"]]}},{"en":"academic vocabulary 2","he":"אוצר מילים אקדמי 2","ru":"академическая лексика 2","ar":"المفردات الأكاديمية 2","e":"📗","items":[{"en":"Fresh water is becoming increasingly scarce in many parts of the Middle East.","he":"מים מתוקים הופכים נדירים יותר ויותר באזורים רבים במזרח התיכון.","ru":"Пресная вода становится всё более дефицитной во многих частях Ближнего Востока.","ar":"أصبحت المياه العذبة نادرة بشكل متزايد في أجزاء كثيرة من الشرق الأوسط.","e":"","alt":[]},{"en":"The effect of the medication tends to diminish after several weeks of use.","he":"השפעת התרופה נוטה לפחות לאחר כמה שבועות של שימוש.","ru":"Действие лекарства, как правило, ослабевает через несколько недель применения.","ar":"يميل تأثير الدواء إلى التضاؤل بعد عدة أسابيع من الاستخدام.","e":"","alt":[]},{"en":"Historians attribute the decline of the empire to a combination of economic factors.","he":"היסטוריונים מייחסים את שקיעת האימפריה לשילוב של גורמים כלכליים.","ru":"Историки объясняют упадок империи сочетанием экономических факторов.","ar":"يعزو المؤرخون انحدار الإمبراطورية إلى مجموعة من العوامل الاقتصادية.","e":"","alt":[]},{"en":"Solar energy has become a viable alternative to coal in sunny countries like Israel.","he":"אנרגיה סולארית הפכה לחלופה ישימה לפחם במדינות שטופות שמש כמו ישראל.","ru":"Солнечная энергия стала жизнеспособной альтернативой углю в солнечных странах, таких как Израиль.","ar":"أصبحت الطاقة الشمسية بديلًا عمليًا للفحم في البلدان المشمسة مثل إسرائيل.","e":"","alt":[]},{"en":"Vitamin D deficiency is surprisingly prevalent, even in regions with plenty of sunshine.","he":"מחסור בוויטמין D נפוץ באופן מפתיע, אפילו באזורים שיש בהם שמש רבה.","ru":"Дефицит витамина D удивительно распространён даже в регионах, где много солнца.","ar":"نقص فيتامين د منتشر بشكل مفاجئ، حتى في المناطق التي تحظى بوفرة من أشعة الشمس.","e":"","alt":[]},{"en":"The notion that intelligence is fixed at birth has been rejected by most researchers.","he":"התפיסה שהאינטליגנציה נקבעת מלידה נדחתה על ידי רוב החוקרים.","ru":"Представление о том, что интеллект задан от рождения, отвергнуто большинством исследователей.","ar":"رفض معظم الباحثين فكرة أن الذكاء ثابت منذ الولادة.","e":"","alt":[]}],"reading":{"en":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that nearly half may disappear by the end of this century. Many of them are spoken by only a few hundred people, most of whom are elderly. When the last fluent speaker dies, the language is described as extinct.\n\nResearchers attribute this decline to several factors. Economic pressure often pushes young people to move to cities, where a dominant language such as English, Spanish or Mandarin offers better opportunities. Schools that teach only in the national language may further diminish the status of local languages, so that parents stop passing them on to their children.\n\nWhy should such losses concern anyone other than the speakers themselves? One reason is that each language reflects a unique way of organizing experience. Some languages, for example, have no words for left and right and describe location using directions such as north and south. Others contain detailed knowledge about local plants and animals that has never been written down.\n\nThe notion that a dying language cannot be saved is not entirely accurate. Hebrew, which was revived as a spoken language in the late nineteenth and early twentieth centuries, is often cited as an example. Revival, however, requires resources and commitment that are scarce in most small communities, and success is far from guaranteed.","he":"מתוך כשבעת אלפים השפות המדוברות כיום בעולם, בלשנים מעריכים שכמעט מחציתן עלולות להיעלם עד סוף המאה הזאת. רבות מהן מדוברות בפי כמה מאות אנשים בלבד, שרובם קשישים. כאשר הדובר השוטף האחרון מת, השפה מוגדרת כנכחדת.\n\nחוקרים מייחסים את הדעיכה הזאת לכמה גורמים. לחץ כלכלי דוחף לעיתים קרובות צעירים לעבור לערים, שבהן שפה דומיננטית כמו אנגלית, ספרדית או מנדרינית מציעה הזדמנויות טובות יותר. בתי ספר המלמדים רק בשפה הלאומית עלולים להחליש עוד יותר את מעמדן של השפות המקומיות, כך שהורים מפסיקים להעביר אותן לילדיהם.\n\nמדוע אובדן כזה צריך להדאיג מישהו מלבד הדוברים עצמם? סיבה אחת היא שכל שפה משקפת דרך ייחודית לארגן את החוויה האנושית. בשפות מסוימות, למשל, אין מילים לימין ולשמאל, והן מתארות מיקום באמצעות כיוונים כמו צפון ודרום. אחרות מכילות ידע מפורט על צמחים ובעלי חיים מקומיים שמעולם לא נכתב.\n\nהתפיסה ששפה גוססת אינה ניתנת להצלה אינה מדויקת לגמרי. העברית, שהוחייתה כשפה מדוברת בסוף המאה התשע-עשרה ובתחילת המאה העשרים, מובאת לעיתים קרובות כדוגמה. עם זאת, החייאה מחייבת משאבים ומחויבות שאינם בנמצא ברוב הקהילות הקטנות, וההצלחה רחוקה מלהיות מובטחת.","ru":"Лингвисты считают, что из примерно семи тысяч языков, на которых сегодня говорят в мире, почти половина может исчезнуть к концу этого века. На многих из них говорят всего несколько сотен человек, большинство из которых пожилые. Когда умирает последний свободно владеющий языком носитель, язык считается вымершим.\n\nИсследователи объясняют этот упадок несколькими факторами. Экономическое давление часто вынуждает молодёжь переезжать в города, где доминирующий язык, например английский, испанский или китайский, открывает больше возможностей. Школы, где обучение ведётся только на государственном языке, могут ещё больше снизить статус местных языков, и родители перестают передавать их детям.\n\nПочему такие потери должны беспокоить кого-то, кроме самих носителей? Одна из причин в том, что каждый язык отражает уникальный способ упорядочивания опыта. Например, в некоторых языках нет слов для «лево» и «право», и местоположение описывается с помощью сторон света, таких как север и юг. Другие содержат подробные знания о местных растениях и животных, которые никогда не были записаны.\n\nПредставление о том, что умирающий язык невозможно спасти, не совсем верно. В качестве примера часто приводят иврит, возрождённый как разговорный язык в конце XIX и начале XX века. Однако возрождение требует ресурсов и упорства, которых не хватает в большинстве небольших общин, и успех далеко не гарантирован.","ar":"من بين نحو سبعة آلاف لغة يتحدث بها العالم اليوم، يقدّر اللغويون أن ما يقارب نصفها قد يختفي بحلول نهاية هذا القرن. ويتحدث بكثير منها بضع مئات من الناس فقط، معظمهم من كبار السن. وعندما يموت آخر متحدث طليق، توصف اللغة بأنها منقرضة.\n\nيعزو الباحثون هذا التراجع إلى عدة عوامل. فالضغط الاقتصادي كثيرًا ما يدفع الشباب إلى الانتقال إلى المدن، حيث توفر لغة مهيمنة مثل الإنجليزية أو الإسبانية أو الصينية الماندرينية فرصًا أفضل. كما أن المدارس التي تدرّس باللغة الوطنية فقط قد تضعف مكانة اللغات المحلية أكثر، فيكفّ الآباء عن نقلها إلى أبنائهم.\n\nلماذا ينبغي أن تقلق هذه الخسائر أحدًا غير المتحدثين أنفسهم؟ أحد الأسباب أن كل لغة تعكس طريقة فريدة في تنظيم التجربة. فبعض اللغات، مثلًا، لا تملك كلمات لليمين واليسار، وتصف الموقع باستخدام اتجاهات مثل الشمال والجنوب. وتحتوي لغات أخرى على معرفة مفصلة بالنباتات والحيوانات المحلية لم تُدوَّن قط.\n\nإن فكرة أن اللغة المحتضرة لا يمكن إنقاذها ليست دقيقة تمامًا. فكثيرًا ما تُذكر العبرية، التي أُحييت كلغة محكية في أواخر القرن التاسع عشر وأوائل القرن العشرين، مثالًا على ذلك. غير أن الإحياء يتطلب موارد والتزامًا نادرين في معظم المجتمعات الصغيرة، والنجاح بعيد عن أن يكون مضمونًا.","questions":[["What is the main purpose of the passage?","To explain why languages disappear and why it matters","To argue that English should become a global language","To describe the full history of the Hebrew language","To criticize linguists for exaggerating the problem"],["According to the passage, why do young people often stop using local languages?","They move to cities for better economic opportunities.","Their grandparents refuse to teach them.","Local languages are too difficult to learn.","The government forbids these languages by law."],["What can be inferred about language revival from the last paragraph?","It is possible but difficult for most communities.","It has never succeeded anywhere in the world.","It is easy once a language has a written form.","It happens naturally without any special effort."]]}},{"en":"connectors and contrast","he":"מילות קישור וניגוד","ru":"связки и контраст","ar":"أدوات الربط والتضاد","e":"🔀","items":[{"en":"The theory was widely criticized; nevertheless, it continued to influence research for decades.","he":"התיאוריה זכתה לביקורת נרחבת; למרות זאת, היא המשיכה להשפיע על המחקר במשך עשרות שנים.","ru":"Теорию широко критиковали; тем не менее она продолжала влиять на исследования на протяжении десятилетий.","ar":"تعرّضت النظرية لانتقادات واسعة؛ ومع ذلك استمرت في التأثير على الأبحاث لعقود.","e":"","alt":[]},{"en":"Whereas the first group improved steadily, the second group showed no measurable progress.","he":"בעוד שהקבוצה הראשונה השתפרה בהתמדה, הקבוצה השנייה לא הראתה התקדמות מדידה.","ru":"В то время как первая группа стабильно улучшала результаты, вторая не показала измеримого прогресса.","ar":"في حين تحسّنت المجموعة الأولى بثبات، لم تُظهر المجموعة الثانية أي تقدم ملموس.","e":"","alt":[]},{"en":"Despite the high cost of the treatment, many patients chose to continue with it.","he":"למרות העלות הגבוהה של הטיפול, מטופלים רבים בחרו להמשיך בו.","ru":"Несмотря на высокую стоимость лечения, многие пациенты решили его продолжить.","ar":"على الرغم من التكلفة المرتفعة للعلاج، اختار كثير من المرضى الاستمرار فيه.","e":"","alt":[]},{"en":"Although the sample was small, the findings were consistent with earlier research.","he":"אף שהמדגם היה קטן, הממצאים תאמו מחקרים קודמים.","ru":"Хотя выборка была небольшой, результаты согласовывались с более ранними исследованиями.","ar":"رغم أن العينة كانت صغيرة، جاءت النتائج متسقة مع الأبحاث السابقة.","e":"","alt":[]},{"en":"Urban residents earn more on average; conversely, they also face much higher living costs.","he":"תושבי ערים מרוויחים יותר בממוצע; מנגד, הם גם מתמודדים עם יוקר מחיה גבוה בהרבה.","ru":"Городские жители в среднем зарабатывают больше; с другой стороны, их расходы на жизнь гораздо выше.","ar":"يكسب سكان المدن أكثر في المتوسط؛ وفي المقابل يواجهون تكاليف معيشة أعلى بكثير.","e":"","alt":[]},{"en":"The method is fast and cheap; on the other hand, it is not always accurate.","he":"השיטה מהירה וזולה; מצד שני, היא לא תמיד מדויקת.","ru":"Этот метод быстрый и дешёвый; с другой стороны, он не всегда точен.","ar":"الطريقة سريعة ورخيصة؛ ومن ناحية أخرى، ليست دقيقة دائمًا.","e":"","alt":[]}],"reading":{"en":"For many students, sleep is the first thing to be sacrificed before an exam. Staying up all night to review material seems like a logical way to make the most of limited time. Research in cognitive science, however, suggests that this strategy may actually be counterproductive.\n\nDuring sleep, the brain does not simply rest. On the contrary, it actively processes information acquired during the day, strengthening some memories while discarding others. Studies have shown that people who sleep after learning a list of words recall significantly more of them the next day than people who remain awake for the same period. Whereas the well-rested group retains much of the material, the sleep-deprived group forgets a large proportion of it.\n\nSleep loss also affects attention and judgment. Although students who stay awake may feel that they have covered more material, they tend to make more careless mistakes in the exam itself. Moreover, they often overestimate how well they are performing.\n\nThis is not to say that late-night study is never useful. A short review session before bed may in fact be beneficial, since the information is then processed during the night. Nevertheless, giving up an entire night's sleep is unlikely to pay off. Students would do better to spread their study over several days, despite the temptation to leave everything to the last minute.","he":"עבור סטודנטים רבים, השינה היא הדבר הראשון שמוקרב לפני מבחן. להישאר ער כל הלילה כדי לחזור על החומר נראה כדרך הגיונית לנצל זמן מוגבל. אולם מחקרים במדעי הקוגניציה מראים שאסטרטגיה זו עלולה דווקא להזיק.\n\nבזמן השינה המוח אינו סתם נח. להפך, הוא מעבד באופן פעיל מידע שנרכש במהלך היום, מחזק זיכרונות מסוימים ומשליך אחרים. מחקרים הראו שאנשים שישנים לאחר שלמדו רשימת מילים זוכרים למחרת הרבה יותר מהן מאשר אנשים שנשארו ערים במשך אותו פרק זמן. בעוד שהקבוצה שנחה היטב שומרת חלק גדול מהחומר, הקבוצה שנמנעה ממנה שינה שוכחת חלק ניכר ממנו.\n\nחוסר שינה משפיע גם על הקשב ועל שיקול הדעת. אף שסטודנטים שנשארים ערים עשויים להרגיש שכיסו יותר חומר, הם נוטים לעשות יותר טעויות רשלניות במבחן עצמו. יתרה מזאת, הם מעריכים לעיתים קרובות את ביצועיהם כטובים יותר משהם באמת.\n\nאין זה אומר שלמידה בשעות הלילה המאוחרות לעולם אינה מועילה. חזרה קצרה לפני השינה עשויה דווקא להועיל, מכיוון שהמידע מעובד אז במהלך הלילה. למרות זאת, ויתור על לילה שלם של שינה לא צפוי להשתלם. מוטב לסטודנטים לפזר את הלמידה על פני כמה ימים, למרות הפיתוי להשאיר הכול לרגע האחרון.","ru":"Для многих студентов сон — первое, чем они жертвуют перед экзаменом. Не спать всю ночь, повторяя материал, кажется логичным способом использовать ограниченное время по максимуму. Однако исследования в области когнитивной науки показывают, что эта стратегия может на самом деле приносить вред.\n\nВо время сна мозг не просто отдыхает. Напротив, он активно обрабатывает информацию, полученную за день, укрепляя одни воспоминания и отбрасывая другие. Исследования показали, что люди, которые спят после заучивания списка слов, на следующий день вспоминают значительно больше слов, чем те, кто бодрствовал в течение того же времени. В то время как хорошо отдохнувшая группа сохраняет большую часть материала, лишённая сна группа забывает значительную его долю.\n\nНедосыпание также влияет на внимание и способность к суждению. Хотя студентам, которые не спят, может казаться, что они охватили больше материала, на самом экзамене они, как правило, делают больше ошибок по невнимательности. Более того, они часто переоценивают свои результаты.\n\nЭто не значит, что ночные занятия никогда не бывают полезны. Короткое повторение перед сном может даже помочь, поскольку информация затем обрабатывается ночью. Тем не менее отказ от целой ночи сна вряд ли окупится. Студентам лучше распределять занятия на несколько дней, несмотря на соблазн оставить всё на последнюю минуту.","ar":"بالنسبة إلى كثير من الطلاب، يكون النوم أول ما يُضحّى به قبل الامتحان. ويبدو السهر طوال الليل لمراجعة المادة طريقة منطقية للاستفادة القصوى من وقت محدود. غير أن أبحاث العلوم المعرفية تشير إلى أن هذه الاستراتيجية قد تأتي في الواقع بنتائج عكسية.\n\nفي أثناء النوم لا يستريح الدماغ فحسب، بل على العكس، يعالج بنشاط المعلومات التي اكتسبها خلال النهار، فيقوّي بعض الذكريات ويتخلص من أخرى. وقد أظهرت الدراسات أن الأشخاص الذين ينامون بعد تعلم قائمة من الكلمات يتذكرون منها في اليوم التالي أكثر بكثير من الذين يبقون مستيقظين للمدة نفسها. ففي حين تحتفظ المجموعة التي نالت قسطًا كافيًا من الراحة بجزء كبير من المادة، تنسى المجموعة المحرومة من النوم نسبة كبيرة منها.\n\nويؤثر الحرمان من النوم أيضًا في الانتباه والقدرة على الحكم. فعلى الرغم من أن الطلاب الذين يسهرون قد يشعرون بأنهم غطّوا مادة أكثر، فإنهم يميلون إلى ارتكاب أخطاء ناتجة عن الإهمال في الامتحان نفسه. علاوة على ذلك، كثيرًا ما يبالغون في تقدير جودة أدائهم.\n\nلا يعني هذا أن الدراسة في وقت متأخر من الليل غير مفيدة أبدًا. فجلسة مراجعة قصيرة قبل النوم قد تكون مفيدة فعلًا، لأن المعلومات تُعالَج حينها خلال الليل. ومع ذلك، من غير المرجح أن يؤتي التخلي عن ليلة نوم كاملة ثماره. ومن الأفضل للطلاب توزيع دراستهم على عدة أيام، رغم إغراء ترك كل شيء إلى اللحظة الأخيرة.","questions":[["What is the main idea of the passage?","Sleep plays an important role in learning and memory.","Students should never study in the evening.","Sleep-deprived students usually get higher grades.","The brain is completely inactive during sleep."],["The phrase 'On the contrary' in the second paragraph introduces...","an idea opposite to the claim that the brain only rests","an example of how students waste time","a summary of the first paragraph","a cause of sleep deprivation"],["According to the passage, students who skip a night's sleep...","often believe they are doing better than they really are","remember more words than rested students","make fewer careless mistakes","study more efficiently over several days"]]}},{"en":"cause and effect","he":"סיבה ותוצאה","ru":"причина и следствие","ar":"السبب والنتيجة","e":"🔗","items":[{"en":"The factory was closed due to repeated violations of environmental regulations.","he":"המפעל נסגר בשל הפרות חוזרות של תקנות איכות הסביבה.","ru":"Завод был закрыт из-за неоднократных нарушений экологических норм.","ar":"أُغلق المصنع بسبب انتهاكات متكررة للوائح البيئية.","e":"","alt":[]},{"en":"Rising sea temperatures have given rise to more frequent and intense storms.","he":"עליית הטמפרטורות בים הובילה לסופות תכופות ועזות יותר.","ru":"Повышение температуры моря привело к более частым и сильным штормам.","ar":"أدى ارتفاع درجات حرارة البحر إلى عواصف أكثر تكرارًا وشدة.","e":"","alt":[]},{"en":"Many health problems in old age stem from habits formed in early adulthood.","he":"בעיות בריאות רבות בגיל המבוגר נובעות מהרגלים שנוצרו בתחילת הבגרות.","ru":"Многие проблемы со здоровьем в пожилом возрасте берут начало в привычках, сформированных в молодости.","ar":"تنبع مشكلات صحية كثيرة في الشيخوخة من عادات تكوّنت في بداية مرحلة البلوغ.","e":"","alt":[]},{"en":"The drug had serious side effects; consequently, it was withdrawn from the market.","he":"לתרופה היו תופעות לוואי חמורות; כתוצאה מכך, היא הוסרה מהשוק.","ru":"У препарата были серьёзные побочные эффекты; вследствие этого его отозвали с рынка.","ar":"كانت للدواء آثار جانبية خطيرة؛ ونتيجة لذلك سُحب من السوق.","e":"","alt":[]},{"en":"The data were incomplete, and the conclusions of the study are thus questionable.","he":"הנתונים היו חלקיים, ולכן מסקנות המחקר מוטלות בספק.","ru":"Данные были неполными, и поэтому выводы исследования вызывают сомнения.","ar":"كانت البيانات ناقصة، ولذلك فإن استنتاجات الدراسة موضع شك.","e":"","alt":[]},{"en":"Prices rose sharply during the drought; hence, many families reduced their food purchases.","he":"המחירים עלו בחדות בזמן הבצורת; לפיכך, משפחות רבות צמצמו את קניות המזון שלהן.","ru":"Во время засухи цены резко выросли; поэтому многие семьи сократили покупки продуктов.","ar":"ارتفعت الأسعار بحدة خلال الجفاف؛ ومن ثَمّ قلّصت أسر كثيرة مشترياتها من الطعام.","e":"","alt":[]}],"reading":{"en":"Forests are usually discussed in terms of the carbon they store, but they also play a less obvious role: they help to produce rain. Trees draw water from the soil and release it into the air through their leaves, a process known as transpiration. In large forests such as the Amazon, this moisture rises, forms clouds and falls again as rain, often hundreds of kilometres away.\n\nAs a consequence, cutting down forests can affect regions far from the cleared area. When trees are removed, less moisture enters the atmosphere, and rainfall downwind may decline. Some scientists warn that the loss of forest in the Amazon could reduce rainfall in agricultural areas of southern Brazil and neighbouring countries, thus threatening crops that depend on regular rain.\n\nThe causes of deforestation are varied. In some areas it stems mainly from the expansion of cattle ranching; in others, it is due to logging, mining or the construction of roads. Because these activities bring immediate income, governments and landowners often have little incentive to protect the forest.\n\nIronically, then, the very farmers who clear land for agriculture may eventually suffer from the drier conditions their actions help to create. For this reason, a growing number of researchers argue that protecting forests should be seen not only as an environmental issue but also as an economic one.","he":"בדרך כלל מדברים על יערות במונחים של הפחמן שהם אוגרים, אך יש להם גם תפקיד פחות מובן מאליו: הם עוזרים לייצר גשם. עצים שואבים מים מהקרקע ומשחררים אותם לאוויר דרך העלים, תהליך המכונה דיות. ביערות גדולים כמו האמזונס, הלחות הזאת עולה, יוצרת עננים ויורדת שוב כגשם, לעיתים קרובות במרחק מאות קילומטרים.\n\nכתוצאה מכך, כריתת יערות יכולה להשפיע על אזורים רחוקים מהשטח שנוקה. כאשר עצים מוסרים, פחות לחות נכנסת לאטמוספרה, וכמות הגשם באזורים שבכיוון הרוח עלולה לרדת. יש מדענים המזהירים שאובדן היער באמזונס עלול להפחית את כמות הגשם באזורים חקלאיים בדרום ברזיל ובמדינות שכנות, וכך לאיים על גידולים התלויים בגשם סדיר.\n\nהגורמים לבירוא יערות מגוונים. באזורים מסוימים הוא נובע בעיקר מהתרחבות גידול הבקר; באחרים, הוא נגרם בשל כריתת עצים, כרייה או סלילת כבישים. מאחר שפעילויות אלה מניבות הכנסה מיידית, לממשלות ולבעלי קרקעות יש לעיתים קרובות תמריץ מועט להגן על היער.\n\nאם כן, באופן אירוני, דווקא החקלאים המנקים קרקע לחקלאות עלולים בסופו של דבר לסבול מהתנאים היבשים יותר שמעשיהם עוזרים ליצור. מסיבה זו, מספר הולך וגדל של חוקרים טוענים שיש לראות בהגנה על יערות לא רק סוגיה סביבתית אלא גם סוגיה כלכלית.","ru":"О лесах обычно говорят с точки зрения углерода, который они накапливают, но они играют и менее очевидную роль: они помогают образованию дождя. Деревья вытягивают воду из почвы и выделяют её в воздух через листья; этот процесс называется транспирацией. В больших лесах, таких как Амазония, эта влага поднимается, образует облака и снова выпадает дождём, часто за сотни километров.\n\nВследствие этого вырубка лесов может влиять на регионы, расположенные далеко от вырубленного участка. Когда деревья исчезают, в атмосферу поступает меньше влаги, и количество осадков с подветренной стороны может сократиться. Некоторые учёные предупреждают, что потеря лесов Амазонии может уменьшить количество осадков в сельскохозяйственных районах южной Бразилии и соседних стран, угрожая тем самым урожаям, зависящим от регулярных дождей.\n\nПричины вырубки лесов разнообразны. В одних районах она связана главным образом с расширением скотоводства, в других — с лесозаготовками, добычей полезных ископаемых или строительством дорог. Поскольку эти виды деятельности приносят немедленный доход, у правительств и землевладельцев часто мало стимулов защищать лес.\n\nПо иронии судьбы, именно фермеры, расчищающие землю под сельское хозяйство, могут в итоге пострадать от более засушливых условий, которые сами помогают создать. Поэтому всё больше исследователей утверждают, что защиту лесов следует рассматривать не только как экологическую, но и как экономическую проблему.","ar":"عادة ما يُتحدث عن الغابات من حيث الكربون الذي تخزنه، لكنها تؤدي أيضًا دورًا أقل وضوحًا: فهي تساعد على إنتاج المطر. إذ تسحب الأشجار الماء من التربة وتطلقه في الهواء عبر أوراقها، في عملية تُعرف بالنتح. وفي الغابات الكبيرة مثل الأمازون، ترتفع هذه الرطوبة وتكوّن السحب ثم تهطل مجددًا مطرًا، غالبًا على بعد مئات الكيلومترات.\n\nونتيجة لذلك، يمكن أن يؤثر قطع الغابات في مناطق بعيدة عن المنطقة التي أزيلت أشجارها. فعندما تُزال الأشجار، تدخل رطوبة أقل إلى الغلاف الجوي، وقد تتراجع الأمطار في المناطق الواقعة في اتجاه الريح. ويحذّر بعض العلماء من أن فقدان الغابات في الأمازون قد يقلل الأمطار في المناطق الزراعية في جنوب البرازيل والدول المجاورة، مما يهدد المحاصيل التي تعتمد على الأمطار المنتظمة.\n\nأسباب إزالة الغابات متنوعة. ففي بعض المناطق تنبع أساسًا من توسع تربية الماشية، وفي مناطق أخرى تعود إلى قطع الأخشاب أو التعدين أو شق الطرق. ولأن هذه الأنشطة تدرّ دخلًا فوريًا، كثيرًا ما يكون لدى الحكومات وملاك الأراضي حافز ضئيل لحماية الغابة.\n\nومن المفارقة إذن أن المزارعين أنفسهم الذين يزيلون الأراضي للزراعة قد يعانون في النهاية من الظروف الأكثر جفافًا التي تسهم أفعالهم في إحداثها. ولهذا السبب، يرى عدد متزايد من الباحثين أن حماية الغابات ينبغي أن تُعدّ قضية اقتصادية لا بيئية فقط.","questions":[["According to the passage, how do forests contribute to rainfall?","Trees release water into the air, which later forms clouds.","Trees block the wind and keep clouds in one place.","Forests store carbon that later turns into rain.","Forest soil absorbs rain and prevents floods."],["Why does the author describe the farmers' situation as ironic?","Their own actions may harm their future crops.","They earn more money when it rains less.","They protect forests but still lose their land.","They live far away from the forests they clear."],["What is the author's main purpose in the last paragraph?","To argue that protecting forests also has economic value","To blame farmers for all environmental problems","To suggest that cattle ranching should be expanded","To show that rainfall has no effect on agriculture"]]}},{"en":"restatement skills","he":"מיומנויות ניסוח מחדש","ru":"навыки перефразирования","ar":"مهارات إعادة الصياغة","e":"🔁","items":[{"en":"Not until the late nineteenth century did scientists understand how diseases spread.","he":"רק בסוף המאה התשע-עשרה הבינו מדענים כיצד מחלות מתפשטות.","ru":"Лишь в конце XIX века учёные поняли, как распространяются болезни.","ar":"لم يفهم العلماء كيف تنتشر الأمراض إلا في أواخر القرن التاسع عشر.","e":"","alt":[]},{"en":"Hardly any of the original documents survived the fire that destroyed the archive.","he":"כמעט אף אחד מהמסמכים המקוריים לא שרד את השריפה שהחריבה את הארכיון.","ru":"Почти ни один из оригинальных документов не уцелел при пожаре, уничтожившем архив.","ar":"لم ينجُ أي من الوثائق الأصلية تقريبًا من الحريق الذي دمّر الأرشيف.","e":"","alt":[]},{"en":"The bridge was designed by an engineer who had never built anything of that size.","he":"הגשר תוכנן על ידי מהנדס שמעולם לא בנה דבר בגודל כזה.","ru":"Мост спроектировал инженер, который никогда не строил ничего подобного размера.","ar":"صمّم الجسر مهندس لم يسبق له أن بنى شيئًا بهذا الحجم.","e":"","alt":[]},{"en":"It is unlikely that the new policy will have any effect on unemployment.","he":"לא סביר שלמדיניות החדשה תהיה השפעה כלשהי על האבטלה.","ru":"Маловероятно, что новая политика как-либо повлияет на безработицу.","ar":"من غير المرجح أن يكون للسياسة الجديدة أي تأثير على البطالة.","e":"","alt":[]},{"en":"Few researchers would dispute the claim that smoking increases the risk of cancer.","he":"מעטים החוקרים שיחלקו על הטענה שעישון מגביר את הסיכון לסרטן.","ru":"Мало кто из исследователей станет оспаривать утверждение, что курение повышает риск рака.","ar":"قلة من الباحثين قد يعترضون على القول بأن التدخين يزيد خطر الإصابة بالسرطان.","e":"","alt":[]},{"en":"The more people use public transport, the less traffic there is on the roads.","he":"ככל שיותר אנשים משתמשים בתחבורה ציבורית, כך יש פחות פקקים בכבישים.","ru":"Чем больше людей пользуются общественным транспортом, тем меньше машин на дорогах.","ar":"كلما زاد عدد مستخدمي وسائل النقل العام، قلّت حركة المرور على الطرق.","e":"","alt":[]}],"reading":{"en":"For much of the twentieth century, parents and teachers were warned that raising a child with two languages could cause confusion and delay. Bilingual children, it was claimed, would mix the two languages and fall behind their monolingual classmates. Not until researchers began to study bilingual children more carefully did this view start to change.\n\nEarly studies had been seriously flawed. Many compared bilingual children from poor immigrant families with monolingual children from wealthier backgrounds, so differences in performance could just as easily be explained by economic factors. When later studies controlled for such factors, the supposed disadvantage largely disappeared.\n\nToday, few specialists would argue that bilingualism harms children's development. It is true that bilingual children may know fewer words in each language than monolingual children of the same age. However, when the words in both languages are counted together, their total vocabulary is usually similar or even larger. Mixing languages within a sentence, once seen as a sign of confusion, is now regarded as a normal and often skilful use of both systems.\n\nSome researchers have gone further, claiming that bilingualism improves attention and mental flexibility. These claims remain controversial, as results have been inconsistent. What is clear, though, is that the old warnings were based less on evidence than on assumptions.","he":"במשך רוב המאה העשרים הוזהרו הורים ומורים שגידול ילד עם שתי שפות עלול לגרום לבלבול ולעיכוב. נטען שילדים דו-לשוניים יערבבו בין שתי השפות ויפגרו אחרי חבריהם החד-לשוניים לכיתה. רק כאשר חוקרים החלו לחקור ילדים דו-לשוניים בקפידה רבה יותר, השקפה זו החלה להשתנות.\n\nהמחקרים המוקדמים היו פגומים מאוד. רבים מהם השוו ילדים דו-לשוניים ממשפחות מהגרים עניות לילדים חד-לשוניים מרקע אמיד יותר, כך שאת ההבדלים בהישגים אפשר היה להסביר באותה מידה בגורמים כלכליים. כאשר מחקרים מאוחרים יותר נטרלו גורמים כאלה, החיסרון כביכול נעלם ברובו.\n\nכיום, מעטים המומחים שיטענו שדו-לשוניות פוגעת בהתפתחות הילד. נכון שילדים דו-לשוניים עשויים להכיר פחות מילים בכל שפה מאשר ילדים חד-לשוניים בני אותו גיל. עם זאת, כאשר סופרים יחד את המילים בשתי השפות, אוצר המילים הכולל שלהם בדרך כלל דומה או אפילו גדול יותר. ערבוב שפות בתוך משפט, שנחשב פעם לסימן של בלבול, נחשב כיום לשימוש רגיל ולעיתים קרובות מיומן בשתי המערכות.\n\nחוקרים מסוימים הרחיקו לכת וטענו שדו-לשוניות משפרת את הקשב ואת הגמישות המחשבתית. טענות אלה עדיין שנויות במחלוקת, מאחר שהתוצאות אינן עקביות. אך מה שברור הוא שהאזהרות הישנות התבססו פחות על ראיות ויותר על הנחות.","ru":"На протяжении большей части XX века родителей и учителей предупреждали, что воспитание ребёнка на двух языках может вызвать путаницу и задержку развития. Утверждалось, что двуязычные дети будут смешивать языки и отставать от одноязычных одноклассников. Лишь когда исследователи начали более тщательно изучать двуязычных детей, эта точка зрения стала меняться.\n\nРанние исследования имели серьёзные недостатки. Во многих из них двуязычных детей из бедных семей иммигрантов сравнивали с одноязычными детьми из более обеспеченных семей, поэтому различия в успеваемости с таким же успехом можно было объяснить экономическими факторами. Когда в более поздних исследованиях эти факторы учитывались, предполагаемое отставание в основном исчезало.\n\nСегодня мало кто из специалистов станет утверждать, что двуязычие вредит развитию детей. Действительно, двуязычные дети могут знать меньше слов в каждом языке, чем одноязычные сверстники. Однако если сложить слова обоих языков, их общий словарный запас обычно такой же или даже больше. Смешение языков в одном предложении, когда-то считавшееся признаком путаницы, теперь рассматривается как нормальное и часто умелое использование обеих систем.\n\nНекоторые исследователи пошли дальше, утверждая, что двуязычие улучшает внимание и гибкость мышления. Эти утверждения остаются спорными, так как результаты противоречивы. Ясно, однако, одно: старые предупреждения основывались не столько на фактах, сколько на предположениях.","ar":"طوال معظم القرن العشرين، كان الآباء والمعلمون يُحذَّرون من أن تربية الطفل على لغتين قد تسبب له الارتباك والتأخر. وكان يُزعم أن الأطفال ثنائيي اللغة سيخلطون بين اللغتين ويتخلفون عن زملائهم أحاديي اللغة. ولم تبدأ هذه النظرة في التغير إلا عندما شرع الباحثون في دراسة الأطفال ثنائيي اللغة بعناية أكبر.\n\nكانت الدراسات المبكرة معيبة بشدة. فكثير منها قارن أطفالًا ثنائيي اللغة من أسر مهاجرة فقيرة بأطفال أحاديي اللغة من خلفيات أكثر ثراءً، فكان من الممكن تفسير الفروق في الأداء بالعوامل الاقتصادية بالقدر نفسه. وعندما ضبطت الدراسات اللاحقة هذه العوامل، اختفى العيب المزعوم إلى حد كبير.\n\nاليوم، قلة من المتخصصين قد يدّعون أن ثنائية اللغة تضر بنمو الأطفال. صحيح أن الأطفال ثنائيي اللغة قد يعرفون كلمات أقل في كل لغة مقارنة بأقرانهم أحاديي اللغة من العمر نفسه، لكن عند احتساب الكلمات في اللغتين معًا، تكون حصيلتهم الإجمالية عادة مماثلة أو حتى أكبر. أما خلط اللغتين داخل الجملة الواحدة، الذي كان يُعدّ علامة على الارتباك، فيُنظر إليه الآن على أنه استخدام طبيعي وماهر في كثير من الأحيان للنظامين.\n\nوذهب بعض الباحثين أبعد من ذلك، مدّعين أن ثنائية اللغة تحسّن الانتباه والمرونة الذهنية. ولا تزال هذه الادعاءات موضع جدل، إذ جاءت النتائج غير متسقة. لكن الواضح أن التحذيرات القديمة كانت مبنية على الافتراضات أكثر منها على الأدلة.","questions":[["Which sentence best restates: Not until researchers began to study bilingual children more carefully did this view start to change?","This view changed only after more careful research on bilingual children.","Researchers kept this view even after studying bilingual children carefully.","The view changed first, and only then did careful research begin.","Careful research on bilingual children confirmed this view."],["Why were the early studies seriously flawed?","They ignored differences in the families' economic backgrounds.","They included too many bilingual children.","They were carried out only in wealthy countries.","They counted vocabulary in both languages together."],["What is the author's attitude toward the claim that bilingualism improves attention?","Cautious, since the evidence is inconsistent","Completely convinced that it is true","Strongly opposed and dismissive","Uninterested in the question"]]}},{"en":"hedging and attitude","he":"הסתייגות ועמדת הכותב","ru":"осторожность и позиция автора","ar":"التحفظ وموقف الكاتب","e":"🤔","items":[{"en":"The results suggest that regular exercise may slow the progress of memory loss.","he":"התוצאות מרמזות שפעילות גופנית סדירה עשויה להאט את התקדמות אובדן הזיכרון.","ru":"Результаты указывают на то, что регулярные физические упражнения могут замедлять ухудшение памяти.","ar":"تشير النتائج إلى أن ممارسة الرياضة بانتظام قد تبطئ تطور فقدان الذاكرة.","e":"","alt":[]},{"en":"Arguably, the printing press had a greater impact on society than the internet.","he":"אפשר לטעון שלדפוס הייתה השפעה גדולה יותר על החברה מאשר לאינטרנט.","ru":"Можно утверждать, что книгопечатание оказало на общество большее влияние, чем интернет.","ar":"يمكن القول إن المطبعة كان لها تأثير على المجتمع أكبر من تأثير الإنترنت.","e":"","alt":[]},{"en":"People tend to overestimate the risk of rare events, such as plane crashes.","he":"אנשים נוטים להעריך יתר על המידה את הסיכון לאירועים נדירים, כמו התרסקות מטוסים.","ru":"Люди склонны переоценивать риск редких событий, например авиакатастроф.","ar":"يميل الناس إلى المبالغة في تقدير خطر الأحداث النادرة، مثل تحطم الطائرات.","e":"","alt":[]},{"en":"It is widely believed that the city was founded by traders from the coast.","he":"מקובל לחשוב שהעיר נוסדה על ידי סוחרים שהגיעו מהחוף.","ru":"Широко распространено мнение, что город был основан торговцами с побережья.","ar":"يُعتقد على نطاق واسع أن المدينة أسسها تجار قدموا من الساحل.","e":"","alt":[]},{"en":"Many scientists remain skeptical of claims that the treatment cures the disease.","he":"מדענים רבים עדיין ספקנים לגבי הטענות שהטיפול מרפא את המחלה.","ru":"Многие учёные по-прежнему скептически относятся к утверждениям, что это лечение излечивает болезнь.","ar":"لا يزال كثير من العلماء متشككين في الادعاءات بأن العلاج يشفي المرض.","e":"","alt":[]},{"en":"The evidence, while promising, is not yet strong enough to justify firm conclusions.","he":"הראיות, אף שהן מבטיחות, עדיין אינן חזקות מספיק כדי להצדיק מסקנות נחרצות.","ru":"Данные, хотя и обнадёживают, пока недостаточно убедительны для твёрдых выводов.","ar":"الأدلة، رغم أنها واعدة، ليست بعد قوية بما يكفي لتبرير استنتاجات قاطعة.","e":"","alt":[]}],"reading":{"en":"Few everyday habits have been studied as often as coffee drinking, and few have produced such confusing headlines. One year coffee is said to damage the heart; the next, it is presented as a protection against disease. For the general public, it can be difficult to know what to believe.\n\nPart of the problem lies in the type of research involved. Most studies of coffee are observational: they compare people who drink coffee with people who do not and look for differences in their health. Such studies can reveal associations, but they cannot prove that coffee itself is responsible. Coffee drinkers may differ from non-drinkers in many other ways, for instance in how much they smoke, exercise or sleep.\n\nWith this limitation in mind, the current evidence appears broadly reassuring. Large studies suggest that moderate consumption, roughly three to four cups a day, is not associated with an increased risk of heart disease and may even be linked to a slightly lower risk of certain conditions. Nevertheless, researchers are careful to avoid strong claims. Pregnant women, for example, are generally advised to limit their intake, and people who are sensitive to caffeine may experience sleep problems or anxiety.\n\nIn short, coffee is probably neither a miracle drink nor a serious danger. As with many foods, moderation seems to be the most sensible approach.","he":"מעטים ההרגלים היומיומיים שנחקרו לעיתים קרובות כמו שתיית קפה, ומעטים הם אלה שהניבו כותרות מבלבלות כל כך. שנה אחת נטען שהקפה מזיק ללב; בשנה שלאחר מכן הוא מוצג כהגנה מפני מחלות. לציבור הרחב קשה לפעמים לדעת במה להאמין.\n\nחלק מהבעיה נעוץ בסוג המחקר. רוב המחקרים על קפה הם מחקרי תצפית: הם משווים אנשים ששותים קפה לאנשים שאינם שותים ומחפשים הבדלים בבריאותם. מחקרים כאלה יכולים לחשוף קשרים, אך אינם יכולים להוכיח שהקפה עצמו הוא הגורם. שותי קפה עשויים להיות שונים מאלה שאינם שותים בדרכים רבות אחרות, למשל בכמה הם מעשנים, מתעמלים או ישנים.\n\nבהתחשב במגבלה זו, הראיות הקיימות נראות מרגיעות באופן כללי. מחקרים גדולים מרמזים שצריכה מתונה, כשלוש עד ארבע כוסות ביום, אינה קשורה לסיכון מוגבר למחלות לב ואף עשויה להיות קשורה לסיכון נמוך מעט יותר למצבים מסוימים. עם זאת, החוקרים נזהרים מטענות נחרצות. נשים בהריון, למשל, מתבקשות בדרך כלל להגביל את הצריכה, ואנשים הרגישים לקפאין עלולים לסבול מבעיות שינה או מחרדה.\n\nבקיצור, קפה כנראה אינו משקה פלא וגם לא סכנה רצינית. כמו במזונות רבים, מתינות נראית הגישה הנבונה ביותר.","ru":"Мало какие повседневные привычки изучались так часто, как употребление кофе, и мало какие порождали столь противоречивые заголовки. В один год утверждают, что кофе вредит сердцу, на следующий его представляют как защиту от болезней. Широкой публике бывает трудно понять, чему верить.\n\nЧасть проблемы связана с типом исследований. Большинство исследований кофе — наблюдательные: в них сравнивают людей, которые пьют кофе, с теми, кто его не пьёт, и ищут различия в их здоровье. Такие исследования могут выявить связи, но не могут доказать, что причина именно в кофе. Любители кофе могут отличаться от тех, кто его не пьёт, во многом другом, например в том, сколько они курят, занимаются спортом или спят.\n\nС учётом этого ограничения имеющиеся данные в целом выглядят обнадёживающими. Крупные исследования показывают, что умеренное потребление, примерно три-четыре чашки в день, не связано с повышенным риском сердечных заболеваний и даже может быть связано с несколько более низким риском некоторых болезней. Тем не менее исследователи избегают категоричных утверждений. Например, беременным женщинам обычно советуют ограничивать потребление, а люди, чувствительные к кофеину, могут испытывать проблемы со сном или тревожность.\n\nКороче говоря, кофе, вероятно, не является ни чудодейственным напитком, ни серьёзной опасностью. Как и в случае со многими продуктами, умеренность представляется самым разумным подходом.","ar":"قليلة هي العادات اليومية التي دُرست بقدر ما دُرس شرب القهوة، وقليلة هي التي أنتجت عناوين مربكة إلى هذا الحد. ففي عام يُقال إن القهوة تضر القلب، وفي العام التالي تُقدَّم على أنها وقاية من الأمراض. وقد يصعب على عامة الناس معرفة ما يصدقونه.\n\nيكمن جزء من المشكلة في نوع الأبحاث المعنية. فمعظم دراسات القهوة رصدية: تقارن بين من يشربون القهوة ومن لا يشربونها وتبحث عن فروق في صحتهم. ويمكن لمثل هذه الدراسات أن تكشف عن ارتباطات، لكنها لا تستطيع إثبات أن القهوة نفسها هي المسؤولة. فقد يختلف شاربو القهوة عن غيرهم في جوانب أخرى كثيرة، كمقدار ما يدخنون أو يمارسون الرياضة أو ينامون.\n\nومع أخذ هذا القيد في الاعتبار، تبدو الأدلة الحالية مطمئنة بوجه عام. إذ تشير دراسات كبيرة إلى أن الاستهلاك المعتدل، نحو ثلاثة إلى أربعة أكواب يوميًا، لا يرتبط بزيادة خطر أمراض القلب، بل قد يرتبط بانخفاض طفيف في خطر بعض الحالات. ومع ذلك يحرص الباحثون على تجنب الادعاءات القوية. فالنساء الحوامل، مثلًا، يُنصحن عمومًا بالحد من استهلاكهن، وقد يعاني الأشخاص الحساسون للكافيين من مشكلات في النوم أو القلق.\n\nباختصار، القهوة على الأرجح ليست مشروبًا معجزًا ولا خطرًا جسيمًا. وكما هو الحال مع أطعمة كثيرة، يبدو الاعتدال النهج الأكثر حكمة.","questions":[["Why, according to the passage, can observational studies not prove that coffee affects health?","Coffee drinkers may differ from non-drinkers in other habits.","They include too few participants.","They study only pregnant women.","They measure caffeine instead of coffee."],["The author's tone in the last paragraph can best be described as...","balanced and moderate","enthusiastic and excited","angry and critical","fearful and alarmed"],["The word 'they' in 'but they cannot prove' refers to...","observational studies","coffee drinkers","confusing headlines","differences in health"]]}},{"en":"reading academic texts","he":"קריאת טקסטים אקדמיים","ru":"чтение академических текстов","ar":"قراءة النصوص الأكاديمية","e":"📖","items":[{"en":"In the opening paragraph, the author presents a common view that she later rejects.","he":"בפסקה הפותחת, הכותבת מציגה השקפה רווחת שאותה היא דוחה בהמשך.","ru":"В первом абзаце автор излагает распространённую точку зрения, которую затем опровергает.","ar":"في الفقرة الافتتاحية، تعرض الكاتبة رأيًا شائعًا ترفضه لاحقًا.","e":"","alt":[]},{"en":"The main purpose of the passage is to compare two approaches to treating depression.","he":"המטרה העיקרית של הקטע היא להשוות בין שתי גישות לטיפול בדיכאון.","ru":"Основная цель текста — сравнить два подхода к лечению депрессии.","ar":"الغرض الرئيسي من النص هو المقارنة بين نهجين لعلاج الاكتئاب.","e":"","alt":[]},{"en":"The word it in the second sentence refers to the government's new tax policy.","he":"המילה it במשפט השני מתייחסת למדיניות המס החדשה של הממשלה.","ru":"Слово it во втором предложении относится к новой налоговой политике правительства.","ar":"تشير كلمة it في الجملة الثانية إلى السياسة الضريبية الجديدة للحكومة.","e":"","alt":[]},{"en":"The passage implies that the experiment would have failed without additional funding.","he":"מהקטע משתמע שהניסוי היה נכשל ללא מימון נוסף.","ru":"Из текста следует, что без дополнительного финансирования эксперимент провалился бы.","ar":"يُفهم من النص أن التجربة كانت ستفشل لولا التمويل الإضافي.","e":"","alt":[]},{"en":"The final paragraph summarizes the argument and suggests directions for future research.","he":"הפסקה האחרונה מסכמת את הטיעון ומציעה כיוונים למחקר עתידי.","ru":"Последний абзац подводит итог аргументации и предлагает направления будущих исследований.","ar":"تلخّص الفقرة الأخيرة الحجة وتقترح اتجاهات للبحث في المستقبل.","e":"","alt":[]},{"en":"The example of the honeybee is given to illustrate how animals communicate information.","he":"הדוגמה של דבורת הדבש מובאת כדי להמחיש כיצד בעלי חיים מעבירים מידע.","ru":"Пример медоносной пчелы приводится, чтобы показать, как животные передают информацию.","ar":"يُذكر مثال نحلة العسل لتوضيح كيفية تواصل الحيوانات ونقلها للمعلومات.","e":"","alt":[]}],"reading":{"en":"In the past, scientific research was carried out almost exclusively by trained professionals working in universities and laboratories. In recent decades, however, a growing number of projects have relied on the help of ordinary volunteers, a practice known as citizen science. Participants count birds in their gardens, photograph insects, classify images of distant galaxies or report the appearance of jellyfish on local beaches.\n\nThe advantages of this approach are obvious. Volunteers can collect data across wide areas and long periods of time, something no research team could afford to do alone. In one well-known type of project, thousands of people classify images online, completing in months a task that would otherwise take professional astronomers many years.\n\nCritics have raised concerns about the quality of such data. Volunteers may misidentify species or report observations inconsistently. Researchers have responded by developing methods to address this problem, for example by asking several participants to classify the same image or by comparing reports with expert checks. Studies suggest that, when such methods are used, the accuracy of volunteer data is often comparable to that of professionals.\n\nCitizen science also has benefits that go beyond the data. Participants frequently report a deeper interest in science and a stronger connection to their environment. In this sense, the practice may help to close the gap between the scientific community and the public it serves.","he":"בעבר, מחקר מדעי נעשה כמעט אך ורק בידי אנשי מקצוע מיומנים שעבדו באוניברסיטאות ובמעבדות. אולם בעשורים האחרונים, מספר הולך וגדל של פרויקטים נשען על עזרתם של מתנדבים מן השורה, נוהג המכונה מדע אזרחי. המשתתפים סופרים ציפורים בגינותיהם, מצלמים חרקים, ממיינים תמונות של גלקסיות רחוקות או מדווחים על הופעת מדוזות בחופים המקומיים.\n\nהיתרונות של גישה זו ברורים. מתנדבים יכולים לאסוף נתונים על פני שטחים נרחבים ולאורך תקופות ארוכות, דבר שאף צוות מחקר לא יכול להרשות לעצמו לעשות לבדו. בסוג מוכר אחד של פרויקט, אלפי אנשים ממיינים תמונות ברשת ומשלימים בתוך חודשים משימה שהייתה לוקחת לאסטרונומים מקצועיים שנים רבות.\n\nמבקרים הביעו חשש בנוגע לאיכות נתונים כאלה. מתנדבים עלולים לזהות מינים באופן שגוי או לדווח על תצפיות באופן לא עקבי. החוקרים הגיבו בפיתוח שיטות לטיפול בבעיה זו, למשל באמצעות בקשה מכמה משתתפים למיין את אותה תמונה או באמצעות השוואת הדיווחים לבדיקות של מומחים. מחקרים מרמזים שכאשר משתמשים בשיטות כאלה, הדיוק של נתוני המתנדבים דומה לעיתים קרובות לזה של אנשי המקצוע.\n\nלמדע האזרחי יש גם יתרונות החורגים מהנתונים. המשתתפים מדווחים לעיתים קרובות על עניין עמוק יותר במדע ועל קשר חזק יותר לסביבתם. במובן זה, הנוהג עשוי לעזור לצמצם את הפער בין הקהילה המדעית לבין הציבור שהיא משרתת.","ru":"Раньше научные исследования проводились почти исключительно профессионалами, работавшими в университетах и лабораториях. Однако в последние десятилетия всё больше проектов опирается на помощь обычных добровольцев; такая практика называется гражданской наукой. Участники считают птиц в своих садах, фотографируют насекомых, классифицируют изображения далёких галактик или сообщают о появлении медуз на местных пляжах.\n\nПреимущества такого подхода очевидны. Добровольцы могут собирать данные на обширных территориях и в течение длительного времени, что не по силам ни одной исследовательской группе в одиночку. В одном известном типе проектов тысячи людей классифицируют изображения онлайн и за несколько месяцев выполняют работу, на которую у профессиональных астрономов ушли бы многие годы.\n\nКритики выражают сомнения в качестве таких данных. Добровольцы могут неправильно определять виды или непоследовательно сообщать о наблюдениях. В ответ исследователи разработали методы решения этой проблемы, например просят нескольких участников классифицировать одно и то же изображение или сравнивают сообщения с проверками экспертов. Исследования показывают, что при использовании таких методов точность данных добровольцев часто сопоставима с точностью данных профессионалов.\n\nУ гражданской науки есть и преимущества, выходящие за рамки данных. Участники часто отмечают более глубокий интерес к науке и более тесную связь с окружающей средой. В этом смысле такая практика может помочь сократить разрыв между научным сообществом и обществом, которому оно служит.","ar":"في الماضي، كان البحث العلمي يُجرى بصورة شبه حصرية على أيدي مهنيين مدرّبين يعملون في الجامعات والمختبرات. أما في العقود الأخيرة، فقد اعتمد عدد متزايد من المشاريع على مساعدة متطوعين عاديين، في ممارسة تُعرف بعلم المواطن. فالمشاركون يحصون الطيور في حدائقهم، ويصوّرون الحشرات، ويصنّفون صور المجرات البعيدة، أو يبلّغون عن ظهور قناديل البحر على الشواطئ المحلية.\n\nمزايا هذا النهج واضحة. إذ يمكن للمتطوعين جمع البيانات عبر مناطق واسعة وعلى مدى فترات طويلة، وهو أمر لا يستطيع أي فريق بحثي تحمّل كلفته وحده. وفي نوع معروف من المشاريع، يصنّف آلاف الأشخاص الصور عبر الإنترنت، فينجزون في أشهر مهمة كانت ستستغرق من علماء الفلك المحترفين سنوات طويلة.\n\nأبدى المنتقدون مخاوف بشأن جودة هذه البيانات. فقد يخطئ المتطوعون في تحديد الأنواع أو يبلّغون عن الملاحظات بطريقة غير متسقة. وقد استجاب الباحثون بتطوير أساليب لمعالجة هذه المشكلة، مثل الطلب من عدة مشاركين تصنيف الصورة نفسها أو مقارنة التقارير بفحوص الخبراء. وتشير الدراسات إلى أنه عند استخدام هذه الأساليب، كثيرًا ما تكون دقة بيانات المتطوعين مماثلة لدقة بيانات المحترفين.\n\nولعلم المواطن أيضًا فوائد تتجاوز البيانات. فكثيرًا ما يذكر المشاركون اهتمامًا أعمق بالعلم وارتباطًا أقوى ببيئتهم. وبهذا المعنى، قد تساعد هذه الممارسة على تضييق الفجوة بين المجتمع العلمي والجمهور الذي يخدمه.","questions":[["What is the main idea of the passage?","Volunteers can make a valuable contribution to scientific research.","Professional scientists are no longer needed.","Volunteer data are always less accurate than expert data.","Astronomy is the only field that uses citizen science."],["The example of online image classification is mentioned in order to...","show how volunteers can complete large tasks quickly","prove that professional astronomers are inefficient","explain why volunteer data are inaccurate","describe the history of astronomy"],["The phrase 'this problem' in the third paragraph refers to...","the possible inaccuracy of volunteer data","the high cost of research teams","the public's lack of interest in science","the difficulty of finding volunteers"]]}},{"en":"exam strategies","he":"אסטרטגיות למבחן","ru":"стратегии сдачи экзамена","ar":"استراتيجيات الامتحان","e":"🎯","items":[{"en":"Read the whole sentence before choosing an answer, since the key clue may appear at the end.","he":"קרא/י את כל המשפט לפני שתבחר/י תשובה, כי הרמז החשוב עשוי להופיע בסופו.","ru":"Прочитайте всё предложение, прежде чем выбрать ответ, ведь ключевая подсказка может быть в конце.","ar":"اقرأ الجملة كاملة قبل اختيار الإجابة، فقد يظهر المفتاح الأساسي في نهايتها.","e":"","alt":[]},{"en":"Pay close attention to connectors like although and therefore, which signal the logic of a sentence.","he":"שים/שימי לב היטב למילות קישור כמו although ו-therefore, שמסמנות את ההיגיון של המשפט.","ru":"Обращайте особое внимание на связки вроде although и therefore: они указывают на логику предложения.","ar":"انتبه جيدًا لأدوات الربط مثل although وtherefore، فهي تدل على منطق الجملة.","e":"","alt":[]},{"en":"In restatement questions, reject any option that changes the meaning, even slightly.","he":"בשאלות ניסוח מחדש, פסול/פסלי כל תשובה שמשנה את המשמעות, אפילו במעט.","ru":"В заданиях на перефразирование отбрасывайте любой вариант, который хоть немного меняет смысл.","ar":"في أسئلة إعادة الصياغة، استبعد أي خيار يغيّر المعنى ولو قليلًا.","e":"","alt":[]},{"en":"Read the questions before the passage so that you know what information to look for.","he":"קרא/י את השאלות לפני הקטע כדי לדעת איזה מידע לחפש.","ru":"Читайте вопросы до текста, чтобы знать, какую информацию искать.","ar":"اقرأ الأسئلة قبل النص لكي تعرف المعلومات التي يجب أن تبحث عنها.","e":"","alt":[]},{"en":"If a question seems too difficult, skip it and return to it at the end.","he":"אם שאלה נראית קשה מדי, דלג/י עליה וחזור/חזרי אליה בסוף.","ru":"Если вопрос кажется слишком трудным, пропустите его и вернитесь к нему в конце.","ar":"إذا بدا سؤال صعبًا جدًا، فتخطَّه وعد إليه في النهاية.","e":"","alt":[]},{"en":"Words like always and never often indicate an answer that is too extreme to be correct.","he":"מילים כמו always ו-never מעידות לעיתים קרובות על תשובה קיצונית מכדי להיות נכונה.","ru":"Слова вроде always и never часто указывают на слишком категоричный, а значит неверный ответ.","ar":"كثيرًا ما تدل كلمات مثل always وnever على إجابة متطرفة جدًا بحيث لا تكون صحيحة.","e":"","alt":[]}],"reading":{"en":"Most students prepare for exams by rereading their notes and highlighting important passages. These methods feel productive, yet research in educational psychology suggests that they are among the least effective ways to learn. A far more powerful technique is retrieval practice: actively trying to recall information from memory, for example by answering practice questions.\n\nIn a typical experiment, students read a short text and were then divided into two groups. One group read the text again, while the other took a test on it without looking at the text. A week later, the students who had been tested remembered considerably more than those who had simply reread, even though the rereading group had felt more confident.\n\nWhy does testing work so well? One explanation is that the effort of recalling information strengthens the memory, making it easier to retrieve in the future. Testing also reveals gaps in knowledge, showing students which topics require further attention. Rereading, by contrast, creates a sense of familiarity that can be mistaken for real understanding.\n\nFor students preparing for an exam with multiple-choice questions, the implications are clear. Rather than reading word lists again and again, they should practice with questions similar to those in the exam, check their answers and review their mistakes. Spreading this practice over several weeks, rather than concentrating it in the final days, is likely to produce the best results.","he":"רוב הסטודנטים מתכוננים למבחנים על ידי קריאה חוזרת של הסיכומים וסימון קטעים חשובים. שיטות אלה מרגישות פרודוקטיביות, אך מחקרים בפסיכולוגיה חינוכית מראים שהן מבין הדרכים הפחות יעילות ללמוד. טכניקה חזקה בהרבה היא תרגול שליפה: ניסיון פעיל להיזכר במידע מהזיכרון, למשל באמצעות מענה על שאלות תרגול.\n\nבניסוי טיפוסי, סטודנטים קראו טקסט קצר ולאחר מכן חולקו לשתי קבוצות. קבוצה אחת קראה את הטקסט שוב, ואילו השנייה נבחנה עליו בלי להסתכל בטקסט. שבוע לאחר מכן, הסטודנטים שנבחנו זכרו הרבה יותר מאלה שרק קראו שוב, אף שקבוצת הקריאה החוזרת הרגישה בטוחה יותר.\n\nמדוע מבחנים עובדים כל כך טוב? הסבר אחד הוא שהמאמץ להיזכר במידע מחזק את הזיכרון ומקל לשלוף אותו בעתיד. מבחנים גם חושפים פערים בידע ומראים לסטודנטים אילו נושאים דורשים תשומת לב נוספת. קריאה חוזרת, לעומת זאת, יוצרת תחושת היכרות שעלולה להתפרש בטעות כהבנה אמיתית.\n\nעבור סטודנטים המתכוננים למבחן עם שאלות אמריקאיות, המסקנות ברורות. במקום לקרוא רשימות מילים שוב ושוב, עליהם להתאמן בשאלות הדומות לאלה שבמבחן, לבדוק את תשובותיהם ולחזור על הטעויות. פיזור התרגול על פני כמה שבועות, במקום לרכז אותו בימים האחרונים, צפוי להניב את התוצאות הטובות ביותר.","ru":"Большинство студентов готовятся к экзаменам, перечитывая конспекты и выделяя важные фрагменты. Эти методы кажутся продуктивными, однако исследования в педагогической психологии показывают, что они относятся к наименее эффективным способам обучения. Гораздо более действенный приём — практика извлечения: активные попытки вспомнить информацию, например отвечая на тренировочные вопросы.\n\nВ типичном эксперименте студенты прочитали короткий текст, после чего их разделили на две группы. Одна группа перечитала текст, а другая прошла по нему тест, не заглядывая в текст. Через неделю студенты, проходившие тест, помнили значительно больше, чем те, кто просто перечитывал, хотя группа перечитывавших чувствовала себя увереннее.\n\nПочему тестирование так эффективно? Одно из объяснений состоит в том, что усилие, затрачиваемое на припоминание, укрепляет память и облегчает извлечение информации в будущем. Тестирование также выявляет пробелы в знаниях, показывая, каким темам нужно уделить больше внимания. Перечитывание, напротив, создаёт ощущение знакомости, которое можно принять за настоящее понимание.\n\nДля студентов, готовящихся к экзамену с вопросами с выбором ответа, выводы очевидны. Вместо того чтобы снова и снова читать списки слов, им следует тренироваться на вопросах, похожих на экзаменационные, проверять ответы и разбирать ошибки. Распределение такой практики на несколько недель, а не её концентрация в последние дни, скорее всего, даст наилучшие результаты.","ar":"يستعد معظم الطلاب للامتحانات بإعادة قراءة ملاحظاتهم وتظليل المقاطع المهمة. وتبدو هذه الأساليب مثمرة، غير أن أبحاث علم النفس التربوي تشير إلى أنها من أقل طرق التعلم فاعلية. وثمة تقنية أقوى بكثير هي ممارسة الاسترجاع: أي المحاولة النشطة لاستدعاء المعلومات من الذاكرة، مثلًا عبر الإجابة عن أسئلة تدريبية.\n\nفي تجربة نموذجية، قرأ الطلاب نصًا قصيرًا ثم قُسّموا إلى مجموعتين. أعادت إحدى المجموعتين قراءة النص، بينما خضعت الأخرى لاختبار فيه دون النظر إلى النص. وبعد أسبوع، تذكّر الطلاب الذين اختُبروا أكثر بكثير ممن اكتفوا بإعادة القراءة، رغم أن مجموعة إعادة القراءة كانت تشعر بثقة أكبر.\n\nلماذا ينجح الاختبار إلى هذا الحد؟ أحد التفسيرات أن الجهد المبذول في استرجاع المعلومات يقوّي الذاكرة ويسهّل استدعاءها مستقبلًا. كما يكشف الاختبار الثغرات في المعرفة، فيُظهر للطلاب الموضوعات التي تحتاج إلى مزيد من الاهتمام. أما إعادة القراءة، في المقابل، فتولّد شعورًا بالألفة قد يُحسب خطأً فهمًا حقيقيًا.\n\nبالنسبة إلى الطلاب الذين يستعدون لامتحان بأسئلة الاختيار من متعدد، فإن الدلالات واضحة. فبدلًا من قراءة قوائم الكلمات مرارًا وتكرارًا، عليهم التدرّب على أسئلة مشابهة لأسئلة الامتحان، والتحقق من إجاباتهم، ومراجعة أخطائهم. ومن المرجح أن يحقق توزيع هذا التدريب على عدة أسابيع، بدلًا من حصره في الأيام الأخيرة، أفضل النتائج.","questions":[["According to the passage, why can rereading be misleading?","It creates familiarity that feels like real understanding.","It takes much longer than testing.","It causes students to forget everything they learned.","It is useful only for multiple-choice exams."],["What did the experiment in the second paragraph show?","Tested students remembered more than those who reread.","Students who reread remembered more but felt less confident.","Both groups remembered exactly the same amount.","Tested students felt more confident but remembered less."],["What does the author recommend in the final paragraph?","Practicing with exam-like questions over several weeks","Highlighting more passages in the textbook","Studying only during the final days","Avoiding practice tests to reduce stress"]]}}]},{"id":"biz","group":"adults","he":"אנגלית עסקית","sub":"מיילים, פגישות, משא ומתן ומצגות ברמה מקצועית","e":"💼","units":[{"en":"networking and introductions","he":"היכרות מקצועית ונטוורקינג","ru":"Деловые знакомства и нетворкинг","ar":"التعارف المهني وبناء العلاقات","e":"🤝","items":[{"en":"I don't think we've been formally introduced; I'm heading the analytics team.","he":"אני לא חושב/ת שהוצגנו רשמית; אני מוביל/ה את צוות האנליטיקה.","ru":"Кажется, нас официально не представили; я руковожу аналитическим отделом.","ar":"لا أظن أننا تعارفنا رسميًا؛ أنا أرأس فريق التحليلات.","e":"","alt":[]},{"en":"Would you mind if I reached out next week to explore possible synergies?","he":"יהיה בסדר אם אפנה אליך בשבוע הבא כדי לבחון שיתופי פעולה אפשריים?","ru":"Вы не против, если я свяжусь с вами на следующей неделе, чтобы обсудить возможное сотрудничество?","ar":"هل تمانع إن تواصلت معك الأسبوع المقبل لاستكشاف فرص التعاون الممكنة؟","e":"","alt":[]},{"en":"A mutual colleague suggested I get in touch regarding your expansion plans.","he":"עמית/ה משותף/ת הציע/ה שאיצור איתך קשר בנוגע לתוכניות ההתרחבות שלכם.","ru":"Наш общий коллега посоветовал мне связаться с вами по поводу ваших планов расширения.","ar":"اقترح عليّ زميل مشترك أن أتواصل معك بخصوص خطط التوسع لديكم.","e":"","alt":[]},{"en":"I'd be happy to put you in touch with our head of procurement.","he":"אשמח לחבר אותך עם מנהל/ת הרכש שלנו.","ru":"Я с удовольствием свяжу вас с нашим руководителем отдела закупок.","ar":"يسعدني أن أعرّفك على مدير المشتريات لدينا.","e":"","alt":[]},{"en":"What I find most rewarding about my role is translating data into strategy.","he":"מה שהכי מספק אותי בתפקיד שלי הוא לתרגם נתונים לאסטרטגיה.","ru":"Больше всего в своей работе я ценю возможность превращать данные в стратегию.","ar":"أكثر ما يمنحني الرضا في عملي هو تحويل البيانات إلى استراتيجية.","e":"","alt":[]},{"en":"It was a pleasure meeting you; let's continue this conversation over coffee sometime.","he":"היה תענוג להכיר אותך; בוא/י נמשיך את השיחה הזאת על קפה מתישהו.","ru":"Было приятно познакомиться; давайте как-нибудь продолжим этот разговор за чашкой кофе.","ar":"سُررت بلقائك؛ لنكمل هذا الحديث على فنجان قهوة في وقت ما.","e":"","alt":[]}],"reading":{"en":"Subject: Following up from the Tel Aviv FinTech Summit. Dear Ms. Levin, It was a pleasure speaking with you briefly after your panel on Thursday. I was particularly struck by your point that most digital onboarding fails not because of technology, but because companies underestimate how much reassurance customers need at each step. As I mentioned, I lead product design at Clearpath, a Haifa-based startup that builds identity-verification tools for mid-sized banks. We have recently been piloting a simplified onboarding flow, and our early data seems to support your argument: completion rates rose by nearly a third once we added short explanations before each request for personal documents. I realise your schedule is likely to be very full, so I would not want to take up much of your time. However, if you were open to a twenty-minute call in the coming weeks, I would greatly value your perspective on whether our approach could scale to larger institutions. Either way, thank you again for a genuinely thought-provoking session. I have attached a brief summary of our pilot results in case they are of interest. Kind regards, Daniel Shapira","he":"נושא: המשך לפגישתנו בכנס הפינטק בתל אביב. גב' לוין היקרה, היה לי עונג לשוחח איתך בקצרה אחרי הפאנל שלך ביום חמישי. במיוחד הרשימה אותי הטענה שלך שרוב תהליכי ההצטרפות הדיגיטליים נכשלים לא בגלל הטכנולוגיה, אלא משום שחברות ממעיטות בהערכת מידת הביטחון שהלקוחות צריכים בכל שלב. כפי שציינתי, אני מוביל את עיצוב המוצר ב-Clearpath, סטארט-אפ מחיפה שמפתח כלים לאימות זהות עבור בנקים בינוניים. לאחרונה הרצנו פיילוט של תהליך הצטרפות פשוט יותר, והנתונים הראשוניים שלנו נראים כתומכים בטענתך: שיעורי ההשלמה עלו בכמעט שליש לאחר שהוספנו הסברים קצרים לפני כל בקשה למסמכים אישיים. אני מבין שלוח הזמנים שלך כנראה עמוס מאוד, ולכן לא ארצה לגזול הרבה מזמנך. עם זאת, אם תהיי פתוחה לשיחה של עשרים דקות בשבועות הקרובים, אעריך מאוד את נקודת המבט שלך בשאלה אם הגישה שלנו יכולה להתאים גם למוסדות גדולים יותר. כך או כך, תודה שוב על מושב מעורר מחשבה באמת. צירפתי סיכום קצר של תוצאות הפיילוט שלנו, למקרה שזה מעניין אותך. בברכה, דניאל שפירא","ru":"Тема: По итогам финтех-саммита в Тель-Авиве. Уважаемая г-жа Левин, мне было очень приятно коротко побеседовать с вами после вашей панельной дискуссии в четверг. Особенно меня впечатлила ваша мысль о том, что большинство процессов цифровой регистрации проваливаются не из-за технологий, а потому, что компании недооценивают, насколько клиентам нужна уверенность на каждом этапе. Как я уже говорил, я руковожу дизайном продукта в Clearpath — стартапе из Хайфы, который разрабатывает инструменты проверки личности для банков среднего размера. Недавно мы запустили пилотный проект упрощённой регистрации, и наши первые данные, похоже, подтверждают вашу точку зрения: доля завершённых регистраций выросла почти на треть после того, как мы добавили короткие пояснения перед каждым запросом личных документов. Я понимаю, что ваш график, вероятно, очень плотный, поэтому не хотел бы отнимать у вас много времени. Однако, если вы готовы к двадцатиминутному звонку в ближайшие недели, я был бы очень благодарен за ваше мнение о том, можно ли масштабировать наш подход для более крупных организаций. В любом случае ещё раз спасибо за по-настоящему интересное выступление. Прилагаю краткое резюме результатов нашего пилота на случай, если они вас заинтересуют. С уважением, Даниэль Шапира","ar":"الموضوع: متابعة بعد قمة التكنولوجيا المالية في تل أبيب. السيدة ليفين المحترمة، سُررت كثيرًا بالحديث معك لفترة قصيرة بعد جلستك النقاشية يوم الخميس. لقد لفتت انتباهي بشكل خاص فكرتك بأن معظم عمليات التسجيل الرقمي تفشل ليس بسبب التكنولوجيا، بل لأن الشركات تستهين بمقدار الطمأنينة التي يحتاجها العملاء في كل خطوة. كما ذكرت، أنا أقود تصميم المنتجات في Clearpath، وهي شركة ناشئة مقرها حيفا تطوّر أدوات للتحقق من الهوية للبنوك متوسطة الحجم. لقد بدأنا مؤخرًا تجربة مسار تسجيل مبسّط، ويبدو أن بياناتنا الأولية تدعم رأيك: فقد ارتفعت نسب إتمام التسجيل بنحو الثلث بعد أن أضفنا شروحات قصيرة قبل كل طلب للمستندات الشخصية. أدرك أن جدولك على الأرجح مزدحم جدًا، لذلك لا أريد أن آخذ الكثير من وقتك. ومع ذلك، إن كنتِ منفتحة على مكالمة مدتها عشرون دقيقة في الأسابيع القادمة، فسأقدّر كثيرًا رأيك حول إمكانية تطبيق نهجنا على مؤسسات أكبر. وفي كل الأحوال، شكرًا مجددًا على جلسة محفّزة للتفكير حقًا. لقد أرفقت ملخصًا موجزًا لنتائج تجربتنا في حال كانت تهمّك. مع خالص التحيات، دانيال شابيرا","questions":[["What is the main purpose of Daniel's email?","To request a short call to get her opinion on their approach","To invite her to speak at Clearpath's next conference","To complain about the content of her panel","To offer her a job leading product design"],["What can be inferred about Daniel's pilot results?","They appear to confirm an idea Ms. Levin presented","They prove technology is the main cause of failure","They were rejected by several large banks","They have not been collected yet"],["How would you describe the tone of the email?","Polite and respectful, without being pushy","Demanding and impatient","Casual and joking","Apologetic and nervous"]]}},{"en":"running meetings","he":"ניהול ישיבות","ru":"Проведение совещаний","ar":"إدارة الاجتماعات","e":"📋","items":[{"en":"Let's make sure we stick to the agenda so we can finish on time.","he":"בואו נקפיד להיצמד לסדר היום כדי שנוכל לסיים בזמן.","ru":"Давайте придерживаться повестки, чтобы закончить вовремя.","ar":"لنحرص على الالتزام بجدول الأعمال حتى ننتهي في الوقت المحدد.","e":"","alt":[]},{"en":"Before we move on, does anyone have any concerns they'd like to raise?","he":"לפני שנמשיך הלאה, יש למישהו חששות שהוא רוצה להעלות?","ru":"Прежде чем двигаться дальше, есть ли у кого-нибудь опасения, которые хотелось бы озвучить?","ar":"قبل أن ننتقل، هل لدى أحد أي مخاوف يود طرحها؟","e":"","alt":[]},{"en":"I'm afraid we're running short on time, so let's park that issue for now.","he":"אני חושש/ת שהזמן אוזל לנו, אז בואו נניח את הנושא הזה בצד בינתיים.","ru":"Боюсь, у нас заканчивается время, так что давайте пока отложим этот вопрос.","ar":"أخشى أن الوقت يداهمنا، لذا لنؤجل هذه المسألة في الوقت الحالي.","e":"","alt":[]},{"en":"Could you briefly bring everyone up to speed on where things stand?","he":"תוכל/י לעדכן בקצרה את כולם לגבי המצב הנוכחי?","ru":"Не могли бы вы вкратце рассказать всем, как обстоят дела?","ar":"هل يمكنك أن تُطلع الجميع باختصار على آخر المستجدات؟","e":"","alt":[]},{"en":"To sum up, we've agreed to postpone the launch until early next quarter.","he":"לסיכום, הסכמנו לדחות את ההשקה לתחילת הרבעון הבא.","ru":"Подводя итог: мы договорились перенести запуск на начало следующего квартала.","ar":"خلاصة القول، اتفقنا على تأجيل الإطلاق إلى بداية الربع القادم.","e":"","alt":[]},{"en":"I'll circulate the minutes and action items by the end of the day.","he":"אפיץ את הפרוטוקול ואת משימות ההמשך עד סוף היום.","ru":"Я разошлю протокол и список задач до конца дня.","ar":"سأوزّع محضر الاجتماع والمهام المطلوبة قبل نهاية اليوم.","e":"","alt":[]}],"reading":{"en":"To: Operations team. From: Noa Ben-David. Re: Summary of Monday's planning meeting. Thank you all for a productive discussion on Monday. For those who were unable to attend, here is a brief summary of what was agreed. First, we confirmed that the warehouse migration will go ahead as planned, although the start date has been moved from 1 March to 15 March. This should give the IT team enough time to complete testing of the new inventory system, which several of you rightly flagged as a risk. Second, there was a lively debate about whether to outsource weekend deliveries. While no final decision was reached, most participants seemed to feel that a three-month trial with a local courier would be a sensible compromise. Yossi has kindly agreed to prepare a cost comparison before our next meeting. Finally, I would like to acknowledge that the meeting ran over by almost forty minutes. In future, I will circulate the agenda earlier and allocate fixed time slots to each item, so that we can keep discussions focused. Action items are listed below. Please let me know by Thursday if I have missed anything.","he":"אל: צוות התפעול. מאת: נועה בן-דוד. הנדון: סיכום ישיבת התכנון של יום שני. תודה לכולכם על דיון פורה ביום שני. למי שלא הצליח להשתתף, הנה סיכום קצר של מה שסוכם. ראשית, אישרנו שהמעבר למחסן החדש יתבצע כמתוכנן, אם כי מועד ההתחלה הוזז מ-1 במרץ ל-15 במרץ. זה אמור לתת לצוות ה-IT מספיק זמן להשלים את הבדיקות של מערכת המלאי החדשה, שכמה מכם הצביעו עליה בצדק כעל סיכון. שנית, התקיים דיון ער בשאלה אם להעביר את משלוחי סוף השבוע למיקור חוץ. אף שלא התקבלה החלטה סופית, נראה שרוב המשתתפים סברו שניסיון של שלושה חודשים עם חברת שליחויות מקומית יהיה פשרה הגיונית. יוסי הסכים בטובו להכין השוואת עלויות לקראת הישיבה הבאה. לבסוף, אני רוצה להודות שהישיבה חרגה בכמעט ארבעים דקות. בעתיד אפיץ את סדר היום מוקדם יותר ואקצה פרקי זמן קבועים לכל נושא, כדי שנוכל לשמור על דיונים ממוקדים. משימות ההמשך מפורטות למטה. אנא עדכנו אותי עד יום חמישי אם פספסתי משהו.","ru":"Кому: отдел логистики. От: Ноа Бен-Давид. Тема: итоги планёрки в понедельник. Спасибо всем за продуктивное обсуждение в понедельник. Для тех, кто не смог присутствовать, вот краткое изложение достигнутых договорённостей. Во-первых, мы подтвердили, что переезд склада состоится по плану, хотя дата начала перенесена с 1 марта на 15 марта. Это должно дать IT-отделу достаточно времени, чтобы завершить тестирование новой системы учёта запасов, которую некоторые из вас справедливо назвали источником риска. Во-вторых, развернулась оживлённая дискуссия о том, стоит ли передать доставку по выходным на аутсорсинг. Хотя окончательного решения принято не было, большинство участников, судя по всему, считают разумным компромиссом трёхмесячный пробный период с местной курьерской службой. Йоси любезно согласился подготовить сравнение затрат к следующей встрече. И наконец, должна признать, что совещание затянулось почти на сорок минут. В будущем я буду рассылать повестку заранее и выделять на каждый пункт фиксированное время, чтобы обсуждение оставалось сфокусированным. Список задач приведён ниже. Пожалуйста, сообщите мне до четверга, если я что-то упустила.","ar":"إلى: فريق العمليات. من: نوعا بن دافيد. الموضوع: ملخص اجتماع التخطيط يوم الاثنين. شكرًا لكم جميعًا على النقاش المثمر يوم الاثنين. لمن لم يتمكن من الحضور، إليكم ملخصًا موجزًا لما تم الاتفاق عليه. أولًا، أكدنا أن نقل المستودع سيمضي كما هو مخطط له، رغم أن موعد البدء نُقل من 1 آذار إلى 15 آذار. ومن المفترض أن يمنح ذلك فريق تكنولوجيا المعلومات وقتًا كافيًا لإكمال اختبار نظام المخزون الجديد، الذي أشار إليه عدد منكم عن حق باعتباره مصدر خطر. ثانيًا، دار نقاش حيوي حول ما إذا كان ينبغي إسناد توصيلات نهاية الأسبوع إلى جهة خارجية. ورغم عدم التوصل إلى قرار نهائي، بدا أن معظم المشاركين يرون أن تجربة لمدة ثلاثة أشهر مع شركة توصيل محلية ستكون حلًا وسطًا معقولًا. وقد وافق يوسي مشكورًا على إعداد مقارنة للتكاليف قبل اجتماعنا القادم. أخيرًا، أود أن أعترف بأن الاجتماع تجاوز وقته بنحو أربعين دقيقة. في المستقبل، سأوزّع جدول الأعمال في وقت أبكر وسأخصص فترات زمنية ثابتة لكل بند، حتى نحافظ على تركيز النقاشات. المهام المطلوبة مدرجة أدناه. يُرجى إبلاغي قبل يوم الخميس إن فاتني أي شيء.","questions":[["Why did Noa write this memo?","To record decisions and inform people who missed the meeting","To cancel the warehouse migration","To announce a new courier contract","To criticise Yossi's cost comparison"],["What can be inferred about the weekend deliveries issue?","It is still open and needs more information","It was fully resolved during the meeting","Everyone strongly opposed outsourcing","A courier has already been hired"],["What does Noa's comment about the meeting's length suggest?","She takes responsibility and wants to improve future meetings","She blames participants for talking too much","She plans to stop holding meetings","She thinks long meetings are more productive"]]}},{"en":"professional emails","he":"כתיבת מיילים מקצועיים","ru":"Деловая переписка","ar":"كتابة رسائل البريد المهنية","e":"📧","items":[{"en":"I'm writing to follow up on my previous email regarding the revised contract.","he":"אני כותב/ת כדי לעקוב אחר המייל הקודם שלי בנוגע לחוזה המעודכן.","ru":"Пишу, чтобы напомнить о своём предыдущем письме по поводу пересмотренного договора.","ar":"أكتب لمتابعة رسالتي السابقة بخصوص العقد المعدَّل.","e":"","alt":[]},{"en":"Please find attached the updated proposal for your review and approval.","he":"מצורפת ההצעה המעודכנת לעיונך ולאישורך.","ru":"Во вложении — обновлённое предложение для вашего рассмотрения и утверждения.","ar":"تجدون مرفقًا المقترح المحدَّث لمراجعته والموافقة عليه.","e":"","alt":[]},{"en":"I'd appreciate it if you could get back to me by Thursday afternoon.","he":"אודה לך אם תוכל/י לחזור אליי עד יום חמישי אחר הצהריים.","ru":"Буду признателен/признательна, если вы ответите мне до четверга, второй половины дня.","ar":"سأكون ممتنًا لو أمكنك الرد عليّ قبل ظهر يوم الخميس.","e":"","alt":[]},{"en":"Apologies for the delayed response; I've only just returned from annual leave.","he":"סליחה על התגובה המאוחרת; רק עכשיו חזרתי מחופשה.","ru":"Прошу прощения за задержку с ответом: я только что вернулся/вернулась из отпуска.","ar":"أعتذر عن التأخر في الرد؛ فقد عدت للتو من إجازتي السنوية.","e":"","alt":[]},{"en":"Could you kindly clarify whether the price includes installation and ongoing support?","he":"תוכל/י בבקשה להבהיר אם המחיר כולל התקנה ותמיכה שוטפת?","ru":"Не могли бы вы уточнить, включает ли цена установку и постоянную поддержку?","ar":"هل يمكنك التوضيح مشكورًا ما إذا كان السعر يشمل التركيب والدعم المستمر؟","e":"","alt":[]},{"en":"Should you have any further questions, please don't hesitate to contact me.","he":"אם יש לך שאלות נוספות, אל תהסס/י לפנות אליי.","ru":"Если у вас возникнут дополнительные вопросы, пожалуйста, обращайтесь ко мне.","ar":"إن كانت لديك أي أسئلة أخرى، فلا تتردد في التواصل معي.","e":"","alt":[]}],"reading":{"en":"Subject: Invoice #4127 - second reminder. Dear Mr. Katz, I hope this message finds you well. I am writing to follow up on my email of 3 June regarding invoice #4127, which was due for payment on 31 May. According to our records, the balance of 18,400 shekels remains outstanding. I appreciate that oversights of this kind can happen, particularly at the end of a busy quarter, and it is entirely possible that payment is already being processed. If so, please disregard this message and accept my thanks. If, however, there is an issue with the invoice itself, such as an incorrect purchase order number or a query about the hours billed, I would be grateful if you could let me know so that we can resolve it promptly. I have attached a copy of the original invoice and the signed timesheet for your convenience. We greatly value our relationship with your company and would prefer to settle this matter informally. That said, I would appreciate a response by Friday 14 June, as our finance department will otherwise need to follow its standard collection procedure. Best regards, Michal Rosen, Accounts Manager","he":"נושא: חשבונית מס' 4127 – תזכורת שנייה. מר כץ היקר, אני מקווה שהודעה זו מוצאת אותך בטוב. אני כותבת כדי לעקוב אחר המייל שלי מ-3 ביוני בנוגע לחשבונית מס' 4127, שמועד התשלום שלה היה 31 במאי. לפי הרישומים שלנו, היתרה בסך 18,400 שקלים טרם שולמה. אני מבינה שהשמטות מסוג זה יכולות לקרות, במיוחד בסוף רבעון עמוס, וייתכן מאוד שהתשלום כבר נמצא בטיפול. אם כך, אנא התעלם מהודעה זו וקבל את תודתי. אם, לעומת זאת, יש בעיה בחשבונית עצמה, כמו מספר הזמנת רכש שגוי או שאלה לגבי השעות שחויבו, אודה לך אם תעדכן אותי כדי שנוכל לפתור זאת במהירות. לנוחותך צירפתי עותק של החשבונית המקורית ואת דוח השעות החתום. אנו מעריכים מאוד את הקשר שלנו עם החברה שלך ומעדיפים להסדיר עניין זה באופן לא פורמלי. עם זאת, אודה לתשובה עד יום שישי, 14 ביוני, שכן אחרת מחלקת הכספים שלנו תיאלץ לפעול לפי נוהל הגבייה הרגיל. בברכה, מיכל רוזן, מנהלת חשבונות","ru":"Тема: Счёт № 4127 — повторное напоминание. Уважаемый г-н Кац, надеюсь, у вас всё хорошо. Пишу в продолжение своего письма от 3 июня относительно счёта № 4127, срок оплаты которого истёк 31 мая. Согласно нашим данным, сумма в 18 400 шекелей до сих пор не погашена. Я понимаю, что подобные упущения случаются, особенно в конце напряжённого квартала, и вполне возможно, что платёж уже обрабатывается. Если это так, пожалуйста, не обращайте внимания на это письмо и примите мою благодарность. Если же возникла проблема с самим счётом — например, неверный номер заказа на закупку или вопрос по выставленным часам, — буду признательна, если вы сообщите мне об этом, чтобы мы могли быстро всё уладить. Для вашего удобства прилагаю копию исходного счёта и подписанный табель учёта времени. Мы очень ценим сотрудничество с вашей компанией и предпочли бы решить этот вопрос в неформальном порядке. Тем не менее я была бы благодарна за ответ до пятницы, 14 июня, поскольку в противном случае наш финансовый отдел будет вынужден применить стандартную процедуру взыскания. С наилучшими пожеланиями, Михаль Розен, менеджер по работе со счетами","ar":"الموضوع: الفاتورة رقم 4127 – تذكير ثانٍ. السيد كاتس المحترم، آمل أن تصلك رسالتي وأنت بخير. أكتب لمتابعة رسالتي المؤرخة في 3 حزيران بخصوص الفاتورة رقم 4127، التي كان موعد استحقاقها 31 أيار. وفقًا لسجلاتنا، لا يزال المبلغ البالغ 18,400 شيكل غير مسدَّد. أتفهّم أن مثل هذا السهو قد يحدث، خاصة في نهاية ربع سنة مزدحم، ومن الممكن تمامًا أن تكون الدفعة قيد المعالجة بالفعل. إن كان الأمر كذلك، فيُرجى تجاهل هذه الرسالة وتقبّل شكري. أما إذا كانت هناك مشكلة في الفاتورة نفسها، مثل رقم طلب شراء غير صحيح أو استفسار حول الساعات المحتسبة، فسأكون ممتنة لو أبلغتني بذلك حتى نتمكن من حلها بسرعة. وقد أرفقت لراحتك نسخة من الفاتورة الأصلية وكشف ساعات العمل الموقَّع. نحن نقدّر كثيرًا علاقتنا بشركتكم ونفضّل تسوية هذه المسألة بشكل ودّي. ومع ذلك، سأكون ممتنة لردّكم قبل يوم الجمعة 14 حزيران، إذ سيتعيّن على قسم المالية لدينا خلاف ذلك اتباع إجراءات التحصيل المعتادة. مع أطيب التحيات، ميخال روزن، مديرة الحسابات","questions":[["What is the main purpose of this email?","To remind a client about an unpaid invoice","To send a new invoice for extra work","To end the business relationship","To apologise for a billing mistake"],["What does the final paragraph imply?","Formal action may follow if there is no reply by Friday","The company has decided to cancel the debt","Michal has already contacted a lawyer","Payment is no longer required"],["Which best describes the tone of the email?","Courteous but firm","Angry and threatening","Overly casual and friendly","Uncertain and apologetic"]]}},{"en":"remote work","he":"שיחות וידאו ועבודה מרחוק","ru":"Видеозвонки и удалённая работа","ar":"مكالمات الفيديو والعمل عن بُعد","e":"💻","items":[{"en":"Sorry, you cut out for a moment; could you repeat the last point?","he":"סליחה, הקול שלך נקטע לרגע; תוכל/י לחזור על הנקודה האחרונה?","ru":"Извините, вас на секунду не было слышно; не могли бы вы повторить последний пункт?","ar":"عذرًا، انقطع صوتك للحظة؛ هل يمكنك تكرار النقطة الأخيرة؟","e":"","alt":[]},{"en":"I think you're on mute; we can see you but can't hear you.","he":"אני חושב/ת שהמיקרופון שלך מושתק; אנחנו רואים אותך אבל לא שומעים.","ru":"Кажется, у вас выключен микрофон: мы вас видим, но не слышим.","ar":"أظن أن الميكروفون لديك مكتوم؛ نستطيع رؤيتك لكن لا نسمعك.","e":"","alt":[]},{"en":"Let me share my screen so everyone can see the latest figures.","he":"תנו לי לשתף מסך כדי שכולם יוכלו לראות את הנתונים העדכניים.","ru":"Давайте я покажу свой экран, чтобы все видели последние цифры.","ar":"دعوني أشارك شاشتي ليتمكن الجميع من رؤية أحدث الأرقام.","e":"","alt":[]},{"en":"My connection seems unstable, so I'll switch off my camera for now.","he":"החיבור שלי נראה לא יציב, אז אכבה את המצלמה בינתיים.","ru":"Похоже, у меня нестабильное соединение, поэтому я пока выключу камеру.","ar":"يبدو أن اتصالي غير مستقر، لذا سأطفئ الكاميرا في الوقت الحالي.","e":"","alt":[]},{"en":"Since we're in different time zones, let's agree on core overlap hours.","he":"מכיוון שאנחנו באזורי זמן שונים, בואו נסכים על שעות חפיפה קבועות.","ru":"Поскольку мы в разных часовых поясах, давайте договоримся об общих рабочих часах.","ar":"بما أننا في مناطق زمنية مختلفة، لنتفق على ساعات عمل مشتركة أساسية.","e":"","alt":[]},{"en":"I'll drop the link in the chat so you can review the document later.","he":"אשים את הקישור בצ'אט כדי שתוכלו לעבור על המסמך אחר כך.","ru":"Я брошу ссылку в чат, чтобы вы могли посмотреть документ позже.","ar":"سأضع الرابط في الدردشة لتتمكنوا من مراجعة المستند لاحقًا.","e":"","alt":[]}],"rea
