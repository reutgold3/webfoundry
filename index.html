rs in summer than in winter.","o":["The museum is busiest in winter.","Fewer people visit the museum in winter than in summer.","The museum is closed in winter.","The number of visitors is the same all year."],"a":1,"ex":"יותר מבקרים בקיץ = פחות מבקרים בחורף."},{"id":"ers-35","type":"rs","lvl":2,"q":"She left the job in order to spend more time with her family.","o":["Her reason for quitting was to be with her family more.","Her family asked her to keep the job.","She spent less time with her family after leaving the job.","She got the job because of her family."],"a":0,"ex":"in order to מציין מטרה: היא עזבה כדי להיות יותר עם המשפחה."},{"id":"ers-36","type":"rs","lvl":2,"q":"Unless it rains, the game will take place as planned.","o":["The game will take place only if it rains.","The game was cancelled because of rain.","Rain will not affect the game.","The game will happen as planned if it does not rain."],"a":3,"ex":"unless = אלא אם כן, כלומר 'if not'."},{"id":"ers-37","type":"rs","lvl":2,"q":"The company's profits doubled last year.","o":["The company lost half of its profits last year.","The company's profits stayed the same last year.","The company had two good years in a row.","Last year, the company earned twice as much as before."],"a":3,"ex":"doubled = הוכפלו, כלומר פי שניים."},{"id":"ers-38","type":"rs","lvl":2,"q":"Even experts find this problem difficult.","o":["Only experts can solve this problem easily.","Experts think this problem is simple.","Experts have never seen this problem.","This problem is challenging, even for specialists."],"a":3,"ex":"'even experts' = אפילו מומחים מתקשים בבעיה."},{"id":"ers-39","type":"rs","lvl":2,"q":"I would rather walk than take the bus.","o":["I prefer taking the bus to walking.","I cannot walk, so I take the bus.","I prefer walking to taking the bus.","I walk only when there is no bus."],"a":2,"ex":"would rather A than B = מעדיף A על פני B."},{"id":"ers-40","type":"rs","lvl":2,"q":"The city's population has remained stable for decades.","o":["The city's population has grown rapidly.","The city has lost most of its population.","Nobody knows the city's population.","The number of people in the city has hardly changed for many years."],"a":3,"ex":"remained stable = נשארה יציבה, כמעט לא השתנתה."},{"id":"ers-41","type":"rs","lvl":3,"q":"The study's results, while interesting, cannot be applied to the general population.","o":["Although the findings are interesting, they are not valid for people in general.","The results are interesting because they apply to everyone.","The study was neither interesting nor useful.","The general population took part in the study."],"a":0,"ex":"while = אף כי. הממצאים מעניינים, אך אי אפשר להכליל אותם על כלל האוכלוסייה."},{"id":"ers-42","type":"rs","lvl":3,"q":"Contrary to popular belief, bats are not blind.","o":["As most people know, bats cannot see.","Bats are blind, although few people know it.","Many people think bats cannot see, but this is not true.","Popular belief about bats is generally correct."],"a":2,"ex":"contrary to popular belief = בניגוד לאמונה הרווחת: רבים חושבים שעטלפים עיוורים, וזה לא נכון."},{"id":"ers-43","type":"rs","lvl":3,"q":"The success of the campaign owes much to the dedication of its volunteers.","o":["The volunteers owed money to the campaign.","The campaign failed despite the volunteers' efforts.","The volunteers were rewarded for the campaign's success.","The campaign succeeded largely because its volunteers were committed."],"a":3,"ex":"owe much to = חייב הרבה ל-, כלומר ההצלחה נבעה במידה רבה מהמתנדבים."},{"id":"ers-44","type":"rs","lvl":3,"q":"Rarely has a book generated so much controversy.","o":["This book caused little controversy.","Books often cause this much controversy.","Few books have caused as much debate as this one.","The book was rarely read because of the controversy."],"a":2,"ex":"מבנה הפוך עם rarely מדגיש שנדיר שספר עורר מחלוקת כזאת."},{"id":"ers-45","type":"rs","lvl":3,"q":"The author's second novel was far less successful than her first.","o":["Her second novel was more successful than her first.","Both of her novels were equally successful.","Her first novel did much better than her second.","Her first novel was a failure."],"a":2,"ex":"far less successful = הרבה פחות מוצלח: הרומן הראשון הצליח יותר."},{"id":"ers-46","type":"rs","lvl":3,"q":"The decision to close the factory was not made lightly.","o":["The factory was closed without much thought.","Nobody decided to close the factory.","Closing the factory was decided only after serious consideration.","The factory was closed because it had no light."],"a":2,"ex":"not lightly = לא בקלות ראש, כלומר אחרי שיקול רציני."},{"id":"ers-47","type":"rs","lvl":3,"q":"Although the treatment eases the symptoms, it does not cure the disease.","o":["The treatment makes patients feel better but does not eliminate the illness.","The treatment cures the disease completely.","The treatment neither eases the symptoms nor cures the disease.","The treatment cures the disease but worsens the symptoms."],"a":0,"ex":"eases the symptoms = מקל על התסמינים; אך אינו מרפא."},{"id":"ers-48","type":"rs","lvl":3,"q":"It is doubtful whether the plan will be approved.","o":["The plan may well not be approved.","The plan will certainly be approved.","The plan has already been approved.","Nobody has any doubts about the plan."],"a":0,"ex":"doubtful = מוטל בספק. ייתכן מאוד שהתוכנית לא תאושר."},{"id":"ers-49","type":"rs","lvl":3,"q":"The village owes its prosperity to tourism.","o":["Tourism is the reason the village is wealthy.","The village is poor despite tourism.","Tourism has harmed the village.","The village owes money to tourists."],"a":0,"ex":"owe X to Y = X נובע מ-Y: השגשוג נובע מהתיירות."},{"id":"ers-50","type":"rs","lvl":3,"q":"He was among the first to recognize the importance of the discovery.","o":["He was the last to understand the discovery.","He made the discovery himself.","He did not think the discovery was important.","Few people realized how significant the discovery was before he did."],"a":3,"ex":"among the first = מהראשונים, כלומר מעטים זיהו זאת לפניו."},{"id":"ers-51","type":"rs","lvl":3,"q":"The new law, far from reducing crime, seems to have increased it.","o":["The new law has greatly reduced crime.","Crime was reduced, but not by much.","Instead of lowering crime, the new law appears to have raised it.","The new law has had no effect on crime."],"a":2,"ex":"far from = רחוק מ-, להפך: במקום להפחית, החוק הגביר את הפשיעה."},{"id":"ers-52","type":"rs","lvl":3,"q":"Her reputation as a scientist rests largely on a single experiment.","o":["She is known as a scientist mainly because of one experiment.","She performed only one experiment in her life.","Her reputation was damaged by one experiment.","She is famous for many different experiments."],"a":0,"ex":"rests on = נשען על. המוניטין שלה מבוסס בעיקר על ניסוי אחד – לא שערכה רק ניסוי אחד."},{"id":"ers-53","type":"rs","lvl":3,"q":"Little is known about the painter's early life.","o":["The painter's early life is well documented.","There is not much information about the painter's youth.","The painter lived only a short time.","The painter painted little as a young person."],"a":1,"ex":"little is known = ידוע מעט."},{"id":"ers-54","type":"rs","lvl":3,"q":"Only after the accident did the city install traffic lights at the intersection.","o":["Traffic lights were placed at the intersection as a result of the accident, not before.","The traffic lights caused the accident.","The city installed traffic lights before the accident.","No traffic lights were installed after the accident."],"a":0,"ex":"only after = רק אחרי: הרמזורים הותקנו רק לאחר התאונה."},{"id":"ers-55","type":"rs","lvl":3,"q":"The two languages are related, but speakers of one cannot easily understand the other.","o":["Despite their connection, the languages are not easy for each other's speakers to understand.","Because they are related, their speakers understand each other easily.","The two languages are not related at all.","The speakers of both languages are relatives."],"a":0,"ex":"השפות קרובות, ובכל זאת דוברי האחת אינם מבינים בקלות את השנייה."},{"id":"ers-56","type":"rs","lvl":3,"q":"The exhibition proved more popular than its organizers had anticipated.","o":["The exhibition was less popular than expected.","The organizers expected the exhibition to be very popular, and it was.","The exhibition was cancelled due to low interest.","The organizers did not expect so many people to like the exhibition."],"a":3,"ex":"more popular than anticipated = פופולרית יותר מהצפוי."},{"id":"ers-57","type":"rs","lvl":3,"q":"Scientists have yet to find a cure for the disease.","o":["Scientists have already found a cure.","Scientists have stopped searching for a cure.","The disease cannot be cured.","No cure for the disease has been found so far."],"a":3,"ex":"have yet to = עדיין לא. התרופה טרם נמצאה, אבל זה לא אומר שאין אפשרות."},{"id":"ers-58","type":"rs","lvl":3,"q":"The plan is ambitious, but by no means impossible.","o":["The plan is simple and easy.","The plan is so ambitious that it cannot succeed.","The plan has no chance at all.","The plan is demanding, yet it can certainly be achieved."],"a":3,"ex":"by no means = בשום אופן לא. התוכנית שאפתנית אך בהחלט אפשרית."},{"id":"ers-59","type":"rs","lvl":3,"q":"In retrospect, the decision appears to have been a mistake.","o":["At the time, everyone knew the decision was wrong.","The decision will be a mistake in the future.","Looking back, the decision was clearly right.","Looking back, the decision seems to have been wrong."],"a":3,"ex":"in retrospect = במבט לאחור."},{"id":"ers-60","type":"rs","lvl":3,"q":"The museum's collection is second only to that of the national museum.","o":["This museum has the best collection in the country.","Only the national museum has a better collection than this museum.","The national museum's collection is second-rate.","The museum has two collections."],"a":1,"ex":"second only to = שני רק ל-: רק המוזיאון הלאומי עולה עליו."},{"id":"ers-61","type":"rs","lvl":4,"q":"The minister's claim that the economy is improving is hardly supported by the latest figures.","o":["The newest data offer little support for the minister's statement that the economy is getting better.","The latest figures clearly prove that the economy is improving.","The minister refused to discuss the economy.","The figures show that the minister wants the economy to improve."],"a":0,"ex":"hardly supported = כמעט אינו נתמך. הנתונים כמעט אינם תומכים בטענת השר."},{"id":"ers-62","type":"rs","lvl":4,"q":"Were it not for the generous donation, the library would have closed.","o":["The library closed despite the donation.","The library donated generously in order to stay open.","The library would close if it received a donation.","The library stayed open only because of a generous donation."],"a":3,"ex":"were it not for = אלמלא. אלמלא התרומה הספרייה הייתה נסגרת – כלומר התרומה הצילה אותה."},{"id":"ers-63","type":"rs","lvl":4,"q":"Not until the late nineteenth century did doctors fully appreciate the role of hygiene in preventing disease.","o":["Doctors understood the importance of hygiene long before the nineteenth century.","In the late nineteenth century, doctors stopped believing in hygiene.","Only in the late 1800s did doctors fully understand how hygiene helps prevent illness.","Hygiene became less important at the end of the nineteenth century."],"a":2,"ex":"not until = רק ב-. ההבנה המלאה הגיעה רק בסוף המאה ה-19."},{"id":"ers-64","type":"rs","lvl":4,"q":"The critics' praise notwithstanding, the film failed at the box office.","o":["The film failed because the critics disliked it.","Even though critics praised the film, it did not sell many tickets.","The critics' praise made the film a commercial success.","The critics did not review the film."],"a":1,"ex":"notwithstanding = למרות. הסרט נכשל בקופות למרות שבחי המבקרים."},{"id":"ers-65","type":"rs","lvl":4,"q":"The theory, though elegant, has little empirical support.","o":["The theory is well supported by evidence, though not elegant.","The theory is both elegant and strongly supported.","The theory is attractive, but there is scarce evidence for it.","The theory lacks both elegance and evidence."],"a":2,"ex":"התאוריה אלגנטית, אך יש לה מעט תמיכה אמפירית (מבוססת ראיות)."},{"id":"ers-66","type":"rs","lvl":4,"q":"So rapid was the city's growth that its infrastructure could not keep pace.","o":["The city grew slowly, giving its infrastructure time to develop.","The infrastructure caused the city to grow rapidly.","The city grew so fast that its roads and services could not keep up.","The city's infrastructure grew faster than its population."],"a":2,"ex":"מבנה הפוך so ... that: הצמיחה הייתה מהירה עד שהתשתיות לא עמדו בקצב."},{"id":"ers-67","type":"rs","lvl":4,"q":"His failure to respond was interpreted as a sign of agreement.","o":["He responded by clearly agreeing.","People took his silence to mean that he agreed.","His response was seen as a refusal.","He failed because he agreed."],"a":1,"ex":"failure to respond = אי-תגובה. השתיקה פורשה כהסכמה."},{"id":"ers-68","type":"rs","lvl":4,"q":"Of all the explanations offered, none accounts for every observation.","o":["Each proposed explanation leaves at least some observations unexplained.","One of the explanations accounts for all the observations.","No explanations have been offered.","All the explanations together cannot explain anything."],"a":0,"ex":"none accounts for every observation = אף הסבר אינו מסביר את כל התצפיות; לכל אחד יש תצפית שאינו מסביר."},{"id":"ers-69","type":"rs","lvl":4,"q":"The proposal met with resistance not only from the opposition but also from within the party itself.","o":["Only the opposition objected to the proposal.","Both the opposition and members of the party objected to the proposal.","The party supported the proposal, but the opposition did not.","The proposal was welcomed by everyone."],"a":1,"ex":"not only ... but also = לא רק ... אלא גם: גם האופוזיציה וגם חברי המפלגה התנגדו."},{"id":"ers-70","type":"rs","lvl":4,"q":"The extent of the damage was not apparent until the water had receded.","o":["The damage was obvious while the water was high.","The water caused no damage.","Only after the water went down did it become clear how serious the damage was.","The damage made the water recede."],"a":2,"ex":"not apparent until = לא נראה עד ש-. רק כשהמים נסוגו התברר היקף הנזק."},{"id":"ers-71","type":"rs","lvl":4,"q":"Her reluctance to speak publicly should not be mistaken for a lack of opinions.","o":["She has no opinions, so she does not speak in public.","She loves speaking in public about her opinions.","Her opinions are often mistaken.","Although she avoids speaking in public, this does not mean she has no views."],"a":3,"ex":"should not be mistaken for = אין לטעות ולחשוב ש-. ההימנעות מדיבור אינה מעידה על היעדר דעות."},{"id":"ers-72","type":"rs","lvl":4,"q":"The ban on fishing, intended to protect the species, inadvertently harmed it.","o":["The ban successfully protected the species as planned.","The ban was designed to harm the species.","The species was harmed, so a ban was introduced.","The fishing ban unintentionally damaged the very species it was meant to save."],"a":3,"ex":"inadvertently = שלא במתכוון. האיסור פגע במין שנועד להגן עליו."},{"id":"ers-73","type":"rs","lvl":4,"q":"It would be an overstatement to say that the reform was a complete failure.","o":["The reform was undoubtedly a complete failure.","Calling the reform a total failure would be an exaggeration.","The reform was a complete success.","Nobody has commented on the reform."],"a":1,"ex":"overstatement = הגזמה. לומר שהרפורמה נכשלה לגמרי זו הגזמה – אך לא נאמר שהצליחה לגמרי."},{"id":"ers-74","type":"rs","lvl":4,"q":"The company's growth, impressive as it is, has come at a considerable environmental cost.","o":["The company grew because it protected the environment.","The company's growth has been modest and environmentally friendly.","The environment has benefited from the company's growth.","Although the company has grown remarkably, its growth has seriously harmed the environment."],"a":3,"ex":"impressive as it is = מרשים ככל שיהיה (ויתור). הצמיחה גבתה מחיר סביבתי ניכר."},{"id":"ers-75","type":"rs","lvl":4,"q":"There is little to suggest that the two events were connected.","o":["Much evidence shows that the events were linked.","The events certainly happened at the same time.","Hardly any evidence indicates a link between the two events.","One event clearly caused the other."],"a":2,"ex":"little to suggest = מעט מאוד מרמז על כך: כמעט אין ראיות לקשר."},{"id":"ers-76","type":"rs","lvl":4,"q":"Such was her influence that few dared to disagree with her openly.","o":["Many people openly disagreed with her despite her influence.","Her influence was so great that hardly anyone disagreed with her publicly.","She had little influence, so people ignored her.","She often disagreed with influential people."],"a":1,"ex":"such was ... that = כה רבה הייתה ... עד ש-. מעטים העזו לחלוק עליה בגלוי."},{"id":"ers-77","type":"rs","lvl":4,"q":"The author makes no attempt to hide her contempt for the novel's narrator.","o":["The author tries to conceal her dislike of the narrator.","The author admires the narrator deeply.","The author openly shows how little she respects the narrator.","The narrator expresses contempt for the author."],"a":2,"ex":"makes no attempt to hide = אינה מנסה להסתיר: הבוז (contempt) גלוי."},{"id":"ers-78","type":"rs","lvl":4,"q":"The findings, if confirmed, could transform our understanding of the disease.","o":["The findings have been confirmed and have transformed medicine.","The findings will not affect our understanding even if confirmed.","Should the results be verified, they may greatly change how we understand the illness.","The disease has transformed the findings."],"a":2,"ex":"if confirmed = אם יאומתו. הממצאים טרם אומתו, אך אם יאומתו – עשויים לשנות את ההבנה."},{"id":"ers-79","type":"rs","lvl":4,"q":"Much as I admire his work, I cannot agree with his conclusions.","o":["Although I greatly respect his work, I disagree with his conclusions.","Because I admire his work, I accept his conclusions.","I neither admire his work nor agree with his conclusions.","I agree with his conclusions but dislike his work."],"a":0,"ex":"much as = אף שמאוד. הערכה לעבודה לצד אי-הסכמה עם המסקנות."},{"id":"ers-80","type":"rs","lvl":4,"q":"The drug's benefits are thought to outweigh its risks.","o":["The drug's risks are considered greater than its benefits.","It is believed that the drug's advantages are greater than its dangers.","The drug has no known risks.","The drug's benefits and risks are equal."],"a":1,"ex":"outweigh = עולה על (במשקל/בחשיבות). התועלת גדולה מהסיכון."},{"id":"ers-81","type":"rs","lvl":5,"q":"That the policy was ill-conceived is now beyond dispute; what remains contested is who should bear responsibility for it.","o":["Everyone now agrees the policy was poorly planned, but there is still disagreement over who is to blame.","People still argue about whether the policy was poorly planned, but they agree on who is responsible.","The policy was well planned, and nobody is responsible for it.","Nobody disputes who designed the policy, which was well received."],"a":0,"ex":"beyond dispute = אין עליו מחלוקת: ברור שהמדיניות תוכננה רע; המחלוקת היא רק על האחריות."},{"id":"ers-82","type":"rs","lvl":5,"q":"Far from being a mere imitator of his predecessors, the composer transformed the conventions he inherited.","o":["The composer merely imitated those who came before him.","The composer rejected all conventions and created none of his own.","Rather than simply copying earlier composers, he fundamentally changed the traditions he received.","The composer's predecessors transformed his conventions."],"a":2,"ex":"far from = רחוק מלהיות. הוא לא חיקה אלא שינה את המוסכמות שירש."},{"id":"ers-83","type":"rs","lvl":5,"q":"Scarcely a decade passes without some new technology being hailed as the end of the printed book.","o":["Almost every ten years, a new technology is said to be about to make printed books obsolete.","New technologies have rarely been linked to the end of books.","Printed books disappeared about a decade ago.","Every decade, printed books become more popular thanks to technology."],"a":0,"ex":"scarcely ... without = כמעט אין ... בלי: כמעט בכל עשור מכריזים על טכנולוגיה שתחסל את הספר המודפס."},{"id":"ers-84","type":"rs","lvl":5,"q":"The historian's reconstruction, however ingenious, rests on assumptions that cannot be verified.","o":["The historian's account is clever and fully verified.","The historian's account is unoriginal but based on solid facts.","The historian verified every assumption.","Although the historian's account is clever, it depends on premises that cannot be checked."],"a":3,"ex":"however ingenious = מבריק ככל שיהיה. השחזור נשען על הנחות שאי אפשר לאמת."},{"id":"ers-85","type":"rs","lvl":5,"q":"It is not so much that the committee rejected the proposal as that it never seriously considered it.","o":["The committee carefully considered the proposal and then rejected it.","The problem was less a rejection of the proposal than a failure to give it real consideration.","The committee accepted the proposal without much thought.","The committee seriously considered the proposal but did not reject it."],"a":1,"ex":"not so much A as B = לא כל כך A אלא בעיקר B: הבעיה העיקרית היא שההצעה לא נשקלה ברצינות."},{"id":"ers-86","type":"rs","lvl":5,"q":"Her later work, while lacking the raw energy of her early paintings, displays a technical mastery they conspicuously lack.","o":["Her early paintings show more energy and more skill than her later ones.","Her later paintings are both more energetic and more skillful.","Her early paintings were technically perfect but dull.","Her later paintings have less vitality than her early ones but show far greater skill."],"a":3,"ex":"היצירות המאוחרות חסרות את האנרגיה של המוקדמות, אך מציגות שליטה טכנית שחסרה באלה (they = הציורים המוקדמים)."},{"id":"ers-87","type":"rs","lvl":5,"q":"Insofar as the data are reliable, they cast doubt on the prevailing theory.","o":["The data are unreliable, so the prevailing theory is correct.","The data strongly support the prevailing theory.","The prevailing theory casts doubt on the data.","To the extent that the data can be trusted, they challenge the dominant theory."],"a":3,"ex":"insofar as = במידה ש-. ככל שהנתונים אמינים, הם מטילים ספק בתאוריה הרווחת."},{"id":"ers-88","type":"rs","lvl":5,"q":"The reforms were less a response to public demand than an attempt to preempt it.","o":["The reforms were introduced because the public demanded them.","The public opposed the reforms after they were introduced.","The reforms aimed mainly to head off public demands before they arose, rather than to answer them.","The reforms were delayed until there was public demand."],"a":2,"ex":"preempt = להקדים תרופה למכה, לסכל מראש. הרפורמות נועדו למנוע את הדרישה לפני שתתעורר."},{"id":"ers-89","type":"rs","lvl":5,"q":"Nothing in the treaty precludes either party from pursuing independent agreements.","o":["The treaty forbids both sides from making separate agreements.","The treaty requires each side to make independent agreements.","The treaty allows each side to make separate agreements.","Only one party may pursue independent agreements."],"a":2,"ex":"preclude = למנוע. שום דבר באמנה אינו מונע – כלומר מותר לכל צד (אך לא חובה)."},{"id":"ers-90","type":"rs","lvl":5,"q":"The novel's reputation has suffered less from hostile critics than from admirers who praised it for the wrong reasons.","o":["The novel's image was damaged more by misguided fans than by its harsh critics.","Hostile critics did the most damage to the novel's reputation.","The novel's admirers protected it from hostile critics.","Both critics and admirers praised the novel for the right reasons."],"a":0,"ex":"suffered less from A than from B: הנזק העיקרי נגרם דווקא מהמעריצים שהבינו את הרומן לא נכון."},{"id":"ers-91","type":"rs","lvl":5,"q":"To attribute the decline solely to economic factors is to overlook the cultural changes that accompanied it.","o":["The decline was caused only by economic factors.","Explaining the decline only by economics ignores the cultural shifts that occurred alongside it.","Cultural changes had no connection to the decline.","The decline caused economic and cultural factors to be overlooked."],"a":1,"ex":"לייחס את הירידה לכלכלה בלבד פירושו להתעלם (overlook) מהשינויים התרבותיים שליוו אותה."},{"id":"ers-92","type":"rs","lvl":5,"q":"Whatever its shortcomings, the report cannot be accused of timidity.","o":["The report has no shortcomings, but it is timid.","The report's main shortcoming is its timidity.","Despite its flaws, the report certainly cannot be called cautious or fearful.","The report was accused of being too bold and flawless."],"a":2,"ex":"timidity = הססנות, פחדנות. יהיו חסרונותיו אשר יהיו, הדוח אינו פחדן."},{"id":"ers-93","type":"rs","lvl":5,"q":"The scientist was as reluctant to claim credit for her successes as she was quick to acknowledge her errors.","o":["She hesitated to take credit for her achievements but readily admitted her mistakes.","She eagerly took credit for her successes and hid her mistakes.","She was slow to admit her errors and quick to claim credit.","She neither admitted her mistakes nor took credit for her successes."],"a":0,"ex":"היא נרתעה מלקחת קרדיט, ובאותה מידה מיהרה להודות בטעויות."},{"id":"ers-94","type":"rs","lvl":5,"q":"Only by ignoring a considerable body of evidence can one maintain that the climate has remained stable.","o":["A large body of evidence shows that the climate has remained stable.","Little evidence exists about the climate.","Ignoring the evidence has made the climate stable.","Claiming that the climate has not changed requires disregarding a great deal of evidence."],"a":3,"ex":"only by ignoring ... can one maintain = רק בהתעלמות מראיות רבות אפשר לטעון שהאקלים יציב."},{"id":"ers-95","type":"rs","lvl":5,"q":"Had the warnings been heeded, the disaster might well have been averted.","o":["The disaster happened even though the warnings were followed.","The disaster might have been prevented if people had paid attention to the warnings.","No warnings were given before the disaster.","The warnings caused the disaster."],"a":1,"ex":"heed = לשים לב, לציית; avert = למנוע. אילו הקשיבו לאזהרות, ייתכן שהאסון היה נמנע."},{"id":"ers-96","type":"rs","lvl":5,"q":"The play's apparent simplicity belies the complexity of its themes.","o":["The play is simple, and so are its themes.","The play's complex themes make it seem complicated.","Though the play seems simple, its themes are actually complex.","The play's simplicity proves that its themes are simple."],"a":2,"ex":"belie = להסוות, ליצור רושם מטעה. הפשטות לכאורה מסתירה נושאים מורכבים."},{"id":"ers-97","type":"rs","lvl":5,"q":"Few would dispute that the treaty, for all its flaws, prevented a far worse outcome.","o":["Most people agree that, despite its defects, the treaty stopped something much worse from happening.","Many argue that the treaty's flaws led to a worse outcome.","The treaty was flawless and prevented all problems.","Few people believe that the treaty made any difference."],"a":0,"ex":"few would dispute = מעטים יחלקו על כך; for all its flaws = למרות פגמיו."},{"id":"ers-98","type":"rs","lvl":5,"q":"The manager's insistence on consulting everyone before every decision, admirable in principle, proved paralyzing in practice.","o":["Consulting everyone worked well both in principle and in practice.","The manager made decisions without consulting anyone.","The idea of consulting everyone was wrong in principle but useful in practice.","The manager's habit of consulting everyone was good in theory but in reality prevented things from getting done."],"a":3,"ex":"ראוי להערכה עקרונית, אך משתק בפועל."},{"id":"ers-99","type":"rs","lvl":5,"q":"Inasmuch as the evidence is incomplete, any conclusions must remain provisional.","o":["Although the evidence is incomplete, the conclusions are final.","The evidence is complete, so the conclusions are certain.","The conclusions made the evidence incomplete.","Since the evidence is not complete, all conclusions should be considered temporary."],"a":3,"ex":"inasmuch as = מאחר ש-; provisional = זמני. בהיעדר ראיות מלאות, המסקנות זמניות."},{"id":"ers-100","type":"rs","lvl":5,"q":"The philosopher's critics have tended to attack positions she never actually held.","o":["Her critics have often argued against views that were not really hers.","Her critics accurately described and refuted her positions.","The philosopher attacked positions held by her critics.","The philosopher never held any positions."],"a":0,"ex":"המבקרים תקפו עמדות שלא היו שלה בפועל."}],"passages":[{"id":"ep-1","lvl":1,"title":"The Rooftop Garden","text":"Five years ago, the roof of the old post office building in the center of town was an empty, grey space. Nobody went up there except workers who came once a year to check the pipes. Today, the same roof is covered with vegetables, flowers and fruit trees, and it is one of the busiest places in the neighborhood.\n\nThe idea came from a group of neighbors who lived in small apartments without gardens. They wanted a place where they could grow their own food and spend time outside. At first, the city did not like the plan. Officials were worried that the roof was not strong enough to hold heavy soil and water. The neighbors paid an engineer to examine the building, and he found that the roof was safe if the soil was kept in light wooden boxes rather than spread across the whole surface.\n\nThe first season was difficult. Strong winds broke several young plants, and a hot summer dried out much of the soil. The gardeners learned from their mistakes. They built low walls to protect the plants from the wind, and they set up a simple system that collects rainwater in large tanks during the winter so that it can be used in the summer.\n\nNow more than sixty families take part in the project. Each family has its own box, but everyone shares the work of watering and cleaning. Local schools also send children to the roof once a week. For many of these children, it is the first time they have seen how a tomato grows or where a carrot comes from.\n\nThe garden has also changed the way neighbors relate to one another. People who once passed each other on the street without saying a word now meet on the roof, exchange seeds and share recipes. Some say that the most important thing the garden produces is not food, but friendship.","items":[{"id":"ep-1-1","lvl":1,"q":"According to the first paragraph, before the garden was created, the roof was —","o":["rarely visited","used as a parking area","already full of plants","a popular meeting place"],"a":0,"ex":"בפסקה הראשונה נאמר שאיש לא עלה לגג מלבד עובדים שהגיעו פעם בשנה – כלומר כמעט לא ביקרו בו."},{"id":"ep-1-2","lvl":1,"q":"Why did city officials object to the plan at first?","o":["They thought the neighbors had no time for gardening.","They wanted to sell the building.","They feared the roof could not support the weight.","They believed vegetables would not grow in the city."],"a":2,"ex":"הפקידים חששו שהגג אינו חזק מספיק לשאת אדמה ומים כבדים."},{"id":"ep-1-3","lvl":2,"q":"How did the gardeners deal with the problem of dry summers?","o":["By storing rainwater collected in the winter","By building low walls around the plants","By planting only fruit trees","By moving the boxes indoors"],"a":0,"ex":"הם הקימו מערכת שאוספת מי גשמים בחורף לשימוש בקיץ. הקירות הנמוכים נועדו להגן מפני הרוח, לא מפני היובש."},{"id":"ep-1-4","lvl":1,"q":"The word \"examine\" in the second paragraph is closest in meaning to —","o":["build","paint","sell","inspect"],"a":3,"ex":"examine = לבדוק, לבחון – בדומה ל-inspect. המהנדס בדק את המבנה."},{"id":"ep-1-5","lvl":2,"q":"The main point of the last paragraph is that the garden —","o":["produces more food than expected","is used mostly by schools","has brought neighbors closer together","has caused arguments between neighbors"],"a":2,"ex":"הפסקה האחרונה מתארת שכנים שהתחילו לדבר ולשתף – הגינה יצרה חברות."}]},{"id":"ep-2","lvl":1,"title":"Lights at the Edge of the Sea","text":"For thousands of years, sailors have faced the same danger: rocks and shallow water hidden near the coast. Long before modern maps and electronic instruments, people found a simple way to warn ships at night. They lit fires on hills and high towers so that sailors could see the light from far away and know that land was near.\n\nThe most famous early lighthouse was built in Alexandria, Egypt, more than two thousand years ago. It was so tall and impressive that it was counted among the Seven Wonders of the Ancient World. Sadly, it was damaged by earthquakes over many centuries, and nothing of it stands today.\n\nFor a long time, lighthouses used wood, coal or oil to produce light. The problem was that much of the light was lost, because it spread in every direction instead of traveling toward the sea. In the 1820s, a French scientist named Augustin Fresnel designed a special lens made of many pieces of glass. His lens collected the light and sent it out in a strong, narrow beam that could be seen many kilometers away. Soon, lighthouses around the world began using his invention.\n\nLife for lighthouse keepers was often lonely. Many keepers lived with their families in small houses next to the tower, sometimes on islands far from any town. Every night, they climbed the stairs to light the lamp, clean the glass and make sure that the light never went out, even during terrible storms.\n\nDuring the twentieth century, most lighthouses became automatic, and keepers were no longer needed. Today, ships use satellites to find their way, so lighthouses are less important than they once were. Still, many people love them. Some old lighthouses have become museums or hotels, and visitors come to climb the stairs and enjoy the view of the sea.","items":[{"id":"ep-2-1","lvl":1,"q":"What was the purpose of the first lighthouses?","o":["To help farmers see at night","To celebrate important holidays","To signal the start of a war","To warn sailors that they were close to land"],"a":3,"ex":"בפסקה הראשונה: אנשים הדליקו אש כדי שהמלחים ידעו שהיבשה קרובה ויזהרו מסלעים."},{"id":"ep-2-2","lvl":1,"q":"What happened to the lighthouse of Alexandria?","o":["It was moved to a museum.","It still guides ships today.","It was destroyed over time by earthquakes.","It was never finished."],"a":2,"ex":"בפסקה השנייה נאמר שרעידות אדמה פגעו בו לאורך מאות שנים ושדבר ממנו לא נותר."},{"id":"ep-2-3","lvl":2,"q":"What problem did Fresnel's lens solve?","o":["Lighthouses used too much coal.","Much of the light was wasted because it spread in all directions.","The towers were too short.","Keepers could not climb the stairs."],"a":1,"ex":"העדשה ריכזה את האור לאלומה צרה במקום שיתפזר לכל הכיוונים וילך לאיבוד."},{"id":"ep-2-4","lvl":1,"q":"According to the fourth paragraph, lighthouse keepers had to —","o":["build new towers each year","sail ships during storms","teach children in the town","keep the light working every night"],"a":3,"ex":"שומרי המגדלורים עלו כל לילה להדליק את המנורה ולוודא שהאור לא כבה."},{"id":"ep-2-5","lvl":2,"q":"Which of the following is true according to the last paragraph?","o":["Some old lighthouses are now used in new ways.","All lighthouses have been destroyed.","Ships today depend mainly on lighthouses.","Lighthouse keepers are still needed everywhere."],"a":0,"ex":"חלק מהמגדלורים הפכו למוזיאונים או לבתי מלון – שימוש חדש."}]},{"id":"ep-3","lvl":2,"title":"Sleep and Memory","text":"Most people think of sleep as a time when the brain simply rests. However, research over the past few decades suggests that the sleeping brain is surprisingly busy, and that some of its work is closely connected to memory.\n\nIn a typical experiment, volunteers learn a list of words or a new skill, such as a series of finger movements on a keyboard. Some of them are then allowed to sleep, while others stay awake for the same number of hours. When both groups are tested again, those who slept usually remember more and perform the skill more accurately. Researchers believe that during sleep, the brain replays and strengthens information gathered during the day, a process often called consolidation.\n\nNot all stages of sleep seem to play the same role. Deep sleep, which occurs mostly in the first part of the night, appears to be especially important for remembering facts and events. Dream sleep, which becomes more frequent toward morning, may help with learning skills and with connecting new information to what we already know. For this reason, scientists warn that cutting the night short does not only make us tired; it may also take away the stage of sleep that is most useful for certain kinds of learning.\n\nThese findings have practical implications, especially for students. Many students stay up late before an exam, trying to study as much as possible. The research suggests that this strategy may backfire. A student who studies for several hours and then sleeps well may remember more than one who studies all night without rest.\n\nOf course, sleep is not magic. It cannot help us remember information we never learned properly in the first place. Moreover, scientists still do not fully understand how the brain decides which memories to keep and which to discard. What is clear, however, is that a good night's sleep is not wasted time but an important part of the learning process.","items":[{"id":"ep-3-1","lvl":2,"q":"The main purpose of the passage is to —","o":["explain how sleep is related to memory","describe different types of dreams","argue that students should study less","compare the sleep habits of different people"],"a":0,"ex":"הקטע כולו עוסק בקשר בין שינה לזיכרון, מהניסויים ועד ההשלכות המעשיות."},{"id":"ep-3-2","lvl":2,"q":"In the experiment described in the second paragraph, the volunteers who slept —","o":["forgot most of what they had learned","performed the same as those who stayed awake","generally remembered more than those who stayed awake","learned a different skill"],"a":2,"ex":"נאמר שמי שישנו זכרו יותר וביצעו את המיומנות בדיוק רב יותר."},{"id":"ep-3-3","lvl":3,"q":"According to the third paragraph, cutting the night short may be harmful because —","o":["deep sleep happens mostly in the morning","it may reduce dream sleep, which helps certain kinds of learning","it causes people to dream too much","it prevents the brain from resting at all"],"a":1,"ex":"שנת החלום שכיחה לקראת הבוקר, ולכן קיצור הלילה עלול לגזול דווקא אותה. שינה עמוקה מתרחשת בעיקר בתחילת הלילה."},{"id":"ep-3-4","lvl":2,"q":"The word \"backfire\" in the fourth paragraph means —","o":["succeed beyond expectations","produce the opposite of the desired result","be repeated many times","cause physical injury"],"a":1,"ex":"backfire = להשיג תוצאה הפוכה: לימוד כל הלילה עלול לפגוע בזיכרון במקום לשפר אותו."},{"id":"ep-3-5","lvl":3,"q":"Which of the following can be inferred from the last paragraph?","o":["Scientists know exactly how memories are chosen.","Sleep allows us to remember things we never learned.","Sleeping too much is a waste of time.","Sleep cannot replace effective studying."],"a":3,"ex":"נאמר שהשינה אינה יכולה לעזור לזכור מידע שלא נלמד כראוי – כלומר היא אינה תחליף ללמידה."}]},{"id":"ep-4","lvl":2,"title":"Libraries in a Digital Age","text":"When the internet became widely available in the 1990s, many people predicted that public libraries would soon disappear. Why would anyone walk to a library, they asked, when information could be found at home in seconds? Several decades later, however, libraries are still with us, although they have changed in important ways.\n\nOne reason libraries have survived is that not everyone has equal access to technology. In many communities, there are people who cannot afford a computer or a fast internet connection. For them, the library offers free computers, printers and help from staff who know how to use them. Job seekers, for example, often come to the library to write their résumés and apply for work online.\n\nLibraries have also become important social spaces. Many now hold language classes, reading groups for children, lectures and even workshops where visitors can learn to repair electronic devices or use 3D printers. In a time when many people spend hours alone in front of screens, the library is one of the few public places where anyone can enter without paying and stay as long as they like.\n\nThe role of librarians has changed as well. In the past, their main job was to organize books and help readers find them. Today, they also teach people how to search for information effectively and how to judge whether a website is reliable. Since the internet is full of inaccurate and misleading content, this skill is more valuable than ever.\n\nNot all the news is good. Some libraries have lost funding, and in certain cities branches have been closed or have reduced their opening hours. Supporters argue that this is a serious mistake. A library, they say, is not merely a building full of books but a service that strengthens the whole community.","items":[{"id":"ep-4-1","lvl":1,"q":"According to the first paragraph, many people in the 1990s believed that —","o":["libraries would become unnecessary","the internet would fail","libraries would grow larger","people would read more books"],"a":0,"ex":"רבים חזו שהספריות ייעלמו כי המידע יהיה זמין בבית."},{"id":"ep-4-2","lvl":2,"q":"The second paragraph mainly discusses —","o":["the history of computers","how libraries help people with limited access to technology","why job seekers dislike libraries","the cost of building new libraries"],"a":1,"ex":"הפסקה מסבירה שהספרייה מספקת מחשבים ועזרה למי שאין לו גישה לטכנולוגיה."},{"id":"ep-4-3","lvl":2,"q":"The activities mentioned in the third paragraph are given as examples of —","o":["ways in which libraries serve as meeting places for the community","services that libraries plan to stop","reasons why libraries are expensive","activities that require payment"],"a":0,"ex":"הפסקה פותחת בכך שהספריות הפכו למרחבים חברתיים, והפעילויות הן דוגמאות לכך."},{"id":"ep-4-4","lvl":3,"q":"According to the fourth paragraph, why is the modern librarian's skill especially valuable?","o":["Because there are fewer books than before","Because much of the information online is unreliable","Because websites are hard to access","Because readers no longer need help finding books"],"a":1,"ex":"נאמר שהאינטרנט מלא בתוכן לא מדויק ומטעה, ולכן היכולת להעריך אמינות חשובה מתמיד."},{"id":"ep-4-5","lvl":2,"q":"The author's attitude toward libraries can best be described as —","o":["hostile","supportive","indifferent","mocking"],"a":1,"ex":"הכותב מדגיש את תרומת הספריות ומציג את קיצוץ המימון כבעיה – עמדה תומכת."}]},{"id":"ep-5","lvl":3,"title":"Coral Reefs Under Pressure","text":"Coral reefs cover only a tiny fraction of the ocean floor, yet they are home to a remarkable share of marine life. Scientists estimate that roughly a quarter of all ocean species depend on reefs at some point in their lives. Reefs also protect coastlines from waves and storms and support fishing and tourism industries on which millions of people rely.\n\nAlthough corals may look like plants or rocks, they are in fact animals. Each coral is a colony of tiny creatures called polyps, which build hard skeletons of calcium carbonate. Over thousands of years, these skeletons accumulate to form the massive structures we call reefs. The polyps live in close partnership with microscopic algae that dwell inside their tissues. The algae produce food through photosynthesis and share it with the coral, and in return they receive shelter and nutrients. The algae are also responsible for many of the reef's brilliant colors.\n\nThis partnership, however, is delicate. When the water becomes too warm, even by a degree or two for several weeks, the corals expel the algae. Without them, the corals turn white, a phenomenon known as bleaching. A bleached coral is not necessarily dead; if temperatures return to normal quickly, the algae can return and the coral may recover. If the heat lasts too long, however, the coral starves.\n\nIn recent decades, bleaching events have become more frequent and more severe, largely because of rising ocean temperatures. Pollution, overfishing and damage from boats add further stress, making it harder for reefs to recover between events.\n\nResearchers are exploring a range of responses. Some are growing corals in underwater nurseries and transplanting them onto damaged reefs. Others are studying corals that seem naturally more tolerant of heat, hoping to understand what makes them resilient. Most scientists stress, however, that such efforts can only buy time; without reducing the causes of ocean warming, the long-term future of reefs remains uncertain.","items":[{"id":"ep-5-1","lvl":2,"q":"According to the first paragraph, coral reefs are important because they —","o":["support many species and protect coastlines","cover most of the ocean floor","are the main source of the ocean's oxygen","prevent ocean temperatures from rising"],"a":0,"ex":"השוניות מהוות בית לחלק ניכר מהמינים הימיים ומגנות על החופים. נאמר שהן מכסות רק חלק זעיר מקרקעית הים."},{"id":"ep-5-2","lvl":3,"q":"In the second paragraph, the relationship between corals and algae is described as —","o":["harmful to the corals","harmful to the algae","mutually beneficial","temporary and unimportant"],"a":2,"ex":"האצות מספקות מזון לאלמוג ומקבלות ממנו מחסה וחומרי הזנה – שני הצדדים מרוויחים."},{"id":"ep-5-3","lvl":3,"q":"According to the third paragraph, a bleached coral —","o":["is always dead","can survive if conditions improve quickly","has gained more algae","turns white because of pollution alone"],"a":1,"ex":"נאמר שאלמוג מולבן אינו בהכרח מת, ואם הטמפרטורה חוזרת לקדמותה במהירות הוא עשוי להתאושש."},{"id":"ep-5-4","lvl":3,"q":"The word \"resilient\" in the last paragraph is closest in meaning to —","o":["able to recover from difficulty","easily damaged","brightly colored","rare"],"a":0,"ex":"resilient = עמיד, בעל יכולת התאוששות. החוקרים בודקים אלמוגים העמידים לחום."},{"id":"ep-5-5","lvl":4,"q":"What is the main point of the last paragraph?","o":["Coral nurseries have solved the problem of bleaching.","Restoration projects help, but they are not a long-term solution on their own.","Scientists have given up on saving coral reefs.","Heat-tolerant corals will soon replace all other corals."],"a":1,"ex":"המדענים מדגישים שהמאמצים רק 'קונים זמן', ובלי לטפל בהתחממות העתיד אינו ודאי."}]},{"id":"ep-6","lvl":3,"title":"The Puzzling Mind of the Octopus","text":"Intelligence in the animal kingdom is usually associated with mammals and birds: chimpanzees that use tools, dolphins that communicate, crows that solve puzzles. The octopus, a soft-bodied relative of snails and clams, seems an unlikely member of this group. Yet a growing body of research suggests that octopuses are capable of surprisingly sophisticated behavior.\n\nIn laboratories, octopuses have learned to open jars to reach food inside, to find their way through mazes and to recognize individual human caretakers. Some have been observed escaping from their tanks at night, moving to a neighboring tank to eat, and returning before morning. In the wild, certain species collect coconut shells and carry them around, assembling them into a shelter when danger appears, a behavior that many researchers consider a form of tool use.\n\nWhat makes these abilities especially intriguing is that the octopus's nervous system is organized very differently from ours. Roughly two-thirds of its neurons are located not in its brain but in its eight arms. Each arm can apparently taste, touch and respond to its surroundings with a degree of independence, as if it had a small mind of its own. This raises fascinating questions about how the animal coordinates its actions and what its experience of the world might be like.\n\nThe octopus's intelligence is all the more puzzling given its short life. Most species live only one or two years, and the mother usually dies soon after her eggs hatch, so the young receive no teaching from their parents. In many other intelligent animals, a long life and complex social relationships are thought to encourage the development of a powerful mind. The octopus seems to have followed a different path entirely.\n\nFor scientists, the octopus offers a rare opportunity: a chance to study intelligence that evolved separately from our own. Understanding it may reveal which features of intelligence are universal and which are merely accidents of our own history.","items":[{"id":"ep-6-1","lvl":3,"q":"Why does the author mention chimpanzees, dolphins and crows in the first paragraph?","o":["To show that octopuses are related to them","To argue that mammals are smarter than birds","To describe the octopus's natural enemies","To give examples of animals usually considered intelligent"],"a":3,"ex":"הם מובאים כדוגמאות לבעלי חיים שבדרך כלל מזוהים עם אינטליגנציה, כרקע לתמנון ה'לא צפוי'."},{"id":"ep-6-2","lvl":3,"q":"The coconut shell behavior described in the second paragraph is significant because it —","o":["is seen as an example of tool use","shows that octopuses live in groups","proves that octopuses eat coconuts","happens only in laboratories"],"a":0,"ex":"חוקרים רבים רואים באיסוף הקליפות ובהרכבתן למחסה שימוש בכלים. ההתנהגות נצפתה בטבע, לא במעבדה."},{"id":"ep-6-3","lvl":3,"q":"According to the third paragraph, what is unusual about the octopus's nervous system?","o":["It has no brain at all.","Most of its neurons are located in its arms.","Its arms cannot sense their surroundings.","It has fewer neurons than a snail."],"a":1,"ex":"כשני שלישים מתאי העצב נמצאים בזרועות ולא במוח."},{"id":"ep-6-4","lvl":4,"q":"Why does the author find the octopus's intelligence \"all the more puzzling\" (fourth paragraph)?","o":["Because octopuses live in large social groups","Because octopuses are taught by their mothers for years","Because octopuses live longer than most mammals","Because octopuses have short lives and do not learn from their parents"],"a":3,"ex":"אצל בעלי חיים אחרים חיים ארוכים וקשרים חברתיים מעודדים אינטליגנציה; לתמנון אין אף אחד מהם."},{"id":"ep-6-5","lvl":4,"q":"According to the last paragraph, studying the octopus may help scientists —","o":["prove that humans are the only intelligent animals","teach octopuses to communicate with humans","understand which aspects of intelligence are common to different minds","explain why octopuses have short lives"],"a":2,"ex":"נאמר שהמחקר עשוי לגלות אילו מאפייני אינטליגנציה הם אוניברסליים ואילו מקריים."}]},{"id":"ep-7","lvl":4,"title":"Cities That Make Their Own Weather","text":"On a summer afternoon, the center of a large city can be several degrees warmer than the surrounding countryside. At night the difference is often even greater. This phenomenon, known as the urban heat island effect, has been documented for nearly two centuries, but it has attracted renewed attention as cities grow and global temperatures rise.\n\nThe causes are well understood. Asphalt roads, dark roofs and concrete buildings absorb large amounts of solar energy during the day and release it slowly after sunset, preventing the city from cooling down. In rural areas, by contrast, much of the sun's energy is used to evaporate water from soil and plants, a process that cools the surrounding air. Cities also generate heat directly, from vehicles, factories and the air conditioners that residents run to escape the heat, a cycle in which the solution to the problem contributes to the problem itself. Finally, tall buildings packed closely together can block wind that would otherwise carry warm air away.\n\nThe consequences extend well beyond discomfort. Higher temperatures increase demand for electricity, raising costs and, where power comes from fossil fuels, emissions. They can worsen air pollution, since certain harmful chemical reactions occur more quickly in heat. Most seriously, extreme heat poses a danger to health, particularly for elderly people, young children and those without access to cooling. Studies have repeatedly found that the burden is not evenly distributed: poorer neighborhoods, which often have fewer trees and more paved surfaces, tend to be hotter than wealthier ones.\n\nCities are experimenting with a variety of countermeasures. Some are painting roofs white or other light colors to reflect sunlight. Others are planting trees, which provide shade and release moisture, or creating green roofs covered with vegetation. Certain cities have begun replacing traditional pavement with materials that stay cooler. None of these measures is sufficient by itself, but together they can lower temperatures noticeably. Planners increasingly argue that such steps should not be treated as decoration, but as essential infrastructure.","items":[{"id":"ep-7-1","lvl":3,"q":"According to the first paragraph, the urban heat island effect —","o":["was discovered only recently","occurs mainly during the winter","is stronger in the countryside than in cities","has been known for a long time but is receiving new attention"],"a":3,"ex":"התופעה מתועדת כמעט מאתיים שנה, אך זוכה לתשומת לב מחודשת בשל צמיחת הערים וההתחממות."},{"id":"ep-7-2","lvl":4,"q":"The author mentions air conditioners in the second paragraph in order to illustrate —","o":["why rural areas are cooler than cities","how an attempt to deal with heat can add to it","a technology that has solved the problem","how wind carries warm air away"],"a":1,"ex":"המזגנים, שנועדו להקל על החום, מפיקים חום בעצמם – 'הפתרון תורם לבעיה'."},{"id":"ep-7-3","lvl":4,"q":"According to the second paragraph, rural areas tend to be cooler partly because —","o":["they have taller buildings","they absorb more solar energy","energy from the sun is used to evaporate water","they produce more heat from vehicles"],"a":2,"ex":"באזורים כפריים חלק גדול מאנרגיית השמש מנוצל לאידוי מים מהאדמה ומהצמחים, תהליך שמקרר את האוויר."},{"id":"ep-7-4","lvl":4,"q":"Which of the following can be inferred from the third paragraph?","o":["The effects of urban heat are not felt equally by all residents.","Wealthy neighborhoods suffer most from the heat.","Heat has no effect on air pollution.","Electricity use decreases during hot weather."],"a":0,"ex":"נאמר שהנטל אינו מתחלק שווה בשווה ושכונות עניות חמות יותר – כלומר ההשפעה אינה שוויונית."},{"id":"ep-7-5","lvl":5,"q":"In the last sentence, the planners' view suggests that cooling measures should be regarded as —","o":["attractive but unnecessary additions","temporary experiments","too expensive to be practical","basic and necessary parts of the city"],"a":3,"ex":"essential infrastructure = תשתית חיונית, בניגוד ל-decoration (קישוט)."}]},{"id":"ep-8","lvl":4,"title":"The Power of Expectation","text":"In medical research, new treatments are usually tested against a placebo: a pill or procedure that looks like the real thing but contains no active ingredient. Patients do not know which one they are receiving. The logic is simple: if the real treatment works better than the fake one, its benefit cannot be explained merely by the patients' belief that they are being treated.\n\nYet the placebo is far from a neutral baseline. In trial after trial, a substantial proportion of patients who receive inactive pills report genuine improvement, particularly in conditions such as pain, nausea and fatigue, where subjective experience plays a large role. This improvement is not simply imagined. Brain-imaging studies suggest that expecting relief can trigger the release of the body's own pain-relieving chemicals, producing measurable physical changes.\n\nCuriously, the details of a placebo seem to matter. Several studies have reported that two pills tend to work better than one, that injections tend to work better than pills, and that more expensive-looking treatments outperform cheaper ones. The context of care also appears influential: patients who are treated by warm, attentive practitioners often report greater improvement than those treated in a hurried, impersonal manner.\n\nPerhaps the most surprising findings come from so-called open-label studies, in which patients are told explicitly that they are receiving a placebo. One might expect such honesty to eliminate the effect entirely. In some trials, however, patients still reported significant relief, although researchers continue to debate why this happens and how large the effect really is.\n\nThese results raise difficult questions. If belief and context can relieve suffering, should doctors make deliberate use of them? Deceiving patients would violate the trust at the heart of medicine, yet open-label placebos suggest that deception may not always be necessary. At the very least, the research is a reminder that healing is not purely a matter of chemistry, and that the way treatment is delivered may matter almost as much as the treatment itself.","items":[{"id":"ep-8-1","lvl":3,"q":"According to the first paragraph, why are new treatments compared with placebos?","o":["To make the treatments cheaper","To show that their benefit is not due only to patients' beliefs","To prevent patients from improving","To test whether patients can recognize real pills"],"a":1,"ex":"אם הטיפול האמיתי עדיף על הדמה, התועלת שלו אינה נובעת רק מאמונת המטופלים."},{"id":"ep-8-2","lvl":4,"q":"The phrase \"far from a neutral baseline\" (second paragraph) suggests that placebos —","o":["have no effect at all","are dangerous to patients","are used only for pain","can themselves have real effects"],"a":3,"ex":"far from neutral = רחוק מלהיות ניטרלי: הפלצבו עצמו גורם לשיפור ממשי, כפי שמתואר בהמשך הפסקה."},{"id":"ep-8-3","lvl":4,"q":"The third paragraph mainly shows that the effect of a placebo —","o":["is the same in every situation","is strongest when the doctor is in a hurry","disappears when two pills are given","depends partly on how it is presented and delivered"],"a":3,"ex":"מספר הכדורים, צורת המתן, המחיר הנראה ויחס המטפל – כולם משפיעים על עוצמת האפקט."},{"id":"ep-8-4","lvl":4,"q":"What did the open-label studies described in the fourth paragraph find?","o":["Patients stopped improving once they were told the truth.","Researchers agreed on the exact size of the effect.","Some patients improved even though they knew they were taking a placebo.","Patients refused to take placebos."],"a":2,"ex":"גם כשנאמר למטופלים במפורש שזה פלצבו, חלקם דיווחו על הקלה. החוקרים עדיין חלוקים לגבי גודל האפקט."},{"id":"ep-8-5","lvl":5,"q":"Which of the following best describes the author's position in the last paragraph?","o":["Doctors should regularly deceive patients with placebos.","The placebo effect is merely imaginary and should be ignored.","Open-label placebos have completely replaced real medicine.","The research raises ethical questions but shows that the manner of treatment matters."],"a":3,"ex":"הכותב מציג את הדילמה האתית ומסכם שאופן מתן הטיפול חשוב כמעט כמו הטיפול עצמו."}]},{"id":"ep-9","lvl":5,"title":"The Uses of \"What If\"","text":"Historians have long been divided over the value of counterfactual reasoning, the practice of asking what might have happened had some event turned out differently. To its critics, the exercise is at best a parlor game and at worst a distraction from the discipline's proper task: establishing, as rigorously as the evidence allows, what actually occurred. Since the past cannot be rerun, they argue, any claim about an alternative outcome is unverifiable and therefore closer to fiction than to scholarship.\n\nDefenders of counterfactual thinking respond that historians engage in it constantly, whether they acknowledge it or not. To assert that a particular decision caused a war is implicitly to claim that, without that decision, the war would not have occurred, or would have unfolded differently. Every causal judgment, in other words, contains a hidden counterfactual. The choice, on this view, is not whether to reason counterfactually but whether to do so openly and carefully, or covertly and carelessly.\n\nCareful practitioners have proposed criteria to distinguish disciplined speculation from mere fantasy. A plausible counterfactual, they suggest, should alter as little as possible, a single decision rather than the entire structure of a society, and should involve alternatives that contemporaries themselves actually considered. Speculating about what a general might have done had he followed advice he is known to have received is a very different matter from imagining that an ancient empire possessed modern technology.\n\nCounterfactuals may also serve a less obvious function: they counter the illusion of inevitability. Once we know how events ended, it is tempting to regard that outcome as having been bound to happen, and to forget how uncertain the situation appeared to those living through it. By reminding us that other paths were genuinely open, counterfactual reasoning restores a sense of contingency and, with it, an appreciation of the weight of human choices.\n\nNone of this resolves the underlying problem of proof. But it suggests that the question is less whether historians should speculate than how responsibly they do so.","items":[{"id":"ep-9-1","lvl":4,"q":"According to the first paragraph, critics object to counterfactual history mainly because —","o":["it focuses too much on wars","its claims cannot be tested against what actually happened","it is too difficult for most readers","it relies only on written documents"],"a":1,"ex":"המבקרים טוענים שאי אפשר 'להריץ מחדש' את העבר, ולכן טענות על תוצאה חלופית אינן ניתנות לאימות."},{"id":"ep-9-2","lvl":5,"q":"The defenders' argument in the second paragraph is that —","o":["counterfactuals should be avoided whenever possible","historians rarely make causal claims","any statement about causes already implies a counterfactual","wars cannot be explained by single decisions"],"a":2,"ex":"לפי המצדדים, כל קביעה סיבתית מכילה טענה נסתרת על מה שהיה קורה אחרת."},{"id":"ep-9-3","lvl":5,"q":"The example of the ancient empire with modern technology (third paragraph) is presented as —","o":["an example of speculation that fails the proposed criteria","a model of careful counterfactual reasoning","an event that historians have proven","a case in which contemporaries considered the alternative"],"a":0,"ex":"הדוגמה משנה הרבה מדי ואינה חלופה שבני התקופה שקלו – היא מנוגדת לקריטריונים ומייצגת פנטזיה."},{"id":"ep-9-4","lvl":5,"q":"The \"illusion of inevitability\" mentioned in the fourth paragraph refers to the tendency to —","o":["believe that the future cannot be predicted","exaggerate the role of chance in history","see known outcomes as if they could not have been otherwise","assume that historians never make mistakes"],"a":2,"ex":"כשיודעים איך הדברים הסתיימו, נוטים לחשוב שזה היה בלתי נמנע ולשכוח את אי-הוודאות של אז."},{"id":"ep-9-5","lvl":5,"q":"Which of the following best summarizes the author's conclusion?","o":["Counterfactual reasoning has solved the problem of historical proof.","Counterfactual reasoning is unavoidable, so the real issue is how carefully it is used.","Historians should abandon counterfactual reasoning entirely.","Counterfactual reasoning is more reliable than evidence-based history."],"a":1,"ex":"המשפט האחרון: השאלה אינה אם להעלות השערות אלא באיזו אחריות. הכותב מציין במפורש שבעיית ההוכחה לא נפתרה."}]},{"id":"ep-10","lvl":5,"title":"When a Language Falls Silent","text":"Of the roughly seven thousand languages spoken in the world today, linguists estimate that a substantial proportion, by some accounts as many as half, may cease to be spoken by the end of this century. Language loss is not new; languages have always emerged, changed and vanished. What distinguishes the present moment is the pace of the decline and the degree to which it is concentrated among the languages of small, often marginalized communities.\n\nThe process rarely involves a sudden break. More often, it unfolds over two or three generations. Parents who speak a minority language may come to see it as an obstacle to their children's economic prospects, and so raise them in the dominant language of schools, markets and media. The children may understand their grandparents' tongue without speaking it; their own children may understand neither. By the time the community recognizes what is being lost, the remaining fluent speakers may be few and elderly.\n\nWhy should this matter beyond the communities concerned? Advocates offer several answers. Each language, they argue, encodes a distinctive way of organizing experience, of classifying plants, describing family relations or marking time, and its disappearance diminishes the record of human thought. Many languages carry oral traditions, histories and ecological knowledge that have never been written down. For speakers themselves, moreover, the loss is rarely an abstraction: it is bound up with identity, dignity and a sense of continuity with the past.\n\nRevival is difficult but not impossible. The modern revival of Hebrew as a spoken language is often cited as an exceptional case, but more modest successes exist elsewhere. In New Zealand, so-called language nests immerse young Maori children in the language from an early age, and in Wales, Welsh-medium schooling has helped stabilize the number of speakers. Such efforts tend to succeed when they combine institutional support with the commitment of families who choose to use the language at home.\n\nSkeptics caution that no policy can compel people to speak a language they no longer find useful. Yet the experience of revival movements suggests that usefulness is not fixed; it can be created.","items":[{"id":"ep-10-1","lvl":4,"q":"According to the first paragraph, what is new about current language loss?","o":["The fact that languages disappear at all","That it affects only major world languages","That linguists cannot measure it","Its speed and its concentration among small communities"],"a":3,"ex":"נאמר שאובדן שפות אינו חדש; מה שמייחד את התקופה הוא הקצב והריכוז בקרב קהילות קטנות."},{"id":"ep-10-2","lvl":4,"q":"The second paragraph describes language loss as a process that —","o":["happens suddenly as a result of war","is driven mainly by government bans","usually happens gradually across several generations","is quickly noticed by the community"],"a":2,"ex":"התהליך 'rarely involves a sudden break' ומתפרש על פני שניים-שלושה דורות."},{"id":"ep-10-3","lvl":5,"q":"Which of the following is NOT mentioned in the third paragraph as a reason why language loss matters?","o":["It reduces the number of languages taught in universities","It diminishes the record of human thought","It may cause unwritten knowledge to disappear","It affects speakers' sense of identity"],"a":0,"ex":"שלוש הסיבות האחרות מופיעות בפסקה; הוראת שפות באוניברסיטאות אינה מוזכרת כלל."},{"id":"ep-10-4","lvl":5,"q":"According to the fourth paragraph, revival efforts tend to succeed when —","o":["official support is joined by families' use of the language at home","they focus only on adult learners","they rely entirely on government funding","the language is no longer spoken by anyone"],"a":0,"ex":"נאמר שהמאמצים מצליחים כשמשלבים תמיכה מוסדית עם מחויבות של משפחות לדבר בשפה בבית."},{"id":"ep-10-5","lvl":5,"q":"In the last sentence, the author suggests that —","o":["the skeptics are entirely correct","people should be forced to speak minority languages","a language's usefulness can be increased by deliberate effort","useful languages never disappear"],"a":2,"ex":"'usefulness is not fixed; it can be created' – אפשר ליצור תועלת לשפה במאמץ מכוון, בניגוד לטענת הספקנים."}]}]},"vocab":{"he":[{"w":"אבחנה","m":"זיהוי מצב או מחלה","ex":"לאחר סדרת בדיקות הגיע הרופא לאבחנה ברורה.","lvl":2},{" /* ============ math helpers ============ */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const R=(n,d=1)=>{const g=gcd(n,d);return {n:n/g*(d<0?-1:1),d:Math.abs(d)/g}};
const mul=(a,b)=>R(a.n*b.n,a.d*b.d);
const eq=(a,b)=>a.n*b.d===b.n*a.d;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* render */
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const M=(...parts)=>`<span class="math">${parts.join(" ").replace(/([\u0590-\u05FF][\u0590-\u05FF״׳\-]*)/g,"<bdi>$1</bdi>")}</span>`;
function show(r,mixed=true){ // rational -> html
  if(r.d===1)return M(r.n);
  if(mixed&&r.n>r.d){const w=Math.floor(r.n/r.d),k=r.n%r.d;return M(w,F(k,r.d))}
  return M(F(r.n,r.d));
}
const fmt=x=>String(Math.round(x*1e6)/1e6);
function chartSVG(cats,vals,step){
  const W=300,H=200,L=34,B=34,T=10,mx=Math.max(...vals,step)+step,top=Math.ceil(mx/step)*step,cw=(W-L-10)/cats.length;
  const y=v=>T+(H-T-B)*(1-v/top);let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="דיאגרמת עמודות" direction="ltr">`;
  for(let v=0;v<=top;v+=step){s+=`<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="#BFE3D2" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5B6B7A">${v}</text>`}
  cats.forEach((c,i)=>{const x=L+i*cw+cw*.18,w=cw*.64;s+=`<rect x="${x}" y="${y(vals[i])}" width="${w}" height="${y(0)-y(vals[i])}" rx="4" fill="#FF8A3D"/><text x="${x+w/2}" y="${H-12}" font-size="13" text-anchor="middle" fill="#1F2D3D">${c}</text>`});
  return s+`<line x1="${L}" x2="${L}" y1="${T}" y2="${y(0)}" stroke="#1F2D3D" stroke-width="1.5"/><line x1="${L}" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" stroke="#1F2D3D" stroke-width="1.5"/></svg>`;

  const L=o.labels||{},t=(x,y,s,c)=>s!=null?`<text x="${x}" y="${y}" font-size="14" font-weight="700" text-anchor="middle" fill="${c||"#159A8C"}">${s}</text>`:"",st=`stroke="${VC.ink}" stroke-width="2.2"`,da=`stroke="${VC.ink}" stroke-width="1.6" stroke-dasharray="5 4"`;

  else if(k==="cone"){g=`<ellipse cx="130" cy="165" rx="80" ry="22" fill="${VC.fill}" ${st}/><line x1="50" y1="165" x2="130" y2="30" ${st}/><line x1="210" y1="165" x2="130" y2="30" ${st}/><line x1="130" y1="30" x2="130" y2="165" stroke="${VC.c[2]}" stroke-width="2" stroke-dasharray="5 4"/><line x1="130" y1="165" x2="210" y2="165" stroke="${VC.c[1]}" stroke-width="2"/>`+t(170,158,L.r,VC.c[1])+t(142,100,L.h)+t(80,95,L.s,VC.c[0])}

  return SV(260,210,g,"גוף");

function buildChapter(d){
  if(d==="q"){const it=[];const ts=shuffle(QT);let k=0;while(it.length<20&&k<200){const x=quantItem(ts[k%ts.length]);if(x)it.push(x);k++}return it}
  const pool=BANK.filter(x=>x.dom===d);const pass=x=>x.passage;
  const take=(type,n)=>shuffle(pool.filter(x=>x.type===type)).sort((a,b)=>(!!rs(a.id))-(!!rs(b.id))).slice(0,n);
  if(d==="v"){const p=pick([...new Set(pool.filter(pass).map(x=>x.passage))]);return [...take("an",6),...take("sc",6),...take("lg",6),...(p?p.items.map(x=>pool.find(y=>y.id===x.id)):[])].filter(Boolean)}
  const p=pick([...new Set(pool.filter(pass).map(x=>x.passage))]);return [...take("esc",9),...take("ers",8),...(p?p.items.map(x=>pool.find(y=>y.id===x.id)):[])].filter(Boolean);
