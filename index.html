of the claim largely been rejected?","Speakers of any language can learn new concepts","No language uses fixed directions","Children cannot learn directions early","Linguists have never studied these communities"],["The word 'revived' in paragraph 3 is closest in meaning to…","brought back","settled","invented","ignored"],["What can be inferred about learning a foreign language, according to the writer?","It may train learners to notice the world differently","It is mainly a matter of memorising word lists","It permanently changes a person's personality","It is impossible after childhood"]],"North of Your Left Hand"],["Today it seems obvious that everyone in a country should share the same time. Yet until the second half of the nineteenth century, most towns kept their own local time, based on the position of the sun. When the sun stood highest in the sky, it was noon. Because the sun appears to move from east to west, a town only a short distance to the west would reach noon a few minutes later than its neighbour. For centuries, this caused few problems. Travel was slow, and a difference of several minutes hardly mattered to someone arriving by horse.\n\nThe railway changed everything. Trains could cover in hours distances that had once taken days, and timetables had to be precise. With dozens of local times in use, a single journey might involve several clocks showing different hours. Passengers missed connections, and, more seriously, the confusion increased the risk of collisions on shared tracks.\n\nRailway companies were the first to act. They adopted a standard time along their lines, usually based on the clock of a major city. At first, many communities resisted. Some residents felt that abandoning 'sun time' meant surrendering a local tradition to distant business interests. In certain towns, public clocks were fitted with two minute hands, one showing local time and the other railway time.\n\nEventually, however, practical needs prevailed. Governments formally adopted standard time, and international agreements later divided the world into time zones. What had begun as a solution to a technical problem became a basic structure of modern life.\n\nThe story is a reminder that many arrangements we take for granted were once controversial. Even something as seemingly natural as the time on our watches is, in fact, the result of human decisions, negotiation and compromise.","כיום נראה מובן מאליו שכל האנשים במדינה צריכים לחלוק את אותה שעה. אולם עד המחצית השנייה של המאה התשע־עשרה, רוב העיירות ניהלו שעה מקומית משלהן, על פי מיקום השמש. כשהשמש עמדה בנקודה הגבוהה ביותר בשמיים, הייתה זו שעת הצהריים. מאחר שהשמש נראית נעה ממזרח למערב, עיירה שנמצאת מרחק קצר מערבה הגיעה לצהריים כמה דקות אחרי שכנתה. במשך מאות שנים זה כמעט לא גרם לבעיות. הנסיעות היו איטיות, והפרש של כמה דקות כמעט לא שינה דבר למי שהגיע על סוס.\n\nהרכבת שינתה הכול. רכבות יכלו לעבור בתוך שעות מרחקים שבעבר נדרשו ימים כדי לעבור אותם, ולוחות הזמנים היו צריכים להיות מדויקים. כשעשרות שעות מקומיות היו בשימוש, נסיעה אחת עשויה הייתה לכלול כמה שעונים שמראים שעות שונות. נוסעים החמיצו רכבות המשך, ובאופן חמור יותר, הבלבול הגביר את הסכנה להתנגשויות על מסילות משותפות.\n\nחברות הרכבת היו הראשונות לפעול. הן אימצו שעה תקנית לאורך הקווים שלהן, בדרך כלל על פי השעון של עיר מרכזית. בתחילה, קהילות רבות התנגדו. חלק מהתושבים הרגישו שוויתור על \"שעון השמש\" פירושו כניעה של מסורת מקומית לאינטרסים עסקיים מרוחקים. בעיירות מסוימות הותקנו בשעונים הציבוריים שני מחוגי דקות, אחד שהראה את השעה המקומית והשני את שעת הרכבת.\n\nאולם בסופו של דבר, הצרכים המעשיים גברו. ממשלות אימצו באופן רשמי שעה תקנית, והסכמים בינלאומיים חילקו מאוחר יותר את העולם לאזורי זמן. מה שהתחיל כפתרון לבעיה טכנית הפך למבנה בסיסי של החיים המודרניים.\n\nהסיפור הזה מזכיר שהסדרים רבים שאנו רואים כמובנים מאליהם היו בעבר שנויים במחלוקת. אפילו דבר שנראה טבעי כמו השעה בשעון שלנו הוא, למעשה, תוצאה של החלטות אנושיות, משא ומתן ופשרה.",[["Before standard time, how did towns determine noon?","By the moment the sun was highest in the sky","By the arrival of the first train","By a clock in the nearest major city","By international agreement"],["Why did local time differences cause few problems before the railway?","Travel was too slow for a few minutes to matter","All towns were located at the same longitude","People did not use clocks at all","Governments punished anyone who was late"],["Why were some public clocks fitted with two minute hands?","To show both local time and railway time","To make them easier to read from far away","To replace a broken hand quickly","To show the time in two different countries"],["The word 'prevailed' in paragraph 4 is closest in meaning to…","won out","disappeared","were postponed","were questioned"],["What is the main purpose of the final paragraph?","To draw a general lesson from the historical example","To describe how time zones are calculated","To criticise the railway companies","To introduce a new historical event"]],"When Time Became Standard"],["Have you ever noticed that coffee shops often offer three cup sizes, and that the medium one seems like the obvious choice? This is rarely an accident. Economists who study consumer behaviour have shown that our decisions are strongly influenced by the options placed beside the one we eventually choose.\n\nConsider a well-known kind of experiment. Participants are offered a subscription to a magazine in one of two forms: online only, for a low price, or print plus online, for a much higher price. Most people choose the cheaper option. Then researchers add a third choice: print only, at exactly the same high price as print plus online. Hardly anyone selects this new option, since it is clearly worse value. Yet its presence changes everything. Suddenly, a large majority of participants choose the expensive combined package.\n\nThe third option is known as a 'decoy'. It exists not to be bought but to make another product look attractive by comparison. Because people find it difficult to judge value in absolute terms, they rely on relative comparisons. When one option is obviously superior to a similar alternative, it appears to be a bargain, even if we would not have chosen it otherwise.\n\nDecoys are used widely, from restaurant menus, where a very expensive dish makes other dishes seem reasonable, to electronics stores and holiday packages. Some critics consider the practice manipulative, arguing that it exploits weaknesses in human reasoning. Businesses reply that they are simply presenting choices and that customers remain free to decide.\n\nEither way, awareness is the consumer's best defence. Before choosing, it is worth asking a simple question: would I still want this option if the others were not there? The answer may save more money than any discount.","שמתם לב פעם שבתי קפה מציעים לעתים קרובות שלושה גדלים של כוסות, ושהבינונית נראית כמו הבחירה המתבקשת? זה כמעט אף פעם לא מקרי. כלכלנים שחוקרים התנהגות צרכנים הראו שההחלטות שלנו מושפעות מאוד מהאפשרויות שמוצגות לצד האפשרות שבה אנו בוחרים בסופו של דבר.\n\nחשבו על סוג מוכר של ניסוי. למשתתפים מוצע מינוי למגזין באחת משתי צורות: דיגיטלי בלבד, במחיר נמוך, או מודפס ודיגיטלי, במחיר גבוה בהרבה. רוב האנשים בוחרים באפשרות הזולה. אז מוסיפים החוקרים אפשרות שלישית: מודפס בלבד, באותו מחיר גבוה בדיוק כמו המודפס והדיגיטלי. כמעט אף אחד לא בוחר באפשרות החדשה, מכיוון שברור שהתמורה בה גרועה יותר. ובכל זאת, עצם נוכחותה משנה הכול. לפתע, רוב גדול של המשתתפים בוחר בחבילה המשולבת היקרה.\n\nהאפשרות השלישית מכונה \"פיתיון\". היא קיימת לא כדי שיקנו אותה, אלא כדי לגרום למוצר אחר להיראות אטרקטיבי בהשוואה אליה. מאחר שקשה לאנשים להעריך ערך במונחים מוחלטים, הם מסתמכים על השוואות יחסיות. כאשר אפשרות אחת עדיפה בבירור על חלופה דומה, היא נראית כמו מציאה, גם אם לא היינו בוחרים בה אחרת.\n\nנעשה שימוש נרחב בפיתיונות, החל מתפריטי מסעדות, שבהם מנה יקרה מאוד גורמת למנות אחרות להיראות סבירות, ועד לחנויות אלקטרוניקה ולחבילות נופש. יש מבקרים שרואים בשיטה מניפולציה, וטוענים שהיא מנצלת חולשות בחשיבה האנושית. העסקים משיבים שהם פשוט מציגים אפשרויות בחירה ושהלקוחות נשארים חופשיים להחליט.\n\nכך או כך, מודעות היא ההגנה הטובה ביותר של הצרכן. לפני שבוחרים, כדאי לשאול שאלה פשוטה: האם עדיין הייתי רוצה באפשרות הזו אילו האחרות לא היו שם? התשובה עשויה לחסוך יותר כסף מכל הנחה.",[["What is the passage mainly about?","How an unattractive option can influence our choices","Why coffee shops charge too much for coffee","How magazines attract new subscribers online","Why discounts are the best way to save money"],["What happened when the 'print only' option was added?","Most participants chose the expensive combined package","Most participants chose the 'print only' option","Most participants refused to subscribe at all","Most participants still chose the online option"],["In the sentence 'It exists not to be bought…', what does 'It' refer to?","The decoy option","The cheapest option","The magazine","The experiment"],["According to the passage, why does a very expensive dish appear on some menus?","To make other dishes seem reasonably priced","Because many customers order it","To attract famous chefs to the restaurant","Because its ingredients are rare"],["What is the writer's purpose in the last paragraph?","To give readers practical advice","To defend businesses that use decoys","To describe another experiment","To criticise economists"]],"The Decoy on the Menu"],["When a famous painting is cleaned and restored, the result is often celebrated as a rediscovery. Colours that had been hidden for centuries under layers of dirt and yellowed varnish suddenly glow again, and viewers feel they are seeing the work as the artist intended. Yet restoration is one of the most controversial activities in the art world, and every major project tends to divide experts.\n\nThe central difficulty is that no one can be entirely sure what the artist intended. Paintings change over time in ways that are not always reversible. Pigments fade or darken, and earlier restorers may have added paint of their own. When a conservator removes a layer, there is a risk of removing something the artist placed there deliberately, such as a thin glaze designed to soften a bright colour. Once removed, such details cannot be recovered.\n\nFor this reason, many modern conservators follow a principle of minimal intervention. They aim to stabilise a work and protect it from further damage rather than to make it look new. Any additions they make are designed to be reversible, so that future experts, with better tools and knowledge, can undo them.\n\nOthers argue that this cautious approach goes too far. A painting covered in grime, they say, cannot communicate with its audience. If careful research shows what the original surface looked like, conservators have a duty to reveal it.\n\nPerhaps the debate cannot be fully resolved, because it reflects a deeper uncertainty about what a work of art really is. Is it the object as it left the artist's studio, or the object as it exists now, including the marks that time has left on it? Each answer leads to a different idea of what it means to care for the past.","כאשר ציור מפורסם מנוקה ומשוחזר, התוצאה זוכה לעתים קרובות להתלהבות כגילוי מחדש. צבעים שהיו מוסתרים במשך מאות שנים מתחת לשכבות של לכלוך ולכה מצהיבה זוהרים לפתע שוב, והצופים מרגישים שהם רואים את היצירה כפי שהאמן התכוון. אולם שחזור הוא אחת הפעילויות השנויות ביותר במחלוקת בעולם האמנות, וכל פרויקט גדול נוטה לפלג את המומחים.\n\nהקושי המרכזי הוא שאיש אינו יכול להיות בטוח לחלוטין למה האמן התכוון. ציורים משתנים עם הזמן בדרכים שלא תמיד ניתן להפוך. פיגמנטים דוהים או מכהים, ומשחזרים קודמים אולי הוסיפו צבע משלהם. כאשר משמר מסיר שכבה, קיים סיכון להסיר משהו שהאמן הניח שם במכוון, כמו שכבת זיגוג דקה שנועדה לרכך צבע בוהק. לאחר שהוסרו, פרטים כאלה אינם ניתנים לשחזור.\n\nמסיבה זו, משמרים מודרניים רבים פועלים לפי עיקרון של התערבות מינימלית. הם שואפים לייצב את היצירה ולהגן עליה מפני נזק נוסף, ולא לגרום לה להיראות חדשה. כל תוספת שהם מבצעים מתוכננת להיות הפיכה, כך שמומחים בעתיד, עם כלים וידע טובים יותר, יוכלו לבטל אותה.\n\nאחרים טוענים שהגישה הזהירה הזו מרחיקה לכת. ציור המכוסה בלכלוך, הם אומרים, אינו יכול לתקשר עם הקהל שלו. אם מחקר קפדני מראה כיצד נראה פני השטח המקורי, מוטלת על המשמרים החובה לחשוף אותו.\n\nייתכן שלא ניתן להכריע בוויכוח לחלוטין, משום שהוא משקף אי־ודאות עמוקה יותר לגבי מהי בעצם יצירת אמנות. האם זהו החפץ כפי שיצא מהסטודיו של האמן, או החפץ כפי שהוא קיים היום, כולל הסימנים שהזמן הותיר בו? כל תשובה מובילה לתפיסה שונה של מה פירוש לשמור על העבר.",[["According to the passage, why is restoration risky?","Details added deliberately by the artist may be lost forever","Modern cleaning materials always damage paintings","Museums refuse to display restored paintings","Viewers dislike bright colours"],["The word 'deliberately' in paragraph 2 is closest in meaning to…","on purpose","by accident","in a hurry","in secret"],["Why do conservators who follow minimal intervention make reversible additions?","So that future experts can undo them","So that the painting looks completely new","Because reversible materials are cheaper","Because the artist requested it"],["How is paragraph 4 related to paragraph 3?","It presents a view that opposes the approach described in paragraph 3","It gives an example that supports paragraph 3","It summarises the whole passage","It explains the history of varnish"],["According to the final paragraph, why might the debate never be settled?","People disagree about what a work of art essentially is","There are not enough trained conservators","The original paintings no longer exist","Scientists cannot analyse old pigments"]],"Restoring or Rewriting?"],["For most of human history, a clear night revealed thousands of stars. Today, a large proportion of the world's population lives under skies so bright that the Milky Way is no longer visible. Artificial light, which has transformed human life in countless positive ways, has also produced a form of pollution that is easy to overlook precisely because it seems so harmless.\n\nScientists, however, are increasingly concerned about its effects. Many animals depend on darkness. Sea turtle hatchlings, for instance, find their way to the ocean by moving towards the brightest horizon, which naturally lies over the water. Near brightly lit coastal roads, they may crawl inland instead, where few survive. Migrating birds can become disoriented by illuminated buildings, and insects that are drawn to street lamps often die of exhaustion, with consequences for the plants and animals that depend on them.\n\nHumans are affected too. Our bodies follow a daily rhythm regulated partly by light and darkness. Exposure to bright light late in the evening can disturb sleep, and some researchers suspect that long-term disruption may contribute to a range of health problems, though the evidence is still being gathered.\n\nUnlike many environmental problems, light pollution could be reduced relatively quickly and cheaply. Shielding lamps so that they shine downwards rather than into the sky, using warmer colours, and dimming or switching off lights when they are not needed would all make a significant difference. Several towns that have adopted such measures report lower energy bills as well as darker skies.\n\nThe challenge is largely one of awareness. Few people think of a lit street as a source of pollution. Yet once we recognise what has been lost, the return of a starry sky may become not merely a scientific goal but a cultural one.","במשך רוב ההיסטוריה האנושית, לילה בהיר חשף אלפי כוכבים. כיום, חלק גדול מאוכלוסיית העולם חי תחת שמיים מוארים כל כך שכבר אי אפשר לראות את שביל החלב. האור המלאכותי, ששינה את חיי האדם בדרכים חיוביות רבות מספור, יצר גם סוג של זיהום שקל להתעלם ממנו בדיוק משום שהוא נראה כה בלתי מזיק.\n\nעם זאת, מדענים מודאגים יותר ויותר מהשפעותיו. בעלי חיים רבים תלויים בחושך. גוזלי צבי ים, למשל, מוצאים את דרכם אל האוקיינוס בכך שהם נעים לעבר האופק הבהיר ביותר, שבאופן טבעי נמצא מעל המים. ליד כבישי חוף מוארים, הם עלולים לזחול במקום זאת אל היבשה, שם מעטים שורדים. ציפורים נודדות עלולות לאבד את דרכן בגלל בניינים מוארים, וחרקים שנמשכים לפנסי רחוב מתים לעתים קרובות מתשישות, עם השלכות על הצמחים ובעלי החיים שתלויים בהם.\n\nגם בני אדם מושפעים. גופנו פועל לפי מקצב יומי שמווסת בחלקו על ידי אור וחושך. חשיפה לאור חזק בשעות הערב המאוחרות עלולה לשבש את השינה, ויש חוקרים שחושדים ששיבוש ממושך עשוי לתרום למגוון בעיות בריאות, אם כי הראיות עדיין נאספות.\n\nבשונה מבעיות סביבתיות רבות, ניתן לצמצם את זיהום האור במהירות ובזול יחסית. מיגון פנסים כך שיאירו כלפי מטה ולא אל השמיים, שימוש בגוונים חמים יותר, ועמעום או כיבוי של אורות כשאין בהם צורך, כל אלה יחוללו הבדל משמעותי. כמה עיירות שאימצו צעדים כאלה מדווחות על חשבונות חשמל נמוכים יותר וגם על שמיים חשוכים יותר.\n\nהאתגר הוא בעיקר עניין של מודעות. מעטים חושבים על רחוב מואר כעל מקור לזיהום. אך ברגע שנכיר במה שאבד, החזרתם של שמיים זרועי כוכבים עשויה להפוך לא רק ליעד מדעי אלא גם ליעד תרבותי.",[["Why do sea turtle hatchlings near brightly lit roads often die?","They crawl inland, confusing the lights with the ocean horizon","The lights make the water too warm for them","Birds attracted by the lights eat them","They are hit by cars driving to the beach"],["In the sentence '…with consequences for the plants and animals that depend on them', what does 'them' refer to?","The insects","The street lamps","The migrating birds","The illuminated buildings"],["How does the writer present the effects of artificial light on human health?","As a possibility that is still being investigated","As a proven cause of serious disease","As completely harmless","As more important than its effects on animals"],["According to the passage, what makes light pollution different from many environmental problems?","It could be reduced quickly and cheaply","It affects only wealthy countries","It cannot be measured by scientists","It has no effect on energy use"],["Which statement best expresses the main idea of the passage?","Light pollution is a serious but solvable problem that needs more awareness","Artificial light has done more harm than good to humanity","Only astronomers are affected by bright night skies","Towns should switch off all street lights at night"]],"The Vanishing Dark"],["Since the first artificial satellite was launched in the 1950s, humans have sent thousands of objects into orbit around the Earth. Satellites now support weather forecasting, navigation, communication and scientific research. But space around our planet is becoming crowded, and much of what is up there is no longer useful.\n\nExperts use the term 'space debris' to describe dead satellites, discarded rocket parts and countless fragments created when objects break apart or collide. Even a tiny fragment can be dangerous. Because objects in orbit travel at extraordinary speeds, many times faster than a bullet, a piece of metal the size of a coin can strike with the force of an explosion. Spacecraft carrying astronauts must sometimes change course to avoid such pieces.\n\nThe greatest fear is a chain reaction. If two large objects collide, they may produce thousands of new fragments, each of which could hit other satellites, creating still more debris. In the worst case, certain orbits could become so dangerous that they would be unusable for generations, threatening services on which modern societies depend.\n\nSeveral solutions are being explored. Engineers have tested nets, magnets and even harpoons designed to capture old satellites and drag them down into the atmosphere, where they burn up. New satellites are increasingly designed to leave orbit at the end of their working lives. Yet technology alone cannot solve the problem. Space is shared by many countries and companies, and no single authority has the power to enforce rules.\n\nIn this sense, the challenge resembles other problems involving shared resources, such as overfishing. Each user benefits from using the resource, while the costs of damage are spread among everyone. Unless nations find ways to cooperate, the space above our heads may become as polluted as the oceans below.","מאז שוגר הלוויין המלאכותי הראשון בשנות החמישים, שלחו בני האדם אלפי עצמים למסלול סביב כדור הארץ. לוויינים תומכים כיום בחיזוי מזג האוויר, בניווט, בתקשורת ובמחקר מדעי. אבל החלל סביב כוכב הלכת שלנו נעשה צפוף, וחלק גדול ממה שנמצא שם כבר אינו שימושי.\n\nמומחים משתמשים במונח \"פסולת חלל\" כדי לתאר לוויינים מתים, חלקי טילים שהושלכו ואינספור שברים שנוצרים כאשר עצמים מתפרקים או מתנגשים. אפילו שבר זעיר עלול להיות מסוכן. מאחר שעצמים במסלול נעים במהירויות עצומות, מהר פי כמה מקליע, פיסת מתכת בגודל של מטבע יכולה לפגוע בעוצמה של פיצוץ. חלליות הנושאות אסטרונאוטים נאלצות לפעמים לשנות מסלול כדי להימנע משברים כאלה.\n\nהחשש הגדול ביותר הוא מתגובת שרשרת. אם שני עצמים גדולים מתנגשים, הם עלולים ליצור אלפי שברים חדשים, שכל אחד מהם עלול לפגוע בלוויינים אחרים וליצור פסולת נוספת. בתרחיש הגרוע ביותר, מסלולים מסוימים עלולים להפוך למסוכנים כל כך שלא יהיה ניתן להשתמש בהם במשך דורות, דבר שיאיים על שירותים שהחברה המודרנית תלויה בהם.\n\nכמה פתרונות נבחנים. מהנדסים ניסו רשתות, מגנטים ואפילו צלצלים שנועדו ללכוד לוויינים ישנים ולגרור אותם אל האטמוספרה, שם הם נשרפים. לוויינים חדשים מתוכננים יותר ויותר כך שיעזבו את המסלול בתום חייהם המבצעיים. אולם הטכנולוגיה לבדה אינה יכולה לפתור את הבעיה. החלל משותף למדינות ולחברות רבות, ואין רשות אחת שיש לה הסמכות לאכוף כללים.\n\nבמובן זה, האתגר דומה לבעיות אחרות הנוגעות למשאבים משותפים, כמו דיג־יתר. כל משתמש מפיק תועלת מהשימוש במשאב, בעוד שעלויות הנזק מתחלקות בין כולם. אם המדינות לא ימצאו דרכים לשתף פעולה, החלל שמעל ראשינו עלול להפוך למזוהם כמו האוקיינוסים שמתחתינו.",[["The word 'discarded' in paragraph 2 is closest in meaning to…","thrown away","newly built","carefully repaired","brightly coloured"],["Why can a tiny fragment of debris be so dangerous?","It travels at extremely high speed","It contains explosive chemicals","It is impossible to see from Earth","It is made of very heavy metal"],["What does the writer mean by a 'chain reaction'?","Collisions creating debris that causes further collisions","Satellites being linked together by chains","Rockets launching one after another","Countries copying each other's space programmes"],["Why does the writer say that 'technology alone cannot solve the problem'?","No single authority can enforce rules in space","The nets and harpoons have all failed","Engineers have stopped working on solutions","New satellites cannot leave orbit"],["Why does the writer compare space debris to overfishing?","Both involve shared resources whose damage costs are spread among all","Both are caused mainly by fishing companies","Both have already been solved by cooperation","Both affect only the oceans"]],"Crowded Orbits"],["Most students prepare for exams by rereading their notes and highlighting key sentences. These methods feel productive: the material becomes familiar, and familiarity creates a pleasant sense of mastery. Unfortunately, research in cognitive psychology suggests that this feeling is often misleading.\n\nIn a typical experiment, two groups of students study the same text. One group reads it several times. The other reads it once and then tries to recall as much as possible without looking, writing down whatever they remember. Immediately afterwards, the rereading group usually feels more confident. A week later, however, the picture changes: the students who practised recalling the information remember considerably more.\n\nPsychologists call this the 'testing effect', and it belongs to a broader set of findings sometimes described as 'desirable difficulties'. The idea is that learning which feels effortful tends to last longer. Spacing study sessions over several days rather than cramming the night before, mixing different types of problems instead of practising one type repeatedly, and explaining ideas in one's own words all make learning harder in the short term. Yet each of these strategies strengthens long-term memory.\n\nWhy should difficulty help? One explanation is that retrieving information from memory is not simply a way of checking what we know; it actively reorganises and reinforces that knowledge. Each successful act of recall makes the memory easier to find next time.\n\nThe findings have clear implications for teachers and learners. A classroom in which students are frequently asked to retrieve information, through low-pressure quizzes for example, may look less smooth than one in which the teacher simply presents material. But smoothness is not the goal. As one researcher put it, the sensation of learning and the reality of learning are not the same thing, and students who understand the difference are likely to study far more effectively.","רוב התלמידים מתכוננים למבחנים באמצעות קריאה חוזרת של הסיכומים שלהם וסימון משפטי מפתח. השיטות האלה מרגישות פרודוקטיביות: החומר נעשה מוכר, והמוּכרות יוצרת תחושה נעימה של שליטה. לרוע המזל, מחקרים בפסיכולוגיה קוגניטיבית מראים שהתחושה הזו מטעה לעתים קרובות.\n\nבניסוי טיפוסי, שתי קבוצות של תלמידים לומדות את אותו טקסט. קבוצה אחת קוראת אותו כמה פעמים. השנייה קוראת אותו פעם אחת ואז מנסה להיזכר בכמה שיותר בלי להסתכל, ורושמת את כל מה שהיא זוכרת. מיד אחר כך, קבוצת הקריאה החוזרת מרגישה בדרך כלל בטוחה יותר. אולם כעבור שבוע התמונה משתנה: התלמידים שתרגלו שליפה של המידע זוכרים הרבה יותר.\n\nפסיכולוגים מכנים זאת \"אפקט הבחינה\", והוא שייך לקבוצה רחבה יותר של ממצאים המתוארים לעתים כ\"קשיים רצויים\". הרעיון הוא שלמידה שמרגישה מאומצת נוטה להחזיק מעמד זמן רב יותר. פיזור מפגשי הלמידה על פני כמה ימים במקום לדחוס הכול בלילה שלפני, ערבוב של סוגי תרגילים שונים במקום לתרגל סוג אחד שוב ושוב, והסבר רעיונות במילים שלך, כל אלה מקשים על הלמידה בטווח הקצר. ובכל זאת, כל אחת מהאסטרטגיות האלה מחזקת את הזיכרון לטווח הארוך.\n\nמדוע קושי אמור לעזור? הסבר אחד הוא ששליפת מידע מהזיכרון אינה רק דרך לבדוק מה אנו יודעים; היא מארגנת מחדש ומחזקת באופן פעיל את הידע הזה. כל פעולה מוצלחת של היזכרות מקלה על מציאת הזיכרון בפעם הבאה.\n\nלממצאים יש השלכות ברורות על מורים ולומדים. כיתה שבה התלמידים מתבקשים לעתים קרובות לשלוף מידע, למשל באמצעות בחנים קצרים ללא לחץ, עשויה להיראות פחות חלקה מכיתה שבה המורה פשוט מציג את החומר. אבל חלקוּת אינה המטרה. כפי שניסח זאת אחד החוקרים, התחושה של למידה והמציאות של למידה אינן кресенье я иду в школу. Библиотека рядом с моей школой.","Моя мама — врач. Она работает в больнице. Мой дядя — пилот. Он летает на самолётах.","Йони играет в баскетбол в понедельник и в футбол в четверг. Его сестра играет в теннис.","Я езжу в школу на автобусе. Мой папа ездит на работу на поезде. Летом мы летаем на самолёте.","Я просыпаюсь в семь. Я чищу зубы и завтракаю. Потом я иду в школу. Вечером я делаю домашнее задание.","На кухне я беру миску и ложку. Я ем суп. Моя мама пьёт чай из чашки.","Мы гуляем по лесу. Там высокие деревья и красные цветы. Рядом с горой есть река."],"g56":["Привет! Меня зовут Адам. Мне двенадцать лет, и я живу в Хайфе. У меня есть собака по кличке Рокки. Я очень хорошо плаваю.","Меня зовут Шира. Я люблю пиццу и музыку. Мой любимый предмет — английский, но я не люблю математику. У меня есть один брат.","В воскресенье у меня урок английского. Во вторник у меня урок музыки. В пятницу моя семья ужинает вместе.","Я встаю в семь часов. Уроки начинаются в восемь. Я заканчиваю школу в половине второго и встречаюсь с друзьями в пять.","Дана высокая, и у неё длинные каштановые волосы. Её брат Гал невысокий, и у него голубые глаза. Они оба очень смешные.","В прошлые выходные мы ходили на пляж. Я играл в футбол с папой, а моя сестра ела мороженое. Вечером мы навестили бабушку. Это был замечательный день!","У Омера много хобби. По воскресеньям он играет на гитаре, а по средам ходит плавать. Его любимое хобби — рисование, и однажды он хочет стать художником.","Этим летом моя семья поедет в Париж. Мы увидим Эйфелеву башню и съедим много свежего хлеба. После поездки я пойду в седьмой класс."],"adult":["Доброе утро, господин Коэн! Как у вас дела сегодня? Хорошо, спасибо. Хорошего дня!","Меня зовут Дана. Я из Израиля и живу в Тель-Авиве. Я работаю в продажах, и у меня двое детей. Я немного говорю по-английски, но хочу выучить больше.","Официант: Здравствуйте, что вам принести? Рон: Можно кофе и бутерброд с сыром, пожалуйста? Официант: Здесь или с собой? Рон: С собой, пожалуйста. Сколько это стоит? Официант: Двадцать пять шекелей.","Майя в магазине одежды. Ей нравится синяя рубашка, и она просит размер M. Она её примеряет, но она слишком дорогая, поэтому Майя её не покупает.","Извините, где железнодорожный вокзал? Идите прямо и поверните налево у банка. Это недалеко, примерно пять минут.","Дан в аэропорту. У него один чемодан и паспорт. Его рейс в Рим задерживается на час, поэтому он идёт к выходу двенадцать и ждёт.","Здравствуйте, у меня бронь на две ночи. Добро пожаловать! Завтрак с семи до десяти. Пароль от Wi-Fi указан на вашей ключ-карте.","Я плохо себя чувствую. У меня болит голова и болит горло. Принимайте это лекарство три раза в день и пейте много воды.","Ноа идёт в супермаркет. Она покупает молоко, яйца и свежий хлеб. Сыр по скидке, поэтому она берёт две упаковки. Она платит наличными и просит пакет.","Следующий поезд в аэропорт отправляется в 9:30. Поездка занимает сорок минут. Один билет стоит пятнадцать долларов, его можно купить в автомате."],"biz":["Здравствуйте, позвольте представиться. Я Лиор, отвечаю за маркетинг в технологической компании. Вот моя визитка. Давайте оставаться на связи!","Давайте начнём. Сначала пройдёмся по повестке дня. Сегодня у нас три пункта: бюджет, новый сайт и команда. Начнём с бюджета.","Здравствуйте, Сара! Пишу по итогам нашего вчерашнего разговора. Предложение во вложении. Буду рад получить ваш ответ. С уважением, Том.","Во время звонка у Анны был выключен микрофон, и никто её не слышал. Потом она показала свой экран и новый дизайн. После звонка она отправила резюме.","Вы свободны во вторник в десять? Извините, в это время я занят. Вам удобно в среду в два? Да, отлично. Я пришлю приглашение в календарь.","Наша цена включает поддержку на один год. Если вы подпишете договор на этой неделе, мы можем предложить скидку десять процентов. Я уточню у своего руководителя и вернусь к вам.","Сегодня я расскажу о наших результатах. Как видите на этом слайде, продажи в этом году выросли на двадцать процентов. В следующем году мы планируем открыть два новых офиса.","Клиент: Мой заказ не пришёл. Сотрудник: Приношу извинения за неудобства. Можно номер вашего заказа? Я сейчас же этим займусь. Ваша посылка придёт завтра.","Клиент сказал, что наша цена немного выше, чем они ожидали. Мы предложили скидку пять процентов и бесплатное обучение. Они согласились, и в пятницу мы подпишем договор.","Здравствуйте, Даниэль, спасибо, что пришли на собеседование. Нам понравились ваш опыт в продажах и ваши коммуникативные навыки. Следующий шаг — встреча с нашим руководителем в понедельник."]}},"ar":{"items":{"red":"أحمر","blue":"أزرق","green":"أخضر","yellow":"أصفر","black":"أسود","white":"أبيض","cat":"قطة","dog":"كلب","fish":"سمكة","bird":"طائر","duck":"بطة","pig":"خنزير","one":"واحد","two":"اثنان","three":"ثلاثة","four":"أربعة","five":"خمسة","six":"ستة","mom":"أمي","dad":"أبي","baby":"طفل رضيع","sister":"أخت","brother":"أخ","grandpa":"جدّ","apple":"تفاحة","banana":"موزة","orange":"برتقالي","grapes":"عنب","lemon":"ليمون","strawberry":"فراولة","ball":"كرة","teddy bear":"دبدوب","car":"سيارة","balloon":"بالون","kite":"طائرة ورقية","robot":"روبوت","circle":"دائرة","square":"مربع","triangle":"مثلث","star":"نجمة","heart":"قلب","moon":"قمر","sea":"بحر","sand":"رمل","shell":"صدفة","crab":"سلطعون","boat":"قارب","sun":"شمس","purple":"بنفسجي","horse":"حصان","cow":"بقرة","grandma":"جدّة","bread":"خبز","milk":"حليب","egg":"بيضة","pizza":"بيتزا","eye":"عين","ear":"أذن","nose":"أنف","mouth":"فم","hand":"يد","foot":"قدم","shirt":"قميص","dress":"فستان","hat":"قبعة","shoes":"حذاء","socks":"جوارب","coat":"معطف","book":"كتاب","pencil":"قلم رصاص","bag":"حقيبة","ruler":"مسطرة","scissors":"مقص","teacher":"معلم","house":"بيت","bed":"سرير","chair":"كرسي","door":"باب","window":"نافذة","key":"مفتاح","rain":"مطر","cloud":"غيمة","snow":"ثلج","wind":"ريح","rainbow":"قوس قزح","happy":"سعيد","sad":"حزين","angry":"غاضب","tired":"متعب","scared":"خائف","surprised":"متفاجئ","bike":"دراجة","run":"يرك ,"أنهض في الساعة السابعة. تبدأ المدرسة في الثامنة. أنهي المدرسة في الواحدة والنصف وألتقي بأصدقائي في الخامسة.","دانا طويلة وشعرها بني طويل. أخوها غال قصير وعيناه زرقاوان. كلاهما مضحك جدًا.","في نهاية الأسبوع الماضي ذهبنا إلى الشاطئ. لعبت كرة القدم مع أبي وأكلت أختي البوظة. في المساء زرنا جدتي. كان يومًا رائعًا!","عند عومر هوايات كثيرة. يعزف على الغيتار أيام الأحد ويذهب للسباحة أيام الأربعاء. هوايته المفضلة هي الرسم، ويريد أن يصبح فنانًا يومًا ما.","هذا الصيف ستزور عائلتي باريس. سنرى برج إيفل ونأكل الكثير من الخبز الطازج. بعد الرحلة سأبدأ الصف السابع."],"adult":["صباح الخير يا سيد كوهين! كيف حالك اليوم؟ أنا بخير، شكرًا. أتمنى لك يومًا سعيدًا!","اسمي دانا. أنا من إسرائيل وأسكن في تل أبيب. أعمل في المبيعات وعندي ولدان. أتكلم القليل من الإنجليزية، لكنني أريد أن أتعلم أكثر.","النادل: مرحبًا، ماذا أحضر لك؟ رون: ممكن قهوة وشطيرة جبن، من فضلك؟ النادل: هنا أم للأخذ؟ رون: للأخذ، من فضلك. كم السعر؟ النادل: خمسة وعشرون شيكلًا.","مايا في متجر ملابس. يعجبها قميص أزرق وتطلب مقاسًا متوسطًا. تجربه، لكنه غالٍ جدًا، لذلك لا تشتريه.","عفوًا، أين محطة القطار؟ امشِ إلى الأمام مباشرة وانعطف يسارًا عند البنك. إنها ليست بعيدة، حوالي خمس دقائق.","دان في المطار. معه حقيبة سفر واحدة وجواز سفره. رحلته إلى روما متأخرة ساعة واحدة، لذلك يذهب إلى البوابة رقم اثني عشر وينتظر.","مرحبًا، عندي حجز لليلتين. أهلًا وسهلًا! الفطور من السابعة حتى العاشرة. كلمة سر الواي فاي على بطاقة الغرفة.","لا أشعر أنني بخير. رأسي يؤلمني وحلقي يؤلمني. خذ هذا الدواء ثلاث مرات في اليوم واشرب الكثير من الماء.","نوعا تذهب إلى السوبرماركت. تشتري الحليب والبيض والخبز الطازج. الجبن عليه تخفيض، لذلك تشتري قطعتين. تدفع نقدًا وتطلب كيسًا.","القطار القادم إلى المطار يغادر في الساعة 9:30. تستغرق الرحلة أربعين دقيقة. سعر التذكرة الواحدة خمسة عشر دولارًا، ويمكنك شراؤها من الآلة."],"biz":["مرحبًا، اسمحوا لي أن أعرّفكم بنفسي. أنا ليئور، وأنا مسؤول عن التسويق في شركة تكنولوجيا. هذه بطاقة عملي. لنبقَ على تواصل!","لنبدأ. أولًا، لنراجع جدول الأعمال. لدينا اليوم ثلاث نقاط: الميزانية، والموقع الإلكتروني الجديد، والفريق. لنبدأ بالميزانية.","مرح cause I like to know how they work.","I would like to become an engineer and design smart buildings.":"I want to plan and build buildings that use clever technology.","I'd prefer a city because there are more opportunities there.":"I like a city better because it has more chances for jobs and fun.","If that happens, I will try again or choose another path.":"If it goes wrong, I'll try one more time or pick a new way.","My older sister has influenced me because she followed her dreams.":"My big sister changed how I think, because she did what she wanted in life.","Artificial intelligence is being used in almost every industry.":"Smart computer programs are now used in nearly every kind of business.","Many experts warned that AI could replace millions of jobs.":"People who know a lot said smart computers might take millions of jobs.","The program that wrote this essay was trained on millions of texts.":"The computer that wrote this text learned from reading millions of texts.","My teacher said that we shouldn't rely on chatbots for homework.":"My teacher said not to use talking computer programs to do our homework.","AI can analyze data much faster than humans can.":"Smart computers can study lots of information much quicker than people.","Who is responsible when a self-driving car causes an accident?":"If a car with no driver crashes, who is to blame?","Global temperatures have risen sharply over the past century.":"In the last 100 years, the world has become much hotter.","If governments had acted earlier, the damage would have been smaller.":"Countries did not act early; if they had, there would be less harm now.","Scientists reported that sea levels were rising faster than expected.":"Scientists said the sea was going up quicker than they thought.","Burning fossil fuels is the main cause of global warming.":"Burning oil, coal and gas is the biggest reason the Earth gets hotter.","Despite international agreements, emissions continue to increase.":"Countries agreed
