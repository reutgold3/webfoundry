let HV=null,EV=null;function pickV(){if(!("speechSynthesis" in window))return;const all=speechSynthesis.getVoices();const he=all.filter(v=>/^he|^iw/i.test(v.lang));HV=he.find(v=>/google|natural|neural/i.test(v.name))||he[0]||null;const en=all.filter(v=>/^en/i.test(v.lang));EV=en.find(v=>/en[-_]US/i.test(v.lang)&&/google|natural|neural|samantha/i.test(v.name))||en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null}

let warnedVoice=false;
function speak(i,o={}){
  const ss=window.speechSynthesis;
  if(!ss||!window.SpeechSynthesisUtterance){if(!o.quiet)toast('אין הקראה בדפדפן הזה');return}
  pickV();
  const mk=(t,lang,v)=>{const u=new SpeechSynthesisUtterance(t);u.lang=lang;if(v)u.voice=v;u.rate=.9;u.volume=1;return u};
  const en=mk(i.la||i.en,EV?EV.lang:'en-US',EV);          // Latin name, read by an English voice: available on every device
  const queue=[];
  if(HV) queue.push(mk(nameOf(i).replace(/[()–]/g,' '),HV.lang,HV));
  if(!o.noLatin&&(i.la||i.en))queue.push(en);
  if(o.full&&HV&&i.s)queue.push(mk(i.s.replace(/\([^)]*\)/g,' '),HV.lang,HV));
  if(!queue.length){if(!o.quiet)toast('אין קול עברי במכשיר');return}
  try{
    if(ss.speaking||ss.pending) ss.cancel();
    ss.resume();
    queue.forEach(u=>ss.speak(u));                          // called directly inside the tap, so the browser allows it
    let started=false;queue[0].onstart=()=>started=true;
    queue.forEach(u=>u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('ההקראה נחסמה: '+e.error)});
    if(!o.quiet)setTimeout(()=>{if(!started&&!ss.speaking)toast('המכשיר לא הקריא. בדקו שהעוצמה פתוחה ושיש קול הקראה בהגדרות')},2500);
    if(!HV&&(!o.quiet||!warnedVoice)){warnedVoice=true;toast('אין קול עברי במכשיר, מוקרא השם הלטיני')}

}

  document.querySelectorAll('.opt').forEach((b,j)=>{if(q.opts[j]===correct)b.classList.add('ok');else if(j===k)b.classList.add('no')});
  $('#fb').innerHTML=`<p style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'נכון! 👏':'לא נכון.'}${q.kind!=='name'||!ok?' '+esc(nameOf(q.target.userData.info)):''}</p><button class="btn wide" id="nx">${q.i+1<q.qs.length?'לשאלה הבאה':'לתוצאות'}</button>`;

function applyClip(){
  const b=new T.Box3();meshes.filter(m=>m.visible).forEach(m=>b.union(m.geometry.boundingBox));
  const a={x:0,y:1,z:2}[clip.ax],lo=b.min.getComponent(a),hi=b.max.getComponent(a);
  const pos=lo+(hi-lo)*(clip.ax==='y'?1-clip.t:clip.t);
  const n=new T.Vector3();n.setComponent(a,clip.flip?1:-1);
  clip.plane.set(n,-n.getComponent(a)*pos);   // keeps the side where n·p + d >= 0
  renderer.clippingPlanes=[clip.plane];
  meshes.forEach(m=>m.material.side=T.DoubleSide);needs=true;
}

let run=null,CASES=null;
const keyOf=i=>i.la||i.en;
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function maskDesc(i){let s=i.s||'';const strip=w=>(w||'').replace(/\s*\([^)]*\)/g,'').replace(/\s+(\d+|[IVX]+)$/,'').trim();const ws=[nameOf(i),nameOf(i).split(' – ')[0],i.he,i.la,i.en,strip(nameOf(i)),strip(i.la),strip(i.en)].filter(w=>w&&w.length>4).sort((a,b)=>b.length-a.length);for(const w of ws)s=s.replace(new RegExp(reEsc(w),'gi'),'＿＿＿');return s}
const meshesOf=(L,k)=>meshes.filter(m=>m.userData.info.L===L&&keyOf(m.userData.info)===k);
function heOfKey(L,k){const m=meshes.find(x=>x.userData.info.L===L&&keyOf(x.userData.info)===k);if(m)return nameOf(m.userData.info);const v=N&&Object.values(N.names).find(x=>x.L===L&&keyOf(x)===k);return v?nameOf(v):k}
async function useLayer(L){await openStage(L);await loadPack(LAYERS[L].pack);layer=L;region='all';selected=null;group=null;custom=null;hiRefs=[];isolated=false;stopPulse();extraL=null;clearMarker();applyA11y()}

  const z=ms.reduce((a,m)=>a+m.geometry.boundingSphere.center.z,0)/Math.max(1,ms.length);if(z<bodyZ()-.01)backView();else frontView();
  paint();

function distract(i,n=3){
  const he=nameOf(i),k0=keyOf(i),seen=new Set([he]);const out=[];
  const pick=list=>{for(const m of shuffle(list)){const x=m.userData.info,h=nameOf(x),k=keyOf(x);if(seen.has(h)||k===k0)continue;seen.add(h);out.push(k);if(out.length>=n)break}};
  pick(meshes.filter(m=>m.userData.info.L===i.L&&m.userData.info.r===i.r));

async function runExam(){
  await useLayer('b');await loadPack('muscles');await loadPack('organs');
  const qs=[];const L3=['b','b','b','m','m','m','o','o'];
  const used=new Set();const grab=(L,cond)=>{const c=shuffle(meshes.filter(m=>m.userData.info.L===L&&!used.has(nameOf(m.userData.info))&&cond(m)))[0];if(c)used.add(nameOf(c.userData.info));return c};

/* ---------- marker for exact points (pulses, injection sites, landmarks) ---------- */
let marker=null;
function clearMarker(){if(marker){marker.parent&&marker.parent.remove(marker);marker.geometry.dispose();marker=null;needs=true}}
function placeMarker(m,f){
  clearMarker();if(!m||f==null)return;const g=m.geometry,p=g.attributes.position;if(!g.boundingBox)g.computeBoundingBox();const bb=g.boundingBox;
  const h=bb.max.y-bb.min.y,y=bb.min.y+f*h,band=h*.04+.002;let sx=0,sy=0,sz=0,n=0;
  for(let i=0;i<p.count;i++){const yy=p.getY(i);if(Math.abs(yy-y)<band){sx+=p.getX(i);sy+=yy;sz+=p.getZ(i);n++}}
  if(!n)return;
  const rad=Math.min(.014,Math.max(.006,(g.boundingSphere||(g.computeBoundingSphere(),g.boundingSphere)).radius*.12));
  marker=new T.Mesh(new T.SphereGeometry(rad,20,14),new T.MeshBasicMaterial({color:'#FF6A00',depthTest:false,transparent:true,opacity:.95}));
  marker.renderOrder=30;const v=new T.Vector3(sx/n,sy/n,sz/n);m.localToWorld(v);m.parent.worldToLocal(v);marker.position.copy(v);m.parent.add(marker);needs=true;
}

let TP=null;
async function topic(id){const t=TOPICS[id];await useLayer(t.L);mode='run';TP={id,i:0,quiz:false};topicStep()}
function topicStep(){

  spotlight(ms,ms.length===1);
  if(mk){const m=meshes.find(x=>x.userData.info.L===L&&keyOf(x.userData.info)===mk[0]&&x.userData.info.side!=='left');placeMarker(m,mk[1])}else clearMarker();
  if(TP.quiz){const opts=shuffle([title,...shuffle(t.items.filter(x=>x[0]!==title)).slice(0,3).map(x=>x[0])]);TP.opts=opts}
  $('#ui').innerHTML=`<div class="bar"><button class="x" id="back" aria-label="יציאה">✕</button><div class="ttl">${t.e} ${t.he} · ${TP.i+1}/${t.items.length}</div>
    <button class="x" id="tq" aria-label="${TP.quiz?'מצב לימוד':'מצב בוחן'}">${TP.quiz?'📖':'🎯'}</button></div>
   <div class="bar" style="margin-top:8px"><select id="tsel" aria-label="בחירת פריט" style="width:100%;font:inherit;padding:6px;border-radius:10px">${t.items.map((x,j)=>`<option value="${j}" ${j===TP.i?'selected':''}>${TP.quiz?(j+1):esc(x[0])}</option>`).join('')}</select></div>
   <div class="spacer"></div>
   <div class="sheet">${TP.quiz?`<span class="label">🎯 מה מתאים לתיאור?</span><div class="desc">${esc(text)}</div><div class="opts">${TP.opts.map((o,j)=>`<button class="opt" data-o="${j}"><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div>`
     :`<div class="he">${esc(title)}</div><div class="desc">${esc(text)}</div>${mk?'<span class="label">🟠 הנקודה הכתומה מסמנת את המיקום בקירוב.</span>':''}`}
   <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" id="prv" ${TP.i?'':'disabled'}>→ הקודם</button><button class="mini" id="say" aria-label="הקראה">🔊</button><button class="btn" id="nxt">${TP.i+1<t.items.length?'הבא ←':'סיום'}</button></div></div>`;
  $('#back').onclick=home;$('#tsel').onchange=e=>{TP.i=+e.target.value;topicStep()};
  $('#tq').onclick=()=>{TP.quiz=!TP.quiz;TP.i=0;topicStep()};
  $('#prv').onclick=()=>{TP.i--;topicStep()};$('#nxt').onclick=()=>{if(TP.i+1<t.items.length){TP.i++;topicStep()}else home()};
  $('#say').onclick=()=>speak({he:TP.quiz?'':title,la:'',en:'',s:text},{full:true,noLatin:true});
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(TP.ans)return;const o=TP.opts[+b.dataset.o],ok=o===title;bump();
    document.querySelectorAll('[data-o]').forEach(x=>{const v=TP.opts[+x.dataset.o];if(v===title)x.classList.add('ok');else if(x===b)x.classList.add('no')});
    $('#fb').innerHTML=`<p style="font-weight:600;color:${ok?'var(--good)':'var(--bad)'}">${ok?'נכון! 👏':'התשובה: '+esc(title)}</p>`;TP.ans=true;setTimeout(()=>TP.ans=false,0)});
}

function progress(){
  const byL={};for(const [id,i] of Object.entries(N.names)){const L=i.L;const n=nameOf(i);(byL[L]??={all:new Set(),seen:new Set()}).all.add(n);if(S.seen[id])byL[L].seen.add(n)}
  const best=L=>{const v=Object.entries(S.best).filter(([k])=>k[0]===L&&k[1]===':').map(([,x])=>x);return v.length?Math.max(...v):null};
  const days=[];for(let d=dayNum()-27;d<=dayNum();d++)days.push((S.days||{})[d]||0);
  const goal=S.goal||20,today=todayCount();
  const ex=(S.exams||[]).slice(-5);
  $('#home').innerHTML=`<div class="top"><button class="x" id="hb" aria-label="חזרה">→</button><h2>📈 ההתקדמות שלי</h2></div>
   <div class="card"><div class="row" style="align-items:center"><div style="font-size:36px;flex:none">🔥</div><div><b>${streakTxt(streak())}</b><div class="label">היום: ${today} מתוך יעד של ${goal} פעולות לימוד</div><div class="meter"><i style="width:${Math.min(100,today/goal*100)}%;background:var(--good)"></i></div></div></div>
    <div class="heat" aria-label="פעילות ב-28 הימים האחרונים">${days.map(n=>`<i style="opacity:${n?Math.min(1,.25+n/goal):.08}"></i>`).join('')}</div><span class="label">28 הימים האחרונים</span></div>
   <h2>מה כבר ראית</h2>
   <div class="card cats">${Object.keys(LAYERS).map(L=>{const b=byL[L];if(!b)return '';const p=b.seen.size/b.all.size;const bs=best(L);return `<div><b>${LAYERS[L].e} ${LAYERS[L].he}</b><div class="meter"><i style="width:${p*100}%;background:var(--good)"></i></div><span>${Math.round(p*100)}%</span></div>${bs!=null?`<span class="label" style="margin-top:-4px">שיא בבוחן: ${bs}/10</span>`:''}`}).join('')}</div>
   <h2>מבחנים מסכמים</h2>
   <div class="card">${ex.length?ex.map(e=>`<div class="row" style="justify-content:space-between"><span>${new Date(e.d).toLocaleDateString('he-IL')}</span><b>${e.s}/${e.n}</b></div>`).join(''):'<p class="label">עוד לא עשית מבחן מסכם.</p>'}<button class="btn wide" id="ex2">⏱️ למבחן מסכם</button></div>`;
  $('#hb').onclick=home;$('#ex2').onclick=runExam;
}

 ['המוחון',['cereb'],'back',null,'יושב מאחורי גזע המוח, מתחת לאונה העורפית. אחראי על קואורדינציה, שיווי משקל ודיוק בתנועה. פגיעה בו גורמת לחוסר יציבות בהליכה, רעד בכוונה ודיבור מקוטע, באותו צד של הגוף. החלק האמצעי נקרא ורמיס.'],
 ['קרומי המוח',['men'],'top',null,'הקרום הקשה (dura) יוצר שתי מחיצות: מגל המוח (falx cerebri) בין שתי ההמיספרות, ואוהל המוחון (tentorium) בין המוח למוחון. לחץ גבוה בתוך הגולגולת עלול לדחוק חלקי מוח מתחת למחיצות האלה (הרניאציה).'],
];
let BI=0;
if(/[?&]shot/.test(location.search))window.__dbg={get meshes(){return meshes},brGroup,get custom(){return custom},get camera(){return camera},T,ray};
async function brainTour(){await useLayer('n');region='brain';mode='run';BI=0;brainStep()}
function brainStep(){
  const [t,gs,view,hemi,txt]=BRAIN[BI];layer='n';region='brain';clearMarker();
  const brain=meshes.filter(m=>m.userData.info.L==='n'&&m.userData.info.r==='brain'&&!/white matter|spinal dura/i.test(m.userData.info.en));
  const col=new Map(),set=[];
  for(const m of brain){const g=brGroup(m.userData.info);if(g&&gs.includes(g)){col.set(m,BRG[g][1]);set.push(m)}}
  const shown=brain.filter(m=>(!hemi||m.userData.info.side!==(hemi==='left'?'right':'left'))&&brGroup(m.userData.info));
  const shownSet=new Set(shown);
  const deep=gs.some(g=>['insula','limbic','basal','dien','vent','men'].includes(g));
  custom={ghost:deep,ghostOp:.025,set:new Set(set),col,html:'',hide:m=>!shownSet.has(m)};setShift(.24);
  // camera direction around the brain
  const b=new T.Box3();shown.forEach(m=>b.union(m.geometry.boundingBox));const c=b.getCenter(new T.Vector3());
  const R=brain.filter(m=>m.userData.info.side==='right'),Lf=brain.filter(m=>m.userData.info.side==='left');
  const mx=a=>a.reduce((s,m)=>s+m.geometry.boundingSphere.center.x,0)/Math.max(1,a.length);const rs=Math.sign(mx(R)-mx(Lf))||1;
  const side=hemi==='left'?-rs:rs;
  const d={lat:[side,0,0],med:[-side,0,0],top:[0,1,.35],back:[0,.2,-1],front:[0,0,1]}[view];
  controls.target.copy(c);camera.position.copy(c).add(new T.Vector3(...d).normalize());paint();fitTo(shown,true);
  const legend=gs.length>1?`<div class="legend">${gs.map(g=>`<span><i style="background:${BRG[g][1]}"></i>${BRG[g][2]}</span>`).join('')}</div>`:'';
  $('#ui').innerHTML=`<div class="bar"><button class="x" id="back" aria-label="יציאה">✕</button><div class="ttl">🧠 מבנה המוח · ${BI+1}/${BRAIN.length}</div></div>
   <div class="bar" style="margin-top:8px"><select id="bsel" aria-label="בחירת נושא" style="width:100%;font:inherit;padding:6px;border-radius:10px">${BRAIN.map((x,j)=>`<option value="${j}" ${j===BI?'selected':''}>${esc(x[0])}</option>`).join('')}</select></div>
   <div class="spacer"></div>
   <div class="sheet"><div class="he">${esc(t)}</div>${legend}<div class="desc">${esc(txt)}</div>
    <span class="label">${hemi?`מוצגת ההמיספרה ה${hemi==='left'?'שמאלית':'ימנית'} · `:''}אפשר לסובב את המוח באצבע. לחיצה על מבנה תציג את שמו.</span>
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" id="prv" ${BI?'':'disabled'}>→ הקודם</button><button class="mini" id="say" aria-label="הקראה">🔊</button><button class="mini" id="bexp" aria-label="חקירה חופשית">🔎</button><button class="btn" id="nxt">${BI+1<BRAIN.length?'הבא ←':'סיום'}</button></div></div>`;
  $('#back').onclick=home;$('#bsel').onchange=e=>{BI=+e.target.value;brainStep()};
  $('#prv').onclick=()=>{BI--;brainStep()};$('#nxt').onclick=()=>{if(BI+1<BRAIN.length){BI++;brainStep()}else home()};
  $('#say').onclick=()=>speak({he:t,la:'',en:'',s:txt},{full:true,noLatin:true});
  $('#bexp').onclick=()=>{mode='explore';custom=null;renderUI();paint();fitTo(brain,true)};
}

loadNames().then(home).catch(home);
</script>
