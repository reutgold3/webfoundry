ding":{"en":"To: All staff. From: Human Resources. Subject: Updated hybrid work guidelines. Following the feedback survey conducted last month, we are introducing several changes to our hybrid work arrangements, effective 1 September. Most respondents told us that flexibility has improved their work-life balance, and we have no intention of reversing that. However, many also reported feeling disconnected from colleagues, and managers noted that collaboration on complex projects has become slower. With this in mind, all teams will now be expected to work from the office on two fixed days per week, to be agreed within each department. We are also asking everyone to observe a few simple practices during video calls. Cameras should be switched on for internal meetings where possible, and meetings should start five minutes after the hour to allow short breaks between calls. Messages sent outside working hours do not require an immediate reply. We recognise that these adjustments may be inconvenient for some, particularly employees with long commutes or caring responsibilities. If the new arrangement poses a genuine difficulty, please speak to your manager, as individual exceptions will be considered on a case-by-case basis.","he":"אל: כל העובדים. מאת: משאבי אנוש. נושא: הנחיות מעודכנות לעבודה היברידית. בעקבות סקר המשוב שנערך בחודש שעבר, אנו מכניסים מספר שינויים בהסדרי העבודה ההיברידית, החל מ-1 בספטמבר. רוב המשיבים סיפרו לנו שהגמישות שיפרה את האיזון בין העבודה לחיים הפרטיים, ואין לנו כל כוונה לבטל זאת. עם זאת, רבים דיווחו גם על תחושת ניתוק מהעמיתים, ומנהלים ציינו שהשיתוף פעולה בפרויקטים מורכבים נעשה איטי יותר. לאור זאת, מעתה כל הצוותים יידרשו לעבוד מהמשרד ביומיים קבועים בשבוע, שייקבעו בתוך כל מחלקה. אנו מבקשים גם מכולם להקפיד על כמה כללים פשוטים בשיחות וידאו. יש להפעיל מצלמות בישיבות פנימיות ככל האפשר, וישיבות יתחילו חמש דקות אחרי השעה העגולה כדי לאפשר הפסקות קצרות בין שיחות. הודעות שנשלחות מחוץ לשעות העבודה אינן מחייבות מענה מיידי. אנו מכירים בכך שהתאמות אלה עלולות להיות לא נוחות לחלק מהעובדים, במיוחד למי שנוסעים זמן רב לעבודה או מטפלים בבני משפחה. אם ההסדר החדש יוצר קושי אמיתי, אנא פנו למנהל/ת שלכם, שכן חריגים אישיים ייבחנו לגופו של כל מקרה.","ru":"Кому: всем сотрудникам. От: отдела кадров. Тема: обновлённые правила гибридной работы. По итогам опроса, проведённого в прошлом месяце, мы вносим ряд изменений в порядок гибридной работы, которые вступают в силу с 1 сентября. Большинство респондентов сообщили, что гибкий график улучшил баланс между работой и личной жизнью, и мы не собираемся от этого отказываться. Однако многие также признались, что чувствуют оторванность от коллег, а руководители отметили, что совместная работа над сложными проектами замедлилась. С учётом этого все команды теперь должны будут работать в офисе два фиксированных дня в неделю, которые определяются внутри каждого отдела. Мы также просим всех соблюдать несколько простых правил во время видеозвонков. По возможности на внутренних совещаниях следует включать камеру, а встречи должны начинаться через пять минут после начала часа, чтобы между звонками были короткие перерывы. На сообщения, отправленные в нерабочее время, не нужно отвечать немедленно. Мы понимаем, что эти изменения могут создать неудобства для некоторых, особенно для сотрудников, которым долго добираться до работы или которые ухаживают за родственниками. Если новый порядок создаёт для вас серьёзные трудности, пожалуйста, обратитесь к своему руководителю: индивидуальные исключения будут рассматриваться в каждом случае отдельно.","ar":"إلى: جميع الموظفين. من: الموارد البشرية. الموضوع: إرشادات محدَّثة للعمل الهجين. في أعقاب استطلاع الآراء الذي أُجري الشهر الماضي، نُدخل عدة تغييرات على ترتيبات العمل الهجين، اعتبارًا من 1 أيلول. أخبرنا معظم المشاركين أن المرونة حسّنت التوازن بين حياتهم المهنية والشخصية، وليست لدينا أي نية للتراجع عن ذلك. لكن كثيرين أفادوا أيضًا بأنهم يشعرون بالانفصال عن زملائهم، ولاحظ المديرون أن التعاون في المشاريع المعقدة أصبح أبطأ. ولهذا، سيُطلب من جميع الفرق الآن العمل من المكتب يومين ثابتين في الأسبوع، يُتفق عليهما داخل كل قسم. كما نطلب من الجميع الالتزام ببعض الممارسات البسيطة خلال مكالمات الفيديو. ينبغي تشغيل الكاميرات في الاجتماعات الداخلية قدر الإمكان، وأن تبدأ الاجتماعات بعد خمس دقائق من بداية الساعة لإتاحة استراحات قصيرة بين المكالمات. ولا تتطلب الرسائل المرسلة خارج ساعات العمل ردًا فوريًا. ندرك أن هذه التعديلات قد تكون غير مريحة للبعض، وخاصة الموظفين الذين يقطعون مسافات طويلة إلى العمل أو يتولّون رعاية أفراد من أسرهم. إذا كان الترتيب الجديد يسبب صعوبة حقيقية، فيُرجى التحدث إلى مديرك، إذ سيُنظر في الاستثناءات الفردية لكل حالة على حدة.","questions":[["What is the main purpose of the memo?","To explain changes to hybrid work rules and the reasons for them","To end remote work for all employees","To announce the results of a salary survey","To introduce new video-call software"],["Why will meetings start five minutes after the hour?","To give employees short breaks between back-to-back calls","Because many employees regularly arrive late","To save money on software licences","Because managers requested longer meetings"],["What is the tone of the final paragraph?","Understanding and open to individual needs","Strict and unwilling to compromise","Humorous and informal","Indifferent to employees' concerns"]]}},{"en":"scheduling and deadlines","he":"תזמון ולוחות זמנים","ru":"Планирование и сроки","ar":"المواعيد والجداول الزمنية","e":"⏰","items":[{"en":"Would it be possible to push our meeting back to Wednesday morning?","he":"האם אפשר לדחות את הפגישה שלנו ליום רביעי בבוקר?","ru":"Можно ли перенести нашу встречу на утро среды?","ar":"هل من الممكن تأجيل اجتماعنا إلى صباح الأربعاء؟","e":"","alt":[]},{"en":"Realistically, we'll need at least two more weeks to finish the testing phase.","he":"באופן מציאותי, נצטרך לפחות עוד שבועיים כדי לסיים את שלב הבדיקות.","ru":"Если быть реалистами, нам понадобится ещё как минимум две недели, чтобы завершить этап тестирования.","ar":"بواقعية، سنحتاج إلى أسبوعين إضافيين على الأقل لإنهاء مرحلة الاختبار.","e":"","alt":[]},{"en":"I'm fully booked on Tuesday, but I could squeeze in a short call Thursday.","he":"ביום שלישי אני עמוס/ה לגמרי, אבל אוכל לדחוס שיחה קצרה ביום חמישי.","ru":"Во вторник у меня всё расписано, но в четверг я мог/могла бы выкроить время для короткого звонка.","ar":"جدولي ممتلئ تمامًا يوم الثلاثاء، لكن يمكنني ترتيب مكالمة قصيرة يوم الخميس.","e":"","alt":[]},{"en":"Given the tight deadline, we may need to prioritise the most critical features.","he":"בהתחשב בלוח הזמנים הצפוף, ייתכן שנצטרך לתעדף את הפיצ'רים הקריטיים ביותר.","ru":"Учитывая сжатые сроки, нам, возможно, придётся сосредоточиться на самых важных функциях.","ar":"نظرًا لضيق الموعد النهائي، قد نحتاج إلى إعطاء الأولوية للميزات الأكثر أهمية.","e":"","alt":[]},{"en":"Let's set a firm deadline and schedule a check-in halfway through the project.","he":"בואו נקבע מועד יעד סופי ונתזמן פגישת מעקב באמצע הפרויקט.","ru":"Давайте установим чёткий срок и назначим промежуточную проверку в середине проекта.","ar":"لنحدد موعدًا نهائيًا ثابتًا ونجدول اجتماع متابعة في منتصف المشروع.","e":"","alt":[]},{"en":"If we fall behind schedule, I'll let you know as early as possible.","he":"אם נפגר אחרי לוח הזמנים, אודיע לך מוקדם ככל האפשר.","ru":"Если мы начнём отставать от графика, я сообщу вам как можно раньше.","ar":"إذا تأخرنا عن الجدول الزمني، فسأُعلمك في أقرب وقت ممكن.","e":"","alt":[]}],"reading":{"en":"Subject: Revised timeline for the mobile app launch. Hi Tamar, I wanted to give you an early heads-up about the timeline for the mobile app. As things stand, we are unlikely to meet the 30 April launch date without compromising on quality. The main issue is the payment integration. The third-party provider changed its security requirements last week, which means that part of the code we had already completed now needs to be rewritten. Our developers estimate this will add roughly ten working days. I have considered two options. We could launch on time with the payment feature disabled and add it in an update a few weeks later, or we could postpone the full launch until mid-May. My recommendation would be the second option, since early reviews tend to shape how an app is perceived, and a launch without payments might frustrate our first users. I fully understand that the marketing campaign has already been planned around the original date, so I would suggest we meet with the marketing team this week to discuss the implications. Would Thursday at 10:00 work for you? Best, Eitan","he":"נושא: לוח זמנים מעודכן להשקת האפליקציה. היי תמר, רציתי לעדכן אותך מראש לגבי לוח הזמנים של האפליקציה. כפי שהדברים נראים כרגע, לא סביר שנעמוד במועד ההשקה של 30 באפריל בלי להתפשר על האיכות. הבעיה העיקרית היא חיבור מערכת התשלומים. הספק החיצוני שינה בשבוע שעבר את דרישות האבטחה שלו, ולכן חלק מהקוד שכבר השלמנו צריך כעת להיכתב מחדש. המפתחים שלנו מעריכים שזה יוסיף בערך עשרה ימי עבודה. שקלתי שתי אפשרויות. נוכל להשיק בזמן כשאפשרות התשלום מושבתת ולהוסיף אותה בעדכון כמה שבועות לאחר מכן, או לדחות את ההשקה המלאה לאמצע מאי. ההמלצה שלי היא האפשרות השנייה, כי הביקורות הראשונות נוטות לעצב את האופן שבו אפליקציה נתפסת, והשקה בלי תשלומים עלולה לתסכל את המשתמשים הראשונים שלנו. אני מבין היטב שקמפיין השיווק כבר תוכנן סביב המועד המקורי, ולכן אני מציע שניפגש השבוע עם צוות השיווק כדי לדון בהשלכות. יום חמישי בשעה 10:00 מתאים לך? בברכה, איתן","ru":"Тема: Новые сроки запуска мобильного приложения. Привет, Тамар! Хотел заранее предупредить тебя о сроках по мобильному приложению. Судя по текущей ситуации, мы вряд ли уложимся в дату запуска 30 апреля, не пожертвовав качеством. Главная проблема — интеграция платёжной системы. На прошлой неделе сторонний поставщик изменил требования безопасности, а значит, часть уже готового кода придётся переписать. По оценке наших разработчиков, это добавит примерно десять рабочих дней. Я рассмотрел два варианта. Мы можем запуститься вовремя с отключённой функцией оплаты и добавить её в обновлении через несколько недель, или же перенести полноценный запуск на середину мая. Я бы рекомендовал второй вариант, поскольку первые отзывы обычно формируют восприятие приложения, а запуск без оплаты может разочаровать наших первых пользователей. Я прекрасно понимаю, что маркетинговая кампания уже спланирована под исходную дату, поэтому предлагаю на этой неделе встретиться с отделом маркетинга и обсудить последствия. Тебе удобно в четверг в 10:00? Всего доброго, Эйтан","ar":"الموضوع: جدول زمني معدَّل لإطلاق تطبيق الهاتف. مرحبًا تمار، أردت أن أنبّهك مبكرًا بشأن الجدول الزمني لتطبيق الهاتف. بحسب الوضع الحالي، من غير المرجح أن نلتزم بموعد الإطلاق في 30 نيسان دون المساومة على الجودة. المشكلة الرئيسية هي ربط نظام الدفع. فقد غيّر المزوّد الخارجي متطلبات الأمان لديه الأسبوع الماضي، مما يعني أن جزءًا من الشيفرة التي أنجزناها بالفعل يحتاج الآن إلى إعادة كتابة. ويقدّر المطوّرون لدينا أن ذلك سيضيف نحو عشرة أيام عمل. لقد درست خيارين. يمكننا الإطلاق في الموعد مع تعطيل خاصية الدفع وإضافتها في تحديث بعد بضعة أسابيع، أو يمكننا تأجيل الإطلاق الكامل إلى منتصف أيار. توصيتي هي الخيار الثاني، لأن المراجعات الأولى غالبًا ما تحدد كيف يُنظر إلى التطبيق، والإطلاق دون إمكانية الدفع قد يُحبط مستخدمينا الأوائل. أتفهّم تمامًا أن الحملة التسويقية خُطط لها على أساس الموعد الأصلي، لذا أقترح أن نلتقي بفريق التسويق هذا الأسبوع لمناقشة التبعات. هل يناسبك يوم الخميس الساعة 10:00؟ مع التحية، إيتان","questions":[["Why is Eitan writing to Tamar?","To warn her about a likely delay and recommend a solution","To announce that the app has already launched","To ask her to rewrite the payment code","To cancel the marketing campaign"],["Why does Eitan prefer postponing the full launch?","He worries that a weak first impression could hurt the app","He wants extra time to go on holiday","The marketing team asked him for a delay","The payment provider requires a May launch"],["How would you describe Eitan's tone?","Transparent and solution-focused","Defensive and blaming others","Panicked and emotional","Vague and evasive"]]}},{"en":"sales and client relations","he":"מכירות וקשרי לקוחות","ru":"Продажи и работа с клиентами","ar":"المبيعات والعلاقات مع العملاء","e":"📈","items":[{"en":"What are the main challenges your team is facing with your current supplier?","he":"מהם האתגרים העיקריים שהצוות שלך מתמודד איתם מול הספק הנוכחי?","ru":"С какими основными трудностями ваша команда сталкивается при работе с нынешним поставщиком?","ar":"ما أبرز التحديات التي يواجهها فريقك مع المورّد الحالي؟","e":"","alt":[]},{"en":"I completely understand your concern about the budget, so let me explain the options.","he":"אני מבין/ה לגמרי את החשש שלך לגבי התקציב, אז תן/תני לי להסביר את האפשרויות.","ru":"Я прекрасно понимаю ваши опасения по поводу бюджета, поэтому позвольте объяснить возможные варианты.","ar":"أتفهّم تمامًا قلقك بشأن الميزانية، لذا دعني أشرح لك الخيارات المتاحة.","e":"","alt":[]},{"en":"Our solution typically pays for itself within the first six months of use.","he":"הפתרון שלנו בדרך כלל מחזיר את ההשקעה בתוך ששת החודשים הראשונים לשימוש.","ru":"Обычно наше решение окупается в течение первых шести месяцев использования.","ar":"عادةً ما يسترد حلّنا تكلفته خلال الأشهر الستة الأولى من الاستخدام.","e":"","alt":[]},{"en":"Would you be interested in a free trial before making a final decision?","he":"האם תהיה/תהיי מעוניין/ת בתקופת ניסיון חינם לפני שתקבל/י החלטה סופית?","ru":"Хотели бы вы воспользоваться бесплатным пробным периодом, прежде чем принять окончательное решение?","ar":"هل تهتم بتجربة مجانية قبل اتخاذ القرار النهائي؟","e":"","alt":[]},{"en":"I'd like to check in and see how you're getting on with the new system.","he":"רציתי לבדוק איך את/ה מסתדר/ת עם המערכת החדשה.","ru":"Я хотел/хотела бы узнать, как у вас идут дела с новой системой.","ar":"أردت أن أطمئن وأعرف كيف تسير الأمور معك في النظام الجديد.","e":"","alt":[]},{"en":"We can offer a ten percent discount if you commit to an annual contract.","he":"נוכל להציע הנחה של עשרה אחוזים אם תתחייב/י לחוזה שנתי.","ru":"Мы можем предложить скидку в десять процентов, если вы заключите годовой контракт.","ar":"يمكننا تقديم خصم بنسبة عشرة بالمئة إذا التزمت بعقد سنوي.","e":"","alt":[]}],"reading":{"en":"Case study: Winning back a key account. When Galil Foods, one of our largest clients, informed us that it was considering switching to a cheaper packaging supplier, the account team faced a difficult choice. Matching the competitor's price would have wiped out most of our margin on the contract. Instead of entering a price war, account manager Rina Haddad requested a meeting to understand what lay behind the decision. It quickly emerged that price was only part of the story. Galil's procurement team had been frustrated by late deliveries over the previous six months and felt that their complaints had not been taken seriously. Rina returned with a proposal that addressed these concerns directly: a dedicated delivery coordinator, a weekly status report, and a penalty clause that would reduce our fee for every late shipment. The price itself was reduced by only three percent. Galil renewed the contract for two years. Six months later, on-time delivery had risen to ninety-eight percent, and the client had expanded its order to include two new product lines. The lesson is clear: before offering a discount, find out what the customer actually values.","he":"מקרה בוחן: החזרת לקוח מפתח. כאשר \"גליל מזון\", אחד הלקוחות הגדולים ביותר שלנו, הודיע לנו שהוא שוקל לעבור לספק אריזות זול יותר, צוות תיק הלקוח עמד בפני בחירה קשה. השוואת המחיר למחיר של המתחרה הייתה מוחקת את רוב הרווח שלנו מהחוזה. במקום להיכנס למלחמת מחירים, מנהלת התיק רינה חדאד ביקשה פגישה כדי להבין מה עומד מאחורי ההחלטה. מהר מאוד התברר שהמחיר היה רק חלק מהסיפור. צוות הרכש של \"גליל\" היה מתוסכל מאיחורים במשלוחים במהלך ששת החודשים הקודמים, והרגיש שתלונותיו לא נלקחו ברצינות. רינה חזרה עם הצעה שנתנה מענה ישיר לחששות האלה: רכז משלוחים ייעודי, דוח סטטוס שבועי, וסעיף קנס שיפחית את התשלום שלנו על כל משלוח שמאחר. המחיר עצמו הופחת בשלושה אחוזים בלבד. \"גליל\" חידשה את החוזה לשנתיים. כעבור חצי שנה, שיעור המשלוחים שהגיעו בזמן עלה לתשעים ושמונה אחוזים, והלקוח הרחיב את ההזמנה שלו כך שתכלול שני קווי מוצרים חדשים. הלקח ברור: לפני שמציעים הנחה, כדאי לברר מה הלקוח באמת מעריך.","ru":"Кейс: как вернуть ключевого клиента. Когда «Галиль Фудс», один из наших крупнейших клиентов, сообщил, что рассматривает переход к более дешёвому поставщику упаковки, команда по работе с клиентом оказалась перед непростым выбором. Если бы мы снизили цену до уровня конкурента, это уничтожило бы бóльшую часть нашей прибыли по контракту. Вместо того чтобы ввязываться в ценовую войну, менеджер по работе с клиентом Рина Хаддад попросила о встрече, чтобы понять, что стоит за этим решением. Быстро выяснилось, что цена — лишь часть истории. Отдел закупок «Галиля» был недоволен задержками поставок в течение предыдущих шести месяцев и считал, что их жалобы не воспринимались всерьёз. Рина вернулась с предложением, которое напрямую учитывало эти претензии: отдельный координатор поставок, еженедельный отчёт о статусе и штрафная оговорка, снижающая наше вознаграждение за каждую задержанную поставку. Саму цену снизили всего на три процента. «Галиль» продлил контракт на два года. Через полгода доля своевременных поставок выросла до девяноста восьми процентов, а клиент расширил заказ, добавив две новые товарные линейки. Вывод очевиден: прежде чем предлагать скидку, выясните, что на самом деле ценит клиент.","ar":"دراسة حالة: استعادة عميل رئيسي. عندما أبلغتنا شركة \"الجليل للأغذية\"، وهي من أكبر عملائنا، بأنها تفكر في الانتقال إلى مورّد تغليف أرخص، واجه فريق إدارة الحساب خيارًا صعبًا. فمجاراة سعر المنافس كانت ستقضي على معظم هامش ربحنا من العقد. وبدلًا من الدخول في حرب أسعار، طلبت مديرة الحساب رينا حداد عقد اجتماع لفهم ما يقف وراء القرار. وسرعان ما تبيّن أن السعر لم يكن سوى جزء من القصة. فقد كان فريق المشتريات في \"الجليل\" مستاءً من تأخر الشحنات خلال الأشهر الستة السابقة، وشعر بأن شكاواه لم تؤخذ على محمل الجد. عادت رينا بعرض يعالج هذه المخاوف مباشرة: منسّق توصيل مخصص، وتقرير أسبوعي عن الوضع، وبند جزائي يخفّض أتعابنا عن كل شحنة متأخرة. أما السعر نفسه فلم يُخفَّض إلا بنسبة ثلاثة بالمئة. جدّدت \"الجليل\" العقد لمدة عامين. وبعد ستة أشهر، ارتفعت نسبة التسليم في الموعد إلى ثمانية وتسعين بالمئة، ووسّع العميل طلبيته لتشمل خطّي إنتاج جديدين. الدرس واضح: قبل أن تعرض خصمًا، اكتشف ما يقدّره العميل فعلًا.","questions":[["What is the main purpose of this case study?","To show that understanding client needs can matter more than price","To advertise a new packaging product","To criticise Galil Foods' procurement team","To explain how to win a price war"],["What can be inferred about the penalty clause?","It signalled the company's confidence that deliveries would improve","It was originally demanded by the competitor","It made the contract completely unprofitable","It was removed after six months"],["What is the tone of the final sentence?","Instructive and confident","Doubtful and hesitant","Sarcastic and critical","Apologetic and regretful"]]}},{"en":"presentations and results","he":"מצגות והצגת תוצאות","ru":"Презентации и отчёт о результатах","ar":"العروض التقديمية وعرض النتائج","e":"📊","items":[{"en":"I'd like to begin by giving you a brief overview of our quarterly performance.","he":"אני רוצה לפתוח בסקירה קצרה של הביצועים שלנו ברבעון.","ru":"Я хотел/хотела бы начать с краткого обзора наших квартальных результатов.","ar":"أود أن أبدأ بإعطائكم لمحة موجزة عن أدائنا الفصلي.","e":"","alt":[]},{"en":"As you can see from this chart, sales rose sharply in the second quarter.","he":"כפי שאפשר לראות בתרשים הזה, המכירות זינקו ברבעון השני.","ru":"Как видно на этом графике, во втором квартале продажи резко выросли.","ar":"كما ترون في هذا الرسم البياني، ارتفعت المبيعات بشكل حاد في الربع الثاني.","e":"","alt":[]},{"en":"This figure is slightly misleading, so let me put it into context.","he":"הנתון הזה מעט מטעה, אז תנו לי להציג אותו בהקשר הנכון.","ru":"Эта цифра немного вводит в заблуждение, поэтому позвольте объяснить её в контексте.","ar":"هذا الرقم مضلّل بعض الشيء، لذا دعوني أضعه في سياقه.","e":"","alt":[]},{"en":"Although revenue fell short of target, our profit margins actually improved considerably.","he":"אף שההכנסות לא הגיעו ליעד, שולי הרווח שלנו דווקא השתפרו משמעותית.","ru":"Хотя выручка не достигла целевого уровня, наша норма прибыли на самом деле заметно выросла.","ar":"رغم أن الإيرادات لم تبلغ الهدف، فإن هوامش أرباحنا تحسّنت في الواقع بشكل ملحوظ.","e":"","alt":[]},{"en":"That's a great question, and I'll come back to it at the end.","he":"זו שאלה מצוינת, ואחזור אליה בסוף.","ru":"Отличный вопрос, я вернусь к нему в конце.","ar":"هذا سؤال ممتاز، وسأعود إليه في النهاية.","e":"","alt":[]},{"en":"To wrap up, I'd like to highlight three key takeaways from today's results.","he":"לסיום, אני רוצה להדגיש שלוש מסקנות מרכזיות מהתוצאות של היום.","ru":"В завершение я хотел/хотела бы выделить три главных вывода из сегодняшних результатов.","ar":"في الختام، أود أن أسلّط الضوء على ثلاث نقاط رئيسية من نتائج اليوم.","e":"","alt":[]}],"reading":{"en":"Q3 Results Summary - Online Retail Division. Overall, the third quarter delivered mixed results. Total revenue reached 12.6 million shekels, which represents a seven percent increase on the same period last year but falls slightly short of our target of 13 million. The shortfall can largely be attributed to the home electronics category, where sales declined by fifteen percent following the entry of two aggressive international competitors. By contrast, our sports and outdoor category performed exceptionally well, growing by twenty-two percent, driven mainly by a successful social media campaign. Encouragingly, customer retention improved significantly. The proportion of customers making a repeat purchase within ninety days rose from 31 to 38 percent, which suggests that the loyalty programme introduced in June is beginning to pay off. Looking ahead, we propose to reduce our investment in home electronics advertising and redirect part of that budget towards the categories showing the strongest growth. We also recommend a detailed review of our electronics pricing before the holiday season. While the quarter was not without its challenges, we believe the underlying trends give us good reason for cautious optimism.","he":"סיכום תוצאות רבעון 3 – חטיבת הקמעונאות המקוונת. באופן כללי, הרבעון השלישי הניב תוצאות מעורבות. סך ההכנסות הגיע ל-12.6 מיליון שקלים, עלייה של שבעה אחוזים לעומת התקופה המקבילה אשתקד, אך מעט מתחת ליעד שלנו של 13 מיליון. את הפער אפשר לייחס בעיקר לקטגוריית מוצרי החשמל לבית, שבה המכירות ירדו בחמישה עשר אחוזים בעקבות כניסתם של שני מתחרים בינלאומיים אגרסיביים. לעומת זאת, קטגוריית הספורט והפעילות בחוץ הציגה ביצועים יוצאי דופן, עם צמיחה של עשרים ושניים אחוזים, בעיקר בזכות קמפיין מוצלח ברשתות החברתיות. נתון מעודד הוא ששימור הלקוחות השתפר משמעותית. שיעור הלקוחות שביצעו רכישה חוזרת בתוך תשעים יום עלה מ-31 ל-38 אחוזים, מה שמרמז שתוכנית הנאמנות שהושקה ביוני מתחילה להשתלם. במבט קדימה, אנו מציעים לצמצם את ההשקעה בפרסום מוצרי חשמל לבית ולהפנות חלק מהתקציב לקטגוריות שמראות את הצמיחה החזקה ביותר. אנו ממליצים גם על בחינה מעמיקה של תמחור מוצרי החשמל לפני עונת החגים. אף שהרבעון לא היה נקי מאתגרים, אנו סבורים שהמגמות הבסיסיות מעניקות לנו סיבה טובה לאופטימיות זהירה.","ru":"Итоги третьего квартала — подразделение онлайн-торговли. В целом третий квартал принёс неоднозначные результаты. Общая выручка достигла 12,6 миллиона шекелей, что на семь процентов больше, чем за тот же период прошлого года, но немного ниже нашей цели в 13 миллионов. Недобор в основном объясняется категорией бытовой электроники, где продажи упали на пятнадцать процентов после выхода на рынок двух агрессивных международных конкурентов. В то же время категория товаров для спорта и активного отдыха показала исключительные результаты, выросла на двадцать два процента, в основном благодаря успешной кампании в социальных сетях. Обнадёживает то, что удержание клиентов значительно улучшилось. Доля клиентов, совершивших повторную покупку в течение девяноста дней, выросла с 31 до 38 процентов, что говорит о том, что программа лояльности, запущенная в июне, начинает приносить плоды. В дальнейшем мы предлагаем сократить вложения в рекламу бытовой электроники и перенаправить часть этого бюджета на категории с наибольшим ростом. Мы также рекомендуем тщательно пересмотреть цены на электронику перед праздничным сезоном. Хотя квартал не обошёлся без трудностей, мы считаем, что основные тенденции дают нам веские основания для осторожного оптимизма.","ar":"ملخص نتائج الربع الثالث – قسم البيع بالتجزئة عبر الإنترنت. بشكل عام، حقق الربع الثالث نتائج متباينة. فقد بلغ إجمالي الإيرادات 12.6 مليون شيكل، أي بزيادة سبعة بالمئة مقارنة بالفترة نفسها من العام الماضي، لكنه جاء أقل قليلًا من هدفنا البالغ 13 مليونًا. ويُعزى هذا العجز بدرجة كبيرة إلى فئة الأجهزة الكهربائية المنزلية، حيث تراجعت المبيعات بنسبة خمسة عشر بالمئة بعد دخول منافسَين دوليَّين شرسَين. في المقابل، حققت فئة الرياضة والأنشطة الخارجية أداءً استثنائيًا، إذ نمت بنسبة اثنين وعشرين بالمئة، مدفوعة أساسًا بحملة ناجحة على وسائل التواصل الاجتماعي. ومن المشجّع أن الاحتفاظ بالعملاء تحسّن بشكل ملحوظ. فقد ارتفعت نسبة العملاء الذين أجروا عملية شراء متكررة خلال تسعين يومًا من 31 إلى 38 بالمئة، مما يشير إلى أن برنامج الولاء الذي أُطلق في حزيران بدأ يؤتي ثماره. وبالنظر إلى المستقبل، نقترح خفض استثمارنا في إعلانات الأجهزة الكهربائية المنزلية وتوجيه جزء من تلك الميزانية نحو الفئات التي تُظهر أقوى نمو. كما نوصي بمراجعة مفصّلة لأسعار الأجهزة الكهربائية قبل موسم الأعياد. ورغم أن هذا الربع لم يخلُ من التحديات، فإننا نعتقد أن الاتجاهات الأساسية تمنحنا سببًا وجيهًا للتفاؤل الحذر.","questions":[["What is the main purpose of this summary?","To report results, explain them and propose next steps","To announce the closure of the electronics category","To launch a new loyalty programme","To ask investors for additional funding"],["What does the rise in repeat purchases suggest?","The loyalty programme seems to be having a positive effect","Electronics prices were set too low","International competitors have left the market","Total revenue exceeded the quarterly target"],["How would you describe the tone of the final sentence?","Balanced and cautiously positive","Extremely enthusiastic and excited","Pessimistic and worried","Angry about the competition"]]}},{"en":"handling complaints","he":"שירות לקוחות וטיפול בתלונות","ru":"Обслуживание клиентов и жалобы","ar":"خدمة العملاء ومعالجة الشكاوى","e":"🎧","items":[{"en":"I'm very sorry for the inconvenience, and I'll look into this right away.","he":"אני מצטער/ת מאוד על אי הנוחות, ואבדוק את העניין מיד.","ru":"Приношу извинения за неудобства, я немедленно займусь этим вопросом.","ar":"أعتذر بشدة عن الإزعاج، وسأتحقق من الأمر فورًا.","e":"","alt":[]},{"en":"I can see why you'd be frustrated, and I really appreciate your patience.","he":"אני מבין/ה למה זה מתסכל אותך, ואני מאוד מעריך/ה את הסבלנות שלך.","ru":"Я понимаю ваше недовольство и очень ценю ваше терпение.","ar":"أتفهّم سبب استيائك، وأقدّر صبرك كثيرًا.","e":"","alt":[]},{"en":"Could you give me your order number so I can check the details?","he":"תוכל/י לתת לי את מספר ההזמנה כדי שאוכל לבדוק את הפרטים?","ru":"Не могли бы вы назвать номер заказа, чтобы я проверил/проверила детали?","ar":"هل يمكنك إعطائي رقم الطلب حتى أتحقق من التفاصيل؟","e":"","alt":[]},{"en":"As a goodwill gesture, we'd like to offer you a full refund.","he":"כמחווה של רצון טוב, נשמח להציע לך החזר כספי מלא.","ru":"В качестве жеста доброй воли мы хотели бы предложить вам полный возврат средств.","ar":"كبادرة حسن نية، نود أن نعرض عليك استردادًا كاملًا للمبلغ.","e":"","alt":[]},{"en":"I'll escalate this to our technical team and update you within forty-eight hours.","he":"אעביר את זה לטיפול הצוות הטכני ואעדכן אותך בתוך ארבעים ושמונה שעות.","ru":"Я передам вопрос нашей технической команде и сообщу вам новости в течение сорока восьми часов.","ar":"سأرفع الأمر إلى فريقنا التقني وأُطلعك على المستجدات خلال ثمانٍ وأربعين ساعة.","e":"","alt":[]},{"en":"Is there anything else I can help you with before we finish today?","he":"יש עוד משהו שאני יכול/ה לעזור לך בו לפני שנסיים היום?","ru":"Могу ли я помочь вам чем-нибудь ещё, прежде чем мы закончим?","ar":"هل هناك أي شيء آخر يمكنني مساعدتك به قبل أن ننهي اليوم؟","e":"","alt":[]}],"reading":{"en":"Subject: Re: Damaged furniture delivery - order #88213. Dear Mrs. Peretz, Thank you for taking the time to contact us, and please accept my sincere apologies for the condition in which your dining table arrived on Sunday. Having reviewed the photographs you sent, I can confirm that the damage almost certainly occurred during transport and is in no way your responsibility. I also understand that this was not your first attempt to reach us, and that you waited more than forty minutes on the phone before your call was disconnected. That is simply not the level of service we aim to provide, and I have shared your feedback with our customer service manager. To put things right, we will deliver a replacement table at no extra cost and collect the damaged one at the same time. Our logistics team can offer a delivery slot as early as Wednesday morning. In addition, we would like to refund the 250-shekel delivery fee in recognition of the inconvenience you have experienced. Please reply to this email, or call me directly on the number below, to confirm a suitable time. With kind regards, Avi Mizrahi, Customer Care Team Leader","he":"נושא: תשובה: משלוח רהיטים פגום – הזמנה מס' 88213. גב' פרץ היקרה, תודה שהקדשת מזמנך כדי לפנות אלינו, ואנא קבלי את התנצלותי הכנה על המצב שבו הגיע שולחן האוכל שלך ביום ראשון. לאחר שעיינתי בתמונות ששלחת, אני יכול לאשר שהנזק נגרם כמעט בוודאות במהלך ההובלה ואינו באחריותך בשום אופן. אני גם מבין שזה לא היה הניסיון הראשון שלך ליצור איתנו קשר, ושהמתנת יותר מארבעים דקות בטלפון לפני שהשיחה התנתקה. זו פשוט לא רמת השירות שאנו שואפים לספק, והעברתי את המשוב שלך למנהל שירות הלקוחות שלנו. כדי לתקן את המצב, נספק לך שולחן חלופי ללא עלות נוספת ונאסוף את השולחן הפגום באותה הזדמנות. צוות הלוגיסטיקה שלנו יכול להציע מועד משלוח כבר ביום רביעי בבוקר. בנוסף, נשמח להחזיר לך את דמי המשלוח בסך 250 שקלים כהכרה באי הנוחות שנגרמה לך. אנא השיבי למייל זה, או התקשרי אליי ישירות למספר שלמטה, כדי לאשר מועד מתאים. בברכה, אבי מזרחי, ראש צוות שירות לקוחות","ru":"Тема: Re: Повреждённая мебель при доставке — заказ № 88213. Уважаемая г-жа Перец, благодарю вас за то, что нашли время связаться с нами, и примите мои искренние извинения за состояние, в котором в воскресенье прибыл ваш обеденный стол. Изучив присланные вами фотографии, могу подтвердить, что повреждение почти наверняка возникло во время перевозки и ни в коем случае не является вашей виной. Я также понимаю, что это была не первая ваша попытка связаться с нами и что вы ждали на линии более сорока минут, прежде чем звонок оборвался. Это совершенно не тот уровень обслуживания, к которому мы стремимся, и я передал ваш отзыв руководителю службы поддержки клиентов. Чтобы исправить ситуацию, мы доставим вам новый стол без дополнительной оплаты и одновременно заберём повреждённый. Наша служба логистики может предложить доставку уже в среду утром. Кроме того, мы хотели бы вернуть вам плату за доставку в размере 250 шекелей в знак признания доставленных вам неудобств. Пожалуйста, ответьте на это письмо или позвоните мне напрямую по указанному ниже номеру, чтобы согласовать удобное время. С уважением, Ави Мизрахи, руководитель группы поддержки клиентов","ar":"الموضوع: رد: توصيل أثاث تالف – الطلب رقم 88213. السيدة بيرتس المحترمة، شكرًا لك على تخصيص الوقت للتواصل معنا، وأرجو أن تتقبّلي اعتذاري الصادق عن الحالة التي وصلت بها طاولة الطعام يوم الأحد. بعد مراجعة الصور التي أرسلتِها، يمكنني التأكيد أن الضرر حدث على الأرجح أثناء النقل وأنكِ لا تتحملين أي مسؤولية عنه على الإطلاق. وأفهم أيضًا أن هذه لم تكن محاولتك الأولى للتواصل معنا، وأنك انتظرت أكثر من أربعين دقيقة على الهاتف قبل أن تنقطع المكالمة. هذا ببساطة ليس مستوى الخدمة الذي نسعى إلى تقديمه، وقد نقلت ملاحظاتك إلى مدير خدمة العملاء لدينا. ولتصحيح الوضع، سنوصل إليكِ طاولة بديلة دون أي تكلفة إضافية ونستلم الطاولة التالفة في الوقت نفسه. ويمكن لفريق الخدمات اللوجستية لدينا تحديد موعد للتوصيل في وقت مبكر يصل إلى صباح الأربعاء. بالإضافة إلى ذلك، نود أن نعيد إليكِ رسوم التوصيل البالغة 250 شيكلًا تقديرًا للإزعاج الذي تعرّضتِ له. يُرجى الرد على هذه الرسالة، أو الاتصال بي مباشرة على الرقم أدناه، لتأكيد الموعد المناسب. مع أطيب التحيات، آفي مزراحي، رئيس فريق رعاية العملاء","questions":[["What is the main purpose of the email?","To apologise and offer the customer a practical solution","To ask the customer to pay for repairs","To explain the company's return policy","To reject the customer's complaint"],["Why does Avi most likely offer his direct phone number?","To spare her another long wait on the general line","Because the company has no email system","Because he wants to sell her more furniture","Because the logistics team is unavailable"],["What is the tone of the email?","Apologetic, empathetic and professional","Defensive and cold","Humorous and casual","Impatient and dismissive"]]}},{"en":"negotiation","he":"משא ומתן","ru":"Переговоры","ar":"التفاوض","e":"⚖️","items":[{"en":"I see where you're coming from, but that price is beyond our budget.","he":"אני מבין/ה את נקודת המבט שלך, אבל המחיר הזה חורג מהתקציב שלנו.","ru":"Я понимаю вашу позицию, но эта цена выходит за рамки нашего бюджета.","ar":"أفهم وجهة نظرك، لكن هذا السعر يتجاوز ميزانيتنا.","e":"","alt":[]},{"en":"If you could extend the payment terms, we might be able to increase our order.","he":"אם תוכלו להאריך את תנאי התשלום, ייתכן שנוכל להגדיל את ההזמנה שלנו.","ru":"Если бы вы могли продлить срок оплаты, мы, возможно, смогли бы увеличить заказ.","ar":"إذا أمكنكم تمديد شروط الدفع، فقد نتمكن من زيادة طلبيتنا.","e":"","alt":[]},{"en":"Let's try to find a solution that genuinely works for both sides.","he":"בואו ננסה למצוא פתרון שבאמת מתאים לשני הצדדים.","ru":"Давайте попробуем найти решение, которое действительно устроит обе стороны.","ar":"لنحاول إيجاد حل يناسب الطرفين فعلًا.","e":"","alt":[]},{"en":"Would you be willing to meet us halfway on the delivery costs?","he":"האם תהיו מוכנים להתפשר איתנו באמצע על עלויות המשלוח?","ru":"Готовы ли вы пойти нам навстречу и разделить расходы на доставку пополам?","ar":"هل أنتم مستعدون لملاقاتنا في منتصف الطريق بشأن تكاليف التوصيل؟","e":"","alt":[]},{"en":"I'm afraid that's not something we can agree to at this stage.","he":"אני חושש/ת שזה לא משהו שנוכל להסכים לו בשלב הזה.","ru":"Боюсь, на данном этапе мы не можем на это согласиться.","ar":"أخشى أن هذا ليس أمرًا يمكننا الموافقة عليه في هذه المرحلة.","e":"","alt":[]},{"en":"Before we finalise anything, I need to run these terms by our legal team.","he":"לפני שנסגור משהו סופית, אני צריך/ה להעביר את התנאים האלה לבדיקת הצוות המשפטי שלנו.","ru":"Прежде чем что-то окончательно утверждать, мне нужно согласовать эти условия с нашими юристами.","ar":"قبل أن نعتمد أي شيء نهائيًا، عليّ عرض هذه الشروط على فريقنا القانوني.","e":"","alt":[]}],"reading":{"en":"Subject: Our position following yesterday's discussion. Dear Mr. Amar, Thank you for a constructive meeting yesterday. I believe we made genuine progress, and I would like to set out our position clearly before we meet again next week. We understand that your company needs a price reduction of around twelve percent to stay within budget. Frankly, a cut of that size on the existing terms would not be sustainable for us. However, we have looked carefully at the structure of the agreement, and there may be room for flexibility elsewhere. Specifically, we would be prepared to lower the unit price by seven percent if you were able to commit to a three-year contract rather than the current annual one. A longer agreement would allow us to plan production more efficiently and pass part of the savings on to you. We could also consider switching to quarterly rather than monthly deliveries, which would reduce transport costs on both sides. I appreciate that these proposals may require internal approval on your end. I would welcome your thoughts, or any alternative suggestions, before our next meeting. Kind regards, Sharon Weiss, Commercial Director","he":"נושא: עמדתנו בעקבות הדיון אתמול. מר עמר היקר, תודה על פגישה בונה אתמול. אני סבורה שהתקדמנו באמת, ואני רוצה להציג את עמדתנו בבהירות לפני שניפגש שוב בשבוע הבא. אנו מבינים שהחברה שלך זקוקה להפחתת מחיר של כשנים עשר אחוזים כדי לעמוד בתקציב. בכנות, הפחתה בהיקף כזה בתנאים הקיימים לא תהיה בת קיימא עבורנו. עם זאת, בחנו היטב את מבנה ההסכם, וייתכן שיש מקום לגמישות בתחומים אחרים. באופן ספציפי, נהיה מוכנים להוריד את מחיר היחידה בשבעה אחוזים אם תוכלו להתחייב לחוזה לשלוש שנים במקום החוזה השנתי הנוכחי. הסכם ארוך יותר יאפשר לנו לתכנן את הייצור ביעילות רבה יותר ולגלגל אליכם חלק מהחיסכון. נוכל גם לשקול מעבר למשלוחים רבעוניים במקום חודשיים, דבר שיפחית את עלויות ההובלה לשני הצדדים. אני מבינה שההצעות האלה עשויות לדרוש אישור פנימי מצדכם. אשמח לשמוע את מחשבותיך, או כל הצעה חלופית, לפני הפגישה הבאה שלנו. בברכה, שרון וייס, מנהלת מסחרית","ru":"Тема: Наша позиция по итогам вчерашнего обсуждения. Уважаемый г-н Амар, благодарю вас за конструктивную встречу вчера. Я считаю, что мы достигли реального прогресса, и хотела бы чётко изложить нашу позицию до следующей встречи на будущей неделе. Мы понимаем, что вашей компании необходимо снижение цены примерно на двенадцать процентов, чтобы уложиться в бюджет. Откровенно говоря, снижение такого масштаба на нынешних условиях было бы для нас невыгодным. Однако мы внимательно изучили структуру соглашения, и, возможно, гибкость найдётся в других вопросах. В частности, мы были бы готовы снизить цену за единицу на семь процентов, если вы сможете заключить контракт на три года вместо нынешнего годового. Более долгосрочное соглашение позволит нам эффективнее планировать производство и передать часть экономии вам. Мы также могли бы рассмотреть переход на ежеквартальные поставки вместо ежемесячных, что снизит транспортные расходы для обеих сторон. Я понимаю, что эти предложения, возможно, потребуют внутреннего согласования с вашей стороны. Буду рада услышать ваше мнение или любые альтернативные предложения до нашей следующей встречи. С уважением, Шарон Вайс, коммерческий директор","ar":"الموضوع: موقفنا بعد نقاش الأمس. السيد عمار المحترم، شكرًا لك على الاجتماع البنّاء بالأمس. أعتقد أننا حققنا تقدمًا حقيقيًا، وأود أن أعرض موقفنا بوضوح قبل أن نلتقي مجددًا الأسبوع المقبل. نحن ندرك أن شركتكم بحاجة إلى تخفيض في السعر بنحو اثني عشر بالمئة كي تبقى ضمن الميزانية. وبصراحة، فإن تخفيضًا بهذا الحجم وفق الشروط الحالية لن يكون مستدامًا بالنسبة لنا. ومع ذلك، درسنا هيكل الاتفاقية بعناية، وقد يكون هناك مجال للمرونة في جوانب أخرى. وتحديدًا، سنكون مستعدين لخفض سعر الوحدة بنسبة سبعة بالمئة إذا تمكنتم من الالتزام بعقد مدته ثلاث سنوات بدلًا من العقد السنوي الحالي. فالاتفاقية الأطول ستتيح لنا تخطيط الإنتاج بكفاءة أكبر ونقل جزء من التوفير إليكم. كما يمكننا النظر في التحوّل إلى توصيلات فصلية بدلًا من الشهرية، مما سيخفّض تكاليف النقل على الطرفين. أدرك أن هذه المقترحات قد تتطلب موافقة داخلية من جانبكم. يسعدني سماع رأيك، أو أي مقترحات بديلة، قبل اجتماعنا القادم. مع خالص التحيات، شارون فايس، المديرة التجارية","questions":[["What is Sharon's main purpose in writing?","To make a counter-offer linking a lower price to a longer contract","To accept the twelve percent price cut","To end negotiations with Mr. Amar's company","To announce an increase in the unit price"],["What can be inferred about the twelve percent reduction?","Sharon will not accept it under the current terms","It has already been approved by both sides","Sharon originally proposed it herself","It applies only to transport costs"],["How would you describe the tone of the email?","Firm but cooperative","Aggressive and hostile","Submissive and desperate","Casual and dismissive"]]}},{"en":"job interview","he":"ראיון עבודה","ru":"Собеседование","ar":"مقابلة عمل","e":"👔","dialog":true,"items":[{"q":"Tell me about yourself and why you're interested in this particular role.","en":"I'm a project manager with six years in tech, and this role matches my passion for scaling products.","he":"אני מנהל/ת פרויקטים עם שש שנות ניסיון בהייטק, והתפקיד הזה מתאים לתשוקה שלי להצמחת מוצרים.","ru":"Я менеджер проектов с шестилетним опытом в IT, и эта должность соответствует моему увлечению масштабированием продуктов.","ar":"أنا مدير مشاريع بخبرة ست سنوات في التكنولوجيا، وهذا الدور يتوافق مع شغفي بتوسيع المنتجات."},{"q":"What would you say is your greatest weakness?","en":"I used to take on too much myself, but I've learned to delegate and trust my team.","he":"בעבר נטיתי לקחת על עצמי יותר מדי, אבל למדתי להאציל סמכויות ולסמוך על הצוות שלי.","ru":"Раньше я брал/брала слишком много на себя, но научился/научилась делегировать и доверять своей команде.","ar":"كنت أتحمّل الكثير من المهام بنفسي، لكنني تعلّمت التفويض والثقة بفريقي."},{"q":"Tell me about a time you disagreed with your manager. How did you handle it?","en":"I raised my concerns privately, backed them with data, and we agreed on a compromise that worked.","he":"העליתי את החששות שלי בשיחה פרטית, גיביתי אותם בנתונים, והגענו לפשרה שעבדה.","ru":"Я высказал/высказала свои опасения наедине, подкрепил/подкрепила их данными, и мы нашли работающий компромисс.","ar":"طرحت مخاوفي على انفراد، ودعمتها بالبيانات، واتفقنا على حل وسط نجح فعلًا."},{"q":"How do you handle tight deadlines and competing priorities?","en":"I rank tasks by impact and urgency, flag risks early, and renegotiate deadlines when it's truly necessary.","he":"אני מדרג/ת משימות לפי השפעה ודחיפות, מתריע/ה על סיכונים מוקדם, ומשנה מועדים רק כשזה באמת הכרחי.","ru":"Я расставляю задачи по важности и срочности, заранее сообщаю о рисках и пересматриваю сроки, только когда это действительно необходимо.","ar":"أرتّب المهام حسب الأثر والإلحاح، وأنبّه إلى المخاطر مبكرًا، وأعيد التفاوض على المواعيد عند الضرورة فقط."},{"q":"Why are you thinking of leaving your current position?","en":"I've grown a lot there, but I'm now looking for broader responsibility and a more international environment.","he":"צמחתי שם מאוד, אבל עכשיו אני מחפש/ת אחריות רחבה יותר וסביבה בינלאומית יותר.","ru":"Я многому там научился/научилась, но теперь ищу более широкую ответственность и более международную среду.","ar":"لقد تطوّرت كثيرًا هناك، لكنني أبحث الآن عن مسؤوليات أوسع وبيئة عمل أكثر دولية."},{"q":"What are your salary expectations for this position?","en":"Based on my research and experience, I'm looking for something in the range of twenty-five thousand shekels.","he":"על סמך הבדיקה שעשיתי והניסיון שלי, אני מכוון/ת לטווח של בערך עשרים וחמישה אלף שקלים.","ru":"Исходя из моего анализа рынка и опыта, я рассчитываю на сумму порядка двадцати пяти тысяч шекелей.","ar":"بناءً على بحثي وخبرتي، أتطلّع إلى راتب في حدود خمسة وعشرين ألف شيكل."}]}]},{"id":"g2","group":"kids","he":"כיתה ב׳","sub":"מילים ראשונות עם תמונות","e":"🎈","units":[{"en":"shapes","he":"צורות","ru":"фигуры","ar":"الأشكال","e":"🔺","items":[{"en":"circle","he":"עיגול","ru":"круг","ar":"دائرة","e":"🔵"},{"en":"square","he":"ריבוע","ru":"квадрат","ar":"مربّع","e":"🟥"},{"en":"triangle","he":"משולש","ru":"треугольник","ar":"مثلّث","e":"🔺"},{"en":"star","he":"כוכב","ru":"звезда","ar":"نجمة","e":"⭐"},{"en":"heart","he":"לב","ru":"сердце","ar":"قلب","e":"❤️","alt":["hart"]},{"en":"diamond","he":"מעוין","ru":"ромб","ar":"معيّن","e":"🔷"}],"reading":{"en":"I see a red circle. Dan has a yellow star.","he":"אני רואה עיגול אדום. לדן יש כוכב צהוב.","ru":"Я вижу красный круг. У Дана есть жёлтая звезда.","ar":"أرى دائرةً حمراء. لدى دان نجمةٌ صفراء.","questions":[["What color is the circle?","red","blue","green"],["What does Dan have?","a star","a heart","a square"]]}},{"en":"vegetables","he":"ירקות","ru":"овощи","ar":"الخضروات","e":"🥕","items":[{"en":"tomato","he":"עגבנייה","ru":"помидор","ar":"طماطم","e":"🍅"},{"en":"carrot","he":"גזר","ru":"морковь","ar":"جزر","e":"🥕"},{"en":"cucumber","he":"מלפפון","ru":"огурец","ar":"خيار","e":"🥒"},{"en":"corn","he":"תירס","ru":"кукуруза","ar":"ذرة","e":"🌽"},{"en":"potato","he":"תפוח אדמה","ru":"картошка","ar":"بطاطا","e":"🥔"},{"en":"onion","he":"בצל","ru":"лук","ar":"بصل","e":"🧅"}],"reading":{"en":"Noa likes carrots. Omer likes corn. The tomato is red.","he":"נועה אוהבת גזר. עומר אוהב תירס. העגבנייה אדומה.","ru":"Ноа любит морковь. Омер любит куку eadache.","he":"יש לי כאב ראש חזק.","ru":"У меня сильно болит голова.","ar":"عندي صداعٌ شديد.","e":""},{"en":"My throat hurts when I eat.","he":"כואב לי הגרון כשאני אוכל.","ru":"У меня болит горло, когда я ем.","ar":"يؤلمني حلقي عندما آكل.","e":""},{"en":"You must stay in bed today.","he":"אתה חייב להישאר במיטה היום.","ru":"Тебе нужно сегодня лежать в постели.","ar":"يجب أن تبقى في السرير اليوم.","e":""},{"en":"Take this medicine after lunch.","he":"קח את התרופה הזאת אחרי ארוחת הצהריים.","ru":"Принимай это лекарство после обеда.","ar":"خذ هذا الدواء بعد الغداء.","e":""},{"en":"The doctor is checking my ears.","he":"הרופא בודק לי את האוזניים.","ru":"Врач осматривает мои уши.","ar":"الطبيب يفحص أذنيّ.","e":""},{"en":"I feel much better now.","he":"אני מרגיש הרבה יותר טוב עכשיו.","ru":"Сейчас мне намного лучше.","ar":"أشعر بتحسّنٍ كبير الآن.","e":""}],"reading":{"en":"Dan was sick yesterday. He had a fever and a sore throat. His mother took him to the doctor. The doctor said, 'You must drink a lot of water.' Today Dan feels better.","he":"דן היה חולה אתמול. היה לו חום וכאב גרון. אמא שלו לקחה אותו לרופא. הרופא אמר: ״אתה חייב לשתות הרבה מים.״ היום דן מרגיש טוב יותר.","ru":"Вчера Дан болел. У него была температура и болело горло. Мама отвела его к врачу. Врач сказал: «Тебе нужно пить много воды». Сегодня Дану лучше.","ar":"كان دان مريضًا أمس. كانت لديه حمّى والتهابٌ في الحلق. أخذته أمّه إلى الطبيب. قال الطبيب: «يجب أن تشرب الكثير من الماء». اليوم يشعر دان بتحسّن.","questions":[["When was Dan sick?","yesterday","today","last week"],["Who took Dan to the doctor?","his mother","his father","his teacher"],["What must Dan drink?","water","milk","juice"]]}},{"en":"shopping","he":"קניות","ru":"покупки","ar":"التسوّق","e":"🛒","items":[{"en":"How much is this T-shirt?","he":"כמה עולה החולצה הזאת?","ru":"Сколько стоит эта футболка?","ar":"كم ثمن هذا القميص؟","e":""},{"en":"There is a big sale today.","he":"יש היום מבצע גדול.","ru":"Сегодня большая распродажа.","ar":"هناك تخفيضاتٌ ك brother is playing a computer game.","he":"אחי משחק במשחק מחשב.","ru":"Мой брат играет в компьютерную игру.","ar":"أخي يلعب لعبةً على الحاسوب.","e":""},{"en":"Can you send me a message?","he":"אתה יכול לשלוח לי הודעה?","ru":"Можешь прислать мне сообщение?","ar":"هل يمكنك أن ترسل لي رسالة؟","e":""},{"en":"Don't use your phone in class.","he":"אל תשתמש בטלפון בכיתה.","ru":"Не пользуйся телефоном на уроке.","ar":"لا تستخدم هاتفك في الصفّ.","e":""},{"en":"I am watching a video about space.","he":"אני צופה בסרטון על החלל.","ru":"Я смотрю видео о космосе.","ar":"أنا أشاهد فيديو عن الفضاء.","e":""},{"en":"My tablet is newer than my phone.","he":"הטאבלט שלי חדש יותר מהטלפון שלי.","ru":"Мой планшет новее моего телефона.","ar":"جهازي اللوحي أحدث من هاتفي.","e":""},{"en":"You must charge the battery tonight.","he":"אתה חייב להטעין את הסוללה הלילה.","ru":"Тебе нужно зарядить батарею сегодня вечером.","ar":"يجب أن تشحن البطارية الليلة.","e":""}],"reading":{"en":"Lia has a new laptop. She uses it for homework and video calls with her grandma. Her mom says, 'You can use the computer for one hour a day.' After that, Lia reads a book or plays outside.","he":"לליה יש מחשב נייד חדש. היא משתמשת בו לשיעורי בית ולשיחות וידאו עם סבתא שלה. אמא שלה אומרת: ״את יכולה להשתמש במחשב שעה אחת ביום.״ אחרי זה ליה קוראת ספר או משחקת בחוץ.","ru":"У Лии новый ноутбук. Она делает на нём домашние задания и разговаривает по видеосвязи с бабушкой. Мама говорит ей: «Ты можешь пользоваться компьютером один час в день». После этого Лия читает книгу или играет на улице.","ar":"لدى ليا حاسوبٌ محمول جديد. تستخدمه لأداء الواجبات ولمكالمات الفيديو مع جدّتها. تقول أمّها: «يمكنكِ استخدام الحاسوب ساعةً واحدة في اليوم». بعد ذلك، تقرأ ليا كتابًا أو تلعب في الخارج.","questions":[["What does Lia have?","a new laptop","a new phone","a new tablet"],["Who does Lia have video calls with?","her grandma","her teacher","her brother"],["How long can Lia use the computer?","one hour a day","two hours a day","all day"]]}},{"en":"around israel","he":"ברחבי ישראל","ru":"по Израилю","ar":"في أنحاء إسرائيل","e":"🗺️","items":[{"en":"Eilat is hotter than Haifa in summer.","he":"באילת חם יותר מבחיפה בקיץ.","ru":"Летом в Эйлате жарче, чем в Хайфе.","ar":"إيلات أكثر حرارةً من حيفا في الصيف.","e":""},{"en":"Jerusalem is older than Tel Aviv.","he":"ירושלים עתיקה יותר מתל אביב.","ru":"Иерусалим старше Тель-Авива.","ar":"القدس أقدم من تل أبيب.","e":""},{"en":"There are many mountains in the north.","he":"יש הרבה הרים בצפון.","ru":"На севере много гор.","ar":"هناك جبالٌ كثيرة في الشمال.","e":""},{"en":"The Dead Sea is the lowest place on Earth.","he":"ים המלח הוא המקום הנמוך ביותר בעולם.","ru":"Мёртвое море — самое низкое место на Земле.","ar":"البحر الميت هو أخفض مكانٍ على الأرض.","e":""},{"en":"You can swim in the Sea of Galilee.","he":"אפשר לשחות בכנרת.","ru":"В Кинерете можно купаться.","ar":"يمكنك السباحة في بحيرة طبريا.","e":""},{"en":"The Negev is bigger than the Galilee.","he":"הנגב גדול יותר מהגליל.","ru":"Негев больше Галилеи.","ar":"النقب أكبر من الجليل.","e":""}],"reading":{"en":"Dan lives in Haifa, near the sea. His cousin Maya lives in Eilat, in the south. In summer, Eilat is much hotter than Haifa. Maya can see fish in the Red Sea every day. Dan wants to visit her next summer.","he":"דן גר בחיפה, ליד הים. בת הדודה שלו מאיה גרה באילת, בדרום. בקיץ באילת חם הרבה יותר מבחיפה. מאיה יכולה לראות דגים בים סוף כל יום. דן רוצה לבקר אותה בקיץ הבא.","ru":"Дан живёт в Хайфе, у моря. Его двоюродная сестра Майя живёт в Эйлате, на юге. Летом в Эйлате намного жарче, чем в Хайфе. Майя может каждый день видеть рыб в Красном море. Дан хочет навестить её следующим летом.","ar":"يسكن دان في حيفا، قرب البحر. ابنة عمّه مايا تسكن في إيلات، في الجنوب. في الصيف، إيلات أكثر حرارةً بكثير من حيفا. تستطيع مايا أن ترى الأسماك في البحر الأحمر كلّ يوم. يريد دان أن يزورها في الصيف القادم.","questions":[["Where does Maya live?","in Eilat","in Haifa","in Jerusalem"],["Which city is hotter in summer?","Eilat","Haifa","Tel Aviv"],["When does Dan want to visit Maya?","next summer","next week","in winter"]]}}]},{"id":"h10","group":"high","he":"3 יחידות לימוד","sub":"בגרות 3 יח״ל: הבנת הנקרא והבעה","e":"📘","units":[{"en":"technology","he":"טכנולוגיה","ru":"технологии","ar":"التكنولوجيا","e":"💻","items":[{"en":"Smartphones have changed the way we communicate.","he":"הטלפונים החכמים שינו את הדרך שבה אנחנו מתקשרים.","ru":"Смартфоны изменили то, как мы общаемся.","ar":"لقد غيّرت الهواتف الذكية طريقة تواصلنا.","e":"","alt":[]},{"en":"If I had more free time, I would learn to code.","he":"אילו היה לי יותר זמן פנוי, הייתי לומד לתכנת.","ru":"Если бы у меня было больше свободного времени, я бы научился программировать.","ar":"لو كان لديّ وقت فراغ أكثر، لتعلّمتُ البرمجة.","e":"","alt":[]},{"en":"Most apps are designed to keep us online longer.","he":"רוב האפליקציות מתוכננות כדי להשאיר אותנו מחוברים יותר זמן.","ru":"Большинство приложений созданы для того, чтобы мы дольше оставались онлайн.","ar":"صُمّمت معظم التطبيقات لإبقائنا متصلين بالإنترنت لفترة أطول.","e":"","alt":[]},{"en":"Although technology is useful, it can also be addictive.","he":"למרות שהטכנולוגיה שימושית, היא גם עלולה לגרום להתמכרות.","ru":"Хотя технологии полезны, они также могут вызывать зависимость.","ar":"على الرغم من أن التكنولوجيا مفيدة، فإنها قد تسبب الإدمان أيضًا.","e":"","alt":[]},{"en":"You should never share your password with anyone.","he":"אף פעם אל תשתף את הסיסמה שלך עם אף אחד.","ru":"Никогда никому не сообщайте свой пароль.","ar":"يجب ألّا تشارك كلمة مرورك مع أي أحد أبدًا.","e":"","alt":[]},{"en":"Online privacy is becoming a serious concern for teenagers.","he":"פרטיות ברשת הופכת לדאגה רצינית עבור בני נוער.","ru":"Конфиденциальность в интернете становится серьёзной проблемой для подростков.","ar":"أصبحت الخصوصية على الإنترنت مصدر قلق جدي للمراهقين.","e":"","alt":[]}],"reading":{"en":"Noa is sixteen and lives in Haifa. Last year, she noticed that she was spending almost six hours a day on her phone. Her grades were dropping, and she often felt tired in the morning. Therefore, she decided to try a simple experiment: no phone after nine p.m. At first, it was difficult, and she felt that she was missing out. However, after two weeks she was sleeping better and reading more books. Today, Noa still uses her phone, but she feels that she controls it, not the other way around.","he":"נועה בת שש עשרה וגרה בחיפה. בשנה שעברה היא שמה לב שהיא מבלה כמעט שש שעות ביום בטלפון. הציונים שלה ירדו, ולעיתים קרובות היא הרגישה עייפה בבוקר. לכן היא החליטה לנסות ניסוי פשוט: בלי טלפון אחרי תשע בערב. בהתחלה זה היה קשה, והיא הרגישה שהיא מפספסת דברים. עם זאת, אחרי שבועיים היא ישנה טוב יותר וקראה יותר ספרים. היום נועה עדיין משתמשת בטלפון, אבל היא מרגישה שהיא שולטת בו, ולא להפך.","ru":"Ноа шестнадцать лет, она живёт в Хайфе. В прошлом году она заметила, что проводит в телефоне почти шесть часов в день. Её оценки ухудшались, и по утрам она часто чувствовала усталость. Поэтому она решила провести простой эксперимент: никакого телефона после девяти вечера. Сначала было трудно, и ей казалось, что она многое упускает. Однако через две недели она стала лучше спать и больше читать. Сегодня Ноа по-прежнему пользуется телефоном, но чувствует, что это она управляет им, а не наоборот.","ar":"نوعا في السادسة عشرة من عمرها وتعيش في حيفا. في العام الماضي، لاحظت أنها تقضي قرابة ست ساعات يوميًا على هاتفها. كانت علاماتها تتراجع، وكثيرًا ما شعرت بالتعب في الصباح. لذلك قررت أن تجرّب تجربة بسيطة: لا هاتف بعد التاسعة مساءً. في البداية كان الأمر صعبًا، وشعرت بأنها تفوّت أشياء كثيرة. لكن بعد أسبوعين أصبحت تنام بشكل أفضل وتقرأ كتبًا أكثر. اليوم ما زالت نوعا تستخدم هاتفها، لكنها تشعر أنها هي من تتحكم فيه، وليس العكس.","questions":[["Why did Noa start the experiment?","Her phone use was hurting her.","Her parents took her phone.","Her phone was broken.","She wanted a new phone."],["How did Noa feel at the beginning?","She felt she was missing things.","She felt relaxed immediately.","She felt proud and happy.","She felt nothing at all."],["What does the last sentence suggest?","Noa now uses her phone wisely.","Noa stopped using her phone.","Noa's phone controls her life.","Noa bought a better phone."]]}},{"en":"environment","he":"סביבה","ru":"окружающая среда","ar":"البيئة","e":"🌍","items":[{"en":"Plastic bags are banned in many countries today.","he":"שקיות פלסטיק אסורות היום במדינות רבות.","ru":"Сегодня пластиковые пакеты запрещены во многих странах.","ar":"الأكياس البلاستيكية محظورة اليوم في كثير من الدول.","e":"","alt":[]},{"en":"If we recycle more, we will produce less waste.","he":"אם נמחזר יותר, נייצר פחות פסולת.","ru":"Если мы будем больше перерабатывать, у нас будет меньше отходов.","ar":"إذا أعدنا التدوير أكثر، فسننتج نفايات أقل.","e":"","alt":[]},{"en":"Solar energy is widely used in Israel.","he":"אנרגיה סולארית נמצאת בשימוש נרחב בישראל.","ru":"Солнечная энергия широко используется в Израиле.","ar":"تُستخدم الطاقة الشمسية على نطاق واسع في إسرائيل.","e":"","alt":[]},{"en":"We should take public transport instead of driving.","he":"כדאי שניסע בתחבורה ציבורית במקום לנהוג.","ru":"Нам стоит ездить на общественном транспорте, а не на машине.","ar":"ينبغي أن نستخدم وسائل النقل العام بدلًا من القيادة.","e":"","alt":[]},{"en":"Many animals are losing their natural habitats.","he":"בעלי חיים רבים מאבדים את בתי הגידול הטבעיים שלהם.","ru":"Многие животные теряют свою естественную среду обитания.","ar":"تفقد حيوانات كثيرة موائلها الطبيعية.","e":"","alt":[]},{"en":"Saving water is everyone's responsibility, not only the government's.","he":"חיסכון במים הוא אחריות של כולם, לא רק של הממשלה.","ru":"Экономия воды — ответственность каждого, а не только правительства.","ar":"توفير المياه مسؤولية الجميع، وليس الحكومة فقط.","e":"","alt":[]}],"reading":{"en":"Every summer, thousands of Israelis visit the beaches of the Mediterranean. Unfortunately, many of them leave plastic bottles and bags behind. This waste is dangerous for sea turtles, which often mistake plastic bags for jellyfish. In 2022, a group of students from Ashdod started cleaning their local beach every Friday morning. At first, only five students came, but soon more than fifty people joined them. The city was so impressed that it put new recycling bins along the beach. The students believe that small actions can lead to big changes.","he":"בכל קיץ אלפי ישראלים מבקרים בחופי הים התיכון. לצערנו, רבים מהם משאירים מאחור בקבוקים ושקיות פלסטיק. הפסולת הזו מסוכנת לצבי ים, שלעיתים קרובות מתבלבלים בין שקיות פלסטיק למדוזות. ב-2022 קבוצת תלמידים מאשדוד התחילה לנקות את החוף המקומי שלהם בכל יום שישי בבוקר. בהתחלה הגיעו רק חמישה תלמידים, אבל מהר מאוד הצטרפו אליהם יותר מחמישים אנשים. העירייה התרשמה כל כך שהיא הציבה פחי מחזור חדשים לאורך החוף. התלמידים מאמינים שפעולות קטנות יכולות להוביל לשינויים גדולים.","ru":"Каждое лето тысячи израильтян приезжают на пляжи Средиземного моря. К сожалению, многие из них оставляют после себя пластиковые бутылки и пакеты. Этот мусор опасен для морских черепах, которые часто принимают пластиковые пакеты за медуз. В 2022 году группа школьников из Ашдода начала каждую пятницу утром убирать местный пляж. Сначала пришли только пять учеников, но вскоре к ним присоединились более пятидесяти человек. Город был так впечатлён, что установил вдоль пляжа новые контейнеры для переработки. Школьники верят, что маленькие поступки могут привести к большим переменам.","ar":"في كل صيف، يزور آلاف الإسرائيليين شواطئ البحر الأبيض المتوسط. ولسوء الحظ، يترك كثيرون منهم وراءهم زجاجات وأكياسًا بلاستيكية. هذه النفايات خطيرة على السلاحف البحرية التي كثيرًا ما تظن أن الأكياس البلاستيكية قناديل بحر. في عام 2022، بدأت مجموعة من الطلاب من أسدود بتنظيف شاطئهم المحلي صباح كل يوم جمعة. في البداية جاء خمسة طلاب فقط، لكن سرعان ما انضم إليهم أكثر من خمسين شخصًا. أُعجبت البلدية بذلك كثيرًا فوضعت حاويات جديدة لإعادة التدوير على طول الشاطئ. يؤمن الطلاب بأن الأفعال الصغيرة قد تؤدي إلى تغييرات كبيرة.","questions":[["Why is plastic dangerous for sea turtles?","They think it is food.","It makes the water hot.","It blocks their way to the beach.","It scares them away."],["What happened after the students started?","Many more people joined them.","The beach was closed.","The students stopped coming.","The city fined the visitors."],["What is the main message of the text?","Small actions can make a difference.","Israeli beaches are always clean.","Turtles do not live in Israel.","Only cities can solve pollution."]]}},{"en":"media","he":"תקשורת ומדיה","ru":"СМИ","ar":"الإعلام","e":"📰","items":[{"en":"Not everything you read online is true.","he":"לא כל מה שקוראים ברשת נכון.","ru":"Не всё, что вы читаете в интернете, правда.","ar":"ليس كل ما تقرأه على الإنترنت صحيحًا.","e":"","alt":[]},{"en":"Fake news spreads faster than real news.","he":"חדשות כזב מתפשטות מהר יותר מחדשות אמיתיות.","ru":"Фейковые новости распространяются быстрее настоящих.","ar":"تنتشر الأخبار الكاذبة أسرع من الأخبار الحقيقية.","e":"","alt":[]},{"en":"Always check the source before you share a story.","he":"תמיד בדקו את המקור לפני שאתם משתפים ידיעה.","ru":"Всегда проверяйте источник, прежде чем делиться новостью.","ar":"تحقّق دائمًا من المصدر قبل أن تشارك أي خبر.","e":"","alt":[]},{"en":"The interview was watched by millions of people.","he":"הראיון נצפה על ידי מיליוני אנשים.","ru":"Интервью посмотрели миллионы людей.","ar":"شوهدت المقابلة من قِبل ملايين الأشخاص.","e":"","alt":[]},{"en":"In my opinion, influencers have too much power.","he":"לדעתי, למשפיענים יש יותר מדי כוח.","ru":"По-моему, у инфлюенсеров слишком много влияния.","ar":"في رأيي، يملك المؤثرون نفوذًا أكثر من اللازم.","e":"","alt":[]},{"en":"Advertisements often target young people on social media.","he":"פרסומות ברשתות החברתיות מכוונות לעיתים קרובות לצעירים.","ru":"Реклама в соцсетях часто нацелена на молодёжь.","ar":"غالبًا ما تستهدف الإعلانات الشباب على وسائل التواصل الاجتماعي.","e":"","alt":[]}],"reading":{"en":"A few months ago, a video of a 'giant shark' near a Tel Aviv beach went viral. Within hours, it had been shared more than 100,000 times. Some people were so frightened that they refused to go swimming. However, a journalist named Yael decided to investigate. She discovered that the video had been edited and that it had actually been filmed in Australia years earlier. When she published her findings, many people felt embarrassed that they had believed it. Yael says that the best weapon against fake news is a simple question: 'Who made this, and why?'","he":"לפני כמה חודשים, סרטון של 'כריש ענק' ליד חוף בתל אביב הפך לוויראלי. בתוך שעות הוא שותף יותר מ-100,000 פעמים. חלק מהאנשים נבהלו כל כך שסירבו להיכנס למים. עם זאת, עיתונאית בשם יעל החליטה לחקור. היא גילתה שהסרטון נערך ושלמעשה הוא צולם באוסטרליה שנים קודם לכן. כשפרסמה את הממצאים שלה, אנשים רבים הרגישו נבוכים על כך שהאמינו לו. יעל אומרת שהנשק הטוב ביותר נגד חדשות כזב הוא שאלה פשוטה: 'מי יצר את זה, ולמה?'","ru":"Несколько месяцев назад видео с «гигантской акулой» у пляжа в Тель-Авиве стало вирусным. За несколько часов им поделились более 100 000 раз. Некоторые люди так испугались, что отказались купаться. Однако журналистка по имени Яэль решила провести расследование. Она выяснила, что видео было смонтировано и на самом деле снято в Австралии много лет назад. Когда она опубликовала свои выводы, многим стало стыдно, что они в это поверили. Яэль говорит, что лучшее оружие против фейковых новостей — простой вопрос: «Кто это сделал и зачем?»","ar":"قبل بضعة أشهر، انتشر مقطع فيديو لـ«سمكة قرش عملاقة» قرب أحد شواطئ تل أبيب انتشارًا واسعًا. وخلال ساعات، تمت مشاركته أكثر من 100,000 مرة. خاف بعض الناس لدرجة أنهم رفضوا السباحة. لكن صحفية تُدعى ياعيل قررت التحقيق في الأمر. فاكتشفت أن الفيديو كان معدّلًا وأنه صُوّر في الحقيقة في أستراليا قبل سنوات. وعندما نشرت ما توصلت إليه، شعر كثيرون بالحرج لأنهم صدّقوه. تقول ياعيل إن أفضل سلاح ضد الأخبار الكاذبة هو سؤال بسيط: «من صنع هذا، ولماذا؟»","questions":[["Why did some people stop swimming?","They believed the shark video.","The water was too cold.","The police closed the beach.","Yael told them to stay away."],["What did Yael find out?","The video was fake and old.","The shark was very dangerous.","The video was filmed in Tel Aviv.","Nobody had watched the video."],["What does Yael advise people to do?","Ask who created content and why.","Stop using social media.","Avoid swimming in the sea.","Share videos as quickly as possible."]]}},{"en":"health","he":"בריאות","ru":"здоровье","ar":"الصحة","e":"🍎","items":[{"en":"Teenagers need at least eight hours of sleep.","he":"בני נוער צריכים לפחות שמונה שעות שינה.","ru":"Подросткам нужно не менее восьми часов сна.","ar":"يحتاج المراهقون إلى ثماني ساعات من النوم على الأقل.","e":"","alt":[]},{"en":"If you exercise regularly, you will feel more energetic.","he":"אם תתאמן באופן קבוע, תרגיש יותר אנרגטי.","ru":"Если вы будете регулярно заниматься спортом, у вас будет больше энергии.","ar":"إذا مارستَ الرياضة بانتظام، فستشعر بنشاط أكبر.","e":"","alt":[]},{"en":"Too much sugar can lead to serious health problems.","he":"יותר מדי סוכר עלול להוביל לבעיות בריאות רציניות.","ru":"Избыток сахара может привести к серьёзным проблемам со здоровьем.","ar":"قد يؤدي الإفراط في السكر إلى مشاكل صحية خطيرة.","e":"","alt":[]},{"en":"Mental health is just as important as physical health.","he":"בריאות הנפש חשובה בדיוק כמו בריאות הגוף.","ru":"Психическое здоровье так же важно, как и физическое.","ar":"الصحة النفسية لا تقل أهمية عن الصحة الجسدية.","e":"","alt":[]},{"en":"Despite the heat, he goes running every morning.","he":"למרות החום, הוא יוצא לרוץ כל בוקר.","ru":"Несмотря на жару, он бегает каждое утро.","ar":"على الرغم من الحر، يخرج للركض كل صباح.","e":"","alt":[]},{"en":"It's a good idea to talk to someone when you're stressed.","he":"כדאי לדבר עם מישהו כשאתה לחוץ.","ru":"Когда вы в стрессе, полезно с кем-нибудь поговорить.","ar":"من الجيد أن تتحدث إلى أحدٍ ما عندما تكون متوترًا.","e":"","alt":[]}],"reading":{"en":"Omer, a seventeen-year-old from Be'er Sheva, used to drink three energy drinks a day. He believed that they helped him study for his exams. However, he soon began to suffer from headaches and could not fall asleep at night. His doctor explained that energy drinks contain large amounts of caffeine and sugar. She advised him to replace them with water, fruit and short walks. Omer was doubtful at first, but he followed her advice. A month later, he was sleeping well, and to his surprise, his grades had actually improved.","he":"עומר, בן שבע עשרה מבאר שבע, נהג לשתות שלושה משקאות אנרגיה ביום. הוא האמין שהם עוזרים לו ללמוד למבחנים. אולם עד מהרה הוא התחיל לסבול מכאבי ראש ולא הצליח להירדם בלילה. הרופאה שלו הסבירה שמשקאות אנרגיה מכילים כמויות גדולות של קפאין וסוכר. היא המליצה לו להחליף אותם במים, בפירות ובהליכות קצרות. בהתחלה עומר היה ספקן, אבל הוא פעל לפי עצתה. חודש לאחר מכן הוא ישן טוב, ולהפתעתו, הציונים שלו אפילו השתפרו.","ru":"Омер, семнадцатилетний юноша из Беэр-Шевы, раньше выпивал по три энергетических напитка в день. Он считал, что они помогают ему готовиться к экзаменам. Однако вскоре у него начались головные боли, и по ночам он не мог заснуть. Врач объяснила ему, что энергетики содержат большое количество кофеина и сахара. Она посоветовала заменить их водой, фруктами и короткими прогулками. Сначала Омер сомневался, но последовал её совету. Через месяц он уже хорошо спал и, к своему удивлению, даже стал учиться лучше.","ar":"كان عومر، وهو شاب في السابعة عشرة من بئر السبع، يشرب ثلاثة مشروبات طاقة يوميًا. كان يعتقد أنها تساعده على الدراسة لامتحاناته. لكنه سرعان ما بدأ يعاني من الصداع ولم يعد يستطيع النوم ليلًا. أوضحت له طبيبته أن مشروبات الطاقة تحتوي على كميات كبيرة من الكافيين والسكر. ونصحته باستبدالها بالماء والفواكه والمشي لفترات قصيرة. تردّد عومر في البداية، لكنه عمل بنصيحتها. وبعد شهر، أصبح ينام جيدًا، ولدهشته تحسّنت علاماته أيضًا.","questions":[["Why did Omer drink energy drinks?","He thought they helped him study.","His friends forced him to.","He liked the color of the cans.","His doctor recommended them."],["What problems did Omer have?","Headaches and trouble sleeping.","Stomach pain and fever.","Low grades and no friends.","Back pain and tired eyes."],["What surprised Omer?","His grades got better.","His doctor was angry with him.","He liked energy drinks more.","His headaches got worse."]]}},{"en":"volunteering","he":"התנדבות","ru":"волонтёрство","ar":"التطوع","e":"🤝","items":[{"en":"Volunteering helps you develop skills you can't learn at school.","he":"התנדבות עוזרת לפתח כישורים שאי אפשר ללמוד בבית הספר.","ru":"Волонтёрство помогает развить навыки, которым не научишься в школе.","ar":"يساعدك التطوع على تطوير مهارات لا يمكنك تعلّمها في المدرسة.","e":"","alt":[]},{"en":"She has been volunteering at the hospital for two years.","he":"היא מתנדבת בבית החולים כבר שנתיים.","ru":"Она работает волонтёром в больнице уже два года.","ar":"إنها تتطوع في المستشفى منذ عامين.","e":"","alt":[]},{"en":"If you want to make a difference, start in your community.","he":"אם אתה רוצה לחולל שינוי, התחל בקהילה שלך.","ru":"Если хотите что-то изменить, начните со своего окружения.","ar":"إذا أردت أن تُحدث فرقًا، فابدأ بمجتمعك.","e":"","alt":[]},{"en":"Elderly people often suffer from loneliness.","he":"אנשים מבוגרים סובלים לעיתים קרובות מבדידות.","ru":"Пожилые люди часто страдают от одиночества.","ar":"كثيرًا ما يعاني كبار السن من الوحدة.","e":"","alt":[]},{"en":"Giving your time is sometimes more valuable than giving money.","he":"לתת מזמנך שווה לפעמים יותר מלתת כסף.","ru":"Иногда отдать своё время ценнее, чем дать деньги.","ar":"أحيانًا يكون تقديم وقتك أثمن من تقديم المال.","e":"","alt":[]},{"en":"Every student is required to complete a community project.","he":"כל תלמיד נדרש להשלים פרויקט קהילתי.","ru":"Каждый ученик обязан выполнить общественный проект.","ar":"يُطلب من كل طالب إكمال مشروع مجتمعي.","e":"","alt":[]}],"reading":{"en":"In Israel, high school students are required to do sixty hours of community service, known as 'Personal Commitment'. Some students see it as just another task, but for many it becomes a meaningful experience. Tamar, from Jerusalem, chose to volunteer at a centre for children with special needs. At first, she was nervous because she had no experience. Nevertheless, the children welcomed her warmly, and she quickly learned how to help them. She enjoyed it so much that she continued volunteering long after her sixty hours were completed. Now she is thinking about studying special education at university.","he":"בישראל, תלמידי תיכון נדרשים לבצע שישים שעות של שירות לקהילה, המכונה 'מחויבות אישית'. יש תלמידים שרואים בזה עוד משימה, אבל עבור רבים זו הופכת לחוויה משמעותית. תמר מירושלים בחרה להתנדב במרכז לילדים עם צרכים מיוחדים. בהתחלה היא הייתה לחוצה כי לא היה לה ניסיון. למרות זאת, הילדים קיבלו אותה בחום, והיא למדה מהר איך לעזור להם. היא נהנתה כל כך שהמשיכה להתנדב זמן רב אחרי שהשלימה את שישים השעות. עכשיו היא חושבת ללמוד חינוך מיוחד באוניברסיטה.","ru":"В Израиле старшеклассники обязаны выполнить шестьдесят часов общественной работы, известной как «Личное обязательство». Некоторые ученики считают это просто ещё одним заданием, но для многих это становится важным опытом. Тамар из Иерусалима решила стать волонтёром в центре для детей с особыми потребностями. Сначала она нервничала, потому что у неё не было опыта. Тем не менее дети тепло её приняли, и она быстро научилась им помогать. Ей так понравилось, что она продолжала волонтёрить ещё долго после того, как отработала свои шестьдесят часов. Теперь она думает о том, чтобы изучать специальную педагогику в университете.","ar":"في إسرائيل، يُطلب من طلاب المدارس الثانوية أداء ستين ساعة من الخدمة المجتمعية، تُعرف باسم «الالتزام الشخصي». يرى بعض الطلاب في ذلك مجرد مهمة أخرى، لكنه يصبح لكثيرين تجربة ذات معنى. اختارت تمار من القدس أن تتطوع في مركز للأطفال ذوي الاحتياجات الخاصة. في البداية كانت متوترة لأنها لم تكن تملك أي خبرة. ومع ذلك، استقبلها الأطفال بحرارة، وتعلّمت بسرعة كيف تساعدهم. استمتعت بذلك كثيرًا حتى إنها واصلت التطوع بعد إتمام ساعاتها الستين بوقت طويل. وهي تفكر الآن في دراسة التربية الخاصة في الجامعة.","questions":[["How did Tamar feel at the start?","Nervous and inexperienced.","Bored and tired.","Angry with her school.","Confident and relaxed."],["What does 'Nevertheless' show in the text?","A contrast with the previous idea.","A result of the previous idea.","An example of the previous idea.","The order of events in time."],["What can we learn about Tamar's future?","Volunteering may shape her career.","She will stop volunteering soon.","She wants to become a doctor.","She plans to leave Jerusalem."]]}},{"en":"future plans","he":"תוכניות לעתיד","ru":"планы на будущее","ar":"خطط المستقبل","e":"🚀","dialog":true,"items":[{"q":"What do you want to do after high school?","en":"I'm planning to work for a year and save money.","he":"אני מתכנן לעבוד שנה ולחסוך כסף.","ru":"Я планирую поработать год и накопить денег.","ar":"أخطط للعمل لمدة عام وادخار المال."},{"q":"Which subject do you enjoy the most?","en":"I really enjoy biology because I love understanding how things work.","he":"אני מאוד נהנה מביולוגיה כי אני אוהב להבין איך דברים עובדים.","ru":"Мне очень нравится биология, потому что я люблю понимать, как всё устроено.","ar":"أستمتع كثيرًا بالأحياء لأنني أحب أن أفهم كيف تعمل الأشياء."},{"q":"What job would you like to have one day?","en":"I would like to become an engineer and design smart buildings.","he":"הייתי רוצה להיות מהנדס ולתכנן בניינים חכמים.","ru":"Я хотел бы стать инженером и проектировать умные здания.","ar":"أودّ أن أصبح مهندسًا وأصمّم مبانيَ ذكية."},{"q":"Would you prefer to live in a city or a village?","en":"I'd prefer a city because there are more opportunities there.","he":"הייתי מעדיף עיר, כי יש שם יותר הזדמנויות.","ru":"Я бы предпочёл город, потому что там больше возможностей.","ar":"أفضّل المدينة لأن فيها فرصًا أكثر."},{"q":"What will you do if you don't get into your first choice?","en":"If that happens, I will try again or choose another path.","he":"אם זה יקרה, אנסה שוב או אבחר דרך אחרת.","ru":"Если так случится, я попробую снова или выберу другой путь.","ar":"إذا حدث ذلك، فسأحاول مرة أخرى أو أختار طريقًا آخر."},{"q":"Who has influenced your plans the most?","en":"My older sister has influenced me because she followed her dreams.","he":"אחותי הגדולה השפיעה עליי, כי היא הלכה בעקבות החלומות שלה.","ru":"На меня больше всех повлияла старшая сестра, потому что она следовала своей мечте.","ar":"أثّرت فيّ أختي الكبرى لأنها سعت وراء أحلامها."}]}]},{"id":"h11","group":"high","he":"4 יחידות לימוד","sub":"בגרות 4 יח״ל: טקסטים וטיעונים","e":"📗","units":[{"en":"artificial intelligence","he":"בינה מלאכותית","ru":"искусственный интеллект","ar":"الذكاء الاصطناعي","e":"🤖","items":[{"en":"Artificial intelligence is being used in almost every industry.","he":"בינה מלאכותית משמשת כיום כמעט בכל תעשייה.","ru":"Искусственный интеллект используется почти во всех отраслях.","ar":"يُستخدم الذكاء الاصطناعي في كل قطاع تقريبًا.","e":"","alt":[]},{"en":"Many experts warned that AI could replace millions of jobs.","he":"מומחים רבים הזהירו שבינה מלאכותית עלולה להחליף מיליוני משרות.","ru":"Многие эксперты предупреждали, что ИИ может заменить миллионы рабочих мест.","ar":"حذّر كثير من الخبراء من أن الذكاء الاصطناعي قد يحلّ محلّ ملايين الوظائف.","e":"","alt":[]},{"en":"The program that wrote this essay was trained on millions of texts.","he":"התוכנה שכתבה את החיבור הזה אומנה על מיליוני טקסטים.","ru":"Программа, написавшая это сочинение, обучалась на миллионах текстов.","ar":"دُرِّب البرنامج الذي كتب هذا المقال على ملايين النصوص.","e":"","alt":[]},{"en":"My teacher said that we shouldn't rely on chatbots for homework.","he":"המורה שלי אמרה שאסור לנו להסתמך על צ׳טבוטים בשיעורי הבית.","ru":"Учительница сказала, что нам не стоит полагаться на чат-ботов при выполнении домашних заданий.","ar":"قالت معلمتي إنه لا ينبغي لنا الاعتماد على روبوتات الدردشة في الواجبات المنزلية.","e":"","alt":[]},{"en":"AI can analyze data much faster than humans can.","he":"בינה מלאכותית יכולה לנתח נתונים מהר הרבה יותר מבני אדם.","ru":"ИИ может анализировать данные гораздо быстрее, чем люди.","ar":"يستطيع الذكاء الاصطناعي تحليل البيانات أسرع بكثير من البشر.","e":"","alt":[]},{"en":"Who is responsible when a self-driving car causes an accident?","he":"מי אחראי כשמכונית אוטונומית גורמת לתאונה?","ru":"Кто несёт ответственность, если беспилотный автомобиль становится причиной аварии?","ar":"من المسؤول عندما تتسبب سيارة ذاتية القيادة في حادث؟","e":"","alt":[]}],"reading":{"en":"In recent years, AI tools have been introduced into many Israeli schools. Supporters claim that these tools allow each student to learn at his or her own pace. For example, a student who struggles with algebra can receive extra exercises and instant feedback. Critics, however, argue that students who depend on AI may never develop the ability to think independently. They also point out that AI sometimes produces answers which sound convincing but are completely wrong. Most teachers agree that the solution is not to ban AI, but to teach students how to use it critically. As one principal from Netanya put it, 'A calculator did not destroy mathematics, and AI will not destroy learning.'","he":"בשנים האחרונות הוכנסו כלי בינה מלאכותית לבתי ספר רבים בישראל. התומכים טוענים שהכלים האלה מאפשרים לכל תלמיד ללמוד בקצב שלו. לדוגמה, תלמיד שמתקשה באלגברה יכול לקבל תרגילים נוספים ומשוב מיידי. המבקרים, לעומת זאת, טוענים שתלמידים שתלויים בבינה מלאכותית עלולים לעולם לא לפתח את היכולת לחשוב באופן עצמאי. הם גם מציינים שבינה מלאכותית מייצרת לפעמים תשובות שנשמעות משכנעות אבל שגויות לחלוטין. רוב המורים מסכימים שהפתרון אינו לאסור את השימוש בבינה מלאכותית, אלא ללמד את התלמידים להשתמש בה באופן ביקורתי. כפי שניסחה זאת מנהלת בית ספר מנתניה: 'המחשבון לא הרס את המתמטיקה, ובינה מלאכותית לא תהרוס את הלמידה.'","ru":"В последние годы во многих израильских школах начали использовать инструменты искусственного интеллекта. Сторонники утверждают, что эти инструменты позволяют каждому ученику учиться в своём темпе. Например, ученик, которому трудно даётся алгебра, может получать дополнительные упражнения и мгновенную обратную связь. Критики же утверждают, что ученики, зависящие от ИИ, могут так и не научиться мыслить самостоятельно. Они также отмечают, что ИИ иногда даёт ответы, которые звучат убедительно, но совершенно неверны. Большинство учителей согласны, что решение не в том, чтобы запретить ИИ, а в том, чтобы научить учеников пользоваться им критически. Как сказала директор одной школы из Нетании: «Калькулятор не уничтожил математику, и ИИ не уничтожит обучение».","ar":"في السنوات الأخيرة، أُدخلت أدوات الذكاء الاصطناعي إلى كثير من المدارس في إسرائيل. يزعم المؤيدون أن هذه الأدوات تتيح لكل طالب أن يتعلم بالوتيرة التي تناسبه. فعلى سبيل المثال، يمكن للطالب الذي يواجه صعوبة في الجبر أن يحصل على تمارين إضافية وتغذية راجعة فورية. أما المنتقدون فيرون أن الطلاب الذين يعتمدون على الذكاء الاصطناعي قد لا يطوّرون أبدًا القدرة على التفكير المستقل. ويشيرون أيضًا إلى أن الذكاء الاصطناعي ينتج أحيانًا إجابات تبدو مقنعة لكنها خاطئة تمامًا. ويتفق معظم المعلمين على أن الحل ليس في حظر الذكاء الاصطناعي، بل في تعليم الطلاب كيفية استخدامه بشكل نقدي. وكما قالت مديرة مدرسة من نتانيا: «الآلة الحاسبة لم تدمّر الرياضيات، والذكاء الاصطناعي لن يدمّر التعلّم».","questions":[["What advantage of AI do supporters mention?","Students can learn at their own pace.","Teachers can work fewer hours.","Schools can save money on books.","Students no longer need exams."],["What problem do critics point out?","AI answers may be wrong but convincing.","AI is too expensive for schools.","AI tools are too slow.","Students find AI boring."],["Why does the principal mention a calculator?","New tools need not harm learning.","Calculators should be banned in class.","AI is better than calculators.","Algebra is taught with calculators."]]}},{"en":"climate change","he":"שינוי האקלים","ru":"изменение климата","ar":"تغيّر المناخ","e":"🌡️","items":[{"en":"Global temperatures have risen sharply over the past century.","he":"הטמפרטורות בעולם עלו בחדות במהלך המאה האחרונה.","ru":"За последнее столетие глобальная температура резко повысилась.","ar":"ارتفعت درجات الحرارة العالمية بشكل حاد خلال القرن الماضي.","e":"","alt":[]},{"en":"If governments had acted earlier, the damage would have been smaller.","he":"אילו הממשלות היו פועלות מוקדם יותר, הנזק היה קטן יותר.","ru":"Если бы правительства начали действовать раньше, ущерб был бы меньше.","ar":"لو تحرّكت الحكومات في وقت أبكر، لكان الضرر أقل.","e":"","alt":[]},{"en":"Scientists reported that sea levels were rising faster than expected.","he":"מדענים דיווחו שגובה פני הים עולה מהר מהצפוי.","ru":"Учёные сообщили, что уровень моря растёт быстрее, чем ожидалось.","ar":"أفاد العلماء بأن مستوى سطح البحر يرتفع أسرع من المتوقع.","e":"","alt":[]},{"en":"Burning fossil fuels is the main cause of global warming.","he":"שריפת דלקים מאובנים היא הגורם העיקרי להתחממות הגלובלית.","ru":"Сжигание ископаемого топлива — главная причина глобального потепления.","ar":"حرق الوقود الأحفوري هو السبب الرئيسي للاحترار العالمي.","e":"","alt":[]},{"en":"Despite international agreements, emissions continue to increase.","he":"למרות הסכמים בינלאומיים, הפליטות ממשיכות לעלות.","ru":"Несмотря на международные соглашения, выбросы продолжают расти.","ar":"على الرغم من الاتفاقيات الدولية، تستمر الانبعاثات في الازدياد.","e":"","alt":[]},{"en":"Extreme weather events have become more frequent and more severe.","he":"אירועי מזג אוויר קיצוניים הפכו לתכופים וחמורים יותר.","ru":"Экстремальные погодные явления стали более частыми и сильными.","ar":"أصبحت الظواهر الجوية المتطرفة أكثر تكرارًا وشدة.","e":"","alt":[]}],"reading":{"en":"Israel is often described as a world leader in water technology. Decades ago, the country suffered from serious water shortages, which threatened both agriculture and daily life. In response, Israeli engineers developed drip irrigation, a method that delivers water directly to the roots of plants. Later, several large desalination plants were built along the Mediterranean coast. Today, most of the country's drinking water comes from the sea. Nevertheless, experts warn that desalination requires a great deal of energy, which can contribu
