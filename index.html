neration to the next.":"Old customs are given from parents to children, again and again.","Some fear that global culture threatens local languages and customs.":"Some people worry that world culture may kill local languages and ways of life.","The film, which was shot entirely in Jaffa, won an international award.":"The movie was all filmed in Jaffa, and it won a prize from abroad.","Art allows people to express what words cannot.":"Art lets people show feelings that they cannot say in words.","Rarely have so many cultures lived side by side in one place.":"It is unusual to see so many different groups of people living together.","The gap between rich and poor has widened in recent decades.":"In the last years, the difference between rich and poor people got bigger.","Equal opportunities in education are essential for a fair society.":"For things to be fair, all children need the same chance to learn.","It is often argued that social media deepens political divisions.":"Many say social apps make people who think differently fight more.","Unless housing prices drop, young couples will struggle to buy homes.":"If homes don't get cheaper, young couples will find it hard to buy one.","Volunteers play a crucial role in strengthening local communities.":"People who help for free are very important in making neighborhoods stronger.","Tolerance means respecting people whose opinions differ from ours.":"Accepting others means being kind to people who think differently from us.","In my view, uniforms reduce social pressure, although they limit self-expression.":"I think school clothes make kids compare less, but they can't show who they are.","I believe it will, provided that people are retrained for new roles.":"I think so, but only if people learn the skills for new jobs.","Without a doubt, climate change, because its effects will last for centuries.":"For sure the Earth getting hotter, because it will cause harm for hundreds of years.","I partly agree, but education is more effective than banning things.":"I agree a little, but teaching people works better than saying 'no'.","I would listen carefully and then explain my position with evidence.":"I would listen well, then say what I think and show facts that prove it.","I would replace some exams with projects that develop critical thinking.":"I'd change some tests into projects that teach students to think carefully.","The study aims to analyze the impact of social media.":"'Analyze' means study something closely; 'impact' means effect. The study wants to look at how social media changes things.","These factors significantly affect students' academic performance.":"'Factors' are things that cause a result. These things change how well students do at school, a lot.","The researchers identified a clear relationship between the variables.":"'Variables' are things that change in a study. The researchers found the two things are clearly connected.","This approach is widely used in modern psychology.":"'Approach' means a way of doing something. Many psychologists today use this way.","The theory is based on several key assumptions.":"'Assumptions' are ideas people believe are true without proof. The theory starts from a few main ideas like this.","It is essential to evaluate the evidence carefully.":"'Essential' means very important; 'evaluate' means judge. You must check the proof with care.","The abstract gives a short summary of the entire study.":"The 'abstract' is the short part at the start of a research paper that tells what the whole study is about.","Participants were randomly divided into two groups.":"'Participants' are the people in a study. They were put into two groups by chance.","Data were collected through online questionnaires and interviews.":"'Data' means information. The researchers got the information from online forms and by talking to people.","The findings suggest that sleep improves long-term memory.":"'Findings' are the results. The results show that sleep may help you remember things for a long time.","One limitation of this study is the small sample.":"A 'limitation' is a weak point. A weak point of this study: it had only a few people.","Further research is needed to confirm these results.":"We need more studies to be sure these results are correct. Writers often end papers with this sentence.","Dear Dr. Levi, I hope this email finds you well.":"A polite way to start a formal email to a teacher: say hello and wish them well.","I am writing to ask about the assignment deadline.":"Use this to say why you are writing: I want to ask when the work must be handed in.","Would it be possible to receive a short extension?":"A polite way to ask for a little more time to finish your work.","Unfortunately, I was unable to attend last week's lecture.":"'Unable to attend' means could not come. Sadly, I could not come to class last week.","I have attached a medical certificate for your reference.":"'Attached' means added to the email. I added a doctor's note so you can see it.","Thank you for your time, and I look forward to your reply.":"A polite ending for an email: thank you, and I hope you will answer soon.","Today I'm going to talk about renewable energy in Israel.":"A way to start a talk by saying the topic: energy from sun and wind in Israel.","My presentation is divided into three main parts.":"Use this to tell listeners the plan: my talk has three big sections.","As you can see in this slide, sales increased.":"Use this when you point to a slide: look here, the sales went up.","Let me move on to the next point.":"Use this to change to the next topic in a talk.","To sum up, the evidence supports our main hypothesis.":"'To sum up' means to say it short at the end. The facts show our main idea is right.","Thank you for listening; are there any questions?":"A polite way to end a talk and invite people to ask things.","However, the results were not statistically significant.":"'However' means but. 'Not statistically significant' means the results could be by chance, so they do not prove much.","Furthermore, the method is cheaper and easier to use.":"'Furthermore' means also, adding a point. The method also costs less and is simpler.","These results may indicate a link between stress and illness.":"'May indicate' means maybe shows. These results maybe show that stress and sickness are connected.","It seems likely that the policy will be effective.":"'It seems likely' means it will probably happen. The new rule will probably work.","Therefore, the hypothesis was only partly confirmed.":"'Therefore' means so. So the idea was only part true.","In contrast, the second group showed no improvement.":"'In contrast' shows a difference. The other group did not get better.","The graph shows the number of students between 2015 and 2025.":"The picture with lines shows how many students there were from 2015 to 2025.","The number of applicants rose sharply in 2020.":"'Applicants' are people who ask to join. 'Rose sharply' means went up fast. Many more people asked in 2020.","Prices remained stable for most of the year.":"'Remained stable' means stayed the same. Prices did not change much this year.","Unemployment fell gradually from eight to five percent.":"'Fell gradually' means went down slowly. Fewer people had no job: from 8% to 5%.","Women make up about sixty percent of the participants.":"'Make up' means are part of. About 60% of the people in the group are women.","The table compares average salaries in five different countries.":"The table shows the normal pay in five countries, side by side.","I always skim the text before reading it in detail.":"'Skim' means read fast to get the main idea. I read fast first, then slowly.","Underline the main idea in each paragraph.":"Draw a line under the most important idea of each part of the text.","Read all the answers before choosing the best one.":"Look at every choice before you pick the right one. A test tip.","If you don't know a word, guess from the context.":"'Context' means the words around a word. Use them to guess what a new word means.","Our study group meets in the library every Thursday.":"A few students learn together at the library each Thursday.","I need to manage my time better before the finals.":"'Finals' are the last big tests. I must plan my time better before them.","Yes, I'm a first-year student in computer science.":"An answer to 'What do you study?': I am in my first year, learning about computers.","They're interesting, but the reading load is quite heavy.":"An answer about classes: they are fun, but there is a lot to read.","I think it's next to the main library, on the ground floor.":"An answer when someone asks where a place is: near the big library, on the first floor.","I'd love to; when and where do you usually meet?":"Saying yes to an invitation and asking about the time and place.","No, I share an apartment with two friends near campus.":"An answer about where you live: I live with two friends close to the university.","I work part-time at a cafe and play basketball.":"An answer about free time: I have a small job at a cafe, and I play basketball.","Hello, how are you?":"A friendly way to say hi and ask if someone is OK.","I'm fine, thank you.":"An answer to 'How are you?': I am OK, thanks.","Nice to meet you.":"Say this when you meet a new person for the first time.","Good morning.":"Say hello like this before 12 o'clock.","See you later.":"Say this when you leave and will meet again soon.","Have a nice day.":"Say this when you leave someone. You hope their day is good.","My name is Dana.":"Use this to tell people what you are called.","I'm from Israel.":"Use this to tell people your country.","I live in Tel Aviv.":"Use this to say which city your home is in.","I work in sales.":"Use this to say your job: I sell things.","I have two children.":"Use this to say how many kids you have.","I speak a little English.":"'A little' means not much. I know some English.","Can I have a coffee, please?":"A polite way to ask for a coffee.","I'd like a cheese sandwich.":"'I'd like' is a polite way to say 'I want'.","How much is it?":"Ask this to know the price.","Can I pay by card?":"Ask this if you want to pay with a bank card, not cash.","For here or to go?":"The worker asks: will you eat here, or take it with you?","The bill, please.":"Say this when you want to pay at a restaurant.","Do you have this in medium?":"Ask this when you need a different size: not small, not large.","Can I try it on?":"Ask this when you want to put on clothes before you buy them.","It's too expensive.":"'Too expensive' means it costs too much money.","I'm just looking.":"Say this when a worker wants to help but you do not want to buy now.","Where is the fitting room?":"The 'fitting room' is the small room where you put on clothes in a shop.","I'll take it.":"Say this when you decide to buy something.","Excuse me, where is the station?":"A polite way to ask where the train or bus stop is.","Go straight ahead.":"Walk forward. Do not turn.","Turn left.":"Go to the left side.","Turn right at the corner.":"The 'corner' is where two streets meet. Go to the right there.","Is it far from here?":"Ask this to know if you must walk a long way.","It's next to the bank.":"'Next to' means right beside. It is beside the bank.","Where is the check-in?":"'Check-in' is the place where you give your bags and get your ticket for the plane.","Here is my passport.":"Say this when you give your passport to a worker.","I have one suitcase.":"Tell the worker you have one big bag for the plane.","A window seat, please.":"Ask for a seat next to the plane's small window.","My flight is delayed.":"'Delayed' means late. My plane will leave later.","Where is gate twelve?":"A 'gate' is the door where you get on the plane. Ask where number 12 is.","I have a reservation.":"Say this at a hotel: I already asked for a room before.","What time is breakfast?":"Ask when you can eat in the morning.","Can I have a late checkout?":"Ask to leave your room later than the normal time.","The air conditioner doesn't work.":"The machine that makes the room cool is broken.","What's the Wi-Fi password?":"Ask for the secret code to use the internet.","I'd like to check out.":"Say this when you want to leave the hotel and pay.","I don't feel well.":"Say this when you feel sick.","I have a headache.":"A 'headache' is pain in your head.","My throat hurts.":"My throat hurts, for example when I swallow.","Where is the pharmacy?":"Ask where the shop that sells medicine is.","Do you have something for a cold?":"Ask if they have medicine for when you have a runny nose and cough.","How many times a day?":"Ask how many times each day to take the medicine.","Where can I find the milk?":"Ask a worker in which part of the shop the milk is.","I need a bag, please.":"Ask for a bag to carry the things you buy.","Is this on sale?":"'On sale' means cheaper than normal. Is this cheaper today?","Do you have fresh bread?":"'Fresh' means new and good, made today.","Can I pay with cash?":"Ask if you can pay with paper money and coins.","Where is the exit?":"The 'exit' is the way out.","Which bus goes to the city center?":"Ask which bus number goes to the middle of the city.","One ticket, please.":"Say this when you buy one ticket for the bus or train.","When is the next train?":"Ask what time the train after this one comes.","Does this train stop at the airport?":"Ask if the train goes to the airport on its way.","I want to get off here.":"'Get off' means leave the bus or train. I want to leave at this stop.","How long does it take?":"Ask how much time the trip needs.","Before I sign anything, I'd like to go through the contract clause by clause.":"'Clause by clause' means one part at a time. I want to read every part of the contract before signing.","Would you knock a few hundred shekels off the rent if I signed for two years?":"'Knock off' means make the price lower. Will you lower the rent if I stay two years?","Who is responsible for repairs if the boiler breaks down in the middle of winter?":"Ask who must fix things, like the water heater, if they break in winter.","I'd rather not hand over a blank check as a guarantee, if that's all right.":"A 'blank check' is a signed check with no amount. I prefer not to give one as a promise.","Is there an early termination clause in case I need to move out sooner?":"An 'early termination clause' lets you end the contract before its end date. Ask if there is one.","Had I known about the mold, I would never have agreed to move in.":"'Had I known' means if I knew. If I knew about the mold, I would not have moved in.","I'd like to find out why I was charged a fee for a standard transfer.":"'Charged a fee' means asked to pay money. I want to know why I paid for a normal money transfer.","If I pay off the loan early, will there be a penalty?":"'Pay off' means pay all of it. A 'penalty' is extra money you must pay as punishment.","My account is overdrawn, and I'd like to discuss a temporary credit line.":"'Overdrawn' means I took out more money than I had. I want to talk about borrowing for a short time.","We're trying to cut back on spending so we can put money aside every month.":"'Cut back' means spend less; 'put money aside' means save. We want to save each month.","Could you walk me through the difference between a fixed and a variable rate?":"'Walk me through' means explain step by step. A fixed rate stays the same; a variable rate can change.","I didn't authorize this payment, so I'd like to dispute it right away.":"'Authorize' means allow. 'Dispute' means say it is wrong. I did not allow this payment, so I object now.","I'm afraid this isn't what I ordered, and I'd like it sorted out today.":"'I'm afraid' is a polite way to give bad news. 'Sorted out' means fixed. This is the wrong item; please fix it today.","I understand it's not your fault, but I've been passed from one department to another.":"'Passed from one department to another' means sent from person to person, and no one helped.","According to consumer protection law, I'm entitled to cancel within fourteen days.":"'Entitled to' means have the right to. The law says I can cancel in the first 14 days.","Store credit won't do me much good, so I'd prefer a full refund.":"'Store credit' is money you can spend only in that shop. I want my money back instead.","If the issue isn't resolved by Friday, I'll have to take it further.":"'Resolved' means fixed. 'Take it further' means complain to someone higher, maybe go to court.","Could you put that in writing so I have a record of our conversation?":"Ask for a written copy of what you agreed, so you have proof.","I don't think we've been properly introduced; I'm a friend of the groom's.":"'Properly introduced' means formally told each other's names. I know the man getting married.","I'd love to stay longer, but I have to be up early tomorrow.":"A polite way to leave a party: I want to stay, but I must wake up early.","You might have a point, although I see it a little differently.":"A polite way to disagree: you may be right, but I think a bit differently.","Sorry, your name has completely slipped my mind; could you remind me?":"'Slipped my mind' means I forgot. Sorry, I forgot your name; please tell me again.","We should get together sometime; I'll drop you a message next week.":"'Get together' means meet. 'Drop you a message' means send you a short note.","I'm not really one for big parties, but this one turned out to be great.":"'Not one for' means I don't usually like. I don't like big parties, but this one was great.","I've been feeling run down for weeks, and I can't seem to shake it off.":"'Run down' means tired and weak. 'Shake it off' means make it go away. I feel weak and can't get better.","Is there any chance of an earlier appointment if someone cancels?":"Ask if you can come sooner if another patient cancels.","Could you explain the side effects before I start taking this medication?":"'Side effects' are bad things a medicine can cause. Please tell me before I start.","The pain comes and goes, but it gets worse when I lie down.":"'Comes and goes' means it stops and starts again. It hurts more when I lie in bed.","I'd like a referral to a specialist, just to rule out anything serious.":"A 'referral' is a doctor's paper sending you to an expert. 'Rule out' means make sure it is not something.","Does my health fund cover this test, or will I have to pay privately?":"Ask if your health fund pays for the test, or if you must pay yourself.","From what I've read, the new policy is likely to push housing prices even higher.":"From what I read, the new rule will probably make homes cost even more.","I take headlines like that with a pinch of salt until I see the full story.":"'With a pinch of salt' means not fully believing. I don't believe such titles until I know more.","It's hard to tell whether the report is biased or simply incomplete.":"'Biased' means unfair to one side. It's hard to know if the report is unfair or just missing parts.","Whatever your political views, the rising cost of living affects everyone.":"'Whatever your views' means it doesn't matter what you think. Higher prices hurt all people.","I've stopped following the news so closely because it was affecting my mood.":"I stopped reading the news so much because it made me feel bad.","The minister's announcement raised more questions than it actually answered.":"The minister's news made people ask more than it explained.","I've already submitted this form twice, and both times it apparently got lost.":"I gave this paper two times already, and it seems they lost it both times.","Could you tell me exactly which documents I need to bring next time?":"Ask for the full list of papers you must bring next time.","I'd like to appeal the decision, since I believe the property tax was miscalculated.":"'Appeal' means ask to change a decision. 'Miscalculated' means counted wrong. I think the tax is wrong.","The insurance company keeps asking for more paperwork instead of processing my claim.":"'Paperwork' means forms and papers. 'Processing my claim' means dealing with my request for money.","Is it possible to handle this online, or do I have to come in person?":"Ask if you can do this on the internet, or if you must go there.","If I'd filled in the form correctly the first time, I'd have saved weeks.":"If I filled in the form right the first time, I would have saved weeks.","Thanks for making the time; to be honest, he's seemed a bit withdrawn at home lately.":"'Withdrawn' means quiet and not wanting to talk. Thank you for meeting; he seems quiet at home lately.","He hasn't said much, but I suspect he's still struggling to fit in with the new group.":"'Struggling to fit in' means finding it hard to feel part of the group.","Would it be possible to seat him next to someone who might help him feel included?":"Ask the teacher to put him beside a child who can help him feel welcome.","That sounds great; he really comes alive when he's given responsibility for something practical.":"'Comes alive' means becomes happy and active. He loves having a real job to do.","His grandmother passed away in the summer, and I think it hit him harder than he lets on.":"'Passed away' means died. 'Hit him harder than he lets on' means he is more sad than he shows.","Definitely; in the meantime, please don't hesitate to message me if anything comes up.":"'Don't hesitate' means please feel free. Write to me if anything happens.","I work as a nurse at a hospital in Haifa, mostly on night shifts.":"An answer about your job: I take care of sick people at a hospital, mostly at night.","About three years now, and I really like how quiet and green it is.":"An answer to 'How long have you lived here?': three years, and I like that it's calm with many trees.","I usually go hiking with friends, and on Saturday evenings I visit my parents.":"An answer about free time: I walk in nature with friends and see my parents on Saturday nights.","I grew up in a small town in the north, but I moved to Tel Aviv for university.":"'Grew up' means lived as a child. I was a child in a small town, then moved for my studies.","Yes, I've been learning the guitar for about a year, though I'm still pretty bad at it.":"I play guitar for one year now, but I don't play well yet.","Nice meeting you too, let me give you my number so we can stay in touch.":"A friendly goodbye: I'll give you my phone number so we can talk again.","Yes, we booked a table for four under the name Cohen for eight o'clock.":"'Booked' means saved before. We saved a table for four people at eight, name Cohen.","I think we're ready, but could you tell us which dishes are vegetarian first?":"Ask which food has no meat before you order.","Medium, please, and could I have a salad instead of the fries on the side?":"An answer about how to cook meat: in the middle. And can I get salad, not fries?","Actually, I ordered the fish, but the waiter brought me chicken by mistake.":"Tell the worker you got the wrong food: you asked for fish but got chicken.","Yes, please, but if it takes too long, I'd rather just cancel it.":"Yes, but if I must wait a long time, I prefer not to get it.","No thanks, we're full, so could we just have the check and pay separately?":"We ate enough. 'The check' means the bill. We want to pay each for ourselves.","I'm looking for a warm winter jacket, preferably something waterproof and not too heavy.":"'Waterproof' means water can't get in. I want a warm coat that is not heavy.","Usually a medium, but it depends on the brand, so I'd like to try it on.":"An answer about your size: often medium, but it changes, so I want to put it on first.","That sounds great, but do you have the same model in dark blue instead?":"I like it, but do you have the same one in a dark blue color?","I bought these shoes last week, but they're too small, so I'd like to return them.":"'Return' means bring back to the shop. The shoes I bought are too small.","Yes, here it is, and the shoes are unworn and still in the original box.":"'Unworn' means never used. Here is the receipt; the shoes are new and in the box.","I'd prefer a refund to my credit card, since I couldn't find anything else I liked.":"I want the money back on my card, because I didn't find anything else.","Sure, I have five years of experience in customer service, mostly at a large tech company.":"An answer about your experience: I helped customers for five years at a big tech company.","I admire your products, and I'm looking for a place where I can keep learning and growing.":"An answer to 'Why us?': I like what you make and want to keep learning here.","I'm very organized and calm under pressure, which helps me handle several projects at once.":"An answer about strengths: I plan well and stay calm when things are hard.","Once a client was very angry about a delay, so I called him and offered a solution.":"An answer about a hard moment: a customer was angry, so I called and fixed it.","I hope to lead a small team and take on more responsibility within the company.":"An answer about the future: I want to manage a small team and do more.","Yes, could you tell me what a typical day looks like and when you expect to decide?":"Questions for the interviewer: what is a normal workday, and when will you choose?","Hi, I'd like to make an appointment with the doctor sometime next week, if possible.":"Use this on the phone to ask for a time to see the doctor next week.","Unfortunately I'm at work then, so do you have anything later in the afternoon?":"That time is bad because I'm working; do you have a later time?","Of course, my name is Dana Mizrahi, and I'll spell my last name for you.":"Of course, here is my name, and I'll say my family name letter by letter.","Yes, please ask her to call me back this afternoon about the contract we discussed.":"Please tell her to phone me today after 12 about the contract.","Sure, I said I need to move my appointment from Thursday to the following Monday.":"I said I need to change my visit from Thursday to the next Monday.","No, that's everything, thanks, and could you send me a text message to confirm the time?":"That's all; please send me a phone message with the time.","We're thinking about renting a car and driving around northern Italy for about ten days.":"An answer about holiday plans: we want to rent a car and drive in north Italy for ten days.","Not yet, because prices keep changing, so I'm waiting for a good deal before I book.":"An answer to 'Did you book?': not yet; I'm waiting for a cheaper price.","I prefer an apartment, since we can cook breakfast and it's usually cheaper for families.":"I like an apartment more, because we can make breakfast and it costs less for families.","I'd love to see the old town first, and then maybe find a nice place for lunch.":"The 'old town' is the old part of a city. I want to see it, then eat lunch.","Probably our trip to Japan two years ago, because the food and the people were amazing.":"An answer about your best trip: Japan two years ago, because of the food and people.","I'd love to, but let me check my schedule first and get back to you tomorrow.":"'Get back to you' means answer later. I want to, but I'll check my plans and tell you tomorrow.","I've had a bad headache and a sore throat for three days, and it's getting worse.":"Tell the doctor your problem: my head and throat hurt for three days and it's worse now.","Yes, last night it was almost thirty-nine degrees, and I couldn't sleep at all.":"Yes, last night my temperature was almost 39 degrees, so I couldn't sleep.","Only something for my blood pressure, which I take every morning with breakfast.":"An answer about medicine: only a pill for my blood pressure, every morning.","I'm allergic to penicillin, so please don't prescribe me anything that contains it.":"'Allergic' means my body reacts badly to it. Don't give me medicine with penicillin.","Should I take it before or after meals, and can I still go to work?":"Ask if you take the medicine before or after eating, and if you can work.","Thank you, doctor, and could you also give me a sick note for my employer?":"A 'sick note' is a paper from the doctor saying you were too sick to work.","Yes, I have a reservation for three nights under the name Avraham, with breakfast included.":"Say this at the front desk: I saved a room for three nights, with breakfast.","Thanks, and could you tell me what time breakfast is served and where the restaurant is?":"Ask when and where you can eat breakfast at the hotel.","Hi, the air conditioning in room 512 isn't working, and it's really hot in here.":"Tell the hotel the machine that cools room 512 is broken and it's very hot.","I'd appreciate that, because this is the second time I've called about the same problem.":"'I'd appreciate that' means thank you, please do. This is my second call about it.","Actually, the room is also very noisy at night, so could we move to a quieter one?":"The room is loud at night; can we change to a calmer room?","The staff were lovely, but because of the broken air conditioner, I expected some kind of discount.":"The workers were nice, but the cooling was broken, so I want to pay less.","I don't think we've been formally introduced; I'm heading the analytics team.":"'Formally introduced' means officially told names. 'Heading' means leading. I lead the data team.","Would you mind if I reached out next week to explore possible synergies?":"'Reach out' means contact. 'Synergies' means ways we can work well together.","A mutual colleague suggested I get in touch regarding your expansion plans.":"'Mutual colleague' means a work friend we both know. They told me to contact you about growing your business.","I'd be happy to put you in touch with our head of procurement.":"'Put you in touch' means connect you. I can connect you with the person who buys for our company.","What I find most rewarding about my role is translating data into strategy.":"'Rewarding' means makes me feel good. I like turning numbers into plans most of all.","It was a pleasure meeting you; let's continue this conversation over coffee sometime.":"A polite goodbye at a business event: let's talk more over coffee later.","Let's make sure we stick to the agenda so we can finish on time.":"The 'agenda' is the list of topics. Let's talk only about these so we end on time.","Before we move on, does anyone have any concerns they'd like to raise?":"'Raise concerns' means say worries. Before the next topic, does anyone have a problem?","I'm afraid we're running short on time, so let's park that issue for now.":"'Running short on time' means not much time left. 'Park that' means talk about it later.","Could you briefly bring everyone up to speed on where things stand?":"'Bring up to speed' means tell the latest news. 'Where things stand' means the situation now.","To sum up, we've agreed to postpone the launch until early next quarter.":"'Postpone' means move to later. In short, we will start next season, not now.","I'll circulate the minutes and action items by the end of the day.":"'Circulate' means send to everyone. 'Minutes' are the notes of a meeting. I'll send them today.","I'm writing to follow up on my previous email regarding the revised contract.":"'Follow up' means write again about something. I'm writing again about the changed contract.","Please find attached the updated proposal for your review and approval.":"'Find attached' means look at the file in this email. Here is the new offer to read and accept.","I'd appreciate it if you could get back to me by Thursday afternoon.":"A polite way to ask: please answer me by Thursday after 12.","Apologies for the delayed response; I've only just returned from annual leave.":"Sorry I answered late; I just came back from my holiday.","Could you kindly clarify whether the price includes installation and ongoing support?":"'Clarify' means make clear. Does the price include setting it up and help later?","Should you have any further questions, please don't hesitate to contact me.":"A polite email ending: if you want to ask more, please write to me.","Sorry, you cut out for a moment; could you repeat the last point?":"'You cut out' means your voice stopped on the call. Please say the last part again.","I think you're on mute; we can see you but can't hear you.":"'On mute' means your sound is off. We see you, but we don't hear you.","Let me share my screen so everyone can see the latest figures.":"'Share my screen' means show my computer to everyone on the call.","My connection seems unstable, so I'll switch off my camera for now.":"My internet is weak, so I'll turn off my video for now.","Since we're in different time zones, let's agree on core overlap hours.":"'Time zones' are areas with different clock times. Let's agree on hours when we all work.","I'll drop the link in the chat so you can review the document later.":"'Drop the link in the chat' means put the web address in the call's messages.","Would it be possible to push our meeting back to Wednesday morning?":"'Push back' means move to a later time. Can we meet Wednesday morning instead?","Realistically, we'll need at least two more weeks to finish the testing phase.":"'Realistically' means being honest about what's possible. We need two more weeks for testing.","I'm fully booked on Tuesday, but I could squeeze in a short call Thursday.":"'Fully booked' means no free time. 'Squeeze in' means find a little time for.","Given the tight deadline, we may need to prioritise the most critical features.":"'Tight deadline' means little time. 'Prioritise' means do the most important things first.","Let's set a firm deadline and schedule a check-in halfway through the project.":"A 'firm deadline' can't change. A 'check-in' is a short meeting to see progress.","If we fall behind schedule, I'll let you know as early as possible.":"'Fall behind schedule' means be late. If we are late, I'll tell you early.","What are the main challenges your team is facing with your current supplier?":"Ask a customer what problems they have now with the company that sells to them.","I completely understand your concern about the budget, so let me explain the options.":"I understand you worry about money, so I'll tell you the choices.","Our solution typically pays for itself within the first six months of use.":"'Pays for itself' means it saves as much money as it costs, here in six months.","Would you be interested in a free trial before making a final decision?":"Would you like to try it for free before you decide?","I'd like to check in and see how you're getting on with the new system.":"'Check in' means ask how things are. How is the new system going for you?","We can offer a ten percent discount if you commit to an annual contract.":"'Commit to' means promise. We take off 10% if you sign for one full year.","I'd like to begin by giving you a brief overview of our quarterly performance.":"An 'overview' is a short general picture. I'll start with a quick look at the last three months.","As you can see from this chart, sales rose sharply in the second quarter.":"Use this to point to a chart: sales went up fast in the second three months.","This figure is slightly misleading, so let me put it into context.":"'Misleading' means it may give the wrong idea. 'Put it into context' means explain the full picture.","Although revenue fell short of target, our profit margins actually improved considerably.":"'Fell short of target' means missed the goal. But we kept more money from each sale.","That's a great question, and I'll come back to it at the end.":"A polite way to delay a question: good question; I'll answer it at the end.","To wrap up, I'd like to highlight three key takeaways from today's results.":"'To wrap up' means to finish. 'Takeaways' are the main things to remember.","I'm very sorry for the inconvenience, and I'll look into this right away.":"'Inconvenience' means trouble. I'm sorry for the trouble; I'll check it now.","I can see why you'd be frustrated, and I really appreciate your patience.":"I understand why you are angry, and thank you for waiting.","Could you give me your order number so I can check the details?":"Ask for the order number to look at the information.","As a goodwill gesture, we'd like to offer you a full refund.":"A 'goodwill gesture' is something kind you give to show you care. We will give all your money back.","I'll escalate this to our technical team and update you within forty-eight hours.":"'Escalate' means send to a higher level. I'll tell you news in two days.","Is there anything else I can help you with before we finish today?":"A polite way to end a service call: can I help with anything more?","I see where you're coming from, but that price is beyond our budget.":"'I see where you're coming from' means I understand you. But it costs more than we can pay.","If you could extend the payment terms, we might be able to increase our order.":"'Extend the payment terms' means give more time to pay. Then we might buy more.","Let's try to find a solution that genuinely works for both sides.":"Let's find an answer that is good for both of us.","Would you be willing to meet us halfway on the delivery costs?":"'Meet us halfway' means each side pays half. Will you share the delivery costs?","I'm afraid that's not something we can agree to at this stage.":"A polite way to say no: we can't accept that now.","Before we finalise anything, I need to run these terms by our legal team.":"'Finalise' means make final. 'Run by' means show to check. Our lawyers must check first.","I'm a project manager with six years in tech, and this role matches my passion for scaling products.":"An introduction: I manage projects in tech for six years, and I love growing products.","I used to take on too much myself, but I've learned to delegate and trust my team.":"An answer about a weakness: I did too much alone, but now I give tasks to my team.","I raised my concerns privately, backed them with data, and we agreed on a compromise that worked.":"An answer about disagreement: I spoke privately, showed numbers, and we found a middle way.","I rank tasks by impact and urgency, flag risks early, and renegotiate deadlines when it's truly necessary.":"An answer about priorities: I do the most important and urgent things first and warn early.","I've grown a lot there, but I'm now looking for broader responsibility and a more international environment.":"An answer to 'Why leave?': I learned a lot, but I want more duties in a global company.","Based on my research and experience, I'm looking for something in the range of twenty-five thousand shekels.":"An answer about pay: I'm hoping for about 25,000 shekels.","I was on the fence about the job offer, but I finally made up my mind.":"'On the fence' means not able to decide. I couldn't decide about the job, but now I have.","Let's not beat around the bush; the project is behind schedule and over budget.":"'Beat around the bush' means avoid saying something directly. Let's be honest: the project is late and costs too much.","Moving to Haifa was a blessing in disguise, even though it felt awful at first.":"'A blessing in disguise' means something bad that later turns out good.","She's been under the weather all week, so let's give her some breathing room.":"'Under the weather' means a bit sick. 'Breathing room' means space and time. Let's not push her.","Don't jump to conclusions until you've heard the whole story from both sides.":"'Jump to conclusions' means decide too fast. Wait until you hear everything.","After months of arguing, we finally agreed to bury the hatchet and move on.":"'Bury the hatchet' means stop fighting and be friends again.","Could you look into the billing issue and get back to me by Thursday?":"'Look into' means check. 'Get back to me' means answer me. Check the bill problem and tell me by Thursday.","We need to iron out a few details before we sign the contract.":"'Iron out' means fix small problems. We must fix a few details before signing.","The meeting was called off at the last minute because the client fell ill.":"'Called off' means canceled. 'Fell ill' means got sick.","I'll fill in for Dana while she's on maternity leave next month.":"'Fill in for' means do someone's job for a short time. I'll do Dana's job while she's with her new baby.","Management has decided to phase out the old software by the end of the year.":"'Phase out' means stop using slowly. The company will stop using the old program this year.","If we cut back on travel expenses, we can avoid laying off any staff.":"'Cut back on' means spend less on. 'Lay off' means fire workers. Spending less helps keep all jobs.","As far as I'm concerned, the proposal raises more questions than it answers.":"'As far as I'm concerned' means in my opinion. The plan makes people ask more than it explains.","I take your point, but I'm not entirely convinced the numbers add up.":"'I take your point' means I understand you. 'Add up' means make sense. I'm not sure the numbers are right.","With all due respect, I think you're overlooking the long-term costs of this plan.":"'With all due respect' is a polite way to disagree. 'Overlooking' means not seeing. You forget the future costs.","I'd go so far as to say that this decision could backfire on us.":"'Go so far as to say' means say strongly. 'Backfire' means have the opposite, bad result.","That's a fair argument, although I'd see things slightly differently myself.":"A polite way to disagree: that's a good point, but I think a bit differently.","Not only is the plan expensive, but it's also unlikely to work in practice.":"'Not only... but also' adds a second point: the plan costs a lot and also won't work.","Had I known how addictive the app was, I'd never have downloaded it.":"'Had I known' means if I knew. 'Addictive' means hard to stop using. I would not have gotten the app.","Smartphones have blurred the line between work time and personal time for many people.":"'Blurred the line' means made the difference unclear. Phones mix work time and home time.","It is widely believed that algorithms shape our opinions more than we realise.":"Many people think computer programs change what we believe more than we know.","Critics argue that constant connectivity is eroding our ability to concentrate deeply.":"'Eroding' means slowly destroying. Critics say being online all the time hurts our focus.","Online privacy is something most people take for granted until it's too late.":"'Take for granted' means not value until you lose it. People don't think about privacy until it's gone.","The new regulations are a step in the right direction, but they don't go far enough.":"'A step in the right direction' means good progress. But the new rules are still not strong enough.","People tend to overestimate how much others notice their mistakes in public.":"'Overestimate' means think something is bigger than it is. We think people see our mistakes more than they do.","He's quick to criticise others, yet he can't take criticism himself.":"He criticizes people fast, but he gets upset when others criticize him.","Procrastination is often less about laziness and more about fear of failure.":"'Procrastination' means delaying things. It often comes from being afraid to fail, not from being lazy.","If I'd slept better last night, I wouldn't be so irritable right now.":"'Irritable' means easily angry. If I slept well, I wouldn't feel so angry now.","She tends to bottle up her feelings until she eventually snaps over something small.":"'Bottle up' means keep feelings inside. 'Snaps' means suddenly gets angry.","We're far more likely to stick to a habit when we track our progress.":"'Stick to a habit' means keep doing it. Writing down your progress helps.","Unless we act now, rising temperatures will hit the poorest communities the hardest.":"'Unless we act now' means if we don't do something now. Hotter weather will hurt poor people most.","Recycling alone won't solve the problem; we need to consume far less overall.":"Recycling is not enough; we must buy and use much less.","The company was accused of greenwashing after exaggerating its environmental achievements.":"'Greenwashing' means pretending to be good for nature. The company said it did more than it did.","Solar energy makes perfect sense in a country with as much sunshine as Israel.":"'Makes perfect sense' means is very logical. Israel has lots of sun, so sun power is smart.","It's estimated that the city will face severe water shortages within two decades.":"'It's estimated' means people guess. The city may not have enough water in 20 years.","Little did we realise how quickly the coastline would change in our lifetime.":"'Little did we realise' means we didn't know at all. The beach changed fast in our lives.","The film received rave reviews, but I found the plot rather predictable and slow.":"'Rave reviews' means very good opinions. 'Predictable' means you know what will happen. I found it boring.","Public funding for the arts is often the first thing to go in a crisis.":"When there is a crisis, the government often stops giving money to art first.","Her latest exhibition really struck a chord with younger visitors at the museum.":"'Struck a chord' means made people feel something. Young visitors loved her new show.","I'm not much of a theatre buff, but that play completely blew me away.":"A 'theatre buff' loves theatre. 'Blew me away' means I was amazed.","Some critics claim that streaming has lowered the quality of television, but I disagree.":"Some critics say watching TV online made shows worse, but I don't think so.","The novel is said to have been inspired by the author's childhood in Jaffa.":"'Is said to have been inspired' means people say the idea came from the writer's early life in Jaffa.","I'd argue productivity depends more on management than location; many remote teams actually outperform office-based ones.":"'Outperform' means do better than. Good managers matter more than place; some home teams work better.","That's a bit sweeping; it certainly has downsides, but it also connects people and spreads vital information.":"'Sweeping' means too general. It has bad sides, but it also connects people and shares news.","Experience is invaluable, but for some professions, like medicine or engineering, a degree is genuinely essential.":"'Invaluable' means very valuable. Experience is great, but doctors and engineers really need a degree.","Banning it outright seems extreme; smarter regulation could protect residents while still supporting local businesses.":"'Banning it outright' means stopping it completely. Better rules could help people and shops.","I'm not so sure; history suggests technology transforms jobs rather than eliminating them, so adaptable skills matter more than ever.":"'Transforms' means changes. In the past, technology changed jobs, so we must be ready to learn new skills.","Every generation says that, though; kids today face different pressures, and in many ways they're remarkably resilient.":"'Resilient' means strong after hard times. Kids today have different problems and are very strong.","The subsequent experiments confirmed the results of the original study conducted in 2019.":"Subsequent = coming later. Later experiments showed the 2019 study's results were correct.","A considerable number of participants withdrew from the study before it was completed.":"Considerable = large. Many people left the study before it ended.","Some economists believe that a period of slower growth is now almost inevitable.":"Inevitable = sure to happen. Some economists think slower growth will almost surely come.","Repeated budget cuts may seriously undermine the quality of public education.":"Undermine = make weaker. Cutting money again and again can hurt public schools.","The report provides a comprehensive review of research on childhood nutrition.":"Comprehensive = complete, covering everything. The report looks at all research on children's food.","Many English words derive from Latin, either directly or through French.":"Derive from = come from. Many English words come from Latin, sometimes through French.","Fresh water is becoming increasingly scarce in many parts of the Middle East.":"Scarce = hard to find, not enough. There is less and less fresh water in the Middle East.","The effect of the medication tends to diminish after several weeks of use.":"Diminish = become smaller. The medicine usually works less after a few weeks.","Historians attribute the decline of the empire to a combination of economic factors.":"Attribute to = say something was caused by. Historians say money problems made the empire weaker.","Solar energy has become a viable alternative to coal in sunny countries like Israel.":"Viable = can work well. In sunny countries, solar energy can really replace coal.","Vitamin D deficiency is surprisingly prevalent, even in regions with plenty of sunshine.":"Prevalent = common; deficiency = not enough. Many people lack vitamin D, even in sunny places.","The notion that intelligence is fixed at birth has been rejected by most researchers.":"Notion = idea. Most researchers say intelligence is not fixed when you are born.","The theory was widely criticized; nevertheless, it continued to influence research for decades.":"Nevertheless = but still. Many criticized the theory, but it still influenced research for years.","Whereas the first group improved steadily, the second group showed no measurable progress.":"Whereas = while (shows contrast). The first group got better; the second group did not.","Despite the high cost of the treatment, many patients chose to continue with it.":"Despite = even with. The treatment was expensive, but many patients continued it.","Although the sample was small, the findings were consistent with earlier research.":"Although = even though. The study was small, but the results matched older studies.","Urban residents earn more on average; conversely, they also face much higher living costs.":"Conversely = on the opposite side. City people earn more, but living there costs much more.","The method is fast and cheap; on the other hand, it is not always accurate.":"On the other hand = shows the opposite point. The method is quick and cheap, but sometimes wrong.","The factory was closed due to repeated violations of environmental regulations.":"Due to = because of. The factory closed because it broke environment rules many times.","Rising sea temperatures have given rise to more frequent and intense storms.":"Give rise to = cause. Warmer seas cause more and stronger storms.","Many health problems in old age stem from habits formed in early adulthood.":"Stem from = come from, be caused by. Habits from young adulthood cause many health problems later.","The drug had serious side effects; consequently, it was withdrawn from the market.":"Consequently = as a result. The drug was dangerous, so it was taken off the market.","The data were incomplete, and the conclusions of the study are thus questionable.":"Thus = so, therefore. The data were missing parts, so the conclusions may be wrong.","Prices rose sharply during the drought; hence, many families reduced their food purchases.":"Hence = so, for this reason. Prices went up a lot, so families bought less food.","Not until the late nineteenth century did scientists understand how diseases spread.":"Not until = only at that time. Scientists first understood how diseases spread in the late 1800s.","Hardly any of the original documents survived the fire that destroyed the archive.":"Hardly any = almost none. Almost all the old documents burned in the fire.","The bridge was designed by an engineer who had never built anything of that size.":"The engineer who planned the bridge had never built anything so big before.","It is unlikely that the new policy will have any effect on unemployment.":"Unlikely = probably not. The new policy probably won't change the number of people without jobs.","Few researchers would dispute the claim that smoking increases the risk of cancer.":"Dispute = argue against. Almost all researchers agree smoking makes cancer more likely.","The more people use public transport, the less traffic there is on the roads.":"\"The more... the less\" = one grows, the other shrinks. More buses and trains mean fewer cars.","The results suggest that regular exercise may slow the progress of memory loss.":"Suggest / may = maybe, not sure. Exercise might help memory loss happen more slowly.","Arguably, the printing press had a greater impact on society than the internet.":"Arguably = you can give reasons for this. Maybe printing changed society more than the internet.","People tend to overestimate the risk of rare events, such as plane crashes.":"Overestimate = think something is bigger than it is. People think rare dangers are more likely than they are.","It is widely believed that the city was founded by traders from the coast.":"Widely believed = many people think. Many think traders from the coast started the city.","Many scientists remain skeptical of claims that the treatment cures the disease.":"Skeptical = not believing, doubting. Many scientists doubt the treatment really cures the disease.","The evidence, while promising, is not yet strong enough to justify firm conclusions.":"Promising = looks good; justify = give a good reason for. The evidence looks good but isn't enough yet.","In the opening paragraph, the author presents a common view that she later rejects.":"Rejects = says no to. First the writer shows a popular idea, then later says it is wrong.","The main purpose of the passage is to compare two approaches to treating depression.":"Purpose = reason, goal. The text mainly compares two ways to treat depression.","The word it in the second sentence refers to the government's new tax policy.":"Refers to = points to, means. In sentence two, \"it\" means the government's new tax plan.","The passage implies that the experiment would have failed without additional funding.":"Implies = says without saying directly. The text hints the experiment needed more money to succeed.","The final paragraph summarizes the argument and suggests directions for future research.":"Summarizes = says the main points shortly. The last paragraph repeats the main ideas and suggests next research.","The example of the honeybee is given to illustrate how animals communicate information.":"Illustrate = show with an example. The honeybee example shows how animals share information.","Read the whole sentence before choosing an answer, since the key clue may appear at the end.":"Since = because. Read all the sentence first, because the important hint may be at the end.","Pay close attention to connectors like although and therefore, which signal the logic of a sentence.":"Signal = show. Words like although and therefore show how ideas in a sentence connect.","In restatement questions, reject any option that changes the meaning, even slightly.":"Restatement = saying the same idea in other words. Don't choose answers that change the meaning even a little.","Read the questions before the passage so that you know what information to look for.":"So that = in order to. Read the questions first, so you know what to look for.","If a question seems too difficult, skip it and return to it at the end.":"Skip = jump over. If a question is too hard, leave it and come back later.","Words like always and never often indicate an answer that is too extreme to be correct.":"Indicate = show; extreme = too strong. Answers with always or never are often wrong."},"units":{"colors":"Colors","animals":"Animals","numbers":"Numbers","family":"Family","fruit":"Fruit","toys":"Toys","shapes":"Shapes","at the sea":"At The Sea","vegetables":"Vegetables","at the beach":"At The Beach","nature":"Nature","in the kitchen":"In The Kitchen","birthday party":"Birthday Party","food":"Food","my body":"My Body","clothes":"Clothes","school":"School","my home":"My Home","weather":"Weather","feelings":"Feelings","actions":"Actions","places":"Places","jobs":"Jobs","sports":"Sports","transport":"Transport","my day":"My Day","questions":"Questions","about me":"About Me","days of the week":"Days Of The Week","time":"Time","describing people":"Describing People","the past":"The Past","hobbies":"Hobbies","the future":"The Future","at the doctor":"At the Doctor","shopping":"Shopping","the environment":"The Environment","school trip":"School Trip","technology":"Technology","around israel":"Around Israel","school life":"School Life","friendship":"Friendship","social media":"Social Media","healthy food":"Healthy Food","meeting someone new":"Meeting Someone New","environment":"The Environment","music":"Music","travel":"Travel","health":"Health","making plans":"Making Plans","volunteering":"Volunteering","careers":"Careers","israel":"Israel","news and media":"News and Media","job interview":"Job Interview","media":"Media","future plans":"Future Plans","artificial intelligence":"Artificial Intelligence","climate change":"Climate Change","science":"Science","history":"History","national service":"National Service","ethics":"Ethics","global issues":"Global Issues","university":"University","culture":"Culture","society":"Society","debate":"Debate","academic vocabulary":"Academic Vocabulary","research articles":"Research Articles","emailing lecturers":"Emailing Lecturers","presentations":"Presentations","linking and hedging":"Linking and Hedging","describing data":"Describing Data","study skills":"Study Skills","campus life":"Campus Life","greetings":"Greetings","at the café":"At the Café","directions":"Directions","at the airport":"At the Airport","at the hotel":"At the Hotel","at the supermarket":"At the Supermarket","public transport":"Public Transport","renting and contracts":"Renting and Contracts","banking and money":"Banking and Money","complaints and refunds":"Complaints and Refunds","small talk and socializing":"Small Talk and Socializing","health and doctors":"Health and Doctors","news and current affairs":"News and Current Affairs","handling bureaucracy":"Handling Bureaucracy","parent-teacher meeting":"Parent-Teacher Meeting","getting to know someone":"Getting to Know Someone","at a restaurant":"At a Restaurant","shopping and returns":"Shopping and Returns","phone calls and appointments":"Phone Calls and Appointments","travel and plans":"Travel and Plans","networking and introductions":"Networking and Introductions","running meetings":"Running Meetings","professional emails":"Professional Emails","remote work":"Remote Work","scheduling and deadlines":"Scheduling and Deadlines","sales and client relations":"Sales and Client Relations","presentations and results":"Presentations and Results","handling complaints":"Handling Complaints","negotiation":"Negotiation","everyday idioms":"Everyday Idioms","phrasal verbs at work":"Phrasal Verbs at Work","expressing and defending opinions":"Expressing and Defending Opinions","technology and society":"Technology and Society","psychology and behaviour":"Psychology and Behaviour","environment and the future":"Environment and the Future","culture and the arts":"Culture and the Arts","debate and discussion":"Debate and Discussion","academic vocabulary 1":"Academic Vocabulary 1","academic vocabulary 2":"Academic Vocabulary 2","connectors and contrast":"Connectors and Contrast","cause and effect":"Cause and Effect","restatement skills":"Restatement Skills","hedging and attitude":"Hedging and Attitude","reading academic texts":"Reading Academic Texts","exam strategies":"Exam Strategies"},"readings":{"g12":["We see things with colors. The ball is red, the sky is blue and the grass is green.","Someone has two pets. The cat is black and the dog is big.","A child has cats and fish. The sister has a dog.","This is a family. There is mom, dad, a baby and grandpa.","Dan eats apples and bananas. He does not eat lemons.","Maya has toys. She has a ball, a teddy bear and a robot.","We see shapes. There is a heart, a star and the moon.","A child is at the sea. There is a crab, a shell and the hot sun."],"g2":["We see shapes. There is a red circle and a yellow star.","Children like different vegetables. Noa likes carrots and Omer likes corn.","Maya is at the sea. She has a bucket and finds a shell.","Lia is outside. She sees a tree, a leaf and a flower.","Dan and Noa are ready to eat. They have plates, bowls and spoons.","Omer has a birthday. He has a cake and gets a gift."],"g3":["A child tells us about colors. The bag is purple and orange is the best color.","There are animals on the farm. There is a horse, a cow and a dog.","Tom is six. He has pencils and books.","Noa has a big family. Her grandma lives in her home.","A child tells us what they eat. Bread and egg in the morning, pizza for lunch.","We have eyes, ears and a nose. Eyes see and ears hear.","It is cold. The child wears warm clothes.","The child has school things in the bag. The teacher is nice.","The child tells us about the house. There is a door, windows, a bed and a chair.","The weather changes. It was rainy, then sunny, and there was a rainbow.","Lia is happy because it is her birthday. Her dog is tired.","Ben has a new bike. He rides it in the park."],"g4":["A child does many things in the week. Reading, swimming, running and sleeping.","A child goes to different places. The beach, school and the library.","People have different jobs. Mom is a doctor and the uncle is a pilot.","Yoni plays sports two days a week. His sister plays tennis.","People go to places in different ways. By bus, by train and by plane.","A child tells us about the day. Wake up, eat, go to school, then homework.","A child eats soup in the kitchen. Mom drinks tea.","We walk in a forest. There are trees, flowers, a mountain and a river."],"g56":["Adam tells us about himself. He is twelve, lives in Haifa and has a dog.","Shira tells us what she likes. She likes pizza, music and English.","A child has something different on each day. There are lessons and family dinner.","A child tells us the times of the day. Up at seven, school at eight.","Dana is tall with long hair. Her brother Gal is short. They are funny.","Last weekend a family went to the beach. Later they visited grandma. It was a great day.","Omer has many hobbies. He loves drawing most and wants to be an artist.","A family has a plan to visit Paris this summer. Then the child starts seventh grade."],"g6":["Dan was sick. The doctor told him to drink water. Now he is better.","Maya and her dad went shopping. She bought the black shoes because they cost less.","Omer's class cleans the beach. They put the trash in bins. The beach is clean now.","Noa's class went on a trip. They walked by a river and sang at night. She was happy.","Lia has a new computer. She can use it one hour a day. Then she reads or plays.","Dan lives in Haifa and Maya lives in Eilat. Eilat is very hot. Dan wants to visit."],"m7":["Noa started at a new school and knew nobody. A girl named Maya was kind to her, and now they are friends. Noa loves science because of the experiments.","Itay and Omer are best friends who had a fight about football. After three days, Omer said sorry. Now they are friends again and plan a bike trip.","Yael is thirteen and does judo three times a week. In her first competition she lost once and won twice. Her coach is proud of her.","Daniel makes short cooking videos on YouTube every Friday. Now two thousand people watch him. He ignores mean comments, and school is still first for him.","Tamar was always tired at school because she slept late and skipped breakfast. Now she sleeps early and eats a good breakfast. She feels much better.",null],"m8":["Roni loves computers and is in a robot club. Her team built a robot that sorts plastic and paper. It broke, but they fixed it for a big competition.","Eitan's class cleaned a dirty beach for three hours and filled forty bags with garbage. Now Eitan uses a metal bottle so he won't need plastic ones.","Shira plays piano and now writes her own songs. At a show her microphone stopped, but she kept singing louder. Everyone clapped.","Lior's family went to London for a week. When it rained, they went into a cafe and drank English tea. He saw many red buses and wants to visit Scotland next.","Ariel felt sick during a race because he didn't drink enough water. The doctor told him to drink more and eat breakfast. Now he runs with no problems.",null],"m9":["Gal, a ninth grader, helps old people at a center. At first she was nervous, but she became close to Rivka, who told her many stories. Now Gal sees old people differently.","Yonatan's class visited a tech company. Many workers there had other jobs before, like Dana, who was a dancer. Her advice: never stop learning.","Masada is a famous old place on a high mountain near the Dead Sea. Many people climb it early to see the sun come up. Adi's class did it and loved the view.","Noam's grandfather wrote letters and waited weeks for answers; now messages are instant. Noam thinks the future will have electric cars and robots. But he hopes people will still talk face to face.","A fake photo of a shark on a road was shared a lot. Michal checked it online and found it was changed. Now her classmates check stories before sharing.",null],"h10":["Noa used her phone six hours a day, and she was tired and her grades went down. She stopped using it after 9 p.m. Now she sleeps better, reads more and feels in control.","People leave plastic on Israeli beaches, and it hurts sea turtles. Students in Ashdod began cleaning their beach every Friday, and many joined them. The city added recycling bins.","A video of a big shark near Tel Aviv was shared by many people. A journalist found it was changed and filmed in Australia. Always ask who made something and why.","Omer drank many energy drinks to study, but got headaches and couldn't sleep. His doctor told him to drink water and walk instead. Soon he slept well and his grades got better.","Israeli students must help in the community for sixty hours. Tamar helped children with special needs and loved it. She kept going after her hours and may study special education.",null],"h11":["Many Israeli schools now use AI tools that help each student learn at their own speed. Some worry students won't learn to think alone, and AI can be wrong. Teachers say: teach students to use it carefully.","Israel once had too little water, so it invented drip watering and built plants that make sea water drinkable. But this uses lots of energy. Now scientists want to use clean energy for it.","In 2019, a small Israeli spaceship called Beresheet tried to land on the Moon but crashed. Still, many saw it as a big success. It made many children want to study science.","Masada is an old fort on a high rock near the Dead Sea. A story says Jewish fighters there chose to die rather than become Roman slaves. Some experts doubt parts of the story.","A study asked Israeli teens what matters most in a job. Most said work with meaning and a good life balance, not money. Experts say this may change when they must pay rent.",null],"h12":["A car with no driver may have to choose who gets hurt in a crash. People from different places answer this question differently. No one agrees yet on who should decide.","About one third of all food in the world is thrown away, while many people are hungry. Groups like Leket Israel give extra food to poor families. Experts say we must also change how we buy and use food.","Many Israelis start university late, after the army and travel. Some say this is bad because they start work later. Others say older students are more serious and know what they want.","Eurovision is a big song contest, and Israel has won it four times. Some say the votes are about politics, not music. Still, it lets the world hear Hebrew songs.","Many people today feel lonely, even though they are connected online. Loneliness is very bad for health, for young and old. Programs that bring people together face to face can help.",null],"uni":["To understand a text well, you must know almost all of its words. University texts use many words that people do not say every day. So it helps to learn a list of common academic words early.","A study asked 240 Israeli students about phone use and sleep. Students who used their phones in bed slept about 40 minutes less and found it harder to focus in class. Universities should teach students about good sleep habits.","A student writes a polite email to her professor. She asks to hand in her final paper one week late because she was in the hospital. She adds a doctor's note and thanks him.","A good class talk starts by saying the topic and the plan. Slides should have only a few points, and the speaker should look at people and speak slowly. End with a short summary and be ready for questions.","Academic writers do not say things are 100% sure. They use soft words like 'may' and 'might' to be careful. Linking words like 'however' help readers follow the ideas.","A chart shows how many foreign students came to an Israeli university from 2018 to 2024. The number went up, fell in 2021 because of travel limits, then went up again to 1,400. In general it grew.","Many Israeli students take an English reading test. Read the questions first, find the main idea of each paragraph, and guess new words from the text around them. Practice with a timer.",null],"adult":["A person says good morning to Mr. Cohen. He says he is fine and wishes a good day.","Dana is from Israel and lives in Tel Aviv. She sells things for work and has two kids. She knows some English and wants to learn more.","Ron asks for a coffee and a cheese sandwich. He takes them out with him. It costs 25 shekels.","Maya likes a blue shirt in a shop. She puts it on, but the price is too high, so she does not buy it.","Someone asks how to get to the train station. Walk straight, then go left at the bank. It takes about five minutes.","Dan has his bag and passport. His plane is one hour late, so he waits at gate twelve.","A guest has a room for two nights. Breakfast is from seven to ten. The internet code is on the room card.","A person feels sick. Their head and throat hurt. The doctor says take medicine three times a day and drink lots of water.","Noa buys milk, eggs and bread. The cheese costs less today, so she buys two. She pays with money and asks for a bag.","The train to the airport leaves at 9:30 and takes forty minutes. A ticket is fifteen dollars, and you buy it at a machine."],"adv":["Tamar found a nice apartment but read the contract first. Two parts were unfair to her, so she talked with the owner politely. He agreed to change them, and she saved money and stress.","A couple did not check their bank papers for years. Their daughter found high fees, little interest and a minus account. They met the bank, got lower fees and started saving each month.","Ronit's new washing machine leaked, and no one took responsibility. She kept careful notes and wrote a calm, clear email asking for a new machine or her money back. The company quickly sent her a new one.","Ofer went to a party where he knew almost no one. He asked people simple questions and listened, and he made a joke when politics came up. He made new friends who helped him at his new job.","Yael waited a long time to treat her knee pain. She found an early appointment and wrote her symptoms before going. The doctor said it was a small injury and sent her to physiotherapy.","A video of a store throwing away vegetables went viral, and people got angry. Reporters found it was old and from another country. Experts say: stop and check the date and source before sharing.","Nadia moved and had many problems with the city tax and her insurance. A neighbor told her to get names, ask for promises in writing and complain formally. Then things moved faster and were fixed.",null],"talk":[null,null,null,null,null,null,null,null],"biz":["Daniel writes to a woman he heard speak at a conference. He tells her that his company's results support her idea about helping customers sign up. He politely asks for a short call to hear her advice.","Noa sends a summary of a team meeting. The warehouse move will happen two weeks later, and the team will test a new delivery company. The meeting was too long, so next time she will plan time better.","Michal writes a polite reminder that a customer has not paid a bill. She says it may be a mistake and offers help. She asks for an answer by Friday, or the finance team will take the next steps.","HR says people like working from home, but they feel far from each other. So teams will come to the office two days a week. There are also new rules for video calls, and special cases can be discussed.","Eitan says the app can't be ready on time because the payment part must be rebuilt. He suggests launching in mid-May instead. He asks to meet the marketing team about the change.","A big client wanted to leave for a cheaper supplier. The manager learned the real problem was late deliveries, not price. She fixed the delivery problem, and the client stayed and ordered more.","Sales grew 7% but missed the goal, mostly because electronics sales fell. Sports products grew a lot, and more customers came back. The team will move money to the strong areas.","A company says sorry to a customer whose table arrived broken. It says the damage was not her fault. It will bring a new table for free and return the delivery money.","A company can't cut its price by 12%. Instead it offers 7% off if the client signs for three years. It also suggests fewer deliveries to save money for both sides.",null],"pro":["The writer used to think idioms were not important. Then he saw fluent speakers miss the meaning of an idiom at dinner. Now he thinks idioms help you really be part of a conversation, but you should learn them naturally.","Noa saw that tasks were forgotten at her company. She sent short notes after meetings and friendly reminders. Missed deadlines fell by half, which shows that following up turns ideas into results.","People often think changing your mind is weak. The writer says it is good to change your opinion when new facts appear. But you should not change it just because someone is loud.","People argue whether social media is good or bad. The writer says phones are not neutral tools: they are built to keep us using them. But they also help, so we must ask who designs them and what rules they need.","The 'spotlight effect' means we think others notice our mistakes much more than they do. In one study, people guessed half the room saw their shirt, but less than a quarter did. Knowing this can help us feel freer.","Some people think technology will save us; others think it's too late. The writer says both ideas stop us from acting. Israel's water success shows that hard work and investment can make a real difference.","The writer laughed at a chair shown as art in a gallery. But it started a long, deep talk, so he changed his mind a little. He thinks we should be open to new art but still ask hard questions.",null],"amir":["Cities are hotter than the countryside because roads and roofs keep the sun's heat and there are few trees. This uses more energy and is dangerous for health. White roofs, parks and trees can help cool cities.","Almost half of the world's languages may disappear soon, because young people move to cities and use big languages. Every language has special knowledge and ways of thinking. Hebrew shows a language can come back, but this is hard.","Many students don't sleep before exams, but this is a bad idea. During sleep, the brain keeps what we learned, and tired students make more mistakes. It is better to study over several days and sleep well.","Trees put water into the air, and this helps make rain far away. When people cut forests for farms, roads or mining, there is less rain. So the farmers themselves can be hurt, and saving forests is good for the economy too.","People once thought learning two languages confuses children. Those old studies were bad, and better studies showed no real problem. Bilingual children know as many words in total, and mixing languages is normal.","News about coffee often changes, because most studies only show connections, not causes. Today, three to four cups a day seem safe and maybe a little healthy. But pregnant women and sensitive people should drink less.","In citizen science, ordinary volunteers help scientists collect information, like counting birds or sorting photos of space. Some worry the data is not exact, but checking methods make it almost as good as experts' data. Volunteers also become more interested in science.","Reading notes again is not a good way to study. Testing yourself helps you remember much more and shows what you don't know. For an exam, practice with questions over several weeks."]},"ui":{"frags":{"! בואו נתרגל את השיעור הזה שוב. אתם יכולים!":"! Let's practice this lesson again. You can do it!","! היום נלמד על":"! Today we'll learn about","! היום נתרגל שיחה:":"! Today we'll practice a conversation:","! למדתם":"! You learned","! נתראה מחר!":"! See you tomorrow!","! סבב חזרה:":"! Review round:","! שיחה מעולה.":"! Great conversation.","! תנסו כמה שיותר. בהצלחה!":"! Do your best. Good luck!","\" aria-label=\"קלף":"\" aria-label=\"Card","\" placeholder=\"השם שלך\">":"\" placeholder=\"Your name\">","\" target=\"_blank\" rel=\"noopener\">הוספה ליומן Google (אנדרואיד)":"\" target=\"_blank\" rel=\"noopener\">Add to Google Calendar (Android)","\". כמעט! נסו שוב.":"\". Almost! Try again.","\". נסו שוב, או לחצו על התשובה.":"\". Try again, or tap the answer.",", ולכן צריך לתרגל את השיעור שוב לפני שעוברים לנושא הבא.":", so you need to practice the lesson again before moving t a hospital. My uncle is a pilot. He flies planes.","אמרו את זה בקול, ואז לחצו על הכפתור.":"Say it out loud, then tap the button.","אנגלית לחיי היום-יום ולטיולים":"English for everyday life and travel","אנגלית מעולה!":"Excellent English!","אנגלית עסקית":"Business English","אנחנו הולכים ביער. יש עצים גבוהים ופרחים אדומים. ליד ההר יש נהר.":"We are walking in the forest. There are tall trees and red flowers. There is a river near the mountain.","אנחנו יכולים להציע הנחה.":"We can offer a discount.","אנחנו צריכים החלטה עד יום שישי.":"We need a decision by Friday.","אני אוהב/ת לעבוד בצוות.":"I like working in a team.","אני אוהב/ת לעבוד עם אנשים.":"I like working with people.","אני אחראי/ת על השיווק.":"I'm in charge of marketing.","אני אשתף את המסך.":"I'll share my screen.","אני בים. אני רואה סרטן וצדף. השמש חמה.":"I'm at the beach. I see a crab and a shell. The sun is hot.","אני יכול/ה להתחיל בחודש הבא.":"I can start next month.","אני כותב/ת בהמשך לשיחה שלנו.":"I'm writing to follow up on our conversation.","אני לא מרגיש טוב. כואב לי הראש וכואב לי הגרון. קח את התרופה הזו שלוש פעמים ביום ושתה הרבה מים.":"I don't feel well. I have a headache and a sore throat. Take this medicine three times a day and drink lots of water.","אני מאחר/ת בכמה דקות.":"I'm running a few minutes late.","אני מחפש/ת אתגרים חדשים.":"I'm looking for new challenges.","אני מחפש/ת מעיל.":"I'm looking for a coat.","אני מידה M.":"I'm a size M.","אני מסודר/ת ויצירתי/ת.":"I'm organized and creative.","אני מצטער/ת על אי הנוחות.":"I'm sorry for the inconvenience.","אני מתעורר בשבע. אני מצחצח שיניים ואוכל ארוחת בוקר. אחר כך אני הולך לבית הספר. בערב אני מכין שיעורי בית.":"I wake up at seven. I brush my teeth and eat breakfast. Then I go to school. In the evening I do my homework.","אני נוסע לבית הספר באוטובוס. אבא שלי נוסע לעבודה ברכבת. בקיץ אנחנו טסים במטוס.":"I go to school by bus. My dad goes to work by train. In the summer we fly by plane.","אני נוסע/ת ללונדון.":"I'm traveling to London.","אני סטודנט/ית.":"I'
