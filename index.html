اختارت غال، وهي طالبة في الصف التاسع، مساعدة كبار السن في مركز في كفار سابا. في البداية كانت متوتّرة لأنها لم تكن تعرف عمّ تتحدّث. لكن بعد بضعة أسابيع أصبحت قريبة من امرأة اسمها رفكا. وُلدت رفكا في المغرب وجاءت إلى إسرائيل وهي فتاة صغيرة. روت لغال قصصًا كثيرة عن طفولتها. تقول غال إن هذه التجربة غيّرت نظرتها إلى كبار السن.","questions":[["Why was Gal nervous at first?","she didn't know what to talk about","she was afraid of old people","she was always late"],["Where was Rivka born?","in morocco","in kfar saba","in france"],["What has the experience changed?","the way gal sees older people","the way gal studies","the place where rivka lives"]]}},{"en":"careers","he":"קריירה ומקצועות","ru":"профессии","ar":"المهن","e":"💼","items":[{"en":"I'd like to become an engineer one day.","he":"הייתי רוצה להיות מהנדס/ת יום אחד.","ru":"Когда-нибудь я хотел бы стать инженером.","ar":"أودّ أن أصبح مهندسًا يومًا ما.","e":"","alt":[]},{"en":"If I were a doctor, I would help people in need.","he":"אם הייתי רופא/ה, הייתי עוזר/ת לאנשים נזקקים.","ru":"Если бы я был врачом, я бы помогал нуждающимся.","ar":"لو كنت طبيبًا، لساعدت المحتاجين.","e":"","alt":[]},{"en":"My dream job is designing video games.","he":"עבודת החלומות שלי היא עיצוב משחקי וידאו.","ru":"Работа моей мечты — создавать видеоигры.","ar":"وظيفة أحلامي هي تصميم ألعاب الفيديو.","e":"","alt":[]},{"en":"You need good communication skills for this job.","he":"צריך כישורי תקשורת טובים בשביל העבודה הזאת.","ru":"Для этой работы нужны хорошие коммуникативные навыки.","ar":"تحتاج إلى مهارات تواصل جيدة لهذه الوظيفة.","e":"","alt":[]},{"en":"My aunt used to teach, but now she's a lawyer.","he":"דודה שלי הייתה פעם מורה, אבל עכשיו היא עורכת דין.","ru":"Моя тётя раньше была учительницей, а теперь она юрист.","ar":"كانت عمّتي تعمل معلّمة في السابق، أما الآن فهي محامية.","e":"","alt":[]},{"en":"Choose a career that you are passionate about.","he":"בחר מקצוע שאתה באמת אוהב.","ru":"Выбирай профессию, которая тебя по-настоящему увлекает.","ar":"اختر مهنة تحبّها بشغف.","e":"","alt":[]}],"reading":{"en":"Last week, Yonatan's class visited a high-tech company in Herzliya. The employees explained how apps are developed and tested. Yonatan was surprised that many workers there used to do completely different jobs. One programmer, Dana, used to be a professional dancer. She said that if she could give students one piece of advice, it would be to never stop learning. Yonatan is not sure what he wants to do yet, but the visit made him think.","he":"בשבוע שעבר הכיתה של יונתן ביקרה בחברת הייטק בהרצליה. העובדים הסבירו איך מפתחים ובודקים אפליקציות. יונתן הופתע שעובדים רבים שם עסקו בעבר בעבודות שונות לגמרי. מתכנתת אחת, דנה, הייתה בעבר רקדנית מקצועית. היא אמרה שאם הייתה יכולה לתת לתלמידים עצה אחת, זו הייתה לעולם לא להפסיק ללמוד. יונתן עדיין לא בטוח מה הוא רוצה לעשות, אבל הביקור גרם לו לחשוב.","ru":"На прошлой неделе класс Йонатана посетил хай-тек компанию в Герцлии. Сотрудники объяснили, как разрабатывают и тестируют приложения. Йонатан удивился, что многие работники раньше занимались совсем другим. Одна программистка, Дана, раньше была профессиональной танцовщицей. Она сказала, что если бы могла дать ученикам один совет, то это был бы совет никогда не переставать учиться. Йонатан пока не знает, чем хочет заниматься, но визит заставил его задуматься.","ar":"في الأسبوع الماضي زار صفّ يوناتان شركة هايتك في هرتسليا. شرح الموظفون كيف يتم تطوير التطبيقات واختبارها. تفاجأ يوناتان بأن كثيرًا من العاملين هناك كانوا يعملون سابقًا في وظائف مختلفة تمامًا. إحدى المبرمجات، دانا، كانت راقصة محترفة في السابق. قالت إنها لو استطاعت أن تعطي الطلاب نصيحة واحدة، لكانت ألّا يتوقّفوا أبدًا عن التعلّم. لا يعرف يوناتان بعد ماذا يريد أن يعمل، لكن الزيارة جعلته يفكّر.","questions":[["Where is the company?","in herzliya","in haifa","in beer sheva"],["What did Dana use to be?","a professional dancer","a teacher","a doctor"],["What was Dana's advice to students?","never stop learning","work very hard","study computers"]]}},{"en":"israel","he":"ישראל","ru":"Израиль","ar":"إسرائيل","e":"🇮🇱","items":[{"en":"Israel is a small country with many different landscapes.","he":"ישראל היא מדינה קטנה עם נופים רבים ושונים.","ru":"Израиль — маленькая страна с множеством разных пейзажей.","ar":"إسرائيل بلد صغير فيه مناظر طبيعية كثيرة ومتنوّعة.","e":"","alt":[]},{"en":"The Dead Sea is the lowest place on Earth.","he":"ים המלח הוא המקום הנמוך ביותר על פני כדור הארץ.","ru":"Мёртвое море — самое низкое место на Земле.","ar":"البحر الميت هو أخفض مكان على وجه الأرض.","e":"","alt":[]},{"en":"Jerusalem is visited by millions of tourists every year.","he":"מיליוני תיירים מבקרים בירושלים בכל שנה.","ru":"Иерусалим ежегодно посещают миллионы туристов.","ar":"يزور القدسَ ملايينُ السيّاح كل عام.","e":"","alt":[]},{"en":"Many Israeli inventions are used all over the world.","he":"המצאות ישראליות רבות נמצאות בשימוש בכל העולם.","ru":"Многие израильские изобретения используются во всём мире.","ar":"تُستخدم اختراعات إسرائيلية كثيرة في جميع أنحاء العالم.","e":"","alt":[]},{"en":"If I could live anywhere in Israel, I'd choose the Galilee.","he":"אם הייתי יכול/ה לגור בכל מקום בישראל, הייתי בוחר/ת בגליל.","ru":"Если бы я мог жить где угодно в Израиле, я бы выбрал Галилею.","ar":"لو استطعت أن أعيش في أي مكان في إسرائيل، لاخترت الجليل.","e":"","alt":[]},{"en":"People from all over the world live here.","he":"אנשים מכל העולם גרים כאן.","ru":"Здесь живут люди со всего мира.","ar":"يعيش هنا أناس من جميع أنحاء العالم.","e":"","alt":[]}],"reading":{"en":"Masada is one of the most famous historical sites in Israel. It was built by King Herod on top of a high mountain near the Dead Sea. Today it is visited by thousands of people every week. Many hikers climb the Snake Path early in the morning to watch the sunrise. Last spring, Adi and her class did exactly that. Although the climb was hard, she says the view from the top was worth it. In 2001, Masada was added to the UNESCO World Heritage List.","he":"מצדה היא אחד האתרים ההיסטוריים המפורסמים ביותר בישראל. היא נבנתה על ידי המלך הורדוס על פסגת הר גבוה ליד ים המלח. כיום מבקרים בה אלפי אנשים בכל שבוע. מטיילים רבים מטפסים בשביל הנחש מוקדם בבוקר כדי לצפות בזריחה. באביב שעבר עדי והכיתה שלה עשו בדיוק את זה. למרות שהטיפוס היה קשה, היא אומרת שהנוף מהפסגה היה שווה את זה. בשנת 2001 מצדה נוספה לרשימת אתרי המורשת העולמית של אונסק״ו.","ru":"Масада — один из самых известных исторических объектов Израиля. Её построил царь Ирод на вершине высокой горы возле Мёртвого моря. Сегодня её каждую неделю посещают тысячи людей. Многие туристы рано утром поднимаются по Змеиной тропе, чтобы встретить рассвет. Прошлой весной Ади и её класс сделали именно это. Хотя подъём был тяжёлым, она говорит, что вид с вершины того стоил. В 2001 году Масада была включена в список Всемирного наследия ЮНЕСКО.","ar":"مسادا من أشهر المواقع التاريخية في إسرائيل. بناها الملك هيرودس على قمّة جبل عالٍ قرب البحر الميت. يزورها اليوم آلاف الناس كل أسبوع. يتسلّق كثير من المتنزّهين درب الأفعى في الصباح الباكر لمشاهدة شروق الشمس. في الربيع الماضي فعلت عدي وصفّها ذلك بالضبط. رغم أن التسلّق كان صعبًا، تقول إن المنظر من القمّة كان يستحق العناء. في عام 2001 أُضيفت مسادا إلى قائمة اليونسكو للتراث العالمي.","questions":[["Who built Masada?","king herod","king david","the romans"],["Why do hikers climb early in the morning?","to watch the sunrise","to avoid the tourists","to catch the first bus"],["When was Masada added to the UNESCO list?","in 2001","in 1948","last spring"]]}},{"en":"the future","he":"העתיד","ru":"будущее","ar":"المستقبل","e":"🔮","items":[{"en":"In twenty years, cars will be driven by computers.","he":"בעוד עשרים שנה, מכוניות ינוהגו על ידי מחשבים.","ru":"Через двадцать лет машинами будут управлять компьютеры.","ar":"بعد عشرين عامًا ستقود الحواسيب السيارات.","e":"","alt":[]},{"en":"If I could travel in time, I'd visit the future.","he":"אם הייתי יכול/ה לנסוע בזמן, הייתי מבקר/ת בעתיד.","ru":"Если бы я мог путешествовать во времени, я бы отправился в будущее.","ar":"لو استطعت السفر عبر الزمن، لزرت المستقبل.","e":"","alt":[]},{"en":"I think people will live on Mars one day.","he":"אני חושב/ת שיום אחד אנשים יגורו על מאדים.","ru":"Думаю, однажды люди будут жить на Марсе.","ar":"أعتقد أن الناس سيعيشون على المريخ يومًا ما.","e":"","alt":[]},{"en":"Artificial intelligence is changing the way we learn.","he":"הבינה המלאכותית משנה את הדרך שבה אנחנו לומדים.","ru":"Искусственный интеллект меняет то, как мы учимся.","ar":"الذكاء الاصطناعي يغيّر طريقة تعلّمنا.","e":"","alt":[]},{"en":"I hope I'll have my own business by thirty.","he":"אני מקווה שיהיה לי עסק משלי עד גיל שלושים.","ru":"Надеюсь, к тридцати годам у меня будет свой бизнес.","ar":"آمل أن يكون لديّ عملي الخاص قبل سن الثلاثين.","e":"","alt":[]},{"en":"Technology is useful; however, it can also be dangerous.","he":"הטכנולוגיה שימושית; עם זאת, היא יכולה להיות גם מסוכנת.","ru":"Технологии полезны, однако они могут быть и опасными.","ar":"التكنولوجيا مفيدة، لكنها قد تكون خطيرة أيضًا.","e":"","alt":[]}],"reading":{"en":"Noam's grandfather often talks about life fifty years ago. He used to write letters by hand and wait weeks for an answer. Today, messages are sent around the world in seconds. Noam sometimes wonders what life will be like when he is a grandfather. He thinks that most cars will be electric and that robots will help people at home. However, he hopes that people will still meet face to face. In his opinion, no machine can replace a real conversation.","he":"סבא של נועם מרבה לדבר על החיים לפני חמישים שנה. הוא נהג לכתוב מכתבים בכתב יד ולחכות שבועות לתשובה. כיום הודעות נשלחות לכל העולם בתוך שניות. נועם תוהה לפעמים איך ייראו החיים כשהוא יהיה סבא. הוא חושב שרוב המכוניות יהיו חשמליות ושרובוטים יעזרו לאנשים בבית. עם זאת, הוא מקווה שאנשים עדיין ייפגשו פנים אל פנים. לדעתו, שום מכונה לא יכולה להחליף שיחה אמיתית.","ru":"Дедушка Ноама часто рассказывает о жизни пятьдесят лет назад. Раньше он писал письма от руки и неделями ждал ответа. Сегодня сообщения отправляются по всему миру за секунды. Ноам иногда задумывается, какой будет жизнь, когда он сам станет дедушкой. Он думает, что большинство машин будут электрическими, а роботы будут помогать людям дома. Однако он надеется, что люди всё ещё будут встречаться лицом к лицу. По его мнению, никакая машина не заменит настоящий разговор.","ar":"يتحدّث جدّ نوعام كثيرًا عن الحياة قبل خمسين عامًا. كان يكتب الرسائل بخطّ يده وينتظر أسابيع للحصول على ردّ. اليوم تُرسل الرسائل إلى جميع أنحاء العالم في ثوانٍ. يتساءل نوعام أحيانًا كيف ستكون الحياة عندما يصبح هو جدًّا. يعتقد أن معظم السيارات ستكون كهربائية وأن الروبوتات ستساعد الناس في البيوت. لكنه يأمل أن يظل الناس يلتقون وجهًا لوجه. في رأيه، لا يمكن لأي آلة أن تحلّ محلّ محادثة حقيقية.","questions":[["How did Noam's grandfather use to communicate?","by writing letters","by phone","by email"],["What does Noam think most cars will be?","electric","flying","very cheap"],["In Noam's opinion, what can't a machine replace?","a real conversation","a good teacher","a family car"]]}},{"en":"news and media","he":"חדשות ותקשורת","ru":"СМИ и новости","ar":"الأخبار والإعلام","e":"📰","items":[{"en":"The story was reported on every channel last night.","he":"על הסיפור דווח בכל הערוצים אתמול בלילה.","ru":"Вчера вечером об этой истории сообщили на всех каналах.","ar":"أُذيع الخبر على جميع القنوات الليلة الماضية.","e":"","alt":[]},{"en":"Always check the source before you share a story.","he":"תמיד תבדוק את המקור לפני שאתה משתף ידיעה.","ru":"Всегда проверяй источник, прежде чем делиться новостью.","ar":"تحقّق دائمًا من المصدر قبل أن تشارك أي خبر.","e":"","alt":[]},{"en":"Fake news spreads faster than the truth.","he":"חדשות כזב מתפשטות מהר יותר מהאמת.","ru":"Фейковые новости распространяются быстрее правды.","ar":"تنتشر الأخبار الكاذبة أسرع من الحقيقة.","e":"","alt":[]},{"en":"If I were a journalist, I'd write about young people.","he":"אם הייתי עיתונאי/ת, הייתי כותב/ת על צעירים.","ru":"Если бы я был журналистом, я бы писал о молодёжи.","ar":"لو كنت صحفيًا، لكتبت عن الشباب.","e":"","alt":[]},{"en":"I don't agree with this article at all.","he":"אני בכלל לא מסכים/ה עם הכתבה הזאת.","ru":"Я совсем не согласен с этой статьёй.","ar":"لا أتّفق مع هذا المقال على الإطلاق.","e":"","alt":[]},{"en":"People used to read newspapers every morning.","he":"פעם אנשים קראו עיתונים כל בוקר.","ru":"Раньше люди читали газеты каждое утро.","ar":"كان الناس يقرؤون الصحف كل صباح.","e":"","alt":[]}],"reading":{"en":"Last month, a photo of a shark on a highway was shared thousands of times in Israel. Many people believed it, and some were even afraid to drive. However, Michal, a ninth grader from Modiin, was suspicious. She searched for the photo online and discovered that it had been edited. She posted the real facts in her class group. Her teacher was so impressed that Michal was asked to give a talk about fake news. Now her classmates always check a story before they share it.","he":"בחודש שעבר תמונה של כריש על כביש מהיר שותפה אלפי פעמים בישראל. אנשים רבים האמינו לה, וחלקם אפילו פחדו לנהוג. אולם מיכל, תלמידת כיתה ט׳ ממודיעין, חשדה. היא חיפשה את התמונה ברשת וגילתה שהיא עברה עריכה. היא פרסמה את העובדות האמיתיות בקבוצה של הכיתה. המורה שלה התרשמה כל כך, שמיכל התבקשה להעביר הרצאה על חדשות כזב. עכשיו חבריה לכיתה תמיד בודקים ידיעה לפני שהם משתפים אותה.","ru":"В прошлом месяце фото акулы на шоссе разошлось в Израиле тысячи раз. Многие поверили, а некоторые даже боялись садиться за руль. Однако Михаль, девятиклассница из Модиина, засомневалась. Она поискала фото в интернете и выяснила, что его отредактировали. Она опубликовала настоящие факты в группе класса. Учительница была так впечатлена, что Михаль попросили выступить с докладом о фейковых новостях. Теперь её одноклассники всегда проверяют новость, прежде чем ею поделиться.","ar":"في الشهر الماضي شوركت صورة لسمكة قرش على طريق سريع آلاف المرات في إسرائيل. صدّقها كثير من الناس، بل إن بعضهم خافوا من القيادة. لكن ميخال، وهي طالبة في الصف التاسع من موديعين، شكّت في الأمر. بحثت عن الصورة على الإنترنت واكتشفت أنها معدّلة. نشرت الحقائق الصحيحة في مجموعة الصف. أُعجبت معلّمتها كثيرًا لدرجة أنه طُلب من ميخال أن تلقي محاضرة عن الأخبار الكاذبة. الآن يتحقّق زملاؤها دائمًا من أي خبر قبل أن يشاركوه.","questions":[["What was in the photo?","a shark on a highway","a snake in a school","a lion in a park"],["What did Michal discover?","the photo had been edited","the photo was real","the shark was dangerous"],["What was Michal asked to do?","give a talk about fake news","delete the photo","write a newspaper article"]]}},{"en":"job interview","he":"ראיון עבודה","ru":"собеседование","ar":"مقابلة عمل","e":"🗣️","dialog":true,"items":[{"q":"Why do you want to work at our summer camp?","en":"I love working with kids, and I'd like to gain experience.","he":"אני אוהב/ת לעבוד עם ילדים, והייתי רוצה לצבור ניסיון.","ru":"Я люблю работать с детьми и хотел бы получить опыт.","ar":"أحبّ العمل مع الأطفال وأودّ أن أكتسب خبرة."},{"q":"Have you ever worked before?","en":"Yes, I've worked as a babysitter for two years.","he":"כן, אני עובד/ת כבייביסיטר כבר שנתיים.","ru":"Да, я уже два года работаю няней.","ar":"نعم، أعمل في مجالسة الأطفال منذ سنتين."},{"q":"What are your strengths?","en":"I'm responsible, patient, and good at solving problems.","he":"אני אחראי/ת, סבלני/ת וטוב/ה בפתרון בעיות.","ru":"Я ответственный, терпеливый и умею решать проблемы.","ar":"أنا مسؤول وصبور وماهر في حلّ المشكلات."},{"q":"What would you do if a child got hurt?","en":"I would stay calm and call an adult right away.","he":"הייתי נשאר/ת רגוע/ה וקורא/ת מיד למבוגר.","ru":"Я бы сохранял спокойствие и сразу позвал взрослого.","ar":"لبقيت هادئًا ولاستدعيت شخصًا بالغًا فورًا."},{"q":"How will you get to work every day?","en":"I usually ride my bike, so I'm never late.","he":"בדרך כלל אני רוכב/ת על אופניים, אז אני אף פעם לא מאחר/ת.","ru":"Обычно я езжу на велосипеде, поэтому никогда не опаздываю.","ar":"عادةً أركب دراجتي، لذلك لا أتأخّر أبدًا."},{"q":"Do you have any questions for us?","en":"Yes, when will I be told if I got the job?","he":"כן, מתי יודיעו לי אם התקבלתי לעבודה?","ru":"Да, когда мне сообщат, взяли ли меня на работу?","ar":"نعم، متى سيتم إبلاغي إن كنت قد حصلت على الوظيفة؟"}]}]},{"id":"uni","group":"uni","he":"סטודנטים · אנגלית אקדמית","sub":"אנגלית לאקדמיה ולפטור","e":"🎓","units":[{"en":"academic vocabulary","he":"אוצר מילים אקדמי","ru":"академическая лексика","ar":"المفردات الأكاديمية","e":"📚","items":[{"en":"The study aims to analyze the impact of social media.","he":"המחקר נועד לנתח את ההשפעה של הרשתות החברתיות.","ru":"Исследование направлено на анализ влияния социальных сетей.","ar":"تهدف الدراسة إلى تحليل تأثير وسائل التواصل الاجتماعي.","e":"","alt":[]},{"en":"These factors significantly affect students' academic performance.","he":"גורמים אלה משפיעים באופן משמעותי על ההישגים הלימודיים של סטודנטים.","ru":"Эти факторы существенно влияют на успеваемость студентов.","ar":"تؤثر هذه العوامل بشكل كبير على الأداء الأكاديمي للطلاب.","e":"","alt":[]},{"en":"The researchers identified a clear relationship between the variables.","he":"החוקרים זיהו קשר ברור בין המשתנים.","ru":"Исследователи выявили явную связь между переменными.","ar":"حدّد الباحثون علاقة واضحة بين المتغيرات.","e":"","alt":[]},{"en":"This approach is widely used in modern psychology.","he":"גישה זו נמצאת בשימוש נרחב בפסיכולוגיה המודרנית.","ru":"Этот подход широко используется в современной психологии.","ar":"يُستخدم هذا النهج على نطاق واسع في علم النفس الحديث.","e":"","alt":[]},{"en":"The theory is based on several key assumptions.","he":"התיאוריה מבוססת על כמה הנחות יסוד מרכזיות.","ru":"Теория основана на нескольких ключевых допущениях.","ar":"تستند النظرية إلى عدة افتراضات أساسية.","e":"","alt":[]},{"en":"It is essential to evaluate the evidence carefully.","he":"חיוני להעריך את הראיות בקפידה.","ru":"Крайне важно тщательно оценивать доказательства.","ar":"من الضروري تقييم الأدلة بعناية.","e":"","alt":[]}],"reading":{"en":"Vocabulary knowledge is one of the strongest predictors of reading comprehension. Research indicates that students must understand about 95 percent of the words in a text to read it effectively. Academic texts, however, contain many words that rarely appear in everyday conversation. Words such as analyze, significant and approach are common across all disciplines. Therefore, many universities encourage students to study a general academic word list. Learning these words early can make reading research articles considerably easier.","he":"ידיעת אוצר מילים היא אחד המנבאים החזקים ביותר של הבנת הנקרא. מחקרים מראים שסטודנטים צריכים להבין כ-95 אחוז מהמילים בטקסט כדי לקרוא אותו ביעילות. עם זאת, טקסטים אקדמיים מכילים מילים רבות שמופיעות לעיתים רחוקות בשיחה יומיומית. מילים כמו analyze, significant ו-approach נפוצות בכל התחומים. לכן אוניברסיטאות רבות מעודדות סטודנטים ללמוד רשימת מילים אקדמית כללית. לימוד המילים האלה בשלב מוקדם יכול להקל במידה ניכרת על קריאת מאמרי מחקר.","ru":"Словарный запас — один из самых сильных предикторов понимания прочитанного. Исследования показывают, что для эффективного чтения студенту нужно понимать около 95 процентов слов текста. Однако академические тексты содержат много слов, которые редко встречаются в повседневной речи. Такие слова, как analyze, significant и approach, распространены во всех дисциплинах. Поэтому многие университеты рекомендуют студентам изучать общий академический список слов. Если выучить эти слова заранее, читать научные статьи станет значительно легче.","ar":"تُعدّ المعرفة بالمفردات من أقوى المؤشرات على فهم المقروء. تشير الأبحاث إلى أن الطلاب يجب أن يفهموا نحو 95 بالمئة من كلمات النص ليقرؤوه بفعالية. غير أن النصوص الأكاديمية تحتوي على كلمات كثيرة نادرًا ما تظهر في المحادثة اليومية. كلمات مثل analyze وsignificant وapproach شائعة في جميع التخصصات. لذلك تشجّع جامعات كثيرة الطلاب على دراسة قائمة عامة بالكلمات الأكاديمية. ويمكن لتعلّم هذه الكلمات مبكرًا أن يجعل قراءة المقالات البحثية أسهل بكثير.","questions":[["What percentage of words must students understand?","About 95 percent","About 50 percent","About 75 percent","100 percent"],["Why are academic texts difficult?","They use words rare in conversation","They are always very short","They contain no data","They use only simple words"],["What do many universities encourage?","Studying an academic word list","Reading only novels","Avoiding research articles","Learning grammar rules first"]]}},{"en":"research articles","he":"קריאת מאמרי מחקר","ru":"научные статьи","ar":"المقالات البحثية","e":"🔬","items":[{"en":"The abstract gives a short summary of the entire study.","he":"התקציר נותן סיכום קצר של המחקר כולו.","ru":"Аннотация даёт краткое изложение всего исследования.","ar":"يقدّم الملخص عرضًا موجزًا للدراسة بأكملها.","e":"","alt":[]},{"en":"Participants were randomly divided into two groups.","he":"המשתתפים חולקו באופן אקראי לשתי קבוצות.","ru":"Участники были случайным образом разделены на две группы.","ar":"قُسّم المشاركون عشوائيًا إلى مجموعتين.","e":"","alt":[]},{"en":"Data were collected through online questionnaires and interviews.","he":"הנתונים נאספו באמצעות שאלונים מקוונים וראיונות.","ru":"Данные собирались с помощью онлайн-анкет и интервью.","ar":"جُمعت البيانات من خلال استبيانات إلكترونية ومقابلات.","e":"","alt":[]},{"en":"The findings suggest that sleep improves long-term memory.","he":"הממצאים מצביעים על כך ששינה משפרת את הזיכרון לטווח ארוך.","ru":"Результаты указывают на то, что сон улучшает долговременную память.","ar":"تشير النتائج إلى أن النوم يحسّن الذاكرة طويلة المدى.","e":"","alt":[]},{"en":"One limitation of this study is the small sample.","he":"אחת המגבלות של מחקר זה היא המדגם הקטן.","ru":"Одно из ограничений этого исследования — небольшая выборка.","ar":"من قيود هذه الدراسة صغر حجم العيّنة.","e":"","alt":[]},{"en":"Further research is needed to confirm these results.","he":"נדרש מחקר נוסף כדי לאשש את התוצאות הללו.","ru":"Для подтверждения этих результатов необходимы дальнейшие исследования.","ar":"هناك حاجة إلى مزيد من البحث لتأكيد هذه النتائج.","e":"","alt":[]}],"reading":{"en":"This study examined the effect of smartphone use on the sleep quality of university students. A total of 240 undergraduate students in Israel completed an online questionnaire about their evening habits. Participants also recorded their sleep for two weeks using a mobile application. The results showed that students who used their phones in bed slept, on average, 40 minutes less. They also reported more difficulty concentrating during morning classes. These findings suggest that universities should raise awareness of healthy sleep habits.","he":"מחקר זה בחן את השפעת השימוש בטלפון חכם על איכות השינה של סטודנטים באוניברסיטה. בסך הכול 240 סטודנטים לתואר ראשון בישראל מילאו שאלון מקוון על הרגלי הערב שלהם. המשתתפים גם תיעדו את השינה שלהם במשך שבועיים באמצעות אפליקציה. התוצאות הראו שסטודנטים שהשתמשו בטלפון במיטה ישנו בממוצע 40 דקות פחות. הם גם דיווחו על קושי רב יותר להתרכז בשיעורי הבוקר. ממצאים אלה מצביעים על כך שהאוניברסיטאות צריכות להעלות את המודעות להרגלי שינה בריאים.","ru":"В этом исследовании изучалось влияние использования смартфона на качество сна студентов университета. В общей сложности 240 израильских студентов бакалавриата заполнили онлайн-анкету о своих вечерних привычках. Участники также в течение двух недель записывали свой сон с помощью мобильного приложения. Результаты показали, что студенты, пользовавшиеся телефоном в постели, спали в среднем на 40 минут меньше. Они также сообщали о больших трудностях с концентрацией на утренних занятиях. Эти данные указывают на то, что университетам следует повышать осведомлённость о здоровых привычках сна.","ar":"درست هذه الدراسة تأثير استخدام الهاتف الذكي على جودة نوم طلاب الجامعات. أكمل ما مجموعه 240 طالبًا جامعيًا في إسرائيل استبيانًا إلكترونيًا عن عاداتهم المسائية. كما سجّل المشاركون نومهم لمدة أسبوعين باستخدام تطبيق على الهاتف. أظهرت النتائج أن الطلاب الذين استخدموا هواتفهم في السرير ناموا في المتوسط 40 دقيقة أقل. كما أفادوا بصعوبة أكبر في التركيز خلال محاضرات الصباح. تشير هذه النتائج إلى أن على الجامعات زيادة الوعي بعادات النوم الصحية.","questions":[["How many students participated?","240","40","24","2,400"],["How was sleep measured?","With a mobile application","In a sleep laboratory","By their parents","By lecturers"],["What did students who used phones in bed report?","Difficulty concentrating","Better grades","More energy","Longer sleep"]]}},{"en":"emailing lecturers","he":"מיילים למרצים","ru":"письма преподавателям","ar":"مراسلة المحاضرين","e":"✉️","items":[{"en":"Dear Dr. Levi, I hope this email finds you well.","he":"שלום ד״ר לוי, מקווה שהכול טוב אצלך.","ru":"Уважаемый доктор Леви, надеюсь, у вас всё хорошо.","ar":"عزيزي الدكتور ليفي، آمل أن تكون بخير.","e":"","alt":[]},{"en":"I am writing to ask about the assignment deadline.","he":"אני כותב/ת כדי לשאול לגבי מועד ההגשה של העבודה.","ru":"Я пишу, чтобы уточнить срок сдачи задания.","ar":"أكتب للاستفسار عن الموعد النهائي لتسليم الواجب.","e":"","alt":[]},{"en":"Would it be possible to receive a short extension?","he":"האם יהיה אפשר לקבל הארכה קצרה?","ru":"Можно ли получить небольшое продление срока?","ar":"هل من الممكن الحصول على تمديد قصير؟","e":"","alt":[]},{"en":"Unfortunately, I was unable to attend last week's lecture.","he":"לצערי, לא יכולתי להגיע להרצאה בשבוע שעבר.","ru":"К сожалению, я не смог(ла) присутствовать на лекции на прошлой неделе.","ar":"للأسف، لم أتمكن من حضور محاضرة الأسبوع الماضي.","e":"","alt":[]},{"en":"I have attached a medical certificate for your reference.","he":"צירפתי אישור רפואי לעיונך.","ru":"Прилагаю медицинскую справку для вашего сведения.","ar":"أرفقت شهادة طبية للاطلاع عليها.","e":"","alt":[]},{"en":"Thank you for your time, and I look forward to your reply.","he":"תודה על זמנך, אשמח לתשובתך.","ru":"Спасибо за ваше время, с нетерпением жду вашего ответа.","ar":"شكرًا على وقتك، وأتطلع إلى ردك.","e":"","alt":[]}],"reading":{"en":"Dear Professor Cohen, my name is Yael Mizrahi, and I am a second-year student in your Introduction to Sociology course. I am writing to ask whether it would be possible to submit my final paper one week late. Unfortunately, I was hospitalized last week and could not work on the assignment. I have attached a medical certificate for your reference. I would be very grateful for your understanding. Best regards, Yael Mizrahi.","he":"לכבוד פרופ׳ כהן, שמי יעל מזרחי, ואני סטודנטית בשנה השנייה בקורס מבוא לסוציולוגיה שלך. אני כותבת כדי לשאול אם אפשר להגיש את העבודה הסופית שלי באיחור של שבוע. לצערי, אושפזתי בשבוע שעבר ולא יכולתי לעבוד על המטלה. צירפתי אישור רפואי לעיונך. אודה מאוד על הבנתך. בברכה, יעל מזרחי.","ru":"Уважаемый профессор Коэн, меня зовут Яэль Мизрахи, я студентка второго курса и посещаю ваш курс «Введение в социологию». Я пишу, чтобы узнать, можно ли сдать мою итоговую работу на неделю позже. К сожалению, на прошлой неделе я была госпитализирована и не могла работать над заданием. Прилагаю медицинскую справку для вашего сведения. Буду очень благодарна за понимание. С уважением, Яэль Мизрахи.","ar":"حضرة البروفيسور كوهين المحترم، اسمي ياعيل مزراحي، وأنا طالبة في السنة الثانية في مساق مقدمة في علم الاجتماع الذي تدرّسه. أكتب لأسأل إن كان من الممكن تسليم بحثي النهائي متأخرة أسبوعًا واحدًا. للأسف، دخلت المستشفى الأسبوع الماضي ولم أتمكن من العمل على المهمة. أرفقت شهادة طبية للاطلاع عليها. سأكون ممتنة جدًا لتفهّمك. مع خالص التحيات، ياعيل مزراحي.","questions":[["What is Yael asking for?","A one-week extension","A higher grade","A new topic","A meeting"],["Why couldn't she work on the paper?","She was in hospital","She was abroad","She lost her laptop","She was working"],["What did she attach to the email?","A medical certificate","Her final paper","A photo","Her grades"]]}},{"en":"presentations","he":"מצגות וסמינרים","ru":"презентации и семинары","ar":"العروض التقديمية والندوات","e":"🎤","items":[{"en":"Today I'm going to talk about renewable energy in Israel.","he":"היום אדבר על אנרגיה מתחדשת בישראל.","ru":"Сегодня я расскажу о возобновляемой энергии в Израиле.","ar":"سأتحدث اليوم عن الطاقة المتجددة في إسرائيل.","e":"","alt":[]},{"en":"My presentation is divided into three main parts.","he":"המצגת שלי מחולקת לשלושה חלקים עיקריים.","ru":"Моя презентация состоит из трёх основных частей.","ar":"ينقسم عرضي إلى ثلاثة أجزاء رئيسية.","e":"","alt":[]},{"en":"As you can see in this slide, sales increased.","he":"כפי שאפשר לראות בשקופית הזאת, המכירות עלו.","ru":"Как видно на этом слайде, продажи выросли.","ar":"كما ترون في هذه الشريحة، ارتفعت المبيعات.","e":"","alt":[]},{"en":"Let me move on to the next point.","he":"אעבור עכשיו לנקודה הבאה.","ru":"Позвольте перейти к следующему пункту.","ar":"دعوني أنتقل إلى النقطة التالية.","e":"","alt":[]},{"en":"To sum up, the evidence supports our main hypothesis.","he":"לסיכום, הראיות תומכות בהשערה המרכזית שלנו.","ru":"Подводя итог, данные подтверждают нашу основную гипотезу.","ar":"باختصار، تدعم الأدلة فرضيتنا الرئيسية.","e":"","alt":[]},{"en":"Thank you for listening; are there any questions?","he":"תודה על ההקשבה; יש שאלות?","ru":"Спасибо за внимание; есть ли вопросы?","ar":"شكرًا على الاستماع؛ هل هناك أي أسئلة؟","e":"","alt":[]}],"reading":{"en":"Giving a seminar presentation is a common requirement in many university courses. A good presentation begins with a clear introduction that states the topic and the structure. Each slide should contain only a few key points, not long paragraphs of text. Speakers are advised to make eye contact with the audience and to speak slowly. At the end, a short summary helps listeners remember the main arguments. Finally, presenters should prepare for questions by anticipating possible criticism.","he":"הצגת מצגת בסמינר היא דרישה נפוצה בקורסים רבים באוניברסיטה. מצגת טובה מתחילה בפתיחה ברורה שמציגה את הנושא ואת המבנה. כל שקופית צריכה לכלול רק כמה נקודות מפתח, ולא פסקאות ארוכות של טקסט. מומלץ לדוברים ליצור קשר עין עם הקהל ולדבר לאט. בסוף, סיכום קצר עוזר למאזינים לזכור את הטיעונים המרכזיים. לבסוף, על המציגים להתכונן לשאלות על ידי צפייה מראש של ביקורת אפשרית.","ru":"Выступление с презентацией на семинаре — обычное требование во многих университетских курсах. Хорошая презентация начинается с чёткого вступления, в котором названы тема и структура. На каждом слайде должно быть лишь несколько ключевых пунктов, а не длинные абзацы текста. Выступающим советуют смотреть в глаза слушателям и говорить медленно. В конце краткое резюме помогает слушателям запомнить главные аргументы. Наконец, докладчикам следует готовиться к вопросам, заранее предвидя возможную критику.","ar":"يُعدّ تقديم عرض في الندوة متطلبًا شائعًا في كثير من المساقات الجامعية. يبدأ العرض الجيد بمقدمة واضحة تحدد الموضوع والبنية. يجب أن تحتوي كل شريحة على بضع نقاط رئيسية فقط، لا على فقرات طويلة من النص. يُنصح المتحدثون بالتواصل البصري مع الجمهور والتحدث ببطء. وفي النهاية، يساعد ملخص قصير المستمعين على تذكّر الحجج الرئيسية. وأخيرًا، ينبغي للمقدّمين الاستعداد للأسئلة من خلال توقّع الانتقادات المحتملة.","questions":[["What should a good introduction state?","The topic and the structure","The final grade","Only the conclusion","The speaker's biography"],["What should each slide contain?","A few key points","Long paragraphs","Only pictures","All the data"],["How can presenters prepare for questions?","By anticipating criticism","By speaking faster","By skipping the summary","By avoiding eye contact"]]}},{"en":"linking and hedging","he":"מילות קישור והסתייגות","ru":"связки и смягчение","ar":"أدوات الربط والتحوّط","e":"🔗","items":[{"en":"However, the results were not statistically significant.","he":"עם זאת, התוצאות לא היו מובהקות סטטיסטית.","ru":"Однако результаты не были статистически значимыми.","ar":"ومع ذلك، لم تكن النتائج ذات دلالة إحصائية.","e":"","alt":[]},{"en":"Furthermore, the method is cheaper and easier to use.","he":"יתרה מזאת, השיטה זולה יותר וקלה יותר לשימוש.","ru":"Кроме того, этот метод дешевле и проще в использовании.","ar":"علاوة على ذلك، الطريقة أرخص وأسهل في الاستخدام.","e":"","alt":[]},{"en":"These results may indicate a link between stress and illness.","he":"ייתכן שתוצאות אלה מצביעות על קשר בין לחץ למחלה.","ru":"Эти результаты могут указывать на связь между стрессом и болезнью.","ar":"قد تشير هذه النتائج إلى وجود صلة بين التوتر والمرض.","e":"","alt":[]},{"en":"It seems likely that the policy will be effective.","he":"נראה סביר שהמדיניות תהיה אפקטיבית.","ru":"Представляется вероятным, что эта политика будет эффективной.","ar":"يبدو من المرجح أن تكون السياسة فعّالة.","e":"","alt":[]},{"en":"Therefore, the hypothesis was only partly confirmed.","he":"לכן, ההשערה אוששה רק באופן חלקי.","ru":"Поэтому гипотеза подтвердилась лишь частично.","ar":"لذلك، تأكدت الفرضية جزئيًا فقط.","e":"","alt":[]},{"en":"In contrast, the second group showed no improvement.","he":"לעומת זאת, הקבוצה השנייה לא הראתה שיפור.","ru":"Напротив, вторая группа не показала улучшения.","ar":"في المقابل، لم تُظهر المجموعة الثانية أي تحسّن.","e":"","alt":[]}],"reading":{"en":"Academic writers rarely make absolute claims about their findings. Instead, they use hedging words such as may, might, suggest and appear to show caution. For example, a researcher might write that a treatment appears to reduce anxiety. This shows that the conclusion is based on limited evidence and may change. Linking words, such as however, therefore and moreover, help the reader follow the argument. Together, these tools make academic texts clearer and more precise.","he":"כותבים אקדמיים כמעט אף פעם לא מציגים טענות מוחלטות לגבי הממצאים שלהם. במקום זאת, הם משתמשים במילות הסתייגות כמו may, might, suggest ו-appear כדי להפגין זהירות. למשל, חוקר עשוי לכתוב שטיפול מסוים נראה כמפחית חרדה. הדבר מראה שהמסקנה מבוססת על ראיות מוגבלות ועשויה להשתנות. מילות קישור, כמו however, therefore ו-moreover, עוזרות לקורא לעקוב אחרי הטיעון. יחד, הכלים האלה הופכים טקסטים אקדמיים לברורים ומדויקים יותר.","ru":"Авторы научных текстов редко делают категоричные утверждения о своих результатах. Вместо этого они используют слова-смягчители, такие как may, might, suggest и appear, чтобы проявить осторожность. Например, исследователь может написать, что лечение, по-видимому, снижает тревожность. Это показывает, что вывод основан на ограниченных данных и может измениться. Слова-связки, такие как however, therefore и moreover, помогают читателю следить за аргументацией. Вместе эти средства делают академические тексты яснее и точнее.","ar":"نادرًا ما يقدّم الكتّاب الأكاديميون ادعاءات مطلقة بشأن نتائجهم. بدلًا من ذلك، يستخدمون كلمات تحوّط مثل may وmight وsuggest وappear لإظهار الحذر. على سبيل المثال، قد يكتب باحث أن علاجًا ما يبدو أنه يقلّل القلق. ويُظهر ذلك أن الاستنتاج قائم على أدلة محدودة وقد يتغيّر. أما أدوات الربط، مثل however وtherefore وmoreover، فتساعد القارئ على متابعة الحجة. وتجعل هذه الأدوات معًا النصوص الأكاديمية أوضح وأكثر دقة.","questions":[["Why do writers use hedging words?","To show caution","To sound informal","To make texts longer","To hide their data"],["Which word is a hedging word?","Might","However","Therefore","Moreover"],["What do linking words help the reader do?","Follow the argument","Find new sources","Skip paragraphs","Check the grammar"]]}},{"en":"describing data","he":"תיאור נתונים וגרפים","ru":"описание данных","ar":"وصف البيانات والرسوم البيانية","e":"📊","items":[{"en":"The graph shows the number of students between 2015 and 2025.","he":"הגרף מציג את מספר הסטודנטים בין 2015 ל-2025.","ru":"График показывает количество студентов с 2015 по 2025 год.","ar":"يوضح الرسم البياني عدد الطلاب بين عامي 2015 و2025.","e":"","alt":[]},{"en":"The number of applicants rose sharply in 2020.","he":"מספר המועמדים עלה בחדות ב-2020.","ru":"Число абитуриентов резко выросло в 2020 году.","ar":"ارتفع عدد المتقدمين بشكل حاد في عام 2020.","e":"","alt":[]},{"en":"Prices remained stable for most of the year.","he":"המחירים נותרו יציבים במשך רוב השנה.","ru":"Цены оставались стабильными большую часть года.","ar":"ظلت الأسعار مستقرة معظم العام.","e":"","alt":[]},{"en":"Unemployment fell gradually from eight to five percent.","he":"האבטלה ירדה בהדרגה משמונה לחמישה אחוזים.","ru":"Безработица постепенно снизилась с восьми до пяти процентов.","ar":"انخفضت البطالة تدريجيًا من ثمانية إلى خمسة بالمئة.","e":"","alt":[]},{"en":"Women make up about sixty percent of the participants.","he":"נשים מהוות כשישים אחוז מהמשתתפים.","ru":"Женщины составляют около шестидесяти процентов участников.","ar":"تشكّل النساء نحو ستين بالمئة من المشاركين.","e":"","alt":[]},{"en":"The table compares average salaries in five different countries.","he":"הטבלה משווה בין המשכורות הממוצעות בחמש מדינות שונות.","ru":"В таблице сравниваются средние зарплаты в пяти разных странах.","ar":"يقارن الجدول متوسط الرواتب في خمس دول مختلفة.","e":"","alt":[]}],"reading":{"en":"The chart illustrates the number of international students at an Israeli university from 2018 to 2024. In 2018, there were approximately 800 international students. The number increased steadily over the next two years, reaching 1,100 in 2020. However, it dropped sharply in 2021, probably because of travel restrictions. After 2022, the number recovered and peaked at 1,400 in 2024. Overall, the trend was clearly upward despite the temporary decline.","he":"התרשים מציג את מספר הסטודנטים הבינלאומיים באוניברסיטה ישראלית בין 2018 ל-2024. ב-2018 היו כ-800 סטודנטים בינלאומיים. המספר עלה בהתמדה בשנתיים שלאחר מכן והגיע ל-1,100 ב-2020. עם זאת, ב-2021 הוא ירד בחדות, כנראה בגלל הגבלות על נסיעות. אחרי 2022 המספר התאושש והגיע לשיא של 1,400 ב-2024. בסך הכול, המגמה הייתה בבירור עולה למרות הירידה הזמנית.","ru":"На диаграмме показано количество иностранных студентов в одном израильском университете с 2018 по 2024 год. В 2018 году там было около 800 иностранных студентов. В следующие два года их число стабильно росло и в 2020 году достигло 1100. Однако в 2021 году оно резко упало, вероятно, из-за ограничений на поездки. После 2022 года число восстановилось и достигло пика в 1400 человек в 2024 году. В целом тенденция была явно восходящей, несмотря на временный спад.","ar":"يوضح المخطط عدد الطلاب الدوليين في إحدى الجامعات الإسرائيلية من عام 2018 إلى عام 2024. في عام 2018، كان هناك نحو 800 طالب دولي. ازداد العدد بشكل مطّرد خلال العامين التاليين، ليصل إلى 1100 في عام 2020. غير أنه انخفض بشكل حاد في عام 2021، على الأرجح بسبب قيود السفر. بعد عام 2022، تعافى العدد وبلغ ذروته عند 1400 في عام 2024. وبشكل عام، كان الاتجاه تصاعديًا بوضوح رغم التراجع المؤقت.","questions":[["How many international students were there in 2018?","About 800","About 1,100","About 1,400","About 500"],["What probably caused the drop in 2021?","Travel restrictions","Higher fees","A new law","Fewer courses"],["What was the overall trend?","Upward","Downward","Stable","Unclear"]]}},{"en":"study skills","he":"מיומנויות למידה ומבחנים","ru":"учёба и экзамены","ar":"مهارات الدراسة والامتحانات","e":"📝","items":[{"en":"I always skim the text before reading it in detail.","he":"אני תמיד מרפרף/ת על הטקסט לפני שאני קורא/ת אותו לעומק.","ru":"Я всегда просматриваю текст, прежде чем читать его подробно.","ar":"أتصفح النص دائمًا قبل قراءته بالتفصيل.","e":"","alt":[]},{"en":"Underline the main idea in each paragraph.","he":"סמן/י את הרעיון המרכזי בכל פסקה.","ru":"Подчёркивай главную мысль в каждом абзаце.","ar":"ضع خطًا تحت الفكرة الرئيسية في كل فقرة.","e":"","alt":[]},{"en":"Read all the answers before choosing the best one.","he":"קרא/י את כל התשובות לפני שתבחר/י את הטובה ביותר.","ru":"Прочитай все ответы, прежде чем выбрать лучший.","ar":"اقرأ جميع الإجابات قبل اختيار أفضلها.","e":"","alt":[]},{"en":"If you don't know a word, guess from the context.","he":"אם את/ה לא מכיר/ה מילה, נחש/י מתוך ההקשר.","ru":"Если не знаешь слово, догадайся о значении по контексту.","ar":"إذا لم تعرف كلمة، فخمّن معناها من السياق.","e":"","alt":[]},{"en":"Our study group meets in the library every Thursday.","he":"קבוצת הלמידה שלנו נפגשת בספרייה כל יום חמישי.","ru":"Наша учебная группа встречается в библиотеке каждый четверг.","ar":"تجتمع مجموعة الدراسة لدينا في المكتبة كل يوم خميس.","e":"","alt":[]},{"en":"I need to manage my time better before the finals.","he":"אני צריך/ה לנהל את הזמן שלי טוב יותר לפני המבחנים הסופיים.","ru":"Мне нужно лучше распределять время перед итоговыми экзаменами.","ar":"أحتاج إلى إدارة وقتي بشكل أفضل قبل الامتحانات النهائية.","e":"","alt":[]}],"reading":{"en":"Many Israeli students must pass an English exam to receive an exemption from English courses. The reading comprehension section is often the most challenging part of the test. Experts recommend reading the questions first, so you know what information to look for. It is also useful to identify the main idea of each paragraph quickly. When you meet an unfamiliar word, try to understand it from the surrounding sentences. Finally, practicing with timed tests helps students manage their time during the real exam.","he":"סטודנטים ישראלים רבים צריכים לעבור מבחן באנגלית כדי לקבל פטור מקורסי אנגלית. פרק הבנת הנקרא הוא לעיתים קרובות החלק המאתגר ביותר במבחן. מומחים ממליצים לקרוא קודם את השאלות, כדי לדעת איזה מידע לחפש. כדאי גם לזהות במהירות את הרעיון המרכזי של כל פסקה. כשנתקלים במילה לא מוכרת, כדאי לנסות להבין אותה מהמשפטים שסביבה. לבסוף, תרגול עם מבחנים בזמן מוגבל עוזר לסטודנטים לנהל את הזמן במבחן האמיתי.","ru":"Многим израильским студентам нужно сдать экзамен по английскому, чтобы получить освобождение от курсов английского языка. Раздел на понимание прочитанного часто оказывается самой трудной частью теста. Эксперты советуют сначала прочитать вопросы, чтобы знать, какую информацию искать. Также полезно быстро определять главную мысль каждого абзаца. Встретив незнакомое слово, постарайтесь понять его по соседним предложениям. Наконец, тренировка на тестах с ограничением времени помогает студентам распределять время на настоящем экзамене.","ar":"يتعيّن على كثير من الطلاب الإسرائيليين اجتياز امتحان في اللغة الإنجليزية للحصول على إعفاء من مساقات الإنجليزية. وغالبًا ما يكون قسم فهم المقروء الجزء الأصعب في الامتحان. يوصي الخبراء بقراءة الأسئلة أولًا، لتعرف ما المعلومات التي تبحث عنها. ومن المفيد أيضًا تحديد الفكرة الرئيسية لكل فقرة بسرعة. عندما تصادف كلمة غير مألوفة، حاول فهمها من الجمل المحيطة بها. وأخيرًا، يساعد التدرّب على امتحانات محددة بوقت الطلابَ على إدارة وقتهم في الامتحان الحقيقي.","questions":[["What is often the most challenging section?","Reading comprehension","Writing","Listening","Grammar"],["What should you read first?","The questions","The last paragraph","Only the title","The answer key"],["How can students improve time management?","Practicing with timed tests","Studying all night","Skipping difficult texts","Reading only titles"]]}},{"en":"campus life","he":"חיים בקמפוס","ru":"студенческая жизнь","ar":"الحياة الجامعية","e":"🏛️","dialog":true,"items":[{"q":"Hi, are you new here? What are you studying?","en":"Yes, I'm a first-year student in computer science.","he":"כן, אני סטודנט/ית שנה ראשונה במדעי המחשב.","ru":"Да, я первокурсник (первокурсница), изучаю информатику.","ar":"نعم، أنا طالب في السنة الأولى في علوم الحاسوب."},{"q":"How are you finding your courses so far?","en":"They're interesting, but the reading load is quite heavy.","he":"הם מעניינים, אבל עומס הקריאה די כבד.","ru":"Они интересные, но читать приходится довольно много.","ar":"إنها ممتعة، لكن عبء القراءة ثقيل إلى حد ما."},{"q":"Do you know where the student services office is?","en":"I think it's next to the main library, on the ground floor.","he":"נדמה לי שזה ליד הספרייה המרכזית, בקומת הקרקע.","ru":"Кажется, он рядом с главной библиотекой, на первом этаже.","ar":"أظن أنه بجانب المكتبة الرئيسية، في الطابق الأرضي."},{"q":"Would you like to join our study group?","en":"I'd love to; when and where do you usually meet?","he":"אשמח מאוד; מתי ואיפה אתם בדרך כלל נפגשים?","ru":"С удовольствием; когда и где вы обычно встречаетесь?","ar":"يسعدني ذلك؛ متى وأين تجتمعون عادةً؟"},{"q":"Are you planning to live in the dorms?","en":"No, I share an apartment with two friends near campus.","he":"לא, אני גר/ה בדירה עם שני חברים ליד הקמפוס.","ru":"Нет, я снимаю квартиру с двумя друзьями рядом с кампусом.","ar":"لا، أتشارك شقة مع صديقين بالقرب من الحرم الجامعي."},{"q":"What do you do when you're not studying?","en":"I work part-time at a cafe and play basketball.","he":"אני עובד/ת במשרה חלקית בבית קפה ומשחק/ת כדורסל.","ru":"Я подрабатываю в кафе и играю в баскетбол.","ar":"أعمل بدوام جزئي في مقهى وألعب كرة السلة."}]}]}];

кресенье я иду в школу. Библиотека рядом с моей школой.","Моя мама — врач. Она работает в больнице. Мой дядя — пилот. Он летает на самолётах.","Йони играет в баскетбол в понедельник и в футбол в четверг. Его сестра играет в теннис.","Я езжу в школу на автобусе. Мой папа ездит на работу на поезде. Летом мы летаем на самолёте.","Я просыпаюсь в семь. Я чищу зубы и завтракаю. Потом я иду в школу. Вечером я делаю домашнее задание.","На кухне я беру миску и ложку. Я ем суп. Моя мама пьёт чай из чашки.","Мы гуляем по лесу. Там высокие деревья и красные цветы. Рядом с горой есть река."],"g56":["Привет! Меня зовут Адам. Мне двенадцать лет, и я живу в Хайфе. У меня есть собака по кличке Рокки. Я очень хорошо плаваю.","Меня зовут Шира. Я люблю пиццу и музыку. Мой любимый предмет — английский, но я не люблю математику. У меня есть один брат.","В воскресенье у меня урок английского. Во вторник у меня урок музыки. В пятницу моя семья ужинает вместе.","Я встаю в семь часов. Уроки начинаются в восемь. Я заканчиваю школу в половине второго и встречаюсь с друзьями в пять.","Дана высокая, и у неё длинные каштановые волосы. Её брат Гал невысокий, и у него голубые глаза. Они оба очень смешные.","В прошлые выходные мы ходили на пляж. Я играл в футбол с папой, а моя сестра ела мороженое. Вечером мы навестили бабушку. Это был замечательный день!","У Омера много хобби. По воскресеньям он играет на гитаре, а по средам ходит плавать. Его любимое хобби — рисование, и однажды он хочет стать художником.","Этим летом моя семья поедет в Париж. Мы увидим Эйфелеву башню и съедим много свежего хлеба. После поездки я пойду в седьмой класс."],"adult":["Доброе утро, господин Коэн! Как у вас дела сегодня? Хорошо, спасибо. Хорошего дня!","Меня зовут Дана. Я из Израиля и живу в Тель-Авиве. Я работаю в продажах, и у меня двое детей. Я немного говорю по-английски, но хочу выучить больше.","Официант: Здравствуйте, что вам принести? Рон: Можно кофе и бутерброд с сыром, пожалуйста? Официант: Здесь или с собой? Рон: С собой, пожалуйста. Сколько это стоит? Официант: Двадцать пять шекелей.","Майя в магазине одежды. Ей нравится синяя рубашка, и она просит размер M. Она её примеряет, но она слишком дорогая, поэтому Майя её не покупает.","Извините, где железнодорожный вокзал? Идите прямо и поверните налево у банка. Это недалеко, примерно пять минут.","Дан в аэропорту. У него один чемодан и паспорт. Его рейс в Рим задерживается на час, поэтому он идёт к выходу двенадцать и ждёт.","Здравствуйте, у меня бронь на две ночи. Добро пожаловать! Завтрак с семи до десяти. Пароль от Wi-Fi указан на вашей ключ-карте.","Я плохо себя чувствую. У меня болит голова и болит горло. Принимайте это лекарство три раза в день и пейте много воды.","Ноа идёт в супермаркет. Она покупает молоко, яйца и свежий хлеб. Сыр по скидке, поэтому она берёт две упаковки. Она платит наличными и просит пакет.","Следующий поезд в аэропорт отправляется в 9:30. Поездка занимает сорок минут. Один билет стоит пятнадцать долларов, его можно купить в автомате."],"biz":["Здравствуйте, позвольте представиться. Я Лиор, отвечаю за маркетинг в технологической компании. Вот моя визитка. Давайте оставаться на связи!","Давайте начнём. Сначала пройдёмся по повестке дня. Сегодня у нас три пункта: бюджет, новый сайт и команда. Начнём с бюджета.","Здравствуйте, Сара! Пишу по итогам нашего вчерашнего разговора. Предложение во вложении. Буду рад получить ваш ответ. С уважением, Том.","Во время звонка у Анны был выключен микрофон, и никто её не слышал. Потом она показала свой экран и новый дизайн. После звонка она отправила резюме.","Вы свободны во вторник в десять? Извините, в это время я занят. Вам удобно в среду в два? Да, отлично. Я пришлю приглашение в календарь.","Наша цена включает поддержку на один год. Если вы подпишете договор на этой неделе, мы можем предложить скидку десять процентов. Я уточню у своего руководителя и вернусь к вам.","Сегодня я расскажу о наших результатах. Как видите на этом слайде, продажи в этом году выросли на двадцать процентов. В следующем году мы планируем открыть два новых офиса.","Клиент: Мой заказ не пришёл. Сотрудник: Приношу извинения за неудобства. Можно номер вашего заказа? Я сейчас же этим займусь. Ваша посылка придёт завтра.","Клиент сказал, что наша цена немного выше, чем они ожидали. Мы предложили скидку пять процентов и бесплатное обучение. Они согласились, и в пятницу мы подпишем договор.","Здравствуйте, Даниэль, спасибо, что пришли на собеседование. Нам понравились ваш опыт в продажах и ваши коммуникативные навыки. Следующий шаг — встреча с нашим руководителем в понедельник."]}},"ar":{"items":{"red":"أحمر","blue":"أزرق","green":"أخضر","yellow":"أصفر","black":"أسود","white":"أبيض","cat":"قطة","dog":"كلب","fish":"سمكة","bird":"طائر","duck":"بطة","pig":"خنزير","one":"واحد","two":"اثنان","three":"ثلاثة","four":"أربعة","five":"خمسة","six":"ستة","mom":"أمي","dad":"أبي","baby":"طفل رضيع","sister":"أخت","brother":"أخ","grandpa":"جدّ","apple":"تفاحة","banana":"موزة","orange":"برتقالي","grapes":"عنب","lemon":"ليمون","strawberry":"فراولة","ball":"كرة","teddy bear":"دبدوب","car":"سيارة","balloon":"بالون","kite":"طائرة ورقية","robot":"روبوت","circle":"دائرة","square":"مربع","triangle":"مثلث","star":"نجمة","heart":"قلب","moon":"قمر","sea":"بحر","sand":"رمل","shell":"صدفة","crab":"سلطعون","boat":"قارب","sun":"شمس","purple":"بنفسجي","horse":"حصان","cow":"بقرة","grandma":"جدّة","bread":"خبز","milk":"حليب","egg":"بيضة","pizza":"بيتزا","eye":"عين","ear":"أذن","nose":"أنف","mouth":"فم","hand":"يد","foot":"قدم","shirt":"قميص","dress":"فستان","hat":"قبعة","shoes":"حذاء","socks":"جوارب","coat":"معطف","book":"كتاب","pencil":"قلم رصاص","bag":"حقيبة","ruler":"مسطرة","scissors":"مقص","teacher":"معلم","house":"بيت","bed":"سرير","chair":"كرسي","door":"باب","window":"نافذة","key":"مفتاح","rain":"مطر","cloud":"غيمة","snow":"ثلج","wind":"ريح","rainbow":"قوس قزح","happy":"سعيد","sad":"حزين","angry":"غاضب","tired":"متعب","scared":"خائف","surprised":"متفاجئ","bike":"دراجة","run":"يرك   const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  VOICE=v.find(x=>/en[-_]US/i.test(x.lang)&&/samantha|google|female|aria|jenny/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null;

function say(text,{slow=false}={}){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){res();return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const c=char();u.lang="en-US";if(VOICE)u.voice=VOICE;
    u.pitch=c.pitch;u.rate=slow?.55:Math.max(.5,c.rate*(SPEED[S.speed]||SPEED.slow).f);
    const av=document.querySelector(".avatar");
    u.onstart=()=>av&&av.classList.add("speaking");
    let done=false;
    const end=()=>{if(done)return;done=true;const a=document.querySelector(".avatar");a&&a.classList.remove("speaking");res()};
    u.onend=end;u.onerror=end;

  });
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20};
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
const CONTR=[[/\b(it|that|what|there|he|she|where|who)'s\b/g,"$1 is"],[/\bi'm\b/g,"i am"],[/\b(\w+)'re\b/g,"$1 are"],[/\b(\w+)'ll\b/g,"$1 will"],[/\b(\w+)'d\b/g,"$1 would"],[/\b(\w+)'ve\b/g,"$1 have"],[/\bcan't\b/g,"can not"],[/\bwon't\b/g,"will not"],[/\b(\w+)n't\b/g,"$1 not"],[/\bcannot\b/g,"can not"]];
const norm=s=>CONTR.reduce((t,[r,v])=>t.replace(r,v),String(s).toLowerCase().replace(/[’]/g,"'")).replace(/'/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(t=>NUMW[t]!=null?String(NUMW[t]):t);
function matchScore(heard,target){
  const T=norm(target),H=norm(heard);if(!T.length)return 0;
  const hit=T.filter(t=>H.some(h=>h===t||(t.length>3&&lev(h,t)<=1))).length;
  return hit/T.length;
}
function matches(heardList,item){
  const targets=[item.en,...(item.alt||[])];
  for(const h of heardList)for(const t of targets){
    const n=norm(t).length,sc=matchScore(h,t);
    if(n<=2?sc===1:sc>=.75)return true;
  }
  return false;
}
function listenOnce(){
  return new Promise((res,rej)=>{
    const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=5;
    let got=false;
    r.onresult=e=>{got=true;res([...e.results[0]].map(a=>a.transcript))};
    r.onerror=e=>{(e.error==="no-speech"||e.error==="aborted")?res([]):rej(e.error||"error")};
    r.onend=()=>{if(!got)res([])};
    try{r.start()}catch(e){rej("start")}
  });
}

function wireMic(cands){ // cands: [{text, pick}]
  const b=document.getElementById("am");if(!b)return;
  b.onclick=async()=>{
    stopVoice();b.classList.add("on");const h=document.getElementById("amh");h.textContent="מקשיב...";

      let best=null,bs=0;
      for(const c of cands)for(const t of heard){const sc=matchScore(t,c.text);if(sc>bs){bs=sc;best=c}}

/* ===================== Games ===================== */
let GAME=0;
function gamePool(){
  const C=course(),n=Math.max(1,Math.min(doneIn(C),C.units.length));
  let items=C.units.slice(0,n).flatMap(u=>u.items);
  if(items.length<8)items=C.units.slice(0,2).flatMap(u=>u.items);
  const pic=items.filter(w=>w.e);
  return pic.length>=6?pic:items;
}
const isPic=pool=>pool.every(w=>w.e);
function gameTop(title,extra){return `<div class="top"><button class="x" id="back" aria-label="חזרה למשחקים">→</button><h2 class="grow">${title}</h2>${extra||""}</div>`}
function games(){
  GAME++;stopVoice();const g=S.games||{};
  const L=[["memory","🃏","משחק זיכרון","מצאו זוגות של תמונה ומילה",g.memory!=null?`שיא: ${g.memory} מהלכים`:""],
    ["quiz","⏱️","מרוץ נגד השעון","כמה מילים תזהו ב-60 שניות?",g.quiz!=null?`שיא: ${g.quiz}`:""],
    ["catch","🫧","תפסו את המילה","לחצו על המילה הנכונה לפני שהיא נופלת",g.catch!=null?`שיא: ${g.catch}`:""]];
  const en="Let's play with the words you learned!";
  app.innerHTML=`<div class="top"><button class="x" id="back" aria-label="חזרה">→</button><h2 class="grow">משחקים</h2><span class="chip">⭐ ${balance()}</span></div>
   ${talkHTML(en,"בואו נשחק עם המילים שלמדתם!")}
   <div class="gamelist">${L.map(x=>`<button class="course" data-g="${x[0]}"><span class="e" aria-hidden="true">${x[1]}</span><span><b>${x[2]}</b><span>${x[3]}${x[4]?` · ${x[4]}`:""}</span></span></button>`).join("")}</div>
   <button class="btn ghost wide" id="dict">📖 המילון שלי</button>`;
  wireTalk(en);
  $("#back").onclick=home;$("#dict").onclick=dictionary;
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>GAMES[b.dataset.g]());
}
function gameEnd(key,score,label,stars,lowBetter){
  S.games=S.games||{};const prev=S.games[key];
  const best=prev==null?score:(lowBetter?Math.min(prev,score):Math.max(prev,score));
  const rec=prev==null||best!==prev;S.games[key]=best;S.stars+=stars;save();
  const en=rec?"New record! Amazing!":"Well played!";
  app.innerHTML=talkHTML(en,rec?"שיא חדש! מדהים!":"משחק יפה!")+`
   <div class="hero center"><div class="label">${label}</div><div class="score"><b>${score}</b><span>${rec?"שיא חדש!":`השיא שלכם: ${best}`}</span></div><p>+${stars} ⭐ כוכבים</p></div>
   <button class="btn wide" id="again">לשחק שוב</button><button class="btn ghost wide" id="gl">למשחקים אחרים</button>`;
  wireTalk(en);say(en);$("#again").onclick=()=>GAMES[key]();$("#gl").onclick=games;
}

/* Memory: match picture (or Hebrew) with the English word */
function gMemory(){
  const id=++GAME,all=gamePool(),pic=isPic(all),P=pic?6:4,pool=pickN(all,P);
  const cards=shuffle(pool.flatMap((w,i)=>[{i,face:pic?w.e:w.he,kind:"a"},{i,face:w.en,kind:"b"}]));
  let open=[],found=0,moves=0,lock=false;
  app.innerHTML=gameTop("משחק זיכרון",`<span class="chip">מהלכים: <span id="mv">0</span></span>`)+
   talkHTML("Find the pairs!",pic?"מצאו את הזוגות: תמונה ומילה באנגלית.":"מצאו את הזוגות: עברית ואנגלית.")+
   `<div class="mem ${pic?"":"two"}">${cards.map((c,k)=>`<button class="mcard" data-k="${k}" aria-label="קלף ${k+1}"><span class="front ${c.kind==="b"?"en":""} ${pic&&c.kind==="a"?"emo":""}">${esc(c.face)}</span></button>`).join("")}</div>`;
  wireTalk("Find the pairs!");say("Find the pairs!");
  $("#back").onclick=games;
  app.querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{
    if(lock||id!==GAME||b.classList.contains("open")||b.classList.contains("done"))return;
    const c=cards[+b.dataset.k];b.classList.add("open");if(c.kind==="b")say(c.face);
    open.push(b);if(open.length<2)return;
    moves++;$("#mv").textContent=moves;
    const [x,y]=open.map(o=>cards[+o.dataset.k]);
    if(x.i===y.i&&x.kind!==y.kind){
      open.forEach(o=>{o.classList.remove("open");o.classList.add("done")});open=[];found++;
      setTimeout(()=>say(pool[x.i].en),300);
      if(found===P){const extra=moves-P;setTimeout(()=>{if(id===GAME){GAME++;gameEnd("memory",moves,"מהלכים",extra<=2?5:extra<=5?3:2,true)}},1200)}
    }else{lock=true;setTimeout(()=>{open.forEach(o=>o.classList.remove("open"));open=[];lock=false},1000)}
  });
}

/* Quiz against the clock */
function gQuiz(){

/* Catch the falling word */
function gCatch(){
  const id=++GAME,pool=gamePool(),pic=isPic(pool);
  let score=0,lives=3,target=null,drops=[],last=0,spawnT=0,speed=55;
  app.innerHTML=gameTop("תפסו את המילה",`<span class="chip">✓ <span id="sc">0</span></span><span class="lives" id="lv" aria-label="חיים">❤️❤️❤️</span>`)+`
   <div class="target"><span class="label">תפסו:</span><span id="tgt"></span><button class="mini" id="th" aria-label="להשמיע">🔊</button></div>
   <div class="catch" id="area" aria-live="polite"></div>`;
  $("#back").onclick=games;
  const area=$("#area");
  const newTarget=()=>{target=pickN(pool.filter(x=>x!==target),1)[0];$("#tgt").innerHTML=pic?target.e:`<span class="he">${esc(target.he)}</span>`};
  $("#th").onclick=()=>say(target.en);
  const upd=()=>{$("#sc").textContent=score;$("#lv").textContent="❤️".repeat(Math.max(0,lives))+"🤍".repeat(3-Math.max(0,lives))};
  const remove=d=>{d.b.remove();drops=drops.filter(x=>x!==d)};
  const end=()=>{if(id!==GAME)return;GAME++;setTimeout(()=>gameEnd("catch",score,"מילים שנתפסו",Math.min(10,score)),400)};
  const spawn=()=>{
    const hasT=drops.some(d=>d.w===target);
    const w=(!hasT&&Math.random()<.6)?target:pickN(pool.filter(x=>x!==target),1)[0];
    const b=document.createElement("button");b.className="drop";b.textContent=w.en;area.appendChild(b);
    const d={w,b,x:Math.random()*Math.max(0,area.clientWidth-b.offsetWidth),y:-b.offsetHeight};
    b.style.transform=`translate(${d.x}px,${d.y}px)`;drops.push(d);
    b.onclick=()=>{
      if(id!==GAME)return;
      if(d.w===target){score++;say(d.w.en);remove(d);speed=Math.min(150,speed+5);newTarget();upd()}
      else{lives--;b.classList.add("bad");b.disabled=true;setTimeout(()=>remove(d),250);upd();if(lives<=0)end()}
    };
  };
  const loop=t=>{
    if(id!==GAME)return;
    const dt=last?Math.min(.05,(t-last)/1000):0;last=t;
    spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.8,1.7-score*.05)}
    const H=area.clientHeight;
    for(const d of drops.slice()){
      d.y+=speed*dt;d.b.style.transform=`translate(${d.x}px,${d.y}px)`;
      if(d.y>H){remove(d);if(d.w===target){lives--;upd();if(lives<=0)return end()}}
    }
    requestAnimationFrame(loop);
  };
  newTarget();upd();say("Catch the word!");requestAnimationFrame(loop);
}

/* ===================== Lesson engine ===================== */
let LS=null;
function startLesson(idx,isRepeat){
  const C=course(),L=C.units[idx],pic=isPicUnit(L);
  const prevUnits=C.units.filter((u,i)=>i!==idx&&i<Math.min(doneIn(C),C.units.length));
  const steps=[{t:"intro"}];
  const R=(READ[C.id]||[])[idx];
  if(L.dialog){
    L.items.forEach(w=>steps.push({t:"dlearn",w}));
    steps.push({t:"talk-intro"});
    pickN(L.items,Math.min(6,nq(6))).forEach(w=>steps.push({t:"answer",w}));
    steps.push({t:"reply-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"reply",w,pool:L.items}));
    steps.push({t:"write-intro"});
    pickN(L.items,nq(2)).forEach(w=>steps.push({t:"type",w,dialog:true}));
    const dl=C.units.filter(u=>u.dialog).flatMap(u=>u.items);
    const weakD=weakItems(C,u=>u.dialog).filter(w=>!L.items.includes(w)).slice(0,nq(3));
    if(weakD.length){steps.push({t:"weak-intro"});weakD.forEach(w=>steps.push({t:"reply",w,pool:dl}))}
  }else{
    L.items.forEach(w=>steps.push({t:"learn",w}));
    steps.push({t:"say-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"say",w}));
    steps.push({t:"listen-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"listen",w,pool:L.items}));
    steps.push({t:"read-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"read",w,pool:L.items}));
    if(!pic&&L.items.some(w=>w.en.split(" ").length>=3)){
      steps.push({t:"build-intro"});
      pickN(L.items.filter(w=>w.en.split(" ").length>=3),nq(2)).forEach(w=>steps.push({t:"build",w}));
    }
    steps.push({t:"write-intro"});
    pickN(L.items,nq(2)).forEach(w=>steps.push({t:pic?(w.en.includes(" ")?"build":"spell"):"type",w}));
    if(R){
      steps.push({t:"story",R});
      R[2].slice(0,S.len==="5"?2:R[2].length).forEach(q=>steps.push({t:"rq",R,q}));
    }
    const kind=u=>!u.dialog&&isPicUnit(u)===pic;
    const allSame=C.units.filter(kind).flatMap(u=>u.items);
    const prevSame=prevUnits.filter(kind).flatMap(u=>u.items);
    const weak=weakItems(C,kind).filter(w=>!L.items.includes(w)).slice(0,nq(3));
    const extra=S.len!=="5"&&prevSame.length>=6?pickN(prevSame.filter(w=>!weak.includes(w)),Math.max(0,nq(2)-weak.length)):[];
    const rev=weak.concat(extra);
    if(rev.length&&allSame.length>=4){steps.push({t:weak.length?"weak-intro":"review-intro"});rev.forEach((w,i)=>steps.push({t:i%2&&!pic?"read":"listen",w,pool:allSame}))}
  }
  LS={idx,L,pic,steps,i:0,stars:0,isRepeat};
  step();
}
