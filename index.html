ычаям.","ar":"يخشى البعض أن تهدد الثقافة العالمية اللغات والعادات المحلية.","e":"","alt":[]},{"en":"The film, which was shot entirely in Jaffa, won an international award.","he":"הסרט, שצולם כולו ביפו, זכה בפרס בינלאומי.","ru":"Фильм, полностью снятый в Яффо, получил международную премию.","ar":"فاز الفيلم، الذي صُوّر بالكامل في يافا، بجائزة دولية.","e":"","alt":[]},{"en":"Art allows people to express what words cannot.","he":"האמנות מאפשרת לאנשים לבטא את מה שמילים אינן יכולות.","ru":"Искусство позволяет людям выразить то, что невозможно выразить словами.","ar":"يتيح الفن للناس التعبير عمّا تعجز عنه الكلمات.","e":"","alt":[]},{"en":"Rarely have so many cultures lived side by side in one place.","he":"רק לעיתים נדירות חיו כל כך הרבה תרבויות זו לצד זו במקום אחד.","ru":"Редко когда столько культур жили бок о бок в одном месте.","ar":"نادرًا ما عاشت ثقافات كثيرة إلى هذا الحد جنبًا إلى جنب في مكان واحد.","e":"","alt":[]}],"reading":{"en":"Eurovision, the international song contest, is watched by more than 150 million viewers every year. Although Israel is not located in Europe, it has participated since 1973 and has won the competition four times. For many Israelis, the contest is far more than entertainment; it represents a sense of belonging to the wider international community. Critics, however, claim that the voting is influenced less by musical quality than by politics and neighbourly relations between countries. Supporters reject this view, pointing out that unexpected winners frequently emerge. What is undeniable is that the contest has introduced Hebrew songs to audiences who might otherwise never have heard the language. In this respect, Eurovision serves as a cultural bridge, whatever one thinks of the music.","he":"האירוויזיון, תחרות השירים הבינלאומית, נצפה מדי שנה על ידי יותר מ-150 מיליון צופים. אף על פי שישראל אינה נמצאת באירופה, היא משתתפת בתחרות מאז 1973 וזכתה בה ארבע פעמים. עבור ישראלים רבים, התחרות היא הרבה יותר מבידור; היא מייצגת תחושת שייכות לקהילה הבינלאומית הרחבה. המבקרים, לעומת זאת, טוענים שההצבעה מושפעת פחות מאיכות מוזיקלית ויותר מפוליטיקה ומיחסי שכנות בין מדינות. התומכים דוחים טענה זו ומציינים שלעיתים קרובות צצים זוכים בלתי צפויים. מה שאין עליו עוררין הוא שהתחרות חשפה שירים בעברית לקהלים שאחרת אולי לא היו שומעים את השפה לעולם. במובן זה, האירוויזיון משמש גשר תרבותי, בלי קשר למה שחושבים על המוזיקה.","ru":"«Евровидение», международный песенный конкурс, ежегодно смотрят более 150 миллионов зрителей. Хотя Израиль не находится в Европе, он участвует в конкурсе с 1973 года и побеждал в нём четыре раза. Для многих израильтян конкурс — это гораздо больше, чем развлечение; он олицетворяет чувство принадлежности к широкому международному сообществу. Критики, однако, утверждают, что на голосование влияет не столько качество музыки, сколько политика и добрососедские отношения между странами. Сторонники отвергают эту точку зрения, указывая, что победителями часто становятся неожиданные участники. Бесспорно одно: конкурс познакомил с песнями на иврите аудиторию, которая иначе, возможно, никогда бы не услышала этот язык. В этом смысле «Евровидение» служит культурным мостом, что бы ни думать о самой музыке.","ar":"تحظى مسابقة «يوروفيجن» الدولية للأغاني بأكثر من 150 مليون مشاهد كل عام. ورغم أن إسرائيل لا تقع في أوروبا، فإنها تشارك في المسابقة منذ عام 1973 وفازت بها أربع مرات. وبالنسبة إلى كثير من الإسرائيليين، فإن المسابقة أكثر بكثير من مجرد ترفيه؛ إذ تمثّل شعورًا بالانتماء إلى المجتمع الدولي الأوسع. غير أن المنتقدين يزعمون أن التصويت يتأثر بالسياسة وعلاقات الجوار بين الدول أكثر مما يتأثر بالجودة الموسيقية. ويرفض المؤيدون هذا الرأي، مشيرين إلى أن فائزين غير متوقعين يبرزون كثيرًا. وما لا يمكن إنكاره هو أن المسابقة عرّفت جماهير بأغانٍ عبرية ربما لم تكن لتسمع هذه اللغة أبدًا لولاها. ومن هذا المنطلق، تؤدي «يوروفيجن» دور الجسر الثقافي، أيًّا كان رأي المرء في الموسيقى.","questions":[["Why is Eurovision important to many Israelis?","It gives a sense of international belonging.","It is the only show on TV.","Israel always wins the contest.","It takes place in Israel every year."],["What do critics say about the voting?","Politics affects it more than music.","It is completely fair.","Only Israelis are allowed to vote.","Viewers cannot vote at all."],["Why does the writer call Eurovision a 'cultural bridge'?","It exposes audiences to other languages.","It is broadcast from a bridge.","It unites all critics and supporters.","It ends political conflicts."]]}},{"en":"society","he":"חברה","ru":"общество","ar":"المجتمع","e":"👥","items":[{"en":"The gap between rich and poor has widened in recent decades.","he":"הפער בין עשירים לעניים התרחב בעשורים האחרונים.","ru":"Разрыв между богатыми и бедными в последние десятилетия увеличился.","ar":"اتّسعت الفجوة بين الأغنياء والفقراء في العقود الأخيرة.","e":"","alt":[]},{"en":"Equal opportunities in education are essential for a fair society.","he":"שוויון הזדמנויות בחינוך הכרחי לחברה הוגנת.","ru":"Равные возможности в образовании необходимы для справедливого общества.","ar":"تكافؤ الفرص في التعليم أمر ضروري لمجتمع عادل.","e":"","alt":[]},{"en":"It is often argued that social media deepens political divisions.","he":"נטען לעיתים קרובות שהרשתות החברתיות מעמיקות את הקיטוב הפוליטי.","ru":"Часто утверждают, что социальные сети углубляют политический раскол.","ar":"كثيرًا ما يُقال إن وسائل التواصل الاجتماعي تعمّق الانقسامات السياسية.","e":"","alt":[]},{"en":"Unless housing prices drop, young couples will struggle to buy homes.","he":"אם מחירי הדיור לא יירדו, לזוגות צעירים יהיה קשה לקנות דירה.","ru":"Если цены на жильё не снизятся, молодым парам будет трудно купить жильё.","ar":"ما لم تنخفض أسعار المساكن، سيجد الأزواج الشباب صعوبة في شراء منزل.","e":"","alt":[]},{"en":"Volunteers play a crucial role in strengthening local communities.","he":"מתנדבים ממלאים תפקיד מכריע בחיזוק קהילות מקומיות.","ru":"Волонтёры играют решающую роль в укреплении местных сообществ.","ar":"يؤدي المتطوعون دورًا حاسمًا في تعزيز المجتمعات المحلية.","e":"","alt":[]},{"en":"Tolerance means respecting people whose opinions differ from ours.","he":"סובלנות פירושה לכבד אנשים שדעותיהם שונות משלנו.","ru":"Терпимость означает уважение к людям, чьи взгляды отличаются от наших.","ar":"التسامح يعني احترام الأشخاص الذين تختلف آراؤهم عن آرائنا.","e":"","alt":[]}],"reading":{"en":"Loneliness has been described by some health experts as a modern epidemic. Studies suggest that chronic loneliness can be as harmful to health as smoking fifteen cigarettes a day. Paradoxically, this problem has grown at a time when people are more digitally connected than ever before. Researchers explain that online interactions, while convenient, rarely provide the deep emotional support that face-to-face relationships offer. The issue affects not only the elderly but increasingly young adults, many of whom move to big cities far from family and childhood friends. In response, several countries have introduced national strategies to tackle loneliness, and in Israel, a number of municipalities now run programmes that connect students with elderly residents. Such initiatives demonstrate that the solution may lie not in new technology but in rebuilding genuine communities.","he":"יש מומחי בריאות שתיארו את הבדידות כמגפה מודרנית. מחקרים מראים שבדידות כרונית עלולה להזיק לבריאות כמו עישון של חמש עשרה סיגריות ביום. באופן פרדוקסלי, הבעיה הזו התעצמה דווקא בתקופה שבה אנשים מחוברים דיגיטלית יותר מאי פעם. חוקרים מסבירים שאינטראקציות ברשת, אף שהן נוחות, מספקות רק לעיתים רחוקות את התמיכה הרגשית העמוקה שמעניקים קשרים פנים אל פנים. הבעיה פוגעת לא רק בקשישים אלא יותר ויותר גם בצעירים, שרבים מהם עוברים לערים גדולות הרחק ממשפחתם ומחברי ילדותם. בתגובה, כמה מדינות גיבשו אסטרטגיות לאומיות להתמודדות עם בדידות, ובישראל מספר רשויות מקומיות מפעילות כיום תוכניות המחברות בין סטודנטים לתושבים ותיקים. יוזמות כאלה מראות שהפתרון אולי טמון לא בטכנולוגיה חדשה אלא בבנייה מחדש של קהילות אמיתיות.","ru":"Некоторые специалисты в области здравоохранения называют одиночество современной эпидемией. Исследования показывают, что хроническое одиночество может быть так же вредно для здоровья, как выкуривание пятнадцати сигарет в день. Парадоксально, но эта проблема обострилась именно тогда, когда люди связаны в цифровом мире как никогда раньше. Исследователи объясняют, что общение в интернете, хотя и удобно, редко даёт ту глубокую эмоциональную поддержку, которую обеспечивают личные отношения. Проблема затрагивает не только пожилых людей, но всё чаще и молодёжь, многие представители которой переезжают в большие города далеко от семьи и друзей детства. В ответ ряд стран принял национальные стратегии борьбы с одиночеством, а в Израиле несколько муниципалитетов реализуют программы, которые знакомят студентов с пожилыми жителями. Такие инициативы показывают, что решение, возможно, кроется не в новых технологиях, а в восстановлении настоящих сообществ.","ar":"وصف بعض خبراء الصحة الوحدة بأنها وباء العصر الحديث. وتشير الدراسات إلى أن الوحدة المزمنة قد تكون ضارة بالصحة بقدر تدخين خمس عشرة سيجارة يوميًا. والمفارقة أن هذه المشكلة تفاقمت في وقت أصبح فيه الناس متصلين رقميًا أكثر من أي وقت مضى. ويوضح الباحثون أن التفاعلات عبر الإنترنت، رغم سهولتها، نادرًا ما توفر الدعم العاطفي العميق الذي تقدمه العلاقات المباشرة وجهًا لوجه. ولا تقتصر المشكلة على كبار السن، بل تطال بشكل متزايد الشباب، الذين ينتقل كثير منهم إلى المدن الكبرى بعيدًا عن عائلاتهم وأصدقاء طفولتهم. وردًّا على ذلك، وضعت عدة دول استراتيجيات وطنية لمواجهة الوحدة، وفي إسرائيل تدير عدة بلديات اليوم برامج تربط الطلاب بالسكان المسنّين. وتُظهر هذه المبادرات أن الحل قد لا يكمن في تكنولوجيا جديدة، بل في إعادة بناء مجتمعات حقيقية.","questions":[["Why does the writer call the situation a paradox?","People are lonely despite being connected.","Smoking causes loneliness.","Old people use technology more.","Cities are less crowded than before."],["Who is increasingly affected by loneliness?","Young adults living far from home.","Children in primary school.","Families living in villages.","Doctors and health experts."],["What solution does the writer favour?","Rebuilding real, personal communities.","Developing new social apps.","Moving young adults back home.","Banning smartphones for students."]]}},{"en":"debate","he":"דיון וטיעון","ru":"дебаты","ar":"المناظرة","e":"🗣️","dialog":true,"items":[{"q":"Should school uniforms be compulsory? What's your view?","en":"In my view, uniforms reduce social pressure, although they limit self-expression.","he":"לדעתי, תלבושת אחידה מפחיתה לחץ חברתי, אף על פי שהיא מגבילה את הביטוי העצמי.","ru":"На мой взгляд, школьная форма снижает социальное давление, хотя и ограничивает самовыражение.","ar":"في رأيي، يقلّل الزي المدرسي الضغط الاجتماعي، مع أنه يحدّ من التعبير عن الذات."},{"q":"Do you think AI will create more jobs than it destroys?","en":"I believe it will, provided that people are retrained for new roles.","he":"אני מאמין שכן, בתנאי שאנשים יוסבו לתפקידים חדשים.","ru":"Думаю, да, при условии, что людей переобучат для новых профессий.","ar":"أعتقد ذلك، شريطة أن يُعاد تأهيل الناس لأدوار جديدة."},{"q":"What is the most serious problem facing your generation?","en":"Without a doubt, climate change, because its effects will last for centuries.","he":"ללא ספק, שינוי האקלים, כי השפעותיו יימשכו מאות שנים.","ru":"Без сомнения, изменение климата, потому что его последствия будут ощущаться веками.","ar":"بلا شك، تغيّر المناخ، لأن آثاره ستستمر لقرون."},{"q":"Some say social media should be banned for under-sixteens. Do you agree?","en":"I partly agree, but education is more effective than banning things.","he":"אני מסכים חלקית, אבל חינוך יעיל יותר מאיסורים.","ru":"Я частично согласен, но образование эффективнее запретов.","ar":"أوافق جزئيًا، لكن التوعية أكثر فاعلية من الحظر."},{"q":"How would you respond to someone who disagrees with you?","en":"I would listen carefully and then explain my position with evidence.","he":"הייתי מקשיב בתשומת לב ואז מסביר את עמדתי בעזרת ראיות.","ru":"Я бы внимательно выслушал, а затем объяснил свою позицию, опираясь на факты.","ar":"سأستمع بانتباه ثم أشرح موقفي مستندًا إلى الأدلة."},{"q":"If you could change one thing in the education system, what would it be?","en":"I would replace some exams with projects that develop critical thinking.","he":"הייתי מחליף חלק מהמבחנים בפרויקטים שמפתחים חשיבה ביקורתית.","ru":"Я бы заменил часть экзаменов проектами, развивающими критическое мышление.","ar":"كنتُ سأستبدل بعض الامتحانات بمشاريع تنمّي التفكير النقدي."}]}]},{"id":"m7","group":"middle","he":"כיתה ז׳","sub":"צעדים ראשונים בחטיבה","e":"🎒","units":[{"en":"school life","he":"חיי בית הספר","ru":"школьная жизнь","ar":"الحياة المدرسية","e":"🏫","items":[{"en":"I have English three times a week.","he":"יש לי אנגלית שלוש פעמים בשבוע.","ru":"У меня английский три раза в неделю.","ar":"لديّ درس إنجليزية ثلاث مرات في الأسبوع.","e":"","alt":[]},{"en":"Our new teacher is strict but very fair.","he":"המורה החדש שלנו קפדן אבל מאוד הוגן.","ru":"Наш новый учитель строгий, но очень справедливый.","ar":"معلّمنا الجديد صارم لكنه عادل جدًا.","e":"","alt":[]},{"en":"I'm studying for a math test tomorrow.","he":"אני לומד/ת למבחן במתמטיקה של מחר.","ru":"Я готовлюсь к завтрашней контрольной по математике.","ar":"أنا أدرس لامتحان الرياضيات غدًا.","e":"","alt":[]},{"en":"Can I borrow your notes from yesterday?","he":"אפשר לשאול את הסיכומים שלך מאתמול?","ru":"Можно взять твои вчерашние конспекты?","ar":"هل يمكنني استعارة ملاحظاتك من الأمس؟","e":"","alt":[]},{"en":"We forgot to do our homework again.","he":"שוב שכחנו להכין את שיעורי הבית.","ru":"Мы снова забыли сделать домашнее задание.","ar":"نسينا أن نحلّ واجباتنا المنزلية مرة أخرى.","e":"","alt":[]},{"en":"In my opinion, the break is too short.","he":"לדעתי, ההפסקה קצרה מדי.","ru":"По-моему, перемена слишком короткая.","ar":"في رأيي، الاستراحة قصيرة جدًا.","e":"","alt":[]}],"reading":{"en":"Noa is in seventh grade at a new school in Haifa. On the first day, she didn't know anyone. At lunch, a girl named Maya sat next to her and asked about her old school. Now they walk home together every day. Noa's favorite subject is science because the lessons are full of experiments.","he":"נועה בכיתה ז׳ בבית ספר חדש בחיפה. ביום הראשון היא לא הכירה אף אחד. בהפסקת הצהריים ילדה בשם מאיה התיישבה לידה ושאלה על בית הספר הקודם שלה. עכשיו הן הולכות הביתה יחד כל יום. המקצוע האהוב על נועה הוא מדעים, כי השיעורים מלאים בניסויים.","ru":"Ноа учится в седьмом классе в новой школе в Хайфе. В первый день она никого не знала. Во время обеда девочка по имени Майя села рядом с ней и спросила о её старой школе. Теперь они каждый день вместе идут домой. Любимый предмет Ноа — естествознание, потому что на уроках много опытов.","ar":"نوعا في الصف السابع في مدرسة جديدة في حيفا. في اليوم الأول لم تكن تعرف أحدًا. في استراحة الغداء جلست بجانبها فتاة اسمها مايا وسألتها عن مدرستها القديمة. الآن تعودان إلى البيت معًا كل يوم. مادة نوعا المفضّلة هي العلوم لأن الدروس مليئة بالتجارب.","questions":[["Where is Noa's new school?","in haifa","in tel aviv","in jerusalem"],["Who sat next to Noa at lunch?","maya","her teacher","her brother"],["Why does Noa like science?","because of the experiments","because it is easy","because maya teaches it"]]}},{"en":"friendship","he":"חברות","ru":"дружба","ar":"الصداقة","e":"🤝","items":[{"en":"A good friend always listens to you.","he":"חבר טוב תמיד מקשיב לך.","ru":"Хороший друг всегда тебя выслушает.","ar":"الصديق الجيد يستمع إليك دائمًا.","e":"","alt":[]},{"en":"We met in first grade and became best friends.","he":"נפגשנו בכיתה א׳ והפכנו לחברים הכי טובים.","ru":"Мы познакомились в первом классе и стали лучшими друзьями.","ar":"التقينا في الصف الأول وأصبحنا أعزّ الأصدقاء.","e":"","alt":[]},{"en":"I'm sorry, I didn't mean to hurt you.","he":"אני מצטער/ת, לא התכוונתי לפגוע בך.","ru":"Прости, я не хотел тебя обидеть.","ar":"آسف، لم أقصد أن أجرحك.","e":"","alt":[]},{"en":"Do you want to come over after school?","he":"רוצה לבוא אליי אחרי בית הספר?","ru":"Хочешь зайти ко мне после школы?","ar":"هل تريد أن تأتي إليّ بعد المدرسة؟","e":"","alt":[]},{"en":"She is funnier than anyone in our class.","he":"היא מצחיקה יותר מכל אחד בכיתה שלנו.","ru":"Она смешнее всех в нашем классе.","ar":"هي أظرف من أي أحد في صفّنا.","e":"","alt":[]},{"en":"You can always tell me the truth.","he":"אתה תמיד יכול להגיד לי את האמת.","ru":"Ты всегда можешь сказать мне правду.","ar":"يمكنك دائمًا أن تقول لي الحقيقة.","e":"","alt":[]}],"reading":{"en":"Itay and Omer are neighbors and best friends. Last week they had a big fight about a football game. For three days they didn't talk to each other. Then Omer sent Itay a message and said sorry. Now they are friends again, and they are planning a bike trip for the summer.","he":"איתי ועומר שכנים וחברים הכי טובים. בשבוע שעבר הם רבו ריב גדול על משחק כדורגל. במשך שלושה ימים הם לא דיברו זה עם זה. אז עומר שלח לאיתי הודעה וביקש סליחה. עכשיו הם שוב חברים, והם מתכננים טיול אופניים לקיץ.","ru":"Итай и Омер — соседи и лучшие друзья. На прошлой неделе они сильно поссорились из-за футбольного матча. Три дня они не разговаривали друг с другом. Потом Омер написал Итаю сообщение и извинился. Теперь они снова друзья и планируют велопоход на лето.","ar":"إيتاي وعومر جاران وأعزّ صديقين. في الأسبوع الماضي تشاجرا شجارًا كبيرًا بسبب مباراة كرة قدم. لمدة ثلاثة أيام لم يتحدّثا مع بعضهما. ثم أرسل عومر رسالة إلى إيتاي واعتذر. الآن عادا صديقين، وهما يخطّطان لرحلة على الدراجات في الصيف.","questions":[["What did Itay and Omer fight about?","a football game","a video game","a girl in their class"],["How long didn't they talk?","three days","a week","two hours"],["What are they planning for the summer?","a bike trip","a beach party","a football camp"]]}},{"en":"sports","he":"ספורט","ru":"спорт","ar":"الرياضة","e":"⚽","items":[{"en":"I play basketball twice a week after school.","he":"אני משחק/ת כדורסל פעמיים בשבוע אחרי בית הספר.","ru":"Я играю в баскетбол два раза в неделю после школы.","ar":"ألعب كرة السلة مرتين في الأسبوع بعد المدرسة.","e":"","alt":[]},{"en":"Our team won the game by two points.","he":"הקבוצה שלנו ניצחה במשחק בהפרש של שתי נקודות.","ru":"Наша команда выиграла матч с разницей в два очка.","ar":"فاز فريقنا في المباراة بفارق نقطتين.","e":"","alt":[]},{"en":"You should warm up before you run.","he":"כדאי לעשות חימום לפני שרצים.","ru":"Перед бегом нужно сделать разминку.","ar":"يجب أن تقوم بالإحماء قبل أن تركض.","e":"","alt":[]},{"en":"Swimming is better than running for my knees.","he":"שחייה טובה יותר מריצה בשביל הברכיים שלי.","ru":"Для моих коленей плавание лучше, чем бег.","ar":"السباحة أفضل من الركض لركبتيّ.","e":"","alt":[]},{"en":"I'm going to join the school volleyball team.","he":"אני הולך/ת להצטרף לנבחרת הכדורעף של בית הספר.","ru":"Я собираюсь записаться в школьную команду по волейболу.","ar":"سأنضمّ إلى فريق الكرة الطائرة في المدرسة.","e":"","alt":[]},{"en":"Who is your favorite football player?","he":"מי שחקן הכדורגל האהוב עליך?","ru":"Кто твой любимый футболист?","ar":"من هو لاعب كرة القدم المفضّل لديك؟","e":"","alt":[]}],"reading":{"en":"Yael is thirteen and she loves judo. She trains three evenings a week at a club in Netanya. Last month she competed in her first tournament. She lost her first match, but she won the next two. Her coach says that she must practice more, but he is proud of her.","he":"יעל בת שלוש־עשרה והיא אוהבת ג׳ודו. היא מתאמנת שלושה ערבים בשבוע במועדון בנתניה. בחודש שעבר היא התחרתה בטורניר הראשון שלה. היא הפסידה בקרב הראשון, אבל ניצחה בשניים הבאים. המאמן שלה אומר שהיא חייבת להתאמן יותר, אבל הוא גאה בה.","ru":"Яэль тринадцать лет, и она любит дзюдо. Она тренируется три вечера в неделю в клубе в Нетании. В прошлом месяце она участвовала в своём первом турнире. Первую схватку она проиграла, но две следующие выиграла. Тренер говорит, что ей нужно больше тренироваться, но он ею гордится.","ar":"ياعيل في الثالثة عشرة من عمرها وهي تحبّ الجودو. تتدرّب ثلاث أمسيات في الأسبوع في نادٍ في نتانيا. في الشهر الماضي شاركت في أول بطولة لها. خسرت نزالها الأول، لكنها فازت في النزالين التاليين. يقول مدرّبها إن عليها أن تتدرّب أكثر، لكنه فخور بها.","questions":[["Where does Yael train?","in netanya","in eilat","at her school"],["What happened in her first match?","she lost","she won","she got hurt"],["How does her coach feel about her?","proud","angry","worried"]]}},{"en":"social media","he":"רשתות חברתיות","ru":"соцсети","ar":"وسائل التواصل الاجتماعي","e":"📱","items":[{"en":"I post a photo on Instagram almost every day.","he":"אני מעלה תמונה לאינסטגרם כמעט כל יום.","ru":"Я выкладываю фото в Инстаграм почти каждый день.","ar":"أنشر صورة على إنستغرام كل يوم تقريبًا.","e":"","alt":[]},{"en":"Don't share your password with anyone.","he":"אל תשתף את הסיסמה שלך עם אף אחד.","ru":"Никому не говори свой пароль.","ar":"لا تشارك كلمة المرور الخاصة بك مع أي أحد.","e":"","alt":[]},{"en":"How many followers do you have?","he":"כמה עוקבים יש לך?","ru":"Сколько у тебя подписчиков?","ar":"كم متابعًا لديك؟","e":"","alt":[]},{"en":"I spend too much time on my phone.","he":"אני מבלה יותר מדי זמן בטלפון.","ru":"Я провожу слишком много времени в телефоне.","ar":"أقضي وقتًا طويلًا جدًا على هاتفي.","e":"","alt":[]},{"en":"That video is going to go viral!","he":"הסרטון הזה הולך להיות ויראלי!","ru":"Это видео станет вирусным!","ar":"هذا الفيديو سينتشر بسرعة كبيرة!","e":"","alt":[]},{"en":"You shouldn't believe everything you see online.","he":"לא כדאי להאמין לכל מה שרואים ברשת.","ru":"Не стоит верить всему, что видишь в интернете.","ar":"لا يجب أن تصدّق كل ما تراه على الإنترنت.","e":"","alt":[]}],"reading":{"en":"Daniel started a cooking channel on YouTube last year. Every Friday he uploads a short video of a simple recipe. At first only his family watched, but now he has two thousand subscribers. Some people write mean comments, but he doesn't answer them. His parents only let him film on weekends, so school comes first.","he":"דניאל פתח ערוץ בישול ביוטיוב בשנה שעברה. בכל יום שישי הוא מעלה סרטון קצר של מתכון פשוט. בהתחלה רק המשפחה שלו צפתה, אבל עכשיו יש לו אלפיים מנויים. יש אנשים שכותבים תגובות מרושעות, אבל הוא לא עונה להם. ההורים שלו מרשים לו לצלם רק בסופי שבוע, כך שבית הספר בא קודם.","ru":"Даниэль открыл кулинарный канал на YouTube в прошлом году. Каждую пятницу он выкладывает короткое видео с простым рецептом. Сначала его смотрела только семья, а теперь у него две тысячи подписчиков. Некоторые пишут злые комментарии, но он на них не отвечает. Родители разрешают ему снимать только по выходным, так что школа на первом месте.","ar":"أنشأ دانيال قناة طبخ على يوتيوب في السنة الماضية. كل يوم جمعة ينشر فيديو قصيرًا لوصفة بسيطة. في البداية كانت عائلته فقط تشاهد، لكن الآن لديه ألفا مشترك. بعض الناس يكتبون تعليقات لئيمة، لكنه لا يردّ عليهم. يسمح له والداه بالتصوير في عطلة نهاية الأسبوع فقط، لذلك المدرسة أولًا.","questions":[["When does Daniel upload his videos?","every friday","every monday","every day"],["How many subscribers does he have now?","two thousand","two hundred","twenty thousand"],["What does he do about mean comments?","he doesn't answer them","he deletes his channel","he tells his teacher"]]}},{"en":"healthy food","he":"אוכל בריא","ru":"здоровое питание","ar":"الطعام الصحي","e":"🥗","items":[{"en":"I try to eat fruit every morning.","he":"אני משתדל/ת לאכול פרי כל בוקר.","ru":"Я стараюсь есть фрукты каждое утро.","ar":"أحاول أن آكل الفاكهة كل صباح.","e":"","alt":[]},{"en":"You should drink more water when it's hot.","he":"כדאי לשתות יותר מים כשחם.","ru":"Когда жарко, нужно пить больше воды.","ar":"يجب أن تشرب المزيد من الماء عندما يكون الجو حارًا.","e":"","alt":[]},{"en":"I don't eat meat because I'm a vegetarian.","he":"אני לא אוכל/ת בשר כי אני צמחוני/ת.","ru":"Я не ем мясо, потому что я вегетарианец.","ar":"لا آكل اللحم لأنني نباتي.","e":"","alt":[]},{"en":"Fast food is tasty but not very healthy.","he":"אוכל מהיר טעים אבל לא כל כך בריא.","ru":"Фастфуд вкусный, но не очень полезный.","ar":"الوجبات السريعة لذيذة لكنها ليست صحية جدًا.","e":"","alt":[]},{"en":"My mom is cooking shakshuka for dinner tonight.","he":"אמא שלי מבשלת שקשוקה לארוחת הערב הלילה.","ru":"Мама сегодня готовит шакшуку на ужин.","ar":"أمي تطبخ الشكشوكة للعشاء الليلة.","e":"","alt":[]},{"en":"How many hours do you sleep every night?","he":"כמה שעות אתה ישן כל לילה?","ru":"Сколько часов ты спишь каждую ночь?","ar":"كم ساعة تنام كل ليلة؟","e":"","alt":[]}],"reading":{"en":"Tamar often felt tired at school. Her doctor asked her about her habits. Tamar went to bed late and didn't eat breakfast. Now she goes to sleep before ten and eats yogurt with fruit every morning. After two weeks, she feels much better in class.","he":"תמר הרגישה לעיתים קרובות עייפה בבית הספר. הרופאה שלה שאלה אותה על ההרגלים שלה. תמר הלכה לישון מאוחר ולא אכלה ארוחת בוקר. עכשיו היא הולכת לישון לפני עשר ואוכלת יוגורט עם פירות כל בוקר. אחרי שבועיים היא מרגישה הרבה יותר טוב בכיתה.","ru":"Тамар часто чувствовала усталость в школе. Врач спросила её о её привычках. Тамар поздно ложилась спать и не завтракала. Теперь она ложится спать до десяти и каждое утро ест йогурт с фруктами. Через две недели она чувствует себя на уроках гораздо лучше.","ar":"كانت تمار تشعر بالتعب كثيرًا في المدرسة. سألتها طبيبتها عن عاداتها. كانت تمار تنام متأخرة ولا تتناول الفطور. الآن تنام قبل العاشرة وتأكل اللبن مع الفاكهة كل صباح. بعد أسبوعين أصبحت تشعر بتحسّن كبير في الصف.","questions":[["How did Tamar often feel at school?","tired","happy","hungry"],["What does Tamar eat every morning now?","yogurt with fruit","eggs and bread","nothing"],["When does she go to sleep now?","before ten","after midnight","at eleven"]]}},{"en":"meeting someone new","he":"היכרות","ru":"знакомство","ar":"التعارف","e":"👋","dialog":true,"items":[{"q":"Hi! What's your name?","en":"Hi, my name is Noa. Nice to meet you.","he":"היי, קוראים לי נועה. נעים להכיר.","ru":"Привет, меня зовут Ноа. Приятно познакомиться.","ar":"مرحبًا، اسمي نوعا. تشرّفت بمعرفتك."},{"q":"How old are you?","en":"I'm thirteen years old.","he":"אני בן/בת שלוש־עשרה.","ru":"Мне тринадцать лет.","ar":"عمري ثلاث عشرة سنة."},{"q":"Where do you live?","en":"I live in Petah Tikva with my family.","he":"אני גר/ה בפתח תקווה עם המשפחה שלי.","ru":"Я живу в Петах-Тикве со своей семьёй.","ar":"أسكن في بيتح تكفا مع عائلتي."},{"q":"What do you like to do in your free time?","en":"I like playing football and listening to music.","he":"אני אוהב/ת לשחק כדורגל ולהקשיב למוזיקה.","ru":"Я люблю играть в футбол и слушать музыку.","ar":"أحبّ لعب كرة القدم والاستماع إلى الموسيقى."},{"q":"What's your favorite subject at school?","en":"My favorite subject is English because it's fun.","he":"המקצוע האהוב עליי הוא אנגלית כי זה כיף.","ru":"Мой любимый предмет — английский, потому что это интересно.","ar":"مادتي المفضّلة هي الإنجليزية لأنها ممتعة."},{"q":"What are you going to do this weekend?","en":"I'm going to visit my grandparents.","he":"אני הולך/ת לבקר את סבא וסבתא שלי.","ru":"Я собираюсь навестить бабушку и дедушку.","ar":"سأزور جدّي وجدّتي."}]}]},{"id":"m8","group":"middle","he":"כיתה ח׳","sub":"מתקדמים בביטחון","e":"🚀","units":[{"en":"technology","he":"טכנולוגיה","ru":"технологии","ar":"التكنولوجيا","e":"💻","items":[{"en":"I've just downloaded a new app for learning.","he":"הרגע הורדתי אפליקציה חדשה ללמידה.","ru":"Я только что скачал новое приложение для учёбы.","ar":"لقد حمّلت للتو تطبيقًا جديدًا للتعلّم.","e":"","alt":[]},{"en":"My laptop crashed while I was writing my essay.","he":"המחשב הנייד שלי קרס בזמן שכתבתי את החיבור.","ru":"Мой ноутбук завис, пока я писал сочинение.","ar":"تعطّل حاسوبي المحمول بينما كنت أكتب مقالي.","e":"","alt":[]},{"en":"Have you ever tried virtual reality glasses?","he":"ניסית פעם משקפי מציאות מדומה?","ru":"Ты когда-нибудь пробовал очки виртуальной реальности?","ar":"هل جرّبت يومًا نظارات الواقع الافتراضي؟","e":"","alt":[]},{"en":"Robots will do many jobs in the future.","he":"רובוטים יעשו הרבה עבודות בעתיד.","ru":"В будущем роботы будут выполнять много работ.","ar":"ستقوم الروبوتات بالكثير من الوظائف في المستقبل.","e":"","alt":[]},{"en":"If you charge it now, it will work tomorrow.","he":"אם תטעין את זה עכשיו, זה יעבוד מחר.","ru":"Если зарядишь его сейчас, завтра он будет работать.","ar":"إذا شحنته الآن، فسيعمل غدًا.","e":"","alt":[]},{"en":"You must update your phone to stay safe.","he":"אתה חייב לעדכן את הטלפון כדי להישאר מוגן.","ru":"Нужно обновлять телефон, чтобы оставаться в безопасности.","ar":"يجب أن تحدّث هاتفك لتبقى آمنًا.","e":"","alt":[]}],"reading":{"en":"Roni has always loved computers. Last year she joined a robotics club at her school in Rehovot. Her team has built a small robot that can sort plastic and paper. While they were testing it, the robot fell off the table and broke. They fixed it in two days, and next month they will show it at a national competition.","he":"רוני תמיד אהבה מחשבים. בשנה שעברה היא הצטרפה למועדון רובוטיקה בבית הספר שלה ברחובות. הקבוצה שלה בנתה רובוט קטן שיכול למיין פלסטיק ונייר. בזמן שהם בדקו אותו, הרובוט נפל מהשולחן ונשבר. הם תיקנו אותו תוך יומיים, ובחודש הבא הם יציגו אותו בתחרות ארצית.","ru":"Рони всегда любила компьютеры. В прошлом году она записалась в кружок робототехники в своей школе в Реховоте. Её команда построила маленького робота, который умеет сортировать пластик и бумагу. Когда они его испытывали, робот упал со стола и сломался. Они починили его за два дня, а в следующем месяце покажут его на национальном конкурсе.","ar":"لطالما أحبّت روني الحواسيب. في السنة الماضية انضمّت إلى نادي الروبوتات في مدرستها في رحوفوت. بنى فريقها روبوتًا صغيرًا يستطيع فرز البلاستيك والورق. بينما كانوا يختبرونه، سقط الروبوت عن الطاولة وانكسر. أصلحوه خلال يومين، وفي الشهر القادم سيعرضونه في مسابقة وطنية.","questions":[["What can the robot do?","sort plastic and paper","clean the classroom","play football"],["What happened while they were testing it?","it fell and broke","it caught fire","it stopped talking"],["Where will they show the robot?","at a national competition","on television","at a museum"]]}},{"en":"environment","he":"איכות הסביבה","ru":"окружающая среда","ar":"البيئة","e":"🌍","items":[{"en":"We have started recycling bottles at home.","he":"התחלנו למחזר בקבוקים בבית.","ru":"Дома мы начали сдавать бутылки на переработку.","ar":"بدأنا بإعادة تدوير الزجاجات في البيت.","e":"","alt":[]},{"en":"Turn off the lights when you leave the room.","he":"כבה את האור כשאתה יוצא מהחדר.","ru":"Выключай свет, когда выходишь из комнаты.","ar":"أطفئ الأضواء عندما تغادر الغرفة.","e":"","alt":[]},{"en":"If we don't act now, it will be too late.","he":"אם לא נפעל עכשיו, יהיה מאוחר מדי.","ru":"Если мы не начнём действовать сейчас, будет слишком поздно.","ar":"إذا لم نتحرّك الآن، فسيفوت الأوان.","e":"","alt":[]},{"en":"Plastic bags are terrible for sea animals.","he":"שקיות פלסטיק מזיקות מאוד לבעלי חיים בים.","ru":"Пластиковые пакеты ужасно вредны для морских животных.","ar":"الأكياس البلاستيكية مضرّة جدًا بالحيوانات البحرية.","e":"","alt":[]},{"en":"I take the bus because it's better for the planet.","he":"אני נוסע/ת באוטובוס כי זה טוב יותר לכדור הארץ.","ru":"Я езжу на автобусе, потому что это лучше для планеты.","ar":"أركب الحافلة لأن ذلك أفضل لكوكب الأرض.","e":"","alt":[]},{"en":"We have to save water, especially in summer.","he":"אנחנו חייבים לחסוך במים, במיוחד בקיץ.","ru":"Мы должны экономить воду, особенно летом.","ar":"علينا أن نوفّر الماء، خاصة في الصيف.","e":"","alt":[]}],"reading":{"en":"Last Friday, Eitan's class went to clean the beach in Ashdod. When they arrived, the sand was full of bottles and bags. They were working for three hours under the hot sun. In the end they collected forty bags of garbage. Eitan has decided to use a metal bottle from now on, so he won't need plastic ones.","he":"ביום שישי שעבר הכיתה של איתן יצאה לנקות את החוף באשדוד. כשהם הגיעו, החול היה מלא בבקבוקים ושקיות. הם עבדו שלוש שעות תחת השמש החמה. בסוף הם אספו ארבעים שקי זבל. איתן החליט להשתמש מעכשיו בבקבוק מתכת, כדי שלא יצטרך בקבוקי פלסטיק.","ru":"В прошлую пятницу класс Эйтана поехал убирать пляж в Ашдоде. Когда они приехали, песок был полон бутылок и пакетов. Они работали три часа под жарким солнцем. В итоге они собрали сорок мешков мусора. Эйтан решил отныне пользоваться металлической бутылкой, чтобы ему не были нужны пластиковые.","ar":"يوم الجمعة الماضي ذهب صفّ إيتان لتنظيف الشاطئ في أسدود. عندما وصلوا، كان الرمل مليئًا بالزجاجات والأكياس. عملوا لمدة ثلاث ساعات تحت الشمس الحارقة. في النهاية جمعوا أربعين كيسًا من القمامة. قرّر إيتان أن يستخدم زجاجة معدنية من الآن فصاعدًا، حتى لا يحتاج إلى الزجاجات البلاستيكية.","questions":[["Where did the class go last Friday?","to the beach in ashdod","to a park in haifa","to a forest in the north"],["How long did they work?","three hours","one hour","all day"],["What has Eitan decided to do?","use a metal bottle","buy plastic bottles","clean the beach every week"]]}},{"en":"music","he":"מוזיקה","ru":"музыка","ar":"الموسيقى","e":"🎵","items":[{"en":"I've been learning the guitar for two years.","he":"אני לומד/ת גיטרה כבר שנתיים.","ru":"Я учусь играть на гитаре уже два года.","ar":"أتعلّم العزف على الغيتار منذ سنتين.","e":"","alt":[]},{"en":"This song always puts me in a good mood.","he":"השיר הזה תמיד מכניס אותי למצב רוח טוב.","ru":"Эта песня всегда поднимает мне настроение.","ar":"هذه الأغنية تحسّن مزاجي دائمًا.","e":"","alt":[]},{"en":"Have you heard their new album yet?","he":"כבר שמעת את האלבום החדש שלהם?","ru":"Ты уже слышал их новый альбом?","ar":"هل سمعت ألبومهم الجديد بعد؟","e":"","alt":[]},{"en":"I was dancing when the lights suddenly went out.","he":"רקדתי כשהאורות פתאום כבו.","ru":"Я танцевал, когда вдруг погас свет.","ar":"كنت أرقص عندما انطفأت الأضواء فجأة.","e":"","alt":[]},{"en":"If the tickets aren't too expensive, I'll go.","he":"אם הכרטיסים לא יהיו יקרים מדי, אלך.","ru":"Если билеты будут не слишком дорогими, я пойду.","ar":"إذا لم تكن التذاكر غالية جدًا، فسأذهب.","e":"","alt":[]},{"en":"In my opinion, the lyrics are better than the music.","he":"לדעתי, המילים טובות יותר מהלחן.","ru":"По-моему, слова лучше, чем музыка.","ar":"في رأيي، الكلمات أفضل من اللحن.","e":"","alt":[]}],"reading":{"en":"Shira has played the piano since she was six. This year she has started writing her own songs in Hebrew and English. Last month she was performing at a school event when her microphone stopped working. She didn't stop, and she sang even louder. Everyone clapped, and now her friends want her to start a band.","he":"שירה מנגנת בפסנתר מאז שהייתה בת שש. השנה היא התחילה לכתוב שירים משלה בעברית ובאנגלית. בחודש שעבר היא הופיעה באירוע בית ספרי כשהמיקרופון שלה הפסיק לעבוד. היא לא עצרה, ושרה אפילו חזק יותר. כולם מחאו כפיים, ועכשיו החברים שלה רוצים שהיא תקים להקה.","ru":"Шира играет на фортепиано с шести лет. В этом году она начала писать собственные песни на иврите и английском. В прошлом месяце она выступала на школьном мероприятии, когда её микрофон перестал работать. Она не остановилась и запела ещё громче. Все аплодировали, и теперь друзья хотят, чтобы она создала группу.","ar":"تعزف شيرا على البيانو منذ أن كانت في السادسة. هذه السنة بدأت تكتب أغانيها الخاصة بالعبرية والإنجليزية. في الشهر الماضي كانت تغنّي في حفل مدرسي عندما توقّف الميكروفون عن العمل. لم تتوقّف، بل غنّت بصوت أعلى. صفّق الجميع، والآن يريد أصدقاؤها أن تؤسّس فرقة.","questions":[["How old was Shira when she started playing the piano?","six","ten","three"],["What happened during her performance?","her microphone stopped working","she forgot the words","the piano broke"],["What do her friends want her to do?","start a band","stop singing","learn the guitar"]]}},{"en":"travel","he":"טיולים","ru":"путешествия","ar":"السفر","e":"✈️","items":[{"en":"Have you ever been abroad?","he":"היית פעם בחו״ל?","ru":"Ты когда-нибудь был за границей?","ar":"هل سافرت إلى الخارج من قبل؟","e":"","alt":[]},{"en":"We're flying to Greece next summer.","he":"אנחנו טסים ליוון בקיץ הבא.","ru":"Следующим летом мы летим в Грецию.","ar":"سنسافر بالطائرة إلى اليونان في الصيف القادم.","e":"","alt":[]},{"en":"Don't forget to pack your passport!","he":"אל תשכח לארוז את הדרכון!","ru":"Не забудь взять паспорт!","ar":"لا تنسَ أن تحزم جواز سفرك!","e":"","alt":[]},{"en":"We were waiting at the airport for five hours.","he":"חיכינו בשדה התעופה חמש שעות.","ru":"Мы ждали в аэропорту пять часов.","ar":"كنّا ننتظر في المطار خمس ساعات.","e":"","alt":[]},{"en":"If it rains, we'll visit a museum instead.","he":"אם ירד גשם, נבקר במוזיאון במקום.","ru":"Если пойдёт дождь, мы вместо этого сходим в музей.","ar":"إذا أمطرت، فسنزور متحفًا بدلًا من ذلك.","e":"","alt":[]},{"en":"Excuse me, how do I get to the train station?","he":"סליחה, איך מגיעים לתחנת הרכבת?","ru":"Извините, как пройти к вокзалу?","ar":"عفوًا، كيف أصل إلى محطة القطار؟","e":"","alt":[]}],"reading":{"en":"Last summer Lior and his family traveled to London for a week. On the first day they were walking near the river when it started to rain. They ran into a small cafe and tried English tea for the first time. Lior has never seen so many red buses in his life. Next year they will visit Scotland if they can find cheap flights.","he":"בקיץ שעבר ליאור והמשפחה שלו נסעו ללונדון לשבוע. ביום הראשון הם טיילו ליד הנהר כשהתחיל לרדת גשם. הם רצו לבית קפה קטן וטעמו תה אנגלי בפעם הראשונה. ליאור מעולם לא ראה כל כך הרבה אוטובוסים אדומים בחייו. בשנה הבאה הם יבקרו בסקוטלנד אם ימצאו טיסות זולות.","ru":"Прошлым летом Лиор с семьёй поехал в Лондон на неделю. В первый день они гуляли у реки, когда пошёл дождь. Они забежали в маленькое кафе и впервые попробовали английский чай. Лиор никогда в жизни не видел столько красных автобусов. В следующем году они поедут в Шотландию, если найдут дешёвые билеты.","ar":"في الصيف الماضي سافر ليئور وعائلته إلى لندن لمدة أسبوع. في اليوم الأول كانوا يتمشّون قرب النهر عندما بدأ المطر يهطل. ركضوا إلى مقهى صغير وجرّبوا الشاي الإنجليزي لأول مرة. لم يرَ ليئور في حياته هذا العدد الكبير من الحافلات الحمراء. في السنة القادمة سيزورون اسكتلندا إذا وجدوا رحلات رخيصة.","questions":[["How long was the trip to London?","a week","a month","two days"],["What were they doing when it started to rain?","walking near the river","eating lunch","riding a bus"],["What do they need to visit Scotland?","cheap flights","a new car","new passports"]]}},{"en":"health","he":"בריאות","ru":"здоровье","ar":"الصحة","e":"💪","items":[{"en":"I've had a headache since this morning.","he":"יש לי כאב ראש מהבוקר.","ru":"У меня с утра болит голова.","ar":"أعاني من صداع منذ الصباح.","e":"","alt":[]},{"en":"You should see a doctor if it gets worse.","he":"כדאי ללכת לרופא אם זה מחמיר.","ru":"Если станет хуже, тебе стоит сходить к врачу.","ar":"يجب أن تزور الطبيب إذا ساءت حالتك.","e":"","alt":[]},{"en":"I hurt my ankle while I was playing tennis.","he":"נפגעתי בקרסול בזמן ששיחקתי טניס.","ru":"Я повредил лодыжку, когда играл в теннис.","ar":"أصبت كاحلي بينما كنت ألعب التنس.","e":"","alt":[]},{"en":"Getting enough sleep is important for your brain.","he":"שינה מספקת חשובה למוח שלך.","ru":"Достаточный сон важен для мозга.","ar":"النوم الكافي مهمّ لدماغك.","e":"","alt":[]},{"en":"If you exercise every day, you'll feel stronger.","he":"אם תתאמן כל יום, תרגיש חזק יותר.","ru":"Если будешь заниматься спортом каждый день, почувствуешь себя сильнее.","ar":"إذا تمرّنت كل يوم، فستشعر بأنك أقوى.","e":"","alt":[]},{"en":"I have to take this medicine twice a day.","he":"אני צריך/ה לקחת את התרופה הזאת פעמיים ביום.","ru":"Мне нужно принимать это лекарство два раза в день.","ar":"عليّ أن أتناول هذا الدواء مرتين في اليوم.","e":"","alt":[]}],"reading":{"en":"Ariel was running in a race in Tel Aviv when he suddenly felt dizzy. A volunteer gave him water and helped him sit in the shade. He didn't drink enough water before the race. The doctor said that he must drink more and eat a good breakfast before running. Since then, Ariel has run two more races without any problems.","he":"אריאל רץ במרוץ בתל אביב כשפתאום הרגיש סחרחורת. מתנדב נתן לו מים ועזר לו לשבת בצל. הוא לא שתה מספיק מים לפני המרוץ. הרופא אמר שהוא חייב לשתות יותר ולאכול ארוחת בוקר טובה לפני ריצה. מאז, אריאל רץ בעוד שני מרוצים בלי שום בעיה.","ru":"Ариэль бежал в забеге в Тель-Авиве, когда у него вдруг закружилась голова. Волонтёр дал ему воды и помог сесть в тени. Перед забегом он выпил недостаточно воды. Врач сказал, что ему нужно больше пить и хорошо завтракать перед бегом. С тех пор Ариэль пробежал ещё два забега без всяких проблем.","ar":"كان أرئيل يركض في سباق في تل أبيب عندما شعر فجأة بالدوار. أعطاه متطوّع ماءً وساعده على الجلوس في الظل. لم يشرب ما يكفي من الماء قبل السباق. قال الطبيب إن عليه أن يشرب أكثر وأن يتناول فطورًا جيدًا قبل الركض. منذ ذلك الحين، ركض أرئيل في سباقين آخرين دون أي مشاكل.","questions":[["How did Ariel feel during the race?","dizzy","hungry","sleepy"],["Who helped him?","a volunteer","his mother","a police officer"],["How many races has he run since then?","two","five","none"]]}},{"en":"making plans","he":"מתכננים יחד","ru":"строим планы","ar":"وضع الخطط","e":"📅","dialog":true,"items":[{"q":"Are you free this Saturday?","en":"Yes, I'm free in the afternoon.","he":"כן, אני פנוי/ה אחר הצהריים.","ru":"Да, я свободен после обеда.","ar":"نعم، أنا متفرّغ بعد الظهر."},{"q":"What would you like to do?","en":"Let's go to the beach if the weather is nice.","he":"בוא נלך לים אם מזג האוויר יהיה נעים.","ru":"Давай пойдём на пляж, если будет хорошая погода.","ar":"لنذهب إلى الشاطئ إذا كان الطقس جميلًا."},{"q":"Have you ever been to the new mall?","en":"No, I haven't, but I really want to go.","he":"לא, לא הייתי, אבל אני ממש רוצה ללכת.","ru":"Нет, не был, но очень хочу сходить.","ar":"لا، لم أذهب، لكنني أريد الذهاب حقًا."},{"q":"How will we get there?","en":"We can take the bus from the center.","he":"אנחנו יכולים לנסוע באוטובוס מהמרכז.","ru":"Мы можем поехать на автобусе из центра.","ar":"يمكننا أن نركب الحافلة من المركز."},{"q":"What time should we meet?","en":"Let's meet at four next to the station.","he":"בוא ניפגש בארבע ליד התחנה.","ru":"Давай встретимся в четыре у остановки.","ar":"لنلتقِ في الساعة الرابعة بجانب المحطة."},{"q":"What will we do if it rains?","en":"If it rains, we'll watch a movie at my place.","he":"אם ירד גשם, נראה סרט אצלי.","ru":"Если пойдёт дождь, посмотрим фильм у меня.","ar":"إذا أمطرت، فسنشاهد فيلمًا في بيتي."}]}]},{"id":"m9","group":"middle","he":"כיתה ט׳","sub":"לקראת התיכון","e":"🎓","units":[{"en":"volunteering","he":"התנדבות","ru":"волонтёрство","ar":"التطوّع","e":"🤲","items":[{"en":"I volunteer at an animal shelter every Tuesday.","he":"אני מתנדב/ת במקלט לבעלי חיים בכל יום שלישי.","ru":"Каждый вторник я работаю волонтёром в приюте для животных.","ar":"أتطوّع في ملجأ للحيوانات كل يوم ثلاثاء.","e":"","alt":[]},{"en":"Helping others makes me feel useful.","he":"לעזור לאחרים גורם לי להרגיש מועיל/ה.","ru":"Когда я помогаю другим, я чувствую себя полезным.","ar":"مساعدة الآخرين تجعلني أشعر بأنني مفيد.","e":"","alt":[]},{"en":"If I had more time, I would volunteer more often.","he":"אם היה לי יותר זמן, הייתי מתנדב/ת לעיתים קרובות יותר.","ru":"Если бы у меня было больше времени, я бы чаще работал волонтёром.","ar":"لو كان لديّ وقت أكثر، لتطوّعت أكثر.","e":"","alt":[]},{"en":"The food was donated by local families.","he":"האוכל נתרם על ידי משפחות מהאזור.","ru":"Еду пожертвовали местные семьи.","ar":"تمّ التبرّع بالطعام من قِبل عائلات محلية.","e":"","alt":[]},{"en":"Although it's hard work, I really enjoy it.","he":"למרות שזו עבודה קשה, אני ממש נהנה/ית ממנה.","ru":"Хотя это тяжёлая работа, мне она очень нравится.","ar":"رغم أنه عمل شاق، فإنني أستمتع به كثيرًا.","e":"","alt":[]},{"en":"Everyone can make a difference in their community.","he":"כל אחד יכול לחולל שינוי בקהילה שלו.","ru":"Каждый может что-то изменить в своём сообществе.","ar":"يستطيع كل شخص أن يُحدث فرقًا في مجتمعه.","e":"","alt":[]}],"reading":{"en":"Many Israeli teenagers volunteer in their community after school. Gal, a ninth grader, chose to help elderly people at a center in Kfar Saba. At first she was nervous because she didn't know what to talk about. However, after a few weeks she became close to a woman named Rivka. Rivka was born in Morocco and came to Israel as a young girl. She told Gal many stories about her childhood. Gal says that this experience has changed the way she sees older people.","he":"בני נוער רבים בישראל מתנדבים בקהילה שלהם אחרי הלימודים. גל, תלמידת כיתה ט׳, בחרה לעזור לקשישים במרכז בכפר סבא. בהתחלה היא הייתה לחוצה כי לא ידעה על מה לדבר. אולם אחרי כמה שבועות היא התקרבה לאישה בשם רבקה. רבקה נולדה במרוקו ועלתה לישראל כילדה צעירה. היא סיפרה לגל סיפורים רבים על ילדותה. גל אומרת שהחוויה הזאת שינתה את הדרך שבה היא רואה אנשים מבוגרים.","ru":"Многие израильские подростки после школы занимаются волонтёрством. Гал, ученица девятого класса, решила помогать пожилым людям в центре в Кфар-Сабе. Сначала она волновалась, потому что не знала, о чём говорить. Однако через несколько недель она сблизилась с женщиной по имени Ривка. Ривка родилась в Марокко и приехала в Израиль маленькой девочкой. Она рассказала Гал много историй о своём детстве. Гал говорит, что этот опыт изменил её взгляд на пожилых людей.","ar":"يتطوّع كثير من المراهقين في إسرائيل في مجتمعهم بعد المدرسة. اختارت غال، وهي طالبة في الصف التاسع، مساعدة كبار السن في مركز في كفار سابا. في البداية كانت متوتّرة لأنها لم تكن تعرف عمّ تتحدّث. لكن بعد بضعة أسابيع أصبحت قريبة من امرأة اسمها رفكا. وُلدت رفكا في المغرب وجاءت إلى إسرائيل وهي فتاة صغيرة. روت لغال قصصًا كثيرة عن طفولتها. تقول غال إن هذه التجربة غيّرت نظرتها إلى كبار السن.","questions":[["Why was Gal nervous at first?","she didn't know what to talk about","she was afraid of old people","she was always late"],["Where was Rivka born?","in morocco","in kfar saba","in france"],["What has the experience changed?","the way gal sees older people","the way gal studies","the place where rivka lives"]]}},{"en":"careers","he":"קריירה ומקצועות","ru":"профессии","ar":"المهن","e":"💼","items":[{"en":"I'd like to become an engineer one day.","he":"הייתי רוצה להיות מהנדס/ת יום אחד.","ru":"Когда-нибудь я хотел бы стать инженером.","ar":"أودّ أن أصبح مهندسًا يومًا ما.","e":"","alt":[]},{"en":"If I were a doctor, I would help people in need.","he":"אם הייתי רופא/ה, הייתי עוזר/ת לאנשים נזקקים.","ru":"Если бы я был врачом, я бы помогал нуждающимся.","ar":"لو كنت طبيبًا، لساعدت المحتاجين.","e":"","alt":[]},{"en":"My dream job is designing video games.","he":"עבודת החלומות שלי היא עיצוב משחקי וידאו.","ru":"Работа моей мечты — создавать видеоигры.","ar":"وظيفة أحلامي هي تصميم ألعاب الفيديو.","e":"","alt":[]},{"en":"You need good communication skills for this job.","he":"צריך כישורי תקשורת טובים בשביל העבודה הזאת.","ru":"Для этой работы нужны хорошие коммуникативные навыки.","ar":"تحتاج إلى مهارات تواصل جيدة لهذه الوظيفة.","e":"","alt":[]},{"en":"My aunt used to teach, but now she's a lawyer.","he":"דודה שלי הייתה פעם מורה, אבל עכשיו היא עורכת דין.","ru":"Моя тётя раньше была учительницей, а теперь она юрист.","ar":"كانت عمّتي تعمل معلّمة في السابق، أما الآن فهي محامية.","e":"","alt":[]},{"en":"Choose a career that you are passionate about.","he":"בחר מקצוע שאתה באמת אוהב.","ru":"Выбирай профессию, которая тебя по-настоящему увлекает.","ar":"اختر مهنة تحبّها بشغف.","e":"","alt":[]}],"reading":{"en":"Last week, Yonatan's class visited a high-tech company in Herzliya. The employees explained how apps are developed and tested. Yonatan was surprised that many workers there used to do completely different jobs. One programmer, Dana, used to be a professional dancer. She said that if she could give students one piece of advice, it would be to never stop learning. Yonatan is not sure what he wants to do yet, but the visit made him think.","he":"בשבוע שעבר הכיתה של יונתן ביקרה בחברת הייטק בהרצליה. העובדים הסבירו איך מפתחים ובודקים אפליקציות. יונתן הופתע שעובדים רבים שם עסקו בעבר בעבודות שונות לגמרי. מתכנתת אחת, דנה, הייתה בעבר רקדנית מקצועית. היא אמרה שאם הייתה יכולה לתת לתלמידים עצה אחת, זו הייתה לעולם לא להפסיק ללמוד. יונתן עדיין לא בטוח מה הוא רוצה לעשות, אבל הביקור גרם לו לחשוב.","ru":"На прошлой неделе класс Йонатана посетил хай-тек компанию в Герцлии. Сотрудники объяснили, как разрабатывают и тестируют приложения. Йонатан удивился, что многие работники раньше занимались совсем другим. Одна программистка, Дана, раньше была профессиональной танцовщицей. Она сказала, что если бы могла дать ученикам один совет, то это был бы совет никогда не переставать учиться. Йонатан пока не знает, чем хочет заниматься, но визит заставил его задуматься.","ar":"في الأسبوع الماضي زار صفّ يوناتان شركة هايتك في هرتسليا. شرح الموظفون كيف يتم تطوير التطبيقات واختبارها. تفاجأ يوناتان بأن كثيرًا من العاملين هناك كانوا يعملون سابقًا في وظائف مختلفة تمامًا. إحدى المبرمجات، دانا، كانت راقصة محترفة في السابق. قالت إنها لو استطاعت أن تعطي الطلاب نصيحة واحدة، لكانت ألّا يتوقّفوا أبدًا عن التعلّم. لا يعرف يوناتان بعد ماذا يريد أن يعمل، لكن الزيارة جعلته يفكّر.","questions":[["Where is the company?","in herzliya","in haifa","in beer sheva"],["What did Dana use to be?","a professional dancer","a teacher","a doctor"],["What was Dana's advice to students?","never stop learning","work very hard","study computers"]]}},{"en":"israel","he":"ישראל","ru":"Израиль","ar":"إسرائيل","e":"🇮🇱","items":[{"en":"Israel is a small country with many different landscapes.","he":"ישראל היא מדינה קטנה עם נופים רבים ושונים.","ru":"Израиль — маленькая страна с множеством разных пейзажей.","ar":"إسرائيل بلد صغير فيه مناظر طبيعية كثيرة ومتنوّعة.","e":"","alt":[]},{"en":"The Dead Sea is the lowest place on Earth.","he":"ים המלח הוא המקום הנמוך ביותר על פני כדור הארץ.","ru":"Мёртвое море — самое низкое место на Земле.","ar":"البحر الميت هو أخفض مكان على وجه الأرض.","e":"","alt":[]},{"en":"Jerusalem is visited by millions of tourists every year.","he":"מיליוני תיירים מבקרים בירושלים בכל שנה.","ru":"Иерусалим ежегодно посещают миллионы туристов.","ar":"يزور القدسَ ملايينُ السيّاح كل عام.","e":"","alt":[]},{"en":"Many Israeli inventions are used all over the world.","he":"המצאות ישראליות רבות נמצאות בשימוש בכל העולם.","ru":"Многие израильские изобретения используются во всём мире.","ar":"تُستخدم اختراعات إسرائيلية كثيرة في جميع أنحاء العالم.","e":"","alt":[]},{"en":"If I could live anywhere in Israel, I'd choose the Galilee.","he":"אם הייתי יכול/ה לגור בכל מקום בישראל, הייתי בוחר/ת בגליל.","ru":"Если бы я мог жить где угодно в Израиле, я бы выбрал Галилею.","ar":"لو استطعت أن أعيش في أي مكان في إسرائيل، لاخترت الجليل.","e":"","alt":[]},{"en":"People from all over the world live here.","he":"אנשים מכל העולם גרים כאן.","ru":"Здесь живут люди со всего мира.","ar":"يعيش هنا أناس من جميع أنحاء العالم.","e":"","alt":[]}],"reading":{"en":"Masada is one of the most famous historical sites in Israel. It was built by King Herod on top of a high mountain near the Dead Sea. Today it is visited by thousands of people every week. Many hikers climb the Snake Path early in the morning to watch the sunrise. Last spring, Adi and her class did exactly that. Although the climb was hard, she says the view from the top was worth it. In 2001, Masada was added to the UNESCO World Heritage List.","he":"מצדה היא אחד האתרים ההיסטוריים המפורסמים ביותר בישראל. היא נבנתה על ידי המלך הורדוס על פסגת הר גבוה ליד ים המלח. כיום מבקרים בה אלפי אנשים בכל שבוע. מטיילים רבים מטפסים בשביל הנחש מוקדם בבוקר כדי לצפות בזריחה. באביב שעבר עדי והכיתה שלה עשו בדיוק את זה. למרות שהטיפוס היה קשה, היא אומרת שהנוף מהפסגה היה שווה את זה. בשנת 2001 מצדה נוספה לרשימת אתרי המורשת העולמית של אונסק״ו.","ru":"Масада — один из самых известных исторических объектов Израиля. Её построил царь Ирод на вершине высокой горы возле Мёртвого моря. Сегодня её каждую неделю посещают тысячи людей. Многие туристы рано утром поднимаются по Змеиной тропе, чтобы встретить рассвет. Прошлой весной Ади и её класс сделали именно это. Хотя подъём был тяжёлым, она говорит, что вид с вершины того стоил. В 2001 году Масада была включена в список Всемирного наследия ЮНЕСКО.","ar":"مسادا من أشهر المواقع التاريخية في إسرائيل. بناها الملك هيرودس على قمّة جبل عالٍ قرب البحر الميت. يزورها اليوم آلاف الناس كل أسبوع. يتسلّق كثير من المتنزّهين درب الأفعى في الصباح الباكر لمشاهدة شروق الشمس. في الربيع الماضي فعلت عدي وصفّها ذلك بالضبط. رغم أن التسلّق كان صعبًا، تقول إن المنظر من القمّة كان يستحق العناء. في عام 2001 أُضيفت مسادا إلى قائمة اليونسكو للتراث العالمي.","questions":[["Who built Masada?","king herod","king david","the romans"],["Why do hikers climb early in the morning?","to watch the sunrise","to avoid the tourists","to catch the first bus"],["When was Masada added to the UNESCO list?","in 2001","in 1948","last spring"]]}},{"en":"the future","he":"העתיד","ru":"будущее","ar":"المستقبل","e":"🔮","items":[{"en":"In twenty years, cars will be driven by computers.","he":"בעוד עשרים שנה, מכוניות ינוהגו על ידי מחשבים.","ru":"Через двадцать лет машинами будут управлять компьютеры.","ar":"بعد عشرين عامًا ستقود الحواسيب السيارات.","e":"","alt":[]},{"en":"If I could travel in time, I'd visit the future.","he":"אם הייתי יכול/ה לנסוע בזמן, הייתי מבקר/ת בעתיד.","ru":"Если бы я мог путешествовать во времени, я бы отправился в будущее.","ar":"لو استطعت السفر عبر الزمن، لزرت المستقبل.","e":"","alt":[]},{"en":"I think people will live on Mars one day.","he":"אני חושב/ת שיום אחד אנשים יגורו על מאדים.","ru":"Думаю, однажды люди будут жить на Марсе.","ar":"أعتقد أن الناس سيعيشون على المريخ يومًا ما.","e":"","alt":[]},{"en":"Artificial intelligence is changing the way we learn.","he":"הבינה המלאכותית משנה את הדרך שבה אנחנו לומדים.","ru":"Искусственный интеллект меняет то, как мы учимся.","ar":"الذكاء الاصطناعي يغيّر طريقة تعلّمنا.","e":"","alt":[]},{"en":"I hope I'll have my own business by thirty.","he":"אני מקווה שיהיה לי עסק משלי עד גיל שלושים.","ru":"Надеюсь, к тридцати годам у меня будет свой бизнес.","ar":"آمل أن يكون لديّ عملي الخاص قبل سن الثلاثين.","e":"","alt":[]},{"en":"Technology is useful; however, it can also be dangerous.","he":"הטכנולוגיה שימושית; עם זאת, היא יכולה להיות גם מסוכנת.","ru":"Технологии полезны, однако они могут быть и опасными.","ar":"التكنولوجيا مفيدة، لكنها قد تكون خطيرة أيضًا.","e":"","alt":[]}],"reading":{"en":"Noam's grandfather often talks about life fifty years ago. He used to write letters by hand and wait weeks for an answer. Today, messages are sent around the world in seconds. Noam sometimes wonders what life will be like when he is a grandfather. He thinks that most cars will be electric and that robots will help people at home. However, he hopes that people will still meet face to face. In his opinion, no machine can replace a real conversation.","he":"סבא של נועם מרבה לדבר על החיים לפני חמישים שנה. הוא נהג לכתוב מכתבים בכתב יד ולחכות שבועות לתשובה. כיום הודעות נשלחות לכל העולם בתוך שניות. נועם תוהה לפעמים איך ייראו החיים כשהוא יהיה סבא. הוא חושב שרוב המכוניות יהיו חשמליות ושרובוטים יעזרו לאנשים בבית. עם זאת, הוא מקווה שאנשים עדיין ייפגשו פנים אל פנים. לדעתו, שום מכונה לא יכולה להחליף שיחה אמיתית.","ru":"Дедушка Ноама часто рассказывает о жизни пятьдесят лет назад. Раньше он писал письма от руки и неделями ждал ответа. Сегодня сообщения отправляются по всему миру за секунды. Ноам иногда задумывается, какой будет жизнь, когда он сам станет дедушкой. Он думает, что большинство машин будут электрическими, а роботы будут помогать людям дома. Однако он надеется, что люди всё ещё будут встречаться лицом к лицу. По его мнению, никакая машина не заменит настоящий разговор.","ar":"يتحدّث جدّ نوعام كثيرًا عن الحياة قبل خمسين عامًا. كان يكتب الرسائل بخطّ يده وينتظر أسابيع للحصول على ردّ. اليوم تُرسل الرسائل إلى جميع أنحاء العالم في ثوانٍ. يتساءل نوعام أحيانًا كيف ستكون الحياة عندما يصبح هو جدًّا. يعتقد أن معظم السيارات ستكون كهربائية وأن الروبوتات ستساعد الناس في البيوت. لكنه يأمل أن يظل الناس يلتقون وجهًا لوجه. في رأيه، لا يمكن لأي آلة أن تحلّ محلّ محادثة حقيقية.","questions":[["How did Noam's grandfather use to communicate?","by writing letters","by phone","by email"],["What does Noam think most cars will be?","electric","flying","very cheap"],["In Noam's opinion, what can't a machine replace?","a real conversation","a good teacher","a family car"]]}},{"en":"news and media","he":"חדשות ותקשורת","ru":"СМИ и новости","ar":"الأخبار والإعلام","e":"📰","items":[{"en":"The story was reported on every channel last night.","he":"על הסיפור דווח בכל הערוצים אתמול בלילה.","ru":"Вчера вечером об этой истории сообщили на всех каналах.","ar":"أُذيع الخبر على جميع القنوات الليلة الماضية.","e":"","alt":[]},{"en":"Always check the source before you share a story.","he":"תמיד תבדוק את המקור לפני שאתה משתף ידיעה.","ru":"Всегда проверяй источник, прежде чем делиться новостью.","ar":"تحقّق دائمًا من المصدر قبل أن تشارك أي خبر.","e":"","alt":[]},{"en":"Fake news spreads faster than the truth.","he":"חדשות כזב מתפשטות מהר יותר מהאמת.","ru":"Фейковые новости распространяются быстрее правды.","ar":"تنتشر الأخبار الكاذبة أسرع من الحقيقة.","e":"","alt":[]},{"en":"If I were a journalist, I'd write about young people.","he":"אם הייתי עיתונאי/ת, הייתי כותב/ת על צעירים.","ru":"Если бы я был журналистом, я бы писал о молодёжи.","ar":"لو كنت صحفيًا، لكتبت عن الشباب.","e":"","alt":[]},{"en":"I don't agree with this article at all.","he":"אני בכלל לא מסכים/ה עם הכתבה הזאת.","ru":"Я совсем не согласен с этой статьёй.","ar":"لا أتّفق مع هذا المقال على الإطلاق.","e":"","alt":[]},{"en":"People used to read newspapers every morning.","he":"פעם אנשים קראו עיתונים כל בוקר.","ru":"Раньше люди читали газеты каждое утро.","ar":"كان الناس يقرؤون الصحف كل صباح.","e":"","alt":[]}],"reading":{"en":"Last month, a photo of a shark on a highway was shared thousands of times in Israel. Many people believed it, and some were even afraid to drive. However, Michal, a ninth grader from Modiin, was suspicious. She searched for the photo online and discovered that it had been edited. She posted the real facts in her class group. Her teacher was so impressed that Michal was asked to give a talk about fake news. Now her classmates always check a story before they share it.","he":"בחודש שעבר תמונה של כריש על כביש מהיר שותפה אלפי פעמים בישראל. אנשים רבים האמינו לה, וחלקם אפילו פחדו לנהוג. אולם מיכל, תלמידת כיתה ט׳ ממודיעין, חשדה. היא חיפשה את התמונה ברשת וגילתה שהיא עברה עריכה. היא פרסמה את העובדות האמיתיות בקבוצה של הכיתה. המורה שלה התרשמה כל כך, שמיכל התבקשה להעביר הרצאה על חדשות כזב. עכשיו חבריה לכיתה תמיד בודקים ידיעה לפני שהם משתפים אותה.","ru":"В прошлом месяце фото акулы на шоссе разошлось в Израиле тысячи раз. Многие поверили, а некоторые даже боялись садиться за руль. Однако Михаль, девятиклассница из Модиина, засомневалась. Она поискала фото в интернете и выяснила, что его отредактировали. Она опубликовала настоящие факты в группе класса. Учительница была так впечатлена, что Михаль попросили выступить с докладом о фейковых новостях. Теперь её одноклассники всегда проверяют новость, прежде чем ею поделиться.","ar":"في الشهر الماضي شوركت صورة لسمكة قرش على طريق سريع آلاف المرات في إسرائيل. صدّقها كثير من الناس، بل إن بعضهم خافوا من القيادة. لكن ميخال، وهي طالبة في الصف التاسع من موديعين، شكّت في الأمر. بحثت عن الصورة على الإنترنت واكتشفت أنها معدّلة. نشرت الحقائق الصحيحة في مجموعة الصف. أُعجبت معلّمتها كثيرًا لدرجة أنه طُلب من ميخال أن تلقي محاضرة عن الأخبار الكاذبة. الآن يتحقّق زملاؤها دائمًا من أي خبر قبل أن يشاركوه.","questions":[["What was in the photo?","a shark on a highway","a snake in a school","a lion in a park"],["What did Michal discover?","the photo had been edited","the photo was real","the shark was dangerous"],["What was Michal asked to do?","give a talk about fake news","delete the photo","write a newspaper article"]]}},{"en":"job interview","he":"ראיון עבודה","ru":"собеседование","ar":"مقابلة عمل","e":"🗣️","dialog":true,"items":[{"q":"Why do you want to work at our summer camp?","en":"I love working with kids, and I'd like to gain experience.","he":"אני אוהב/ת לעבוד עם ילדים, והייתי רוצה לצבור ניסיון.","ru":"Я люблю работать с детьми и хотел бы получить опыт.","ar":"أحبّ العمل مع الأطفال وأودّ أن أكتسب خبرة."},{"q":"Have you ever worked before?","en":"Yes, I've worked as a babysitter for two years.","he":"כן, אני עובד/ת כבייביסיטר כבר שנתיים.","ru":"Да, я уже два года работаю няней.","ar":"نعم، أعمل في مجالسة الأطفال منذ سنتين."},{"q":"What are your strengths?","en":"I'm responsible, patient, and good at solving problems.","he":"אני אחראי/ת, סבלני/ת וטוב/ה בפתרון בעיות.","ru":"Я ответственный, терпеливый и умею решать проблемы.","ar":"أنا مسؤول وصبور وماهر في حلّ المشكلات."},{"q":"What would you do if a child got hurt?","en":"I would stay calm and call an adult right away.","he":"הייתי נשאר/ת רגוע/ה וקורא/ת מיד למבוגר.","ru":"Я бы сохранял спокойствие и сразу позвал взрослого.","ar":"لبقيت هادئًا ولاستدعيت شخصًا بالغًا فورًا."},{"q":"How will you get to work every day?","en":"I usually ride my bike, so I'm never late.","he":"בדרך כלל אני רוכב/ת על אופניים, אז אני אף פעם לא מאחר/ת.","ru":"Обычно я езжу на велосипеде, поэтому никогда не опаздываю.","ar":"عادةً أركب دراجتي، لذلك لا أتأخّر أبدًا."},{"q":"Do you have any questions for us?","en":"Yes, when will I be told if I got the job?","he":"כן, מתי יודיעו לי אם התקבלתי לעבודה?","ru":"Да, когда мне сообщат, взяли ли меня на работу?","ar":"نعم، متى سيتم إبلاغي إن كنت قد حصلت على الوظيفة؟"}]}]},{"id":"pro","group":"adults","he":"מבוגרים · רמה גבוהה מאוד","sub":"ניבים, ביטויים, טיעון ושפה עשירה ברמת C1","e":"🚀","units":[{"en":"everyday idioms","he":"ניבים יומיומיים","ru":"повседневные идиомы","ar":"تعابير اصطلاحية يومية","e":"💬","items":[{"en":"I was on the fence about the job offer, but I finally made up my mind.","he":"התלבטתי לגבי הצעת העבודה, אבל בסוף קיבלתי החלטה.","ru":"Я долго сомневался насчёт предложения о работе, но в итоге принял решение.","ar":"كنت مترددًا بشأن عرض العمل، لكنني حسمت أمري أخيرًا.","e":"","alt":[]},{"en":"Let's not beat around the bush; the project is behind schedule and over budget.","he":"בואו לא נסתובב סביב העניין: הפרויקט מפגר בלוח הזמנים וחורג מהתקציב.","ru":"Давайте не будем ходить вокруг да около: проект отстаёт от графика и выходит за рамки бюджета.","ar":"دعونا لا نلفّ وندور؛ المشروع متأخر عن الجدول الزمني ويتجاوز الميزانية.","e":"","alt":[]},{"en":"Moving to Haifa was a blessing in disguise, even though it felt awful at first.","he":"המעבר לחיפה היה ברכה במסווה, למרות שבהתחלה זה הרגיש נורא.","ru":"Переезд в Хайфу оказался скрытым благом, хотя поначалу казался ужасным.","ar":"كان الانتقال إلى حيفا نعمة متخفّية، رغم أنه بدا فظيعًا في البداية.","e":"","alt":[]},{"en":"She's been under the weather all week, so let's give her some breathing room.","he":"היא לא מרגישה טוב כל השבוע, אז בואו ניתן לה קצת מרחב לנשום.","ru":"Она всю неделю неважно себя чувствует, так что давайте дадим ей передышку.","ar":"إنها متوعّكة طوال الأسبوع، فلنمنحها بعض المساحة.","e":"","alt":[]},{"en":"Don't jump to conclusions until you've heard the whole story from both sides.","he":"אל תקפוץ/י למסקנות לפני ששמעת את כל הסיפור משני הצדדים.","ru":"Не делай поспешных выводов, пока не выслушаешь всю историю с обеих сторон.","ar":"لا تتسرّع في الاستنتاج قبل أن تسمع القصة كاملة من الطرفين.","e":"","alt":[]},{"en":"After months of arguing, we finally agreed to bury the hatchet and move on.","he":"אחרי חודשים של ויכוחים, סוף סוף הסכמנו לקבור את הגרזן ולהמשיך הלאה.","ru":"После нескольких месяцев споров мы наконец согласились зарыть топор войны и двигаться дальше.","ar":"بعد أشهر من الجدال، اتفقنا أخيرًا على دفن الأحقاد والمضيّ قدمًا.","e":"","alt":[]}],"reading":{"en":"Why I Stopped Dismissing Idioms\n\nFor years, I treated idioms as the decorative trim of English: charming, perhaps, but hardly essential. Language teachers, I reasoned, should stick to the load-bearing walls of grammar, vocabulary and pronunciation, and leave the frills for later. I have since changed my tune.\n\nThe turning point came at a dinner in Tel Aviv, where a British colleague remarked that our new manager was 'all bark and no bite.' Half the table nodded knowingly; the other half, all fluent speakers on paper, looked utterly lost. Their grammar was flawless, yet they had missed the point entirely. It struck me then that idioms are not ornaments at all. They are shortcuts to shared understanding, and without them, even a polished speaker is left on the outside looking in.\n\nThat said, I am not suggesting learners memorise long lists of colourful expressions. Few things sound more awkward than someone forcing 'it's raining cats and dogs' into every conversation about the weather. Native speakers use idioms sparingly and almost unconsciously, and the trick is to absorb them the same way: in context, through reading and listening, one phrase at a time.\n\nSo, to anyone who still regards idioms as optional extras, I would gently suggest a rethink. You can certainly get by without them. But if you want to be part of the conversation rather than a polite observer of it, idioms are no longer a luxury. They are the price of admission.","he":"למה הפסקתי לזלזל בניבים\n\nבמשך שנים התייחסתי לניבים כאל הקישוט של השפה האנגלית: מקסימים אולי, אבל בקושי הכרחיים. מורים לשפה, כך חשבתי, צריכים להתמקד בקירות התומכים של דקדוק, אוצר מילים והגייה, ולהשאיר את הקישוטים להמשך. מאז שיניתי את דעתי.\n\nנקודת המפנה הגיעה בארוחת ערב בתל אביב, כשעמית בריטי העיר שהמנהל החדש שלנו הוא 'כל נביחה ובלי נשיכה' (כלומר, מאיים אבל לא מסוכן). חצי מהשולחן הנהן בהבנה; החצי השני, כולם דוברים שוטפים על הנייר, נראו אבודים לגמרי. הדקדוק שלהם היה מושלם, ובכל זאת הם פספסו את העיקר לחלוטין. אז הבנתי שניבים אינם קישוטים בכלל. הם קיצורי דרך להבנה משותפת, ובלעדיהם אפילו דובר מלוטש נשאר בחוץ ומסתכל פנימה.\n\nעם זאת, אני לא מציע/ה שלומדים ישננו רשימות ארוכות של ביטויים ציוריים. מעט דברים נשמעים מביכים יותר ממישהו שדוחף את 'יורד גשם של חתולים וכלבים' לכל שיחה על מזג האוויר. דוברי שפת אם משתמשים בניבים במשורה וכמעט באופן לא מודע, והסוד הוא לספוג אותם באותה דרך: בהקשר, דרך קריאה והאזנה, ביטוי אחד בכל פעם.\n\nלכן, לכל מי שעדיין רואה בניבים תוספת אופציונלית, הייתי מציע/ה בעדינות לחשוב שוב. בהחלט אפשר להסתדר בלעדיהם. אבל אם רוצים להיות חלק מהשיחה ולא צופים מנומסים מהצד, ניבים כבר אינם מותרות. הם מחיר הכניסה.","ru":"Почему я перестал недооценивать идиомы\n\nГодами я относился к идиомам как к декоративной отделке английского языка: очаровательно, пожалуй, но вряд ли необходимо. Преподаватели, рассуждал я, должны заниматься несущими стенами — грамматикой, лексикой и произношением, — а украшения оставить на потом. С тех пор я запел по-другому.\n\nПереломный момент наступил на ужине в Тель-Авиве, когда британский коллега заметил, что наш новый начальник «много лает, да не кусает». Половина стола понимающе кивнула; другая половина, свободно владеющая языком на бумаге, выглядела совершенно растерянной. Их грамматика была безупречной, и всё же они полностью упустили суть. Тогда меня осенило, что идиомы вовсе не украшения. Это короткий путь к взаимопониманию, и без них даже отточенная речь оставляет говорящего за бортом.\n\nПри этом я не предлагаю учащимся зубрить длинные списки красочных выражений. Мало что звучит так неуклюже, как человек, вставляющий «льёт как из ведра» в каждый разговор о погоде. Носители языка используют идиомы умеренно и почти неосознанно, и секрет в том, чтобы усваивать их так же: в контексте, через чтение и слушание, по одной фразе за раз.\n\nПоэтому всем, кто до сих пор считает идиомы необязательным дополнением, я мягко предложил бы пересмотреть взгляды. Без них, конечно, можно обойтись. Но если вы хотите участвовать в разговоре, а не вежливо наблюдать за ним со стороны, идиомы — уже не роскошь. Это плата за вход.","ar":"لماذا توقفت عن الاستخفاف بالتعابير الاصطلاحية\n\nلسنوات، تعاملت مع التعابير الاصطلاحية على أنها زخرفة اللغة الإنجليزية: ساحرة ربما، لكنها بالكاد ضرورية. كنت أرى أن على معلمي اللغة التركيز على الجدران الحاملة، أي القواعد والمفردات والنطق، وترك الزخارف لوقت لاحق. لكنني غيّرت رأيي منذ ذلك الحين.\n\nجاءت نقطة التحول في عشاء في تل أبيب، حين علّق زميل بريطاني بأن مديرنا الجديد «ينبح ولا يعضّ». أومأ نصف الحاضرين متفهمين، أما النصف الآخر، وكلهم يتحدثون بطلاقة على الورق، فبدوا تائهين تمامًا. كانت قواعدهم خالية من الأخطاء، ومع ذلك فاتهم المقصود كليًا. أدركت حينها أن التعابير الاصطلاحية ليست زينة على الإطلاق، بل هي طرق مختصرة إلى الفهم المشترك، ومن دونها يبقى حتى المتحدث البارع خارج الدائرة ينظر إليها من بعيد.\n\nومع ذلك، لا أقترح أن يحفظ المتعلمون قوائم طويلة من العبارات الملوّنة. فقليلة هي الأشياء التي تبدو أكثر إحراجًا من شخص يُقحم عبارة «إنها تمطر قططًا وكلابًا» في كل حديث عن الطقس. يستخدم الناطقون الأصليون هذه التعابير باعتدال وبشكل شبه لا واعٍ، والسرّ هو استيعابها بالطريقة نفسها: في سياقها، عبر القراءة والاستماع، عبارة تلو الأخرى.\n\nلذا، لكل من لا يزال يرى في التعابير الاصطلاحية إضافات اختيارية، أقترح بلطف إعادة التفكير. يمكنك بالتأكيد أن تتدبّر أمرك من دونها، لكن إن أردت أن تكون جزءًا من الحديث لا مراقبًا مهذبًا له، فالتعابير الاصطلاحية لم تعد ترفًا، بل هي ثمن الدخول.","questions":[["What can we infer about the colleagues who looked lost at the dinner?","Their textbook English was strong, but they lacked idiomatic knowledge.","They could not understand the British accent.","They disagreed with the remark about the manager.","They were not fluent in English at all."],["How does the writer's attitude toward idioms change?","From seeing them as optional to seeing them as essential.","From enthusiasm to complete boredom.","From seeing them as essential to seeing them as outdated.","It does not change at all during the column."],["What does 'I have since changed my tune' mean in the text?","I now hold a different opinion.","I started singing in a different style.","I became more stubborn about my view.","I stopped teaching English altogether."]]}},{"en":"phrasal verbs at work","he":"פעלים מורכבים בעבודה","ru":"фразовые глаголы на работе","ar":"الأفعال المركّبة في العمل","e":"💼","items":[{"en":"Could you look into the billing issue and get back to me by Thursday?","he":"תוכל/י לבדוק את בעיית החיוב ולחזור אליי עד יום חמישי?","ru":"Не могли бы вы разобраться с проблемой выставления счетов и ответить мне до четверга?","ar":"هل يمكنك النظر في مشكلة الفواتير والرد عليّ بحلول يوم الخميس؟","e":"","alt":[]},{"en":"We need to iron out a few details before we sign the contract.","he":"אנחנו צריכים ליישר כמה פרטים לפני שנחתום על החוזה.","ru":"Нам нужно утрясти несколько деталей, прежде чем подписывать контракт.","ar":"علينا تسوية بعض التفاصيل قبل أن نوقّع العقد.","e":"","alt":[]},{"en":"The meeting was called off at the last minute because the client fell ill.","he":"הפגישה בוטלה ברגע האחרון כי הלקוח חלה.","ru":"Встречу отменили в последний момент, потому что клиент заболел.","ar":"أُلغي الاجتماع في اللحظة الأخيرة لأن العميل مرض.","e":"","alt":[]},{"en":"I'll fill in for Dana while she's on maternity leave next month.","he":"אני אחליף/תחליף את דנה בזמן שהיא בחופשת לידה בחודש הבא.","ru":"Я буду замещать Дану, пока она в декретном отпуске в следующем месяце.","ar":"سأحلّ محلّ دانا أثناء إجازة الأمومة الخاصة بها الشهر المقبل.","e":"","alt":[]},{"en":"Management has decided to phase out the old software by the end of the year.","he":"ההנהלה החליטה להוציא משימוש בהדרגה את התוכנה הישנה עד סוף השנה.","ru":"Руководство решило постепенно отказаться от старого программного обеспечения к концу года.","ar":"قررت الإدارة التخلّص تدريجيًا من البرنامج القديم بحلول نهاية العام.","e":"","alt":[]},{"en":"If we cut back on travel expenses, we can avoid laying off any staff.","he":"אם נצמצם את הוצאות הנסיעה, נוכל להימנע מפיטורי עובדים.","ru":"Если мы сократим командировочные расходы, то сможем избежать увольнения сотрудников.","ar":"إذا قلّصنا نفقات السفر، يمكننا تجنّب تسريح أي موظف.","e":"","alt":[]}],"reading":{"en":"The Quiet Art of Following Up\n\nAsk any experienced manager what separates a reliable employee from a merely competent one, and you are likely to hear the same answer: follow-through. Plenty of people can come up with good ideas in a meeting. Far fewer actually carry them out once the meeting breaks up.\n\nConsider Noa, a project coordinator at a mid-sized tech firm in Herzliya. When she joined the company, she noticed that tasks routinely fell through the cracks. Someone would promise to look into a problem, and then nothing would happen. Clients were left hanging, deadlines slipped, and colleagues began to point fingers at one another.\n\nRather than complain, Noa set up a simple system. After every meeting, she sent out a brief summary listing who had signed up for which task and by when. If a deadline was approaching, she checked in with a friendly reminder. At first, some colleagues brushed her off as overly bureaucratic. Within three months, however, missed deadlines had dropped by almost half, and the same sceptics were asking her to sit in on their planning sessions.\n\nNoa is quick to play down her role. 'I didn't invent anything,' she says. 'I just made sure nobody could pretend they'd forgotten.' Yet her story points to something many workplaces overlook. Talent and creativity matter, but they rarely pay off unless someone is willing to do the unglamorous work of keeping everyone on track. In the end, ideas are cheap; it is following up that turns them into results.","he":"האמנות השקטה של המעקב\n\nשאלו כל מנהל מנוסה מה מבדיל בין עובד אמין לעובד שהוא רק מוכשר, וסביר שתשמעו את אותה תשובה: יכולת להביא דברים לסיום. הרבה אנשים מסוגלים להעלות רעיונות טובים בישיבה. הרבה פחות מהם באמת מבצעים אותם אחרי שהישיבה מתפזרת.\n\nקחו לדוגמה את נועה, רכזת פרויקטים בחברת הייטק בינונית בהרצליה. כשהצטרפה לחברה, היא שמה לב שמשימות נופלות בין הכיסאות באופן קבוע. מישהו היה מבטיח לבדוק בעיה, ואז שום דבר לא קרה. לקוחות נשארו תלויים באוויר, מועדים נדחו, ועמיתים התחילו להפנות אצבע מאשימה זה כלפי זה.\n\nבמקום להתלונן, נועה הקימה מערכת פשוטה. אחרי כל ישיבה היא שלחה סיכום קצר שפירט מי לקח על עצמו איזו משימה ועד מתי. כשמועד התקרב, היא בדקה מה המצב עם תזכורת ידידותית. בהתחלה, כמה עמיתים ביטלו אותה כבירוקרטית מדי. אבל בתוך שלושה חודשים, מספר המועדים שהוחמצו ירד כמעט בחצי, ואותם ספקנים ביקשו ממנה להצטרף לישיבות התכנון שלהם.\n\nנועה ממהרת להמעיט בתפקידה. 'לא המצאתי שום דבר,' היא אומרת. 'רק דאגתי שאף אחד לא יוכל להעמיד פנים שהוא שכח.' ובכל זאת, הסיפור שלה מצביע על משהו שמקומות עבודה רבים מתעלמים ממנו. כישרון ויצירתיות חשובים, אבל הם כמעט אף פעם לא משתלמים אלא אם מישהו מוכן לעשות את העבודה הלא זוהרת של לשמור על כולם במסלול. בסופו של דבר, רעיונות הם זולים; המעקב הוא שהופך אותם לתוצאות.","ru":"Тихое искусство доводить дело до конца\n\nСпросите любого опытного руководителя, что отличает надёжного сотрудника от просто компетентного, и вы, скорее всего, услышите один и тот же ответ: умение доводить дело до конца. Многие способны предложить хорошие идеи на совещании. Гораздо меньше тех, кто действительно воплощает их, когда совещание заканчивается.\n\nВозьмём Ноа, координатора проектов в технологической компании среднего размера в Герцлии. Придя в компанию, она заметила, что задачи постоянно теряются. Кто-то обещал разобраться с проблемой, а потом ничего не происходило. Клиенты оставались без ответа, сроки срывались, а коллеги начали обвинять друг друга.\n\nВместо того чтобы жаловаться, Ноа создала простую систему. После каждого совещания она рассылала краткое резюме: кто за какую задачу взялся и к какому сроку. Если срок приближался, она дружелюбно напоминала об этом. Поначалу некоторые коллеги отмахивались от неё как от излишне бюрократичной. Однако уже через три месяца количество сорванных сроков сократилось почти вдвое, и те же скептики стали просить её присутствовать на их совещаниях по планированию.\n\nНоа не спешит преувеличивать свою роль. «Я ничего не изобретала, — говорит она. — Я просто сделала так, чтобы никто не мог притвориться, что забыл». И всё же её история указывает на то, что многие организации упускают из виду. Талант и креативность важны, но они редко окупаются, если никто не готов выполнять неблагодарную работу — следить, чтобы все придерживались плана. В конечном счёте идеи стоят дёшево; именно контроль исполнения превращает их в результаты.","ar":"الفن الهادئ للمتابعة\n\nاسأل أي مدير متمرّس عمّا يميّز الموظف الموثوق عن الموظف الكفء فحسب، وعلى الأرجح ستسمع الإجابة نفسها: القدرة على إتمام الأمور. كثيرون يستطيعون طرح أفكار جيدة في الاجتماع، لكن قلّة قليلة تنفّذها فعلًا بعد انفضاض الاجتماع.\n\nخذ مثلًا نوعا، منسّقة مشاريع في شركة تكنولوجيا متوسطة الحجم في هرتسليا. عندما انضمت إلى الشركة، لاحظت أن المهام تضيع بشكل متكرر. كان أحدهم يَعِد بالنظر في مشكلة ما، ثم لا يحدث شيء. بقي العملاء معلّقين، وتأخرت المواعيد النهائية، وبدأ الزملاء يتبادلون الاتهامات.\n\nبدلًا من التذمّر، أنشأت نوعا نظامًا بسيطًا. بعد كل اجتماع، كانت ترسل ملخصًا قصيرًا يحدد من تولّى أي مهمة وموعد إنجازها. وإذا اقترب موعد نهائي، كانت تتواصل بتذكير ودّي. في البداية، تجاهلها بعض الزملاء معتبرين إياها بيروقراطية أكثر من اللازم. لكن خلال ثلاثة أشهر، انخفضت المواعيد الفائتة إلى النصف تقريبًا، وصار المشكّكون أنفسهم يطلبون منها حضور جلسات التخطيط الخاصة بهم.\n\nتسارع نوعا إلى التقليل من دورها قائلة: «لم أخترع شيئًا، كل ما فعلته أنني تأكدت ألّا يتمكن أحد من التظاهر بالنسيان». ومع ذلك، تشير قصتها إلى أمر تغفل عنه أماكن عمل كثيرة. الموهبة والإبداع مهمّان، لكنهما نادرًا ما يؤتيان ثمارهما ما لم يكن هناك من يستعد للقيام بالعمل غير اللامع المتمثل في إبقاء الجميع على المسار الصحيح. في النهاية، الأفكار رخيصة، والمتابعة هي ما يحوّلها إلى نتائج.","questions":[["Why did the sceptical colleagues later invite Noa to their planning sessions?","Her system had clearly reduced missed deadlines.","She had been promoted to manage their team.","They wanted a chance to criticise her methods.","Company rules required her to attend every meeting."],["What is the writer's attitude toward Noa's approach?","Admiring; it is valuable work that is often overlooked.","Critical; it is far too bureaucratic.","Neutral; the writer gives no opinion at all.","Amused; the writer treats it as a joke."],["What does 'tasks routinely fell through the cracks' mean?","Tasks were often forgotten and never completed.","Tasks were usually finished far too early.","Tasks were shared among too many people.","Tasks were deliberately cancelled by managers."]]}},{"en":"expressing and defending opinions","he":"הבעת דעה והגנה עליה","ru":"выражение и защита мнения","ar":"التعبير عن الرأي والدفاع عنه","e":"🗣️","items":[{"en":"As far as I'm concerned, the proposal raises more questions than it answers.","he":"מבחינתי, ההצעה מעלה יותר שאלות משהיא עונה עליהן.","ru":"Что касается меня, это предложение вызывает больше вопросов, чем даёт ответов.","ar":"بالنسبة إليّ، يثير هذا الاقتراح أسئلة أكثر مما يجيب عنها.","e":"","alt":[]},{"en":"I take your point, but I'm not entirely convinced the numbers add up.","he":"אני מבין/ה את הטענה שלך, אבל אני לא לגמרי משוכנע/ת שהמספרים מסתדרים.","ru":"Я понимаю вашу мысль, но не совсем уверен, что цифры сходятся.","ar":"أفهم وجهة نظرك، لكنني لست مقتنعًا تمامًا بأن الأرقام منطقية.","e":"","alt":[]},{"en":"With all due respect, I think you're overlooking the long-term costs of this plan.","he":"עם כל הכבוד, אני חושב/ת שאת/ה מתעלם/ת מהעלויות ארוכות הטווח של התוכנית הזו.","ru":"При всём уважении, мне кажется, вы упускаете из виду долгосрочные издержки этого плана.","ar":"مع كامل الاحترام، أعتقد أنك تغفل التكاليف طويلة الأمد لهذه الخطة.","e":"","alt":[]},{"en":"I'd go so far as to say that this decision could backfire on us.","he":"הייתי אפילו אומר/ת שההחלטה הזו עלולה להתהפך עלינו.","ru":"Я бы даже сказал, что это решение может обернуться против нас.","ar":"بل أذهب إلى حدّ القول إن هذا القرار قد ينقلب علينا.","e":"","alt":[]},{"en":"That's a fair argument, although I'd see things slightly differently myself.","he":"זה טיעון הוגן, אם כי אני עצמי רואה/ה את הדברים קצת אחרת.","ru":"Это справедливый аргумент, хотя сам я смотрю на вещи немного иначе.","ar":"هذه حجة منصفة، وإن كنت أرى الأمور بشكل مختلف قليلًا.","e":"","alt":[]},{"en":"Not only is the plan expensive, but it's also unlikely to work in practice.","he":"התוכנית לא רק יקרה, אלא גם לא סביר שתעבוד בפועל.","ru":"Этот план не только дорогой, но и вряд ли сработает на практике.","ar":"ليست الخطة مكلفة فحسب، بل من غير المرجّح أيضًا أن تنجح عمليًا.","e":"","alt":[]}],"reading":{"en":"In Defence of Changing Your Mind\n\nWe tend to admire people who stick to their guns. Politicians who reverse a position are branded flip-floppers; friends who abandon a long-held view are teased for having gone soft. Consistency, it seems, is treated as a virtue in its own right. I would argue that this instinct, however understandable, does us more harm
