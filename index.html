וש\". היא הולכת בקו ישר תוך כדי שהיא מנענעת את גופה מצד לצד, ואז מסתובבת בחזרה וחוזרת על התנועה. חוקרים גילו במאה העשרים שהריקוד הזה מכיל מידע מדויק. כיוון הקו הישר מראה את כיוון הפרחים ביחס לשמש. אורך הכשכוש אומר לדבורים האחרות כמה רחוק נמצא המזון.\n\nדבורים אחרות מתאספות סביב הרקדנית, עוקבות אחר תנועותיה ואז עפות ישירות למקום הנכון, לפעמים במרחק כמה קילומטרים. התגלית הייתה מפתיעה כל כך, שמדענים רבים לא האמינו לה בהתחלה. נדרשו שנים של ניסויים קפדניים עד שהרעיון התקבל באופן רחב.\n\nכיום, חוקרים לומדים את ריקוד הכשכוש גם מסיבות מעשיות. על ידי \"קריאת\" הריקודים, הם יכולים ללמוד אילו אזורים מספקים מזון לדבורים. מידע זה עוזר לחקלאים ולארגוני סביבה להגן על אוכלוסיות הדבורים, שהצטמצמו באזורים רבים בעולם. מכיוון שדבורים מאביקות חלק גדול מהגידולים שאנו אוכלים, הישרדותן חשובה לכולנו.",[["According to the passage, what does the length of the waggle show?","How far away the food is","Where the sun is in the sky","How many flowers there are","How old the dancing bee is"],["In the sentence 'It walks in a straight line while shaking its body from side to side', what does 'It' refer to?","the bee","the hive","the field","the sun"],["What can we understand from 'many scientists did not believe it at first'?","The idea seemed too surprising to be true","The scientists did not like bees","The experiments were never repeated","The dance was invented by researchers"],["According to the writer, why should people care about the survival of bees?","Bees pollinate many of the crops we eat","Bees produce most of our medicines","Bees are needed to train researchers","Bees protect farmers from other insects"]],"The Dance of the Honeybee"]],"C":[["Although it was raining heavily, the match ___ cancelled.","was not","did not","has not","were not","למרות שירד גשם חזק, המשחק לא בוטל."],["If I ___ more free time, I would learn to play the guitar.","had","have","will have","would have","אילו היה לי יותר זמן פנוי, הייתי לומד לנגן בגיטרה."],["___ the bad weather, thousands of fans came to the concert.","Despite","Although","However","Because","למרות מזג האוויר הגרוע, אלפי מעריצים הגיעו להופעה."],["The new bridge ___ by the end of next year.","will be completed","will complete","is completing","completed","הגשר החדש יושלם עד סוף השנה הבאה."],["She has been working at the hospital ___ 2019.","since","for","from","during","היא עובדת בבית החולים מאז 2019."],["The museum was very crowded; ___, we managed to see most of the exhibits.","however","because","although","unless","המוזיאון היה צפוף מאוד; עם זאת, הצלחנו לראות את רוב המוצגים."],["Regular exercise can improve both physical and mental ___.","health","healthy","healthily","heal","פעילות גופנית סדירה יכולה לשפר את הבריאות הגופנית והנפשית כאחד."],["By the time we arrived at the station, the train ___.","had already left","has already left","already leaves","will leave","עד שהגענו לתחנה, הרכבת כבר יצאה."],["Many young people are interested ___ careers in technology.","in","on","at","for","צעירים רבים מתעניינים בקריירות בתחום הטכנולוגיה."],["If you heat ice, it ___.","melts","melted","melting","has melt","אם מחממים קרח, הוא נמס."],["The scientist made an important ___ about the behaviour of whales.","discovery","discover","discovered","discovering","המדענית גילתה תגלית חשובה על התנהגותם של לווייתנים."],["You should wear a helmet ___ you ride a bicycle.","whenever","unless","despite","so that","כדאי לחבוש קסדה בכל פעם שאתה רוכב על אופניים."],["The letter ___ two hundred years ago was found in an old library.","written","writing","wrote","writes","המכתב שנכתב לפני מאתיים שנה נמצא בספרייה ישנה."],["If she had studied harder, she ___ the exam.","would have passed","would pass","will pass","had passed","אילו הייתה לומדת קשה יותר, הייתה עוברת את הבחינה."],["Tom is not used to ___ up so early in the morning.","getting","get","got","be getting","טום אינו רגיל לקום כל כך מוקדם בבוקר."],["The city has become much more ___ over the past decade, with new parks and bike lanes.","attractive","attract","attraction","attractively","העיר הפכה לאטרקטיבית הרבה יותר בעשור האחרון, עם פארקים חדשים ושבילי אופניים."],["Neither the teacher ___ the students knew the answer.","nor","or","and","but","לא המורה ולא התלמידים ידעו את התשובה."],["Plastic bags ___ in many countries in recent years.","have been banned","have banned","are banning","were banning","שקיות פלסטיק נאסרו לשימוש במדינות רבות בשנים האחרונות."],["I'm looking forward ___ you at the conference next month.","to seeing","to see","seeing","for seeing","אני מצפה לראות אותך בכנס בחודש הבא."],["The film was so ___ that half the audience fell asleep.","boring","bored","bore","boredom","הסרט היה כל כך משעמם שחצי מהקהל נרדם."],["She decided to take the job ___ the salary was lower than she had hoped.","even though","despite","in spite of","because of","היא החליטה לקבל את העבודה למרות שהמשכורת הייתה נמוכה ממה שקיוותה."],["Our flight was delayed ___ a technical problem.","because of","because","although","so","הטיסה שלנו התעכבה בגלל תקלה טכנית."],["While I ___ dinner, the phone rang.","was cooking","cooked","am cooking","have cooked","בזמן שבישלתי ארוחת ערב, הטלפון צלצל."],["The volunteers, ___ came from all over the country, cleaned the beach in one day.","who","which","whose","what","המתנדבים, שהגיעו מכל רחבי הארץ, ניקו את החוף ביום אחד."],["Unless we reduce pollution, many species ___ extinct.","will become","became","would have become","becoming","אם לא נפחית את הזיהום, מינים רבים ייכחדו."],["He apologized ___ being late to the meeting.","for","with","of","on","הוא התנצל על כך שאיחר לפגישה."],["The ___ of the new hospital will create hundreds of jobs.","construction","construct","constructive","constructed","בנייתו של בית החולים החדש תיצור מאות מקומות עבודה."],["It's the most interesting book I ___ read.","have ever","ever had","had ever","am ever","זה הספר הכי מעניין שקראתי אי פעם."],["Students are required ___ their phones off during the exam.","to turn","turning","turn","to turning","התלמידים נדרשים לכבות את הטלפונים שלהם במהלך הבחינה."],["The research was carried out ___ a team of international scientists.","by","from","at","of","המחקר נערך על ידי צוות של מדענים בינלאומיים."]]},"h12":{"R":[["For decades, doctors have assumed that a placebo works only when the patient is deceived. A sugar pill, the reasoning goes, can relieve pain or anxiety because the person swallowing it believes it contains real medicine. Remove the belief, and the effect should disappear. In recent years, however, a small but growing body of research has challenged this assumption in a surprising way.\n\nIn several trials, researchers gave patients pills that were openly labelled as placebos. The participants, who suffered from conditions such as chronic back pain and irritable bowel syndrome, were told plainly that the capsules contained no active ingredient. They were also told that placebos had produced improvements in earlier studies, possibly through the body's automatic responses to the ritual of taking medicine. To the surprise of many, a significant number of these patients reported less pain and better daily functioning than a comparison group that received no pills at all.\n\nHow can this be explained? One theory holds that the act of treatment itself, the visit to a caring professional and the routine of swallowing a pill twice a day, triggers expectations that the brain cannot simply switch off. Even when we know a pill is empty, years of experience have taught our bodies to associate medicine with relief.\n\nCritics urge caution. Most of the studies have been small, and the improvements were measured largely through patients' own reports rather than objective tests. Pain is real, they argue, but so is the desire to please researchers who have been kind to you.\n\nNevertheless, the findings raise an intriguing ethical possibility. If placebos can help without deception, doctors may one day prescribe them honestly, avoiding the moral problem that has always surrounded their use. Such a development would not replace conventional treatment, but it might remind medicine that healing involves more than chemistry.","במשך עשרות שנים הניחו רופאים שפלצבו פועל רק כאשר המטופל מרומה. גלולת סוכר, כך נטען, יכולה להקל על כאב או חרדה משום שהאדם שבולע אותה מאמין שהיא מכילה תרופה אמיתית. הסירו את האמונה, והאפקט אמור להיעלם. אולם בשנים האחרונות, גוף מחקר קטן אך הולך וגדל ערער על הנחה זו באופן מפתיע.\n\nבכמה ניסויים נתנו חוקרים למטופלים גלולות שסומנו בגלוי כפלצבו. למשתתפים, שסבלו ממצבים כמו כאבי גב כרוניים ותסמונת המעי הרגיז, נאמר במפורש שהכמוסות אינן מכילות שום חומר פעיל. כמו כן נאמר להם שפלצבו הביא לשיפור במחקרים קודמים, אולי באמצעות התגובות האוטומטיות של הגוף לטקס נטילת התרופה. להפתעת רבים, מספר משמעותי מהמטופלים הללו דיווחו על פחות כאב ועל תפקוד יומיומי טוב יותר בהשוואה לקבוצת ביקורת שלא קיבלה גלולות כלל.\n\nכיצד ניתן להסביר זאת? לפי תיאוריה אחת, פעולת הטיפול עצמה, הביקור אצל איש מקצוע אכפתי והשגרה של בליעת גלולה פעמיים ביום, מעוררת ציפיות שהמוח אינו יכול פשוט לכבות. גם כשאנו יודעים שהגלולה ריקה, שנים של ניסיון לימדו את גופנו לקשר בין תרופה להקלה.\n\nהמבקרים קוראים לזהירות. רוב המחקרים היו קטנים, והשיפור נמדד בעיקר באמצעות דיווחים של המטופלים עצמם ולא בבדיקות אובייקטיביות. הכאב אמיתי, הם טוענים, אבל כך גם הרצון לרַצות חוקרים שהתייחסו אליך בחביבות.\n\nעל אף זאת, הממצאים מעלים אפשרות אתית מסקרנת. אם פלצבו יכול לעזור ללא הטעיה, רופאים עשויים יום אחד לרשום אותו בכנות, ולהימנע מהבעיה המוסרית שתמיד ליוותה את השימוש בו. התפתחות כזו לא תחליף את הטיפול המקובל, אך היא עשויה להזכיר לרפואה שריפוי כרוך ביותר מכימיה בלבד.",[["What is the passage mainly about?","Research suggesting placebos may work even when patients know about them","The dangers of giving patients sugar pills without their consent","Why chronic back pain is so difficult to treat","How new medicines are replacing conventional treatment"],["What were the patients in the trials told about the capsules?","That they contained no active ingredient","That they were a new type of painkiller","That they might contain real medicine","Nothing at all about their contents"],["In the sentence 'Remove the belief, and the effect should disappear', what does 'the belief' refer to?","The patient's belief that the pill contains real medicine","The doctor's belief that placebos are useless","The researchers' belief in open-label trials","The public's belief that sugar is harmful"],["The word 'triggers' in paragraph 3 is closest in meaning to…","sets off","prevents","measures","hides"],["Why do critics mention 'the desire to please researchers'?","Patients may have exaggerated their improvement to satisfy kind researchers","Researchers paid patients to take part in the trials","Patients refused to take pills without a real ingredient","Researchers were unkind to the comparison group"]],"The Honest Placebo"],["Imagine being able to reach almost everything you need, from a grocery store and a school to a doctor and a park, within a fifteen-minute walk or bicycle ride from your home. This is the central idea behind the 'fifteen-minute city', an approach to urban planning that has attracted the attention of mayors and architects around the world.\n\nFor much of the twentieth century, cities were designed around the private car. Planners separated neighbourhoods by function: people lived in one area, worked in another and shopped in a third, connected by wide roads and highways. This model promised freedom and efficiency, but it also produced traffic jams, air pollution and long daily commutes that consumed hours of people's lives.\n\nSupporters of the fifteen-minute city argue that bringing services closer to residents would reverse these problems. Fewer car journeys would mean cleaner air and quieter streets. Local shops would benefit from regular customers, and neighbours who meet on the pavement rather than behind windscreens might develop a stronger sense of community. Some cities have already begun experimenting, turning parking spaces into small gardens and opening school playgrounds to the public after hours.\n\nThe idea, however, has not been universally welcomed. Some critics worry that it could increase inequality: wealthy districts may quickly attract new cafés and clinics, while poorer areas are left behind. Others fear that the concept could be used to justify restrictions on driving, which they see as an attack on personal freedom. Planners respond that the goal is to offer choices, not to impose limits.\n\nWhat is clear is that the debate touches on a deeper question: what is a city for? If the answer is simply moving people and goods quickly, the car-centred model may suffice. If it is about how people live together, the fifteen-minute city deserves serious consideration.","דמיינו שאתם יכולים להגיע כמעט לכל מה שאתם צריכים, ממכולת ובית ספר ועד רופא ופארק, בהליכה או ברכיבה על אופניים של רבע שעה מהבית. זה הרעיון המרכזי שמאחורי \"עיר חמש־עשרה הדקות\", גישה לתכנון עירוני שמשכה את תשומת ליבם של ראשי ערים ואדריכלים ברחבי העולם.\n\nבמשך רוב המאה העשרים תוכננו ערים סביב המכונית הפרטית. המתכננים הפרידו בין שכונות לפי ייעוד: אנשים גרו באזור אחד, עבדו באזור אחר וקנו באזור שלישי, כשכבישים רחבים ודרכים מהירות מחברים ביניהם. המודל הזה הבטיח חופש ויעילות, אך הוא גם יצר פקקי תנועה, זיהום אוויר ונסיעות יומיות ארוכות שגזלו שעות מחייהם של אנשים.\n\nתומכי עיר חמש־עשרה הדקות טוענים שקירוב השירותים לתושבים יהפוך את הבעיות הללו. פחות נסיעות ברכב פירושן אוויר נקי יותר ורחובות שקטים יותר. חנויות שכונתיות ייהנו מלקוחות קבועים, ושכנים שנפגשים על המדרכה ולא מאחורי שמשות של מכוניות עשויים לפתח תחושת קהילה חזקה יותר. כמה ערים כבר החלו להתנסות ברעיון, והפכו מקומות חניה לגינות קטנות ופתחו את חצרות בתי הספר לציבור אחרי שעות הלימודים.\n\nעם זאת, הרעיון לא התקבל בברכה על ידי כולם. חלק מהמבקרים חוששים שהוא עלול להגביר את אי־השוויון: שכונות אמידות עשויות למשוך במהירות בתי קפה ומרפאות חדשים, בעוד שאזורים עניים יותר יישארו מאחור. אחרים חוששים שהרעיון ישמש להצדקת הגבלות על נהיגה, שבהן הם רואים פגיעה בחופש האישי. המתכננים משיבים שהמטרה היא להציע אפשרויות בחירה, לא לכפות מגבלות.\n\nמה שברור הוא שהוויכוח נוגע בשאלה עמוקה יותר: לשם מה קיימת עיר? אם התשובה היא פשוט להעביר אנשים וסחורות במהירות, ייתכן שהמודל שבמרכזו המכונית מספיק. אם מדובר באופן שבו אנשים חיים יחד, עיר חמש־עשרה הדקות ראויה לשיקול רציני.",[["According to the passage, how were many twentieth-century cities organised?","Areas were separated by function and linked by roads","Homes, shops and offices were mixed in every street","Residents were encouraged to walk or cycle everywhere","Each neighbourhood had its own school and clinic"],["Why might neighbours develop a stronger sense of community in a fifteen-minute city?","They would meet face to face more often","They would share cars with each other","They would work in the same offices","They would pay lower taxes together"],["In the sentence '…restrictions on driving, which they see as an attack on personal freedom', what does 'which' refer to?","Restrictions on driving","New cafés and clinics","Inequality between districts","The fifteen-minute city's gardens"],["What is the main purpose of the fourth paragraph?","To present objections to the idea and the planners' response","To describe how cities were planned in the past","To list the environmental benefits of the idea","To explain how parking spaces become gardens"],["What does the writer suggest in the final paragraph?","The value of the idea depends on what we believe a city is for","The car-centred model has completely failed","The fifteen-minute city should be adopted everywhere immediately","Moving goods quickly is a city's most important function"]],"The Fifteen-Minute City"],["Human memory is famously unreliable. We forget names, misplace keys and reshape our recollections each time we recall them. For a long time this was seen purely as a weakness. Yet some psychologists now argue that forgetting is not a failure of memory but one of its essential functions. It allows us to move past embarrassment, to forgive, and to become different people from who we once were.\n\nDigital technology has changed this balance. A comment written carelessly at sixteen may remain searchable for decades. Photographs, messages and location records are stored on distant servers, often long after their owners have forgotten them. In effect, we have built a world that remembers everything and rarely lets us forget.\n\nThis raises difficult ethical questions. Should a person have the right to have old information about them removed from search results? Some legal systems have answered yes, at least in certain cases, allowing individuals to request that outdated or irrelevant links be hidden. Supporters claim that this protects dignity and gives people a genuine second chance.\n\nOpponents, on the other hand, warn of serious risks. If anyone can erase unflattering records, they argue, the powerful might use such laws to bury evidence of wrongdoing. Journalists and historians depend on access to the past; a society that deletes too readily may lose the ability to hold its leaders accountable.\n\nPerhaps the solution lies not in choosing between total memory and total forgetting but in designing systems that age information, much as the human mind does. Data could gradually become less visible over time unless there is a clear public interest in keeping it prominent. Such an approach would not be simple to implement. Still, it would reflect an important insight: a healthy memory, whether human or digital, depends as much on what it lets go as on what it keeps.","הזיכרון האנושי ידוע כבלתי אמין. אנו שוכחים שמות, מאבדים מפתחות ומעצבים מחדש את זיכרונותינו בכל פעם שאנו נזכרים בהם. במשך זמן רב נתפס הדבר כחולשה בלבד. אך כמה פסיכולוגים טוענים כיום שהשכחה אינה כישלון של הזיכרון אלא אחת מפונקציות היסוד שלו. היא מאפשרת לנו להתגבר על מבוכה, לסלוח, ולהפוך לאנשים שונים ממי שהיינו פעם.\n\nהטכנולוגיה הדיגיטלית שינתה את האיזון הזה. תגובה שנכתבה בפזיזות בגיל שש־עשרה עשויה להישאר זמינה בחיפוש במשך עשרות שנים. תמונות, הודעות ונתוני מיקום מאוחסנים בשרתים רחוקים, לעתים קרובות זמן רב אחרי שבעליהם שכחו מהם. למעשה, בנינו עולם שזוכר הכול ורק לעתים רחוקות מאפשר לנו לשכוח.\n\nהדבר מעלה שאלות אתיות קשות. האם צריכה להיות לאדם הזכות להסיר מידע ישן עליו מתוצאות החיפוש? כמה מערכות משפט השיבו בחיוב, לפחות במקרים מסוימים, ואפשרו לאנשים לבקש שקישורים מיושנים או לא רלוונטיים יוסתרו. התומכים טוענים שהדבר מגן על כבוד האדם ומעניק לאנשים הזדמנות שנייה אמיתית.\n\nהמתנגדים, לעומת זאת, מזהירים מפני סיכונים חמורים. אם כל אחד יכול למחוק רשומות לא מחמיאות, הם טוענים, בעלי הכוח עלולים להשתמש בחוקים כאלה כדי לקבור ראיות למעשים פסולים. עיתונאים והיסטוריונים תלויים בגישה לעבר; חברה שמוחקת בקלות רבה מדי עלולה לאבד את היכולת לדרוש ממנהיגיה לתת דין וחשבון.\n\nאולי הפתרון אינו טמון בבחירה בין זיכרון מוחלט לשכחה מוחלטת, אלא בתכנון מערכות שבהן המידע \"מזדקן\", בדומה למה שקורה במוח האנושי. נתונים יכולים להפוך בהדרגה לפחות גלויים עם הזמן, אלא אם יש עניין ציבורי ברור בהשארתם בולטים. גישה כזו לא תהיה פשוטה ליישום. ובכל זאת, היא תשקף תובנה חשובה: זיכרון בריא, בין אם אנושי ובין אם דיגיטלי, תלוי במה שהוא משחרר לא פחות מאשר במה שהוא שומר.",[["What is the passage mainly about?","Whether digital systems should allow information to be forgotten","How to improve human memory with technology","Why journalists should stop writing about the past","How search engines decide which results to show"],["According to some psychologists, what is one benefit of forgetting?","It helps people forgive and change over time","It makes people better at remembering names","It protects people from digital surveillance","It allows people to learn new skills faster"],["The word 'bury' in paragraph 4 is closest in meaning to…","hide","discover","publish","celebrate"],["Why does the writer mention journalists and historians?","To show who would be harmed if deletion were too easy","To show who supports the right to be forgotten","To give examples of people with embarrassing pasts","To explain who designs search engines"],["What solution does the writer propose in the final paragraph?","Systems in which information gradually becomes less visible","Laws that allow all personal data to be erased","Keeping every record permanently visible to everyone","Banning the storage of photographs on servers"]],"Should Machines Forget?"],["If you were asked to describe where a cup is on a table, you would probably say it is 'to the left' of the plate or 'in front of' you. These descriptions depend on the position of your own body. Surprisingly, not all languages work this way. Speakers of a number of languages around the world rarely use words like 'left' and 'right'. Instead, they describe locations using fixed directions such as north, south, east and west, even indoors and even for small objects. In such a language, one might say, 'There is an ant on your southern leg.'\n\nLinguists who have studied these communities report a remarkable consequence. Speakers of these languages tend to know which way they are facing at all times, even in unfamiliar buildings or after travelling in the dark. Children learn this skill early, because without it they simply cannot speak correctly. For them, a constant awareness of direction is not a special talent but an ordinary part of daily life.\n\nFindings like these have revived an old debate. Does the language we speak shape the way we think, or does it merely reflect it? The strong version of the claim, that language determines thought and that we cannot think what we cannot say, has largely been rejected. Speakers of every language can learn new concepts, after all. A weaker version, however, enjoys considerable support: the habits our language demands may train our attention in particular directions.\n\nThis weaker view suggests that learning a foreign language involves more than memorising vocabulary. It may also mean practising a new way of noticing the world. Whether that changes who we are is open to question, but it certainly makes the experience of learning languages richer than a list of words might suggest.","אילו התבקשתם לתאר היכן נמצא ספל על שולחן, סביר שהייתם אומרים שהוא \"משמאל\" לצלחת או \"לפניכם\". תיאורים אלה תלויים במיקום הגוף שלכם. באופן מפתיע, לא כל השפות פועלות כך. דוברי מספר שפות ברחבי העולם כמעט אינם משתמשים במילים כמו \"שמאל\" ו\"ימין\". במקום זאת, הם מתארים מיקומים באמצעות כיוונים קבועים כמו צפון, דרום, מזרח ומערב, אפילו בתוך הבית ואפילו לגבי חפצים קטנים. בשפה כזו אפשר לומר: \"יש נמלה על הרגל הדרומית שלך.\"\n\nבלשנים שחקרו קהילות אלה מדווחים על תוצאה מרשימה. דוברי השפות הללו נוטים לדעת בכל רגע לאיזה כיוון הם פונים, אפילו בבניינים לא מוכרים או אחרי נסיעה בחושך. ילדים לומדים את המיומנות הזו בגיל צעיר, כי בלעדיה הם פשוט אינם יכולים לדבר נכון. מבחינתם, מודעות מתמדת לכיוון אינה כישרון מיוחד אלא חלק רגיל מחיי היומיום.\n\nממצאים כאלה החיו ויכוח ישן. האם השפה שאנו מדברים מעצבת את האופן שבו אנו חושבים, או שהיא רק משקפת אותו? הגרסה החזקה של הטענה, שלפיה השפה קובעת את המחשבה ואיננו יכולים לחשוב את מה שאיננו יכולים לומר, נדחתה ברובה. הרי דוברי כל שפה יכולים ללמוד מושגים חדשים. לעומת זאת, גרסה מתונה יותר זוכה לתמיכה רבה: ההרגלים שהשפה שלנו דורשת עשויים לאמן את תשומת הלב שלנו לכיוונים מסוימים.\n\nהשקפה מתונה זו מרמזת שלימוד שפה זרה כרוך ביותר משינון אוצר מילים. ייתכן שהוא כרוך גם בתרגול של דרך חדשה להבחין בעולם. אם הדבר משנה את מי שאנחנו, זו שאלה פתוחה, אך הוא בהחלט הופך את חוויית לימוד השפות לעשירה יותר ממה שרשימת מילים הייתה מרמזת.",[["How do speakers of the languages described locate objects?","By using fixed directions such as north and east","By using the words 'left' and 'right'","By pointing rather than speaking","By describing the colour of nearby objects"],["In the sentence 'without it they simply cannot speak correctly', what does 'it' refer to?","Knowing which direction they are facing","A good memory for vocabulary","A special musical talent","Travelling in the dark"],["Why has the strong version of the claim largely been rejected?","Speakers of any language can learn new concepts","No language uses fixed directions","Children cannot learn directions early","Linguists have never studied these communities"],["The word 'revived' in paragraph 3 is closest in meaning to…","brought back","settled","invented","ignored"],["What can be inferred about learning a foreign language, according to the writer?","It may train learners to notice the world differently","It is mainly a matter of memorising word lists","It permanently changes a person's personality","It is impossible after childhood"]],"North of Your Left Hand"],["Today it seems obvious that everyone in a country should share the same time. Yet until the second half of the nineteenth century, most towns kept their own local time, based on the position of the sun. When the sun stood highest in the sky, it was noon. Because the sun appears to move from east to west, a town only a short distance to the west would reach noon a few minutes later than its neighbour. For centuries, this caused few problems. Travel was slow, and a difference of several minutes hardly mattered to someone arriving by horse.\n\nThe railway changed everything. Trains could cover in hours distances that had once taken days, and timetables had to be precise. With dozens of local times in use, a single journey might involve several clocks showing different hours. Passengers missed connections, and, more seriously, the confusion increased the risk of collisions on shared tracks.\n\nRailway companies were the first to act. They adopted a standard time along their lines, usually based on the clock of a major city. At first, many communities resisted. Some residents felt that abandoning 'sun time' meant surrendering a local tradition to distant business interests. In certain towns, public clocks were fitted with two minute hands, one showing local time and the other railway time.\n\nEventually, however, practical needs prevailed. Governments formally adopted standard time, and international agreements later divided the world into time zones. What had begun as a solution to a technical problem became a basic structure of modern life.\n\nThe story is a reminder that many arrangements we take for granted were once controversial. Even something as seemingly natural as the time on our watches is, in fact, the result of human decisions, negotiation and compromise.","כיום נראה מובן מאליו שכל האנשים במדינה צריכים לחלוק את אותה שעה. אולם עד המחצית השנייה של המאה התשע־עשרה, רוב העיירות ניהלו שעה מקומית משלהן, על פי מיקום השמש. כשהשמש עמדה בנקודה הגבוהה ביותר בשמיים, הייתה זו שעת הצהריים. מאחר שהשמש נראית נעה ממזרח למערב, עיירה שנמצאת מרחק קצר מערבה הגיעה לצהריים כמה דקות אחרי שכנתה. במשך מאות שנים זה כמעט לא גרם לבעיות. הנסיעות היו איטיות, והפרש של כמה דקות כמעט לא שינה דבר למי שהגיע על סוס.\n\nהרכבת שינתה הכול. רכבות יכלו לעבור בתוך שעות מרחקים שבעבר נדרשו ימים כדי לעבור אותם, ולוחות הזמנים היו צריכים להיות מדויקים. כשעשרות שעות מקומיות היו בשימוש, נסיעה אחת עשויה הייתה לכלול כמה שעונים שמראים שעות שונות. נוסעים החמיצו רכבות המשך, ובאופן חמור יותר, הבלבול הגביר את הסכנה להתנגשויות על מסילות משותפות.\n\nחברות הרכבת היו הראשונות לפעול. הן אימצו שעה תקנית לאורך הקווים שלהן, בדרך כלל על פי השעון של עיר מרכזית. בתחילה, קהילות רבות התנגדו. חלק מהתושבים הרגישו שוויתור על \"שעון השמש\" פירושו כניעה של מסורת מקומית לאינטרסים עסקיים מרוחקים. בעיירות מסוימות הותקנו בשעונים הציבוריים שני מחוגי דקות, אחד שהראה את השעה המקומית והשני את שעת הרכבת.\n\nאולם בסופו של דבר, הצרכים המעשיים גברו. ממשלות אימצו באופן רשמי שעה תקנית, והסכמים בינלאומיים חילקו מאוחר יותר את העולם לאזורי זמן. מה שהתחיל כפתרון לבעיה טכנית הפך למבנה בסיסי של החיים המודרניים.\n\nהסיפור הזה מזכיר שהסדרים רבים שאנו רואים כמובנים מאליהם היו בעבר שנויים במחלוקת. אפילו דבר שנראה טבעי כמו השעה בשעון שלנו הוא, למעשה, תוצאה של החלטות אנושיות, משא ומתן ופשרה.",[["Before standard time, how did towns determine noon?","By the moment the sun was highest in the sky","By the arrival of the first train","By a clock in the nearest major city","By international agreement"],["Why did local time differences cause few problems before the railway?","Travel was too slow for a few minutes to matter","All towns were located at the same longitude","People did not use clocks at all","Governments punished anyone who was late"],["Why were some public clocks fitted with two minute hands?","To show both local time and railway time","To make them easier to read from far away","To replace a broken hand quickly","To show the time in two different countries"],["The word 'prevailed' in paragraph 4 is closest in meaning to…","won out","disappeared","were postponed","were questioned"],["What is the main purpose of the final paragraph?","To draw a general lesson from the historical example","To describe how time zones are calculated","To criticise the railway companies","To introduce a new historical event"]],"When Time Became Standard"],["Have you ever noticed that coffee shops often offer three cup sizes, and that the medium one seems like the obvious choice? This is rarely an accident. Economists who study consumer behaviour have shown that our decisions are strongly influenced by the options placed beside the one we eventually choose.\n\nConsider a well-known kind of experiment. Participants are offered a subscription to a magazine in one of two forms: online only, for a low price, or print plus online, for a much higher price. Most people choose the cheaper option. Then researchers add a third choice: print only, at exactly the same high price as print plus online. Hardly anyone selects this new option, since it is clearly worse value. Yet its presence changes everything. Suddenly, a large majority of participants choose the expensive combined package.\n\nThe third option is known as a 'decoy'. It exists not to be bought but to make another product look attractive by comparison. Because people find it difficult to judge value in absolute terms, they rely on relative comparisons. When one option is obviously superior to a similar alternative, it appears to be a bargain, even if we would not have chosen it otherwise.\n\nDecoys are used widely, from restaurant menus, where a very expensive dish makes other dishes seem reasonable, to electronics stores and holiday packages. Some critics consider the practice manipulative, arguing that it exploits weaknesses in human reasoning. Businesses reply that they are simply presenting choices and that customers remain free to decide.\n\nEither way, awareness is the consumer's best defence. Before choosing, it is worth asking a simple question: would I still want this option if the others were not there? The answer may save more money than any discount.","שמתם לב פעם שבתי קפה מציעים לעתים קרובות שלושה גדלים של כוסות, ושהבינונית נראית כמו הבחירה המתבקשת? זה כמעט אף פעם לא מקרי. כלכלנים שחוקרים התנהגות צרכנים הראו שההחלטות שלנו מושפעות מאוד מהאפשרויות שמוצגות לצד האפשרות שבה אנו בוחרים בסופו של דבר.\n\nחשבו על סוג מוכר של ניסוי. למשתתפים מוצע מינוי למגזין באחת משתי צורות: דיגיטלי בלבד, במחיר נמוך, או מודפס ודיגיטלי, במחיר גבוה בהרבה. רוב האנשים בוחרים באפשרות הזולה. אז מוסיפים החוקרים אפשרות שלישית: מודפס בלבד, באותו מחיר גבוה בדיוק כמו המודפס והדיגיטלי. כמעט אף אחד לא בוחר באפשרות החדשה, מכיוון שברור שהתמורה בה גרועה יותר. ובכל זאת, עצם נוכחותה משנה הכול. לפתע, רוב גדול של המשתתפים בוחר בחבילה המשולבת היקרה.\n\nהאפשרות השלישית מכונה \"פיתיון\". היא קיימת לא כדי שיקנו אותה, אלא כדי לגרום למוצר אחר להיראות אטרקטיבי בהשוואה אליה. מאחר שקשה לאנשים להעריך ערך במונחים מוחלטים, הם מסתמכים על השוואות יחסיות. כאשר אפשרות אחת עדיפה בבירור על חלופה דומה, היא נראית כמו מציאה, גם אם לא היינו בוחרים בה אחרת.\n\nנעשה שימוש נרחב בפיתיונות, החל מתפריטי מסעדות, שבהם מנה יקרה מאוד גורמת למנות אחרות להיראות סבירות, ועד לחנויות אלקטרוניקה ולחבילות נופש. יש מבקרים שרואים בשיטה מניפולציה, וטוענים שהיא מנצלת חולשות בחשיבה האנושית. העסקים משיבים שהם פשוט מציגים אפשרויות בחירה ושהלקוחות נשארים חופשיים להחליט.\n\nכך או כך, מודעות היא ההגנה הטובה ביותר של הצרכן. לפני שבוחרים, כדאי לשאול שאלה פשוטה: האם עדיין הייתי רוצה באפשרות הזו אילו האחרות לא היו שם? התשובה עשויה לחסוך יותר כסף מכל הנחה.",[["What is the passage mainly about?","How an unattractive option can influence our choices","Why coffee shops charge too much for coffee","How magazines attract new subscribers online","Why discounts are the best way to save money"],["What happened when the 'print only' option was added?","Most participants chose the expensive combined package","Most participants chose the 'print only' option","Most participants refused to subscribe at all","Most participants still chose the online option"],["In the sentence 'It exists not to be bought…', what does 'It' refer to?","The decoy option","The cheapest option","The magazine","The experiment"],["According to the passage, why does a very expensive dish appear on some menus?","To make other dishes seem reasonably priced","Because many customers order it","To attract famous chefs to the restaurant","Because its ingredients are rare"],["What is the writer's purpose in the last paragraph?","To give readers practical advice","To defend businesses that use decoys","To describe another experiment","To criticise economists"]],"The Decoy on the Menu"],["When a famous painting is cleaned and restored, the result is often celebrated as a rediscovery. Colours that had been hidden for centuries under layers of dirt and yellowed varnish suddenly glow again, and viewers feel they are seeing the work as the artist intended. Yet restoration is one of the most controversial activities in the art world, and every major project tends to divide experts.\n\nThe central difficulty is that no one can be entirely sure what the artist intended. Paintings change over time in ways that are not always reversible. Pigments fade or darken, and earlier restorers may have added paint of their own. When a conservator removes a layer, there is a risk of removing something the artist placed there deliberately, such as a thin glaze designed to soften a bright colour. Once removed, such details cannot be recovered.\n\nFor this reason, many modern conservators follow a principle of minimal intervention. They aim to stabilise a work and protect it from further damage rather than to make it look new. Any additions they make are designed to be reversible, so that future experts, with better tools and knowledge, can undo them.\n\nOthers argue that this cautious approach goes too far. A painting covered in grime, they say, cannot communicate with its audience. If careful research shows what the original surface looked like, conservators have a duty to reveal it.\n\nPerhaps the debate cannot be fully resolved, because it reflects a deeper uncertainty about what a work of art really is. Is it the object as it left the artist's studio, or the object as it exists now, including the marks that time has left on it? Each answer leads to a different idea of what it means to care for the past.","כאשר ציור מפורסם מנוקה ומשוחזר, התוצאה זוכה לעתים קרובות להתלהבות כגילוי מחדש. צבעים שהיו מוסתרים במשך מאות שנים מתחת לשכבות של לכלוך ולכה מצהיבה זוהרים לפתע שוב, והצופים מרגישים שהם רואים את היצירה כפי שהאמן התכוון. אולם שחזור הוא אחת הפעילויות השנויות ביותר במחלוקת בעולם האמנות, וכל פרויקט גדול נוטה לפלג את המומחים.\n\nהקושי המרכזי הוא שאיש אינו יכול להיות בטוח לחלוטין למה האמן התכוון. ציורים משתנים עם הזמן בדרכים שלא תמיד ניתן להפוך. פיגמנטים דוהים או מכהים, ומשחזרים קודמים אולי הוסיפו צבע משלהם. כאשר משמר מסיר שכבה, קיים סיכון להסיר משהו שהאמן הניח שם במכוון, כמו שכבת זיגוג דקה שנועדה לרכך צבע בוהק. לאחר שהוסרו, פרטים כאלה אינם ניתנים לשחזור.\n\nמסיבה זו, משמרים מודרניים רבים פועלים לפי עיקרון של התערבות מינימלית. הם שואפים לייצב את היצירה ולהגן עליה מפני נזק נוסף, ולא לגרום לה להיראות חדשה. כל תוספת שהם מבצעים מתוכננת להיות הפיכה, כך שמומחים בעתיד, עם כלים וידע טובים יותר, יוכלו לבטל אותה.\n\nאחרים טוענים שהגישה הזהירה הזו מרחיקה לכת. ציור המכוסה בלכלוך, הם אומרים, אינו יכול לתקשר עם הקהל שלו. אם מחקר קפדני מראה כיצד נראה פני השטח המקורי, מוטלת על המשמרים החובה לחשוף אותו.\n\nייתכן שלא ניתן להכריע בוויכוח לחלוטין, משום שהוא משקף אי־ודאות עמוקה יותר לגבי מהי בעצם יצירת אמנות. האם זהו החפץ כפי שיצא מהסטודיו של האמן, או החפץ כפי שהוא קיים היום, כולל הסימנים שהזמן הותיר בו? כל תשובה מובילה לתפיסה שונה של מה פירוש לשמור על העבר.",[["According to the passage, why is restoration risky?","Details added deliberately by the artist may be lost forever","Modern cleaning materials always damage paintings","Museums refuse to display restored paintings","Viewers dislike bright colours"],["The word 'deliberately' in paragraph 2 is closest in meaning to…","on purpose","by accident","in a hurry","in secret"],["Why do conservators who follow minimal intervention make reversible additions?","So that future experts can undo them","So that the painting looks completely new","Because reversible materials are cheaper","Because the artist requested it"],["How is paragraph 4 related to paragraph 3?","It presents a view that opposes the approach described in paragraph 3","It gives an example that supports paragraph 3","It summarises the whole passage","It explains the history of varnish"],["According to the final paragraph, why might the debate never be settled?","People disagree about what a work of art essentially is","There are not enough trained conservators","The original paintings no longer exist","Scientists cannot analyse old pigments"]],"Restoring or Rewriting?"],["For most of human history, a clear night revealed thousands of stars. Today, a large proportion of the world's population lives under skies so bright that the Milky Way is no longer visible. Artificial light, which has transformed human life in countless positive ways, has also produced a form of pollution that is easy to overlook precisely because it seems so harmless.\n\nScientists, however, are increasingly concerned about its effects. Many animals depend on darkness. Sea turtle hatchlings, for instance, find their way to the ocean by moving towards the brightest horizon, which naturally lies over the water. Near brightly lit coastal roads, they may crawl inland instead, where few survive. Migrating birds can become disoriented by illuminated buildings, and insects that are drawn to street lamps often die of exhaustion, with consequences for the plants and animals that depend on them.\n\nHumans are affected too. Our bodies follow a daily rhythm regulated partly by light and darkness. Exposure to bright light late in the evening can disturb sleep, and some researchers suspect that long-term disruption may contribute to a range of health problems, though the evidence is still being gathered.\n\nUnlike many environmental problems, light pollution could be reduced relatively quickly and cheaply. Shielding lamps so that they shine downwards rather than into the sky, using warmer colours, and dimming or switching off lights when they are not needed would all make a significant difference. Several towns that have adopted such measures report lower energy bills as well as darker skies.\n\nThe challenge is largely one of awareness. Few people think of a lit street as a source of pollution. Yet once we recognise what has been lost, the return of a starry sky may become not merely a scientific goal but a cultural one.","במשך רוב ההיסטוריה האנושית, לילה בהיר חשף אלפי כוכבים. כיום, חלק גדול מאוכלוסיית העולם חי תחת שמיים מוארים כל כך שכבר אי אפשר לראות את שביל החלב. האור המלאכותי, ששינה את חיי האדם בדרכים חיוביות רבות מספור, יצר גם סוג של זיהום שקל להתעלם ממנו בדיוק משום שהוא נראה כה בלתי מזיק.\n\nעם זאת, מדענים מודאגים יותר ויותר מהשפעותיו. בעלי חיים רבים תלויים בחושך. גוזלי צבי ים, למשל, מוצאים את דרכם אל האוקיינוס בכך שהם נעים לעבר האופק הבהיר ביותר, שבאופן טבעי נמצא מעל המים. ליד כבישי חוף מוארים, הם עלולים לזחול במקום זאת אל היבשה, שם מעטים שורדים. ציפורים נודדות עלולות לאבד את דרכן בגלל בניינים מוארים, וחרקים שנמשכים לפנסי רחוב מתים לעתים קרובות מתשישות, עם השלכות על הצמחים ובעלי החיים שתלויים בהם.\n\nגם בני אדם מושפעים. גופנו פועל לפי מקצב יומי שמווסת בחלקו על ידי אור וחושך. חשיפה לאור חזק בשעות הערב המאוחרות עלולה לשבש את השינה, ויש חוקרים שחושדים ששיבוש ממושך עשוי לתרום למגוון בעיות בריאות, אם כי הראיות עדיין נאספות.\n\nבשונה מבעיות סביבתיות רבות, ניתן לצמצם את זיהום האור במהירות ובזול יחסית. מיגון פנסים כך שיאירו כלפי מטה ולא אל השמיים, שימוש בגוונים חמים יותר, ועמעום או כיבוי של אורות כשאין בהם צורך, כל אלה יחוללו הבדל משמעותי. כמה עיירות שאימצו צעדים כאלה מדווחות על חשבונות חשמל נמוכים יותר וגם על שמיים חשוכים יותר.\n\nהאתגר הוא בעיקר עניין של מודעות. מעטים חושבים על רחוב מואר כעל מקור לזיהום. אך ברגע שנכיר במה שאבד, החזרתם של שמיים זרועי כוכבים עשויה להפוך לא רק ליעד מדעי אלא גם ליעד תרבותי.",[["Why do sea turtle hatchlings near brightly lit roads often die?","They crawl inland, confusing the lights with the ocean horizon","The lights make the water too warm for them","Birds attracted by the lights eat them","They are hit by cars driving to the beach"],["In the sentence '…with consequences for the plants and animals that depend on them', what does 'them' refer to?","The insects","The street lamps","The migrating birds","The illuminated buildings"],["How does the writer present the effects of artificial light on human health?","As a possibility that is still being investigated","As a proven cause of serious disease","As completely harmless","As more important than its effects on animals"],["According to the passage, what makes light pollution different from many environmental problems?","It could be reduced quickly and cheaply","It affects only wealthy countries","It cannot be measured by scientists","It has no effect on energy use"],["Which statement best expresses the main idea of the passage?","Light pollution is a serious but solvable problem that needs more awareness","Artificial light has done more harm than good to humanity","Only astronomers are affected by bright night skies","Towns should switch off all street lights at night"]],"The Vanishing Dark"],["Since the first artificial satellite was launched in the 1950s, humans have sent thousands of objects into orbit around the Earth. Satellites now support weather forecasting, navigation, communication and scientific research. But space around our planet is becoming crowded, and much of what is up there is no longer useful.\n\nExperts use the term 'space debris' to describe dead satellites, discarded rocket parts and countless fragments created when objects break apart or collide. Even a tiny fragment can be dangerous. Because objects in orbit travel at extraordinary speeds, many times faster than a bullet, a piece of metal the size of a coin can strike with the force of an explosion. Spacecraft carrying astronauts must sometimes change course to avoid such pieces.\n\nThe greatest fear is a chain reaction. If two large objects collide, they may produce thousands of new fragments, each of which could hit other satellites, creating still more debris. In the worst case, certain orbits could become so dangerous that they would be unusable for generations, threatening services on which modern societies depend.\n\nSeveral solutions are being explored. Engineers have tested nets, magnets and even harpoons designed to capture old satellites and drag them down into the atmosphere, where they burn up. New satellites are increasingly designed to leave orbit at the end of their working lives. Yet technology alone cannot solve the problem. Space is shared by many countries and companies, and no single authority has the power to enforce rules.\n\nIn this sense, the challenge resembles other problems involving shared resources, such as overfishing. Each user benefits from using the resource, while the costs of damage are spread among everyone. Unless nations find ways to cooperate, the space above our heads may become as polluted as the oceans below.","מאז שוגר הלוויין המלאכותי הראשון בשנות החמישים, שלחו בני האדם אלפי עצמים למסלול סביב כדור הארץ. לוויינים תומכים כיום בחיזוי מזג האוויר, בניווט, בתקשורת ובמחקר מדעי. אבל החלל סביב כוכב הלכת שלנו נעשה צפוף, וחלק גדול ממה שנמצא שם כבר אינו שימושי.\n\nמומחים משתמשים במונח \"פסולת חלל\" כדי לתאר לוויינים מתים, חלקי טילים שהושלכו ואינספור שברים שנוצרים כאשר עצמים מתפרקים או מתנגשים. אפילו שבר זעיר עלול להיות מסוכן. מאחר שעצמים במסלול נעים במהירויות עצומות, מהר פי כמה מקליע, פיסת מתכת בגודל של מטבע יכולה לפגוע בעוצמה של פיצוץ. חלליות הנושאות אסטרונאוטים נאלצות לפעמים לשנות מסלול כדי להימנע משברים כאלה.\n\nהחשש הגדול ביותר הוא מתגובת שרשרת. אם שני עצמים גדולים מתנגשים, הם עלולים ליצור אלפי שברים חדשים, שכל אחד מהם עלול לפגוע בלוויינים אחרים וליצור פסולת נוספת. בתרחיש הגרוע ביותר, מסלולים מסוימים עלולים להפוך למסוכנים כל כך שלא יהיה ניתן להשתמש בהם במשך דורות, דבר שיאיים על שירותים שהחברה המודרנית תלויה בהם.\n\nכמה פתרונות נבחנים. מהנדסים ניסו רשתות, מגנטים ואפילו צלצלים שנועדו ללכוד לוויינים ישנים ולגרור אותם אל האטמוספרה, שם הם נשרפים. לוויינים חדשים מתוכננים יותר ויותר כך שיעזבו את המסלול בתום חייהם המבצעיים. אולם הטכנולוגיה לבדה אינה יכולה לפתור את הבעיה. החלל משותף למדינות ולחברות רבות, ואין רשות אחת שיש לה הסמכות לאכוף כללים.\n\nבמובן זה, האתגר דומה לבעיות אחרות הנוגעות למשאבים משותפים, כמו דיג־יתר. כל משתמש מפיק תועלת מהשימוש במשאב, בעוד שעלויות הנזק מתחלקות בין כולם. אם המדינות לא ימצאו דרכים לשתף פעולה, החלל שמעל ראשינו עלול להפוך למזוהם כמו האוקיינוסים שמתחתינו.",[["The word 'discarded' in paragraph 2 is closest in meaning to…","thrown away","newly built","carefully repaired","brightly coloured"],["Why can a tiny fragment of debris be so dangerous?","It travels at extremely high speed","It contains explosive chemicals","It is impossible to see from Earth","It is made of very heavy metal"],["What does the writer mean by a 'chain reaction'?","Collisions creating debris that causes further collisions","Satellites being linked together by chains","Rockets launching one after another","Countries copying each other's space programmes"],["Why does the writer say that 'technology alone cannot solve the problem'?","No single authority can enforce rules in space","The nets and harpoons have all failed","Engineers have stopped working on solutions","New satellites cannot leave orbit"],["Why does the writer compare space debris to overfishing?","Both involve shared resources whose damage costs are spread among all","Both are caused mainly by fishing companies","Both have already been solved by cooperation","Both affect only the oceans"]],"Crowded Orbits"],["Most students prepare for exams by rereading their notes and highlighting key sentences. These methods feel productive: the material becomes familiar, and familiarity creates a pleasant sense of mastery. Unfortunately, research in cognitive psychology suggests that this feeling is often misleading.\n\nIn a typical experiment, two groups of students study the same text. One group reads it several times. The other reads it once and then tries to recall as much as possible without looking, writing down whatever they remember. Immediately afterwards, the rereading group usually feels more confident. A week later, however, the picture changes: the students who practised recalling the information remember considerably more.\n\nPsychologists call this the 'testing effect', and it belongs to a broader set of findings sometimes described as 'desirable difficulties'. The idea is that learning which feels effortful tends to last longer. Spacing study sessions over several days rather than cramming the night before, mixing different types of problems instead of practising one type repeatedly, and explaining ideas in one's own words all make learning harder in the short term. Yet each of these strategies strengthens long-term memory.\n\nWhy should difficulty help? One explanation is that retrieving information from memory is not simply a way of checking what we know; it actively reorganises and reinforces that knowledge. Each successful act of recall makes the memory easier to find next time.\n\nThe findings have clear implications for teachers and learners. A classroom in which students are frequently asked to retrieve information, through low-pressure quizzes for example, may look less smooth than one in which the teacher simply presents material. But smoothness is not the goal. As one researcher put it, the sensation of learning and the reality of learning are not the same thing, and students who understand the difference are likely to study far more effectively.","רוב התלמידים מתכוננים למבחנים באמצעות קריאה חוזרת של הסיכומים שלהם וסימון משפטי מפתח. השיטות האלה מרגישות פרודוקטיביות: החומר נעשה מוכר, והמוּכרות יוצרת תחושה נעימה של שליטה. לרוע המזל, מחקרים בפסיכולוגיה קוגניטיבית מראים שהתחושה הזו מטעה לעתים קרובות.\n\nבניסוי טיפוסי, שתי קבוצות של תלמידים לומדות את אותו טקסט. קבוצה אחת קוראת אותו כמה פעמים. השנייה קוראת אותו פעם אחת ואז מנסה להיזכר בכמה שיותר בלי להסתכל, ורושמת את כל מה שהיא זוכרת. מיד אחר כך, קבוצת הקריאה החוזרת מרגישה בדרך כלל בטוחה יותר. אולם כעבור שבוע התמונה משתנה: התלמידים שתרגלו שליפה של המידע זוכרים הרבה יותר.\n\nפסיכולוגים מכנים זאת \"אפקט הבחינה\", והוא שייך לקבוצה רחבה יותר של ממצאים המתוארים לעתים כ\"קשיים רצויים\". הרעיון הוא שלמידה שמרגישה מאומצת נוטה להחזיק מעמד זמן רב יותר. פיזור מפגשי הלמידה על פני כמה ימים במקום לדחוס הכול בלילה שלפני, ערבוב של סוגי תרגילים שונים במקום לתרגל סוג אחד שוב ושוב, והסבר רעיונות במילים שלך, כל אלה מקשים על הלמידה בטווח הקצר. ובכל זאת, כל אחת מהאסטרטגיות האלה מחזקת את הזיכרון לטווח הארוך.\n\nמדוע קושי אמור לעזור? הסבר אחד הוא ששליפת מידע מהזיכרון אינה רק דרך לבדוק מה אנו יודעים; היא מארגנת מחדש ומחזקת באופן פעיל את הידע הזה. כל פעולה מוצלחת של היזכרות מקלה על מציאת הזיכרון בפעם הבאה.\n\nלממצאים יש השלכות ברורות על מורים ולומדים. כיתה שבה התלמידים מתבקשים לעתים קרובות לשלוף מידע, למשל באמצעות בחנים קצרים ללא לחץ, עשויה להיראות פחות חלקה מכיתה שבה המורה פשוט מציג את החומר. אבל חלקוּת אינה המטרה. כפי שניסח זאת אחד החוקרים, התחושה של למידה והמציאות של למידה אינן אותו דבר, ותלמידים שמבינים את ההבדל צפויים ללמוד ביעילות רבה הרבה יותר.",[["According to the passage, why do rereading and highlighting feel productive?","They make the material feel familiar","They are recommended by most teachers","They take less time than other methods","They always lead to higher grades"],["What happened a week after the experiment described in paragraph 2?","The students who practised recall remembered more","The rereading group remembered more","Both groups remembered exactly the same amount","Neither group remembered anything"],["The word 'cramming' in paragraph 3 refers to…","studying intensively just before an exam","explaining ideas in your own words","spreading study over several days","taking low-pressure quizzes"],["In the sentence 'it actively reorganises and reinforces that knowledge', what does 'it' refer to?","Retrieving information from memory","The rereading group","The classroom","Long-term memory loss"],["Which statement would the writer most likely agree with?","Learning that feels difficult is often more effective","A smooth lesson is always the best lesson","Students should avoid quizzes before exams","Feeling confident proves that learning has happened"]],"The Benefit of Struggling"]],"C":[["Not only ___ the deadline, but she also exceeded every target.","did she meet","she met","she did meet","met she","לא רק שהיא עמדה במועד, אלא גם עלתה על כל יעד."],["Had I known about the traffic, I ___ earlier.","would have left","would leave","had left","will leave","אילו ידעתי על הפקקים, הייתי יוצא מוקדם יותר."],["If he had accepted the job in London, he ___ in England now.","would be living","would have lived","will live","lived","אילו היה מקבל את העבודה בלונדון, הוא היה גר עכשיו באנגליה."],["If she weren't so stubborn, she ___ the offer last week.","would have accepted","would accept","accepted","will accept","אילולא הייתה כל כך עקשנית, היא הייתה מקבלת את ההצעה בשבוע שעבר."],["She asked me where ___ the keys the night before.","I had put","had I put","did I put","do I put","היא שאלה אותי איפה שמתי את המפתחות בלילה הקודם."],["He told us that he ___ the report by the following day.","would finish","will finish","finishes","has finished","הוא אמר לנו שהוא יס ","ru":"Если бы я знал(а) о плесени, я бы ни за что не согласился (согласилась) въехать.","ar":"لو كنت أعلم بوجود العفن، لما وافقت أبدًا على السكن هنا.","e":"","alt":[]}],"reading":{"en":"When Tamar found a sunny three-room apartment in Ramat Gan, she was tempted to sign on the spot. The rent was slightly below the market rate, and the landlord, a retired engineer, seemed easygoing. Still, her brother had warned her never to sign a lease without reading the fine print. Sure enough, clause twelve stated that the tenant would cover all repairs, including major ones such as plumbing and electrical faults. Another clause required three months' notice before leaving, with no option to sublet. Tamar didn't want to come across as difficult, so she raised her concerns tactfully. She suggested that the landlord handle structural repairs while she took care of minor wear and tear. To her surprise, he admitted that he had copied the contract from the internet and had never really looked at it. They agreed to rewrite both clauses, and he even offered to fix the dripping kitchen tap before she moved in. Tamar signed a week later, feeling that a little patience had saved her a great deal of money and stress.","he":"כשתמר מצאה דירת שלושה חדרים מוארת ברמת גן, היא התפתתה לחתום במקום. שכר הדירה היה מעט נמוך ממחיר השוק, ובעל הדירה, מהנדס בגמלאות, נראה נוח ונעים. ובכל זאת, אחיה הזהיר אותה לעולם לא לחתום על חוזה שכירות בלי לקרוא את האותיות הקטנות. ואכן, סעיף שתים עשרה קבע שהשוכר יישא בכל התיקונים, כולל תיקונים גדולים כמו תקלות אינסטלציה וחשמל. סעיף אחר דרש הודעה של שלושה חודשים מראש לפני עזיבה, בלי אפשרות להשכרת משנה. תמר לא רצתה להיראות קשה, ולכן העלתה את החששות שלה בעדינות ובטקט. היא הציעה שבעל הדירה יטפל בתיקונים מבניים, והיא תדאג לבלאי שוטף קטן. להפתעתה, הוא הודה שהעתיק את החוזה מהאינטרנט ומעולם לא באמת קרא אותו. הם הסכימו לנסח מחדש את שני הסעיפים, והוא אפילו הציע לתקן את הברז המטפטף במטבח לפני שתיכנס. תמר חתמה כעבור שבוע, בתחושה שקצת סבלנות חסכה לה הרבה כסף ולחץ.","ru":"Когда Тамар нашла светлую трёхкомнатную квартиру в Рамат-Гане, ей очень захотелось подписать договор на месте. Аренда была немного ниже рыночной, а хозяин, инженер на пенсии, казался покладистым. И всё же брат предупреждал её никогда не подписывать договор аренды, не прочитав мелкий шрифт. И действительно, в пункте двенадцатом говорилось, что жилец оплачивает все ремонты, включая крупные, например неполадки с сантехникой и электрикой. Другой пункт требовал предупреждать о выезде за три месяца, без права субаренды. Тамар не хотела показаться трудным человеком, поэтому тактично высказала свои опасения. Она предложила, чтобы хозяин занимался капитальным ремонтом, а она — мелким износом. К её удивлению, он признался, что скопировал договор из интернета и толком его не читал. Они договорились переписать оба пункта, и он даже предложил починить капающий кран на кухне до её въезда. Тамар подписала договор через неделю, чувствуя, что немного терпения сэкономило ей много денег и нервов.","ar":"عندما وجدت تمار شقة مشمسة من ثلاث غرف في رمات غان، أغراها الأمر بالتوقيع فورًا. كان الإيجار أقل قليلًا من سعر السوق، وبدا المالك، وهو مهندس متقاعد، شخصًا سهل التعامل. ومع ذلك، كان أخوها قد حذّرها من توقيع أي عقد إيجار دون قراءة التفاصيل الدقيقة. وبالفعل، نصّ البند الثاني عشر على أن المستأجر يتحمّل جميع الإصلاحات، بما فيها الكبيرة مثل أعطال السباكة والكهرباء. واشترط بند آخر إشعارًا مسبقًا بثلاثة أشهر قبل المغادرة، دون إمكانية التأجير من الباطن. لم ترغب تمار في أن تبدو صعبة المراس، فطرحت مخاوفها بلباقة. اقترحت أن يتولى المالك الإصلاحات الهيكلية بينما تهتم هي بالاهتراء البسيط. ولدهشتها، اعترف بأنه نسخ العقد من الإنترنت ولم يقرأه حقًا. اتفقا على إعادة صياغة البندين، بل عرض أيضًا إصلاح صنبور المطبخ الذي يقطر قبل انتقالها. وقّعت تمار بعد أسبوع، وهي تشعر بأن قليلًا من الصبر وفّر عليها الكثير من المال والتوتر.","questions":[["Why was the apartment probably attractive to Tamar at first?","It was a bit cheaper than similar apartments","The rent included all the bills","Her brother had already lived there","The landlord offered free repairs"],["What does 'tactfully' most likely mean in the text?","In a polite, careful way","Angrily and loudly","Only in writing","Very quickly"],["What can we infer about the landlord?","He hadn't really meant to be unfair","He was trying to trick Tamar","He refused to change the contract","He was a professional lawyer"]]}},{"en":"banking and money","he":"בנק וענייני כספים","ru":"банк и финансы","ar":"البنوك والشؤون المالية","e":"🏦","items":[{"en":"I'd like to find out why I was charged a fee for a standard transfer.","he":"אני רוצה לברר למה חויבתי בעמלה על העברה רגילה.","ru":"Я хотел(а) бы выяснить, почему с меня взяли комиссию за обычный перевод.","ar":"أودّ أن أعرف لماذا اقتُطعت مني رسوم على تحويل عادي.","e":"","alt":[]},{"en":"If I pay off the loan early, will there be a penalty?","he":"אם אפרע את ההלוואה מוקדם, תהיה עמלת פירעון מוקדם?","ru":"Если я погашу кредит досрочно, будет ли штраф?","ar":"إذا سدّدت القرض مبكرًا، هل ستكون هناك غرامة؟","e":"","alt":[]},{"en":"My account is overdrawn, and I'd like to discuss a temporary credit line.","he":"החשבון שלי במינוס, ואני רוצה לדון במסגרת אשראי זמנית.","ru":"У меня на счёте минус, и я хотел(а) бы обсудить временный кредитный лимит.","ar":"حسابي مكشوف، وأودّ مناقشة حدّ ائتماني مؤقت.","e":"","alt":[]},{"en":"We're trying to cut back on spending so we can put money aside every month.","he":"אנחנו מנסים לצמצם הוצאות כדי שנוכל לחסוך כסף כל חודש.","ru":"Мы стараемся сократить расходы, чтобы каждый месяц откладывать деньги.","ar":"نحاول تقليل الإنفاق حتى نتمكن من ادّخار المال كل شهر.","e":"","alt":[]},{"en":"Could you walk me through the difference between a fixed and a variable rate?","he":"תוכל/י להסביר לי שלב אחר שלב את ההבדל בין ריבית קבועה למשתנה?","ru":"Не могли бы вы подробно объяснить разницу между фиксированной и плавающей ставкой?","ar":"هل يمكنك أن تشرح لي بالتفصيل الفرق بين الفائدة الثابتة والمتغيّرة؟","e":"","alt":[]},{"en":"I didn't authorize this payment, so I'd like to dispute it right away.","he":"לא אישרתי את התשלום הזה, ולכן אני רוצה לערער עליו מיד.","ru":"Я не разрешал(а) этот платёж, поэтому хочу немедленно его оспорить.","ar":"لم أوافق على هذه الدفعة، لذا أودّ الاعتراض عليها فورًا.","e":"","alt":[]}],"reading":{"en":"For years, Eli and Sigal never paid much attention to their bank statements. Their salaries came in, the bills went out, and as long as the account wasn't deep in the red, they assumed everything was fine. Then their daughter, who was studying economics, offered to go over their finances with them. Within an hour, she had spotted several problems. They were paying a monthly account management fee that most banks had long since dropped, and their savings were sitting in an account earning almost no interest. Worse, they had been in overdraft for most of the year, which meant they were quietly paying high interest on money they had assumed was theirs. Sigal was embarrassed, but her daughter reassured her that this was extremely common. The next week, the couple met with a bank advisor, armed with a list of questions. They negotiated lower fees, moved their savings into a deposit with a better return, and set up a standing order to transfer a fixed sum on payday. For the first time, they felt in control of their money.","he":"במשך שנים, אלי וסיגל לא הקדישו תשומת לב רבה לדפי החשבון שלהם. המשכורות נכנסו, החשבונות יצאו, וכל עוד החשבון לא היה עמוק במינוס, הם הניחו שהכול בסדר. ואז הבת שלהם, שלמדה כלכלה, הציעה לעבור איתם על המצב הכספי. תוך שעה היא כבר זיהתה כמה בעיות. הם שילמו דמי ניהול חשבון חודשיים שרוב הבנקים כבר מזמן ביטלו, והחסכונות שלהם ישבו בחשבון שכמעט לא נותן ריבית. גרוע מכך, הם היו במינוס במשך רוב השנה, כלומר שילמו בשקט ריבית גבוהה על כסף שחשבו שהוא שלהם. סיגל התביישה, אבל הבת הרגיעה אותה שזה נפוץ מאוד. בשבוע שאחרי, בני הזוג נפגשו עם יועץ בבנק, חמושים ברשימת שאלות. הם הוזילו את העמלות, העבירו את החסכונות לפיקדון עם תשואה טובה יותר, והגדירו הוראת קבע להעברת סכום קבוע ביום המשכורת. לראשונה, הם הרגישו שהם שולטים בכסף שלהם.","ru":"Много лет Эли и Сигаль почти не обращали внимания на банковские выписки. Зарплаты приходили, счета оплачивались, и пока счёт не уходил в глубокий минус, они считали, что всё в порядке. Потом их дочь, изучавшая экономику, предложила вместе разобраться в их финансах. Уже через час она обнаружила несколько проблем. Они платили ежемесячную комиссию за обслуживание счёта, которую большинство банков давно отменили, а их сбережения лежали на счёте почти без процентов. Хуже того, большую часть года они были в овердрафте, то есть незаметно платили высокие проценты за деньги, которые считали своими. Сигаль было неловко, но дочь успокоила её, сказав, что это очень распространённая ситуация. На следующей неделе супруги встретились с банковским консультантом, вооружившись списком вопросов. Они добились снижения комиссий, перевели сбережения на депозит с более высокой доходностью и оформили автоматический перевод фиксированной суммы в день зарплаты. Впервые они почувствовали, что контролируют свои деньги.","ar":"لسنوات طويلة، لم يولِ إيلي وسيغال اهتمامًا كبيرًا لكشوف حسابهما المصرفي. كانت الرواتب تدخل والفواتير تُدفع، وما دام الحساب ليس في عجز كبير، افترضا أن كل شيء على ما يرام. ثم عرضت عليهما ابنتهما، التي كانت تدرس الاقتصاد، أن تراجع معهما أوضاعهما المالية. وخلال ساعة واحدة، اكتشفت عدة مشكلات. كانا يدفعان رسوم إدارة حساب شهرية ألغتها معظم البنوك منذ زمن، وكانت مدخراتهما في حساب لا يكاد يدرّ أي فائدة. والأسوأ أنهما كانا في سحب على المكشوف معظم السنة، أي أنهما كانا يدفعان بصمت فوائد مرتفعة على مال ظنّا أنه ملكهما. شعرت سيغال بالحرج، لكن ابنتها طمأنتها بأن هذا أمر شائع جدًا. في الأسبوع التالي، التقى الزوجان بمستشار في البنك ومعهما قائمة أسئلة. تفاوضا على رسوم أقل، ونقلا مدخراتهما إلى وديعة بعائد أفضل، وأعدّا أمرًا دائمًا لتحويل مبلغ ثابت في يوم الراتب. ولأول مرة، شعرا بأنهما يتحكمان في أموالهما.","questions":[["Why didn't Eli and Sigal notice the problems earlier?","They assumed things were fine without checking","Their bank hid the statements from them","They didn't have a bank account","Their daughter managed their money"],["What does 'in the red' most likely mean?","Owing money to the bank","Earning high interest","Closed by the bank","Full of savings"],["Why did the couple bring a list of questions to the meeting?","To be well prepared to negotiate","Because the advisor demanded it","To complain about their daughter","To close their account"]]}},{"en":"complaints and refunds","he":"תלונות והחזרים","ru":"жалобы и возврат денег","ar":"الشكاوى واسترداد الأموال","e":"🧾","items":[{"en":"I'm afraid this isn't what I ordered, and I'd like it sorted out today.","he":"אני חושש/ת שזה לא מה שהזמנתי, ואשמח שזה יסודר היום.","ru":"Боюсь, это не то, что я заказывал(а), и я бы хотел(а), чтобы это решили сегодня.","ar":"أخشى أن هذا ليس ما طلبته، وأودّ أن تُحلّ المشكلة اليوم.","e":"","alt":[]},{"en":"I understand it's not your fault, but I've been passed from one department to another.","he":"אני מבין/ה שזו לא אשמתך, אבל מעבירים אותי ממחלקה למחלקה.","ru":"Я понимаю, что вы не виноваты, но меня перекидывают из одного отдела в другой.","ar":"أفهم أن الخطأ ليس خطأك، لكنهم يحوّلونني من قسم إلى آخر.","e":"","alt":[]},{"en":"According to consumer protection law, I'm entitled to cancel within fourteen days.","he":"לפי חוק הגנת הצרכן, אני זכאי/ת לבטל תוך ארבעה עשר יום.","ru":"Согласно закону о защите прав потребителей, я имею право отменить покупку в течение четырнадцати дней.","ar":"وفقًا لقانون حماية المستهلك، يحق لي الإلغاء خلال أربعة عشر يومًا.","e":"","alt":[]},{"en":"Store credit won't do me much good, so I'd prefer a full refund.","he":"זיכוי לא ממש יעזור לי, אז אני מעדיף/ה החזר כספי מלא.","ru":"Кредит в магазине мне мало чем поможет, поэтому я бы предпочёл (предпочла) полный возврат денег.","ar":"الرصيد في المتجر لن يفيدني كثيرًا، لذا أفضّل استرداد المبلغ كاملًا.","e":"","alt":[]},{"en":"If the issue isn't resolved by Friday, I'll have to take it further.","he":"אם הבעיה לא תיפתר עד יום שישי, אצטרך לקחת את זה הלאה.","ru":"Если вопрос не решат до пятницы, мне придётся обратиться выше.","ar":"إذا لم تُحلّ المشكلة بحلول يوم الجمعة، سأضطر إلى التصعيد.","e":"","alt":[]},{"en":"Could you put that in writing so I have a record of our conversation?","he":"תוכל/י לתת לי את זה בכתב כדי שיהיה לי תיעוד של השיחה?","ru":"Не могли бы вы подтвердить это письменно, чтобы у меня была запись нашего разговора?","ar":"هل يمكنك تأكيد ذلك كتابيًا حتى يكون لدي سجلّ لمحادثتنا؟","e":"","alt":[]}],"reading":{"en":"Ronit bought an expensive washing machine from a large electronics chain, and within a month it had started leaking. The technician who came out blamed the installation, while the installer insisted the machine itself was faulty. Each side pointed at the other, and Ronit was left mopping her bathroom floor every evening. She had every reason to lose her temper, but she knew that shouting at call center staff rarely gets results. Instead, she kept a detailed log: dates, names, reference numbers, and photos of the damage. When her third phone call went nowhere, she wrote a short, factual email to the company's head office. She described the problem, listed every attempt to fix it, and stated clearly what she expected: a replacement machine or a full refund. She added, without any drama, that she would otherwise file a claim in small claims court. The tone of the reply was noticeably different from that of the call center. Within two days, a manager phoned to apologize and arranged for a brand-new machine to be delivered and installed free of charge.","he":"רונית קנתה מכונת כביסה יקרה מרשת מוצרי חשמל גדולה, ותוך חודש היא התחילה לדלוף. הטכנאי שהגיע האשים את ההתקנה, ואילו המתקין התעקש שהמכונה עצמה פגומה. כל צד הצביע על הצד השני, ורונית נשארה לנגב את רצפת חדר הרחצה כל ערב. הייתה לה כל סיבה לאבד את העשתונות, אבל היא ידעה שצעקות על נציגי מוקד השירות כמעט אף פעם לא מביאות תוצאות. במקום זאת, היא ניהלה תיעוד מפורט: תאריכים, שמות, מספרי פנייה ותמונות של הנזק. כשגם שיחת הטלפון השלישית לא הובילה לשום מקום, היא כתבה מייל קצר וענייני להנהלה הראשית של החברה. היא תיארה את הבעיה, פירטה כל ניסיון לתקן אותה, וציינה בבירור מה היא מצפה לקבל: מכונה חלופית או החזר כספי מלא. היא הוסיפה, בלי שום דרמה, שאחרת תגיש תביעה לבית המשפט לתביעות קטנות. הטון של התשובה היה שונה בעליל מזה של מוקד השירות. תוך יומיים התקשר מנהל להתנצל, ודאג שמכונה חדשה לגמרי תסופק ותותקן ללא תשלום.","ru":"Ронит купила дорогую стиральную машину в крупной сети электроники, и уже через месяц она начала протекать. Приехавший техник обвинил установку, а установщик настаивал, что неисправна сама машина. Каждая сторона кивала на другую, а Ронит каждый вечер вытирала пол в ванной. У неё были все основания выйти из себя, но она знала, что крик на сотрудников колл-центра редко приносит результат. Вместо этого она вела подробный журнал: даты, имена, номера обращений и фотографии повреждений. Когда и третий звонок ни к чему не привёл, она написала короткое деловое письмо в головной офис компании. Она описала проблему, перечислила все попытки её устранить и чётко указала, чего ожидает: замены машины или полного возврата денег. Без всякого драматизма она добавила, что иначе подаст иск в суд мелких тяжб. Тон ответа заметно отличался от тона колл-центра. Через два дня ей позвонил менеджер, извинился и организовал бесплатную доставку и установку совершенно новой машины.","ar":"اشترت رونيت غسالة باهظة الثمن من سلسلة كبيرة لبيع الأجهزة الكهربائية، وخلال شهر بدأت تسرّب الماء. ألقى الفني الذي حضر باللوم على التركيب، بينما أصرّ المركّب على أن الغسالة نفسها معيبة. كان كل طرف يلقي المسؤولية على الآخر، وبقيت رونيت تمسح أرضية الحمام كل مساء. كان لديها كل الأسباب لتفقد أعصابها، لكنها كانت تعرف أن الصراخ على موظفي مركز الاتصال نادرًا ما يأتي بنتيجة. بدلًا من ذلك، احتفظت بسجلّ مفصّل: التواريخ والأسماء وأرقام الطلبات وصور الضرر. وعندما لم تُفضِ مكالمتها الثالثة إلى شيء، كتبت رسالة إلكترونية قصيرة وموضوعية إلى المكتب الرئيسي للشركة. وصفت المشكلة، وعدّدت كل محاولة لإصلاحها، وذكرت بوضوح ما تتوقعه: غسالة بديلة أو استرداد المبلغ كاملًا. وأضافت، دون أي دراما، أنها ستقدّم بخلاف ذلك دعوى أمام محكمة الدعاوى الصغيرة. كانت نبرة الرد مختلفة بشكل ملحوظ عن نبرة مركز الاتصال. وخلال يومين، اتصل مدير ليعتذر، ورتّب توصيل غسالة جديدة تمامًا وتركيبها مجانًا.","questions":[["Why did Ronit avoid shouting at the call center staff?","She believed it wouldn't help","She was too tired to argue","The staff were her friends","She didn't speak their language"],["What does 'went nowhere' mean in the text?","Produced no result","Was suddenly disconnected","Was very short","Was transferred abroad"],["What most likely changed the company's attitude?","Her clear, documented email to head office","A second visit from the technician","Her angry phone calls","A post on social media"]]}},{"en":"small talk and socializing","he":"שיחת חולין ומצבים חברתיים","ru":"светская беседа и общение","ar":"الأحاديث القصيرة والمواقف الاجتماعية","e":"💬","items":[{"en":"I don't think we've been properly introduced; I'm a friend of the groom's.","he":"נדמה לי שעוד לא הכירו בינינו כמו שצריך; אני חבר/ה של החתן.","ru":"Кажется, нас ещё толком не познакомили; я друг (подруга) жениха.","ar":"لا أظن أننا تعارفنا كما ينبغي؛ أنا صديق العريس.","e":"","alt":[]},{"en":"I'd love to stay longer, but I have to be up early tomorrow.","he":"הייתי שמח/ה להישאר עוד, אבל אני צריך/ה לקום מוקדם מחר.","ru":"Я бы с удовольствием остался (осталась) подольше, но завтра мне рано вставать.","ar":"كنت أودّ البقاء أكثر، لكن عليّ الاستيقاظ مبكرًا غدًا.","e":"","alt":[]},{"en":"You might have a point, although I see it a little differently.","he":"אולי יש משהו במה שאת/ה אומר/ת, למרות שאני רואה את זה קצת אחרת.","ru":"Возможно, вы в чём-то правы, хотя я смотрю на это немного иначе.","ar":"ربما لديك وجهة نظر، مع أنني أرى الأمر بشكل مختلف قليلًا.","e":"","alt":[]},{"en":"Sorry, your name has completely slipped my mind; could you remind me?","he":"סליחה, השם שלך פרח לי לגמרי מהזיכרון; תוכל/י להזכיר לי?","ru":"Извините, ваше имя совершенно вылетело у меня из головы; не напомните?","ar":"عذرًا، لقد نسيت اسمك تمامًا؛ هل يمكنك تذكيري به؟","e":"","alt":[]},{"en":"We should get together sometime; I'll drop you a message next week.","he":"כדאי שניפגש מתישהו; אשלח לך הודעה בשבוע הבא.","ru":"Надо бы как-нибудь встретиться; я напишу тебе на следующей неделе.","ar":"يجب أن نلتقي في وقت ما؛ سأرسل لك رسالة الأسبوع القادم.","e":"","alt":[]},{"en":"I'm not really one for big parties, but this one turned out to be great.","he":"אני לא ממש טיפוס של מסיבות גדולות, אבל המסיבה הזאת יצאה מעולה.","ru":"Я не особо люблю большие вечеринки, но эта оказалась отличной.","ar":"لست من محبي الحفلات الكبيرة، لكن هذه الحفلة كانت رائعة في النهاية.","e":"","alt":[]}],"reading":{"en":"Ofer had just started a new job in Herzliya when he was invited to a colleague's housewarming party. He knew almost no one there and, being naturally shy, was tempted to stay for twenty minutes and slip away. Then he remembered some advice a friend had given him: people enjoy talking about themselves, so ask good questions and actually listen. He approached a woman standing by the bookshelf and asked whether she had read any of the novels on it. That simple question led to a long conversation about books, then about her recent trip to Portugal. Later, when the talk turned to politics, Ofer felt the atmosphere becoming tense. Rather than taking sides, he made a light joke about how everyone agrees on one thing, the traffic on the Ayalon, and people laughed. By the end of the evening, he had exchanged numbers with three people. On Sunday, one of them, who worked in another department, stopped by his desk to say hello. Ofer realized that the party had done more for his first weeks than any training session.","he":"עופר בדיוק התחיל עבודה חדשה בהרצליה כשהוזמן למסיבת חנוכת בית של עמית לעבודה. הוא כמעט לא הכיר שם אף אחד, ומכיוון שהוא ביישן מטבעו, התפתה להישאר עשרים דקות ולהתחמק בשקט. ואז נזכר בעצה שחבר נתן לו: אנשים נהנים לדבר על עצמם, אז שאל שאלות טובות ובאמת הקשב. הוא ניגש לאישה שעמדה ליד מדף הספרים ושאל אם קראה אחד מהרומנים שעליו. השאלה הפשוטה הזאת הובילה לשיחה ארוכה על ספרים, ואחר כך על הטיול האחרון שלה לפורטוגל. מאוחר יותר, כשהשיחה עברה לפוליטיקה, עופר הרגיש שהאווירה נעשית מתוחה. במקום לבחור צד, הוא התבדח בקלילות שכולם מסכימים על דבר אחד, הפקקים באיילון, והאנשים צחקו. עד סוף הערב הוא החליף מספרים עם שלושה אנשים. ביום ראשון, אחד מהם, שעבד במחלקה אחרת, עבר ליד השולחן שלו כדי להגיד שלום. עופר הבין שהמסיבה תרמה לשבועות הראשונים שלו יותר מכל הדרכה.","ru":"Офер только начал работать на новом месте в Герцлии, когда его пригласили на новоселье к коллеге. Он почти никого там не знал и, будучи застенчивым по натуре, подумывал побыть минут двадцать и незаметно уйти. Потом он вспомнил совет друга: людям нравится говорить о себе, поэтому задавай хорошие вопросы и по-настоящему слушай. Он подошёл к женщине, стоявшей у книжной полки, и спросил, читала ли она какой-нибудь из стоявших там романов. Этот простой вопрос перерос в долгий разговор о книгах, а затем о её недавней поездке в Португалию. Позже, когда разговор перешёл на политику, Офер почувствовал, что атмосфера накаляется. Вместо того чтобы занять чью-то сторону, он шутливо заметил, что все согласны хотя бы в одном — насчёт пробок на Аялоне, и все засмеялись. К концу вечера он обменялся номерами с тремя людьми. В воскресенье один из них, работавший в другом отделе, заглянул к нему поздороваться. Офер понял, что эта вечеринка дала ему в первые недели больше, чем любой тренинг.","ar":"كان عوفر قد بدأ للتو عملًا جديدًا في هرتسليا عندما دُعي إلى حفلة بيت جديد لدى أحد زملائه. لم يكن يعرف أحدًا تقريبًا هناك، ولأنه خجول بطبعه، فكّر في البقاء عشرين دقيقة ثم الانسلال بهدوء. ثم تذكّر نصيحة قدّمها له صديق: الناس يحبون الحديث عن أنفسهم، فاطرح أسئلة جيدة واستمع حقًا. اقترب من امرأة تقف بجانب رف الكتب وسألها إن كانت قد قرأت أيًّا من الروايات الموجودة عليه. أدّى هذا السؤال البسيط إلى حديث طويل عن الكتب، ثم عن رحلتها الأخيرة إلى البرتغال. لاحقًا، عندما انتقل الحديث إلى السياسة، شعر عوفر بأن الجو أصبح متوترًا. وبدلًا من الانحياز إلى طرف، أطلق مزحة خفيفة بأن الجميع متفقون على أمر واحد، وهو زحمة السير على طريق أيالون، فضحك الحاضرون. وبحلول نهاية الأمسية، كان قد تبادل الأرقام مع ثلاثة أشخاص. يوم الأحد، مرّ أحدهم، وكان يعمل في قسم آخر، بمكتبه ليلقي التحية. أدرك عوفر أن الحفلة أفادته في أسابيعه الأولى أكثر من أي دورة تدريبية.","questions":[["What was Ofer's original plan for the party?","To leave quietly after a short time","To give a speech","To stay until the very end","To talk about politics"],["Why did Ofer make a joke about the traffic?","To ease the tension without taking sides","Because he had arrived late","To show that he disagreed","To change the subject to his job"],["What does 'slip away' mean in the text?","Leave without being noticed","Fall on the floor","Make a small mistake","Arrive a little late"]]}},{"en":"health and doctors","he":"בריאות ותורים לרופא","ru":"здоровье и визиты к врачу","ar":"الصحة والمواعيد الطبية","e":"🩺","items":[{"en":"I've been feeling run down for weeks, and I can't seem to shake it off.","he":"אני מרגיש/ה מותש/ת כבר שבועות, ולא מצליח/ה להשתחרר מזה.","ru":"Я уже несколько недель чувствую себя разбитым (разбитой) и никак не могу прийти в себя.","ar":"أشعر بالإرهاق منذ أسابيع، ولا يبدو أنني أستطيع التخلص منه.","e":"","alt":[]},{"en":"Is there any chance of an earlier appointment if someone cancels?","he":"יש סיכוי לתור מוקדם יותר אם מישהו מבטל?","ru":"Есть ли шанс записаться пораньше, если кто-то отменит приём?","ar":"هل هناك فرصة لموعد أبكر إذا ألغى أحدهم موعده؟","e":"","alt":[]},{"en":"Could you explain the side effects before I start taking this medication?","he":"תוכל/י להסביר את תופעות הלוואי לפני שאתחיל לקחת את התרופה?","ru":"Не могли бы вы объяснить побочные эффекты, прежде чем я начну принимать это лекарство?","ar":"هل يمكنك شرح الآثار الجانبية قبل أن أبدأ بتناول هذا الدواء؟","e":"","alt":[]},{"en":"The pain comes and goes, but it gets worse when I lie down.","he":"הכאב בא והולך, אבל הוא מחמיר כשאני שוכב/ת.","ru":"Боль то появляется, то проходит, но усиливается, когда я ложусь.","ar":"الألم يأتي ويذهب، لكنه يزداد سوءًا عندما أستلقي.","e":"","alt":[]},{"en":"I'd like a referral to a specialist, just to rule out anything serious.","he":"אשמח להפניה לרופא מומחה, רק כדי לשלול משהו רציני.","ru":"Я бы хотел(а) получить направление к специалисту, просто чтобы исключить что-то серьёзное.","ar":"أودّ الحصول على تحويل إلى طبيب مختص، فقط لاستبعاد أي شيء خطير.","e":"","alt":[]},{"en":"Does my health fund cover this test, or will I have to pay privately?","he":"קופת החולים שלי מכסה את הבדיקה הזאת, או שאצטרך לשלם באופן פרטי?","ru":"Покрывает ли моя больничная касса этот анализ, или мне придётся платить самому (самой)?","ar":"هل يغطي صندوق المرضى هذا الفحص، أم سأضطر إلى الدفع على حسابي الخاص؟","e":"","alt":[]}],"reading":{"en":"For months, Yael had put off dealing with the dull pain in her knee. She was busy at work, and every time she tried to book an appointment, the earliest slot with an orthopedist was six weeks away. A colleague suggested she check the health fund's app every morning, since cancellations often appear at the last minute. Sure enough, on the third day she grabbed a slot for the following afternoon. Before the visit, she wrote down when the pain had started, what made it worse, and which painkillers she had tried. The doctor appreciated her preparation and said it saved them both time. After examining her, he explained that it was probably a mild strain caused by running on hard surfaces without proper shoes. He ruled out surgery but recommended physiotherapy and a temporary break from running. Yael asked whether the treatment was covered, and he told her that her plan included twelve sessions a year. She left feeling relieved, and slightly annoyed with herself for having waited so long.","he":"במשך חודשים, יעל דחתה את הטיפול בכאב העמום בברך שלה. היא הייתה עסוקה בעבודה, ובכל פעם שניסתה לקבוע תור, התור הקרוב ביותר לאורתופד היה בעוד שישה שבועות. עמיתה לעבודה הציעה לה לבדוק באפליקציה של קופת החולים כל בוקר, כי ביטולים מופיעים לעיתים קרובות ברגע האחרון. ואכן, ביום השלישי היא תפסה תור למחרת אחר הצהריים. לפני הביקור, היא רשמה מתי התחיל הכאב, מה מחמיר אותו ואילו משככי כאבים ניסתה. הרופא העריך את ההכנה שלה ואמר שזה חסך לשניהם זמן. אחרי שבדק אותה, הוא הסביר שזו כנראה מתיחה קלה שנגרמה מריצה על משטחים קשים בלי נעליים מתאימות. הוא שלל ניתוח, אבל המליץ על פיזיותרפיה והפסקה זמנית מריצה. יעל שאלה אם הטיפול מכוסה, והוא אמר לה שהתוכנית שלה כוללת שנים עשר טיפולים בשנה. היא יצאה בתחושת הקלה, וקצת כועסת על עצמה שחיכתה כל כך הרבה זמן.","ru":"Несколько месяцев Яэль откладывала решение проблемы с ноющей болью в колене. Она была занята на работе, и каждый раз, когда пыталась записаться, ближайший приём у ортопеда был только через шесть недель. Коллега посоветовала ей каждое утро проверять приложение больничной кассы, потому что отменённые записи часто появляются в последний момент. И действительно, на третий день она успела записаться на следующий день после обеда. Перед визитом она записала, когда началась боль, что её усиливает и какие обезболивающие она пробовала. Врач оценил её подготовку и сказал, что это сэкономило им обоим время. Осмотрев её, он объяснил, что это, скорее всего, лёгкое растяжение из-за бега по твёрдым поверхностям без подходящей обуви. Он исключил операцию, но порекомендовал физиотерапию и временный перерыв в беге. Яэль спросила, покрывается ли лечение, и он ответил, что её план включает двенадцать сеансов в год. Она ушла с облегчением и немного досадуя на себя за то, что так долго тянула.","ar":"لأشهر عديدة، أجّلت ياعيل التعامل مع الألم الخفيف في ركبتها. كانت مشغولة في العمل، وفي كل مرة حاولت فيها حجز موعد، كان أقرب موعد عند طبيب العظام بعد ستة أسابيع. اقترحت عليها زميلة أن تتفقد تطبيق صندوق المرضى كل صباح، لأن المواعيد الملغاة تظهر غالبًا في اللحظة الأخيرة. وبالفعل، في اليوم الثالث حجزت موعدًا لعصر اليوم التالي. قبل الزيارة، دوّنت متى بدأ الألم، وما الذي يزيده سوءًا، وأي المسكّنات جرّبت. قدّر الطبيب استعدادها وقال إن ذلك وفّر عليهما الوقت. بعد أن فحصها، أوضح أنه على الأرجح التواء خفيف ناتج عن الجري على أسطح صلبة د
