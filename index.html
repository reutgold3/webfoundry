ون حذاء مناسب. استبعد الجراحة، لكنه أوصى بالعلاج الطبيعي والتوقف عن الجري مؤقتًا. سألت ياعيل إن كان العلاج مغطّى، فأخبرها أن خطتها تشمل اثنتي عشرة جلسة في السنة. خرجت وهي تشعر بالارتياح، ومنزعجة قليلًا من نفسها لأنها انتظرت كل هذا الوقت.","questions":[["Why did the colleague recommend checking the app every morning?","Cancelled appointments can suddenly become available","The app gives out free medicine","Doctors post daily advice there","Prices for visits change every day"],["What does 'put off' mean in the text?","Delayed","Solved","Described","Paid for"],["How did Yael probably feel about her long delay?","She regretted not acting sooner","She was proud of waiting","She blamed the doctor for it","She didn't care at all"]]}},{"en":"news and current affairs","he":"חדשות ואקטואליה","ru":"новости и текущие события","ar":"الأخبار والشؤون الجارية","e":"📰","items":[{"en":"From what I've read, the new policy is likely to push housing prices even higher.","he":"ממה שקראתי, המדיניות החדשה צפויה לדחוף את מחירי הדיור עוד יותר למעלה.","ru":"Насколько я читал(а), новая политика, скорее всего, ещё больше поднимет цены на жильё.","ar":"مما قرأته، من المرجح أن تدفع السياسة الجديدة أسعار المساكن إلى الارتفاع أكثر.","e":"","alt":[]},{"en":"I take headlines like that with a pinch of salt until I see the full story.","he":"אני מתייחס/ת לכותרות כאלה בספקנות עד שאני רואה את הכתבה המלאה.","ru":"К таким заголовкам я отношусь скептически, пока не увижу всю статью.","ar":"أتعامل مع عناوين كهذه بشيء من الشك حتى أرى القصة كاملة.","e":"","alt":[]},{"en":"It's hard to tell whether the report is biased or simply incomplete.","he":"קשה לדעת אם הכתבה מוטה או פשוט לא שלמה.","ru":"Трудно сказать, предвзят ли этот репортаж или просто неполон.","ar":"من الصعب معرفة ما إذا كان التقرير منحازًا أم ناقصًا فحسب.","e":"","alt":[]},{"en":"Whatever your political views, the rising cost of living affects everyone.","he":"לא משנה מה הדעות הפוליטיות שלך, יוקר המחיה משפיע על כולם.","ru":"Какими бы ни были ваши политические взгляды, рост стоимости жизни касается всех.","ar":"مهما كانت آراؤك السياسية، فإن ارتفاع تكاليف المعيشة يؤثر على الجميع.","e":"","alt":[]},{"en":"I've stopped following the news so closely because it was affecting my mood.","he":"הפסקתי לעקוב אחרי החדשות כל כך מקרוב כי זה השפיע על מצב הרוח שלי.","ru":"Я перестал(а) так пристально следить за новостями, потому что это портило мне настроение.","ar":"توقفت عن متابعة الأخبار عن كثب لأنها كانت تؤثر على مزاجي.","e":"","alt":[]},{"en":"The minister's announcement raised more questions than it actually answered.","he":"ההודעה של השר העלתה יותר שאלות ממה שהיא באמת ענתה.","ru":"Заявление министра вызвало больше вопросов, чем дало ответов.","ar":"أثار إعلان الوزير أسئلة أكثر مما أجاب عنه فعلًا.","e":"","alt":[]}],"reading":{"en":"Last month, a short video spread rapidly across Israeli social media. It appeared to show a supermarket manager in Be'er Sheva throwing away crates of fresh vegetables while prices were soaring. Within hours, it had been shared tens of thousands of times, and furious comments called for a boycott of the chain. Yet when a team of journalists looked into the story, a very different picture emerged. The footage was genuine, but it had been filmed three years earlier, in another country, and the vegetables had been recalled because of contamination. Someone had simply added a misleading caption. By the time the correction was published, however, the damage was done: the chain had received threats, and several branches reported a drop in customers. Media experts say the case illustrates a familiar pattern. False stories tend to travel faster than true ones because they provoke strong emotions, especially anger. Their advice is straightforward, if not always easy to follow: pause before sharing, check the date and source, and be especially suspicious of content that makes you instantly outraged.","he":"בחודש שעבר הופץ במהירות סרטון קצר ברשתות החברתיות בישראל. נראה בו, לכאורה, מנהל סופרמרקט בבאר שבע שזורק ארגזים של ירקות טריים בזמן שהמחירים מזנקים. תוך שעות הוא שותף עשרות אלפי פעמים, ותגובות זועמות קראו להחרים את הרשת. אבל כשצוות עיתונאים בדק את הסיפור, התגלתה תמונה שונה לגמרי. הצילומים היו אמיתיים, אבל הם צולמו שלוש שנים קודם לכן, במדינה אחרת, והירקות נאספו בגלל זיהום. מישהו פשוט הוסיף כיתוב מטעה. אולם עד שהתיקון פורסם, הנזק כבר נעשה: הרשת קיבלה איומים, וכמה סניפים דיווחו על ירידה במספר הלקוחות. מומחי תקשורת אומרים שהמקרה ממחיש דפוס מוכר. ידיעות כוזבות נוטות להתפשט מהר יותר מאמיתיות, כי הן מעוררות רגשות חזקים, ובמיוחד כעס. העצה שלהם פשוטה, גם אם לא תמיד קל ליישם אותה: לעצור לפני שמשתפים, לבדוק את התאריך ואת המקור, ולחשוד במיוחד בתוכן שגורם לך לזעם מיידי.","ru":"В прошлом месяце в израильских соцсетях быстро распространилось короткое видео. На нём, как казалось, управляющий супермаркета в Беэр-Шеве выбрасывал ящики свежих овощей, в то время как цены стремительно росли. За несколько часов им поделились десятки тысяч раз, а гневные комментарии призывали бойкотировать сеть. Однако когда группа журналистов изучила эту историю, картина оказалась совсем иной. Кадры были настоящими, но их сняли три года назад в другой стране, а овощи изъяли из-за заражения. Кто-то просто добавил вводящую в заблуждение подпись. Но к тому времени, как опубликовали опровержение, вред уже был нанесён: сеть получала угрозы, а несколько филиалов сообщили об оттоке покупателей. Медиаэксперты говорят, что этот случай иллюстрирует знакомую закономерность. Ложные новости распространяются быстрее правдивых, потому что вызывают сильные эмоции, особенно гнев. Их совет прост, хотя ему не всегда легко следовать: остановитесь, прежде чем делиться, проверьте дату и источник и будьте особенно недоверчивы к материалам, которые мгновенно вызывают у вас возмущение.","ar":"في الشهر الماضي، انتشر مقطع فيديو قصير بسرعة على شبكات التواصل الاجتماعي في إسرائيل. بدا أنه يُظهر مدير سوبرماركت في بئر السبع يرمي صناديق من الخضار الطازجة في وقت كانت فيه الأسعار ترتفع بشدة. وخلال ساعات، تمت مشاركته عشرات آلاف المرات، ودعت تعليقات غاضبة إلى مقاطعة السلسلة. لكن عندما تحقّق فريق من الصحفيين من القصة، ظهرت صورة مختلفة تمامًا. كانت اللقطات حقيقية، لكنها صُوّرت قبل ثلاث سنوات في بلد آخر، وكانت الخضار قد سُحبت بسبب تلوّث. كل ما في الأمر أن أحدهم أضاف تعليقًا مضللًا. ولكن بحلول وقت نشر التصحيح، كان الضرر قد وقع: تلقّت السلسلة تهديدات، وأبلغت عدة فروع عن تراجع في عدد الزبائن. يقول خبراء الإعلام إن هذه الحالة توضّح نمطًا مألوفًا. فالأخبار الكاذبة تنتشر أسرع من الصحيحة لأنها تثير مشاعر قوية، خاصة الغضب. ونصيحتهم بسيطة، وإن لم يكن اتباعها سهلًا دائمًا: توقّف قبل المشاركة، وتحقّق من التاريخ والمصدر، وكن حذرًا بشكل خاص من المحتوى الذي يثير غضبك على الفور.","questions":[["According to the experts, why did the video spread so quickly?","It made people very angry","A famous singer shared it","It was extremely funny","The chain paid to promote it"],["What was actually wrong with the video?","It was old footage with a false caption","It was created entirely by computer","It was filmed in Be'er Sheva that week","It had no sound at all"],["What does 'the damage was done' suggest?","The correction came too late to prevent harm","The vegetables were damaged in transport","The journalists made a serious mistake","The video was deleted in time"]]}},{"en":"handling bureaucracy","he":"התמודדות עם בירוקרטיה","ru":"бюрократия и учреждения","ar":"التعامل مع البيروقراطية","e":"🏛️","items":[{"en":"I've already submitted this form twice, and both times it apparently got lost.","he":"כבר הגשתי את הטופס הזה פעמיים, ובשתי הפעמים הוא כנראה הלך לאיבוד.","ru":"Я уже дважды подавал(а) эту форму, и оба раза она, по-видимому, потерялась.","ar":"قدّمت هذا النموذج مرتين بالفعل، ويبدو أنه ضاع في المرتين.","e":"","alt":[]},{"en":"Could you tell me exactly which documents I need to bring next time?","he":"תוכל/י להגיד לי בדיוק אילו מסמכים אני צריך/ה להביא בפעם הבאה?","ru":"Не могли бы вы точно сказать, какие документы мне нужно принести в следующий раз?","ar":"هل يمكنك أن تخبرني بالضبط ما المستندات التي يجب أن أحضرها في المرة القادمة؟","e":"","alt":[]},{"en":"I'd like to appeal the decision, since I believe the property tax was miscalculated.","he":"אני רוצה לערער על ההחלטה, כי לדעתי הארנונה חושבה לא נכון.","ru":"Я хотел(а) бы обжаловать это решение, так как считаю, что налог на недвижимость рассчитан неверно.","ar":"أودّ الطعن في القرار، لأنني أعتقد أن ضريبة الأملاك حُسبت بشكل خاطئ.","e":"","alt":[]},{"en":"The insurance company keeps asking for more paperwork instead of processing my claim.","he":"חברת הביטוח כל הזמן מבקשת עוד מסמכים במקום לטפל בתביעה שלי.","ru":"Страховая компания постоянно требует новые документы вместо того, чтобы рассмотреть моё заявление.","ar":"تواصل شركة التأمين طلب المزيد من الأوراق بدلًا من معالجة مطالبتي.","e":"","alt":[]},{"en":"Is it possible to handle this online, or do I have to come in person?","he":"אפשר לטפל בזה באינטרנט, או שאני חייב/ת להגיע באופן אישי?","ru":"Можно ли сделать это онлайн, или мне нужно прийти лично?","ar":"هل يمكن إنجاز ذلك عبر الإنترنت، أم يجب أن أحضر شخصيًا؟","e":"","alt":[]},{"en":"If I'd filled in the form correctly the first time, I'd have saved weeks.","he":"אילו מילאתי את הטופס נכון בפעם הראשונה, הייתי חוסך/ת שבועות.","ru":"Если бы я правильно заполнил(а) форму с первого раза, я бы сэкономил(а) несколько недель.","ar":"لو ملأت النموذج بشكل صحيح من المرة الأولى، لوفّرت أسابيع.","e":"","alt":[]}],"reading":{"en":"When Nadia and her husband moved from Nazareth to Kiryat Tivon, they assumed that updating their address would take an afternoon. Instead, it turned into a three-month saga. The municipality billed them for property tax based on an apartment size that was twenty square meters larger than the real one. To correct it, they were told to submit an official measurement, which cost several hundred shekels. Meanwhile, a pipe burst in the bathroom, and their insurance company requested a plumber's report, photos, receipts, and a form that had to be signed by the previous tenant, whom they had never met. Nadia was close to giving up. Then a neighbor gave her a valuable tip: always ask for the name of the clerk you speak to, request every promise in writing, and, if a deadline passes, file a formal complaint with the public inquiries department. It sounded excessive, but it worked. Once she started citing reference numbers and dates, replies came faster. Eventually, the tax was reduced and the insurance claim was approved, though the experience left her exhausted.","he":"כשנדיה ובעלה עברו מנצרת לקריית טבעון, הם הניחו שעדכון הכתובת ייקח אחר צהריים אחד. במקום זאת, זה הפך לסאגה של שלושה חודשים. העירייה חייבה אותם בארנונה לפי שטח דירה הגדול בעשרים מטרים רבועים מהשטח האמיתי. כדי לתקן את זה, נאמר להם להגיש מדידה רשמית, שעלתה כמה מאות שקלים. בינתיים התפוצץ צינור בחדר הרחצה, וחברת הביטוח שלהם ביקשה דוח של אינסטלטור, תמונות, קבלות וטופס שהיה צריך להיחתם על ידי השוכר הקודם, שאותו מעולם לא פגשו. נדיה הייתה קרובה להרים ידיים. ואז שכנה נתנה לה טיפ חשוב: תמיד לבקש את שם הפקיד שמדברים איתו, לבקש כל הבטחה בכתב, ואם עובר מועד, להגיש תלונה רשמית למחלקת פניות הציבור. זה נשמע מוגזם, אבל זה עבד. ברגע שהתחילה לצטט מספרי פנייה ותאריכים, התשובות הגיעו מהר יותר. בסופו של דבר הארנונה הופחתה ותביעת הביטוח אושרה, אם כי החוויה הותירה אותה מותשת.","ru":"Когда Надя с мужем переехали из Назарета в Кирьят-Тивон, они думали, что смена адреса займёт полдня. Вместо этого всё превратилось в трёхмесячную сагу. Муниципалитет начислил им налог на недвижимость исходя из площади квартиры на двадцать квадратных метров больше настоящей. Чтобы это исправить, им сказали предоставить официальный обмер, который стоил несколько сотен шекелей. Тем временем в ванной лопнула труба, и страховая компания запросила отчёт сантехника, фотографии, чеки и форму, которую должен был подписать предыдущий жилец, которого они ни разу не видели. Надя была близка к тому, чтобы сдаться. Тогда соседка дала ей ценный совет: всегда спрашивать имя служащего, с которым говоришь, просить каждое обещание в письменном виде, а если срок прошёл, подавать официальную жалобу в отдел обращений граждан. Это казалось излишним, но сработало. Как только она начала ссылаться на номера обращений и даты, ответы стали приходить быстрее. В конце концов налог снизили, а страховое заявление одобрили, хотя всё это её совершенно вымотало.","ar":"عندما انتقلت ناديا وزوجها من الناصرة إلى كريات طبعون، افترضا أن تحديث عنوانهما سيستغرق فترة بعد الظهر فقط. لكن الأمر تحوّل إلى ملحمة استمرت ثلاثة أشهر. فرضت البلدية عليهما ضريبة أملاك على أساس مساحة شقة أكبر بعشرين مترًا مربعًا من المساحة الحقيقية. ولتصحيح ذلك، طُلب منهما تقديم قياس رسمي كلّف عدة مئات من الشواكل. وفي هذه الأثناء، انفجر أنبوب في الحمام، وطلبت شركة التأمين تقرير سبّاك وصورًا وإيصالات ونموذجًا يجب أن يوقّعه المستأجر السابق الذي لم يلتقيا به قط. كانت ناديا على وشك الاستسلام. ثم قدّمت لها جارة نصيحة قيّمة: اطلبي دائمًا اسم الموظف الذي تتحدثين إليه، واطلبي كل وعد كتابيًا، وإذا انقضى موعد ما، فقدّمي شكوى رسمية إلى قسم شكاوى الجمهور. بدا ذلك مبالغًا فيه، لكنه نجح. فما إن بدأت تذكر أرقام الطلبات والتواريخ حتى صارت الردود تصل أسرع. وفي النهاية، خُفّضت الضريبة ووُوفق على مطالبة التأمين، رغم أن التجربة تركتها منهكة.","questions":[["Why did the property tax bill seem unfair?","It was based on the wrong apartment size","It was charged twice a month","It was meant for the neighbor","It came from another city"],["What does 'saga' most likely mean here?","A long, complicated series of events","A short phone call","A family celebration","An official legal document"],["What is the main lesson of the neighbor's tip?","Clear records put pressure on officials","Avoid dealing with officials at all","Pay whatever you are asked to pay","Always hire a lawyer first"]]}},{"en":"parent-teacher meeting","he":"אסיפת הורים","ru":"встреча родителей с учителем","ar":"لقاء أولياء الأمور مع المعلم","e":"🏫","dialog":true,"items":[{"q":"Thanks for coming in. I wanted to talk about how Noam has been doing this term.","en":"Thanks for making the time; to be honest, he's seemed a bit withdrawn at home lately.","he":"תודה שמצאת זמן; למען האמת, הוא נראה קצת מכונס בעצמו בבית לאחרונה.","ru":"Спасибо, что нашли время; честно говоря, дома он в последнее время кажется немного замкнутым.","ar":"شكرًا لتخصيص الوقت؛ بصراحة، يبدو منطويًا بعض الشيء في البيت مؤخرًا."},{"q":"His grades are fine, but he rarely joins in class discussions. Has he mentioned anything?","en":"He hasn't said much, but I suspect he's still struggling to fit in with the new group.","he":"הוא לא סיפר הרבה, אבל אני חושד/ת שהוא עדיין מתקשה להשתלב בקבוצה החדשה.","ru":"Он мало что рассказывал, но я подозреваю, что ему всё ещё трудно влиться в новый коллектив.","ar":"لم يقل الكثير، لكنني أظن أنه ما زال يجد صعوبة في الاندماج مع المجموعة الجديدة."},{"q":"That would make sense. Some of the boys have been fairly cliquey this year.","en":"Would it be possible to seat him next to someone who might help him feel included?","he":"האם אפשר להושיב אותו ליד מישהו שעשוי לעזור לו להרגיש חלק מהקבוצה?","ru":"Можно ли посадить его рядом с кем-то, кто поможет ему почувствовать себя своим?","ar":"هل من الممكن أن يجلس بجانب شخص قد يساعده على الشعور بأنه جزء من المجموعة؟"},{"q":"Certainly. I was also thinking of giving him a role in the upcoming class project.","en":"That sounds great; he really comes alive when he's given responsibility for something practical.","he":"זה נשמע מצוין; הוא ממש פורח כשנותנים לו אחריות על משהו מעשי.","ru":"Звучит отлично; он прямо оживает, когда ему поручают что-то практическое.","ar":"تبدو فكرة رائعة؛ فهو ينتعش حقًا عندما يُكلَّف بمسؤولية عن شيء عملي."},{"q":"Is there anything going on at home that we should be aware of?","en":"His grandmother passed away in the summer, and I think it hit him harder than he lets on.","he":"סבתא שלו נפטרה בקיץ, ואני חושב/ת שזה פגע בו יותר ממה שהוא מראה.","ru":"Летом умерла его бабушка, и, думаю, он переживает это тяжелее, чем показывает.","ar":"توفيت جدته في الصيف، وأظن أن ذلك أثّر فيه أكثر مما يُظهر."},{"q":"Thank you for telling me. Shall we check in again in about a month?","en":"Definitely; in the meantime, please don't hesitate to message me if anything comes up.","he":"בהחלט; בינתיים, אל תהסס/י לשלוח לי הודעה אם משהו עולה.","ru":"Обязательно; а пока, пожалуйста, не стесняйтесь писать мне, если что-то случится.","ar":"بالتأكيد؛ وفي الأثناء، لا تتردد في مراسلتي إذا طرأ أي شيء."}]}]},{"id":"biz","group":"adults","he":"אנגלית עסקית","sub":"מיילים, פגישות, משא ומתן ומצגות ברמה מקצועית","e":"💼","units":[{"en":"networking and introductions","he":"היכרות מקצועית ונטוורקינג","ru":"Деловые знакомства и нетворкинг","ar":"التعارف المهني وبناء العلاقات","e":"🤝","items":[{"en":"I don't think we've been formally introduced; I'm heading the analytics team.","he":"אני לא חושב/ת שהוצגנו רשמית; אני מוביל/ה את צוות האנליטיקה.","ru":"Кажется, нас официально не представили; я руковожу аналитическим отделом.","ar":"لا أظن أننا تعارفنا رسميًا؛ أنا أرأس فريق التحليلات.","e":"","alt":[]},{"en":"Would you mind if I reached out next week to explore possible synergies?","he":"יהיה בסדר אם אפנה אליך בשבוע הבא כדי לבחון שיתופי פעולה אפשריים?","ru":"Вы не против, если я свяжусь с вами на следующей неделе, чтобы обсудить возможное сотрудничество?","ar":"هل تمانع إن تواصلت معك الأسبوع المقبل لاستكشاف فرص التعاون الممكنة؟","e":"","alt":[]},{"en":"A mutual colleague suggested I get in touch regarding your expansion plans.","he":"עמית/ה משותף/ת הציע/ה שאיצור איתך קשר בנוגע לתוכניות ההתרחבות שלכם.","ru":"Наш общий коллега посоветовал мне связаться с вами по поводу ваших планов расширения.","ar":"اقترح عليّ زميل مشترك أن أتواصل معك بخصوص خطط التوسع لديكم.","e":"","alt":[]},{"en":"I'd be happy to put you in touch with our head of procurement.","he":"אשמח לחבר אותך עם מנהל/ת הרכש שלנו.","ru":"Я с удовольствием свяжу вас с нашим руководителем отдела закупок.","ar":"يسعدني أن أعرّفك على مدير المشتريات لدينا.","e":"","alt":[]},{"en":"What I find most rewarding about my role is translating data into strategy.","he":"מה שהכי מספק אותי בתפקיד שלי הוא לתרגם נתונים לאסטרטגיה.","ru":"Больше всего в своей работе я ценю возможность превращать данные в стратегию.","ar":"أكثر ما يمنحني الرضا في عملي هو تحويل البيانات إلى استراتيجية.","e":"","alt":[]},{"en":"It was a pleasure meeting you; let's continue this conversation over coffee sometime.","he":"היה תענוג להכיר אותך; בוא/י נמשיך את השיחה הזאת על קפה מתישהו.","ru":"Было приятно познакомиться; давайте как-нибудь продолжим этот разговор за чашкой кофе.","ar":"سُررت بلقائك؛ لنكمل هذا الحديث على فنجان قهوة في وقت ما.","e":"","alt":[]}],"reading":{"en":"Subject: Following up from the Tel Aviv FinTech Summit. Dear Ms. Levin, It was a pleasure speaking with you briefly after your panel on Thursday. I was particularly struck by your point that most digital onboarding fails not because of technology, but because companies underestimate how much reassurance customers need at each step. As I mentioned, I lead product design at Clearpath, a Haifa-based startup that builds identity-verification tools for mid-sized banks. We have recently been piloting a simplified onboarding flow, and our early data seems to support your argument: completion rates rose by nearly a third once we added short explanations before each request for personal documents. I realise your schedule is likely to be very full, so I would not want to take up much of your time. However, if you were open to a twenty-minute call in the coming weeks, I would greatly value your perspective on whether our approach could scale to larger institutions. Either way, thank you again for a genuinely thought-provoking session. I have attached a brief summary of our pilot results in case they are of interest. Kind regards, Daniel Shapira","he":"נושא: המשך לפגישתנו בכנס הפינטק בתל אביב. גב' לוין היקרה, היה לי עונג לשוחח איתך בקצרה אחרי הפאנל שלך ביום חמישי. במיוחד הרשימה אותי הטענה שלך שרוב תהליכי ההצטרפות הדיגיטליים נכשלים לא בגלל הטכנולוגיה, אלא משום שחברות ממעיטות בהערכת מידת הביטחון שהלקוחות צריכים בכל שלב. כפי שציינתי, אני מוביל את עיצוב המוצר ב-Clearpath, סטארט-אפ מחיפה שמפתח כלים לאימות זהות עבור בנקים בינוניים. לאחרונה הרצנו פיילוט של תהליך הצטרפות פשוט יותר, והנתונים הראשוניים שלנו נראים כתומכים בטענתך: שיעורי ההשלמה עלו בכמעט שליש לאחר שהוספנו הסברים קצרים לפני כל בקשה למסמכים אישיים. אני מבין שלוח הזמנים שלך כנראה עמוס מאוד, ולכן לא ארצה לגזול הרבה מזמנך. עם זאת, אם תהיי פתוחה לשיחה של עשרים דקות בשבועות הקרובים, אעריך מאוד את נקודת המבט שלך בשאלה אם הגישה שלנו יכולה להתאים גם למוסדות גדולים יותר. כך או כך, תודה שוב על מושב מעורר מחשבה באמת. צירפתי סיכום קצר של תוצאות הפיילוט שלנו, למקרה שזה מעניין אותך. בברכה, דניאל שפירא","ru":"Тема: По итогам финтех-саммита в Тель-Авиве. Уважаемая г-жа Левин, мне было очень приятно коротко побеседовать с вами после вашей панельной дискуссии в четверг. Особенно меня впечатлила ваша мысль о том, что большинство процессов цифровой регистрации проваливаются не из-за технологий, а потому, что компании недооценивают, насколько клиентам нужна уверенность на каждом этапе. Как я уже говорил, я руковожу дизайном продукта в Clearpath — стартапе из Хайфы, который разрабатывает инструменты проверки личности для банков среднего размера. Недавно мы запустили пилотный проект упрощённой регистрации, и наши первые данные, похоже, подтверждают вашу точку зрения: доля завершённых регистраций выросла почти на треть после того, как мы добавили короткие пояснения перед каждым запросом личных документов. Я понимаю, что ваш график, вероятно, очень плотный, поэтому не хотел бы отнимать у вас много времени. Однако, если вы готовы к двадцатиминутному звонку в ближайшие недели, я был бы очень благодарен за ваше мнение о том, можно ли масштабировать наш подход для более крупных организаций. В любом случае ещё раз спасибо за по-настоящему интересное выступление. Прилагаю краткое резюме результатов нашего пилота на случай, если они вас заинтересуют. С уважением, Даниэль Шапира","ar":"الموضوع: متابعة بعد قمة التكنولوجيا المالية في تل أبيب. السيدة ليفين المحترمة، سُررت كثيرًا بالحديث معك لفترة قصيرة بعد جلستك النقاشية يوم الخميس. لقد لفتت انتباهي بشكل خاص فكرتك بأن معظم عمليات التسجيل الرقمي تفشل ليس بسبب التكنولوجيا، بل لأن الشركات تستهين بمقدار الطمأنينة التي يحتاجها العملاء في كل خطوة. كما ذكرت، أنا أقود تصميم المنتجات في Clearpath، وهي شركة ناشئة مقرها حيفا تطوّر أدوات للتحقق من الهوية للبنوك متوسطة الحجم. لقد بدأنا مؤخرًا تجربة مسار تسجيل مبسّط، ويبدو أن بياناتنا الأولية تدعم رأيك: فقد ارتفعت نسب إتمام التسجيل بنحو الثلث بعد أن أضفنا شروحات قصيرة قبل كل طلب للمستندات الشخصية. أدرك أن جدولك على الأرجح مزدحم جدًا، لذلك لا أريد أن آخذ الكثير من وقتك. ومع ذلك، إن كنتِ منفتحة على مكالمة مدتها عشرون دقيقة في الأسابيع القادمة، فسأقدّر كثيرًا رأيك حول إمكانية تطبيق نهجنا على مؤسسات أكبر. وفي كل الأحوال، شكرًا مجددًا على جلسة محفّزة للتفكير حقًا. لقد أرفقت ملخصًا موجزًا لنتائج تجربتنا في حال كانت تهمّك. مع خالص التحيات، دانيال شابيرا","questions":[["What is the main purpose of Daniel's email?","To request a short call to get her opinion on their approach","To invite her to speak at Clearpath's next conference","To complain about the content of her panel","To offer her a job leading product design"],["What can be inferred about Daniel's pilot results?","They appear to confirm an idea Ms. Levin presented","They prove technology is the main cause of failure","They were rejected by several large banks","They have not been collected yet"],["How would you describe the tone of the email?","Polite and respectful, without being pushy","Demanding and impatient","Casual and joking","Apologetic and nervous"]]}},{"en":"running meetings","he":"ניהול ישיבות","ru":"Проведение совещаний","ar":"إدارة الاجتماعات","e":"📋","items":[{"en":"Let's make sure we stick to the agenda so we can finish on time.","he":"בואו נקפיד להיצמד לסדר היום כדי שנוכל לסיים בזמן.","ru":"Давайте придерживаться повестки, чтобы закончить вовремя.","ar":"لنحرص على الالتزام بجدول الأعمال حتى ننتهي في الوقت المحدد.","e":"","alt":[]},{"en":"Before we move on, does anyone have any concerns they'd like to raise?","he":"לפני שנמשיך הלאה, יש למישהו חששות שהוא רוצה להעלות?","ru":"Прежде чем двигаться дальше, есть ли у кого-нибудь опасения, которые хотелось бы озвучить?","ar":"قبل أن ننتقل، هل لدى أحد أي مخاوف يود طرحها؟","e":"","alt":[]},{"en":"I'm afraid we're running short on time, so let's park that issue for now.","he":"אני חושש/ת שהזמן אוזל לנו, אז בואו נניח את הנושא הזה בצד בינתיים.","ru":"Боюсь, у нас заканчивается время, так что давайте пока отложим этот вопрос.","ar":"أخشى أن الوقت يداهمنا، لذا لنؤجل هذه المسألة في الوقت الحالي.","e":"","alt":[]},{"en":"Could you briefly bring everyone up to speed on where things stand?","he":"תוכל/י לעדכן בקצרה את כולם לגבי המצב הנוכחי?","ru":"Не могли бы вы вкратце рассказать всем, как обстоят дела?","ar":"هل يمكنك أن تُطلع الجميع باختصار على آخر المستجدات؟","e":"","alt":[]},{"en":"To sum up, we've agreed to postpone the launch until early next quarter.","he":"לסיכום, הסכמנו לדחות את ההשקה לתחילת הרבעון הבא.","ru":"Подводя итог: мы договорились перенести запуск на начало следующего квартала.","ar":"خلاصة القول، اتفقنا على تأجيل الإطلاق إلى بداية الربع القادم.","e":"","alt":[]},{"en":"I'll circulate the minutes and action items by the end of the day.","he":"אפיץ את הפרוטוקול ואת משימות ההמשך עד סוף היום.","ru":"Я разошлю протокол и список задач до конца дня.","ar":"سأوزّع محضر الاجتماع والمهام المطلوبة قبل نهاية اليوم.","e":"","alt":[]}],"reading":{"en":"To: Operations team. From: Noa Ben-David. Re: Summary of Monday's planning meeting. Thank you all for a productive discussion on Monday. For those who were unable to attend, here is a brief summary of what was agreed. First, we confirmed that the warehouse migration will go ahead as planned, although the start date has been moved from 1 March to 15 March. This should give the IT team enough time to complete testing of the new inventory system, which several of you rightly flagged as a risk. Second, there was a lively debate about whether to outsource weekend deliveries. While no final decision was reached, most participants seemed to feel that a three-month trial with a local courier would be a sensible compromise. Yossi has kindly agreed to prepare a cost comparison before our next meeting. Finally, I would like to acknowledge that the meeting ran over by almost forty minutes. In future, I will circulate the agenda earlier and allocate fixed time slots to each item, so that we can keep discussions focused. Action items are listed below. Please let me know by Thursday if I have missed anything.","he":"אל: צוות התפעול. מאת: נועה בן-דוד. הנדון: סיכום ישיבת התכנון של יום שני. תודה לכולכם על דיון פורה ביום שני. למי שלא הצליח להשתתף, הנה סיכום קצר של מה שסוכם. ראשית, אישרנו שהמעבר למחסן החדש יתבצע כמתוכנן, אם כי מועד ההתחלה הוזז מ-1 במרץ ל-15 במרץ. זה אמור לתת לצוות ה-IT מספיק זמן להשלים את הבדיקות של מערכת המלאי החדשה, שכמה מכם הצביעו עליה בצדק כעל סיכון. שנית, התקיים דיון ער בשאלה אם להעביר את משלוחי סוף השבוע למיקור חוץ. אף שלא התקבלה החלטה סופית, נראה שרוב המשתתפים סברו שניסיון של שלושה חודשים עם חברת שליחויות מקומית יהיה פשרה הגיונית. יוסי הסכים בטובו להכין השוואת עלויות לקראת הישיבה הבאה. לבסוף, אני רוצה להודות שהישיבה חרגה בכמעט ארבעים דקות. בעתיד אפיץ את סדר היום מוקדם יותר ואקצה פרקי זמן קבועים לכל נושא, כדי שנוכל לשמור על דיונים ממוקדים. משימות ההמשך מפורטות למטה. אנא עדכנו אותי עד יום חמישי אם פספסתי משהו.","ru":"Кому: отдел логистики. От: Ноа Бен-Давид. Тема: итоги планёрки в понедельник. Спасибо всем за продуктивное обсуждение в понедельник. Для тех, кто не смог присутствовать, вот краткое изложение достигнутых договорённостей. Во-первых, мы подтвердили, что переезд склада состоится по плану, хотя дата начала перенесена с 1 марта на 15 марта. Это должно дать IT-отделу достаточно времени, чтобы завершить тестирование новой системы учёта запасов, которую некоторые из вас справедливо назвали источником риска. Во-вторых, развернулась оживлённая дискуссия о том, стоит ли передать доставку по выходным на аутсорсинг. Хотя окончательного решения принято не было, большинство участников, судя по всему, считают разумным компромиссом трёхмесячный пробный период с местной курьерской службой. Йоси любезно согласился подготовить сравнение затрат к следующей встрече. И наконец, должна признать, что совещание затянулось почти на сорок минут. В будущем я буду рассылать повестку заранее и выделять на каждый пункт фиксированное время, чтобы обсуждение оставалось сфокусированным. Список задач приведён ниже. Пожалуйста, сообщите мне до четверга, если я что-то упустила.","ar":"إلى: فريق العمليات. من: نوعا بن دافيد. الموضوع: ملخص اجتماع التخطيط يوم الاثنين. شكرًا لكم جميعًا على النقاش المثمر يوم الاثنين. لمن لم يتمكن من الحضور، إليكم ملخصًا موجزًا لما تم الاتفاق عليه. أولًا، أكدنا أن نقل المستودع سيمضي كما هو مخطط له، رغم أن موعد البدء نُقل من 1 آذار إلى 15 آذار. ومن المفترض أن يمنح ذلك فريق تكنولوجيا المعلومات وقتًا كافيًا لإكمال اختبار نظام المخزون الجديد، الذي أشار إليه عدد منكم عن حق باعتباره مصدر خطر. ثانيًا، دار نقاش حيوي حول ما إذا كان ينبغي إسناد توصيلات نهاية الأسبوع إلى جهة خارجية. ورغم عدم التوصل إلى قرار نهائي، بدا أن معظم المشاركين يرون أن تجربة لمدة ثلاثة أشهر مع شركة توصيل محلية ستكون حلًا وسطًا معقولًا. وقد وافق يوسي مشكورًا على إعداد مقارنة للتكاليف قبل اجتماعنا القادم. أخيرًا، أود أن أعترف بأن الاجتماع تجاوز وقته بنحو أربعين دقيقة. في المستقبل، سأوزّع جدول الأعمال في وقت أبكر وسأخصص فترات زمنية ثابتة لكل بند، حتى نحافظ على تركيز النقاشات. المهام المطلوبة مدرجة أدناه. يُرجى إبلاغي قبل يوم الخميس إن فاتني أي شيء.","questions":[["Why did Noa write this memo?","To record decisions and inform people who missed the meeting","To cancel the warehouse migration","To announce a new courier contract","To criticise Yossi's cost comparison"],["What can be inferred about the weekend deliveries issue?","It is still open and needs more information","It was fully resolved during the meeting","Everyone strongly opposed outsourcing","A courier has already been hired"],["What does Noa's comment about the meeting's length suggest?","She takes responsibility and wants to improve future meetings","She blames participants for talking too much","She plans to stop holding meetings","She thinks long meetings are more productive"]]}},{"en":"professional emails","he":"כתיבת מיילים מקצועיים","ru":"Деловая переписка","ar":"كتابة رسائل البريد المهنية","e":"📧","items":[{"en":"I'm writing to follow up on my previous email regarding the revised contract.","he":"אני כותב/ת כדי לעקוב אחר המייל הקודם שלי בנוגע לחוזה המעודכן.","ru":"Пишу, чтобы напомнить о своём предыдущем письме по поводу пересмотренного договора.","ar":"أكتب لمتابعة رسالتي السابقة بخصوص العقد المعدَّل.","e":"","alt":[]},{"en":"Please find attached the updated proposal for your review and approval.","he":"מצורפת ההצעה המעודכנת לעיונך ולאישורך.","ru":"Во вложении — обновлённое предложение для вашего рассмотрения и утверждения.","ar":"تجدون مرفقًا المقترح المحدَّث لمراجعته والموافقة عليه.","e":"","alt":[]},{"en":"I'd appreciate it if you could get back to me by Thursday afternoon.","he":"אודה לך אם תוכל/י לחזור אליי עד יום חמישי אחר הצהריים.","ru":"Буду признателен/признательна, если вы ответите мне до четверга, второй половины дня.","ar":"سأكون ممتنًا لو أمكنك الرد عليّ قبل ظهر يوم الخميس.","e":"","alt":[]},{"en":"Apologies for the delayed response; I've only just returned from annual leave.","he":"סליחה על התגובה המאוחרת; רק עכשיו חזרתי מחופשה.","ru":"Прошу прощения за задержку с ответом: я только что вернулся/вернулась из отпуска.","ar":"أعتذر عن التأخر في الرد؛ فقد عدت للتو من إجازتي السنوية.","e":"","alt":[]},{"en":"Could you kindly clarify whether the price includes installation and ongoing support?","he":"תוכל/י בבקשה להבהיר אם המחיר כולל התקנה ותמיכה שוטפת?","ru":"Не могли бы вы уточнить, включает ли цена установку и постоянную поддержку?","ar":"هل يمكنك التوضيح مشكورًا ما إذا كان السعر يشمل التركيب والدعم المستمر؟","e":"","alt":[]},{"en":"Should you have any further questions, please don't hesitate to contact me.","he":"אם יש לך שאלות נוספות, אל תהסס/י לפנות אליי.","ru":"Если у вас возникнут дополнительные вопросы, пожалуйста, обращайтесь ко мне.","ar":"إن كانت لديك أي أسئلة أخرى، فلا تتردد في التواصل معي.","e":"","alt":[]}],"reading":{"en":"Subject: Invoice #4127 - second reminder. Dear Mr. Katz, I hope this message finds you well. I am writing to follow up on my email of 3 June regarding invoice #4127, which was due for payment on 31 May. According to our records, the balance of 18,400 shekels remains outstanding. I appreciate that oversights of this kind can happen, particularly at the end of a busy quarter, and it is entirely possible that payment is already being processed. If so, please disregard this message and accept my thanks. If, however, there is an issue with the invoice itself, such as an incorrect purchase order number or a query about the hours billed, I would be grateful if you could let me know so that we can resolve it promptly. I have attached a copy of the original invoice and the signed timesheet for your convenience. We greatly value our relationship with your company and would prefer to settle this matter informally. That said, I would appreciate a response by Friday 14 June, as our finance department will otherwise need to follow its standard collection procedure. Best regards, Michal Rosen, Accounts Manager","he":"נושא: חשבונית מס' 4127 – תזכורת שנייה. מר כץ היקר, אני מקווה שהודעה זו מוצאת אותך בטוב. אני כותבת כדי לעקוב אחר המייל שלי מ-3 ביוני בנוגע לחשבונית מס' 4127, שמועד התשלום שלה היה 31 במאי. לפי הרישומים שלנו, היתרה בסך 18,400 שקלים טרם שולמה. אני מבינה שהשמטות מסוג זה יכולות לקרות, במיוחד בסוף רבעון עמוס, וייתכן מאוד שהתשלום כבר נמצא בטיפול. אם כך, אנא התעלם מהודעה זו וקבל את תודתי. אם, לעומת זאת, יש בעיה בחשבונית עצמה, כמו מספר הזמנת רכש שגוי או שאלה לגבי השעות שחויבו, אודה לך אם תעדכן אותי כדי שנוכל לפתור זאת במהירות. לנוחותך צירפתי עותק של החשבונית המקורית ואת דוח השעות החתום. אנו מעריכים מאוד את הקשר שלנו עם החברה שלך ומעדיפים להסדיר עניין זה באופן לא פורמלי. עם זאת, אודה לתשובה עד יום שישי, 14 ביוני, שכן אחרת מחלקת הכספים שלנו תיאלץ לפעול לפי נוהל הגבייה הרגיל. בברכה, מיכל רוזן, מנהלת חשבונות","ru":"Тема: Счёт № 4127 — повторное напоминание. Уважаемый г-н Кац, надеюсь, у вас всё хорошо. Пишу в продолжение своего письма от 3 июня относительно счёта № 4127, срок оплаты которого истёк 31 мая. Согласно нашим данным, сумма в 18 400 шекелей до сих пор не погашена. Я понимаю, что подобные упущения случаются, особенно в конце напряжённого квартала, и вполне возможно, что платёж уже обрабатывается. Если это так, пожалуйста, не обращайте внимания на это письмо и примите мою благодарность. Если же возникла проблема с самим счётом — например, неверный номер заказа на закупку или вопрос по выставленным часам, — буду признательна, если вы сообщите мне об этом, чтобы мы могли быстро всё уладить. Для вашего удобства прилагаю копию исходного счёта и подписанный табель учёта времени. Мы очень ценим сотрудничество с вашей компанией и предпочли бы решить этот вопрос в неформальном порядке. Тем не менее я была бы благодарна за ответ до пятницы, 14 июня, поскольку в противном случае наш финансовый отдел будет вынужден применить стандартную процедуру взыскания. С наилучшими пожеланиями, Михаль Розен, менеджер по работе со счетами","ar":"الموضوع: الفاتورة رقم 4127 – تذكير ثانٍ. السيد كاتس المحترم، آمل أن تصلك رسالتي وأنت بخير. أكتب لمتابعة رسالتي المؤرخة في 3 حزيران بخصوص الفاتورة رقم 4127، التي كان موعد استحقاقها 31 أيار. وفقًا لسجلاتنا، لا يزال المبلغ البالغ 18,400 شيكل غير مسدَّد. أتفهّم أن مثل هذا السهو قد يحدث، خاصة في نهاية ربع سنة مزدحم، ومن الممكن تمامًا أن تكون الدفعة قيد المعالجة بالفعل. إن كان الأمر كذلك، فيُرجى تجاهل هذه الرسالة وتقبّل شكري. أما إذا كانت هناك مشكلة في الفاتورة نفسها، مثل رقم طلب شراء غير صحيح أو استفسار حول الساعات المحتسبة، فسأكون ممتنة لو أبلغتني بذلك حتى نتمكن من حلها بسرعة. وقد أرفقت لراحتك نسخة من الفاتورة الأصلية وكشف ساعات العمل الموقَّع. نحن نقدّر كثيرًا علاقتنا بشركتكم ونفضّل تسوية هذه المسألة بشكل ودّي. ومع ذلك، سأكون ممتنة لردّكم قبل يوم الجمعة 14 حزيران، إذ سيتعيّن على قسم المالية لدينا خلاف ذلك اتباع إجراءات التحصيل المعتادة. مع أطيب التحيات، ميخال روزن، مديرة الحسابات","questions":[["What is the main purpose of this email?","To remind a client about an unpaid invoice","To send a new invoice for extra work","To end the business relationship","To apologise for a billing mistake"],["What does the final paragraph imply?","Formal action may follow if there is no reply by Friday","The company has decided to cancel the debt","Michal has already contacted a lawyer","Payment is no longer required"],["Which best describes the tone of the email?","Courteous but firm","Angry and threatening","Overly casual and friendly","Uncertain and apologetic"]]}},{"en":"remote work","he":"שיחות וידאו ועבודה מרחוק","ru":"Видеозвонки и удалённая работа","ar":"مكالمات الفيديو والعمل عن بُعد","e":"💻","items":[{"en":"Sorry, you cut out for a moment; could you repeat the last point?","he":"סליחה, הקול שלך נקטע לרגע; תוכל/י לחזור על הנקודה האחרונה?","ru":"Извините, вас на секунду не было слышно; не могли бы вы повторить последний пункт?","ar":"عذرًا، انقطع صوتك للحظة؛ هل يمكنك تكرار النقطة الأخيرة؟","e":"","alt":[]},{"en":"I think you're on mute; we can see you but can't hear you.","he":"אני חושב/ת שהמיקרופון שלך מושתק; אנחנו רואים אותך אבל לא שומעים.","ru":"Кажется, у вас выключен микрофон: мы вас видим, но не слышим.","ar":"أظن أن الميكروفون لديك مكتوم؛ نستطيع رؤيتك لكن لا نسمعك.","e":"","alt":[]},{"en":"Let me share my screen so everyone can see the latest figures.","he":"תנו לי לשתף מסך כדי שכולם יוכלו לראות את הנתונים העדכניים.","ru":"Давайте я покажу свой экран, чтобы все видели последние цифры.","ar":"دعوني أشارك شاشتي ليتمكن الجميع من رؤية أحدث الأرقام.","e":"","alt":[]},{"en":"My connection seems unstable, so I'll switch off my camera for now.","he":"החיבור שלי נראה לא יציב, אז אכבה את המצלמה בינתיים.","ru":"Похоже, у меня нестабильное соединение, поэтому я пока выключу камеру.","ar":"يبدو أن اتصالي غير مستقر، لذا سأطفئ الكاميرا في الوقت الحالي.","e":"","alt":[]},{"en":"Since we're in different time zones, let's agree on core overlap hours.","he":"מכיוון שאנחנו באזורי זמן שונים, בואו נסכים על שעות חפיפה קבועות.","ru":"Поскольку мы в разных часовых поясах, давайте договоримся об общих рабочих часах.","ar":"بما أننا في مناطق زمنية مختلفة، لنتفق على ساعات عمل مشتركة أساسية.","e":"","alt":[]},{"en":"I'll drop the link in the chat so you can review the document later.","he":"אשים את הקישור בצ'אט כדי שתוכלו לעבור על המסמך אחר כך.","ru":"Я брошу ссылку в чат, чтобы вы могли посмотреть документ позже.","ar":"سأضع الرابط في الدردشة لتتمكنوا من مراجعة المستند لاحقًا.","e":"","alt":[]}],"reading":{"en":"To: All staff. From: Human Resources. Subject: Updated hybrid work guidelines. Following the feedback survey conducted last month, we are introducing several changes to our hybrid work arrangements, effective 1 September. Most respondents told us that flexibility has improved their work-life balance, and we have no intention of reversing that. However, many also reported feeling disconnected from colleagues, and managers noted that collaboration on complex projects has become slower. With this in mind, all teams will now be expected to work from the office on two fixed days per week, to be agreed within each department. We are also asking everyone to observe a few simple practices during video calls. Cameras should be switched on for internal meetings where possible, and meetings should start five minutes after the hour to allow short breaks between calls. Messages sent outside working hours do not require an immediate reply. We recognise that these adjustments may be inconvenient for some, particularly employees with long commutes or caring responsibilities. If the new arrangement poses a genuine difficulty, please speak to your manager, as individual exceptions will be considered on a case-by-case basis.","he":"אל: כל העובדים. מאת: משאבי אנוש. נושא: הנחיות מעודכנות לעבודה היברידית. בעקבות סקר המשוב שנערך בחודש שעבר, אנו מכניסים מספר שינויים בהסדרי העבודה ההיברידית, החל מ-1 בספטמבר. רוב המשיבים סיפרו לנו שהגמישות שיפרה את האיזון בין העבודה לחיים הפרטיים, ואין לנו כל כוונה לבטל זאת. עם זאת, רבים דיווחו גם על תחושת ניתוק מהעמיתים, ומנהלים ציינו שהשיתוף פעולה בפרויקטים מורכבים נעשה איטי יותר. לאור זאת, מעתה כל הצוותים יידרשו לעבוד מהמשרד ביומיים קבועים בשבוע, שייקבעו בתוך כל מחלקה. אנו מבקשים גם מכולם להקפיד על כמה כללים פשוטים בשיחות וידאו. יש להפעיל מצלמות בישיבות פנימיות ככל האפשר, וישיבות יתחילו חמש דקות אחרי השעה העגולה כדי לאפשר הפסקות קצרות בין שיחות. הודעות שנשלחות מחוץ לשעות העבודה אינן מחייבות מענה מיידי. אנו מכירים בכך שהתאמות אלה עלולות להיות לא נוחות לחלק מהעובדים, במיוחד למי שנוסעים זמן רב לעבודה או מטפלים בבני משפחה. אם ההסדר החדש יוצר קושי אמיתי, אנא פנו למנהל/ת שלכם, שכן חריגים אישיים ייבחנו לגופו של כל מקרה.","ru":"Кому: всем сотрудникам. От: отдела кадров. Тема: обновлённые правила гибридной работы. По итогам опроса, проведённого в прошлом месяце, мы вносим ряд изменений в порядок гибридной работы, которые вступают в силу с 1 сентября. Большинство респондентов сообщили, что гибкий график улучшил баланс между работой и личной жизнью, и мы не собираемся от этого отказываться. Однако многие также признались, что чувствуют оторванность от коллег, а руководители отметили, что совместная работа над сложными проектами замедлилась. С учётом этого все команды теперь должны будут работать в офисе два фиксированных дня в неделю, которые определяются внутри каждого отдела. Мы также просим всех соблюдать несколько простых правил во время видеозвонков. По возможности на внутренних совещаниях следует включать камеру, а встречи должны начинаться через пять минут после начала часа, чтобы между звонками были короткие перерывы. На сообщения, отправленные в нерабочее время, не нужно отвечать немедленно. Мы понимаем, что эти изменения могут создать неудобства для некоторых, особенно для сотрудников, которым долго добираться до работы или которые ухаживают за родственниками. Если новый порядок создаёт для вас серьёзные трудности, пожалуйста, обратитесь к своему руководителю: индивидуальные исключения будут рассматриваться в каждом случае отдельно.","ar":"إلى: جميع الموظفين. من: الموارد البشرية. الموضوع: إرشادات محدَّثة للعمل الهجين. في أعقاب استطلاع الآراء الذي أُجري الشهر الماضي، نُدخل عدة تغييرات على ترتيبات العمل الهجين، اعتبارًا من 1 أيلول. أخبرنا معظم المشاركين أن المرونة حسّنت التوازن بين حياتهم المهنية والشخصية، وليست لدينا أي نية للتراجع عن ذلك. لكن كثيرين أفادوا أيضًا بأنهم يشعرون بالانفصال عن زملائهم، ولاحظ المديرون أن التعاون في المشاريع المعقدة أصبح أبطأ. ولهذا، سيُطلب من جميع الفرق الآن العمل من المكتب يومين ثابتين في الأسبوع، يُتفق عليهما داخل كل قسم. كما نطلب من الجميع الالتزام ببعض الممارسات البسيطة خلال مكالمات الفيديو. ينبغي تشغيل الكاميرات في الاجتماعات الداخلية قدر الإمكان، وأن تبدأ الاجتماعات بعد خمس دقائق من بداية الساعة لإتاحة استراحات قصيرة بين المكالمات. ولا تتطلب الرسائل المرسلة خارج ساعات العمل ردًا فوريًا. ندرك أن هذه التعديلات قد تكون غير مريحة للبعض، وخاصة الموظفين الذين يقطعون مسافات طويلة إلى العمل أو يتولّون رعاية أفراد من أسرهم. إذا كان الترتيب الجديد يسبب صعوبة حقيقية، فيُرجى التحدث إلى مديرك، إذ سيُنظر في الاستثناءات الفردية لكل حالة على حدة.","questions":[["What is the main purpose of the memo?","To explain changes to hybrid work rules and the reasons for them","To end remote work for all employees","To announce the results of a salary survey","To introduce new video-call software"],["Why will meetings start five minutes after the hour?","To give employees short breaks between back-to-back calls","Because many employees regularly arrive late","To save money on software licences","Because managers requested longer meetings"],["What is the tone of the final paragraph?","Understanding and open to individual needs","Strict and unwilling to compromise","Humorous and informal","Indifferent to employees' concerns"]]}},{"en":"scheduling and deadlines","he":"תזמון ולוחות זמנים","ru":"Планирование и сроки","ar":"المواعيد والجداول الزمنية","e":"⏰","items":[{"en":"Would it be possible to push our meeting back to Wednesday morning?","he":"האם אפשר לדחות את הפגישה שלנו ליום רביעי בבוקר?","ru":"Можно ли перенести нашу встречу на утро среды?","ar":"هل من الممكن تأجيل اجتماعنا إلى صباح الأربعاء؟","e":"","alt":[]},{"en":"Realistically, we'll need at least two more weeks to finish the testing phase.","he":"באופן מציאותי, נצטרך לפחות עוד שבועיים כדי לסיים את שלב הבדיקות.","ru":"Если быть реалистами, нам понадобится ещё как минимум две недели, чтобы завершить этап тестирования.","ar":"بواقعية، سنحتاج إلى أسبوعين إضافيين على الأقل لإنهاء مرحلة الاختبار.","e":"","alt":[]},{"en":"I'm fully booked on Tuesday, but I could squeeze in a short call Thursday.","he":"ביום שלישי אני עמוס/ה לגמרי, אבל אוכל לדחוס שיחה קצרה ביום חמישי.","ru":"Во вторник у меня всё расписано, но в четверг я мог/могла бы выкроить время для короткого звонка.","ar":"جدولي ممتلئ تمامًا يوم الثلاثاء، لكن يمكنني ترتيب مكالمة قصيرة يوم الخميس.","e":"","alt":[]},{"en":"Given the tight deadline, we may need to prioritise the most critical features.","he":"בהתחשב בלוח הזמנים הצפוף, ייתכן שנצטרך לתעדף את הפיצ'רים הקריטיים ביותר.","ru":"Учитывая сжатые сроки, нам, возможно, придётся сосредоточиться на самых важных функциях.","ar":"نظرًا لضيق الموعد النهائي، قد نحتاج إلى إعطاء الأولوية للميزات الأكثر أهمية.","e":"","alt":[]},{"en":"Let's set a firm deadline and schedule a check-in halfway through the project.","he":"בואו נקבע מועד יעד סופי ונתזמן פגישת מעקב באמצע הפרויקט.","ru":"Давайте установим чёткий срок и назначим промежуточную проверку в середине проекта.","ar":"لنحدد موعدًا نهائيًا ثابتًا ونجدول اجتماع متابعة في منتصف المشروع.","e":"","alt":[]},{"en":"If we fall behind schedule, I'll let you know as early as possible.","he":"אם נפגר אחרי לוח הזמנים, אודיע לך מוקדם ככל האפשר.","ru":"Если мы начнём отставать от графика, я сообщу вам как можно раньше.","ar":"إذا تأخرنا عن الجدول الزمني، فسأُعلمك في أقرب وقت ممكن.","e":"","alt":[]}],"reading":{"en":"Subject: Revised timeline for the mobile app launch. Hi Tamar, I wanted to give you an early heads-up about the timeline for the mobile app. As things stand, we are unlikely to meet the 30 April launch date without compromising on quality. The main issue is the payment integration. The third-party provider changed its security requirements last week, which means that part of the code we had already completed now needs to be rewritten. Our developers estimate this will add roughly ten working days. I have considered two options. We could launch on time with the payment feature disabled and add it in an update a few weeks later, or we could postpone the full launch until mid-May. My recommendation would be the second option, since early reviews tend to shape how an app is perceived, and a launch without payments might frustrate our first users. I fully understand that the marketing campaign has already been planned around the original date, so I would suggest we meet with the marketing team this week to discuss the implications. Would Thursday at 10:00 work for you? Best, Eitan","he":"נושא: לוח זמנים מעודכן להשקת האפליקציה. היי תמר, רציתי לעדכן אותך מראש לגבי לוח הזמנים של האפליקציה. כפי שהדברים נראים כרגע, לא סביר שנעמוד במועד ההשקה של 30 באפריל בלי להתפשר על האיכות. הבעיה העיקרית היא חיבור מערכת התשלומים. הספק החיצוני שינה בשבוע שעבר את דרישות האבטחה שלו, ולכן חלק מהקוד שכבר השלמנו צריך כעת להיכתב מחדש. המפתחים שלנו מעריכים שזה יוסיף בערך עשרה ימי עבודה. שקלתי שתי אפשרויות. נוכל להשיק בזמן כשאפשרות התשלום מושבתת ולהוסיף אותה בעדכון כמה שבועות לאחר מכן, או לדחות את ההשקה המלאה לאמצע מאי. ההמלצה שלי היא האפשרות השנייה, כי הביקורות הראשונות נוטות לעצב את האופן שבו אפליקציה נתפסת, והשקה בלי תשלומים עלולה לתסכל את המשתמשים הראשונים שלנו. אני מבין היטב שקמפיין השיווק כבר תוכנן סביב המועד המקורי, ולכן אני מציע שניפגש השבוע עם צוות השיווק כדי לדון בהשלכות. יום חמישי בשעה 10:00 מתאים לך? בברכה, איתן","ru":"Тема: Новые сроки запуска мобильного приложения. Привет, Тамар! Хотел заранее предупредить тебя о сроках по мобильному приложению. Судя по текущей ситуации, мы вряд ли уложимся в дату запуска 30 апреля, не пожертвовав качеством. Главная проблема — интеграция платёжной системы. На прошлой неделе сторонний поставщик изменил требования безопасности, а значит, часть уже готового кода придётся переписать. По оценке наших разработчиков, это добавит примерно десять рабочих дней. Я рассмотрел два варианта. Мы можем запуститься вовремя с отключённой функцией оплаты и добавить её в обновлении через несколько недель, или же перенести полноценный запуск на середину мая. Я бы рекомендовал второй вариант, поскольку первые отзывы обычно формируют восприятие приложения, а запуск без оплаты может разочаровать наших первых пользователей. Я прекрасно понимаю, что маркетинговая кампания уже спланирована под исходную дату, поэтому предлагаю на этой неделе встретиться с отделом маркетинга и обсудить последствия. Тебе удобно в четверг в 10:00? Всего доброго, Эйтан","ar":"الموضوع: جدول زمني معدَّل لإطلاق تطبيق الهاتف. مرحبًا تمار، أردت أن أنبّهك مبكرًا بشأن الجدول الزمني لتطبيق الهاتف. بحسب الوضع الحالي، من غير المرجح أن نلتزم بموعد الإطلاق في 30 نيسان دون المساومة على الجودة. المشكلة الرئيسية هي ربط نظام الدفع. فقد غيّر المزوّد الخارجي متطلبات الأمان لديه الأسبوع الماضي، مما يعني أن جزءًا من الشيفرة التي أنجزناها بالفعل يحتاج الآن إلى إعادة كتابة. ويقدّر المطوّرون لدينا أن ذلك سيضيف نحو عشرة أيام عمل. لقد درست خيارين. يمكننا الإطلاق في الموعد مع تعطيل خاصية الدفع وإضافتها في تحديث بعد بضعة أسابيع، أو يمكننا تأجيل الإطلاق الكامل إلى منتصف أيار. توصيتي هي الخيار الثاني، لأن المراجعات الأولى غالبًا ما تحدد كيف يُنظر إلى التطبيق، والإطلاق دون إمكانية الدفع قد يُحبط مستخدمينا الأوائل. أتفهّم تمامًا أن الحملة التسويقية خُطط لها على أساس الموعد الأصلي، لذا أقترح أن نلتقي بفريق التسويق هذا الأسبوع لمناقشة التبعات. هل يناسبك يوم الخميس الساعة 10:00؟ مع التحية، إيتان","questions":[["Why is Eitan writing to Tamar?","To warn her about a likely delay and recommend a solution","To announce that the app has already launched","To ask her to rewrite the payment code","To cancel the marketing campaign"],["Why does Eitan prefer postponing the full launch?","He worries that a weak first impression could hurt the app","He wants extra time to go on holiday","The marketing team asked him for a delay","The payment provider requires a May launch"],["How would you describe Eitan's tone?","Transparent and solution-focused","Defensive and blaming others","Panicked and emotional","Vague and evasive"]]}},{"en":"sales and client relations","he":"מכירות וקשרי לקוחות","ru":"Продажи и работа с клиентами","ar":"المبيعات والعلاقات مع العملاء","e":"📈","items":[{"en":"What are the main challenges your team is facing with your current supplier?","he":"מהם האתגרים העיקריים שהצוות שלך מתמודד איתם מול הספק הנוכחי?","ru":"С какими основными трудностями ваша команда сталкивается при работе с нынешним поставщиком?","ar":"ما أبرز التحديات التي يواجهها فريقك مع المورّد الحالي؟","e":"","alt":[]},{"en":"I completely understand your concern about the budget, so let me explain the options.","he":"אני מבין/ה לגמרי את החשש שלך לגבי התקציב, אז תן/תני לי להסביר את האפשרויות.","ru":"Я прекрасно понимаю ваши опасения по поводу бюджета, поэтому позвольте объяснить возможные варианты.","ar":"أتفهّم تمامًا قلقك بشأن الميزانية، لذا دعني أشرح لك الخيارات المتاحة.","e":"","alt":[]},{"en":"Our solution typically pays for itself within the first six months of use.","he":"הפתרון שלנו בדרך כלל מחזיר את ההשקעה בתוך ששת החודשים הראשונים לשימוש.","ru":"Обычно наше решение окупается в течение первых шести месяцев использования.","ar":"عادةً ما يسترد حلّنا تكلفته خلال الأشهر الستة الأولى من الاستخدام.","e":"","alt":[]},{"en":"Would you be interested in a free trial before making a final decision?","he":"האם תהיה/תהיי מעוניין/ת בתקופת ניסיון חינם לפני שתקבל/י החלטה סופית?","ru":"Хотели бы вы воспользоваться бесплатным пробным периодом, прежде чем принять окончательное решение?","ar":"هل تهتم بتجربة مجانية قبل اتخاذ القرار النهائي؟","e":"","alt":[]},{"en":"I'd like to check in and see how you're getting on with the new system.","he":"רציתי לבדוק איך את/ה מסתדר/ת עם המערכת החדשה.","ru":"Я хотел/хотела бы узнать, как у вас идут дела с новой системой.","ar":"أردت أن أطمئن وأعرف كيف تسير الأمور معك في النظام الجديد.","e":"","alt":[]},{"en":"We can offer a ten percent discount if you commit to an annual contract.","he":"נוכל להציע הנחה של עשרה אחוזים אם תתחייב/י לחוזה שנתי.","ru":"Мы можем предложить скидку в десять процентов, если вы заключите годовой контракт.","ar":"يمكننا تقديم خصم بنسبة عشرة بالمئة إذا التزمت بعقد سنوي.","e":"","alt":[]}],"reading":{"en":"Case study: Winning back a key account. When Galil Foods, one of our largest clients, informed us that it was considering switching to a cheaper packaging supplier, the account team faced a difficult choice. Matching the competitor's price would have wiped out most of our margin on the contract. Instead of entering a price war, account manager Rina Haddad requested a meeting to understand what lay behind the decision. It quickly emerged that price was only part of the story. Galil's procurement team had been frustrated by late deliveries over the previous six months and felt that their complaints had not been taken seriously. Rina returned with a proposal that addressed these concerns directly: a dedicated delivery coordinator, a weekly status report, and a penalty clause that would reduce our fee for every late shipment. The price itself was reduced by only three percent. Galil renewed the contract for two years. Six months later, on-time delivery had risen to ninety-eight percent, and the client had expanded its order to include two new product lines. The lesson is clear: before offering a discount, find out what the customer actually values.","he":"מקרה בוחן: החזרת לקוח מפתח. כאשר \"גליל מזון\", אחד הלקוחות הגדולים ביותר שלנו, הודיע לנו שהוא שוקל לעבור לספק אריזות זול יותר, צוות תיק הלקוח עמד בפני בחירה קשה. השוואת המחיר למחיר של המתחרה הייתה מוחקת את רוב הרווח שלנו מהחוזה. במקום להיכנס למלחמת מחירים, מנהלת התיק רינה חדאד ביקשה פגישה כדי להבין מה עומד מאחורי ההחלטה. מהר מאוד התברר שהמחיר היה רק חלק מהסיפור. צוות הרכש של \"גליל\" היה מתוסכל מאיחורים במשלוחים במהלך ששת החודשים הקודמים, והרגיש שתלונותיו לא נלקחו ברצינות. רינה חזרה עם הצעה שנתנה מענה ישיר לחששות האלה: רכז משלוחים ייעודי, דוח סטטוס שבועי, וסעיף קנס שיפחית את התשלום שלנו על כל משלוח שמאחר. המחיר עצמו הופחת בשלושה אחוזים בלבד. \"גליל\" חידשה את החוזה לשנתיים. כעבור חצי שנה, שיעור המשלוחים שהגיעו בזמן עלה לתשעים ושמונה אחוזים, והלקוח הרחיב את ההזמנה שלו כך שתכלול שני קווי מוצרים חדשים. הלקח ברור: לפני שמציעים הנחה, כדאי לברר מה הלקוח באמת מעריך.","ru":"Кейс: как вернуть ключевого клиента. Когда «Галиль Фудс», один из наших крупнейших клиентов, сообщил, что рассматривает переход к более дешёвому поставщику упаковки, команда по работе с клиентом оказалась перед непростым выбором. Если бы мы снизили цену до уровня конкурента, это уничтожило бы бóльшую часть нашей прибыли по контракту. Вместо того чтобы ввязываться в ценовую войну, менеджер по работе с клиентом Рина Хаддад попросила о встрече, чтобы понять, что стоит за этим решением. Быстро выяснилось, что цена — лишь часть истории. Отдел закупок «Галиля» был недоволен задержками поставок в течение предыдущих шести месяцев и считал, что их жалобы не воспринимались всерьёз. Рина вернулась с предложением, которое напрямую учитывало эти претензии: отдельный координатор поставок, еженедельный отчёт о статусе и штрафная оговорка, снижающая наше вознаграждение за каждую задержанную поставку. Саму цену снизили всего на три процента. «Галиль» продлил контракт на два года. Через полгода доля своевременных поставок выросла до девяноста восьми процентов, а клиент расширил заказ, добавив две новые товарные линейки. Вывод очевиден: прежде чем предлагать скидку, выясните, что на самом деле ценит клиент.","ar":"دراسة حالة: استعادة عميل رئيسي. عندما أبلغتنا شركة \"الجليل للأغذية\"، وهي من أكبر عملائنا، بأنها تفكر في الانتقال إلى مورّد تغليف أرخص، واجه فريق إدارة الحساب خيارًا صعبًا. فمجاراة سعر المنافس كانت ستقضي على معظم هامش ربحنا من العقد. وبدلًا من الدخول في حرب أسعار، طلبت مديرة الحساب رينا حداد عقد اجتماع لفهم ما يقف وراء القرار. وسرعان ما تبيّن أن السعر لم يكن سوى جزء من القصة. فقد كان فريق المشتريات في \"الجليل\" مستاءً من تأخر الشحنات خلال الأشهر الستة السابقة، وشعر بأن شكاواه لم تؤخذ على محمل الجد. عادت رينا بعرض يعالج هذه المخاوف مباشرة: منسّق توصيل مخصص، وتقرير أسبوعي عن الوضع، وبند جزائي يخفّض أتعابنا عن كل شحنة متأخرة. أما السعر نفسه فلم يُخفَّض إلا بنسبة ثلاثة بالمئة. جدّدت \"الجليل\" العقد لمدة عامين. وبعد ستة أشهر، ارتفعت نسبة التسليم في الموعد إلى ثمانية وتسعين بالمئة، ووسّع العميل طلبيته لتشمل خطّي إنتاج جديدين. الدرس واضح: قبل أن تعرض خصمًا، اكتشف ما يقدّره العميل فعلًا.","questions":[["What is the main purpose of this case study?","To show that understanding client needs can matter more than price","To advertise a new packaging product","To criticise Galil Foods' procurement team","To explain how to win a price war"],["What can be inferred about the penalty clause?","It signalled the company's confidence that deliveries would improve","It was originally demanded by the competitor","It made the contract completely unprofitable","It was removed after six months"],["What is the tone of the final sentence?","Instructive and confident","Doubtful and hesitant","Sarcastic and critical","Apologetic and regretful"]]}},{"en":"presentations and results","he":"מצגות והצגת תוצאות","ru":"Презентации и отчёт о результатах","ar":"العروض التقديمية وعرض النتائج","e":"📊","items":[{"en":"I'd like to begin by giving you a brief overview of our quarterly performance.","he":"אני רוצה לפתוח בסקירה קצרה של הביצועים שלנו ברבעון.","ru":"Я хотел/хотела бы начать с краткого обзора наших квартальных результатов.","ar":"أود أن أبدأ بإعطائكم لمحة موجزة عن أدائنا الفصلي.","e":"","alt":[]},{"en":"As you can see from this chart, sales rose sharply in the second quarter.","he":"כפי שאפשר לראות בתרשים הזה, המכירות זינקו ברבעון השני.","ru":"Как видно на этом графике, во втором квартале продажи резко выросли.","ar":"كما ترون في هذا الرسم البياني، ارتفعت المبيعات بشكل حاد في الربع الثاني.","e":"","alt":[]},{"en":"This figure is slightly misleading, so let me put it into context.","he":"הנתון הזה מעט מטעה, אז תנו לי להציג אותו בהקשר הנכון.","ru":"Эта цифра немного вводит в заблуждение, поэтому позвольте объяснить её в контексте.","ar":"هذا الرقم مضلّل بعض الشيء، لذا دعوني أضعه في سياقه.","e":"","alt":[]},{"en":"Although revenue fell short of target, our profit margins actually improved considerably.","he":"אף שההכנסות לא הגיעו ליעד, שולי הרווח שלנו דווקא השתפרו משמעותית.","ru":"Хотя выручка не достигла целевого уровня, наша норма прибыли на самом деле заметно выросла.","ar":"رغم أن الإيرادات لم تبلغ الهدف، فإن هوامش أرباحنا تحسّنت في الواقع بشكل ملحوظ.","e":"","alt":[]},{"en":"That's a great question, and I'll come back to it at the end.","he":"זו שאלה מצוינת, ואחזור אליה בסוף.","ru":"Отличный вопрос, я вернусь к нему в конце.","ar":"هذا سؤال ممتاز، وسأعود إليه في النهاية.","e":"","alt":[]},{"en":"To wrap up, I'd like to highlight three key takeaways from today's results.","he":"לסיום, אני רוצה להדגיש שלוש מסקנות מרכזיות מהתוצאות של היום.","ru":"В завершение я хотел/хотела бы выделить три главных вывода из сегодняшних результатов.","ar":"في الختام، أود أن أسلّط الضوء على ثلاث نقاط رئيسية من نتائج اليوم.","e":"","alt":[]}],"reading":{"en":"Q3 Results Summary - Online Retail Division. Overall, the third quarter delivered mixed results. Total revenue reached 12.6 million shekels, which represents a seven percent increase on the same period last year but falls slightly short of our target of 13 million. The shortfall can largely be attributed to the home electronics category, where sales declined by fifteen percent following the entry of two aggressive international competitors. By contrast, our sports and outdoor category performed exceptionally well, growing by twenty-two percent, driven mainly by a successful social media campaign. Encouragingly, customer retention improved significantly. The proportion of customers making a repeat purchase within ninety days rose from 31 to 38 percent, which suggests that the loyalty programme introduced in June is beginning to pay off. Looking ahead, we propose to reduce our investment in home electronics advertising and redirect part of that budget towards the categories showing the strongest growth. We also recommend a detailed review of our electronics pricing before the holiday season. While the quarter was not without its challenges, we believe the underlying trends give us good reason for cautious optimism.","he":"סיכום תוצאות רבעון 3 – חטיבת הקמעונאות המקוונת. באופן כללי, הרבעון השלישי הניב תוצאות מעורבות. סך ההכנסות הגיע ל-12.6 מיליון שקלים, עלייה של שבעה אחוזים לעומת התקופה המקבילה אשתקד, אך מעט מתחת ליעד שלנו של 13 מיליון. את הפער אפשר לייחס בעיקר לקטגוריית מוצרי החשמל לבית, שבה המכירות ירדו בחמישה עשר אחוזים בעקבות כניסתם של שני מתחרים בינלאומיים אגרסיביים. לעומת זאת, קטגוריית הספורט והפעילות בחוץ הציגה ביצועים יוצאי דופן, עם צמיחה של עשרים ושניים אחוזים, בעיקר בזכות קמפיין מוצלח ברשתות החברתיות. נתון מעודד הוא ששימור הלקוחות השתפר משמעותית. שיעור הלקוחות שביצעו רכישה חוזרת בתוך תשעים יום עלה מ-31 ל-38 אחוזים, מה שמרמז שתוכנית הנאמנות שהושקה ביוני מתחילה להשתלם. במבט קדימה, אנו מציעים לצמצם את ההשקעה בפרסום מוצרי חשמל לבית ולהפנות חלק מהתקציב לקטגוריות שמראות את הצמיחה החזקה ביותר. אנו ממליצים גם על בחינה מעמיקה של תמחור מוצרי החשמל לפני עונת החגים. אף שהרבעון לא היה נקי מאתגרים, אנו סבורים שהמגמות הבסיסיות מעניקות לנו סיבה טובה לאופטימיות זהירה.","ru":"Итоги третьего квартала — подразделение онлайн-торговли. В целом третий квартал принёс неоднозначные результаты. Общая выручка достигла 12,6 миллиона шекелей, что на семь процентов больше, чем за тот же период прошлого года, но немного ниже нашей цели в 13 миллионов. Недобор в основном объясняется категорией бытовой электроники, где продажи упали на пятнадцать процентов после выхода на рынок двух агрессивных международных конкурентов. В то же время категория товаров для спорта и активного отдыха показала исключительные результаты, выросла на двадцать два процента, в основном благодаря успешной кампании в социальных сетях. Обнадёживает то, что удержание клиентов значительно улучшилось. Доля клиентов, совершивших повторную покупку в течение девяноста дней, выросла с 31 до 38 процентов, что говорит о том, что программа лояльности, запущенная в июне, начинает приносить плоды. В дальнейшем мы предлагаем сократить вложения в рекламу бытовой электроники и перенаправить часть этого бюджета на категории с наибольшим ростом. Мы также рекомендуем тщательно пересмотреть цены на электронику перед праздничным сезоном. Хотя квартал не обошёлся без трудностей, мы считаем, что основные тенденции дают нам веские основания для осторожного оптимизма.","ar":"ملخص نتائج الربع الثالث – قسم البيع بالتجزئة عبر الإنترنت. بشكل عام، حقق الربع الثالث نتائج متباينة. فقد بلغ إجمالي الإيرادات 12.6 مليون شيكل، أي بزيادة سبعة بالمئة مقارنة بالفترة نفسها من العام الماضي، لكنه جاء أقل قليلًا من هدفنا البالغ 13 مليونًا. ويُعزى هذا العجز بدرجة كبيرة إلى فئة الأجهزة الكهربائية المنزلية، حيث تراجعت المبيعات بنسبة خمسة عشر بالمئة بعد دخول منافسَين دوليَّين شرسَين. في المقابل، حققت فئة الرياضة والأنشطة الخارجية أداءً استثنائيًا، إذ نمت بنسبة اثنين وعشرين بالمئة، مدفوعة أساسًا بحملة ناجحة على وسائل التواصل الاجتماعي. ومن المشجّع أن الاحتفاظ بالعملاء تحسّن بشكل ملحوظ. فقد ارتفعت نسبة العملاء الذين أجروا عملية شراء متكررة خلال تسعين يومًا من 31 إلى 38 بالمئة، مما يشير إلى أن برنامج الولاء الذي أُطلق في حزيران بدأ يؤتي ثماره. وبالنظر إلى المستقبل، نقترح خفض استثمارنا في إعلانات الأجهزة الكهربائية المنزلية وتوجيه جزء من تلك الميزانية نحو الفئات التي تُظهر أقوى نمو. كما نوصي بمراجعة مفصّلة لأسعار الأجهزة الكهربائية قبل موسم الأعياد. ورغم أن هذا الربع لم يخلُ من التحديات، فإننا نعتقد أن الاتجاهات الأساسية تمنحنا سببًا وجيهًا للتفاؤل الحذر.","questions":[["What is the main purpose of this summary?","To report results, explain them and propose next steps","To announce the closure of the electronics category","To launch a new loyalty programme","To ask investors for additional funding"],["What does the rise in repeat purchases suggest?","The loyalty programme seems to be having a positive effect","Electronics prices were set too low","International competitors have left the market","Total revenue exceeded the quarterly target"],["How would you describe the tone of the final sentence?","Balanced and cautiously positive","Extremely enthusiastic and excited","Pessimistic and worried","Angry about the competition"]]}},{"en":"handling complaints","he":"שירות לקוחות וטיפול בתלונות","ru":"Обслуживание клиентов и жалобы","ar":"خدمة العملاء ومعالجة الشكاوى","e":"🎧","items":[{"en":"I'm very sorry for the inconvenience, and I'll look into this right away.","he":"אני מצטער/ת מאוד על אי הנוחות, ואבדוק את העניין מיד.","ru":"Приношу извинения за неудобства, я немедленно займусь этим вопросом.","ar":"أعتذر بشدة عن الإزعاج، وسأتحقق من الأمر فورًا.","e":"","alt":[]},{"en":"I can see why you'd be frustrated, and I really appreciate your patience.","he":"אני מבין/ה למה זה מתסכל אותך, ואני מאוד מעריך/ה את הסבלנות שלך.","ru":"Я понимаю ваше недовольство и очень ценю ваше терпение.","ar":"أتفهّم سبب استيائك، وأقدّر صبرك كثيرًا.","e":"","alt":[]},{"en":"Could you give me your order number so I can check the details?","he":"תוכל/י לתת לי את מספר ההזמנה כדי שאוכל לבדוק את הפרטים?","ru":"Не могли бы вы назвать номер заказа, чтобы я проверил/проверила детали?","ar":"هل يمكنك إعطائي رقم الطلب حتى أتحقق من التفاصيل؟","e":"","alt":[]},{"en":"As a goodwill gesture, we'd like to offer you a full refund.","he":"כמחווה של רצון טוב, נשמח להציע לך החזר כספי מלא.","ru":"В качестве жеста доброй воли мы хотели бы предложить вам полный возврат средств.","ar":"كبادرة حسن نية، نود أن نعرض عليك استردادًا كاملًا للمبلغ.","e":"","alt":[]},{"en":"I'll escalate this to our technical team and update you within forty-eight hours.","he":"אעביר את זה לטיפול הצוות הטכני ואעדכן אותך בתוך ארבעים ושמונה שעות.","ru":"Я передам вопрос нашей технической команде и сообщу вам новости в течение сорока восьми часов.","ar":"سأرفع الأمر إلى فريقنا التقني وأُطلعك على المستجدات خلال ثمانٍ وأربعين ساعة.","e":"","alt":[]},{"en":"Is there anything else I can help you with before we finish today?","he":"יש עוד משהו שאני יכול/ה לעזור לך בו לפני שנסיים היום?","ru":"Могу ли я помочь вам чем-нибудь ещё, прежде чем мы закончим?","ar":"هل هناك أي شيء آخر يمكنني مساعدتك به قبل أن ننهي اليوم؟","e":"","alt":[]}],"reading":{"en":"Subject: Re: Damaged furniture delivery - order #88213. Dear Mrs. Peretz, Thank you for taking the time to contact us, and please accept my sincere apologies for the condition in which your dining table arrived on Sunday. Having reviewed the photographs you sent, I can confirm that the damage almost certainly occurred during transport and is in no way your responsibility. I also understand that this was not your first attempt to reach us, and that you waited more than forty minutes on the phone before your call was disconnected. That is simply not the level of service we aim to provide, and I have shared your feedback with our customer service manager. To put things right, we will deliver a replacement table at no extra cost and collect the damaged one at the same time. Our logistics team can offer a delivery slot as early as Wednesday morning. In addition, we would like to refund the 250-shekel delivery fee in recognition of the inconvenience you have experienced. Please reply to this email, or call me directly on the number below, to confirm a suitable time. With kind regards, Avi Mizrahi, Customer Care Team Leader","he":"נושא: תשובה: משלוח רהיטים פגום – הזמנה מס' 88213. גב' פרץ היקרה, תודה שהקדשת מזמנך כדי לפנות אלינו, ואנא קבלי את התנצלותי הכנה על המצב שבו הגיע שולחן האוכל שלך ביום ראשון. לאחר שעיינתי בתמונות ששלחת, אני יכול לאשר שהנזק נגרם כמעט בוודאות במהלך ההובלה ואינו באחריותך בשום אופן. אני גם מבין שזה לא היה הניסיון הראשון שלך ליצור איתנו קשר, ושהמתנת יותר מארבעים דקות בטלפון לפני שהשיחה התנתקה. זו פשוט לא רמת השירות שאנו שואפים לספק, והעברתי את המשוב שלך למנהל שירות הלקוחות שלנו. כדי לתקן את המצב, נספק לך שולחן חלופי ללא עלות נוספת ונאסוף את השולחן הפגום באותה הזדמנות. צוות הלוגיסטיקה שלנו יכול להציע מועד משלוח כבר ביום רביעי בבוקר. בנוסף, נשמח להחזיר לך את דמי המשלוח בסך 250 שקלים כהכרה באי הנוחות שנגרמה לך. אנא השיבי למייל זה, או התקשרי אליי ישירות למספר שלמטה, כדי לאשר מועד מתאים. בברכה, אבי מזרחי, ראש צוות שירות לקוחות","ru":"Тема: Re: Повреждённая мебель при доставке — заказ № 88213. Уважаемая г-жа Перец, благодарю вас за то, что нашли время связаться с нами, и примите мои искренние извинения за состояние, в котором в воскресенье прибыл ваш обеденный стол. Изучив присланные вами фотографии, могу подтвердить, что повреждение почти наверняка возникло во время перевозки и ни в коем случае не является вашей виной. Я также понимаю, что это была не первая ваша попытка связаться с нами и что вы ждали на линии более сорока минут, прежде чем звонок оборвался. Это совершенно не тот уровень обслуживания, к которому мы стремимся, и я передал ваш отзыв руководителю службы поддержки клиентов. Чтобы исправить ситуацию, мы доставим вам новый стол без дополнительной оплаты и одновременно заберём повреждённый. Наша служба логистики может предложить доставку уже в среду утром. Кроме того, мы хотели бы вернуть вам плату за доставку в размере 250 шекелей в знак признания доставленных вам неудобств. Пожалуйста, ответьте на это письмо или позвоните мне напрямую по указанному ниже номеру, чтобы согласовать удобное время. С уважением, Ави Мизрахи, руководитель группы поддержки клиентов","ar":"الموضوع: رد: توصيل أثاث تالف – الطلب رقم 88213. السيدة بيرتس المحترمة، شكرًا لك على تخصيص الوقت للتواصل معنا، وأرجو أن تتقبّلي اعتذاري الصادق عن الحالة التي وصلت بها طاولة الطعام يوم الأحد. بعد مراجعة الصور التي أرسلتِها، يمكنني التأكيد أن الضرر حدث على الأرجح أثناء النقل وأنكِ لا تتحملين أي مسؤولية عنه على الإطلاق. وأفهم أيضًا أن هذه لم تكن محاولتك الأولى للتواصل معنا، وأنك انتظرت أكثر من أربعين دقيقة على الهاتف قبل أن تنقطع المكالمة. هذا ببساطة ليس مستوى الخدمة الذي نسعى إلى تقديمه، وقد نقلت ملاحظاتك إلى مدير خدمة العملاء لدينا. ولتصحيح الوضع، سنوصل إليكِ طاولة بديلة دون أي تكلفة إضافية ونستلم الطاولة التالفة في الوقت نفسه. ويمكن لفريق الخدمات اللوجستية لدينا تحديد موعد للتوصيل في وقت مبكر يصل إلى صباح الأربعاء. بالإضافة إلى ذلك، نود أن نعيد إليكِ رسوم التوصيل البالغة 250 شيكلًا تقديرًا للإزعاج الذي تعرّضتِ له. يُرجى الرد على هذه الرسالة، أو الاتصال بي مباشرة على الرقم أدناه، لتأكيد الموعد المناسب. مع أطيب التحيات، آفي مزراحي، رئيس فريق رعاية العملاء","questions":[["What is the main purpose of the email?","To apologise and offer the customer a practical solution","To ask the customer to pay for repairs","To explain the company's return policy","To reject the customer's complaint"],["Why does Avi most likely offer his direct phone number?","To spare her another long wait on the general line","Because the company has no email system","Because he wants to sell her more furniture","Because the logistics team is unavailable"],["What is the tone of the email?","Apologetic, empathetic and professional","Defensive and cold","Humorous and casual","Impatient and dismissive"]]}},{"en":"negotiation","he":"משא ומתן","ru":"Переговоры","ar":"التفاوض","e":"⚖️","items":[{"en":"I see where you're coming from, but that price is beyond our budget.","he":"אני מבין/ה את נקודת המבט שלך, אבל המחיר הזה חורג מהתקציב שלנו.","ru":"Я понимаю вашу позицию, но эта цена выходит за рамки нашего бюджета.","ar":"أفهم وجهة نظرك، لكن هذا السعر يتجاوز ميزانيتنا.","e":"","alt":[]},{"en":"If you could extend the payment terms, we might be able to increase our order.","he":"אם תוכלו להאריך את תנאי התשלום, ייתכן שנוכל להגדיל את ההזמנה שלנו.","ru":"Если бы вы могли продлить срок оплаты, мы, возможно, смогли бы увеличить заказ.","ar":"إذا أمكنكم تمديد شروط الدفع، فقد نتمكن من زيادة طلبيتنا.","e":"","alt":[]},{"en":"Let's try to find a solution that genuinely works for both sides.","he":"בואו ננסה למצוא פתרון שבאמת מתאים לשני הצדדים.","ru":"Давайте попробуем найти решение, которое действительно устроит обе стороны.","ar":"لنحاول إيجاد حل يناسب الطرفين فعلًا.","e":"","alt":[]},{"en":"Would you be willing to meet us halfway on the delivery costs?","he":"האם תהיו מוכנים להתפשר איתנו באמצע על עלויות המשלוח?","ru":"Готовы ли вы пойти нам навстречу и разделить расходы на доставку пополам?","ar":"هل أنتم مستعدون لملاقاتنا في منتصف الطريق بشأن تكاليف التوصيل؟","e":"","alt":[]},{"en":"I'm afraid that's not something we can agree to at this stage.","he":"אני חושש/ת שזה לא משהו שנוכל להסכים לו בשלב הזה.","ru":"Боюсь, на данном этапе мы не можем на это согласиться.","ar":"أخشى أن هذا ليس أمرًا يمكننا الموافقة عليه في هذه المرحلة.","e":"","alt":[]},{"en":"Before we finalise anything, I need to run these terms by our legal team.","he":"לפני שנסגור משהו סופית, אני צריך/ה להעביר את התנאים האלה לבדיקת הצוות המשפטי שלנו.","ru":"Прежде чем что-то окончательно утверждать, мне нужно согласовать эти условия с нашими юристами.","ar":"قبل أن نعتمد أي شيء نهائيًا، عليّ عرض هذه الشروط على فريقنا القانوني.","e":"","alt":[]}],"reading":{"en":"Subject: Our position following yesterday's discussion. Dear Mr. Amar, Thank you for a constructive meeting yesterday. I believe we made genuine progress, and I would like to set out our position clearly before we meet again next week. We understand that your company needs a price reduction of around twelve percent to stay within budget. Frankly, a cut of that size on the existing terms would not be sustainable for us. However, we have looked carefully at the structure of the agreement, and there may be room for flexibility elsewhere. Specifically, we would be prepared to lower the unit price by seven percent if you were able to commit to a three-year contract rather than the current annual one. A longer agreement would allow us to plan production more efficiently and pass part of the savings on to you. We could also consider switching to quarterly rather than monthly deliveries, which would reduce transport costs on both sides. I appreciate that these proposals may require internal approval on your end. I would welcome your thoughts, or any alternative suggestions, before our next meeting. Kind regards, Sharon Weiss, Commercial Director","he":"נושא: עמדתנו בעקבות הדיון אתמול. מר עמר היקר, תודה על פגישה בונה אתמול. אני סבורה שהתקדמנו באמת, ואני רוצה להציג את עמדתנו בבהירות לפני שניפגש שוב בשבוע הבא. אנו מבינים שהחברה שלך זקוקה להפחתת מחיר של כשנים עשר אחוזים כדי לעמוד בתקציב. בכנות, הפחתה בהיקף כזה בתנאים הקיימים לא תהיה בת קיימא עבורנו. עם זאת, בחנו היטב את מבנה ההסכם, וייתכן שיש מקום לגמישות בתחומים אחרים. באופן ספציפי, נהיה מוכנים להוריד את מחיר היחידה בשבעה אחוזים אם תוכלו להתחייב לחוזה לשלוש שנים במקום החוזה השנתי הנוכחי. הסכם ארוך יותר יאפשר לנו לתכנן את הייצור ביעילות רבה יותר ולגלגל אליכם חלק מהחיסכון. נוכל גם לשקול מעבר למשלוחים רבעוניים במקום חודשיים, דבר שיפחית את עלויות ההובלה לשני הצדדים. אני מבינה שההצעות האלה עשויות לדרוש אישור פנימי מצדכם. אשמח לשמוע את מחשבותיך, או כל הצעה חלופית, לפני הפגישה הבאה שלנו. בברכה, שרון וייס, מנהלת מסחרית","ru":"Тема: Наша позиция по итогам вчерашнего обсуждения. Уважаемый г-н Амар, благодарю вас за конструктивную встречу вчера. Я считаю, что мы достигли реального прогресса, и хотела бы чётко изложить нашу позицию до следующей встречи на будущей неделе. Мы понимаем, что вашей компании необходимо снижение цены примерно на двенадцать процентов, чтобы уложиться в бюджет. Откровенно говоря, снижение такого масштаба на нынешних условиях было бы для нас невыгодным. Однако мы внимательно изучили структуру соглашения, и, возможно, гибкость найдётся в других вопросах. В частности, мы были бы готовы снизить цену за единицу на семь процентов, если вы сможете заключить контракт на три года вместо нынешнего годового. Более долгосрочное соглашение позволит нам эффективнее планировать производство и передать часть экономии вам. Мы также могли бы рассмотреть переход на ежеквартальные поставки вместо ежемесячных, что снизит транспортные расходы для обеих сторон. Я понимаю, что эти предложения, возможно, потребуют внутреннего согласования с вашей стороны. Буду рада услышать ваше мнение или любые альтернативные предложения до нашей следующей встречи. С уважением, Шарон Вайс, коммерческий директор","ar":"الموضوع: موقفنا بعد نقاش الأمس. السيد عمار المحترم، شكرًا لك على الاجتماع البنّاء بالأمس. أعتقد أننا حققنا تقدمًا حقيقيًا، وأود أن أعرض موقفنا بوضوح قبل أن نلتقي مجددًا الأسبوع المقبل. نحن ندرك أن شركتكم بحاجة إلى تخفيض في السعر بنحو اثني عشر بالمئة كي تبقى ضمن الميزانية. وبصراحة، فإن تخفيضًا بهذا الحجم وفق الشروط الحالية لن يكون مستدامًا بالنسبة لنا. ومع ذلك، درسنا هيكل الاتفاقية بعناية، وقد يكون هناك مجال للمرونة في جوانب أخرى. وتحديدًا، سنكون مستعدين لخفض سعر الوحدة بنسبة سبعة بالمئة إذا تمكنتم من الالتزام بعقد مدته ثلاث سنوات بدلًا من العقد السنوي الحالي. فالاتفاقية الأطول ستتيح لنا تخطيط الإنتاج بكفاءة أكبر ونقل جزء من التوفير إليكم. كما يمكننا النظر في التحوّل إلى توصيلات فصلية بدلًا من الشهرية، مما سيخفّض تكاليف النقل على الطرفين. أدرك أن هذه المقترحات قد تتطلب موافقة داخلية من جانبكم. يسعدني سماع رأيك، أو أي مقترحات بديلة، قبل اجتماعنا القادم. مع خالص التحيات، شارون فايس، المديرة التجارية","questions":[["What is Sharon's main purpose in writing?","To make a counter-offer linking a lower price to a longer contract","To accept the twelve percent price cut","To end negotiations with Mr. Amar's company","To announce an increase in the unit price"],["What can be inferred about the twelve percent reduction?","Sharon will not accept it under the current terms","It has already been approved by both sides","Sharon originally proposed it herself","It applies only to transport costs"],["How would you describe the tone of the email?","Firm but cooperative","Aggressive and hostile","Submissive and desperate","Casual and dismissive"]]}},{"en":"job interview","he":"ראיון עבודה","ru":"Собеседование","ar":"مقابلة عمل","e":"👔","dialog":true,"items":[{"q":"Tell me about yourself and why you're interested in this particular role.","en":"I'm a project manager with six years in tech, and this role matches my passion for scaling products.","he":"אני מנהל/ת פרויקטים עם שש שנות ניסיון בהייטק, והתפקיד הזה מתאים לתשוקה שלי להצמחת מוצרים.","ru":"Я менеджер проектов с шестилетним опытом в IT, и эта должность соответствует моему увлечению масштабированием продуктов.","ar":"أنا مدير مشاريع بخبرة ست سنوات في التكنولوجيا، وهذا الدور يتوافق مع شغفي بتوسيع المنتجات."},{"q":"What would you say is your greatest weakness?","en":"I used to take on too much myself, but I've learned to delegate and trust my team.","he":"בעבר נטיתי לקחת על עצמי יותר מדי, אבל למדתי להאציל סמכויות ולסמוך על הצוות שלי.","ru":"Раньше я брал/брала слишком много на себя, но научился/научилась делегировать и доверять своей команде.","ar":"كنت أتحمّل الكثير من المهام بنفسي، لكنني تعلّمت التفويض والثقة بفريقي."},{"q":"Tell me about a time you disagreed with your manager. How did you handle it?","en":"I raised my concerns privately, backed them with data, and we agreed on a compromise that worked.","he":"העליתי את החששות שלי בשיחה פרטית, גיביתי אותם בנתונים, והגענו לפשרה שעבדה.","ru":"Я высказал/высказала свои опасения наедине, подкрепил/подкрепила их данными, и мы нашли работающий компромисс.","ar":"طرحت مخاوفي على انفراد، ودعمتها بالبيانات، واتفقنا على حل وسط نجح فعلًا."},{"q":"How do you handle tight deadlines and competing priorities?","en":"I rank tasks by impact and urgency, flag risks early, and renegotiate deadlines when it's truly necessary.","he":"אני מדרג/ת משימות לפי השפעה ודחיפות, מתריע/ה על סיכונים מוקדם, ומשנה מועדים רק
