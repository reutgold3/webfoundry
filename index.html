<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#232858"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Yalla Psychometry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Yalla Psychometry: calm study-desk look; three domain colors (verbal coral, quant teal, English blue) used for tiles and meters. */
:root{--bg:#F4F1EC;--paper:#fff;--ink:#1E2433;--soft:#5E6577;--line:#E2DCD2;
 --v:#F0644B;--q:#14A38B;--e:#3B7DDD;--accent:#2B2F77;--accent-deep:#1B1E52;--good:#21A366;--bad:#E04B5A;--amber:#F2A516;
 --display:"Fredoka","Rubik",system-ui,sans-serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:580px;margin:0 auto;padding-block:16px 36px;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}h1{font-size:28px}h2{font-size:23px;font-weight:600}h3{font-size:19px;font-weight:600}p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:18px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line)}.btn.wide{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.top{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.x{width:46px;height:46px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.chip{background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:600;box-shadow:0 3px 0 var(--line);font-size:15px;white-space:nowrap}
.card{background:var(--paper);border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:10px}
.hero{background:linear-gradient(135deg,#232858,#4B3FA0);color:#fff;box-shadow:0 5px 0 #15183A}.hero .label{color:#D4D0F7}.hero .btn{background:#fff;color:var(--ink);box-shadow:0 5px 0 #8E89E8}
.label{font-size:14px;color:var(--soft);font-weight:500}.center{text-align:center}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:6px;text-align:start;min-height:104px;border-top:6px solid var(--c,var(--accent))}
.tile .e{font-size:28px}.tile b{font-family:var(--display);font-size:17px}
.dv{--c:var(--v)}.dq{--c:var(--q)}.de{--c:var(--e)}
.meter{height:9px;border-radius:999px;background:#ECE7DF;overflow:hidden}.meter i{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px}
.hero .meter{background:rgba(255,255,255,.2)}.hero .meter i{background:#fff}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}.score b{font-family:var(--display);font-size:24px;display:block}
.big{font-family:var(--display);font-size:40px;font-weight:700}
.bar{height:9px;border-radius:999px;background:#ECE7DF;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:19px;font-weight:500;line-height:1.55}
.passage{background:#FBF8F2;border-radius:16px;padding:12px 14px;max-height:42vh;overflow:auto;line-height:1.7;font-size:16px;border:1px solid var(--line)}
.passage p{margin:0 0 .6em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;font-size:17px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:#F1ECE4;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--accent)}.opt.good{border-color:var(--good);background:#E7F7EE}.opt.bad{border-color:var(--bad);background:#FDECEE}
.fb{font-weight:600;min-height:22px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.ex{background:#FFF7E8;border-radius:14px;padding:10px 12px;border:2px dashed #F2C77A;font-size:16px}
.qnav{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.qnav button{aspect-ratio:1;border-radius:8px;background:#ECE7DF;font-size:12px;font-weight:600}
.qnav button.ans{background:#CFC8F5}.qnav button.cur{outline:2px solid var(--accent)}.qnav button.flag{background:var(--amber)}
.timer{font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.flash{min-height:220px;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:30px;cursor:pointer;perspective:800px}
.flash .back{font-family:var(--body);font-size:19px}
.en{direction:ltr;text-align:left}.en .opt{text-align:left}
.attr{font-size:12px;color:var(--soft);text-align:center}
/* math (shared with Yalla Math helpers) */
.math{direction:ltr;unicode-bidi:isolate;display:inline-flex;align-items:center;gap:.3em;font-family:var(--display);font-weight:600;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle}.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .15em}.fr>span:last-child{padding:0 .15em}
.vis{display:flex;justify-content:center}.vis svg{max-width:100%;height:auto}
.steps{background:#FFF6EC;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;border:2px dashed #F6C79F}
.fam-code .code{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center}
.fam-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.fam-row .m{font-size:24px}.fam-row .e{font-size:26px}
.fam-app{font-size:15px;line-height:1.5;padding:4px 0}.chk{display:flex;gap:8px;align-items:center;margin:8px 0}.field{display:flex;flex-direction:column;gap:4px}.field input{border-radius:12px;border:2px solid var(--line);padding:10px;font:inherit}
.backhome-bar{display:flex;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="app" id="app" dir="rtl"></div>
<script>
/* ===== content (injected at build) ===== */
const C={"v":{"analogies":[{"id":"an-1","lvl":1,"q":"שופט : משפט","o":["מורה : תלמיד","יושב ראש : ישיבה","זמר : מיקרופון","רופא : בית חולים"],"a":1,"ex":"שופט הוא מי שמנהל את המשפט, ויושב ראש הוא מי שמנהל את הישיבה."},{"id":"an-2","lvl":1,"q":"עט : כתיבה","o":["מספריים : גזירה","נייר : מחברת","מטבח : בישול","עיפרון : מחק"],"a":0,"ex":"עט הוא כלי שמשמש לכתיבה, ומספריים הם כלי שמשמש לגזירה. מטבח הוא מקום ולא כלי."},{"id":"an-3","lvl":1,"q":"אצבע : יד","o":["ראש : כובע","בוהן : רגל","ברך : מרפק","אוזן : שמיעה"],"a":1,"ex":"אצבע היא חלק מהיד, ובוהן היא חלק מהרגל."},{"id":"an-4","lvl":1,"q":"גור : כלב","o":["גדי : עז","סוס : אורווה","פרה : חלב","חתול : עכבר"],"a":0,"ex":"גור הוא הצאצא הצעיר של הכלב, וגדי הוא הצאצא הצעיר של העז."},{"id":"an-5","lvl":1,"q":"דבורה : כוורת","o":["ציפור : קן","פרה : חלב","דג : סנפיר","כלב : נביחה"],"a":0,"ex":"הכוורת היא מקום המגורים של הדבורה, והקן הוא מקום המגורים של הציפור."},{"id":"an-6","lvl":1,"q":"רעב : אוכל","o":["צמא : מים","כאב : בכי","עייפות : עבודה","קור : חורף"],"a":0,"ex":"רעב הוא צורך שאוכל מספק, וצמא הוא צורך שמים מספקים."},{"id":"an-7","lvl":1,"q":"חם : רותח","o":["רטוב : יבש","גדול : קטן","מהיר : איטי","קר : קפוא"],"a":3,"ex":"רותח הוא חם מאוד, וקפוא הוא קר מאוד – אותה תכונה בעוצמה קיצונית."},{"id":"an-8","lvl":1,"q":"נהג : מכונית","o":["שוטר : משטרה","מכונאי : מוסך","טייס : מטוס","נוסע : אוטובוס"],"a":2,"ex":"נהג הוא מי שמפעיל ומוביל מכונית, וטייס הוא מי שמפעיל ומוביל מטוס."},{"id":"an-9","lvl":1,"q":"ספר : עמוד","o":["מכתב : מעטפה","שרשרת : חוליה","בית : רחוב","עץ : יער"],"a":1,"ex":"ספר בנוי מעמודים רבים, ושרשרת בנויה מחוליות רבות."},{"id":"an-10","lvl":1,"q":"אופה : לחם","o":["נגר : רהיט","מוכר : חנות","צייר : מכחול","רופא : חולה"],"a":0,"ex":"אופה הוא מי שמייצר לחם, ונגר הוא מי שמייצר רהיטים."},{"id":"an-11","lvl":1,"q":"תפוח : פרי","o":["עץ : עלה","ורד : קוץ","לחם : קמח","גזר : ירק"],"a":3,"ex":"תפוח הוא סוג של פרי, וגזר הוא סוג של ירק."},{"id":"an-12","lvl":1,"q":"עין : ראייה","o":["אף : הרחה","יד : כפפה","פה : שפה","רגל : נעל"],"a":0,"ex":"העין היא האיבר שבעזרתו רואים, והאף הוא האיבר שבעזרתו מריחים."},{"id":"an-13","lvl":1,"q":"פותחן : קופסת שימורים","o":["כפית : סוכר","מסמר : פטיש","מפתח : מנעול","חלון : וילון"],"a":2,"ex":"פותחן הוא הכלי שפותח קופסת שימורים, ומפתח הוא הכלי שפותח מנעול."},{"id":"an-14","lvl":1,"q":"שעון : זמן","o":["מחשבון : תלמיד","מדחום : טמפרטורה","משקפיים : עיניים","מצפן : טיול"],"a":1,"ex":"שעון הוא מכשיר שמודד זמן, ומדחום הוא מכשיר שמודד טמפרטורה."},{"id":"an-15","lvl":1,"q":"קיץ : חורף","o":["שבוע : חודש","אביב : פריחה","בוקר : צהריים","יום : לילה"],"a":3,"ex":"קיץ וחורף הם שני קצוות הפוכים של השנה, ויום ולילה הם שני קצוות הפוכים של היממה."},{"id":"an-16","lvl":1,"q":"דייג : דגים","o":["ספן : ים","חקלאי : טרקטור","צייד : חיות בר","טבח : סכין"],"a":2,"ex":"דייג הוא מי שתופס דגים, וצייד הוא מי שתופס חיות בר."},{"id":"an-17","lvl":1,"q":"שמח : עצוב","o":["גבוה : ענק","אמיץ : פחדן","חכם : נבון","שקט : רגוע"],"a":1,"ex":"שמח ועצוב הם הפכים, וגם אמיץ ופחדן הם הפכים. בשאר הזוגות המילים קרובות במשמען."},{"id":"an-18","lvl":1,"q":"חייל : צבא","o":["כוכב : שמיים","נהג : כביש","מורה : שיעור","שחקן : קבוצה"],"a":3,"ex":"חייל הוא אחד החברים בצבא, ושחקן הוא אחד החברים בקבוצה."},{"id":"an-19","lvl":1,"q":"זאב : להקה","o":["ספינה : נמל","דבורה : נחיל","עץ : גזע","כבשה : צמר"],"a":1,"ex":"זאבים חיים בקבוצה הנקראת להקה, ודבורים נעות בקבוצה הנקראת נחיל."},{"id":"an-20","lvl":1,"q":"מגב : רצפה","o":["מברשת שיניים : שיניים","כף : צלחת","סבון : מים","מסרק : מספרה"],"a":0,"ex":"מגב הוא כלי לניקוי הרצפה, ומברשת שיניים היא כלי לניקוי השיניים."},{"id":"an-21","lvl":1,"q":"חלב : גבינה","o":["קמח : שקית","ענבים : יין","עגבנייה : מלפפון","ביצה : תרנגולת"],"a":1,"ex":"גבינה מיוצרת מחלב, ויין מיוצר מענבים."},{"id":"an-22","lvl":1,"q":"תלמיד : בית ספר","o":["סטודנט : אוניברסיטה","עובד : משכורת","קורא : ספר","חולה : רופא"],"a":0,"ex":"תלמיד הוא מי שלומד בבית ספר, וסטודנט הוא מי שלומד באוניברסיטה."},{"id":"an-23","lvl":1,"q":"מטרייה : גשם","o":["מעיל : כפתור","כפפה : אצבע","קרם הגנה : שמש","כובע : ראש"],"a":2,"ex":"מטרייה מגינה מפני הגשם, וקרם הגנה מגן מפני השמש."},{"id":"an-24","lvl":1,"q":"סופר : ספר","o":["מלחין : יצירה מוזיקלית","מוכר : חנות ספרים","מדפיס : דף","קורא : עיתון"],"a":0,"ex":"סופר הוא מי שיוצר ספר, ומלחין הוא מי שיוצר יצירה מוזיקלית."},{"id":"an-25","lvl":1,"q":"בניין : קומה","o":["כביש : מכונית","חלון : וילון","סולם : שלב","עיר : כפר"],"a":2,"ex":"בניין מורכב מקומות זו מעל זו, וסולם מורכב משלבים זה מעל זה."},{"id":"an-26","lvl":1,"q":"לב : דם","o":["משאבה : מים","קיבה : רעב","מוח : ראש","עורק : וריד"],"a":0,"ex":"הלב מזרים את הדם בגוף, והמשאבה מזרימה מים."},{"id":"an-27","lvl":1,"q":"כינור : מיתר","o":["גיטרה : שיר","חליל : נשיפה","פסנתר : קליד","תוף : מקל"],"a":2,"ex":"המיתר הוא חלק בכינור שמפיק את הצליל, והקליד הוא חלק בפסנתר שבאמצעותו מפיקים צליל."},{"id":"an-28","lvl":1,"q":"שמש : יום","o":["אור : חושך","ירח : לילה","ענן : גשם","כוכב : שמיים"],"a":1,"ex":"השמש היא גרם השמיים הבולט ביום, והירח הוא גרם השמיים הבולט בלילה."},{"id":"an-29","lvl":1,"q":"ספרייה : ספרים","o":["מחסן : מפתח","חנות : מוכר","ארכיון : מסמכים","מוזיאון : מבקרים"],"a":2,"ex":"ספרייה היא מקום שבו שומרים ספרים, וארכיון הוא מקום שבו שומרים מסמכים."},{"id":"an-30","lvl":1,"q":"קצב : בשר","o":["ירקן : ירקות","לקוח : קנייה","ספר : מספריים","טבח : מטבח"],"a":0,"ex":"קצב הוא מי שמוכר בשר, וירקן הוא מי שמוכר ירקות."},{"id":"an-31","lvl":1,"q":"נעל : שרוך","o":["גרב : רגל","כובע : ראש","מעיל : רוכסן","חולצה : ארון"],"a":2,"ex":"השרוך משמש לסגירת הנעל, והרוכסן משמש לסגירת המעיל."},{"id":"an-32","lvl":1,"q":"ילד : מבוגר","o":["פרח : גינה","שתיל : עץ","עץ : יער","ענף : עלה"],"a":1,"ex":"ילד גדל והופך למבוגר, ושתיל גדל והופך לעץ."},{"id":"an-33","lvl":1,"q":"אוזן : עגיל","o":["עין : דמעה","צוואר : ראש","רגל : הליכה","אצבע : טבעת"],"a":3,"ex":"עגיל הוא תכשיט שעונדים על האוזן, וטבעת היא תכשיט שעונדים על האצבע."},{"id":"an-34","lvl":1,"q":"מים : קרח","o":["לבה : סלע","חול : מדבר","עץ : עלה","אוויר : רוח"],"a":0,"ex":"מים מתקררים והופכים למוצק – קרח, ולבה מתקררת והופכת למוצ וטרקיה היא כלכלה שאינה נזקקת ליבוא, וצמחונות היא תזונה שנמנעת מבשר."},{"id":"an-200","lvl":5,"q":"אבן נגף : התקדמות","o":["צומת : דרך","מנוף : הרמה","דלק : נסיעה","מעצור : תנועה"],"a":3,"ex":"אבן נגף היא מכשול שמעכב התקדמות, ומעצור הוא דבר שעוצר תנועה. המנוף דווקא מסייע."},{"id":"an-201","lvl":5,"q":"מזור : מכאוב","o":["מכאוב : פצע","נחמה : צער","שמחה : צער","חרדה : דאגה"],"a":1,"ex":"מזור הוא מה שמקל על המכאוב ומרפא אותו, ונחמה היא מה שמקלה על הצער."},{"id":"an-202","lvl":5,"q":"אוטודידקט : מורה","o":["עובד : משכורת","עצמאי : מעסיק","תלמיד : כיתה","מורה : שיעור"],"a":1,"ex":"האוטודידקט לומד בכוחות עצמו ללא מורה, והעצמאי עובד בכוחות עצמו ללא מעסיק."},{"id":"an-203","lvl":5,"q":"נגיד : בנק מרכזי","o":["מרצה : שיעור","פקיד : בנק","סטודנט : קמפוס","רקטור : אוניברסיטה"],"a":3,"ex":"הנגיד עומד בראש הבנק המרכזי, והרקטור עומד בראש המערך האקדמי של האוניברסיטה."},{"id":"an-204","lvl":5,"q":"סונטה : יצירה מוזיקלית","o":["תזמורת : נגן","מלחין : סונטה","חרוז : בית","סונט : שיר"],"a":3,"ex":"סונטה היא סוג מסוים של יצירה מוזיקלית, וסונט הוא סוג מסוים של שיר (בן ארבע־עשרה שורות)."},{"id":"an-205","lvl":5,"q":"מגלומן : גדולה","o":["חולה : תרופה","ענו : גדולה","היפוכונדר : מחלה","רופא : מחלה"],"a":2,"ex":"המגלומן משוכנע שלא בצדק בגדולתו, וההיפוכונדר משוכנע שלא בצדק שהוא חולה."},{"id":"an-206","lvl":5,"q":"פרפרזה : טקסט","o":["ציטוט : מקור","עיבוד : לחן","מילה : משפט","מחבר : טקסט"],"a":1,"ex":"פרפרזה היא ניסוח מחדש של טקסט קיים, ועיבוד הוא גרסה חדשה של לחן קיים. ציטוט מעתיק את המקור כמות שהוא."},{"id":"an-207","lvl":5,"q":"ניכור : קרבה","o":["ניכור : זרות","קרבה : אינטימיות","הסתגרות : פתיחות","בדידות : לבד"],"a":2,"ex":"ניכור וקרבה הם הפכים, וגם הסתגרות ופתיחות הם הפכים. בשאר הזוגות המילים קרובות במשמען."},{"id":"an-208","lvl":5,"q":"מצע : מפלגה","o":["בחירות : מפלגה","חוקה : מדינה","נשיא : מדינה","חוק : שופט"],"a":1,"ex":"המצע הוא מסמך העקרונות של המפלגה, והחוקה היא מסמך העקרונות של המדינה."},{"id":"an-209","lvl":5,"q":"הדרן : הופעה","o":["מערכה : מחזה","במה : הופעה","אפילוג : ספר ":5,"q":"דיסוננס : הרמוניה","o":["אי־סדר : כאוס","שקט : דממה","ערבוביה : סדר","הרמוניה : מנגינה"],"a":2,"ex":"דיסוננס הוא ההפך מהרמוניה, וערבוביה היא ההפך מסדר."},{"id":"an-220","lvl":5,"q":"סייג : כלל","o":["חוק : שופט","הסכמה : חוזה","הסתייגות : הסכמה","כלל : חוק"],"a":2,"ex":"סייג הוא הגבלה שמצמצמת את תחולתו של כלל, והסתייגות היא הגבלה שמצמצמת הסכמה."}],"mix":[{"id":"sc-1","type":"sc","lvl":1,"q":"למרות שהתחזית צפתה גשם, היום התברר כ_____ ושטוף שמש.","o":["בהיר","סוער","קודר","ערפילי"],"a":0,"ex":"'למרות' מציין ניגוד לתחזית הגשם, ולכן נדרש תיאור של מזג אוויר נאה – 'בהיר', המתיישב גם עם 'שטוף שמש'."},{"id":"sc-2","type":"sc","lvl":1,"q":"החוקרת הייתה _____ מאוד בעבודתה: היא בדקה כל נתון שלוש פעמים לפני שפרסמה אותו.","o":["רשלנית","פזיזה","אדישה","קפדנית"],"a":3,"ex":"בדיקה חוזרת של כל נתון מעידה על דקדקנות, כלומר על קפדנות."},{"id":"sc-3","type":"sc","lvl":2,"q":"המנהל ביקש מהעובדים לקצר את הדיונים, _____ הישיבות נמשכו שעות ארוכות ופגעו בעבודה.","o":["אף על פי ש","אלא ש","שכן","כדי ש"],"a":2,"ex":"החלק השני מסביר את הסיבה לבקשה, ולכן נדרשת מילת סיבה – 'שכן'."},{"id":"sc-4","type":"sc","lvl":2,"q":"התרופה החדשה אמנם יעילה, _____ יש לה תופעות לוואי לא מעטות.","o":["לכן","אך","כי","משום כך"],"a":1,"ex":"'אמנם' מקדים הסתייגות שתבוא אחריו, ולכן נדרשת מילת ניגוד – 'אך'."},{"id":"sc-5","type":"sc","lvl":1,"q":"הסופר נודע בסגנונו ה_____: משפטיו קצרים, ענייניים ונטולי קישוטים.","o":["מליצי","תמציתי","מסורבל","מפותל"],"a":1,"ex":"משפטים קצרים וענייניים מאפיינים סגנון תמציתי; שאר האפשרויות מתארות סגנון עמוס ומסובך."},{"id":"sc-6","type":"sc","lvl":2,"q":"אחרי שנים של סכסוך, שני השכנים הגיעו סוף סוף ל_____ ונפרדו בלחיצת יד.","o":["פיוס","עימות","ניכור","קרע"],"a":0,"ex":"'סוף סוף' ולחיצת היד מעידים על סיום הסכסוך, כלומר על פיוס."},{"id":"sc-7","type":"sc","lvl":3,"q":"הוועדה דחתה את ההצעה לא משום שהייתה גרועה, _____ משום שלא הוגשה במועד.","o":["אף","גם","לכן","אלא"],"a":3,"ex":"המבנה 'לא... אלא...' שולל סיבה אחת ומציע במקומה סיבה אחרת."},{"id":"sc-8","type":"sc","lvl":2,"q":"המשקיע ה_____ העדיף להפקיד את כספו בתוכנית חיסכון בטוחה במקום להמר על מניות.","o":["נועז","פזרן","זהיר","הרפתקן"],"a":2,"ex":"העדפת השקעה בטוחה על פני הימור מעידה על זהירות."},{"id":"sc-9","type":"sc","lvl":3,"q":"הטענה שהעלה הנאשם הייתה כה _____ עד שאפילו עורך דינו התקשה להאמין לה.","o":["משכנעת","מבוססת","מופרכת","סבירה"],"a":2,"ex":"אם אפילו עורך הדין התקשה להאמין, הטענה הייתה חסרת בסיס – מופרכת."},{"id":"sc-10","type":"sc","lvl":2,"q":"לפני הצילומים השקיעה השחקנית חודשים ב_____ לתפקיד: היא קראה ספרים על התקופה ואף למדה את הניב המקומי.","o":["ויתור","הכנה","זלזול","התנגדות"],"a":1,"ex":"קריאה ולימוד הניב הם פעולות של הכנה לתפקיד."},{"id":"sc-11","type":"sc","lvl":2,"q":"בניגוד לאחיה ה_____, שאהב להיות במרכז העניינים, נועה הייתה ביישנית ושקטה.","o":["מוחצן","מופנם","ביישן","שתקן"],"a":0,"ex":"'בניגוד' מחייב תכונה הפוכה לביישנות, ואהבת מרכז העניינים מתאימה לאדם מוחצן."},{"id":"sc-12","type":"sc","lvl":4,"q":"המאמר היה _____ כל כך, עד שגם מומחים בתחום נאלצו לקרוא אותו כמה פעמים כדי להבינו.","o":["פשטני","שטחי","בהיר","סבוך"],"a":3,"ex":"אם גם מומחים התקשו להבין, המאמר היה מסובך – סבוך."},{"id":"sc-13","type":"sc","lvl":3,"q":"הממשלה הכריזה על צעדי _____ כדי לצמצם את הגירעון: קיצוצים בתקציבים והקפאת מינויים.","o":["שפע","פזרנות","הרחבה","צנע"],"a":3,"ex":"קיצוצים והקפאות הם צעדי צנע, שנועדו לחסוך בהוצאות."},{"id":"sc-14","type":"sc","lvl":2,"q":"כיוון שהגשר נסגר לתיקונים, נאלצו הנהגים לנסוע בדרך _____ וארוכה.","o":["ישירה","קצרה","עוקפת","מהירה"],"a":2,"ex":"סגירת הגשר מחייבת לעקוף אותו, והדרך מתוארת כארוכה – ולכן 'עוקפת'."},{"id":"sc-15","type":"sc","lvl":4,"q":"דבריו של הנואם היו _____: כל אחד מהשומעים הבין אותם באופן שונה.","o":["חד-משמעיים","דו-משמעיים","מפורשים","ברורים"],"a":1,"ex":"דברים שאפשר להבין בכמה אופנים הם דו-משמעיים."},{"id":"sc-16","type":"sc","lvl":3,"q":"_____ שהניסוי נכשל פעמים רבות, הצוות לא התייאש והמשיך לנסות.","o":["אף על פי","מכיוון","כדי","היות"],"a":0,"ex":"יש ניגוד בין הכישלונות לבין ההתמדה, ולכן נדרשת מילת ויתור – 'אף על פי'."},{"id":"sc-17","type":"sc","lvl":3,"q":"הוא לא רק שלא עזר לנו, _____ הפריע לנו בכל דרך אפשרית.","o":["אלא אף","ולכן","אילו","כלומר"],"a":0,"ex":"המבנה 'לא רק... אלא אף...' מוסיף דבר חמור יותר על הקודם."},{"id":"sc-18","type":"sc","lvl":2,"q":"המדריך ביקש מהמטיילים להישאר _____ זה לזה, כדי שאף אחד לא ילך לאיבוד.","o":["מרוחקים","מפוזרים","עוינים","צמודים"],"a":3,"ex":"כדי שאיש לא ילך לאיבוד, על המטיילים להישאר קרובים – צמודים."},{"id":"sc-19","type":"sc","lvl":4,"q":"המבקר שיבח את הסרט על ה_____ ההיסטורית שלו: כל פרט, מהתלבושות ועד התפאורה, תואם את התקופה.","o":["סטייה","עמימות","נאמנות","שטחיות"],"a":2,"ex":"התאמת כל פרט לתקופה היא נאמנות היסטורית, ועליה ראוי לשבח."},{"id":"sc-20","type":"sc","lvl":3,"q":"התוכנית נראתה מבטיחה על הנייר, אך _____ התברר שהיא אינה ישימה.","o":["להלכה","בפועל","בכוח","בתיאוריה"],"a":1,"ex":"'על הנייר' מנוגד ל'בפועל' – כלומר במציאות המעשית."},{"id":"sc-21","type":"sc","lvl":5,"q":"החוקר נמנע מלהסיק מסקנות _____ ממדגם כה קטן, וקבע כי נדרש מחקר נוסף.","o":["זהירות","גורפות","מסויגות","מוגבלות"],"a":1,"ex":"ממדגם קטן אין להסיק מסקנות כלליות ורחבות – גורפות; את המסקנות הזהירות דווקא אפשר להסיק."},{"id":"sc-22","type":"sc","lvl":4,"q":"המנהיג נודע ב_____ שלו: הוא היה מוכן לשנות את עמדותיו בכל פעם שהדעה הציבורית השתנתה.","o":["אופורטוניזם","עקביות","עקשנות","דבקות"],"a":0,"ex":"שינוי עמדות לפי מה שמשתלם ברגע נתון הוא אופורטוניזם (ניצול הזדמנויות)."},{"id":"sc-23","type":"sc","lvl":3,"q":"הפרויקט נדחה שוב ושוב, ונראה שהוא לעולם לא יגיע לכדי _____.","o":["דחייה","ביטול","עיכוב","מימוש"],"a":3,"ex":"הדחיות החוזרות מעוררות חשש שהפרויקט לא יתממש – לא יגיע לכדי מימוש."},{"id":"sc-24","type":"sc","lvl":2,"q":"המים בבריכה היו _____ כל כך, שאפשר היה לראות את הקרקעית בבירור.","o":["עכורים","בוציים","צלולים","עמוקים"],"a":2,"ex":"רק במים צלולים ושקופים אפשר לראות את הקרקעית בבירור."},{"id":"sc-25","type":"sc","lvl":5,"q":"הביקורת שלה הייתה _____ אך הוגנת: היא לא חסכה במילים, אבל כל טענה שלה הייתה מבוססת.","o":["מתונה","רפה","נוקבת","חנפנית"],"a":2,"ex":"'לא חסכה במי ריקה / השקיעו"],"a":3,"ex":"גינה מוריקה ומטופחת מעידה על השקעה רבה."},{"id":"sc-115","type":"sc","lvl":4,"q":"_____ שלא היה לו ניסיון קודם, הוא _____ במהירות את רזי המקצוע.","o":["מכיוון / למד","אף על פי / שכח","אף על פי / למד","כיוון / הבין"],"a":2,"ex":"יש ניגוד בין היעדר הניסיון לבין הלמידה המהירה, ולכן 'אף על פי'."},{"id":"sc-116","type":"sc","lvl":1,"q":"המים _____ ב-100 מעלות, ואילו ב-0 מעלות הם _____.","o":["קופאים / רותחים","רותחים / קופאים","רותחים / מתאדים","מתאדים / רותחים"],"a":1,"ex":"מים רותחים ב-100 מעלות צלזיוס וקופאים ב-0 מעלות."},{"id":"sc-117","type":"sc","lvl":5,"q":"המבקר לא היה _____ לחלוטין: הוא שיבח את המשחק, אך _____ את התסריט.","o":["חיובי / שיבח","שלילי / גינה","שלילי / שיבח","אדיש / אהב"],"a":1,"ex":"השבח על המשחק מראה שהמבקר לא היה שלילי לחלוטין, ו'אך' מחייב ביקורת על התסריט – גינוי."},{"id":"sc-118","type":"sc","lvl":4,"q":"על אף ה_____ הרבה שהושקעה בפרויקט, תוצאותיו היו _____.","o":["עבודה / מאכזבות","עבודה / מרשימות","עצלות / מאכזבות","השקעה / מצוינות"],"a":0,"ex":"'על אף' מחייב ניגוד בין המאמץ הרב לבין תוצאות מאכזבות."},{"id":"sc-119","type":"sc","lvl":2,"q":"הספר תורגם לעשרות שפות, דבר המעיד על ה_____ הרבה שלו.","o":["אלמוניות","נדירות","דלות","פופולריות"],"a":3,"ex":"תרגום לעשרות שפות מעיד על פופולריות."},{"id":"sc-120","type":"sc","lvl":5,"q":"הכותב אינו מסתפק ב_____ הבעיה; הוא מציע גם _____ מעשיים.","o":["פתרון / קשיים","הסתרת / פתרונות","הצגת / פתרונות","הצגת / תירוצים"],"a":2,"ex":"'אינו מסתפק... מציע גם' מוסיף שלב מעבר להצגת הבעיה – פתרונות."},{"id":"lg-1","type":"lg","lvl":1,"q":"כל הכלבים בשכונה מחוסנים. רקס הוא כלב בשכונה. מה נובע בהכרח?","o":["רקס מחוסן","רקס אינו מחוסן","כל המחוסנים בשכונה הם כלבים","יש בשכונה חתולים שאינם מחוסנים"],"a":0,"ex":"רקס שייך לקבוצת הכלבים בשכונה, וכולם מחוסנים – לכן גם הוא."},{"id":"lg-2","type":"lg","lvl":2,"q":"אם יורד גשם, המשחק מבוטל. המשחק לא בוטל. מה נובע בהכרח?","o":["ירד גשם","המשחק יתקיים מחר","אם לא יורד גשם, המשחק מתקיים","לא ירד גשם"],"a":3,"ex":"אילו ירד גשם המשחק היה מבוטל; מאחר שלא בוטל – לא ירד גשם (שלילת התוצאה שוללת את התנאי)."},{"id":"lg-3","type":"lg","lvl":3,"q":"אם יורד גשם, המשחק מבוטל. המשחק בוטל. מה ניתן לקבוע בוודאות?","o":["ירד גשם","לא ירד גשם","לא ניתן לקבוע אם ירד גשם","המשחק יתקיים בשבוע הבא"],"a":2,"ex":"ייתכן שהמשחק בוטל מסיבה אחרת; התקיימות התוצאה אינה מוכיחה את התנאי."},{"id":"lg-4","type":"lg","lvl":3,"q":"חלק מהסטודנטים הם ספורטאים. כל הספורטאים משכימים קום. מה נובע בהכרח?","o":["כל הסטודנטים משכימים קום","יש סטודנטים שמשכימים קום","כל מי שמשכים קום הוא ספורטאי","אין סטודנטים שאינם ספורטאים"],"a":1,"ex":"הסטודנטים שהם ספורטאים משכימים קום, ולכן יש לפחות כמה סטודנטים כאלה."},{"id":"lg-5","type":"lg","lvl":3,"q":"אף ציפור אינה יונק. חלק מבעלי החיים המעופפים הם ציפורים. מה נובע בהכרח?","o":["אף בעל חיים מעופף אינו יונק","יש בעלי חיים מעופפים שאינם יונקים","כל היונקים מעופפים","כל בעלי החיים המעופפים הם ציפורים"],"a":1,"ex":"המעופפים שהם ציפורים אינם יונקים, ולכן יש מעופפים שאינם יונקים. על שאר המעופפים לא ידוע דבר."},{"id":"lg-6","type":"lg","lvl":1,"q":"מה פירוש הביטוי 'לשבור את הקרח'?","o":["להפיג את המבוכה בתחילת היכרות או מפגש","לגרום נזק לרכוש","לוותר על תוכנית","לכעוס מאוד"],"a":0,"ex":"הביטוי מתאר יצירת אווירה נינוחה בתחילת מפגש בין אנשים שאינם מכירים היטב."},{"id":"lg-7","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'לצאת ידי חובה'?","o":["להשתחרר מחוב כספי","להתנדב בהתלהבות","לעזוב את מקום העבודה","לעשות את המינימום הנדרש בלבד"],"a":3,"ex":"מי שיוצא ידי חובה ממלא את המחויבות באופן פורמלי ומינימלי, בלי השקעה מעבר לכך."},{"id":"lg-8","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'בכייה לדורות'?","o":["שמחה גדולה ומשותפת","מסורת משפחתית","טעות או אסון שהשלכותיו יימשכו זמן רב","טקס זיכרון שנתי"],"a":2,"ex":"'בכייה לדורות' היא החלטה או מעשה שגוי שנזקו יורגש עוד שנים רבות."},{"id":"lg-9","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'גזירה שהציבור אינו יכול לעמוד בה'?","o":["חוק שזכה לתמיכה רחבה","החלטה זמנית","דרישה מכבידה מדי שאי אפשר לקיים","עונש על עבירה חמורה"],"a":2,"ex":"הביטוי מתאר כלל או דרישה שרוב האנשים אינם מסוגלים לעמוד בהם בפועל."},{"id":"lg-10","type":"lg","lvl":3,"q":"טענה: 'מאז שהעירייה התקינה מצלמות ברחובות, ירד מספר הפריצות בעיר. מכאן שהמצלמות מרתיעות פורצים.' איזה מהממצאים הבאים מחליש את הטענה יותר מכול?","o":["המצלמות הותקנו בעיקר ברחובות הראשיים","באותה תקופה ירד מספר הפריצות בשיעור דומה גם בערים שבהן לא הותקנו מצלמות","רוב התושבים תומכים בהתקנת המצלמות","עלות המצלמות הייתה גבוהה מהצפוי"],"a":1,"ex":"אם הירידה התרחשה גם בלי מצלמות, סביר שגורם אחר גרם לה – והקשר הסיבתי הנטען נחלש."},{"id":"lg-11","type":"lg","lvl":3,"q":"טענה: 'תלמידים שאוכלים ארוחת בוקר מצליחים יותר במבחנים, ולכן ארוחת בוקר משפרת את הריכוז.' איזה ממצא מחזק את הטענה יותר מכול?","o":["בניסוי שבו חולקו תלמידים באקראי לשתי קבוצות, הקבוצה שקיבלה ארוחת בוקר הצליחה יותר","תלמידים שאוכלים ארוחת בוקר ישנים בממוצע יותר שעות","רוב התלמידים מעדיפים ארוחת בוקר מתוקה","ארוחת בוקר נפוצה יותר במשפחות בעלות הכנסה גבוהה"],"a":0,"ex":"חלוקה אקראית מנטרלת גורמים אחרים ומצביעה על קשר סיבתי. שני ממצאים אחרים מציעים דווקא הסבר חלופי."},{"id":"lg-12","type":"lg","lvl":2,"q":"כל מי שעבר את המבחן קיבל תעודה. דנה לא קיבלה תעודה. מה נובע בהכרח?","o":["דנה לא ניגשה למבחן","דנה עברה את המבחן","כל מי שקיבל תעודה עבר את המבחן","דנה לא עברה את המבחן"],"a":3,"ex":"אילו דנה עברה, הייתה מקבלת תעודה. ייתכן שניגשה ונכשלה, ולכן אי אפשר לקבוע שלא ניגשה."},{"id":"lg-13","type":"lg","lvl":4,"q":"בכל יום שבו יוסי הולך לחדר כושר, הוא אוכל ארוחת ערב קלה. ביום שלישי אכל יוסי ארוחת ערב קלה. מה נובע בהכרח?","o":["יוסי הלך לחדר כושר ביום שלישי","יוסי לא הלך לחדר כושר ביום שלישי","יוסי אוכל ארוחת ערב קלה רק בימי שלישי","לא ניתן לדעת אם יוסי הלך לחדר כושר ביום שלישי"],"a":3,"ex":"הכלל קובע מה קורה בימי אימון, אך אינו שולל ארוחה קלה גם בימים אחרים."},{"id":"lg-14","type":"lg","lvl":4,"q":"אם מאיה תגיע למסיבה, גם נועם יגיע. אם נועם יגיע, עידו לא יגיע. עידו הגיע למסיבה. מה נובע בהכרח?","o":["נועם הגיע","מאיה הגיעה","מאיה לא הגיעה","לא ניתן לדעת דבר על מאיה"],"a":2,"ex":"עידו הגיע, ולכן נועם לא הגיע; ואם נועם לא הגיע, גם מאיה לא הגיעה."},{"id":"lg-15","type":"lg","lvl":2,"q":"כל הפרחים בגינה אדומים או צהובים. אין בגינה פרחים צהובים. מה נובע בהכרח?","o":["יש בגינה פרחים לבנים","כל הפרחים בגינה אדומים","חלק מהפרחים בגינה צהובים","אין בגינה פרחים כלל"],"a":1,"ex":"כל פרח הוא אדום או צהוב, ואף אחד אינו צהוב – לכן כולם אדומים."},{"id":"lg-16","type":"lg","lvl":5,"q":"בכיתה 30 תלמידים. 20 מהם מנגנים, ו-15 משחקים כדורגל. מה נובע בהכרח?","o":["יש לפחות 5 תלמידים שגם מנגנים וגם משחקים כדורגל","יש בדיוק 5 תלמידים שעושים את שניהם","יש לפחות 10 תלמידים שאינם עושים אף אחד מהשניים","כל מי שמשחק כדורגל גם מנגן"],"a":0,"ex":"20+15=35, יותר מ-30 תלמידים, ולכן לפחות 5 נספרו פעמיים. ייתכן שהחפיפה גדולה יותר."},{"id":"lg-17","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'לטמון את הראש בחול'?","o":["להתעלם מבעיה במקום להתמודד איתה","לעבוד קשה בשדה","להסתתר מפני סכנה ממשית","להתבייש בהצלחה"],"a":0,"ex":"הביטוי מתאר מי שמעדיף לא לראות את הבעיה, כאילו כך היא תיעלם."},{"id":"lg-18","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'לא הותיר אבן על אבן'?","o":["בנה בקפידה","חיפש בכל מקום","השאיר הכול כפי שהיה","הרס דבר לחלוטין"],"a":3,"ex":"הביטוי מתאר הרס מוחלט, עד שלא נשארה אבן מונחת על חברתה."},{"id":"lg-19","type":"lg","lvl":4,"q":"טענה: 'רוב הנהגים המעורבים בתאונות הם נהגים ותיקים, ולכן נהגים ותיקים נוהגים בזהירות פחותה מנהגים חדשים.' מהו הכשל העיקרי בטענה?","o":["היא מתבססת על נתונים שאינם קשורים לתאונות","היא מניחה שנהגים חדשים אינם מעורבים בתאונות כלל","היא אינה מביאה בחשבון שרוב הנהגים בכביש הם נהגים ותיקים","היא מגדירה 'נהג ותיק' באופן מעורפל מדי"],"a":2,"ex":"אם רוב הנהגים ותיקים, טבעי שרובם גם יופיעו בתאונות; יש להשוות את שיעור התאונות בכל קבוצה ולא את המספר המוחלט."},{"id":"lg-20","type":"lg","lvl":3,"q":"'רק מי שנרשם מראש רשאי להשתתף בסדנה.' איזה מהמשפטים הבאים שקול למשפט זה?","o":["כל מי שנרשם מראש חייב להשתתף בסדנה","מי שלא נרשם מראש אינו רשאי להשתתף בסדנה","מי שמשתתף בסדנה לא נרשם מראש","כל מי שנרשם מראש רשאי להשתתף בסדנה"],"a":1,"ex":"'רק מי ש...' קובע תנאי הכרחי: בלי הרשמה אין השתתפות. הוא אינו קובע שההרשמה מספיקה."},{"id":"lg-21","type":"lg","lvl":4,"q":"'כל חברי המועדון הם תושבי העיר.' איזה מהמשפטים הבאים נובע מכך בהכרח?","o":["כל תושב העיר הוא חבר במועדון","מי שאינו תושב העיר אינו חבר במועדון","מי שאינו חבר במועדון אינו תושב העיר","יש תושבי עיר שאינם חברי המועדון"],"a":1,"ex":"שלילת התוצאה שוללת את התנאי: מי שאינו תושב אינו יכול להיות חבר. היפוך הכיוון אינו נובע."},{"id":"lg-22","type":"lg","lvl":2,"q":"מה פירוש המילה 'נבר' במשפט: 'הוא נבר בארכיונים ישנים במשך שנים'?","o":["חיפש ביסודיות","הרס","ניהל","התעלם"],"a":0,"ex":"לנבור פירושו לחפור ולחפש לעומק, ובהשאלה – לחקור ביסודיות."},{"id":"lg-23","type":"lg","lvl":3,"q":"בתחרות השתתפו ארבעה רצים: אבי, בני, גדי ודני. אבי הגיע לפני בני, גדי הגיע אחרי דני, ובני הגיע לפני דני. מי הגיע אחרון?","o":["בני","דני","אבי","גדי"],"a":3,"ex":"הסדר הוא: אבי, בני, דני, גדי – ולכן גדי אחרון."},{"id":"lg-24","type":"lg","lvl":4,"q":"בשורה עומדים חמישה אנשים. רון עומד משמאל לשירה, ואור עומד בין רון לשירה. טל עומד מימין לשירה, וגיל עומד בקצה הימני. מי עומד באמצע?","o":["אור","טל","שירה","רון"],"a":2,"ex":"הסידור היחיד האפשרי משמאל לימין: רון, אור, שירה, טל, גיל – ולכן שירה באמצע."},{"id":"lg-25","type":"lg","lvl":3,"q":"הנחה: כל מי שיודע לשחות עבר קורס שחייה. איזה מהבאים סותר את ההנחה?","o":["תמר עברה קורס שחייה ואינה יודעת לשחות","תמר אינה יודעת לשחות ולא עברה קורס","תמר יודעת לשחות ומעולם לא עברה קורס שחייה","תמר עברה קורס שחייה ויודעת לשחות"],"a":2,"ex":"ההנחה נסתרת רק כשמישהו יודע לשחות בלי שעבר קורס; ההנחה אינה מבטיחה שכל מי שעבר קורס יודע לשחות."},{"id":"lg-26","type":"lg","lvl":1,"q":"מה פירוש הביטוי 'לפתוח דף חדש'?","o":["לקרוא ספר","להתחיל מחדש ולהניח לעבר","לכתוב מכתב תלונה","לחזור על טעות"],"a":1,"ex":"הביטוי מתאר התחלה חדשה ביחסים או בהתנהגות, בלי להיגרר אחרי מה שהיה."},{"id":"lg-27","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'מים שקטים חודרים עמוק'?","o":["אדם שקט ומאופק עשוי להיות עמוק ומשפיע יותר משנראה","יש להיזהר ממים עמוקים","שתיקה היא סימן לחולשה","בעיות קטנות נעלמות מעצמן"],"a":0,"ex":"הביטוי מלמד שאין לשפוט אדם לפי שקטו – לעיתים דווקא השקטים משפיעים במידה רבה."},{"id":"lg-28","type":"lg","lvl":4,"q":"'לא כל מי שמרצה באוניברסיטה הוא בעל תואר דוקטור.' מה נובע בהכרח?","o":["אף מרצה אינו בעל תואר דוקטור","רוב המרצים אינם בעלי תואר דוקטור","כל בעלי תואר הדוקטור מרצים באוניברסיטה","יש לפחות מרצה אחד באוניברסיטה שאינו בעל תואר דוקטור"],"a":3,"ex":"'לא כל' פירושו שיש לפחות אחד שאינו כזה – לא יותר מכך."},{"id":"lg-29","type":"lg","lvl":5,"q":"במשרד חל הכלל: 'עובד יקבל בונוס אם ורק אם עמד ביעד וגם לא נעדר יותר משלושה ימים.' שירן לא קיבלה בונוס. מה נובע בהכרח?","o":["שירן לא עמדה ביעד","שירן נעדרה יותר משלושה ימים","שירן לא עמדה ביעד וגם נעדרה יותר משלושה ימים","שירן לא עמדה ביעד, או שנעדרה יותר משלושה ימים"],"a":3,"ex":"מאחר שהבונוס דורש את שני התנאים, היעדרו מעיד שלפחות אחד מהם לא התקיים – אך לא ידוע איזה."},{"id":"lg-30","type":"lg","lvl":4,"q":"טענה: 'המוצר שלנו הוא הנמכר ביותר בקטגוריה, ולכן הוא האיכותי ביותר.' איזו הנחה סמויה מונחת ביסוד הטענה?","o":["יש מוצרים זולים יותר בקטגוריה","הצרכנים אינם מתעניינים במחיר","היקף המכירות של מוצר משקף את איכותו","המוצר נמכר רק בחנויות מסוימות"],"a":2,"ex":"כדי לעבור ממכירות לאיכות, הטוען חייב להניח שהצרכנים קונים יותר את המוצר האיכותי ביותר."},{"id":"lg-31","type":"lg","lvl":1,"q":"אם הנורה דולקת, המכשיר פועל. המכשיר אינו פועל. מה נובע בהכרח?","o":["הנורה דולקת","הנורה אינה דולקת","הנורה שרופה","המכשיר מקולקל"],"a":1,"ex":"אילו הנורה דלקה, המכשיר היה פועל; הוא אינו פועל – ולכן הנורה אינה דולקת. סיבת התקלה אינה ידועה."},{"id":"lg-32","type":"lg","lvl":3,"q":"כל המשוררים רגישים. חלק מהאנשים הרגישים ביישנים. מה נובע בהכרח?","o":["לא ניתן לקבוע אם יש משוררים ביישנים","חלק מהמשוררים ביישנים","כל הביישנים משוררים","אף משורר אינו ביישן"],"a":0,"ex":"ייתכן שהרגישים הביישנים אינם משוררים כלל, וייתכן שכן; הנתונים אינם מכריעים."},{"id":"lg-33","type":"lg","lvl":3,"q":"מה פירוש המילה 'אגבית' במשפט: 'ההערה האגבית שלו עוררה דיון סוער'?","o":["שנאמרה כבדרך אגב, בשולי הדברים","שנאמרה בכעס","שנמסרה בכתב","שנאמרה בשם אחרים"],"a":0,"ex":"הערה אגבית היא הערה צדדית שלא הייתה בעיקר הדברים."},{"id":"lg-34","type":"lg","lvl":4,"q":"חוקרת טוענת: 'בעלי חיים בשבי חיים זמן רב יותר מאשר בטבע, ולכן השבי טוב יותר לרווחתם.' איזה מהבאים מחליש את הטענה יותר מכול?","o":["בעלי חיים בשבי מקבלים טיפול וטרינרי","יש גני חיות שבהם התנאים טובים במיוחד","בטבע בעלי חיים חשופים לטורפים","בעלי חיים בשבי מראים סימני מצוקה רבים, ואורך החיים אינו המדד היחיד לרווחה"],"a":3,"ex":"הטענה מניחה שאורך חיים שווה לרווחה; עדות למצוקה בשבי מערערת את ההנחה הזאת."},{"id":"lg-35","type":"lg","lvl":2,"q":"בקופסה כדורים אדומים, כחולים וירוקים. מספר האדומים גדול ממספר הכחולים, ומספר הירוקים קטן ממספר הכחולים. מה נובע בהכרח?","o":["יש יותר כחולים מאדומים","מספר הירוקים הוא הגדול ביותר","מספר האדומים גדול ממספר הירוקים","מספר האדומים גדול מסכום הכחולים והירוקים"],"a":2,"ex":"אדומים > כחולים > ירוקים, ולכן אדומים > ירוקים. היחס לסכום אינו ידוע."},{"id":"lg-36","type":"lg","lvl":3,"q":"'אף אחד מהמועמדים שהגיעו באיחור לא התקבל.' יעל התקבלה. מה נובע בהכרח?","o":["יעל הגיעה מוקדם מכולם","יעל לא הגיעה באיחור","כל מי שלא איחר התקבל","יעל הייתה המועמדת הטובה ביותר"],"a":1,"ex":"אילו יעל איחרה, לא הייתה מתקבלת; היא התקבלה – ולכן לא איחרה."},{"id":"lg-37","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'על קצה המזלג'?","o":["בהרחבה ובפירוט","בקצרה ובתמציתיות","בחשאיות","באיחור"],"a":1,"ex":"הצגת דבר 'על קצה המזלג' פירושה הצגה תמציתית של עיקרי הדברים בלבד."},{"id":"lg-38","type":"lg","lvl":4,"q":"מה פירוש הביטוי 'נס ליחו'?","o":["איבד את רעננותו וחיוניותו","נמלט במהירות","הצליח באופן מפתיע","נעשה עשיר"],"a":0,"ex":"'לח' הוא רעננות וחיות; 'נס ליחו' – הלחלוחית נעלמה, כלומר הדבר התיישן ואיבד מכוחו."},{"id":"lg-39","type":"lg","lvl":4,"q":"מה פירוש הביטוי 'עומד בעינו'?","o":["נראה לעין כול","מתבונן בקפידה","נעלם מן העין","נשאר בתוקף ללא שינוי"],"a":3,"ex":"דבר העומד בעינו נשאר כפי שהיה, בלי שינוי."},{"id":"lg-40","type":"lg","lvl":3,"q":"'אם תלמד, תצליח במבחן.' איזה מהבאים שקול למשפט זה?","o":["אם לא תלמד, לא תצליח במבחן","אם תצליח במבחן, סימן שלמדת","אם לא תצליח במבחן, סימן שלא למדת","רק אם תלמד תצליח במבחן"],"a":2,"ex":"משפט 'אם א אז ב' שקול ל'אם לא ב אז לא א' (הקונטרה-פוזיטיב). שאר האפשרויות הופכות את הכיוון."},{"id":"lg-41","type":"lg","lvl":4,"q":"טענה: 'מכיוון שמכירות המטריות עולות בימים שבהם יש פקקים רבים, הפקקים גורמים לאנשים לקנות מטריות.' מהו ההסבר החלופי הסביר ביותר לממצא?","o":["אנשים קונים מטריות כדי להגן על המכונית","הפקקים נוצרים ליד חנויות מטריות","גורם שלישי – גשם – גורם הן לפקקים והן לקניית מטריות","המטריות זולות יותר בימי פקקים"],"a":2,"ex":"שתי התופעות מתרחשות יחד משום ששתיהן נגרמות מגשם, ולא משום שאחת גורמת לשנייה."},{"id":"lg-42","type":"lg","lvl":1,"q":"כל התפוחים בסל ירוקים. איזה מהבאים אינו יכול להיות נכון?","o":["בסל יש גם אגסים","בסל יש תפוח אדום","בסל יש אגס אדום","בסל יש תפוח ירוק גדול"],"a":1,"ex":"תפוח אדום בסל סותר את הקביעה שכל התפוחים בו ירוקים; על פירות אחרים הקביעה אינה אומרת דבר."},{"id":"lg-43","type":"lg","lvl":3,"q":"חלק מהעובדים בחברה דוברים צרפתית. כל דוברי הצרפתית בחברה עובדים במחלקת השיווק. מה נובע בהכרח?","o":["יש עובדים במחלקת השיווק שדוברים צרפתית","כל עובדי השיווק דוברים צרפתית","כל העובדים בחברה עובדים בשיווק","מי שאינו דובר צרפתית אינו עובד בשיווק"],"a":0,"ex":"קיימים דוברי צרפתית בחברה, וכולם בשיווק – לכן יש בשיווק דוברי צרפתית."},{"id":"lg-44","type":"lg","lvl":5,"q":"נתון: 'אם אורי מנצח, אז גם עמית או בר מנצחים.' ידוע שעמית לא ניצח. מה נובע בהכרח?","o":["אורי לא ניצח","בר ניצח","בר לא ניצח","אם אורי ניצח, אז בר ניצח"],"a":3,"ex":"אם אורי ניצח, אחד מעמית ובר חייב לנצח; עמית לא ניצח – לכן זה יהיה בר. אך לא ידוע אם אורי ניצח."},{"id":"lg-45","type":"lg","lvl":4,"q":"נתון: 'כל מי שמגיע לישיבה מקבל את הפרוטוקול.' ונתון: 'נעמה קיבלה את הפרוטוקול.' מישהו הסיק: 'נעמה הגיעה לישיבה.' מה ניתן לומר על המסקנה?","o":["היא נובעת בהכרח מהנתונים","היא סותרת את הנתונים","היא נכונה רק אם נעמה ביקשה את הפרוטוקול","היא אינה נובעת בהכרח, כי ייתכן שגם מי שלא הגיע קיבל את הפרוטוקול"],"a":3,"ex":"הכלל מבטיח פרוטוקול למי שהגיע, אך אינו קובע שרק הם מקבלים אותו – זהו כשל אישור התוצאה."},{"id":"lg-46","type":"lg","lvl":3,"q":"מה פירוש המילה 'אמביוולנטי'?","o":["נלהב מאוד","אדיש לחלוטין","בעל רגשות או עמדות מנוגדים בעת ובעונה אחת","בטוח בעמדתו"],"a":2,"ex":"אמביוולנטיות היא דו-ערכיות: יחס של משיכה ודחייה, או חיוב ושלילה, בו בזמן."},{"id":"lg-47","type":"lg","lvl":2,"q":"טענה: 'שחקן כדורגל מפורסם ממליץ על תוסף התזונה הזה, ולכן הוא בוודאי יעיל.' מה הכשל העיקרי בטענה?","o":["היא מבוססת על מדגם גדול מדי","היא נשענת על סמכותו של אדם שאינו מומחה בתחום","היא סותרת את עצמה","היא מתעלמת ממחיר התוסף"],"a":1,"ex":"פרסום והצלחה בספורט אינם מקנים מומחיות בתזונה, ולכן ההמלצה אינה ראיה ליעילות."},{"id":"lg-48","type":"lg","lvl":3,"q":"במבחן קיבלה מיכל ציון גבוה מזה של רועי, ורועי קיבל ציון נמוך מזה של שני. מה ניתן לקבוע על היחס בין הציונים של מיכל ושני?","o":["לא ניתן לקבוע","מיכל קיבלה ציון גבוה יותר","שני קיבלה ציון גבוה יותר","שתיהן קיבלו ציון זהה"],"a":0,"ex":"ידוע רק ששתיהן קיבלו ציון גבוה מזה של רועי; היחס ביניהן אינו נקבע."},{"id":"lg-49","type":"lg","lvl":3,"q":"'אין עשן בלי אש' – מה המשמעות הקרובה ביותר לפתגם?","o":["לשמועה יש בדרך כלל בסיס כלשהו במציאות","יש להיזהר משריפות","כל בעיה נפתרת מעצמה","מי שמתלונן הוא האשם"],"a":0,"ex":"הפתגם אומר שאם נשמעות טענות או שמועות, כנראה יש להן מקור אמיתי כלשהו."},{"id":"lg-50","type":"lg","lvl":4,"q":"מה פירוש הביטוי 'מונח על קרן הצבי'?","o":["נמצא במקום גבוה ומכובד","נע במהירות רבה","זוכה להצלחה מסחררת","נמצא במצב רעוע ולא יציב"],"a":3,"ex":"דבר המונח על קרן הצבי עלול ליפול בכל רגע – הוא בסכנה ובחוסר ודאות."},{"id":"lg-51","type":"lg","lvl":4,"q":"כל המנויים לחדר הכושר רשאים להשתמש בבריכה. אף אחד מהרשאים להשתמש בבריכה אינו מתחת לגיל 16. מה נובע בהכרח?","o":["כל מי שמעל גיל 16 מנוי לחדר הכושר","כל הרשאים להשתמש בבריכה מנויים לחדר הכושר","אין מנויים לחדר הכושר מתחת לגיל 16","יש מנויים שאינם רשאים להשתמש בבריכה"],"a":2,"ex":"כל מנוי רשאי להשתמש בבריכה, וכל רשאי הוא בן 16 לפחות – לכן כל מנוי הוא בן 16 לפחות."},{"id":"lg-52","type":"lg","lvl":3,"q":"סקר נערך בקרב קוראי עיתון כלכלי, ונמצא ש-80% מהנשאלים מחזיקים במניות. מכאן הסיק העורך ש-80% מהאוכלוסייה מחזיקים במניות. מה הבעיה העיקרית במסקנה?","o":["הסקר נערך בעיתון ולא בטלוויזיה","המדגם אינו מייצג את כלל האוכלוסייה","שיעור של 80% גבוה מכדי להיות נכון","ייתכן שהנשאלים אינם יודעים מה הן מניות"],"a":1,"ex":"קוראי עיתון כלכלי מתעניינים בהשקעות יותר מהממוצע, ולכן אי אפשר להכליל מהם על כלל האוכלוסייה."},{"id":"lg-53","type":"lg","lvl":2,"q":"'בכל פעם שאני שוטף את המכונית, יורד גשם למחרת.' מה ניתן לומר על המסקנה 'שטיפת המכונית גורמת לגשם'?","o":["זו מסקנה נכונה, כי הדבר חוזר על עצמו","זו מסקנה שגויה, כי רצף של אירועים אינו מעיד על קשר סיבתי","זו מסקנה נכונה רק בחורף","זו מסקנה שאין שום דרך לבדוק"],"a":1,"ex":"העובדה שאירוע אחד בא אחרי אחר אינה מוכיחה שהראשון גרם לשני."},{"id":"lg-54","type":"lg","lvl":5,"q":"כלל: 'מי שאינו מגיש עבודה אינו יכול לעבור את הקורס, אלא אם קיבל פטור.' אלון עבר את הקורס ולא הגיש עבודה. בהנחה שהכלל נשמר, מה נובע בהכרח?","o":["אלון קיבל פטור","אלון לא קיבל פטור","אלון הגיש את העבודה באיחור","אלון ייאלץ לחזור על הקורס"],"a":0,"ex":"לפי הכלל, הדרך היחידה לעבור בלי להגיש עבודה היא פטור – ולכן אלון קיבל פטור."},{"id":"lg-55","type":"lg","lvl":1,"q":"מה ההפך של 'שקדן'?","o":["חרוץ","מתמיד","שקוד","עצלן"],"a":3,"ex":"שקדן הוא אדם חרוץ ומתמיד; ההפך הוא עצלן."},{"id":"lg-56","type":"lg","lvl":3,"q":"מה פירוש המילה 'אנכרוניסטי'?","o":["חדשני מאוד","ארוך מאוד","שאינו מתאים לזמנו, מיושן","מסודר לפי סדר כרונולוגי"],"a":2,"ex":"אנכרוניזם הוא דבר שאינו שייך לתקופה שבה הוא מופיע, בדרך כלל משהו מיושן."},{"id":"lg-57","type":"lg","lvl":4,"q":"חוקר מצא שבערים שבהן יש יותר בתי קפה, יש גם יותר סטודנטים. איזו מסקנה מוצדקת ביותר?","o":["בתי הקפה מושכים סטודנטים לעיר","הסטודנטים גורמים לפתיחת בתי קפה","יש קשר בין שני הנתונים, אך לא ניתן לקבוע מתוכו מה גורם למה","אין שום קשר בין הנתונים"],"a":2,"ex":"הממצא מראה מתאם בלבד; כיוון ההשפעה, או גורם שלישי, אינם נקבעים ממנו."},{"id":"lg-58","type":"lg","lvl":3,"q":"אם החנות פתוחה, האור בחלון דולק. אם האור בחלון דולק, השומר נמצא בפנים. השומר אינו בפנים. מה נובע בהכרח?","o":["האור דולק","החנות סגורה","החנות פתוחה","השומר בחופשה"],"a":1,"ex":"השומר אינו בפנים, ולכן האור אינו דולק; האור אינו דולק, ולכן החנות סגורה."},{"id":"lg-59","type":"lg","lvl":3,"q":"'כל א הוא ב. אף ב אינו ג.' מה נובע בהכרח?","o":["אף א אינו ג","חלק מה-ג הם א","כל ב הוא א","יש ג שאינו ב"],"a":0,"ex":"כל א נמצא בתוך ב, ו-ב זר לגמרי ל-ג – לכן גם א זר ל-ג."},{"id":"lg-60","type":"lg","lvl":4,"q":"טענה: 'יש להגביל את משחקי המחשב לבני נוער, כי מחקר מצא שבני נוער שמשחקים הרבה ישנים פחות.' איזה מהבאים, אם נכון, מחזק את הטענה יותר מכול?","o":["רוב בני הנוער משחקים במשחקי מחשב","משחקי מחשב מפתחים כישורים מוטוריים","מבוגרים רבים משחקים במשחקי מחשב בלילה","מחסור בשינה בגיל ההתבגרות פוגע באופן מוכח בבריאות ובלימודים"],"a":3,"ex":"הטענה מניחה שמעט שינה מזיק; ממצא שמאשש את הנזק מחזק את הצורך בהגבלה."},{"id":"lg-61","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'שם את מבטחו ב...'?","o":["חשד בו","הזהיר ממנו","הסתיר ממנו דבר","סמך עליו ובטח בו"],"a":3,"ex":"'מבטח' הוא ביטחון; מי ששם מבטחו במישהו סומך עליו."},{"id":"lg-62","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'בעל כורחו'?","o":["ברצון רב","בכוחות עצמו","שלא מרצונו, בניגוד לרצונו","בשם בעליו"],"a":2,"ex":"'בעל כורחו' פירושו מתוך כפייה, לא מבחירה."},{"id":"lg-63","type":"lg","lvl":4,"q":"ארבע חברות – אלה, בת, גלי ודפנה – מגדלות כל אחת חיית מחמד אחרת: כלב, חתול, תוכי ודג. אלה אינה מגדלת כלב או חתול. בת מגדלת תוכי. גלי אינה מגדלת כלב. מה מגדלת דפנה?","o":["חתול","כלב","תוכי","דג"],"a":1,"ex":"בת – תוכי, ולכן אלה (לא כלב ולא חתול) – דג. גלי אינה מגדלת כלב, ולכן חתול. לדפנה נותר הכלב."},{"id":"lg-64","type":"lg","lvl":3,"q":"'רוב חברי הוועדה תמכו בהצעה.' איזה מהבאים נובע בהכרח?","o":["יותר ממחצית חברי הוועדה תמכו בהצעה","כל חברי הוועדה תמכו בהצעה","חלק מחברי הוועדה התנגדו להצעה","ההצעה התקבלה סופית"],"a":0,"ex":"'רוב' פירושו יותר ממחצית. אין מכך ראיה שמישהו התנגד, וייתכן שנדרש אישור נוסף."},{"id":"lg-65","type":"lg","lvl":5,"q":"טענה: 'תרופה X יעילה, שכן 90% מהחולים שנטלו אותה החלימו תוך שבוע.' איזה מידע נוסף נחוץ ביותר כדי להעריך את הטענה?","o":["שיעור ההחלמה תוך שבוע בקרב חולים דומים שלא נטלו את התרופה","מחיר התרופה","מספר החברות המייצרות את התרופה","גילו של הרופא שרשם את התרופה"],"a":0,"ex":"ייתכן שרוב החולים מחלימים תוך שבוע ממילא; רק השוואה לקבוצת ביקורת תראה אם התרופה תרמה."},{"id":"lg-66","type":"lg","lvl":1,"q":"מה פירוש הביטוי 'לתקוע מקל בגלגלים'?","o":["לעזור במאמץ","לתקן תקלה","להאיץ תהליך","להפריע ולעכב את התקדמותו של דבר"],"a":3,"ex":"מקל בין חישורי הגלגל עוצר את תנועתו; בהשאלה – הכשלה מכוונת."},{"id":"lg-67","type":"lg","lvl":3,"q":"אם אין בבית חלב, נועה שותה תה. אם יש בבית חלב, נועה שותה קפה. היום נועה לא שתתה קפה. בהנחה שהכללים תמיד מתקיימים, מה נובע בהכרח?","o":["היה בבית חלב","נועה לא שתתה דבר","נועה שתתה תה","נועה שתתה קפה בלי חלב"],"a":2,"ex":"אילו היה חלב, נועה הייתה שותה קפה; היא לא שתתה קפה – ולכן לא היה חלב, ומכאן שתתה תה."},{"id":"lg-68","type":"lg","lvl":2,"q":"מה פירוש המילה 'לגונן' במשפט: 'האם גוננה על ילדיה מפני הסערה'?","o":["גינתה","הגנה","נזפה","הסתתרה"],"a":1,"ex":"'לגונן' פירושו להגן, לשמור מפני פגיעה."},{"id":"lg-69","type":"lg","lvl":3,"q":"טענה: 'אסור לסמוך על דבריו של המומחה בעניין הזה, כי הוא אדם יהיר ולא נעים.' מה הכשל בטענה?","o":["היא מבוססת על נתונים סטטיסטיים שגויים","היא תוקפת את אופיו של האדם במקום את טיעוניו","היא מכלילה ממקרה יחיד","היא מניחה מראש את מה שהיא מנסה להוכיח"],"a":1,"ex":"אופיו של הדובר אינו קובע אם דבריו נכונים; זהו טיעון נגד האדם במקום נגד הטענה."},{"id":"lg-70","type":"lg","lvl":5,"q":"בכפר יש שני סוגי תושבים: דוברי אמת, שתמיד אומרים אמת, ושקרנים, שתמיד משקרים. תושב אמר: 'אני ושכני שנינו שקרנים.' מה נובע בהכרח?","o":["הדובר שקרן ושכנו דובר אמת","שניהם שקרנים","שניהם דוברי אמת","הדובר דובר אמת ושכנו שקרן"],"a":0,"ex":"דובר אמת לא יכול לומר שהוא שקרן, ולכן הדובר שקרן ודבריו שקריים – לא שניהם שקרנים, ולכן השכן דובר אמת."},{"id":"lg-71","type":"lg","lvl":2,"q":"'כל מי שאוהב קריאה מבקר בספרייה.' איזה מהבאים מפריך את הטענה?","o":["גיא מבקר בספרייה ואינו אוהב קריאה","גיא אינו אוהב קריאה ואינו מבקר בספרייה","גיא אוהב קריאה ומבקר בספרייה כל יום","גיא אוהב קריאה ומעולם לא ביקר בספרייה"],"a":3,"ex":"רק מקרה של אוהב קריאה שאינו מבקר בספרייה סותר את הטענה."},{"id":"lg-72","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'הלך בתלם'?","o":["עבד בחקלאות","חרג מהדרך","נהג לפי המקובל ולא חרג מהכללים","פילס דרך חדשה"],"a":2,"ex":"התלם הוא הקו שחורש המחרשה; ההולך בו צועד בדרך שנקבעה מראש."},{"id":"lg-73","type":"lg","lvl":5,"q":"'לא ייתכן שגם דני וגם רינה ייבחרו.' ידוע שדני לא נבחר. מה נובע בהכרח?","o":["רינה נבחרה","רינה לא נבחרה","לא ניתן לקבוע אם רינה נבחרה","אף אחד מהם לא נבחר"],"a":2,"ex":"הכלל אוסר רק ששניהם ייבחרו יחד; כשדני לא נבחר, רינה יכולה להיבחר או לא."},{"id":"lg-74","type":"lg","lvl":3,"q":"מה פירוש המילה 'הרמטי'?","o":["פתוח למחצה","סגור לחלוטין, אטום","שקוף","גמיש"],"a":1,"ex":"כלי הרמטי סגור כך שאוויר ונוזלים אינם חודרים אליו."},{"id":"lg-75","type":"lg","lvl":1,"q":"אם היום יום שישי, מחר שבת. מחר אינו שבת. מה נובע בהכרח?","o":["היום אינו יום שישי","היום יום שישי","היום יום ראשון","מחר יום ראשון"],"a":0,"ex":"אילו היום היה יום שישי, מחר היה שבת; מחר אינו שבת – לכן היום אינו שישי."},{"id":"lg-76","type":"lg","lvl":4,"q":"טענה: 'בעבר לא היו טלפונים חכמים, ואנשים היו מאושרים יותר. לכן הטלפונים החכמים גרמו לירידה באושר.' איזה מהבאים מחליש את הטענה יותר מכול?","o":["רוב האנשים מחזיקים כיום בטלפון חכם","יצרני הטלפונים מרוויחים סכומים גדולים","אנשים מבלים שעות רבות מול המסך","באותה תקופה התרחשו שינויים רבים נוספים, כמו עלייה ביוקר המחיה, שעשויים להסביר את הירידה"],"a":3,"ex":"הצבעה על גורמים חלופיים באותה תקופה מערערת את הייחוס הבלעדי של הירידה לטלפונים."},{"id":"lg-77","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'דיבר אל הקיר'?","o":["דיבר בשקט רב","דיבר אל עצמו מתוך שמחה","נאם בפני קהל גדול","דיבר בלי שאיש הקשיב לו או התייחס לדבריו"],"a":3,"ex":"כמו קיר שאינו שומע, השומעים לא הגיבו לדבריו."},{"id":"lg-78","type":"lg","lvl":5,"q":"בצנצנת 10 סוכריות: 4 אדומות, 3 כחולות ו-3 צהובות. מהו המספר הקטן ביותר של סוכריות שיש להוציא בלי להסתכל, כדי להבטיח שיוצאו לפחות שתיים באותו צבע?","o":["3","5","4","7"],"a":2,"ex":"בגרוע ביותר, שלוש הראשונות יהיו בשלושה צבעים שונים; הסוכרייה הרביעית חייבת לחזור על אחד מהם."},{"id":"lg-79","type":"lg","lvl":4,"q":"'רק תלמידים מצטיינים זכאים למלגה.' איזה מהבאים נובע בהכרח?","o":["כל תלמיד מצטיין זכאי למלגה","כל מי שזכאי למלגה הוא תלמיד מצטיין","מי שאינו זכאי למלגה אינו מצטיין","יש תלמידים מצטיינים שאינם זכאים למלגה"],"a":1,"ex":"'רק' קובע שהצטיינות היא תנאי הכרחי לזכאות; היא אינה מבטיחה זכאות לכל מצטיין."},{"id":"lg-80","type":"lg","lvl":1,"q":"מה פירוש הביטוי 'לקח את הרגליים'?","o":["ברח והסתלק במהירות","התאמן בריצה","נפצע ברגליו","הלך לאט"],"a":0,"ex":"הביטוי העממי מתאר בריחה מהירה ממקום."},{"id":"lg-81","type":"lg","lvl":2,"q":"'לא כל הנוצץ זהב' – מה משמעות הפתגם?","o":["מראה חיצוני מרשים אינו מעיד בהכרח על ערך אמיתי","זהב הוא המתכת היקרה ביותר","יש להיזהר מגנבים","כדאי להשקיע בתכשיטים"],"a":0,"ex":"הפתגם מזהיר מפני שיפוט לפי ברק חיצוני בלבד."},{"id":"lg-82","type":"lg","lvl":4,"q":"טענה: 'אם נתיר לתלמידי כיתה ד' להשתמש במחשבון, בקרוב ירצו להשתמש בו בכל מבחן, ובסוף איש לא יידע לחשב בעצמו.' איזה כשל יש בטענה?","o":["היא תוקפת את מי שהציע את הרעיון","היא מבוססת על מדגם לא מייצג","היא מתעלמת מעלות המחשבונים","היא מניחה בלי ביסוס שצעד אחד יוביל בהכרח לשרשרת של תוצאות קיצוניות"],"a":3,"ex":"זהו כשל 'המדרון החלקלק': כל שלב בשרשרת מוצג כבלתי נמנע בלי הוכחה."},{"id":"lg-83","type":"lg","lvl":2,"q":"כל בעלי התפקידים בארגון עברו הדרכה. רון לא עבר הדרכה. מה נובע בהכרח?","o":["רון אינו חבר בארגון","רון יעבור הדרכה בקרוב","רון אינו בעל תפקיד בארגון","כל מי שעבר הדרכה הוא בעל תפקיד"],"a":2,"ex":"אילו רון היה בעל תפקיד, היה עובר הדרכה. ייתכן שהוא חבר בארגון בלי תפקיד."},{"id":"lg-84","type":"lg","lvl":5,"q":"שלושה ארגזים מסומנים 'תפוחים', 'תפוזים' ו'מעורב'. ידוע שכל התוויות שגויות. מוציאים פרי אחד מהארגז המסומן 'מעורב', והוא תפוח. מה יש בארגז המסומן 'תפוזים'?","o":["תפוזים בלבד","פירות מעורבים","תפוחים בלבד","לא ניתן לדעת"],"a":1,"ex":"הארגז 'מעורב' אינו מעורב, ולכן יש בו תפוחים בלבד. הארגז 'תפוזים' אינו תפוזים ואינו תפוחים – ולכן מעורב."},{"id":"lg-85","type":"lg","lvl":1,"q":"מה פירוש המילה 'מתון'?","o":["קיצוני","שקול ולא קיצוני","מהיר","חריף"],"a":1,"ex":"מתון הוא מי שנוקט עמדה מאוזנת, בלי קיצוניות."},{"id":"lg-86","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'יצא מכליו'?","o":["התרגז מאוד ואיבד שליטה","יצא מהבית בחיפזון","הצליח מעל למשוער","עזב את עבודתו"],"a":0,"ex":"הביטוי מתאר אדם שכעסו גלש מעבר לגבולות ההתנהגות הרגילה שלו."},{"id":"lg-87","type":"lg","lvl":4,"q":"חוקר טוען: 'אנשים שמתנדבים מאושרים יותר, ולכן ההתנדבות מגבירה את האושר.' איזה ממצא מחליש את הטענה יותר מכול?","o":["רוב המתנדבים מתנדבים פעם בשבוע","התנדבות נפוצה יותר בקרב צעירים","התנדבות מקובלת בתרבויות רבות","אנשים מאושרים נוטים מלכתחילה להתנדב יותר"],"a":3,"ex":"אם האושר קודם להתנדבות, כיוון הסיבתיות עשוי להיות הפוך מזה שהחוקר הניח."},{"id":"lg-88","type":"lg","lvl":2,"q":"כל הספרים במדף הזה כתובים בעברית. חלק מהספרים במדף הזה הם רומנים. מה נובע בהכרח?","o":["כל הרומנים כתובים בעברית","כל הספרים בעברית הם רומנים","יש רומנים בעברית","אין במדף ספרי עיון"],"a":2,"ex":"הרומנים שבמדף הם חלק מספרי המדף, וכולם בעברית – לכן יש רומנים בעברית."},{"id":"lg-89","type":"lg","lvl":5,"q":"בכל יום ראשון נערכת ישיבת צוות, אלא אם המנהלת בחופשה. כשנערכת ישיבת צוות, מוגש כיבוד. ביום ראשון האחרון לא הוגש כיבוד. בהנחה שהכללים תמיד מתקיימים, מה נובע בהכרח?","o":["הישיבה נערכה בלי כיבוד","המנהלת לא הייתה בחופשה","המנהלת הייתה בחופשה","הישיבה נדחתה ליום שני"],"a":2,"ex":"אין כיבוד, ולכן לא נערכה ישיבה; ביום ראשון ישיבה לא נערכת רק כשהמנהלת בחופשה."},{"id":"lg-90","type":"lg","lvl":1,"q":"מה פירוש הביטוי 'אור בקצה המנהרה'?","o":["סכנה מתקרבת","סימן לתקווה שהמצב הקשה עומד להסתיים","פתרון טכני לבעיית תאורה","סוף פתאומי ולא צפוי"],"a":1,"ex":"האור בקצה המנהרה מסמל את היציאה מהחושך – תקווה לסיום הקושי."},{"id":"lg-91","type":"lg","lvl":2,"q":"'אף אחד מהשחקנים לא נפצע.' איזה מהבאים סותר משפט זה?","o":["לפחות שחקן אחד נפצע","כל השחקנים סיימו את המשחק","המאמן נפצע","אף שחקן לא החמיץ אימון"],"a":0,"ex":"שלילת 'אף אחד לא' היא 'לפחות אחד כן'."},{"id":"lg-92","type":"lg","lvl":3,"q":"מה פירוש המילה 'פרגמטי'?","o":["חולמני","עקרוני ונוקשה","אכזרי","מעשי, המתמקד בתוצאות ובמה שאפשר לבצע"],"a":3,"ex":"פרגמטיות היא גישה מעשית, המעדיפה פתרונות ישימים על פני עקרונות מופשטים."},{"id":"lg-93","type":"lg","lvl":4,"q":"נתון: 'מי שמתאמן באופן קבוע אינו חולה בשפעת לעיתים קרובות.' עמרי אומר: 'אני חולה בשפעת לעיתים קרובות, ולכן אינני מתאמן באופן קבוע.' האם מסקנתו נובעת מהנתון?","o":["לא, זהו היפוך של התנאי","לא, כי ייתכן שהוא מתאמן ובכל זאת חולה לעיתים קרובות","רק אם הוא גם ישן מעט","כן, שכן אילו התאמן באופן קבוע, לא היה חולה לעיתים קרובות"],"a":3,"ex":"זו שלילת התוצאה, שהיא היסק תקף; האפשרות שמתאמן קבוע יחלה לעיתים קרובות סותרת את הנתון."},{"id":"lg-94","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'שפך את ליבו'?","o":["נבהל מאוד","התאהב","סיפר בגילוי לב על רגשותיו וצרותיו","כעס וצעק"],"a":2,"ex":"לשפוך את הלב פירושו לשתף אחר ברגשות פנימיים בכנות."},{"id":"lg-95","type":"lg","lvl":5,"q":"במסדרון חמישה חדרים בשורה, ממוספרים 1–5. המשרד בחדר 1, וחדר המורים צמוד אליו. הספרייה אינה בחדר 1 ואינה בחדר 5. המעבדה נמצאת בחדר שמספרו גדול ב-1 ממספר חדר הספרייה. המחסן אינו באחד מקצות המסדרון. באיזה חדר נמצאת המעבדה?","o":["4","5","3","2"],"a":1,"ex":"משרד – 1, מורים – 2. הספרייה ב-3 או ב-4. אם ב-3, המעבדה ב-4 והמחסן ב-5 (בקצה) – פסול. לכן הספרייה ב-4 והמעבדה ב-5."},{"id":"lg-96","type":"lg","lvl":1,"q":"כל הכדורים בקופסה כחולים או לבנים. שלפתי מהקופסה כדור שאינו כחול. מה צבעו?","o":["לבן","כחול","אדום","לא ניתן לדעת"],"a":0,"ex":"בקופסה יש רק כדורים כחולים ולבנים, ולכן כדור שאינו כחול הוא לבן."},{"id":"lg-97","type":"lg","lvl":3,"q":"טענה: 'הסרט הזה בוודאי יהיה טוב, כי הבמאי שלו ביים שני סרטים מצליחים.' מהי ההנחה הסמויה בטענה?","o":["הצלחת סרטים קודמים של במאי מנבאת את איכות סרטיו הבאים","כל סרטי הבמאי זכו בפרסים","הקהל אוהב סרטים ארוכים","הסרט יוקרן בבתי קולנוע רבים"],"a":0,"ex":"כדי להסיק מן העבר על הסרט החדש, יש להניח שהצלחה קודמת מעידה על הצלחה עתידית."},{"id":"lg-98","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'חרב פיפיות'?","o":["נשק עתיק ויקר","טיעון מנצח","פתרון מושלם","דבר שעלול לפגוע גם במי שמשתמש בו"],"a":3,"ex":"חרב פיפיות חדה משני צדדיה, ולכן עלולה לפגוע גם באוחז בה."},{"id":"lg-99","type":"lg","lvl":5,"q":"נתון: 'כל מי שהגיש בקשה עד מרץ קיבל תשובה עד מאי.' ונתון: 'חלק ממי שקיבלו תשובה עד מאי התקבלו ללימודים.' מה נובע בהכרח?","o":["יש מי שהגישו בקשה עד מרץ והתקבלו","כל מי שהתקבל הגיש בקשה עד מרץ","מי שלא קיבל תשובה עד מאי לא הגיש בקשה עד מרץ","מי שלא הגיש בקשה עד מרץ לא קיבל תשובה עד מאי"],"a":2,"ex":"מהנתון הראשון נובעת הקונטרה-פוזיטיב שלו. ייתכן שהמתקבלים הם דווקא כאלה שהגישו אחרי מרץ."},{"id":"lg-100","type":"lg","lvl":4,"q":"מה פירוש המילה 'נלוז'?","o":["נדיב","שפל ומושחת","עצוב","זריז"],"a":1,"ex":"'נלוז' פירושו עקום ומעוות במובן המוסרי – שפל."},{"id":"lg-101","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'השורה התחתונה'?","o":["הערת שוליים","העיקר, בסיכומו של דבר","סוף הרשימה בלבד","הפסד כספי"],"a":1,"ex":"השורה התחתונה היא המסקנה או התוצאה העיקרית של עניין."},{"id":"lg-102","type":"lg","lvl":4,"q":"כל המועמדים שעברו את הראיון עברו גם את המבחן הכתוב. חלק מהמועמדים לא עברו את המבחן הכתוב. מה נובע בהכרח?","o":["חלק מהמועמדים לא עברו את הראיון","כל המועמדים עברו את הראיון","מי שעבר את המבחן הכתוב עבר גם את הראיון","אף מועמד לא עבר את הראיון"],"a":0,"ex":"מי שלא עבר את המבחן הכתוב לא יכול היה לעבור את הראיון, ויש מועמדים כאלה."},{"id":"lg-103","type":"lg","lvl":5,"q":"מה פירוש הביטוי 'נחת זרועו'?","o":["עזרתו הנדיבה","עייפותו","שמחתו","כוחו המכביד או ידו המענישה"],"a":3,"ex":"'נחת' כאן היא מלשון ירידה – הזרוע היורדת על אדם, כלומר יד קשה ומענישה."},{"id":"lg-104","type":"lg","lvl":4,"q":"בעיר מסוימת עלה בשנה האחרונה מספר הדוחות על חנייה אסורה. ראש העירייה טוען שהסיבה היא שהתושבים נעשו פחות ממושמעים. איזה מהבאים מציע הסבר חלופי לעלייה?","o":["התושבים מתלוננים על מחסור בחנייה","מחיר הדוח לא השתנה","בשנה האחרונה הוכפל מספר הפקחים בעיר","רוב הדוחות ניתנו במרכז העיר"],"a":2,"ex":"יותר פקחים יכולים לתפוס יותר עבירות גם בלי שמספר העבירות עצמו עלה."},{"id":"lg-105","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'זו לא הכתובת'?","o":["המכתב אבד","אין לו מקום מגורים","לא אל הגורם הזה יש לפנות בעניין","הדבר אינו נכון"],"a":2,"ex":"הביטוי אומר שהפנייה הופנתה אל מי שאינו אחראי לעניין או אינו יכול לטפל בו."},{"id":"lg-106","type":"lg","lvl":3,"q":"אם המבנה יציב, הוא יאושר לאכלוס. אם המבנה יאושר לאכלוס, יחולקו מפתחות בחודש הבא. מפתחות לא חולקו בחודש הבא. מה נובע בהכרח?","o":["המבנה יציב אך לא אושר","המבנה אינו יציב","המבנה אושר לאכלוס","לא ניתן לדעת אם המבנה יציב"],"a":1,"ex":"בלי חלוקת מפתחות – אין אישור; בלי אישור – המבנה אינו יציב."},{"id":"lg-107","type":"lg","lvl":4,"q":"מה פירוש המילה 'אינהרנטי'?","o":["מובנה, טבוע במהותו של דבר","חיצוני ומקרי","זמני","מיובא מבחוץ"],"a":0,"ex":"תכונה אינהרנטית היא חלק בלתי נפרד מהדבר עצמו."},{"id":"lg-108","type":"lg","lvl":2,"q":"טענה: 'כולם עושים את זה, אז זה בוודאי בסדר.' מהו הכשל בטענה?","o":["פנייה לסמכותו של מומחה","הכללה ממקרה יחיד","תקיפה אישית של המתנגדים","הצגת דעת הרוב כהוכחה לנכונות"],"a":3,"ex":"העובדה שרבים נוהגים כך אינה מוכיחה שהדבר נכון או ראוי."},{"id":"lg-109","type":"lg","lvl":5,"q":"חלק מהמהנדסים בחברה הם גם מנהלים. אף מנהל בחברה אינו עובד במשמרת לילה. מה נובע בהכרח?","o":["אף מהנדס בחברה אינו עובד במשמרת לילה","כל המנהלים בחברה הם מהנדסים","חלק מהמהנדסים עובדים במשמרת לילה","יש מהנדסים בחברה שאינם עובדים במשמרת לילה"],"a":3,"ex":"המהנדסים שהם מנהלים אינם עובדים בלילה; על שאר המהנדסים לא ידוע דבר."},{"id":"lg-110","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'בין הפטיש לסדן'?","o":["בעבודה בנפחייה","בעמדה של כוח","במצב שבו לחצים מנוגדים פועלים עליו משני הצדדים","במקום בטוח ומוגן"],"a":2,"ex":"מה שמונח בין הפטיש לסדן נלחץ משני הכיוונים – מצב שאין ממנו מוצא נוח."},{"id":"lg-111","type":"lg","lvl":3,"q":"'הדלת נעולה אם ורק אם האזעקה מופעלת.' הדלת אינה נעולה. מה נובע בהכרח?","o":["האזעקה מופעלת","האזעקה אינה מופעלת","הדלת פתוחה לרווחה","לא ניתן לדעת"],"a":1,"ex":"'אם ורק אם' קושר את שני המצבים בשני הכיוונים, ולכן דלת לא נעולה פירושה אזעקה לא מופעלת."},{"id":"lg-112","type":"lg","lvl":4,"q":"טענה: 'בית הספר שלנו הוא הטוב בעיר, כי ממוצע הציונים בו הגבוה ביותר.' איזה מהבאים מחליש את הטענה יותר מכול?","o":["בית הספר מקבל רק תלמידים שהיו מצטיינים עוד לפני שהגיעו אליו","בבית הספר יש ספרייה גדולה","ההורים מרוצים מבית הספר","בית הספר נמצא במרכז העיר"],"a":0,"ex":"אם התלמידים הצטיינו מלכתחילה, הציונים הגבוהים אינם מעידים בהכרח על איכות ההוראה."},{"id":"lg-113","type":"lg","lvl":2,"q":"מה פירוש הביטוי 'לא הותיר מקום לספק'?","o":["הבהיר את הדבר באופן חד-משמעי","עורר שאלות רבות","השאיר את ההחלטה לאחרים","לא הותיר מקום לאורחים"],"a":0,"ex":"מי שאינו מותיר מקום לספק מציג דבר באופן ברור, שאי אפשר לפקפק בו."},{"id":"lg-114","type":"lg","lvl":4,"q":"במשחק חלים שני כללים: מי שבוחר באדום חייב לבחור גם בכחול; ואסור לבחור גם בכחול וגם בירוק. השחקן בחר בירוק. מה נובע בהכרח?","o":["השחקן בחר בכחול","השחקן בחר באדום","השחקן בחר באדום ולא בכחול","השחקן לא בחר באדום"],"a":3,"ex":"בחירה בירוק שוללת כחול, ובלי כחול אי אפשר לבחור באדום."},{"id":"lg-115","type":"lg","lvl":3,"q":"מה פירוש הפועל 'לנכס' במשפט: 'הוא ניכס לעצמו את ההצלחה'?","o":["לוותר על רכוש","לתת במתנה","לקחת דבר לעצמו כאילו היה שלו","לחלק בשווה"],"a":2,"ex":"לנכס פירושו להפוך דבר לנכס שלו, לעיתים שלא בצדק."},{"id":"lg-116","type":"lg","lvl":3,"q":"'מי שלא מסתכן – לא מרוויח.' איזה משפט קרוב לכך ביותר במשמעותו?","o":["יש להימנע מסיכונים בכל מחיר","כדי להשיג רווח יש להיות מוכנים לקחת סיכונים","רווח מגיע רק למי שמחכה בסבלנות","מי שמרוויח הרבה מסתכן פחות"],"a":1,"ex":"הפתגם קובע שהסיכון הוא תנאי להשגת רווח."},{"id":"lg-117","type":"lg","lvl":5,"q":"חוקרת טוענת שמכונית חשמלית מזהמת פחות ממכונית בנזין. איזה מהבאים, אם נכון, מחליש את הטענה יותר מכול?","o":["מכוניות חשמליות יקרות יותר","החשמל לטעינת המכוניות מופק בעיקר משריפת פחם, וייצור הסוללות מזהם מאוד","יש פחות עמדות טעינה מתחנות דלק","מכוניות חשמליות שקטות יותר"],"a":1,"ex":"אם הפקת החשמל וייצור הסוללות מזהמים, היתרון הסביבתי של המכונית החשמלית מצטמצם."},{"id":"lg-118","type":"lg","lvl":4,"q":"בכל יום גשום ליאור אינו רוכב על אופניים. בכל יום שבו ליאור אינו רוכב על אופניים, הוא נוסע באוטובוס. ביום רביעי ליאור לא נסע באוטובוס. מה נובע בהכרח?","o":["ביום רביעי לא ירד גשם","ביום רביעי ירד גשם","ביום רביעי ליאור לא רכב על אופניים","ליאור אינו נוסע באוטובוס בימים גשומים"],"a":0,"ex":"לא נסע באוטובוס – ולכן רכב על אופניים; רכב על אופניים – ולכן לא היה גשום."},{"id":"lg-119","type":"lg","lvl":5,"q":"נתון: 'כל מי שקיבל הזמנה נרשם לאירוע, וכל מי שנרשם לאירוע קיבל תג שם.' ידוע שהדס לא קיבלה תג שם. מה נובע בהכרח?","o":["הדס קיבלה הזמנה אך לא נרשמה","הדס נרשמה לאירוע","כל מי שלא קיבל הזמנה לא קיבל תג שם","הדס לא קיבלה הזמנה"],"a":3,"ex":"בלי תג שם – הדס לא נרשמה; ומי שלא נרשם לא קיבל הזמנה. הנתון אינו קובע דבר על מי שלא הוזמן."},{"id":"lg-120","type":"lg","lvl":3,"q":"מה פירוש הביטוי 'לבלוע את הצפרדע'?","o":["לאכול מאכל מוזר","לשתוק מתוך פחד","להשלים בעל כורחו עם דבר לא נעים","לנצח בוויכוח"],"a":2,"ex":"הביטוי מתאר קבלה של מצב או החלטה לא נעימים, משום שאין ברירה."}],"reading":[{"id":"rh-1","lvl":1,"title":"השינה כמעבדה של הזיכרון","text":"במשך דורות רבים נתפסה השינה כמצב של מנוחה פסיבית בלבד: הגוף שוכב ללא תנועה, החושים מתעמעמים, והמוח, כך סברו, מפסיק את פעילותו עד הבוקר. השקפה זו נראתה סבירה, שכן אדם ישן אינו מגיב לסביבתו ואינו זוכר בדרך כלל דבר ממה שהתרחש בשעות הלילה. אולם מחקרים שנערכו בעשורים האחרונים, ובהם מדידות של הפעילות החשמלית במוח, הראו תמונה שונה לחלוטין. במהלך השינה המוח אינו נח כלל; בשלבים מסוימים הוא פעיל כמעט כמו בשעות הערות, ולעיתים אף יותר.\n\nאחד התפקידים החשובים שמיוחסים כיום לשינה הוא גיבוש הזיכרון. במהלך היום אנו קולטים כמות עצומה של מידע, אך רובו נשמר תחילה באופן זמני ושברירי. בשעות השינה, כך מניחים החוקרים, המוח חוזר על דפוסי פעילות שהתרחשו בזמן הלמידה, ומעביר חלק מן המידע לאחסון יציב וארוך טווח. בניסויים שבהם התבקשו נבדקים ללמוד רשימת מילים או מיומנות מוטורית חדשה, אלה שישנו לאחר הלמידה זכרו את החומר טוב יותר מאלה שנשארו ערים במשך פרק זמן זהה. חשוב לציין שהשיפור לא נבע מעצם המנוחה: נבדקים שנחו בשקט במשך אותו זמן אך לא נרדמו לא הראו יתרון דומה. נראה אפוא שיש בשינה עצמה משהו מיוחד, ולא רק בהיעדר הסחות דעת.\n\nיתרה מזו, נראה שהשינה אינה רק שומרת על הזיכרונות אלא גם ממיינת אותם. המוח אינו מתייחס לכל פרט באופן שווה: מידע שנתפס כחשוב או כבעל משמעות רגשית נוטה להתחזק, ואילו פרטים שוליים נחלשים ונשכחים. יש חוקרים הסבורים שבזכות תהליך זה אנו מתעוררים לעיתים עם פתרון לבעיה שהטרידה אותנו בערב, משום שבמהלך הלילה נוצרו קשרים חדשים בין פיסות מידע שלא נראו קשורות זו לזו. במובן זה, השינה איננה רק ארכיון אלא גם סדנה.\n\nלממצאים אלה יש השלכות מעשיות. תלמידים רבים נוהגים לוותר על שעות שינה בלילה שלפני מבחן כדי להספיק לחזור על החומר, אך המחקר מרמז שהרגל זה עלול לפגוע דווקא במטרה שלשמה הוא נועד. מי שלומד שעות ארוכות ואינו ישן מספיק אולי צובר מידע רב, אך מונע מן המוח את הזמן הדרוש לו כדי לעבד ולקבע את מה שנלמד. ייתכן שלילה של שינה טובה הוא אחד מכלי הלמידה היעילים ביותר שעומדים לרשותנו, ודווקא משום שהוא אינו דורש כל מאמץ, קל לזלזל בו.","items":[{"id":"rh-1-1","lvl":1,"q":"מהו הרעיון המרכזי של הקטע?","o":["השינה היא מצב פסיבי שבו המוח נח עד הבוקר","השינה ממלאת תפקיד פעיל בעיבוד ובקיבוע של מידע שנלמד","תלמידים צריכים להקדיש יותר שעות ללמידה לפני מבחן","רגשות הם הגורם העיקרי המשפיע על איכות השינה"],"a":1,"ex":"הקטע כולו מפריך את תפיסת השינה כמנוחה פסיבית ומראה שבמהלכה המוח מגבש, ממיין ומקבע זיכרונות."},{"id":"rh-1-2","lvl":1,"q":"לפי הפסקה השנייה, מה מצאו הניסויים שנערכו בנבדקים?","o":["נבדקים שנשארו ערים זכרו רשימות מילים טוב יותר","מיומנויות מוטוריות אינן מושפעות כלל מן השינה","מי שישן לאחר הלמידה זכר את החומר טוב יותר ממי שנשאר ער","הפעילות החשמלית במוח פוחתת בזמן הלמידה"],"a":2,"ex":"בפסקה נאמר במפורש שנבדקים שישנו לאחר הלמידה זכרו את החומר טוב יותר מאלה שנשארו ערים פרק זמן זהה."},{"id":"rh-1-3","lvl":2,"q":"המילה ״שברירי״ בפסקה השנייה פירושה:","o":["חזק ויציב","רגיש ועלול להיפגע או להיעלם בקלות","מורכב ומסובך","נסתר ובלתי מודע"],"a":1,"ex":"המידע נשמר תחילה באופן זמני ושברירי, בניגוד לאחסון היציב שאליו הוא מועבר בשינה – כלומר הוא חלש ועלול לאבוד."},{"id":"rh-1-4","lvl":3,"q":"מה אפשר להסיק מן הפסקה השלישית?","o":["השינה עשויה לתרום גם לחשיבה יצירתית ולפתרון בעיות","כל הזיכרונות מתחזקים בשינה במידה שווה","זיכרונות בעלי משמעות רגשית נשכחים מהר במיוחד","פתרון בעיות אפשרי רק בשעות הערות"],"a":0,"ex":"הפסקה מתארת יצירת קשרים חדשים בין פיסות מידע ומתעוררות עם פתרון לבעיה – כלומר תרומה לחשיבה יצירתית."},{"id":"rh-1-5","lvl":2,"q":"מה תפקידה של הפסקה האחרונה בקטע?","o":["להציג ראיה נוספת לכך שהמוח פעיל בשינה","להפריך את ההשקפה שהוצגה בפסקה הראשונה","להסביר כיצד מודדים פעילות חשמלית במוח","להחיל את הממצאים על התנהגות יומיומית ולהזהיר מפני הרגל נפוץ"],"a":3,"ex":"הפסקה האחרונה עוברת מן המחקר אל המעשה: היא מזהירה תלמידים מפני ויתור על שינה לפני מבחן."}]},{"id":"rh-2","lvl":2,"title":"דרך המשי: יותר מנתיב מסחר","text":"הכינוי דרך המשי מעורר בדמיון תמונה של כביש אחד וארוך, שלאורכו נעו שיירות גמלים עמוסות בדים יקרים מסין אל ערי הים התיכון. בפועל, הכינוי עצמו נטבע רק במאה התשע־עשרה, והוא מתאר רשת סבוכה של נתיבים יבשתיים וימיים שהתפתחה במשך מאות שנים. מעטים מן הסוחרים עברו את הדרך כולה; רובם פעלו בקטע מוגבל, מכרו את סחורתם בעיר מסחר אחת וחזרו לביתם, והסחורה המשיכה הלאה בידי אחרים. כך עברה כל סחורה ידיים רבות עד שהגיעה ליעדה, ומחירה עלה בכל תחנה.\n\nגם המשי עצמו היה רק אחד ממוצרים רבים. לאורך הנתיבים נסחרו תבלינים, אבנים יקרות, נייר, כלי חרס, סוסים ומתכות. יתרה מזו, הסחורה לא זרמה בכיוון אחד בלבד: זכוכית ומטבעות כסף נעו מזרחה, ואילו בדים ותה נעו מערבה. כל עיר בדרך הייתה צומת שבו נפגשו סוחרים מתרבויות שונות, וחלק מן הערים התעשרו מאוד מגביית מסים ומאספקת שירותים לשיירות העוברות – מקום לינה, מזון, מים ושומרים. ערים כאלה צמחו לעיתים במקומות שוממים, לצד נווה מדבר או מעבר הרים, ושגשוגן היה תלוי כולו בתנועה שעברה בהן. כאשר השתנו הנתיבים, בשל מלחמה, חילופי שלטון או גילוי דרך ימית נוחה יותר, נותרו חלק מן הערים ריקות, ושרידיהן נחשפים כיום בחפירות ארכאולוגיות.\n\nואולם ההשפעה העמוקה ביותר של הרשת לא הייתה כלכלית. יחד עם הסחורות נדדו רעיונות, אמונות, שפות וטכנולוגיות. דתות התפשטו לאורך הנתיבים והגיעו לאזורים מרוחקים ממקום הולדתן; שיטות לייצור נייר עברו ממזרח אסיה אל המזרח התיכון ומשם לאירופה; ומתכונים, כלי נגינה וסגנונות אמנות קיבלו צורות חדשות בכל מקום שאליו הגיעו. אפשר לומר שהסוחרים, מבלי שהתכוונו לכך, שימשו שליחים של תרבות. גם מילים עברו בדרך זו, וכמה מהן משמשות עד היום בשפות רחוקות זו מזו.\n\nעם זאת, הנתיבים לא הפיצו רק דברים מועילים. מגפות קשות נישאו אף הן לאורכם, ופגעו באוכלוסיות שלא הייתה להן כל חסינות מפניהן. הפתיחות שאפשרה חילופי ידע הייתה גם פתח לסכנה. ההיסטוריונים רואים היום בדרך המשי דוגמה מוקדמת לתופעה שאנו מכנים גלובליזציה, על יתרונותיה ועל מחיריה כאחד: עולם שבו מה שקורה במקום אחד משפיע, במוקדם או במאוחר, על מקומות רחוקים ממנו.","items":[{"id":"rh-2-1","lvl":1,"q":"מהו הרעיון המרכזי של הקטע?","o":["סוחרים בודדים עברו את כל הדרך מסין אל הים התיכון","המשי היה המוצר החשוב היחיד שנסחר בדרך","דרך המשי הייתה רשת מורכבת שהשפעתה חרגה בהרבה מן הסחר במשי","מגפות היו התוצאה העיקרית של דרך המשי"],"a":2,"ex":"הקטע מתאר את דרך המשי כרשת של נתיבים שהעבירה סחורות רבות, ובעיקר רעיונות, טכנולוגיות ואף מגפות."},{"id":"rh-2-2","lvl":1,"q":"לפי הקטע, הכינוי דרך המשי:","o":["נטבע בידי הסוחרים הסינים עצמם","נטבע רק במאה התשע־עשרה","מתאר כביש יבשתי יחיד","שימש את השליטים לגביית מסים"],"a":1,"ex":"בפסקה הראשונה נאמר במפורש שהכינוי נטבע רק במאה התשע־עשרה."},{"id":"rh-2-3","lvl":2,"q":"מה תפקידה של הפסקה הראשונה?","o":["לתקן תפיסה מוטעית נפוצה לגבי אופייה של דרך המשי","לתאר את חיי היומיום של הסוחרים","לפרט את המוצרים שנסחרו לאורך הדרך","להשוות בין נתיבים יבשתיים לנתיבים ימיים"],"a":0,"ex":"הפסקה פותחת בתמונה הדמיונית של כביש אחד ומיד מתקנת אותה: מדובר ברשת סבוכה, ומעטים עברו את כולה."},{"id":"rh-2-4","lvl":2,"q":"הביטוי ״שליחים של תרבות״ בפסקה השלישית מציין ש־:","o":["הסוחרים נשלחו בידי שליטים כדי להפיץ את דתם","הסוחרים עסקו בעיקר במסחר ביצירות אמנות","הסוחרים התנגדו להשפעות תרבותיות זרות","הסוחרים העבירו רעיונות ומנהגים ממקום למקום, גם בלי כוונה"],"a":3,"ex":"הביטוי מופיע לצד המילים מבלי שהתכוונו לכך – כלומר, הסוחרים הפיצו תרבות כתוצאת לוואי של המסחר."},{"id":"rh-2-5","lvl":3,"q":"מהי עמדת הכותב כלפי דרך המשי?","o":["התלהבות בלתי מסויגת","ביקורת חריפה על נזקיה","הערכה מאוזנת המכירה הן ביתרונותיה והן במחיריה","אדישות"],"a":2,"ex":"הכותב מדגיש את חילופי הידע אך גם את התפשטות המגפות, ומסכם בעל יתרונותיה ועל מחיריה כאחד."}]},{"id":"rh-3","lvl":3,"title":"כוחם של הקשרים החלשים","text":"כשאנו חושבים על האנשים שמשפיעים על חיינו, אנו נוטים לחשוב על בני משפחה ועל חברים קרובים. אלה הם הקשרים החזקים שלנו: אנשים שאנו פוגשים לעיתים קרובות, שאנו סומכים עליהם ושחולקים איתנו עולם של ערכים ושל הרגלים. טבעי להניח שמהם יגיעו גם ההזדמנויות החשובות ביותר בחיינו. ואולם מחקרים סוציולוגיים שבחנו כיצד אנשים מוצאים עבודה העלו ממצא מפתיע: חלק ניכר מן המשרות לא הושג באמצעות חברים קרובים, אלא באמצעות מכרים רחוקים, כגון חבר לשעבר מהלימודים או שכן שמחליפים איתו מילים ספורות במעלית.\n\nההסבר לכך נעוץ במבנה הרשתות החברתיות. החברים הקרובים שלנו מכירים בדרך כלל זה את זה, נעים באותם מעגלים ונחשפים לאותו מידע. משום כך, מה שהם יודעים דומה מאוד למה שאנו כבר יודעים. המכרים הרחוקים, לעומת זאת, משתייכים למעגלים אחרים. הם משמשים מעין גשרים בין קבוצות שאחרת לא היו באות במגע, ודרכם עשוי להגיע אלינו מידע חדש לגמרי – על משרה פנויה, על רעיון עסקי או על אפשרות שלא שמענו עליה. ככל שמעגל המכרים של אדם רחב ומגוון יותר, כך גדל הסיכוי שאחד מהם יחזיק בפיסת מידע חיונית.\n\nלתובנה זו יש השלכות החורגות מעולם התעסוקה. חברה שבה אנשים מקיימים קשרים רק בתוך הקבוצה הקרובה להם עלולה להיות מפולגת, ומידע ורעיונות יתקשו לעבור בה מקבוצה לקבוצה. קשרים חלשים רבים, לעומת זאת, יוצרים רקמה חברתית שבה חדשנות מתפשטת במהירות, ושבה קבוצות שונות מכירות זו את זו לפחות במידה מסוימת. גם בתוך ארגונים נצפתה תופעה דומה: עובדים המקיימים קשרים עם מחלקות אחרות נוטים להעלות רעיונות חדשים יותר מעמיתיהם, שכן הם נחשפים לבעיות ולפתרונות שאינם מוכרים בסביבתם הקרובה. במובן זה, הקשרים החלשים אינם רק ערוץ למידע, אלא גם מקור להשראה.\n\nאין בכך כדי להמעיט בחשיבותם של הקשרים החזקים. בעתות משבר אנו פונים בדרך כלל אל הקרובים לנו, והם שמעניקים לנו תמיכה רגשית ועזרה מעשית. אך מי שמסתפק בהם בלבד עלול לגלות שעולמו מצטמצם. נראה שהרשת החברתית הבריאה ביותר היא זו המשלבת בין עומק לרוחב: מעט קשרים קרובים ויציבים, לצד מעגל רחב של היכרויות שטחיות יותר. השיחה הקצרה עם השכן במעלית, כך מתברר, איננה בזבוז זמן.","items":[{"id":"rh-3-1","lvl":2,"q":"מהו הרעיון המרכזי של הקטע?","o":["לקשרים חלשים יש תפקיד חשוב, שונה מזה של הקשרים החזקים, בהעברת מידע והזדמנויות","חברים קרובים חשובים פחות ממכרים רחוקים בכל תחום","רוב האנשים מוצאים עבודה דרך בני משפחתם","חברה מפולגת היא חברה חדשנית יותר"],"a":0,"ex":"הקטע מסביר כיצד מכרים רחוקים מביאים מידע חדש, ובסופו מדגיש שגם לקשרים החזקים יש ערך משלהם."},{"id":"rh-3-2","lvl":2,"q":"לפי הפסקה השנייה, מדוע מידע שמגיע מחברים קרובים מועיל פחות לעיתים?","o":["משום שחברים קרובים נוטים להסתיר מידע","משום שהם נחשפים לאותו מידע שאנו כבר מכירים","משום שאנו פוגשים אותם לעיתים רחוקות","משום שאינם מעוניינים בהצלחתנו"],"a":1,"ex":"החברים הקרובים נעים באותם מעגלים ונחשפים לאותו מידע, ולכן מה שהם יודעים דומה למה שאנו כבר יודעים."},{"id":"rh-3-3","lvl":1,"q":"המילה ״גשרים״ בפסקה השנייה משמשת לתיאור:","o":["מבנים פיזיים המחברים בין שכונות","מכשולים בדרך להשגת מידע","אנשים המקשרים בין קבוצות חברתיות נפרדות","ויכוחים בין חברים"],"a":2,"ex":"זהו שימוש מטפורי: המכרים הרחוקים מחברים בין קבוצות שאחרת לא היו באות במגע."},{"id":"rh-3-4","lvl":3,"q":"מה תפקידה של הפסקה האחרונה?","o":["להביא ראיה נוספת ליתרונם של הקשרים החלשים","להסתייג ולהבהיר שגם לקשרים החזקים יש ערך חשוב","לתאר את תוצאות מחקר התעסוקה","לטעון שקשרים חזקים מזיקים בעתות משבר"],"a":1,"ex":"הפסקה נפתחת במילים אין בכך כדי להמעיט – זוהי הסתייגות המאזנת את הטיעון ומציגה את ערכם של הקשרים החזקים."},{"id":"rh-3-5","lvl":4,"q":"איזו מן הטענות הבאות מתיישבת בצורה הטובה ביותר עם הנאמר בקטע?","o":["אדם שמצמצם את קשריו למשפחתו בלבד יקבל יותר מידע חדש","מכרים רחוקים הם המקור העיקרי לתמיכה רגשית","ככל שקבוצה סגורה יותר, כך מתפשטת בה חדשנות מהר יותר","אדם שהצטרף לכמה חוגים ומעגלים שונים צפוי להיחשף ליותר הזדמנויות"],"a":3,"ex":"לפי הקטע, היכרויות במעגלים שונים יוצרות גשרים למידע חדש; שאר הטענות סותרות את הנאמר."}]},{"id":"rh-4","lvl":2,"title":"פרדוקס הבחירה","text":"בתרבות המערבית רווחת ההנחה שחופש בחירה הוא ערך עליון, ושככל שעומדות לפנינו אפשרויות רבות יותר, כך גדל הסיכוי שנמצא את מה שמתאים לנו בדיוק. ההיגיון נראה פשוט: מי שיכול לבחור מבין שלושים סוגי ריבה ימצא בוודאי סוג שיתאים לטעמו יותר מאשר מי שיכול לבחור רק מבין שלושה. אולם סדרה של ניסויים פסיכולוגיים מעלה ספק בהנחה זו. גם כלכלנים רבים הניחו במשך שנים שהוספת אפשרויות אינה יכולה להזיק: במקרה הגרוע, האדם פשוט יתעלם ממה שאינו רלוונטי לו.\n\nבאחד הניסויים המוכרים בתחום הוצב בחנות דוכן טעימות. בימים מסוימים הוצע בו מגוון רחב של טעמים, ובימים אחרים מבחר מצומצם. הדוכן הגדול משך אמנם יותר עוברים ושבים, אך דווקא מן הדוכן הקטן יצאו יותר אנשים שקנו בפועל. נראה שמבחר גדול מדי מקשה על קבלת החלטה, ולעיתים מוביל אנשים לוותר על הבחירה כליל. תופעה זו זכתה לכינוי עומס בחירה. יש לציין שממצאי הניסוי לא שוחזרו בכל המחקרים שנערכו בעקבותיו, ונראה שעוצמת התופעה תלויה בנסיבות: עד כמה האדם יודע מראש מה הוא מחפש, עד כמה קל להשוות בין האפשרויות, וכמה זמן עומד לרשותו.\n\nהקושי אינו מסתכם ברגע ההחלטה. גם מי שכבר בחר מתוך מבחר עצום נוטה להיות פחות מרוצה מבחירתו. כאשר האפשרויות רבות, קל לדמיין שאחת מן החלופות שנדחו הייתה טובה יותר, והמחשבה על מה שהוחמץ מעיבה על ההנאה ממה שנבחר. בנוסף, ריבוי האפשרויות מעלה את הציפיות: אם יש כל כך הרבה מבחר, הבחירה הנכונה אמורה להיות מושלמת, וכל פגם בה נחווה כאכזבה – ולעיתים אף כאשמה אישית, שהרי אפשר היה לבחור אחרת.\n\nאין להסיק מכך שהחופש לבחור הוא דבר שלילי. מחסור באפשרויות גורם בוודאי לתסכול ולתחושת חוסר אונים. נראה שהשאלה אינה אם לבחור, אלא מתוך כמה. יש הממליצים להגביל מראש את מספר החלופות שאנו שוקלים, או להסתפק באפשרות שהיא טובה דיה במקום לחפש בכל מחיר את הטובה ביותר. גישה כזו, כך מתברר, אינה פוגעת בהכרח באיכות ההחלטות, והיא חוסכת זמן רב ועוגמת נפש לא מעטה. לעיתים, דווקא ויתור מודע על חלק מן האפשרויות הוא שמאפשר לנו ליהנות ממה שבחרנו.","items":[{"id":"rh-4-1","lvl":1,"q":"מהו הרעיון המרכזי של הקטע?","o":["חופש הבחירה הוא ערך שלילי שיש לצמצם ככל האפשר","דוכני טעימות גדולים מוכרים יותר מדוכנים קטנים","ריבוי אפשרויות בחירה עלול לפגוע ביכולת להחליט ובשביעות הרצון מן ההחלטה","אנשים מעדיפים תמיד מבחר מצומצם"],"a":2,"ex":"הקטע מתאר את עומס הבחירה ואת הירידה בשביעות הרצון, ומסתייג מן המסקנה שחופש בחירה הוא שלילי."},{"id":"rh-4-2","lvl":1,"q":"לפי הפסקה השנייה, מה הייתה תוצאת הניסוי בדוכן הטעימות?","o":["הדוכן הגדול משך פחות עוברים ושבים","יותר אנשים קנו בפועל לאחר שטעמו מן הדוכן המצומצם","מספר הקונים היה זהה בשני המקרים","הדוכן הקטן משך יותר עוברים ושבים"],"a":1,"ex":"הדוכן הגדול משך יותר אנשים, אך דווקא מן הדוכן הקטן יצאו יותר קונים."},{"id":"rh-4-3","lvl":2,"q":"לפי הפסקה השלישית, מדוע מי שבחר מתוך מבחר עצום נוטה להיות פחות מרוצה?","o":["משום שמוצרים במבחר גדול איכותיים פחות","משום שהוא מתחרט על הכסף שהוציא","משום שאנשים אחרים מבקרים את בחירתו","משום שהוא חושב על החלופות שדחה ומצפה שהבחירה תהיה מושלמת"],"a":3,"ex":"הפסקה מציינת שני גורמים: המחשבה על מה שהוחמץ, והציפייה המוגברת לבחירה מושלמת."},{"id":"rh-4-4","lvl":2,"q":"הביטוי ״טובה דיה״ בפסקה האחרונה פירושו:","o":["הטובה ביותר מכל האפשרויות","מספקת את הצרכים, גם אם אינה מושלמת","גרועה מן הממוצע","יקרה במיוחד"],"a":1,"ex":"הביטוי מוצג בניגוד לחיפוש אחר הטובה ביותר – כלומר אפשרות שעונה על הצורך בלי להיות מושלמת."},{"id":"rh-4-5","lvl":3,"q":"מה תפקידה של הפסקה האחרונה?","o":["להסתייג מהכללה גורפת ולהציע דרך מעשית להתמודד עם הבעיה","להציג ניסוי נוסף התומך בממצאים","לטעון שאין פתרון לבעיית עומס הבחירה","לחזור על ממצאי הניסוי בדוכן"],"a":0,"ex":"הפסקה מבהירה שאין להסיק שחופש הבחירה שלילי, ומציעה להגביל חלופות או להסתפק באפשרות טובה דיה."}]},{"id":"rh-5","lvl":4,"title":"המצאת הפרספקטיבה","text":"למתבונן בן זמננו נראה מובן מאליו שבציור של רחוב, הבתים הרחוקים יהיו קטנים מן הקרובים, והקווים של המדרכה ייפגשו בנקודה אחת באופק. אולם הפרספקטיבה הלינארית – השיטה הגאומטרית ליצירת אשליה של עומק על משטח שטוח – לא הייתה תמיד חלק מן השפה האמנותית. במשך מאות שנים ציירו אמנים באירופה דמויות ומבנים שגודלם נקבע לפי חשיבותם ולא לפי מרחקם: הדמות הקדושה הוצגה גדולה מכולן, גם אם עמדה ברקע. אין זה אומר שהאמנים לא הבחינו בכך שעצמים רחוקים נראים קטנים; הם פשוט לא ראו בכך עיקרון שהציור חייב לציית לו.\n\nבמאה החמש־עשרה, בערי איטליה, ניסחו אדריכלים וציירים כללים מתמטיים שאפשרו לתאר את המרחב כפי שהוא נראה לעין מנקודת מבט אחת. השיטה התבססה על קווים מקבילים המתכנסים אל נקודת מגוז, ועל חישוב יחסי של גדלים. התוצאה הייתה מהפכנית: התמונה הפכה למעין חלון שדרכו מביט הצופה אל עולם אחר, עקבי ומסודר. אמנים התחרו ביניהם ביצירת אשליות מרשימות של עומק, כגון תקרות שנראו כאילו הן נפתחות אל השמים, או רצפות משובצות המתרחקות אל עומק התמונה. השליטה בשיטה נחשבה סימן למיומנות ולהשכלה, והיא נלמדה בסדנאות כחלק בלתי נפרד מהכשרתו של כל צייר.\n\nואולם יש לזכור שהפרספקטיבה אינה העתקה ניטרלית של המציאות. היא מניחה צופה יחיד, הניצב במקום קבוע ומביט בעין אחת ללא תנועה – מצב שאינו דומה כלל לאופן שבו אנו רואים בפועל, בשתי עיניים ובתנועה מתמדת. במובן זה, הפרספקטיבה היא מוסכמה, לא פחות מן המוסכמות שקדמו לה. יתרה מזו, היא העמידה במרכז את נקודת מבטו של היחיד, ויש הרואים בכך ביטוי לתפיסת עולם שהלכה והתגבשה באותה תקופה, ושבה האדם היחיד נתפס כמרכז ההתבוננות.\n\nלא מפתיע אפוא שאמנים מאוחרים יותר בחרו לפרק את השיטה. במאה העשרים הציגו ציירים אחדים אובייקט מכמה זוויות בעת ובעונה אחת, ושברו את האשליה של חלון אחיד. מבקרים רבים ראו בכך תחילה כישלון טכני, אך בדיעבד התברר שהיה זה ניסיון מכוון לבטא אמת אחרת על הראייה: שאנו קולטים את העולם בשברים, ברצף של מבטים, ולא בתמונה קפואה אחת. מה שנראה כחזרה לאחור היה, במידה רבה, צעד קדימה.","items":[{"id":"rh-5-1","lvl":2,"q":"מהי הטענה המרכזית של הקטע?","o":["הפרספקטיבה הלינארית היא השיטה המדויקת ביותר לתיאור המציאות","הפרספקטיבה הלינארית היא מוסכמה היסטורית ולא שיקוף ניטרלי של הראייה","ציירי התקופות הקודמות לא ידעו לצייר עומק","אמני המאה העשרים נכשלו מבחינה טכנית"],"a":1,"ex":"הקטע מתאר את הולדת הפרספקטיבה, מדגיש שהיא מוסכמה הנשענת על הנחות מסוימות, ומראה כיצד פורקה בהמשך."},{"id":"rh-5-2","lvl":1,"q":"לפי הפסקה הראשונה, לפני המאה החמש־עשרה נקבע גודלן של הדמויות בציור לפי:","o":["מרחקן מן הצופה","מיקומה של נקודת המגוז","גודלן במציאות","חשיבותן"],"a":3,"ex":"נאמר במפורש שגודלן נקבע לפי חשיבותם ולא לפי מרחקם, כמו הדמות הקדושה שהוצגה גדולה מכולן."},{"id":"rh-5-3","lvl":3,"q":"המילה ״מוסכמה״ בפסקה השלישית פירושה:","o":["כלל מקובל שנקבע בהסכמה, אף שאינו הכרחי מטבעו","חוק טבע שאין לו חלופה","טעות שיש לתקן","טכניקה ששימשה אדריכלים בלבד"],"a":0,"ex":"הכותב טוען שהפרספקטיבה אינה העתק של הראייה הממשית אלא דרך מקובלת לייצג אותה – כמו השיטות שקדמו לה."},{"id":"rh-5-4","lvl":4,"q":"מה אפשר להסיק מן הפסקה השלישית על הקשר בין אמנות לבין התקופה שבה היא נוצרת?","o":["אמנות אינה מושפעת כלל מרעיונות התקופה","רק אדריכלים השפיעו על תפיסות העולם של התקופה","סגנון אמנותי עשוי לשקף תפיסת עולם רחבה של התקופה שבה נוצר","תפיסת היחיד כמרכז ההתבוננות נולדה במאה העשרים"],"a":2,"ex":"הפסקה קושרת בין העמדת נקודת המבט של היחיד במרכז לבין תפיסת עולם שהתגבשה באותה תקופה."},{"id":"rh-5-5","lvl":4,"q":"מהי עמדת הכותב כלפי אמני המאה העשרים שפירקו את הפרספקטיבה?","o":["ביקורת על חוסר המיומנות שלהם","אדישות","הבנה ואהדה לניסיונם לבטא אמת אחרת על הראייה","לעג לניסיונותיהם"],"a":2,"ex":"הכותב דוחה את הפרשנות של כישלון טכני ומסכם שמה שנראה כחזרה לאחור היה צעד קדימה."}]},{"id":"rh-6","lvl":3,"title":"כסף כאמנה חברתית","text":"שטר של מאה שקלים הוא, מבחינה חומרית, פיסת נייר או פלסטיק שעלות ייצורה זעומה. ובכל זאת, אנשים מוכנים לעבוד שעות ארוכות כדי לקבל שטרות כאלה, ובעלי חנויות מוסרים תמורתם מזון, בגדים ומכשירים. מה מעניק לפיסת הנייר הזאת את ערכה? התשובה שמציעים כלכלנים רבים היא פשוטה ומפתיעה בעת ובעונה אחת: ערכו של הכסף נשען על אמון. שהרי אין לשטר כל ערך אם אנשים אחרים לא יסכימו לקבל אותו.\n\nבעבר נהוג היה לגבות את הכסף בסחורה ממשית. מטבעות עשויים זהב או כסף היו בעלי ערך עצמי, ובתקופות מאוחרות יותר ניתן היה, לפחות להלכה, להמיר שטרות בכמות קבועה של מתכת יקרה. ואולם רוב המדינות נטשו זה מכבר את השיטה הזאת. הכסף שבידינו כיום אינו מובטח בדבר מלבד ההסכמה הרחבה שהוא שווה משהו – והאמונה שהמדינה והבנק המרכזי ינהלו אותו באחריות. יש בכך יתרון: כמות הכסף אינה מוגבלת עוד בכמות המתכת שבמרתפי המדינה, וניתן להתאים אותה לצורכי הכלכלה. אך יש בכך גם סיכון, שכן מה שנשען על הסכמה עלול להתערער כאשר ההסכמה נחלשת.\n\nלעיתים, אמון זה מתערער. כאשר ממשלה מדפיסה כסף בכמויות גדולות כדי לממן את הוצאותיה, הציבור עלול לחשוש שערך המטבע ירד. החשש עצמו גורם לאנשים למהר ולהיפטר מן הכסף, לקנות סחורות או להמיר את המטבע במטבע זר – והתנהגות זו מאיצה עוד יותר את עליית המחירים. כך עלול להיווצר סחרור שבו הציפייה להתרחשות היא שמביאה להתרחשותה. ההיסטוריה הכלכלית מכירה מקרים שבהם מחירים הוכפלו בתוך ימים ספורים, ואנשים נשאו את משכורתם בשקים. במצבים כאלה חוזרים אנשים לעיתים לסחר חליפין,
