ת כאח/ות בבית חולים בחיפה, בעיקר במשמרות לילה.","ru":"Я работаю медсестрой в больнице в Хайфе, в основном в ночные смены.","ar":"أعمل في التمريض في مستشفى في حيفا، غالبًا في المناوبات الليلية."},{"q":"How long have you lived in this neighborhood?","en":"About three years now, and I really like how quiet and green it is.","he":"בערך שלוש שנים, ואני מאוד אוהב/ת כמה שקט וירוק כאן.","ru":"Уже около трёх лет, и мне очень нравится, как здесь тихо и зелено.","ar":"منذ حوالي ثلاث سنوات، وأحب كثيرًا كم هو هادئ وأخضر."},{"q":"What do you usually do on the weekends?","en":"I usually go hiking with friends, and on Saturday evenings I visit my parents.","he":"בדרך כלל אני יוצא/ת לטיולים עם חברים, ובמוצאי שבת אני מבקר/ת את ההורים שלי.","ru":"Обычно я хожу в походы с друзьями, а по субботним вечерам навещаю родителей.","ar":"عادةً أذهب للتنزه مع الأصدقاء، وفي مساء السبت أزور والديّ."},{"q":"Where did you grow up?","en":"I grew up in a small town in the north, but I moved to Tel Aviv for university.","he":"גדלתי בעיירה קטנה בצפון, אבל עברתי לתל אביב בשביל האוניברסיטה.","ru":"Я вырос/выросла в маленьком городке на севере, но переехал(а) в Тель-Авив ради университета.","ar":"نشأت في بلدة صغيرة في الشمال، لكنني انتقلت إلى تل أبيب للدراسة في الجامعة."},{"q":"Do you have any hobbies?","en":"Yes, I've been learning the guitar for about a year, though I'm still pretty bad at it.","he":"כן, אני לומד/ת גיטרה כבר בערך שנה, אם כי אני עדיין די גרוע/ה בזה.","ru":"Да, я учусь играть на гитаре уже около года, хотя у меня пока получается не очень.","ar":"نعم، أتعلم العزف على الغيتار منذ حوالي سنة، مع أنني ما زلت سيئًا فيه نوعًا ما."},{"q":"It was really nice meeting you. Are you on WhatsApp?","en":"Nice meeting you too, let me give you my number so we can stay in touch.","he":"גם לי היה נעים להכיר, בוא/י אתן לך את המספר שלי כדי שנשמור על קשר.","ru":"Мне тоже было приятно познакомиться, давай я дам тебе свой номер, чтобы мы были на связи.","ar":"تشرفت بمعرفتك أيضًا، دعني أعطيك رقمي لنبقى على تواصل."}]},{"en":"at a restaurant","he":"במסעדה","ru":"в ресторане","ar":"في المطعم","e":"🍽️","dialog":true,"items":[{"q":"Good evening! Do you have a reservation?","en":"Yes, we booked a table for four under the name Cohen for eight o'clock.","he":"כן, הזמנו שולחן לארבעה על השם כהן לשעה שמונה.","ru":"Да, мы забронировали столик на четверых на имя Коэн на восемь часов.","ar":"نعم، حجزنا طاولة لأربعة أشخاص باسم كوهين للساعة الثامنة."},{"q":"Are you ready to order, or do you need a few more minutes?","en":"I think we're ready, but could you tell us which dishes are vegetarian first?","he":"אני חושב/ת שאנחנו מוכנים, אבל קודם תוכל/י להגיד לנו אילו מנות צמחוניות?","ru":"Думаю, мы готовы, но сначала не подскажете, какие блюда вегетарианские?","ar":"أعتقد أننا جاهزون، لكن هل يمكنك أن تخبرنا أولًا أي الأطباق نباتية؟"},{"q":"How would you like your steak cooked?","en":"Medium, please, and could I have a salad instead of the fries on the side?","he":"מדיום, בבקשה, ואפשר לקבל סלט במקום צ'יפס בתוספת?","ru":"Средней прожарки, пожалуйста, и можно салат вместо картошки фри на гарнир?","ar":"متوسط النضج من فضلك، وهل يمكنني الحصول على سلطة بدل البطاطا المقلية كطبق جانبي؟"},{"q":"Is everything all right with your meal?","en":"Actually, I ordered the fish, but the waiter brought me chicken by mistake.","he":"בעצם, הזמנתי דג, אבל המלצר הביא לי עוף בטעות.","ru":"Вообще-то я заказывал(а) рыбу, но официант по ошибке принёс мне курицу.","ar":"في الحقيقة طلبت السمك، لكن النادل أحضر لي الدجاج بالخطأ."},{"q":"I'm so sorry about that. Should I bring you the right dish?","en":"Yes, please, but if it takes too long, I'd rather just cancel it.","he":"כן, בבקשה, אבל אם זה ייקח יותר מדי זמן, אני מעדיף/ה פשוט לבטל.","ru":"Да, пожалуйста, но если это займёт слишком много времени, я лучше просто отменю заказ.","ar":"نعم من فضلك، لكن إذا استغرق وقتًا طويلًا فأفضّل أن ألغيه."},{"q":"Can I get you anything else, maybe dessert or coffee?","en":"No thanks, we're full, so could we just have the check and pay separately?","he":"לא תודה, אנחנו מלאים, אז אפשר פשוט את החשבון ולשלם בנפרד?","ru":"Нет, спасибо, мы сыты, так что можно просто счёт и заплатить раздельно?","ar":"لا شكرًا، شبعنا، فهل يمكننا الحصول على الحساب والدفع كلٌّ على حدة؟"}]},{"en":"shopping and returns","he":"קניות והחזרות","ru":"покупки и возвраты","ar":"التسوق والإرجاع","e":"🛍️","dialog":true,"items":[{"q":"Hi there, can I help you find something?","en":"I'm looking for a warm winter jacket, preferably something waterproof and not too heavy.","he":"אני מחפש/ת מעיל חורף חם, רצוי משהו עמיד למים ולא כבד מדי.","ru":"Я ищу тёплую зимнюю куртку, желательно непромокаемую и не слишком тяжёлую.","ar":"أبحث عن معطف شتوي دافئ، ويفضّل أن يكون مقاومًا للماء وليس ثقيلًا جدًا."},{"q":"What size do you usually wear?","en":"Usually a medium, but it depends on the brand, so I'd like to try it on.","he":"בדרך כלל מידיום, אבל זה תלוי במותג, אז הייתי רוצה למדוד.","ru":"Обычно M, но это зависит от бренда, поэтому я хотел(а) бы примерить.","ar":"عادةً المقاس المتوسط، لكن ذلك يعتمد على الماركة، لذا أودّ أن أجرّبه."},{"q":"This one is on sale this week, thirty percent off.","en":"That sounds great, but do you have the same model in dark blue instead?","he":"זה נשמע מעולה, אבל יש לכם את אותו דגם בכחול כהה?","ru":"Звучит отлично, но у вас есть такая же модель в тёмно-синем цвете?","ar":"يبدو رائعًا، لكن هل لديكم الموديل نفسه باللون الأزرق الداكن؟"},{"q":"Hello, how can I help you today?","en":"I bought these shoes last week, but they're too small, so I'd like to return them.","he":"קניתי את הנעליים האלה בשבוע שעבר, אבל הן קטנות מדי, אז אני רוצה להחזיר אותן.","ru":"Я купил(а) эти туфли на прошлой неделе, но они слишком малы, поэтому я хочу их вернуть.","ar":"اشتريت هذا الحذاء الأسبوع الماضي، لكنه صغير جدًا، لذا أودّ إرجاعه."},{"q":"Do you have the receipt with you?","en":"Yes, here it is, and the shoes are unworn and still in the original box.","he":"כן, הנה היא, והנעליים לא נעולות ועדיין בקופסה המקורית.","ru":"Да, вот он, и туфли не ношены и всё ещё в оригинальной коробке.","ar":"نعم، ها هو، والحذاء لم يُلبس وما زال في علبته الأصلية."},{"q":"We can give you store credit or exchange them for another size.","en":"I'd prefer a refund to my credit card, since I couldn't find anything else I liked.","he":"אני מעדיף/ה זיכוי לכרטיס האשראי, כי לא מצאתי שום דבר אחר שאהבתי.","ru":"Я бы предпочёл/предпочла возврат денег на карту, потому что ничего другого мне не понравилось.","ar":"أفضّل استرداد المبلغ إلى بطاقتي الائتمانية، لأنني لم أجد شيئًا آخر أعجبني."}]},{"en":"job interview","he":"ראיון עבודה","ru":"собеседование","ar":"مقابلة عمل","e":"💼","dialog":true,"items":[{"q":"Thanks for coming in. Could you tell me a little about yourself?","en":"Sure, I have five years of experience in customer service, mostly at a large tech company.","he":"בטח, יש לי חמש שנות ניסיון בשירות לקוחות, בעיקר בחברת הייטק גדולה.","ru":"Конечно, у меня пять лет опыта в обслуживании клиентов, в основном в крупной технологической компании.","ar":"بالتأكيد، لديّ خمس سنوات من الخبرة في خدمة العملاء، معظمها في شركة تكنولوجيا كبيرة."},{"q":"Why do you want to work for our company?","en":"I admire your products, and I'm looking for a place where I can keep learning and growing.","he":"אני מעריך/ה את המוצרים שלכם, ואני מחפש/ת מקום שבו אוכל להמשיך ללמוד ולהתפתח.","ru":"Я восхищаюсь вашими продуктами и ищу место, где смогу продолжать учиться и расти.","ar":"أُعجب بمنتجاتكم، وأبحث عن مكان أستطيع فيه مواصلة التعلّم والتطوّر."},{"q":"What would you say is your biggest strength?","en":"I'm very organized and calm under pressure, which helps me handle several projects at once.","he":"אני מאוד מאורגן/ת ורגוע/ה תחת לחץ, וזה עוזר לי לנהל כמה פרויקטים במקביל.","ru":"Я очень организован(а) и спокоен/спокойна под давлением, что помогает мне вести несколько проектов одновременно.","ar":"أنا منظّم جدًا وهادئ تحت الضغط، وهذا يساعدني على إدارة عدة مشاريع في الوقت نفسه."},{"q":"Tell me about a difficult situation at work and how you handled it.","en":"Once a client was very angry about a delay, so I called him and offered a solution.","he":"פעם לקוח כעס מאוד על עיכוב, אז התקשרתי אליו והצעתי לו פתרון.","ru":"Однажды клиент был очень зол из-за задержки, поэтому я позвонил(а) ему и предложил(а) решение.","ar":"ذات مرة غضب أحد العملاء كثيرًا بسبب تأخير، فاتصلت به وعرضت عليه حلًا."},{"q":"Where do you see yourself in five years?","en":"I hope to lead a small team and take on more responsibility within the company.","he":"אני מקווה להוביל צוות קטן ולקחת על עצמי יותר אחריות בחברה.","ru":"Я надеюсь руководить небольшой командой и брать на себя больше ответственности в компании.","ar":"آمل أن أقود فريقًا صغيرًا وأن أتحمّل مسؤولية أكبر داخل الشركة."},{"q":"Do you have any questions for us?","en":"Yes, could you tell me what a typical day looks like and when you expect to decide?","he":"כן, תוכלו לספר לי איך נראה יום עבודה רגיל ומתי אתם מצפים להחליט?","ru":"Да, не могли бы вы рассказать, как выглядит обычный рабочий день и когда вы планируете принять решение?","ar":"نعم، هل يمكنكم أن تخبروني كيف يبدو يوم العمل العادي ومتى تتوقعون اتخاذ القرار؟"}]},{"en":"phone calls and appointments","he":"שיחות טלפון ותורים","ru":"звонки и записи","ar":"المكالمات والمواعيد","e":"📞","dialog":true,"items":[{"q":"Good morning, Dr. Levi's clinic, how can I help you?","en":"Hi, I'd like to make an appointment with the doctor sometime next week, if possible.","he":"שלום, הייתי רוצה לקבוע תור אצל הרופאה מתישהו בשבוע הבא, אם אפשר.","ru":"Здравствуйте, я хотел(а) бы записаться к врачу на следующей неделе, если возможно.","ar":"مرحبًا، أودّ تحديد موعد مع الطبيبة في وقت ما الأسبوع القادم إن أمكن."},{"q":"We have an opening on Tuesday at ten in the morning.","en":"Unfortunately I'm at work then, so do you have anything later in the afternoon?","he":"לצערי אני בעבודה בשעה הזאת, אז יש לכם משהו מאוחר יותר אחר הצהריים?","ru":"К сожалению, в это время я на работе, у вас есть что-нибудь попозже, днём?","ar":"للأسف أكون في العمل في ذلك الوقت، فهل لديكم موعد لاحق بعد الظهر؟"},{"q":"Can I have your name and ID number, please?","en":"Of course, my name is Dana Mizrahi, and I'll spell my last name for you.","he":"כמובן, קוראים לי דנה מזרחי, ואאיית לך את שם המשפחה שלי.","ru":"Конечно, меня зовут Дана Мизрахи, и я продиктую вам свою фамилию по буквам.","ar":"بالطبع، اسمي دانا مزراحي، وسأتهجّى لك اسم عائلتي."},{"q":"I'm sorry, she's in a meeting right now. Can I take a message?","en":"Yes, please ask her to call me back this afternoon about the contract we discussed.","he":"כן, בבקשה תבקש/י ממנה לחזור אליי היום אחר הצהריים בקשר לחוזה שדיברנו עליו.","ru":"Да, пожалуйста, попросите её перезвонить мне сегодня днём по поводу договора, который мы обсуждали.","ar":"نعم، من فضلك اطلب منها أن تعاود الاتصال بي بعد الظهر بخصوص العقد الذي ناقشناه."},{"q":"Sorry, the line is really bad. Could you repeat that?","en":"Sure, I said I need to move my appointment from Thursday to the following Monday.","he":"בטח, אמרתי שאני צריך/ה להעביר את התור שלי מיום חמישי ליום שני שאחריו.","ru":"Конечно, я сказал(а), что мне нужно перенести запись с четверга на следующий понедельник.","ar":"بالتأكيد، قلت إنني بحاجة إلى نقل موعدي من الخميس إلى يوم الاثنين الذي يليه."},{"q":"Is there anything else I can help you with today?","en":"No, that's everything, thanks, and could you send me a text message to confirm the time?","he":"לא, זה הכול, תודה, ותוכל/י לשלוח לי הודעת SMS לאישור השעה?","ru":"Нет, это всё, спасибо, и не могли бы вы прислать мне SMS с подтверждением времени?","ar":"لا، هذا كل شيء، شكرًا، وهل يمكنك أن ترسل لي رسالة نصية لتأكيد الموعد؟"}]},{"en":"travel and plans","he":"טיולים ותוכניות","ru":"путешествия и планы","ar":"السفر والخطط","e":"✈️","dialog":true,"items":[{"q":"Do you have any plans for the summer vacation?","en":"We're thinking about renting a car and driving around northern Italy for about ten days.","he":"אנחנו חושבים לשכור רכב ולטייל בצפון איטליה בערך עשרה ימים.","ru":"Мы думаем взять машину напрокат и поездить по северной Италии около десяти дней.","ar":"نفكر في استئجار سيارة والتجول في شمال إيطاليا لمدة عشرة أيام تقريبًا."},{"q":"Have you booked your flights yet?","en":"Not yet, because prices keep changing, so I'm waiting for a good deal before I book.","he":"עוד לא, כי המחירים כל הזמן משתנים, אז אני מחכה למבצע טוב לפני שאני מזמין/ה.","ru":"Ещё нет, потому что цены постоянно меняются, поэтому я жду хорошего предложения, прежде чем бронировать.","ar":"ليس بعد، لأن الأسعار تتغير باستمرار، لذا أنتظر عرضًا جيدًا قبل أن أحجز."},{"q":"Would you rather stay in a hotel or rent an apartment?","en":"I prefer an apartment, since we can cook breakfast and it's usually cheaper for families.","he":"אני מעדיף/ה דירה, כי אפשר להכין ארוחת בוקר ובדרך כלל זה זול יותר למשפחות.","ru":"Я предпочитаю квартиру, потому что можно готовить завтрак, и для семей это обычно дешевле.","ar":"أفضّل شقة، لأننا نستطيع إعداد الفطور، وهي عادةً أرخص للعائلات."},{"q":"Where would you like to go first when we get there?","en":"I'd love to see the old town first, and then maybe find a nice place for lunch.","he":"הייתי שמח/ה לראות קודם את העיר העתיקה, ואחר כך אולי למצוא מקום נחמד לארוחת צהריים.","ru":"Я бы хотел(а) сначала посмотреть старый город, а потом, может быть, найти хорошее место для обеда.","ar":"أودّ أن أرى البلدة القديمة أولًا، ثم ربما نجد مكانًا لطيفًا لتناول الغداء."},{"q":"What's the best trip you've ever taken?","en":"Probably our trip to Japan two years ago, because the food and the people were amazing.","he":"כנראה הטיול שלנו ליפן לפני שנתיים, כי האוכל והאנשים היו מדהימים.","ru":"Наверное, наша поездка в Японию два года назад, потому что еда и люди были потрясающими.","ar":"ربما رحلتنا إلى اليابان قبل عامين، لأن الطعام والناس كانوا رائعين."},{"q":"Do you want to join us for a weekend in the Galilee next month?","en":"I'd love to, but let me check my schedule first and get back to you tomorrow.","he":"אשמח מאוד, אבל תן/י לי לבדוק קודם את הלו\"ז ואחזור אליך מחר.","ru":"С удовольствием, но дай мне сначала проверить расписание, и я отвечу тебе завтра.","ar":"يسعدني ذلك، لكن دعني أتحقق من جدولي أولًا وأرد عليك غدًا."}]},{"en":"at the doctor","he":"אצל הרופא","ru":"у врача","ar":"عند الطبيب","e":"🩺","dialog":true,"items":[{"q":"So, what seems to be the problem today?","en":"I've had a bad headache and a sore throat for three days, and it's getting worse.","he":"יש לי כאב ראש חזק וכאב גרון כבר שלושה ימים, וזה הולך ומחמיר.","ru":"У меня уже три дня сильно болит голова и горло, и становится только хуже.","ar":"أعاني من صداع شديد والتهاب في الحلق منذ ثلاثة أيام، والوضع يزداد سوءًا."},{"q":"Do you have a fever?","en":"Yes, last night it was almost thirty-nine degrees, and I couldn't sleep at all.","he":"כן, אתמול בלילה היה לי כמעט שלושים ותשע מעלות, ולא הצלחתי לישון בכלל.","ru":"Да, вчера вечером было почти тридцать девять, и я совсем не мог(ла) спать.","ar":"نعم، الليلة الماضية وصلت إلى تسع وثلاثين درجة تقريبًا، ولم أستطع النوم إطلاقًا."},{"q":"Are you taking any medication at the moment?","en":"Only something for my blood pressure, which I take every morning with breakfast.","he":"רק משהו ללחץ דם, שאני לוקח/ת כל בוקר עם ארוחת הבוקר.","ru":"Только лекарство от давления, которое я принимаю каждое утро за завтраком.","ar":"فقط دواء لضغط الدم، أتناوله كل صباح مع الفطور."},{"q":"Are you allergic to anything?","en":"I'm allergic to penicillin, so please don't prescribe me anything that contains it.","he":"אני אלרגי/ת לפניצילין, אז בבקשה אל תרשום/תרשמי לי שום דבר שמכיל אותו.","ru":"У меня аллергия на пенициллин, поэтому, пожалуйста, не выписывайте мне ничего, что его содержит.","ar":"لديّ حساسية من البنسلين، لذا أرجو ألا تصف لي أي دواء يحتوي عليه."},{"q":"Take this antibiotic twice a day for a week.","en":"Should I take it before or after meals, and can I still go to work?","he":"לקחת את זה לפני האוכל או אחריו, ואני יכול/ה בכל זאת ללכת לעבודה?","ru":"Принимать его до или после еды, и могу ли я всё-таки ходить на работу?","ar":"هل آخذه قبل الوجبات أم بعدها، وهل يمكنني الذهاب إلى العمل؟"},{"q":"If you don't feel better in a few days, come back and see me.","en":"Thank you, doctor, and could you also give me a sick note for my employer?","he":"תודה, דוקטור, ותוכל/י גם לתת לי אישור מחלה למעסיק?","ru":"Спасибо, доктор, и не могли бы вы также дать мне больничный для работодателя?","ar":"شكرًا يا دكتور، وهل يمكنك أيضًا أن تعطيني إجازة مرضية لصاحب العمل؟"}]},{"en":"at the hotel","he":"במלון","ru":"в гостинице","ar":"في الفندق","e":"🏨","dialog":true,"items":[{"q":"Welcome! Are you checking in?","en":"Yes, I have a reservation for three nights under the name Avraham, with breakfast included.","he":"כן, יש לי הזמנה לשלושה לילות על השם אברהם, כולל ארוחת בוקר.","ru":"Да, у меня бронь на три ночи на имя Авраам, с завтраком.","ar":"نعم، لديّ حجز لثلاث ليالٍ باسم أبراهام، مع الفطور."},{"q":"Here's your key card. Your room is on the fifth floor.","en":"Thanks, and could you tell me what time breakfast is served and where the restaurant is?","he":"תודה, ותוכל/י להגיד לי באיזו שעה מגישים ארוחת בוקר ואיפה המסעדה?","ru":"Спасибо, а не подскажете, во сколько подают завтрак и где находится ресторан?","ar":"شكرًا، وهل يمكنك أن تخبرني متى يُقدَّم الفطور وأين المطعم؟"},{"q":"Front desk, how can I help you?","en":"Hi, the air conditioning in room 512 isn't working, and it's really hot in here.","he":"שלום, המזגן בחדר 512 לא עובד, וממש חם כאן.","ru":"Здравствуйте, в номере 512 не работает кондиционер, и здесь очень жарко.","ar":"مرحبًا، المكيّف في الغرفة 512 لا يعمل، والجو حار جدًا هنا."},{"q":"I'm sorry to hear that. We'll send someone up right away.","en":"I'd appreciate that, because this is the second time I've called about the same problem.","he":"אודה לכם, כי זו הפעם השנייה שאני מתקשר/ת בגלל אותה בעיה.","ru":"Буду признателен/признательна, потому что я звоню по этой проблеме уже второй раз.","ar":"سأكون ممتنًا، لأن هذه هي المرة الثانية التي أتصل فيها بشأن المشكلة نفسها."},{"q":"Is there anything else we can do to make your stay more comfortable?","en":"Actually, the room is also very noisy at night, so could we move to a quieter one?","he":"האמת, החדר גם מאוד רועש בלילה, אז אפשר לעבור לחדר שקט יותר?","ru":"Вообще-то в номере ещё и очень шумно ночью, нельзя ли переехать в более тихий?","ar":"في الحقيقة، الغرفة أيضًا صاخبة جدًا في الليل، فهل يمكننا الانتقال إلى غرفة أهدأ؟"},{"q":"Are you ready to check out? How was your stay?","en":"The staff were lovely, but because of the broken air conditioner, I expected some kind of discount.","he":"הצוות היה מקסים, אבל בגלל המזגן המקולקל ציפיתי לאיזושהי הנחה.","ru":"Персонал был замечательный, но из-за сломанного кондиционера я рассчитывал(а) на какую-нибудь скидку.","ar":"كان الموظفون لطفاء جدًا، لكن بسبب المكيّف المعطّل توقعت نوعًا من الخصم."}]}]},{"id":"uni","group":"uni","he":"סטודנטים · אנגלית אקדמית","sub":"אנגלית לאקדמיה ולפטור","e":"🎓","units":[{"en":"academic vocabulary","he":"אוצר מילים אקדמי","ru":"академическая лексика","ar":"المفردات الأكاديمية","e":"📚","items":[{"en":"The study aims to analyze the impact of social media.","he":"המחקר נועד לנתח את ההשפעה של הרשתות החברתיות.","ru":"Исследование направлено на анализ влияния социальных сетей.","ar":"تهدف الدراسة إلى تحليل تأثير وسائل التواصل الاجتماعي.","e":"","alt":[]},{"en":"These factors significantly affect students' academic performance.","he":"גורמים אלה משפיעים באופן משמעותי על ההישגים הלימודיים של סטודנטים.","ru":"Эти факторы существенно влияют на успеваемость студентов.","ar":"تؤثر هذه العوامل بشكل كبير على الأداء الأكاديمي للطلاب.","e":"","alt":[]},{"en":"The researchers identified a clear relationship between the variables.","he":"החוקרים זיהו קשר ברור בין המשתנים.","ru":"Исследователи выявили явную связь между переменными.","ar":"حدّد الباحثون علاقة واضحة بين المتغيرات.","e":"","alt":[]},{"en":"This approach is widely used in modern psychology.","he":"גישה זו נמצאת בשימוש נרחב בפסיכולוגיה המודרנית.","ru":"Этот подход широко используется в современной психологии.","ar":"يُستخدم هذا النهج على نطاق واسع في علم النفس الحديث.","e":"","alt":[]},{"en":"The theory is based on several key assumptions.","he":"התיאוריה מבוססת על כמה הנחות יסוד מרכזיות.","ru":"Теория основана на нескольких ключевых допущениях.","ar":"تستند النظرية إلى عدة افتراضات أساسية.","e":"","alt":[]},{"en":"It is essential to evaluate the evidence carefully.","he":"חיוני להעריך את הראיות בקפידה.","ru":"Крайне важно тщательно оценивать доказательства.","ar":"من الضروري تقييم الأدلة بعناية.","e":"","alt":[]}],"reading":{"en":"Vocabulary knowledge is one of the strongest predictors of reading comprehension. Research indicates that students must understand about 95 percent of the words in a text to read it effectively. Academic texts, however, contain many words that rarely appear in everyday conversation. Words such as analyze, significant and approach are common across all disciplines. Therefore, many universities encourage students to study a general academic word list. Learning these words early can make reading research articles considerably easier.","he":"ידיעת אוצר מילים היא אחד המנבאים החזקים ביותר של הבנת הנקרא. מחקרים מראים שסטודנטים צריכים להבין כ-95 אחוז מהמילים בטקסט כדי לקרוא אותו ביעילות. עם זאת, טקסטים אקדמיים מכילים מילים רבות שמופיעות לעיתים רחוקות בשיחה יומיומית. מילים כמו analyze, significant ו-approach נפוצות בכל התחומים. לכן אוניברסיטאות רבות מעודדות סטודנטים ללמוד רשימת מילים אקדמית כללית. לימוד המילים האלה בשלב מוקדם יכול להקל במידה ניכרת על קריאת מאמרי מחקר.","ru":"Словарный запас — один из самых сильных предикторов понимания прочитанного. Исследования показывают, что для эффективного чтения студенту нужно понимать около 95 процентов слов текста. Однако академические тексты содержат много слов, которые редко встречаются в повседневной речи. Такие слова, как analyze, significant и approach, распространены во всех дисциплинах. Поэтому многие университеты рекомендуют студентам изучать общий академический список слов. Если выучить эти слова заранее, читать научные статьи станет значительно легче.","ar":"تُعدّ المعرفة بالمفردات من أقوى المؤشرات على فهم المقروء. تشير الأبحاث إلى أن الطلاب يجب أن يفهموا نحو 95 بالمئة من كلمات النص ليقرؤوه بفعالية. غير أن النصوص الأكاديمية تحتوي على كلمات كثيرة نادرًا ما تظهر في المحادثة اليومية. كلمات مثل analyze وsignificant وapproach شائعة في جميع التخصصات. لذلك تشجّع جامعات كثيرة الطلاب على دراسة قائمة عامة بالكلمات الأكاديمية. ويمكن لتعلّم هذه الكلمات مبكرًا أن يجعل قراءة المقالات البحثية أسهل بكثير.","questions":[["What percentage of words must students understand?","About 95 percent","About 50 percent","About 75 percent","100 percent"],["Why are academic texts difficult?","They use words rare in conversation","They are always very short","They contain no data","They use only simple words"],["What do many universities encourage?","Studying an academic word list","Reading only novels","Avoiding research articles","Learning grammar rules first"]]}},{"en":"research articles","he":"קריאת מאמרי מחקר","ru":"научные статьи","ar":"المقالات البحثية","e":"🔬","items":[{"en":"The abstract gives a short summary of the entire study.","he":"התקציר נותן סיכום קצר של המחקר כולו.","ru":"Аннотация даёт краткое изложение всего исследования.","ar":"يقدّم الملخص عرضًا موجزًا للدراسة بأكملها.","e":"","alt":[]},{"en":"Participants were randomly divided into two groups.","he":"המשתתפים חולקו באופן אקראי לשתי קבוצות.","ru":"Участники были случайным образом разделены на две группы.","ar":"قُسّم المشاركون عشوائيًا إلى مجموعتين.","e":"","alt":[]},{"en":"Data were collected through online questionnaires and interviews.","he":"הנתונים נאספו באמצעות שאלונים מקוונים וראיונות.","ru":"Данные собирались с помощью онлайн-анкет и интервью.","ar":"جُمعت البيانات من خلال استبيانات إلكترونية ومقابلات.","e":"","alt":[]},{"en":"The findings suggest that sleep improves long-term memory.","he":"הממצאים מצביעים על כך ששינה משפרת את הזיכרון לטווח ארוך.","ru":"Результаты указывают на то, что сон улучшает долговременную память.","ar":"تشير النتائج إلى أن النوم يحسّن الذاكرة طويلة المدى.","e":"","alt":[]},{"en":"One limitation of this study is the small sample.","he":"אחת המגבלות של מחקר זה היא המדגם הקטן.","ru":"Одно из ограничений этого исследования — небольшая выборка.","ar":"من قيود هذه الدراسة صغر حجم العيّنة.","e":"","alt":[]},{"en":"Further research is needed to confirm these results.","he":"נדרש מחקר נוסף כדי לאשש את התוצאות הללו.","ru":"Для подтверждения этих результатов необходимы дальнейшие исследования.","ar":"هناك حاجة إلى مزيد من البحث لتأكيد هذه النتائج.","e":"","alt":[]}],"reading":{"en":"This study examined the effect of smartphone use on the sleep quality of university students. A total of 240 undergraduate students in Israel completed an online questionnaire about their evening habits. Participants also recorded their sleep for two weeks using a mobile application. The results showed that students who used their phones in bed slept, on average, 40 minutes less. They also reported more difficulty concentrating during morning classes. These findings suggest that universities should raise awareness of healthy sleep habits.","he":"מחקר זה בחן את השפעת השימוש בטלפון חכם על איכות השינה של סטודנטים באוניברסיטה. בסך הכול 240 סטודנטים לתואר ראשון בישראל מילאו שאלון מקוון על הרגלי הערב שלהם. המשתתפים גם תיעדו את השינה שלהם במשך שבועיים באמצעות אפליקציה. התוצאות הראו שסטודנטים שהשתמשו בטלפון במיטה ישנו בממוצע 40 דקות פחות. הם גם דיווחו על קושי רב יותר להתרכז בשיעורי הבוקר. ממצאים אלה מצביעים על כך שהאוניברסיטאות צריכות להעלות את המודעות להרגלי שינה בריאים.","ru":"В этом исследовании изучалось влияние использования смартфона на качество сна студентов университета. В общей сложности 240 израильских студентов бакалавриата заполнили онлайн-анкету о своих вечерних привычках. Участники также в течение двух недель записывали свой сон с помощью мобильного приложения. Результаты показали, что студенты, пользовавшиеся телефоном в постели, спали в среднем на 40 минут меньше. Они также сообщали о больших трудностях с концентрацией на утренних занятиях. Эти данные указывают на то, что университетам следует повышать осведомлённость о здоровых привычках сна.","ar":"درست هذه الدراسة تأثير استخدام الهاتف الذكي على جودة نوم طلاب الجامعات. أكمل ما مجموعه 240 طالبًا جامعيًا في إسرائيل استبيانًا إلكترونيًا عن عاداتهم المسائية. كما سجّل المشاركون نومهم لمدة أسبوعين باستخدام تطبيق على الهاتف. أظهرت النتائج أن الطلاب الذين استخدموا هواتفهم في السرير ناموا في المتوسط 40 دقيقة أقل. كما أفادوا بصعوبة أكبر في التركيز خلال محاضرات الصباح. تشير هذه النتائج إلى أن على الجامعات زيادة الوعي بعادات النوم الصحية.","questions":[["How many students participated?","240","40","24","2,400"],["How was sleep measured?","With a mobile application","In a sleep laboratory","By their parents","By lecturers"],["What did students who used phones in bed report?","Difficulty concentrating","Better grades","More energy","Longer sleep"]]}},{"en":"emailing lecturers","he":"מיילים למרצים","ru":"письма преподавателям","ar":"مراسلة المحاضرين","e":"✉️","items":[{"en":"Dear Dr. Levi, I hope this email finds you well.","he":"שלום ד״ר לוי, מקווה שהכול טוב אצלך.","ru":"Уважаемый доктор Леви, надеюсь, у вас всё хорошо.","ar":"عزيزي الدكتور ليفي، آمل أن تكون بخير.","e":"","alt":[]},{"en":"I am writing to ask about the assignment deadline.","he":"אני כותב/ת כדי לשאול לגבי מועד ההגשה של העבודה.","ru":"Я пишу, чтобы уточнить срок сдачи задания.","ar":"أكتب للاستفسار عن الموعد النهائي لتسليم الواجب.","e":"","alt":[]},{"en":"Would it be possible to receive a short extension?","he":"האם יהיה אפשר לקבל הארכה קצרה?","ru":"Можно ли получить небольшое продление срока?","ar":"هل من الممكن الحصول على تمديد قصير؟","e":"","alt":[]},{"en":"Unfortunately, I was unable to attend last week's lecture.","he":"לצערי, לא יכולתי להגיע להרצאה בשבוע שעבר.","ru":"К сожалению, я не смог(ла) присутствовать на лекции на прошлой неделе.","ar":"للأسف، لم أتمكن من حضور محاضرة الأسبوع الماضي.","e":"","alt":[]},{"en":"I have attached a medical certificate for your reference.","he":"צירפתי אישור רפואי לעיונך.","ru":"Прилагаю медицинскую справку для вашего сведения.","ar":"أرفقت شهادة طبية للاطلاع عليها.","e":"","alt":[]},{"en":"Thank you for your time, and I look forward to your reply.","he":"תודה על זמנך, אשמח לתשובתך.","ru":"Спасибо за ваше время, с нетерпением жду вашего ответа.","ar":"شكرًا على وقتك، وأتطلع إلى ردك.","e":"","alt":[]}],"reading":{"en":"Dear Professor Cohen, my name is Yael Mizrahi, and I am a second-year student in your Introduction to Sociology course. I am writing to ask whether it would be possible to submit my final paper one week late. Unfortunately, I was hospitalized last week and could not work on the assignment. I have attached a medical certificate for your reference. I would be very grateful for your understanding. Best regards, Yael Mizrahi.","he":"לכבוד פרופ׳ כהן, שמי יעל מזרחי, ואני סטודנטית בשנה השנייה בקורס מבוא לסוציולוגיה שלך. אני כותבת כדי לשאול אם אפשר להגיש את העבודה הסופית שלי באיחור של שבוע. לצערי, אושפזתי בשבוע שעבר ולא יכולתי לעבוד על המטלה. צירפתי אישור רפואי לעיונך. אודה מאוד על הבנתך. בברכה, יעל מזרחי.","ru":"Уважаемый профессор Коэн, меня зовут Яэль Мизрахи, я студентка второго курса и посещаю ваш курс «Введение в социологию». Я пишу, чтобы узнать, можно ли сдать мою итоговую работу на неделю позже. К сожалению, на прошлой неделе я была госпитализирована и не могла работать над заданием. Прилагаю медицинскую справку для вашего сведения. Буду очень благодарна за понимание. С уважением, Яэль Мизрахи.","ar":"حضرة البروفيسور كوهين المحترم، اسمي ياعيل مزراحي، وأنا طالبة في السنة الثانية في مساق مقدمة في علم الاجتماع الذي تدرّسه. أكتب لأسأل إن كان من الممكن تسليم بحثي النهائي متأخرة أسبوعًا واحدًا. للأسف، دخلت المستشفى الأسبوع الماضي ولم أتمكن من العمل على المهمة. أرفقت شهادة طبية للاطلاع عليها. سأكون ممتنة جدًا لتفهّمك. مع خالص التحيات، ياعيل مزراحي.","questions":[["What is Yael asking for?","A one-week extension","A higher grade","A new topic","A meeting"],["Why couldn't she work on the paper?","She was in hospital","She was abroad","She lost her laptop","She was working"],["What did she attach to the email?","A medical certificate","Her final paper","A photo","Her grades"]]}},{"en":"presentations","he":"מצגות וסמינרים","ru":"презентации и семинары","ar":"العروض التقديمية والندوات","e":"🎤","items":[{"en":"Today I'm going to talk about renewable energy in Israel.","he":"היום אדבר על אנרגיה מתחדשת בישראל.","ru":"Сегодня я расскажу о возобновляемой энергии в Израиле.","ar":"سأتحدث اليوم عن الطاقة المتجددة في إسرائيل.","e":"","alt":[]},{"en":"My presentation is divided into three main parts.","he":"המצגת שלי מחולקת לשלושה חלקים עיקריים.","ru":"Моя презентация состоит из трёх основных частей.","ar":"ينقسم عرضي إلى ثلاثة أجزاء رئيسية.","e":"","alt":[]},{"en":"As you can see in this slide, sales increased.","he":"כפי שאפשר לראות בשקופית הזאת, המכירות עלו.","ru":"Как видно на этом слайде, продажи выросли.","ar":"كما ترون في هذه الشريحة، ارتفعت المبيعات.","e":"","alt":[]},{"en":"Let me move on to the next point.","he":"אעבור עכשיו לנקודה הבאה.","ru":"Позвольте перейти к следующему пункту.","ar":"دعوني أنتقل إلى النقطة التالية.","e":"","alt":[]},{"en":"To sum up, the evidence supports our main hypothesis.","he":"לסיכום, הראיות תומכות בהשערה המרכזית שלנו.","ru":"Подводя итог, данные подтверждают нашу основную гипотезу.","ar":"باختصار، تدعم الأدلة فرضيتنا الرئيسية.","e":"","alt":[]},{"en":"Thank you for listening; are there any questions?","he":"תודה על ההקשבה; יש שאלות?","ru":"Спасибо за внимание; есть ли вопросы?","ar":"شكرًا على الاستماع؛ هل هناك أي أسئلة؟","e":"","alt":[]}],"reading":{"en":"Giving a seminar presentation is a common requirement in many university courses. A good presentation begins with a clear introduction that states the topic and the structure. Each slide should contain only a few key points, not long paragraphs of text. Speakers are advised to make eye contact with the audience and to speak slowly. At the end, a short summary helps listeners remember the main arguments. Finally, presenters should prepare for questions by anticipating possible criticism.","he":"הצגת מצגת בסמינר היא דרישה נפוצה בקורסים רבים באוניברסיטה. מצגת טובה מתחילה בפתיחה ברורה שמציגה את הנושא ואת המבנה. כל שקופית צריכה לכלול רק כמה נקודות מפתח, ולא פסקאות ארוכות של טקסט. מומלץ לדוברים ליצור קשר עין עם הקהל ולדבר לאט. בסוף, סיכום קצר עוזר למאזינים לזכור את הטיעונים המרכזיים. לבסוף, על המציגים להתכונן לשאלות על ידי צפייה מראש של ביקורת אפשרית.","ru":"Выступление с презентацией на семинаре — обычное требование во многих университетских курсах. Хорошая презентация начинается с чёткого вступления, в котором названы тема и структура. На каждом слайде должно быть лишь несколько ключевых пунктов, а не длинные абзацы текста. Выступающим советуют смотреть в глаза слушателям и говорить медленно. В конце краткое резюме помогает слушателям запомнить главные аргументы. Наконец, докладчикам следует готовиться к вопросам, заранее предвидя возможную критику.","ar":"يُعدّ تقديم عرض في الندوة متطلبًا شائعًا في كثير من المساقات الجامعية. يبدأ العرض الجيد بمقدمة واضحة تحدد الموضوع والبنية. يجب أن تحتوي كل شريحة على بضع نقاط رئيسية فقط، لا على فقرات طويلة من النص. يُنصح المتحدثون بالتواصل البصري مع الجمهور والتحدث ببطء. وفي النهاية، يساعد ملخص قصير المستمعين على تذكّر الحجج الرئيسية. وأخيرًا، ينبغي للمقدّمين الاستعداد للأسئلة من خلال توقّع الانتقادات المحتملة.","questions":[["What should a good introduction state?","The topic and the structure","The final grade","Only the conclusion","The speaker's biography"],["What should each slide contain?","A few key points","Long paragraphs","Only pictures","All the data"],["How can presenters prepare for questions?","By anticipating criticism","By speaking faster","By skipping the summary","By avoiding eye contact"]]}},{"en":"linking and hedging","he":"מילות קישור והסתייגות","ru":"связки и смягчение","ar":"أدوات الربط والتحوّط","e":"🔗","items":[{"en":"However, the results were not statistically significant.","he":"עם זאת, התוצאות לא היו מובהקות סטטיסטית.","ru":"Однако результаты не были статистически значимыми.","ar":"ومع ذلك، لم تكن النتائج ذات دلالة إحصائية.","e":"","alt":[]},{"en":"Furthermore, the method is cheaper and easier to use.","he":"יתרה מזאת, השיטה זולה יותר וקלה יותר לשימוש.","ru":"Кроме того, этот метод дешевле и проще в использовании.","ar":"علاوة على ذلك، الطريقة أرخص وأسهل في الاستخدام.","e":"","alt":[]},{"en":"These results may indicate a link between stress and illness.","he":"ייתכן שתוצאות אלה מצביעות על קשר בין לחץ למחלה.","ru":"Эти результаты могут указывать на связь между стрессом и болезнью.","ar":"قد تشير هذه النتائج إلى وجود صلة بين التوتر والمرض.","e":"","alt":[]},{"en":"It seems likely that the policy will be effective.","he":"נראה סביר שהמדיניות תהיה אפקטיבית.","ru":"Представляется вероятным, что эта политика будет эффективной.","ar":"يبدو من المرجح أن تكون السياسة فعّالة.","e":"","alt":[]},{"en":"Therefore, the hypothesis was only partly confirmed.","he":"לכן, ההשערה אוששה רק באופן חלקי.","ru":"Поэтому гипотеза подтвердилась лишь частично.","ar":"لذلك، تأكدت الفرضية جزئيًا فقط.","e":"","alt":[]},{"en":"In contrast, the second group showed no improvement.","he":"לעומת זאת, הקבוצה השנייה לא הראתה שיפור.","ru":"Напротив, вторая группа не показала улучшения.","ar":"في المقابل، لم تُظهر المجموعة الثانية أي تحسّن.","e":"","alt":[]}],"reading":{"en":"Academic writers rarely make absolute claims about their findings. Instead, they use hedging words such as may, might, suggest and appear to show caution. For example, a researcher might write that a treatment appears to reduce anxiety. This shows that the conclusion is based on limited evidence and may change. Linking words, such as however, therefore and moreover, help the reader follow the argument. Together, these tools make academic texts clearer and more precise.","he":"כותבים אקדמיים כמעט אף פעם לא מציגים טענות מוחלטות לגבי הממצאים שלהם. במקום זאת, הם משתמשים במילות הסתייגות כמו may, might, suggest ו-appear כדי להפגין זהירות. למשל, חוקר עשוי לכתוב שטיפול מסוים נראה כמפחית חרדה. הדבר מראה שהמסקנה מבוססת על ראיות מוגבלות ועשויה להשתנות. מילות קישור, כמו however, therefore ו-moreover, עוזרות לקורא לעקוב אחרי הטיעון. יחד, הכלים האלה הופכים טקסטים אקדמיים לברורים ומדויקים יותר.","ru":"Авторы научных текстов редко делают категоричные утверждения о своих результатах. Вместо этого они используют слова-смягчители, такие как may, might, suggest и appear, чтобы проявить осторожность. Например, исследователь может написать, что лечение, по-видимому, снижает тревожность. Это показывает, что вывод основан на ограниченных данных и может измениться. Слова-связки, такие как however, therefore и moreover, помогают читателю следить за аргументацией. Вместе эти средства делают академические тексты яснее и точнее.","ar":"نادرًا ما يقدّم الكتّاب الأكاديميون ادعاءات مطلقة بشأن نتائجهم. بدلًا من ذلك، يستخدمون كلمات تحوّط مثل may وmight وsuggest وappear لإظهار الحذر. على سبيل المثال، قد يكتب باحث أن علاجًا ما يبدو أنه يقلّل القلق. ويُظهر ذلك أن الاستنتاج قائم على أدلة محدودة وقد يتغيّر. أما أدوات الربط، مثل however وtherefore وmoreover، فتساعد القارئ على متابعة الحجة. وتجعل هذه الأدوات معًا النصوص الأكاديمية أوضح وأكثر دقة.","questions":[["Why do writers use hedging words?","To show caution","To sound informal","To make texts longer","To hide their data"],["Which word is a hedging word?","Might","However","Therefore","Moreover"],["What do linking words help the reader do?","Follow the argument","Find new sources","Skip paragraphs","Check the grammar"]]}},{"en":"describing data","he":"תיאור נתונים וגרפים","ru":"описание данных","ar":"وصف البيانات والرسوم البيانية","e":"📊","items":[{"en":"The graph shows the number of students between 2015 and 2025.","he":"הגרף מציג את מספר הסטודנטים בין 2015 ל-2025.","ru":"График показывает количество студентов с 2015 по 2025 год.","ar":"يوضح الرسم البياني عدد الطلاب بين عامي 2015 و2025.","e":"","alt":[]},{"en":"The number of applicants rose sharply in 2020.","he":"מספר המועמדים עלה בחדות ב-2020.","ru":"Число абитуриентов резко выросло в 2020 году.","ar":"ارتفع عدد المتقدمين بشكل حاد في عام 2020.","e":"","alt":[]},{"en":"Prices remained stable for most of the year.","he":"המחירים נותרו יציבים במשך רוב השנה.","ru":"Цены оставались стабильными большую часть года.","ar":"ظلت الأسعار مستقرة معظم العام.","e":"","alt":[]},{"en":"Unemployment fell gradually from eight to five percent.","he":"האבטלה ירדה בהדרגה משמונה לחמישה אחוזים.","ru":"Безработица постепенно снизилась с восьми до пяти процентов.","ar":"انخفضت البطالة تدريجيًا من ثمانية إلى خمسة بالمئة.","e":"","alt":[]},{"en":"Women make up about sixty percent of the participants.","he":"נשים מהוות כשישים אחוז מהמשתתפים.","ru":"Женщины составляют около шестидесяти процентов участников.","ar":"تشكّل النساء نحو ستين بالمئة من المشاركين.","e":"","alt":[]},{"en":"The table compares average salaries in five different countries.","he":"הטבלה משווה בין המשכורות הממוצעות בחמש מדינות שונות.","ru":"В таблице сравниваются средние зарплаты в пяти разных странах.","ar":"يقارن الجدول متوسط الرواتب في خمس دول مختلفة.","e":"","alt":[]}],"reading":{"en":"The chart illustrates the number of international students at an Israeli university from 2018 to 2024. In 2018, there were approximately 800 international students. The number increased steadily over the next two years, reaching 1,100 in 2020. However, it dropped sharply in 2021, probably because of travel restrictions. After 2022, the number recovered and peaked at 1,400 in 2024. Overall, the trend was clearly upward despite the temporary decline.","he":"התרשים מציג את מספר הסטודנטים הבינלאומיים באוניברסיטה ישראלית בין 2018 ל-2024. ב-2018 היו כ-800 סטודנטים בינלאומיים. המספר עלה בהתמדה בשנתיים שלאחר מכן והגיע ל-1,100 ב-2020. עם זאת, ב-2021 הוא ירד בחדות, כנראה בגלל הגבלות על נסיעות. אחרי 2022 המספר התאושש והגיע לשיא של 1,400 ב-2024. בסך הכול, המגמה הייתה בבירור עולה למרות הירידה הזמנית.","ru":"На диаграмме показано количество иностранных студентов в одном израильском университете с 2018 по 2024 год. В 2018 году там было около 800 иностранных студентов. В следующие два года их число стабильно росло и в 2020 году достигло 1100. Однако в 2021 году оно резко упало, вероятно, из-за ограничений на поездки. После 2022 года число восстановилось и достигло пика в 1400 человек в 2024 году. В целом тенденция была явно восходящей, несмотря на временный спад.","ar":"يوضح المخطط عدد الطلاب الدوليين في إحدى الجامعات الإسرائيلية من عام 2018 إلى عام 2024. في عام 2018، كان هناك نحو 800 طالب دولي. ازداد العدد بشكل مطّرد خلال العامين التاليين، ليصل إلى 1100 في عام 2020. غير أنه انخفض بشكل حاد في عام 2021، على الأرجح بسبب قيود السفر. بعد عام 2022، تعافى العدد وبلغ ذروته عند 1400 في عام 2024. وبشكل عام، كان الاتجاه تصاعديًا بوضوح رغم التراجع المؤقت.","questions":[["How many international students were there in 2018?","About 800","About 1,100","About 1,400","About 500"],["What probably caused the drop in 2021?","Travel restrictions","Higher fees","A new law","Fewer courses"],["What was the overall trend?","Upward","Downward","Stable","Unclear"]]}},{"en":"study skills","he":"מיומנויות למידה ומבחנים","ru":"учёба и экзамены","ar":"مهارات الدراسة والامتحانات","e":"📝","items":[{"en":"I always skim the text before reading it in detail.","he":"אני תמיד מרפרף/ת על הטקסט לפני שאני קורא/ת אותו לעומק.","ru":"Я всегда просматриваю текст, прежде чем читать его подробно.","ar":"أتصفح النص دائمًا قبل قراءته بالتفصيل.","e":"","alt":[]},{"en":"Underline the main idea in each paragraph.","he":"סמן/י את הרעיון המרכזי בכל פסקה.","ru":"Подчёркивай главную мысль в каждом абзаце.","ar":"ضع خطًا تحت الفكرة الرئيسية في كل فقرة.","e":"","alt":[]},{"en":"Read all the answers before choosing the best one.","he":"קרא/י את כל התשובות לפני שתבחר/י את הטובה ביותר.","ru":"Прочитай все ответы, прежде чем выбрать лучший.","ar":"اقرأ جميع الإجابات قبل اختيار أفضلها.","e":"","alt":[]},{"en":"If you don't know a word, guess from the context.","he":"אם את/ה לא מכיר/ה מילה, נחש/י מתוך ההקשר.","ru":"Если не знаешь слово, догадайся о значении по контексту.","ar":"إذا لم تعرف كلمة، فخمّن معناها من السياق.","e":"","alt":[]},{"en":"Our study group meets in the library every Thursday.","he":"קבוצת הלמידה שלנו נפגשת בספרייה כל יום חמישי.","ru":"Наша учебная группа встречается в библиотеке каждый четверг.","ar":"تجتمع مجموعة الدراسة لدينا في المكتبة كل يوم خميس.","e":"","alt":[]},{"en":"I need to manage my time better before the finals.","he":"אני צריך/ה לנהל את הזמן שלי טוב יותר לפני המבחנים הסופיים.","ru":"Мне нужно лучше распределять время перед итоговыми экзаменами.","ar":"أحتاج إلى إدارة وقتي بشكل أفضل قبل الامتحانات النهائية.","e":"","alt":[]}],"reading":{"en":"Many Israeli students must pass an English exam to receive an exemption from English courses. The reading comprehension section is often the most challenging part of the test. Experts recommend reading the questions first, so you know what information to look for. It is also useful to identify the main idea of each paragraph quickly. When you meet an unfamiliar word, try to understand it from the surrounding sentences. Finally, practicing with timed tests helps students manage their time during the real exam.","he":"סטודנטים ישראלים רבים צריכים לעבור מבחן באנגלית כדי לקבל פטור מקורסי אנגלית. פרק הבנת הנקרא הוא לעיתים קרובות החלק המאתגר ביותר במבחן. מומחים ממליצים לקרוא קודם את השאלות, כדי לדעת איזה מידע לחפש. כדאי גם לזהות במהירות את הרעיון המרכזי של כל פסקה. כשנתקלים במילה לא מוכרת, כדאי לנסות להבין אותה מהמשפטים שסביבה. לבסוף, תרגול עם מבחנים בזמן מוגבל עוזר לסטודנטים לנהל את הזמן במבחן האמיתי.","ru":"Многим израильским студентам нужно сдать экзамен по английскому, чтобы получить освобождение от курсов английского языка. Раздел на понимание прочитанного часто оказывается самой трудной частью теста. Эксперты советуют сначала прочитать вопросы, чтобы знать, какую информацию искать. Также полезно быстро определять главную мысль каждого абзаца. Встретив незнакомое слово, постарайтесь понять его по соседним предложениям. Наконец, тренировка на тестах с ограничением времени помогает студентам распределять время на настоящем экзамене.","ar":"يتعيّن على كثير من الطلاب الإسرائيليين اجتياز امتحان في اللغة الإنجليزية للحصول على إعفاء من مساقات الإنجليزية. وغالبًا ما يكون قسم فهم المقروء الجزء الأصعب في الامتحان. يوصي الخبراء بقراءة الأسئلة أولًا، لتعرف ما المعلومات التي تبحث عنها. ومن المفيد أيضًا تحديد الفكرة الرئيسية لكل فقرة بسرعة. عندما تصادف كلمة غير مألوفة، حاول فهمها من الجمل المحيطة بها. وأخيرًا، يساعد التدرّب على امتحانات محددة بوقت الطلابَ على إدارة وقتهم في الامتحان الحقيقي.","questions":[["What is often the most challenging section?","Reading comprehension","Writing","Listening","Grammar"],["What should you read first?","The questions","The last paragraph","Only the title","The answer key"],["How can students improve time management?","Practicing with timed tests","Studying all night","Skipping difficult texts","Reading only titles"]]}},{"en":"campus life","he":"חיים בקמפוס","ru":"студенческая жизнь","ar":"الحياة الجامعية","e":"🏛️","dialog":true,"items":[{"q":"Hi, are you new here? What are you studying?","en":"Yes, I'm a first-year student in computer science.","he":"כן, אני סטודנט/ית שנה ראשונה במדעי המחשב.","ru":"Да, я первокурсник (первокурсница), изучаю информатику.","ar":"نعم، أنا طالب في السنة الأولى في علوم الحاسوب."},{"q":"How are you finding your courses so far?","en":"They're interesting, but the reading load is quite heavy.","he":"הם מעניינים, אבל עומס הקריאה די כבד.","ru":"Они интересные, но читать приходится довольно много.","ar":"إنها ممتعة، لكن عبء القراءة ثقيل إلى حد ما."},{"q":"Do you know where the student services office is?","en":"I think it's next to the main library, on the ground floor.","he":"נדמה לי שזה ליד הספרייה המרכזית, בקומת הקרקע.","ru":"Кажется, он рядом с главной библиотекой, на первом этаже.","ar":"أظن أنه بجانب المكتبة الرئيسية، في الطابق الأرضي."},{"q":"Would you like to join our study group?","en":"I'd love to; when and where do you usually meet?","he":"אשמח מאוד; מתי ואיפה אתם בדרך כלל נפגשים?","ru":"С удовольствием; когда и где вы обычно встречаетесь?","ar":"يسعدني ذلك؛ متى وأين تجتمعون عادةً؟"},{"q":"Are you planning to live in the dorms?","en":"No, I share an apartment with two friends near campus.","he":"לא, אני גר/ה בדירה עם שני חברים ליד הקמפוס.","ru":"Нет, я снимаю квартиру с двумя друзьями рядом с кампусом.","ar":"لا، أتشارك شقة مع صديقين بالقرب من الحرم الجامعي."},{"q":"What do you do when you're not studying?","en":"I work part-time at a cafe and play basketball.","he":"אני עובד/ת במשרה חלקית בבית קפה ומשחק/ת כדורסל.","ru":"Я подрабатываю в кафе и играю в баскетбол.","ar":"أعمل بدوام جزئي في مقهى وألعب كرة السلة."}]}]}];

кресенье я иду в школу. Библиотека рядом с моей школой.","Моя мама — врач. Она работает в больнице. Мой дядя — пилот. Он летает на самолётах.","Йони играет в баскетбол в понедельник и в футбол в четверг. Его сестра играет в теннис.","Я езжу в школу на автобусе. Мой папа ездит на работу на поезде. Летом мы летаем на самолёте.","Я просыпаюсь в семь. Я чищу зубы и завтракаю. Потом я иду в школу. Вечером я делаю домашнее задание.","На кухне я беру миску и ложку. Я ем суп. Моя мама пьёт чай из чашки.","Мы гуляем по лесу. Там высокие деревья и красные цветы. Рядом с горой есть река."],"g56":["Привет! Меня зовут Адам. Мне двенадцать лет, и я живу в Хайфе. У меня есть собака по кличке Рокки. Я очень хорошо плаваю.","Меня зовут Шира. Я люблю пиццу и музыку. Мой любимый предмет — английский, но я не люблю математику. У меня есть один брат.","В воскресенье у меня урок английского. Во вторник у меня урок музыки. В пятницу моя семья ужинает вместе.","Я встаю в семь часов. Уроки начинаются в восемь. Я заканчиваю школу в половине второго и встречаюсь с друзьями в пять.","Дана высокая, и у неё длинные каштановые волосы. Её брат Гал невысокий, и у него голубые глаза. Они оба очень смешные.","В прошлые выходные мы ходили на пляж. Я играл в футбол с папой, а моя сестра ела мороженое. Вечером мы навестили бабушку. Это был замечательный день!","У Омера много хобби. По воскресеньям он играет на гитаре, а по средам ходит плавать. Его любимое хобби — рисование, и однажды он хочет стать художником.","Этим летом моя семья поедет в Париж. Мы увидим Эйфелеву башню и съедим много свежего хлеба. После поездки я пойду в седьмой класс."],"adult":["Доброе утро, господин Коэн! Как у вас дела сегодня? Хорошо, спасибо. Хорошего дня!","Меня зовут Дана. Я из Израиля и живу в Тель-Авиве. Я работаю в продажах, и у меня двое детей. Я немного говорю по-английски, но хочу выучить больше.","Официант: Здравствуйте, что вам принести? Рон: Можно кофе и бутерброд с сыром, пожалуйста? Официант: Здесь или с собой? Рон: С собой, пожалуйста. Сколько это стоит? Официант: Двадцать пять шекелей.","Майя в магазине одежды. Ей нравится синяя рубашка, и она просит размер M. Она её примеряет, но она слишком дорогая, поэтому Майя её не покупает.","Извините, где железнодорожный вокзал? Идите прямо и поверните налево у банка. Это недалеко, примерно пять минут.","Дан в аэропорту. У него один чемодан и паспорт. Его рейс в Рим задерживается на час, поэтому он идёт к выходу двенадцать и ждёт.","Здравствуйте, у меня бронь на две ночи. Добро пожаловать! Завтрак с семи до десяти. Пароль от Wi-Fi указан на вашей ключ-карте.","Я плохо себя чувствую. У меня болит голова и болит горло. Принимайте это лекарство три раза в день и пейте много воды.","Ноа идёт в супермаркет. Она покупает молоко, яйца и свежий хлеб. Сыр по скидке, поэтому она берёт две упаковки. Она платит наличными и просит пакет.","Следующий поезд в аэропорт отправляется в 9:30. Поездка занимает сорок минут. Один билет стоит пятнадцать долларов, его можно купить в автомате."],"biz":["Здравствуйте, позвольте представиться. Я Лиор, отвечаю за маркетинг в технологической компании. Вот моя визитка. Давайте оставаться на связи!","Давайте начнём. Сначала пройдёмся по повестке дня. Сегодня у нас три пункта: бюджет, новый сайт и команда. Начнём с бюджета.","Здравствуйте, Сара! Пишу по итогам нашего вчерашнего разговора. Предложение во вложении. Буду рад получить ваш ответ. С уважением, Том.","Во время звонка у Анны был выключен микрофон, и никто её не слышал. Потом она показала свой экран и новый дизайн. После звонка она отправила резюме.","Вы свободны во вторник в десять? Извините, в это время я занят. Вам удобно в среду в два? Да, отлично. Я пришлю приглашение в календарь.","Наша цена включает поддержку на один год. Если вы подпишете договор на этой неделе, мы можем предложить скидку десять процентов. Я уточню у своего руководителя и вернусь к вам.","Сегодня я расскажу о наших результатах. Как видите на этом слайде, продажи в этом году выросли на двадцать процентов. В следующем году мы планируем открыть два новых офиса.","Клиент: Мой заказ не пришёл. Сотрудник: Приношу извинения за неудобства. Можно номер вашего заказа? Я сейчас же этим займусь. Ваша посылка придёт завтра.","Клиент сказал, что наша цена немного выше, чем они ожидали. Мы предложили скидку пять процентов и бесплатное обучение. Они согласились, и в пятницу мы подпишем договор.","Здравствуйте, Даниэль, спасибо, что пришли на собеседование. Нам понравились ваш опыт в продажах и ваши коммуникативные навыки. Следующий шаг — встреча с нашим руководителем в понедельник."]}},"ar":{"items":{"red":"أحمر","blue":"أزرق","green":"أخضر","yellow":"أصفر","black":"أسود","white":"أبيض","cat":"قطة","dog":"كلب","fish":"سمكة","bird":"طائر","duck":"بطة","pig":"خنزير","one":"واحد","two":"اثنان","three":"ثلاثة","four":"أربعة","five":"خمسة","six":"ستة","mom":"أمي","dad":"أبي","baby":"طفل رضيع","sister":"أخت","brother":"أخ","grandpa":"جدّ","apple":"تفاحة","banana":"موزة","orange":"برتقالي","grapes":"عنب","lemon":"ليمون","strawberry":"فراولة","ball":"كرة","teddy bear":"دبدوب","car":"سيارة","balloon":"بالون","kite":"طائرة ورقية","robot":"روبوت","circle":"دائرة","square":"مربع","triangle":"مثلث","star":"نجمة","heart":"قلب","moon":"قمر","sea":"بحر","sand":"رمل","shell":"صدفة","crab":"سلطعون","boat":"قارب","sun":"شمس","purple":"بنفسجي","horse":"حصان","cow":"بقرة","grandma":"جدّة","bread":"خبز","milk":"حليب","egg":"بيضة","pizza":"بيتزا","eye":"عين","ear":"أذن","nose":"أنف","mouth":"فم","hand":"يد","foot":"قدم","shirt":"قميص","dress":"فستان","hat":"قبعة","shoes":"حذاء","socks":"جوارب","coat":"معطف","book":"كتاب","pencil":"قلم رصاص","bag":"حقيبة","ruler":"مسطرة","scissors":"مقص","teacher":"معلم","house":"بيت","bed":"سرير","chair":"كرسي","door":"باب","window":"نافذة","key":"مفتاح","rain":"مطر","cloud":"غيمة","snow":"ثلج","wind":"ريح","rainbow":"قوس قزح","happy":"سعيد","sad":"حزين","angry":"غاضب","tired":"متعب","scared":"خائف","surprised":"متفاجئ","bike":"دراجة","run":"يرك
