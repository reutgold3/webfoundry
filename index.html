<style>
/* Yalla Gemara: warm study-hall look; parchment ground, deep blue ink for the Gemara text (Frank Ruhl serif), amber for Rashi. */
:root{--bg:#F5EEDF;--paper:#FFFCF5;--ink:#22283A;--soft:#6A6457;--line:#E4D8BF;--accent:#1F4E8C;--accent-deep:#143866;--amber:#B9772A;--good:#2E8B57;--bad:#C0392B;
 --serif:"Frank Ruhl Libre","David Libre",serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}

html,body{height:100%}

.gtext b{color:var(--accent)}

.flash{min-height:200px;display:grid;place-items:center;text-align:center;cursor:pointer}.flash .w{font-family:var(--serif);font-size:38px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:"קשיא","m":"קושיה שנשארת ללא תירוץ, אך הדעה אינה נדחית לגמרי כמו בתיובתא","role":"מסקנה","lvl":2},{"w":"בעיא דלא איפשיטא","m":"שאלה שלא נמצא לה פתרון, דומה לתיקו","role":"מסקנה","lvl":3},{"w":"איפשיטא","m":"השאלה נפתרה: הובאה ראיה שהכריעה בה","role":"מסקנה","lvl":3},{"w":"מאי בינייהו","m":"שאלה על ההבדל המעשי בין שתי דעות או שני טעמים (נפקא מינה)","role":"מבנה","lvl":2},{"w":"נפקא מינה","m":"ההבדל המעשי שיוצא מהמחלוקת או מההסבר","role":"מבנה","lvl":1},{"w":"אליבא ד","m":"\"לשיטת\": הסבר דין לפי דעה של חכם מסוים","role":"אחר","lvl":2},{"w":"לטעמיה","m":"החכם הולך לשיטתו: עקביות בין דבריו במקום אחד לדבריו כאן","role":"אחר","lvl":2},{"w":"דאורייתא","m":"דין מן התורה. בספק מחמירים","role":"אחר","lvl":1},{"w":"דרבנן","m":"דין מדברי חכמים. בספק מקילים","role":"אחר","lvl":1},{"w":"גזירה","m":"איסור שחכמים קבעו כדי להרחיק מעבירה (\"גזירה שמא...\")","role":"אחר","lvl":1},{"w":"תקנה","m":"הוראה חיובית של חכמים לתיקון הציבור, כמו פרוזבול","role":"אחר","lvl":1},{"w":"סייג","m":"גדר שנועד להרחיק את האדם מאיסור תורה (\"עשו סייג לתורה\")","role":"אחר","lvl":2},{"w":"אסמכתא","m":"פסוק שמובא כרמז לדין דרבנן, ולא כמקור מן התורה","role":"מקור","lvl":2},{"w":"הלכה למשה מסיני","m":"הלכה שנמסרה בעל פה למשה, בלי מקור בפסוק, ודינה כדאורייתא","role":"מקור","lvl":2},{"w":"עובדא","m":"מעשה שהיה, שמביא הגמרא כמקור להלכה או כמבחן לה","role":"מקור","lvl":1},{"w":"תנא קמא","m":"הדעה הראשונה במשנה, בלי שם חכם, ואחריה דעה חולקת","role":"מקור","lvl":1},{"w":"סתם משנה","m":"משנה בלי שם חכם. לפי הכלל \"הלכה כסתם משנה\"","role":"מקור","lvl":2},{"w":"רישא וסיפא","m":"תחילת המשנה וסופה. הגמרא בודקת אם הם הולכים לפי אותה שיטה","role":"מבנה","lvl":1},{"w":"מסקנה","m":"הסוף שאליו מגיעה הסוגיה אחרי הדיון. רק המסקנה קובעת את ההבנה למעשה","role":"מסקנה","lvl":1},{"w":"הוה אמינא","m":"ההבנה הראשונית שנדחתה בהמשך. חשוב להבחין בינה לבין המסקנה","role":"מבנה","lvl":1},{"w":"אלא","m":"מעבר להצעה חדשה אחרי שההצעה הקודמת נדחתה","role":"מבנה","lvl":2},{"w":"איכא דאמרי","m":"נוסח שני של הדיון (לפעמים עם הבדל בהלכה)","role":"מבנה","lvl":2},{"w":"בשלמא","m":"מבנה קושיה: \"בשלמא לדעה פלונית מובן, אלא לדעה האחרת קשה\"","role":"קושיה","lvl":2},{"w":"תינח","m":"מבנה קושיה: \"זה מובן במקרה אחד, אבל במקרה אחר מה תאמר?\"","role":"קושיה","lvl":2},{"w":"ממה נפשך","m":"קושיה משני הכיוונים: כל אפשרות שתבחר תוביל לקושי","role":"קושיה","lvl":3},{"w":"ותסברא","m":"דחייה בתמיהה: \"וכי תסבור כך?\" ומיד מקשים על ההבנה","role":"קושיה","lvl":3},{"w":"אדרבה","m":"\"להפך\": טענה שההיגיון מוביל דווקא לכיוון ההפוך","role":"קושיה","lvl":2},{"w":"הכי השתא","m":"דחיית השוואה: \"וכי זה דומה?\", מראים את ההבדל בין המקרים","role":"תירוץ","lvl":2},{"w":"שאני התם","m":"תירוץ: המקור שהובא שונה מהמקרה שלנו, ולכן אין ממנו ראיה","role":"תירוץ","lvl":1},{"w":"חסורי מיחסרא","m":"תירוץ שקובע שחסרות מילים בנוסח המשנה, ומשלים אותן","role":"תירוץ","lvl":3},{"w":"דיוק","m":"הסקת מסקנה מלשון מדויקת במשנה או במימרא (\"מדקתני... מכלל ש...\")","role":"מקור","lvl":2},{"w":"שינויא דחיקא","m":"תירוץ דחוק, שאינו פשוט. לפעמים הגמרא מקבלת אותו ולפעמים מחפשת טוב ממנו","role":"תירוץ","lvl":3},{"w":"מאי טעמא","m":"שאלה על הנימוק של הדין. פותחת הסבר","role":"מבנה","lvl":1},{"w":"איתמר","m":"פתיחה של מחלוקת אמוראים: \"נאמר...\" ואחריה שתי הדעות","role":"מבנה","lvl":1},{"w":"הדרן","m":"נוסח הסיום של פרק: \"הדרן עלך\" ושם הפרק","role":"מבנה","lvl":1},{"w":"פרק","m":"יחידה במסכת, וכל פרק נקרא בשם המילים הפותחות אותו","role":"מבנה","lvl":1},{"w":"מסכת","m":"חיבור בנושא אחד בתוך סדר של המשנה","role":"מבנה","lvl":1},{"w":"סדר","m":"אחד מששת החלקים של המשנה (זמ\"ן נק\"ט)","role":"מבנה","lvl":1},{"w":"גמרא","m":"דיוני האמוראים על המשנה. משנה וגמרא יחד הן התלמוד","role":"מקור","lvl":1},{"w":"חזקה","m":"הנחה שהמצב הקודם נמשך, או שאדם נוהג כדרכו, עד שיוכח אחרת","role":"אחר","lvl":2},{"w":"רוב","m":"הליכה אחרי הרוב: בספק מניחים שהדבר שייך לרוב","role":"אחר","lvl":2},{"w":"ממאי","m":"\"מניין לך?\": ערעור על ראיה, הטוען שאפשר להבין את המקור אחרת","role":"קושיה","lvl":2},{"w":"נימא כתנאי","m":"הצעה שמחלוקת האמוראים היא בעצם מחלוקת תנאים. לרוב הגמרא דוחה","role":"מבנה","lvl":3},{"w":"קיימא לן","m":"כלל מוסכם שהגמרא מסתמכת עליו כנקודה קבועה","role":"מסקנה","lvl":2},{"w":"מתניתין דלא כפלוני","m":"קביעה שהמשנה אינה כשיטת חכם מסוים","role":"מסקנה","lvl":3}],"yesodot":[{"id":"y-1","topic":"מבנה תורה שבעל פה","q":"לפי המסורת, למי ניתנה התורה שבעל פה?","o":["למשה בהר סיני, יחד עם התורה שבכתב","לאנשי כנסת הגדולה","לעזרא הסופר בשיבת ציון","לרבי יהודה הנשיא"],"a":0,"ex":"לפי המסורת, משה קיבל בסיני גם את הפירוש וההלכות שבעל פה, ומסר אותם ליהושע ולדורות הבאים (כמתואר בתחילת מסכת אבות)."},{"id":"y-2","topic":"מבנה תורה שבעל פה","q":"מה המקור לשרשרת מסירת התורה שבעל פה מדור לדור?","o":["הפרק הראשון בספר בראשית","תחילת מסכת אבות: \"משה קיבל תורה מסיני ומסרה ליהושע...\"","הקדמת השולחן ערוך","סוף מסכת ברכות"],"a":1,"ex":"המשנה הראשונה באבות מתארת את השרשרת: משה, יהושע, זקנים, נביאים ואנשי כנסת הגדולה."},{"id":"y-3","topic":"מבנה תורה שבעל פה","q":"מדוע הותר לכתוב את התורה שבעל פה?","o":["כי נאסר ללמוד בעל פה","כדי לתרגם אותה לשפות אחרות","מחשש שתשתכח בגלל הצרות והגלויות","כי חכמי המשנה לא זכרו אותה"],"a":2,"ex":"במקור היה איסור לכתוב תורה שבעל פה, אך בגלל הגלויות והחשש שתשתכח התירו זאת (על בסיס \"עת לעשות לה'\")."},{"id":"y-4","topic":"מבנה תורה שבעל פה","q":"מהו \"תלמוד\"?","o":["רק דברי התנאים","ספר פסקי הלכה של הרמב\"ם","אוסף מדרשי אגדה","המשנה יחד עם הגמרא שמפרשת אותה"],"a":3,"ex":"התלמוד כולל את המשנה ואת דיוני האמוראים עליה (הגמרא)."},{"id":"y-5","topic":"מבנה תורה שבעל פה","q":"כמה תלמודים יש?","o":["שניים: בבלי וירושלמי","אחד בלבד","שלושה: בבלי, ירושלמי ומצרי","ארבעה, אחד לכל טור"],"a":0,"ex":"התלמוד הבבלי נערך בבבל, והתלמוד הירושלמי נערך בארץ ישראל."},{"id":"y-6","topic":"מבנה תורה שבעל פה","q":"היכן נערך התלמוד הירושלמי?","o":["בירושלים בימי בית המקדש","בארץ ישראל, בעיקר בבתי המדרש בגליל","בבבל, בישיבת סורא","במצרים"],"a":1,"ex":"למרות שמו, הירושלמי נערך בארץ ישראל, בעיקר בטבריה, בציפורי ובקיסריה."},{"id":"y-7","topic":"מבנה תורה שבעל פה","q":"באיזו שפה כתובה רוב הגמרא הבבלית?","o":["עברית מקראית","יוונית","ארמית בבלית","ערבית"],"a":2,"ex":"הדיונים בגמרא הבבלית מתנהלים בעיקר בארמית בבלית, אבל מקורות תנאיים מובאים בעברית."},{"id":"y-8","topic":"מבנה תורה שבעל פה","q":"באיזו שפה כתובה המשנה?","o":["ארמית","יוונית","ערבית יהודית","עברית (לשון חכמים)"],"a":3,"ex":"המשנה כתובה בלשון חכמים, עברית שונה מעט מעברית המקרא."},{"id":"y-9","topic":"מבנה תורה שבעל פה","q":"מהם מדרשי ההלכה?","o":["חיבורים תנאיים הלומדים הלכות מתוך פסוקי התורה","פירושי הראשונים על הגמרא","ספרי שאלות ותשובות","סיפורי אגדה על חכמים"],"a":0,"ex":"מדרשי ההלכה (כמו מכילתא, ספרא וספרי) לומדים את ההלכה ישירות מהפסוקים."},{"id":"y-10","topic":"מבנה תורה שבעל פה","q":"על איזה ספר בתורה נכתב ה\"ספרא\" (תורת כהנים)?","o":["בראשית","ויקרא","שמות","דברים"],"a":1,"ex":"הספרא, הנקרא גם תורת כהנים, הוא מדרש הלכה על ספר ויקרא."},{"id":"y-11","topic":"מבנה תורה שבעל פה","q":"על איזה ספר נכתבה המכילתא?","o":["ויקרא","במדבר","שמות","בראשית"],"a":2,"ex":"המכילתא היא מדרש הלכה על ספר שמות."},{"id":"y-12","topic":"מבנה תורה שבעל פה","q":"על אילו ספרים נכתב ה\"ספרי\"?","o":["בראשית ושמות","ויקרא בלבד","שמות וויקרא","במדבר ודברים"],"a":3,"ex":"הספרי הוא מדרש הלכה על ספרי במדבר ודברים."},{"id":"y-13","topic":"מבנה תורה שבעל פה","q":"מהי ההבחנה בין הלכה לאגדה?","o":["הלכה עוסקת בדינים למעשה, ואגדה בסיפורים, מוסר ואמונה","הלכה היא בעברית ואגדה בארמית","הלכה היא מן התורה ואגדה מדרבנן","אין הבדל, אלו שני שמות לאותו דבר"],"a":0,"ex":"התלמוד משלב הלכה (דינים) ואגדה (סיפורים, מוסר, פירושי פסוקים)."},{"id":"y-14","topic":"מבנה תורה שבעל פה","q":"מדוע מתחילה כל מסכת בבבלי מדף ב' ולא מדף א'?","o":["כי דף א' אבד","כי דף השער של הדפוס נחשב כדף א'","כי דף א' מוקדש לרש\"י","כי אסור להתחיל מאות א'"],"a":1,"ex":"לפי ההסבר המקובל, דף השער נחשב לדף הראשון, ולכן הטקסט מתחיל בדף ב'."},{"id":"y-15","topic":"מבנה תורה שבעל פה","q":"מהי המשנה הראשונה בש\"ס?","o":["\"ארבעה אבות נזיקין\" (בבא קמא)","\"משה קיבל תורה מסיני\" (אבות)","\"מאימתי קורין את שמע בערבין?\" (ברכות)","\"אור לארבעה עשר\" (פסחים)"],"a":2,"ex":"הש\"ס נפתח במסכת ברכות, בשאלה מתי קוראים קריאת שמע י ויתר להם"],"a":1,"ex":"הגמרא מדגישה את הענווה של בית הלל, שהקדימו את דברי בית שמאי לדבריהם."},{"id":"y-143","topic":"בית שמאי ובית הלל","q":"מה המחלוקת בעניין נרות חנוכה?","o":["בית שמאי: נר אחד כל הלילות; בית הלל: שמונה כל הלילות","בית שמאי: בבוקר; בית הלל: בלילה","בית שמאי: מתחילים בשמונה ופוחתים; בית הלל: מתחילים באחד ומוסיפים","אין מחלוקת בעניין זה"],"a":2,"ex":"ההלכה כבית הלל: מוסיפים נר בכל לילה, כי \"מעלין בקודש ואין מורידין\"."},{"id":"y-144","topic":"בית שמאי ובית הלל","q":"מה המחלוקת בסדר הברכות בקידוש?","o":["בית שמאי: רק על היין; בית הלל: רק על היום","בית שמאי: בעמידה; בית הלל: בישיבה","בית שמאי: בבוקר; בית הלל: בערב","בית שמאי: על היום ואחר כך על היין; בית הלל: על היין ואחר כך על היום"],"a":3,"ex":"ההלכה כבית הלל: מברכים \"בורא פרי הגפן\" ואחר כך ברכת קידוש היום."},{"id":"y-145","topic":"בית שמאי ובית הלל","q":"מה המחלוקת בעניין התנוחה בקריאת שמע?","o":["בית שמאי: בערב בשכיבה ובבוקר בעמידה; בית הלל: כל אדם קורא כדרכו","בית שמאי: רק בישיבה; בית הלל: רק בעמידה","בית שמאי: בלחש; בית הלל: בקול","אין מחלוקת בעניין זה"],"a":0,"ex":"בית שמאי דרשו \"ובשכבך ובקומך\" כתנוחת גוף, ובית הלל הבינו זאת כזמן הקריאה."},{"id":"y-146","topic":"בית שמאי ובית הלל","q":"מה המחלוקת בעניין ביצה שנולדה ביום טוב?","o":["בית שמאי: אסור; בית הלל: מותר","בית שמאי: מותר לאוכלה; בית הלל: אסור","שניהם מתירים","שניהם אוסרים"],"a":1,"ex":"זו המשנה הראשונה במסכת ביצה, וההלכה כבית הלל."},{"id":"y-147","topic":"בית שמאי ובית הלל","q":"מה דינו של מי שנוהג כבית שמאי במקום שההלכה כבית הלל?","o":["יצא ידי חובה","עשה מצווה מן המובחר","לא עשה כלום (בית שמאי במקום בית הלל אינה משנה)","חייב להחמיר גם כבית הלל"],"a":2,"ex":"הכלל בגמרא: \"בית שמאי במקום בית הלל אינה משנה\", כלומר אין לדעתם תוקף להלכה."},{"id":"y-148","topic":"בית שמאי ובית הלל","q":"לפי הגמרא, מתי רבו המחלוקות בישראל?","o":["בזמן משה רבנו","בתקופת הגאונים","רק אחרי חתימת התלמוד","כשרבו תלמידי שמאי והלל שלא שימשו את רבותיהם כראוי"],"a":3,"ex":"בסנהדרין (פח:) נאמר שהמחלוקות רבו כשהתלמידים לא שימשו את רבותיהם כל צורכם."},{"id":"y-149","topic":"בית שמאי ובית הלל","q":"מה ענה הלל לגר שביקש ללמוד את כל התורה \"על רגל אחת\"?","o":["\"דעלך סני לחברך לא תעביד\", וזו כל התורה, ואידך פירושה הוא, זיל גמור","\"לך ולמד בעצמך\"","\"אין זה אפשרי\"","\"שמע ישראל\""],"a":0,"ex":"הלל קיבל את הגר בסבלנות וסיכם את התורה: מה ששנוא עליך אל תעשה לחברך."},{"id":"y-150","topic":"בית שמאי ובית הלל","q":"איזו תקנה תיקן הלל כדי שאנשים ימשיכו להלוות כסף לפני שנת שמיטה?","o":["עירובין","פרוזבול","קידוש החודש","ספירת העומר"],"a":1,"ex":"הפרוזבול מעביר את החוב לבית הדין, ולכן השמיטה אינה משמטת אותו."},{"id":"y-151","topic":"בית שמאי ובית הלל","q":"מה אמר שמאי במסכת אבות?","o":["\"אם אין אני לי מי לי\"","\"דע מאין באת ולאן אתה הולך\"","\"עשה תורתך קבע, אמור מעט ועשה הרבה, והוי מקבל את כל האדם בסבר פנים יפות\"","\"הוי זהיר במצוה קלה כבחמורה\""],"a":2,"ex":"זו המשנה באבות א:טו. \"אם אין אני לי מי לי\" נאמר על ידי הלל."},{"id":"y-152","topic":"בית שמאי ובית הלל","q":"מאיזו ארץ עלה הלל לארץ ישראל?","o":["מצרים","יוון","רומא","בבל"],"a":3,"ex":"הלל הגיע מבבל, ולמד אצל שמעיה ואבטליון בירושלים."},{"id":"y-153","topic":"בית שמאי ובית הלל","q":"מה היה תפקידו של הלל בהנהגה?","o":["נשיא","אב בית דין","כהן גדול","מלך"],"a":0,"ex":"הלל מונה לנשיא, ושמאי שימש כאב בית דין."},{"id":"y-154","topic":"בית שמאי ובית הלל","q":"מה בדרך כלל הנטייה של בית שמאי לעומת בית הלל?","o":["בית שמאי תמיד מקילים","בית שמאי בדרך כלל מחמירים ובית הלל מקילים, אך יש יוצאים מן הכלל","בית הלל תמיד מחמירים","אין שום נטייה"],"a":1,"ex":"בדרך כלל בית שמאי מחמירים, אבל במסכת עדויות יש רשימה של \"קולי בית שמאי וחומרי בית הלל\"."},{"id":"y-155","topic":"בית שמאי ובית הלל","q":"מה הנימוק של בית הלל להוספת נר בכל לילה של חנוכה?","o":["כנגד ימים הנכנסים","כנגד פרי החג","מעלין בקודש ואין מורידין","כי כך נהגו בבית המקדש"],"a":2,"ex":"בית הלל מנמקים: בקדושה עולים ואין יורדים."},{"id":"y-156","topic":"בית שמאי ובית הלל","q":"האם, למרות המחלוקות, נמנעו בית שמאי ובית הלל מלהתחתן אלה עם אלה?","o":["כן, הם נמנעו תמיד","רק בדורות האחרונים נמנעו","רק בית הלל נמנעו","לא, הם לא נמנעו, ונהגו זה עם זה באהבה ורעות"],"a":3,"ex":"המשנה ביבמות מלמדת שלא נמנעו לשאת נשים זה מזה, והגמרא מוסיפה שנהגו באהבה ורעות."},{"id":"y-157","topic":"מבנה דף הגמרא","q":"במרכז דף הגמרא מודפס:","o":["טקסט המשנה והגמרא","פירוש רש\"י","תוספות","עין משפט"],"a":0,"ex":"במרכז הדף נמצא הטקסט המרכזי, ומסביבו הפרשנים."},{"id":"y-158","topic":"מבנה דף הגמרא","q":"מה מסמנים הקיצורים \"מתני'\" ו\"גמ'\" בדף?","o":["מתנה וגמילות חסדים","תחילת המשנה ותחילת הגמרא","שמות של פרשנים","מספר העמוד"],"a":1,"ex":"\"מתני'\" (מתניתין) מסמן את המשנה, ו\"גמ'\" מסמן את תחילת דיון הגמרא."},{"id":"y-159","topic":"מבנה דף הגמרא","q":"מה פירוש \"עמוד א'\" ו\"עמוד ב'\"?","o":["שני כרכים","שני פרקים","שני צדי הדף: הצד הקדמי והצד האחורי","משנה וגמרא"],"a":2,"ex":"כל דף בגמרא כולל שני עמודים, ומציינים אותם בנקודה אחת (.) ובשתי נקודות (:)."},{"id":"y-160","topic":"מבנה דף הגמרא","q":"כיצד נקרא קטע בפירוש רש\"י או בתוספות שמתחיל במילים מן הגמרא?","o":["תא שמע","פסקא","סוגיא","דיבור המתחיל (ד\"ה)"],"a":3,"ex":"כל פירוש פותח במילים מהגמרא שעליהן הוא מפרש, וזה \"הדיבור המתחיל\"."}],"lessons":[{"id":"l-1","title":"איך לומדים סוגיה","body":"סוגיה היא יחידת דיון בגמרא: היא מתחילה בשאלה או במקור, עוברת דרך הצעות, קושיות ותירוצים, ומגיעה למסקנה. כדי ללמוד אותה טוב, לא קוראים אותה כמו סיפור אלא כמו ויכוח: בכל משפט שואלים מי מדבר, מה הוא טוען ולמה.\n\nשלב ראשון: קריאה ראשונית ופיסוק. קוראים את הקטע בקול, מפרידים בין משפטים ומסמנים מילות מפתח כמו \"תנן\", \"תניא\", \"אמר רב\", \"מיתיבי\", \"לא קשיא\". המילים האלה הן כמו תמרורים, והן מראות היכן מתחיל כל שלב בדיון.\n\nשלב שני: מיפוי. כותבים בצד שלד של הסוגיה: מקור, שאלה, הצעה, קושיה, תירוץ, מסקנה. כדאי לתת מספר לכל שלב ולציין בקצרה מה נאמר בו. מי שמסוגל לשרטט את הסוגיה בעצמו מבין אותה באמת.\n\nשלב שלישי: רש\"י. רש\"י מסביר מילים, משלים את מה שחסר בדיון ומסביר את ההיגיון. אחרי כל שלב שלא הבנתם, בדקו מה רש\"י אומר עליו. אחר כך תוכלו לעבור לתוספות, שמקשים ומשווים לסוגיות אחרות.\n\nשלב רביעי: חזרה במילים שלכם. נסו להסביר את הסוגיה לחברותא בלי להסתכל בגמרא. אם נתקעתם, זה הסימן לחזור דווקא למקום הזה. חזרה כזאת היא הדרך הטובה ביותר להתכונן לבחינה.","quiz":[{"q":"מה המטרה של \"מיפוי\" סוגיה?","o":["לתרגם כל מילה לעברית","לזהות את שלבי הדיון (מקור, קושיה, תירוץ, מסקנה) ואת הקשר ביניהם","לספור כמה שורות יש בסוגיה","למצוא את שם המחבר של הגמרא"],"a":1,"ex":"מיפוי מאפשר לראות את מבנה הוויכוח ולא רק את המילים."},{"q":"איזו מילה מסמנת בדרך כלל תחילת תירוץ?","o":["מיתיבי","תניא","לא קשיא","איבעיא להו"],"a":2,"ex":"\"לא קשיא\" פותחת תירוץ, לרוב בחילוק: \"כאן ב... כאן ב...\"."},{"q":"מה כדאי לעשות כשנתקעים בשלב מסוים בסוגיה?","o":["לדלג לסוף הפרק","לשנן את הקטע בעל פה בלי להבין","לקרוא רק את התוספות","לבדוק מה רש\"י אומר על השלב הזה"],"a":3,"ex":"רש\"י מסביר את המילים ואת ההיגיון של כל שלב, ולכן הוא הכלי הראשון."}]},{"id":"l-2","title":"מבנה דף הגמרא","body":"דף גמרא בדפוס וילנא בנוי כמו שכבות סביב מרכז. במרכז נמצא הטקסט של המשנה והגמרא. המשנה מסומנת במילה \"מתני'\", ותחילת הדיון של הגמרא מסומנת ב\"גמ'\".\n\nבצד הפנימי של הדף, קרוב לכריכה, מודפס פירוש רש\"י. בצד החיצוני מודפסים התוספות. כדי לזכור: רש\"י \"קרוב ללב\" של הספר, והתוספות מוסיפים מבחוץ. גם ברש\"י וגם בתוספות כל פירוש מתחיל ב\"דיבור המתחיל\", המילים מהגמרא שעליהן הוא מפרש.\n\nבשולי הדף יש כלי עזר. \"עין משפט נר מצוה\" מפנה למקום שבו נפסקה ההלכה ברמב\"ם, בטור ובשולחן ערוך. \"מסורת הש\"ס\" מפנה למקומות אחרים בש\"ס שבהם מופיע אותו עניין. \"תורה אור\" מציין את מקור הפסוקים שמובאים בגמרא.\n\nעוד בשולי הדף תמצאו את \"הגהות הב\"ח\", שמציעות תיקוני נוסח, ואת \"גליון הש\"ס\" של רבי עקיבא איגר. בצד הדף מודפסים לעיתים פירושים נוספים, כמו רבינו חננאל.\n\nכל דף מחולק לשני עמודים: עמוד א' ועמוד ב'. כשכותבים מראה מקום, למשל \"ברכות ב.\", הנקודה האחת מציינת עמוד א' ושתי נקודות (ב:) מציינות עמוד ב'.","quiz":[{"q":"היכן מודפס פירוש רש\"י?","o":["בצד הפנימי של הדף, קרוב לכריכה","בצד החיצוני של הדף","במרכז הדף","בסוף המסכת"],"a":0,"ex":"רש\"י בצד הפנימי ותוספות בצד החיצוני."},{"q":"מה תפקידו של \"עין משפט נר מצוה\"?","o":["להפנות לפסוקים בתנ\"ך","להפנות לפסק ההלכה ברמב\"ם, בטור ובשולחן ערוך","לתרגם את הארמית","לציין מספר דף"],"a":1,"ex":"עין משפט מחבר בין הסוגיה לפסק ההלכה."},{"q":"מה פירוש מראה המקום \"שבת כא:\"?","o":["מסכת שבת, פרק כ\"א, משנה ב'","מסכת שבת, דף כ\"א, עמוד א'","מסכת שבת, דף כ\"א, עמוד ב'","מסכת שבת, שורה 21"],"a":2,"ex":"שתי נקודות מציינות עמוד ב', ונקודה אחת מציינת עמוד א'."}]},{"id":"l-3","title":"רש\"י ותוספות: איך משתמשים","body":"רש\"י הוא המורה הצמוד שלכם בגמרא. הוא מסביר מילים קשות, מתרגם ביטויים בארמית, משלים את ההנחות שהגמרא לא אמרה במפורש, ומסביר למה כל קושיה היא קושיה. רש\"י בדרך כלל אינו מאריך, ולכן כל מילה שלו חשובה.\n\nהתוספות כתובים בסגנון אחר. הם מתחילים לעיתים קרובות בקושיה, על הגמרא או על רש\"י, ומשווים את הסוגיה לסוגיות אחרות בש\"ס. משפטים כמו \"וא\"ת\" (ואם תאמר) ו\"וי\"ל\" (ויש לומר) מסמנים אצלם קושיה ותירוץ.\n\nסדר עבודה מומלץ: קודם להבין שלב בגמרא, אחר כך לקרוא את רש\"י על השלב הזה, ורק אחרי שמבינים את הסוגיה כולה לעבור לתוספות. מי שקורא תוספות לפני שהבין את הגמרא עלול להתבלבל.\n\nכאשר רש\"י ותוספות חולקים, שווה לשאול מה גרם למחלוקת: האם הם קוראים את הנוסח אחרת? האם הם מבינים מילה אחרת? האם אחד מהם מתחשב בסוגיה ממקום אחר? שאלות כאלה מופיעות הרבה בבחינות.","quiz":[{"q":"מה מסמן הקיצור \"וא\"ת\" בתוספות?","o":["ואמר תנא: פתיחה של ברייתא","ואחר תבוא: סוף הדיון","ואין תשובה: קושיה בלי תירוץ","ואם תאמר: פתיחה של קושיה"],"a":3,"ex":"בתוספות \"וא\"ת\" פותח קושיה ו\"וי\"ל\" פותח תירוץ."},{"q":"מתי מומלץ לקרוא את התוספות?","o":["אחרי שהבנתם את הגמרא ואת רש\"י","לפני שקוראים את הגמרא","במקום רש\"י","רק בבחינה"],"a":0,"ex":"תוספות דנים בסוגיה שכבר הובנה, ולכן קודם מבינים את הבסיס."},{"q":"מה תפקידו העיקרי של רש\"י?","o":["לפסוק הלכה למעשה","להסביר את הגמרא, מילה אחרי מילה ושלב אחרי שלב","להקשות על הגמרא ממסכתות אחרות","לתקן את הנוסח בלבד"],"a":1,"ex":"רש\"י הוא פירוש רציף שמטרתו להבין את פשט הגמרא."}]},{"id":"l-4","title":"קיצורים נפוצים","body":"הגמרא חוסכת מקום בעזרת ראשי תיבות. מי שמכיר אותם קורא הרבה יותר מהר. הנה כמה מהנפוצים: א\"ר = אמר רבי (או אמר רב); ת\"ר = תנו רבנן; ת\"ש = תא שמע; ש\"מ = שמע מינה; קמ\"ל = קא משמע לן; מ\"ט = מאי טעמא; ה\"ד = היכי דמי.\n\nקיצורים נוספים שחוזרים הרבה: א\"ל = אמר ליה; ל\"ק = לא קשיא; ה\"נ = הכי נמי; ה\"מ = הני מילי; א\"נ = אי נמי; ס\"ד = סלקא דעתך; דכ\"ע = דכולי עלמא; מ\"ד = מאן דאמר; ת\"ק = תנא קמא; ק\"ו = קל וחומר; ג\"ש = גזירה שווה; אע\"ג = אף על גב.\n\nבפרשנים תמצאו גם: ד\"ה = דיבור המתחיל; וא\"ת = ואם תאמר; וי\"ל = ויש לומר; כו' = וכולי (הציטוט ממשיך); מתני' = מתניתין; גמ' = גמרא.\n\nשימו לב: יש קיצורים עם כמה פירושים. למשל ר\"י יכול להיות רבי יהודה, רבי יוחנן, רבי יוסי, ובתוספות גם ר\"י בעל התוספות. ההקשר קובע: בודקים מי מדבר באותה סוגיה ומה רש\"י אומר.\n\nטיפ: כשאתם פוגשים קיצור לא מוכר, פתחו אותו בכתב בשולי הדף. אחרי כמה פעמים הוא כבר יהיה מוכר לכם.","quiz":[{"q":"מה פירוש הקיצור ש\"מ?","o":["שמואל מר","שמעון משום","שמע מינה","שם משנה"],"a":2,"ex":"ש\"מ = שמע מינה: \"למד מכאן\", סיום של ראיה."},{"q":"מה פירוש הקיצור קמ\"ל?","o":["קמא לישנא","קשיא מאי לאו","קרא מלמד לנו","קא משמע לן"],"a":3,"ex":"קמ\"ל מציין את החידוש: \"בא להשמיע לנו\"."},{"q":"למה צריך להיזהר בקיצור ר\"י?","o":["כי יש לו כמה פירושים אפשריים, וההקשר קובע","כי הוא תמיד שגוי בדפוס","כי הוא מופיע רק בירושלמי","כי הוא קיצור של פסוק"],"a":0,"ex":"ר\"י יכול להיות רבי יהודה, רבי יוחנן, רבי יוסי ועוד."}]},{"id":"l-5","title":"איך מזהים קושיה ותירוץ","body":"קושיה היא \"נקודת לחץ\" בסוגיה. יש שלושה סוגים עיקריים: סתירה בין מקורות (\"ורמינהו\", \"והתניא\"), קושיה ממקור תנאי על אמורא (\"מיתיבי\"), וקושיה הגיונית (\"מתקיף לה\", \"פשיטא\", \"ממה נפשך\").\n\nמילים שפותחות קושיה: והא, והתנן, והתניא, והאמר, מיתיבי, ורמינהו, איתיביה, מתקיף לה, פשיטא, אי הכי, אלא מעתה, בשלמא... אלא... מאי איכא למימר.\n\nמילים שפותחות תירוץ: לא קשיא, הכא במאי עסקינן, איבעית אימא, שאני התם, הכי השתא, מהו דתימא... קמ\"ל, חסורי מיחסרא. לתירוץ יש בדרך כלל אחת משלוש צורות: חילוק בין מקרים (\"כאן... כאן...\"), העמדה של המקור במקרה מסוים (אוקימתא), או פירוש מחודש של המקור.\n\nאיך יודעים איך הסתיימה הקושיה? \"תיובתא\" אומרת שהדעה נדחתה. \"קשיא\" אומרת שנשאר קושי שלא נפתר. \"תיקו\" שייך לשאלה (איבעיא) ולא לקושיה, והוא אומר שהשאלה נשארה בספק.\n\nבבחינה מבקשים לעיתים קרובות: \"הסבר את הקושיה ואת התירוץ\". תשובה טובה מציגה שלושה דברים: מה ההנחה שעליה מקשים, מה המקור שסותר אותה, ואיך התירוץ מבטל את הסתירה.","quiz":[{"q":"מה מסמנת המילה \"מיתיבי\"?","o":["תירוץ באמצעות העמדה","קושיה ממקור תנאי על דברי אמורא","מסקנה להלכה","פתיחה של סיפור"],"a":1,"ex":"\"מיתיבי\" מביא משנה או ברייתא שסותרת את דברי האמורא."},{"q":"מה ההבדל בין \"תיובתא\" ל\"קשיא\"?","o":["אין הבדל","קשיא היא הפרכה מוחלטת, ותיובתא היא קושי קל","תיובתא היא הפרכה מוחלטת, וקשיא היא קושי שנשאר בלי לדחות לגמרי את הדעה","תיובתא היא תירוץ"],"a":2,"ex":"בתיובתא הדעה נדחית, ובקשיא הקושיה נשארת פתוחה."},{"q":"איזו צורה של תירוץ היא \"הכא במאי עסקינן\"?","o":["קושיה מפסוק","הבאת ראיה","פסק הלכה","העמדה של המקור במקרה מסוים (אוקימתא)"],"a":3,"ex":"\"הכא במאי עסקינן\" מצמצם את המקור למקרה שבו אין סתירה."}]},{"id":"l-6","title":"ארמית בסיסית: כינויים ומילות שאלה","body":"הארמית של הבבלי קרובה לעברית, ולכן הרבה מילים מוכרות. הדבר החשוב הוא להכיר את המילים הקטנות שחוזרות כל הזמן: כינויים, מילות שאלה ומילות יחס.\n\nכינויי גוף: אנא = אני; את = אתה; איהו = הוא; איהי = היא; אנן = אנחנו; אתון = אתם; אינהו = הם. כינויי רמז: האי = זה; הא = זו (וגם \"הרי\"); הני = אלו; ההוא / ההיא = ההוא / ההיא.\n\nמילות שאלה: מאי = מה; היכי = איך; אמאי = למה; מאן = מי; היכא = איפה (או באיזה מקרה); אימת = מתי; כמאן = כשיטת מי; ממאי = מניין לך; מי = האם (בתחילת שאלה, ולא \"מי\" בעברית!).\n\nסיומות שייכות: ־יה = שלו או לו (ליה = לו, ביה = בו, מיניה = ממנו); ־ה = שלה או לה (לה, מינה); ־הו / ־ייהו = שלהם (להו = להם, בינייהו = ביניהם); לן = לנו. ד־ בתחילת מילה פירושה ש־ או של (דכתיב = שכתוב).\n\nשימו לב לסיומת ־א בסוף שמות עצם: היא משמשת כמו ה\"א הידיעה בעברית. גברא = האיש, קרא = הפסוק, מילתא = הדבר.","quiz":[{"q":"מה פירוש המילה \"אמאי\"?","o":["למה","מתי","איפה","מי"],"a":0,"ex":"\"אמאי\" היא שאלה על הסיבה: למה, מדוע."},{"q":"מה פירוש \"מינה\" בביטוי \"שמע מינה\"?","o":["אותה","ממנה","לנו","שלהם"],"a":1,"ex":"הסיומת ־ה מציינת נקבה: מינה = ממנה, ומיניה = ממנו."},{"q":"מה פירוש \"מי\" בתחילת שאלה בגמרא, כמו \"מי כתיב...?\"","o":["מי (איזה אדם)","מה","האם","למה"],"a":2,"ex":"בארמית \"מי\" בתחילת שאלה פירושה \"האם\", ומי (אדם) היא \"מאן\"."}]},{"id":"l-7","title":"ארמית בסיסית: פעלים","body":"הפעלים בארמית בנויים משורש כמו בעברית, ולכן אפשר לזהות את המשמעות לפי השורש. מה שמשתנה הוא התחיליות והסיומות שמראות מי עושה ובאיזה זמן.\n\nסיומות גוף חשובות: ־נא = אני (אמינא = אני אומר, ידענא = אני יודע); ־ת = אתה (אמרת = אמרת); ־ינן = אנחנו (בעינן = אנו צריכים, אמרינן = אנו אומרים, חיישינן = אנו חוששים); ־י = הם, בבינוני רבים (אמרי = אומרים, פליגי = חולקים).\n\nזמנים: עבר נראה לרוב כמו בעברית (אמר, אתא = בא). הווה מופיע כבינוני, ולעיתים עם המילית \"קא\" (קאמר = אומר, קתני = שונה). עתיד וציווי מקבלים לעיתים קרובות תחילית ל־ או נ־ (לימא / נימא = שנאמר, נאמר; ליתני = שישנה).\n\nשם הפועל מקבל תחילית מ־ ומופיע לרוב עם ל־: למימר = לומר, למיעבד = לעשות, למיזל = ללכת. פעלים סבילים או חוזרים מקבלים לעיתים קרובות את־ או אית־: איתמר = נאמר, איבעיא = נשאלה.\n\nכדאי להכיר כמה פעלים שחוזרים כל הזמן: אמר (אמר), תנא / תני (שנה), סבר (סבר), בעי (שאל, או צריך), אתא (בא), אזל (הלך), חזי (ראה), עביד (עושה), שמע (שמע), פליג (חולק).","quiz":[{"q":"מה פירוש \"בעינן\"?","o":["אני שואל","הם רוצים","שאלתי","אנו צריכים"],"a":3,"ex":"הסיומת ־ינן מציינת \"אנחנו\": בעינן = אנו צריכים."},{"q":"מה פירוש \"למימר\"?","o":["לומר","שאמר","אמרנו","יאמר"],"a":0,"ex":"שם הפועל בארמית בא עם מ־: למימר = לומר."},{"q":"מה פירוש \"איתמר\"?","o":["אמרתי","נאמר","תאמר","אמרו"],"a":1,"ex":"את־ / אית־ מציינים צורה סבילה: איתמר = נאמר. זו גם הפתיחה של מחלוקת אמוראים."}]},{"id":"l-8","title":"המקורות בסוגיה: משנה, ברייתא ומימרא","body":"בכל סוגיה חשוב לדעת מאיזה סוג מקור מגיע כל משפט, כי הסמכות של המקורות שונה. מקור תנאי (משנה או ברייתא) חזק יותר ממימרא של אמורא, ולכן קושיה ממקור תנאי על אמורא היא קושיה חמורה.\n\nמשנה מסומנת במילה \"תנן\" (שנינו) או \"מתניתין\". ברייתא מסומנת ב\"תניא\", \"תנו רבנן\", \"תני\" או \"תנא\". דברי אמורא מסומנים ב\"אמר רב פלוני\", ומחלוקת אמוראים נפתחת לעיתים קרובות ב\"איתמר\".\n\nדברי הגמרא שאינם מיוחסים לחכם, כמו \"מאי טעמא?\" או \"אמרי: לא קשיא\", נקראים \"סתמא דגמרא\". הם מנהלים את הדיון: הם שואלים, מקשים ומחברים בין המקורות.\n\nמקור נוסף הוא פסוק (\"דכתיב\", \"דאמר קרא\"). כשהגמרא שואלת \"מנא הני מילי?\", היא מחפשת את שורש הדין בתורה. לפעמים התשובה היא \"סברא היא\", כלומר הדין נובע מהיגיון ואין צורך בפסוק.\n\nכדאי לסמן בצבעים שונים את סוגי המקורות בדף שאתם לומדים. אחרי כמה סוגיות תזהו מיד מי מדבר ומה משקל דבריו.","quiz":[{"q":"איזו פתיחה מציינת ציטוט ממשנה?","o":["תניא","איתמר","תנן","אמר רבא"],"a":2,"ex":"\"תנן\" = שנינו במשנה, ו\"תניא\" = שנינו בברייתא."},{"q":"מדוע קושיה מברייתא על אמורא חמורה במיוחד?","o":["כי ברייתא כתובה בארמית","כי ברייתא היא תמיד הלכה","כי אמורא אינו מכיר ברייתות","כי ברייתא היא מקור תנאי, ואמורא אינו חולק על תנאים"],"a":3,"ex":"אמורא אינו רשאי לחלוק על תנא, ולכן עליו ליישב את הסתירה או שדבריו יידחו."},{"q":"מהו \"סתמא דגמרא\"?","o":["דברי הגמרא שאינם מיוחסים לחכם מסוים ומנהלים את הדיון","משנה בלי שם חכם","ברייתא שלא נמצאת בתוספתא","פירוש של רש\"י"],"a":0,"ex":"הסתמא שואל, מקשה ומתרץ, ומחבר בין המקורות."}]},{"id":"l-9","title":"מחלוקת ו\"מאי בינייהו\"","body":"רוב הסוגיות עוסקות במחלוקת. כשאתם פוגשים מחלוקת, יש לבדוק שלושה דברים: מי החולקים (תנאים או אמוראים), מה כל אחד אומר, ומה הטעם של כל אחד.\n\nהגמרא שואלת לעיתים קרובות \"במאי קא מיפלגי?\", כלומר על מה באמת הם חולקים. התשובה היא בדרך כלל עיקרון: פירוש שונה של פסוק, סברה שונה, או הערכה שונה של המציאות.\n\nכששני חכמים אומרים אותו דין אבל מטעמים שונים, הגמרא שואלת \"מאי בינייהו?\" (מה ההבדל ביניהם?). התשובה, \"איכא בינייהו...\", מציגה מקרה שבו שני הטעמים מובילים לתוצאות שונות. זו \"נפקא מינה\".\n\nלפעמים הגמרא מנסה להראות שמחלוקת אמוראים היא בעצם מחלוקת תנאים (\"נימא כתנאי\"). לרוב היא דוחה זאת ומראה שגם התנאים יכולים להסכים לשתי הדעות.\n\nבבחינה מבקשים לעיתים קרובות להשוות בין שיטות. טבלה עם עמודה לכל חכם (דין, טעם, מקור, נפקא מינה) היא דרך מצוינת לסדר את התשובה.","quiz":[{"q":"מה שואלת הגמרא כשהיא אומרת \"מאי בינייהו?\"","o":["מי צודק","מה ההבדל המעשי בין שתי הדעות או שני הטעמים","מאיפה הפסוק","מה פירוש המילה"],"a":1,"ex":"\"מאי בינייהו\" מחפש את הנפקא מינה בין הטעמים."},{"q":"מה פירוש \"במאי קא מיפלגי?\"","o":["כמה חכמים חולקים","האם הם באמת חולקים","על מה (באיזה עיקרון) הם חולקים","מי אמר את הדעה הראשונה"],"a":2,"ex":"השאלה מחפשת את שורש המחלוקת."},{"q":"מה בדרך כלל עושה הגמרא עם ההצעה \"נימא כתנאי\"?","o":["מקבלת אותה תמיד","משתמשת בה כפסק הלכה","מתעלמת ממנה","דוחה אותה ומראה שהתנאים יכולים להסכים לשתי הדעות"],"a":3,"ex":"בדרך כלל הגמרא דוחה את ההצעה, כדי שלא לתלות את מחלוקת האמוראים במחלוקת תנאים."}]},{"id":"l-10","title":"איך עונים על שאלה בבגרות","body":"קראו את השאלה פעמיים וסמנו את מילת ההוראה: \"הסבר\", \"השווה\", \"הבא ראיה\", \"מה הקושיה\". כל מילה כזו דורשת סוג אחר של תשובה. \"הסבר\" דורש נימוק, \"השווה\" דורש להראות דמיון והבדל, ו\"צטט\" דורש מילים מהמקור.\n\nענו במבנה ברור: משפט פתיחה שעונה ישירות על השאלה, אחריו ציטוט קצר מהגמרא שמבסס את דבריכם, ואחריו הסבר במילים שלכם. הבודק רוצה לראות שהבנתם, ולא רק שזכרתם.\n\nכשנשאלים על קושיה ותירוץ, כתבו את שלושת החלקים: מה ההנחה, מה סותר אותה, ואיך התירוץ פותר את הסתירה. כשנשאלים על מחלוקת, הציגו את שתי הדעות, את הטעם של כל אחת ואת ההבדל המעשי.\n\nהשתמשו במונחים הנכונים: \"תיובתא\", \"אוקימתא\", \"מקור תנאי\", \"מימרא\". מונח מדויק מראה שליטה בחומר. אם אתם מתרגמים ארמית, תרגמו במדויק ולא בערך.\n\nנהלו את הזמן: עברו קודם על כל השאלות, ענו על מה שאתם בטוחים בו, וחזרו לשאלות הקשות. בסוף קראו שוב את התשובות ובדקו שעניתם על מה ששאלו. את מבנה הבחינה המדויק כדאי לבדוק עם המורה מול תוכנית הלימודים העדכנית.","quiz":[{"q":"מה דורשת מילת ההוראה \"השווה\"?","o":["להראות גם את הדמיון וגם את ההבדל בין שני דברים","לתרגם את הקטע","לכתוב רק את ההבדל","לצטט את המשנה"],"a":0,"ex":"השוואה מלאה כוללת נקודות דמיון והבדל."},{"q":"מה המבנה המומלץ לתשובה?","o":["ציטוט ארוך של כל הסוגיה","תשובה ישירה, ציטוט קצר מהמקור והסבר במילים שלכם","סיכום כללי של הפרק","רשימה של מונחים בלי הסבר"],"a":1,"ex":"המבנה הזה מראה גם ידיעה וגם הבנה."},{"q":"כשנשאלים על קושיה ותירוץ, מה חשוב לכלול?","o":["רק את התירוץ","רק את שם האמורא","את ההנחה, את מה שסותר אותה ואת הדרך שבה התירוץ פותר את הסתירה","את מספר הדף"],"a":2,"ex":"שלושת החלקים מראים שהבנתם את ההיגיון של הדיון."}]},{"id":"l-11","title":"קטע שלא נלמד: אסטרטגיה","body":"קטע גמרא שלא למדתם נראה מפחיד, אבל הוא בנוי מאותן אבני בניין שאתם כבר מכירים. המטרה היא לא להבין כל מילה, אלא לזהות את המבנה ולהשתמש בו כדי להבין את התוכן.\n\nשלב 1: סריקה. עברו על הקטע וסמנו את התמרורים: תנן, תניא, אמר רב, איתמר, מיתיבי, לא קשיא, תיובתא, שמע מינה, תיקו. כך תראו מיד היכן כל שלב מתחיל ונגמר.\n\nשלב 2: חלוקה. חלקו את הקטע ליחידות וכתבו ליד כל יחידה את התפקיד שלה: מקור, שאלה, קושיה, תירוץ, מסקנה. גם אם אינכם מבינים פרט מסוים, התפקיד שלו בדרך כלל ברור מההקשר.\n\nשלב 3: תרגום ממוקד. תרגמו רק את המשפטים החשובים, בעזרת המילים הנפוצות שלמדתם (מאי, אמאי, הכא, התם, איכא, ליכא...). מילה שאינה מוכרת: נסו לזהות את השורש העברי שלה, או הסיקו את המשמעות מההקשר.\n\nשלב 4: קריאת השאלות. לעיתים קרובות השאלות עצמן רומזות על המבנה, למשל \"מה הקושיה של הגמרא?\" או \"איך מתרצת הגמרא?\". ענו בזהירות, צטטו את המילים מהקטע, והסבירו אותן במילים שלכם.","quiz":[{"q":"מה הצעד הראשון המומלץ בקטע שלא נלמד?","o":["לתרגם כל מילה לפי הסדר","לדלג על הקטע","לכתוב את כל מה שזוכרים מהמסכת","לסרוק ולסמן מילות מבנה כמו תנן, מיתיבי, לא קשיא"],"a":3,"ex":"מילות המבנה הן מפת הדרכים של הקטע."},{"q":"מה עושים עם מילה ארמית לא מוכרת?","o":["מנסים לזהות את השורש העברי או להסיק מההקשר","עוצרים ולא ממשיכים","כותבים שהקטע לא מובן","מחליפים אותה במילה אחרת"],"a":0,"ex":"לרוב מילים ארמיות קרובות לעברית, וההקשר עוזר מאוד."},{"q":"איך השאלות עצמן יכולות לעזור?","o":["הן מכילות את כל התשובות","הן רומזות על המבנה של הקטע (קושיה, תירוץ וכדומה)","הן מתרגמות את הקטע","הן לא עוזרות כלל"],"a":1,"ex":"שאלה כמו \"מה הקושיה?\" מלמדת שיש בקטע קושיה, וכדאי לחפש אותה."}]},{"id":"l-12","title":"מהסוגיה להלכה","body":"הגמרא אינה ספר פסקים. היא דיון, ולעיתים קרובות היא אינה אומרת במפורש מה ההלכה. כדי להבין מה עושים למעשה, צריך ללכת בעקבות הפוסקים.\n\nהשלב הראשון הוא הראשונים שסיכמו את ההלכה מתוך התלמוד: הרי\"ף כתב קיצור של הגמרא לפי ההלכה, הרמב\"ם חיבר את משנה תורה לפי נושאים, והרא\"ש כתב פסקים על הגמרא. בגמרא עצמה, \"עין משפט נר מצוה\" מראה היכן נפסקה ההלכה של כל סוגיה.\n\nהשלב השני הוא הטור, של רבי יעקב בנו של הרא\"ש, שחילק את ההלכה לארבעה חלקים. אחריו כתב רבי יוסף קארו את \"בית יוסף\" על הטור, ואת השולחן ערוך כסיכום שלו. הרמ\"א הוסיף את פסקי ומנהגי אשכנז.\n\nכדי לפסוק מתוך הגמרא משתמשים בכללי פסיקה: הלכה כרבים, הלכה כבית הלל, הלכה כרבא נגד אביי (חוץ משישה מקרים), ספק דאורייתא לחומרא וספק דרבנן לקולא, ועוד.\n\nבבחינה מבקשים לעיתים לקשר בין הסוגיה לפסק: למשל, \"כיצד פסק הרמב\"ם, ומאיזה שלב בסוגיה הוא למד זאת?\". חשוב להבחין בין ה\"הוה אמינא\", ההבנה הראשונית, לבין המסקנה, כי הפסק תמיד יוצא מהמסקנה.","quiz":[{"q":"איזה כלי בדף הגמרא מראה היכן נפסקה ההלכה של הסוגיה?","o":["תורה אור","גליון הש\"ס","עין משפט נר מצוה","מסורת הש\"ס"],"a":2,"ex":"עין משפט מפנה לרמב\"ם, לטור ולשולחן ערוך."},{"q":"על איזה ספר כתב רבי יוסף קארו את \"בית יוסף\"?","o":["על הרמב\"ם","על הרי\"ף","על רש\"י","על הטור"],"a":3,"ex":"בית יוסף הוא פירוש רחב על הטור, והשולחן ערוך הוא תמצית שלו."},{"q":"מאיזה שלב בסוגיה נלמדת ההלכה?","o":["מהמסקנה, ולא מההוה אמינא","מהקושיה הראשונה","מההוה אמינא","מהמקור הראשון שהובא"],"a":0,"ex":"ההוה אמינא נדחית בדיון, ולכן ההלכה נלמדת מהמסקנה."}]}]};

const NIQ=/[֑-ׇ]/g;
function gemSpeech(t){
  t=String(t||"").replace(/<[^>]+>/g," ");
  t=t.replace(/\([^)]*\)/g," ").replace(/[\[\]]/g,"");           // (…) = deleted text in the printed edition, […] = added text
  t=t.replace(/["]/g,"״").replace(/[']/g,"׳");
  t=t.split(/(\s+)/).map(w=>{const m=w.match(/^([^א-ת]*)(.*?)([.,:;?!—–\-]*)$/);if(!m)return w;const bare=m[2].replace(NIQ,"");
    if(ABBR[bare])return m[1]+ABBR[bare]+m[3];
    const pre=bare.match(/^([ודהלבכשמ]{1,2})(.+[״׳].*)$/);if(pre&&ABBR[pre[2]])return m[1]+pre[1]+ABBR[pre[2]]+m[3];
    if(/[״׳]/.test(bare))return m[1]+bare.replace(/[״׳]/g,"")+m[3];   // unknown abbreviation: read letters as a word
    return w}).join("");
  return t.replace(/\s*[—–]\s*/g,", ").replace(/:/g,". ").replace(/\s+/g," ").trim();
}

  const parts=gemSpeech(t).match(/[^.?!]+[.?!]*/g)||[];const q=[];
  for(const p of parts){let s=p.trim();while(s.length>180){const k=s.lastIndexOf(",",180)>60?s.lastIndexOf(",",180):s.lastIndexOf(" ",180);q.push(s.slice(0,k+1));s=s.slice(k+1).trim()}if(s)q.push(s)}

function micInto(btn,ta){if(!SR){btn.remove();return}let rec=null;btn.onclick=()=>{if(rec){rec.stop();return}stopVoice();rec=new SR();rec.lang="he-IL";rec.continuous=true;rec.interimResults=true;const base=ta.value?ta.value.trim()+" ":"";let fin="";
  rec.onresult=e=>{let it="";for(let k=e.resultIndex;k<e.results.length;k++){const x=e.results[k];if(x.isFinal)fin+=x[0].transcript+" ";else it+=x[0].transcript}ta.value=(base+fin+it).trim()};
  rec.onend=()=>{rec=null;btn.classList.remove("on")};try{rec.start();btn.classList.add("on")}catch(e){rec=null}}}

    const w=deck[i];let f=false;

     <div class="card flash" id="fc"><div><div class="w">${esc(w.w)}</div><div class="label">לחצו כדי לראות פירוש</div></div></div>
     <div class="row"><button class="btn ghost" id="sp">🔊</button><button class="btn ghost" id="no">עוד לא 🤔</button><button class="btn" id="yes">ידעתי ✅</button></div>`;

/* ===== masechet & daf ===== */
function masechet(m){const M=MAS[m];const L=S.learned;
  const dafsOf=(a,b)=>{const out=[];let n=a[0],s=a[1];while(n<b[0]||(n===b[0]&&(s<=b[1]||b[1]==="b"&&s==="a"))){out.push([n,s]);if(s==="a")s="b";else{s="a";n++}if(n>b[0]||(n===b[0]&&s>b[1]&&b[1]==="a"))break}return out};
  app.innerHTML=`<div class="top"><button class="x" id="back">→</button><h2 class="grow">📖 מסכת ${M.he}</h2></div><p class="label">${M.unit}</p>
   ${M.perakim.map((p,i)=>{const end=i<M.perakim.length-1?(M.perakim[i+1][2]==="a"?[M.perakim[i+1][1]-1,"b"]:[M.perakim[i+1][1],"a"]):M.last;const ds=dafsOf([p[1],p[2]],end);const done=ds.filter(d=>L[m+"."+d[0]+d[1]]).length;
     return `<details class="card" ${i===0?"open":""}><summary><b>פרק ${gem(i+1)}: ${esc(p[0])}</b> <span class="label">· ${done}/${ds.length} עמודים</span></summary><div class="dafs">${ds.map(d=>`<button data-d="${d[0]}${d[1]}" class="${L[m+"."+d[0]+d[1]]?"done":""}">${dafHe(d[0],d[1])}</button>`).join("")}</div></details>`}).join("")}`;
  $("#back").onclick=home;app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const v=b.dataset.d;daf(m,+v.slice(0,-1),v.slice(-1))});
}

async function dafQuiz(m,n,a,txt,kind){
  app.innerHTML=`<div class="top"><button class="x" id="back">→</button><h2 class="grow">${kind==="unseen"?"🧭 קטע שלא נלמד":"✍️ שאלות בגרות"}</h2></div><div class="card center"><div class="label">המורה מכין שאלות… ✍️</div></div>`;$("#back").onclick=home;

  if(d.error||!d.q){app.querySelector(".card").innerHTML=`<p>${errMsg(d)}</p>`;return}
  let i=0,tot=0;const qs=d.q;
  const draw=()=>{if(i>=qs.length){act();const avg=Math.round(tot/qs.length);S.quiz[kind+":"+m+n+a]=avg;save();app.innerHTML=`<div class="card center"><div style="font-size:48px">${avg>=80?"🏆":avg>=60?"👏":"💪"}</div><h2>ממוצע: ${avg}</h2><p>${avg>=80?"מוכנים לבגרות על הקטע הזה!":"כדאי לחזור על הקטע ולנסות שוב."}</p></div><button class="btn wide" id="hm">למסך הבית</button>`;$("#hm").onclick=home;return}
    const q=qs[i];
    app.innerHTML=`<div class="top"><button class="x" id="back">→</button><b class="grow">${dafName(m,n,a)}</b><span class="chip">${i+1}/${qs.length}</span></div>
     <details class="card" ${kind==="unseen"||i===0?"open":""}><summary class="label">📜 הקטע</summary><div class="gtext" style="font-size:19px">${esc(txt).replace(/\n/g,"<br>")}</div></details>
     <div class="card"><div style="font-size:19px;font-weight:600">${esc(q.q)}</div><button class="btn ghost sm" id="rq">🔊 הקראת השאלה</button></div>
     <div class="card"><label class="label" for="ta">התשובה שלכם: כתבו או לחצו 🎤 ותגידו בקול</label><textarea id="ta"></textarea><div class="row"><button class="mic" id="mic" aria-label="דיבור">🎤</button><button class="btn" id="chk">בדיקת התשובה</button></div><button class="link" id="show" style="color:var(--accent);text-decoration:underline">הצגת תשובה לדוגמה</button></div><div id="fbk"></div>`;
    $("#back").onclick=home;$("#rq").onclick=()=>speak(q.q);micInto($("#mic"),$("#ta"));
    $("#show").onclick=()=>{$("#fbk").innerHTML=`<div class="ex"><b>תשובה לדוגמה:</b> ${esc(q.model)}</div><button class="btn wide" id="nx" style="margin-top:10px">לשאלה הבאה</button>`;$("#nx").onclick=()=>{i++;draw()}};
    $("#chk").onclick=async()=>{const ans=$("#ta").value.trim();if(!ans){$("#ta").focus();return}$("#fbk").innerHTML=`<div class="label">בודק… ✍️</div>`;
      const g=await api({action:"grade",ref:dafName(m,n,a),seg:txt,q:q.q,model:q.model,ans});
      if(g.error){$("#fbk").innerHTML=`<p class="label">${errMsg(g)}</p>`;return}tot+=+g.score||0;S.stars+=Math.round((+g.score||0)/25);save();
      $("#fbk").innerHTML=`<div class="card"><div class="top"><b class="grow">ציון: ${g.score}</b>${g.score>=80?"🎉":""}</div>${g.good?`<p>👍 ${esc(g.good)}</p>`:""}${g.missing?`<p>✏️ ${esc(g.missing)}</p>`:""}${g.better?`<div class="ex"><b>תשובה מלאה:</b> ${esc(g.better)}</div>`:""}<button class="btn ghost sm" id="sp">🔊 להקריא את המשוב</button></div><button class="btn wide" id="nx">לשאלה הבאה</button>`;
      $("#sp").onclick=()=>speak([g.good,g.missing,g.better].filter(Boolean).join(". "));$("#nx").onclick=()=>{i++;draw()}};
  };draw();
}

const FAM_APP="gemara";
function famStats(){const n=S.days[today()]||0;return {learned:Object.keys(S.learned).length,stars:S.stars,todayN:n,today:n>=10?1:0,last:S.last?dafName(S.last.m,S.last.n,S.last.a):""}}
const famEmoji=()=>"📖",famHome=()=>home();
/* ===================== Family: shared parent view + competition ===================== */
const FAM_API=/myinspire\.co\.il$/.test(location.hostname)?"/api/family.php":"https://"+(FAM_APP==="math"?"yallamath":FAM_APP==="theory"?"yallatheory":FAM_APP==="psy"?"yallapsy":FAM_APP==="gemara"?"yallagemara":"yallaenglish")+".myinspire.co.il/api/family.php";
async function famCall(b){try{const r=await fetch(FAM_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return await r.json()}catch(e){return {error:"net"}}}
function famDay(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function famWeek(){
  S.starHist=S.starHist||{};const t=famDay();if(S.starHist[t]==null)S.starHist[t]=S.stars;
  const old=new Date();old.setDate(old.getDate()-7);const cut=famDay(old);
  for(const k of Object.keys(S.starHist))if(k<famDay(new Date(Date.now()-15*864e5)))delete S.starHist[k];
  const keys=Object.keys(S.starHist).filter(k=>k>=cut).sort();const base=keys.length?S.starHist[keys[0]]:S.stars;
  return Math.max(0,S.stars-base);
}
let famLast=0;
async function famSync(force){
  if(!S.fam||!S.fam.code)return null;if(!force&&Date.now()-famLast<60000)return null;famLast=Date.now();
  const st=Object.assign({week:famWeek()},famStats());save();
  return famCall({action:"sync",code:S.fam.code,id:S.fam.id,app:FAM_APP,role:S.fam.role,name:(S.name||"").slice(0,20)||"ללא שם",e:famEmoji(),stats:st});
}
function famMedal(i){return ["🥇","🥈","🥉"][i]||"⭐"}
async function famScreen(){
  if(!S.fam||!S.fam.code)return famJoin();
  app.innerHTML=`<div class="top"><button class="x" id="back" aria-label="חזרה">→</button><h2 class="grow">👨‍👩‍👧 המשפחה שלנו</h2></div><div class="card center"><div class="label">טוען…</div></div>`;
  $("#back").onclick=famHome;
  const d=await famSync(true)||await famCall({action:"get",code:S.fam.code});
  if(!d||d.error){app.querySelector(".card").innerHTML=`<p>${d&&d.error==="nofamily"?"קוד המשפחה לא נמצא.":"לא הצלחתי להתחבר. בדקו את האינטרנט ונסו שוב."}</p><button class="btn ghost" id="lv">יציאה מהמשפחה</button>`;$("#lv").onclick=()=>{delete S.fam;save();famJoin()};return}
  const kids={};
  for(const m of d.members){if(m.role==="parent")continue;const k=(m.name||"").trim().toLowerCase();const K=kids[k]=kids[k]||{name:m.name,e:m.e,apps:{},week:0,today:0,t:0};K.apps[m.app]=m.stats||{};K.week+=+(m.stats&&m.stats.week)||0;K.today=K.today||+(m.stats&&m.stats.today)||0;K.t=Math.max(K.t,m.t||0);if(m.e)K.e=m.e}
  const list=Object.values(kids).sort((a,b)=>b.week-a.week);
  const ago=t=>{const m=Math.round((Date.now()/1000-t)/60);return m<2?"עכשיו":m<60?`לפני ${m} דקות`:m<1440?`לפני ${Math.round(m/60)} שעות`:`לפני ${Math.round(m/1440)} ימים`};
  const en=s=>s?`<div class="fam-app">📘 <b>אנגלית:</b> ${esc(s.course||"")} · ${s.lessons||0} שיעורים${s.avg!=null&&s.avg!==""?` · ממוצע ${s.avg}`:""}${s.streak?` · 🔥 ${s.streak} ימים ברצף`:""}${s.test!=null&&s.test!==""?` · מבחן אחרון ${s.test}`:""}</div>`:"";
  const ma=s=>s?`<div class="fam-app">🔢 <b>מתמטיקה:</b> ${esc(s.grade||"")} · ${s.mastered||0}/${s.topics||0} נושאים בשליטה · הצלחה ${s.avg||0}%${s.test!=null&&s.test!==""?` · מבחן אחרון ${s.test}`:""}${s.todayN?` · היום ${s.todayN} שאלות`:""}</div>`:"";
  const ps=s=>s?`<div class="fam-app">🎓 <b>פסיכומטרי:</b> ${s.est?`ציון משוער ${s.est} · `:""}מילולי ${s.v||0}% · כמותי ${s.q||0}% · אנגלית ${s.e||0}%${s.todayN?` · היום ${s.todayN} שאלות`:""}</div>`:"";
  const ge=s=>s?`<div class="fam-app">📖 <b>גמרא:</b> ${s.learned||0} עמודים נלמדו${s.last?` · אחרון: ${esc(s.last)}`:""}${s.todayN?` · היום ${s.todayN} פעולות`:""}</div>`:"";
  const th=s=>s?`<div class="fam-app">🚦 <b>תאוריה:</b> רישיון ${esc(s.license||"")} · ${s.mastered||0}/${s.total||0} שאלות נכונות${s.exam!=null&&s.exam!==""?` · מבחן אחרון ${s.exam}/30`:""}${s.todayN?` · היום ${s.todayN} שאלות`:""}</div>`:"";
  app.innerHTML=`<div class="top"><button class="x" id="back" aria-label="חזרה">→</button><h2 class="grow">👨‍👩‍👧 ${esc(d.family||"המשפחה שלנו")}</h2><button class="x" id="rf" aria-label="רענון">🔄</button></div>
   <div class="card fam-code"><div class="label">קוד המשפחה</div><div class="code" dir="ltr">${S.fam.code}</div><button class="btn ghost" id="sh">📤 שיתוף הקוד</button></div>
   <div class="card"><h3>🏆 תחרות השבוע</h3><p class="label">כוכבים שנאספו ב-7 הימים האחרונים, בכל האפליקציות יחד</p>
   ${list.length?list.map((k,i)=>`<div class="fam-row"><span class="m">${famMedal(i)}</span><span class="e">${k.e||"🙂"}</span><b class="grow">${esc(k.name)}</b><span>⭐ ${k.week}</span><span title="אתגר יומי">${k.today?"✅":"⏳"}</span></div>`).join(""):`<p>עוד אין ילדים במשפחה. הכניסו את הקוד באפליקציה של כל ילד.</p>`}
   <p class="label">✅ = עשו היום את האתגר היומי: שיעור יומי באנגלית, 10 שאלות במתמטיקה 20 שאלות תאוריה, 30 שאלות פסיכומטרי או 10 פעולות לימוד גמרא</p></div>
   ${list.map(k=>`<div class="card fam-kid"><div class="fam-row"><span class="e">${k.e||"🙂"}</span><b class="grow">${esc(k.name)}</b><span class="label">${ago(k.t)}</span></div>${en(k.apps.english)}${ma(k.apps.math)}${th(k.apps.theory)}${ps(k.apps.psy)}${ge(k.apps.gemara)}</div>`).join("")}
   <button class="link" id="lv">יציאה מהמשפחה במכשיר הזה</button>`;
  $("#back").onclick=famHome;$("#rf").onclick=famScreen;
  $("#sh").onclick=async()=>{const t=`הצטרפו למשפחה שלנו ב-Yalla! קוד המשפחה: ${S.fam.code}`;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(S.fam.code);$("#sh").textContent="✅ הקוד הועתק"}}catch(e){}};
  $("#lv").onclick=async()=>{await famCall({action:"leave",code:S.fam.code,id:S.fam.id});delete S.fam;save();famHome()};
}
function famJoin(){
  app.innerHTML=`<div class="top"><button class="x" id="back" aria-label="חזרה">→</button><h2 class="grow">👨‍👩‍👧 משפחה</h2></div>
   <div class="card"><h3>מה זה?</h3><p>מחברים את כל הילדים לקוד משפחה אחד. ההורים רואים את ההתקדמות של כולם במסך אחד, באנגלית, במתמטיקה ובתאוריה, ויש תחרות כוכבים שבועית ואתגר יומי.</p><p class="label">נשמרים רק שם פרטי ונתוני למידה (כוכבים, שיעורים, ציונים).</p></div>
   <div class="card"><h3>הורה? צרו משפחה</h3><div class="field"><label class="label" for="fn">שם המשפחה (לא חובה)</label><input id="fn" maxlength="30" placeholder="למשל: משפחת כהן"></div><button class="btn wide" id="cr">יצירת קוד משפחה</button></div>
   <div class="card"><h3>יש לכם קוד? הצטרפו</h3><div class="field"><label class="label" for="fc">קוד המשפחה</label><input id="fc" maxlength="8" dir="ltr" autocapitalize="characters" placeholder="ABCD2345" style="text-align:center;letter-spacing:3px;font-size:22px"></div>
   <label class="chk"><input type="checkbox" id="fp"> אני הורה (לא להציג אותי בתחרות)</label><button class="btn wide" id="jn">הצטרפות</button><div class="label" id="fe"></div></div>`;
  $("#back").onclick=famHome;
  const id=()=>(S.fam&&S.fam.id)||Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,"0")).join("");
  $("#cr").onclick=async()=>{const d=await famCall({action:"create",family:$("#fn").value.trim()});if(!d.code){$("#cr").textContent="לא הצלחתי, נסו שוב";return}S.fam={code:d.code,id:id(),role:"parent"};save();famScreen()};
  $("#jn").onclick=async()=>{const c=$("#fc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length!==8){$("#fe").textContent="הקוד צריך להיות 8 תווים";return}
    S.fam={code:c,id:id(),role:$("#fp").checked?"parent":"kid"};const d=await famSync(true);if(!d||d.error){$("#fe").textContent=d&&d.error==="nofamily"?"הקוד לא נמצא. בדקו שהקלדתם נכון.":"לא הצלחתי להתחבר. נסו שוב.";delete S.fam;save();return}save();famScreen()};
}
