<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#DDF1F7"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><title>Yalla English</title><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Yalla English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a picture book page; the character sits on top and talks in a bubble, the activity fills the page below. Bright single-theme look by choice. */
:root{
  --sky:#DDF1F7;        /* page ground */
  --paper:#FFFFFF;      /* cards */
  --ink:#1D2B4F;        /* text */
  --ink-soft:#5A6788;   /* secondary text */
  --sun:#FFC83D;        /* accent: stars, main button */
  --sun-deep:#E8A400;
  --leaf:#2FB57C;       /* correct */
  --berry:#E8506A;      /* wrong */
  --sea:#2D7FD3;        /* listen / links */
  --line:#BFDCE8;
  --display:"Fredoka","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:700}
h2{font-size:24px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--display)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:999px;
  font-family:var(--display);font-weight:600;font-size:20px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.wide{width:100%}
.btn.ghost{background:var(--paper);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--sea);font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* Top bar */
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;min-width:0}
.bar{height:14px;border-radius:999px;background:var(--paper);overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .35s}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--line);font-size:15px}
.x{width:44px;height:44px;border-radius:50%;background:var(--paper);font-size:20px;border:2px solid var(--line);flex:none}

/* Character + bubble */
.talk{display:flex;align-items:flex-end;gap:12px}
.avatar{flex:none;width:92px;height:92px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:58px;border:3px solid var(--sun);box-shadow:0 4px 0 var(--line)}
.avatar.speaking{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(-3deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border-radius:22px 22px 6px 22px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.bubble .line{font-size:20px;font-weight:600;direction:ltr;text-align:left;font-family:var(--display)}
.bubble .he{margin-top:6px;color:var(--ink-soft);font-size:16px}
.bubble .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sky);font-weight:500;font-size:15px}

/* Word / phrase card */
.card{background:var(--paper);border-radius:28px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 6px 0 var(--line);text-align:center}
.pic{font-size:110px;line-height:1.1}
.word{font-size:46px;font-weight:700;direction:ltr;font-family:var(--display);line-height:1.15;overflow-wrap:anywhere}
.word.phrase{font-size:28px}
.word-he{color:var(--ink-soft);font-size:18px}
.who{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.speak{width:72px;height:72px;border-radius:50%;background:var(--sea);color:#fff;font-size:32px;box-shadow:0 5px 0 #1B5C9F;flex:none}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 #1B5C9F}
.speak.slow{background:var(--leaf);box-shadow:0 5px 0 #1F8A5C}
.dlg{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;direction:ltr}
.dlg .q,.dlg .a{border-radius:18px;padding:12px 14px;font-family:var(--display);font-size:20px;font-weight:600}
.dlg .q{background:var(--sky);margin-right:32px}
.dlg .a{background:#FFF6DA;margin-left:32px}
.dlg .a small{display:block;direction:rtl;text-align:right;font-family:var(--body);font-weight:400;font-size:15px;color:var(--ink-soft)}

/* Choices */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid.one{grid-template-columns:1fr}
.opt{background:var(--paper);border-radius:22px;min-height:120px;display:grid;place-items:center;font-size:64px;box-shadow:0 5px 0 var(--line);border:3px solid transparent;transition:transform .08s;padding:10px}
.opt.text{min-height:64px;font-size:19px;font-weight:500;line-height:1.35}
.opt.text.en{font-size:19px;font-weight:600;text-align:left}
.opt:active{transform:translateY(3px)}
.opt.good{border-color:var(--leaf);background:#E6F8EF}
.opt.bad{border-color:var(--berry);background:#FDECEF;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prompt-word{font-size:44px;font-weight:700;text-align:center;direction:ltr;background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line);font-family:var(--display);overflow-wrap:anywhere}
.prompt-word.phrase{font-size:26px}

/* Sentence builder */
.slot{min-height:72px;background:var(--paper);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;direction:ltr;border:3px dashed var(--line)}
.slot.good{border:3px solid var(--leaf);background:#E6F8EF}
.slot.bad{border:3px solid var(--berry);animation:shake .3s}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tok{min-height:46px;padding:0 14px;border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:600;font-size:19px}
.tok.used{visibility:hidden}
.slot .tok{background:#FFF6DA;box-shadow:0 4px 0 #F0D78C}

/* Mic */
.mic{width:110px;height:110px;border-radius:50%;background:var(--berry);color:#fff;font-size:46px;box-shadow:0 6px 0 #B73350}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,80,106,.5),0 6px 0 #B73350}100%{box-shadow:0 0 0 22px rgba(232,80,106,0),0 6px 0 #B73350}}
.heard{min-height:24px;color:var(--ink-soft);font-size:16px}
.mic.small{width:72px;height:72px;font-size:30px}
.center{text-align:center}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Home */
.hero{background:var(--paper);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--line)}
.today-topic{display:flex;align-items:center;gap:14px}
.today-topic .big{font-size:52px;flex:none}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--paper);border:3px dashed var(--line)}
.dot.done{border:3px solid var(--leaf);background:#E6F8EF}
.dot.next{border:3px solid var(--sun);background:#FFF6DA;animation:bob 1s ease-in-out infinite alternate}
.dot.lock{opacity:.45}

/* Onboarding */
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.char{background:var(--paper);border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;box-shadow:0 5px 0 var(--line)}
.char .e{font-size:42px;line-height:1.1}
.char .n{font-family:var(--display);font-weight:600;font-size:17px;direction:ltr}
.char[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
.courses{display:flex;flex-direction:column;gap:10px}
.group{display:flex;flex-direction:column;gap:10px}
.group+.group{margin-top:8px}
.course{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:12px 16px;text-align:right;box-shadow:0 5px 0 var(--line);border:3px solid transparent}
.course .e{font-size:38px;flex:none}
.course b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.course span{color:var(--ink-soft);font-size:15px}
.course[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
.kidrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;font-size:20px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}

/* Reading */
.story{align-items:stretch;text-align:left}
.story-text{direction:ltr;font-family:var(--display);font-size:21px;font-weight:500;line-height:1.55;max-width:60ch}
.story-he{direction:rtl;text-align:right;color:var(--ink-soft);font-size:16px;border-top:2px dashed var(--line);padding-top:10px}
.qtext{font-family:var(--display);font-size:22px;font-weight:600;direction:ltr;text-align:left}
/* Writing */
.slot.spell{justify-content:center;min-height:68px}
.tok.letter{min-width:44px;font-size:22px;text-transform:lowercase}
.blank{display:inline-block;width:44px;height:46px;border-bottom:3px solid var(--line)}
.field input.good{border-color:var(--leaf);background:#E6F8EF}
.field input.bad{border-color:var(--berry);animation:shake .3s}
/* Scores, settings */
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 var(--line);min-width:0}
.stat .label{font-size:12px;letter-spacing:.02em}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.score{display:flex;flex-direction:column;align-items:center;gap:2px}
.score b{font-family:var(--display);font-size:64px;line-height:1;color:var(--leaf);font-variant-numeric:tabular-nums}
.score.low b{color:var(--berry)}
.score span{font-weight:700}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.missed .label{width:100%}
.missed .en{background:#FFF6DA;border-radius:999px;padding:4px 12px;font-weight:600}
.hero.test{background:#EAF3FF}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segb{min-height:48px;border-radius:14px;background:var(--sky);font-weight:600;border:3px solid transparent}
.segb[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
a.btn{text-decoration:none}
/* Store */
.avatar{position:relative}
.avatar .acc{position:absolute;top:-10px;right:-6px;font-size:34px;line-height:1}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shopitem{background:var(--paper);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;min-width:0}
.shopitem .se{font-size:34px;line-height:1.2}
.shopitem .swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line)}
.shopitem b{font-size:14px;font-weight:600}
.shopitem span:last-child{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.shopitem.on{border-color:var(--leaf);background:#E6F8EF}
button.chip{cursor:pointer}
/* Parents */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.barcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.barcol i{display:block;width:100%;max-width:28px;background:var(--leaf);border-radius:6px 6px 0 0}
.barcol i.low{background:var(--berry)}
.barcol .bv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.barcol .bd{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ptable{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.ptable th{font-size:13px;color:var(--ink-soft);font-weight:600}
/* Welcome */
.welcome{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.welcome .avatar.big{width:150px;height:150px;font-size:96px;border-width:4px;animation:bob 1.2s ease-in-out infinite alternate}
.welcome .avatar.big .acc{font-size:52px;top:-14px;right:-4px}
.welcome .wave{font-size:44px;animation:wave 1s ease-in-out infinite alternate;transform-origin:70% 70%}
@keyframes wave{to{transform:rotate(20deg)}}
.welcome h1{font-size:40px}
.welcome .hello{font-size:24px;font-weight:600;color:var(--sea)}
.welcome .sub{color:var(--ink-soft);max-width:34ch}
/* Games */
.gamelist{display:flex;flex-direction:column;gap:10px}
.hero.games-card{background:#FFF6DA}
.hero.games-card .row{flex-wrap:nowrap}
.hero.games-card .row .btn{flex:1;min-width:0;padding:0 12px;font-size:18px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem.two{grid-template-columns:repeat(2,1fr)}
.mcard{aspect-ratio:3/4;max-width:100%;border-radius:16px;background:var(--sea);box-shadow:0 4px 0 #1B5C9F;color:#fff;display:grid;place-items:center;padding:6px;overflow:hidden;border:3px solid transparent}
.mem.two .mcard{aspect-ratio:auto;min-height:92px}
.mcard::before{content:"?";font-family:var(--display);font-size:34px;font-weight:700}
.mcard .front{display:none;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere;color:var(--ink)}
.mcard .front.en{direction:ltr}
.mcard .front.emo{font-size:44px}
.mcard.open,.mcard.done{background:var(--paper);box-shadow:0 4px 0 var(--line)}
.mcard.open::before,.mcard.done::before{content:none}
.mcard.open .front,.mcard.done .front{display:block}
.mcard.done{background:#E6F8EF;border-color:var(--leaf)}
.timer{height:14px;border-radius:999px;background:var(--paper);border:2px solid var(--line);overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:var(--sun);transition:width 1s linear}
.target{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--paper);border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--line);font-size:48px;line-height:1.1}
.target .he{font-size:20px;font-weight:600}
.lives{font-size:18px;letter-spacing:1px;flex:none}
.catch{position:relative;height:54vh;min-height:300px;background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--line);touch-action:manipulation}
.drop{position:absolute;top:0;left:0;max-width:72%;padding:8px 14px;border-radius:18px;background:#FFF6DA;box-shadow:0 3px 0 #F0D78C;font-family:var(--display);font-weight:600;font-size:18px;direction:ltr;text-align:center;will-change:transform}
.drop.bad{background:#FDECEF;box-shadow:0 3px 0 #E8A0AE}
/* Dictionary */
.dict{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line);text-align:right;width:100%}
.drow .de{font-size:28px;flex:none;width:40px;text-align:center}
.drow .dt{flex:1;min-width:0}
.drow .dt b{display:block;direction:ltr;text-align:left;font-family:var(--display);font-size:18px;overflow-wrap:anywhere}
.drow .dt span{color:var(--ink-soft);font-size:14px}
.drow .tag{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#FDECEF;color:#B73350}
.chars.mini{width:100%;grid-template-columns:repeat(4,1fr);gap:8px}
.chars.mini .char{padding:8px 4px}
.chars.mini .char .e{font-size:32px}
.chars.mini .char .n{font-size:14px}
.welcome{min-height:0;padding-block:8px}
.kidrow .course{padding:10px 12px;gap:10px}
.kidrow .course .e{font-size:30px}
.kidrow .course b{font-size:17px;text-wrap:balance}
.kidrow .course>span:last-child{min-width:0}
.kidrow .course span span{white-space:nowrap}
/* Help language */
.seg.langs{width:100%}
[data-help="ru"] .bubble .he,[data-help="ru"] .word-he,[data-help="ru"] .story-he,[data-help="ru"] .dlg .a small,[data-help="ru"] .drow .dt span,[data-help="ru"] .target .he{direction:ltr;text-align:left}
[data-help="ru"] .opt.text:not(.en),[data-help="ru"] .mcard .front:not(.en){direction:ltr}
/* Finish */
.stars{font-size:52px;letter-spacing:6px;text-align:center}
.center{text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app" dir="rtl"></div>

<script>
/* ===================== Content ===================== */
const CHARS=[
 {id:"lily",name:"Lily",e:"👧",pitch:1.4,rate:.88,kid:1},
 {id:"tom",name:"Tom",e:"👦",pitch:1.2,rate:.88,kid:1},
 {id:"zoe",name:"Zoe",e:"🦸‍♀️",pitch:1.25,rate:.9,kid:1},
 {id:"rosa",name:"Rosa",e:"👸",pitch:1.4,rate:.86,kid:1},
 {id:"nina",name:"Nina",e:"🧚",pitch:1.5,rate:.86,kid:1},
 {id:"ella",name:"Ella",e:"🧜‍♀️",pitch:1.35,rate:.86,kid:1},
 {id:"kai",name:"Kai",e:"🥷",pitch:1.1,rate:.9,kid:1},
 {id:"ivy",name:"Ivy",e:"🕵️‍♀️",pitch:1.2,rate:.9,kid:1},
 {id:"merlin",name:"Merlin",e:"🧙",pitch:.8,rate:.85,kid:1},
 {id:"bolt",name:"Bolt",e:"🤖",pitch:1.1,rate:.82,kid:1},
 {id:"emma",name:"Emma",e:"👩‍🏫",pitch:1.05,rate:.92},
 {id:"james",name:"James",e:"👨‍💼",pitch:.9,rate:.92},
 {id:"maya",name:"Maya",e:"👩‍💻",pitch:1.1,rate:.95},
 {id:"leo",name:"Leo",e:"🧔",pitch:.85,rate:.9},
 {id:"sara",name:"Sara",e:"👵",pitch:1.0,rate:.85},
 {id:"max",name:"Max",e:"🧑‍🚀",pitch:1.0,rate:.92},
];
/* unit: [en topic, he topic, emoji, items]; item: [en, he, emoji?, alts?]; dialogue item: [question, answer, he answer] */
const U=(en,he,e,items)=>({en,he,e,items:items.map(a=>({en:a[0],he:a[1],e:a[2]||"",alt:a[3]||[]}))});
const D=(en,he,e,items)=>({en,he,e,dialog:true,items:items.map(a=>({q:a[0],en:a[1],he:a[2]}))});

const COURSES=[

ed his account","Called the police","Gave him cash"],["How does Yossi follow his payments now?","With text alerts","With paper statements","He visits the bank","He doesn't check"]]}},{"en":"complaints and returns","he":"תלונות והחזרות","ru":"жалобы и возвраты","ar":"الشكاوى والإرجاع","e":"🧾","items":[{"en":"I'd like to return this jacket; it doesn't fit.","he":"אני רוצה להחזיר את המעיל הזה; הוא לא מתאים לי במידה.","ru":"Я хотел(а) бы вернуть эту куртку, она мне не подходит по размеру.","ar":"أودّ إرجاع هذه السترة؛ مقاسها غير مناسب.","e":"","alt":[]},{"en":"Can I get a refund or only store credit?","he":"אפשר לקבל החזר כספי או רק זיכוי?","ru":"Можно получить деньги обратно или только кредит в магазине?","ar":"هل يمكنني استرداد المال أم فقط رصيدًا في المتجر؟","e":"","alt":[]},{"en":"The product arrived damaged, and I have photos.","he":"המוצר הגיע פגום, ויש לי תמונות.","ru":"Товар пришёл повреждённым, и у меня есть фотографии.","ar":"وصل المنتج تالفًا، ولديّ صور.","e":"","alt":[]},{"en":"I'm not satisfied with the service I received today.","he":"אני לא מרוצה מהשירות שקיבלתי היום.","ru":"Я недоволен (недовольна) обслуживанием, которое получил(а) сегодня.","ar":"لست راضيًا عن الخدمة التي تلقيتها اليوم.","e":"","alt":[]},{"en":"Could I please speak to the manager?","he":"אפשר בבקשה לדבר עם המנהל?","ru":"Могу я поговорить с менеджером, пожалуйста?","ar":"هل يمكنني التحدث إلى المدير من فضلك؟","e":"","alt":[]},{"en":"I still have the receipt from last week.","he":"יש לי עדיין את הקבלה מהשבוע שעבר.","ru":"У меня всё ещё есть чек с прошлой недели.","ar":"ما زال معي الإيصال من الأسبوع الماضي.","e":"","alt":[]}],"reading":{"en":"Michal ordered a coffee machine online for her new kitchen. When the box arrived, the glass jug was broken. She took photos and wrote an email to customer service. At first, the company offered her only a small discount. Michal politely explained that she wanted a full refund or a new machine. Two days later, a replacement arrived at her door.","he":"מיכל הזמינה באינטרנט מכונת קפה למטבח החדש שלה. כשהקופסה הגיעה, הקנקן מזכוכית היה שבור. היא צילמה תמונות וכתבה מייל לשירות הלקוחות. בהתחלה החברה הציעה לה רק הנחה קטנה. מיכל הסבירה בנימוס שהיא רוצה החזר כספי מלא או מכונה חדשה. יומיים אחר כך הגיעה לדלתה מכונה חלופית.","ru":"Михаль заказала в интернете кофемашину для своей новой кухни. Когда пришла коробка, стеклянный кувшин оказался разбит. Она сделала фотографии и написала письмо в службу поддержки. Сначала компания предложила ей лишь небольшую скидку. Михаль вежливо объяснила, что хочет полный возврат денег или новую машину. Через два дня ей доставили замену.","ar":"طلبت ميخال آلة قهوة عبر الإنترنت لمطبخها الجديد. عندما وصل الصندوق، كان الإبريق الزجاجي مكسورًا. التقطت صورًا وكتبت رسالة إلكترونية إلى خدمة العملاء. في البداية، عرضت عليها الشركة خصمًا صغيرًا فقط. أوضحت ميخال بأدب أنها تريد استرداد المبلغ كاملًا أو آلة جديدة. بعد يومين، وصلت آلة بديلة إلى بابها.","questions":[["What was broken?","The glass jug","The whole machine","Only the box","The power cable"],["What did the company offer first?","A small discount","A full refund","A free gift","Nothing at all"],["How did the story end?","She got a replacement","She kept the broken one","She went to court","She bought another brand"]]}},{"en":"small talk","he":"שיחת חולין ודעות","ru":"светская беседа","ar":"الأحاديث القصيرة والآراء","e":"💬","items":[{"en":"How was your weekend? Did you do anything fun?","he":"איך היה סוף השבוע? עשית משהו כיף?","ru":"Как прошли выходные? Делал(а) что-нибудь интересное?","ar":"كيف كانت عطلة نهاية الأسبوع؟ هل فعلت شيئًا ممتعًا؟","e":"","alt":[]},{"en":"In my opinion, the city needs better public transport.","he":"לדעתי, העיר צריכה תחבורה ציבורית טובה יותר.","ru":"По-моему, городу нужен более удобный общественный транспорт.","ar":"في رأيي، تحتاج المدينة إلى نقل عام أفضل.","e":"","alt":[]},{"en":"I see your point, but I don't completely agree.","he":"אני מבין/ה את הנקודה שלך, אבל אני לא לגמרי מסכים/ה.","ru":"Я понимаю твою точку зрения, но не совсем согласен (согласна).","ar":"أفهم وجهة نظرك، لكنني لا أوافق تمامًا.","e":"","alt":[]},{"en":"What do you think about working from home?","he":"מה דעתך על עבודה מהבית?","ru":"Что ты думаешь о работе из дома?","ar":"ما رأيك في العمل من المنزل؟","e":"","alt":[]},{"en":"That's a good question; I've never thought about it.","he":"זאת שאלה טובה; אף פעם לא חשבתי על זה.","ru":"Хороший вопрос; я никогда об этом не задумывался (задумывалась).","ar":"هذا سؤال جيد؛ لم أفكر فيه من قبل.","e":"","alt":[]},{"en":"To be honest, I'm not a big fan of crowds.","he":"למען האמת, אני לא כל כך אוהב/ת מקומות צפופים.","ru":"Честно говоря, я не очень люблю толпы.","ar":"بصراحة، لست من محبي الزحام.","e":"","alt":[]}],"reading":{"en":"At a friend's birthday party, Avi met a woman named Rina. They started talking about the weather and the traffic in Tel Aviv. Soon the conversation moved to more interesting topics, like books and travel. Rina thought that working from home was great, but Avi disagreed. He said he missed meeting colleagues at the office. Even though they had different opinions, they enjoyed the conversation very much.","he":"במסיבת יום הולדת של חבר, אבי פגש אישה בשם רינה. הם התחילו לדבר על מזג האוויר ועל הפקקים בתל אביב. מהר מאוד השיחה עברה לנושאים מעניינים יותר, כמו ספרים וטיולים. רינה חשבה שעבודה מהבית היא דבר נהדר, אבל אבי לא הסכים. הוא אמר שהוא מתגעגע לפגוש עמיתים במשרד. למרות שהיו להם דעות שונות, הם מאוד נהנו מהשיחה.","ru":"На дне рождения у друга Ави познакомился с женщиной по имени Рина. Они начали говорить о погоде и пробках в Тель-Авиве. Вскоре разговор перешёл на более интересные темы, например книги и путешествия. Рина считала, что работать из дома прекрасно, но Ави не согласился. Он сказал, что скучает по встречам с коллегами в офисе. Хотя у них были разные мнения, разговор им очень понравился.","ar":"في حفلة عيد ميلاد صديق، التقى آفي بامرأة اسمها رينا. بدآ الحديث عن الطقس وازدحام المرور في تل أبيب. وسرعان ما انتقل الحديث إلى مواضيع أكثر إثارة، مثل الكتب والسفر. رأت رينا أن العمل من المنزل رائع، لكن آفي لم يوافق. قال إنه يفتقد لقاء زملائه في المكتب. ورغم اختلاف آرائهما، استمتعا بالحديث كثيرًا.","questions":[["Where did Avi meet Rina?","At a birthday party","At work","On a train","At the gym"],["What did they talk about first?","The weather and traffic","Books and travel","Their jobs","Politics"],["Why did Avi disagree about working from home?","He missed his colleagues","His home is too small","He has no computer","He works at night"]]}},{"en":"health and fitness","he":"בריאות וכושר","ru":"здоровье и фитнес","ar":"الصحة واللياقة","e":"💪","items":[{"en":"I've had a sore throat and a fever since yesterday.","he":"יש לי כאב גרון וחום מאתמול.","ru":"У меня со вчерашнего дня болит горло и температура.","ar":"أعاني من التهاب في الحلق وحمّى منذ أمس.","e":"","alt":[]},{"en":"I'd like to make an appointment with a family doctor.","he":"אני רוצה לקבוע תור לרופא משפחה.","ru":"Я хотел(а) бы записаться к семейному врачу.","ar":"أودّ حجز موعد مع طبيب العائلة.","e":"","alt":[]},{"en":"Do I need a prescription for this medicine?","he":"אני צריך/ה מרשם לתרופה הזאת?","ru":"Нужен ли рецепт на это лекарство?","ar":"هل أحتاج إلى وصفة طبية لهذا الدواء؟","e":"","alt":[]},{"en":"I try to work out at least three times a week.","he":"אני משתדל/ת להתאמן לפחות שלוש פעמים בשבוע.","ru":"Я стараюсь тренироваться хотя бы три раза в неделю.","ar":"أحاول ممارسة الرياضة ثلاث مرات في الأسبوع على الأقل.","e":"","alt":[]},{"en":"My back hurts after sitting at the computer all day.","he":"הגב כואב לי אחרי ישיבה מול המחשב כל היום.","ru":"У меня болит спина после целого дня за компьютером.","ar":"يؤلمني ظهري بعد الجلوس أمام الحاسوب طوال اليوم.","e":"","alt":[]},{"en":"I'm trying to eat healthier and sleep more.","he":"אני מנסה לאכול בריא יותר ולישון יותר.","ru":"Я стараюсь питаться здоровее и больше спать.","ar":"أحاول أن آكل طعامًا صحيًا أكثر وأن أنام أكثر.","e":"","alt":[]}],"reading":{"en":"Last year, Noa felt tired all the time and often had headaches. Her doctor suggested that she should exercise more and drink more water. Noa joined a gym near her office and started going after work. At first, it was difficult, and her muscles hurt. After two months, however, she had more energy and slept much better. Now she walks to work and never misses her Tuesday yoga class.","he":"בשנה שעברה נועה הרגישה עייפה כל הזמן ולעיתים קרובות סבלה מכאבי ראש. הרופא שלה הציע שתתאמן יותר ותשתה יותר מים. נועה נרשמה לחדר כושר ליד המשרד שלה והתחילה ללכת אחרי העבודה. בהתחלה זה היה קשה, והשרירים שלה כאבו. אבל אחרי חודשיים היה לה יותר כוח והיא ישנה הרבה יותר טוב. היום היא הולכת ברגל לעבודה ואף פעם לא מפספסת את שיעור היוגה של יום שלישי.","ru":"В прошлом году Ноа всё время чувствовала усталость и часто страдала от головной боли. Врач посоветовал ей больше заниматься спортом и пить больше воды. Ноа записалась в спортзал рядом с офисом и стала ходить туда после работы. Сначала было тяжело, и у неё болели мышцы. Однако через два месяца у неё стало больше энергии, и она стала гораздо лучше спать. Теперь она ходит на работу пешком и никогда не пропускает занятие йогой по вторникам.","ar":"في العام الماضي، كانت نوعا تشعر بالتعب طوال الوقت وكثيرًا ما تعاني من الصداع. نصحها طبيبها بممارسة المزيد من الرياضة وشرب المزيد من الماء. اشتركت نوعا في نادٍ رياضي قرب مكتبها وبدأت تذهب إليه بعد العمل. في البداية كان الأمر صعبًا، وكانت عضلاتها تؤلمها. لكن بعد شهرين أصبحت لديها طاقة أكبر وصارت تنام أفضل بكثير. الآن تمشي إلى العمل ولا تفوّت أبدًا حصة اليوغا يوم الثلاثاء.","questions":[["What problem did Noa have?","She was always tired","She broke her leg","She couldn't eat","She had a cold"],["What did the doctor suggest?","More exercise and water","A new medicine","A long vacation","Less sleep"],["What changed after two months?","She had more energy","She stopped exercising","She changed jobs","She moved house"]]}},{"en":"news","he":"חדשות ואקטואליה","ru":"новости","ar":"الأخبار والأحداث الجارية","e":"📰","items":[{"en":"Did you hear the news about the elections?","he":"שמעת את החדשות על הבחירות?","ru":"Ты слышал(а) новости о выборах?","ar":"هل سمعت الأخبار عن الانتخابات؟","e":"","alt":[]},{"en":"According to the report, prices will rise next year.","he":"לפי הדיווח, המחירים יעלו בשנה הבאה.","ru":"Согласно докладу, в следующем году цены вырастут.","ar":"وفقًا للتقرير، سترتفع الأسعار العام المقبل.","e":"","alt":[]},{"en":"I usually read the headlines on my phone every morning.","he":"אני בדרך כלל קורא/ת את הכותרות בטלפון כל בוקר.","ru":"Обычно я каждое утро читаю заголовки на телефоне.","ar":"عادةً أقرأ العناوين على هاتفي كل صباح.","e":"","alt":[]},{"en":"It's important to check if a story is true.","he":"חשוב לבדוק אם ידיעה היא אמיתית.","ru":"Важно проверять, правдива ли новость.","ar":"من المهم التحقق مما إذا كان الخبر صحيحًا.","e":"","alt":[]},{"en":"The government announced new rules for public transport.","he":"הממשלה הודיעה על כללים חדשים לתחבורה הציבורית.","ru":"Правительство объявило новые правила для общественного транспорта.","ar":"أعلنت الحكومة قواعد جديدة للنقل العام.","e":"","alt":[]},{"en":"There was a heavy storm in the north last night.","he":"הייתה סערה חזקה בצפון אתמול בלילה.","ru":"Вчера ночью на севере была сильная буря.","ar":"هبّت عاصفة قوية في الشمال الليلة الماضية.","e":"","alt":[]}],"reading":{"en":"A new study shows that many people now get their news from social media. According to the researchers, young adults rarely buy newspapers or watch the evening news. Instead, they read short posts and watch videos on their phones. The problem is that some of these stories are not accurate. Experts recommend checking at least two reliable sources before sharing a story. They also suggest following professional news websites, not only friends and influencers.","he":"מחקר חדש מראה שאנשים רבים מקבלים היום את החדשות שלהם מהרשתות החברתיות. לדברי החוקרים, צעירים כמעט לא קונים עיתונים או צופים במהדורת החדשות של הערב. במקום זאת, הם קוראים פוסטים קצרים וצופים בסרטונים בטלפון. הבעיה היא שחלק מהידיעות האלה אינן מדויקות. מומחים ממליצים לבדוק לפחות שני מקורות אמינים לפני שמשתפים ידיעה. הם גם מציעים לעקוב אחרי אתרי חדשות מקצועיים, ולא רק אחרי חברים ומשפיענים.","ru":"Новое исследование показывает, что многие люди теперь узнают новости из социальных сетей. По словам исследователей, молодые люди редко покупают газеты или смотрят вечерние новости. Вместо этого они читают короткие посты и смотрят видео на телефонах. Проблема в том, что некоторые из этих сообщений неточны. Эксперты советуют проверять как минимум два надёжных источника, прежде чем делиться новостью. Они также рекомендуют читать профессиональные новостные сайты, а не только друзей и блогеров.","ar":"تُظهر دراسة جديدة أن كثيرًا من الناس يحصلون اليوم على الأخبار من وسائل التواصل الاجتماعي. ووفقًا للباحثين، نادرًا ما يشتري الشباب الصحف أو يشاهدون نشرة الأخبار المسائية. بدلًا من ذلك، يقرؤون منشورات قصيرة ويشاهدون مقاطع فيديو على هواتفهم. المشكلة أن بعض هذه الأخبار غير دقيق. يوصي الخبراء بالتحقق من مصدرين موثوقين على الأقل قبل مشاركة أي خبر. كما يقترحون متابعة مواقع إخبارية مهنية، وليس الأصدقاء والمؤثرين فقط.","questions":[["Where do many people get their news now?","From social media","From newspapers","From the radio","From neighbors"],["What is the problem with some stories?","They are not accurate","They are too long","They are too expensive","They are in English"],["What do experts recommend?","Checking two reliable sources","Stopping reading news","Sharing everything quickly","Only watching TV"]]}},{"en":"phone calls","he":"שיחות טלפון לשירות","ru":"звонки в службы","ar":"مكالمات خدمة العملاء","e":"📞","items":[{"en":"Hello, I'm calling about a problem with my internet.","he":"שלום, אני מתקשר/ת בקשר לבעיה באינטרנט שלי.","ru":"Здравствуйте, я звоню по поводу проблемы с интернетом.","ar":"مرحبًا، أتصل بخصوص مشكلة في الإنترنت لديّ.","e":"","alt":[]},{"en":"Could you please spell your last name for me?","he":"תוכל/י בבקשה לאיית לי את שם המשפחה שלך?","ru":"Не могли бы вы продиктовать свою фамилию по буквам?","ar":"هل يمكنك تهجئة اسم عائلتك من فضلك؟","e":"","alt":[]},{"en":"I've been on hold for more than twenty minutes.","he":"אני ממתין/ה על הקו כבר יותר מעשרים דקות.","ru":"Я жду на линии уже больше двадцати минут.","ar":"أنا أنتظر على الخط منذ أكثر من عشرين دقيقة.","e":"","alt":[]},{"en":"Sorry, the line is bad; could you repeat that?","he":"סליחה, הקו לא טוב; תוכל/י לחזור על זה?","ru":"Извините, плохая связь; не могли бы вы повторить?","ar":"عذرًا، الخط سيئ؛ هل يمكنك تكرار ذلك؟","e":"","alt":[]},{"en":"Can a technician come tomorrow morning between eight and twelve?","he":"טכנאי יכול להגיע מחר בבוקר בין שמונה לשתים עשרה?","ru":"Может ли мастер прийти завтра утром с восьми до двенадцати?","ar":"هل يمكن أن يأتي فني صباح الغد بين الثامنة والثانية عشرة؟","e":"","alt":[]},{"en":"Could you send me a confirmation by email, please?","he":"תוכל/י לשלוח לי אישור במייל, בבקשה?","ru":"Не могли бы вы прислать мне подтверждение по электронной почте?","ar":"هل يمكنك إرسال تأكيد لي عبر البريد الإلكتروني من فضلك؟","e":"","alt":[]}],"reading":{"en":"Gil's internet stopped working on Sunday evening. He called his provider and waited on hold for fifteen minutes. Finally, a friendly agent answered and asked for his customer number. She checked the system and found a technical problem in his area. She promised that a technician would come the next morning. Gil asked her to send the details by text message, and she did.","he":"האינטרנט של גיל הפסיק לעבוד ביום ראשון בערב. הוא התקשר לספק שלו וחיכה על הקו רבע שעה. לבסוף ענתה נציגה נחמדה וביקשה את מספר הלקוח שלו. היא בדקה במערכת ומצאה תקלה טכנית באזור שלו. היא הבטיחה שטכנאי יגיע למחרת בבוקר. גיל ביקש ממנה לשלוח את הפרטים בהודעת טקסט, והיא שלחה.","ru":"В воскресенье вечером у Гиля перестал работать интернет. Он позвонил провайдеру и пятнадцать минут ждал на линии. Наконец ответила приветливая сотрудница и попросила его номер клиента. Она проверила систему и обнаружила техническую неполадку в его районе. Она пообещала, что мастер придёт на следующее утро. Гиль попросил прислать подробности в SMS, и она это сделала.","ar":"توقّف الإنترنت لدى غيل عن العمل مساء يوم الأحد. اتصل بمزوّد الخدمة وانتظر على الخط خمس عشرة دقيقة. أخيرًا، أجابت موظفة لطيفة وطلبت رقم العميل الخاص به. فحصت النظام ووجدت عطلًا تقنيًا في منطقته. ووعدت بأن يأتي فني في صباح اليوم التالي. طلب منها غيل إرسال التفاصيل في رسالة نصية، ففعلت.","questions":[["How long did Gil wait on hold?","Fifteen minutes","Five minutes","An hour","Two minutes"],["What did the agent find?","A problem in his area","A broken computer","An unpaid bill","A wrong password"],["What did Gil ask for?","Details by text message","A discount","A new router","A call from the manager"]]}},{"en":"school meeting","he":"אסיפת הורים","ru":"встреча в школе","ar":"اجتماع أولياء الأمور","e":"🏫","dialog":true,"items":[{"q":"Hello, thank you for coming. Which child are you here for?","en":"I'm here about my son, Itay, in fourth grade.","he":"באתי בקשר לבן שלי, איתי, מכיתה ד'.","ru":"Я пришёл (пришла) по поводу моего сына Итая из четвёртого класса.","ar":"جئت بخصوص ابني إيتاي في الصف الرابع."},{"q":"How does he feel about school these days?","en":"He enjoys it, but he finds math a bit difficult.","he":"הוא נהנה, אבל מתמטיקה קצת קשה לו.","ru":"Ему нравится, но математика даётся ему немного трудно.","ar":"إنه يستمتع بها، لكنه يجد الرياضيات صعبة بعض الشيء."},{"q":"Does he do his homework regularly?","en":"Yes, we sit together every evening after dinner.","he":"כן, אנחנו יושבים יחד כל ערב אחרי ארוחת הערב.","ru":"Да, мы занимаемся вместе каждый вечер после ужина.","ar":"نعم، نجلس معًا كل مساء بعد العشاء."},{"q":"How does he get along with the other children?","en":"He has a few good friends from the neighborhood.","he":"יש לו כמה חברים טובים מהשכונה.","ru":"У него есть несколько хороших друзей из нашего района.","ar":"لديه بعض الأصدقاء الجيدين من الحي."},{"q":"Is there anything at home that worries you?","en":"He's been sleeping badly since his grandfather got sick.","he":"הוא ישן רע מאז שסבא שלו חלה.","ru":"Он пло "en":"My throat hurts when I eat.","he":"כואב לי הגרון כשאני אוכל.","ru":"У меня болит горло, когда я ем.","ar":"يؤلمني حلقي عندما آكل.","e":""},{"en":"You must stay in bed today.","he":"אתה חייב להישאר במיטה היום.","ru":"Тебе нужно сегодня лежать в постели.","ar":"يجب أن تبقى في السرير اليوم.","e":""},{"en":"Take this medicine after lunch.","he":"קח את התרופה הזאת אחרי ארוחת הצהריים.","ru":"Принимай это лекарство после обеда.","ar":"خذ هذا الدواء بعد الغداء.","e":""},{"en":"The doctor is checking my ears.","he":"הרופא בודק לי את האוזניים.","ru":"Врач осматривает мои уши.","ar":"الطبيب يفحص أذنيّ.","e":""},{"en":"I feel much better now.","he":"אני מרגיש הרבה יותר טוב עכשיו.","ru":"Сейчас мне намного лучше.","ar":"أشعر بتحسّنٍ كبير الآن.","e":""}],"reading":{"en":"Dan was sick yesterday. He had a fever and a sore throat. His mother took him to the doctor. The doctor said, 'You must drink a lot of water.' Today Dan feels better.","he":"דן היה חולה אתמול. היה לו חום וכאב גרון. אמא שלו לקחה אותו לרופא. הרופא אמר: ״אתה חייב לשתות הרבה מים.״ היום דן מרגיש טוב יותר.","ru":"Вчера Дан болел. У него была температура и болело горло. Мама отвела его к врачу. Врач сказал: «Тебе нужно пить много воды». Сегодня Дану лучше.","ar":"كان دان مريضًا أمس. كانت لديه حمّى والتهابٌ في الحلق. أخذته أمّه إلى الطبيب. قال الطبيب: «يجب أن تشرب الكثير من الماء». اليوم يشعر دان بتحسّن.","questions":[["When was Dan sick?","yesterday","today","last week"],["Who took Dan to the doctor?","his mother","his father","his teacher"],["What must Dan drink?","water","milk","juice"]]}},{"en":"shopping","he":"קניות","ru":"покупки","ar":"التسوّق","e":"🛒","items":[{"en":"How much is this T-shirt?","he":"כמה עולה החולצה הזאת?","ru":"Сколько стоит эта футболка?","ar":"كم ثمن هذا القميص؟","e":""},{"en":"There is a big sale today.","he":"יש היום מבצע גדול.","ru":"Сегодня большая распродажа.","ar":"هناك تخفيضاتٌ كبيرة اليوم.","e":""},{"en":"These shoes are too small for me.","he":"הנעליים האלה קטנות מדי בשבילי.","ru":"Эти ботинки мне слишком малы.","ar":"هذا الحذاء صغيرٌ جدًّا عليّ.","e":""},{"en":"Can I pay with a card?","he":"אפשר לשלם בכרטיס אשראי?","ru":"Можно заплатить картой?","ar":"هل يمكنني الدفع بالبطاقة؟","e":""},{"en":"The blue bag is cheaper than the red one.","he":"התיק הכחול זול יותר מהאדום.","ru":"Синяя сумка дешевле красной.","ar":"الحقيبة الزرقاء أرخص من الحمراء.","e":""},{"en":"We are buying a present for Grandma.","he":"אנחנו קונים מתנה לסבתא.","ru":"Мы покупаем подарок для бабушки.","ar":"نحن نشتري هديّةً للجدّة.","e":""}],"reading":{"en":"Maya and her dad went to the mall on Friday. There were many shops and people. Maya wanted new sneakers. The white sneakers cost 200 shekels, and the black ones cost 150 shekels. She bought the black sneakers because they were cheaper.","he":"מאיה ואבא שלה הלכו לקניון ביום שישי. היו שם הרבה חנויות ואנשים. מאיה רצתה נעלי ספורט חדשות. נעלי הספורט הלבנות עלו 200 שקלים, והשחורות עלו 150 שקלים. היא קנתה את השחורות כי הן היו זולות יותר.","ru":"В пятницу Майя с папой пошли в торговый центр. Там было много магазинов и людей. Майя хотела новые кроссовки. Белые кроссовки стоили 200 шекелей, а чёрные — 150 шекелей. Она купила чёрные кроссовки, потому что они были дешевле.","ar":"ذهبت مايا وأبوها إلى المركز التجاري يوم الجمعة. كان هناك الكثير من المحلّات والناس. أرادت مايا حذاءً رياضيًّا جديدًا. كان ثمن الحذاء الأبيض 200 شيكل، وثمن الأسود 150 شيكل. اشترت الحذاء الأسود لأنّه كان أرخص.","questions":[["When did Maya go to the mall?","on Friday","on Sunday","on Monday"],["How much were the white sneakers?","200 shekels","150 shekels","100 shekels"],["Why did Maya buy the black sneakers?","they were cheaper","they were bigger","they were prettier"]]}},{"en":"the environment","he":"איכות הסביבה","ru":"окружающая среда","ar":"البيئة","e":"🌍","items":[{"en":"We must not throw trash on the ground.","he":"אסור לנו לזרוק זבל על הרצפה.","ru":"Нельзя бросать мусор на землю.","ar":"يجب ألّا نرمي القمامة على الأرض.","e":""},{"en":"Put the paper in the blue bin.","he":"שים את הנייר בפח הכחול.","ru":"Положи бумагу в синий контейнер.","ar":"ضع الورق في الحاوية الزرقاء.","e":""},{"en":"Turn off the light when you leave.","he":"כבה את האור כשאתה יוצא.","ru":"Выключай свет, когда уходишь.","ar":"أطفئ الضوء عندما تخرج.","e":""},{"en":"Plants and trees give us clean air.","he":"צמחים ועצים נותנים לנו אוויר נקי.","ru":"Растения и деревья дают нам чистый воздух.","ar":"النباتات والأشجار تعطينا هواءً نظيفًا.","e":""},{"en":"We can save water at home.","he":"אנחנו יכולים לחסוך מים בבית.","ru":"Мы можем экономить воду дома.","ar":"يمكننا توفير الماء في البيت.","e":""},{"en":"There are many bottles on the beach.","he":"יש הרבה בקבוקים על החוף.","ru":"На пляже много бутылок.","ar":"هناك زجاجاتٌ كثيرة على الشاطئ.","e":""}],"reading":{"en":"Omer's class is cleaning the beach today. There is a lot of trash on the sand. The children are putting bottles and bags in big bins. Omer says, 'We must keep our beach clean.' The beach looks beautiful now.","he":"הכיתה של עומר מנקה היום את החוף. יש הרבה זבל על החול. הילדים שמים בקבוקים ושקיות בפחים גדולים. עומר אומר: ״אנחנו חייבים לשמור על החוף שלנו נקי.״ החוף נראה יפה עכשיו.","ru":"Сегодня класс Омера убирает пляж. На песке много мусора. Дети кладут бутылки и пакеты в большие баки. Омер говорит: «Мы должны держать наш пляж в чистоте». Теперь пляж выглядит красиво.","ar":"صفّ عومر ينظّف الشاطئ اليوم. هناك الكثير من القمامة على الرمل. الأطفال يضعون الزجاجات والأكياس في حاوياتٍ كبيرة. يقول عومر: «يجب أن نحافظ على نظافة شاطئنا». يبدو الشاطئ جميلًا الآن.","questions":[["What is Omer's class doing today?","cleaning the beach","swimming in the sea","planting trees"],["Where is the trash?","on the sand","in the sea","in the park"],["What must they keep clean?","the beach","the school","the park"]]}},{"en":"school trip","he":"טיול שנתי","ru":"школьная экскурсия","ar":"الرحلة المدرسية","e":"🎒","items":[{"en":"We went on a trip to the north.","he":"יצאנו לטיול בצפון.","ru":"Мы поехали на экскурсию на север.","ar":"ذهبنا في رحلةٍ إلى الشمال.","e":""},{"en":"The bus left at seven o'clock.","he":"האוטובוס יצא בשעה שבע.","ru":"Автобус уехал в семь часов.","ar":"انطلقت الحافلة في الساعة السابعة.","e":""},{"en":"We walked in the water for an hour.","he":"הלכנו במים במשך שעה.","ru":"Мы целый час шли по воде.","ar":"مشينا في الماء لمدّة ساعة.","e":""},{"en":"I took a lot of photos.","he":"צילמתי הרבה תמונות.","ru":"Я сделал много фотографий.","ar":"التقطتُ الكثير من الصور.","e":""},{"en":"We slept in tents at night.","he":"ישנו באוהלים בלילה.","ru":"Ночью мы спали в палатках.","ar":"نمنا في الخيام ليلًا.","e":""},{"en":"It was the best day of the year.","he":"זה היה היום הכי טוב בשנה.","ru":"Это был лучший день в году.","ar":"كان أفضل يومٍ في السنة.","e":""}],"reading":{"en":"Last week, Noa's class went on a trip to the Galilee. They traveled by bus for three hours. In the morning, they walked along a river. At night, they sang songs around a campfire. Noa was tired, but very happy.","he":"בשבוע שעבר הכיתה של נועה יצאה לטיול בגליל. הם נסעו באוטובוס שלוש שעות. בבוקר הם הלכו לאורך נהר. בלילה הם שרו שירים סביב מדורה. נועה הייתה עייפה, אבל מאוד שמחה.","ru":"На прошлой неделе класс Ноа ездил на экскурсию в Галилею. Они ехали на автобусе три часа. Утром они гуляли вдоль реки. Ночью они пели песни у костра. Ноа устала, но была очень счастлива.","ar":"في الأسبوع الماضي، ذهب صفّ نوعا في رحلةٍ إلى الجليل. سافروا بالحافلة لمدّة ثلاث ساعات. في الصباح، مشوا على طول نهر. في الليل، غنّوا الأغاني حول نار المخيّم. كانت نوعا متعبة، لكنّها سعيدة جدًّا.","questions":[["Where did the class go?","to the Galilee","to Eilat","to the Dead Sea"],["How did they travel?","by bus","by train","by car"],["What did they do at night?","they sang songs","they swam in a river","they took photos"]]}},{"en":"technology","he":"טכנולוגיה","ru":"технологии","ar":"التكنولوجيا","e":"💻","items":[{"en":"My brother is playing a computer game.","he":"אחי משחק במשחק מחשב.","ru":"Мой брат играет в компьютерную игру.","ar":"أخي يلعب لعبةً على الحاسوب.","e":""},{"en":"Can you send me a message?","he":"אתה יכול לשלוח לי הודעה?","ru":"Можешь прислать мне сообщение?","ar":"هل يمكنك أن ترسل لي رسالة؟","e":""},{"en":"Don't use your phone in class.","he":"אל תשתמש בטלפון בכיתה.","ru":"Не пользуйся телефоном на уроке.","ar":"لا تستخدم هاتفك في الصفّ.","e":""},{"en":"I am watching a video about space.","he":"אני צופה בסרטון על החלל.","ru":"Я смотрю видео о космосе.","ar":"أنا أشاهد فيديو عن الفضاء.","e":""},{"en":"My tablet is newer than my phone.","he":"הטאבלט שלי חדש יותר מהטלפון שלי.","ru":"Мой планшет новее моего телефона.","ar":"جهازي اللوحي أحدث من هاتفي.","e":""},{"en":"You must charge the battery tonight.","he":"אתה חייב להטעין את הסוללה הלילה.","ru":"Тебе нужно зарядить батарею сегодня вечером.","ar":"يجب أن تشحن البطارية الليلة.","e":""}],"reading":{"en":"Lia has a new laptop. She uses it for homework and video calls with her grandma. Her mom says, 'You can use the computer for one hour a day.' After that, Lia reads a book or plays outside.","he":"לליה יש מחשב נייד חדש. היא משתמשת בו לשיעורי בית ולשיחות וידאו עם סבתא שלה. אמא שלה אומרת: ״את יכולה להשתמש במחשב שעה אחת ביום.״ אחרי זה ליה קוראת ספר או משחקת בחוץ.","ru":"У Лии новый ноутбук. Она делает на нём домашние задания и разговаривает по видеосвязи с бабушкой. Мама говорит ей: «Ты можешь пользоваться компьютером один час в день». После этого Лия читает книгу или играет на улице.","ar":"لدى ليا حاسوبٌ محمول جديد. تستخدمه لأداء الواجبات ولمكالمات الفيديو مع جدّتها. تقول أمّها: «يمكنكِ استخدام الحاسوب ساعةً واحدة في اليوم». بعد ذلك، تقرأ ليا كتابًا أو تلعب في الخارج.","questions":[["What does Lia have?","a new laptop","a new phone","a new tablet"],["Who does Lia have video calls with?","her grandma","her teacher","her brother"],["How long can Lia use the computer?","one hour a day","two hours a day","all day"]]}},{"en":"around israel","he":"ברחבי ישראל","ru":"по Израилю","ar":"في أنحاء إسرائيل","e":"🗺️","items":[{"en":"Eilat is hotter than Haifa in summer.","he":"באילת חם יותר מבחיפה בקיץ.","ru":"Летом в Эйлате жарче, чем в Хайфе.","ar":"إيلات أكثر حرارةً من حيفا في الصيف.","e":""},{"en":"Jerusalem is older than Tel Aviv.","he":"ירושלים עתיקה יותר מתל אביב.","ru":"Иерусалим старше Тель-Авива.","ar":"القدس أقدم من تل أبيب.","e":""},{"en":"There are many mountains in the north.","he":"יש הרבה הרים בצפון.","ru":"На севере много гор.","ar":"هناك جبالٌ كثيرة في الشمال.","e":""},{"en":"The Dead Sea is the lowest place on Earth.","he":"ים המלח הוא המקום הנמוך ביותר בעולם.","ru":"Мёртвое море — самое низкое место на Земле.","ar":"البحر الميت هو أخفض مكانٍ على الأرض.","e":""},{"en":"You can swim in the Sea of Galilee.","he":"אפשר לשחות בכנרת.","ru":"В Кинерете можно купаться.","ar":"يمكنك السباحة في بحيرة طبريا.","e":""},{"en":"The Negev is bigger than the Galilee.","he":"הנגב גדול יותר מהגליל.","ru":"Негев больше Галилеи.","ar":"النقب أكبر من الجليل.","e":""}],"reading":{"en":"Dan lives in Haifa, near the sea. His cousin Maya lives in Eilat, in the south. In summer, Eilat is much hotter than Haifa. Maya can see fish in the Red Sea every day. Dan wants to visit her next summer.","he":"דן גר בחיפה, ליד הים. בת הדודה שלו מאיה גרה באילת, בדרום. בקיץ באילת חם הרבה יותר מבחיפה. מאיה יכולה לראות דגים בים סוף כל יום. דן רוצה לבקר אותה בקיץ הבא.","ru":"Дан живёт в Хайфе, у моря. Его двоюродная сестра Майя живёт в Эйлате, на юге. Летом в Эйлате намного жарче, чем в Хайфе. Майя может каждый день видеть рыб в Красном море. Дан хочет навестить её следующим летом.","ar":"يسكن دان في حيفا، قرب البحر. ابنة عمّه مايا تسكن في إيلات، في الجنوب. في الصيف، إيلات أكثر حرارةً بكثير من حيفا. تستطيع مايا أن ترى الأسماك في البحر الأحمر كلّ يوم. يريد دان أن يزورها في الصيف القادم.","questions":[["Where does Maya live?","in Eilat","in Haifa","in Jerusalem"],["Which city is hotter in summer?","Eilat","Haifa","Tel Aviv"],["When does Dan want to visit Maya?","next summer","next week","in winter"]]}}]},{"id":"h10","group":"high","he":"3 יחידות לימוד","sub":"בגרות 3 יח״ל: הבנת הנקרא והבעה","e":"📘","units":[{"en":"technology","he":"טכנולוגיה","ru":"технологии","ar":"التكنولوجيا","e":"💻","items":[{"en":"Smartphones have changed the way we communicate.","he":"הטלפונים החכמים שינו את הדרך שבה אנחנו מתקשרים.","ru":"Смартфоны изменили то, как мы общаемся.","ar":"لقد غيّرت الهواتف الذكية طريقة تواصلنا.","e":"","alt":[]},{"en":"If I had more free time, I would learn to code.","he":"אילו היה לי יותר זמן פנוי, הייתי לומד לתכנת.","ru":"Если бы у меня было больше свободного времени, я бы научился программировать.","ar":"لو كان لديّ وقت فراغ أكثر، لتعلّمتُ البرمجة.","e":"","alt":[]},{"en":"Most apps are designed to keep us online longer.","he":"רוב האפליקציות מתוכננות כדי להשאיר אותנו מחוברים יותר זמן.","ru":"Большинство приложений созданы для того, чтобы мы дольше оставались онлайн.","ar":"صُمّمت معظم التطبيقات لإبقائنا متصلين بالإنترنت لفترة أطول.","e":"","alt":[]},{"en":"Although technology is useful, it can also be addictive.","he":"למרות שהטכנולוגיה שימושית, היא גם עלולה לגרום להתמכרות.","ru":"Хотя технологии полезны, они также могут вызывать зависимость.","ar":"على الرغم من أن التكنولوجيا مفيدة، فإنها قد تسبب الإدمان أيضًا.","e":"","alt":[]},{"en":"You should never share your password with anyone.","he":"אף פעם אל תשתף את הסיסמה שלך עם אף אחד.","ru":"Никогда никому не сообщайте свой пароль.","ar":"يجب ألّا تشارك كلمة مرورك مع أي أحد أبدًا.","e":"","alt":[]},{"en":"Online privacy is becoming a serious concern for teenagers.","he":"פרטיות ברשת הופכת לדאגה רצינית עבור בני נוער.","ru":"Конфиденциальность в интернете становится серьёзной проблемой для подростков.","ar":"أصبحت الخصوصية على الإنترنت مصدر قلق جدي للمراهقين.","e":"","alt":[]}],"reading":{"en":"Noa is sixteen and lives in Haifa. Last year, she noticed that she was spending almost six hours a day on her phone. Her grades were dropping, and she often felt tired in the morning. Therefore, she decided to try a simple experiment: no phone after nine p.m. At first, it was difficult, and she felt that she was missing out. However, after two weeks she was sleeping better and reading more books. Today, Noa still uses her phone, but she feels that she controls it, not the other way around.","he":"נועה בת שש עשרה וגרה בחיפה. בשנה שעברה היא שמה לב שהיא מבלה כמעט שש שעות ביום בטלפון. הציונים שלה ירדו, ולעיתים קרובות היא הרגישה עייפה בבוקר. לכן היא החליטה לנסות ניסוי פשוט: בלי טלפון אחרי תשע בערב. בהתחלה זה היה קשה, והיא הרגישה שהיא מפספסת דברים. עם זאת, אחרי שבועיים היא ישנה טוב יותר וקראה יותר ספרים. היום נועה עדיין משתמשת בטלפון, אבל היא מרגישה שהיא שולטת בו, ולא להפך.","ru":"Ноа шестнадцать лет, она живёт в Хайфе. В прошлом году она заметила, что проводит в телефоне почти шесть часов в день. Её оценки ухудшались, и по утрам она часто чувствовала усталость. Поэтому она решила провести простой эксперимент: никакого телефона после девяти вечера. Сначала было трудно, и ей казалось, что она многое упускает. Однако через две недели она стала лучше спать и больше читать. Сегодня Ноа по-прежнему пользуется телефоном, но чувствует, что это она управляет им, а не наоборот.","ar":"نوعا في السادسة عشرة من عمرها وتعيش في حيفا. في العام الماضي، لاحظت أنها تقضي قرابة ست ساعات يوميًا على هاتفها. كانت علاماتها تتراجع، وكثيرًا ما شعرت بالتعب في الصباح. لذلك قررت أن تجرّب تجربة بسيطة: لا هاتف بعد التاسعة مساءً. في البداية كان الأمر صعبًا، وشعرت بأنها تفوّت أشياء كثيرة. لكن بعد أسبوعين أصبحت تنام بشكل أفضل وتقرأ كتبًا أكثر. اليوم ما زالت نوعا تستخدم هاتفها، لكنها تشعر أنها هي من تتحكم فيه، وليس العكس.","questions":[["Why did Noa start the experiment?","Her phone use was hurting her.","Her parents took her phone.","Her phone was broken.","She wanted a new phone."],["How did Noa feel at the beginning?","She felt she was missing things.","She felt relaxed immediately.","She felt proud and happy.","She felt nothing at all."],["What does the last sentence suggest?","Noa now uses her phone wisely.","Noa stopped using her phone.","Noa's phone controls her life.","Noa bought a better phone."]]}},{"en":"environment","he":"סביבה","ru":"окружающая среда","ar":"البيئة","e":"🌍","items":[{"en":"Plastic bags are banned in many countries today.","he":"שקיות פלסטיק אסורות היום במדינות רבות.","ru":"Сегодня пластиковые пакеты запрещены во многих странах.","ar":"الأكياس البلاستيكية محظورة اليوم في كثير من الدول.","e":"","alt":[]},{"en":"If we recycle more, we will produce less waste.","he":"אם נמחזר יותר, נייצר פחות פסולת.","ru":"Если мы будем больше перерабатывать, у нас будет меньше отходов.","ar":"إذا أعدنا التدوير أكثر، فسننتج نفايات أقل.","e":"","alt":[]},{"en":"Solar energy is widely used in Israel.","he":"אנרגיה סולארית נמצאת בשימוש נרחב בישראל.","ru":"Солнечная энергия широко используется в Израиле.","ar":"تُستخدم الطاقة الشمسية على نطاق واسع في إسرائيل.","e":"","alt":[]},{"en":"We should take public transport instead of driving.","he":"כדאי שניסע בתחבורה ציבורית במקום לנהוג.","ru":"Нам стоит ездить на общественном транспорте, а не на машине.","ar":"ينبغي أن نستخدم وسائل النقل العام بدلًا من القيادة.","e":"","alt":[]},{"en":"Many animals are losing their natural habitats.","he":"בעלי חיים רבים מאבדים את בתי הגידול הטבעיים שלהם.","ru":"Многие животные теряют свою естественную среду обитания.","ar":"تفقد حيوانات كثيرة موائلها الطبيعية.","e":"","alt":[]},{"en":"Saving water is everyone's responsibility, not only the government's.","he":"חיסכון במים הוא אחריות של כולם, לא רק של הממשלה.","ru":"Экономия воды — ответственность каждого, а не только правительства.","ar":"توفير المياه مسؤولية الجميع، وليس الحكومة فقط.","e":"","alt":[]}],"reading":{"en":"Every summer, thousands of Israelis visit the beaches of the Mediterranean. Unfortunately, many of them leave plastic bottles and bags behind. This waste is dangerous for sea turtles, which often mistake plastic bags for jellyfish. In 2022, a group of students from Ashdod started cleaning their local beach every Friday morning. At first, only five students came, but soon more than fifty people joined them. The city was so impressed that it put new recycling bins along the beach. The students believe that small actions can lead to big changes.","he":"בכל קיץ אלפי ישראלים מבקרים בחופי הים התיכון. לצערנו, רבים מהם משאירים מאחור בקבוקים ושקיות פלסטיק. הפסולת הזו מסוכנת לצבי ים, שלעיתים קרובות מתבלבלים בין שקיות פלסטיק למדוזות. ב-2022 קבוצת תלמידים מאשדוד התחילה לנקות את החוף המקומי שלהם בכל יום שישי בבוקר. בהתחלה הגיעו רק חמישה תלמידים, אבל מהר מאוד הצטרפו אליהם יותר מחמישים אנשים. העירייה התרשמה כל כך שהיא הציבה פחי מחזור חדשים לאורך החוף. התלמידים מאמינים שפעולות קטנות יכולות להוביל לשינויים גדולים.","ru":"Каждое лето тысячи израильтян приезжают на пляжи Средиземного моря. К сожалению, многие из них оставляют после себя пластиковые бутылки и пакеты. Этот мусор опасен для морских черепах, которые часто принимают пластиковые пакеты за медуз. В 2022 году группа школьников из Ашдода начала каждую пятницу утром убирать местный пляж. Сначала пришли только пять учеников, но вскоре к ним присоединились более пятидесяти человек. Город был так впечатлён, что установил вдоль пляжа новые контейнеры для переработки. Школьники верят, что маленькие поступки могут привести к большим переменам.","ar":"في كل صيف، يزور آلاف الإسرائيليين شواطئ البحر الأبيض المتوسط. ولسوء الحظ، يترك كثيرون منهم وراءهم زجاجات وأكياسًا بلاستيكية. هذه النفايات خطيرة على السلاحف البحرية التي كثيرًا ما تظن أن الأكياس البلاستيكية قناديل بحر. في عام 2022، بدأت مجموعة من الطلاب من أسدود بتنظيف شاطئهم المحلي صباح كل يوم جمعة. في البداية جاء خمسة طلاب فقط، لكن سرعان ما انضم إليهم أكثر من خمسين شخصًا. أُعجبت البلدية بذلك كثيرًا فوضعت حاويات جديدة لإعادة التدوير على طول الشاطئ. يؤمن الطلاب بأن الأفعال الصغيرة قد تؤدي إلى تغييرات كبيرة.","questions":[["Why is plastic dangerous for sea turtles?","They think it is food.","It makes the water hot.","It blocks their way to the beach.","It scares them away."],["What happened after the students started?","Many more people joined them.","The beach was closed.","The students stopped coming.","The city fined the visitors."],["What is the main message of the text?","Small actions can make a difference.","Israeli beaches are always clean.","Turtles do not live in Israel.","Only cities can solve pollution."]]}},{"en":"media","he":"תקשורת ומדיה","ru":"СМИ","ar":"الإعلام","e":"📰","items":[{"en":"Not everything you read online is true.","he":"לא כל מה שקוראים ברשת נכון.","ru":"Не всё, что вы читаете в интернете, правда.","ar":"ليس كل ما تقرأه على الإنترنت صحيحًا.","e":"","alt":[]},{"en":"Fake news spreads faster than real news.","he":"חדשות כזב מתפשטות מהר יותר מחדשות אמיתיות.","ru":"Фейковые новости распространяются быстрее настоящих.","ar":"تنتشر الأخبار الكاذبة أسرع من الأخبار الحقيقية.","e":"","alt":[]},{"en":"Always check the source before you share a story.","he":"תמיד בדקו את המקור לפני שאתם משתפים ידיעה.","ru":"Всегда проверяйте источник, прежде чем делиться новостью.","ar":"تحقّق دائمًا من المصدر قبل أن تشارك أي خبر.","e":"","alt":[]},{"en":"The interview was watched by millions of people.","he":"הראיון נצפה על ידי מיליוני אנשים.","ru":"Интервью посмотрели миллионы людей.","ar":"شوهدت المقابلة من قِبل ملايين الأشخاص.","e":"","alt":[]},{"en":"In my opinion, influencers have too much power.","he":"לדעתי, למשפיענים יש יותר מדי כוח.","ru":"По-моему, у инфлюенсеров слишком много влияния.","ar":"في رأيي، يملك المؤثرون نفوذًا أكثر من اللازم.","e":"","alt":[]},{"en":"Advertisements often target young people on social media.","he":"פרסומות ברשתות החברתיות מכוונות לעיתים קרובות לצעירים.","ru":"Реклама в соцсетях часто нацелена на молодёжь.","ar":"غالبًا ما تستهدف الإعلانات الشباب على وسائل التواصل الاجتماعي.","e":"","alt":[]}],"reading":{"en":"A few months ago, a video of a 'giant shark' near a Tel Aviv beach went viral. Within hours, it had been shared more than 100,000 times. Some people were so frightened that they refused to go swimming. However, a journalist named Yael decided to investigate. She discovered that the video had been edited and that it had actually been filmed in Australia years earlier. When she published her findings, many people felt embarrassed that they had believed it. Yael says that the best weapon against fake news is a simple question: 'Who made this, and why?'","he":"לפני כמה חודשים, סרטון של 'כריש ענק' ליד חוף בתל אביב הפך לוויראלי. בתוך שעות הוא שותף יותר מ-100,000 פעמים. חלק מהאנשים נבהלו כל כך שסירבו להיכנס למים. עם זאת, עיתונאית בשם יעל החליטה לחקור. היא גילתה שהסרטון נערך ושלמעשה הוא צולם באוסטרליה שנים קודם לכן. כשפרסמה את הממצאים שלה, אנשים רבים הרגישו נבוכים על כך שהאמינו לו. יעל אומרת שהנשק הטוב ביותר נגד חדשות כזב הוא שאלה פשוטה: 'מי יצר את זה, ולמה?'","ru":"Несколько месяцев назад видео с «гигантской акулой» у пляжа в Тель-Авиве стало вирусным. За несколько часов им поделились более 100 000 раз. Некоторые люди так испугались, что отказались купаться. Однако журналистка по имени Яэль решила провести расследование. Она выяснила, что видео было смонтировано и на самом деле снято в Австралии много лет назад. Когда она опубликовала свои выводы, многим стало стыдно, что они в это поверили. Яэль говорит, что лучшее оружие против фейковых новостей — простой вопрос: «Кто это сделал и зачем?»","ar":"قبل بضعة أشهر، انتشر مقطع فيديو لـ«سمكة قرش عملاقة» قرب أحد شواطئ تل أبيب انتشارًا واسعًا. وخلال ساعات، تمت مشاركته أكثر من 100,000 مرة. خاف بعض الناس لدرجة أنهم رفضوا السباحة. لكن صحفية تُدعى ياعيل قررت التحقيق في الأمر. فاكتشفت أن الفيديو كان معدّلًا وأنه صُوّر في الحقيقة في أستراليا قبل سنوات. وعندما نشرت ما توصلت إليه، شعر كثيرون بالحرج لأنهم صدّقوه. تقول ياعيل إن أفضل سلاح ضد الأخبار الكاذبة هو سؤال بسيط: «من صنع هذا، ولماذا؟»","questions":[["Why did some people stop swimming?","They believed the shark video.","The water was too cold.","The police closed the beach.","Yael told them to stay away."],["What did Yael find out?","The video was fake and old.","The shark was very dangerous.","The video was filmed in Tel Aviv.","Nobody had watched the video."],["What does Yael advise people to do?","Ask who created content and why.","Stop using social media.","Avoid swimming in the sea.","Share videos as quickly as possible."]]}},{"en":"health","he":"בריאות","ru":"здоровье","ar":"الصحة","e":"🍎","items":[{"en":"Teenagers need at least eight hours of sleep.","he":"בני נוער צריכים לפחות שמונה שעות שינה.","ru":"Подросткам нужно не менее восьми часов сна.","ar":"يحتاج المراهقون إلى ثماني ساعات من النوم على الأقل.","e":"","alt":[]},{"en":"If you exercise regularly, you will feel more energetic.","he":"אם תתאמן באופן קבוע, תרגיש יותר אנרגטי.","ru":"Если вы будете регулярно заниматься спортом, у вас будет больше энергии.","ar":"إذا مارستَ الرياضة بانتظام، فستشعر بنشاط أكبر.","e":"","alt":[]},{"en":"Too much sugar can lead to serious health problems.","he":"יותר מדי סוכר עלול להוביל לבעיות בריאות רציניות.","ru":"Избыток сахара может привести к серьёзным проблемам со здоровьем.","ar":"قد يؤدي الإفراط في السكر إلى مشاكل صحية خطيرة.","e":"","alt":[]},{"en":"Mental health is just as important as physical health.","he":"בריאות הנפש חשובה בדיוק כמו בריאות הגוף.","ru":"Психическое здоровье так же важно, как и физическое.","ar":"الصحة النفسية لا تقل أهمية عن الصحة الجسدية.","e":"","alt":[]},{"en":"Despite the heat, he goes running every morning.","he":"למרות החום, הוא יוצא לרוץ כל בוקר.","ru":"Несмотря на жару, он бегает каждое утро.","ar":"على الرغم من الحر، يخرج للركض كل صباح.","e":"","alt":[]},{"en":"It's a good idea to talk to someone when you're stressed.","he":"כדאי לדבר עם מישהו כשאתה לחוץ.","ru":"Когда вы в стрессе, полезно с кем-нибудь поговорить.","ar":"من الجيد أن تتحدث إلى أحدٍ ما عندما تكون متوترًا.","e":"","alt":[]}],"reading":{"en":"Omer, a seventeen-year-old from Be'er Sheva, used to drink three energy drinks a day. He believed that they helped him study for his exams. However, he soon began to suffer from headaches and could not fall asleep at night. His doctor explained that energy drinks contain large amounts of caffeine and sugar. She advised him to replace them with water, fruit and short walks. Omer was doubtful at first, but he followed her advice. A month later, he was sleeping well, and to his surprise, his grades had actually improved.","he":"עומר, בן שבע עשרה מבאר שבע, נהג לשתות שלושה משקאות אנרגיה ביום. הוא האמין שהם עוזרים לו ללמוד למבחנים. אולם עד מהרה הוא התחיל לסבול מכאבי ראש ולא הצליח להירדם בלילה. הרופאה שלו הסבירה שמשקאות אנרגיה מכילים כמויות גדולות של קפאין וסוכר. היא המליצה לו להחליף אותם במים, בפירות ובהליכות קצרות. בהתחלה עומר היה ספקן, אבל הוא פעל לפי עצתה. חודש לאחר מכן הוא ישן טוב, ולהפתעתו, הציונים שלו אפילו השתפרו.","ru":"Омер, семнадцатилетний юноша из Беэр-Шевы, раньше выпивал по три энергетических напитка в день. Он считал, что они помогают ему готовиться к экзаменам. Однако вскоре у него начались головные боли, и по ночам он не мог заснуть. Врач объяснила ему, что энергетики содержат большое количество кофеина и сахара. Она посоветовала заменить их водой, фруктами и короткими прогулками. Сначала Омер сомневался, но последовал её совету. Через месяц он уже хорошо спал и, к своему удивлению, даже стал учиться лучше.","ar":"كان عومر، وهو شاب في السابعة عشرة من بئر السبع، يشرب ثلاثة مشروبات طاقة يوميًا. كان يعتقد أنها تساعده على الدراسة لامتحاناته. لكنه سرعان ما بدأ يعاني من الصداع ولم يعد يستطيع النوم ليلًا. أوضحت له طبيبته أن مشروبات الطاقة تحتوي على كميات كبيرة من الكافيين والسكر. ونصحته باستبدالها بالماء والفواكه والمشي لفترات قصيرة. تردّد عومر في البداية، لكنه عمل بنصيحتها. وبعد شهر، أصبح ينام جيدًا، ولدهشته تحسّنت علاماته أيضًا.","questions":[["Why did Omer drink energy drinks?","He thought they helped him study.","His friends forced him to.","He liked the color of the cans.","His doctor recommended them."],["What problems did Omer have?","Headaches and trouble sleeping.","Stomach pain and fever.","Low grades and no friends.","Back pain and tired eyes."],["What surprised Omer?","His grades got better.","His doctor was angry with him.","He liked energy drinks more.","His headaches got worse."]]}},{"en":"volunteering","he":"התנדבות","ru":"волонтёрство","ar":"التطوع","e":"🤝","items":[{"en":"Volunteering helps you develop skills you can't learn at school.","he":"התנדבות עוזרת לפתח כישורים שאי אפשר ללמוד בבית הספר.","ru":"Волонтёрство помогает развить навыки, которым не научишься в школе.","ar":"يساعدك التطوع على تطوير مهارات لا يمكنك تعلّمها في المدرسة.","e":"","alt":[]},{"en":"She has been volunteering at the hospital for two years.","he":"היא מתנדבת בבית החולים כבר שנתיים.","ru":"Она работает волонтёром в больнице уже два года.","ar":"إنها تتطوع في المستشفى منذ عامين.","e":"","alt":[]},{"en":"If you want to make a difference, start in your community.","he":"אם אתה רוצה לחולל שינוי, התחל בקהילה שלך.","ru":"Если хотите что-то изменить, начните со своего окружения.","ar":"إذا أردت أن تُحدث فرقًا، فابدأ بمجتمعك.","e":"","alt":[]},{"en":"Elderly people often suffer from loneliness.","he":"אנשים מבוגרים סובלים לעיתים קרובות מבדידות.","ru":"Пожилые люди часто страдают от одиночества.","ar":"كثيرًا ما يعاني كبار السن من الوحدة.","e":"","alt":[]},{"en":"Giving your time is sometimes more valuable than giving money.","he":"לתת מזמנך שווה לפעמים יותר מלתת כסף.","ru":"Иногда отдать своё время ценнее, чем дать деньги.","ar":"أحيانًا يكون تقديم وقتك أثمن من تقديم المال.","e":"","alt":[]},{"en":"Every student is required to complete a community project.","he":"כל תלמיד נדרש להשלים פרויקט קהילתי.","ru":"Каждый ученик обязан выполнить общественный проект.","ar":"يُطلب من كل طالب إكمال مشروع مجتمعي.","e":"","alt":[]}],"reading":{"en":"In Israel, high school students are required to do sixty hours of community service, known as 'Personal Commitment'. Some students see it as just another task, but for many it becomes a meaningful experience. Tamar, from Jerusalem, chose to volunteer at a centre for children with special needs. At first, she was nervous because she had no experience. Nevertheless, the children welcomed her warmly, and she quickly learned how to help them. She enjoyed it so much that she continued volunteering long after her sixty hours were completed. Now she is thinking about studying special education at university.","he":"בישראל, תלמידי תיכון נדרשים לבצע שישים שעות של שירות לקהילה, המכונה 'מחויבות אישית'. יש תלמידים שרואים בזה עוד משימה, אבל עבור רבים זו הופכת לחוויה משמעותית. תמר מירושלים בחרה להתנדב במרכז לילדים עם צרכים מיוחדים. בהתחלה היא הייתה לחוצה כי לא היה לה ניסיון. למרות זאת, הילדים קיבלו אותה בחום, והיא למדה מהר איך לעזור להם. היא נהנתה כל כך שהמשיכה להתנדב זמן רב אחרי שהשלימה את שישים השעות. עכשיו היא חושבת ללמוד חינוך מיוחד באוניברסיטה.","ru":"В Израиле старшеклассники обязаны выполнить шестьдесят часов общественной работы, известной как «Личное обязательство». Некоторые ученики считают это просто ещё одним заданием, но для многих это становится важным опытом. Тамар из Иерусалима решила стать волонтёром в центре для детей с особыми потребностями. Сначала она нервничала, потому что у неё не было опыта. Тем не менее дети тепло её приняли, и она быстро научилась им помогать. Ей так понравилось, что она продолжала волонтёрить ещё долго после того, как отработала свои шестьдесят часов. Теперь она думает о том, чтобы изучать специальную педагогику в университете.","ar":"في إسرائيل، يُطلب من طلاب المدارس الثانوية أداء ستين ساعة من الخدمة المجتمعية، تُعرف باسم «الالتزام الشخصي». يرى بعض الطلاب في ذلك مجرد مهمة أخرى، لكنه يصبح لكثيرين تجربة ذات معنى. اختارت تمار من القدس أن تتطوع في مركز للأطفال ذوي الاحتياجات الخاصة. في البداية كانت متوترة لأنها لم تكن تملك أي خبرة. ومع ذلك، استقبلها الأطفال بحرارة، وتعلّمت بسرعة كيف تساعدهم. استمتعت بذلك كثيرًا حتى إنها واصلت التطوع بعد إتمام ساعاتها الستين بوقت طويل. وهي تفكر الآن في دراسة التربية الخاصة في الجامعة.","questions":[["How did Tamar feel at the start?","Nervous and inexperienced.","Bored and tired.","Angry with her school.","Confident and relaxed."],["What does 'Nevertheless' show in the text?","A contrast with the previous idea.","A result of the previous idea.","An example of the previous idea.","The order of events in time."],["What can we learn about Tamar's future?","Volunteering may shape her career.","She will stop volunteering soon.","She wants to become a doctor.","She plans to leave Jerusalem."]]}},{"en":"future plans","he":"תוכניות לעתיד","ru":"планы на будущее","ar":"خطط المستقبل","e":"🚀","dialog":true,"items":[{"q":"What do you want to do after high school?","en":"I'm planning to work for a year and save money.","he":"אני מתכנן לעבוד שנה ולחסוך כסף.","ru":"Я планирую поработать год и накопить денег.","ar":"أخطط للعمل لمدة عام وادخار المال."},{"q":"Which subject do you enjoy the most?","en":"I really enjoy biology because I love understanding how things work.","he":"אני מאוד נהנה מביולוגיה כי אני אוהב להבין איך דברים עובדים.","ru":"Мне очень нравится биология, потому что я люблю понимать, как всё устроено.","ar":"أستمتع كثيرًا بالأحياء لأنني أحب أن أفهم كيف تعمل الأشياء."},{"q":"What job would you like to have one day?","en":"I would like to become an engineer and design smart buildings.","he":"הייתי רוצה להיות מהנדס ולתכנן בניינים חכמים.","ru":"Я хотел бы стать инженером и проектировать умные здания.","ar":"أودّ أن أصبح مهندسًا وأصمّم مبانيَ ذكية."},{"q":"Would you prefer to live in a city or a village?","en":"I'd prefer a city because there are more opportunities there.","he":"הייתי מעדיף עיר, כי יש שם יותר הזדמנויות.","ru":"Я бы предпочёл город, потому что там больше возможностей.","ar":"أفضّل المدينة لأن فيها فرصًا أكثر."},{"q":"What will you do if you don't get into your first choice?","en":"If that happens, I will try again or choose another path.","he":"אם זה יקרה, אנסה שוב או אבחר דרך אחרת.","ru":"Если так случится, я попробую снова или выберу другой путь.","ar":"إذا حدث ذلك، فسأحاول مرة أخرى أو أختار طريقًا آخر."},{"q":"Who has influenced your plans the most?","en":"My older sister has influenced me because she followed her dreams.","he":"אחותי הגדולה השפיעה עליי, כי היא הלכה בעקבות החלומות שלה.","ru":"На меня больше всех повлияла старшая сестра, потому что она следовала своей мечте.","ar":"أثّرت فيّ أختي الكبرى لأنها سعت وراء أحلامها."}]}]},{"id":"h11","group":"high","he":"4 יחידות לימוד","sub":"בגרות 4 יח״ל: טקסטים וטיעונים","e":"📗","units":[{"en":"artificial intelligence","he":"בינה מלאכותית","ru":"искусственный интеллект","ar":"الذكاء الاصطناعي","e":"🤖","items":[{"en":"Artificial intelligence is being used in almost every industry.","he":"בינה מלאכותית משמשת כיום כמעט בכל תעשייה.","ru":"Искусственный интеллект используется почти во всех отраслях.","ar":"يُستخدم الذكاء الاصطناعي في كل قطاع تقريبًا.","e":"","alt":[]},{"en":"Many experts warned that AI could replace millions of jobs.","he":"מומחים רבים הזהירו שבינה מלאכותית עלולה להחליף מיליוני משרות.","ru":"Многие эксперты предупреждали, что ИИ может заменить миллионы рабочих мест.","ar":"حذّر كثير من الخبراء من أن الذكاء الاصطناعي قد يحلّ محلّ ملايين الوظائف.","e":"","alt":[]},{"en":"The program that wrote this essay was trained on millions of texts.","he":"התוכנה שכתבה את החיבור הזה אומנה על מיליוני טקסטים.","ru":"Программа, написавшая это сочинение, обучалась на миллионах текстов.","ar":"دُرِّب البرنامج الذي كتب هذا المقال على ملايين النصوص.","e":"","alt":[]},{"en":"My teacher said that we shouldn't rely on chatbots for homework.","he":"המורה שלי אמרה שאסור לנו להסתמך על צ׳טבוטים בשיעורי הבית.","ru":"Учительница сказала, что нам не стоит полагаться на чат-ботов при выполнении домашних заданий.","ar":"قالت معلمتي إنه لا ينبغي لنا الاعتماد على روبوتات الدردشة في الواجبات المنزلية.","e":"","alt":[]},{"en":"AI can analyze data much faster than humans can.","he":"בינה מלאכותית יכולה לנתח נתונים מהר הרבה יותר מבני אדם.","ru":"ИИ может анализировать данные гораздо быстрее, чем люди.","ar":"يستطيع الذكاء الاصطناعي تحليل البيانات أسرع بكثير من البشر.","e":"","alt":[]},{"en":"Who is responsible when a self-driving car causes an accident?","he":"מי אחראי כשמכונית אוטונומית גורמת לתאונה?","ru":"Кто несёт ответственность, если беспилотный автомобиль становится причиной аварии?","ar":"من المسؤول عندما تتسبب سيارة ذاتية القيادة في حادث؟","e":"","alt":[]}],"reading":{"en":"In recent years, AI tools have been introduced into many Israeli schools. Supporters claim that these tools allow each student to learn at his or her own pace. For example, a student who struggles with algebra can receive extra exercises and instant feedback. Critics, however, argue that students who depend on AI may never develop the ability to think independently. They also point out that AI sometimes produces answers which sound convincing but are completely wrong. Most teachers agree that the solution is not to ban AI, but to teach students how to use it critically. As one principal from Netanya put it, 'A calculator did not destroy mathematics, and AI will not destroy learning.'","he":"בשנים האחרונות הוכנסו כלי בינה מלאכותית לבתי ספר רבים בישראל. התומכים טוענים שהכלים האלה מאפשרים לכל תלמיד ללמוד בקצב שלו. לדוגמה, תלמיד שמתקשה באלגברה יכול לקבל תרגילים נוספים ומשוב מיידי. המבקרים, לעומת זאת, טוענים שתלמידים שתלויים בבינה מלאכותית עלולים לעולם לא לפתח את היכולת לחשוב באופן עצמאי. הם גם מציינים שבינה מלאכותית מייצרת לפעמים תשובות שנשמעות משכנעות אבל שגויות לחלוטין. רוב המורים מסכימים שהפתרון אינו לאסור את השימוש בבינה מלאכותית, אלא ללמד את התלמידים להשתמש בה באופן ביקורתי. כפי שניסחה זאת מנהלת בית ספר מנתניה: 'המחשבון לא הרס את המתמטיקה, ובינה מלאכותית לא תהרוס את הלמידה.'","ru":"В последние годы во многих израильских школах начали использовать инструменты искусственного интеллекта. Сторонники утверждают, что эти инструменты позволяют каждому ученику учиться в своём темпе. Например, ученик, которому трудно даётся алгебра, может получать дополнительные упражнения и мгновенную обратную связь. Критики же утверждают, что ученики, зависящие от ИИ, могут так и не научиться мыслить самостоятельно. Они также отмечают, что ИИ иногда даёт ответы, которые звучат убедительно, но совершенно неверны. Большинство учителей согласны, что решение не в том, чтобы запретить ИИ, а в том, чтобы научить учеников пользоваться им критически. Как сказала директор одной школы из Нетании: «Калькулятор не уничтожил математику, и ИИ не уничтожит обучение».","ar":"في السنوات الأخيرة، أُدخلت أدوات الذكاء الاصطناعي إلى كثير من المدارس في إسرائيل. يزعم المؤيدون أن هذه الأدوات تتيح لكل طالب أن يتعلم بالوتيرة التي تناسبه. فعلى سبيل المثال، يمكن للطالب الذي يواجه صعوبة في الجبر أن يحصل على تمارين إضافية وتغذية راجعة فورية. أما المنتقدون فيرون أن الطلاب الذين يعتمدون على الذكاء الاصطناعي قد لا يطوّرون أبدًا القدرة على التفكير المستقل. ويشيرون أيضًا إلى أن الذكاء الاصطناعي ينتج أحيانًا إجابات تبدو مقنعة لكنها خاطئة تمامًا. ويتفق معظم المعلمين على أن الحل ليس في حظر الذكاء الاصطناعي، بل في تعليم الطلاب كيفية استخدامه بشكل نقدي. وكما قالت مديرة مدرسة من نتانيا: «الآلة الحاسبة لم تدمّر الرياضيات، والذكاء الاصطناعي لن يدمّر التعلّم».","questions":[["What advantage of AI do supporters mention?","Students can learn at their own pace.","Teachers can work fewer hours.","Schools can save money on books.","Students no longer need exams."],["What problem do critics point out?","AI answers may be wrong but convincing.","AI is too expensive for schools.","AI tools are too slow.","Students find AI boring."],["Why does the principal mention a calculator?","New tools need not harm learning.","Calculators should be banned in class.","AI is better than calculators.","Algebra is taught with calculators."]]}},{"en":"climate change","he":"שינוי האקלים","ru":"изменение климата","ar":"تغيّر المناخ","e":"🌡️","items":[{"en":"Global temperatures have risen sharply over the past century.","he":"הטמפרטורות בעולם עלו בחדות במהלך המאה האחרונה.","ru":"За последнее столетие глобальная температура резко повысилась.","ar":"ارتفعت درجات الحرارة العالمية بشكل حاد خلال القرن الماضي.","e":"","alt":[]},{"en":"If governments had acted earlier, the damage would have been smaller.","he":"אילו הממשלות היו פועלות מוקדם יותר, הנזק היה קטן יותר.","ru":"Если бы правительства начали действовать раньше, ущерб был бы меньше.","ar":"لو تحرّكت الحكومات في وقت أبكر، لكان الضرر أقل.","e":"","alt":[]},{"en":"Scientists reported that sea levels were rising faster than expected.","he":"מדענים דיווחו שגובה פני הים עולה מהר מהצפוי.","ru":"Учёные сообщили, что уровень моря растёт быстрее, чем ожидалось.","ar":"أفاد العلماء بأن مستوى سطح البحر يرتفع أسرع من المتوقع.","e":"","alt":[]},{"en":"Burning fossil fuels is the main cause of global warming.","he":"שריפת דלקים מאובנים היא הגורם העיקרי להתחממות הגלובלית.","ru":"Сжигание ископаемого топлива — главная причина глобального потепления.","ar":"حرق الوقود الأحفوري هو السبب الرئيسي للاحترار العالمي.","e":"","alt":[]},{"en":"Despite international agreements, emissions continue to increase.","he":"למרות הסכמים בינלאומיים, הפליטות ממשיכות לעלות.","ru":"Несмотря на международные соглашения, выбросы продолжают расти.","ar":"على الرغم من الاتفاقيات الدولية، تستمر الانبعاثات في الازدياد.","e":"","alt":[]},{"en":"Extreme weather events have become more frequent and more severe.","he":"אירועי מזג אוויר קיצוניים הפכו לתכופים וחמורים יותר.","ru":"Экстремальные погодные явления стали более частыми и сильными.","ar":"أصبحت الظواهر الجوية المتطرفة أكثر تكرارًا وشدة.","e":"","alt":[]}],"reading":{"en":"Israel is often described as a world leader in water technology. Decades ago, the country suffered from serious water shortages, which threatened both agriculture and daily life. In response, Israeli engineers developed drip irrigation, a method that delivers water directly to the roots of plants. Later, several large desalination plants were built along the Mediterranean coast. Today, most of the country's drinking water comes from the sea. Nevertheless, experts warn that desalination requires a great deal of energy, which can contribute to climate change. Therefore, researchers are now looking for ways to power these plants with renewab
