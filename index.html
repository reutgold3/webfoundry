<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#DDF1F7"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>English Buddy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a picture book page; the character sits on top and talks in a bubble, the activity fills the page below. Bright single-theme look by choice. */
:root{
  --sky:#DDF1F7;        /* page ground */
  --paper:#FFFFFF;      /* cards */
  --ink:#1D2B4F;        /* text */
  --ink-soft:#5A6788;   /* secondary text */
  --sun:#FFC83D;        /* accent: stars, main button */
  --sun-deep:#E8A400;
  --leaf:#2FB57C;       /* correct */
  --berry:#E8506A;      /* wrong */
  --sea:#2D7FD3;        /* listen / links */
  --line:#BFDCE8;
  --display:"Fredoka","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:700}
h2{font-size:24px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--display)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:999px;
  font-family:var(--display);font-weight:600;font-size:20px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.wide{width:100%}
.btn.ghost{background:var(--paper);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--sea);font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* Top bar */
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;min-width:0}
.bar{height:14px;border-radius:999px;background:var(--paper);overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .35s}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--line);font-size:15px}
.x{width:44px;height:44px;border-radius:50%;background:var(--paper);font-size:20px;border:2px solid var(--line);flex:none}

/* Character + bubble */
.talk{display:flex;align-items:flex-end;gap:12px}
.avatar{flex:none;width:92px;height:92px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:58px;border:3px solid var(--sun);box-shadow:0 4px 0 var(--line)}
.avatar.speaking{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(-3deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border-radius:22px 22px 6px 22px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.bubble .line{font-size:20px;font-weight:600;direction:ltr;text-align:left;font-family:var(--display)}
.bubble .he{margin-top:6px;color:var(--ink-soft);font-size:16px}
.bubble .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sky);font-weight:500;font-size:15px}

/* Word / phrase card */
.card{background:var(--paper);border-radius:28px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 6px 0 var(--line);text-align:center}
.pic{font-size:110px;line-height:1.1}
.word{font-size:46px;font-weight:700;direction:ltr;font-family:var(--display);line-height:1.15;overflow-wrap:anywhere}
.word.phrase{font-size:28px}
.word-he{color:var(--ink-soft);font-size:18px}
.who{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.speak{width:72px;height:72px;border-radius:50%;background:var(--sea);color:#fff;font-size:32px;box-shadow:0 5px 0 #1B5C9F;flex:none}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 #1B5C9F}
.speak.slow{background:var(--leaf);box-shadow:0 5px 0 #1F8A5C}
.dlg{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;direction:ltr}
.dlg .q,.dlg .a{border-radius:18px;padding:12px 14px;font-family:var(--display);font-size:20px;font-weight:600}
.dlg .q{background:var(--sky);margin-right:32px}
.dlg .a{background:#FFF6DA;margin-left:32px}
.dlg .a small{display:block;direction:rtl;text-align:right;font-family:var(--body);font-weight:400;font-size:15px;color:var(--ink-soft)}

/* Choices */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid.one{grid-template-columns:1fr}
.opt{background:var(--paper);border-radius:22px;min-height:120px;display:grid;place-items:center;font-size:64px;box-shadow:0 5px 0 var(--line);border:3px solid transparent;transition:transform .08s;padding:10px}
.opt.text{min-height:64px;font-size:19px;font-weight:500;line-height:1.35}
.opt.text.en{font-size:19px;font-weight:600;text-align:left}
.opt:active{transform:translateY(3px)}
.opt.good{border-color:var(--leaf);background:#E6F8EF}
.opt.bad{border-color:var(--berry);background:#FDECEF;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prompt-word{font-size:44px;font-weight:700;text-align:center;direction:ltr;background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line);font-family:var(--display);overflow-wrap:anywhere}
.prompt-word.phrase{font-size:26px}

/* Sentence builder */
.slot{min-height:72px;background:var(--paper);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;direction:ltr;border:3px dashed var(--line)}
.slot.good{border:3px solid var(--leaf);background:#E6F8EF}
.slot.bad{border:3px solid var(--berry);animation:shake .3s}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tok{min-height:46px;padding:0 14px;border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:600;font-size:19px}
.tok.used{visibility:hidden}
.slot .tok{background:#FFF6DA;box-shadow:0 4px 0 #F0D78C}

/* Mic */
.mic{width:110px;height:110px;border-radius:50%;background:var(--berry);color:#fff;font-size:46px;box-shadow:0 6px 0 #B73350}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,80,106,.5),0 6px 0 #B73350}100%{box-shadow:0 0 0 22px rgba(232,80,106,0),0 6px 0 #B73350}}
.heard{min-height:24px;color:var(--ink-soft);font-size:16px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Home */
.hero{background:var(--paper);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--line)}
.today-topic{display:flex;align-items:center;gap:14px}
.today-topic .big{font-size:52px;flex:none}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--paper);border:3px dashed var(--line)}
.dot.done{border:3px solid var(--leaf);background:#E6F8EF}
.dot.next{border:3px solid var(--sun);background:#FFF6DA;animation:bob 1s ease-in-out infinite alternate}
.dot.lock{opacity:.45}

/* Onboarding */
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.char{background:var(--paper);border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;box-shadow:0 5px 0 var(--line)}
.char .e{font-size:42px;line-height:1.1}
.char .n{font-family:var(--display);font-weight:600;font-size:17px;direction:ltr}
.char[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
.courses{display:flex;flex-direction:column;gap:10px}
.group{display:flex;flex-direction:column;gap:10px}
.group+.group{margin-top:8px}
.course{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:12px 16px;text-align:right;box-shadow:0 5px 0 var(--line);border:3px solid transparent}
.course .e{font-size:38px;flex:none}
.course b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.course span{color:var(--ink-soft);font-size:15px}
.course[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
.kidrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;font-size:20px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}

/* Reading */
.story{align-items:stretch;text-align:left}
.story-text{direction:ltr;font-family:var(--display);font-size:21px;font-weight:500;line-height:1.55;max-width:60ch}
.story-he{direction:rtl;text-align:right;color:var(--ink-soft);font-size:16px;border-top:2px dashed var(--line);padding-top:10px}
.qtext{font-family:var(--display);font-size:22px;font-weight:600;direction:ltr;text-align:left}
/* Writing */
.slot.spell{justify-content:center;min-height:68px}
.tok.letter{min-width:44px;font-size:22px;text-transform:lowercase}
.blank{display:inline-block;width:44px;height:46px;border-bottom:3px solid var(--line)}
.field input.good{border-color:var(--leaf);background:#E6F8EF}
.field input.bad{border-color:var(--berry);animation:shake .3s}
/* Scores, settings */
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 var(--line);min-width:0}
.stat .label{font-size:12px;letter-spacing:.02em}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.score{display:flex;flex-direction:column;align-items:center;gap:2px}
.score b{font-family:var(--display);font-size:64px;line-height:1;color:var(--leaf);font-variant-numeric:tabular-nums}
.score.low b{color:var(--berry)}
.score span{font-weight:700}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.missed .label{width:100%}
.missed .en{background:#FFF6DA;border-radius:999px;padding:4px 12px;font-weight:600}
.hero.test{background:#EAF3FF}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segb{min-height:48px;border-radius:14px;background:var(--sky);font-weight:600;border:3px solid transparent}
.segb[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
a.btn{text-decoration:none}
/* Finish */
.stars{font-size:52px;letter-spacing:6px;text-align:center}
.center{text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===================== Voice ===================== */
let VOICE=null;
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  VOICE=v.find(x=>/en[-_]US/i.test(x.lang)&&/samantha|google|female|aria|jenny/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null;
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,{slow=false}={}){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){res();return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const c=char();u.lang="en-US";if(VOICE)u.voice=VOICE;
    u.pitch=c.pitch;u.rate=slow?.6:c.rate;
    const av=document.querySelector(".avatar");
    u.onstart=()=>av&&av.classList.add("speaking");
    let done=false;
    const end=()=>{if(done)return;done=true;const a=document.querySelector(".avatar");a&&a.classList.remove("speaking");res()};
    u.onend=end;u.onerror=end;
    setTimeout(end,Math.max(2500,text.length*150));
    speechSynthesis.speak(u);
  });
}
const stopVoice=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* ===================== Speech recognition ===================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let srBlocked=!SR;
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20};
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
const CONTR=[[/\b(it|that|what|there|he|she|where|who)'s\b/g,"$1 is"],[/\bi'm\b/g,"i am"],[/\b(\w+)'re\b/g,"$1 are"],[/\b(\w+)'ll\b/g,"$1 will"],[/\b(\w+)'d\b/g,"$1 would"],[/\b(\w+)'ve\b/g,"$1 have"],[/\bcan't\b/g,"can not"],[/\bwon't\b/g,"will not"],[/\b(\w+)n't\b/g,"$1 not"],[/\bcannot\b/g,"can not"]];
const norm=s=>CONTR.reduce((t,[r,v])=>t.replace(r,v),String(s).toLowerCase().replace(/[’]/g,"'")).replace(/'/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(Boolean).map(t=>NUMW[t]!=null?String(NUMW[t]):t);
function matchScore(heard,target){
  const T=norm(target),H=norm(heard);if(!T.length)return 0;
  const hit=T.filter(t=>H.some(h=>h===t||(t.length>3&&lev(h,t)<=1))).length;
  return hit/T.length;
}
function matches(heardList,item){
  const targets=[item.en,...(item.alt||[])];
  for(const h of heardList)for(const t of targets){
    const n=norm(t).length,sc=matchScore(h,t);
    if(n<=2?sc===1:sc>=.75)return true;
  }
  return false;
}
function listenOnce(){
  return new Promise((res,rej)=>{
    const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=5;
    let got=false;
    r.onresult=e=>{got=true;res([...e.results[0]].map(a=>a.transcript))};
    r.onerror=e=>{(e.error==="no-speech"||e.error==="aborted")?res([]):rej(e.error||"error")};
    r.onend=()=>{if(!got)res([])};
    try{r.start()}catch(e){rej("start")}
  });
}

function pad(n){return String(n).padStart(2,"0")}
function reminderDates(){
  const [h,m]=(S.remind||"17:00").split(":").map(Number);
  const d=new Date();d.setDate(d.getDate()+1);d.setHours(h,m,0,0);

  return [f(d),f(e)];
}

/* ===================== Tests ===================== */
function startTest(){
  const C=course(),n=Math.min(doneIn(C),C.units.length);
  const units=C.units.slice(0,n);
  const words=units.filter(u=>!u.dialog).flatMap(u=>u.items),dlg=units.filter(u=>u.dialog).flatMap(u=>u.items);
  const steps=[{t:"test-intro"}];
  if(dlg.length){
    pickN(dlg,5).forEach(w=>steps.push({t:"reply",w,pool:dlg}));
    pickN(dlg,3).forEach(w=>steps.push({t:"type",w,dialog:true}));
    pickN(dlg,2).forEach(w=>steps.push({t:"answer",w}));
  }else{
    const pics=words.filter(w=>w.e),phr=words.filter(w=>!w.e);
    const qs=[];
    shuffle(words).slice(0,4).forEach(w=>qs.push({t:"listen",w,pool:w.e?pics:phr}));
    shuffle(words).slice(0,3).forEach(w=>qs.push({t:"read",w,pool:w.e?pics:phr}));
    shuffle(words).slice(0,2).forEach(w=>qs.push({t:w.e?(w.en.includes(" ")?"build":"spell"):"type",w}));
    steps.push(...shuffle(qs));
    const reads=(READ[C.id]||[]).slice(0,n);
    if(reads.length){const R=reads[Math.random()*reads.length|0];steps.push({t:"story",R});R[2].slice(0,2).forEach(q=>steps.push({t:"rq",R,q}))}
  }
  LS={test:true,idx:-1,L:{en:"test",he:"מבחן",items:[]},pic:false,steps,i:0,stars:0};
  step();
}
function testFinish(){
  const C=course();
  const max=LS.steps.filter(s=>["say","answer","listen","read","reply","build","spell","type","rq"].includes(s.t)).length;
  const score=Math.round(Math.min(1,LS.stars/max)*100);
  S.tests=S.tests||{};(S.tests[C.id]=S.tests[C.id]||[]).push({d:dayStr(),s:score});
  S.stars+=LS.stars;save();
  const passed=score>=PASS;
  const en=passed?`Test finished! Your score is ${score}. Well done, ${nm()}!`:`Test finished. Your score is ${score}. Let's practice more and try again!`;
  const he=passed?`המבחן הסתיים! הציון שלכם ${score}. כל הכבוד, ${nm()}!`:`המבחן הסתיים. הציון שלכם ${score}. בואו נתרגל עוד וננסה שוב!`;
  const missed=(LS.missed||[]).slice(0,8);
  const hist=S.tests[C.id].slice(-5);
  app.innerHTML=talkHTML(en,he)+`
   <div class="hero center"><div class="label">ציון במבחן</div>
   <div class="score ${passed?"":"low"}"><b>${score}</b><span>${gradeHe(score)}</span></div>
   ${missed.length?`<div class="missed"><div class="label">כדאי לחזור על</div>${missed.map(m=>`<span class="en">${esc(m)}</span>`).join("")}</div>`:""}
   ${hist.length>1?`<div class="label">המבחנים האחרונים</div><div class="row">${hist.map(h=>`<span class="chip">${h.s}</span>`).join("")}</div>`:""}</div>
   ${passed?`<button class="btn wide" id="home">חזרה למסך הבית</button>`:`<button class="btn wide" id="again">מבחן חוזר</button><button class="link" id="home">חזרה למסך הבית</button>`}`;
  wireTalk(en);say(en);$("#home").onclick=home;
  if($("#again"))$("#again").onclick=startTest;
}

/* ===================== Lesson engine ===================== */
let LS=null;
function startLesson(idx,isRepeat){
  const C=course(),L=C.units[idx],pic=isPicUnit(L);
  const prevUnits=C.units.filter((u,i)=>i!==idx&&i<Math.min(doneIn(C),C.units.length));
  const steps=[{t:"intro"}];
  const R=(READ[C.id]||[])[idx];
  if(L.dialog){
    L.items.forEach(w=>steps.push({t:"dlearn",w}));
    steps.push({t:"talk-intro"});
    pickN(L.items,Math.min(6,nq(6))).forEach(w=>steps.push({t:"answer",w}));
    steps.push({t:"reply-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"reply",w,pool:L.items}));
    steps.push({t:"write-intro"});
    pickN(L.items,nq(2)).forEach(w=>steps.push({t:"type",w,dialog:true}));
  }else{
    L.items.forEach(w=>steps.push({t:"learn",w}));
    steps.push({t:"say-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"say",w}));
    steps.push({t:"listen-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"listen",w,pool:L.items}));
    steps.push({t:"read-intro"});
    pickN(L.items,nq(3)).forEach(w=>steps.push({t:"read",w,pool:L.items}));
    if(!pic&&L.items.some(w=>w.en.split(" ").length>=3)){
      steps.push({t:"build-intro"});
      pickN(L.items.filter(w=>w.en.split(" ").length>=3),nq(2)).forEach(w=>steps.push({t:"build",w}));
    }
    steps.push({t:"write-intro"});
    pickN(L.items,nq(2)).forEach(w=>steps.push({t:pic?(w.en.includes(" ")?"build":"spell"):"type",w}));
    if(R){
      steps.push({t:"story",R});
      R[2].slice(0,S.len==="5"?2:R[2].length).forEach(q=>steps.push({t:"rq",R,q}));
    }
    const prevSame=prevUnits.filter(u=>!u.dialog&&isPicUnit(u)===pic).flatMap(u=>u.items);
    if(prevSame.length>=6&&S.len!=="5"){steps.push({t:"review-intro"});pickN(prevSame,nq(2)).forEach(w=>steps.push({t:"listen",w,pool:prevSame}))}
  }
  LS={idx,L,pic,steps,i:0,stars:0,isRepeat};
  step();
}
function frame(inner){
  const pct=Math.round(LS.i/LS.steps.length*100);
  app.innerHTML=`<div class="top"><button class="x" id="quit" aria-label="יציאה מהשיעור">✕</button>
    <div class="grow"><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div>
    ${LS.test?`<span class="chip">מבחן</span>`:""}<span class="chip">⭐ ${LS.stars}</span></div>${inner}`;
  $("#quit").onclick=home;
}
function next(){LS.i++;LS.i>=LS.steps.length?finish():step()}
const PRAISE=[["Yes! Well done!","כן! כל הכבוד!"],["Super!","סופר!"],["You got it!","הצלחתם!"],["Amazing!","מדהים!"],["Excellent!","מצוין!"]];
const praise=()=>PRAISE[Math.random()*PRAISE.length|0];

function step(){
  const s=LS.steps[LS.i],L=LS.L;
  const intro=(en,he,btn="בואו נתחיל")=>{frame(talkHTML(en,he)+`<button class="btn wide" id="nx">${btn}</button>`);wireTalk(en);say(en);$("#nx").onclick=next};
  switch(s.t){
  case"intro":return L.dialog
    ?intro(`Hi ${nm()}! Today we practice a conversation: ${L.en}. I ask, you answer!`,`היי ${nm()}! היום נתרגל שיחה: ${L.he}. אני שואל/ת, ואתם עונים!`)
    :intro(`Hi ${nm()}! Today we learn about ${L.en}. Listen and repeat after me!`,`היי ${nm()}! היום נלמד על ${L.he}. תקשיבו ותחזרו אחריי!`);
  case"say-intro":return intro(LS.pic?"Now you talk! Tap the microphone and say the word.":"Now you talk! Tap the microphone and say the sentence.",LS.pic?"עכשיו אתם מדברים! לחצו על המיקרופון ותגידו את המילה.":"עכשיו אתם מדברים! לחצו על המיקרופון ותגידו את המשפט.");
  case"listen-intro":return intro(LS.pic?"Listen and tap the right picture.":"Listen and tap the right meaning.",LS.pic?"תקשיבו ולחצו על התמונה הנכונה.":"תקשיבו ולחצו על הפירוש הנכון.");
  case"read-intro":return intro(LS.pic?"Now read the word and tap the right picture.":"Now read and tap the right meaning.",LS.pic?"עכשיו תקראו את המילה ולחצו על התמונה הנכונה.":"עכשיו תקראו ולחצו על הפירוש הנכון.");
  case"build-intro":return intro("Let's build sentences! Tap the words in the right order.","בואו נבנה משפטים! לחצו על המילים בסדר הנכון.");
  case"review-intro":return intro("Let's remember things from before!","בואו ניזכר במה שלמדנו בפעמים קודמות!");
  case"talk-intro":return intro("Your turn! I ask a question, and you answer.","תורכם! אני שואל/ת שאלה, ואתם עונים.");
  case"reply-intro":return intro("Listen to my question and choose the best answer.","תקשיבו לשאלה ובחרו את התשובה המתאימה.");
  case"test-intro":return intro(`Test time, ${nm()}! Do your best. Good luck!`,`זמן מבחן, ${nm()}! תנסו כמה שיותר. בהצלחה!`,"להתחיל");
  case"write-intro":return intro(LS.pic?"Now let's write! Spell the words.":"Now let's write in English!",LS.pic?"עכשיו נכתוב! אייתו את המילים.":"עכשיו נכתוב באנגלית!");
  case"story":return story(s.R);
  case"rq":return readQ(s.R,s.q);
  case"spell":return spell(s.w);
  case"type":return typeStep(s.w,s.dialog);
  case"learn":return learn(s.w);
  case"dlearn":return dlearn(s.w);
  case"say":return speakStep(s.w);
  case"answer":return speakStep(s.w,true);
  case"listen":return choose(s.w,s.pool,"listen");
  case"read":return choose(s.w,s.pool,"read");
  case"reply":return chooseReply(s.w,s.pool);
  case"build":return build(s.w);
  }
}

function learn(w){
  const pic=!!w.e&&LS.pic;
  const en=pic?`This is ${w.en}. Say: ${w.en}!`:`Listen: ${w.en}`;
  const he=pic?`${w.he} באנגלית זה ${w.en}.`:`הפירוש: ${w.he}`;
  frame(talkHTML(en,he)+`
   <div class="card">${pic?`<div class="pic" aria-hidden="true">${w.e}</div>`:""}<div class="word ${pic?"":"phrase"}">${esc(w.en)}</div><div class="word-he">${esc(w.he)}</div>
   <div class="row"><button class="speak" id="hear" aria-label="להשמיע">🔊</button><button class="speak slow" id="slow" aria-label="להשמיע לאט">🐢</button></div></div>
   <button class="btn wide" id="nx">הבא</button>`);
  wireTalk(en);
  $("#hear").onclick=()=>say(w.en);$("#slow").onclick=()=>say(w.en,{slow:true});
  $("#nx").onclick=next;say(en);
}

function dlearn(w){
  const en=`${w.q} ... ${w.en}`;
  frame(talkHTML(w.q,"השאלה של הדמות")+`
   <div class="card"><div class="dlg"><div class="q"><span class="who">${esc(char().name)}</span><br>${esc(w.q)}</div>
   <div class="a"><span class="who">You</span><br>${esc(w.en)}<small>${esc(w.he)}</small></div></div>
   <div class="row"><button class="speak" id="hear" aria-label="להשמיע את התשובה">🔊</button><button class="speak slow" id="slow" aria-label="להשמיע לאט">🐢</button></div></div>
   <button class="btn wide" id="nx">הבא</button>`);
  wireTalk(w.q);
  $("#hear").onclick=()=>say(w.en);$("#slow").onclick=()=>say(w.en,{slow:true});
  $("#nx").onclick=next;say(en);
}

function speakStep(w,isAnswer){
  let tries=0;
  const pic=!isAnswer&&LS.pic&&!!w.e;
  const en=isAnswer?w.q:(pic?`Can you say ${w.en}?`:`Can you say this?`);
  const he=isAnswer?`ענו: ${w.he}`:(pic?`אתם יכולים להגיד ${w.en}? (${w.he})`:`אתם יכולים להגיד את זה? (${w.he})`);
  frame(talkHTML(en,he)+`
   <div class="card">${pic?`<div class="pic" aria-hidden="true">${w.e}</div>`:""}
   ${isAnswer?`<div class="who">התשובה שלכם</div>`:""}
   <div class="word ${pic?"":"phrase"}">${esc(w.en)}</div>${pic?"":`<div class="word-he">${esc(w.he)}</div>`}
   <button class="speak" id="hear" aria-label="להשמיע">🔊</button>
   <div class="row">${srBlocked?"":`<button class="mic" id="mic" aria-label="לחצו ודברו">🎤</button>`}</div>
   <div class="heard" id="heard">${srBlocked?"אמרו את זה בקול, ואז לחצו על הכפתור.":"לחצו על המיקרופון ודברו"}</div></div>
   <div class="row"><button class="btn ghost" id="said" ${srBlocked?"":"hidden"}>אמרתי את זה!</button><button class="link" id="skip" hidden>דלגו</button></div>`);
  wireTalk(en);say(en);
  $("#hear").onclick=()=>say(w.en);
  const ok=async()=>{LS.stars++;const[p,h]=praise();$("#heard").textContent=h;await say(p);next()};
  $("#said").onclick=ok;$("#skip").onclick=()=>{miss(w.en);next()};
  const mic=$("#mic");if(!mic)return;
  mic.onclick=async()=>{
    stopVoice();
    mic.classList.add("on");$("#heard").textContent="מקשיב...";
    try{
      const heard=await listenOnce();mic.classList.remove("on");
      if(matches(heard,w))return ok();
      tries++;
      $("#heard").textContent=heard.length?`שמעתי: "${heard[0]}". כמעט! נסו שוב.`:"לא שמעתי. נסו שוב, קצת יותר חזק.";
      await say(`Almost! Listen: ${w.en}. Try again!`);
      if(tries>=2)$("#skip").hidden=false;
      if(tries>=3)$("#said").hidden=false;
    }catch(err){
      mic.classList.remove("on");srBlocked=true;mic.remove();
      $("#heard").textContent="המיקרופון לא זמין כאן. אמרו את זה בקול, ואז לחצו על הכפתור.";
      $("#said").hidden=false;
    }
  };
}

function choose(w,pool,mode){
  const pic=!!w.e&&pool.every(x=>x.e);
  const key=pic?"e":"he";
  const others=pickN(pool.filter(x=>x.en!==w.en&&x[key]!==w[key]),3);
  const opts=shuffle([w,...others]);
  let first=true;
  const en=mode==="listen"?(pic?"Where is it? Listen!":"What does it mean? Listen!"):(pic?"Read and tap the picture.":"Read and tap the meaning.");
  const he=mode==="listen"?(pic?"איפה זה? תקשיבו!":"מה הפירוש? תקשיבו!"):(pic?"תקראו ולחצו על התמונה.":"תקראו ולחצו על הפירוש.");
  frame(talkHTML(en,he)+
   (mode==="listen"?`<div class="row"><button class="speak" id="hear" aria-label="להשמיע שוב">🔊</button><button class="speak slow" id="slow" aria-label="להשמיע לאט">🐢</button></div>`
    :`<div class="prompt-word ${pic?"":"phrase"}">${esc(w.en)}</div>`)+
   `<div class="grid ${pic?"":"one"}">${opts.map((o,i)=>`<button class="opt ${pic?"":"text"}" data-i="${i}" ${pic?`aria-label="אפשרות ${i+1}"`:""}>${pic?o.e:esc(o.he)}</button>`).join("")}</div>`);
  wireTalk(en);
  if(mode==="listen"){$("#hear").onclick=()=>say(w.en);$("#slow").onclick=()=>say(w.en,{slow:true});say(w.en)}
  app.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
    const o=opts[+b.dataset.i];
    if(o.en===w.en){
      b.classList.add("good");app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      if(first)LS.stars++;
      const[p]=praise();await say(mode==="read"?`${w.en}! ${p}`:p);next();
    }else{
      if(first)miss(w.en);first=false;b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");
      say(pic?(mode==="read"?`Oops! That is ${o.en}. Try again!`:`Oops! That is ${o.en}. Listen: ${w.en}.`):`Oops! Try again. ${w.en}`);
    }
  });
}

function chooseReply(w,pool){
  const opts=shuffle([w,...pickN(pool.filter(x=>x.en!==w.en),3)]);
  let first=true;
  frame(talkHTML(w.q,"תבחרו את התשובה המתאימה לשאלה")+
   `<div class="row"><button class="speak" id="hear" aria-label="להשמיע את השאלה שוב">🔊</button></div>
    <div class="grid one">${opts.map((o,i)=>`<button class="opt text en" data-i="${i}">${esc(o.en)}</button>`).join("")}</div>`);
  wireTalk(w.q);
  $("#hear").onclick=()=>say(w.q);say(w.q);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
    const o=opts[+b.dataset.i];
    if(o.en===w.en){
      b.classList.add("good");app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      if(first)LS.stars++;
      await say(w.en);next();
    }else{if(first)miss(w.en);first=false;b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");say("Hmm, try another answer.")}
  });
}

function build(w){
  const target=w.en.split(" ");
  const bank=shuffle(target.map((t,i)=>({t,i})));
  let picked=[],first=true;
  const en="Build the sentence.";
  frame(talkHTML(en,`בנו את המשפט: ${w.he}`)+`
   <div class="card" style="gap:6px"><div class="label">הפירוש</div><div class="word-he" style="font-size:20px;color:var(--ink)">${esc(w.he)}</div></div>
   <div class="slot" id="slot" aria-live="polite"></div>
   <div class="bank" id="bank">${bank.map((b,k)=>`<button class="tok" data-k="${k}">${esc(b.t)}</button>`).join("")}</div>
   <div class="row"><button class="btn ghost" id="clear">ניקוי</button><button class="btn" id="check" disabled>בדיקה</button></div>`);
  wireTalk(en);say(en);
  const draw=()=>{
    $("#slot").innerHTML=picked.map((k,j)=>`<button class="tok" data-j="${j}">${esc(bank[k].t)}</button>`).join("");
    app.querySelectorAll("#bank .tok").forEach(b=>b.classList.toggle("used",picked.includes(+b.dataset.k)));
    $("#slot").querySelectorAll(".tok").forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.j,1);$("#slot").className="slot";draw()});
    $("#check").disabled=picked.length!==bank.length;
  };
  app.querySelectorAll("#bank .tok").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!picked.includes(k)){picked.push(k);draw()}});
  $("#clear").onclick=()=>{picked=[];$("#slot").className="slot";draw()};
  $("#check").onclick=async()=>{
    const ans=picked.map(k=>bank[k].t).join(" ");
    if(ans===w.en){
      $("#slot").className="slot good";$("#check").disabled=true;
      if(first)LS.stars++;
      await say(`${w.en} ${praise()[0]}`);next();
    }else{
      if(first)miss(w.en);first=false;const s=$("#slot");s.className="slot";void s.offsetWidth;s.className="slot bad";
      say("Almost! Try again.");
    }
  };
  draw();
}

/* ---- Reading ---- */
function storyCard(R,open){
  return `<div class="card story"><div class="story-text">${esc(R[0])}</div>
   <div class="story-he" ${open?"":"hidden"}>${esc(R[1])}</div>
   <div class="row"><button class="speak" id="sHear" aria-label="להקריא את הטקסט">🔊</button><button class="speak slow" id="sSlow" aria-label="להקריא לאט">🐢</button><button class="mini" id="sHe">תרגום</button></div></div>`;
}
function wireStory(R){
  $("#sHear").onclick=()=>say(R[0]);$("#sSlow").onclick=()=>say(R[0],{slow:true});
  $("#sHe").onclick=()=>{const h=app.querySelector(".story-he");h.hidden=!h.hidden};
}
function story(R){
  const en="Read the text. You can also listen to it.";
  frame(talkHTML(en,"קראו את הטקסט. אפשר גם להקשיב לו. אחר כך יהיו שאלות.")+storyCard(R)+`<button class="btn wide" id="nx">לשאלות</button>`);
  wireTalk(en);wireStory(R);say(en);$("#nx").onclick=next;
}
function readQ(R,q){
  const opts=shuffle(q.slice(1).map((t,i)=>({t,ok:i===0})));
  let first=true;
  frame(talkHTML(q[0],"שאלה על הטקסט. אפשר לחזור ולקרוא אותו.")+storyCard(R)+
   `<div class="qtext">${esc(q[0])}</div><div class="grid one">${opts.map((o,i)=>`<button class="opt text en" data-i="${i}">${esc(cap(o.t))}</button>`).join("")}</div>`);
  wireTalk(q[0]);wireStory(R);say(q[0]);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
    const o=opts[+b.dataset.i];
    if(o.ok){b.classList.add("good");app.querySelectorAll(".opt").forEach(x=>x.disabled=true);if(first)LS.stars++;else miss(q[0]);await say(praise()[0]);next()}
    else{if(first)miss(q[0]);first=false;b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");say("Not quite. Read again and try.")}
  });
}

/* ---- Writing ---- */
function spell(w){
  const word=w.en.toLowerCase(),letters=[...word];
  const extra=pickN([..."abcdefghijklmnopqrstuvwxyz"].filter(c=>!letters.includes(c)),2);
  const bank=shuffle(letters.concat(extra).map((t,i)=>({t,i})));
  let picked=[],first=true;
  const en=`Spell the word.`;
  frame(talkHTML(en,`אייתו באנגלית: ${w.he}`)+`
   <div class="card" style="gap:6px"><div class="pic" aria-hidden="true">${w.e}</div><div class="word-he">${esc(w.he)}</div>
   <button class="speak" id="hear" aria-label="להשמיע">🔊</button></div>
   <div class="slot spell" id="slot" aria-live="polite"></div>
   <div class="bank" id="bank">${bank.map((b,k)=>`<button class="tok letter" data-k="${k}">${esc(b.t)}</button>`).join("")}</div>
   <div class="row"><button class="btn ghost" id="clear">ניקוי</button><button class="btn" id="check" disabled>בדיקה</button><button class="link" id="skip" hidden>הראו לי את התשובה</button></div>`);
  wireTalk(en);say(w.en);$("#hear").onclick=()=>say(w.en);
  const draw=()=>{
    $("#slot").innerHTML=letters.map((_,j)=>picked[j]!=null?`<button class="tok letter" data-j="${j}">${esc(bank[picked[j]].t)}</button>`:`<span class="blank"></span>`).join("");
    app.querySelectorAll("#bank .tok").forEach(b=>b.classList.toggle("used",picked.includes(+b.dataset.k)));
    $("#slot").querySelectorAll(".tok").forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.j,1);$("#slot").className="slot spell";draw()});
    $("#check").disabled=picked.length!==letters.length;
  };
  app.querySelectorAll("#bank .tok").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(!picked.includes(k)&&picked.length<letters.length){picked.push(k);draw()}});
  $("#clear").onclick=()=>{picked=[];$("#slot").className="slot spell";draw()};
  $("#skip").onclick=async()=>{$("#slot").innerHTML=letters.map(l=>`<span class="tok letter">${esc(l)}</span>`).join("");await say(`${w.en}. ${[...w.en].join(", ")}.`);next()};
  $("#check").onclick=async()=>{
    if(picked.map(k=>bank[k].t).join("")===word){$("#slot").className="slot spell good";$("#check").disabled=true;if(first)LS.stars++;await say(`${w.en}! ${praise()[0]}`);next()}
    else{if(first)miss(w.en);first=false;$("#skip").hidden=false;const s=$("#slot");s.className="slot spell";void s.offsetWidth;s.className="slot spell bad";say("Almost! Try again.")}
  };
  draw();
}
function typeStep(w,dialog){
  let tries=0,hint=0;const words=w.en.split(" ");
  const en=dialog?w.q:"Write it in English.";
  frame(talkHTML(en,dialog?`כתבו את התשובה באנגלית: ${w.he}`:`כתבו באנגלית: ${w.he}`)+`
   <div class="card" style="gap:8px">${dialog?`<div class="who">${esc(char().name)} שואל/ת</div><div class="word phrase">${esc(w.q)}</div><div class="who" style="margin-top:6px">כתבו באנגלית</div>`:`<div class="who">כתבו באנגלית</div>`}
   <div class="word-he" style="font-size:20px;color:var(--ink)">${esc(w.he)}</div></div>
   <div class="field"><label for="typed" class="label">התשובה שלכם</label>
   <input id="typed" dir="ltr" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type in English..."></div>
   <div class="heard" id="fb"></div>
   <div class="row"><button class="btn ghost" id="hint">רמז</button><button class="btn" id="check">בדיקה</button><button class="link" id="skip" hidden>הראו לי את התשובה</button></div>`);
  wireTalk(en);if(dialog)say(w.q);
  const inp=$("#typed");
  $("#hint").onclick=()=>{hint=Math.min(words.length,hint+1);inp.value=words.slice(0,hint).join(" ")+(hint<words.length?" ":"");inp.focus()};
  $("#skip").onclick=async()=>{inp.value=w.en;$("#fb").textContent="זו התשובה. נסו לזכור אותה!";await say(w.en);next()};
  const check=async()=>{
    const a=norm(inp.value).join(" "),b=norm(w.en).join(" ");
    if(!a)return;
    if(a===b||(b.length>8&&lev(a,b)<=1)){
      inp.classList.add("good");$("#check").disabled=true;
      if(tries===0&&hint===0)LS.stars++;else miss(w.en);
      $("#fb").textContent=a===b?"מצוין!":`כמעט מושלם. הכתיב הנכון: ${w.en}`;
      await say(`${w.en}. ${praise()[0]}`);next();
    }else{
      tries++;inp.classList.remove("bad");void inp.offsetWidth;inp.classList.add("bad");
      const ok=norm(inp.value).filter((t,i)=>norm(w.en)[i]===t).length;
      $("#fb").textContent=`${ok} מתוך ${norm(w.en).length} מילים נכונות. נסו שוב או לחצו על "רמז".`;
      if(tries>=2)$("#skip").hidden=false;
    }
  };
  $("#check").onclick=check;inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
}
function miss(x){LS.missed=LS.missed||[];if(!LS.missed.includes(x))LS.missed.push(x)}

/* ---- Finish, score, extra practice ---- */
const PASS=70;
function finish(){
  if(LS.test)return testFinish();
  const C=course();
  const max=LS.steps.filter(s=>["say","answer","listen","read","reply","build","spell","type","rq"].includes(s.t)).length;
  const score=Math.round(Math.min(1,LS.stars/max)*100);
  const passed=score>=PASS;
  (S.scores[C.id]=S.scores[C.id]||[]).push({d:dayStr(),u:LS.idx,s:score});
  if(S.scores[C.id].length>60)S.scores[C.id].shift();
  if(passed&&!LS.isRepeat&&!doneToday()&&LS.idx===doneIn(C)%C.units.length){
    S.streak=S.lastDate===yesterday()?S.streak+1:1;
    S.lastDate=dayStr();S.prog[C.id]=doneIn(C)+1;
  }
  S.stars+=LS.stars;save();
  const n=score>=85?3:score>=PASS?2:1;
  const cnt=LS.L.items.length;
  let en,he;
  if(!passed){en=`Good try, ${nm()}! Let's practice this lesson again. You can do it!`;he=`ניסיון יפה, ${nm()}! בואו נתרגל את השיעור הזה שוב. אתם יכולים!`}
  else if(LS.L.dialog){en=`You did it, ${nm()}! Great conversation. See you tomorrow!`;he=`הצלחתם, ${nm()}! שיחה מעולה. נתראה מחר!`}
  else{en=`You did it, ${nm()}! You learned ${cnt} new ${LS.pic?"words":"phrases"}. See you tomorrow!`;he=`הצלחתם, ${nm()}! למדתם ${cnt} ${LS.pic?"מילים חדשות":"משפטים חדשים"}. נתראה מחר!`}
  const missed=(LS.missed||[]).slice(0,6);
  app.innerHTML=talkHTML(en,he)+`
   <div class="hero center"><div class="stars" aria-label="${n} כוכבים">${"⭐".repeat(n)}${"☆".repeat(3-n)}</div>
   <div class="score ${passed?"":"low"}"><b>${score}</b><span>${gradeHe(score)}</span></div>
   ${passed?`<p>🔥 ${S.streak} ${S.streak===1?"יום":"ימים"} ברצף</p>`:`<p><b>הציון נמוך מ-${PASS}, ולכן צריך לתרגל את השיעור שוב לפני שעוברים לנושא הבא.</b></p>`}
   ${missed.length?`<div class="missed"><div class="label">כדאי לחזור על</div>${missed.map(m=>`<span class="en">${esc(m)}</span>`).join("")}</div>`:""}</div>
   ${passed?`<button class="btn wide" id="home">חזרה למסך הבית</button>`:`<button class="btn wide" id="again">תרגול חוזר עכשיו</button><button class="link" id="home">אתרגל מאוחר יותר</button>`}`;
  wireTalk(en);say(en);$("#home").onclick=home;
  if($("#again"))$("#again").onclick=()=>startLesson(LS.idx,LS.isRepeat);
  if(passed&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    const c=document.createElement("div");c.className="confetti";
    const cols=["#FFC83D","#2FB57C","#E8506A","#2D7FD3"];
    for(let i=0;i<40;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=cols[i%4];p.style.animationDelay=Math.random()*.8+"s";c.appendChild(p)}
    document.body.appendChild(c);setTimeout(()=>c.remove(),3500);
  }
}

render();
</script>
