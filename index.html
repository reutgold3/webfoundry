 than good.\n\nConsider what it actually means to hold an opinion. Ideally, an opinion is a conclusion drawn from the best evidence available at the time. When new evidence emerges, a thoughtful person should be willing to revise that conclusion. Refusing to do so is not strength of character; it is closer to intellectual stubbornness dressed up as principle.\n\nOf course, there is a difference between updating a view and blowing with the wind. Someone who changes their mind every time a louder voice enters the room is hardly a model of rational thinking. The point is not to abandon convictions lightly, but to hold them with a degree of humility, accepting that we might, on reflection, have got things wrong.\n\nRarely do we hear anyone in public life say, 'I've looked at the evidence again, and I was mistaken.' Yet those words are arguably among the most courageous anyone can utter. They signal that the speaker values truth over ego, and they give others permission to do the same.\n\nSo the next time someone admits they have changed their mind, perhaps we should resist the urge to pounce. Instead of asking why they were wrong before, we might ask what persuaded them. The answer could well be worth hearing.","he":"להגנת שינוי הדעה\n\nאנחנו נוטים להעריץ אנשים שדבקים בעמדתם. פוליטיקאים שמשנים עמדה מכונים הפכפכים; חברים שנוטשים השקפה ותיקה סופגים הקנטות על כך ש'התרככו'. נראה שעקביות נחשבת למעלה בפני עצמה. אני הייתי טוען/ת שהאינסטינקט הזה, מובן ככל שיהיה, גורם לנו יותר נזק מתועלת.\n\nחשבו מה זה בעצם אומר להחזיק בדעה. באופן אידיאלי, דעה היא מסקנה שנגזרת מהראיות הטובות ביותר שזמינות באותו רגע. כשמופיעות ראיות חדשות, אדם שקול צריך להיות מוכן לעדכן את המסקנה. סירוב לעשות זאת אינו חוזק אופי; הוא קרוב יותר לעקשנות אינטלקטואלית שמתחפשת לעיקרון.\n\nכמובן, יש הבדל בין עדכון השקפה לבין נטייה עם כל רוח. מי שמשנה את דעתו בכל פעם שקול רם יותר נכנס לחדר אינו בדיוק מופת לחשיבה רציונלית. המטרה איננה לוותר על אמונות בקלות, אלא להחזיק בהן במידה של ענווה, מתוך הכרה בכך שאולי, במחשבה שנייה, טעינו.\n\nרק לעיתים רחוקות אנחנו שומעים מישהו בחיים הציבוריים אומר: 'בחנתי שוב את הראיות, וטעיתי.' ובכל זאת, אלה אולי מהמילים האמיצות ביותר שאדם יכול לומר. הן מאותתות שהדובר מעריך את האמת יותר מהאגו שלו, והן נותנות לאחרים רשות לעשות אותו דבר.\n\nאז בפעם הבאה שמישהו מודה ששינה את דעתו, אולי כדאי שנתאפק ולא נתנפל עליו. במקום לשאול למה טעה קודם, נוכל לשאול מה שכנע אותו. ייתכן מאוד שהתשובה שווה הקשבה.","ru":"В защиту права передумать\n\nМы склонны восхищаться людьми, которые стоят на своём. Политиков, меняющих позицию, клеймят флюгерами; друзей, отказавшихся от давних убеждений, дразнят за то, что они «размякли». Похоже, последовательность считается добродетелью сама по себе. Я бы сказал, что этот инстинкт, каким бы понятным он ни был, приносит нам больше вреда, чем пользы.\n\nЗадумайтесь, что на самом деле значит иметь мнение. В идеале мнение — это вывод, сделанный на основе лучших доступных на тот момент данных. Когда появляются новые данные, вдумчивый человек должен быть готов пересмотреть свой вывод. Отказ от этого — не сила характера; это скорее интеллектуальное упрямство, выдаваемое за принципиальность.\n\nКонечно, есть разница между тем, чтобы обновить взгляды, и тем, чтобы держать нос по ветру. Тот, кто меняет мнение всякий раз, когда в комнату входит кто-то погромче, вряд ли образец рационального мышления. Суть не в том, чтобы легко отказываться от убеждений, а в том, чтобы придерживаться их с определённой долей скромности, допуская, что, поразмыслив, мы можем оказаться неправы.\n\nРедко мы слышим, чтобы публичный человек сказал: «Я снова изучил факты и понял, что ошибался». Между тем эти слова, пожалуй, одни из самых смелых, какие только можно произнести. Они показывают, что говорящий ценит истину выше собственного самолюбия, и дают другим разрешение поступать так же.\n\nПоэтому в следующий раз, когда кто-то признается, что передумал, возможно, стоит удержаться от желания наброситься на него. Вместо того чтобы спрашивать, почему он ошибался раньше, можно спросить, что его убедило. Ответ вполне может оказаться стоящим.","ar":"دفاعًا عن تغيير الرأي\n\nنميل إلى الإعجاب بالأشخاص الذين يتمسّكون بمواقفهم. يُوصَف السياسيون الذين يتراجعون عن موقف ما بالمتقلّبين، ويُسخَر من الأصدقاء الذين يتخلّون عن رأي قديم بأنهم «لانوا». يبدو أن الثبات يُعامَل كفضيلة قائمة بذاتها. وأنا أرى أن هذه الغريزة، مهما كانت مفهومة، تضرّنا أكثر مما تنفعنا.\n\nفكّر في ما يعنيه فعلًا أن تتبنّى رأيًا. في الوضع المثالي، الرأي هو استنتاج مبني على أفضل الأدلة المتاحة في وقتها. وعندما تظهر أدلة جديدة، ينبغي للشخص المتبصّر أن يكون مستعدًا لمراجعة استنتاجه. أما رفض ذلك فليس قوة شخصية، بل هو أقرب إلى عناد فكري متنكّر في زيّ المبدأ.\n\nبالطبع، هناك فرق بين تحديث الرأي والميل مع كل ريح. فمن يغيّر رأيه كلما دخل الغرفة صوت أعلى ليس نموذجًا للتفكير العقلاني. المقصود ليس التخلّي عن القناعات بسهولة، بل التمسك بها بقدر من التواضع، مع تقبّل احتمال أننا ربما أخطأنا عند التأمل.\n\nنادرًا ما نسمع أحدًا في الحياة العامة يقول: «راجعت الأدلة مجددًا، وكنت مخطئًا». ومع ذلك، قد تكون هذه الكلمات من أشجع ما يمكن أن يقوله المرء، فهي تدل على أن المتحدث يقدّر الحقيقة أكثر من غروره، وتمنح الآخرين الإذن بأن يفعلوا الشيء نفسه.\n\nلذا، في المرة القادمة التي يعترف فيها أحدهم بأنه غيّر رأيه، ربما علينا أن نقاوم الرغبة في الانقضاض عليه. وبدلًا من أن نسأله لماذا كان مخطئًا من قبل، يمكننا أن نسأله ما الذي أقنعه. فقد تكون الإجابة جديرة بالاستماع.","questions":[["Which kind of person would the writer most likely criticise?","Someone who changes opinions just to follow the loudest voice.","Someone who revises a view after studying new evidence.","Someone who admits a past mistake in public.","Someone who asks others what persuaded them."],["What is the writer's overall attitude toward consistency of opinion?","Sceptical of valuing it above openness to evidence.","Strongly in favour of it in every situation.","Indifferent; the writer barely mentions it.","Convinced it is the most important virtue of all."],["What does 'stick to their guns' mean in the first paragraph?","Refuse to change their position.","Become aggressive during arguments.","Support stricter weapons laws.","Change their opinions very often."]]}},{"en":"technology and society","he":"טכנולוגיה וחברה","ru":"технологии и общество","ar":"التكنولوجيا والمجتمع","e":"📱","items":[{"en":"Had I known how addictive the app was, I'd never have downloaded it.","he":"אילו ידעתי כמה האפליקציה ממכרת, לעולם לא הייתי מוריד/ה אותה.","ru":"Знай я, насколько затягивает это приложение, я бы никогда его не скачал.","ar":"لو كنت أعلم كم هو التطبيق مُسبّب للإدمان، لما قمت بتنزيله أبدًا.","e":"","alt":[]},{"en":"Smartphones have blurred the line between work time and personal time for many people.","he":"הסמארטפונים טשטשו אצל אנשים רבים את הגבול בין זמן העבודה לזמן הפרטי.","ru":"Смартфоны стёрли для многих людей границу между рабочим и личным временем.","ar":"طمست الهواتف الذكية لدى كثيرين الحدّ الفاصل بين وقت العمل والوقت الشخصي.","e":"","alt":[]},{"en":"It is widely believed that algorithms shape our opinions more than we realise.","he":"מקובל להאמין שאלגוריתמים מעצבים את הדעות שלנו יותר ממה שאנחנו מבינים.","ru":"Широко распространено мнение, что алгоритмы влияют на наши взгляды сильнее, чем мы осознаём.","ar":"يُعتقد على نطاق واسع أن الخوارزميات تشكّل آراءنا أكثر مما ندرك.","e":"","alt":[]},{"en":"Critics argue that constant connectivity is eroding our ability to concentrate deeply.","he":"המבקרים טוענים שהחיבור הקבוע לרשת שוחק את היכולת שלנו להתרכז לעומק.","ru":"Критики утверждают, что постоянное подключение к сети подрывает нашу способность глубоко сосредотачиваться.","ar":"يرى المنتقدون أن الاتصال الدائم بالإنترنت يُضعف قدرتنا على التركيز العميق.","e":"","alt":[]},{"en":"Online privacy is something most people take for granted until it's too late.","he":"פרטיות ברשת היא משהו שרוב האנשים לוקחים כמובן מאליו עד שכבר מאוחר מדי.","ru":"Большинство людей воспринимают конфиденциальность в интернете как должное, пока не становится слишком поздно.","ar":"الخصوصية على الإنترنت أمر يعتبره معظم الناس مسلّمًا به حتى فوات الأوان.","e":"","alt":[]},{"en":"The new regulations are a step in the right direction, but they don't go far enough.","he":"התקנות החדשות הן צעד בכיוון הנכון, אבל הן לא מרחיקות לכת מספיק.","ru":"Новые правила — шаг в правильном направлении, но их недостаточно.","ar":"اللوائح الجديدة خطوة في الاتجاه الصحيح، لكنها لا تذهب بعيدًا بما يكفي.","e":"","alt":[]}],"reading":{"en":"The Myth of the Neutral Screen\n\nEvery few months, another study claims that social media is either destroying a generation or, alternatively, doing no harm whatsoever. The headlines swing back and forth like a pendulum, and the public, understandably, is left scratching its head. I suspect the truth lies somewhere less dramatic and more uncomfortable.\n\nTechnology is often described as a neutral tool, like a hammer that can build a house or break a window. It is a comforting metaphor, but it does not hold water. A hammer does not send you notifications at midnight. It has not been designed by teams of engineers whose bonuses depend on how many hours you spend holding it. The platforms on our phones are not passive objects waiting to be used; they are carefully engineered to keep us coming back.\n\nThis is not to say we should smash our devices and retreat to the countryside. The same tools that fuel endless scrolling also connect isolated people, spread vital information in emergencies, and allow small businesses in Be'er Sheva to reach customers in Berlin. Dismissing all of that would be throwing the baby out with the bathwater.\n\nWhat we need instead is a more grown-up conversation. Rather than asking whether technology is good or bad, we should be asking who designs it, whose interests it serves, and what rules should govern it. Only when we stop pretending the screen is neutral will we be able to make genuinely informed choices about the role it plays in our lives.\n\nUntil then, the pendulum will keep swinging, and we will keep scratching our heads.","he":"המיתוס של המסך הנייטרלי\n\nכל כמה חודשים מתפרסם מחקר נוסף שטוען שהרשתות החברתיות הורסות דור שלם, או לחלופין, לא גורמות שום נזק. הכותרות נעות הלוך ושוב כמו מטוטלת, והציבור, באופן מובן, נשאר מגרד בראשו. אני חושד/ת שהאמת נמצאת במקום פחות דרמטי ויותר לא נוח.\n\nטכנולוגיה מתוארת לעיתים קרובות ככלי נייטרלי, כמו פטיש שיכול לבנות בית או לשבור חלון. זו מטאפורה מנחמת, אבל היא לא מחזיקה מים. פטיש לא שולח לך התראות בחצות. הוא לא תוכנן על ידי צוותי מהנדסים שהבונוסים שלהם תלויים במספר השעות שאת/ה מחזיק/ה אותו. הפלטפורמות בטלפונים שלנו אינן חפצים פסיביים שמחכים שישתמשו בהם; הן מהונדסות בקפידה כדי שנמשיך לחזור אליהן.\n\nאין זה אומר שעלינו לנפץ את המכשירים ולברוח לכפר. אותם כלים שמזינים את הגלילה האינסופית גם מחברים אנשים בודדים, מפיצים מידע חיוני בשעת חירום, ומאפשרים לעסקים קטנים בבאר שבע להגיע ללקוחות בברלין. לפסול את כל זה יהיה כמו לשפוך את התינוק עם מי האמבט.\n\nמה שאנחנו צריכים במקום זה הוא שיחה בוגרת יותר. במקום לשאול אם טכנולוגיה טובה או רעה, עלינו לשאול מי מעצב אותה, את האינטרסים של מי היא משרתת, ואילו כללים צריכים להסדיר אותה. רק כשנפסיק להעמיד פנים שהמסך נייטרלי, נוכל לקבל החלטות מושכלות באמת לגבי התפקיד שהוא ממלא בחיינו.\n\nעד אז, המטוטלת תמשיך לנוע, ואנחנו נמשיך לגרד בראש.","ru":"Миф о нейтральном экране\n\nКаждые несколько месяцев выходит очередное исследование, утверждающее, что социальные сети либо губят целое поколение, либо, наоборот, не причиняют никакого вреда. Заголовки раскачиваются туда-сюда, как маятник, и публика, что вполне понятно, остаётся в недоумении. Подозреваю, что истина находится где-то в менее драматичном и более неудобном месте.\n\nТехнологию часто описывают как нейтральный инструмент — вроде молотка, которым можно построить дом или разбить окно. Это утешительная метафора, но она не выдерживает критики. Молоток не присылает вам уведомлений в полночь. Его не разрабатывали команды инженеров, чьи премии зависят от того, сколько часов вы держите его в руках. Платформы в наших телефонах — не пассивные предметы, ожидающие, когда ими воспользуются; они тщательно спроектированы так, чтобы мы возвращались к ним снова и снова.\n\nЭто не значит, что нужно разбить свои устройства и уехать в деревню. Те же инструменты, что подпитывают бесконечную прокрутку ленты, также объединяют одиноких людей, распространяют жизненно важную информацию в чрезвычайных ситуациях и позволяют малому бизнесу из Беэр-Шевы находить клиентов в Берлине. Отвергнуть всё это означало бы выплеснуть ребёнка вместе с водой.\n\nВместо этого нам нужен более зрелый разговор. Вместо того чтобы спрашивать, хороша технология или плоха, нам следует спрашивать, кто её создаёт, чьим интересам она служит и какие правила должны её регулировать. Лишь когда мы перестанем притворяться, что экран нейтрален, мы сможем делать по-настоящему осознанный выбор относительно той роли, которую он играет в нашей жизни.\n\nА до тех пор маятник будет раскачиваться, а мы будем продолжать недоумевать.","ar":"أسطورة الشاشة المحايدة\n\nكل بضعة أشهر، تصدر دراسة جديدة تزعم أن وسائل التواصل الاجتماعي إمّا تدمّر جيلًا كاملًا، وإمّا لا تُحدث أي ضرر على الإطلاق. تتأرجح العناوين ذهابًا وإيابًا كالبندول، ويبقى الجمهور، وهذا مفهوم، في حيرة من أمره. أظن أن الحقيقة تكمن في مكان أقل دراماتيكية وأكثر إزعاجًا.\n\nكثيرًا ما توصف التكنولوجيا بأنها أداة محايدة، كالمطرقة التي يمكن أن تبني بيتًا أو تكسر نافذة. إنه تشبيه مريح، لكنه لا يصمد أمام التمحيص. فالمطرقة لا ترسل إليك إشعارات في منتصف الليل، ولم يصمّمها فريق من المهندسين تعتمد مكافآتهم على عدد الساعات التي تقضيها ممسكًا بها. المنصات على هواتفنا ليست أدوات سلبية تنتظر أن نستخدمها، بل هي مصمّمة بعناية لتجعلنا نعود إليها مرارًا.\n\nهذا لا يعني أن علينا تحطيم أجهزتنا واللجوء إلى الريف. فالأدوات نفسها التي تغذّي التصفح اللامتناهي تربط أيضًا بين الأشخاص المعزولين، وتنشر معلومات حيوية في حالات الطوارئ، وتتيح للشركات الصغيرة في بئر السبع الوصول إلى زبائن في برلين. ورفض كل ذلك سيكون بمثابة رمي الطفل مع ماء الاستحمام.\n\nما نحتاجه بدلًا من ذلك هو حوار أكثر نضجًا. فبدلًا من أن نسأل هل التكنولوجيا جيدة أم سيئة، علينا أن نسأل من يصمّمها، ومصالح من تخدم، وما القواعد التي يجب أن تحكمها. ولن نتمكن من اتخاذ قرارات مستنيرة حقًا بشأن الدور الذي تؤديه في حياتنا إلا عندما نكفّ عن التظاهر بأن الشاشة محايدة.\n\nوحتى ذلك الحين، سيواصل البندول تأرجحه، وسنواصل نحن حيرتنا.","questions":[["Why does the writer point out that a hammer does not send notifications?","To show that apps are designed to influence our behaviour.","To argue that hammers are more useful than phones.","To suggest apps should send fewer notifications at night.","To prove that technology is completely neutral."],["Which best describes the writer's position on technology?","Balanced, but critical of the idea that it is neutral.","Completely opposed to all modern technology.","Entirely optimistic about social media.","Uninterested in how technology is regulated."],["What does 'it does not hold water' mean in the text?","It is not convincing or logical.","It is not waterproof.","It is too complicated to understand.","It is not widely known."]]}},{"en":"psychology and behaviour","he":"פסיכולוגיה והתנהגות","ru":"психология и поведение","ar":"علم النفس والسلوك","e":"🧠","items":[{"en":"People tend to overestimate how much others notice their mistakes in public.","he":"אנשים נוטים להעריך יתר על המידה עד כמה אחרים שמים לב לטעויות שלהם בציבור.","ru":"Люди склонны переоценивать, насколько окружающие замечают их ошибки на публике.","ar":"يميل الناس إلى المبالغة في تقدير مدى ملاحظة الآخرين لأخطائهم أمام العلن.","e":"","alt":[]},{"en":"He's quick to criticise others, yet he can't take criticism himself.","he":"הוא ממהר לבקר אחרים, אבל הוא עצמו לא מסוגל לקבל ביקורת.","ru":"Он быстро критикует других, но сам критику воспринимать не умеет.","ar":"إنه سريع في انتقاد الآخرين، لكنه لا يتقبّل النقد بنفسه.","e":"","alt":[]},{"en":"Procrastination is often less about laziness and more about fear of failure.","he":"דחיינות קשורה לעיתים קרובות פחות לעצלות ויותר לפחד מכישלון.","ru":"Прокрастинация часто связана не столько с ленью, сколько со страхом неудачи.","ar":"غالبًا ما يرتبط التسويف بالخوف من الفشل أكثر من ارتباطه بالكسل.","e":"","alt":[]},{"en":"If I'd slept better last night, I wouldn't be so irritable right now.","he":"אילו ישנתי טוב יותר אתמול בלילה, לא הייתי עצבני/ת כל כך עכשיו.","ru":"Если бы я лучше выспался прошлой ночью, я бы сейчас не был таким раздражительным.","ar":"لو نمت جيدًا الليلة الماضية، لما كنت سريع الانفعال هكذا الآن.","e":"","alt":[]},{"en":"She tends to bottle up her feelings until she eventually snaps over something small.","he":"היא נוטה להדחיק את הרגשות שלה עד שבסוף היא מתפוצצת בגלל משהו קטן.","ru":"Она склонна держать чувства в себе, пока в конце концов не сорвётся из-за мелочи.","ar":"تميل إلى كبت مشاعرها إلى أن تنفجر في النهاية بسبب أمر بسيط.","e":"","alt":[]},{"en":"We're far more likely to stick to a habit when we track our progress.","he":"יש סיכוי גבוה בהרבה שנתמיד בהרגל כשאנחנו עוקבים אחרי ההתקדמות שלנו.","ru":"Мы с гораздо большей вероятностью сохраним привычку, если будем отслеживать свой прогресс.","ar":"نكون أكثر قابلية بكثير للالتزام بعادة ما عندما نتابع تقدّمنا.","e":"","alt":[]}],"reading":{"en":"The Spotlight We Imagine\n\nPicture this: you walk into a crowded café in Jerusalem, trip over a chair leg, and spill coffee down your shirt. Your cheeks burn. For the rest of the afternoon, you replay the moment, convinced that everyone in the room witnessed your humiliation. According to psychologists, you have just fallen victim to what is known as the spotlight effect.\n\nThe term describes our tendency to overestimate how much other people notice our appearance and behaviour. In one well-known experiment, students were asked to wear a T-shirt with an embarrassing image and walk into a room full of peers. Afterwards, the wearers guessed that roughly half the room had noticed. In reality, fewer than a quarter had.\n\nWhy are we so prone to this illusion? Part of the answer is simple: we are the centre of our own experience. We are acutely aware of every stumble and stray hair, and we find it hard to imagine that others are not equally focused on them. What we forget is that everyone else is busy starring in their own film, preoccupied with their own worries.\n\nRecognising the spotlight effect can be surprisingly liberating. Many people hold back from speaking up in meetings, trying a new hobby, or dancing at a wedding because they fear being judged. Yet the audience they dread is, for the most part, a figment of their imagination.\n\nNone of this means that nobody ever notices anything. But the next time you feel all eyes are on you, it is worth remembering that most of those eyes are, in fact, looking elsewhere.","he":"הזרקור שאנחנו מדמיינים\n\nתארו לעצמכם: אתם נכנסים לבית קפה הומה בירושלים, נתקלים ברגל של כיסא ושופכים קפה על החולצה. הלחיים שלכם בוערות. בשארית אחר הצהריים אתם משחזרים את הרגע שוב ושוב, משוכנעים שכל מי שהיה בחדר ראה את ההשפלה שלכם. לפי פסיכולוגים, נפלתם זה עתה קורבן למה שמכונה 'אפקט הזרקור'.\n\nהמונח מתאר את הנטייה שלנו להעריך יתר על המידה עד כמה אנשים אחרים שמים לב למראה ולהתנהגות שלנו. בניסוי מוכר אחד, סטודנטים התבקשו ללבוש חולצת טי עם תמונה מביכה ולהיכנס לחדר מלא בעמיתים. לאחר מכן, הלובשים העריכו שבערך חצי מהחדר שם לב. במציאות, פחות מרבע שמו לב.\n\nלמה אנחנו כל כך מועדים לאשליה הזו? חלק מהתשובה פשוט: אנחנו במרכז החוויה של עצמנו. אנחנו מודעים מאוד לכל מעידה ולכל שערה סוררת, וקשה לנו לדמיין שאחרים אינם ממוקדים בהן באותה מידה. מה שאנחנו שוכחים הוא שכל האחרים עסוקים בכיכוב בסרט שלהם, טרודים בדאגות שלהם.\n\nההכרה באפקט הזרקור יכולה להיות משחררת באופן מפתיע. אנשים רבים נמנעים מלהתבטא בישיבות, לנסות תחביב חדש או לרקוד בחתונה כי הם חוששים שישפטו אותם. ובכל זאת, הקהל שממנו הם חוששים הוא, ברובו, פרי דמיונם.\n\nאין זה אומר שאף אחד אף פעם לא שם לב לשום דבר. אבל בפעם הבאה שתרגישו שכל העיניים נשואות אליכם, כדאי לזכור שרוב העיניים האלה, למעשה, מסתכלות למקום אחר.","ru":"Прожектор, который мы себе воображаем\n\nПредставьте: вы входите в переполненное кафе в Иерусалиме, спотыкаетесь о ножку стула и проливаете кофе на рубашку. Щёки горят. Весь остаток дня вы прокручиваете этот момент в голове, уверенные, что все в зале стали свидетелями вашего позора. По словам психологов, вы только что стали жертвой так называемого эффекта прожектора.\n\nЭтот термин описывает нашу склонность переоценивать, насколько другие люди замечают нашу внешность и поведение. В одном известном эксперименте студентов попросили надеть футболку с неловким изображением и войти в комнату, полную сверстников. Потом те, кто был в футболке, предположили, что это заметила примерно половина присутствующих. На самом деле заметили меньше четверти.\n\nПочему мы так подвержены этой иллюзии? Отчасти ответ прост: мы — центр собственного опыта. Мы остро осознаём каждую оплошность и каждый выбившийся волосок, и нам трудно представить, что другие не сосредоточены на них так же. Мы забываем, что все остальные заняты главной ролью в своём собственном фильме и поглощены своими заботами.\n\nОсознание эффекта прожектора может удивительным образом освобождать. Многие люди не решаются высказаться на совещании, попробовать новое хобби или потанцевать на свадьбе, потому что боятся осуждения. Однако публика, которой они так страшатся, по большей части существует лишь в их воображении.\n\nЭто не значит, что никто никогда ничего не замечает. Но в следующий раз, когда вам покажется, что все взгляды прикованы к вам, стоит вспомнить, что большинство этих взглядов на самом деле устремлены в другую сторону.","ar":"الضوء الذي نتخيّله\n\nتخيّل هذا: تدخل مقهى مزدحمًا في القدس، فتتعثّر بساق كرسي وتسكب القهوة على قميصك. تحمرّ وجنتاك خجلًا. وطوال ما تبقّى من فترة بعد الظهر، تعيد استرجاع اللحظة مقتنعًا بأن كل من في المكان شهد إحراجك. وفقًا لعلماء النفس، لقد وقعت للتوّ ضحية لما يُعرف بـ«تأثير الضوء المسلّط».\n\nيصف هذا المصطلح ميلنا إلى المبالغة في تقدير مدى ملاحظة الآخرين لمظهرنا وسلوكنا. في تجربة معروفة، طُلب من طلاب ارتداء قميص عليه صورة محرجة ودخول غرفة مليئة بزملائهم. بعد ذلك، قدّر من ارتدوا القميص أن نحو نصف الحاضرين لاحظوه، بينما في الواقع لاحظه أقل من الربع.\n\nلماذا نحن عرضة لهذا الوهم إلى هذا الحد؟ جزء من الإجابة بسيط: نحن مركز تجربتنا الخاصة. ندرك بحدّة كل تعثّر وكل شعرة شاردة، ويصعب علينا أن نتخيّل أن الآخرين لا يركّزون عليها بالقدر نفسه. وما ننساه هو أن كل شخص آخر منشغل بأداء دور البطولة في فيلمه الخاص، غارق في همومه.\n\nإن إدراك تأثير الضوء المسلّط قد يكون محرّرًا بشكل مفاجئ. فكثير من الناس يمتنعون عن التحدث في الاجتماعات، أو تجربة هواية جديدة، أو الرقص في حفل زفاف خوفًا من أن يُحكم عليهم. غير أن الجمهور الذي يخشونه هو، في معظمه، من نسج خيالهم.\n\nلا يعني هذا أن أحدًا لا يلاحظ شيئًا أبدًا. لكن في المرة القادمة التي تشعر فيها بأن كل العيون مسلّطة عليك، تذكّر أن معظم تلك العيون تنظر في الحقيقة إلى مكان آخر.","questions":[["What can be inferred about the students who noticed the T-shirt?","They were far fewer than the wearers expected.","They laughed openly at the wearers.","They made up more than half of the room.","They had been told about the experiment beforehand."],["What is the writer's attitude toward the spotlight effect?","Reassuring; understanding it can free people from fear.","Alarmed; it is a serious mental disorder.","Dismissive; it is not a real phenomenon.","Mocking toward people who get embarrassed."],["What does 'a figment of their imagination' mean?","Something that exists only in their minds.","A small part of a real audience.","A creative idea worth developing.","A clear memory of a past event."]]}},{"en":"environment and the future","he":"סביבה ועתיד","ru":"экология и будущее","ar":"البيئة والمستقبل","e":"🌍","items":[{"en":"Unless we act now, rising temperatures will hit the poorest communities the hardest.","he":"אם לא נפעל עכשיו, עליית הטמפרטורות תפגע הכי קשה בקהילות העניות ביותר.","ru":"Если мы не начнём действовать сейчас, рост температур сильнее всего ударит по беднейшим сообществам.","ar":"ما لم نتحرّك الآن، فإن ارتفاع درجات الحرارة سيضرب المجتمعات الأشد فقرًا بقسوة أكبر.","e":"","alt":[]},{"en":"Recycling alone won't solve the problem; we need to consume far less overall.","he":"מיחזור לבדו לא יפתור את הבעיה; אנחנו צריכים לצרוך הרבה פחות באופן כללי.","ru":"Одна лишь переработка не решит проблему: нам нужно в целом потреблять гораздо меньше.","ar":"إعادة التدوير وحدها لن تحلّ المشكلة؛ علينا أن نستهلك أقل بكثير بشكل عام.","e":"","alt":[]},{"en":"The company was accused of greenwashing after exaggerating its environmental achievements.","he":"החברה הואשמה בגרינוושינג (הסוואה ירוקה) אחרי שהגזימה בהישגיה הסביבתיים.","ru":"Компанию обвинили в гринвошинге после того, как она преувеличила свои экологические достижения.","ar":"اتُّهمت الشركة بالغسل الأخضر بعد أن بالغت في إنجازاتها البيئية.","e":"","alt":[]},{"en":"Solar energy makes perfect sense in a country with as much sunshine as Israel.","he":"אנרגיה סולארית הגיונית לגמרי במדינה שיש בה כל כך הרבה שמש כמו בישראל.","ru":"Солнечная энергия вполне логична в стране, где столько солнца, как в Израиле.","ar":"الطاقة الشمسية منطقية تمامًا في بلد مشمس بقدر إسرائيل.","e":"","alt":[]},{"en":"It's estimated that the city will face severe water shortages within two decades.","he":"מעריכים שהעיר תתמודד עם מחסור חמור במים בתוך שני עשורים.","ru":"По оценкам, в течение двух десятилетий город столкнётся с острой нехваткой воды.","ar":"تشير التقديرات إلى أن المدينة ستواجه نقصًا حادًا في المياه خلال عقدين.","e":"","alt":[]},{"en":"Little did we realise how quickly the coastline would change in our lifetime.","he":"לא העלינו בדעתנו כמה מהר קו החוף ישתנה עוד בימי חיינו.","ru":"Мы и не подозревали, как быстро изменится береговая линия ещё при нашей жизни.","ar":"لم نكن ندرك مدى السرعة التي سيتغيّر بها الساحل في حياتنا.","e":"","alt":[]}],"reading":{"en":"Hope Is Not a Strategy, But Neither Is Despair\n\nConversations about the climate tend to fall into two camps. In one, people insist that technology will save the day: electric cars, clean energy and clever engineering will see us through, so there is no need to panic. In the other, people are convinced the game is already lost, and that nothing we do now can make a meaningful difference. Both positions, I would argue, are equally unhelpful.\n\nBlind optimism encourages complacency. If we are certain that some future invention will fix everything, there is little reason to change our habits, vote differently or demand action from governments. It lets us off the hook. Yet despair produces the very same outcome by a different route. If catastrophe is inevitable, why bother cutting back on flights or campaigning for cleaner public transport?\n\nThe reality is messier and, in a sense, more encouraging. Climate change is not an on-off switch; every fraction of a degree matters. The difference between a world that warms by one and a half degrees and one that warms by two is measured in millions of lives, lost harvests and vanished species. That means our choices still carry enormous weight.\n\nIsrael offers a telling example. A country once defined by water scarcity now recycles the vast majority of its wastewater for agriculture and produces much of its drinking water through desalination. These achievements did not come from wishful thinking or from giving up. They came from sustained investment, political will and a refusal to accept that the situation was hopeless.\n\nHope, in other words, is not a strategy. But neither is despair.","he":"תקווה היא לא אסטרטגיה, אבל גם ייאוש לא\n\nשיחות על האקלים נוטות להתחלק לשני מחנות. באחד, אנשים מתעקשים שהטכנולוגיה תציל את המצב: מכוניות חשמליות, אנרגיה נקייה והנדסה מתוחכמת יעבירו אותנו את זה, ולכן אין סיבה להיבהל. בשני, אנשים משוכנעים שהמשחק כבר אבוד, ושום דבר שנעשה עכשיו לא יוכל לחולל שינוי משמעותי. שתי העמדות, לטענתי, מועילות באותה מידה מעט.\n\nאופטימיות עיוורת מעודדת שאננות. אם אנחנו בטוחים שהמצאה עתידית כלשהי תתקן הכול, אין סיבה של ממש לשנות הרגלים, להצביע אחרת או לדרוש מממשלות לפעול. זה משחרר אותנו מאחריות. אבל הייאוש מוביל בדיוק לאותה תוצאה בדרך אחרת. אם האסון בלתי נמנע, למה לטרוח לצמצם טיסות או לפעול למען תחבורה ציבורית נקייה יותר?\n\nהמציאות מורכבת יותר, ובמובן מסוים, גם מעודדת יותר. שינוי האקלים אינו מתג של הפעלה וכיבוי; כל שבריר מעלה חשוב. ההבדל בין עולם שמתחמם במעלה וחצי לעולם שמתחמם בשתי מעלות נמדד במיליוני חיים, ביבולים שאבדו ובמינים שנכחדו. משמעות הדבר היא שלבחירות שלנו עדיין יש משקל עצום.\n\nישראל מספקת דוגמה מאלפת. מדינה שבעבר הוגדרה על ידי מחסור במים ממחזרת כיום את הרוב המכריע של מי השפכים שלה לחקלאות ומפיקה חלק גדול ממי השתייה שלה בהתפלה. ההישגים האלה לא נבעו ממשאלות לב או מהרמת ידיים. הם נבעו מהשקעה מתמשכת, מרצון פוליטי ומסירוב לקבל שהמצב חסר תקווה.\n\nבמילים אחרות, תקווה היא לא אסטרטגיה. אבל גם ייאוש לא.","ru":"Надежда — не стратегия, но и отчаяние тоже\n\nРазговоры о климате, как правило, делятся на два лагеря. В одном люди настаивают, что технологии всех спасут: электромобили, чистая энергия и изобретательная инженерия помогут нам выкарабкаться, так что паниковать незачем. В другом люди убеждены, что игра уже проиграна и ничто из того, что мы делаем сейчас, не изменит ситуацию к лучшему. Обе позиции, на мой взгляд, одинаково бесполезны.\n\nСлепой оптимизм порождает самоуспокоенность. Если мы уверены, что какое-нибудь будущее изобретение всё исправит, нет особых причин менять привычки, голосовать иначе или требовать действий от правительств. Это снимает с нас ответственность. Но отчаяние приводит к тому же результату, только другим путём. Если катастрофа неизбежна, зачем летать меньше или добиваться более чистого общественного транспорта?\n\nРеальность сложнее и в каком-то смысле обнадёживает больше. Изменение климата — это не выключатель с двумя положениями; важна каждая доля градуса. Разница между миром, потеплевшим на полтора градуса, и миром, потеплевшим на два, измеряется миллионами жизней, погибшими урожаями и исчезнувшими видами. Это значит, что наш выбор по-прежнему имеет огромный вес.\n\nИзраиль служит показательным примером. Страна, которую когда-то определяла нехватка воды, сегодня перерабатывает подавляющую часть сточных вод для сельского хозяйства и получает значительную долю питьевой воды за счёт опреснения. Эти достижения появились не благодаря несбыточным мечтам и не из-за опущенных рук. Они стали результатом долгосрочных инвестиций, политической воли и отказа признать ситуацию безнадёжной.\n\nИными словами, надежда — не стратегия. Но и отчаяние тоже.","ar":"الأمل ليس استراتيجية، ولا اليأس كذلك\n\nتميل النقاشات حول المناخ إلى الانقسام إلى معسكرين. في الأول، يصرّ الناس على أن التكنولوجيا ستنقذ الموقف: السيارات الكهربائية والطاقة النظيفة والهندسة الذكية ستعبر بنا الأزمة، فلا داعي للذعر. وفي الثاني، يقتنع الناس بأن المعركة خاسرة أصلًا، وأن لا شيء نفعله الآن يمكن أن يُحدث فرقًا حقيقيًا. وأرى أن كلا الموقفين غير مفيد بالقدر نفسه.\n\nالتفاؤل الأعمى يشجّع على التراخي. فإذا كنا واثقين من أن اختراعًا مستقبليًا ما سيصلح كل شيء، فلا يبقى سبب يُذكر لتغيير عاداتنا أو التصويت بشكل مختلف أو مطالبة الحكومات بالتحرك. إنه يعفينا من المسؤولية. لكن اليأس يؤدي إلى النتيجة نفسها عبر طريق مختلف. فإذا كانت الكارثة حتمية، فلماذا نتكلّف عناء تقليل رحلات الطيران أو المطالبة بمواصلات عامة أنظف؟\n\nالواقع أكثر تعقيدًا، وهو بمعنى ما أكثر تشجيعًا. فتغيّر المناخ ليس مفتاح تشغيل وإطفاء؛ بل كل جزء من الدرجة مهم. والفرق بين عالم ترتفع حرارته درجة ونصفًا وعالم ترتفع حرارته درجتين يُقاس بملايين الأرواح والمحاصيل الضائعة والأنواع المنقرضة. وهذا يعني أن خياراتنا لا تزال تحمل وزنًا هائلًا.\n\nتقدّم إسرائيل مثالًا معبّرًا. فبلد كان يُعرَّف يومًا بشحّ المياه بات اليوم يعيد تدوير الغالبية العظمى من مياه الصرف لأغراض الزراعة، وينتج جزءًا كبيرًا من مياه الشرب عبر التحلية. لم تأتِ هذه الإنجازات من التمنّي ولا من الاستسلام، بل من الاستثمار المتواصل والإرادة السياسية ورفض القبول بأن الوضع ميؤوس منه.\n\nبعبارة أخرى، الأمل ليس استراتيجية، ولا اليأس كذلك.","questions":[["Why does the writer mention Israel's water achievements?","To show that determined action can solve serious problems.","To argue that Israel has already solved climate change.","To prove that technology alone will save the planet.","To criticise Israel's reliance on desalination."],["How does the writer view the optimistic and pessimistic camps?","As equally unhelpful, since both discourage action.","The optimists are right and the pessimists are wrong.","The pessimists are right and the optimists are naive.","Both are correct, but in different ways."],["What does 'it lets us off the hook' mean in the text?","It frees us from feeling responsible.","It helps us catch more fish.","It makes us feel extremely guilty.","It forces us to make difficult choices."]]}},{"en":"culture and the arts","he":"תרבות ואמנות","ru":"культура и искусство","ar":"الثقافة والفنون","e":"🎭","items":[{"en":"The film received rave reviews, but I found the plot rather predictable and slow.","he":"הסרט קיבל ביקורות נלהבות, אבל העלילה נראתה לי די צפויה ואיטית.","ru":"Фильм получил восторженные отзывы, но сюжет показался мне довольно предсказуемым и затянутым.","ar":"حصل الفيلم على مراجعات حماسية، لكنني وجدت الحبكة متوقّعة وبطيئة إلى حدّ ما.","e":"","alt":[]},{"en":"Public funding for the arts is often the first thing to go in a crisis.","he":"מימון ציבורי לאמנויות הוא לעיתים קרובות הדבר הראשון שנחתך בזמן משבר.","ru":"Государственное финансирование искусства часто первым попадает под сокращение во время кризиса.","ar":"غالبًا ما يكون التمويل العام للفنون أول ما يُقتطع في أوقات الأزمات.","e":"","alt":[]},{"en":"Her latest exhibition really struck a chord with younger visitors at the museum.","he":"התערוכה האחרונה שלה ממש נגעה בלבם של המבקרים הצעירים במוזיאון.","ru":"Её последняя выставка по-настоящему нашла отклик у молодых посетителей музея.","ar":"لامس معرضها الأخير وترًا حساسًا لدى الزوار الأصغر سنًا في المتحف.","e":"","alt":[]},{"en":"I'm not much of a theatre buff, but that play completely blew me away.","he":"אני לא ממש חובב/ת תיאטרון, אבל ההצגה הזו פשוט הדהימה אותי.","ru":"Я не большой любитель театра, но этот спектакль меня просто потряс.","ar":"لست من عشّاق المسرح كثيرًا، لكن تلك المسرحية أذهلتني تمامًا.","e":"","alt":[]},{"en":"Some critics claim that streaming has lowered the quality of television, but I disagree.","he":"יש מבקרים שטוענים שהסטרימינג הוריד את איכות הטלוויזיה, אבל אני לא מסכים/ה.","ru":"Некоторые критики утверждают, что стриминг снизил качество телевидения, но я с этим не согласен.","ar":"يزعم بعض النقاد أن خدمات البث خفّضت جودة التلفزيون، لكنني لا أوافق.","e":"","alt":[]},{"en":"The novel is said to have been inspired by the author's childhood in Jaffa.","he":"אומרים שהרומן נכתב בהשראת ילדותו של הסופר ביפו.","ru":"Говорят, что роман был вдохновлён детством автора в Яффо.","ar":"يُقال إن الرواية مستوحاة من طفولة الكاتب في يافا.","e":"","alt":[]}],"reading":{"en":"Who Gets to Decide What Counts as Art?\n\nA few years ago, a friend dragged me to a contemporary art gallery in Tel Aviv. In one room, a single folding chair stood in the middle of an otherwise empty floor. A small card beside it gave the title and a price that made my eyes water. My friend stood in reverent silence. I, I confess, struggled to keep a straight face.\n\nFor a long time, I regarded moments like that as proof that the art world had lost the plot. Surely, I thought, art should demand skill, beauty, or at the very least effort. A chair anyone could buy in a hardware shop hardly seemed to qualify.\n\nI have since softened my stance, though not entirely. What changed my mind was not the chair itself but the conversations it provoked. That evening, over dinner, my friend and I argued for two hours about what makes something valuable, who decides, and why. It occurred to me later that very few 'beautiful' paintings had ever made me think so hard.\n\nThat said, I remain wary of the idea that anything goes. When any object can be declared art simply because someone with influence says so, the word risks losing its meaning altogether. There is a real danger that audiences, feeling patronised, will simply stop showing up.\n\nPerhaps the healthiest position lies somewhere in between: open-minded enough to let unconventional work challenge us, but sceptical enough to ask whether the emperor is, in fact, wearing any clothes. Art, after all, should be able to survive a few hard questions.","he":"מי מחליט מה נחשב לאמנות?\n\nלפני כמה שנים, חבר/ה גרר/ה אותי לגלריה לאמנות עכשווית בתל אביב. באחד החדרים עמד כיסא מתקפל יחיד באמצע רצפה ריקה לגמרי. כרטיס קטן לידו ציין את שם היצירה ומחיר שגרם לעיניים שלי לדמוע. החבר/ה שלי עמד/ה בשתיקה מלאת יראה. אני, אני מודה, התקשיתי לשמור על פנים רציניות.\n\nבמשך זמן רב, ראיתי ברגעים כאלה הוכחה לכך שעולם האמנות איבד את הצפון. אמנות, כך חשבתי, אמורה לדרוש מיומנות, יופי, או לכל הפחות מאמץ. כיסא שכל אחד יכול לקנות בחנות לכלי בית בקושי נראה עומד בתנאים.\n\nמאז ריככתי את עמדתי, אם כי לא לגמרי. מה ששינה את דעתי לא היה הכיסא עצמו, אלא השיחות שהוא עורר. באותו ערב, בארוחת הערב, התווכחנו שעתיים על מה הופך דבר לבעל ערך, מי מחליט, ולמה. מאוחר יותר עלה בדעתי שמעט מאוד ציורים 'יפים' גרמו לי אי פעם לחשוב כל כך הרבה.\n\nעם זאת, אני עדיין נזהר/ת מהרעיון שהכול הולך. כשכל חפץ יכול להיות מוכרז כאמנות רק כי מישהו בעל השפעה אמר זאת, המילה מסתכנת באובדן משמעותה לחלוטין. קיימת סכנה ממשית שהקהל, שירגיש שמתנשאים עליו, פשוט יפסיק להגיע.\n\nאולי העמדה הבריאה ביותר נמצאת איפשהו באמצע: פתוחה מספיק כדי לאפשר ליצירות לא שגרתיות לאתגר אותנו, אבל ספקנית מספיק כדי לשאול אם המלך, למעשה, לבוש בכלל. אחרי הכול, אמנות אמורה להיות מסוגלת לשרוד כמה שאלות קשות.","ru":"Кто решает, что считать искусством?\n\nНесколько лет назад друг затащил меня в галерею современного искусства в Тель-Авиве. В одном из залов посреди совершенно пустого пола стоял единственный складной стул. Рядом висела маленькая табличка с названием и ценой, от которой у меня глаза полезли на лоб. Мой друг стоял в благоговейном молчании. А я, признаюсь, с трудом сдерживал смех.\n\nДолгое время я считал подобные моменты доказательством того, что мир искусства совсем потерял связь с реальностью. Искусство, думал я, должно требовать мастерства, красоты или хотя бы усилий. Стул, который любой может купить в хозяйственном магазине, вряд ли подходил под это определение.\n\nС тех пор я смягчил свою позицию, хотя и не полностью. Моё мнение изменил не сам стул, а разговоры, которые он вызвал. В тот вечер за ужином мы с другом два часа спорили о том, что делает вещь ценной, кто это решает и почему. Позже мне пришло в голову, что очень немногие «красивые» картины когда-либо заставляли меня так напряжённо думать.\n\nТем не менее я по-прежнему насторожённо отношусь к идее, что дозволено всё. Когда любой предмет можно объявить искусством только потому, что так сказал кто-то влиятельный, само слово рискует полностью утратить смысл. Есть реальная опасность, что зрители, почувствовав снисходительное отношение, просто перестанут приходить.\n\nВозможно, самая здоровая позиция находится где-то посередине: достаточно открытая, чтобы позволить нестандартным работам бросать нам вызов, но достаточно скептичная, чтобы спросить, а одет ли король на самом деле. В конце концов, искусство должно выдерживать несколько трудных вопросов.","ar":"من يقرّر ما يُعدّ فنًا؟\n\nقبل بضع سنوات، جرّني صديق إلى معرض للفن المعاصر في تل أبيب. في إحدى القاعات، كان هناك كرسي قابل للطيّ وحيد يقف في وسط أرضية فارغة تمامًا. وبجانبه بطاقة صغيرة تحمل العنوان وسعرًا جعل عينيّ تدمعان. وقف صديقي في صمت مهيب، أما أنا، وأعترف بذلك، فقد كافحت كي لا أضحك.\n\nلفترة طويلة، اعتبرت لحظات كهذه دليلًا على أن عالم الفن قد فقد صوابه. فالفن، كما كنت أظن، يجب أن يتطلّب مهارة أو جمالًا أو على الأقل جهدًا. وكرسي يمكن لأي شخص شراؤه من متجر أدوات منزلية لم يبدُ مؤهلًا لذلك.\n\nمنذ ذلك الحين، خفّفت من موقفي، وإن لم يكن كليًا. فما غيّر رأيي لم يكن الكرسي نفسه، بل النقاشات التي أثارها. في ذلك المساء، على العشاء، تجادلت أنا وصديقي لساعتين حول ما يجعل الشيء ذا قيمة، ومن يقرّر ذلك، ولماذا. وخطر لي لاحقًا أن قلّة قليلة جدًا من اللوحات «الجميلة» جعلتني أفكّر بهذا العمق.\n\nومع ذلك، ما زلت حذرًا من فكرة أن كل شيء مقبول. فعندما يمكن إعلان أي غرض عملًا فنيًا لمجرد أن شخصًا ذا نفوذ قال ذلك، تتعرّض الكلمة لخطر فقدان معناها كليًا. وهناك خطر حقيقي أن يتوقف الجمهور ببساطة عن الحضور حين يشعر بالاستعلاء عليه.\n\nربما يكمن الموقف الأكثر صحة في مكان ما بين الاثنين: منفتح بما يكفي ليسمح للأعمال غير التقليدية بأن تتحدّانا، ومتشكّك بما يكفي ليسأل إن كان الإمبراطور يرتدي ملابس فعلًا. ففي النهاية، ينبغي للفن أن يصمد أمام بعض الأسئلة الصعبة.","questions":[["What eventually made the writer view the chair more positively?","It sparked a long and meaningful discussion.","The writer learned how expensive it really was.","The friend explained the artist's technique in detail.","The writer later saw it in a famous museum."],["Which best describes the writer's current view of contemporary art?","Cautiously open, but still somewhat sceptical.","Completely dismissive of all modern art.","Enthusiastic about everything shown in galleries.","Uninterested in questions about art."],["What does 'struggled to keep a straight face' mean?","Found it hard not to laugh.","Found it hard to stay awake.","Found it hard to see clearly.","Found it hard to stand still."]]}},{"en":"debate and discussion","he":"ויכוח ודיון","ru":"дебаты и дискуссия","ar":"المناظرة والنقاش","e":"⚖️","dialog":true,"items":[{"q":"Working from home has made people lazy. Companies should bring everyone back to the office.","en":"I'd argue productivity depends more on management than location; many remote teams actually outperform office-based ones.","he":"הייתי טוען/ת שהפרודוקטיביות תלויה יותר בניהול מאשר במיקום; צוותים רבים שעובדים מרחוק דווקא מצליחים יותר מצוותים במשרד.","ru":"Я бы сказал, что продуктивность зависит скорее от управления, чем от места; многие удалённые команды работают даже лучше офисных.","ar":"أرى أن الإنتاجية تعتمد على الإدارة أكثر من المكان؛ فكثير من الفرق التي تعمل عن بُعد تتفوّق فعلًا على فرق المكاتب."},{"q":"Social media has done more harm than good. We'd all be better off without it.","en":"That's a bit sweeping; it certainly has downsides, but it also connects people and spreads vital information.","he":"זו הכללה גורפת מדי; יש לה בהחלט חסרונות, אבל היא גם מחברת בין אנשים ומפיצה מידע חיוני.","ru":"Это слишком огульно: у них, безусловно, есть недостатки, но они также объединяют людей и распространяют важную информацию.","ar":"هذا تعميم مبالغ فيه؛ لها سلبيات بالتأكيد، لكنها أيضًا تربط بين الناس وتنشر معلومات حيوية."},{"q":"University degrees are a waste of time and money. Experience is all that matters.","en":"Experience is invaluable, but for some professions, like medicine or engineering, a degree is genuinely essential.","he":"ניסיון הוא דבר שלא יסולא בפז, אבל במקצועות מסוימים, כמו רפואה או הנדסה, תואר הוא באמת הכרחי.","ru":"Опыт бесценен, но для некоторых профессий, например медицины или инженерии, диплом действительно необходим.","ar":"الخبرة لا تقدّر بثمن، لكن في بعض المهن، كالطب أو الهندسة، تكون الشهادة الجامعية ضرورية حقًا."},{"q":"Tourism ruins every place it touches. Cities should simply ban mass tourism.","en":"Banning it outright seems extreme; smarter regulation could protect residents while still supporting local businesses.","he":"איסור מוחלט נראה לי קיצוני; רגולציה חכמה יותר יכולה להגן על התושבים ועדיין לתמוך בעסקים המקומיים.","ru":"Полный запрет кажется крайностью; более разумное регулирование могло бы защитить жителей и при этом поддержать местный бизнес.","ar":"يبدو حظرها كليًا أمرًا متطرفًا؛ فتنظيم أذكى يمكن أن يحمي السكان مع الاستمرار في دعم الأعمال المحلية."},{"q":"Artificial intelligence will replace most jobs within ten years, so there's no point learning new skills.","en":"I'm not so sure; history suggests technology transforms jobs rather than eliminating them, so adaptable skills matter more than ever.","he":"אני לא כל כך בטוח/ה; ההיסטוריה מראה שטכנולוגיה משנה עבודות ולא מבטלת אותן, ולכן כישורים גמישים חשובים יותר מאי פעם.","ru":"Я не уверен: история показывает, что технологии меняют профессии, а не уничтожают их, поэтому гибкие навыки важны как никогда.","ar":"لست متأكدًا من ذلك؛ فالتاريخ يشير إلى أن التكنولوجيا تُحوّل الوظائف بدلًا من إلغائها، لذا فالمهارات القابلة للتكيّف أهم من أي وقت مضى."},{"q":"Children today are spoiled. Things were much better when we were young.","en":"Every generation says that, though; kids today face different pressures, and in many ways they're remarkably resilient.","he":"אבל כל דור אומר את זה; ילדים היום מתמודדים עם לחצים אחרים, ובמובנים רבים הם חסינים באופן מרשים.","ru":"Но ведь каждое поколение так говорит; сегодняшние дети сталкиваются с другими трудностями и во многом удивительно стойкие.","ar":"لكن كل جيل يقول ذلك؛ فأطفال اليوم يواجهون ضغوطًا مختلفة، وهم في نواحٍ كثيرة يتمتعون بمرونة لافتة."}]}]},{"id":"talk","group":"adults","he":"תרגול דיבור","sub":"שיחות אמיתיות: הדמות שואלת, ואתם עונים במשפטים מלאים","e":"🗣️","units":[{"en":"getting to know someone","he":"היכרות","ru":"знакомство","ar":"التعارف","e":"🤝","dialog":true,"items":[{"q":"So, what do you do for a living?","en":"I work as a nurse at a hospital in Haifa, mostly on night shifts.","he":"אני עובד/ת כאח/ות בבית חולים בחיפה, בעיקר במשמרות לילה.","ru":"Я работаю медсестрой в больнице в Хайфе, в основном в ночные смены.","ar":"أعمل في التمريض في مستشفى في حيفا، غالبًا في المناوبات الليلية."},{"q":"How long have you lived in this neighborhood?","en":"About three years now, and I really like how quiet and green it is.","he":"בערך שלוש שנים, ואני מאוד אוהב/ת כמה שקט וירוק כאן.","ru":"Уже около трёх лет, и мне очень нравится, как здесь тихо и зелено.","ar":"منذ حوالي ثلاث سنوات، وأحب كثيرًا كم هو هادئ وأخضر."},{"q":"What do you usually do on the weekends?","en":"I usually go hiking with friends, and on Saturday evenings I visit my parents.","he":"בדרך כלל אני יוצא/ת לטיולים עם חברים, ובמוצאי שבת אני מבקר/ת את ההורים שלי.","ru":"Обычно я хожу в походы с друзьями, а по субботним вечерам навещаю родителей.","ar":"عادةً أذهب للتنزه مع الأصدقاء، وفي مساء السبت أزور والديّ."},{"q":"Where did you grow up?","en":"I grew up in a small town in the north, but I moved to Tel Aviv for university.","he":"גדלתי בעיירה קטנה בצפון, אבל עברתי לתל אביב בשביל האוניברסיטה.","ru":"Я вырос/выросла в маленьком городке на севере, но переехал(а) в Тель-Авив ради университета.","ar":"نشأت في بلدة صغيرة في الشمال، لكنني انتقلت إلى تل أبيب للدراسة في الجامعة."},{"q":"Do you have any hobbies?","en":"Yes, I've been learning the guitar for about a year, though I'm still pretty bad at it.","he":"כן, אני לומד/ת גיטרה כבר בערך שנה, אם כי אני עדיין די גרוע/ה בזה.","ru":"Да, я учусь играть на гитаре уже около года, хотя у меня пока получается не очень.","ar":"نعم، أتعلم العزف على الغيتار منذ حوالي سنة، مع أنني ما زلت سيئًا فيه نوعًا ما."},{"q":"It was really nice meeting you. Are you on WhatsApp?","en":"Nice meeting you too, let me give you my number so we can stay in touch.","he":"גם לי היה נעים להכיר, בוא/י אתן לך את המספר שלי כדי שנשמור על קשר.","ru":"Мне тоже было приятно познакомиться, давай я дам тебе свой номер, чтобы мы были на связи.","ar":"تشرفت بمعرفتك أيضًا، دعني أعطيك رقمي لنبقى على تواصل."}]},{"en":"at a restaurant","he":"במסעדה","ru":"в ресторане","ar":"في المطعم","e":"🍽️","dialog":true,"items":[{"q":"Good evening! Do you have a reservation?","en":"Yes, we booked a table for four under the name Cohen for eight o'clock.","he":"כן, הזמנו שולחן לארבעה על השם כהן לשעה שמונה.","ru":"Да, мы забронировали столик на четверых на имя Коэн на восемь часов.","ar":"نعم، حجزنا طاولة لأربعة أشخاص باسم كوهين للساعة الثامنة."},{"q":"Are you ready to order, or do you need a few more minutes?","en":"I think we're ready, but could you tell us which dishes are vegetarian first?","he":"אני חושב/ת שאנחנו מוכנים, אבל קודם תוכל/י להגיד לנו אילו מנות צמחוניות?","ru":"Думаю, мы готовы, но сначала не подскажете, какие блюда вегетарианские?","ar":"أعتقد أننا جاهزون، لكن هل يمكنك أن تخبرنا أولًا أي الأطباق نباتية؟"},{"q":"How would you like your steak cooked?","en":"Medium, please, and could I have a salad instead of the fries on the side?","he":"מדיום, בבקשה, ואפשר לקבל סלט במקום צ'יפס בתוספת?","ru":"Средней прожарки, пожалуйста, и можно салат вместо картошки фри на гарнир?","ar":"متوسط النضج من فضلك، وهل يمكنني الحصول على سلطة بدل البطاطا المقلية كطبق جانبي؟"},{"q":"Is everything all right with your meal?","en":"Actually, I ordered the fish, but the waiter brought me chicken by mistake.","he":"בעצם, הזמנתי דג, אבל המלצר הביא לי עוף בטעות.","ru":"Вообще-то я заказывал(а) рыбу, но официант по ошибке принёс мне курицу.","ar":"في الحقيقة طلبت السمك، لكن النادل أحضر لي الدجاج بالخطأ."},{"q":"I'm so sorry about that. Should I bring you the right dish?","en":"Yes, please, but if it takes too long, I'd rather just cancel it.","he":"כן, בבקשה, אבל אם זה ייקח יותר מדי זמן, אני מעדיף/ה פשוט לבטל.","ru":"Да, пожалуйста, но если это займёт слишком много времени, я лучше просто отменю заказ.","ar":"نعم من فضلك، لكن إذا استغرق وقتًا طويلًا فأفضّل أن ألغيه."},{"q":"Can I get you anything else, maybe dessert or coffee?","en":"No thanks, we're full, so could we just have the check and pay separately?","he":"לא תודה, אנחנו מלאים, אז אפשר פשוט את החשבון ולשלם בנפרד?","ru":"Нет, спасибо, мы сыты, так что можно просто счёт и заплатить раздельно?","ar":"لا شكرًا، شبعنا، فهل يمكننا الحصول على الحساب والدفع كلٌّ على حدة؟"}]},{"en":"shopping and returns","he":"קניות והחזרות","ru":"покупки и возвраты","ar":"التسوق والإرجاع","e":"🛍️","dialog":true,"items":[{"q":"Hi there, can I help you find something?","en":"I'm looking for a warm winter jacket, preferably something waterproof and not too heavy.","he":"אני מחפש/ת מעיל חורף חם, רצוי משהו עמיד למים ולא כבד מדי.","ru":"Я ищу тёплую зимнюю куртку, желательно непромокаемую и не слишком тяжёлую.","ar":"أبحث عن معطف شتوي دافئ، ويفضّل أن يكون مقاومًا للماء وليس ثقيلًا جدًا."},{"q":"What size do you usually wear?","en":"Usually a medium, but it depends on the brand, so I'd like to try it on.","he":"בדרך כלל מידיום, אבל זה תלוי במותג, אז הייתי רוצה למדוד.","ru":"Обычно M, но это зависит от бренда, поэтому я хотел(а) бы примерить.","ar":"عادةً المقاس المتوسط، لكن ذلك يعتمد على الماركة، لذا أودّ أن أجرّبه."},{"q":"This one is on sale this week, thirty percent off.","en":"That sounds great, but do you have the same model in dark blue instead?","he":"זה נשמע מעולה, אבל יש לכם את אותו דגם בכחול כהה?","ru":"Звучит отлично, но у вас есть такая же модель в тёмно-синем цвете?","ar":"يبدو رائعًا، لكن هل لديكم الموديل نفسه باللون الأزرق الداكن؟"},{"q":"Hello, how can I help you today?","en":"I bought these shoes last week, but they're too small, so I'd like to return them.","he":"קניתי את הנעליים האלה בשבוע שעבר, אבל הן קטנות מדי, אז אני רוצה להחזיר אותן.","ru":"Я купил(а) эти туфли на прошлой неделе, но они слишком малы, поэтому я хочу их вернуть.","ar":"اشتريت هذا الحذاء الأسبوع الماضي، لكنه صغير جدًا، لذا أودّ إرجاعه."},{"q":"Do you have the receipt with you?","en":"Yes, here it is, and the shoes are unworn and still in the original box.","he":"כן, הנה היא, והנעליים לא נעולות ועדיין בקופסה המקורית.","ru":"Да, вот он, и туфли не ношены и всё ещё в оригинальной коробке.","ar":"نعم، ها هو، والحذاء لم يُلبس وما زال في علبته الأصلية."},{"q":"We can give you store credit or exchange them for another size.","en":"I'd prefer a refund to my credit card, since I couldn't find anything else I liked.","he":"אני מעדיף/ה זיכוי לכרטיס האשראי, כי לא מצאתי שום דבר אחר שאהבתי.","ru":"Я бы предпочёл/предпочла возврат денег на карту, потому что ничего другого мне не понравилось.","ar":"أفضّل استرداد المبلغ إلى بطاقتي الائتمانية، لأنني لم أجد شيئًا آخر أعجبني."}]},{"en":"job interview","he":"ראיון עבודה","ru":"собеседование","ar":"مقابلة عمل","e":"💼","dialog":true,"items":[{"q":"Thanks for coming in. Could you tell me a little about yourself?","en":"Sure, I have five years of experience in customer service, mostly at a large tech company.","he":"בטח, יש לי חמש שנות ניסיון בשירות לקוחות, בעיקר בחברת הייטק גדולה.","ru":"Конечно, у меня пять лет опыта в обслуживании клиентов, в основном в крупной технологической компании.","ar":"بالتأكيد، لديّ خمس سنوات من الخبرة في خدمة العملاء، معظمها في شركة تكنولوجيا كبيرة."},{"q":"Why do you want to work for our company?","en":"I admire your products, and I'm looking for a place where I can keep learning and growing.","he":"אני מעריך/ה את המוצרים שלכם, ואני מחפש/ת מקום שבו אוכל להמשיך ללמוד ולהתפתח.","ru":"Я восхищаюсь вашими продуктами и ищу место, где смогу продолжать учиться и расти.","ar":"أُعجب بمنتجاتكم، وأبحث عن مكان أستطيع فيه مواصلة التعلّم والتطوّر."},{"q":"What would you say is your biggest strength?","en":"I'm very organized and calm under pressure, which helps me handle several projects at once.","he":"אני מאוד מאורגן/ת ורגוע/ה תחת לחץ, וזה עוזר לי לנהל כמה פרויקטים במקביל.","ru":"Я очень организован(а) и спокоен/спокойна под давлением, что помогает мне вести несколько проектов одновременно.","ar":"أنا منظّم جدًا وهادئ تحت الضغط، وهذا يساعدني على إدارة عدة مشاريع في الوقت نفسه."},{"q":"Tell me about a difficult situation at work and how you handled it.","en":"Once a client was very angry about a delay, so I called him and offered a solution.","he":"פעם לקוח כעס מאוד על עיכוב, אז התקשרתי אליו והצעתי לו פתרון.","ru":"Однажды клиент был очень зол из-за задержки, поэтому я позвонил(а) ему и предложил(а) решение.","ar":"ذات مرة غضب أحد العملاء كثيرًا بسبب تأخير، فاتصلت به وعرضت عليه حلًا."},{"q":"Where do you see yourself in five years?","en":"I hope to lead a small team and take on more responsibility within the company.","he":"אני מקווה להוביל צוות קטן ולקחת על עצמי יותר אחריות בחברה.","ru":"Я надеюсь руководить небольшой командой и брать на себя больше ответственности в компании.","ar":"آمل أن أقود فريقًا صغيرًا وأن أتحمّل مسؤولية أكبر داخل الشركة."},{"q":"Do you have any questions for us?","en":"Yes, could you tell me what a typical day looks like and when you expect to decide?","he":"כן, תוכלו לספר לי איך נראה יום עבודה רגיל ומתי אתם מצפים להחליט?","ru":"Да, не могли бы вы рассказать, как выглядит обычный рабочий день и когда вы планируете принять решение?","ar":"نعم، هل يمكنكم أن تخبروني كيف يبدو يوم العمل العادي ومتى تتوقعون اتخاذ القرار؟"}]},{"en":"phone calls and appointments","he":"שיחות טלפון ותורים","ru":"звонки и записи","ar":"المكالمات والمواعيد","e":"📞","dialog":true,"items":[{"q":"Good morning, Dr. Levi's clinic, how can I help you?","en":"Hi, I'd like to make an appointment with the doctor sometime next week, if possible.","he":"שלום, הייתי רוצה לקבוע תור אצל הרופאה מתישהו בשבוע הבא, אם אפשר.","ru":"Здравствуйте, я хотел(а) бы записаться к врачу на следующей неделе, если возможно.","ar":"مرحبًا، أودّ تحديد موعد مع الطبيبة في وقت ما الأسبوع القادم إن أمكن."},{"q":"We have an opening on Tuesday at ten in the morning.","en":"Unfortunately I'm at work then, so do you have anything later in the afternoon?","he":"לצערי אני בעבודה בשעה הזאת, אז יש לכם משהו מאוחר יותר אחר הצהריים?","ru":"К сожалению, в это время я на работе, у вас есть что-нибудь попозже, днём?","ar":"للأسف أكون في العمل في ذلك الوقت، فهل لديكم موعد لاحق بعد الظهر؟"},{"q":"Can I have your name and ID number, please?","en":"Of course, my name is Dana Mizrahi, and I'll spell my last name for you.","he":"כמובן, קוראים לי דנה מזרחי, ואאיית לך את שם המשפחה שלי.","ru":"Конечно, меня зовут Дана Мизрахи, и я продиктую вам свою фамилию по буквам.","ar":"بالطبع، اسمي دانا مزراحي، وسأتهجّى لك اسم عائلتي."},{"q":"I'm sorry, she's in a meeting right now. Can I take a message?","en":"Yes, please ask her to call me back this afternoon about the contract we discussed.","he":"כן, בבקשה תבקש/י ממנה לחזור אליי היום אחר הצהריים בקשר לחוזה שדיברנו עליו.","ru":"Да, пожалуйста, попросите её перезвонить мне сегодня днём по поводу договора, который мы обсуждали.","ar":"نعم، من فضلك اطلب منها أن تعاود الاتصال بي بعد الظهر بخصوص العقد الذي ناقشناه."},{"q":"Sorry, the line is really bad. Could you repeat that?","en":"Sure, I said I need to move my appointment from Thursday to the following Monday.","he":"בטח, אמרתי שאני צריך/ה להעביר את התור שלי מיום חמישי ליום שני שאחריו.","ru":"Конечно, я сказал(а), что мне нужно перенести запись с четверга на следующий понедельник.","ar":"بالتأكيد، قلت إنني بحاجة إلى نقل موعدي من الخميس إلى يوم الاثنين الذي يليه."},{"q":"Is there anything else I can help you with today?","en":"No, that's everything, thanks, and could you send me a text message to confirm the time?","he":"לא, זה הכול, תודה, ותוכל/י לשלוח לי הודעת SMS לאישור השעה?","ru":"Нет, это всё, спасибо, и не могли бы вы прислать мне SMS с подтверждением времени?","ar":"لا، هذا كل شيء، شكرًا، وهل يمكنك أن ترسل لي رسالة نصية لتأكيد الموعد؟"}]},{"en":"travel and plans","he":"טיולים ותוכניות","ru":"путешествия и планы","ar":"السفر والخطط","e":"✈️","dialog":true,"items":[{"q":"Do you have any plans for the summer vacation?","en":"We're thinking about renting a car and driving around northern Italy for about ten days.","he":"אנחנו חושבים לשכור רכב ולטייל בצפון איטליה בערך עשרה ימים.","ru":"Мы думаем взять машину напрокат и поездить по северной Италии около десяти дней.","ar":"نفكر في استئجار سيارة والتجول في شمال إيطاليا لمدة عشرة أيام تقريبًا."},{"q":"Have you booked your flights yet?","en":"Not yet, because prices keep changing, so I'm waiting for a good deal before I book.","he":"עוד לא, כי המחירים כל הזמן משתנים, אז אני מחכה למבצע טוב לפני שאני מזמין/ה.","ru":"Ещё нет, потому что цены постоянно меняются, поэтому я жду хорошего предложения, прежде чем бронировать.","ar":"ليس بعد، لأن الأسعار تتغير باستمرار، لذا أنتظر عرضًا جيدًا قبل أن أحجز."},{"q":"Would you rather stay in a hotel or rent an apartment?","en":"I prefer an apartment, since we can cook breakfast and it's usually cheaper for families.","he":"אני מעדיף/ה דירה, כי אפשר להכין ארוחת בוקר ובדרך כלל זה זול יותר למשפחות.","ru":"Я предпочитаю квартиру, потому что можно готовить завтрак, и для семей это обычно дешевле.","ar":"أفضّل شقة، لأننا نستطيع إعداد الفطور، وهي عادةً أرخص للعائلات."},{"q":"Where would you like to go first when we get there?","en":"I'd love to see the old town first, and then maybe find a nice place for lunch.","he":"הייתי שמח/ה לראות קודם את העיר העתיקה, ואחר כך אולי למצוא מקום נחמד לארוחת צהריים.","ru":"Я бы хотел(а) сначала посмотреть старый город, а потом, может быть, найти хорошее место для обеда.","ar":"أودّ أن أرى البلدة القديمة أولًا، ثم ربما نجد مكانًا لطيفًا لتناول الغداء."},{"q":"What's the best trip you've ever taken?","en":"Probably our trip to Japan two years ago, because the food and the people were amazing.","he":"כנראה הטיול שלנו ליפן לפני שנתיים, כי האוכל והאנשים היו מדהימים.","ru":"Наверное, наша поездка в Японию два года назад, потому что еда и люди были потрясающими.","ar":"ربما رحلتنا إلى اليابان قبل عامين، لأن الطعام والناس كانوا رائعين."},{"q":"Do you want to join us for a weekend in the Galilee next month?","en":"I'd love to, but let me check my schedule first and get back to you tomorrow.","he":"אשמח מאוד, אבל תן/י לי לבדוק קודם את הלו\"ז ואחזור אליך מחר.","ru":"С удовольствием, но дай мне сначала проверить расписание, и я отвечу тебе завтра.","ar":"يسعدني ذلك، لكن دعني أتحقق من جدولي أولًا وأرد عليك غدًا."}]},{"en":"at the doctor","he":"אצל הרופא","ru":"у врача","ar":"عند الطبيب","e":"🩺","dialog":true,"items":[{"q":"So, what seems to be the problem today?","en":"I've had a bad headache and a sore throat for three days, and it's getting worse.","he":"יש לי כאב ראש חזק וכאב גרון כבר שלושה ימים, וזה הולך ומחמיר.","ru":"У меня уже три дня сильно болит голова и горло, и становится только хуже.","ar":"أعاني من صداع شديد والتهاب في الحلق منذ ثلاثة أيام، والوضع يزداد سوءًا."},{"q":"Do you have a fever?","en":"Yes, last night it was almost thirty-nine degrees, and I couldn't sleep at all.","he":"כן, אתמול בלילה היה לי כמעט שלושים ותשע מעלות, ולא הצלחתי לישון בכלל.","ru":"Да, вчера вечером было почти тридцать девять, и я совсем не мог(ла) спать.","ar":"نعم، الليلة الماضية وصلت إلى تسع وثلاثين درجة تقريبًا، ولم أستطع النوم إطلاقًا."},{"q":"Are you taking any medication at the moment?","en":"Only something for my blood pressure, which I take every morning with breakfast.","he":"רק משהו ללחץ דם, שאני לוקח/ת כל בוקר עם ארוחת הבוקר.","ru":"Только лекарство от давления, которое я принимаю каждое утро за завтраком.","ar":"فقط دواء لضغط الدم، أتناوله كل صباح مع الفطور."},{"q":"Are you allergic to anything?","en":"I'm allergic to penicillin, so please don't prescribe me anything that contains it.","he":"אני אלרגי/ת לפניצילין, אז בבקשה אל תרשום/תרשמי לי שום דבר שמכיל אותו.","ru":"У меня аллергия на пенициллин, поэтому, пожалуйста, не выписывайте мне ничего, что его содержит.","ar":"لديّ حساسية من البنسلين، لذا أرجو ألا تصف لي أي دواء يحتوي عليه."},{"q":"Take this antibiotic twice a day for a week.","en":"Should I take it before or after meals, and can I still go to work?","he":"לקחת את זה לפני האוכל או אחריו, ואני יכול/ה בכל זאת ללכת לעבודה?","ru":"Принимать его до или после еды, и могу ли я всё-таки ходить на работу?","ar":"هل آخذه قبل الوجبات أم بعدها، وهل يمكنني الذهاب إلى العمل؟"},{"q":"If you don't feel better in a few days, come back and see me.","en":"Thank you, doctor, and could you also give me a sick note for my employer?","he":"תודה, דוקטור, ותוכל/י גם לתת לי אישור מחלה למעסיק?","ru":"Спасибо, доктор, и не могли бы вы также дать мне больничный для работодателя?","ar":"شكرًا يا دكتور، وهل يمكنك أيضًا أن تعطيني إجازة مرضية لصاحب العمل؟"}]},{"en":"at the hotel","he":"במלון","ru":"в гостинице","ar":"في الفندق","e":"🏨","dialog":true,"items":[{"q":"Welcome! Are you checking in?","en":"Yes, I have a reservation for three nights under the name Avraham, with breakfast included.","he":"כן, יש לי הזמנה לשלושה לילות על השם אברהם, כולל ארוחת בוקר.","ru":"Да, у меня бронь на три ночи на имя Авраам, с завтраком.","ar":"نعم، لديّ حجز لثلاث ليالٍ باسم أبراهام، مع الفطور."},{"q":"Here's your key card. Your room is on the fifth floor.","en":"Thanks, and could you tell me what time breakfast is served and where the restaurant is?","he":"תודה, ותוכל/י להגיד לי באיזו שעה מגישים ארוחת בוקר ואיפה המסעדה?","ru":"Спасибо, а не подскажете, во сколько подают завтрак и где находится ресторан?","ar":"شكرًا، وهل يمكنك أن تخبرني متى يُقدَّم الفطور وأين المطعم؟"},{"q":"Front desk, how can I help you?","en":"Hi, the air conditioning in room 512 isn't working, and it's really hot in here.","he":"שלום, המזגן בחדר 512 לא עובד, וממש חם כאן.","ru":"Здравствуйте, в номере 512 не работает кондиционер, и здесь очень жарко.","ar":"مرحبًا، المكيّف في الغرفة 512 لا يعمل، والجو حار جدًا هنا."},{"q":"I'm sorry to hear that. We'll send someone up right away.","en":"I'd appreciate that, because this is the second time I've called about the same problem.","he":"אודה לכם, כי זו הפעם השנייה שאני מתקשר/ת בגלל אותה בעיה.","ru":"Буду признателен/признательна, потому что я звоню по этой проблеме уже второй раз.","ar":"سأكون ممتنًا، لأن هذه هي المرة الثانية التي أتصل فيها بشأن المشكلة نفسها."},{"q":"Is there anything else we can do to make your stay more comfortable?","en":"Actually, the room is also very noisy at night, so could we move to a quieter one?","he":"האמת, החדר גם מאוד רועש בלילה, אז אפשר לעבור לחדר שקט יותר?","ru":"Вообще-то в номере ещё и очень шумно ночью, нельзя ли переехать в более тихий?","ar":"في الحقيقة، الغرفة أيضًا صاخبة جدًا في الليل، فهل يمكننا الانتقال إلى غرفة أهدأ؟"},{"q":"Are you ready to check out? How was your stay?","en":"The staff were lovely, but because of the broken air conditioner, I expected some kind of discount.","he":"הצוות היה מקסים, אבל בגלל המזגן המקולקל ציפיתי לאיזושהי הנחה.","ru":"Персонал был замечательный, но из-за сломанного кондиционера я рассчитывал(а) на какую-нибудь скидку.","ar":"كان الموظفون لطفاء جدًا، لكن بسبب المكيّف المعطّل توقعت نوعًا من الخصم."}]}]},{"id":"uni","group":"uni","he":"סטודנטים · אנגלית אקדמית","sub":"אנגלית לאקדמיה ולפטור","e":"🎓","units":[{"en":"academic vocabulary","he":"אוצר מילים אקדמי","ru":"академическая лексика","ar":"المفردات الأكاديمية","e":"📚","items":[{"en":"The study aims to analyze the impact of social media.","he":"המחקר נועד לנתח את ההשפעה של הרשתות החברתיות.","ru":"Исследование направлено на анализ влияния социальных сетей.","ar":"تهدف الدراسة إلى تحليل تأثير وسائل التواصل الاجتماعي.","e":"","alt":[]},{"en":"These factors significantly affect students' academic performance.","he":"גורמים אלה משפיעים באופן משמעותי על ההישגים הלימודיים של סטודנטים.","ru":"Эти факторы существенно влияют на успеваемость студентов.","ar":"تؤثر هذه العوامل بشكل كبير على الأداء الأكاديمي للطلاب.","e":"","alt":[]},{"en":"The researchers identified a clear relationship between the variables.","he":"החוקרים זיהו קשר ברור בין המשתנים.","ru":"Исследователи выявили явную связь между переменными.","ar":"حدّد الباحثون علاقة واضحة بين المتغيرات.","e":"","alt":[]},{"en":"This approach is widely used in modern psychology.","he":"גישה זו נמצאת בשימוש נרחב בפסיכולוגיה המודרנית.","ru":"Этот подход широко используется в современной психологии.","ar":"يُستخدم هذا النهج على نطاق واسع في علم النفس الحديث.","e":"","alt":[]},{"en":"The theory is based on several key assumptions.","he":"התיאוריה מבוססת על כמה הנחות יסוד מרכזיות.","ru":"Теория основана на нескольких ключевых допущениях.","ar":"تستند النظرية إلى عدة افتراضات أساسية.","e":"","alt":[]},{"en":"It is essential to evaluate the evidence carefully.","he":"חיוני להעריך את הראיות בקפידה.","ru":"Крайне важно тщательно оценивать доказательства.","ar":"من الضروري تقييم الأدلة بعناية.","e":"","alt":[]}],"reading":{"en":"Vocabulary knowledge is one of the strongest predictors of reading comprehension. Research indicates that students must understand about 95 percent of the words in a text to read it effectively. Academic texts, however, contain many words that rarely appear in everyday conversation. Words such as analyze, significant and approach are common across all disciplines. Therefore, many universities encourage students to study a general academic word list. Learning these words early can make reading research articles considerably easier.","he":"ידיעת אוצר מילים היא אחד המנבאים החזקים ביותר של הבנת הנקרא. מחקרים מראים שסטודנטים צריכים להבין כ-95 אחוז מהמילים בטקסט כדי לקרוא אותו ביעילות. עם זאת, טקסטים אקדמיים מכילים מילים רבות שמופיעות לעיתים רחוקות בשיחה יומיומית. מילים כמו analyze, significant ו-approach נפוצות בכל התחומים. לכן אוניברסיטאות רבות מעודדות סטודנטים ללמוד רשימת מילים אקדמית כללית. לימוד המילים האלה בשלב מוקדם יכול להקל במידה ניכרת על קריאת מאמרי מחקר.","ru":"Словарный запас — один из самых сильных предикторов понимания прочитанного. Исследования показывают, что для эффективного чтения студенту нужно понимать около 95 процентов слов текста. Однако академические тексты содержат много слов, которые редко встречаются в повседневной речи. Такие слова, как analyze, significant и approach, распространены во всех дисциплинах. Поэтому многие университеты рекомендуют студентам изучать общий академический список слов. Если выучить эти слова заранее, читать научные статьи станет значительно легче.","ar":"تُعدّ المعرفة بالمفردات من أقوى المؤشرات على فهم المقروء. تشير الأبحاث إلى أن الطلاب يجب أن يفهموا نحو 95 بالمئة من كلمات النص ليقرؤوه بفعالية. غير أن النصوص الأكاديمية تحتوي على كلمات كثيرة نادرًا ما تظهر في المحادثة اليومية. كلمات مثل analyze وsignificant وapproach شائعة في جميع التخصصات. لذلك تشجّع جامعات كثيرة الطلاب على دراسة قائمة عامة بالكلمات الأكاديمية. ويمكن لتعلّم هذه الكلمات مبكرًا أن يجعل قراءة المقالات البحثية أسهل بكثير.","questions":[["What percentage of words must students understand?","About 95 percent","About 50 percent","About 75 percent","100 percent"],["Why are academic texts difficult?","They use words rare in conversation","They are always very short","They contain no data","They use only simple words"],["What do many universities encourage?","Studying an academic word list","Reading only novels","Avoiding research articles","Learning grammar rules first"]]}},{"en":"research articles","he":"קריאת מאמרי מחקר","ru":"научные статьи","ar":"المقالات البحثية","e":"🔬","items":[{"en":"The abstract gives a short summary of the entire study.","he":"התקציר נותן סיכום קצר של המחקר כולו.","ru":"Аннотация даёт краткое изложение всего исследования.","ar":"يقدّم الملخص عرضًا موجزًا للدراسة بأكملها.","e":"","alt":[]},{"en":"Participants were randomly divided into two groups.","he":"המשתתפים חולקו באופן אקראי לשתי קבוצות.","ru":"Участники были случайным образом разделены на две группы.","ar":"قُسّم المشاركون عشوائيًا إلى مجموعتين.","e":"","alt":[]},{"en":"Data were collected through online questionnaires and interviews.","he":"הנתונים נאספו באמצעות שאלונים מקוונים וראיונות.","ru":"Данные собирались с помощью онлайн-анкет и интервью.","ar":"جُمعت البيانات من خلال استبيانات إلكترونية ومقابلات.","e":"","alt":[]},{"en":"The findings suggest that sleep improves long-term memory.","he":"הממצאים מצביעים על כך ששינה משפרת את הזיכרון לטווח ארוך.","ru":"Результаты указывают на то, что сон улучшает долговременную память.","ar":"تشير النتائج إلى أن النوم يحسّن الذاكرة طويلة المدى.","e":"","alt":[]},{"en":"One limitation of this study is the small sample.","he":"אחת המגבלות של מחקר זה היא המדגם הקטן.","ru":"Одно из ограничений этого исследования — небольшая выборка.","ar":"من قيود هذه الدراسة صغر حجم العيّنة.","e":"","alt":[]},{"en":"Further research is needed to confirm these results.","he":"נדרש מחקר נוסף כדי לאשש את התוצאות הללו.","ru":"Для подтверждения этих результатов необходимы дальнейшие исследования.","ar":"هناك حاجة إلى مزيد من البحث لتأكيد هذه النتائج.","e":"","alt":[]}],"reading":{"en":"This study examined the effect of smartphone use on the sleep quality of university students. A total of 240 undergraduate students in Israel completed an online questionnaire about their evening habits. Participants also recorded their sleep for two weeks using a mobile application. The results showed that students who used their phones in bed slept, on average, 40 minutes less. They also reported more difficulty concentrating during morning classes. These findings suggest that universities should raise awareness of healthy sleep habits.","he":"מחקר זה בחן את השפעת השימוש בטלפון חכם על איכות השינה של סטודנטים באוניברסיטה. בסך הכול 240 סטודנטים לתואר ראשון בישראל מילאו שאלון מקוון על הרגלי הערב שלהם. המשתתפים גם תיעדו את השינה שלהם במשך שבועיים באמצעות אפליקציה. התוצאות הראו שסטודנטים שהשתמשו בטלפון במיטה ישנו בממוצע 40 דקות פחות. הם גם דיווחו על קושי רב יותר להתרכז בשיעורי הבוקר. ממצאים אלה מצביעים על כך שהאוניברסיטאות צריכות להעלות את המודעות להרגלי שינה בריאים.","ru":"В этом исследовании изучалось влияние использования смартфона на качество сна студентов университета. В общей сложности 240 израильских студентов бакалавриата заполнили онлайн-анкету о своих вечерних привычках. Участники также в течение двух недель записывали свой сон с помощью мобильного приложения. Результаты показали, что студенты, пользовавшиеся телефоном в постели, спали в среднем на 40 минут меньше. Они также сообщали о больших трудностях с концентрацией на утренних занятиях. Эти данные указывают на то, что университетам следует повышать осведомлённость о здоровых привычках сна.","ar":"درست هذه الدراسة تأثير استخدام الهاتف الذكي على جودة نوم طلاب الجامعات. أكمل ما مجموعه 240 طالبًا جامعيًا في إسرائيل استبيانًا إلكترونيًا عن عاداتهم المسائية. كما سجّل المشاركون نومهم لمدة أسبوعين باستخدام تطبيق على الهاتف. أظهرت النتائج أن الطلاب الذين استخدموا هواتفهم في السرير ناموا في المتوسط 40 دقيقة أقل. كما أفادوا بصعوبة أكبر في التركيز خلال محاضرات الصباح. تشير هذه النتائج إلى أن على الجامعات زيادة الوعي بعادات النوم الصحية.","questions":[["How many students participated?","240","40","24","2,400"],["How was sleep measured?","With a mobile application","In a sleep laboratory","By their parents","By lecturers"],["What did students who used phones in bed report?","Difficulty concentrating","Better grades","More energy","Longer sleep"]]}},{"en":"emailing lecturers","he":"מיילים למרצים","ru":"письма преподавателям","ar":"مراسلة المحاضرين","e":"✉️","items":[{"en":"Dear Dr. Levi, I hope this email finds you well.","he":"שלום ד״ר לוי, מקווה שהכול טוב אצלך.","ru":"Уважаемый доктор Леви, надеюсь, у вас всё хорошо.","ar":"عزيزي الدكتور ليفي، آمل أن تكون بخير.","e":"","alt":[]},{"en":"I am writing to ask about the assignment deadline.","he":"אני כותב/ת כדי לשאול לגבי מועד ההגשה של העבודה.","ru":"Я пишу, чтобы уточнить срок сдачи задания.","ar":"أكتب للاستفسار عن الموعد النهائي لتسليم الواجب.","e":"","alt":[]},{"en":"Would it be possible to receive a short extension?","he":"האם יהיה אפשר לקבל הארכה קצרה?","ru":"Можно ли получить небольшое продление срока?","ar":"هل من الممكن الحصول على تمديد قصير؟","e":"","alt":[]},{"en":"Unfortunately, I was unable to attend last week's lecture.","he":"לצערי, לא יכולתי להגיע להרצאה בשבוע שעבר.","ru":"К сожалению, я не смог(ла) присутствовать на лекции на прошлой неделе.","ar":"للأسف، لم أتمكن من حضور محاضرة الأسبوع الماضي.","e":"","alt":[]},{"en":"I have attached a medical certificate for your reference.","he":"צירפתי אישור רפואי לעיונך.","ru":"Прилагаю медицинскую справку для вашего сведения.","ar":"أرفقت شهادة طبية للاطلاع عليها.","e":"","alt":[]},{"en":"Thank you for your time, and I look forward to your reply.","he":"תודה על זמנך, אשמח לתשובתך.","ru":"Спасибо за ваше время, с нетерпением жду вашего ответа.","ar":"شكرًا على وقتك، وأتطلع إلى ردك.","e":"","alt":[]}],"reading":{"en":"Dear Professor Cohen, my name is Yael Mizrahi, and I am a second-year student in your Introduction to Sociology course. I am writing to ask whether it would be possible to submit my final paper one week late. Unfortunately, I was hospitalized last week and could not work on the assignment. I have attached a medical certificate for your reference. I would be very grateful for your understanding. Best regards, Yael Mizrahi.","he":"לכבוד פרופ׳ כהן, שמי יעל מזרחי, ואני סטודנטית בשנה השנייה בקורס מבוא לסוציולוגיה שלך. אני כותבת כדי לשאול אם אפשר להגיש את העבודה הסופית שלי באיחור של שבוע. לצערי, אושפזתי בשבוע שעבר ולא יכולתי לעבוד על המטלה. צירפתי אישור רפואי לעיונך. אודה מאוד על הבנתך. בברכה, יעל מזרחי.","ru":"Уважаемый профессор Коэн, меня зовут Яэль Мизрахи, я студентка второго курса и посещаю ваш курс «Введение в социологию». Я пишу, чтобы узнать, можно ли сдать мою итоговую работу на неделю позже. К сожалению, на прошлой неделе я была госпитализирована и не могла работать над заданием. Прилагаю медицинскую справку для вашего сведения. Буду очень благодарна за понимание. С уважением, Яэль Мизрахи.","ar":"حضرة البروفيسور كوهين المحترم، اسمي ياعيل مزراحي، وأنا طالبة في السنة الثانية في مساق مقدمة في علم الاجتماع الذي تدرّسه. أكتب لأسأل إن كان من الممكن تسليم بحثي النهائي متأخرة أسبوعًا واحدًا. للأسف، دخلت المستشفى الأسبوع الماضي ولم أتمكن من العمل على المهمة. أرفقت شهادة طبية للاطلاع عليها. سأكون ممتنة جدًا لتفهّمك. مع خالص التحيات، ياعيل مزراحي.","questions":[["What is Yael asking for?","A one-week extension","A higher grade","A new topic","A meeting"],["Why couldn't she work on the paper?","She was in hospital","She was abroad","She lost her laptop","She was working"],["What did she attach to the email?","A medical certificate","Her final paper","A photo","Her grades"]]}},{"en":"presentations","he":"מצגות וסמינרים","ru":"презентации и семинары","ar":"العروض التقديمية والندوات","e":"🎤","items":[{"en":"Today I'm going to talk about renewable energy in Israel.","he":"היום אדבר על אנרגיה מתחדשת בישראל.","ru":"Сегодня я расскажу о возобновляемой энергии в Израиле.","ar":"سأتحدث اليوم عن الطاقة المتجددة في إسرائيل.","e":"","alt":[]},{"en":"My presentation is divided into three main parts.","he":"המצגת שלי מחולקת לשלושה חלקים עיקריים.","ru":"Моя презентация состоит из трёх основных частей.","ar":"ينقسم عرضي إلى ثلاثة أجزاء رئيسية.","e":"","alt":[]},{"en":"As you can see in this slide, sales increased.","he":"כפי שאפשר לראות בשקופית הזאת, המכירות עלו.","ru":"Как видно на этом слайде, продажи выросли.","ar":"كما ترون في هذه الشريحة، ارتفعت المبيعات.","e":"","alt":[]},{"en":"Let me move on to the next point.","he":"אעבור עכשיו לנקודה הבאה.","ru":"Позвольте перейти к следующему пункту.","ar":"دعوني أنتقل إلى النقطة التالية.","e":"","alt":[]},{"en":"To sum up, the evidence supports our main hypothesis.","he":"לסיכום, הראיות תומכות בהשערה המרכזית שלנו.","ru":"Подводя итог, данные подтверждают нашу основную гипотезу.","ar":"باختصار، تدعم الأدلة فرضيتنا الرئيسية.","e":"","alt":[]},{"en":"Thank you for listening; are there any questions?","he":"תודה על ההקשבה; יש שאלות?","ru":"Спасибо за внимание; есть ли вопросы?","ar":"شكرًا على الاستماع؛ هل هناك أي أسئلة؟","e":"","alt":[]}],"reading":{"en":"Giving a seminar presentation is a common requirement in many university courses. A good presentation begins with a clear introduction that states the topic and the structure. Each slide should contain only a few key points, not long paragraphs of text. Speakers are advised to make eye contact with the audience and to speak slowly. At the end, a short summary helps listeners remember the main arguments. Finally, presenters should prepare for questions by anticipating possible criticism.","he":"הצגת מצגת בסמינר היא דרישה נפוצה בקורסים רבים באוניברסיטה. מצגת טובה מתחילה בפתיחה ברורה שמציגה את הנושא ואת המבנה. כל שקופית צריכה לכלול רק כמה נקודות מפתח, ולא פסקאות ארוכות של טקסט. מומלץ לדוברים ליצור קשר עין עם הקהל ולדבר לאט. בסוף, סיכום קצר עוזר למאזינים לזכור את הטיעונים המרכזיים. לבסוף, על המציגים להתכונן לשאלות על ידי צפייה מראש של ביקורת אפשרית.","ru":"Выступление с презентацией на семинаре — обычное требование во многих университетских курсах. Хорошая презентация начинается с чёткого вступления, в котором названы тема и структура. На каждом слайде должно быть лишь несколько ключевых пунктов, а не длинные абзацы текста. Выступающим советуют смотреть в глаза слушателям и говорить медленно. В конце краткое резюме помогает слушателям запомнить главные аргументы. Наконец, докладчикам следует готовиться к вопросам, заранее предвидя возможную критику.","ar":"يُعدّ تقديم عرض في الندوة متطلبًا شائعًا في كثير من المساقات الجامعية. يبدأ العرض الجيد بمقدمة واضحة تحدد الموضوع والبنية. يجب أن تحتوي كل شريحة على بضع نقاط رئيسية فقط، لا على فقرات طويلة من النص. يُنصح المتحدثون بالتواصل البصري مع الجمهور والتحدث ببطء. وفي النهاية، يساعد ملخص قصير المستمعين على تذكّر الحجج الرئيسية. وأخيرًا، ينبغي للمقدّمين الاستعداد للأسئلة من خلال توقّع الانتقادات المحتملة.","questions":[["What should a good introduction state?","The topic and the structure","The final grade","Only the conclusion","The speaker's biography"],["What should each slide contain?","A few key points","Long paragraphs","Only pictures","All the data"],["How can presenters prepare for questions?","By anticipating criticism","By speaking faster","By skipping the summary","By avoiding eye contact"]]}},{"en":"linking and hedging","he":"מילות קישור והסתייגות","ru":"связки и смягчение","ar":"أدوات الربط والتحوّط","e":"🔗","items":[{"en":"However, the results were not statistically significant.","he":"עם זאת, התוצאות לא היו מובהקות סטטיסטית.","ru":"Однако результаты не были статистически значимыми.","ar":"ومع ذلك، لم تكن النتائج ذات دلالة إحصائية.","e":"","alt":[]},{"en":"Furthermore, the method is cheaper and easier to use.","he":"יתרה מזאת, השיטה זולה יותר וקלה יותר לשימוש.","ru":"Кроме того, этот метод дешевле и проще в использовании.","ar":"علاوة على ذلك، الطريقة أرخص وأسهل في الاستخدام.","e":"","alt":[]},{"en":"These results may indicate a link between stress and illness.","he":"ייתכן שתוצאות אלה מצביעות על קשר בין לחץ למחלה.","ru":"Эти результаты могут указывать на связь между стрессом и болезнью.","ar":"قد تشير هذه النتائج إلى وجود صلة بين التوتر والمرض.","e":"","alt":[]},{"en":"It seems likely that the policy will be effective.","he":"נראה סביר שהמדיניות תהיה אפקטיבית.","ru":"Представляется вероятным, что эта политика будет эффективной.","ar":"يبدو من المرجح أن تكون السياسة فعّالة.","e":"","alt":[]},{"en":"Therefore, the hypothesis was only partly confirmed.","he":"לכן, ההשערה אוששה רק באופן חלקי.","ru":"Поэтому гипотеза подтвердилась лишь частично.","ar":"لذلك، تأكدت الفرضية جزئيًا فقط.","e":"","alt":[]},{"en":"In contrast, the second group showed no improvement.","he":"לעומת זאת, הקבוצה השנייה לא הראתה שיפור.","ru":"Напротив, вторая группа не показала улучшения.","ar":"في المقاب
