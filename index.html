function vocab(){
  app.innerHTML=`<div class="top"><button class="x" id="back">→</button><h2 class="grow">📚 אוצר מילים</h2></div>
   <button class="tile dv" id="vh"><span class="e">🔤</span><b>מילים גבוהות בעברית</b><span class="label">${(C.vocab.he||[]).length} מילים</span></button>
   <button class="tile de" id="ve"><span class="e">🇬🇧</span><b>English Words</b><span class="label">${(C.vocab.en||[]).length} words</span></button>
   <p class="label">כרטיסיות: לוחצים כדי להפוך, ומסמנים "ידעתי" או "עוד לא". מילים שלא ידעתם יחזרו יותר.</p>`;
  $("#back").onclick=home;$("#vh").onclick=()=>cards("he");$("#ve").onclick=()=>cards("en");
}
function cards(l){
  const L=C.vocab[l]||[];const V=S.vocab[l]=S.vocab[l]||{};
  const deck=shuffle(L).sort((a,b)=>(V[a.w]||0)-(V[b.w]||0)).slice(0,20);let i=0,known=0;
  const draw=()=>{if(i>=deck.length){app.innerHTML=`<div class="card center"><h2>ידעתם ${known} מתוך ${deck.length}</h2></div><button class="btn wide" id="ag">עוד 20 מילים</button><button class="btn ghost wide" id="bk">חזרה</button>`;$("#ag").onclick=()=>cards(l);$("#bk").onclick=vocab;return}
    const w=deck[i];let flipped=false;
    app.innerHTML=`<div class="top"><button class="x" id="back">→</button><div class="grow"><div class="bar"><i style="width:${i/deck.length*100}%"></i></div></div><span class="chip">${i+1}/${deck.length}</span></div>
     <div class="card flash" id="fc" ${l==="en"?'dir="ltr" lang="en"':""}><div>${esc(w.w)}<div class="label">לחצו כדי לראות פירוש</div></div></div>
     <button class="link" id="sp">🔊 הקראה</button>
     <div class="row"><button class="btn ghost" id="no">עוד לא 🤔</button><button class="btn" id="yes">ידעתי ✅</button></div>`;
    $("#back").onclick=vocab;$("#sp").onclick=()=>speakIt(w.w,l==="en");
    $("#fc").onclick=()=>{flipped=!flipped;$("#fc").innerHTML=flipped?`<div class="back"><b>${esc(w.m)}</b><div class="label" style="margin-top:8px" ${l==="en"?'dir="ltr"':""}>${esc(w.ex)}</div></div>`:`<div>${esc(w.w)}</div>`};
    $("#yes").onclick=()=>{V[w.w]=(V[w.w]||0)+1;known++;S.stars++;save();i++;draw()};$("#no").onclick=()=>{V[w.w]=Math.max(-3,(V[w.w]||0)-1);save();i++;draw()};
  };draw();
}
/* ===== family ===== */
const FAM_APP="psy";
function famStats(){const sv=domStats("v"),sq=domStats("q"),se=domStats("e"),l=S.sims.slice(-1)[0],n=S.days[today()]||0;return {est:l?l.est.g:"",v:sv.pct,q:sq.pct,e:se.pct,stars:S.stars,todayN:n,today:n>=30?1:0}}
const famEmoji=()=>"🎓",famHome=()=>home();
/* ===================== Family: shared parent view + competition ===================== */
const FAM_API=/myinspire\.co\.il$/.test(location.hostname)?"/api/family.php":"https://"+(FAM_APP==="math"?"yallamath":FAM_APP==="theory"?"yallatheory":FAM_APP==="psy"?"yallapsy":"yallaenglish")+".myinspire.co.il/api/family.php";
async function famCall(b){try{const r=await fetch(FAM_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return await r.json()}catch(e){return {error:"net"}}}
function famDay(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function famWeek(){
  S.starHist=S.starHist||{};const t=famDay();if(S.starHist[t]==null)S.starHist[t]=S.stars;
  const old=new Date();old.setDate(old.getDate()-7);const cut=famDay(old);
  for(const k of Object.keys(S.starHist))if(k<famDay(new Date(Date.now()-15*864e5)))delete S.starHist[k];
  const keys=Object.keys(S.starHist).filter(k=>k>=cut).sort();const base=keys.length?S.starHist[keys[0]]:S.stars;
  return Math.max(0,S.stars-base);
}
let famLast=0;
async function famSync(force){
  if(!S.fam||!S.fam.code)return null;if(!force&&Date.now()-famLast<60000)return null;famLast=Date.now();
  const st=Object.assign({week:famWeek()},famStats());save();
  return famCall({action:"sync",code:S.fam.code,id:S.fam.id,app:FAM_APP,role:S.fam.role,name:(S.name||"").slice(0,20)||"ללא שם",e:famEmoji(),stats:st});
}
function famMedal(i){return ["🥇","🥈","🥉"][i]||"⭐"}
async function famScreen(){
  if(!S.fam||!S.fam.code)return famJoin();
  app.innerHTML=`<div class="top"><button class="x" id="back" aria-label="חזרה">→</button><h2 class="grow">👨‍👩‍👧 המשפחה שלנו</h2></div><div class="card center"><div class="label">טוען…</div></div>`;
  $("#back").onclick=famHome;
  const d=await famSync(true)||await famCall({action:"get",code:S.fam.code});
  if(!d||d.error){app.querySelector(".card").innerHTML=`<p>${d&&d.error==="nofamily"?"קוד המשפחה לא נמצא.":"לא הצלחתי להתחבר. בדקו את האינטרנט ונסו שוב."}</p><button class="btn ghost" id="lv">יציאה מהמשפחה</button>`;$("#lv").onclick=()=>{delete S.fam;save();famJoin()};return}
  const kids={};
  for(const m of d.members){if(m.role==="parent")continue;const k=(m.name||"").trim().toLowerCase();const K=kids[k]=kids[k]||{name:m.name,e:m.e,apps:{},week:0,today:0,t:0};K.apps[m.app]=m.stats||{};K.week+=+(m.stats&&m.stats.week)||0;K.today=K.today||+(m.stats&&m.stats.today)||0;K.t=Math.max(K.t,m.t||0);if(m.e)K.e=m.e}
  const list=Object.values(kids).sort((a,b)=>b.week-a.week);
  const ago=t=>{const m=Math.round((Date.now()/1000-t)/60);return m<2?"עכשיו":m<60?`לפני ${m} דקות`:m<1440?`לפני ${Math.round(m/60)} שעות`:`לפני ${Math.round(m/1440)} ימים`};
  const en=s=>s?`<div class="fam-app">📘 <b>אנגלית:</b> ${esc(s.course||"")} · ${s.lessons||0} שיעורים${s.avg!=null&&s.avg!==""?` · ממוצע ${s.avg}`:""}${s.streak?` · 🔥 ${s.streak} ימים ברצף`:""}${s.test!=null&&s.test!==""?` · מבחן אחרון ${s.test}`:""}</div>`:"";
  const ma=s=>s?`<div class="fam-app">🔢 <b>מתמטיקה:</b> ${esc(s.grade||"")} · ${s.mastered||0}/${s.topics||0} נושאים בשליטה · הצלחה ${s.avg||0}%${s.test!=null&&s.test!==""?` · מבחן אחרון ${s.test}`:""}${s.todayN?` · היום ${s.todayN} שאלות`:""}</div>`:"";
  const ps=s=>s?`<div class="fam-app">🎓 <b>פסיכומטרי:</b> ${s.est?`ציון משוער ${s.est} · `:""}מילולי ${s.v||0}% · כמותי ${s.q||0}% · אנגלית ${s.e||0}%${s.todayN?` · היום ${s.todayN} שאלות`:""}</div>`:"";
  const th=s=>s?`<div class="fam-app">🚦 <b>תאוריה:</b> רישיון ${esc(s.license||"")} · ${s.mastered||0}/${s.total||0} שאלות נכונות${s.exam!=null&&s.exam!==""?` · מבחן אחרון ${s.exam}/30`:""}${s.todayN?` · היום ${s.todayN} שאלות`:""}</div>`:"";
  app.innerHTML=`<div class="top"><button class="x" id="back" aria-label="חזרה">→</button><h2 class="grow">👨‍👩‍👧 ${esc(d.family||"המשפחה שלנו")}</h2><button class="x" id="rf" aria-label="רענון">🔄</button></div>
   <div class="card fam-code"><div class="label">קוד המשפחה</div><div class="code" dir="ltr">${S.fam.code}</div><button class="btn ghost" id="sh">📤 שיתוף הקוד</button></div>
   <div class="card"><h3>🏆 תחרות השבוע</h3><p class="label">כוכבים שנאספו ב-7 הימים האחרונים, בשתי האפליקציות יחד</p>
   ${list.length?list.map((k,i)=>`<div class="fam-row"><span class="m">${famMedal(i)}</span><span class="e">${k.e||"🙂"}</span><b class="grow">${esc(k.name)}</b><span>⭐ ${k.week}</span><span title="אתגר יומי">${k.today?"✅":"⏳"}</span></div>`).join(""):`<p>עוד אין ילדים במשפחה. הכניסו את הקוד באפליקציה של כל ילד.</p>`}
   <p class="label">✅ = עשו היום את האתגר היומי: שיעור יומי באנגלית, 10 שאלות במתמטיקה או 20 שאלות תאוריה</p></div>
   ${list.map(k=>`<div class="card fam-kid"><div class="fam-row"><span class="e">${k.e||"🙂"}</span><b class="grow">${esc(k.name)}</b><span class="label">${ago(k.t)}</span></div>${en(k.apps.english)}${ma(k.apps.math)}${th(k.apps.theory)}${ps(k.apps.psy)}</div>`).join("")}
   <button class="link" id="lv">יציאה מהמשפחה במכשיר הזה</button>`;
  $("#back").onclick=famHome;$("#rf").onclick=famScreen;
  $("#sh").onclick=async()=>{const t=`הצטרפו למשפחה שלנו ב-Yalla! קוד המשפחה: ${S.fam.code}`;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(S.fam.code);$("#sh").textContent="✅ הקוד הועתק"}}catch(e){}};
  $("#lv").onclick=async()=>{await famCall({action:"leave",code:S.fam.code,id:S.fam.id});delete S.fam;save();famHome()};
}
function famJoin(){
  app.innerHTML=`<div class="top"><button class="x" id="back" aria-label="חזרה">→</button><h2 class="grow">👨‍👩‍👧 משפחה</h2></div>
   <div class="card"><h3>מה זה?</h3><p>מחברים את כל הילדים לקוד משפחה אחד. ההורים רואים את ההתקדמות של כולם במסך אחד, באנגלית, במתמטיקה ובתאוריה, ויש תחרות כוכבים שבועית ואתגר יומי.</p><p class="label">נשמרים רק שם פרטי ונתוני למידה (כוכבים, שיעורים, ציונים).</p></div>
   <div class="card"><h3>הורה? צרו משפחה</h3><div class="field"><label class="label" for="fn">שם המשפחה (לא חובה)</label><input id="fn" maxlength="30" placeholder="למשל: משפחת כהן"></div><button class="btn wide" id="cr">יצירת קוד משפחה</button></div>
   <div class="card"><h3>יש לכם קוד? הצטרפו</h3><div class="field"><label class="label" for="fc">קוד המשפחה</label><input id="fc" maxlength="8" dir="ltr" autocapitalize="characters" placeholder="ABCD2345" style="text-align:center;letter-spacing:3px;font-size:22px"></div>
   <label class="chk"><input type="checkbox" id="fp"> אני הורה (לא להציג אותי בתחרות)</label><button class="btn wide" id="jn">הצטרפות</button><div class="label" id="fe"></div></div>`;
  $("#back").onclick=famHome;
  const id=()=>(S.fam&&S.fam.id)||Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,"0")).join("");
  $("#cr").onclick=async()=>{const d=await famCall({action:"create",family:$("#fn").value.trim()});if(!d.code){$("#cr").textContent="לא הצלחתי, נסו שוב";return}S.fam={code:d.code,id:id(),role:"parent"};save();famScreen()};
  $("#jn").onclick=async()=>{const c=$("#fc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length!==8){$("#fe").textContent="הקוד צריך להיות 8 תווים";return}
    S.fam={code:c,id:id(),role:$("#fp").checked?"parent":"kid"};const d=await famSync(true);if(!d||d.error){$("#fe").textContent=d&&d.error==="nofamily"?"הקוד לא נמצא. בדקו שהקלדתם נכון.":"לא הצלחתי להתחבר. נסו שוב.";delete S.fam;save();return}save();famScreen()};
}

/* ===== back navigation ===== */
(function(){
  const go=()=>{stopVoice();clearInterval(TIMER);X=null;home();scrollTo(0,0)};
  addEventListener("popstate",()=>{if(!app.querySelector("[data-home-screen]"))go()});
  new MutationObserver(()=>{const atHome=!!app.querySelector("[data-home-screen]");try{if(atHome){if(!history.state||!history.state.home)history.replaceState({home:1},"")}else if(!history.state||!history.state.inner)history.pushState({inner:1},"")}catch(e){}}).observe(app,{childList:true});
})();
if(S.pausedSim){X={sim:S.pausedSim}}
home();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>
