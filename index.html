of the claim largely been rejected?","Speakers of any language can learn new concepts","No language uses fixed directions","Children cannot learn directions early","Linguists have never studied these communities"],["The word 'revived' in paragraph 3 is closest in meaning to…","brought back","settled","invented","ignored"],["What can be inferred about learning a foreign language, according to the writer?","It may train learners to notice the world differently","It is mainly a matter of memorising word lists","It permanently changes a person's personality","It is impossible after childhood"]],"North of Your Left Hand"],["Today it seems obvious that everyone in a country should share the same time. Yet until the second half of the nineteenth century, most towns kept their own local time, based on the position of the sun. When the sun stood highest in the sky, it was noon. Because the sun appears to move from east to west, a town only a short distance to the west would reach noon a few minutes later than its neighbour. For centuries, this caused few problems. Travel was slow, and a difference of several minutes hardly mattered to someone arriving by horse.\n\nThe railway changed everything. Trains could cover in hours distances that had once taken days, and timetables had to be precise. With dozens of local times in use, a single journey might involve several clocks showing different hours. Passengers missed connections, and, more seriously, the confusion increased the risk of collisions on shared tracks.\n\nRailway companies were the first to act. They adopted a standard time along their lines, usually based on the clock of a major city. At first, many communities resisted. Some residents felt that abandoning 'sun time' meant surrendering a local tradition to distant business interests. In certain towns, public clocks were fitted with two minute hands, one showing local time and the other railway time.\n\nEventually, however, practical needs prevailed. Governments formally adopted standard time, and international agreements later divided the world into time zones. What had begun as a solution to a technical problem became a basic structure of modern life.\n\nThe story is a reminder that many arrangements we take for granted were once controversial. Even something as seemingly natural as the time on our watches is, in fact, the result of human decisions, negotiation and compromise.","כיום נראה מובן מאליו שכל האנשים במדינה צריכים לחלוק את אותה שעה. אולם עד המחצית השנייה של המאה התשע־עשרה, רוב העיירות ניהלו שעה מקומית משלהן, על פי מיקום השמש. כשהשמש עמדה בנקודה הגבוהה ביותר בשמיים, הייתה זו שעת הצהריים. מאחר שהשמש נראית נעה ממזרח למערב, עיירה שנמצאת מרחק קצר מערבה הגיעה לצהריים כמה דקות אחרי שכנתה. במשך מאות שנים זה כמעט לא גרם לבעיות. הנסיעות היו איטיות, והפרש של כמה דקות כמעט לא שינה דבר למי שהגיע על סוס.\n\nהרכבת שינתה הכול. רכבות יכלו לעבור בתוך שעות מרחקים שבעבר נדרשו ימים כדי לעבור אותם, ולוחות הזמנים היו צריכים להיות מדויקים. כשעשרות שעות מקומיות היו בשימוש, נסיעה אחת עשויה הייתה לכלול כמה שעונים שמראים שעות שונות. נוסעים החמיצו רכבות המשך, ובאופן חמור יותר, הבלבול הגביר את הסכנה להתנגשויות על מסילות משותפות.\n\nחברות הרכבת היו הראשונות לפעול. הן אימצו שעה תקנית לאורך הקווים שלהן, בדרך כלל על פי השעון של עיר מרכזית. בתחילה, קהילות רבות התנגדו. חלק מהתושבים הרגישו שוויתור על \"שעון השמש\" פירושו כניעה של מסורת מקומית לאינטרסים עסקיים מרוחקים. בעיירות מסוימות הותקנו בשעונים הציבוריים שני מחוגי דקות, אחד שהראה את השעה המקומית והשני את שעת הרכבת.\n\nאולם בסופו של דבר, הצרכים המעשיים גברו. ממשלות אימצו באופן רשמי שעה תקנית, והסכמים בינלאומיים חילקו מאוחר יותר את העולם לאזורי זמן. מה שהתחיל כפתרון לבעיה טכנית הפך למבנה בסיסי של החיים המודרניים.\n\nהסיפור הזה מזכיר שהסדרים רבים שאנו רואים כמובנים מאליהם היו בעבר שנויים במחלוקת. אפילו דבר שנראה טבעי כמו השעה בשעון שלנו הוא, למעשה, תוצאה של החלטות אנושיות, משא ומתן ופשרה.",[["Before standard time, how did towns determine noon?","By the moment the sun was highest in the sky","By the arrival of the first train","By a clock in the nearest major city","By international agreement"],["Why did local time differences cause few problems before the railway?","Travel was too slow for a few minutes to matter","All towns were located at the same longitude","People did not use clocks at all","Governments punished anyone who was late"],["Why were some public clocks fitted with two minute hands?","To show both local time and railway time","To make them easier to read from far away","To replace a broken hand quickly","To show the time in two different countries"],["The word 'prevailed' in paragraph 4 is closest in meaning to…","won out","disappeared","were postponed","were questioned"],["What is the main purpose of the final paragraph?","To draw a general lesson from the historical example","To describe how time zones are calculated","To criticise the railway companies","To introduce a new historical event"]],"When Time Became Standard"],["Have you ever noticed that coffee shops often offer three cup sizes, and that the medium one seems like the obvious choice? This is rarely an accident. Economists who study consumer behaviour have shown that our decisions are strongly influenced by the options placed beside the one we eventually choose.\n\nConsider a well-known kind of experiment. Participants are offered a subscription to a magazine in one of two forms: online only, for a low price, or print plus online, for a much higher price. Most people choose the cheaper option. Then researchers add a third choice: print only, at exactly the same high price as print plus online. Hardly anyone selects this new option, since it is clearly worse value. Yet its presence changes everything. Suddenly, a large majority of participants choose the expensive combined package.\n\nThe third option is known as a 'decoy'. It exists not to be bought but to make another product look attractive by comparison. Because people find it difficult to judge value in absolute terms, they rely on relative comparisons. When one option is obviously superior to a similar alternative, it appears to be a bargain, even if we would not have chosen it otherwise.\n\nDecoys are used widely, from restaurant menus, where a very expensive dish makes other dishes seem reasonable, to electronics stores and holiday packages. Some critics consider the practice manipulative, arguing that it exploits weaknesses in human reasoning. Businesses reply that they are simply presenting choices and that customers remain free to decide.\n\nEither way, awareness is the consumer's best defence. Before choosing, it is worth asking a simple question: would I still want this option if the others were not there? The answer may save more money than any discount.","שמתם לב פעם שבתי קפה מציעים לעתים קרובות שלושה גדלים של כוסות, ושהבינונית נראית כמו הבחירה המתבקשת? זה כמעט אף פעם לא מקרי. כלכלנים שחוקרים התנהגות צרכנים הראו שההחלטות שלנו מושפעות מאוד מהאפשרויות שמוצגות לצד האפשרות שבה אנו בוחרים בסופו של דבר.\n\nחשבו על סוג מוכר של ניסוי. למשתתפים מוצע מינוי למגזין באחת משתי צורות: דיגיטלי בלבד, במחיר נמוך, או מודפס ודיגיטלי, במחיר גבוה בהרבה. רוב האנשים בוחרים באפשרות הזולה. אז מוסיפים החוקרים אפשרות שלישית: מודפס בלבד, באותו מחיר גבוה בדיוק כמו המודפס והדיגיטלי. כמעט אף אחד לא בוחר באפשרות החדשה, מכיוון שברור שהתמורה בה גרועה יותר. ובכל זאת, עצם נוכחותה משנה הכול. לפתע, רוב גדול של המשתתפים בוחר בחבילה המשולבת היקרה.\n\nהאפשרות השלישית מכונה \"פיתיון\". היא קיימת לא כדי שיקנו אותה, אלא כדי לגרום למוצר אחר להיראות אטרקטיבי בהשוואה אליה. מאחר שקשה לאנשים להעריך ערך במונחים מוחלטים, הם מסתמכים על השוואות יחסיות. כאשר אפשרות אחת עדיפה בבירור על חלופה דומה, היא נראית כמו מציאה, גם אם לא היינו בוחרים בה אחרת.\n\nנעשה שימוש נרחב בפיתיונות, החל מתפריטי מסעדות, שבהם מנה יקרה מאוד גורמת למנות אחרות להיראות סבירות, ועד לחנויות אלקטרוניקה ולחבילות נופש. יש מבקרים שרואים בשיטה מניפולציה, וטוענים שהיא מנצלת חולשות בחשיבה האנושית. העסקים משיבים שהם פשוט מציגים אפשרויות בחירה ושהלקוחות נשארים חופשיים להחליט.\n\nכך או כך, מודעות היא ההגנה הטובה ביותר של הצרכן. לפני שבוחרים, כדאי לשאול שאלה פשוטה: האם עדיין הייתי רוצה באפשרות הזו אילו האחרות לא היו שם? התשובה עשויה לחסוך יותר כסף מכל הנחה.",[["What is the passage mainly about?","How an unattractive option can influence our choices","Why coffee shops charge too much for coffee","How magazines attract new subscribers online","Why discounts are the best way to save money"],["What happened when the 'print only' option was added?","Most participants chose the expensive combined package","Most participants chose the 'print only' option","Most participants refused to subscribe at all","Most participants still chose the online option"],["In the sentence 'It exists not to be bought…', what does 'It' refer to?","The decoy option","The cheapest option","The magazine","The experiment"],["According to the passage, why does a very expensive dish appear on some menus?","To make other dishes seem reasonably priced","Because many customers order it","To attract famous chefs to the restaurant","Because its ingredients are rare"],["What is the writer's purpose in the last paragraph?","To give readers practical advice","To defend businesses that use decoys","To describe another experiment","To criticise economists"]],"The Decoy on the Menu"],["When a famous painting is cleaned and restored, the result is often celebrated as a rediscovery. Colours that had been hidden for centuries under layers of dirt and yellowed varnish suddenly glow again, and viewers feel they are seeing the work as the artist intended. Yet restoration is one of the most controversial activities in the art world, and every major project tends to divide experts.\n\nThe central difficulty is that no one can be entirely sure what the artist intended. Paintings change over time in ways that are not always reversible. Pigments fade or darken, and earlier restorers may have added paint of their own. When a conservator removes a layer, there is a risk of removing something the artist placed there deliberately, such as a thin glaze designed to soften a bright colour. Once removed, such details cannot be recovered.\n\nFor this reason, many modern conservators follow a principle of minimal intervention. They aim to stabilise a work and protect it from further damage rather than to make it look new. Any additions they make are designed to be reversible, so that future experts, with better tools and knowledge, can undo them.\n\nOthers argue that this cautious approach goes too far. A painting covered in grime, they say, cannot communicate with its audience. If careful research shows what the original surface looked like, conservators have a duty to reveal it.\n\nPerhaps the debate cannot be fully resolved, because it reflects a deeper uncertainty about what a work of art really is. Is it the object as it left the artist's studio, or the object as it exists now, including the marks that time has left on it? Each answer leads to a different idea of what it means to care for the past.","כאשר ציור מפורסם מנוקה ומשוחזר, התוצאה זוכה לעתים קרובות להתלהבות כגילוי מחדש. צבעים שהיו מוסתרים במשך מאות שנים מתחת לשכבות של לכלוך ולכה מצהיבה זוהרים לפתע שוב, והצופים מרגישים שהם רואים את היצירה כפי שהאמן התכוון. אולם שחזור הוא אחת הפעילויות השנויות ביותר במחלוקת בעולם האמנות, וכל פרויקט גדול נוטה לפלג את המומחים.\n\nהקושי המרכזי הוא שאיש אינו יכול להיות בטוח לחלוטין למה האמן התכוון. ציורים משתנים עם הזמן בדרכים שלא תמיד ניתן להפוך. פיגמנטים דוהים או מכהים, ומשחזרים קודמים אולי הוסיפו צבע משלהם. כאשר משמר מסיר שכבה, קיים סיכון להסיר משהו שהאמן הניח שם במכוון, כמו שכבת זיגוג דקה שנועדה לרכך צבע בוהק. לאחר שהוסרו, פרטים כאלה אינם ניתנים לשחזור.\n\nמסיבה זו, משמרים מודרניים רבים פועלים לפי עיקרון של התערבות מינימלית. הם שואפים לייצב את היצירה ולהגן עליה מפני נזק נוסף, ולא לגרום לה להיראות חדשה. כל תוספת שהם מבצעים מתוכננת להיות הפיכה, כך שמומחים בעתיד, עם כלים וידע טובים יותר, יוכלו לבטל אותה.\n\nאחרים טוענים שהגישה הזהירה הזו מרחיקה לכת. ציור המכוסה בלכלוך, הם אומרים, אינו יכול לתקשר עם הקהל שלו. אם מחקר קפדני מראה כיצד נראה פני השטח המקורי, מוטלת על המשמרים החובה לחשוף אותו.\n\nייתכן שלא ניתן להכריע בוויכוח לחלוטין, משום שהוא משקף אי־ודאות עמוקה יותר לגבי מהי בעצם יצירת אמנות. האם זהו החפץ כפי שיצא מהסטודיו של האמן, או החפץ כפי שהוא קיים היום, כולל הסימנים שהזמן הותיר בו? כל תשובה מובילה לתפיסה שונה של מה פירוש לשמור על העבר.",[["According to the passage, why is restoration risky?","Details added deliberately by the artist may be lost forever","Modern cleaning materials always damage paintings","Museums refuse to display restored paintings","Viewers dislike bright colours"],["The word 'deliberately' in paragraph 2 is closest in meaning to…","on purpose","by accident","in a hurry","in secret"],["Why do conservators who follow minimal intervention make reversible additions?","So that future experts can undo them","So that the painting looks completely new","Because reversible materials are cheaper","Because the artist requested it"],["How is paragraph 4 related to paragraph 3?","It presents a view that opposes the approach described in paragraph 3","It gives an example that supports paragraph 3","It summarises the whole passage","It explains the history of varnish"],["According to the final paragraph, why might the debate never be settled?","People disagree about what a work of art essentially is","There are not enough trained conservators","The original paintings no longer exist","Scientists cannot analyse old pigments"]],"Restoring or Rewriting?"],["For most of human history, a clear night revealed thousands of stars. Today, a large proportion of the world's population lives under skies so bright that the Milky Way is no longer visible. Artificial light, which has transformed human life in countless positive ways, has also produced a form of pollution that is easy to overlook precisely because it seems so harmless.\n\nScientists, however, are increasingly concerned about its effects. Many animals depend on darkness. Sea turtle hatchlings, for instance, find their way to the ocean by moving towards the brightest horizon, which naturally lies over the water. Near brightly lit coastal roads, they may crawl inland instead, where few survive. Migrating birds can become disoriented by illuminated buildings, and insects that are drawn to street lamps often die of exhaustion, with consequences for the plants and animals that depend on them.\n\nHumans are affected too. Our bodies follow a daily rhythm regulated partly by light and darkness. Exposure to bright light late in the evening can disturb sleep, and some researchers suspect that long-term disruption may contribute to a range of health problems, though the evidence is still being gathered.\n\nUnlike many environmental problems, light pollution could be reduced relatively quickly and cheaply. Shielding lamps so that they shine downwards rather than into the sky, using warmer colours, and dimming or switching off lights when they are not needed would all make a significant difference. Several towns that have adopted such measures report lower energy bills as well as darker skies.\n\nThe challenge is largely one of awareness. Few people think of a lit street as a source of pollution. Yet once we recognise what has been lost, the return of a starry sky may become not merely a scientific goal but a cultural one.","במשך רוב ההיסטוריה האנושית, לילה בהיר חשף אלפי כוכבים. כיום, חלק גדול מאוכלוסיית העולם חי תחת שמיים מוארים כל כך שכבר אי אפשר לראות את שביל החלב. האור המלאכותי, ששינה את חיי האדם בדרכים חיוביות רבות מספור, יצר גם סוג של זיהום שקל להתעלם ממנו בדיוק משום שהוא נראה כה בלתי מזיק.\n\nעם זאת, מדענים מודאגים יותר ויותר מהשפעותיו. בעלי חיים רבים תלויים בחושך. גוזלי צבי ים, למשל, מוצאים את דרכם אל האוקיינוס בכך שהם נעים לעבר האופק הבהיר ביותר, שבאופן טבעי נמצא מעל המים. ליד כבישי חוף מוארים, הם עלולים לזחול במקום זאת אל היבשה, שם מעטים שורדים. ציפורים נודדות עלולות לאבד את דרכן בגלל בניינים מוארים, וחרקים שנמשכים לפנסי רחוב מתים לעתים קרובות מתשישות, עם השלכות על הצמחים ובעלי החיים שתלויים בהם.\n\nגם בני אדם מושפעים. גופנו פועל לפי מקצב יומי שמווסת בחלקו על ידי אור וחושך. חשיפה לאור חזק בשעות הערב המאוחרות עלולה לשבש את השינה, ויש חוקרים שחושדים ששיבוש ממושך עשוי לתרום למגוון בעיות בריאות, אם כי הראיות עדיין נאספות.\n\nבשונה מבעיות סביבתיות רבות, ניתן לצמצם את זיהום האור במהירות ובזול יחסית. מיגון פנסים כך שיאירו כלפי מטה ולא אל השמיים, שימוש בגוונים חמים יותר, ועמעום או כיבוי של אורות כשאין בהם צורך, כל אלה יחוללו הבדל משמעותי. כמה עיירות שאימצו צעדים כאלה מדווחות על חשבונות חשמל נמוכים יותר וגם על שמיים חשוכים יותר.\n\nהאתגר הוא בעיקר עניין של מודעות. מעטים חושבים על רחוב מואר כעל מקור לזיהום. אך ברגע שנכיר במה שאבד, החזרתם של שמיים זרועי כוכבים עשויה להפוך לא רק ליעד מדעי אלא גם ליעד תרבותי.",[["Why do sea turtle hatchlings near brightly lit roads often die?","They crawl inland, confusing the lights with the ocean horizon","The lights make the water too warm for them","Birds attracted by the lights eat them","They are hit by cars driving to the beach"],["In the sentence '…with consequences for the plants and animals that depend on them', what does 'them' refer to?","The insects","The street lamps","The migrating birds","The illuminated buildings"],["How does the writer present the effects of artificial light on human health?","As a possibility that is still being investigated","As a proven cause of serious disease","As completely harmless","As more important than its effects on animals"],["According to the passage, what makes light pollution different from many environmental problems?","It could be reduced quickly and cheaply","It affects only wealthy countries","It cannot be measured by scientists","It has no effect on energy use"],["Which statement best expresses the main idea of the passage?","Light pollution is a serious but solvable problem that needs more awareness","Artificial light has done more harm than good to humanity","Only astronomers are affected by bright night skies","Towns should switch off all street lights at night"]],"The Vanishing Dark"],["Since the first artificial satellite was launched in the 1950s, humans have sent thousands of objects into orbit around the Earth. Satellites now support weather forecasting, navigation, communication and scientific research. But space around our planet is becoming crowded, and much of what is up there is no longer useful.\n\nExperts use the term 'space debris' to describe dead satellites, discarded rocket parts and countless fragments created when objects break apart or collide. Even a tiny fragment can be dangerous. Because objects in orbit travel at extraordinary speeds, many times faster than a bullet, a piece of metal the size of a coin can strike with the force of an explosion. Spacecraft carrying astronauts must sometimes change course to avoid such pieces.\n\nThe greatest fear is a chain reaction. If two large objects collide, they may produce thousands of new fragments, each of which could hit other satellites, creating still more debris. In the worst case, certain orbits could become so dangerous that they would be unusable for generations, threatening services on which modern societies depend.\n\nSeveral solutions are being explored. Engineers have tested nets, magnets and even harpoons designed to capture old satellites and drag them down into the atmosphere, where they burn up. New satellites are increasingly designed to leave orbit at the end of their working lives. Yet technology alone cannot solve the problem. Space is shared by many countries and companies, and no single authority has the power to enforce rules.\n\nIn this sense, the challenge resembles other problems involving shared resources, such as overfishing. Each user benefits from using the resource, while the costs of damage are spread among everyone. Unless nations find ways to cooperate, the space above our heads may become as polluted as the oceans below.","מאז שוגר הלוויין המלאכותי הראשון בשנות החמישים, שלחו בני האדם אלפי עצמים למסלול סביב כדור הארץ. לוויינים תומכים כיום בחיזוי מזג האוויר, בניווט, בתקשורת ובמחקר מדעי. אבל החלל סביב כוכב הלכת שלנו נעשה צפוף, וחלק גדול ממה שנמצא שם כבר אינו שימושי.\n\nמומחים משתמשים במונח \"פסולת חלל\" כדי לתאר לוויינים מתים, חלקי טילים שהושלכו ואינספור שברים שנוצרים כאשר עצמים מתפרקים או מתנגשים. אפילו שבר זעיר עלול להיות מסוכן. מאחר שעצמים במסלול נעים במהירויות עצומות, מהר פי כמה מקליע, פיסת מתכת בגודל של מטבע יכולה לפגוע בעוצמה של פיצוץ. חלליות הנושאות אסטרונאוטים נאלצות לפעמים לשנות מסלול כדי להימנע משברים כאלה.\n\nהחשש הגדול ביותר הוא מתגובת שרשרת. אם שני עצמים גדולים מתנגשים, הם עלולים ליצור אלפי שברים חדשים, שכל אחד מהם עלול לפגוע בלוויינים אחרים וליצור פסולת נוספת. בתרחיש הגרוע ביותר, מסלולים מסוימים עלולים להפוך למסוכנים כל כך שלא יהיה ניתן להשתמש בהם במשך דורות, דבר שיאיים על שירותים שהחברה המודרנית תלויה בהם.\n\nכמה פתרונות נבחנים. מהנדסים ניסו רשתות, מגנטים ואפילו צלצלים שנועדו ללכוד לוויינים ישנים ולגרור אותם אל האטמוספרה, שם הם נשרפים. לוויינים חדשים מתוכננים יותר ויותר כך שיעזבו את המסלול בתום חייהם המבצעיים. אולם הטכנולוגיה לבדה אינה יכולה לפתור את הבעיה. החלל משותף למדינות ולחברות רבות, ואין רשות אחת שיש לה הסמכות לאכוף כללים.\n\nבמובן זה, האתגר דומה לבעיות אחרות הנוגעות למשאבים משותפים, כמו דיג־יתר. כל משתמש מפיק תועלת מהשימוש במשאב, בעוד שעלויות הנזק מתחלקות בין כולם. אם המדינות לא ימצאו דרכים לשתף פעולה, החלל שמעל ראשינו עלול להפוך למזוהם כמו האוקיינוסים שמתחתינו.",[["The word 'discarded' in paragraph 2 is closest in meaning to…","thrown away","newly built","carefully repaired","brightly coloured"],["Why can a tiny fragment of debris be so dangerous?","It travels at extremely high speed","It contains explosive chemicals","It is impossible to see from Earth","It is made of very heavy metal"],["What does the writer mean by a 'chain reaction'?","Collisions creating debris that causes further collisions","Satellites being linked together by chains","Rockets launching one after another","Countries copying each other's space programmes"],["Why does the writer say that 'technology alone cannot solve the problem'?","No single authority can enforce rules in space","The nets and harpoons have all failed","Engineers have stopped working on solutions","New satellites cannot leave orbit"],["Why does the writer compare space debris to overfishing?","Both involve shared resources whose damage costs are spread among all","Both are caused mainly by fishing companies","Both have already been solved by cooperation","Both affect only the oceans"]],"Crowded Orbits"],["Most students prepare for exams by rereading their notes and highlighting key sentences. These methods feel productive: the material becomes familiar, and familiarity creates a pleasant sense of mastery. Unfortunately, research in cognitive psychology suggests that this feeling is often misleading.\n\nIn a typical experiment, two groups of students study the same text. One group reads it several times. The other reads it once and then tries to recall as much as possible without looking, writing down whatever they remember. Immediately afterwards, the rereading group usually feels more confident. A week later, however, the picture changes: the students who practised recalling the information remember considerably more.\n\nPsychologists call this the 'testing effect', and it belongs to a broader set of findings sometimes described as 'desirable difficulties'. The idea is that learning which feels effortful tends to last longer. Spacing study sessions over several days rather than cramming the night before, mixing different types of problems instead of practising one type repeatedly, and explaining ideas in one's own words all make learning harder in the short term. Yet each of these strategies strengthens long-term memory.\n\nWhy should difficulty help? One explanation is that retrieving information from memory is not simply a way of checking what we know; it actively reorganises and reinforces that knowledge. Each successful act of recall makes the memory easier to find next time.\n\nThe findings have clear implications for teachers and learners. A classroom in which students are frequently asked to retrieve information, through low-pressure quizzes for example, may look less smooth than one in which the teacher simply presents material. But smoothness is not the goal. As one researcher put it, the sensation of learning and the reality of learning are not the same thing, and students who understand the difference are likely to study far more effectively.","רוב התלמידים מתכוננים למבחנים באמצעות קריאה חוזרת של הסיכומים שלהם וסימון משפטי מפתח. השיטות האלה מרגישות פרודוקטיביות: החומר נעשה מוכר, והמוּכרות יוצרת תחושה נעימה של שליטה. לרוע המזל, מחקרים בפסיכולוגיה קוגניטיבית מראים שהתחושה הזו מטעה לעתים קרובות.\n\nבניסוי טיפוסי, שתי קבוצות של תלמידים לומדות את אותו טקסט. קבוצה אחת קוראת אותו כמה פעמים. השנייה קוראת אותו פעם אחת ואז מנסה להיזכר בכמה שיותר בלי להסתכל, ורושמת את כל מה שהיא זוכרת. מיד אחר כך, קבוצת הקריאה החוזרת מרגישה בדרך כלל בטוחה יותר. אולם כעבור שבוע התמונה משתנה: התלמידים שתרגלו שליפה של המידע זוכרים הרבה יותר.\n\nפסיכולוגים מכנים זאת \"אפקט הבחינה\", והוא שייך לקבוצה רחבה יותר של ממצאים המתוארים לעתים כ\"קשיים רצויים\". הרעיון הוא שלמידה שמרגישה מאומצת נוטה להחזיק מעמד זמן רב יותר. פיזור מפגשי הלמידה על פני כמה ימים במקום לדחוס הכול בלילה שלפני, ערבוב של סוגי תרגילים שונים במקום לתרגל סוג אחד שוב ושוב, והסבר רעיונות במילים שלך, כל אלה מקשים על הלמידה בטווח הקצר. ובכל זאת, כל אחת מהאסטרטגיות האלה מחזקת את הזיכרון לטווח הארוך.\n\nמדוע קושי אמור לעזור? הסבר אחד הוא ששליפת מידע מהזיכרון אינה רק דרך לבדוק מה אנו יודעים; היא מארגנת מחדש ומחזקת באופן פעיל את הידע הזה. כל פעולה מוצלחת של היזכרות מקלה על מציאת הזיכרון בפעם הבאה.\n\nלממצאים יש השלכות ברורות על מורים ולומדים. כיתה שבה התלמידים מתבקשים לעתים קרובות לשלוף מידע, למשל באמצעות בחנים קצרים ללא לחץ, עשויה להיראות פחות חלקה מכיתה שבה המורה פשוט מציג את החומר. אבל חלקוּת אינה המטרה. כפי שניסח זאת אחד החוקרים, התחושה של למידה והמציאות של למידה אינן const EXTRA=[{"id":"adv","group":"adults","he":"מבוגרים מתקדמים","sub":"אנגלית יומיומית ברמה גבוהה: ניסוח, ניואנסים והבנת הנקרא","e":"🎯","units":[{"en":"renting and contracts","he":"שכירות וחוזים","ru":"аренда и договоры","ar":"الإيجار والعقود","e":"🏠","items":[{"en":"Before I sign anything, I'd like to go through the contract clause by clause.","he":"לפני שאני חותם/ת על משהו, אני רוצה לעבור על החוזה סעיף אחר סעיף.","ru":"Прежде чем что-то подписывать, я хотел(а) бы пройтись по договору пункт за пунктом.","ar":"قبل أن أوقّع على أي شيء، أودّ مراجعة العقد بندًا بندًا.","e":"","alt":[]},{"en":"Would you knock a few hundred shekels off the rent if I signed for two years?","he":"היית מוכן/ה להוריד כמה מאות שקלים משכר הדירה אם אחתום לשנתיים?","ru":"Вы бы сбросили несколько сотен шекелей с аренды, если бы я подписал(а) договор на два года?","ar":"هل تخفّض الإيجار بضع مئات من الشواكل إذا وقّعتُ لمدة سنتين؟","e":"","alt":[]},{"en":"Who is responsible for repairs if the boiler breaks down in the middle of winter?","he":"מי אחראי לתיקונים אם הדוד מתקלקל באמצע החורף?","ru":"Кто отвечает за ремонт, если бойлер сломается посреди зимы?","ar":"من المسؤول عن الإصلاحات إذا تعطّل سخّان الماء في منتصف الشتاء؟","e":"","alt":[]},{"en":"I'd rather not hand over a blank check as a guarantee, if that's all right.","he":"אני מעדיף/ה לא למסור צ'ק פתוח כבטוחה, אם זה בסדר.","ru":"Я бы предпочёл (предпочла) не оставлять незаполненный чек в качестве гарантии, если можно.","ar":"أفضّل ألا أسلّم شيكًا على بياض كضمان، إن لم يكن لديك مانع.","e":"","alt":[]},{"en":"Is there an early termination clause in case I need to move out sooner?","he":"יש סעיף יציאה מוקדמת למקרה שאצטרך לעזוב מוקדם יותר?","ru":"Есть ли пункт о досрочном расторжении на случай, если мне придётся съехать раньше?","ar":"هل يوجد بند إنهاء مبكر في حال احتجت إلى المغادرة قبل الموعد؟","e":"","alt":[]},{"en":"Had I known about the mold, I would never have agreed to move in.","he":"אילו ידעתי על העובש, לעולם לא הייתי מסכים/ה להיכנס לדירה.","ru":"Если бы я знал(а) о плесени, я бы ни за что не согласился (согласилась) въехать.","ar":"لو كنت أعلم بوجود العفن، لما وافقت أبدًا على السكن هنا.","e":"","alt":[]}],"reading":{"en":"When Tamar found a sunny three-room apartment in Ramat Gan, she was tempted to sign on the spot. The rent was slightly below the market rate, and the landlord, a retired engineer, seemed easygoing. Still, her brother had warned her never to sign a lease without reading the fine print. Sure enough, clause twelve stated that the tenant would cover all repairs, including major ones such as plumbing and electrical faults. Another clause required three months' notice before leaving, with no option to sublet. Tamar didn't want to come across as difficult, so she raised her concerns tactfully. She suggested that the landlord handle structural repairs while she took care of minor wear and tear. To her surprise, he admitted that he had copied the contract from the internet and had never really looked at it. They agreed to rewrite both clauses, and he even offered to fix the dripping kitchen tap before she moved in. Tamar signed a week later, feeling that a little patience had saved her a great deal of money and stress.","he":"כשתמר מצאה דירת שלושה חדרים מוארת ברמת גן, היא התפתתה לחתום במקום. שכר הדירה היה מעט נמוך ממחיר השוק, ובעל הדירה, מהנדס בגמלאות, נראה נוח ונעים. ובכל זאת, אחיה הזהיר אותה לעולם לא לחתום על חוזה שכירות בלי לקרוא את האותיות הקטנות. ואכן, סעיף שתים עשרה קבע שהשוכר יישא בכל התיקונים, כולל תיקונים גדולים כמו תקלות אינסטלציה וחשמל. סעיף אחר דרש הודעה של שלושה חודשים מראש לפני עזיבה, בלי אפשרות להשכרת משנה. תמר לא רצתה להיראות קשה, ולכן העלתה את החששות שלה בעדינות ובטקט. היא הציעה שבעל הדירה יטפל בתיקונים מבניים, והיא תדאג לבלאי שוטף קטן. להפתעתה, הוא הודה שהעתיק את החוזה מהאינטרנט ומעולם לא באמת קרא אותו. הם הסכימו לנסח מחדש את שני הסעיפים, והוא אפילו הציע לתקן את הברז המטפטף במטבח לפני שתיכנס. תמר חתמה כעבור שבוע, בתחושה שקצת סבלנות חסכה לה הרבה כסף ולחץ.","ru":"Когда Тамар нашла светлую трёхкомнатную квартиру в Рамат-Гане, ей очень захотелось подписать договор на месте. Аренда была немного ниже рыночной, а хозяин, инженер на пенсии, казался покладистым. И всё же брат предупреждал её никогда не подписывать договор аренды, не прочитав мелкий шрифт. И действительно, в пункте двенадцатом говорилось, что жилец оплачивает все ремонты, включая крупные, например неполадки с сантехникой и электрикой. Другой пункт требовал предупреждать о выезде за три месяца, без права субаренды. Тамар не хотела показаться трудным человеком, поэтому тактично высказала свои опасения. Она предложила, чтобы хозяин занимался капитальным ремонтом, а она — мелким износом. К её удивлению, он признался, что скопировал договор из интернета и толком его не читал. Они договорились переписать оба пункта, и он даже предложил починить капающий кран на кухне до её въезда. Тамар подписала договор через неделю, чувствуя, что немного терпения сэкономило ей много денег и нервов.","ar":"عندما وجدت تمار شقة مشمسة من ثلاث غرف في رمات غان، أغراها الأمر بالتوقيع فورًا. كان الإيجار أقل قليلًا من سعر السوق، وبدا المالك، وهو مهندس متقاعد، شخصًا سهل التعامل. ومع ذلك، كان أخوها قد حذّرها من توقيع أي عقد إيجار دون قراءة التفاصيل الدقيقة. وبالفعل، نصّ البند الثاني عشر على أن المستأجر يتحمّل جميع الإصلاحات، بما فيها الكبيرة مثل أعطال السباكة والكهرباء. واشترط بند آخر إشعارًا مسبقًا بثلاثة أشهر قبل المغادرة، دون إمكانية التأجير من الباطن. لم ترغب تمار في أن تبدو صعبة المراس، فطرحت مخاوفها بلباقة. اقترحت أن يتولى المالك الإصلاحات الهيكلية بينما تهتم هي بالاهتراء البسيط. ولدهشتها، اعترف بأنه نسخ العقد من الإنترنت ولم يقرأه حقًا. اتفقا على إعادة صياغة البندين، بل عرض أيضًا إصلاح صنبور المطبخ الذي يقطر قبل انتقالها. وقّعت تمار بعد أسبوع، وهي تشعر بأن قليلًا من الصبر وفّر عليها الكثير من المال والتوتر.","questions":[["Why was the apartment probably attractive to Tamar at first?","It was a bit cheaper than similar apartments","The rent included all the bills","Her brother had already lived there","The landlord offered free repairs"],["What does 'tactfully' most likely mean in the text?","In a polite, careful way","Angrily and loudly","Only in writing","Very quickly"],["What can we infer about the landlord?","He hadn't really meant to be unfair","He was trying to trick Tamar","He refused to change the contract","He was a professional lawyer"]]}},{"en":"banking and money","he":"בנק וענייני כספים","ru":"банк и финансы","ar":"البنوك والشؤون المالية","e":"🏦","items":[{"en":"I'd like to find out why I was charged a fee for a standard transfer.","he":"אני רוצה לברר למה חויבתי בעמלה על העברה רגילה.","ru":"Я хотел(а) бы выяснить, почему с меня взяли комиссию за обычный перевод.","ar":"أودّ أن أعرف لماذا اقتُطعت مني رسوم على تحويل عادي.","e":"","alt":[]},{"en":"If I pay off the loan early, will there be a penalty?","he":"אם אפרע את ההלוואה מוקדם, תהיה עמלת פירעון מוקדם?","ru":"Если я погашу кредит досрочно, будет ли штраф?","ar":"إذا سدّدت القرض مبكرًا، هل ستكون هناك غرامة؟","e":"","alt":[]},{"en":"My account is overdrawn, and I'd like to discuss a temporary credit line.","he":"החשבון שלי במינוס, ואני רוצה לדון במסגרת אשראי זמנית.","ru":"У меня на счёте минус, и я хотел(а) бы обсудить временный кредитный лимит.","ar":"حسابي مكشوف، وأودّ مناقشة حدّ ائتماني مؤقت.","e":"","alt":[]},{"en":"We're trying to cut back on spending so we can put money aside every month.","he":"אנחנו מנסים לצמצם הוצאות כדי שנוכל לחסוך כסף כל חודש.","ru":"Мы стараемся сократить расходы, чтобы каждый месяц откладывать деньги.","ar":"نحاول تقليل الإنفاق حتى نتمكن من ادّخار المال كل شهر.","e":"","alt":[]},{"en":"Could you walk me through the difference between a fixed and a variable rate?","he":"תוכל/י להסביר לי שלב אחר שלב את ההבדל בין ריבית קבועה למשתנה?","ru":"Не могли бы вы подробно объяснить разницу между фиксированной и плавающей ставкой?","ar":"هل يمكنك أن تشرح لي بالتفصيل الفرق بين الفائدة الثابتة والمتغيّرة؟","e":"","alt":[]},{"en":"I didn't authorize this payment, so I'd like to dispute it right away.","he":"לא אישרתי את התשלום הזה, ולכן אני רוצה לערער עליו מיד.","ru":"Я не разрешал(а) этот платёж, поэтому хочу немедленно его оспорить.","ar":"لم أوافق على هذه الدفعة، لذا أودّ الاعتراض عليها فورًا.","e":"","alt":[]}],"reading":{"en":"For years, Eli and Sigal never paid much attention to their bank statements. Their salaries came in, the bills went out, and as long as the account wasn't deep in the red, they assumed everything was fine. Then their daughter, who was studying economics, offered to go over their finances with them. Within an hour, she had spotted several problems. They were paying a monthly account management fee that most banks had long since dropped, and their savings were sitting in an account earning almost no interest. Worse, they had been in overdraft for most of the year, which meant they were quietly paying high interest on money they had assumed was theirs. Sigal was embarrassed, but her daughter reassured her that this was extremely common. The next week, the couple met with a bank advisor, armed with a list of questions. They negotiated lower fees, moved their savings into a deposit with a better return, and set up a standing order to transfer a fixed sum on payday. For the first time, they felt in control of their money.","he":"במשך שנים, אלי וסיגל לא הקדישו תשומת לב רבה לדפי החשבון שלהם. המשכורות נכנסו, החשבונות יצאו, וכל עוד החשבון לא היה עמוק במינוס, הם הניחו שהכול בסדר. ואז הבת שלהם, שלמדה כלכלה, הציעה לעבור איתם על המצב הכספי. תוך שעה היא כבר זיהתה כמה בעיות. הם שילמו דמי ניהול חשבון חודשיים שרוב הבנקים כבר מזמן ביטלו, והחסכונות שלהם ישבו בחשבון שכמעט לא נותן ריבית. גרוע מכך, הם היו במינוס במשך רוב השנה, כלומר שילמו בשקט ריבית גבוהה על כסף שחשבו שהוא שלהם. סיגל התביישה, אבל הבת הרגיעה אותה שזה נפוץ מאוד. בשבוע שאחרי, בני הזוג נפגשו עם יועץ בבנק, חמושים ברשימת שאלות. הם הוזילו את העמלות, העבירו את החסכונות לפיקדון עם תשואה טובה יותר, והגדירו הוראת קבע להעברת סכום קבוע ביום המשכורת. לראשונה, הם הרגישו שהם שולטים בכסף שלהם.","ru":"Много лет Эли и Сигаль почти не обращали внимания на банковские выписки. Зарплаты приходили, счета оплачивались, и пока счёт не уходил в глубокий минус, они считали, что всё в порядке. Потом их дочь, изучавшая экономику, предложила вместе разобраться в их финансах. Уже через час она обнаружила несколько проблем. Они платили ежемесячную комиссию за обслуживание счёта, которую большинство банков давно отменили, а их сбережения лежали на счёте почти без процентов. Хуже того, большую часть года они были в овердрафте, то есть незаметно платили высокие проценты за деньги, которые считали своими. Сигаль было неловко, но дочь успокоила её, сказав, что это очень распространённая ситуация. На следующей неделе супруги встретились с банковским консультантом, вооружившись списком вопросов. Они добились снижения комиссий, перевели сбережения на депозит с более высокой доходностью и оформили автоматический перевод фиксированной суммы в день зарплаты. Впервые они почувствовали, что контролируют свои деньги.","ar":"لسنوات طويلة، لم يولِ إيلي وسيغال اهتمامًا كبيرًا لكشوف حسابهما المصرفي. كانت الرواتب تدخل والفواتير تُدفع، وما دام الحساب ليس في عجز كبير، افترضا أن كل شيء على ما يرام. ثم عرضت عليهما ابنتهما، التي كانت تدرس الاقتصاد، أن تراجع معهما أوضاعهما المالية. وخلال ساعة واحدة، اكتشفت عدة مشكلات. كانا يدفعان رسوم إدارة حساب شهرية ألغتها معظم البنوك منذ زمن، وكانت مدخراتهما في حساب لا يكاد يدرّ أي فائدة. والأسوأ أنهما كانا في سحب على المكشوف معظم السنة، أي أنهما كانا يدفعان بصمت فوائد مرتفعة على مال ظنّا أنه ملكهما. شعرت سيغال بالحرج، لكن ابنتها طمأنتها بأن هذا أمر شائع جدًا. في الأسبوع التالي، التقى الزوجان بمستشار في البنك ومعهما قائمة أسئلة. تفاوضا على رسوم أقل، ونقلا مدخراتهما إلى وديعة بعائد أفضل، وأعدّا أمرًا دائمًا لتحويل مبلغ ثابت في يوم الراتب. ولأول مرة، شعرا بأنهما يتحكمان في أموالهما.","questions":[["Why didn't Eli and Sigal notice the problems earlier?","They assumed things were fine without checking","Their bank hid the statements from them","They didn't have a bank account","Their daughter managed their money"],["What does 'in the red' most likely mean?","Owing money to the bank","Earning high interest","Closed by the bank","Full of savings"],["Why did the couple bring a list of questions to the meeting?","To be well prepared to negotiate","Because the advisor demanded it","To complain about their daughter","To close their account"]]}},{"en":"complaints and refunds","he":"תלונות והחזרים","ru":"жалобы и возврат денег","ar":"الشكاوى واسترداد الأموال","e":"🧾","items":[{"en":"I'm afraid this isn't what I ordered, and I'd like it sorted out today.","he":"אני חושש/ת שזה לא מה שהזמנתי, ואשמח שזה יסודר היום.","ru":"Боюсь, это не то, что я заказывал(а), и я бы хотел(а), чтобы это решили сегодня.","ar":"أخشى أن هذا ليس ما طلبته، وأودّ أن تُحلّ المشكلة اليوم.","e":"","alt":[]},{"en":"I understand it's not your fault, but I've been passed from one department to another.","he":"אני מבין/ה שזו לא אשמתך, אבל מעבירים אותי ממחלקה למחלקה.","ru":"Я понимаю, что вы не виноваты, но меня перекидывают из одного отдела в другой.","ar":"أفهم أن الخطأ ليس خطأك، لكنهم يحوّلونني من قسم إلى آخر.","e":"","alt":[]},{"en":"According to consumer protection law, I'm entitled to cancel within fourteen days.","he":"לפי חוק הגנת הצרכן, אני זכאי/ת לבטל תוך ארבעה עשר יום.","ru":"Согласно закону о защите прав потребителей, я имею право отменить покупку в течение четырнадцати дней.","ar":"وفقًا لقانون حماية المستهلك، يحق لي الإلغاء خلال أربعة عشر يومًا.","e":"","alt":[]},{"en":"Store credit won't do me much good, so I'd prefer a full refund.","he":"זיכוי לא ממש יעזור לי, אז אני מעדיף/ה החזר כספי מלא.","ru":"Кредит в магазине мне мало чем поможет, поэтому я бы предпочёл (предпочла) полный возврат денег.","ar":"الرصيد في المتجر لن يفيدني كثيرًا، لذا أفضّل استرداد المبلغ كاملًا.","e":"","alt":[]},{"en":"If the issue isn't resolved by Friday, I'll have to take it further.","he":"אם הבעיה לא תיפתר עד יום שישי, אצטרך לקחת את זה הלאה.","ru":"Если вопрос не решат до пятницы, мне придётся обратиться выше.","ar":"إذا لم تُحلّ المشكلة بحلول يوم الجمعة، سأضطر إلى التصعيد.","e":"","alt":[]},{"en":"Could you put that in writing so I have a record of our conversation?","he":"תוכל/י לתת לי את זה בכתב כדי שיהיה לי תיעוד של השיחה?","ru":"Не могли бы вы подтвердить это письменно, чтобы у меня была запись нашего разговора?","ar":"هل يمكنك تأكيد ذلك كتابيًا حتى يكون لدي سجلّ لمحادثتنا؟","e":"","alt":[]}],"reading":{"en":"Ronit bought an expensive washing machine from a large electronics chain, and within a month it had started leaking. The technician who came out blamed the installation, while the installer insisted the machine itself was faulty. Each side pointed at the other, and Ronit was left mopping her bathroom floor every evening. She had every reason to lose her temper, but she knew that shouting at call center staff rarely gets results. Instead, she kept a detailed log: dates, names, reference numbers, and photos of the damage. When her third phone call went nowhere, she wrote a short, factual email to the company's head office. She described the problem, listed every attempt to fix it, and stated clearly what she expected: a replacement machine or a full refund. She added, without any drama, that she would otherwise file a claim in small claims court. The tone of the reply was noticeably different from that of the call center. Within two days, a manager phoned to apologize and arranged for a brand-new machine to be delivered and installed free of charge.","he":"רונית קנתה מכונת כביסה יקרה מרשת מוצרי חשמל גדולה, ותוך חודש היא התחילה לדלוף. הטכנאי שהגיע האשים את ההתקנה, ואילו המתקין התעקש שהמכונה עצמה פגומה. כל צד הצביע על הצד השני, ורונית נשארה לנגב את רצפת חדר הרחצה כל ערב. הייתה לה כל סיבה לאבד את העשתונות, אבל היא ידעה שצעקות על נציגי מוקד השירות כמעט אף פעם לא מביאות תוצאות. במקום זאת, היא ניהלה תיעוד מפורט: תאריכים, שמות, מספרי פנייה ותמונות של הנזק. כשגם שיחת הטלפון השלישית לא הובילה לשום מקום, היא כתבה מייל קצר וענייני להנהלה הראשית של החברה. היא תיארה את הבעיה, פירטה כל ניסיון לתקן אותה, וציינה בבירור מה היא מצפה לקבל: מכונה חלופית או החזר כספי מלא. היא הוסיפה, בלי שום דרמה, שאחרת תגיש תביעה לבית המשפט לתביעות קטנות. הטון של התשובה היה שונה בעליל מזה של מוקד השירות. תוך יומיים התקשר מנהל להתנצל, ודאג שמכונה חדשה לגמרי תסופק ותותקן ללא תשלום.","ru":"Ронит купила дорогую стиральную машину в крупной сети электроники, и уже через месяц она начала протекать. Приехавший техник обвинил установку, а установщик настаивал, что неисправна сама машина. Каждая сторона кивала на другую, а Ронит каждый вечер вытирала пол в ванной. У неё были все основания выйти из себя, но она знала, что крик на сотрудников колл-центра редко приносит результат. Вместо этого она вела подробный журнал: даты, имена, номера обращений и фотографии повреждений. Когда и третий звонок ни к чему не привёл, она написала короткое деловое письмо в головной офис компании. Она описала проблему, перечислила все попытки её устранить и чётко указала, чего ожидает: замены машины или полного возврата денег. Без всякого драматизма она добавила, что иначе подаст иск в суд мелких тяжб. Тон ответа заметно отличался от тона колл-центра. Через два дня ей позвонил менеджер, извинился и организовал бесплатную доставку и установку совершенно новой машины.","ar":"اشترت رونيت غسالة باهظة الثمن من سلسلة كبيرة لبيع الأجهزة الكهربائية، وخلال شهر بدأت تسرّب الماء. ألقى الفني الذي حضر باللوم على التركيب، بينما أصرّ المركّب على أن الغسالة نفسها معيبة. كان كل طرف يلقي المسؤولية على الآخر، وبقيت رونيت تمسح أرضية الحمام كل مساء. كان لديها كل الأسباب لتفقد أعصابها، لكنها كانت تعرف أن الصراخ على موظفي مركز الاتصال نادرًا ما يأتي بنتيجة. بدلًا من ذلك، احتفظت بسجلّ مفصّل: التواريخ والأسماء وأرقام الطلبات وصور الضرر. وعندما لم تُفضِ مكالمتها الثالثة إلى شيء، كتبت رسالة إلكترونية قصيرة وموضوعية إلى المكتب الرئيسي للشركة. وصفت المشكلة، وعدّدت كل محاولة لإصلاحها، وذكرت بوضوح ما تتوقعه: غسالة بديلة أو استرداد المبلغ كاملًا. وأضافت، دون أي دراما، أنها ستقدّم بخلاف ذلك دعوى أمام محكمة الدعاوى الصغيرة. كانت نبرة الرد مختلفة بشكل ملحوظ عن نبرة مركز الاتصال. وخلال يومين، اتصل مدير ليعتذر، ورتّب توصيل غسالة جديدة تمامًا وتركيبها مجانًا.","questions":[["Why did Ronit avoid shouting at the call center staff?","She believed it wouldn't help","She was too tired to argue","The staff were her friends","She didn't speak their language"],["What does 'went nowhere' mean in the text?","Produced no result","Was suddenly disconnected","Was very short","Was transferred abroad"],["What most likely changed the company's attitude?","Her clear, documented email to head office","A second visit from the technician","Her angry phone calls","A post on social media"]]}},{"en":"small talk and socializing","he":"שיחת חולין ומצבים חברתיים","ru":"светская беседа и общение","ar":"الأحاديث القصيرة والمواقف الاجتماعية","e":"💬","items":[{"en":"I don't think we've been properly introduced; I'm a friend of the groom's.","he":"נדמה לי שעוד לא הכירו בינינו כמו שצריך; אני חבר/ה של החתן.","ru":"Кажется, нас ещё толком не познакомили; я друг (подруга) жениха.","ar":"لا أظن أننا تعارفنا كما ينبغي؛ أنا صديق العريس.","e":"","alt":[]},{"en":"I'd love to stay longer, but I have to be up early tomorrow.","he":"הייתי שמח/ה להישאר עוד, אבל אני צריך/ה לקום מוקדם מחר.","ru":"Я бы с удовольствием остался (осталась) подольше, но завтра мне рано вставать.","ar":"كنت أودّ البقاء أكثر، لكن عليّ الاستيقاظ مبكرًا غدًا.","e":"","alt":[]},{"en":"You might have a point, although I see it a little differently.","he":"אולי יש משהו במה שאת/ה אומר/ת, למרות שאני רואה את זה קצת אחרת.","ru":"Возможно, вы в чём-то правы, хотя я смотрю на это немного иначе.","ar":"ربما لديك وجهة نظر، مع أنني أرى الأمر بشكل مختلف قليلًا.","e":"","alt":[]},{"en":"Sorry, your name has completely slipped my mind; could you remind me?","he":"סליחה, השם שלך פרח לי לגמרי מהזיכרון; תוכל/י להזכיר לי?","ru":"Извините, ваше имя совершенно вылетело у меня из головы; не напомните?","ar":"عذرًا، لقد نسيت اسمك تمامًا؛ هل يمكنك تذكيري به؟","e":"","alt":[]},{"en":"We should get together sometime; I'll drop you a message next week.","he":"כדאי שניפגש מתישהו; אשלח לך הודעה בשבוע הבא.","ru":"Надо бы как-нибудь встретиться; я напишу тебе на следующей неделе.","ar":"يجب أن نلتقي في وقت ما؛ سأرسل لك رسالة الأسبوع القادم.","e":"","alt":[]},{"en":"I'm not really one for big parties, but this one turned out to be great.","he":"אני לא ממש טיפוס של מסיבות גדולות, אבל המסיבה הזאת יצאה מעולה.","ru":"Я не особо люблю большие вечеринки, но эта оказалась отличной.","ar":"لست من محبي الحفلات الكبيرة، لكن هذه الحفلة كانت رائعة في النهاية.","e":"","alt":[]}],"reading":{"en":"Ofer had just started a new job in Herzliya when he was invited to a colleague's housewarming party. He knew almost no one there and, being naturally shy, was tempted to stay for twenty minutes and slip away. Then he remembered some advice a friend had given him: people enjoy talking about themselves, so ask good questions and actually listen. He approached a woman standing by the bookshelf and asked whether she had read any of the novels on it. That simple question led to a long conversation about books, then about her recent trip to Portugal. Later, when the talk turned to politics, Ofer felt the atmosphere becoming tense. Rather than taking sides, he made a light joke about how everyone agrees on one thing, the traffic on the Ayalon, and people laughed. By the end of the evening, he had exchanged numbers with three people. On Sunday, one of them, who worked in another department, stopped by his desk to say hello. Ofer realized that the party had done more for his first weeks than any training session.","he":"עופר בדיוק התחיל עבודה חדשה בהרצליה כשהוזמן למסיבת חנוכת בית של עמית לעבודה. הוא כמעט לא הכיר שם אף אחד, ומכיוון שהוא ביישן מטבעו, התפתה להישאר עשרים דקות ולהתחמק בשקט. ואז נזכר בעצה שחבר נתן לו: אנשים נהנים לדבר על עצמם, אז שאל שאלות טובות ובאמת הקשב. הוא ניגש לאישה שעמדה ליד מדף הספרים ושאל אם קראה אחד מהרומנים שעליו. השאלה הפשוטה הזאת הובילה לשיחה ארוכה על ספרים, ואחר כך על הטיול האחרון שלה לפורטוגל. מאוחר יותר, כשהשיחה עברה לפוליטיקה, עופר הרגיש שהאווירה נעשית מתוחה. במקום לבחור צד, הוא התבדח בקלילות שכולם מסכימים על דבר אחד, הפקקים באיילון, והאנשים צחקו. עד סוף הערב הוא החליף מספרים עם שלושה אנשים. ביום ראשון, אחד מהם, שעבד במחלקה אחרת, עבר ליד השולחן שלו כדי להגיד שלום. עופר הבין שהמסיבה תרמה לשבועות הראשונים שלו יותר מכל הדרכה.","ru":"Офер только начал работать на новом месте в Герцлии, когда его пригласили на новоселье к коллеге. Он почти никого там не знал и, будучи застенчивым по натуре, подумывал побыть минут двадцать и незаметно уйти. Потом он вспомнил совет друга: людям нравится говорить о себе, поэтому задавай хорошие вопросы и по-настоящему слушай. Он подошёл к женщине, стоявшей у книжной полки, и спросил, читала ли она какой-нибудь из стоявших там романов. Этот простой вопрос перерос в долгий разговор о книгах, а затем о её недавней поездке в Португалию. Позже, когда разговор перешёл на политику, Офер почувствовал, что атмосфера накаляется. Вместо того чтобы занять чью-то сторону, он шутливо заметил, что все согласны хотя бы в одном — насчёт пробок на Аялоне, и все засмеялись. К концу вечера он обменялся номерами с тремя людьми. В воскресенье один из них, работавший в другом отделе, заглянул к нему поздороваться. Офер понял, что эта вечеринка дала ему в первые недели больше, чем любой тренинг.","ar":"كان عوفر قد بدأ للتو عملًا جديدًا في هرتسليا عندما دُعي إلى حفلة بيت جديد لدى أحد زملائه. لم يكن يعرف أحدًا تقريبًا هناك، ولأنه خجول بطبعه، فكّر في البقاء عشرين دقيقة ثم الانسلال بهدوء. ثم تذكّر نصيحة قدّمها له صديق: الناس يحبون الحديث عن أنفسهم، فاطرح أسئلة جيدة واستمع حقًا. اقترب من امرأة تقف بجانب رف الكتب وسألها إن كانت قد قرأت أيًّا من الروايات الموجودة عليه. أدّى هذا السؤال البسيط إلى حديث طويل عن الكتب، ثم عن رحلتها الأخيرة إلى البرتغال. لاحقًا، عندما انتقل الحديث إلى السياسة، شعر عوفر بأن الجو أصبح متوترًا. وبدلًا من الانحياز إلى طرف، أطلق مزحة خفيفة بأن الجميع متفقون على أمر واحد، وهو زحمة السير على طريق أيالون، فضحك الحاضرون. وبحلول نهاية الأمسية، كان قد تبادل الأرقام مع ثلاثة أشخاص. يوم الأحد، مرّ أحدهم، وكان يعمل في قسم آخر، بمكتبه ليلقي التحية. أدرك عوفر أن الحفلة أفادته في أسابيعه الأولى أكثر من أي دورة تدريبية.","questions":[["What was Ofer's original plan for the party?","To leave quietly after a short time","To give a speech","To stay until the very end","To talk about politics"],["Why did Ofer make a joke about the traffic?","To ease the tension without taking sides","Because he had arrived late","To show that he disagreed","To change the subject to his job"],["What does 'slip away' mean in the text?","Leave without being noticed","Fall on the floor","Make a small mistake","Arrive a little late"]]}},{"en":"health and doctors","he":"בריאות ותורים לרופא","ru":"здоровье и визиты к врачу","ar":"الصحة والمواعيد الطبية","e":"🩺","items":[{"en":"I've been feeling run down for weeks, and I can't seem to shake it off.","he":"אני מרגיש/ה מותש/ת כבר שבועות, ולא מצליח/ה להשתחרר מזה.","ru":"Я уже несколько недель чувствую себя разбитым (разбитой) и никак не могу прийти в себя.","ar":"أشعر بالإرهاق منذ أسابيع، ولا يبدو أنني أستطيع التخلص منه.","e":"","alt":[]},{"en":"Is there any chance of an earlier appointment if someone cancels?","he":"יש סיכוי לתור מוקדם יותר אם מישהו מבטל?","ru":"Есть ли шанс записаться пораньше, если кто-то отменит приём?","ar":"هل هناك فرصة لموعد أبكر إذا ألغى أحدهم موعده؟","e":"","alt":[]},{"en":"Could you explain the side effects before I start taking this medication?","he":"תוכל/י להסביר את תופעות הלוואי לפני שאתחיל לקחת את התרופה?","ru":"Не могли бы вы объяснить побочные эффекты, прежде чем я начну принимать это лекарство?","ar":"هل يمكنك شرح الآثار الجانبية قبل أن أبدأ بتناول هذا الدواء؟","e":"","alt":[]},{"en":"The pain comes and goes, but it gets worse when I lie down.","he":"הכאב בא והולך, אבל הוא מחמיר כשאני שוכב/ת.","ru":"Боль то появляется, то проходит, но усиливается, когда я ложусь.","ar":"الألم يأتي ويذهب، لكنه يزداد سوءًا عندما أستلقي.","e":"","alt":[]},{"en":"I'd like a referral to a specialist, just to rule out anything serious.","he":"אשמח להפניה לרופא מומחה, רק כדי לשלול משהו רציני.","ru":"Я бы хотел(а) получить направление к специалисту, просто чтобы исключить что-то серьёзное.","ar":"أودّ الحصول على تحويل إلى طبيب مختص، فقط لاستبعاد أي شيء خطير.","e":"","alt":[]},{"en":"Does my health fund cover this test, or will I have to pay privately?","he":"קופת החולים שלי מכסה את הבדיקה הזאת, או שאצטרך לשלם באופן פרטי?","ru":"Покрывает ли моя больничная касса этот анализ, или мне придётся платить самому (самой)?","ar":"هل يغطي صندوق المرضى هذا الفحص، أم سأضطر إلى الدفع على حسابي الخاص؟","e":"","alt":[]}],"reading":{"en":"For months, Yael had put off dealing with the dull pain in her knee. She was busy at work, and every time she tried to book an appointment, the earliest slot with an orthopedist was six weeks away. A colleague suggested she check the health fund's app every morning, since cancellations often appear at the last minute. Sure enough, on the third day she grabbed a slot for the following afternoon. Before the visit, she wrote down when the pain had started, what made it worse, and which painkillers she had tried. The doctor appreciated her preparation and said it saved them both time. After examining her, he explained that it was probably a mild strain caused by running on hard surfaces without proper shoes. He ruled out surgery but recommended physiotherapy and a temporary break from running. Yael asked whether the treatment was covered, and he told her that her plan included twelve sessions a year. She left feeling relieved, and slightly annoyed with herself for having waited so long.","he":"במשך חודשים, יעל דחתה את הטיפול בכאב העמום בברך שלה. היא הייתה עסוקה בעבודה, ובכל פעם שניסתה לקבוע תור, התור הקרוב ביותר לאורתופד היה בעוד שישה שבועות. עמיתה לעבודה הציעה לה לבדוק באפליקציה של קופת החולים כל בוקר, כי ביטולים מופיעים לעיתים קרובות ברגע האחרון. ואכן, ביום השלישי היא תפסה תור למחרת אחר הצהריים. לפני הביקור, היא רשמה מתי התחיל הכאב, מה מחמיר אותו ואילו משככי כאבים ניסתה. הרופא העריך את ההכנה שלה ואמר שזה חסך לשניהם זמן. אחרי שבדק אותה, הוא הסביר שזו כנראה מתיחה קלה שנגרמה מריצה על משטחים קשים בלי נעליים מתאימות. הוא שלל ניתוח, אבל המליץ על פיזיותרפיה והפסקה זמנית מריצה. יעל שאלה אם הטיפול מכוסה, והוא אמר לה שהתוכנית שלה כוללת שנים עשר טיפולים בשנה. היא יצאה בתחושת הקלה, וקצת כועסת על עצמה שחיכתה כל כך הרבה זמן.","ru":"Несколько месяцев Яэль откладывала решение проблемы с ноющей болью в колене. Она была занята на работе, и каждый раз, когда пыталась записаться, ближайший приём у ортопеда был только через шесть недель. Коллега посоветовала ей каждое утро проверять приложение больничной кассы, потому что отменённые записи часто появляются в последний момент. И действительно, на третий день она успела записаться на следующий день после обеда. Перед визитом она записала, когда началась боль, что её усиливает и какие обезболивающие она пробовала. Врач оценил её подготовку и сказал, что это сэкономило им обоим время. Осмотрев её, он объяснил, что это, скорее всего, лёгкое растяжение из-за бега по твёрдым поверхностям без подходящей обуви. Он исключил операцию, но порекомендовал физиотерапию и временный перерыв в беге. Яэль спросила, покрывается ли лечение, и он ответил, что её план включает двенадцать сеансов в год. Она ушла с облегчением и немного досадуя на себя за то, что так долго тянула.","ar":"لأشهر عديدة، أجّلت ياعيل التعامل مع الألم الخفيف في ركبتها. كانت مشغولة في العمل، وفي كل مرة حاولت فيها حجز موعد، كان أقرب موعد عند طبيب العظام بعد ستة أسابيع. اقترحت عليها زميلة أن تتفقد تطبيق صندوق المرضى كل صباح، لأن المواعيد الملغاة تظهر غالبًا في اللحظة الأخيرة. وبالفعل، في اليوم الثالث حجزت موعدًا لعصر اليوم التالي. قبل الزيارة، دوّنت متى بدأ الألم، وما الذي يزيده سوءًا، وأي المسكّنات جرّبت. قدّر الطبيب استعدادها وقال إن ذلك وفّر عليهما الوقت. بعد أن فحصها، أوضح أنه على الأرجح التواء خفيف ناتج عن الجري على أسطح صلبة دون حذاء مناسب. استبعد الجراحة، لكنه أوصى بالعلاج الطبيعي والتوقف عن الجري مؤقتًا. سألت ياعيل إن كان العلاج مغطّى، فأخبرها أن خطتها تشمل اثنتي عشرة جلسة في السنة. خرجت وهي تشعر بالارتياح، ومنزعجة قليلًا من نفسها لأنها انتظرت كل هذا الوقت.","questions":[["Why did the colleague recommend checking the app every morning?","Cancelled appointments can suddenly become available","The app gives out free medicine","Doctors post daily advice there","Prices for visits change every day"],["What does 'put off' mean in the text?","Delayed","Solved","Described","Paid for"],["How did Yael probably feel about her long delay?","She regretted not acting sooner","She was proud of waiting","She blamed the doctor for it","She didn't care at all"]]}},{"en":"news and current affairs","he":"חדשות ואקטואליה","ru":"новости и текущие события","ar":"الأخبار والشؤون الجارية","e":"📰","items":[{"en":"From what I've read, the new policy is likely to push housing prices even higher.","he":"ממה שקראתי, המדיניות החדשה צפויה לדחוף את מחירי הדיור עוד יותר למעלה.","ru":"Насколько я читал(а), новая политика, скорее всего, ещё больше поднимет цены на жильё.","ar":"مما قرأته، من المرجح أن تدفع السياسة الجديدة أسعار المساكن إلى الارتفاع أكثر.","e":"","alt":[]},{"en":"I take headlines like that with a pinch of salt until I see the full story.","he":"אני מתייחס/ת לכותרות כאלה בספקנות עד שאני רואה את הכתבה המלאה.","ru":"К таким заголовкам я отношусь скептически, пока не увижу всю статью.","ar":"أتعامل مع عناوين كهذه بشيء من الشك حتى أرى القصة كاملة.","e":"","alt":[]},{"en":"It's hard to tell whether the report is biased or simply incomplete.","he":"קשה לדעת אם הכתבה מוטה או פשוט לא שלמה.","ru":"Трудно сказать, предвзят ли этот репортаж или просто неполон.","ar":"من الصعب معرفة ما إذا كان التقرير منحازًا أم ناقصًا فحسب.","e":"","alt":[]},{"en":"Whatever your political views, the rising cost of living affects everyone.","he":"לא משנה מה הדעות הפוליטיות שלך, יוקר המחיה משפיע על כולם.","ru":"Какими бы ни были ваши политические взгляды, рост стоимости жизни касается всех.","ar":"مهما كانت آراؤك السياسية، فإن ارتفاع تكاليف المعيشة يؤثر على الجميع.","e":"","alt":[]},{"en":"I've stopped following the news so closely because it was affecting my mood.","he":"הפסקתי לעקוב אחרי החדשות כל כך מקרוב כי זה השפיע על מצב הרוח שלי.","ru":"Я перестал(а) так пристально следить за новостями, потому что это портило мне настроение.","ar":"توقفت عن متابعة الأخبار عن كثب لأنها كانت تؤثر على مزاجي.","e":"","alt":[]},{"en":"The minister's announcement raised more questions than it actually answered.","he":"ההודעה של השר העלתה יותר שאלות ממה שהיא באמת ענתה.","ru":"Заявление министра вызвало больше вопросов, чем дало ответов.","ar":"أثار إعلان الوزير أسئلة أكثر مما أجاب عنه فعلًا.","e":"","alt":[]}],"reading":{"en":"Last month, a short video spread rapidly across Israeli social media. It appeared to show a supermarket manager in Be'er Sheva throwing away crates of fresh vegetables while prices were soaring. Within hours, it had been shared tens of thousands of times, and furious comments called for a boycott of the chain. Yet when a team of journalists looked into the story, a very different picture emerged. The footage was genuine, but it had been filmed three years earlier, in another country, and the vegetables had been recalled because of contamination. Someone had simply added a misleading caption. By the time the correction was published, however, the damage was done: the chain had received threats, and several branches reported a drop in customers. Media experts say the case illustrates a familiar pattern. False stories tend to travel faster than true ones because they provoke strong emotions, especially anger. Their advice is straightforward, if not always easy to follow: pause before sharing, check the date and source, and be especially suspicious of content that makes you instantly outraged.","he":"בחודש שעבר הופץ במהירות סרטון קצר ברשתות החברתיות בישראל. נראה בו, לכאורה, מנהל סופרמרקט בבאר שבע שזורק ארגזים של ירקות טריים בזמן שהמחירים מזנקים. תוך שעות הוא שותף עשרות אלפי פעמים, ותגובות זועמות קראו להחרים את הרשת. אבל כשצוות עיתונאים בדק את הסיפור, התגלתה תמונה שונה לגמרי. הצילומים היו אמיתיים, אבל הם צולמו שלוש שנים קודם לכן, במדינה אחרת, והירקות נאספו בגלל זיהום. מישהו פשוט הוסיף כיתוב מטעה. אולם עד שהתיקון פורסם, הנזק כבר נעשה: הרשת קיבלה איומים, וכמה סניפים דיווחו על ירידה במספר הלקוחות. מומחי תקשורת אומרים שהמקרה ממחיש דפוס מוכר. ידיעות כוזבות נוטות להתפשט מהר יותר מאמיתיות, כי הן מעוררות רגשות חזקים, ובמיוחד כעס. העצה שלהם פשוטה, גם אם לא תמיד קל ליישם אותה: לעצור לפני שמשתפים, לבדוק את התאריך ואת המקור, ולחשוד במיוחד בתוכן שגורם לך לזעם מיידי.","ru":"В прошлом месяце в израильских соцсетях быстро распространилось короткое видео. На нём, как казалось, управляющий супермаркета в Беэр-Шеве выбрасывал ящики свежих овощей, в то время как цены стремительно росли. За несколько часов им поделились десятки тысяч раз, а гневные комментарии призывали бойкотировать сеть. Однако когда группа журналистов изучила эту историю, картина оказалась совсем иной. Кадры были настоящими, но их сняли три года назад в другой стране, а овощи изъяли из-за заражения. Кто-то просто добавил вводящую в заблуждение подпись. Но к тому времени, как опубликовали опровержение, вред уже был нанесён: сеть получала угрозы, а несколько филиалов сообщили об оттоке покупателей. Медиаэксперты говорят, что этот случай иллюстрирует знакомую закономерность. Ложные новости распространяются быстрее правдивых, потому что вызывают сильные эмоции, особенно гнев. Их совет прост, хотя ему не всегда легко следовать: остановитесь, прежде чем делиться, проверьте дату и источник и будьте особенно недоверчивы к материалам, которые мгновенно вызывают у вас возмущение.","ar":"في الشهر الماضي، انتشر مقطع فيديو قصير بسرعة على شبكات التواصل الاجتماعي في إسرائيل. بدا أنه يُظهر مدير سوبرماركت في بئر السبع يرمي صناديق من الخضار الطازجة في وقت كانت فيه الأسعار ترتفع بشدة. وخلال ساعات، تمت مشاركته عشرات آلاف المرات، ودعت تعليقات غاضبة إلى مقاطعة السلسلة. لكن عندما تحقّق فريق من الصحفيين من القصة، ظهرت صورة مختلفة تمامًا. كانت اللقطات حقيقية، لكنها صُوّرت قبل ثلاث سنوات في بلد آخر، وكانت الخضار قد سُحبت بسبب تلوّث. كل ما في الأمر أن أحدهم أضاف تعليقًا مضللًا. ولكن بحلول وقت نشر التصحيح، كان الضرر قد وقع: تلقّت السلسلة تهديدات، وأبلغت عدة فروع عن تراجع في عدد الزبائن. يقول خبراء الإعلام إن هذه الحالة توضّح نمطًا مألوفًا. فالأخبار الكاذبة تنتشر أسرع من الصحيحة لأنها تثير مشاعر قوية، خاصة الغضب. ونصيحتهم بسيطة، وإن لم يكن اتباعها سهلًا دائمًا: توقّف قبل المشاركة، وتحقّق من التاريخ والمصدر، وكن حذرًا بشكل خاص من المحتوى الذي يثير غضبك على الفور.","questions":[["According to the experts, why did the video spread so quickly?","It made people very angry","A famous singer shared it","It was extremely funny","The chain paid to promote it"],["What was actually wrong with the video?","It was old footage with a false caption","It was created entirely by computer","It was filmed in Be'er Sheva that week","It had no sound at all"],["What does 'the damage was done' suggest?","The correction came too late to prevent harm","The vegetables were damaged in transport","The journalists made a serious mistake","The video was deleted in time"]]}},{"en":"handling bureaucracy","he":"התמודדות עם בירוקרטיה","ru":"бюрократия и учреждения","ar":"التعامل مع البيروقراطية","e":"🏛️","items":[{"en":"I've already submitted this form twice, and both times it apparently got lost.","he":"כבר הגשתי את הטופס הזה פעמיים, ובשתי הפעמים הוא כנראה הלך לאיבוד.","ru":"Я уже дважды подавал(а) эту форму, и оба раза она, по-видимому, потерялась.","ar":"قدّمت هذا النموذج مرتين بالفعل، ويبدو أنه ضاع في المرتين.","e":"","alt":[]},{"en":"Could you tell me exactly which documents I need to bring next time?","he":"תוכל/י להגיד לי בדיוק אילו מסמכים אני צריך/ה להביא בפעם הבאה?","ru":"Не могли бы вы точно сказать, какие документы мне нужно принести в следующий раз?","ar":"هل يمكنك أن تخبرني بالضبط ما المستندات التي يجب أن أحضرها في المرة القادمة؟","e":"","alt":[]},{"en":"I'd like to appeal the decision, since I believe the property tax was miscalculated.","he":"אני רוצה לערער על ההחלטה, כי לדעתי הארנונה חושבה לא נכון.","ru":"Я хотел(а) бы обжаловать это решение, так как считаю, что налог на недвижимость рассчитан неверно.","ar":"أودّ الطعن في القرار، لأنني أعتقد أن ضريبة الأملاك حُسبت بشكل خاطئ.","e":"","alt":[]},{"en":"The insurance company keeps asking for more paperwork instead of processing my claim.","he":"חברת הביטוח כל הזמן מבקשת עוד מסמכים במקום לטפל בתביעה שלי.","ru":"Страховая компания постоянно требует новые документы вместо того, чтобы рассмотреть моё заявление.","ar":"تواصل شركة التأمين طلب المزيد من الأوراق بدلًا من معالجة مطالبتي.","e":"","alt":[]},{"en":"Is it possible to handle this online, or do I have to come in person?","he":"אפשר לטפל בזה באינטרנט, או שאני חייב/ת להגיע באופן אישי?","ru":"Можно ли сделать это онлайн, или мне нужно прийти лично?","ar":"هل يمكن إنجاز ذلك عبر الإنترنت، أم يجب أن أحضر شخصيًا؟","e":"","alt":[]},{"en":"If I'd filled in the form correctly the first time, I'd have saved weeks.","he":"אילו מילאתי את הטופס נכון בפעם הראשונה, הייתי חוסך/ת שבועות.","ru":"Если бы я правильно заполнил(а) форму с первого раза, я бы сэкономил(а) несколько недель.","ar":"لو ملأت النموذج بشكل صحيح من المرة الأولى، لوفّرت أسابيع.","e":"","alt":[]}],"reading":{"en":"When Nadia and her husband moved from Nazareth to Kiryat Tivon, they assumed that updating their address would take an afternoon. Instead, it turned into a three-month saga. The municipality billed them for property tax based on an apartment size that was twenty square meters larger than the real one. To correct it, they were told to submit an official measurement, which cost several hundred shekels. Meanwhile, a pipe burst in the bathroom, and their insurance company requested a plumber's report, photos, receipts, and a form that had to be signed by the previous tenant, whom they had never met. Nadia was close to giving up. Then a neighbor gave her a valuable tip: always ask for the name of the clerk you speak to, request every promise in writing, and, if a deadline passes, file a formal complaint with the public inquiries department. It sounded excessive, but it worked. Once she started citing reference numbers and dates, replies came faster. Eventually, the tax was reduced and the insurance claim was approved, though the experience left her exhausted.","he":"כשנדיה ובעלה עברו מנצרת לקריית טבעון, הם הניחו שעדכון הכתובת ייקח אחר צהריים אחד. במקום זאת, זה הפך לסאגה של שלושה חודשים. העירייה חייבה אותם בארנונה לפי שטח דירה הגדול בעשרים מטרים רבועים מהשטח האמיתי. כדי לתקן את זה, נאמר להם להגיש מדידה רשמית, שעלתה כמה מאות שקלים. בינתיים התפוצץ צינור בחדר הרחצה, וחברת הביטוח שלהם ביקשה דוח של אינסטלטור, תמונות, קבלות וטופס שהיה צריך להיחתם על ידי השוכר הקודם, שאותו מעולם לא פגשו. נדיה הייתה קרובה להרים ידיים. ואז שכנה נתנה לה טיפ חשוב: תמיד לבקש את שם הפקיד שמדברים איתו, לבקש כל הבטחה בכתב, ואם עובר מועד, להגיש תלונה רשמית למחלקת פניות הציבור. זה נשמע מוגזם, אבל זה עבד. ברגע שהתחילה לצטט מספרי פנייה ותאריכים, התשובות הגיעו מהר יותר. בסופו של דבר הארנונה הופחתה ותביעת הביטוח אושרה, אם כי החוויה הותירה אותה מותשת.","ru":"Когда Надя с мужем переехали из Назарета в Кирьят-Тивон, они думали, что смена адреса займёт полдня. Вместо этого всё превратилось в трёхмесячную сагу. Муниципалитет начислил им налог на недвижимость исходя из площади квартиры на двадцать квадратных метров больше настоящей. Чтобы это исправить, им сказали предоставить официальный обмер, который стоил несколько сотен шекелей. Тем временем в ванной лопнула труба, и страховая компания запросила отчёт сантехника, фотографии, чеки и форму, которую должен был подписать предыдущий жилец, которого они ни разу не видели. Надя была близка к тому, чтобы сдаться. Тогда соседка дала ей ценный совет: всегда спрашивать имя служащего, с которым говоришь, просить каждое обещание в письменном виде, а если срок прошёл, подавать официальную жалобу в отдел обращений граждан. Это казалось излишним, но сработало. Как только она начала ссылаться на номера обращений и даты, ответы стали приходить быстрее. В конце концов налог снизили, а страховое заявление одобрили, хотя всё это её совершенно вымотало.","ar":"عندما انتقلت ناديا وزوجها من الناصرة إلى كريات طبعون، افترضا أن تحديث عنوانهما سيستغرق فترة بعد الظهر فقط. لكن الأمر تحوّل إلى ملحمة استمرت ثلاثة أشهر. فرضت البلدية عليهما ضريبة أملاك على أساس مساحة شقة أكبر بعشرين مترًا مربعًا من المساحة الحقيقية. ولتصحيح ذلك، طُلب منهما تقديم قياس رسمي كلّف عدة مئات من الشواكل. وفي هذه الأثناء، انفجر أنبوب في الحمام، وطلبت شركة التأمين تقرير سبّاك وصورًا وإيصالات ونموذجًا يجب أن يوقّعه المستأجر السابق الذي لم يلتقيا به قط. كانت ناديا على وشك الاستسلام. ثم قدّمت لها جارة نصيحة قيّمة: اطلبي دائمًا اسم الموظف الذي تتحدثين إليه، واطلبي كل وعد كتابيًا، وإذا انقضى موعد ما، فقدّمي شكوى رسمية إلى قسم شكاوى الجمهور. بدا ذلك مبالغًا فيه، لكنه نجح. فما إن بدأت تذكر أرقام الطلبات والتواريخ حتى صارت الردود تصل أسرع. وفي النهاية، خُفّضت الضريبة ووُوفق على مطالبة التأمين، رغم أن التجربة تركتها منهكة.","questions":[["Why did the property tax bill seem unfair?","It was based on the wrong apartment size","It was charged twice a month","It was meant for the neighbor","It came from another city"],["What does 'saga' most likely mean here?","A long, complicated series of events","A short phone call","A family celebration","An official legal document"],["What is the main lesson of the neighbor's tip?","Clear records put pressure on officials","Avoid dealing with officials at all","Pay whatever you are asked to pay","Always hire a lawyer first"]]}},{"en":"parent-teacher meeting","he":"אסיפת הורים","ru":"встреча родителей с учителем","ar":"لقاء أولياء الأمور مع المعلم","e":"🏫","dialog":true,"items":[{"q":"Thanks for coming in. I wanted to talk about how Noam has been doing this term.","en":"Thanks for making the time; to be honest, he's seemed a bit withdrawn at home lately.","he":"תודה שמצאת זמן; למען האמת, הוא נראה קצת מכונס בעצמו בבית לאחרונה.","ru":"Спасибо, что нашли время; честно говоря, дома он в последнее время кажется немного замкнутым.","ar":"شكرًا لتخصيص الوقت؛ بصراحة، يبدو منطويًا بعض الشيء في البيت مؤخرًا."},{"q":"His grades are fine, but he rarely joins in class discussions. Has he mentioned anything?","en":"He hasn't said much, but I suspect he's still struggling to fit in with the new group.","he":"הוא לא סיפר הרבה, אבל אני חושד/ת שהוא עדיין מתקשה להשתלב בקבוצה החדשה.","ru":"Он мало что рассказывал, но я подозреваю, что ему всё ещё трудно влиться в новый коллектив.","ar":"لم يقل الكثير، لكنني أظن أنه ما زال يجد صعوبة في الاندماج مع المجموعة الجديدة."},{"q":"That would make sense. Some of the boys have been fairly cliquey this year.","en":"Would it be possible to seat him next to someone who might help him feel included?","he":"האם אפשר להושיב אותו ליד מישהו שעשוי לעזור לו להרגיש חלק מהקבוצה?","ru":"Можно ли посадить его рядом с кем-то, кто поможет ему почувствовать себя своим?","ar":"هل من الممكن أن يجلس بجانب شخص قد يساعده على الشعور بأنه جزء من المجموعة؟"},{"q":"Certainly. I was also thinking of giving him a role in the upcoming class project.","en":"That sounds great; he really comes alive when he's given responsibility for something practical.","he":"זה נשמע מצוין; הוא ממש פורח כשנותנים לו אחריות על משהו מעשי.","ru":"Звучит отлично; он прямо оживает, когда ему поручают что-то практическое.","ar":"تبدو فكرة رائعة؛ فهو ينتعش حقًا عندما يُكلَّف بمسؤولية عن شيء عملي."},{"q":"Is there anything going on at home that we should be aware of?","en":"His grandmother passed away in the summer, and I think it hit him harder than he lets on.","he":"סבתא שלו נפטרה בקיץ, ואני חושב/ת שזה פגע בו יותר ממה שהוא מראה.","ru":"Летом умерла его бабушка, и, думаю, он переживает это тяжелее, чем показывает.","ar":"توفيت جدته في الصيف، وأظن أن ذلك أثّر فيه أكثر مما يُظهر."},{"q":"Thank you for telling me. Shall we check in again in about a month?","en":"Definitely; in the meantime, please don't hesitate to message me if anything comes up.","he":"בהחלט; בינתיים, אל תהסס/י לשלוח לי הודעה אם משהו עולה.","ru":"Обязательно; а пока, пожалуйста, не стесняйтесь писать мне, если что-то случится.","ar":"بالتأكيد؛ وفي الأثناء، لا تتردد في مراسلتي إذا طرأ أي شيء."}]}]},{"id":"amir","group":"uni","he":"הכנה למבחן אמיר","sub":"השלמת משפטים, ניסוח מחדש והבנת הנקרא ברמה אקדמית","e":"🎓","units":[{"en":"academic vocabulary 1","he":"אוצר מילים אקדמי 1","ru":"академическая лексика 1","ar":"المفردات الأكاديمية 1","e":"📘","items":[{"en":"The subsequent experiments confirmed the results of the original study conducted in 2019.","he":"הניסויים שבאו לאחר מכן אישרו את תוצאות המחקר המקורי שנערך ב-2019.","ru":"Последующие эксперименты подтвердили результаты первоначального исследования, проведённого в 2019 году.","ar":"أكدت التجارب اللاحقة نتائج الدراسة الأصلية التي أُجريت عام 2019.","e":"","alt":[]},{"en":"A considerable number of participants withdrew from the study before it was completed.","he":"מספר ניכר של משתתפים פרשו מהמחקר לפני שהסתיים.","ru":"Значительное число участников вышло из исследования до его завершения.","ar":"انسحب عدد كبير من المشاركين من الدراسة قبل اكتمالها.","e":"","alt":[]},{"en":"Some economists believe that a period of slower growth is now almost inevitable.","he":"יש כלכלנים הסבורים שתקופה של צמיחה איטית יותר היא כעת כמעט בלתי נמנעת.","ru":"Некоторые экономисты считают, что период замедления роста теперь почти неизбежен.","ar":"يعتقد بعض الاقتصاديين أن فترة من النمو الأبطأ أصبحت الآن شبه حتمية.","e":"","alt":[]},{"en":"Repeated budget cuts may seriously undermine the quality of public education.","he":"קיצוצים חוזרים בתקציב עלולים לפגוע קשות באיכות החינוך הציבורי.","ru":"Повторяющиеся сокращения бюджета могут серьёзно подорвать качество государственного образования.","ar":"قد تؤدي التخفيضات المتكررة في الميزانية إلى تقويض جودة التعليم العام بشكل خطير.","e":"","alt":[]},{"en":"The report provides a comprehensive review of research on childhood nutrition.","he":"הדוח מספק סקירה מקיפה של המחקר בנושא תזונת ילדים.","ru":"Доклад содержит всесторонний обзор исследований в области детского питания.","ar":"يقدّم التقرير مراجعة شاملة للأبحاث المتعلقة بتغذية الأطفال.","e":"","alt":[]},{"en":"Many English words derive from Latin, either directly or through French.","he":"מילים רבות באנגלית נגזרות מלטינית, במישרין או דרך הצרפתית.","ru":"Многие английские слова происходят из латыни, напрямую или через французский язык.","ar":"تشتق كلمات إنجليزية كثيرة من اللاتينية، إما مباشرة أو عن طريق الفرنسية.","e":"","alt":[]}],"reading":{"en":"Cities are often several degrees warmer than the countryside that surrounds them, a phenomenon known as the urban heat island. The effect derives largely from the materials used in construction. Asphalt, concrete and dark roofs absorb a considerable amount of solar energy during the day and release it slowly at night, so that urban areas fail to cool down after sunset. In addition, the scarcity of trees means there is little shade and less evaporation, which in rural areas helps to lower temperatures.\n\nThe consequences extend well beyond discomfort. Higher temperatures increase the demand for air conditioning, which in turn raises energy consumption and, inevitably, emissions of greenhouse gases. Heat waves also pose a serious risk to public health, particularly for the elderly and for people who work outdoors.\n\nA comprehensive response requires action on several levels. Some cities have begun painting roofs white so that they reflect rather than absorb sunlight. Others have invested in parks, green roofs and tree-lined streets. Subsequent studies of these projects indicate that even modest changes can reduce local temperatures by one or two degrees. Critics argue, however, that such measures may be undermined by continued population growth and the construction of ever more buildings. Nevertheless, most researchers agree that planning cities with heat in mind is no longer optional but essential.","he":"ערים חמות לעיתים קרובות בכמה מעלות מהאזורים הכפריים המקיפים אותן, תופעה המכונה אי החום העירוני. התופעה נובעת במידה רבה מהחומרים המשמשים בבנייה. אספלט, בטון וגגות כהים סופגים כמות ניכרת של אנרגיית שמש במהלך היום ומשחררים אותה לאט בלילה, כך שאזורים עירוניים אינם מתקררים לאחר השקיעה. בנוסף, מיעוט העצים פירושו מעט צל ופחות התאדות, שבאזורים כפריים מסייעת להוריד את הטמפרטורה.\n\nההשלכות חורגות הרבה מעבר לאי-נוחות. טמפרטורות גבוהות יותר מגבירות את הביקוש למיזוג אוויר, וזה מצידו מעלה את צריכת האנרגיה ובאופן בלתי נמנע גם את פליטות גזי החממה. גלי חום גם מהווים סיכון ממשי לבריאות הציבור, במיוחד עבור קשישים ועבור אנשים העובדים בחוץ.\n\nמענה מקיף מחייב פעולה בכמה רמות. ערים אחדות החלו לצבוע גגות בלבן כדי שיחזירו את אור השמש במקום לספוג אותו. אחרות השקיעו בפארקים, בגגות ירוקים וברחובות מוצלים בעצים. מחקרים שנערכו לאחר מכן על פרויקטים אלה מראים שאפילו שינויים צנועים יכולים להוריד את הטמפרטורה המקומית במעלה או שתיים. עם זאת, המבקרים טוענים שאמצעים כאלה עלולים להיפגע מהמשך גידול האוכלוסייה ומבנייה של עוד ועוד בניינים. למרות זאת, רוב החוקרים מסכימים שתכנון ערים תוך התחשבות בחום אינו עוד רשות אלא הכרח.","ru":"Города часто на несколько градусов теплее окружающей их сельской местности; это явление называется городским островом тепла. Эффект во многом обусловлен строительными материалами. Асфальт, бетон и тёмные крыши поглощают значительное количество солнечной энергии днём и медленно отдают её ночью, поэтому городские районы не успевают остыть после заката. Кроме того, нехватка деревьев означает мало тени и меньшее испарение, которое в сельской местности помогает снижать температуру.\n\nПоследствия выходят далеко за рамки неудобства. Более высокие температуры увеличивают спрос на кондиционирование воздуха, что, в свою очередь, повышает потребление энергии и неизбежно выбросы парниковых газов. Волны жары также представляют серьёзную угрозу для здоровья населения, особенно для пожилых людей и тех, кто работает на улице.\n\nКомплексный ответ требует действий на нескольких уровнях. Некоторые города начали красить крыши в белый цвет, чтобы они отражали солнечный свет, а не поглощали его. Другие вложили средства в парки, зелёные крыши и улицы, обсаженные деревьями. Последующие исследования этих проектов показывают, что даже скромные изменения могут снизить местную температуру на один-два градуса. Однако критики утверждают, что эффект таких мер может быть сведён на нет продолжающимся ростом населения и строительством всё новых зданий. Тем не менее большинство исследователей согласны с тем, что планирование городов с учётом жары уже не выбор, а необходимость.","ar":"كثيرًا ما تكون المدن أدفأ بعدة درجات من الريف المحيط بها، وتُعرف هذه الظاهرة بالجزيرة الحرارية الحضرية. وينشأ هذا التأثير إلى حد كبير من المواد المستخدمة في البناء. فالأسفلت والخرسانة والأسطح الداكنة تمتص كمية كبيرة من الطاقة الشمسية خلال النهار وتطلقها ببطء في الليل، فلا تبرد المناطق الحضرية بعد غروب الشمس. إضافة إلى ذلك، فإن قلة الأشجار تعني ظلًا قليلًا وتبخرًا أقل، وهو ما يساعد في المناطق الريفية على خفض درجات الحرارة.\n\nوتمتد العواقب إلى ما هو أبعد بكثير من مجرد الانزعاج. فارتفاع درجات الحرارة يزيد الطلب على التكييف، وهذا بدوره يرفع استهلاك الطاقة، وحتمًا انبعاثات الغازات الدفيئة. كما تشكل موجات الحر خطرًا جسيمًا على الصحة العامة، ولا سيما على كبار السن ومن يعملون في الهواء الطلق.\n\nتتطلب الاستجابة الشاملة عملًا على عدة مستويات. فقد بدأت بعض المدن بطلاء الأسطح باللون الأبيض لكي تعكس ضوء الشمس بدلًا من امتصاصه. واستثمرت مدن أخرى في الحدائق والأسطح الخضراء والشوارع المزروعة بالأشجار. وتشير الدراسات اللاحقة لهذه المشاريع إلى أن تغييرات متواضعة يمكن أن تخفض درجات الحرارة المحلية بدرجة أو درجتين. غير أن المنتقدين يرون أن مثل هذه الإجراءات قد يقوّضها استمرار النمو السكاني وبناء المزيد والمزيد من المباني. ومع ذلك، يتفق معظم الباحثين على أن تخطيط المدن مع مراعاة الحرارة لم يعد خيارًا بل ضرورة.","questions":[["What is the main idea of the passage?","Cities are warmer than rural areas, and the problem can be partly reduced.","Air conditioning is the ma
