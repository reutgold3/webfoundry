<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#DDF1F7"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><title>Yalla English</title><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Yalla English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a picture book page; the character sits on top and talks in a bubble, the activity fills the page below. Bright single-theme look by choice. */
:root{
  --sky:#DDF1F7;        /* page ground */
  --paper:#FFFFFF;      /* cards */
  --ink:#1D2B4F;        /* text */
  --ink-soft:#5A6788;   /* secondary text */
  --sun:#FFC83D;        /* accent: stars, main button */
  --sun-deep:#E8A400;
  --leaf:#2FB57C;       /* correct */
  --berry:#E8506A;      /* wrong */
  --sea:#2D7FD3;        /* listen / links */
  --line:#BFDCE8;
  --display:"Fredoka","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:30px;font-weight:700}
h2{font-size:24px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--display)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:999px;
  font-family:var(--display);font-weight:600;font-size:20px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.wide{width:100%}
.btn.ghost{background:var(--paper);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--sea);font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* Top bar */
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;min-width:0}
.bar{height:14px;border-radius:999px;background:var(--paper);overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .35s}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--line);font-size:15px}
.x{width:44px;height:44px;border-radius:50%;background:var(--paper);font-size:20px;border:2px solid var(--line);flex:none}

/* Character + bubble */
.talk{display:flex;align-items:flex-end;gap:12px}
.avatar{flex:none;width:92px;height:92px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:58px;border:3px solid var(--sun);box-shadow:0 4px 0 var(--line)}
.avatar.speaking{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(-3deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border-radius:22px 22px 6px 22px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.bubble .line{font-size:20px;font-weight:600;direction:ltr;text-align:left;font-family:var(--display)}
.bubble .he{margin-top:6px;color:var(--ink-soft);font-size:16px}
.bubble .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sky);font-weight:500;font-size:15px}

/* Word / phrase card */
.card{background:var(--paper);border-radius:28px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 6px 0 var(--line);text-align:center}
.pic{font-size:110px;line-height:1.1}
.word{font-size:46px;font-weight:700;direction:ltr;font-family:var(--display);line-height:1.15;overflow-wrap:anywhere}
.word.phrase{font-size:28px}
.word-he{color:var(--ink-soft);font-size:18px}
.who{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.speak{width:72px;height:72px;border-radius:50%;background:var(--sea);color:#fff;font-size:32px;box-shadow:0 5px 0 #1B5C9F;flex:none}
.speak:active{transform:translateY(3px);box-shadow:0 2px 0 #1B5C9F}
.speak.slow{background:var(--leaf);box-shadow:0 5px 0 #1F8A5C}
.dlg{width:100%;display:flex;flex-direction:column;gap:10px;text-align:left;direction:ltr}
.dlg .q,.dlg .a{border-radius:18px;padding:12px 14px;font-family:var(--display);font-size:20px;font-weight:600}
.dlg .q{background:var(--sky);margin-right:32px}
.dlg .a{background:#FFF6DA;margin-left:32px}
.dlg .a small{display:block;direction:rtl;text-align:right;font-family:var(--body);font-weight:400;font-size:15px;color:var(--ink-soft)}

/* Choices */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid.one{grid-template-columns:1fr}
.opt{background:var(--paper);border-radius:22px;min-height:120px;display:grid;place-items:center;font-size:64px;box-shadow:0 5px 0 var(--line);border:3px solid transparent;transition:transform .08s;padding:10px}
.opt.text{min-height:64px;font-size:19px;font-weight:500;line-height:1.35}
.opt.text.en{font-size:19px;font-weight:600;text-align:left}
.opt:active{transform:translateY(3px)}
.opt.good{border-color:var(--leaf);background:#E6F8EF}
.opt.bad{border-color:var(--berry);background:#FDECEF;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prompt-word{font-size:44px;font-weight:700;text-align:center;direction:ltr;background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line);font-family:var(--display);overflow-wrap:anywhere}
.prompt-word.phrase{font-size:26px}

/* Sentence builder */
.slot{min-height:72px;background:var(--paper);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;direction:ltr;border:3px dashed var(--line)}
.slot.good{border:3px solid var(--leaf);background:#E6F8EF}
.slot.bad{border:3px solid var(--berry);animation:shake .3s}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tok{min-height:46px;padding:0 14px;border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:600;font-size:19px}
.tok.used{visibility:hidden}
.slot .tok{background:#FFF6DA;box-shadow:0 4px 0 #F0D78C}

/* Mic */
.mic{width:110px;height:110px;border-radius:50%;background:var(--berry);color:#fff;font-size:46px;box-shadow:0 6px 0 #B73350}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,80,106,.5),0 6px 0 #B73350}100%{box-shadow:0 0 0 22px rgba(232,80,106,0),0 6px 0 #B73350}}
.heard{min-height:24px;color:var(--ink-soft);font-size:16px}
.mic.small{width:72px;height:72px;font-size:30px}
.center{text-align:center}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Home */
.hero{background:var(--paper);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--line)}
.today-topic{display:flex;align-items:center;gap:14px}
.today-topic .big{font-size:52px;flex:none}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--paper);border:3px dashed var(--line)}
.dot.done{border:3px solid var(--leaf);background:#E6F8EF}
.dot.next{border:3px solid var(--sun);background:#FFF6DA;animation:bob 1s ease-in-out infinite alternate}
.dot.lock{opacity:.45}

/* Onboarding */
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.char{background:var(--paper);border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;box-shadow:0 5px 0 var(--line)}
.char .e{font-size:42px;line-height:1.1}
.char .n{font-family:var(--display);font-weight:600;font-size:17px;direction:ltr}
.char[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
.courses{display:flex;flex-direction:column;gap:10px}
.group{display:flex;flex-direction:column;gap:10px}
.group+.group{margin-top:8px}
.course{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:12px 16px;text-align:right;box-shadow:0 5px 0 var(--line);border:3px solid transparent}
.course .e{font-size:38px;flex:none}
.course b{display:block;font-family:var(--display);font-size:19px;font-weight:600}
.course span{color:var(--ink-soft);font-size:15px}
.course[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
.kidrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;font-size:20px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}

/* Reading */
.story{align-items:stretch;text-align:left}
.story-text{direction:ltr;font-family:var(--display);font-size:21px;font-weight:500;line-height:1.55;max-width:60ch}
.story-he{direction:rtl;text-align:right;color:var(--ink-soft);font-size:16px;border-top:2px dashed var(--line);padding-top:10px}
.qtext{font-family:var(--display);font-size:22px;font-weight:600;direction:ltr;text-align:left}
/* Writing */
.slot.spell{justify-content:center;min-height:68px}
.tok.letter{min-width:44px;font-size:22px;text-transform:lowercase}
.blank{display:inline-block;width:44px;height:46px;border-bottom:3px solid var(--line)}
.field input.good{border-color:var(--leaf);background:#E6F8EF}
.field input.bad{border-color:var(--berry);animation:shake .3s}
/* Scores, settings */
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--paper);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 var(--line);min-width:0}
.stat .label{font-size:12px;letter-spacing:.02em}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.score{display:flex;flex-direction:column;align-items:center;gap:2px}
.score b{font-family:var(--display);font-size:64px;line-height:1;color:var(--leaf);font-variant-numeric:tabular-nums}
.score.low b{color:var(--berry)}
.score span{font-weight:700}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.missed .label{width:100%}
.missed .en{background:#FFF6DA;border-radius:999px;padding:4px 12px;font-weight:600}
.hero.test{background:#EAF3FF}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segb{min-height:48px;border-radius:14px;background:var(--sky);font-weight:600;border:3px solid transparent}
.segb[aria-pressed=true]{border-color:var(--sun);background:#FFF6DA}
a.btn{text-decoration:none}
/* Store */
.avatar{position:relative}
.avatar .acc{position:absolute;top:-10px;right:-6px;font-size:34px;line-height:1}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shopitem{background:var(--paper);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;min-width:0}
.shopitem .se{font-size:34px;line-height:1.2}
.shopitem .swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line)}
.shopitem b{font-size:14px;font-weight:600}
.shopitem span:last-child{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.shopitem.on{border-color:var(--leaf);background:#E6F8EF}
button.chip{cursor:pointer}
/* Parents */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.barcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.barcol i{display:block;width:100%;max-width:28px;background:var(--leaf);border-radius:6px 6px 0 0}
.barcol i.low{background:var(--berry)}
.barcol .bv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.barcol .bd{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ptable{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.ptable th{font-size:13px;color:var(--ink-soft);font-weight:600}
/* Welcome */
.welcome{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.welcome .avatar.big{width:150px;height:150px;font-size:96px;border-width:4px;animation:bob 1.2s ease-in-out infinite alternate}
.welcome .avatar.big .acc{font-size:52px;top:-14px;right:-4px}
.welcome .wave{font-size:44px;animation:wave 1s ease-in-out infinite alternate;transform-origin:70% 70%}
@keyframes wave{to{transform:rotate(20deg)}}
.welcome h1{font-size:40px}
.welcome .hello{font-size:24px;font-weight:600;color:var(--sea)}
.welcome .sub{color:var(--ink-soft);max-width:34ch}
/* Games */
.gamelist{display:flex;flex-direction:column;gap:10px}
.hero.games-card{background:#FFF6DA}
.hero.games-card .row{flex-wrap:nowrap}
.hero.games-card .row .btn{flex:1;min-width:0;padding:0 12px;font-size:18px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem.two{grid-template-columns:repeat(2,1fr)}
.mcard{aspect-ratio:3/4;max-width:100%;border-radius:16px;background:var(--sea);box-shadow:0 4px 0 #1B5C9F;color:#fff;display:grid;place-items:center;padding:6px;overflow:hidden;border:3px solid transparent}
.mem.two .mcard{aspect-ratio:auto;min-height:92px}
.mcard::before{content:"?";font-family:var(--display);font-size:34px;font-weight:700}
.mcard .front{display:none;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere;color:var(--ink)}
.mcard .front.en{direction:ltr}
.mcard .front.emo{font-size:44px}
.mcard.open,.mcard.done{background:var(--paper);box-shadow:0 4px 0 var(--line)}
.mcard.open::before,.mcard.done::before{content:none}
.mcard.open .front,.mcard.done .front{display:block}
.mcard.done{background:#E6F8EF;border-color:var(--leaf)}
.timer{height:14px;border-radius:999px;background:var(--paper);border:2px solid var(--line);overflow:hidden}
.timer>i{display:block;height:100%;width:100%;background:var(--sun);transition:width 1s linear}
.target{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--paper);border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--line);font-size:48px;line-height:1.1}
.target .he{font-size:20px;font-weight:600}
.lives{font-size:18px;letter-spacing:1px;flex:none}
.catch{position:relative;height:54vh;min-height:300px;background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 5px 0 var(--line);touch-action:manipulation}
.drop{position:absolute;top:0;left:0;max-width:72%;padding:8px 14px;border-radius:18px;background:#FFF6DA;box-shadow:0 3px 0 #F0D78C;font-family:var(--display);font-weight:600;font-size:18px;direction:ltr;text-align:center;will-change:transform}
.drop.bad{background:#FDECEF;box-shadow:0 3px 0 #E8A0AE}
/* Dictionary */
.dict{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 var(--line);text-align:right;width:100%}
.drow .de{font-size:28px;flex:none;width:40px;text-align:center}
.drow .dt{flex:1;min-width:0}
.drow .dt b{display:block;direction:ltr;text-align:left;font-family:var(--display);font-size:18px;overflow-wrap:anywhere}
.drow .dt span{color:var(--ink-soft);font-size:14px}
.drow .tag{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#FDECEF;color:#B73350}
.chars.mini{width:100%;grid-template-columns:repeat(4,1fr);gap:8px}
.chars.mini .char{padding:8px 4px}
.chars.mini .char .e{font-size:32px}
.chars.mini .char .n{font-size:14px}
.welcome{min-height:0;padding-block:8px}
.kidrow .course{padding:10px 12px;gap:10px}
.kidrow .course .e{font-size:30px}
.kidrow .course b{font-size:17px;text-wrap:balance}
.kidrow .course>span:last-child{min-width:0}
.kidrow .course span span{white-space:nowrap}
.hero.bagrut{background:#E6F3FF}
.backhome-bar{display:flex;align-items:center;gap:10px}
.x.backhome{font-size:22px;font-weight:700}
.prog-card{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:right}
.prog-card>*{width:100%}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.prog-row b{font-size:16px}
.pbar{height:14px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3DBE8B,#2D7FD3);transition:width .6s}
.fam-code .code{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center}
.fam-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.fam-row .m{font-size:24px}.fam-row .e{font-size:26px}
.fam-app{font-size:15px;line-height:1.5;padding:4px 0}.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.smart-card{background:#EEF6FF}
.chat-card{background:#FFF0F6}
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:18px;background:var(--paper,#fff);border:2px solid var(--line);font-weight:600;font-size:15px;min-height:84px}
.tpc span{font-size:28px}
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:8px;min-height:40vh}
.cmsg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.cmsg.me{flex-direction:column;align-items:flex-start}
.cmsg .cb{background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 2px 0 var(--line);max-width:85%;font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.cmsg.me .cb{background:#D8F0FF;align-self:flex-start;text-align:left}
.cmsg.bot{flex-direction:row}
.cmsg.bot .cb{text-align:left}
.cmsg .tr{direction:rtl;text-align:right;color:var(--soft);font-size:15px;margin-top:6px}
.cmsg .tools{display:flex;gap:6px;margin-top:6px}
.avatar-s{font-size:30px;flex:none}
.cb.sys{background:#FFF4D6;text-align:center;max-width:100%}
.cfix{background:#FFF6EC;border:2px dashed #F6C79F;border-radius:14px;padding:8px 12px;font-size:15px;max-width:90%;display:flex;flex-direction:column;gap:4px}
.cfix.good{background:#EAF8EF;border-color:#9ED9B4}
.cfix .tip{color:var(--soft)}
.cfix .en-line{text-align:left;font-weight:600;font-size:16px}.cfix .en-line.soft{font-weight:400}
.fx-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.strike{text-decoration:line-through;color:var(--soft)}
.composer{position:sticky;bottom:0;background:var(--sky);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;border-radius:16px;border:2px solid var(--line);padding:10px 12px;font:inherit;font-size:17px;resize:none;text-align:left}
.dots{display:inline-flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--soft);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}

const BAGRUT={"amir":{"R":[["When penicillin became widely available in the 1940s, it transformed medicine. Infections that had once been fatal, such as pneumonia and infected wounds, could suddenly be cured within days. Yet even in those early years, scientists warned that bacteria might eventually adapt to the new drugs. That warning has proved accurate. Today, antibiotic resistance is regarded by many health organizations as one of the most serious threats to global health.\n\nResistance develops through a process of natural selection. In any large population of bacteria, a few individuals may carry genetic mutations that allow them to survive a particular antibiotic. When the drug is used, the vulnerable bacteria die, while the resistant ones survive and multiply. Over time, the resistant strain becomes dominant. Bacteria can also exchange genetic material with one another, so resistance that appears in one species may spread to others.\n\nHuman behaviour has greatly accelerated this process. Antibiotics are frequently prescribed for viral infections, such as the common cold, against which they have no effect. Patients often stop taking their medication as soon as they feel better, leaving the most resistant bacteria alive. In addition, large quantities of antibiotics are given to farm animals, not to treat illness but to promote faster growth.\n\nAddressing the problem is complicated by economic factors. Developing a new antibiotic is expensive and can take more than a decade. Moreover, because doctors are encouraged to reserve new antibiotics for cases in which older drugs have failed, sales are likely to remain low. As a result, few pharmaceutical companies consider such research profitable.\n\nExperts therefore argue that solutions must combine several approaches: more careful prescribing, stricter rules on agricultural use, better diagnostic tests and new funding models that reward companies for developing drugs even if those drugs are rarely used.","כאשר הפניצילין נעשה זמין באופן נרחב בשנות הארבעים של המאה העשרים, הוא חולל מהפכה ברפואה. זיהומים שהיו פעם קטלניים, כמו דלקת ריאות ופצעים מזוהמים, ניתנו לפתע לריפוי בתוך ימים. אך כבר באותן שנים מוקדמות הזהירו מדענים שהחיידקים עלולים בסופו של דבר להסתגל לתרופות החדשות. אזהרה זו התבררה כמדויקת. כיום, ארגוני בריאות רבים רואים בעמידות לאנטיביוטיקה את אחד האיומים החמורים ביותר על בריאות העולם.\n\nהעמידות מתפתחת בתהליך של ברירה טבעית. בכל אוכלוסייה גדולה של חיידקים, מעטים עשויים לשאת מוטציות גנטיות המאפשרות להם לשרוד אנטיביוטיקה מסוימת. כאשר משתמשים בתרופה, החיידקים הפגיעים מתים, ואילו העמידים שורדים ומתרבים. עם הזמן הופך הזן העמיד לדומיננטי. חיידקים יכולים גם להחליף ביניהם חומר גנטי, כך שעמידות המופיעה במין אחד עלולה להתפשט לאחרים.\n\nההתנהגות האנושית האיצה מאוד את התהליך. אנטיביוטיקה נרשמת לעיתים קרובות לזיהומים נגיפיים, כמו הצטננות, שנגדם אין לה כל השפעה. מטופלים מפסיקים לעיתים קרובות ליטול את התרופה ברגע שהם מרגישים טוב יותר, ומשאירים בחיים את החיידקים העמידים ביותר. בנוסף, כמויות גדולות של אנטיביוטיקה ניתנות לבעלי חיים בחוות, לא כדי לטפל במחלות אלא כדי לזרז את גדילתם.\n\nההתמודדות עם הבעיה מסובכת בשל גורמים כלכליים. פיתוח אנטיביוטיקה חדשה יקר ועשוי להימשך יותר מעשור. יתרה מזאת, מאחר שרופאים מתבקשים לשמור אנטיביוטיקה חדשה למקרים שבהם תרופות ותיקות נכשלו, המכירות צפויות להישאר נמוכות. כתוצאה מכך, מעט חברות תרופות רואות במחקר כזה עסק רווחי.\n\nלכן טוענים מומחים שהפתרונות חייבים לשלב כמה גישות: רישום זהיר יותר של תרופות, כללים מחמירים יותר לשימוש בחקלאות, בדיקות אבחון טובות יותר ומודלים חדשים של מימון שיתגמלו חברות על פיתוח תרופות גם אם ייעשה בהן שימוש רק לעיתים רחוקות.",[["What is the main idea of the passage?","Antibiotic resistance is a growing threat with biological, behavioural and economic causes.","Penicillin was the most important invention of the twentieth century.","Antibiotics should no longer be used in medicine.","Viral infections are more dangerous than bacterial infections."],["According to the second paragraph, how can resistance spread from one species of bacteria to another?","Bacteria can exchange genetic material with one another.","Resistant bacteria destroy other species.","Patients pass antibiotics to one another.","Viruses carry antibiotics between bacteria."],["Why does the author mention the common cold?","To give an example of antibiotics being used when they cannot help","To show that antibiotics are effective against viruses","To compare the dangers of a cold and pneumonia","To explain how penicillin was first discovered"],["It can be inferred from the fourth paragraph that a new antibiotic...","may earn its developer little money even if it works well","can usually be developed in less than a year","is immediately prescribed for all infections","is cheaper to develop than older drugs"],["The phrase 'those drugs' in the last sentence refers to...","new antibiotics developed by companies","antibiotics given to farm animals","older drugs that have failed","diagnostic tests"]],"When Medicines Stop Working"],["For most of human history, people measured time by natural events rather than by numbers. Farmers began work at sunrise and stopped at sunset, and the length of an hour could vary with the seasons. The spread of mechanical clocks in European towns from the fourteenth century onward gradually changed this relationship with time, although the change was far slower than is often assumed.\n\nEarly public clocks were placed in church towers and town squares, where they regulated religious services, markets and the opening of city gates. However, they were notoriously inaccurate, often gaining or losing a quarter of an hour each day. For centuries, therefore, they served more as symbols of civic pride than as precise instruments.\n\nThe decisive shift came with industrialization in the eighteenth and nineteenth centuries. Factory owners needed large numbers of workers to arrive at the same time and to work fixed shifts, since machines could not run efficiently otherwise. Workers who had previously controlled the pace of their own labour were now paid by the hour and fined for lateness. Some historians argue that this represented not merely a technical change but a profound transformation in how people thought about their lives: time became something to be spent, saved or wasted.\n\nThe railway completed this process. Before trains, each town kept its own local time, based on the position of the sun. A difference of a few minutes between neighbouring towns hardly mattered when travel was slow. Once trains ran according to timetables, however, such differences caused confusion and even accidents. Railway companies consequently adopted standard times, and governments eventually followed their example.\n\nToday, when phones display the time to the second, it is easy to forget that the precise, uniform time we take for granted is a relatively recent invention.","במשך רוב ההיסטוריה האנושית מדדו בני האדם את הזמן לפי אירועים בטבע ולא לפי מספרים. חקלאים החלו לעבוד עם הזריחה והפסיקו עם השקיעה, ואורכה של שעה יכול היה להשתנות לפי עונות השנה. התפשטות השעונים המכניים בערי אירופה החל מהמאה הארבע-עשרה שינתה בהדרגה את היחס הזה לזמן, אף שהשינוי היה איטי בהרבה ממה שנהוג להניח.\n\nהשעונים הציבוריים הראשונים הוצבו במגדלי כנסיות ובכיכרות העיר, ושם הסדירו את מועדי התפילות, השווקים ופתיחת שערי העיר. אולם הם היו ידועים בחוסר הדיוק שלהם, ולעיתים קרובות הקדימו או איחרו ברבע שעה בכל יום. לכן, במשך מאות שנים שימשו יותר כסמלים של גאווה עירונית מאשר ככלים מדויקים.\n\nהמפנה המכריע הגיע עם התיעוש במאות השמונה-עשרה והתשע-עשרה. בעלי מפעלים נזקקו לכך שמספרים גדולים של עובדים יגיעו באותה שעה ויעבדו במשמרות קבועות, שכן אחרת המכונות לא יכלו לפעול ביעילות. עובדים שבעבר שלטו בקצב עבודתם קיבלו כעת שכר לפי שעה ונקנסו על איחורים. יש היסטוריונים הטוענים שלא היה זה רק שינוי טכני אלא תמורה עמוקה באופן שבו אנשים חשבו על חייהם: הזמן הפך לדבר שאפשר לבזבז, לחסוך או להוציא.\n\nהרכבת השלימה את התהליך. לפני הרכבות, כל עיר החזיקה בזמן מקומי משלה, שהתבסס על מיקום השמש. הפרש של כמה דקות בין ערים שכנות כמעט לא היה משנה כאשר הנסיעה הייתה איטית. אולם משהחלו רכבות לנסוע לפי לוחות זמנים, הפרשים כאלה גרמו לבלבול ואף לתאונות. לכן אימצו חברות הרכבת זמנים אחידים, ולבסוף הלכו הממשלות בעקבותיהן.\n\nכיום, כשהטלפונים מציגים את השעה עד לרמת השנייה, קל לשכוח שהזמן המדויק והאחיד שאנו רואים בו דבר מובן מאליו הוא המצאה חדשה יחסית.",[["What is the passage mainly about?","How people's experience of time changed over several centuries","Why early clocks were so inaccurate","How railways were built in Europe","Why farmers preferred to measure time by the sun"],["According to the second paragraph, early public clocks...","were more important as symbols than as accurate tools","were extremely precise instruments","were found mainly in factories","were used mostly by railway companies"],["Why did factory owners require fixed working hours?","Their machines could run efficiently only if workers arrived together.","Workers demanded to be paid by the hour.","The church insisted on fixed working hours.","Clocks had become much cheaper than before."],["What does the author suggest in the first paragraph about the change in people's relationship with time?","It took longer than many people believe.","It happened almost overnight.","It began with the invention of the railway.","It was opposed by town governments."],["Why did local time become a problem once trains appeared?","Small differences between towns caused confusion in timetables.","Trains were too slow to keep to their schedules.","Many towns refused to build railway stations.","The sun could no longer be used to measure time."]],"Clocks and the Discipline of Time"],["Imagine being asked whether the population of a certain city is more or less than five million, and then being asked to estimate the actual figure. Research in psychology suggests that your estimate would be strongly influenced by the number you heard first, even if you knew that number had been chosen at random. This tendency, known as the anchoring effect, is one of the most robust findings in the study of human judgment.\n\nIn classic experiments, participants were shown a random number, for example by spinning a wheel, before answering a factual question. Those who saw a high number consistently gave higher estimates than those who saw a low one. Remarkably, the effect appeared even among experts. In one study, experienced judges who read a case and were given an arbitrary sentencing suggestion recommended longer sentences when the suggestion was high.\n\nWhy does anchoring occur? One explanation is that people start from the initial number and adjust away from it, but they tend to stop adjusting too soon. Another is that the anchor brings to mind information consistent with it, making certain answers seem more plausible.\n\nThe effect has obvious commercial applications. Shops often display a high original price next to a sale price, making the discounted product appear to be a bargain. Similarly, in salary negotiations, the first figure mentioned frequently shapes the final agreement, which is why negotiators are sometimes advised to make the first offer.\n\nCan people protect themselves against anchoring? Simply being aware of the effect appears to help only slightly. A more effective strategy may be to consider deliberately why the anchor might be wrong, or to form one's own estimate before encountering any figures. Even so, researchers caution that no technique eliminates the bias entirely.","דמיינו שאתם נשאלים אם אוכלוסייתה של עיר מסוימת גדולה או קטנה מחמישה מיליון, ולאחר מכן מתבקשים להעריך את המספר האמיתי. מחקרים בפסיכולוגיה מראים שההערכה שלכם תושפע מאוד מהמספר ששמעתם ראשון, גם אם ידעתם שמספר זה נבחר באקראי. נטייה זו, המכונה אפקט העיגון, היא אחד הממצאים המבוססים ביותר בחקר שיפוט האדם.\n\nבניסויים קלאסיים הוצג למשתתפים מספר אקראי, למשל באמצעות סיבוב גלגל, לפני שענו על שאלה עובדתית. אלה שראו מספר גבוה נתנו באופן עקבי הערכות גבוהות יותר מאלה שראו מספר נמוך. באופן מפתיע, האפקט הופיע אפילו בקרב מומחים. במחקר אחד, שופטים מנוסים שקראו תיק וקיבלו הצעת עונש שרירותית המליצו על עונשים ארוכים יותר כאשר ההצעה הייתה גבוהה.\n\nמדוע מתרחש העיגון? הסבר אחד הוא שאנשים מתחילים מהמספר הראשוני ומתרחקים ממנו בהדרגה, אך נוטים להפסיק את ההתאמה מוקדם מדי. הסבר אחר הוא שהעוגן מעלה בתודעה מידע התואם אותו, וכך תשובות מסוימות נראות סבירות יותר.\n\nלאפקט יש יישומים מסחריים ברורים. חנויות מציגות לעיתים קרובות מחיר מקורי גבוה ליד מחיר המבצע, וכך המוצר המוזל נראה כמציאה. באופן דומה, במשא ומתן על שכר, הסכום הראשון שמוזכר מעצב לעיתים קרובות את ההסכם הסופי, ולכן ממליצים לפעמים למנהלי משא ומתן להציע את ההצעה הראשונה.\n\nהאם אנשים יכולים להגן על עצמם מפני עיגון? נראה שעצם המודעות לאפקט מסייעת רק במעט. אסטרטגיה יעילה יותר עשויה להיות לשקול במכוון מדוע העוגן עלול להיות שגוי, או לגבש הערכה עצמאית לפני שנחשפים למספרים כלשהם. ועדיין, החוקרים מזהירים שאף טכניקה אינה מבטלת את ההטיה לחלוטין.",[["What is the main topic of the passage?","The tendency of an initial number to influence later judgments","The population of large cities","The methods judges use to decide on sentences","Why shops offer discounts during sales"],["The study of judges is mentioned in order to show that...","even experienced professionals are affected by anchoring","judges usually give very short sentences","random numbers are often used in courts","experts are immune to the anchoring effect"],["According to the third paragraph, one reason for anchoring is that people...","do not move far enough away from the first number","forget the first number immediately","deliberately choose random answers","prefer low numbers to high ones"],["Why might negotiators be advised to make the first offer?","The first figure mentioned often shapes the final agreement.","The other side usually rejects the first offer.","It is considered polite in most cultures.","It allows them to avoid mentioning any number."],["What can be inferred from the last paragraph?","Knowing about anchoring is not enough to avoid it.","Anchoring can be eliminated completely with training.","Researchers believe that anchoring is harmless.","People should avoid making estimates altogether."]],"The Power of the First Number"],["Plastic was once celebrated as a miracle material: cheap, light, durable and endlessly adaptable. Its durability, however, has turned out to be a serious problem. Most plastics do not biodegrade in any meaningful sense. Instead, exposed to sunlight, waves and friction, they break down into ever smaller fragments. Pieces smaller than five millimetres are known as microplastics, and they have now been detected almost everywhere scientists have looked, from deep ocean trenches to Arctic snow.\n\nMicroplastics come from two main sources. Some are manufactured at a small size, such as the tiny beads once common in cosmetic scrubs; many countries have since banned these products. Far more, however, result from the breakdown of larger items, including bottles, bags and fishing nets. Synthetic clothing is another significant source, as fibres are released every time such garments are washed.\n\nThe environmental effects are still being investigated. Marine animals, from plankton to whales, swallow microplastics, which may cause physical damage or reduce their ability to absorb nutrients. There is also concern that the particles can carry harmful chemicals, either additives used in manufacturing or pollutants that attach to their surface in the water.\n\nWhether microplastics pose a direct threat to human health remains uncertain. They have been found in drinking water, seafood and even human blood, but researchers have not yet established what levels, if any, are dangerous. Part of the difficulty is methodological: the particles vary enormously in size, shape and chemical composition, and samples are easily contaminated by plastic in the laboratory itself.\n\nBecause removing microplastics from the environment is practically impossible, most experts agree that the only realistic approach is to prevent them from forming in the first place. This means reducing plastic production, improving waste management and designing products that shed fewer fibres.","פעם זכה הפלסטיק לשבחים כחומר פלא: זול, קל, עמיד וניתן להתאמה כמעט לכל שימוש. אולם עמידותו התבררה כבעיה רצינית. רוב סוגי הפלסטיק אינם מתכלים באופן ביולוגי במובן ממשי כלשהו. במקום זאת, בחשיפה לאור השמש, לגלים ולחיכוך, הם מתפרקים לשברים קטנים יותר ויותר. חלקיקים הקטנים מחמישה מילימטרים מכונים מיקרופלסטיק, והם התגלו כמעט בכל מקום שבו חיפשו מדענים, משקעים עמוקים באוקיינוס ועד שלג באזור הארקטי.\n\nלמיקרופלסטיק שני מקורות עיקריים. חלקו מיוצר מלכתחילה בגודל קטן, כמו החרוזים הזעירים שהיו נפוצים בעבר בתכשירי פילינג; מדינות רבות אסרו מאז על מוצרים אלה. אולם חלק גדול בהרבה נוצר מהתפרקות של פריטים גדולים יותר, כולל בקבוקים, שקיות ורשתות דיג. ביגוד סינתטי הוא מקור משמעותי נוסף, שכן סיבים משתחררים בכל פעם שבגדים כאלה מכובסים.\n\nההשפעות הסביבתיות עדיין נחקרות. בעלי חיים ימיים, מפלנקטון ועד לווייתנים, בולעים מיקרופלסטיק, שעלול לגרום לנזק פיזי או לפגוע ביכולתם לספוג חומרים מזינים. קיים גם חשש שהחלקיקים יכולים לשאת כימיקלים מזיקים, בין אם תוספים המשמשים בייצור ובין אם מזהמים הנצמדים לפני השטח שלהם במים.\n\nעדיין לא ברור אם מיקרופלסטיק מהווה איום ישיר על בריאות האדם. הוא נמצא במי שתייה, במאכלי ים ואפילו בדם האדם, אך החוקרים טרם קבעו אילו רמות, אם בכלל, מסוכנות. חלק מהקושי הוא מתודולוגי: החלקיקים שונים מאוד זה מזה בגודל, בצורה ובהרכב הכימי, ודגימות מזדהמות בקלות מפלסטיק שנמצא במעבדה עצמה.\n\nמאחר שסילוק מיקרופלסטיק מהסביבה הוא כמעט בלתי אפשרי, רוב המומחים מסכימים שהגישה המציאותית היחידה היא למנוע את היווצרותו מלכתחילה. משמעות הדבר היא צמצום ייצור הפלסטיק, שיפור הטיפול בפסולת ותכנון מוצרים שמשחררים פחות סיבים.",[["What is the main purpose of the passage?","To describe the sources, effects and uncertainties of microplastic pollution","To argue that all plastic should be banned immediately","To explain how plastic is manufactured","To prove that microplastics cause serious human diseases"],["According to the passage, most microplastics...","come from larger plastic items that break apart","are produced for cosmetic products","biodegrade quickly in sea water","are found only in the ocean"],["The word 'they' in 'they have now been detected almost everywhere' refers to...","microplastics","scientists","waves","ocean trenches"],["Why is it difficult to study the effect of microplastics on human health?","The particles vary greatly and samples are easily contaminated.","Microplastics have never been found in the human body.","Scientists are not interested in human health.","Laboratories are not allowed to use plastic."],["Which statement best reflects the author's view in the last paragraph?","Preventing microplastics is more realistic than removing them.","Cleaning microplastics from the ocean is the best solution.","Nothing at all can be done about microplastics.","Synthetic clothing should be banned by law."]],"The Invisible Pollutant"],["Young children learning English often say things like I goed to the park or two mouses, forms they have almost certainly never heard from adults. At first glance, these errors might seem to show that the child's language is getting worse. In fact, linguists regard them as evidence of an important step in language development.\n\nInterestingly, many children first use irregular forms such as went and mice correctly. At this early stage, they appear to memorize each word as a separate item. Later, as they hear more and more regular forms such as walked and cats, they begin to extract the underlying rule: add -ed to form the past tense, add -s to form the plural. Having discovered the rule, they then apply it too widely, a process known as overregularization. Only gradually do they learn which words are exceptions, and the correct irregular forms return.\n\nThis U-shaped pattern, in which performance first improves, then declines, and finally improves again, has been influential in debates about how language is acquired. If children simply imitated what they heard, they would never produce forms like goed. The errors therefore suggest that children are actively constructing a grammatical system rather than merely copying adults.\n\nNot all researchers interpret the evidence in the same way, however. Some argue that children do not learn abstract rules at all but rely on statistical patterns in the language they hear; according to this view, overregularization occurs because regular forms are far more frequent. Computer models based on this idea have reproduced some aspects of children's errors, although their success remains debated.\n\nWhatever the explanation, one practical conclusion is widely accepted: parents need not worry about such mistakes. Correcting them repeatedly has little effect, and they usually disappear on their own as the child's experience with language grows.","ילדים צעירים הלומדים אנגלית אומרים לעיתים קרובות דברים כמו I goed to the park או two mouses, צורות שכמעט בוודאות לא שמעו מעולם ממבוגרים. במבט ראשון, נראה שהשגיאות האלה מעידות על כך ששפתו של הילד הולכת ומתדרדרת. למעשה, בלשנים רואים בהן עדות לשלב חשוב בהתפתחות השפה.\n\nמעניין שילדים רבים משתמשים תחילה בצורות חריגות כמו went ו-mice באופן נכון. בשלב מוקדם זה נראה שהם משננים כל מילה כפריט נפרד. מאוחר יותר, ככל שהם שומעים יותר ויותר צורות סדירות כמו walked ו-cats, הם מתחילים לחלץ את הכלל שבבסיסן: מוסיפים ed- כדי ליצור זמן עבר, ומוסיפים s- כדי ליצור רבים. לאחר שגילו את הכלל, הם מיישמים אותו באופן רחב מדי, תהליך המכונה הכללת יתר. רק בהדרגה הם לומדים אילו מילים הן יוצאות דופן, והצורות החריגות הנכונות חוזרות.\n\nדפוס זה, דמוי האות U, שבו הביצועים משתפרים תחילה, אחר כך יורדים ולבסוף משתפרים שוב, השפיע רבות על הוויכוחים בשאלה כיצד נרכשת שפה. אילו ילדים היו רק מחקים את מה ששמעו, הם לעולם לא היו מפיקים צורות כמו goed. לכן השגיאות מרמזות שילדים בונים באופן פעיל מערכת דקדוקית ולא רק מעתיקים ממבוגרים.\n\nעם זאת, לא כל החוקרים מפרשים את הראיות באותו אופן. יש הטוענים שילדים אינם לומדים כללים מופשטים כלל, אלא נשענים על דפוסים סטטיסטיים בשפה שהם שומעים; לפי השקפה זו, הכללת יתר מתרחשת משום שצורות סדירות שכיחות הרבה יותר. מודלים ממוחשבים המבוססים על רעיון זה שחזרו היבטים מסוימים של שגיאות הילדים, אף שהצלחתם עדיין שנויה במחלוקת.\n\nיהיה ההסבר אשר יהיה, מסקנה מעשית אחת מקובלת על רבים: הורים אינם צריכים לדאוג משגיאות כאלה. תיקון חוזר ונשנה שלהן משפיע מעט, ובדרך כלל הן נעלמות מעצמן ככל שניסיונו של הילד בשפה גדל.",[["What is the main idea of the passage?","Certain grammatical errors show that children are learning language actively.","Children who make such errors have language disorders.","Parents should correct every mistake immediately.","Irregular verbs are gradually disappearing from English."],["According to the second paragraph, why do young children first use went correctly?","They have memorized it as a separate word.","They have already learned the rule for the past tense.","Their parents correct them constantly.","It is a regular verb."],["What does the U-shaped pattern refer to?","Performance that improves, declines and then improves again","A steady improvement over time","A gradual decline in children's language","Errors that never disappear"],["How do some researchers in the fourth paragraph explain overregularization?","Regular forms are much more frequent in the language children hear.","Children imitate adults who make the same errors.","Children are unable to memorize individual words.","Computer games teach children incorrect forms."],["What can be inferred about correcting children's errors?","It is generally unnecessary, since the errors fade naturally.","It is the only way to make the errors disappear.","It causes even more errors to appear.","It should begin before the age of one."]],"Why Children Say Goed"],["Every time a person watches a video, clicks on a news article or buys a product online, a recommendation system records the choice and uses it to suggest what to show next. These systems, which rely on algorithms that identify patterns in the behaviour of millions of users, have become central to the business of many technology companies. Their purpose is straightforward: to keep users engaged for as long as possible.\n\nCritics have argued that this approach may have unintended social consequences. If algorithms show people only content similar to what they have previously chosen, users may become trapped in a filter bubble, exposed mainly to views that confirm their existing beliefs. Over time, it is claimed, this could deepen political divisions and make it harder for citizens to agree on basic facts.\n\nThe empirical evidence, however, is more mixed than this picture suggests. Several large studies have found that most users encounter a wider range of sources online than the bubble theory predicts, partly because social networks connect them with acquaintances whose views differ from their own. Other research indicates that people's own choices, rather than algorithms, are the main reason they consume one-sided content. In other words, the bubble may be built less by the machine than by its users.\n\nThis does not mean that recommendation systems are harmless. There is evidence that content provoking strong emotions, particularly anger, tends to attract more engagement and is therefore promoted more widely. Even if algorithms do not isolate users completely, they may still reward sensational or misleading material.\n\nProposed responses range from greater transparency, allowing independent researchers to examine how algorithms work, to giving users more control over what they see. Each approach, however, raises its own difficulties, from the need to protect commercial secrets to the observation that many users rarely change default settings.","בכל פעם שאדם צופה בסרטון, לוחץ על כתבה חדשותית או קונה מוצר ברשת, מערכת המלצות מתעדת את הבחירה ומשתמשת בה כדי להציע מה להציג בהמשך. מערכות אלה, הנשענות על אלגוריתמים המזהים דפוסים בהתנהגותם של מיליוני משתמשים, הפכו למרכזיות בעסקיהן של חברות טכנולוגיה רבות. מטרתן פשוטה: להשאיר את המשתמשים מעורבים זמן רב ככל האפשר.\n\nמבקרים טענו שלגישה זו עלולות להיות השלכות חברתיות בלתי מכוונות. אם אלגוריתמים מציגים לאנשים רק תוכן הדומה למה שבחרו בעבר, המשתמשים עלולים להילכד בבועת סינון, ולהיחשף בעיקר לדעות המאששות את אמונותיהם הקיימות. עם הזמן, כך נטען, הדבר עלול להעמיק את השסעים הפוליטיים ולהקשות על אזרחים להסכים על עובדות בסיסיות.\n\nאולם הראיות האמפיריות מעורבות יותר משתמונה זו מרמזת. כמה מחקרים גדולים מצאו שרוב המשתמשים נחשפים ברשת למגוון רחב יותר של מקורות ממה שתיאוריית הבועה צופה, בין היתר משום שרשתות חברתיות מחברות אותם למכרים שדעותיהם שונות משלהם. מחקרים אחרים מראים שהבחירות של האנשים עצמם, ולא האלגוריתמים, הן הסיבה העיקרית לכך שהם צורכים תוכן חד-צדדי. במילים אחרות, ייתכן שאת הבועה בונה לא כל כך המכונה אלא דווקא המשתמשים בה.\n\nאין פירוש הדבר שמערכות ההמלצה אינן מזיקות. יש ראיות לכך שתוכן המעורר רגשות עזים, במיוחד כעס, נוטה למשוך יותר מעורבות ולכן מקודם באופן נרחב יותר. גם אם האלגוריתמים אינם מבודדים את המשתמשים לחלוטין, הם עדיין עשויים לתגמל חומר סנסציוני או מטעה.\n\nהתגובות המוצעות נעות בין שקיפות רבה יותר, שתאפשר לחוקרים בלתי תלויים לבחון כיצד האלגוריתמים פועלים, לבין מתן שליטה רבה יותר למשתמשים על מה שהם רואים. עם זאת, כל גישה מעוררת קשיים משלה, החל בצורך להגן על סודות מסחריים וכלה בהבחנה שמשתמשים רבים משנים רק לעיתים רחוקות את הגדרות ברירת המחדל.",[["According to the first paragraph, what is the main purpose of recommendation systems?","To keep users engaged for as long as possible","To protect users from misleading content","To expose users to different political views","To reduce the cost of online shopping"],["According to the third paragraph, the evidence for the filter bubble theory is...","less clear than critics have claimed","strong and consistent across all studies","based mainly on political speeches","completely unavailable to researchers"],["The sentence 'the bubble may be built less by the machine than by its users' means that...","users' own choices may matter more than algorithms","algorithms are entirely responsible for the bubble","users are building better machines","machines are designed mainly by their users"],["Why does the author mention content that provokes anger?","To show that algorithms may still have harmful effects","To prove that the filter bubble theory is correct","To explain why users change their settings","To describe how algorithms are programmed"],["According to the last paragraph, what is one difficulty with giving users more control?","Many users rarely change default settings.","Users would no longer see any content.","Algorithms would stop working completely.","Companies would have to reveal all their secrets."]],"Inside the Bubble?"],["When a resource is shared by many people but owned by none, each individual has an incentive to use as much of it as possible. A fisherman who limits his catch to protect fish stocks bears the full cost of his restraint, while the benefits are shared by all, including competitors who continue to fish freely. If everyone reasons in this way, the resource may be exhausted, even though no one wanted this outcome. Economists call this situation the tragedy of the commons.\n\nFor many years, the standard solutions were either government regulation or private ownership. Governments could set limits on fishing or grazing and punish those who exceeded them; alternatively, the resource could be divided among private owners, each of whom would have a direct interest in its long-term health.\n\nLater research, however, challenged the assumption that these were the only options. Studies of communities around the world, from mountain villages managing shared pastures to coastal groups controlling local fisheries, revealed that many had sustained common resources for centuries without either outside regulation or privatization. These communities had developed their own rules, monitored one another's behaviour and imposed gradually increasing penalties on those who broke the rules.\n\nSuch arrangements tended to succeed under particular conditions. The group of users was usually clearly defined, members could communicate easily, and the people who followed the rules had a say in making them. Where these conditions were absent, for instance where users were numerous, anonymous or constantly changing, self-governance was far less likely to work.\n\nThe lesson is not that regulation and markets are unnecessary, but that they are not the only tools available. For problems such as climate change, which involve billions of people, cooperation remains enormously difficult. Yet the experience of local communities shows that the tragedy of the commons is a risk rather than an inevitability.","כאשר משאב משותף לאנשים רבים אך אינו שייך לאף אחד, לכל יחיד יש תמריץ לנצל ממנו כמה שיותר. דייג המגביל את שללו כדי להגן על אוכלוסיית הדגים נושא במלוא העלות של האיפוק שלו, ואילו התועלת מתחלקת בין כולם, כולל מתחרים הממשיכים לדוג בחופשיות. אם כולם חושבים כך, המשאב עלול להתכלות, אף שאיש לא רצה בתוצאה זו. כלכלנים מכנים מצב זה טרגדיית נחלת הכלל.\n\nבמשך שנים רבות, הפתרונות המקובלים היו רגולציה ממשלתית או בעלות פרטית. ממשלות יכלו לקבוע מגבלות על דיג או על רעייה ולהעניש את מי שחרג מהן; לחלופין, אפשר היה לחלק את המשאב בין בעלים פרטיים, שלכל אחד מהם יהיה אינטרס ישיר בשמירה על המשאב לאורך זמן.\n\nאולם מחקרים מאוחרים יותר ערערו על ההנחה שאלה האפשרויות היחידות. מחקרים על קהילות ברחבי העולם, מכפרי הרים המנהלים שטחי מרעה משותפים ועד לקבוצות בחוף השולטות בדיג המקומי, גילו שרבות מהן שמרו על משאבים משותפים במשך מאות שנים בלי רגולציה חיצונית ובלי הפרטה. קהילות אלה פיתחו כללים משלהן, פיקחו זו על התנהגותו של זה והטילו עונשים שהלכו והחמירו על מי שהפר את הכללים.\n\nהסדרים כאלה נטו להצליח בתנאים מסוימים. קבוצת המשתמשים הייתה בדרך כלל מוגדרת בבירור, החברים יכלו לתקשר בקלות, ולמי שציית לכללים הייתה השפעה על קביעתם. במקומות שבהם תנאים אלה לא התקיימו, למשל כאשר המשתמשים היו רבים, אנונימיים או מתחלפים כל הזמן, הסיכוי שניהול עצמי יצליח היה נמוך בהרבה.\n\nהלקח אינו שרגולציה ושווקים מיותרים, אלא שהם אינם הכלים היחידים העומדים לרשותנו. בבעיות כמו שינויי האקלים, המערבות מיליארדי בני אדם, שיתוף פעולה עדיין קשה מאוד. ובכל זאת, ניסיונן של קהילות מקומיות מראה שטרגדיית נחלת הכלל היא סיכון ולא גזירת גורל.",[["What is the main argument of the passage?","Shared resources can sometimes be managed successfully by communities themselves.","Private ownership is the only way to protect shared resources.","Fishermen are responsible for most environmental problems.","Government regulation always fails to protect resources."],["According to the first paragraph, why might a fisherman choose not to limit his catch?","He alone would bear the cost, while everyone would share the benefits.","He does not know that fish stocks are limited.","The government requires him to catch more fish.","He owns the fishing area privately."],["Which of the following is NOT mentioned as a feature of the successful communities?","Receiving financial support from the government","Developing their own rules","Monitoring one another's behaviour","Increasing penalties for those who broke the rules"],["It can be inferred that self-governance would be LEAST likely to succeed...","in a large group of anonymous and changing users","in a small village with clearly defined membership","where users can communicate easily","where those who follow the rules help to make them"],["The phrase 'a risk rather than an inevitability' means that the tragedy of the commons...","can happen but is not certain to happen","will certainly happen in every case","has never actually happened anywhere","is a problem only for small communities"]],"Sharing Without Destroying"],["When people think of intelligent animals, they usually picture apes, dolphins or perhaps crows. Few would think of the octopus, a creature more closely related to snails and clams than to any vertebrate. Yet a growing body of research indicates that octopuses possess remarkable cognitive abilities, and their intelligence raises intriguing questions about how minds evolve.\n\nIn laboratory settings, octopuses have learned to open screw-top jars, find their way through mazes and distinguish between different shapes. Some have been observed escaping from their tanks at night and returning before morning. In the wild, certain species collect coconut shells and carry them across the sea floor for later use as shelters, behaviour that some researchers consider a form of tool use.\n\nWhat makes these abilities especially striking is the octopus's unusual nervous system. Of its roughly 500 million neurons, about two thirds are located not in the brain but in the arms. Each arm can, to a considerable degree, sense and respond to its environment independently, so that an arm may continue to search for food even when the animal's attention appears to be elsewhere. This arrangement differs fundamentally from the centralized nervous systems of mammals and birds.\n\nBecause the last common ancestor of octopuses and humans lived more than 500 million years ago and was probably a simple worm-like animal, complex intelligence must have evolved separately in the two lineages. This suggests that there may be more than one evolutionary route to a sophisticated mind.\n\nOctopus intelligence is all the more puzzling given the animal's short life. Most species live only one or two years and have little contact with their parents, so they cannot learn from older generations. Why such a short-lived, solitary animal should develop such abilities remains an open question, though some scientists point to the demands of hunting in complex environments while avoiding predators without the protection of a shell.","כשאנשים חושבים על בעלי חיים נבונים, הם מדמיינים בדרך כלל קופי אדם, דולפינים או אולי עורבים. מעטים יחשבו על התמנון, יצור הקרוב יותר לחלזונות ולצדפות מאשר לבעל חוליות כלשהו. אולם גוף מחקר הולך וגדל מראה שלתמנונים יכולות קוגניטיביות מרשימות, והאינטליגנציה שלהם מעוררת שאלות מסקרנות על האופן שבו מתפתחת תודעה.\n\nבתנאי מעבדה למדו תמנונים לפתוח צנצנות עם מכסה מתברג, למצוא את דרכם במבוכים ולהבחין בין צורות שונות. חלקם נצפו בורחים מהאקווריום שלהם בלילה וחוזרים לפני הבוקר. בטבע, מינים מסוימים אוספים קליפות קוקוס ונושאים אותן על פני קרקעית הים כדי להשתמש בהן מאוחר יותר כמחסה, התנהגות שחלק מהחוקרים רואים בה סוג של שימוש בכלים.\n\nמה שהופך יכולות אלה למרשימות במיוחד היא מערכת העצבים יוצאת הדופן של התמנון. מתוך כחמש מאות מיליון תאי העצב שלו, כשני שלישים נמצאים לא במוח אלא בזרועות. כל זרוע יכולה, במידה ניכרת, לחוש את סביבתה ולהגיב אליה באופן עצמאי, כך שזרוע עשויה להמשיך לחפש מזון גם כאשר נראה שתשומת הלב של בעל החיים נתונה למקום אחר. מבנה זה שונה באופן יסודי ממערכות העצבים הריכוזיות של יונקים ועופות.\n\nמאחר שהאב הקדמון המשותף האחרון של התמנונים ובני האדם חי לפני יותר מחמש מאות מיליון שנה והיה ככל הנראה בעל חיים פשוט דמוי תולעת, אינטליגנציה מורכבת חייבת הייתה להתפתח בנפרד בשני הענפים. הדבר מרמז שייתכן שיש יותר מדרך אבולוציונית אחת לתודעה מתוחכמת.\n\nהאינטליגנציה של התמנון מעוררת תמיהה רבה עוד יותר לנוכח חייו הקצרים. רוב המינים חיים שנה או שנתיים בלבד ויש להם מגע מועט עם הוריהם, ולכן אינם יכולים ללמוד מדורות קודמים. השאלה מדוע בעל חיים קצר ימים ובודד כזה פיתח יכולות כאלה נותרה פתוחה, אף שיש מדענים המצביעים על הדרישות של ציד בסביבות מורכבות תוך התחמקות מטורפים ללא הגנה של קונכייה.",[["What is the main idea of the passage?","Octopuses are surprisingly intelligent, which raises questions about how minds evolve.","Octopuses are more intelligent than apes and dolphins.","Octopuses are closely related to vertebrates.","Octopuses learn most of their skills from their parents."],["The example of the coconut shells is given to illustrate...","possible tool use by octopuses in the wild","how octopuses escape from laboratory tanks","what octopuses usually eat","how octopuses avoid humans"],["According to the third paragraph, what is unusual about the octopus's nervous system?","Most of its neurons are located in its arms.","It has fewer neurons than a snail.","It is identical to the nervous system of birds.","Its brain controls every movement of its arms."],["What does the author conclude from the evolutionary history of octopuses and humans?","Complex intelligence may evolve in more than one way.","Humans evolved directly from octopuses.","Their common ancestor was highly intelligent.","Intelligence has evolved only once in history."],["Why is the octopus's short life described as puzzling?","It is unclear why a short-lived, solitary animal became so intelligent.","Octopuses with short lives are less intelligent than others.","Octopuses learn everything from older generations.","Short-lived animals are always solitary."]],"A Mind in Eight Arms"]],"C":[["Although the experiment was carefully designed, its results were ___ by a technical error in the equipment.","compromised","enhanced","predicted","celebrated","אף שהניסוי תוכנן בקפידה, תוצאותיו נפגעו בשל תקלה טכנית בציוד."],["The museum's collection has grown ___ over the past decade, from a few hundred objects to several thousand.","considerably","scarcely","reluctantly","temporarily","אוסף המוזיאון גדל במידה ניכרת בעשור האחרון, מכמה מאות פריטים לכמה אלפים."],["Many economists argue that rising interest rates will ___ consumer spending in the coming year.","curb","inspire","donate","deserve","כלכלנים רבים טוענים שעליית הריבית תרסן את הוצאות הצרכנים בשנה הקרובה."],["___ the evidence was limited, the committee decided to approve the new drug.","Although","Because","Unless","Therefore","אף שהראיות היו מוגבלות, הוועדה החליטה לאשר את התרופה החדשה."],["The ancient city was ___ abandoned after a series of severe earthquakes destroyed most of its buildings.","eventually","previously","hardly","rarely","העיר העתיקה ננטשה בסופו של דבר לאחר שסדרה של רעידות אדמה קשות הרסה את רוב בנייניה."],["Unlike his predecessors, who opposed any reform, the new director was ___ to change.","receptive","resistant","hostile","doomed","בניגוד לקודמיו, שהתנגדו לכל רפורמה, המנהל החדש היה פתוח לשינוי."],["The early symptoms of the disease are often ___, so many patients do not seek treatment until it is too late.","subtle","severe","painful","obvious","התסמינים המוקדמים של המחלה הם לעיתים קרובות עדינים וקשים להבחנה, ולכן מטופלים רבים אינם פונים לטיפול iately.","deteriorated","improved","stabilized","recovered","מצבו של המטופל הידרדר במהירות כזאת שהרופאים נאלצו לנתח מיד."],["Most historians now ___ the view that the war was caused by a single event, pointing instead to a complex set of factors.","reject","endorse","support","share","רוב ההיסטוריונים דוחים כיום את ההשקפה שהמלחמה נגרמה בשל אירוע יחיד, ומצביעים במקום זאת על מערך מורכב של גורמים."],["Because of the risk of serious side effects, the drug is ___ to children under the age of twelve.","not prescribed","routinely given","strongly recommended","widely prescribed","בשל הסיכון לתופעות לוואי חמורות, התרופה אינה נרשמת לילדים מתחת לגיל שתים-עשרה."],["The data were collected ___, using exactly the same method in every school.","systematically","carelessly","occasionally","randomly","הנתונים נאספו באופן שיטתי, באותה שיטה בדיוק בכל בית ספר."],["In ___ to earlier studies, which focused on a single country, this one included participants from more than twenty countries.","contrast","spite","order","case","בניגוד למחקרים קודמים, שהתמקדו במדינה אחת, מחקר זה כלל משתתפים מיותר מעשרים מדינות."],["The new bridge will ___ the journey between the two cities by almost an hour.","shorten","lengthen","delay","extend","הגשר החדש יקצר את הנסיעה בין שתי הערים בכמעט שעה."],["The professor's explanations were so ___ that even complex ideas seemed simple.","lucid","obscure","tedious","confusing","ההסברים של הפרופסור היו בהירים כל כך שאפילו רעיונות מורכבים נראו פשוטים."],["The results were ___ with the hypothesis, so the researchers had to reconsider their assumptions.","inconsistent","consistent","compatible","identical","התוצאות לא תאמו את ההשערה, ולכן החוקרים נאלצו לשקול מחדש את הנחותיהם."],["Climate change is expected to ___ existing water shortages in regions that are already dry.","exacerbate","alleviate","resolve","reverse","צפוי ששינויי האקלים יחריפו את המחסור הקיים במים באזורים שכבר עכשיו יבשים."],["The ancient Romans built roads so ___ that some of them are still in use today.","durable","fragile","temporary","narrow","הרומאים הקדמונים בנו כבישים עמידים כל כך שחלקם עדיין בשימוש כיום."],["Throughout the study, researchers ___ the participants' progress over a period of five years.","monitored","ignored","prevented","abolished","לאורך המחקר עקבו החוקרים אחר התקדמות המשתתפים במשך חמש שנים."],["The decline in bee populations has ___ serious concern among farmers, who depend on bees to pollinate their crops.","raised","relieved","reduced","removed","הירידה באוכלוסיות הדבורים עוררה דאגה רצינית בקרב חקלאים, התלויים בדבורים להאבקת היבולים שלהם."],["His theory was dismissed at first, but it was ___ accepted by the scientific community.","ultimately","initially","never","rarely","התיאוריה שלו נדחתה בתחילה, אך בסופו של דבר התקבלה על ידי הקהילה המדעית."],["Although the two languages share many words, their grammatical structures are ___ different.","fundamentally","hardly","barely","scarcely","אף ששתי השפות חולקות מילים רבות, המבנים הדקדוקיים שלהן שונים באופן יסודי."],["The report ___ the importance of early education, devoting three entire chapters to the subject.","emphasizes","overlooks","denies","underestimates","הדוח מדגיש את חשיבות החינוך בגיל הרך ומקדיש לנושא שלושה פרקים שלמים."]],"RS":[["Contrary to popular belief, most of the body's heat is not lost through the head.","Although many people think otherwise, the head is not where the body loses most of its heat.","As most people believe, the body loses most of its heat through the head.","Most people do not know that the head loses no heat at all.","Popular beliefs about body heat have recently been confirmed.","בניגוד לאמונה הרווחת, רוב חום הגוף אינו אובד דרך הראש."],["Had the bridge been inspected regularly, the disaster might have been prevented.","The disaster may have happened because the bridge was not inspected regularly.","Although the bridge was inspected regularly, the disaster could not be prevented.","The disaster led to regular inspections of the bridge.","Regular inspections of the bridge caused the disaster.","אילו הגשר היה נבדק באופן סדיר, ייתכן שהאסון היה נמנע."],["The rise in obesity cannot be attributed solely to changes in diet.","Changes in diet are not the only cause of the rise in obesity.","Changes in diet have nothing to do with the rise in obesity.","The rise in obesity has led to changes in diet.","Diet is the single cause of the rise in obesity.","אי אפשר לייחס את העלייה בהשמנה רק לשינויים בתזונה."],["Only after the treaty was signed did trade between the two countries begin to grow.","Trade between the two countries started to grow once the treaty had been signed.","Trade grew before the treaty but stopped after it was signed.","The treaty was signed because trade between the countries was growing.","Trade between the countries grew whether or not a treaty was signed.","רק לאחר שנחתם ההסכם החל הסחר בין שתי המדינות לגדול."],["Far from improving the situation, the new regulations made it considerably worse.","The new regulations did not improve the situation; in fact, they made it much worse.","The new regulations improved the situation a great deal.","The situation became worse, so new regulations were introduced.","The new regulations had very little effect on the situation.","התקנות החדשות לא רק שלא שיפרו את המצב, אלא החמירו אותו במידה ניכרת."],["While the drug relieves the symptoms of the disease, it does nothing to cure it.","The drug reduces the symptoms, but it does not cure the disease.","The drug cures the disease but does not relieve its symptoms.","Because the drug relieves the symptoms, it also cures the disease.","The drug neither cures the disease nor relieves its symptoms.","אף שהתרופה מקלה על תסמיני המחלה, היא אינה מרפאת אותה כלל."],["Few of the participants were aware that the experiment was being recorded.","Most participants did not know that the experiment was being recorded.","Almost all the participants knew that the experiment was being recorded.","Few participants agreed to have the experiment recorded.","Only a few people took part in the recorded experiment.","מעטים מהמשתתפים היו מודעים לכך שהניסוי מוקלט."],["The author's later novels, unlike his early ones, received little attention from critics.","Critics paid much more attention to the author's early novels than to his later ones.","Critics ignored both the author's early and later novels.","Critics preferred the author's later novels to his early ones.","The author wrote few novels later in life because of the critics.","הרומנים המאוחרים של הסופר, בניגוד לרומנים המוקדמים שלו, זכו לתשומת לב מועטה מצד המבקרים."],["Rising house prices have made it increasingly difficult for young people to buy a home.","Because house prices are going up, young people are finding it harder and harder to buy homes.","Young people buying homes have caused house prices to rise.","Young people find it easier to buy homes despite rising prices.","House prices are rising only in areas where young people live.","עליית מחירי הדיור הקשתה יותר ויותר על צעירים לקנות בית."],["The theory, although widely accepted today, was initially rejected by most scientists.","Most scientists originally rejected the theory, which is now broadly accepted.","Most scientists accepted the theory at first but reject it today.","The theory has always been rejected by most scientists.","The theory was accepted because most scientists had rejected earlier theories.","התיאוריה, אף שהיא מקובלת כיום באופן נרחב, נדחתה בתחילה על ידי רוב המדענים."],["There is little evidence to support the claim that the diet promotes weight loss.","The claim that the diet helps people lose weight is not well supported by evidence.","There is strong evidence that the diet helps people lose weight.","The diet causes people to gain a little weight.","Little research has been done on weight loss in general.","יש מעט ראיות התומכות בטענה שהדיאטה מסייעת לירידה במשקל."],["The museum will remain closed until the renovation work has been completed.","The museum will not reopen before the renovation work is finished.","The museum will close as soon as the renovation work is completed.","The renovation work will begin once the museum has closed.","The museum will stay open while the renovation work continues.","המוזיאון יישאר סגור עד להשלמת עבודות השיפוץ."],["The more data the system receives, the more accurate its predictions become.","The system's predictions grow more accurate as it receives more data.","The system's predictions become less accurate when it receives more data.","The system needs accurate predictions in order to receive data.","The amount of data has no effect on the system's predictions.","ככל שהמערכת מקבלת יותר נתונים, כך התחזיות שלה נעשות מדויקות יותר."],["It was not the lack of funding but poor management that led to the project's failure.","The project failed mainly because of poor management rather than insufficient funding.","The project failed because it did not have enough funding.","Poor management was caused by a lack of funding.","The project succeeded despite poor management and a lack of funding.","לא המחסור במימון אלא הניהול הכושל הוא שהוביל לכישלון הפרויקט."],["Scarcely had the new law come into effect when it was challenged in court.","The new law was challenged in court almost immediately after it came into effect.","The new law came into effect only after a long court challenge.","The new law was rarely challenged in court.","Many years passed before anyone challenged the new law in court.","החוק החדש כמעט לא הספיק להיכנס לתוקף כשכבר עתרו נגדו לבית המשפט."],["Children who read for pleasure tend to have larger vocabularies than those who do not.","Children who enjoy reading usually know more words than children who do not read for fun.","Children with large vocabularies always read for pleasure.","Reading for pleasure has no connection to the size of children's vocabulary.","Children who do not read for pleasure usually know more words.","ילדים הקוראים להנאתם נוטים להחזיק באוצר מילים עשיר יותר מאלה שאינם קוראים."],["The decline of the fishing industry was a consequence, not a cause, of the town's economic problems.","The town's economic problems led to the decline of the fishing industry, not the other way around.","The decline of the fishing industry caused the town's economic problems.","The town's economy and its fishing industry grew at the same time.","The fishing industry had no connection to the town's economic problems.","שקיעת ענף הדיג הייתה תוצאה, ולא סיבה, של הבעיות הכלכליות של העיירה."],["Although the vaccine is not entirely effective, it significantly reduces the risk of serious illness.","The vaccine does not offer complete protection, but it greatly lowers the chance of becoming seriously ill.","The vaccine offers complete protection against all illness.","Because the vaccine is not fully effective, it does not reduce the risk of illness.","The vaccine slightly increases the risk of serious illness.","אף שהחיסון אינו יעיל לחלוטין, הוא מפחית באופן משמעותי את הסיכון למחלה קשה."],["Most experts agree that the problem is unlikely to be solved in the near future.","According to most experts, the problem will probably not be solved soon.","Most experts believe that the problem will be solved very soon.","Experts disagree about whether the problem exists at all.","Most experts think that the problem can never be solved.","רוב המומחים מסכימים שלא סביר שהבעיה תיפתר בעתיד הקרוב."],["The company's profits rose despite a sharp fall in sales.","Even though sales dropped sharply, the company made higher profits.","The company's profits rose because its sales increased sharply.","Both the company's profits and its sales fell sharply.","Sales fell sharply as a result of rising profits.","רווחי החברה עלו למרות ירידה חדה במכירות."],["Not all bacteria are harmful; in fact, many are essential to human health.","While some bacteria cause harm, many others are necessary for people to stay healthy.","All bacteria are harmful to human health.","Most bacteria are harmful, and only a few are useful.","Bacteria are essential to health only when they are harmful.","לא כל החיידקים מזיקים; למעשה, רבים מהם חיוניים לבריאות האדם."],["The survey, which was conducted online, may not represent the views of older citizens.","Since the survey was carried out on the internet, it might not reflect what older people think.","Older citizens refused to take part in the online survey.","The online survey accurately represents the views of all citizens.","The survey was conducted online because older citizens requested it.","הסקר, שנערך ברשת, עשוי שלא לייצג את עמדותיהם של אזרחים מבוגרים."],["Were it not for the invention of the printing press, literacy would have spread far more slowly.","The printing press helped literacy spread much faster than it otherwise would have.","Literacy spread slowly despite the invention of the printing press.","The spread of literacy led to the invention of the printing press.","The printing press had little effect on the spread of literacy.","אלמלא המצאת הדפוס, האוריינות הייתה מתפשטת לאט הרבה יותר."],["The findings, while interesting, should be treated with caution until they are confirmed by further research.","Although the findings are interesting, people should be careful about relying on them until other studies confirm them.","The findings have already been confirmed and can be fully trusted.","The findings are uninteresting and should be ignored.","Further research has shown that the findings were wrong.","את הממצאים, אף שהם מעניינים, יש לקבל בזהירות עד שיאוששו במחקר נוסף."],["Urbanization has brought many benefits, but not without significant environmental costs.","The growth of cities has had many advantages, yet it has also harmed the environment considerably.","Urbanization has brought benefits without any harm to the environment.","The environmental costs of urbanization have outweighed all of its benefits.","Environmental damage has caused people to move to cities.","העיור הביא יתרונות רבים, אך לא בלי מחיר סביבתי משמעותי."],["The new teaching method proved no more effective than the traditional one.","The new teaching method did not turn out to be any better than the traditional one.","The new teaching method was much more effective than the traditional one.","The traditional method proved completely ineffective.","The traditional method was abandoned because the new one worked better.","שיטת ההוראה החדשה התבררה כיעילה לא יותר מהשיטה המסורתית."],["Hardly anyone in the village had heard of the disease before the outbreak.","Before the outbreak, almost no one in the village knew about the disease.","Most people in the village knew about the disease before the outbreak.","The outbreak happened because no one in the village had heard of the disease.","After the outbreak, hardly anyone in the village had heard of the disease.","כמעט איש בכפר לא שמע על המחלה לפני ההתפרצות."],["The researchers attributed the improvement in patients' health to changes in their sleep patterns.","According to the researchers, the patients became healthier because of changes in how they slept.","The researchers believe that patients slept differently because their health improved.","The patients' sleep patterns did not change during the study.","The researchers found no connection between sleep and health.","החוקרים ייחסו את השיפור בבריאות המטופלים לשינויים בדפוסי השינה שלהם."],["So complex is the human brain that scientists are only beginning to understand how it stores memories.","The human brain is so complicated that scientists have only recently started to understand how it keeps memories.","Scientists fully understand how the human brain stores memories.","Scientists began studying the brain because memory is simple.","The human brain stores memories in a very simple way.","המוח האנושי מורכב כל כך שמדענים רק מתחילים להבין כיצד הוא אוגר זיכרונות."],["Economic growth does not necessarily lead to an improvement in the quality of life.","Economic growth does not always result in a better quality of life.","Economic growth always makes people's lives worse.","A better quality of life is the main cause of economic growth.","Economic growth always improves the quality of life.","צמיחה כלכלית אינה מובילה בהכרח לשיפור באיכות החיים."]]},"h10":{"R":[["Last year, the students at Hadar High School had an idea. Behind the school there was an empty piece of land full of rubbish and old chairs. Nobody used it. A group of ninth graders asked the principal if they could turn it into a garden. She agreed, but only if the students did all the work themselves.\n\nFor three months, the students cleaned the area every Friday. Parents brought tools, and a local shop gave them seeds for free. They planted tomatoes, cucumbers, mint and sunflowers. At first, many plants died because the students forgot to water them during the holidays. So they made a schedule, and each class became responsible for one week.\n\nToday the garden is the most popular place in the school. Science teachers give lessons there, and the vegetables are used in the school kitchen. \"We learned that patience is important,\" said Noa, one of the students. \"Nothing grows in one day.\"","בשנה שעברה היה לתלמידי תיכון הדר רעיון. מאחורי בית הספר הייתה חלקת אדמה ריקה, מלאה בזבל ובכיסאות ישנים. אף אחד לא השתמש בה. קבוצה של תלמידי כיתה ט' שאלה את המנהלת אם הם יכולים להפוך אותה לגינה. היא הסכימה, אבל רק בתנאי שהתלמידים יעשו את כל העבודה בעצמם.\n\nבמשך שלושה חודשים ניקו התלמידים את השטח בכל יום שישי. ההורים הביאו כלי עבודה, וחנות מקומית נתנה להם זרעים בחינם. הם שתלו עגבניות, מלפפונים, נענע וחמניות. בהתחלה צמחים רבים מתו, כי התלמידים שכחו להשקות אותם בחופשות. אז הם הכינו לוח תורנויות, וכל כיתה הייתה אחראית על שבוע אחד.\n\nהיום הגינה היא המקום הפופולרי ביותר בבית הספר. מורים למדעים מעבירים בה שיעורים, והירקות משמשים במטבח של בית הספר. \"למדנו שסבלנות היא דבר חשוב,\" אמרה נועה, אחת התלמידות. \"שום דבר לא צומח ביום אחד.\"",[["What was behind the school before the garden?","An empty area full of rubbish","A small parking lot","An old spo
