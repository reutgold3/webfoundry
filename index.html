<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B2140"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>

<style>
/* Yalla Theory: dark-indigo dashboard ground with bright cards; traffic colors (green/amber/red) carry meaning (right / timer / wrong). */
:root{
  --bg:#EEF0FF;--paper:#fff;--ink:#16203A;--soft:#5B6584;--line:#D5DAF5;
  --accent:#5B4BFF;--accent-deep:#3E30D6;--good:#22B573;--bad:#E8455A;--amber:#FFB020;
  --display:"Fredoka","Rubik",system-ui,sans-serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:16px 36px;display:flex;flex-direction:column;gap:14px;min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}h1{font-size:30px}h2{font-size:23px;font-weight:600}h3{font-size:19px;font-weight:600}p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:19px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.wide{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500;padding:8px}
.top{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.x{width:46px;height:46px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.chip{background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:600;box-shadow:0 3px 0 var(--line);font-size:15px;white-space:nowrap}
.card{background:var(--paper);border-radius:22px;padding:16px 18px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:10px}
.hero{background:linear-gradient(135deg,#1B2140,#3B32A8);color:#fff;box-shadow:0 5px 0 #11162E}
.hero .label{color:#C9CCF5}.hero .btn{background:#fff;color:var(--ink);box-shadow:0 5px 0 #8E89E8}
.label{font-size:14px;color:var(--soft);font-weight:500}.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:42px;height:42px;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:6px;text-align:start;min-height:110px}
.tile .e{font-size:30px}.tile b{font-family:var(--display);font-size:18px}
.meter{height:10px;border-radius:999px;background:#E6E9FA;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#4CC9F0);border-radius:999px}
.hero .meter{background:rgba(255,255,255,.2)}
.gauge{display:flex;align-items:center;gap:14px}.gauge svg{width:110px;height:70px;flex:none}
.big{font-family:var(--display);font-size:34px;font-weight:700}
.lic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lic button,.lang button{background:var(--paper);border-radius:16px;padding:12px 6px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.lic button span{font-size:30px}.lic button small{font-weight:400;color:var(--soft);font-size:13px}
.lic button[aria-pressed=true],.lang button[aria-pressed=true]{border-color:var(--accent);background:#F1EFFF}
.lang{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:6px}.field input{border-radius:14px;border:2px solid var(--line);padding:12px;font:inherit;font-size:18px}
.bar{height:10px;border-radius:999px;background:#E6E9FA;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard .qtext{font-size:20px;font-weight:500;line-height:1.45}
.qimg{max-width:100%;max-height:260px;object-fit:contain;border-radius:14px;align-self:center;background:#fff;cursor:zoom-in}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:start;background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--line);border:3px solid transparent;font-size:17px;line-height:1.4}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:#EEF0FF;display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--accent)}.opt.good{border-color:var(--good);background:#E8F8F0}.opt.bad{border-color:var(--bad);background:#FDECEE}
.opt[disabled]{cursor:default}
.fb{font-weight:600;min-height:24px}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
.timer{font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.qnav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.qnav button{aspect-ratio:1;border-radius:8px;background:#E6E9FA;font-size:12px;font-weight:600}
.qnav button.ans{background:#C9C3FF}.qnav button.cur{outline:2px solid var(--accent)}.qnav button.flag{background:var(--amber)}
.qnav button.ok{background:#BFEBD6}.qnav button.no{background:#F7C4CB}
.result{font-size:56px;text-align:center}
.attr{font-size:12px;color:var(--soft);text-align:center;line-height:1.5}
.zoom{position:fixed;inset:0;background:rgba(10,12,30,.92);display:grid;place-items:center;z-index:20;padding:12px}.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
.fam-code .code{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center}
.fam-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.fam-row .m{font-size:24px}.fam-row .e{font-size:26px}
.fam-app{font-size:15px;line-height:1.5;padding:4px 0}.chk{display:flex;gap:8px;align-items:center;margin:8px 0}
.backhome-bar{display:flex;align-items:center;gap:10px}.x.backhome{font-size:22px;font-weight:700}
html[dir=ltr] .opt,html[dir=ltr] .tile{text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function startExam(custom,opt){
  opt=opt||{};
  if(custom&&custom.length){E={qs:(opt.keep?custom:shuffle(custom)).map(q=>({q,ord:optOrder(q),a:null,flag:false})),i:0,start:Date.now(),end:Date.now()+(opt.min||40)*60000,opt};clearInterval(TIMER);TIMER=setInterval(tick,1000);eq();return}

  E={qs:shuffle(qs).slice(0,30).map(q=>({q,ord:optOrder(q),a:null,flag:false})),i:0,start:Date.now(),end:Date.now()+40*60000,opt:Object.assign({real:true},opt)};
  clearInterval(TIMER);TIMER=setInterval(tick,1000);eq();
}
function tick(){if(!E)return clearInterval(TIMER);const left=Math.max(0,E.end-Date.now());const el=$("#tm");if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`⏱ ${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<5*60000)}if(!left){alertTimeUp()}}
function alertTimeUp(){clearInterval(TIMER);const f=$("#fb");if(f)f.textContent=t("timeUp");setTimeout(examDone,600)}
function eq(){

   <div class="qnav">${E.qs.map((x,k)=>`<button data-k="${k}" class="${x.a!=null?"ans":""} ${x.flag?"flag":""} ${k===E.i?"cur":""}" aria-label="${t("q")} ${k+1}">${k+1}</button>`).join("")}</div>
   <div class="card qcard"><div class="label">${t("q")} ${E.i+1} ${t("of")} ${E.qs.length}</div>${qHTML(q)}<button class="link" id="rd" style="align-self:flex-start">${t("read")}</button></div>

   <button class="btn wide" id="sb">${t("submit")}</button>`;

function confirmSubmit(){const f=$("#fb");if(f.dataset.c){return true}f.dataset.c=1;f.className="fb bad";f.textContent=t("confirmSubmit")+" ↓";return false}
function examDone(){
  if(!E)return;clearInterval(TIMER);const ex=E;E=null;
  let s=0;ex.qs.forEach(x=>{const ok=x.a===x.q[6];if(ok)s++;if(x.a!=null)record(x.q,ok);else record(x.q,false)});

    $("#ag").onclick=()=>ex.opt.chapter!=null?chTest(ex.opt.chapter):ex.opt.real||ex.opt.final?startExam(null,ex.opt):startExam(ex.qs.map(x=>x.q),Object.assign({},ex.opt,{keep:ex.opt.fixed!=null}));$("#hm").onclick=ex.opt.chapter!=null?pathScreen:home;if($("#nxc"))$("#nxc").onclick=()=>ex.opt.chapter+1<chapters().length?chLearn(ex.opt.chapter+1):pathScreen();$("#ow").onchange=e=>show(e.target.checked);
    app.querySelectorAll(".qimg").forEach(im=>im.onclick=()=>{const z=document.createElement("div");z.className="zoom";z.innerHTML=`<img src="${im.src}" alt="">`;z.onclick=()=>z.remove();document.body.appendChild(z)});
  };show(false);scrollTo(0,0);
}

function famDay(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function famWeek(){
  S.starHist=S.starHist||{};const t=famDay();if(S.starHist[t]==null)S.starHist[t]=S.stars;
  const old=new Date();old.setDate(old.getDate()-7);const cut=famDay(old);
  for(const k of Object.keys(S.starHist))if(k<famDay(new Date(Date.now()-15*864e5)))delete S.starHist[k];
  const keys=Object.keys(S.starHist).filter(k=>k>=cut).sort();const base=keys.length?S.starHist[keys[0]]:S.stars;
  return Math.max(0,S.stars-base);
}

  const th=s=>s?`<div class="fam-app">🚦 <b>תאוריה:</b> רישיון ${esc(s.license||"")} · ${s.mastered||0}/${s.total||0} שאלות נכונות${s.exam!=null&&s.exam!==""?` · מבחן אחרון ${s.exam}/30`:""}${s.todayN?` · היום ${s.todayN} שאלות`:""}</div>`:"";
